[translation]
"80000129-1" = "I hate cheap chocolate"
"80000129-7-アオバ" = "……。"
"80000129-8-アオバ" = "先生～……いません、よね……？"
"80000129-9-アオバ" = "それならそれで、良かった、かも……。"
"80000129-14-アオバ" = "うぅ……こんなので、本当に大丈夫かな……。"
