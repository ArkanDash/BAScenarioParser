"80000129-20" = "[ns] \"こんにちは、アオバ。\""
"80000129-22-アオバ" = "うわあっ！？#nせ、先生！？"
"80000129-23-アオバ" = "い、いつからそこに……！？"
"80000129-24-アオバ" = "え、最初から……？"
"80000129-25-アオバ" = "あ、ソファで横に……。#n全然気づきませんでした……。"
"80000129-26-アオバ" = "う、うぅ。#nそ、それではこれで……。"
"80000129-27" = "[s1] \"もう行っちゃうの？\"\n[s2] \"もしかして、これって……。\""
