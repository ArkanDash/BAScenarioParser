"80000129-41-アオバ" = "ただ、そんなもので良いのか不安になってしまい……。"
"80000129-42-アオバ" = "ほんとなら、自分で作ったり……#nもう少し手が込んだものを、差し上げたかったんですけど……。"
"80000129-43-アオバ" = "毎日残業で……帰る頃には、お店が閉まってまして……。"
"80000129-44-アオバ" = "すみません、結局こんな、安いお菓子に……。"
"80000129-45" = "[ns] \"嬉しいよ、アオバ。\""
"80000129-48-アオバ" = "へっ！？"
"80000129-49-アオバ" = "こ、こんな、どこでも買えるようなやつですけど……！？"
"80000129-50" = "[s3] \"それでも、アオバが用意してくれたものだから。\"\n[s4] \"その気持ちが嬉しいよ。\""
"80000129-53-アオバ" = "……。"
"80000129-54-アオバ" = "そ、そうですか……。"
"80000129-55-アオバ" = "……。"
"80000129-56-アオバ" = "……あ、ありがとうございます。"
"80000129-57" = "[ns] \"ん……これ、手紙？\""
"80000129-58-アオバ" = "ひゃぁぁっ！！！"
"80000129-59-アオバ" = "そ、それは！#nダメです！今は！絶対！！"
"80000129-60-アオバ" = "後にしてください！！！"
"80000129-61" = "[s] \"ご、ごめん……。\""
"80000129-62-アオバ" = "はぁ、はぁ……。"
"80000129-69-アオバ" = "で、では私は、これで……。"
"80000129-70-アオバ" = "ま、また……！"
"80000129-75" = "[ns] \"アオバ。\""
"80000129-79-アオバ" = "ど、どうかしましたか！？"
"80000129-80" = "[s] \"せっかくだし、ちょっと休んでいかない？\""
"80000129-81-アオバ" = "えっ……えっ！？"
"80000129-82-アオバ" = "……あ、いえ。#n別に、忙しいわけじゃない、ですけど……。"
"80000129-83-アオバ" = "ほ、本当に良いんですか……？"
"80000129-84-アオバ" = "「休める時に休むのも、仕事のうち」……？"
"80000129-85" = "[s5] \"何だか疲れてるように見えたから。\"\n[s6] \"見てこのソファ、フカフカだよ！\""
"80000129-88-アオバ" = "う、うぅ……。"
"80000129-89-アオバ" = "確かに、ここ最近激務でしたが……。"
"80000129-90-アオバ" = "うーん…………。"
"80000129-97-アオバ" = "……ちょっとだけ、し、失礼します。"
"80000129-99" = "（そうしてアオバは、遅くまでゆっくりしていった）"
"80000129-100-アオバ" = "い、いつも気にかけてくださって、ありがとうございます。"
"80000129-101-アオバ" = "おかげさまで……。"
"80000129-102-アオバ" = "明日も、明後日も頑張れるかもしれません。"
"80000129-106-アオバ" = "……その先も、きっと、ずっと。"
