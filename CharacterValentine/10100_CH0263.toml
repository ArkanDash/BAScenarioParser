[translation]
"80000119-1" = "燃える対抗心"
"80000119-2" = "（深夜まで業務をしていたところ……）"
"80000119-9" = "[ns] \"……？\""
"80000119-12" = "[ns1] \"……誰だろう？\"\n[ns2] 周囲を片付ける。"
"80000119-15-？？？" = "驚かないんだね。"
"80000119-16-？？？" = "もしかして……慣れてる？"
"80000119-19" = "[ns3] \"……シロコ？\"\n[ns4] \"どうしたの？\""
"80000119-22-シロコ" = "ん……サプライズ失敗。"
"80000119-23-シロコ" = "うん？"
"80000119-24-シロコ" = "こんな時間に来た理由？"
"80000119-25-シロコ" = "……ふふっ。"
"80000119-26-シロコ" = "来たことより、理由を気にするんだ。"
"80000119-27-シロコ" = "ああ、でも……先生はそうだった。"
"80000119-28-シロコ" = "こういうところ、本当に鈍感だよね。"
"80000119-33" = "[ns5] \"あ、これって……\"\n[ns6] \"……「今回」は増えてるね。\""
"80000119-36-シロコ" = "ん……覚えててくれてると思った。"
"80000119-37-シロコ" = "「今度」は多めに用意したよ。"
"80000119-38-シロコ" = "大丈夫。今は色々できるようになったんだ。"
"80000119-39-シロコ" = "……？"
"80000119-40-シロコ" = "同じものを……こっちのシロコからも……？"
"80000119-41-シロコ" = "へぇ、そうなんだ……？"
"80000119-45" = "[ns7] \"もしかして……。\"\n[ns8] \"対抗してる……？\""
"80000119-48-シロコ" = "……対抗？#nまさか。"
"80000119-49-シロコ" = "こっちのシロコのやりそうなことくらい全部分かるだけ。"
"80000119-50-シロコ" = "それに、そもそも立場が違うから対抗しようがない。"
"80000119-51-シロコ" = "――チョコでも、私の方が強い。"
"80000119-52" = "[s9] \"……絶対意識してる！\"\n[s10] \"変な争いしないで！\""
"80000119-55-シロコ" = "……ふふっ。"
"80000119-56-シロコ" = "いつもの先生でいてくれて……ありがとう。"
"80000119-57-シロコ" = "……用は済んだから、帰るね。"
"80000119-58" = "[s11] \"来たばっかじゃない？\"\n[s12] \"もうちょっとゆっくりしても……。\""
"80000119-61-シロコ" = "ん、何かあったら連絡して。"
"80000119-62-シロコ" = "いつでも歓迎する。"
"80000119-63-シロコ" = "でも――"
"80000119-64-シロコ" = "今日は……私から会いに行った方が、安心するかなって。"
"80000119-65-シロコ" = "……ん。"
"80000119-66-シロコ" = "先生は、そういう人。"
"80000119-67-シロコ" = "私は元気にしてるから、心配しないで。"
"80000119-68-シロコ" = "……良い生徒でしょ？"
"80000119-69" = "[s13] \"そこまで考えてくれてたんだ。\"\n[s14] \"シロコは良い子だね。\""
"80000119-72-シロコ" = "……ふふっ。"
"80000119-73-シロコ" = "毎日は難しいけど……。"
"80000119-74-シロコ" = "また、シャーレに来る。"
"80000119-75-シロコ" = "先生……またね。"
"80000119-77" = "（シロコは明るい笑顔を浮かべ、挨拶する間も与えずに立ち去っていった）"
"80000119-78" = "（……彼女からもらった大量のチョコは、オフィスの復旧作業のお供にした）"
