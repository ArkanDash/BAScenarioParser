[translation]
"80000112-1" = "作戦参謀は負けたくない"
"80000112-3" = "（いつものようにシャーレで仕事をしていると……）"
"80000112-8" = "[ns] \"もしもし。\""
"80000112-12-キキョウ" = "こんにちは、先生。"
"80000112-13-キキョウ" = "今日は百花繚乱として正式な依頼があって連絡したんだけど……"
"80000112-14-キキョウ" = "予定は空いてる？#nまあ、あまり期待はしてないけど。"
"80000112-15" = "[s] \"時間なら大丈夫だよ。\""
"80000112-17" = "[ns] \"それにキキョウより大切な用事なんて無いから！\""
"80000112-18-キキョウ" = "……はぁ。シャーレの業務量くらい、把握してるよ。"
"80000112-19-キキョウ" = "どれだけ忙しくても、生徒の頼みを聞く姿勢は高く買ってるけど……"
"80000112-20-キキョウ" = "私は、あんたに迷惑をかけたり無理をさせたくはない。"
"80000112-21-キキョウ" = "だから、私に気を遣ってるんだとしたら怒るから。#nもう一度、よく考えて答えて。"
"80000112-22" = "[ns1] \"キキョウにそう言ってもらえて嬉しいよ。\"\n[ns2] \"でも、今日は本当に空いてるから心配しないで。\""
"80000112-25-キキョウ" = "……ふん。"
"80000112-26-キキョウ" = "とにかく、問題は無いのね？"
"80000112-27-キキョウ" = "じゃ、待ってるから。"
"80000112-31-キキョウ" = "…………これで先生を呼ぶのには成功した。"
"80000112-35" = "[ns] （………切り忘れてるのかな？）"
"80000112-36-キキョウ" = "先生が来る前に、早く準備をしないと……"
"80000112-40-キキョウ" = "今日は絶対に完璧な作戦を………"
"80000112-44" = "[ns] \"何の話だろう……？\""
"80000112-46" = "（そうして、キキョウに指定された場所へ向かった）"
"80000112-51" = "[ns] \"依頼の内容を聞かせてもらってもいい？\""
"80000112-52-キキョウ" = "ああ、単純な話だよ。"
"80000112-53-キキョウ" = "先生も知っての通り、今日はバレンタインデーでしょう？"
"80000112-54" = "[s] \"そうだね。\""
"80000112-55-キキョウ" = "こういう特別な日は、百鬼夜行で色々なイベントが開かれるの。"
"80000112-56-キキョウ" = "だから今日は、そのイベントを手伝ってもらいたくて。#nこれも百花繚乱として大切な役目だから。"
"80000112-57" = "[s] \"そうだったんだ……頑張るね。\""
"80000112-58-キキョウ" = "やる気になってくれたみたいで良かった。"
"80000112-59-キキョウ" = "じゃ、さっそく向かうよ。"
"80000112-63" = "（こうしてキキョウと一緒に商店街の行事を手伝い始めた）"
"80000112-77" = "（チョコレート作りの体験イベントから……）"
"80000112-85" = "（キヴォトス全自治区チョコレートコンテストを補助したり）"
"80000112-91" = "（バレンタインデーをテーマにした路上俳句バトルの審判を任されたり……）"
"80000112-92" = "（その後も様々なイベントの手伝いで引っ張りだこだった）"
"80000112-94-商店街の住民" = "今日は本当にありがとうございました！"
"80000112-95-商店街の住民" = "キキョウさんと先生が手伝ってくださったおかげで、今回のイベントも大成功です！"
"80000112-96-商店街の住民" = "特に子供たちが、いつも以上に楽しそうな笑顔を見せてくれて！#nよろしければ、またお願いしてもいいでしょうか？"
"80000112-97" = "[s] \"もちろん、喜んでお手伝いします。\""
"80000112-98-キキョウ" = "……良かったね、人気みたいで。"
"80000112-99-キキョウ" = "子供の面倒を見るの、性に合ってるんじゃない？"
"80000112-100-商店街の住民" = "はは！キキョウさんもですよ！"
"80000112-101-商店街の住民" = "それに、お二人がペアで参加していたクイズ大会で連続正解されたときは、「お姉さんカッコいい！」と子供たちみんな大喜びでしたし！"
"80000112-102-キキョウ" = "そ、それは……たまたま、知ってる問題が多かっただけで。"
"80000112-103" = "[s] \"キキョウ……もしかして照れてるの？\""
"80000112-107-キキョウ" = "……ふん。"
"80000112-112" = "[ns] \"ふぅ、気づいたらこんな時間だね。\""
"80000112-116-キキョウ" = "……そうね、もう日が暮れる時間だもの。"
"80000112-117-キキョウ" = "今日は一日、付き合ってくれてありがとう……先生。"
"80000112-118-キキョウ" = "おかげで、百花繚乱としての役目を果たせた。"
"80000112-119-キキョウ" = "………。"
"80000112-120-キキョウ" = "それで……"
"80000112-121-キキョウ" = "……今日一日、私と一緒に過ごした感想を聞きたいんだけど。"
"80000112-122" = "[s] \"私も、楽しかったよ。\""
"80000112-123-キキョウ" = "……そう。"
"80000112-124-キキョウ" = "………。"
"80000112-125-キキョウ" = "……感想は、それだけ？"
"80000112-126-キキョウ" = "もう少し……他に何か無いの？"
"80000112-127" = "[s] \"え？いや、特には……\""
"80000112-128-キキョウ" = "よく考えてみて、先生。私たちは今日、二人で色々なイベントに参加した。"
"80000112-129-キキョウ" = "そのどれもが……バレンタインに関するもの。"
"80000112-130-キキョウ" = "だから、なんというか自然と……"
"80000112-131-キキョウ" = "何かが頭の中に浮かんだりしたんじゃない？"
"80000112-132-キキョウ" = "遠慮する必要は無い。#nあんたが思ったままの気持ちを言葉にして。"
"80000112-133" = "[s] \"……あ、それなら一つあるよ。\""
"80000112-134-キキョウ" = "やっぱり……そうだと思った。"
"80000112-135-キキョウ" = "さあ、早く言って。"
"80000112-140-キキョウ" = "あんたが何を思って、何を求めてるのか。"
"80000112-144" = "[ns] \"キキョウの役に立てて嬉しかったよ。\""
"80000112-148" = "[ns] \"だから、またいつでも頼ってね。\""
"80000112-149-キキョウ" = "……それが、シャーレの役目だから？"
"80000112-150-キキョウ" = "そう……それで？"
"80000112-154-キキョウ" = "……続きを待ってるんだけど？"
"80000112-155" = "[s] \"えっと……今のが私の気持ちだよ？\""
"80000112-156-キキョウ" = "……そう。"
"80000112-161-キキョウ" = "そうなんだ……ふふ。"
"80000112-162-キキョウ" = "本当に、あんたは私に何も求めてないと……"
"80000112-163-キキョウ" = "そんなの……"
"80000112-164-キキョウ" = "――――信じらんない。"
"80000112-168" = "[ns] \"キキョウ……？\""
"80000112-169-キキョウ" = "私はあれほど念入りに作戦を立てたのに、どうしてあんたは……どうして……"
"80000112-170-キキョウ" = "本当、たったの一度も――"
"80000112-171-キキョウ" = "チョコレートを欲しがるそぶりすら見せないなんて……"
"80000112-172-キキョウ" = "本当に、信じらんない……！"
"80000112-173" = "[s] \"……………………はい？\""
"80000112-175" = "（意図が掴めず、キキョウの真意を聞いてみると……）"
"80000112-177" = "[ns] \"要するに、私たちが手伝ったイベントは全て……\""
"80000112-178-キキョウ" = "……はあ。ここまで話して、もう隠す意味は無いか。"
"80000112-179-キキョウ" = "そうだよ。全部あんたから、ある言葉を引き出すために計画したこと。"
"80000112-180-キキョウ" = "――「チョコレートが欲しい」という一言のために。"
"80000112-181-キキョウ" = "……なのに、あんたは私の気を知らずに……"
"80000112-182" = "[s] \"どうしてこんな遠回りを……？\""
"80000112-183-キキョウ" = "それは……"
"80000112-184-キキョウ" = "あんたから欲しいって言われる前に……"
"80000112-185-キキョウ" = "私からチョコレートを渡したら……"
"80000112-186" = "[s] \"渡したら……？\""
"80000112-187-キキョウ" = "そ、それじゃまるで……"
"80000112-188-キキョウ" = "私が負けたみたいじゃない！"
"80000112-189" = "[s] \"………………。\""
"80000112-190-キキョウ" = "あんたに欲しいって言われたところで、駆け引きをして余裕な表情で渡そうと思ってたのに。"
"80000112-191-キキョウ" = "最後までチョコのチの字すら出てこないなんて……！"
"80000112-192-キキョウ" = "んんん！本当に信じられない！#n分かってる？あんたがどんな過ちを犯したのか！"
"80000112-193" = "[s] \"すごく理不尽じゃありません……？\""
"80000112-194-キキョウ" = "まさか、あんたがここまでの朴念仁だったなんて……"
"80000112-195-キキョウ" = "……はぁ、私はどこで計算を間違えたのか。"
"80000112-196" = "[s] \"あのね、あえて私がチョコを欲しいって言わなかったのは……\""
"80000112-197-キキョウ" = "……ん？何か理由があったとでも？"
"80000112-198-キキョウ" = "電話が繋がったままになってて、たぶんチョコを用意してくれてるのが分かったから……？"
"80000112-199-キキョウ" = "それで、渡されるのを待ってたって……？"
"80000112-200-キキョウ" = "つまり、私の作戦は意味が無かったと……"
"80000112-201-キキョウ" = "…………。"
"80000112-202-キキョウ" = "……っ！"
"80000112-203" = "[s] \"キキョウの気持ちを分かってあげられなくて、ごめん。\""
"80000112-204-キキョウ" = "いや、そもそも私が電話を切っていれば……！"
"80000112-205-キキョウ" = "……あ、待って。#nということは、私からチョコレートがもらえると分かったうえで会いに来たわけで……"
"80000112-206-キキョウ" = "それって要は、楽しみにしてたんじゃ……"
"80000112-207-キキョウ" = "……こほん！"
"80000112-208-キキョウ" = "…………はい。#nあんたの言う通り、これが準備してたチョコレート。"
"80000112-214-キキョウ" = "あんたのためだけに、百花繚乱の作戦参謀が作った特製チョコレートだからね。"
"80000112-215-キキョウ" = "さあ、受け取って。"
"80000112-225" = "[ns] \"うん。キキョウ、ありが……\""
"80000112-226-キキョウ" = "お礼は！"
"80000112-227-キキョウ" = "…………お礼は……ちゃんと、味わってから……"
"80000112-228-キキョウ" = "……味わってから、聞かせて。"
"80000112-234-キキョウ" = "その……今は、こうしてるのも恥ずか……っ。"
"80000112-235-キキョウ" = "感想は、A4用紙10ページ分で送ること！"
"80000112-236" = "[s] \"は、はい……分かりました。\""
"80000112-237-キキョウ" = "……ふん！"
"80000112-239" = "（こうして、紆余曲折を経てキキョウから受け取ったチョコレートは……）"
"80000112-240" = "（……とても、甘かった）"
