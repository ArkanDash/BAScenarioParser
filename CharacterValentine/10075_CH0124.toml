[translation]
"80000107-1" = "過程と結果と"
"80000107-2-メル" = "大事なのは魅せ方！！！"
"80000107-3" = "[s] \"急にどうしたの！？\""
"80000107-4-メル" = "こういうことだよ、先生。"
"80000107-5-メル" = "たとえ結果が分かりきっていたとしても……"
"80000107-6-メル" = "その過程を工夫すれば、差別化もできるんじゃないかな？"
"80000107-7" = "[s] \"今日も話が急でまったく分かりません！\""
"80000107-8-メル" = "まぁ、百聞は一見にしかずって言うくらいだし……"
"80000107-9-メル" = "それじゃあ今から、先生にパフォーマンスを見てもらおう！"
"80000107-13" = "（そう言いながらメルが取り出したのは……）"
"80000107-14" = "（なんだか甘い匂いがする大量の白い板だった……！）"
"80000107-15" = "[ns] \"これは……！？\""
"80000107-17-メル" = "ふっふっふ……"
"80000107-18-メル" = "これは画用紙のように見えて……"
"80000107-19-メル" = "実はホワイトチョコレートなんだ！"
"80000107-20-メル" = "よし、よし。これで紙は準備できたし、残るはペンだけど……"
"80000107-21-メル" = "ここで、このダークチョコレートペンの出番！"
"80000107-22" = "[s] \"チョコレートの上に、チョコレートで絵を描くんだ！\""
"80000107-23-メル" = "そうだよ、先生。"
"80000107-24-メル" = "まさか、今日が何の日か私が知らないとでも思ってたんじゃないよね？"
"80000107-25-メル" = "……こっちの界隈では散々使い古されてるネタだし……準備だって入念にしているよ。"
"80000107-26" = "[s] \"たしかに、そうだよね……\""
"80000107-27-メル" = "というわけで！ここでチョコレートライブドローイングを始めるから、しっかり見てて！"
"80000107-28-メル" = "同人作家メルリーの直筆イラスト……ま、まぁ、まだそんな価値はつかないけど……"
"80000107-29-メル" = "いつかきっと、必ず有名になってみせるから！"
"80000107-35" = "（そう言いながら、メルはチョコレートに絵を描き始めた）"
"80000107-40" = "[ns1] \"おぉ、すごいね……\"\n[ns2] \"あっという間に完成……これ、メルの自画像だよね？\""
"80000107-45-メル" = "……。"
"80000107-46-メル" = "違う、こうじゃない！"
"80000107-47" = "[s] \"ど、どうしたの？よく描けてると思ったよ？"
"80000107-48-メル" = "まだ……まだ足りない！というか眉毛の形が全然違う！"
"80000107-49-メル" = "くっ……チョコレートで描くと、あんまり修正できないのが問題なんだよね。"
"80000107-50-メル" = "でも[ruby=ひめき]姫木[/ruby]メルは、そう簡単に諦めない！"
"80000107-51-メル" = "それに、こんなこともあろうかと思って、チョコレート紙はいっぱい準備してきたんだから！"
"80000107-53" = "（そう言いながら、メルは再びチョコレートに絵を描き始めた）"
"80000107-55-メル" = "……。"
"80000107-56-メル" = "線が歪んでる！"
"80000107-58" = "（そう言いながら、メルは再びチョコレートに絵を……）"
"80000107-60-メル" = "……。"
"80000107-61-メル" = "線が整ってない！"
"80000107-63" = "（そう言いながら、メルは再び……）"
"80000107-65-メル" = "線がつまらない！"
"80000107-70-メル" = "……。"
"80000107-71" = "[s3] \"えっと、メル……？\"\n[s4] \"チョコレート紙、全部使っちゃったみたいだけど……？\""
"80000107-74-メル" = "なんてことだ……こんなに大量に描いてるのに、まともな絵が一つも完成しなかったなんて……"
"80000107-75-メル" = "これが私の限界？いくらデジタルとアナログは、感覚が違うにしても……"
"80000107-76-メル" = "うっ……ううっ……"
"80000107-80" = "（静かにメルの描いた絵に近づき）"
"80000107-81" = "（その中から一番気に入ったものを手に取った）"
"80000107-87-メル" = "……！？な、何してるの、先生！それは失敗作だってば！"
"80000107-88" = "[s] \"私からしたら、本当にいい絵だよ？\""
"80000107-89-メル" = "そう思ってくれるのは嬉しいけど……やっぱりダメ！その程度の出来じゃ……！"
"80000107-90" = "[s] \"大事なのは、過程……魅せ方なんでしょ？\""
"80000107-91-メル" = "……！"
"80000107-92-メル" = "うっ……これはやられた。その話を持ってくるなんて……"
"80000107-93-メル" = "……。"
"80000107-94-メル" = "えいっ……！"
"80000107-99" = "（メルに描いてもらった絵を奪われてしまった！）"
"80000107-100" = "[ns] \"ど、どうするつもりなの、メル！？\""
"80000107-102-メル" = "どうするって、先生にあげるんだったら、私から手渡さないと！"
"80000107-103-メル" = "今日は、アレでしょ？……バレンタイン。"
"80000107-104-メル" = "……まぁ、このチョコレートに込めた意味は置いといて……"
"80000107-105-メル" = "とにかく大事なのは！私が先生に直接チョコレートを渡すという過程！"
"80000107-106" = "[s] \"その方が嬉しいからね！\""
"80000107-107-メル" = "ごほっ……で、でしょ？"
"80000107-108-メル" = "じゃあ、この出来に満足はしてないけど……"
"80000107-114-メル" = "……はい、受け取って。せっかくだし、味わってほしいかな。"
"80000107-115-メル" = "ん？顔のどこから食べたらいいのかって？"
"80000107-116-メル" = "なんだ、そんなこと……"
"80000107-117-メル" = "……って、いや。"
"80000107-118-メル" = "……。"
"80000107-119-メル" = "それは重大な問題じゃない！？"
"80000107-121" = "（こうして、メルの自画像チョコレートをどこから食べるべきか、長時間にわたる議論が始まった）"
