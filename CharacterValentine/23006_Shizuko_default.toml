[translation]
"80000047-1" = "特別な試食会"
"80000047-3-シズコ" = "あ、先生いらっしゃいませ～！百夜堂へようこそ！なーんて！"
"80000047-4-シズコ" = "ふんふん～♪時間ぴったり、流石は先生ですね。偉いです！"
"80000047-5" = "[s] \"うん、大事なお願いって聞いたし。\""
"80000047-6-シズコ" = "ふふふっ……はい、そうなんです。何を隠そう、今日はバレンタインデーですよね？"
"80000047-7-シズコ" = "なので今日は午後からこの「百夜堂」でも、特別な限定スイーツを販売することにしたんです！"
"80000047-8-シズコ" = "が、問題はその中身を何にしようか、ということでして……"
"80000047-9" = "[s] \"あ、そこからなんだ。\""
"80000047-10-シズコ" = "はい、バレンタインデーを舐めてはいけないんですよ！"
"80000047-11-シズコ" = "バレンタインデーだからチョコレート、そんな安易な気持ちでは……"
"80000047-12-シズコ" = "日頃の常連さんたちはもちろん、スイーツにやたら厳しい人たちから辛口評価をされちゃうんですから！！"
"80000047-13-シズコ" = "それに最近は「スイーツ天狗」とかいう、やたら評論家視点で嫌な口コミを残していく謎の集団がいまして……！中身で勝負はもちろんですが、レビューの星の数も大事なんです！"
"80000047-14" = "[s] \"何それ怖い……。\""
"80000047-15-シズコ" = "ということで、今回用意したのはこちら！"
"80000047-19-シズコ" = "これから順番に私が用意したスイーツを一つひとつ出していきます。"
"80000047-20-シズコ" = "なので、先生にそれぞれ試食していただいて、感想を頂ければと！"
"80000047-21" = "[s] \"うん、了解！\""
"80000047-23" = "（そうしてシズコに協力する形で、スイーツの試食会を始めたのだった）"
"80000047-25" = "（その試食会は、想像していたよりも熱い展開となり……）"
"80000047-26-シズコ" = "このスイーツ、いかがですか？"
"80000047-27" = "[s1] \"もうちょっと甘い方が個人的に好きかも？\"\n[s2] \"しょっぱい味とか足すと、最後まで食べやすいかも。\""
"80000047-28-シズコ" = "ふむふむ、なるほどなるほど……承知しました！"
"80000047-29-シズコ" = "ふむふむ、なるほどなるほど……承知しました！"
"80000047-30-シズコ" = "それでは次に、このお菓子と一緒に出すお飲み物は……"
"80000047-31" = "[s3] \"やっぱり抹茶かな。\"\n[s4] \"この味なら紅茶とか？\"\n[s5] \"コーラ！コーラ一択！コーラ万歳！\""
"80000047-32-シズコ" = "なるほど……確かにそんな気がします！"
"80000047-33-シズコ" = "なるほど……確かにそんな気がします！"
"80000047-34-シズコ" = "なるほど……確かにそんな気がします！"
"80000047-35-シズコ" = "良いですね、採用です！"
"80000047-37" = "（その後、約1時間に渡ってスイーツを食べ続け……）"
"80000047-39-シズコ" = "なるほど～……この商品に限りませんが、やっぱり飲み物のパターンは今のままでは足りないかもですね。"
"80000047-40-シズコ" = "それに百夜堂らしさは大事ですが、やはり和菓子だけでなく多種多様な味付けを取り込み……"
"80000047-41-シズコ" = "ここの甘味は足して、こっちは逆に風味を活かすために……"
"80000047-45-シズコ" = "はい、OKです！諸々ありがとうございました、新しい商品完成です！"
"80000047-50" = "[ns] \"お疲れ様、役に立てたなら良かったけど。\""
"80000047-51-シズコ" = "ああそれはもう、大いに助かっちゃいました。"
"80000047-52-シズコ" = "これでバッチリ、完璧です！"
"80000047-53" = "[s] \"ところで気になったんだけど。\""
"80000047-54-シズコ" = "はい、何でしょう？"
"80000047-55-シズコ" = "え、先生ひとりの意見だけで大丈夫なのか、ですか……？"
"80000047-56-シズコ" = "あ、あー……"
"80000047-57-シズコ" = "まあそれはもちろん……え、えへへっ！えへへへへっ！"
"80000047-61-シズコ" = "こちらは限定版と言いますか……特別な、"
"80000047-62-シズコ" = "すっごく大事な方のための、特注品的な物ですから。"
"80000047-63" = "[s] \"……？\""
"80000047-64-シズコ" = "さあおしゃべりは終わりです！ではこれより密かに百夜堂、開店です！"
