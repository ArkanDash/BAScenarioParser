[translation]
"10014015-2-レイサ" = "止まりなさい、[ruby=きょうやま]杏山[/ruby]カズサ！！#nなんで逃げるんですか！！"
"10014015-3-カズサ" = "ああもう！あっち行って！あっち行ってよ！！"
"10014015-20-カズサ" = "はあ、はあ、はあ……"
"10014015-21-カズサ" = "疲れた……。"
"10014015-22-カズサ" = "もう大丈夫だよね……？振り切れたかな……。"
"10014015-23-カズサ" = "ほんとキツすぎ……今日だけでもう三回目だよ……。"
"10014015-24-カズサ" = "とりあえず、すぐに先生から離れたけど……巻き込まれたりしてない？#n大丈夫？"
"10014015-25-カズサ" = "うん、ならよかった……。"
"10014015-26-カズサ" = "……ん？"
"10014015-27-カズサ" = "ああ。あいつ、壁を乗り越えるのは遅いから、適当に誘導してきたの。"
"10014015-28-カズサ" = "だから早く帰ってこれたんだけど……"
"10014015-32-カズサ" = "……？#nなにその顔。"
"10014015-33" = "[s1] \"カズサって壁登れるの？\"\n[s2] \"すごく簡単そうに言うんですね……？\""
"10014015-34-カズサ" = "……あ。"
"10014015-35-カズサ" = "……あ。"
"10014015-36-カズサ" = "あー……その……。"
"10014015-37-カズサ" = "まぁ……色々。練習する機会があったの。#nそういう事にしといて。"
"10014015-41-カズサ" = "……はあ。"
"10014015-42-カズサ" = "そうだね……こちらから色々お願いしておいて、事情を言わないのはフェアじゃないよね。すみません。"
"10014015-43-カズサ" = "その、あんまり言いたい事ではないんだけど……。"
"10014015-44-カズサ" = "まぁ……状況の説明のためには必要なことだし。#n仕方ないか。"
"10014015-45-カズサ" = "うーん……とは言っても、どこから話せばいいだろ。"
"10014015-46-カズサ" = "……先生、「スケバン」って知ってる？"
"10014015-47-カズサ" = "不良生徒の事なんだけどさ。#nその中でも特に分かりやすい子とかいるじゃん。"
"10014015-48-カズサ" = "マスクして、スカートを長くしたり胸にサラシ巻いたりしてる……ああいうの。"
"10014015-49-カズサ" = "先生だったら多分なんとなく分かると思うんだけど……。"
"10014015-50-カズサ" = "その……なんでスケバンが出てきたかって言うと。"
"10014015-51-カズサ" = "さっきの[ruby=うざわ]宇沢[/ruby]。あいつ、中学生の時から強いスケバンと聞けば、ああやって飛びかかるような熱血バカだったの。"
"10014015-52-カズサ" = "自称「正義の使徒」……ってやつ？"
"10014015-53-カズサ" = "今も「自警団」で同じようなこと続けてるみたいだけど……"
"10014015-54-カズサ" = "ホント……これだから熱血でうるさいバカは嫌い。"
"10014015-58-カズサ" = "……あ、ごめん。話がそれるとこだった。#nそれで、本題はこれ。"
"10014015-63" = "[ns3] \"この写真は……？\"\n[ns4] \"……スケバン？\""
"10014015-64-カズサ" = "別に、好きで持ち歩いてるわけじゃないんだけどさ。#n――先生には、見せないといけないかなと思って。"
"10014015-65-カズサ" = "別に、好きで持ち歩いてるわけじゃないんだけどさ。#n――先生には、見せないといけないかなと思って。"
"10014015-66-カズサ" = "先生は信じてくれるとは思うけど、一応。"
"10014015-67-カズサ" = "……え？"
"10014015-68-カズサ" = "……うん、そうだよ。"
"10014015-69-カズサ" = "それ……"
"10014015-70-カズサ" = "…………私であってるよ。"
"10014015-71-カズサ" = "まぁ、正確には今の私じゃなくて中学の時のなんだけどね。"
"10014015-72-カズサ" = "……私。"
"10014015-73-カズサ" = "…………。"
"10014015-78-カズサ" = "――「スケバン」だったの。"
