[translation]
"10014065-4-カズサ" = "……ここ？"
"10014065-5-カズサ" = "先生はどうやってこの場所を？"
"10014065-6" = "[s1] \"スケバンがこんなに集まってたら……\"\n[s2] \"逆に分かりやすいような……。\""
"10014065-7-カズサ" = "た、たしかに……。"
"10014065-8-カズサ" = "た、たしかに……。"
"10014065-9-カズサ" = "それに、トリニティ自治区でこの規模の騒ぎを起こしたら、当然、正義実現委員会が出てくるもんね。"
"10014065-10-カズサ" = "だから、わざわざトリニティの外まで[ruby=うざわ]宇沢[/ruby]を追い込んだのか。#nここなら、自分たちも思う存分暴れられるから。"
"10014065-11-カズサ" = "ここも長くて今夜……いや、明日の夜明けくらいまでしか保たないだろうけど。#n明日にでもヴァルキューレあたりが押し寄せてくるだろうし。"
"10014065-12-カズサ" = "それはそうとして……"
"10014065-16-カズサ" = "こいつらはなんでここにいるの……？"
"10014065-17-ヨシミ" = "……こいつらだなんて、ひどいわね。#n助っ人になんてこと言うのよ？"
"10014065-18-カズサ" = "誰が助けてほしいなんて言ったのさ？#n邪魔なだけだから、今からでも帰ったら？"
"10014065-19-ヨシミ" = "あはは！！面白いじゃん？#n本当に邪魔かどうか、行く前にちょっと試してみる？"
"10014065-20-カズサ" = "ああもう……こっちにもうるさいバカが……#n変な言葉まで覚えて……"
"10014065-21-カズサ" = "今回のことが終わったら、すぐそれ止めなよ……幼稚だから。"
"10014065-22-ヨシミ" = "なっ……？#nよ、幼稚……？"
"10014065-23-ヨシミ" = "言ったわね！？"
"10014065-25-アイリ" = "よ、ヨシミちゃん！！カズサちゃん……！#nここで私たちが喧嘩しちゃだめだよ……！"
"10014065-26-カズサ" = "ホント、何しに来たんだよ……"
"10014065-27-カズサ" = "……どうせ、先生が呼んだんでしょ。"
"10014065-28" = "[s3] \"どうせなら一緒がいいかなって。\"\n[s4] 知らんぷりする。"
"10014065-29-カズサ" = "先生……。"
"10014065-30-カズサ" = "先生……。"
"10014065-34-ナツ" = "遠慮することはないのだよ、カズサ。我々はこの一帯を食べ尽くす恐怖の「放課後スイーツ団」キャスパリーグの仲間たち。"
"10014065-35-ナツ" = "そして仲間の友人は……私たちの友人でもある。"
"10014065-36-ナツ" = "私たちの友人に手を出した彼女らは、相応の血の代価を支払うことになるだろう。"
"10014065-37-カズサ" = "いや、だから何度も話したじゃん！#n私はあいつと友達なんかじゃ……"
"10014065-38-ナツ" = "……ふっふっふ。認め切れないその姿、まさに「悪友」だな！！"
"10014065-39-ナツ" = "ロマンだ！！"
"10014065-40-カズサ" = "ああもう！！#nその口調やめてって！！恥ずかしくないの！？"
"10014065-41-カズサ" = "そんな言葉使ってたら、絶対あとで枕抱えて後悔するよ！？"
"10014065-42-ヨシミ" = "……？？？#n今更……ナツが？"
"10014065-43-ヨシミ" = "残念だけど、めっちゃ気に入ってるっぽいよ？"
"10014065-48-ナツ" = "……ふっ。"
"10014065-49-カズサ" = "……ホント最悪……。#n悪夢だよ、こんなの……"
"10014065-53-ヨシミ" = "まぁ、今は細かい事いいでしょ！#nほら、やってやろうじゃないの！！"
"10014065-54-ヨシミ" = "こっちには先生もいるし、よっぽどじゃない限り負けないわよ！！"
"10014065-55-アイリ" = "せ、先生……！#nどうか安全なところからお願いします！"
"10014065-56" = "[s5] \"行くよ、放課後スイーツ団！！\"\n[s6] \"レイサを助けよう！！\""
"10014065-59-ヨシミ" = "いくわよーーー！！"
"10014065-60-アイリ" = "い、いきまぁあす！！"
