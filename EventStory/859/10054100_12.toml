[translation]
"10054100-1" = "第10話;時には必要なもの"
"10054100-2-シュン" = "門主様の、おなりです。"
"10054100-4-ナゴミ" = "門主……？"
"10054100-5-ヨウコ" = "様……？"
"10054100-6-スイコ" = "ま、まさか！？"
"10054100-8-ルミ" = "そのまさかだよ。"
"10054100-9-ルミ" = "門主様のー！おな～り～！！！"
"10054100-10-ココナ" = "おな～り～！！"
"10054100-12" = "[ns1] \"門主様の御前だ！\"\n[ns2] \"早[ruby=こうべ]く首を[/ruby]垂れるがいい！\""
"10054100-17-キサキ" = "先生まで……堪忍してくりゃれ……。"
"10054100-18-ヨウコ" = "門主ということは、まさか、山海経の……？"
"10054100-19-？？？" = "その名を軽々しく口にするな！"
"10054100-20-スイコ" = "今度は誰！？"
"10054100-26-ミナ" = "弱気を助け、強きをくじく。恩を忘れず、正義のためにひた走る！"
"10054100-27-ミナ" = "天に従い義を為せば、その道こそが我が任侠！"
"10054100-28-ミナ" = "世に言う我らは山海経――玄龍門だ！"
"10054100-29-ミナ" = "（くぅ～！決まった……！今のは最高にイカしたぞ！）"
"10054100-30-ルミ" = "……あれ、仲間外れ？"
"10054100-31-ナゴミ" = "知ってる！頭が固くて融通の利かないバカ連中でしょ！？#nお金でも動かないらしいじゃん！"
"10054100-32-ナゴミ" = "まさか、雑魚大人が生意気になったのはこいつらのせい……？"
"10054100-33-ミナ" = "……バカ……連中？"
"10054100-34-スイコ" = "なんで山海経のバカ連中がこんなとこに……？"
"10054100-35-ココナ" = "あなたたちが自分勝手すぎるからだよ！"
"10054100-36-ヨウコ" = "なんですって……？"
"10054100-37-ココナ" = "そもそもね、人は人らしい行動を見せてこそ、人なんだよ。"
"10054100-38-ココナ" = "梅花園の園児が同じことしたら、とっくにお尻ペンペンだったからね！"
"10054100-39-スイコ" = "ふ、ふん！あんただって子供のくせに！"
"10054100-40-ココナ" = "一緒にされてる！？"
"10054100-41-ココナ" = "叱るのも、しつけをするのも！全部あなたたちのためなの！"
"10054100-42-ココナ" = "私たちだって、やりたくてやってるわけじゃないんだよ？"
"10054100-43-ナゴミ" = "だったら放っといてよ！"
"10054100-44-ココナ" = "それじゃあ悪い子になっちゃうでしょ！#nあなたたちだって、トラブルばっか起こして！"
"10054100-45-ヨウコ" = "私たちは、やりたいことをするまでです……！#n大人には子供の気持ちなんて分からないんですよ！"
"10054100-46-ココナ" = "大人だって昔は子供だったんだよ？"
"10054100-47-ココナ" = "先に言っておくけど、叱られて済むうちにやめたほうがいいからね？"
"10054100-48-ココナ" = "大人になったら誰も叱ってくれなくなるんだよ？"
"10054100-49-スイコ" = "まだ子供なんだけど！？"
"10054100-50-ココナ" = "若さは免罪符にならないよ。#nそれに、あなたたちも、いつかは大人になるんだから。"
"10054100-51-キサキ" = "ココナ教官。もう十分じゃよ。"
"10054100-52-キサキ" = "言われて気づけるのなら、子供とは呼べないじゃろうて。"
"10054100-53-キサキ" = "これは妾の持論じゃが……。"
"10054100-54-キサキ" = "成熟しすぎた子は、その分、悲しみも抱えているものじゃ。"
"10054100-55-キサキ" = "故に、ここで雛鳥組を過度に叱責するのは――"
"10054100-60-キサキ" = "げほっ……！"
"10054100-65" = "[ns] \"キサキ！？\""
"10054100-66-ミナ" = "門主様！？"
"10054100-73-スイコ" = "ぜ、全員動くな！#nもし動いたら……こいつを――"
"10054100-77-ナゴミ" = "ね、ねぇ……大丈夫なの……？"
"10054100-78-ヨウコ" = "少しマズいような気が……。"
"10054100-82-スイコ" = "ビビるな！全部……他のヤツらが悪いんだから！"
"10054100-83-スイコ" = "こうなったら……全部支配してやる！#n山海経だって、何だって、全部！"
"10054100-84-ミナ" = "こいつら……。"
"10054100-85-ミナ" = "子供だからと我慢していたが……門主様に手をかけるならば……！"
"10054100-86-？？？" = "……子供とはいえ、越えてはならない一線があります。#nそれを教える必要があるみたいですね。"
"10054100-87-ミナ" = "！？"
"10054100-95-シュン" = "子供にも許されないことはあるんですよ。"
"10054100-96-スイコ" = "えっ……？"
"10054100-97-シュン" = "ひとつ、人様に迷惑をかけてはなりません。"
"10054100-101-スイコ" = "あーっ！？"
"10054100-102-シュン" = "ふたつ。人を利益のために利用してはなりません。"
"10054100-103-スイコ" = "いったぁーい！"
"10054100-104-シュン" = "今から習慣づけしないと、後で大変な目に遭いますよ。"
"10054100-105-スイコ" = "ご、ごめんなさい！許してぇぇ！！！"
"10054100-107-シュン" = "……そこの2人も。"
"10054100-113-ナゴミ" = "ひぃっ……！？"
"10054100-114-ヨウコ" = "あうあうあう……！"
"10054100-118-シュン" = "友達が道を踏み外しても、同調してはいけません。"
"10054100-119-ナゴミ" = "うわぁーん！お尻がぁ！！"
"10054100-120-シュン" = "ダメなことはダメだと言ってあげるのが、本当の友達です。"
"10054100-121-ヨウコ" = "んぐっ……！ひぃっ……！"
"10054100-122-シュン" = "赤信号はみんなで渡れば怖くないものではありません。みんな[ruby=・   ・]でも[/ruby]、赤信号なら待つべきなんです。"
"10054100-123-ナゴミ&ヨウコ" = "あううぅぅぅぅ……！！"
"10054100-125-シュン" = "分かりましたか？"
"10054100-126-スイコ" = "うっ……ううぅっ……。"
"10054100-127-ナゴミ" = "あうぅぅぅ……。"
"10054100-128-ヨウコ" = "ぐすっ……うぅぅ……。"
"10054100-129-シュン" = "門主様、大丈夫ですか？"
"10054100-130-キサキ" = "……シュン教官か。世話になった。"
"10054100-131-シュン" = "いいえ。急によろめいて、びっくりしました。"
"10054100-132-キサキ" = "大丈夫じゃ。ふふ……どうやら、少し浮かれすぎてしまったようじゃ。"
"10054100-138" = "[ns] \"キサキ……。\""
"10054100-139-キサキ" = "先生……。"
"10054100-140-キサキ" = "……ふふ。"
"10054100-141-キサキ" = "あとで、二人きりでちゃんと話そう。"
"10054100-142-スイコ" = "あんたたち！よくも……よくもお尻を叩いたな！"
"10054100-143-スイコ" = "もう絶対に許さないからっ！！！"
"10054100-144-ココナ" = "……まだそんなこと言ってるの？"
"10054100-145-ココナ" = "シュン姉さんにあそこまでされたのに、まだ……！"
"10054100-146-ルミ" = "ま……これは仕方ないね！"
