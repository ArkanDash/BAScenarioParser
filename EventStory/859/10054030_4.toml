[translation]
"10054030-1" = "第3話;水遊びと査察、総合的に休暇（１）"
"10054030-5-シュン" = "川は、「文明のゆりかご」とも言えます。"
"10054030-6-シュン" = "遥か昔から農業や交通、暮らしの拠点として多くの役割を果たしてきました。"
"10054030-7-キサキ" = "そうじゃな。そして、山海経にとっても大きな意味を持つ。"
"10054030-8-キサキ" = "例えば、「治める」という字。本来は、水の流れを調整するという意味だったのじゃ。"
"10054030-9-キサキ" = "洪水の後、境界線が曖昧になった土地を如何にして再分配するかが大事だったそうじゃな。"
"10054030-10-シュン" = "このことから、治水とは即ち、世を治めるという意味に拡張されたのです。"
"10054030-11-シュン" = "この査察が渓谷で行われるのも、何かしらの意味を感じますね。"
"10054030-18" = "[ns] \"わぁ……。\""
"10054030-23-ルミ" = "どう？先生。いいところでしょ。#nしばらくここで待っててくれる？"
"10054030-24-ルミ" = "あたしたちは水着に着替えてくるから。#nふふっ、楽しみにしててね？"
"10054030-29" = "（楽しそうに走っていく後ろ姿を眺めながら）"
"10054030-30" = "（自分なりの準備をして待つことにした）"
"10054030-32-？？？" = "ココナちゃん？#nはしゃぎすぎて転ばないように気をつけてくださいね。"
"10054030-33-？？？" = "大丈夫！私はもう立派なレディーだから！"
"10054030-40-ココナ" = "先生ー！！！"
"10054030-41" = "[s] \"ココナちゃん！\""
"10054030-42-ココナ" = "もう！またココナちゃんって呼んで～！"
"10054030-43-ココナ" = "でも、それも今日までです！#n私はもう立派なレディーですから！"
"10054030-44" = "[s] \"おぉっ！すっごく大人っぽい！\""
"10054030-45-ココナ" = "ふふん、当然です！"
"10054030-46-ココナ" = "って！違います！#n大人[ruby=・]っ[/ruby][ruby=・]ぽ[/ruby][ruby=・]い[/ruby]ではありません！レディーです！"
"10054030-47-ココナ" = "えっへん！レディーな私に似合う水着を用意したんですよ。"
"10054030-48" = "[ns] （そういうところがココナちゃんだよね！）"
"10054030-50" = "（喜びを隠しきれていないココナちゃんに……）"
"10054030-52" = "（高い高いをしてあげた！）"
"10054030-58-ココナ" = "わあ！あははっ！"
"10054030-59-ココナ" = "先生！すごいです！"
"10054030-63-ルミ" = "お～、ココナちゃん、楽しんでるね。"
"10054030-64-ココナ" = "ルミお姉さんまで「ちゃん付け」だなんて……！"
"10054030-65-ルミ" = "だって、あたしたちは査察に来てるんだから。"
"10054030-66-ルミ" = "できる限り「普通の生徒」を装うべきでしょ？"
"10054030-67-ココナ" = "あ、たしかに……！"
"10054030-68-ココナ" = "仕方ありませんね！#n特別にココナちゃん呼びを許可します！"
"10054030-69-ルミ" = "うん、うん。やっぱりココナちゃんは大人だなぁ。"
"10054030-70-ココナ" = "当然です！ルミお姉さんも分かってますね！"
"10054030-76-ルミ" = "それで……どう？"
"10054030-77" = "[s] \"な、何が？\""
"10054030-82-ルミ" = "ここでとぼけられるのは、ちょ～っと寂しいなぁ。"
"10054030-83-ルミ" = "先生のリクエスト、反映したつもりだけど……？"
"10054030-84" = "[s] \"私、リクエストしたっけ……？\""
"10054030-85-ルミ" = "してなくてもさ、あたしたちの仲でしょ？"
"10054030-86-ルミ" = "先生の好きそうなやつにしたんだけど……どうかな。"
"10054030-87" = "[s1] \"なんで私の好みが分かったの……すごく良い。\"\n[s2] \"うん、良いと思うよ。すごく似合ってる。\""
"10054030-88-ルミ" = "え、うん。ありがとう。"
"10054030-93-ルミ" = "や、あはは……率直な反応されると照れちゃうね。"
"10054030-94-ルミ" = "これだから先生は……。"
"10054030-95-ルミ" = "ま、今日のところはこれで良しかな。"
"10054030-96-ルミ" = "あらら、大人な対応。残念。"
"10054030-101-ルミ" = "まあ、先生のことはこれから知っていけばいいわけだもんね。"
"10054030-102-ルミ" = "だけど、その、似合ってるってストレートに言われると……あはは……うん。"
"10054030-103-ルミ" = "あ、ありがとう。"
"10054030-104-キサキ" = "妾も輪に入れてもらえるかの？"
"10054030-105-ココナ" = "門主様？"
"10054030-106-キサキ" = "はて。妾はキサキじゃが……。"
"10054030-107-ココナ" = "あ、そうでした！ごめんなさい、キサキお姉さん。"
"10054030-108-キサキ" = "ふふ。ココナからそう呼ばれる日がくるとは。#nこれもまた一興じゃな。"
"10054030-111" = "[ns] \"キサキ……。\""
"10054030-114-ルミ" = "おっ、気合入れたね！"
"10054030-115-キサキ" = "妾はただの高校生、[ruby=りゅうげ]竜華[/ruby]キサキ。"
"10054030-116-キサキ" = "この程度の着こなしは普通じゃよ。"
"10054030-121-キサキ" = "それで……どうじゃろうか。"
"10054030-122-キサキ" = "思いは、言葉にせんと伝わらんぞ？"
"10054030-123" = "[s] \"色々と、夢みたい……。\""
"10054030-124-キサキ" = "なるほど。好意は示しつつも明言は避け、解釈は相手に委ねる……。"
"10054030-125-キサキ" = "よかろう。合格点じゃ。"
"10054030-126-キサキ" = "ん？なんじゃ、体の調子か？ふむ……。"
"10054030-131" = "（一瞬、キサキとルミの目が合った）"
"10054030-134-キサキ" = "心なしか、いつもより軽く感じる。皆には感謝しておるぞ。"
"10054030-136-シュン" = "それはなによりです。門し――キサキさん。"
"10054030-140-シュン" = "うふふ。こんな呼び方、なんだか失礼なことをしている気分ですね。"
"10054030-141-キサキ" = "シュンか。#n……ほう？これはまた。"
"10054030-146-シュン" = "せっかくの機会ですから。キサキさんもよくお似合いですよ。"
"10054030-147-シュン" = "それで、先生は見ているだけなんですか？#nたとえありきたりな言葉でも、言ってもらうと嬉しいのですよ？"
"10054030-148" = "[s3] \"その前振りの後だとあれだけど……。\"\n[s4] \"すごく似合ってるよ。\""
"10054030-151-シュン" = "ありがとうございます。嬉しいです。"
"10054030-152-シュン" = "これで水着の感想は満足したので……この機会に、もう1つ。#n前々から言ってみたかったことがあるんです。"
"10054030-153-ルミ" = "なになに？"
"10054030-154-シュン" = "皆さん、帰るまでが遠足ですよ？"
"10054030-155-ココナ" = "シュン姉さんらしいね……。"
"10054030-156-キサキ" = "そうじゃな。"
"10054030-157-ミナ" = "さて、準備はできたようだな！#nこの場の安全は私に任せて、それぞれの役割を果たしてくれ！"
"10054030-161" = "[ns] \"よ～っし……。\""
"10054030-162-一同" = "わあ～川だ～！！"
"10054030-163-ミナ" = "遊びに来ているわけではないんだぞ……！"
"10054030-165" = "[ns] \"行こう！！！\""
"10054030-168-ミナ" = "まあ、いいか……観光客を演じる必要もあるし……。"
"10054030-171-ココナ" = "……冷た～い！"
"10054030-172-シュン" = "ココナちゃん？まずは準備体操ですよ？"
"10054030-173-ルミ" = "水に入る前の体操って何をしたらいいんだっけ。"
"10054030-174-ミナ" = "私も詳しくは……。"
"10054030-175-キサキ" = "ふむ。"
"10054030-181" = "（キサキが目くばせをしてきた）"
"10054030-182-キサキ" = "では……ここは妾がお手本を見せるとしよう。"
"10054030-183-ミナ" = "もっ――キサキ……様！？"
"10054030-184-シュン" = "あら。"
"10054030-185-ココナ" = "あれ？でも……。"
"10054030-186-ルミ" = "よろしく！"
"10054030-188" = "（キサキのお手本にあわせて、みんなで「水辺のばんざい体操」をした）"
"10054030-189" = "（査察という名の休暇が始まった！）"
