[translation]
"10043010-1" = "第1話;「絶対」なんて言わないで"
"10043010-6-レイ" = "まさか、ブレーブスの控え室に招待されるなんて……。"
"10043010-7-スミレ" = "……ここは関係者以外、立ち入り禁止のはずでは？"
"10043010-8" = "[s] \"なんで呼ばれたんだろう……。\""
"10043010-13-？？？" = "お越しいただきありがとうございます。"
"10043010-17" = "[ns] \"どちら様ですか？\""
"10043010-23-監督" = "申し遅れました。私はコーギー・ブレーブスで監督を務めております。"
"10043010-28-レイ" = "か、監督！？"
"10043010-29-スミレ" = "この方が……。"
"10043010-31-監督" = "仰る通り、ここは本来、関係者以外立ち入り禁止です。"
"10043010-32-監督" = "ですが、なにぶん緊急事態でして……。"
"10043010-36-監督" = "……どうか、我々を助けてはくださりませんか！"
"10043010-41-レイ" = "い、一体何が……？"
"10043010-42-スミレ" = "それは、トレーニングで解決できることでしょうか？"
"10043010-43-レイ" = "せ、先輩！"
"10043010-45-監督" = "実は――"
"10043010-54-謎の声" = "監督……「アレ」の準備は？"
"10043010-57-一同" = "！！！"
"10043010-59-監督" = "あ、ああ……。だが一つ聞きたい、目的は金か……？"
"10043010-60-謎の声" = "金など必要ない。重要なのは試合だ。"
"10043010-61-謎の声" = "いいか、もう一度作戦を説明する。 "
"10043010-62-謎の声" = "次の攻撃時……出塁したらバントだ。絶対だぞ。"
"10043010-64-謎の声" = "もし従わなければ、「予告」通り犯行に移る。"
"10043010-65-監督" = "……っ！"
"10043010-66-謎の声" = "ヴァルキューレに通報でもしてみろ……後はわかるな？"
"10043010-67-謎の声" = "攻守交代の時にまた連絡する。では。"
"10043010-72-レイ" = "切れちゃった……。"
"10043010-73-スミレ" = "ボイスチェンジャーを使っていましたね……。"
"10043010-75-監督" = "ううぅ……何が目的で……！"
"10043010-76" = "[s] \"犯行予告の内容は？\""
"10043010-80-監督" = "ヤツから脅迫を受けたのは……少し前のことです。"
"10043010-82-レイ" = "球団の監督に脅迫……なんででしょう……？"
"10043010-83-スミレ" = "さきほどの通話の内容も不可解でした……。"
"10043010-85-監督" = "言う通りに試合をしなかった場合……。"
"10043010-86-監督" = "ヤツは――"
"10043010-94-監督" = "ブレーブスと専属契約中の犬用ガム工場を、爆破すると言っているんです！"
"10043010-95-監督" = "これは未曾有のテロですよ……！"
"10043010-99" = "[ns] \"……今なんと？\""
"10043010-101-スミレ" = "犬用、ガム……？"
"10043010-102-レイ" = "ちょ、ちょっとピンとこないのですが……。"
"10043010-104-監督" = "……我々にとっては深刻な問題なんです。"
"10043010-105-監督" = "あそこのガムは、ほど良い歯ごたえで、食感も抜群――"
"10043010-106-監督" = "さらに、噛めば噛むほど旨味が広がっていく傑作で……！"
"10043010-107-監督" = "うちの選手はみんな、あのガムで集中力を高めて試合に臨んでいるんです！"
"10043010-108-監督" = "もはや、あのガムもチームの一員と言って良いくらいに大切なガムなんです！"
"10043010-109-監督" = "あれなしでは打率が驚くほど下がってしまいます！"
"10043010-110-監督" = "防御率だって、信じられないほど悪くなるに違いない！"
"10043010-112-レイ" = "そ、そうなんですか……？"
"10043010-113-レイ" = "（そんなに深刻なんだ……）"
"10043010-119-スミレ" = "私はレイさんほど野球に詳しくはありませんが……。"
"10043010-120-スミレ" = "脅迫行為は、スポーツマンシップに反するものです。"
"10043010-124-レイ" = "たしかにそうですが……先輩がトレーニング以外に目を向けるなんて。"
"10043010-125-レイ" = "野球がきっかけで、先輩も他のスポーツに目覚めたり……？"
"10043010-126-スミレ" = "健康な精神は、健康な身体に宿ります。"
"10043010-127-スミレ" = "トレーニングさえしていれば、犯人も凶行に走ることはなかったでしょうに。"
"10043010-128-レイ" = "……って、結局トレーニングなんですか！？"
"10043010-130" = "[ns] \"事情は分かりました。\""
"10043010-134-監督" = "で、では……力を貸してくださるのでしょうか？"
"10043010-135-レイ" = "神聖な球場で、犯行予告をするだなんて……。"
"10043010-136-レイ" = "野球ファンとして許せません！"
"10043010-137-レイ" = "その上テロ予告まで……！"
"10043010-138-スミレ" = "私としても、このような暴挙は見過ごせません。"
"10043010-139-スミレ" = "こんなことがまかり通っては、スポーツ界全体に悪影響が及びます。"
"10043010-140" = "[s1] \"私も同意見です。\"\n[s2] \"ぜひ協力させていただきます。\""
"10043010-146-監督" = "あ、ありがとうございます……！"
"10043010-148-レイ" = "でも先生、どうすればいいんでしょう……？"
"10043010-152-スミレ" = "観客席を巡回して犯人を捜そう、ですか。"
"10043010-153-レイ" = "たしかに、シラトリシリーズは中継が行われていないから……。"
"10043010-154-レイ" = "犯人はスタジアムのどこかで試合を見ているはずです。"
"10043010-155-レイ" = "ですが、捜している間にも、また連絡が来る……。"
"10043010-156-スミレ" = "次の攻守交代の時までに――"
"10043010-157-スミレ" = "犯人に対応する必要がありますね。"
"10043010-161-レイ" = "監督と通話を繋いでおいて、犯人との会話を聞きつつ動こう……ですか？"
"10043010-162-スミレ" = "なるほど。"
"10043010-163-スミレ" = "では、交渉はトレーナーとレイさんにお任せします。"
"10043010-164-スミレ" = "私の得意分野ではありませんので。"
"10043010-165-スミレ" = "筋力と体力を要することなら、自信はあるのですが。"
"10043010-166" = "[s3] \"じゃあ、役割を分担しよう。\"\n[s4] \"まず、交渉班と、捜索班に分かれて……。\""
"10043010-169-レイ" = "では、私は交渉を担当しつつ、捜索も手伝いますね。"
"10043010-170-スミレ" = "私は観客席を見て回ります。"
"10043010-171-監督" = "通話回線を繋いでおきますので、先生、よろしくお願いします。"
"10043010-175-監督" = "ああ、それと……スミレさん、だったかな？"
"10043010-180-スミレ" = "ええ。"
"10043010-181-監督" = "レイさんは問題ないと思うけど……。"
"10043010-182-監督" = "あなたの格好は、観客席だと少々目立つかもしれない。"
"10043010-183-スミレ" = "そんなに変でしょうか……？"
"10043010-184" = "[s] \"変というわけじゃなくて……\""
"10043010-185-スミレ" = "なるほど……球場では珍しい、と。"
"10043010-186-スミレ" = "ですが、着替えもないですし……。"
"10043010-191-レイ" = "……あっ、いいこと思いつきました！"
"10043010-192-レイ" = "球場でおなじみの「アレ」！"
"10043010-193" = "[s] \"「アレ」？\""
"10043010-194-レイ" = "監督、ちょっと……（こそこそ）"
"10043010-199-監督" = "……ああ！なるほど！"
"10043010-216-レイ" = "……お待たせしました！先輩、どうぞ！"
"10043010-224-スミレ" = "これは……着慣れないですね……。"
"10043010-225-スミレ" = "その、トレーナー……。"
"10043010-226-スミレ" = "どう、ですか……？"
"10043010-227" = "[s] \"……！\""
"10043010-229" = "[ns5] \"すごく似合ってるよ！\"\n[ns6] \"いつもとは違う魅力があるね！\""
"10043010-232-スミレ" = "そ、そうですか？"
"10043010-233-スミレ" = "でしたら……この格好も悪くないですね。ふふっ。"
"10043010-234-スミレ" = "それでは、売り子さんとしてプロテインシェイクを提供していきましょう。"
"10043010-235-レイ" = "そ、それはいいですから！"
"10043010-236-レイ" = "もう時間がありません！行きましょう！"
"10043010-237-レイ" = "既に攻守交代してる可能性も……！"
"10043010-238-監督" = "まだ1アウトですし、大丈夫だと思いますよ。"
"10043010-239-レイ" = "え！？レイダースはまだ1アウトしか取られていないんですか！？"
"10043010-240-レイ" = "つまり……ブレーブスは得点を取られ続けて……？"
"10043010-246-監督" = "……。"
"10043010-247-スミレ" = "……。"
"10043010-248" = "[s] \"……。\""
"10043010-253-レイ" = "しょ、勝負は最後までわかりません……から！"
