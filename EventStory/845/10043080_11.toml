[translation]
"10043080-1" = "第8話;人生も、9回裏2アウトから"
"10043080-2-スミレ" = "診せてください。"
"10043080-6-4番バッター" = "ぐうぅっ……。"
"10043080-8-監督" = "ど、どうだ？"
"10043080-9-レイ" = "大丈夫ですよね、先輩？"
"10043080-14-スミレ" = "うーん……"
"10043080-15-レイ" = "せ、先輩？"
"10043080-16-スミレ" = "骨に異常はありません。"
"10043080-17-スミレ" = "ですが、今日バットを握るのは難しいでしょう。"
"10043080-18-スミレ" = "下手をすれば、靭帯を損傷してしまいます。"
"10043080-19-レイ" = "そ、そんな……！"
"10043080-21-犯人" = "なんで4番バッターがこんなところにいるんだ！"
"10043080-22-犯人" = "……。"
"10043080-23-犯人" = "いや、俺のせいだな……"
"10043080-24-犯人" = "最初からこんな計画をしていなければ……。"
"10043080-25-犯人" = "でも……。"
"10043080-26-犯人" = "勝つ姿を……せめて、納得できる負けが見たかった！"
"10043080-27-監督" = "……納得いく試合なんてないさ。"
"10043080-28-監督" = "努力を積み重ねるしかない。"
"10043080-30-レイ" = "監督……！"
"10043080-31-スミレ" = "素晴らしいお言葉です。"
"10043080-36-アナウンサー" = "フォアボール！ブレーブス、またしても出塁！"
"10043080-37-アナウンサー" = "9回裏2アウト……満塁です！"
"10043080-38-解説者" = "こう言うのはなんですが……"
"10043080-39-解説者" = "この状況……「あれ」を期待してしまいますね。"
"10043080-41-アナウンサー" = "打席に立つのは4番バッター！"
"10043080-42-アナウンサー" = "スタジアムにご来場の皆様！ついに、この瞬間が訪れました！！"
"10043080-45" = "[ns] \"ほ、ほんとに9回裏2アウト満塁なの！？\""
"10043080-46-レイ" = "……「野球は9回裏2アウトから本番！」と冗談で言ったりもしますけど、"
"10043080-47-レイ" = "まさかこうなるとは……"
"10043080-48-レイ" = "ど、どうしましょう、監督！誰か代打はいないんですか……？"
"10043080-49-監督" = "い、今残っているバッターは？"
"10043080-50-自称野手研究家" = "……打率六分九厘の打者と、五分三厘の打者だけだ。"
"10043080-51-自称野手研究家" = "……ま、そのへんのやつに振らせた方がマシだな。"
"10043080-52-自称投手研究家" = "くっ……今回も負けるのか……！"
"10043080-56" = "[ns] \"……1つだけ方法が！\""
"10043080-61-監督" = "せ、先生……？"
"10043080-62-レイ" = "どんな方法ですか！？"
"10043080-63" = "[s] \"レイ。\""
"10043080-64-レイ" = "なんですか？"
"10043080-65" = "[s] \"バッターボックスに立とう。\""
"10043080-69-レイ" = "……え？"
"10043080-70-レイ" = "わ、私……？"
"10043080-71-レイ" = "ここで打てるのは……私しかいない、ですか？"
"10043080-72-レイ" = "……ミレニアム野球部の4番バッターの出番ですって！？"
"10043080-73-レイ" = "ちょっと待ってください！"
"10043080-74-レイ" = "いくらなんでも無茶ぶりですよ！"
"10043080-75-レイ" = "私の実力くらい、わかってるはずなのに……"
"10043080-80-レイ" = "せ、先生！？！？"
"10043080-84" = "（レイの両肩を力強く掴む）"
"10043080-85-レイ" = "せ、先生、痛……くはないですが……。"
"10043080-86-レイ" = "ちょっと……近いです……。"
"10043080-87" = "[s] レイと目を合わせる。"
"10043080-88-レイ" = "せ、せん……！"
"10043080-89" = "[s] \"いつも通りやれば、大丈夫！\""
"10043080-90-レイ" = "ど、どこからその自信が！？"
"10043080-91" = "[s1] \"レイの打率は8分。つまり8パーセント。\"\n[s2] \"今いる誰よりも、首位打者に近い！\""
"10043080-94-レイ" = "……ええ？"
"10043080-95" = "[ns3] \"自分を信じて！\"\n[ns4] \"それか……私を信じて！\""
"10043080-99" = "[ns5] \"ブレーブスが負けるのは……\"\n[ns6] \"今日に限った話じゃないんでしょ？\""
"10043080-104-レイ" = "そ、それを言われると……！"
"10043080-105-犯人" = "は、反論できない……。"
"10043080-106-監督" = "う、うっ……！"
"10043080-107-監督" = "うむ……最近の野球は、統計と理論が重視されつつあるが……。"
"10043080-108-監督" = "最後に勝負を決めるのは数字じゃない――"
"10043080-109-監督" = "――人だ！"
"10043080-111-スミレ" = "レイさん。何度負けても、多くのファンがこのチームを応援し続けています。"
"10043080-112-スミレ" = "これこそ、確率や統計では測れない現象ではないですか。"
"10043080-113-スミレ" = "トレーニング部の部長として、私も応援しています。"
"10043080-118-レイ" = "先輩……！"
"10043080-124-レイ" = "……行ってきます。"
"10043080-137-アナウンサー" = "おや！？打席に立ったのは、今回初登場の選手です！"
"10043080-138-アナウンサー" = "あの人物は一体誰なのか……！スタジアムの期待が高まります！"
"10043080-142-期待するファンA" = "代打の人、誰だろう……？"
"10043080-143-期待するファンB" = "9回裏2アウトで、まだ主力バッターが残っていたなんて……。"
"10043080-148-そわそわするファン" = "た、頼む！なんとかしてくれっ！"
"10043080-149-緊張したファン" = "ああもう……ヒヤヒヤして見てられない！"
"10043080-150-祈るファン" = "か、神様仏様なんとか様……ううぅ…！"
"10043080-153-解説者" = "3ボール2ストライク……フルカウントです。そして、9回裏満塁。"
"10043080-154-解説者" = "ここですべてが決まると言っていいでしょう。"
"10043080-159-アナウンサー" = "……ピッチャーが一塁へ牽制！幸い、ランナーの足が速かった！"
"10043080-160-解説者" = "ピッチャーも緊張しているようですね……。"
"10043080-166-レイ" = "（みんなの歓声も）"
"10043080-167-レイ" = "（あふれる熱気も）"
"10043080-168-レイ" = "（今の私には聞こえないし……感じない……）"
"10043080-172-アナウンサー" = "ピッチャー、再び牽制！今度は三塁！"
"10043080-173-レイ" = "（先生は、自分を信じろって言っていた）"
"10043080-174-レイ" = "（それか、先生の判断を信じてって）"
"10043080-175-レイ" = "（正直、やれるかは分からない……）"
"10043080-179-スミレ" = "トレーニング部の部長として、私も応援しています。"
"10043080-180-レイ" = "（でも、先輩が、みんなが、応援してくれてる）"
"10043080-186-監督" = "……納得いく試合なんてないさ。"
"10043080-187-レイ" = "（……ほんと、そうだよね）"
"10043080-193-ハナエ" = "私の応援が、誰かの勇気になるのなら――"
"10043080-194-レイ" = "（そして……）"
"10043080-197" = "[log]みんなを見守るのが――[/log]"
"10043080-199" = "[log]――好きだから、かな。[/log]"
"10043080-203-レイ" = "（諦めようとして）"
"10043080-204-レイ" = "（それでも、諦めきれないこと……）"
"10043080-205-レイ" = "（……）"
"10043080-206-レイ" = "（……いつも通りやればいい）"
"10043080-207-レイ" = "（……そうですよね）"
"10043080-211-アナウンサー" = "ピッチャー振りかぶって……勝負の一球！"
"10043080-214-スミレ" = "頑張ってください！"
"10043080-215-スミレ" = "結果なんて、気にしなくていいんです！"
"10043080-216-スミレ" = "レイさん……諦めずに、進み続けてください！"
"10043080-240-アナウンサー" = "打った！！！"
"10043080-241-解説者" = "これは……！"
"10043080-242-アナウンサー" = "飛んだ！これは大きい……！外野フェンスを越えて行きそうだぞぉ！？"
"10043080-243-解説者" = "これは会心の一発です！"
"10043080-248-アナウンサー" = "越えた！越えた！放物線がフェンスを越えました！"
"10043080-249-アナウンサー" = "コーギー・ブレーブス！！最後の最後で、逆転サヨナラ満塁ホームランです！！！"
"10043080-250-解説者" = "いやぁ、こんな奇跡ってあるんですねぇ……！"
"10043080-251-アナウンサー" = "コーギー・ブレーブス！！歴史的初勝利が、今この瞬間、歴史に刻まれました！"
"10043080-254-レイ" = "（みんながなんと言っていたのかは、あまり覚えていない）"
"10043080-255-レイ" = "（ただ、全力でバットを振った後は……）"
"10043080-258-レイ" = "（弧を描く白い影を、目で追い続けていた）"
"10043080-263-感激したファンA" = "やったあぁぁぁぁ！私たちの勝ちよーっ！"
"10043080-264-感激したファンB" = "っしゃああああぁぁっ！"
"10043080-266-涙を流すファン" = "う、うぅっ……生きているうちにこの日を迎えられるなんて……！"
"10043080-272-気絶していたファン" = "……え？サヨナラで！？ブレーブスが勝った！？マジ！？"
"10043080-273-半信半疑のファン" = "……これ、夢じゃないよね！？"
"10043080-277-犯人" = "ありがとうございます……。"
"10043080-278-犯人" = "まさか、本当に勝つなんて……。"
"10043080-279-犯人" = "この瞬間を……何度夢見たことか……。"
"10043080-283-監督" = "長かった……本当に……。"
"10043080-284-監督" = "い、いや、まだだ！これは我々の始まりにすぎん！"
"10043080-287-ハナエ" = "凄い歓声ですね……！"
"10043080-291-ハナエ" = "皆さんとっても楽しそうで、なによりです！"
