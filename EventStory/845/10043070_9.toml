[translation]
"10043070-1" = "第7話;球場に落ちているもの"
"10043070-9-犯人" = "……8回裏、得点どころか、攻撃もできなかった……残塁は一塁、三塁――"
"10043070-10-犯人" = "無死一、三塁で単打すら打てないなんて……なんなんだよこのチーム！"
"10043070-11-犯人" = "さっきからゴロばっか！もう……引退しろよ！"
"10043070-18-自称野手研究家" = "落ち着けって……こんなの日常茶飯事だろ……。"
"10043070-19-自称投手研究家" = "幸い、9回表までクローザーは使わずに済んだ。#nレイダースの打線を分析して、初球でスライダーで投げれば……。"
"10043070-21-犯人" = "……なんでブレーブスはここまで勝てないんだ！？"
"10043070-22-犯人" = "打順はめちゃくちゃに変わるし、先発ピッチャーはブルペンで投球練習を始める始末！"
"10043070-23-犯人" = "有望選手は有望なだけ……監督はズレた指示しかしない！"
"10043070-24-犯人" = "三塁ベースコーチは、壊れた信号機ときてる！"
"10043070-25-犯人" = "褒められるのは熱い応援歌だけだ！"
"10043070-31-警備員" = "あの……あまり大声を出しては……。"
"10043070-32-警備員" = "周囲のご迷惑になってしまいますから……。"
"10043070-33-警備員" = "あ、あと……ドリンク、美味しかったです。"
"10043070-35-自称野手研究家" = "ああ。好きなだけ頼んでいいからな。"
"10043070-36-犯人" = "ふぅ……落ち着け……冷静になれ……。"
"10043070-37-犯人" = "まだだ……3点差まで詰めたんだ。逆転できないわけじゃない。"
"10043070-41-犯人" = "9回表を守り切れば、裏の攻撃は8番から始まる……！"
"10043070-42-犯人" = "上手くいけば、4番まで回せるんだ……！"
"10043070-43-自称野手研究家" = "……ああ！"
"10043070-44-自称投手研究家" = "（毎回、2～3点差までは行くんだけどな……）"
"10043070-51-犯人" = "なんだ！？"
"10043070-55-警備員" = "た、大変です！"
"10043070-60-レイ" = "本当にここだったんですね！"
"10043070-61-スミレ" = "監督！こちらです！"
"10043070-67-監督" = "ついに見つけたぞ！"
"10043070-72-自称投手研究家" = "どどどうしよう！バレたぞ！"
"10043070-73-犯人" = "捕まってたまるか！"
"10043070-77-レイ" = "と、止まってください！"
"10043070-84-警備員" = "ど、どこへ行くんですか！？"
"10043070-85-警備員" = "みんな！護衛対象が移動したぞ！"
"10043070-92" = "[ns] \"あっちだ！\""
"10043070-98-スミレ" = "観客に紛れ込もうとしても無駄です……。"
"10043070-99-スミレ" = "このスタジアムにいる方々の顔は、既に把握しています！"
"10043070-100-レイ" = "こんなことをした理由を、聞かせてもらいますよ！"
"10043070-108-監督" = "お前たちか！脅迫電話で妨害してきたのは！"
"10043070-109-犯人" = "妨害、だと……？"
"10043070-114-犯人" = "馬鹿言うな！足手まといはお前らだろ！"
"10043070-115-犯人" = "それ以上来るな！近付いたら――"
"10043070-121-市民" = "きゃあぁっ！？"
"10043070-122-犯人" = "こいつが食ってるおにぎりは俺のものだ！"
"10043070-123-市民" = "や、やめて！それは今年の新米で作ったおにぎりなの……！"
"10043070-128-4番バッター" = "よせ！ファンに手を出すな！"
"10043070-132-犯人" = "な、なんでブレーブスの4番がここに！？"
"10043070-134-4番バッター" = "当然だろ……ファンを傷つけさせはしない！"
"10043070-135-4番バッター" = "ファンあっての私たちだ！"
"10043070-137-犯人" = "いいからお前は試合に戻れ！！！"
"10043070-143-警備員" = "あっちだ！護衛対象を確認！"
"10043070-144-警備員" = "お待たせしました！さ、さあ、指示を！"
"10043070-146-犯人" = "ちっ……制圧しろ！選手たちに怪我はさせるなよ！"
"10043070-147-犯人" = "監督は……どうなってもいい！"
"10043070-152-警備員" = "難しいこと言いますね……。"
"10043070-154-監督" = "私の扱いだけひどくないか！？"
"10043070-160" = "[ns] \"なんとなく、事情が分かったような……。\""
"10043070-161-スミレ" = "そうですか？私にはあまり……。"
"10043070-162-スミレ" = "……。"
"10043070-164-スミレ" = "ですが……無事解決したら、全員でトレーニングをしましょう！"
"10043070-165-レイ" = "せ、先輩、ひとまずは戦いの方を！"
