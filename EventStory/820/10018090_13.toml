[translation]
"10018090-1" = "第9話;二人の覚悟"
"10018090-3-フウカ" = "ふぅ……。"
"10018090-4" = "[s] \"フウカ、大丈夫？\""
"10018090-8-フウカ" = "あ、先生。"
"10018090-9-フウカ" = "はい、大丈夫です。それにまだやることもたくさん残っていますから。"
"10018090-10" = "[s1] \"あまり無理をするのも良くないよ。\"\n[s2] \"せめて少し休憩してきたらどうかな？\""
"10018090-15-フウカ" = "それでは……"
"10018090-19-フウカ" = "お言葉に甘えて。少し散歩でもしてきます。"
"10018090-24-ハルナ" = "……。"
"10018090-25" = "[s] \"ハルナもフウカに負担をかけすぎてないか心配なんだよね？\""
"10018090-26-ハルナ" = "まだ何も言っていませんが……。"
"10018090-27" = "[s] \"でもハルナがフウカを見守っていたのは知ってるよ。\""
"10018090-31-ハルナ" = "先生に隠し事はできませんね。"
"10018090-32-ハルナ" = "ええ、傍目に見ても明らかに限界ですわ。"
"10018090-33-ハルナ" = "しかし、何を思い悩んでいるのか、それが分かりません。"
"10018090-34" = "[s] \"ハルナの気持ちは？\""
"10018090-35-ハルナ" = "……私の気持ち、ですか。"
"10018090-36-ハルナ" = "先生には意表を突かれてばかりのような気がします。"
"10018090-40-ハルナ" = "私は……負けたくありません。いえ、負けてはいけないと思います。"
"10018090-41-ハルナ" = "美食のためだけではありません。スズメ亭には、多くの人の思いがかかっています。"
"10018090-42-ハルナ" = "しかし、この対決で勝つために必要なのは……私の力ではありません。"
"10018090-43-ハルナ" = "それが、その事実が悔しいですわ。"
"10018090-44" = "[s] \"ハルナにできること、きっと残っているよ。\""
"10018090-45-ハルナ" = "そう……でしょうか？"
"10018090-46" = "[s] \"うん、私はそう思うよ。\""
"10018090-54-ハルナ" = "……教えていただけませんか？"
"10018090-55" = "[ns] \"それはね……。\""
"10018090-61-ジュリ" = "だ、誰かフウカ先輩に何かあったか知りませんか？"
"10018090-63-ジュリ" = "スクーターに乗ってゲヘナのほうに行ったみたいなんですが、心配で……。"
"10018090-66-ジュリ" = "なるほど。気分転換に出たんですね。それなら安心です。"
"10018090-67" = "[s] \"フウカの場所に心当たりはある？\""
"10018090-71-ジュリ" = "はい……たぶん、あそこだと思います！"
"10018090-75-ハルナ" = "本当に……フウカさんはここにいるのでしょうか？"
"10018090-76" = "[s] \"ジュリが言うんだから、私は信じてるよ。\""
"10018090-77-ハルナ" = "それは私もですが……"
"10018090-78-ハルナ" = "気晴らしに訪れる場所が、いつも働いている給食部の屋上とは信じがたくて……。"
"10018090-83-ハルナ" = "……あら、驚きました。本当にあそこにいますわ。"
"10018090-84" = "[s] \"それじゃあ、後はハルナに任せるよ。\""
"10018090-88-ハルナ" = "な、なぜでしょう？こういうときこそ、先生の出番なのではないでしょうか？"
"10018090-89" = "[s] \"今日はハルナに行ってほしいんだ。\""
"10018090-93-ハルナ" = "……理由を、聞いてもよろしいでしょうか？"
"10018090-94" = "[ns] \"ハルナは同じ生徒の立場として、\""
"10018090-96" = "[ns] \"フウカのことを理解しているはずだから。\""
"10018090-97-ハルナ" = "そう言っていただけるのは、素直にありがたいものですが……。"
"10018090-98-ハルナ" = "しかし、フウカさんにとっての料理、私にとっての食事のように、ここは先生が適任なのではないでしょうか？"
"10018090-99-ハルナ" = "はい？だからこそ私が適任と……？"
"10018090-100-ハルナ" = "……。"
"10018090-101-ハルナ" = "……分かりました。"
"10018090-102-ハルナ" = "先生がそこまで仰るのなら……。"
"10018090-107-フウカ" = "……誰か登ってくる音が聞こえると思ったら、ハルナだったんだ。"
"10018090-108-ハルナ" = "失礼しますわ。"
"10018090-109-フウカ" = "よくここが分かったね。ジュリが教えてくれたんでしょう？"
"10018090-110-ハルナ" = "その通りですわ。迷惑でしたか？"
"10018090-111-フウカ" = "仕事の続きなら心配しないで。すぐに戻るよ。"
"10018090-112-フウカ" = "でも少しだけ……時間をちょうだい。"
"10018090-113-ハルナ" = "屋上がお好きなのですね。"
"10018090-114-フウカ" = "そうだね。いつも給食部の仕事が忙しいから、遠くに行く余裕もなくって。"
"10018090-115-フウカ" = "息抜きするとなったら、ここくらいのものだから。それで、いつの間にか落ち着ける場所になったの。"
"10018090-116-ハルナ" = "料理対決……やはりフウカさんとしては複雑ですか？"
"10018090-117-フウカ" = "嫌じゃないと言えば嘘になるかな。"
"10018090-118-フウカ" = "私は何と戦っているのか悩んで……。"
"10018090-119-ハルナ" = "当然、人々を騙して美食の道を乱すニャオフードですわ。"
"10018090-120-フウカ" = "私、グルメヘルメット団とハルナの話を聞いたよ。"
"10018090-124-ハルナ" = "……アカリからですか？"
"10018090-125-フウカ" = "うん。"
"10018090-126-ハルナ" = "そうでしたか……それで悩んでいたのですね。"
"10018090-127-フウカ" = "私たちが勝てば、ニャオフードで働く人たちは職を失うことになるのかな？"
"10018090-128-ハルナ" = "……その可能性がないとは言いませんわ。"
"10018090-129-ハルナ" = "スズメ亭がニャオフードの圧力を跳ね除けることになれば、"
"10018090-130-ハルナ" = "周りも自分の店を守ろうと諦めなくなるでしょう。"
"10018090-131-ハルナ" = "それが結果としてニャオフードの業績を下げることにつながれば……。"
"10018090-132-ハルナ" = "仕事量も減って、解雇される人も出てくるはずですわ。"
"10018090-133-フウカ" = "うん……。私が気になってるのはそこなんだ。"
"10018090-134-フウカ" = "それに商人のなかには、ニャオフードの肩を持つ人がいるのも確かだよ。"
"10018090-135-フウカ" = "直接言われたわけじゃないけど、余計なことをするなって視線を感じたのも確かだし。"
"10018090-136-ハルナ" = "ありのままが良い人もいるものですから。"
"10018090-137-ハルナ" = "もちろん、私は変化を好みますが。"
"10018090-138-フウカ" = "ふふっ。ハルナの言う変化のせいで、私は苦労することも多いんだけどね。"
"10018090-139-ハルナ" = "あら。そうでしたか？"
"10018090-140-フウカ" = "私はスズメ亭を助けたいと思っただけなのに。"
"10018090-141-フウカ" = "どうしてこんな大事になったんだろう。"
"10018090-142-ハルナ" = "フウカさんが一番気にしていることは何でしょうか？"
"10018090-143-フウカ" = "私たちが勝つことで、負けて何かを失う人たちのこと。"
"10018090-144-フウカ" = "私は誰かが苦しんでいるのは嫌なの。それで給食部に入ったところもあるから。"
"10018090-148-ハルナ" = "……私たちについては、どう思っていますか？"
"10018090-149-フウカ" = "ハルナたちも同じだよ。私にとって食堂に来てくれる人たちは、みんな面倒を見なくちゃいけない生徒だよ。"
"10018090-150-ハルナ" = "グルメヘルメット団も似たような存在ということですね。"
"10018090-151-フウカ" = "変だよね。私たちを邪魔してきてるのに。"
"10018090-156-ハルナ" = "フウカさん。"
"10018090-158-フウカ" = "ん？"
"10018090-160-ハルナ" = "美食に犠牲はつきものです。#n躊躇っていては、素晴らしいお店はこうしてどんどん消えていってしまう――"
"10018090-161-ハルナ" = "それを、ただ指を咥えて見ているだけなんてできません。#nだから私たちは戦っているのでしょう？"
"10018090-162-フウカ" = "……そう、だね。"
"10018090-163-ハルナ" = "ええ。それに、ニャオフードは手加減しないはずですわ。"
"10018090-167-ハルナ" = "あちらは手段を選ばずに潰してこようとしています。"
"10018090-168-ハルナ" = "それにあちら側は、この勝負で負けたところで失うものは少ないです。"
"10018090-169-ハルナ" = "社員の待遇が悪くなったり、解雇される人が出るかもしれません。ですが、それらは可能性の話ですわ。"
"10018090-172-ハルナ" = "それに対してスズメ亭の女将は、負けたら全てを失います。"
"10018090-173-ハルナ" = "可能性などではなく、確実に。"
"10018090-174-フウカ" = "それは……そうだね。"
"10018090-177-ハルナ" = "そして被害を受けるのは、スズメ亭の女将だけではありません。"
"10018090-178-ハルナ" = "商店街の人たちです。彼らも被害者と呼べますわね。"
"10018090-179-フウカ" = "どうして？"
"10018090-185-ハルナ" = "真の美食を味わえなくなってしまうわけですから、当然でしょう？"
"10018090-191-フウカ" = "……ふふっ。"
"10018090-192-ハルナ" = "な、なぜ笑うのですか！？"
"10018090-193-フウカ" = "いや、なんかハルナらしいなって思って。"
"10018090-194-ハルナ" = "こほん。"
"10018090-195-ハルナ" = "とにかく、私は美食においてだけは本気ですわ。一歩も譲る気などありません。"
"10018090-196-ハルナ" = "そして、それはあなたも同じですよね、フウカさん。"
"10018090-197-フウカ" = "私……？"
"10018090-198-ハルナ" = "あなたは本当の実力を見せたことがほとんどありませんよね。"
"10018090-199-ハルナ" = "そういう機会がなかったといえば、そうなんでしょうが。"
"10018090-201-ハルナ" = "ですが今こそチャンスです。あなたの実力を見せる絶好の機会ですわ。"
"10018090-203-フウカ" = "そうだね。"
"10018090-204-フウカ" = "ハルナが本気を出すんだから、私も頑張らなきゃね。"
"10018090-205-ハルナ" = "ええ、ここまで来てしまいましたから。"
"10018090-206-フウカ" = "ふふっ、そこに隠れている先生のおかげでね。"
"10018090-211-フウカ" = "先生、出てきてください。"
"10018090-212-フウカ" = "そこにいらっしゃいますよね？"
"10018090-213" = "[s] \"バレてたの？\""
"10018090-215-フウカ" = "なんとなく、近くにいるような気がしたんです。"
"10018090-220-フウカ" = "卵に出汁を混ぜて……"
"10018090-224-フウカ" = "後は砂糖と醤油、みりん……。"
"10018090-225-フウカ" = "数の子はどうなってますか？"
"10018090-226-女将" = "はい、漬け込みました。次はお魚を焼いて……。"
"10018090-227-フウカ" = "エビもふっくら仕上がってますね。"
"10018090-232-フウカ" = "食べる直前まで煮汁に浸しておいて……。"
"10018090-236-ジュリ" = "先輩！にんじんを切り終わりました！"
"10018090-237-フウカ" = "ありがとう！"
"10018090-238-フウカ" = "あ、サトイモのこと忘れてた……。"
"10018090-244-ハルナ" = "ふふっ。素敵な光景ですね。"
"10018090-245-ハルナ" = "女将さんと給食部が力を合わせておせちを作り、美食研究会がそれをサポートするなんて。"
"10018090-247-アカリ" = "味見するという建前でたくさん食べてるだけですけどね★"
"10018090-248-ジュンコ" = "これも仕事なんだからね。味見が終わったら次に使う食材を運ぶわよ。"
"10018090-249-イズミ" = "わぁ～幸せ！毎日こんな風に食べられたらいいのに！"
"10018090-259-ニャオモト・カン" = "ムッフフフ。おせちの生産ラインはどうかね？"
"10018090-260-グルメヘルメット団E" = "順調に進んでいます。煮沸ライン、漬物ライン、焼き物ライン、全て稼働中です。"
"10018090-261-ニャオモト・カン" = "大量生産！大量消費！ベルトコンベア！"
"10018090-262-ニャオモト・カン" = "これこそがニャオフードの食品工場！"
"10018090-264-ニャオモト・カン" = "さあ、働け働け！仕事があってこその人生だろう！"
"10018090-269-グルメヘルメット団E" = "すでにみんな時間外勤務なんですが……。"
