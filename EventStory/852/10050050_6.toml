[translation]
"10050050-1" = "第5話;冬の国の公女様"
"10050050-2" = "どこかの体育館"
"10050050-4-トリニティの生徒A" = "列はこちらです！まだ在庫は残っていますので！"
"10050050-8-トリニティの生徒D" = "走らないでください！順番に！#nあと、秘密厳守でお願いします！"
"10050050-11-ヤクモ" = "トリニティの方々が頒布を手伝ってくださるとは……これもまた「文化」の力なのでしょう。ムフフ。"
"10050050-12-タカネ" = "ええ。文化……ソフト・パワーは、自発的に人を動かすという点に最大の魅力がありますわ。"
"10050050-13-タカネ" = "せっかくですし、キヴォトス最大規模と言われている中央図書館や、古書館も一目見れたらよかったのですが……。"
"10050050-14-ヤクモ" = "そのうちチャンスが巡ってくるでしょう。評論家のタカネが興味を持つのも理解できます。"
"10050050-15-タカネ" = "部長は違うのですか？"
"10050050-16-ヤクモ" = "ええ、全く興味がありません。それらを私の好きにできて、売上に繋げられるのならまた話は別ですけどねぇ。"
"10050050-17-ヤクモ" = "可能性のないものにまで時間を割く暇はないといいますか。"
"10050050-18-タカネ" = "……その割には添削とか、編集に力を入れているように見えますが。"
"10050050-19-ヤクモ" = "ただの添削や編集じゃありませんよ？原石を磨いているのです。商品価値の再発見というわけです。"
"10050050-20-ヤクモ" = "そしてその延長線上で……タカネにだって、頑張って頂きたいのですよ！"
"10050050-21-タカネ" = "うっ……！またあれをやるのですか……？"
"10050050-22-ヤクモ" = "どうしても嫌というなら強制はしません……でも、もう皆さん知っているじゃありませんか。"
"10050050-23-ヤクモ" = "タ・カ・ネ・姫？"
"10050050-24-タカネ" = "はぅっ！？"
"10050050-26-トリニティの生徒A" = "ああ、そうでした。タカネ姫！今回の3巻と4巻についてのご感想を伺いたいのですが。"
"10050050-27-タカネ" = "はっ、はぅぅういっ！？わわ、分かりましたわ……私の感想で、よろしければ……。"
"10050050-28-トリニティの生徒D" = "もちろんです！そもそもこの作品は、トリニティでは珍しい――"
"10050050-29-トリニティの生徒D" = "レッドウィンター特有の根気強さと野性味があって、とても現実的に描かれていますが……。"
"10050050-30-トリニティの生徒D" = "最後まで美しさを手放さない、どこか強い意志を感じるのです！#nだからこそ人気があるのでしょう！"
"10050050-31-トリニティの生徒A" = "作品の「意志」を納得できるよう説明できるお方は、タカネ姫だけなのです！"
"10050050-32-タカネ" = "そ、そそそう言っていただけるのは、嬉しいかぎりですが……。"
"10050050-33-トリニティの生徒D" = "もう、謙虚なんですから！さすがレッドウィンター……いいえ、冬の国の公女様は、身も心も清らかなのですね！"
"10050050-35-タカネ" = "これ、どうするつもりですか部長！？#n私はレッドウィンターの普通の生徒ですよ！？"
"10050050-36-タカネ" = "どうして私が「レッドウィンターの没落した名家の末っ子」になってしまったのです……！"
"10050050-37-ヤクモ" = "答えはシンプルです、タカネ。それはもちろん……。"
"10050050-38-ヤクモ" = "そっちの方が売れるから、です！"
"10050050-39-トリニティの生徒B" = "タカネ姫はレッドウィンターの名家の末っ子とお聞きしました。"
"10050050-40-トリニティの生徒C" = "紆余曲折の末、没落の道をたどり……。"
"10050050-41-トリニティの生徒C" = "一家全員が退学を命じられ、レッドウィンターを追放されたと……胸が痛い話ですわ。"
"10050050-42-タカネ" = "え、ええ。恐れ入ります……。"
"10050050-43-トリニティの生徒A" = "そんな中、真面目な付き人のおかげで、タカネ姫だけが出身を隠して生き延びられた……本当にすごいですわ！"
"10050050-44-トリニティの生徒D" = "本の中の物語のような、波乱万丈な人生を歩んだ方と話せるだなんて……。"
"10050050-45-トリニティの生徒D" = "本当に光栄です！"
"10050050-46-タカネ" = "（だって、本で読んだ話を元にしたのですから……）"
"10050050-47-トリニティの生徒B" = "お姉さま方の件は残念です……。ええと、3人のお姉さま方とタカネ姫の名前の頭文字を取って、日記に「OAMT」と書かれていましたね……？ですが皆さんは……。"
"10050050-48-トリニティの生徒C" = "写真が趣味と仰ってましたよね？今度ぜひ見せてくださいね！"
"10050050-49-タカネ" = "（それだけは本当の話ですが……他はもうめちゃくちゃですわ）"
"10050050-50-トリニティの生徒A" = "実は専門的な評論を聞いたのは初めてなんです。しかも姫君の口から語られるなんて……。"
"10050050-51-トリニティの生徒B" = "私たちツイてましたね……！ちなみに、評論集の出版のご予定は？"
"10050050-52-ヤクモ" = "ふむ？これはまた新たなビジネスの予感が。"
"10050050-53-タカネ" = "やめてください！！"
"10050050-55-こっそり訪ねてきた生徒" = "あ、あの……友人から、例の話を聞いて来たのですが……。"
"10050050-56-ヤクモ" = "ささ、どうぞどうぞ。こういうのはまず始めることが肝要です。1冊いかがです？"
"10050050-57-こっそり訪ねてきた生徒" = "あ、ありがとうございます……！"
"10050050-58-こっそり訪ねてきた生徒" = "……！！"
"10050050-59-こっそり訪ねてきた生徒" = "なっ、ななんて破廉恥なっ！？"
"10050050-64-タカネ" = "ど、どうしましょう部長？大丈夫でしょうか……！？"
"10050050-65-ヤクモ" = "大丈夫大丈夫、そのうち帰ってきますから。これは直感です。"
"10050050-66-タカネ" = "だといいのですが……。"
"10050050-73-タカネ" = "そんな……！？"
"10050050-74-ヤクモ" = "ムフフフフ。"
"10050050-75-こっそり訪ねてきた生徒" = "あの、いや別に次が気になって戻ってきた、とかじゃないんですけど……。"
"10050050-76-こっそり訪ねてきた生徒" = "い、一応読み始めたからには、最後までついていくべきじゃないかな、っていう使命感で……。"
"10050050-77-ヤクモ" = "ええ、ええ！もちろんです。分かっておりますとも。"
"10050050-78-こっそり訪ねてきた生徒" = "あ……ありがとうございます。続き……ありますか？"
"10050050-79-ヤクモ" = "ありますとも。どんなストーリーも次があるべきです。ショーが続いていくようにね。"
"10050050-80-ヤクモ" = "むしろ感謝するのはこちらです。"
"10050050-81-こっそり訪ねてきた生徒" = "そ、そうなんですか？"
"10050050-82-ヤクモ" = "もしこの本があのままレッドウィンターで眠っていたら、きっと誰にもこの価値を分かってもらえず、ただ忘れ去られてしまったことでしょう。"
"10050050-83-ヤクモ" = "……売り場というリングで、パンチ一つ残せずに。"
"10050050-84-ヤクモ" = "負けてこそスッキリするものですが、チャンスさえ与えられないのは悲しき事態です。"
"10050050-85-こっそり訪ねてきた生徒" = "たしかに、そうかも……。"
"10050050-86-ヤクモ" = "ええ！そんなあなたには、3冊ではなく2冊の購入をオススメしましょう。"
"10050050-87-こっそり訪ねてきた生徒" = "でも、ここには3冊が暗黙の了解だって……。"
"10050050-88-ヤクモ" = "ですが、布教はどこか照れくさいのでしょう？2冊で十分では？"
"10050050-89-こっそり訪ねてきた生徒" = "じゃ、じゃあ2冊ください……。"
"10050050-91-タカネ" = "――ですから、[ruby=せい]生[/ruby]のとある部分は排除され、とある部分は受け入れられることに矛盾が生じるのは当然です。"
"10050050-92-タカネ" = "羞恥を感じ、話題にしにくいものこそ、私たちの本質を分かりやすく説明しているのではないでしょうか？"
"10050050-93-タカネ" = "たとえば「愛」。これは表立って話すのは難しい話題と扱われがちです。しかし必要不可欠な感情であることを知らぬ者はいません。"
"10050050-94-タカネ" = "愛がなければ……ここに皆さんは存在していないのですから。"
"10050050-95-タカネ" = "私たちのカラダのことも然り。衣服の下の話は口にしないのがレディのたしなみと言われていますが……。"
"10050050-96-タカネ" = "それでも私たちは、カラダとともに生きていく存在です。"
"10050050-97-タカネ" = "そしてこちらは、そんな矛盾と私たちが惹かれる対象について、率直でありながらも、能動的な対話を試みています。"
"10050050-98-タカネ" = "私たちをより良い認識の地平へと導く、純粋な意志が込められた最高傑作といえるでしょう。"
"10050050-99-トリニティの生徒A" = "きゃ～～っ！！"
"10050050-100-トリニティの生徒B" = "タカネ姫～～！！"
"10050050-101-トリニティの生徒C" = "やはり高貴な方は違いますわ！"
"10050050-102-トリニティの生徒D" = "私たちはもっと、自分に正直になっていいのですね……？"
"10050050-103-タカネ" = "（胃が痛くて倒れそうですわ……）"
"10050050-108-ヤクモ" = "ほう、大盛況と……。"
"10050050-109-ヤクモ" = "しかし、ちょっとばかり物足りないような……むむ。"
"10050050-110-積極的な生徒" = "あの……こういう本はないですか？"
"10050050-111-ヤクモ" = "どういうものでしょうか？"
"10050050-112-積極的な生徒" = "えっと……。"
"10050050-116-ヤクモ" = "んー……残念ながら、それとピッタリ一致する本はまだ無いものでして……。"
"10050050-117-積極的な生徒" = "そうですか……。"
"10050050-118-ヤクモ" = "いや……「まだ」ない……ってことは？"
"10050050-119-ヤクモ" = "少々お待ちを！なんとかなるかもしれません！"
"10050050-120-積極的な生徒" = "本当ですか！？"
"10050050-121-ヤクモ" = "の前に、企画書を一ついただけません？"
"10050050-122-積極的な生徒" = "企画書……？そ、そういうのは私作ったことが……。"
"10050050-123-ヤクモ" = "大丈夫ですよ。二行くらいでいいです。こういうキャラがいてほしいとか、こういう内容だといいな、くらいで構いませんので。"
"10050050-124-積極的な生徒" = "わ……分かりました。"
"10050050-129-メル" = "今度はなに？ヤクモ。急に売れなくなったとか、そういう話じゃないよね？"
"10050050-130-メル" = "まあ、昨日までの分でなんとか一息つけたけどさ。礼は言っとく。"
"10050050-131-ヤクモ" = "おや？メルが自分から礼を言うようになるなんて。あと、売り上げは変わらず好調ですのでご心配なく。"
"10050050-132-ヤクモ" = "それより今からカンタンな企画書を送りますので、これをいい感じに作ってください。早ければ早いほどいいです。"
"10050050-133-メル" = "えっ？なんで私が？あんたまた変な金稼ぎしようとしてるんでしょ。"
"10050050-134-ヤクモ" = "よく聞いてくださいよメル。私はいま現場でリクエストを受けているのです。これを速く作れば作るほど、言い値で売れるんですから！？"
"10050050-135-メル" = "……要はコミッションでしょ？あれ面倒くさいよ。要求は多いし、完成した後もああだこうだって……。"
"10050050-136-ヤクモ" = "いいえ、その反対です。だから二行の企画書をもらったんですよ。当然足りない部分だらけってわけで。"
"10050050-137-ヤクモ" = "その足りない部分は……全部メルの好きにすればよいのです！"
"10050050-138-メル" = "それで客が満足するかっ！"
"10050050-139-ヤクモ" = "するはずです。だってタカネが全部それらしく説得……いえ、評論するのですから。"
"10050050-141-タカネ" = "私ですか！？"
"10050050-142-ヤクモ" = "メル、これはある意味一次創作ですよ？#n今までずっと一次創作がしたかったのでしょう？"
"10050050-143-メル" = "！！！"
"10050050-144-メル" = "そ、それは……そう、だけど。"
"10050050-145-ヤクモ" = "もちろん100%オリジナルではないものの、要求は少ししかありません。#nあとはメルが好きにできるのです……。"
"10050050-146-ヤクモ" = "これはもうほぼ一次創作と言えるのでは？"
"10050050-147-ヤクモ" = "もちろん、一朝一夕でうまくいくものではありませんが……。#nこれを機に、目標へ向かって一歩踏み出してみるのはどうでしょう？"
"10050050-152-メル" = "やる！"
"10050050-153-ヤクモ" = "よーし成立。ではなるべく早めにお願いしますね。"
"10050050-154-メル" = "ああっもう、今から着手しますから！んじゃ！"
"10050050-158-ヤクモ" = "こちらもまた一件落着っと……ムフフ。"
"10050050-159-タカネ" = "……改めて、部長を敵に回しちゃいけないと思いましたわ。"
"10050050-160-ヤクモ" = "ん～？何のことやら？"
"10050050-162" = "トリニティ外郭・カフェ"
"10050050-163-シミコ" = "お疲れ様でした、先生。"
"10050050-164" = "[s] \"シミコも大変だったでしょ……。\""
"10050050-165-シミコ" = "ふふ、ありがとうございます。ただ、進捗がないのは残念です。"
"10050050-166" = "[s] \"何が原因なんだろうね……？\""
"10050050-167-シミコ" = "先生はどう思われますか？"
"10050050-168-シミコ" = "……。"
"10050050-169-シミコ" = "なるほど。「本の販売者をトリニティの生徒たちが守っているみたい」……ですか。"
"10050050-170-シミコ" = "ここだけの話、私もそう思いました。それで正義実現委員会も手こずっているのではと。"
"10050050-171-シミコ" = "それで先生に、わざわざトリニティの外れまでお越しいただいたのです。"
"10050050-172" = "[s] \"誰か力になってくれる人でも……？\""
"10050050-173-シミコ" = "はい、おそらく。あと先生もよく知っている方です。#nあっ、ちょうどあちらに……。"
"10050050-178-シミコ" = "こんにちは、コハルさん。"
"10050050-179-コハル" = "せ、せせせせ先生！？なんでここに先生が！？！？"
"10050050-180" = "[s] \"あれ？コハルだ。\""
"10050050-181-コハル" = "待って、ここに先生がいるってことは……。"
"10050050-182-コハル" = "やっぱり……。"
"10050050-183-コハル" = "そうだと思った！全部先生のせいなんでしょ！#n私の目はごまかせないんだから変態！！"
"10050050-184" = "[s] \"ちがう！今回は本当に私じゃない！\""
"10050050-185-コハル" = "こ、ここ今回！？じゃあ他のは全部先生なんだ！？死刑！！！"
"10050050-187" = "[ns] \"そっか、それでコハルが……。\""
"10050050-188-シミコ" = "はい、コハルさんが私にサンプルを渡してくださったのです。おかげさまで、少しばかりヒントを得られました。"
"10050050-189" = "[s] \"ちなみになんで正義実現委員会じゃなく、図書委員会側に？\""
"10050050-190-コハル" = "そ、それはっ……！"
"10050050-191-コハル" = "えっと……。"
"10050050-192-コハル" = "なんとなく、みんな……悲しむと思ったから……。"
"10050050-193-コハル" = "他に意味はないよ！？みんな本のことを隠したり、なかったことにしようとしてるのに……。"
"10050050-194-コハル" = "でも……この本のこと、好きみたいだから……。"
"10050050-195-コハル" = "せ、正義実現委員会は悪くないから！与えられた仕事をしてるだけだし！"
"10050050-196-コハル" = "ただそれとは別に、これだけファンがいる本をみんなから奪うのは悲しいと思って……。"
"10050050-197" = "[s] \"コハルもこの本のことが好き？"
"10050050-198-コハル" = "な、なんでそこで私が出るのよ！先生バカ変態死刑！！"
"10050050-199-コハル" = "わわわ私は、こういうのはまったく！全然！興味ないから！！"
"10050050-200-シミコ" = "ではコハルさん、図書委員会がこちらの全巻を揃えた時、見に来ませんか？"
"10050050-201-シミコ" = "正義実現委員会の「エリート」として、内容は確認すべきかなと思いまして。"
"10050050-202-コハル" = "……！"
"10050050-203-コハル" = "分かってるじゃない！仕方ないから特別に確認してあげる！"
"10050050-204-シミコ" = "とんでもありません。大切に扱っていただきありがとうございます。"
"10050050-205-コハル" = "べ、別に！……というか、図書委員会はみんな、そんな風に本を大事にするの？"
"10050050-206-シミコ" = "はい。みんなそうですよ。#n本は一つのタイムマシンですから。"
"10050050-207" = "[s] \"タイムマシン？\""
"10050050-208-シミコ" = "はい。タイムマシン……あくまで比喩としてですけど。"
"10050050-209-コハル" = "どういう意味？"
"10050050-210-シミコ" = "そうですね……世の中には多くの媒体がありますよね？本以外にも。"
"10050050-211-シミコ" = "動画や映画、ゲーム、音楽……#n他にも挙げきれないほどにたくさん。"
"10050050-212-シミコ" = "それらは、私達に情報や物語、時には感情を伝えてくれます。"
"10050050-213-シミコ" = "その中でも、私が本を好きな理由は……心に余裕をもたらしてくれるからです。"
"10050050-214-コハル" = "なんか分かんなくなってきた……。"
"10050050-215-シミコ" = "映画やゲーム、動画はそれを見ている間、それに集中しないといけません。"
"10050050-217-シミコ" = "視覚と聴覚、場合によっては触覚を使って、私たちに情報を伝えようとしていますから。"
"10050050-218-シミコ" = "それらは、より物語の世界に没入しやすくしてくれますが……。"
"10050050-219-シミコ" = "だからこそ他の余裕を許してくれません。"
"10050050-220-シミコ" = "でも本は違います。多くの媒体の中で最も制限が多いものです……#n当然ですが本は少しの画像と、文字ですべてを表現しなければならない。"
"10050050-222-コハル" = "たしかに……。"
"10050050-223-シミコ" = "だからこそ、余白を考える隙間を与えてくれるんです。#n寛大な媒体、といいますか。"
"10050050-224-シミコ" = "私にとって、本を読む行為は、過去との対話でもあります。"
"10050050-225-シミコ" = "全ての書き手は、過去から今に渡ってきた人たちですから……だからタイムマシンに例えてみました。"
"10050050-226" = "[s] \"たしかに本は時間をかけて出版されるもんね。\""
"10050050-227-シミコ" = "はい。本を読んでいると、作者が遠い過去から私に話しかけているような気持ちになるんです。"
"10050050-228-シミコ" = "先ほども言ったように、本は「自分で考える余裕」を私たちに与えてくれるのですから……。"
"10050050-229-シミコ" = "作者に、私なりの考えと答えを返したいと思う、そんな自分がいて……。"
