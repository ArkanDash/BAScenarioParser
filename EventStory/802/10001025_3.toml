[translation]
"10001025-1" = "第2話;昼下がりのクーデター"
"10001025-2" = "レッドウィンター連邦学園・会長執務室"
"10001025-4-チェリノ" = "うぅ……ああもう、うるさいうるさい！いったい何の騒ぎだ！？"
"10001025-5-チェリノ" = "おちおち昼寝もできないではないか！"
"10001025-8-トモエ" = "ちぇ、チェリノちゃん！緊急事態です！"
"10001025-9-チェリノ" = "こら！いくら急ぎの用事だとしても、お昼寝の時間は邪魔するなと言ったはずだ！"
"10001025-10-チェリノ" = "トモエ秘書室長、お前も粛清されたいのか！？"
"10001025-11-トモエ" = "も、申し訳ありません……！"
"10001025-12-トモエ" = "……ですが、緊急事態です。"
"10001025-13-トモエ" = "武装した生徒たちが事務局に押し寄せてきています！"
"10001025-14-チェリノ" = "なんだ、またクーデターか？今回はどこの部活だ？"
"10001025-15-チェリノ" = "「チョコミント解放戦線」か？それとも「唐揚げにレモンをかけることを許さない革命家集団」か？"
"10001025-16-チェリノ" = "まあ、どこだとしてもクーデターなら、マリナ委員長に任せておけばいい。気にするな。"
"10001025-17-チェリノ" = "そんな些細なことでわざわざ――"
"10001025-19-トモエ" = "あの、それが……"
"10001025-20-トモエ" = "クーデターを起こした人がその、他でもないマリナ保安委員長でして。"
"10001025-22-チェリノ" = "……なっ、なんだと！？"
"10001025-26-チェリノ" = "いたた……。"
"10001025-27-トモエ" = "大丈夫ですか、会長！？"
"10001025-28-チェリノ" = "だ、大丈夫……。"
"10001025-29-チェリノ" = "そ、それより！どうしてマリナがクーデターを？おいらは何もしてないのに！"
"10001025-30-トモエ" = "それは、分かりませんが……。"
"10001025-31-チェリノ" = "まさか……この前、マリナが大事に取っておいたプリンをこっそり食べたからか？"
"10001025-32-チェリノ" = "それとも、マリナが大事にしている熊のぬいぐるみに、よだれを垂らしたまま昼寝をしたからか？"
"10001025-33" = "[s] \"……多分、プリンの方じゃないかな？\""
"10001025-34-チェリノ" = "うう……どうしようカムラッド、今からでも新しいプリンを買ってきた方が良いだろうか？"
"10001025-35-チェリノ" = "しかし、今レッドウィンター連邦学園に残ってるのは、水を混ぜた薄味のプリンしかないし……。"
"10001025-36-トモエ" = "とにかくここは危険です。もうすぐマリナ委員長の率いる親衛隊が、事務局に到着します。"
"10001025-37-トモエ" = "銃撃戦になるでしょうし、先生も私たちと一緒に避難しましょう。"
"10001025-38-チェリノ" = "だ、だが、一体どこに逃げるんだ？"
"10001025-39-トモエ" = "レッドウィンターの外郭付近の、旧校舎へ向かいましょう。"
"10001025-40-トモエ" = "あそこに隠れれば、マリナ委員長も簡単には見つけられないかと。そこに一時撤退を。"
"10001025-41-チェリノ" = "そ、そうか、一時的な撤退だな！"
"10001025-42-チェリノ" = "決して逃げるわけじゃない！"
"10001025-44-トモエ" = "はい。さあ、急ぎましょう！"
