[translation]
"10023110-1" = "エピローグ;ハッピーエンドは、いつまでも！"
"10023110-5-モモイ" = "……"
"10023110-6-ミドリ" = "……"
"10023110-7-ユズ" = "ひぃ……"
"10023110-9-アリス" = "うわあぁぁぁん！ネル先輩が怒ってます！アリス、怖いです！"
"10023110-11-ネル" = "あのな、お前ら……"
"10023110-12-モモイ" = "許して、ネル先輩！"
"10023110-13-ネル" = "……あぁ？何の事だよ。"
"10023110-14-モモイ" = "わざわざ言わせないと気が済まないの？#nひどいよ先輩！"
"10023110-15-ネル" = "いや、だから何の事だよ……"
"10023110-16-モモイ" = "みんな、ごめんね！#n私が……私が最初から断ってたら……こんな事にはならなかったはずなのに……！"
"10023110-17-モモイ" = "もう終わりだよ……ネル先輩はカンカンだし……ゲーム開発部は廃部に……#nC&Cの名前を騙った罪は重い……"
"10023110-18-モモイ" = "うぅ……頑張って守ってきた部活なのに……#nアリスもユズも、こうして一緒に居られるようになったのに……！"
"10023110-20-ユズ" = "モモイ……"
"10023110-21-アリス" = "な、泣かないでください。モモイ、アリスは……"
"10023110-22-アリス" = "アリスたちは大丈夫です。#n離れていても心は一緒だと、アリスは学びました……！"
"10023110-24-ネル" = "はぁ……お前ら、何か勘違いしてるみたいだけどよ……"
"10023110-25-ネル" = "あたしはまだ何も……"
"10023110-26-ネル" = "って、いつもあたしの事そう思ってたのか！？"
"10023110-27-アカネ" = "ふふ、どうでしょう？"
"10023110-28-ネル" = "おい、自業自得だって言いてぇのか！？"
"10023110-30-トキ" = "先輩方、申し訳ありません。"
"10023110-31-トキ" = "証拠品は確保しましたが、容疑者を捕らえることができず……"
"10023110-33-ネル" = "ああ、それはあたしらが捕まえたから気にすんな。"
"10023110-34-トキ" = "いえ。私の不手際で先輩方のお手を煩わせてしまったので……"
"10023110-35-ネル" = "別に、んなこと気にすんなよ。#n終わり良ければ全て良しっつうだろ。"
"10023110-36-ネル" = "んで……"
"10023110-41-ネル" = "お前ら。"
"10023110-46-モモイ" = "ひぃっ！？"
"10023110-47-ミドリ" = "い、命だけは……！"
"10023110-49-トキ" = "お待ちください、ネル先輩。"
"10023110-50-ネル" = "あぁん？"
"10023110-51-トキ" = "今回の件……あまりゲーム開発部を責めないでください。"
"10023110-52-ネル" = "ほう？"
"10023110-53-トキ" = "ゲーム開発部は何も悪くありません。"
"10023110-54-トキ" = "本来であれば、先輩方に連絡し、応援を待つべきだったところを、私はしませんでした。"
"10023110-55-トキ" = "そして、ゲーム開発部の仲間として――友人として。#n共に戦う道を選びました。"
"10023110-56-トキ" = "ですから……もし彼女たちに責任があると言うのなら、私も一緒に。"
"10023110-58-アリス" = "そ、そうです。ネル先輩！#nトキとアリスは仲間です。友達です！"
"10023110-59-アリス" = "友達が困っていたら、助け合うとゲームで学びました。#nなので、なので……"
"10023110-61-ネル" = "いや、だから……あたしが言いたいのはな……"
"10023110-62-ネル" = "なんだ、その……"
"10023110-63-ネル" = "よくやった、って。"
"10023110-68-モモイ" = "えっ……？"
"10023110-69-モモイ" = "はっ！？あなたネル先輩そっくりの偽物とかじゃないよね？"
"10023110-71-ネル" = "なに言ってんだ！"
"10023110-72-ネル" = "ったく、人が褒めてやってんのによ……"
"10023110-74-ミドリ" = "えっと……本当に、許してくれるんですか……？"
"10023110-75-ネル" = "あぁん？"
"10023110-79-ネル" = "許すも何も、結果的にちゃんと解決させたんだろ。"
"10023110-80-ネル" = "ならそれで良いって。容疑者も捕まって、証拠品も揃ってるわけだしな。"
"10023110-81-ネル" = "あとは全部ヴァルキューレに渡すだけだろ？"
"10023110-86-モモイ" = "（ネル先輩……身長は小さいけど器は大きいのかも……）"
"10023110-87-ミドリ" = "（お姉ちゃん！言葉に気をつけて！聞こえたらどうするの！）"
"10023110-93-ネル" = "んで、トキ、お前も……"
"10023110-94-トキ" = "はい、どんな処分も受け入れる覚悟は出来ています。"
"10023110-95-ネル" = "だから、そうじゃねぇって……あぁ、ったくよ！"
"10023110-96-ネル" = "まず、なんでバニーガールなんだ？"
"10023110-97-トキ" = "もちろん潜入作戦だからです。"
"10023110-101-ネル" = "……はぁ。"
"10023110-102-ネル" = "だから、あん時あれほど着たくないって……"
"10023110-104-アスナ" = "ん？リーダー、あんなに似合ってたのに？"
"10023110-105-アスナ" = "あはは！トキちゃんも可愛いね！"
"10023110-110-トキ" = "ありがとう、ございます……"
"10023110-111-ネル" = "とにかく！"
"10023110-112-ネル" = "あたしが言いたいのはだな……"
"10023110-114-トキ" = "はい。自粛、謹慎、監禁、どんな内容でも受け入れますので。"
"10023110-115-ネル" = "だから！"
"10023110-116-ネル" = "あぁもう……"
"10023110-117" = "[s1] \"ネルはトキを褒めてるんだよ。\"\n[s2] \"置いてけぼりにしちゃった事、謝りたいんだよね。\""
"10023110-121-ネル" = "せ、先生！？！？"
"10023110-122-ネル" = "くそ……先生がいる事忘れてた……！"
"10023110-124-トキ" = "それは、一体どういう……？"
"10023110-125-ネル" = "あぁもう！だから！"
"10023110-129-ネル" = "……よくやったな。それと……悪かったよ。"
"10023110-130-ネル" = "だから、なんだ。その……お前を置いていきたかったわけじゃねぇから。"
"10023110-131-ネル" = "今回は急な任務で、お前一人に任せるしか無かったんだよ。#nでも、最後までやり遂げてくれたし……"
"10023110-132-ネル" = "その……お疲れさん。"
"10023110-134-アカネ" = "ふふ、そういう事です、トキちゃん。#nリーダーはこういう時、素直じゃないですからね。"
"10023110-135-ネル" = "余計なこと言うんじゃねぇよ！"
"10023110-136-アスナ" = "だってさ、トキちゃん！良かったね！"
"10023110-142-トキ" = "……ありがとうございます。"
"10023110-144-モモイ" = "はぁ……疲れたぁ～#nこんだけ苦労したのに、報酬どころか依頼自体が無くなっちゃったし……無駄骨だよ。"
"10023110-145-ミドリ" = "でも、次回作のネタにはなったんじゃない？"
"10023110-146-モモイ" = "次回作……？"
"10023110-147-モモイ" = "あ～たしかに……ネタだけならたくさんね……"
"10023110-148" = "[s] \"あ、そういえば。ヴァルキューレから懸賞金が貰えるはずだよ。\""
"10023110-149-モモイ" = "え……？懸賞金って、どういう事？#nそんなの初めて聞いたよ？"
"10023110-150" = "[s3] \"私もさっき知ったんだけど、この盗品は……\"\n[s4] \"ヴァルキューレも探してたみたいで。\""
"10023110-153-アリス" = "クエスト達成報酬ですね！#nパンパカパーン！アリスたちは懸賞金を手に入れました！"
"10023110-156-モモイ" = "あっ！じゃあ、そのお金でプライステーションが――"
"10023110-157-ミドリ" = "もっと良い使い道があるよね、お姉ちゃん！？"
"10023110-158-モモイ" = "なんでぇ！私たちはゲーム開発部だよ！#nゲーム開発部がゲームに投資しないで、どこに投資するっていうの！"
"10023110-160-アリス" = "アリス、考えがあります！"
"10023110-161-アリス" = "ゲーム開発部の部長はユズです！ユズに決めてもらいましょう！"
"10023110-167-ユズ" = "……一つ考えが、ある……"
"10023110-168-モモイ" = "え？なになに？"
"10023110-169-ユズ" = "そのお金は……次回作の開発費に使うのはどうかな。"
"10023110-170-モモイ" = "次回作の開発費……？"
"10023110-172-ミドリ" = "……そういえばセミナーに貰った[ruby=R&D]研究開発費[/ruby]が、そろそろ底を尽きそうだね……"
"10023110-173-アリス" = "流石はユズです！"
"10023110-175-ユズ" = "わたし達が……ここで得た経験を生かせば、"
"10023110-176-ユズ" = "もっと面白い物が作れるかも……"
"10023110-178-モモイ" = "そうだね！私に良いアイデアあるよ！"
"10023110-179-モモイ" = "聞いて聞いて！えっとね――"
"10023110-180-ミドリ" = "口頭じゃなくて、ちゃんと企画書にしてよ……お姉ちゃん。"
"10023110-181-モモイ" = "そ、そんな……私は企画書が苦手なんだぞ、妹よ。"
"10023110-182-ミドリ" = "シナリオライター兼プランナーなのに、企画書が苦手でどうするの！"
"10023110-184-ユズ" = "帰ったら……すぐコーディングの準備をしないと……"
"10023110-186-モモイ" = "待って！この溢れるアイデアを上手く形にするためにも……"
"10023110-187-モモイ" = "とりあえずゲームしない？"
"10023110-188-ミドリ" = "それはダメ！どうせ遊んでる間にアイデアがどこかに消えてしまった～とか言うでしょ！"
"10023110-190-アリス" = "アリス、いつでも準備できてます！"
"10023110-192-ユズ" = "みんな元気いっぱいだね……ふふっ……"
"10023110-197" = "（そうして、急に訪れた非日常からいつもの日常へと戻っていき――）"
"10023110-198" = "（彼女たちは楽しそうに夜更けまで遊んでいた）"
"10023110-200" = "（そうして、誰もが寝静まる頃……）"
"10023110-204" = "[ns] \"モモイ。\""
"10023110-205-モモイ" = "ん？どうしたの、先生？"
"10023110-206" = "[s] \"本当に大変だったね……\""
"10023110-207-モモイ" = "うん……"
"10023110-208-モモイ" = "一時はどうなる事かと思ったよ……"
"10023110-209-モモイ" = "でもね！"
"10023110-210" = "[s] \"ん……？\""
"10023110-211-モモイ" = "ミドリも、ユズも、アリスも！#n――それに、トキも。一緒にいてくれたから！"
"10023110-212-モモイ" = "大変だったけど、本当にすっごくすっごく楽しかったよ！"
"10023110-213-モモイ" = "先生はどうだった？"
"10023110-214" = "[s] \"うん、私も楽しかったよ。\""
"10023110-215-モモイ" = "へへっ、良かった！"
"10023110-220" = "（モモイたちゲーム開発部の笑顔は、これまで以上に輝いて見えた）"
"10023110-225" = "\"……うん、もちろん。みんな大切な生徒だよ。\""
"10023110-233-アキラ" = "……"
"10023110-237" = "\"……うん、もちろん。みんな大切な生徒だよ。\""
"10023110-238-アキラ" = "……先生。"
"10023110-242" = "\"……うん、もちろん。みんな大切な生徒だよ。\""
"10023110-243-アキラ" = "ふう……"
"10023110-244-アキラ" = "こんなにも、胸が締めつけられるなんて……この鼓動は一体……"
"10023110-245-アキラ" = "ですが苦しくは……むしろ、幸せな気持ちに。"
"10023110-246-アキラ" = "何故でしょう。先生なら、この答えを知っているのでしょうか？"
"10023110-247-アキラ" = "……"
"10023110-248-アキラ" = "私に盗めない物などありません。いつだって……大切な物は皆のために。"
"10023110-249-アキラ" = "人は生まれながらにして名を持つわけでは無い。それは、心も同様です。#n……人生とは、常に選択の連続である、と。"
"10023110-250-アキラ" = "先生、いつの日か――"
"10023110-256-アキラ" = "――この気持ちの名を、頂きに参ります。"
"10023110-259" = "白亜の予告状～一虚飾の館と美学の在り処～"
