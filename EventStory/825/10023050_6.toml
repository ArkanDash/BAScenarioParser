[translation]
"10023050-1" = "第5話;晴れのち曇り、怪盗注意報"
"10023050-2-モモイ" = "慈愛の……？"
"10023050-3-ミドリ" = "……怪盗？"
"10023050-4-ユズ" = "あの人が……"
"10023050-5-アリス" = "緊急クエスト発生です！"
"10023050-9-トキ" = "……！"
"10023050-18-ユズ" = "え……？#nトキさん、一体何を！？"
"10023050-20-慈愛の怪盗" = "……"
"10023050-22-トキ" = "……"
"10023050-24-慈愛の怪盗" = "その並外れた身のこなし――美しい。"
"10023050-25-トキ" = "私の身体能力を見定めて、どうするつもりですか？"
"10023050-26-慈愛の怪盗" = "ふふっ……純粋な褒め言葉ですよ。"
"10023050-27-トキ" = "お礼でも述べるべきでしたか？"
"10023050-31-慈愛の怪盗" = "嗚呼、この美学が通じないだなんて――私はとても悲しいです。"
"10023050-33-トキ" = "……？#n意図を図りかねますが……"
"10023050-34-トキ" = "――私は「王冠」と呼ばれる盗品を探しています。#nあなた、何かご存知なのでは？"
"10023050-35-慈愛の怪盗" = "何故、それを[ruby=わたくし] 私 [/ruby]に？"
"10023050-36-トキ" = "あなた、泥棒なのでしょう？"
"10023050-37-慈愛の怪盗" = "……"
"10023050-38-トキ" = "失礼、それとも「泥棒様」とお呼びしたほうが良かったですか？"
"10023050-39-慈愛の怪盗" = "ふふっ……嗚呼、そうですね。"
"10023050-40-慈愛の怪盗" = "一つ、訂正をさせてくださいませ。"
