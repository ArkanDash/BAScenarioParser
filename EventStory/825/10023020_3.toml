[translation]
"10023020-1" = "第2話;「お掃除」を始めましょう"
"10023020-2" = "（モモイたちと約束をした時間になり……）"
"10023020-3" = "（周囲に視線を向けると――）"
"10023020-4-モモイ" = "やっほー、先生！"
"10023020-5" = "[s] \"こんにちは、モモ……イ……？\""
"10023020-6-モモイ" = "じゃーん、メイド服だよ！"
"10023020-7-モモイ" = "どう、どう？可愛いよね？"
"10023020-8-モモイ" = "似合うでしょ？"
"10023020-9-モモイ" = "では、はりきって感想をどうぞ！"
"10023020-10" = "[s1] \"あ、ああ……私はきっと……\"\n[s2] \"この日のために生まれてきたんだね……！\""
"10023020-11-モモイ" = "ほ、本当……？えへっ、えへへ。#nそんなに喜ばれると……ちょっと、照れるかも。"
"10023020-12-モモイ" = "ほ、本当……？えへっ、えへへ。#nそんなに喜ばれると……ちょっと、照れるかも。"
"10023020-13-ミドリ" = "はあ、はあ……！もう、お姉ちゃん、急に走らないで！#nそれに、さっきまで動きにくいって、散々文句を言ってたのに……どうしたの？"
"10023020-14-モモイ" = "ふっふーん！先生に早く見てもらおうと思って！"
"10023020-15-ミドリ" = "お待たせしてしまってすみません、先生。"
"10023020-16" = "[s] \"気にしないで。ミドリも可愛いね、よく似合ってる。"
"10023020-17-ミドリ" = "そ、そう……ですか？#nあ、ありがとうございます。えへへ……"
"10023020-18-モモイ" = "ほら、ユズもおいで！"
"10023020-19-ユズ" = "あっ、う、うん……"
"10023020-20-ユズ" = "どう……でしょう、先生？#nうぅ……このスカート、ひらひらしすぎじゃ……？"
"10023020-21" = "[s] \"とても似合っているよ、ユズ……最高だよ！\""
"10023020-22-ユズ" = "せ、先生！？"
"10023020-23-ユズ" = "あ、そ、その……！あうう！"
"10023020-28-モモイ" = "次はアリス！"
"10023020-29-モモイ" = "……って、あれ？アリスは？"
"10023020-30-ミドリ" = "アリスちゃん？どうしたの？"
"10023020-32-アリス" = "やっぱりアリスにはまだ早いです！メイド服……メイド服は……"
"10023020-33-アリス" = "ネル先輩の服です！アリスには無理です！"
"10023020-35-モモイ" = "あちゃ……なんとか説得して、ここまで来てくれたんだけど……"
"10023020-36-ミドリ" = "アリスちゃん、ずっとこんな調子で……"
"10023020-37" = "[s] \"メイド服はまだ早い……？\""
"10023020-38-ユズ" = "その……C&Cの皆さんのような動きが、まだできないから、と……"
"10023020-39-ミドリ" = "だから、自分で着るのは抵抗があるみたいで……"
"10023020-40-モモイ" = "アリス、衣装を着るのに早いも遅いもないんだよ！#n着てみないと何も始まらないんだから！"
"10023020-42-アリス" = "ですが、アリスは……"
"10023020-43" = "[s3] \"どんな勇者も、恐れずに挑戦してきたよね。\"\n[s4] \"だから、アリスも一歩踏み出して、冒険を進めてみよう？\""
"10023020-44-アリス" = "うぅ……たしかに、そうですが……"
"10023020-45-アリス" = "うぅ……たしかに、そうですが……"
"10023020-46-アリス" = "……分かりました。"
"10023020-47-アリス" = "――アリスは、勇者ですから！"
"10023020-50-アリス" = "うわぁーん……"
"10023020-51-アリス" = "本当に、似合っているのでしょうか……！"
"10023020-52" = "[s] \"うん、とっても似合ってるよ！大丈夫！\""
"10023020-53-アリス" = "……"
"10023020-54-アリス" = "アリスはアリス、ですか……？"
"10023020-55-アリス" = "メイド服を、着ていても……？"
"10023020-58-一同" = "もちろん！"
"10023020-62-アリス" = "みんな……ありがとう、ございます。"
"10023020-66-アリス" = "どんな姿でも、アリスはアリスなんですね……！"
"10023020-68-モモイ" = "アリス、やればできるじゃん！"
"10023020-70-ミドリ" = "偉いよ、アリスちゃん。"
"10023020-72-ユズ" = "アリスちゃん……頑張ったね……"
"10023020-76" = "[ns] \"よく頑張ったね、アリス。\""
"10023020-79" = "（みんなでアリスに拍手を送った）"
"10023020-80" = "（そうしてゲーム開発部はハッピーエンドを迎え――）"
"10023020-82" = "（――るにはまだ早かった！）"
"10023020-84" = "[ns] \"そういえば、全員コールサインはダブルオーなんだね。\""
"10023020-85-モモイ" = "先生が借りてきてくれたメイド服、サイズ的にネル先輩のしか合わなかったんだ。"
"10023020-86-ミドリ" = "ユズちゃんとアリスちゃんの分は、ネル先輩のサイズ違いの予備みたいです。#n「背が伸びたら、こちらをお使いください」というメモが挟まっていたので。"
"10023020-90-ユズ" = "サイズ違いの予備は、ミドリが言った通り、わたしでも着られましたが……"
"10023020-91-アリス" = "あとは全部、ブカブカでした！#n特にカリン先輩のメイド服は、ものすごく大きかったです！"
"10023020-92-モモイ" = "まぁでも、これで準備は万端だね！#nふふっ、みんなのメイド服姿も先生にちゃんと見てもらったし！"
"10023020-93-アリス" = "はい！冒険の始まりです！"
"10023020-94-ミドリ" = "先生がついてきてくださるとはいえ、大丈夫かな……"
"10023020-95-ユズ" = "うぅ……ロッカーに帰りたい……"
"10023020-97" = "（そうして、勇者たちの冒険（？）が始まった――）"
"10023020-99-モモイ" = "……"
"10023020-100-ミドリ" = "……"
"10023020-104-ユズ" = "……"
"10023020-105-アリス" = "？"
"10023020-109" = "[ns] \"……想像以上に大きなお屋敷だね。\""
"10023020-110-モモイ" = "い、今からでも断った方が良いんじゃないかな！？"
"10023020-111-ミドリ" = "……ここまで来たのに？"
"10023020-118-ミドリ" = "えっ、ユズちゃん？#n……ユズちゃん！？"
"10023020-124-明太郎" = "ようこそ、皆様。お待ちしておりました。"
"10023020-125-明太郎" = "約束の刻限通りにお越しいただけるとは……感謝申し上げます。"
"10023020-127-モモイ" = "（ミドリ……ほら、この人だよ）"
"10023020-128-ミドリ" = "あ、あなたが……その、依頼主さんですか……？"
"10023020-133" = "[ns5] \"「お掃除」の依頼だと伺いましたが……\"\n[ns6] \"詳細を教えていただけますか？\""
"10023020-134-明太郎" = "なるほど、早速本題に入ってほしい、と。#nお忙しい中、これはこれは大変失礼を。"
"10023020-135-明太郎" = "なるほど、早速本題に入ってほしい、と。#nお忙しい中、これはこれは大変失礼を。"
"10023020-136-明太郎" = "私は美術商を営んでおりまして……コレクターから買い取った品を管理し、オークションを通して再度流通させる、[ruby=いわゆる]所謂[/ruby]セカンダリーをしております。"
"10023020-137-明太郎" = "そこで、次のオークションに、とても貴重な作品が並ぶ予定でして……#n参加者の護衛と美術品の警備をお願いしたく。"
"10023020-138-モモイ" = "ちょ、ちょっと待って！？#n私たちは「お掃除」の仕事って聞いたんだけど……！？"
"10023020-139-明太郎" = "仰る通り、私は「お掃除」と申しました。ですがC&Cにおける「お掃除」とは、エージェントとしての活動を指す――そうでしょう？「リトルタイラント」――いえ、C&Cのリーダー、[ruby=みかも]美甘[/ruby]ネル様。"
"10023020-140-モモイ" = "（そ、そうだったの！？）"
"10023020-141-ミドリ" = "（私が知ってるわけないでしょ、お姉ちゃん！）"
"10023020-142-モモイ" = "（ど、どうしよう……！？どうしよう、どうしよう、どうしよう……！）"
"10023020-143-ミドリ" = "（とりあえず落ち着いて！……今はこの状況を乗り切らないと！）"
"10023020-144-ミドリ" = "は、はい！たしかに、その通りではありますが！"
"10023020-145" = "[s] \"事前に詳細を教えてくだされば、まだこちらの準備も……\""
"10023020-147-明太郎" = "その点に関しては、失礼いたしました。#nですが、C&Cの皆様は、秘密エージェント……"
"10023020-148-明太郎" = "公衆の面前で込み入った話をしては、余計な誤解を招くのでは無いか、と。#n限られた期間で、話し合いの場を設けるのも難しいと判断した次第です。"
"10023020-149-明太郎" = "ともあれ……屋敷までご足労いただき感謝いたします。#nこうして私たちが出会えたのも何かの縁ではございますし……"
"10023020-150-明太郎" = "ほんのお願いなのですが、噂に聞くC&Cの実力を直接お目にかかりたく存じます。"
"10023020-153-一同" = "！！！"
"10023020-155-明太郎" = "なんでも、C&Cの皆様は、それぞれの分野で特別な実力をお持ちとか。"
"10023020-156-明太郎" = "もちろん、全てを披露してほしいなどと、図々しいことは申しません。#n皆様の本当の実力は、「お掃除」の現場でこそ発揮されるものでしょうから……"
"10023020-157-明太郎" = "しかし、その実力の一端を見せていただく分には問題ないかと。"
"10023020-158-ミドリ" = "（やっぱり本当の事を話そうよ、お姉ちゃん！）"
"10023020-159-モモイ" = "（待って、ミドリ！そんな事したらネル先輩に殺されちゃう！今の私たちはC&Cだと思われてるんだよ！？）"
"10023020-160-ミドリ" = "（じゃあ、私たちで依頼をなんとかできるっていうの……！？）"
"10023020-161-モモイ" = "（そうだよ。ここは、私たちの力で何とかしよう）"
"10023020-165-明太郎" = "さて、どなたからお見せいただけるのでしょう？"
"10023020-171-アリス" = "アリス、分かりました！これは転職イベントですね！#nアリスはC&Cのメイドにジョブチェンジします！"
"10023020-172-ユズ" = "アリスちゃん！？"
"10023020-173-モモイ" = "アリス！？"
"10023020-174-アリス" = "アリスのクラスは……"
"10023020-181-アリス" = "……"
"10023020-187-アリス" = "……"
"10023020-194-アリス" = "……！"
"10023020-199-アリス" = "……！！！"
"10023020-212-アリス" = "今日のアリスの役割は……光属性の単体アタッカー……"
"10023020-213-アリス" = "アリスは、今から遠くに見えるあの小さな岩を狙撃します！"
"10023020-214-アリス" = "ハアアアァッッ……！"
"10023020-215-アリス" = "光よ！"
"10023020-217" = "（ドカアアァァン！）"
"10023020-219-明太郎" = "お、おお……！あんなにも遠くの小さな岩を、一撃で……！"
"10023020-220-明太郎" = "これが噂に聞く、どんな標的も必ず命中させる狙撃手の実力……！"
"10023020-221-明太郎" = "ところで狙撃手とは、位置がバレないよう目立ってはいけないと聞きましたが……？"
"10023020-222-ミドリ" = "だ、大丈夫です！遠くから一撃で制圧できますから！"
"10023020-223-モモイ" = "そ、そう！目撃者が居なければ何も問題なし！"
"10023020-224-明太郎" = "ふうむ……C&Cの方がそう仰るのなら……"
"10023020-225-明太郎" = "ひとまず、ありがとうございました。#n他の方の担当も気になるのですが……"
"10023020-226-明太郎" = "そちらの先ほどから静かにしている方は……？"
"10023020-230-ユズ" = "ひっ！？"
"10023020-233-ユズ" = "（どうしよう、どうしよう、どうしよう、どうしよう……！）"
"10023020-234-モモイ" = "（ユズ、大丈夫！ユズにできる事を考えよう！）"
"10023020-235-ミドリ" = "（ユズちゃんは普段、ロッカーに隠れてるから、それを活かせたら……）"
"10023020-236-ミドリ" = "（……そうだ！）"
"10023020-237-ユズ" = "（な、なに！？）"
"10023020-238-ミドリ" = "（こっちきて！）"
"10023020-240-明太郎" = "ふむ……準備に数分かかるとの事で席を外しておりましたが……皆様は一体どちらに？"
"10023020-244-明太郎" = "……ん？"
"10023020-247-明太郎" = "こんな箱、先ほどまで無かったはずですが……#n何か仕掛けがあるようにも見えませんね。C&Cの皆様……？"
"10023020-262-ユズ" = "動かないで、ください……"
"10023020-263-明太郎" = "うおおおっ！？"
"10023020-265-明太郎" = "これはこれは、驚かされました。#nまさか気配を消して私の背後をとるとは。"
"10023020-266-明太郎" = "そういえば……C&Cにはものすごい強運の持ち主で、いつの間にやら目の前に現れる潜入員が居ると聞いたことも。"
"10023020-267-明太郎" = "小さな体で任務をこなすのは、さぞかし大変でしょう。#nいや……むしろ、それを潜入に活かしている、という事なのでしょうね。"
"10023020-268-ユズ" = "は、はいぃ……そう、です……"
"10023020-269-明太郎" = "では次……そうですね。#n冷静に戦況を把握し、皆をまとめる参謀が居るとも聞いておりますが……"
"10023020-270-明太郎" = "それは、貴女の事でしょうか？"
"10023020-271-ミドリ" = "はい？えっと……はい。#n私が、参謀……"
"10023020-272-明太郎" = "そして残るは……"
"10023020-273-モモイ" = "……"
"10023020-274-明太郎" = "……"
"10023020-275-モモイ" = "な、なに！言いたい事があるなら早く言って！"
"10023020-276-明太郎" = "いえ、失礼。"
"10023020-278-明太郎" = "「リトルタイラント」――噂に違わぬその風格、改めて感服いたしました。"
"10023020-279-モモイ" = "ど、どういうことーー！？"
"10023020-281" = "[ns7] \"この規模の屋敷であれば……\"\n[ns8] \"防犯システムがあるはずですが……なぜC&Cに依頼を……？\""
"10023020-284-明太郎" = "たしかに、屋敷の防犯システムは万全です。"
"10023020-285-明太郎" = "ですが、それでもC&Cの皆様にご連絡差し上げたのは……"
"10023020-289-明太郎" = "予告状が届いたからです――#nあの「慈愛の怪盗」から……！"
"10023020-294-一同" = "……「慈愛の怪盗」？"
