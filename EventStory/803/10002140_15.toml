[translation]
"10002140-1" = "後日談その1 ;夢は違えど寄り添って"
"10002140-3" = "Ｑ．初めて作ってみた砂の城はどうだった？"
"10002140-9-ツルギ" = "ききっ……あ、"
"10002140-10-ツルギ" = "え……マイク……？"
"10002140-11-ツルギ" = "えっと、先生……。"
"10002140-12-ツルギ" = "これは、その、一体……？"
"10002140-13-ツルギ" = "……？インタビュー……ですか？"
"10002140-14-ツルギ" = "い、いえ……！先生のことですし、きっと何か深い理由があるのだと思いますが……！"
"10002140-15-ツルギ" = "えっと……その……。"
"10002140-16-ツルギ" = "砂の城、は……。"
"10002140-17-ツルギ" = "……。"
"10002140-18-ツルギ" = "た……楽しかった、です……それに、先に作ってくれた彼女なんて、すごい綺麗な城を……。"
"10002140-19-ツルギ" = "真似ながら、自分なりに頑張って作ってみたのですが……私のは全然その、未熟と言いますか……。"
"10002140-20-ツルギ" = "はい……。"
"10002140-21-ツルギ" = "な、なので、もし機会があればですが、その……彼女と、えっと、い、いいいい……！"
"10002140-22" = "[s] \"一緒に砂のお城を作ってみたい？\""
"10002140-23-ツルギ" = "……！は、はい……もし良ければ、ですが……どうなんでしょう……？"
"10002140-24-ツルギ" = "もしできるのであれば……や、やりたい、です。もう一度、今度は一緒に……！"
"10002140-25-ツルギ" = "くへ、くへへ……一緒に、砂の城……くけけけけ……。"
"10002140-26-ツルギ" = "くひゃひゃひゃひゃひゃっ！！！"
"10002140-29" = "Ｑ．……って言ってたけど、どう？"
"10002140-35-ヒフミ" = "……え。"
"10002140-36-ヒフミ" = "……わ、私がですか？"
"10002140-37-ヒフミ" = "もう一度砂のお城を……？"
"10002140-38-ヒフミ" = "あ、あはは……。"
"10002140-39-ヒフミ" = "あは……えっと、そうですね、その……。"
"10002140-40-ヒフミ" = "一緒に、というのは、その、大変光栄なのですが……。"
"10002140-41-ヒフミ" = "そうですね、えっと……あ、あはははは……。"
"10002140-43-ヒフミ" = "……あは……あはは……。"
"10002140-45" = "（インタビュー相手が情緒不安定になってしまったため、インタビューは中断することにした。）"
