[translation]
"10002170-1" = "後日談その4;彼女が店主をする理由"
"10002170-2-「海の家」の店主" = "へいお待ちっ！"
"10002170-4-イズミ" = "わ～いっ！"
"10002170-5-「海の家」の店主" = "うちの自慢の看板メニュー「チーズ明太焼きそば」だ、味わって食べてくんな！"
"10002170-6-「海の家」の店主" = "ついでにお嬢ちゃんの感想なんかも貰えると嬉しいね。"
"10002170-7-イズミ" = "分かった！じゃあいっただっきま～す！"
"10002170-10-イズミ" = "モグモグ……。"
"10002170-11-イズミ" = "うん、美味しい～！"
"10002170-12-「海の家」の店主" = "おっ、良い食べっぷりだねお嬢ちゃん！"
"10002170-13-「海の家」の店主" = "それにしても驚いたよ、倒れてるところを見つけた時は熱中症か！？って思って焦ったけど……"
"10002170-14-「海の家」の店主" = "まさか空腹で倒れてたとは。まあ大ごとじゃなくて良かったが、いったいどんだけお腹が空いてたんだ？"
"10002170-15-イズミ" = "せっかくの夏の海だし、美味しい食べ物がたくさんあるだろうから、"
"10002170-16-イズミ" = "お腹を空かせて行こ～！って思ったんだけど……。"
"10002170-17-イズミ" = "あんまりにもお腹空かせすぎたのと、ここまで暑いと思わなくって……。"
"10002170-18-イズミ" = "でもおかげで生き返ったよ！ありがと、おじさん！"
"10002170-19-「海の家」の店主" = "いやいや、こっちもお礼を言いたいくらいさ。"
"10002170-20-「海の家」の店主" = "営業を再開する前に、自分の腕が鈍ってないかを確認できる良い機会になったからな。"
"10002170-21-「海の家」の店主" = "良い食べっぷりも見せてもらえたし、お嬢ちゃんの反応を見るに、今年の夏もうちは安泰みたいだしな！がっはっはっはっはっは！"
"10002170-22-イズミ" = "でもおじさんの料理、確かに美味しいんだけどー……。"
"10002170-23-「海の家」の店主" = "うん？"
"10002170-24-イズミ" = "うーん、何て言うんだろ……ちょっと無難というか、"
"10002170-25-イズミ" = "もうちょっと何か足せそうって言うか……！"
"10002170-26-イズミ" = "うん！せっかくの夏なんだし、もっと挑戦的になっても良いと思うの！"
"10002170-27-「海の家」の店主" = "ふむ、なるほど。挑戦か……一理あるな。"
"10002170-28-イズミ" = "あっ、そうだ！ちょうど給食部からもらってきた……この特製ソース！これをかけたら、もっと美味しくなるかも？"
"10002170-29-「海の家」の店主" = "ほう……かの有名なゲヘナ学園、そこの食事を預かる部活の特製ソースと聞いちゃあ、試してみるしかねぇな！"
"10002170-30-「海の家」の店主" = "どれ……じゃあ、ちょっとくれるかい？"
"10002170-31-イズミ" = "はい、どうぞ！"
"10002170-34-「海の家」の店主" = "うぉっ、こいつぁ真っ黒で、しかも光沢のあるソースだな……。"
"10002170-35-「海の家」の店主" = "これは何の匂いだ？黒ゴマか？"
"10002170-36-「海の家」の店主" = "まあ良いか、とりあえず味見を……。"
"10002170-38-イズミ" = "黒ゴマ？ジュリはこれ確か、マンゴーで作ったソースって言ってたけど……？"
"10002170-39-「海の家」の店主" = "え、マン――"
"10002170-41-「海の家」の店主" = "ごぼぁっ！！？！？"
"10002170-46-イズミ" = "あれ、おじさん……？"
"10002170-48-イズミ" = "ええっ、どうしたの！？おじさん！？大丈夫！？"
"10002170-49-イズミ" = "な、何で急に……！？"
"10002170-50-イズミ" = "はっ……！もしかして、この夏の暑さのせいで？こんな炎天下の中で、私のために料理を作ってくれたから……！？おじさぁん！！"
"10002170-51-お客さんA" = "すみませ～ん、注文いいですか～？"
"10002170-52-イズミ" = "ああっ、よりにもよってこんなタイミングでお客さんが！"
"10002170-53-イズミ" = "ど、どうしよう……！"
"10002170-56-イズミ" = "……うん、決めた！確か先生も、お返しの精神は大事って言ってたし……！"
"10002170-57-イズミ" = "心配しないで、おじさん。おじさんの犠牲は無駄にはしないから！"
"10002170-58-イズミ" = "私が、このお店を守ってみせる！"
"10002170-59-お客さんB" = "すみませーん、店員さーんいませんかー？"
"10002170-61-イズミ" = "はいはーい！今行くからちょっと待ってて～！"
