[translation]
"10042055-2-フウカ" = "ねぇジュリ、口に出すか悩んだんだけど……。"
"10042055-3-フウカ" = "その、えっと……。"
"10042055-4-ジュリ" = "だ、大丈夫です……話してください。"
"10042055-6-フウカ" = "……よく、ここまで育ったね？"
"10042055-7-ジュリ" = "せ、先輩！？"
"10042055-8" = "[ns1] \"頭がくらくらする……。\"\n[ns2] \"パンちゃんは成長期だったんだね……。\""
"10042055-11-チナツ" = "たしかに、もう探す必要はありませんね。"
"10042055-12-セナ" = "ええ、実に興味深いです。"
"10042055-13-フウカ" = "そんなこと言ってる場合！？"
"10042055-14-セナ" = "……そうですね。"
"10042055-15-セナ" = "どうやら――"
"10042055-16-セナ" = "――冗談を言っている場合ではなさそうです。"
