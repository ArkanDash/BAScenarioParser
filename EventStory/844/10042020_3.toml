[translation]
"10042020-1" = "第2話;フラグ"
"10042020-4-チナツ" = "おはようございます、先生。"
"10042020-5-チナツ" = "こんな形になってしまいましたが、お会いできて嬉しいです。"
"10042020-6-イオリ" = "一体何があったの？わざわざ私たちを呼び出すくらいなんだよね？"
"10042020-7-イオリ" = "ちゃんと仕事はするけど、くだらない内容だったら……分かるよね？"
"10042020-8" = "[s1] \"非常に説明しづらいんだけど……。\"\n[s2] \"ちょっと奇妙な状況というか……。\""
"10042020-17-ジュリ" = "チナツさん、イオリさん……。"
"10042020-19-イオリ" = "給食部？#n外にいるの珍しいね。"
"10042020-20-チナツ" = "てっきり、温泉開発部か美食研究会かと思っていたのですが……給食部とは。"
"10042020-21-チナツ" = "差し支えなければ、事情をお聞かせ願えるでしょうか？"
"10042020-22-フウカ" = "それが……。"
"10042020-24-イオリ" = "……はぁ。"
"10042020-25-イオリ" = "つまり……パンケーキが自我を持って飛び出していった、と？"
"10042020-26" = "[s] \"信じ難いかもしれないけど……。\""
"10042020-27-イオリ" = "……いや、待てよ。"
"10042020-28-イオリ" = "たしか、前にも似たような話があったような……。"
"10042020-29-チナツ" = "[ruby=パンデモニウム・ソサエティー]万魔殿でパ[/ruby]ーティーを開いた時のことですね……。"
"10042020-30-チナツ" = "それ以前にも数件ほど類似した事件はありましたが……。"
"10042020-31-イオリ" = "じゃあ……これって、新手のテロってこと？"
"10042020-32-イオリ" = "ゲヘナには色んなテロリストがいるけど、まさか給食部もそうだったなんて……。"
"10042020-33-フウカ" = "て、テロリスト！？#nハルナと同じにしないでくれる！？！？"
"10042020-34-チナツ" = "いえ、テロではなく事故の可能性もあります。"
"10042020-35-イオリ" = "給食部は比較的大人しかったからこれまでそういった監視対象じゃなかったけど……。"
"10042020-36-イオリ" = "そういえば、衛生評価の時になんか変なオレンジジュースを飲まされた気もするし……？"
"10042020-37-ジュリ" = "！？"
"10042020-38-フウカ" = "そ、それは、その……！"
"10042020-39-チナツ" = "イオリ落ち着いて。給食部の方々が悪意をもってテロ行為をしているのなら、真っ先に食堂利用者が倒れているはずです。#nそうじゃないのですから、信じましょう。"
"10042020-40-イオリ" = "一理あるね。食堂には私も普段お世話になってるし。#n故意にテロを起こすならもうやってるか。"
"10042020-41-イオリ" = "というか……この程度なら、私一人で対応できる。"
"10042020-42-イオリ" = "みんなはここで待機してて……先生も分かった？"
"10042020-43-イオリ" = "……何かあったら困るからな。"
"10042020-44" = "[s] \"イオリが私を心配してくれるなんて！\""
"10042020-45-イオリ" = "は、はぁ！？#nぜ、絶対違うぞ！？"
"10042020-46-イオリ" = "とにかく、さっさと終わらせてやるからな！"
"10042020-50" = "[log]イオリが叫んだ次の瞬間――[/log]"
"10042020-53" = "[log]ある予感が先生の脳裏に閃いた！[/log]"
"10042020-57" = "[ns5] \"い、イオリ！？\"\n[ns6] \"待って、ちょっと話が――\""
"10042020-60-イオリ" = "じゃあ、行ってくる！"
"10042020-65-チナツ" = "……行ってしまいましたか。"
"10042020-66-チナツ" = "せめて、先生の話を聞いてからでも……。"
"10042020-67-チナツ" = "ところで、給食部の事情を詳しく伺いたいのですが……大丈夫でしょうか？"
"10042020-68-ジュリ" = "ひっ、ごめんなさい……。"
"10042020-69-チナツ" = "怒っているわけではありません。落ち着いてください。"
"10042020-70-ジュリ" = "……ありがとうございます、チナツさん。"
"10042020-71-チナツ" = "……それに、このままでは事情聴取がしづらいですから。"
"10042020-72-ジュリ" = "そっちですか！？"
"10042020-73-チナツ" = "……ふふっ。"
"10042020-74-チナツ" = "冗談です。"
"10042020-76-ジュリ" = "――以上が、これまでの流れです。"
"10042020-77-チナツ" = "……給食部の休日、フウカさんの外出、ジュリさんのアルバイト。"
"10042020-78-チナツ" = "多忙を極める中、突如発生したキッチンの仕事。#nそして、普段よりうまくいった料理……。"
"10042020-79-ジュリ" = "は、はい！その通りです！"
"10042020-80-チナツ" = "なるほど……。"
"10042020-81-チナツ" = "全て理解したとは言い切れませんが――"
"10042020-82-ジュリ" = "え、えっと……。"
"10042020-83-チナツ" = "ジュリさんはアルバイトをしていただけですし……故意ではなかった。"
"10042020-84-チナツ" = "そうですね……やはり、これは事故でしょう。"
"10042020-85-ジュリ" = "そ、そう言っていただけるのは、ありがたいのですが……。"
"10042020-86-チナツ" = "カフェの倉庫で爆発が起きたとも伺いましたが……。"
"10042020-87-チナツ" = "まあ、そちらはいつもの事ですね。"
"10042020-88" = "[ns7] （いつもの事なんだ……）\n[ns8] （そういえば、ここはゲヘナだったね……）"
"10042020-91-チナツ" = "そろそろイオリも帰ってくるはずなんですが……遅いですね。"
"10042020-92-チナツ" = "連絡を入れてみます。#n少々お待ちくださいね。"
"10042020-97-チナツ" = "……？"
"10042020-98-チナツ" = "繋がりませんね。#nもう一度……。"
"10042020-103-チナツ" = "ダメですね。#n普段なら必ず電話に出るのに……。"
"10042020-104-ジュリ" = "まさか……？"
"10042020-105-チナツ" = "もう一度……。"
"10042020-110-チナツ" = "やはり出ません。#nこれは……。"
"10042020-111-チナツ" = "……先生、ジュリさん。"
"10042020-112-チナツ" = "あのモンスターについて、お伺いしたいのですが……。"
"10042020-113-チナツ" = "最初に襲撃された方は、無事だったんですか？"
"10042020-114-ジュリ" = "えっと……ソースまみれの状態で気絶していましたが、外傷はありませんでした。"
"10042020-115-チナツ" = "なるほど……。"
"10042020-116" = "[ns] \"チナツ？\""
"10042020-117-チナツ" = "どうやら、想定以上の事態に発展しているかもしれません。"
"10042020-118-チナツ" = "でも……おかしいですね。"
"10042020-119-チナツ" = "ここまでイオリから連絡一つないなんて……。"
"10042020-120-チナツ" = "普段は、気づいたらすぐ折り返してくるのに。"
"10042020-121" = "[s] \"私からも電話してみるね。\""
"10042020-122-チナツ" = "はい、お願いします。"
"10042020-128-フウカ" = "やはり、繋がりませんか……？"
"10042020-129-ジュリ" = "そ、そんな……！"
"10042020-130" = "[s9] \"まさかこんな事態になるなんて……。\"\n[s10] \"あの時、薄々感じてたけど……。\""
"10042020-133-チナツ" = "……どういうことですか、先生？"
"10042020-134-ジュリ" = "あ、あの！#nまずはイオリさんを探しませんか？"
"10042020-135-フウカ" = "そうですね……それに、何だか不吉な予感が……。"
"10042020-136-チナツ" = "先生……差し支えなければ、伺っても良いですか？"
"10042020-137" = "[s11] \"たぶん、イオリは今頃……。\"\n[s12] \"ネバネバまみれになってると思う……。\""
"10042020-140-ジュリ" = "えぇっ！？"
"10042020-141-チナツ" = "ネバネバ、まみれ……？"
"10042020-144-チナツ" = "だいぶ離れたところまで来ましたが……。"
"10042020-145-フウカ" = "道中、至る所に緑のネバネバが落ちてたわね……。"
"10042020-146-ジュリ" = "イオリさんいました！！あそこです！！"
"10042020-149" = "[ns] \"うわっ！イオリ、大丈夫！？\""
"10042020-150-チナツ" = "状態を確認します……。"
"10042020-155-チナツ" = "……気を失っているだけですね。#n幸い、命に別状はないかと……。"
"10042020-156-チナツ" = "ですが、イオリにまとわりついてる液体はしばらく取れないでしょう……臭いもかなりひどいです。"
"10042020-157-フウカ" = "……それって大丈夫なの？"
"10042020-158-チナツ" = "まあ、よくあることです……。"
"10042020-159-チナツ" = "でも、一応専門家を呼んでおきましょうか。"
"10042020-160" = "[s] \"専門家……？\""
"10042020-161-ジュリ" = "チナツさん以外に、医療の専門家がいらっしゃるのですか……？"
"10042020-162-チナツ" = "はい、信頼できる方です。"
"10042020-163-チナツ" = "……少し、変わっているところもありますが。"
"10042020-165-セナ" = "……なるほど、それで私を呼んだのですね。#n理解しました。"
"10042020-166-セナ" = "チナツの言う通り、命に別状はありません。"
"10042020-167-セナ" = "……気絶理由は「ソース」が口に合わなかっただけかと。"
"10042020-168-ジュリ" = "そ、ソースが原因なんですか！？"
"10042020-169-セナ" = "…………おそらく。"
"10042020-170-セナ" = "大変、まずかったのかと。"
"10042020-171-フウカ" = "言い方変えただけじゃない！"
"10042020-175" = "[ns13] \"ま、まあ、大丈夫なら良かったよ！\"\n[ns14] \"非番なのに、わざわざ来てくれてありがとう。\""
"10042020-178" = "[ns] \"……それと、その格好も似合ってるね。\""
"10042020-179-セナ" = "お気になさらず。#n救急医学部は、いつでも出動できるよう待機しておりますので。"
"10042020-180-セナ" = "そして私服への感想、ありがとうございます先生。素直に嬉しいです。"
"10042020-181-セナ" = "この死体……いえ、彼女は他の部員に搬送を手配しました。#nまもなく到着するでしょう。"
