[translation]
"10042060-1" = "第6話;やるべきこと"
"10042060-2-アコ" = "……。"
"10042060-3-アコ" = "こ、これは……。"
"10042060-4" = "[s] \"だから言ったでしょ……？\""
"10042060-5-アコ" = "こ、こんなの信じられるわけないでしょう！"
"10042060-6-アコ" = "やっぱりドッキリですか？それとも悪い夢？#nは、早く目を覚まさないと……！"
"10042060-10-アコ" = "痛っ！"
"10042060-11-アコ" = "では、現実……？"
"10042060-12-フウカ" = "（あれ……）"
"10042060-13-ジュリ" = "（私もやった覚えが……）"
"10042060-14-セナ" = "人は理解不能な事態に遭遇すると不可解な行動をとる、とはよく言いますが……#nまさにそれですね。"
"10042060-15-アコ" = "だまらっしゃい！"
"10042060-16-アコ" = "巨大なパンケーキと聞いてはいましたが、まさかここまでとは……。"
"10042060-17-アコ" = "うぅ。余剰火力で先生を困らせる計画が……。"
"10042060-18" = "[s] \"そんなことを考えてたんだ……。\""
"10042060-19-アコ" = "……っ！"
"10042060-20-アコ" = "結果的には大正解でしたし、むしろ感謝するところじゃないですか！？"
"10042060-21-アコ" = "早く「そうだね」と言ってください！#nなんですか、その顔は……！"
"10042060-22" = "[s] \"そうだね……ごめん、泣かないでアコ。\""
"10042060-23-アコ" = "な、泣いてませんけど！？"
"10042060-24-アコ" = "……。"
"10042060-25-アコ" = "はぁ、良いでしょう。#n総員、発砲準備！"
"10042060-26-風紀委員" = "はい！88ミリFlaK36対空砲、発砲準備！"
"10042060-27-チナツ" = "お、お待ちください。行政官……！"
"10042060-28-アコ" = "何ですか……？"
"10042060-29-チナツ" = "それが……。"
"10042060-30-風紀委員" = "……！#nターゲットが……。"
"10042060-31-風紀委員" = "「パンケーキ」の移動速度があまりにも早く、照準が合いません！"
"10042060-32-風紀委員" = "建物を盾にしているせいで……。"
"10042060-33-風紀委員" = "このまま発砲すれば、市街地に甚大な被害が！"
"10042060-34-アコ" = "……はい？"
"10042060-35-チナツ" = "……その通りです。"
"10042060-36-アコ" = "ちょっと、待ってください……。"
"10042060-37-アコ" = "パンケーキが、建物間を高速移動。#n照準が合わず、このままでは市街地に被害が……。"
"10042060-38-アコ" = "い、いったいどういう状況ですか？"
"10042060-39" = "[s1] \"……アコ、大丈夫？\"\n[s2] \"「構わず撃て！」とは言わないんだね。\""
"10042060-42-アコ" = "私を何だと思ってるんですか……。"
"10042060-43-アコ" = "うっ……。"
"10042060-48-アコ" = "（今は、あれを倒さなければなりません……）"
"10042060-49-アコ" = "（ですが、砲撃で市街地が巻き添えになっては本末転倒）"
"10042060-50-アコ" = "（それに、[ruby=パンデモニウム・ソサエティー]あの万魔殿のタ[/ruby]ヌキたちは必ず難癖をつけてくるはず……！）"
"10042060-51-セナ" = "……行政官。"
"10042060-52-アコ" = "……今度は何ですか！？"
"10042060-53-セナ" = "後ろ。"
"10042060-54-アコ" = "……？"
"10042060-55-アコ" = "どういう――"
"10042060-60-アコ" = "きゃああぁぁぁぁあああっ！？！？"
"10042060-67-チナツ" = "パンちゃんの触手が、アコ行政官に！"
"10042060-68-チナツ" = "あ、足首を掴んで逆さまに……！？"
"10042060-69-チナツ" = "行政官、大丈夫ですか！？"
"10042060-73-アコ" = "あ、あああっ！！は、早く！早く何とかしてくださいっ！"
"10042060-77-アコ" = "何ですか、これはっ！き、気持ち悪い！#nぬるぬるして……もう、最悪！！！"
"10042060-80-アコ" = "……んうっっ！？！？"
"10042060-82" = "[ns] \"アコの口に、パンちゃんの触手が……！\""
"10042060-83-セナ" = "なるほど。これまでの人たちも全員……。"
"10042060-84-アコ" = "へいえいいふんへひひてるばあいえすか！？#n（冷静に分析してる場合ですか！？）"
"10042060-85-アコ" = "はやふ！なんおあひてくあはい！！#n（早く！何とかしてください！！）"
"10042060-86-フウカ" = "え、えっと、どうすればいいの！？"
"10042060-87-セナ" = "分かりません。私にあのような趣味はありませんので。"
"10042060-88-チナツ" = "そもそも、行政官は何を言っているのでしょう……？"
"10042060-89-ジュリ" = "……。"
"10042060-90-ジュリ" = "早く止めなきゃ……！！"
"10042060-91-フウカ" = "ジュリ……？"
"10042060-92-チナツ" = "何をするつもりですか……？"
"10042060-93-セナ" = "まだ解決策はありませんが……。"
"10042060-94-ジュリ" = "それでも、何とかしないと！"
"10042060-98-ジュリ" = "……私が、やります。"
"10042060-99" = "[s3] \"……ジュリ！？\"\n[s4] \"何をするつもりなの……？\""
"10042060-102-ジュリ" = "私……料理が上手くなりたかったんです。#nでも、ずっと変わりませんでした。"
"10042060-103-ジュリ" = "なのに今日はなぜか上手くいって……。#n料理が出来上がった時は、本当に嬉しくて……。"
"10042060-104-ジュリ" = "また次も……。"
"10042060-105-ジュリ" = "自分の手で、作りたい……と、思ったんです。"
"10042060-106-フウカ" = "ジュリ……い、いきなりどうしたの！？"
"10042060-107-セナ" = "……なるほど、フラグですか。"
"10042060-108-チナツ" = "先輩！？！？"
"10042060-109-ジュリ" = "大丈夫です、先輩。#n心配しないでください。"
"10042060-110-ジュリ" = "ここは――"
"10042060-111-ジュリ" = "私に任せてください。"
"10042060-113-ジュリ" = "――これは、私が「やるべきこと」ですから。"
"10042060-115" = "[ns5] \"ジュリ……！\"\n[ns6] \"そのセリフはいけない！！！\""
"10042060-118-ジュリ" = "先生……。"
"10042060-119-ジュリ" = "……。"
"10042060-120-ジュリ" = "私のこと、忘れないでくださいね。"
"10042060-121-ジュリ" = "ここは……私が何とかします。"
"10042060-122-ジュリ" = "後はお願いしますね。"
"10042060-126-ジュリ" = "……では、行ってきます。"
"10042060-132-フウカ" = "それ、死亡フラグだから！！！"
