[translation]
"10047050-1" = "第5話;忌むべき者たち"
"10047050-2" = "（見学を終えて、寮に戻った）"
"10047050-4-ツムギ" = "ではまず、儀式にふさわしい雰囲気作りから……。"
"10047050-9" = "[ns] \"も、もう十分それらしくなってない……？\""
"10047050-10-ツムギ" = "先生。怖い話にご興味はありますか？"
"10047050-11-ツムギ" = "この寮には、外部には知られていないルールがあるのです。"
"10047050-12-ツムギ" = "その一部を読み上げようかと……ふふっ。"
"10047050-13" = "[ns] 頷く。"
"10047050-14-ツムギ" = "ふふ……では始めます。"
"10047050-18-ツムギ" = "寮の特別規則、第13号。"
"10047050-19-ツムギ" = "『このマニュアルは他の規則と同様、学院の生徒の健全かつ安全な寮生活のために作成された、13番目の文書である』"
"10047050-20-ツムギ" = "『不測の事態に備えたものであるため、寮生は以下の規則を厳守すること』"
"10047050-26-ツムギ" = "『その1……1階ロビーの赤い電話を利用する場合、#n絶対に6を連続で押さないこと』"
"10047050-27-ツムギ" = "『ワイルドハント内の電話番号に6が連続で入ることはない』"
"10047050-28-ツムギ" = "『万が一、6を連続で押してしまった場合、速やかに屋根裏部屋に移動し、10分間身を潜めること』"
"10047050-29-ツムギ" = "『この間、声をかけられようと絶対に答えてはならない』"
"10047050-33-ツムギ" = "『その声は、あなたの知る誰でもないのだから――』"
"10047050-34" = "[ns] \"なるほど……。\""
"10047050-35-エリ" = "その2は私が読みあげますね！"
"10047050-39-エリ" = "『本寮の中央階段は寮監隊専用であるため、一般生徒の利用を禁ずる』"
"10047050-40-エリ" = "『円滑な通行のため、本規則は必ず遵守すること』"
"10047050-41-エリ" = "『この項目と矛盾する項目が存在する場合も、決して従ってはならない』"
"10047050-42" = "[s] \"どういうこと？\""
"10047050-43-エリ" = "にゅふふ、どういうことでしょうね？"
"10047050-44-レナ" = "気にしなくていいよ……それっぽく言ってるだけだから。"
"10047050-45-カノエ" = "イヒッ……じゃ、次はレナちゃんが読んでみる……？"
"10047050-50-レナ" = "な、なんで私なの？"
"10047050-51-カノエ" = "それっぽく言ってるだけなら……大丈夫なはず……。"
"10047050-52-レナ" = "ふん、またからかうつもりでしょ。"
"10047050-53-レナ" = "別に怖くないし？いいよ？#nどうせ、うそっぱちなんだから！"
"10047050-58-レナ" = "『その3……本寮では年に1回、避難訓練を実施する』"
"10047050-59-レナ" = "『訓練は非常時を想定しているため、寮内の一部階段が封鎖される』"
"10047050-60-レナ" = "『そのため、寮生は中央階段を利用すること』……あれ？"
"10047050-61" = "[s1] \"たしかその2では……。\"\n[s2] \"中央階段の使用は禁止だって……。\""
"10047050-66-カノエ" = "レナちゃん……入学して間もないころ、避難訓練したよね。"
"10047050-67-レナ" = "そうだけど……。"
"10047050-68-カノエ" = "その時の階段は……？"
"10047050-69-レナ" = "確か、中央階――"
"10047050-74-カノエ" = "イヒッ……じゃ、「その2」に違反しちゃったねぇ……。"
"10047050-75-エリ" = "あっ……では今日聞いた怨霊の声は、それが理由……？"
"10047050-76-レナ" = "そ、そんなわけないじゃない！？でたらめ言わないで！"
"10047050-77-レナ" = "それに中央階段を使ったの、私だけじゃないし！#n他の子も聞いてないとおかしいし！"
"10047050-78-カノエ" = "イヒッ……。"
"10047050-79-カノエ" = "最後は、私が読みあげるねぇ……。"
"10047050-83-カノエ" = "『その4……最後に――』"
"10047050-84-カノエ" = "『上記内容を確認した後……#n必ず本文書を燃やし、廃棄すること』"
"10047050-85-カノエ" = "『万が一廃棄が容易でない場合……#n1階ロビーの赤い電話で「666」と押すこと』"
"10047050-86-カノエ" = "『専門家が現れ、本文書を廃棄する……』"
"10047050-87" = "[s3] \"6が連続する番号はないはずなのに……。\"\n[s4] \"誰が来るんだろう……？\""
"10047050-92-レナ" = "ほ、ほら！でたらめじゃん！"
"10047050-93-レナ" = "こんなわけわかんない物、捨てちゃおうよ！"
"10047050-94-エリ" = "むやみに捨てれば、呪われることもあります……。"
"10047050-95-カノエ" = "その通り……。#nだから……燃やして、捨てようねぇ……。"
"10047050-96-カノエ" = "儀式も……兼ねて。"
"10047050-100-レナ" = "あっ！最初からそれが狙いだったんでしょ！！"
"10047050-102-エリ" = "にゅふふ……とにかく、これで準備も雰囲気もバッチリですね。"
"10047050-103-エリ" = "……では、これより悪魔召喚の儀を執り行います！"
"10047050-104-エリ" = "マスター！手伝ってくれますよね？"
"10047050-108-カノエ" = "拒否権は、ない……けどねぇ。イヒッ！"
"10047050-109" = "[ns5] \"乗りかかった船……か。\"\n[ns6] \"もう後には退けないってことだよね……。\""
"10047050-112-エリ" = "では、召喚のための魔法陣を描きます！"
"10047050-113" = "[s] \"どこに描くの？\""
"10047050-114-エリ" = "……マスターは「4」という数字について、どう思いますか？"
"10047050-115-エリ" = "不吉、不気味……そんな印象があるのでは？"
"10047050-116-エリ" = "そんな「4」が最も入っている場所といえば……。"
"10047050-117-エリ" = "この部屋、第4寮、404号室です！"
"10047050-118" = "[s] \"第6寮の606号室はないの……？\""
"10047050-119-エリ" = "非常に残念ながら、ありません……。"
"10047050-120-エリ" = "そう、つまり……#nここが悪魔の召喚に最も適している部屋なのです。"
"10047050-121-エリ" = "むしろ、他の場所は考えられません！"
"10047050-122-レナ" = "えっ、私たちの部屋に描くの？"
"10047050-123-エリ" = "にゅふふ、ご心配なく。安全な塗料を使いますから。"
"10047050-124-エリ" = "小さな爆発音と、少々の煙が出るくらいです。"
"10047050-125-レナ" = "爆発するんじゃん！！"
"10047050-126-ツムギ" = "ふふ、レナちゃんも気になりませんか？#nここに魔法陣を描いて、何が起こるか……。"
"10047050-127-レナ" = "ぜんっぜん！"
"10047050-128-カノエ" = "私……見てみたいなぁ……。"
"10047050-132-カノエ" = "やったら……ダメかなぁ……。"
"10047050-133-カラス" = "カァァ……。"
"10047050-134-黒猫" = "ニャオ……。"
"10047050-135-レナ" = "こいつらまでしょんぼりしてる！？"
"10047050-136-カノエ" = "レナちゃん……。"
"10047050-137-レナ" = "う、ううっ……！！"
"10047050-142-レナ" = "わかったわよ！でも、私に迷惑かけないでね！"
"10047050-143-レナ" = "私の物を壊したら、損害賠償請求してやるんだから！"
"10047050-144-エリ" = "にゅふふ、ありがとうございます！さすがレナちゃんです！"
"10047050-146" = "（そうして、儀式の準備が始まった）"
"10047050-150-カノエ" = "へぇ……この魔法陣、初めて見るねぇ……#nどこでこれを……？"
"10047050-151-エリ" = "古代の[ruby=アイソセフィ]数秘術[/ruby]を参考にした、オリジナル魔法陣です。"
"10047050-152-カノエ" = "イヒッ、やるねぇ……。"
"10047050-153-ツムギ" = "素人の私にも素晴らしさが伝わってきます……！"
"10047050-154-レナ" = "ちょっと、盛り上げないで！？"
"10047050-156" = "（しばらくして……）"
"10047050-159-エリ" = "はい、これで魔法陣は完成です。"
"10047050-160-エリ" = "あとは呪文を唱えるだけですね。"
"10047050-166-エリ" = "ええと、[ruby=Ph'nglui]ふんぐるい[/ruby]……[ruby=Mglw'nafh]むぐるうなふ[/ruby]……。"
"10047050-167-レナ" = "ちょっ、ストップ！なんか違うの出て来ちゃいそう！"
"10047050-168-エリ" = "だめですか？では……。"
"10047050-173-エリ" = "ホクス・ポクス……！"
"10047050-174-レナ" = "それ悪魔呼べるの！？"
"10047050-175-カノエ" = "レナちゃん……詳しいねぇ……。"
"10047050-176-ツムギ" = "ふむ、本当は誰よりもオカルトに真剣だったのですね……。"
"10047050-181-レナ" = "う、うるさいっ！みんながいっつも呪文唱えてるからっ！"
"10047050-182-エリ" = "にゅふ……では、私オリジナルの呪文にしましょうか。"
"10047050-186-エリ" = "アルカナの導きをいただき、暁を見つめる者たちよ。"
"10047050-187-エリ" = "光の旅路の先――[ruby=あす]明日[/ruby]に待つ運命よ……。"
"10047050-188-エリ" = "地上の願いを集め、禁断の炎に呼びかける――#nここに、顕現せよ！"
"10047050-193-エリ" = "割れよ、炸裂の種子――！！"
"10047050-194-レナ" = "さ、炸裂！？それって……！"
"10047050-198-エリ" = "おお……煙があがる程度かと思いきや、こんな爆発が……！"
"10047050-199-エリ" = "日々の鍛錬の成果でしょうか……！？"
"10047050-211-寮監隊員" = "お前ら！何をしているっ！！"
"10047050-213-エリ" = "ああっ……！とうとう「忌むべき者」たちが……！"
"10047050-214" = "[s] \"「忌むべき者」って寮監隊のことだったんだ？\""
"10047050-215-カノエ" = "私たちの……最大の宿敵……。"
"10047050-216-ツムギ" = "ふふ、成功の前には障害があるもの。"
"10047050-217-ツムギ" = "ですが、諦めてはいけません。大事なのは――"
"10047050-222-ツムギ" = "――「マインド」。"
"10047050-223-ツムギ" = "……ですから。"
"10047050-224-レナ" = "そろそろ懲りろっ！"
"10047050-225-レナ" = "あーもう終わりよ終わり、ダメねこれ……。"
"10047050-226-寮監隊員" = "美術館の騒ぎも、お前たちだな？"
"10047050-228-寮監隊員" = "おい！全員拘束しろ！！"
"10047050-235" = "[ns] \"あ、あの……私も……？\""
"10047050-236-寮監隊員" = "何者であろうと、我々の執行対象に例外はない！"
"10047050-243" = "（オカ研のみんなと一緒に連行された）"
