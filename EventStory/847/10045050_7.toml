[translation]
"10045050-1" = "第5話;脱落からの浮上をかけて"
"10045050-4" = "[ns] \"……ョウ……！\""
"10045050-6" = "[ns] \"キキョウ……！\""
"10045050-9-キキョウ" = "ゴホッ、ゴホッ！#n……ゲホッ、ゲホッ！"
"10045050-13-ナグサ" = "キキョウ！"
"10045050-18-キキョウ" = "先生……？"
"10045050-19" = "[s1] \"目を覚ましてくれてよかった……。\"\n[s2] \"浅いところで助かったよ。\""
"10045050-22-キキョウ" = "ゴホッ……！"
"10045050-23-キキョウ" = "い、一体……どうなったの？試合は？"
"10045050-24-ナグサ" = "試合はもう終わったよ。決勝に進んだのはチセさんとイズナさん。 "
"10045050-25-ナグサ" = "私たちは全員脱落。"
"10045050-26-キキョウ" = "……！！"
"10045050-27-キキョウ" = "まさか、私のせいで……？"
"10045050-28-レンゲ" = "そんな気にすんなって！仲間を助けるのは当然だろ？"
"10045050-29-キキョウ" = "私のせいだ……。"
"10045050-30-キキョウ" = "私は泳げない……水が怖いって最初から言っておけば……こんなことにはならなかったのに。"
"10045050-32-ユカリ" = "水が嫌いなのではなくて……怖がっていたんですの？"
"10045050-33-キキョウ" = "……アウトドアは苦手だから、水辺に行く機会なんてなかった。"
"10045050-34-キキョウ" = "当然、泳ぐこともできないし、深い水に入るのなんて死んでも御免。"
"10045050-35-キキョウ" = "でも……百花繚乱の作戦参謀である私が、そんなこともできないなんて言い出せなくて……。"
"10045050-36-キキョウ" = "本当にごめん。私が余計な意地を張ったせいで……。"
"10045050-37-レンゲ" = "だから、気にするなって！そもそも、これはアタシの責任でもあるんだ。"
"10045050-38-レンゲ" = "幼なじみなのに、そんなことも気づいてやれなかったんだから。"
"10045050-39-レンゲ" = "アタシこそ、ごめん。"
"10045050-40-キキョウ" = "違う、悪いのは私。"
"10045050-41-レンゲ" = "いや、アタシが悪いんだって！"
"10045050-42-キキョウ" = "どう考えても私が！"
"10045050-43-レンゲ" = "いいや、アタシが……！"
"10045050-45-ユカリ" = "ふふっ、お二人は本当に仲良しですの。"
"10045050-46-ユカリ" = "キキョウ先輩。あまり気にしないでください。"
"10045050-47-ユカリ" = "身共は、先輩が無事だっただけで十分ですわ。"
"10045050-48-キキョウ" = "……みんな、私を恨まないの？"
"10045050-50-ナグサ" = "どうして？大会に出たのは親睦を深めるのが目的だったよね？#n勝ち負けは関係ないよ。"
"10045050-51-ユカリ" = "その通りですの。ご自分を責めすぎないでください。"
"10045050-52-キキョウ" = "でも……。"
"10045050-54" = "[ns] \"心配しないで！チャンスはまだ残ってるよ！\""
"10045050-55-キキョウ" = "どういうこと？"
"10045050-56" = "[s3] \"それは後のお楽しみに取っておこう。\"\n[s4] \"みんな、ビーチバレー会場でまた会おう！\""
"10045050-59-キキョウ" = "……？"
"10045050-62-シズコ" = "早いもので、百夜水上祭も終盤に差し掛かってきましたね～"
"10045050-63-シズコ" = "でも、こうして終わりに近づいていくのは寂しい……ですよね？"
"10045050-67-シズコ" = "そんな皆さんの熱い声援にお応えして、追加試合を用意しました！#nそれがこちら……！"
"10045050-68-シズコ" = "敗者復活戦！"
"10045050-69-シズコ" = "水上障害物レースで脱落した8人が2人1組のチームになって、トーナメント方式でビーチバレーを行います！"
"10045050-70-シズコ" = "この敗者復活戦で優勝したチームは、追加で最終戦に進出できますよ！"
"10045050-71-シズコ" = "お祭りはまだまだ続きます！#n皆さん、がんばってくださいね、にゃんにゃん！"
"10045050-72" = "[ns] \"ランダムに決まった組分けと対戦カードを発表するよ！\""
"10045050-74" = "[log]ビーチバレー第1試合！[/log]"
"10045050-77" = "VS"
"10045050-81-レンゲ" = "おっ、キキョウと一緒か。#nそれに、初戦の相手も悪くないな。"
"10045050-82-キキョウ" = "……。"
"10045050-84-アラタ" = "なんでよりによってあいつらなんだ……！"
"10045050-85-スケバンリーダー" = "まだだ！私たちにだって、勝てる可能性はある！"
"10045050-87" = "[ns] \"次はこちら！\" "
"10045050-89" = "[log]ビーチバレー第2試合！[/log]"
"10045050-92" = "VS"
"10045050-96-ユカリ" = "ナグサ先輩とチーム！これはですてぃにーですの！"
"10045050-97-ユカリ" = "先輩と一緒なら優勝間違いなしですわ！"
"10045050-98-ナグサ" = "うん、頑張ろうね。"
"10045050-100-百鬼夜行サークル部員A" = "ど、どうしましょう？ 相手が強すぎます……！"
"10045050-101-ミモリ" = "もっと自信を持ってください。#n私たちだって、ここまで勝ち残っているんですから。"
"10045050-102-ミモリ" = "ふふっ……修行相手として、申し分ありませんね。"
"10045050-104-シズコ" = "これは面白い対戦カードになりました！"
"10045050-105-シズコ" = "第1試合は、休憩を挟んだ後に！"
"10045050-106" = "[ns] \"みんな、チャンネルはそのままで……！\""
"10045050-108-キキョウ" = "（結局、私たちか先輩たち、どっちかは脱落する）"
"10045050-109-キキョウ" = "（でも、もしまた私のせいでレンゲまで敗退することになったら……）"
"10045050-110-キキョウ" = "（……）"
"10045050-111-キキョウ" = "（私がやらなきゃ……）"
"10045050-112-キキョウ" = "（今度は水の上じゃないし、私にもできるはず……！）"
"10045050-113-キキョウ" = "（初戦の相手もそこまで強くない。レンゲがいれば大丈夫）"
"10045050-114-キキョウ" = "（なのに、どうして……）"
"10045050-115-キキョウ" = "（……どうして、嫌な予感がするの？）"
