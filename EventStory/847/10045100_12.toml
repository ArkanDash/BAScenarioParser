[translation]
"10045100-1" = "第10話;決勝の果て"
"10045100-2-シズコ" = "第1試合から手に汗握る名勝負が生まれましたね！"
"10045100-6-シズコ" = "次はどんな勝負になるのでしょうか！？最終戦第2試合！#nイズナ選手対チセ選手の試合を開始しますっ！"
"10045100-7-カホ" = "チセちゃん！頑張ってください！"
"10045100-8-ミチル" = "うおお！イズナ～！「忍術研究部」の力、見せつけてやるんだよ！"
"10045100-9-ツクヨ" = "私たちの、分まで、頑張ってください……イズナちゃん！"
"10045100-11-キキョウ" = "観客席から試合を見るのは初めてだけど――"
"10045100-12-キキョウ" = "みんな、こうやって応援してたんだね。"
"10045100-13-ナグサ" = "凄い熱量だよね。"
"10045100-15-ユカリ" = "これぞまさに夏のふぇすてぃばるですの！"
"10045100-16-ユカリ" = "さて……レンゲ先輩と決勝で対戦するのはどちらになるのか――"
"10045100-17-ユカリ" = "身共、楽しみですの！"
"10045100-19" = "[ns] \"いざ尋常に～勝負！\""
"10045100-21-イズナ" = "参ります！イズナ流忍法、高速移動の術！"
"10045100-25-チセ" = "速いね～"
"10045100-26-チセ" = "でも……負けないよ～"
"10045100-33-シズコ" = "意外や意外！これは手数……スピードの勝負になってきました！"
"10045100-34-イズナ" = "チセ殿、これほど俊敏な動きができるとは……！#n御見それしました！"
"10045100-35" = "[ns] \"あれは……！カルタとムシクイーンで鍛えられた圧倒的なスピード！\""
"10045100-36-シズコ" = "百鬼夜行のアイドルにできないことなんてないのか……！？"
"10045100-37-チセ" = "そろそろ、終わらせるね～"
"10045100-38-チセ" = "俳句を、詠んであげる。"
"10045100-39-イズナ" = "なんとっ……！？"
"10045100-40-イズナ" = "イズナ流忍法！空蝉の術……！"
"10045100-45-チセ" = "逃げられた。"
"10045100-46-イズナ" = "チセ殿……いい眼をお持ちのようで……。#n思わず目力に気圧されてしまいました！"
"10045100-47-イズナ" = "ですが、イズナも負けません！#n応援してくれる皆さんのためにも……！"
"10045100-49-チセ" = "私と一緒だね～"
"10045100-50-チセ" = "うーん……。"
"10045100-52" = "ど#nっ#nち#nか#nが"
"10045100-54" = "倒#nれ#nる#nま#nで#nや#nる"
"10045100-56" = "勝#n負#nか#nな"
"10045100-59" = "[log=치세 수영복]どっちかが[/log]"
"10045100-60" = "[log=치세 수영복]倒れるまでやる[/log]"
"10045100-61" = "[log=치세 수영복]勝負かな[/log]"
"10045100-62-イズナ" = "いざ……！"
"10045100-63-チセ" = "……！"
"10045100-66" = "実力はほぼ互角。お互いに決定打がないまま、戦いは長期戦にもつれ込んだ。"
"10045100-67" = "もはや、勝敗を分けるものは……精神力のみ。"
"10045100-68" = "そして試合は終盤へと差し掛かる……。"
"10045100-70-イズナ" = "はぁ、はぁ……。"
"10045100-71-チセ" = "ふぅ……。"
"10045100-72-ナグサ" = "そろそろ、二人とも限界だね。"
"10045100-73-キキョウ" = "次の一撃で勝負が決まるはず……。"
"10045100-74-ユカリ" = "どちらが勝つのか、まだまだ分かりませんの！"
"10045100-76-カホ" = "チセちゃん！頑張って……！"
"10045100-78-ミチル" = "忍者とはどんな窮地でも――！"
"10045100-79-ツクヨ" = "決して、諦めない……もの！"
"10045100-87-シズコ" = "そこに立っているのは――！"
"10045100-91-イズナ" = "はぁ、はぁ……。"
"10045100-92" = "[ns] \"[ruby=くだ]久田[/ruby]イズナ……！\""
"10045100-95-イズナ" = "チセ……殿。いい勝負、でした……！"
"10045100-99-チセ" = "負けちゃった。"
"10045100-100-チセ" = "……ここで一句。"
"10045100-101-チセ" = "戦って"
"10045100-102-チセ" = "負けても悔いなし"
"10045100-103-チセ" = "青春だ"
"10045100-105-レンゲ" = "よし、これで決勝の相手が決まったな。"
"10045100-106-イズナ" = "レンゲ殿ー！次の試合で……お会いしましょう！"
"10045100-107" = "[ns] \"ついにファイナリストが出揃ったね！\""
"10045100-108-シズコ" = "それでは少し休憩を挟んだ後、待望の決勝戦を開始します！"
"10045100-109-シズコ" = "皆さん、しばらくお待ちください！"
"10045100-111-ワカモ" = "こちらですか。あなた様が優勝者を審査する会場は。"
"10045100-112-ワカモ" = "まずは情報収集から始めましょうか。"
"10045100-114" = "しばらくして……。"
"10045100-117-シズコ" = "大変長らくお待たせいたしました！#n百夜水上祭の決勝戦！その準備がすべて整いましたっ！"
"10045100-118-シズコ" = "決勝に進んだお二人、まずは意気込みをお願いします！"
"10045100-119-イズナ" = "あ、えっと、イズナは……。"
"10045100-120-イズナ" = "素晴らしい方々と楽しい試合をさせていただき、本当に光栄でした！#n決勝戦もこの気持ちを忘れずに全力で挑みます！"
"10045100-121-イズナ" = "みなさんも最後まで応援よろしくお願いします！ニンニン！"
"10045100-123-ミチル" = "頑張れー！イズナー！"
"10045100-124-ツクヨ" = "い、いけぇぇ……。"
"10045100-126-レンゲ" = "次はアタシの番だな。"
"10045100-127-レンゲ" = "アタシは……一人の力だけじゃここまで来られなかった。#n仲間がいて、友達の応援があったからこそ、ここまで来れたんだ。"
"10045100-128-レンゲ" = "だから見ててくれよ！みんなの分までアタシが勝ってみせるから！"
"10045100-129-キキョウ" = "負けたら許さないから。"
"10045100-130-ナグサ" = "レンゲならきっとやれるよ。"
"10045100-131-ユカリ" = "先輩！ぱ～ふぇくとな勝利を見せてください！"
"10045100-133-シズコ" = "お二方とも、ありがとうございます！#nそれではいよいよ、試合開始です……！"
"10045100-134-シズコ" = "さあ、お互い向き合って……！"
"10045100-140" = "[ns] \"いざ尋常に……勝負！！\""
"10045100-148-レンゲ" = "（まぁ、そう簡単にはいかないよな）"
"10045100-149-イズナ" = "（この一瞬でも分かります。#nレンゲ殿……凄まじい相手です！）"
"10045100-150-レンゲ" = "（だけど……）"
"10045100-151-イズナ" = "（でも……）"
"10045100-152-レンゲ&イズナ" = "（ここで退くわけにはいかない！）#n（ここで負けるわけにはいきません！）"
"10045100-159-シズコ" = "先生、ここで優勝者を予想していただけますか～？"
"10045100-160" = "[s] \"正直……分からないね。どちらが勝ってもおかしくないし。\""
"10045100-161-シズコ" = "あの先生でも！最後の一瞬まで分からない！#nだからこそ手に汗握る！ここからは瞬き厳禁ですよ！"
"10045100-162-シズコ" = "（頑張ってよかったなぁ……百夜水上祭、大成功の予感……！）"
"10045100-163-シズコ" = "（これで私たちお祭り運営委員会の名前が、百鬼夜行の歴史におっきく刻まれることは間違いな――）"
"10045100-164-ワカモ" = "うふふ、お待ちください。"
"10045100-165-シズコ" = "……うん？えっ！？あ、あなたは……！？"
"10045100-166-ワカモ" = "ここまで静かに見守っておりましたが……そろそろ我慢の限界です。"
"10045100-167-ワカモ" = "覇を競い、先生が審査される大会……。"
"10045100-168-ワカモ" = "やはり、私も参加しなければ――"
"10045100-172-スケバンリーダー" = "災厄の狐が動き出した！よし、私たちも行くぞ！"
"10045100-173-スケバンリーダー" = "全部ぶっ壊せえええ！！！"
"10045100-185-ワカモ" = "これは、一体……？"
"10045100-186-シズコ" = "あああっ、手間暇かけて準備した競技場が……！"
"10045100-187-ユカリ" = "な、なんて酷いことを！"
"10045100-189-スケバンリーダー" = "くっくっく……止められるもんなら止めてみろ！#nこっちには「災厄の狐」がついているんだからな！"
"10045100-193-スケバンリーダー" = "さぁ、やるぞ！今日からここは私たちのシマだ！"
"10045100-194-ワカモ" = "……誰が競技場を壊していいと言いました？"
"10045100-195-スケバンリーダー" = "……うん？"
"10045100-196-ワカモ" = "先生の御前で強者たちを倒し、私こそが百鬼夜行随一であると、お褒めの言葉をいただくつもりでしたのに。"
"10045100-197-ワカモ" = "それを邪魔するだなんて、どういう了見ですか？"
"10045100-198-スケバンリーダー" = "えっ？いや、その……一緒に強者を倒しに来たんだろ？"
"10045100-200-ワカモ" = "私は規則にのっとって、競技に挑みたかっただけです。"
"10045100-201-ワカモ" = "それを、このような……。"
"10045100-202-スケバンリーダー" = "あ、あれ？"
"10045100-203-キキョウ" = "……みんな、行くよ。"
"10045100-204-キキョウ" = "先生、指揮をお願い。"
"10045100-205" = "[s] \"うん！任せて！\""
