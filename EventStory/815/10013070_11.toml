[translation]
"10013070-1" = "第7話;最後の戦いを前に"
"10013070-2" = "（次の目的地へ向かう前、しばらく時間が空いた頃）"
"10013070-6" = "[s1] \"そういえば、シズコはニャン天丸と契約しなかったね。\"\n[s2] \"黒亀組の兵力があれば、仕事もスムーズになったかも。\""
"10013070-9-シズコ" = "えっ？仕事って「リゾート狩り」のことですか？"
"10013070-10-シズコ" = "まあ、それはそうかもしれませんけど……。"
"10013070-11-シズコ" = "でも、契約はしません！"
"10013070-12" = "[s] \"どうして？\""
"10013070-13-シズコ" = "だって……そんなの当然じゃないですか。#nニャン天丸のしたことは詐欺や迷惑行為に過ぎなかったんですから。"
"10013070-14-シズコ" = "歪んだ商売で、みんなの楽しい一時を台無しにするようなことは！#n絶対に許せません！"
"10013070-15-シズコ" = "ですから、あんな奴と契約するくらいなら、諦めた方がまだマシといいますか……"
"10013070-19-シズコ" = "と、とにかく！そういうことです！はい！"
"10013070-20" = "[s] \"うん、とてもシズコらしいね。\""
"10013070-21-シズコ" = "うっ！ま、またそのようなことを……"
"10013070-22-シズコ" = "もうっ……！"
"10013070-23-シズコ" = "ふぅ……ひとまず、「リゾート狩り」については大詰めと見て良いと思います。"
"10013070-24-シズコ" = "ですから終盤に向けて、一度アビドスの生徒たちと作戦会議をしましょう！"
"10013070-26-ホシノ" = "なるほどね～……カイザーPMCか。"
"10013070-27-セリカ" = "やっぱり、私たちの見立ては正しかったみたいね。"
"10013070-28" = "[s] \"どういうこと？\""
"10013070-29-アヤネ" = "それが……私たちも後から知ったのですが……"
"10013070-31-アヤネ" = "どうやら、ヘルメット団はカイザーPMCと繋がっているみたいなんです。"
"10013070-32" = "[s] \"ラブが率いてるヘルメット団が……。\""
"10013070-33-シズコ" = "ニャン天丸もヘルメット団もカイザーPMCの支援を受けていたってことは……"
"10013070-34-シズコ" = "つまり、私たちに「リゾート使用権」を売り飛ばしたオクトパスバンクは、#n最初から裏で「リゾート狩り」を唆すつもりだったってこと！？"
"10013070-35-シズコ" = "本当に何なの！？あいつら！"
"10013070-37-ホシノ" = "うへぇ～。本当に綺麗に全部カイザーに繋がるねぇ。"
"10013070-38-シロコ" = "ん。でも、そのおかげでやるべきことがハッキリした。"
"10013070-39-アヤネ" = "はい！私たちもこれからヘルメット団がいる所に向かおうと思います！"
"10013070-40" = "[s] \"それじゃあ、次はアビドスと百鬼夜行の合同作戦になるね。\""
"10013070-41-ホシノ" = "実は、ちょうどこっちもヘルメット団を攻略するための作戦を立ててたんだよね。"
"10013070-42" = "[s] \"作戦？\""
"10013070-43-アヤネ" = "あの、ホシノ先輩……その作戦、本当に大丈夫なんですか？"
"10013070-44-シロコ" = "私はアリだと思う。ホシノ先輩の作戦だし。"
"10013070-46-ノノミ" = "何より、面白そうですからね～。"
"10013070-47-シズコ" = "その作戦って、一体……"
"10013070-48-ホシノ" = "ふっふっふ～……まだ秘密だよ。#nほら、敵を欺くならまずは味方からって言うじゃん？"
"10013070-49" = "[s] \"まあ、ホシノがそう判断するなら異論はないけど。\""
"10013070-50-ホシノ" = "おぉ～、信じてくれるの？おじさん、ちょっと嬉しいかも。"
"10013070-51-アヤネ" = "私は少し心配ですけど……"
"10013070-52-セリカ" = "いやいや！何度考えてもおかしいわよその作戦！もう一回考え直した方が……！"
"10013070-53-ホシノ" = "それじゃ～、お互い最後までがんばろ～。"
"10013070-57" = "[ns] \"なんだか、大がかりな準備をしてるみたいだね。\""
"10013070-58-シズコ" = "そうみたいですね……。#nさて、終わりも見えてきたことですし、"
"10013070-59-シズコ" = "さっさと解決しちゃいましょう！"
