[translation]
"10010105-1" = "第10話;終わらせないために（２）"
"10010105-11" = "（……疲れが取れたからか、自然と目が覚めた）"
"10010105-12-ウイ" = "……お、お目覚めですか、先生。"
"10010105-19-ウイ" = "お、思ったより、早かったですね……もしかして、作業の音が気になりましたか……？"
"10010105-20-ウイ" = "もう一方は……寝言を言いながら、ぐっすりですが……。"
"10010105-22-ヒナタ" = "んんっ……くすぐったいです、ふふっ……。"
"10010105-23-ウイ" = "……さ、さっきから、ずっとこんな感じです"
"10010105-24-ウイ" = "いったい、どんな夢を見ているのか……さっきまで、かなり疲弊した様子だったのに……。"
"10010105-25" = "[s1] \"……ウイも、お疲れ様。ありがとう。\"\n[s2] \"作業は順調？\""
"10010105-28-ウイ" = "ま、まあ、そうですね……。"
"10010105-29-ウイ" = "任せてくださいと啖呵を切って、だ、ダメでしたとは言えないので……。"
"10010105-30-ウイ" = "あと……だいたい一時間くらいで、完成しそうです。"
"10010105-31" = "[s3] \"すごい速さだね、あんなバラバラだったのに……。\"\n[s4] \"さすがは魔術師。\""
"10010105-34-ウイ" = "そ、そうやって褒められても、何も出ませんが……。"
"10010105-35-ウイ" = "まあ、嫌ではないものの……そもそも褒められることも、少ないので……。"
"10010105-36-ウイ" = "と、とにかく……はい、ありがとうございます……。"
"10010105-37-ウイ" = "……。"
"10010105-38-ウイ" = "こ、これは、ですね……。"
"10010105-39-ウイ" = "作業中のひとり言……そ、そんなものだと、思ってください。"
"10010105-40-ウイ" = "じ、実はケーキを取ってきて欲しいというのは……やや嫌がらせのようなもの、と言いますか。"
"10010105-41-ウイ" = "む、無茶な案件を持ち込まれたので、少しこっちも無理なことを言おうと……口から出てしまったんです。"
"10010105-42-ウイ" = "ですので正直なところ、期待はしていませんでした……。"
"10010105-43-ウイ" = "ですがヒナタさんは、そして先生はちゃんと買ってきて……トラブルも解決してて……ヒナタさんなりに正しくあろうと、ずっと頑張って……。"
"10010105-44-ウイ" = "だ、だからと言って、すぐに見方を変えるわけではありませんが……。"
"10010105-45-ウイ" = "えっと……。"
"10010105-46" = "[s5] \"それもあって、頑張ってくれてるんだ。\"\n[s6] \"……少し感じるところがあったとか？\""
"10010105-47-ウイ" = "どう、ですかね……。"
"10010105-48-ウイ" = "どう、ですかね……。"
"10010105-49-ウイ" = "な、「仲良くなった」だなんて、簡単に言うつもりもありません……ですが……。"
"10010105-51-ウイ" = "以前だったら、その……ここで寝てくださいとは、絶対に言いませんでした……多分。"
"10010105-52-ウイ" = "じ、自分でも、不思議です……。"
"10010105-56-ウイ" = "それに、こ、こんな遅い時間に……。"
"10010105-57-ウイ" = "こうして、だ、誰かと話しているなんて、その、不思議な感じで……。"
"10010105-59-ウイ" = "もしかしたら……あくまで「もしかしたら」という話、ですが……。"
"10010105-60-ウイ" = "その分、私も……。"
"10010105-61-ウイ" = "こ、こう、向き合うと言いますか……。"
"10010105-62-ウイ" = "その……。"
"10010105-63-ヒナタ" = "ふあっ……！良く寝ました。"
"10010105-65-ウイ" = "……。"
"10010105-69-ヒナタ" = "……あ、あれ？ここは……。"
"10010105-70-ヒナタ" = "そ、そうでした。経典の復元を……。"
"10010105-71-ヒナタ" = "えっと、今の時間は……？"
"10010105-72-ヒナタ" = "あっ、寮の点呼の時間、過ぎてしまいました……。"
"10010105-73-ヒナタ" = "……点呼の、時間？"
"10010105-74-ウイ" = "ヒナタさん、ようやくお目覚め――"
"10010105-76-ヒナタ" = "点呼の時間！？"
"10010105-77-ウイ" = "……な、何ですか急に。"
"10010105-78" = "[ns7] \"ヒナタ……？\"\n[ns8] \"どうしたの？\""
"10010105-79-ヒナタ" = "た、たたたたた大変です先生！点呼、点呼の時間を過ぎてしまいました……！？"
"10010105-80-ヒナタ" = "た、たたたたた大変です先生！点呼、点呼の時間を過ぎてしまいました……！？"
"10010105-81-ヒナタ" = "いつの間にもう、こんな時間に……！ど、どうすれば……！？"
"10010105-82-ウイ" = "……何を騒いでいるのかと思ったら。寮の点呼くらいでそんなにうるさくしないでください。それにまだ作業中で……"
"10010105-83-ヒナタ" = "だだだ、だって！怒られちゃいます！居眠りをして点呼に遅れるだなんて、他のシスターに知られたらどんな叱責を受けることか……！"
"10010105-84-ウイ" = "し、シスターフッドは厳しいんですね……内情についてはあんまり知りませんが、イメージ通りといえばイメージ通りでしょうか。というか、静かにしてください……。"
"10010105-85-ヒナタ" = "ど、どうしましょう！？い、一体何と言えば……！？このままですと私……！"
"10010105-86-ウイ" = "静かに……"
"10010105-88-ウイ" = "し……"
"10010105-90-ヒナタ" = "ま、まずとにかく寮に連絡を……！"
"10010105-91-ウイ" = "静かにしなさい！！！！"
"10010105-92-ヒナタ" = "ひいいっ！？"
"10010105-93" = "[s9] \"あー……。\"\n[s10] \"今のは仕方ない……。\""
"10010105-94-ウイ" = "静かにしなさいって何度言えば分かるんですか！？ねぇ！？"
"10010105-95-ウイ" = "静かにしなさいって何度言えば分かるんですか！？ねぇ！？"
"10010105-96-ヒナタ" = "す、すみません……！？で、ですがその、えっと……！"
"10010105-97-ヒナタ" = "うぅ、ごめんなさい……。"
"10010105-102-ウイ" = "スマホはマナーモードに！！"
"10010105-103-ヒナタ" = "はいっ、すぐに切り替えます……！"
"10010105-104-ヒナタ" = "……？"
"10010105-108-ヒナタ" = "……え？"
"10010105-110-ウイ" = "……今度は何ですか。"
"10010105-111-ヒナタ" = "えっと……。"
"10010105-112-ヒナタ" = "え、嘘ですよね？今の、メッセージ……。"
"10010105-113-ヒナタ" = "全体連絡が……。"
"10010105-114-ウイ" = "……全体連絡？"
"10010105-115-ヒナタ" = "えっと、「お知らせです。明日に予定されていた経典の公開および朗読の式典につきまして……"
"10010105-116-ヒナタ" = "……。"
"10010105-117" = "[s11] \"ヒナタ……？\"\n[s12] \"続きは……？\""
"10010105-118-ヒナタ" = "「ご出席される方々の全会一致で、日程を早めることになりました」"
"10010105-119-ヒナタ" = "「ご出席される方々の全会一致で、日程を早めることになりました」"
"10010105-120-ヒナタ" = "「式典の開催時間は、今夜の12時とします」……"
"10010105-121-ヒナタ" = "……12時？"
"10010105-122-ウイ" = "……。"
"10010105-124-ウイ" = "今夜の12時って……"
"10010105-131-ウイ" = "あと1時間後、ですね……。"
