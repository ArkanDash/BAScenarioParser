[translation]
"10010070-1" = "第7話;少し似た人たち（１）"
"10010070-11-ウイ" = "……。"
"10010070-15-ウイ" = "うーん……。"
"10010070-16" = "[s1] \"……ウイ？\"\n[s2] \"何か問題でもあった？\""
"10010070-17-ウイ" = "い、いえ、その……。"
"10010070-18-ウイ" = "い、いえ、その……。"
"10010070-23-ウイ" = "何と言いますか、その……自分からお願いしておいて、何ですが……。"
"10010070-24-ウイ" = "ほ、本当に見つけてくるとは……それに、こんなにも早く。ま、まあ、揃わないと作業はできませんし、式典に間に合わないとマズいというのは、そうなのですが……。"
"10010070-25-ウイ" = "特に「[ruby=みずごけにかわ]水苔膠[/ruby]」……こ、これを探すだけでも、優に数日はかかるのではと思ったんです。"
"10010070-26-ウイ" = "あと、なぜかお二方は、ホコリまみれですし……。"
"10010070-27-ヒナタ" = "すみません、色々ありまして……。"
"10010070-28-ウイ" = "え、えっと……。"
"10010070-29-ウイ" = "……色んな見方がある、ということですかね。"
"10010070-30-ウイ" = "な、何と言いますか、思ったよりと言いましょうか……。"
"10010070-31-ウイ" = "……お疲れ様でした。"
"10010070-32-ヒナタ" = "……？"
"10010070-36" = "[ns] \"ウイ？\""
"10010070-42-ウイ" = "あ、あとこの、ケーキも……何故か形が相当崩れてますが……。"
"10010070-44-ヒナタ" = "そ、それは……！"
"10010070-48-ウイ" = "……ま、まあ先生もいてのことですし、それなりの理由があったでしょう。何となく察しはします。"
"10010070-49-ウイ" = "そ、それに私は、こうして貰う立場ですし……ありがたく頂きます。"
"10010070-50-ヒナタ" = "ウイさん……。"
"10010070-51-ウイ" = "と、とはいってもその……仲良くおしゃべりをしている場合では、ありません。"
"10010070-52-ウイ" = "時間が無いこと……それは、お、お二人の方が、よくご存じでしょうし……。"
"10010070-53-ウイ" = "こ、これだけでは、まだ作業を始められません。"
"10010070-54-ウイ" = "精聖薬……よろしくお願いしますね。"
"10010070-55-ヒナタ" = "は、はい……！"
"10010070-57-ウイ" = "ま、まあ多分、大丈夫だとは思っていますが……。"
"10010070-58-ヒナタ" = "……？"
"10010070-62-ウイ" = "……いえ。"
"10010070-63-ウイ" = "えっと、お、お待ちしております……。"
