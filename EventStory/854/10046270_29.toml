[translation]
"10046270-3-ティーパーティーの下級生" = "あの……。"
"10046270-5-イチカ" = "あれ？役員の皆さんじゃないっすか。"
"10046270-6-イチカ" = "何かご用っすか？"
"10046270-8-ティーパーティーの下級生" = "いえ、その逆です。私たちにも、何か手伝えることはないですか？"
"10046270-9-ティーパーティーの下級生" = "ずっとお一人で……さぞ大変だったことでしょう。"
"10046270-11-イチカ" = "え？あー……お気持ちは嬉しいんすけど……。"
"10046270-13-ティーパーティーの上級生" = "人手、全然足りていないのではなくて？"
"10046270-14-ティーパーティーの下級生" = "あのナギサ様ですから、何かお考えがあるのでは……。"
"10046270-15-ティーパーティーの上級生" = "でも、そのナギサ様は現場のことをあまりご存知ないのよ？"
"10046270-16-ティーパーティーの下級生" = "それは、まあ……。"
"10046270-17-ティーパーティーの上級生" = "あなたもそう思いませんか？"
"10046270-19-イチカ" = "わ、私っすか！？"
"10046270-21-ティーパーティーの上級生" = "ええ、あのお方は毎度あの調子ですから……。"
"10046270-22-ティーパーティーの上級生" = "現場のことをいちいち考えられる立場ではないのでしょうけれど……#nあんまりですよね～"
"10046270-24-イチカ" = "は、ははは……。"
"10046270-26-ティーパーティーの上級生" = "とはいえ文句を言っていても始まりません。"
"10046270-27-ティーパーティーの下級生" = "なので、手伝いに来たんです。"
"10046270-29-イチカ" = "実際、ちょうど困ってたんで、助かるっす。"
"10046270-30-イチカ" = "んじゃ、よろしくお願いするっす！"
