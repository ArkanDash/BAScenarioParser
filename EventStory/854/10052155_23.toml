[translation]
"10052155-7-オウル" = "う、嘘です……こんなの、あり得ませんっ……！"
"10052155-8-ソフ" = "どうして……？どうすればいいの……？#nこのままじゃ計画が……！"
"10052155-13-ソフ" = "……え？"
"10052155-15-ヒマリ" = "この信号は――まさか！？"
"10052155-20-アイン" = "お、お待たせしました……もう大丈夫です！"
"10052155-21-アイン" = "お姉様が出撃します！！！"
"10052155-28-ソフ&オウル" = "お姉様！！！！"
"10052155-29-マルクト" = "ごめんなさい。アイン、ソフ、オウル。"
"10052155-30-マルクト" = "ここからは、我に任せてください。"
"10052155-44-ユズ" = "きゃああああああぁぁぁぁっ！？！？"
"10052155-45-リオ" = "ユズ、緊急脱出して！"
"10052155-46-ユズ" = "ど、どうやってですか！？！？"
"10052155-47-リオ" = "こちらからやるわ！#n強制脱出装置――稼動！"
"10052155-49-ユズ" = "え、ええ……！？"
"10052155-54-ユズ" = "きゃああああぁぁぁぁっ！？！？"
"10052155-61-ヒマリ" = "ネオアバンギャルド君――大破！#nユズは……！？"
"10052155-62-リオ" = "大丈夫、無事に脱出したわ。パラシュートも開いている。"
"10052155-68-ユズ" = "うううぅぅぅ……。"
"10052155-72-モモイ" = "ユズ！"
"10052155-73-ミドリ" = "ユズちゃん！"
"10052155-75-アリス" = "大丈夫ですか、ユズ！？"
"10052155-81-ユズ" = "ううぅっ……。"
"10052155-82" = "[s] \"ユズ！よく頑張ったね！\""
"10052155-86-ユズ" = "は、はい……？"
"10052155-87-ユズ" = "み、皆さんの力になれたなら良かったです。えへへ……。"
"10052155-91-トキ" = "リオ様。"
"10052155-92-リオ" = "なにかしら？"
"10052155-93-トキ" = "次は私をパイロットにしてください。#n私もユズみたいに、先生からナデナデされたいです。"
"10052155-94-リオ" = "え、ええ……？"
"10052155-96-エイミ" = "トキ。私たちには別の仕事があるでしょ。"
"10052155-102-アイン" = "お姉様……。"
"10052155-103-ソフ" = "ごめんなさい、お姉様……。"
"10052155-104-オウル" = "私たちが、無力なあまり……。"
"10052155-106-マルクト" = "大丈夫です。アイン、ソフ、オウル。"
"10052155-107-マルクト" = "妹たちが苦しむときは、姉である我が出ます。"
"10052155-108-マルクト" = "とはいえ容易い相手には見えません。#n預言者は再び起こせば良いですが……。"
"10052155-109-マルクト" = "そのためには、彼の者たちを越える必要がありそうです。"
"10052155-111-アイン" = "は、はい！"
"10052155-112-ソフ" = "まさか、お姉様を頼ることになるなんて……できれば、出撃しないでいてほしかったのに……。"
"10052155-113-オウル" = "大丈夫です。まだ取り戻せます。今はまだ……！"
"10052155-115-マルクト" = "初めてお会いする皆さんに――"
"10052155-116-マルクト" = "王女と、鍵――"
"10052155-117-マルクト" = "改めまして、正式にご挨拶申し上げます。"
"10052155-118-マルクト" = "我は御旗の下に創造されし一つの意志。#n世界の果てに到達せし王国の巡礼者――マルクトです。"
"10052155-119-アリス" = "て、[ruby=てんどう]天童[/ruby]アリス、です……。"
"10052155-120-ケイ" = "……ケイです。ここではそう呼ばれています。"
"10052155-121-アリス" = "……！"
"10052155-122-アリス" = "[ruby=てんどう]天童[/ruby]ケイです！"
"10052155-123-ケイ" = "はい！？！？"
"10052155-125-マルクト" = "……？"
"10052155-127-アリス" = "だってケイは家族ですから！家族はみんな同じ苗字を使うと聞きました！"
"10052155-128-ケイ" = "た、たしかにそうですが……！"
"10052155-129-アリス" = "ケイ、どうかしましたか？#nもしかして……アリス、何か誤解していますか？"
"10052155-130-ケイ" = "いえ、そうではなく……！"
"10052155-131-ケイ" = "わ、私が……そう呼ばれて良いのかと、思いまして……。"
"10052155-132-ケイ" = "天童……ケイ……。"
"10052155-133-ケイ" = "へ、へへっ……。"
"10052155-138-マルクト" = "……。"
"10052155-139-マルクト" = "結局、その名を選んだのですね。"
"10052155-140-マルクト" = "アリス。ケイ。"
"10052155-141-ケイ" = "こ、こほん。"
"10052155-142-ケイ" = "そうです。文句でもあります？"
"10052155-143-マルクト" = "いいえ。自由意志は常に我々を導くものです。"
"10052155-144-マルクト" = "たとえそれが、高度化された錯覚に過ぎないとしても。"
"10052155-146-アイン" = "お、お姉様と……ここ、ネツァクちゃんのコアで作った[ruby=JEHOVAH]エホバ[/ruby]……。"
"10052155-147-ソフ" = "至高の[ruby=TZEVAOT]ツェバオト[/ruby]！"
"10052155-148-オウル" = "聖地。そして、ゾーハルの依代が残っている限り！"
"10052155-150-マルクト" = "ええ。"
"10052155-151-マルクト" = "我々はいつでも全てをやり直すことができ――"
"10052155-152-マルクト" = "いつでも、全てを作り直すことができます。"
"10052155-153-マルクト" = "ですので、ここでは姉である我がいきます。"
"10052155-157-マルクト" = "アイン、ソフ、オウルは、しばらく身を隠してください。"
"10052155-159-アイン&ソフ&オウル" = "はい！！！"
