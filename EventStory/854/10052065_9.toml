[translation]
"10052065-2-トキ" = "ケテルの沈黙、確認しました。"
"10052065-3-ユズ" = "うぅっ……うぅぅ……。"
"10052065-4-エイミ" = "ユズ、よく頑張ったね。"
"10052065-5-ユズ" = "はぃぃ……。"
"10052065-6-アリス" = "ケイ！こちらです！"
"10052065-10-ケイ" = "はい。ではお願いします、ヒマリ。"
"10052065-11-ヒマリ" = "確認しました。いま座標を送りますね。"
"10052065-12-モモイ" = "降下開始ぃ！"
"10052065-16-ミドリ" = "お姉ちゃん、お願いだから慎重に……って、もうやってる……。"
"10052065-23-ケイ" = "ふぅ……本当に迅速で[ruby=野蛮]直感的[/ruby]な合流方法ですね……。"
"10052065-24-ユズ" = "激しく同意……。"
"10052065-25-ヒマリ" = "エリアの掌握はほぼ完了しています。#nケイ、コアの確保はできそうですか？"
"10052065-26-ケイ" = "ええ、問題ありません。ただその間……。"
"10052065-28" = "[ns] \"敵襲があるかもしれないから、護衛をお願い。\""
"10052065-29-トキ" = "お任せください。得意分野です。"
"10052065-30-ケイ" = "……あなた、何でもかんでも得意分野って言ってませんか……？"
"10052065-31-トキ" = "その通りです。#n完璧で最高なメイドかつエージェントならば、それこそが到達すべき姿ですので。"
"10052065-32-ケイ" = "（ヒマリの変な癖が移っているようですね……）"
"10052065-33-アリス" = "今度はアリスがケイを守るターンですね……アリス、頑張ります！"
"10052065-34-ケイ" = "アリス、よろしくお願い、します……。"
"10052065-35-アリス" = "はい！アリスにお任せください！"
"10052065-36-トキ" = "そういえば、ケテルの研究地区は、ダムの決壊による洪水で完全閉鎖されたと聞きました。"
"10052065-37-ヒマリ" = "そうですね。結局あの時点で分かったことは、デカグラマトンの本体は自販機のAIだったということくらい。"
"10052065-38-エイミ" = "あとは、幻聴をきっかけに、自ら超AIになったって話だったよね。"
"10052065-39-ヒマリ" = "ええ、そうでしたね。"
"10052065-40-エイミ" = "部長さ、あの時……デカグラマトンのことを誇大妄想者って呼んでたよね。"
"10052065-41-ヒマリ" = "事実ですから。なにか問題でも？"
"10052065-42-エイミ" = "まるで人間みたいに表現するんだなって思って。"
"10052065-43-エイミ" = "ほら、部長って言葉選びに厳しいから。"
"10052065-44-ヒマリ" = "それは……。"
"10052065-45-ヒマリ" = "……私たちの仲間に、線を引きたくはありませんから。"
"10052065-46-ヒマリ" = "つ、つまり、分類基準は可能な限り絞り込んだほうが良いということで……！"
"10052065-47-アリス" = "？"
"10052065-48-ケイ" = "……。"
"10052065-49-リオ" = "なるほど、合理性の観点における分類基準ね。参考になるわ。"
"10052065-50-ヒマリ" = "少なくともあなただけは、そのように受け止めてはいけないと思いますよ……。"
"10052065-51-リオ" = "そ、そう？"
"10052065-52-ケイ" = "……雑談は終わりです。無事にコアを確保しました。"
"10052065-53-ケイ" = "輸送船のディスプレイに映している「生命の樹」に共有しておきますので、確認してください。"
"10052065-54-リオ" = "……反映を確認できたわ。みんな、お疲れ様。"
"10052065-55-アリス" = "パンパカパーン！ケイのレベルが10アップしました！#nこの勢いでどんどんレベルアップしていきましょう！"
"10052065-56-ケイ" = "そうですね。"
"10052065-61-ケイ" = "……先生、その、少しお願いが……あります。"
"10052065-62" = "[s] \"なにかな？\""
"10052065-63-ケイ" = "しーっ！静かに！声が大きいです！"
"10052065-64-ケイ" = "その……後で、ヒマリに――"
"10052065-65-ケイ" = "ありがとうって、伝えておいてください。"
"10052065-66" = "[ns] \"……。\""
"10052065-68" = "[ns] \"うん！ちゃんと伝えておくね！\""
"10052065-69-ケイ" = "だから声が大きいですって！"
"10052065-70-アリス" = "ケイ、先生？何かありましたか？"
"10052065-71-ケイ" = "な、なななな、なんでもありませんよ！ねえ、先生！？"
"10052065-75" = "[ns] \"それがねー！ケイちゃんがさぁー！\""
"10052065-77-ケイ" = "先生――！！！！！！"
