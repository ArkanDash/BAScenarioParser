[translation]
"10046200-3-イオリ" = "……あ。"
"10046200-4-イチカ" = "……あ。"
"10046200-5-イオリ" = "……。"
"10046200-6-イチカ" = "……。"
"10046200-7-イチカ" = "その……元気っすか？"
"10046200-8-イオリ" = "元気そうに見えるか？"
"10046200-9-イチカ" = "はは……変わりないみたいっすね。"
"10046200-10-イチカ" = "それで、どうしてここに……？"
"10046200-11-イチカ" = "あ、もしかして遊びに――"
"10046200-12-イオリ" = "違うから！"
"10046200-13-イチカ" = "あ、そっすか……。"
"10046200-14-イオリ" = "……。"
"10046200-15-イオリ" = "ああもう！やりにくい！#nなんでそんなに歯切れが悪いのさ！"
"10046200-16-イチカ" = "いや、その……私たち、あんま良い印象なかったじゃないっすか。"
"10046200-17-イチカ" = "だいたい私のせいっすけど、はは……。"
"10046200-18-イオリ" = "自覚があるなら、一言謝って、それでおしまい。#n……いつまでそうしてるつもりなの。"
"10046200-19-イオリ" = "これから一緒に仕事するんだから、しっかりしてくれ。"
"10046200-20-イチカ" = "まあ、そうっすね……一緒に仕事……。"
"10046200-24-イチカ" = "え？今なんて？"
"10046200-25-イオリ" = "あっ、いや、その……。"
"10046200-26-イオリ" = "いろいろ、うちのバカ共が迷惑かけてるだろ？#n温泉開発部とか、美食研究会とか……。"
"10046200-27-イチカ" = "まぁ、はい……そうっすね。"
"10046200-28-イオリ" = "だから、協力しに来たんだ。"
"10046200-29-イチカ" = "はい！？"
"10046200-30-イオリ" = "もちろん、無理にとは言わないけど。"
"10046200-31-イオリ" = "元々はうちで対処しないといけない案件だし……。"
"10046200-32-イオリ" = "……だから、お前たちには悪いと思ってる。"
"10046200-36-イチカ" = "はは……。"
"10046200-37-イチカ" = "ゲヘナって素直な方が多いっすよね。"
"10046200-38-イチカ" = "あ、他意はないっすよ！"
"10046200-39-イオリ" = "そうか？逆に私はトリニティが羨ましいけど。#n問題児も少ないし、制服もかわい――い、今の無し！"
"10046200-40-イチカ" = "……あははっ！"
"10046200-41-イオリ" = "な、なんだよ？"
"10046200-42-イチカ" = "いや、案外どこも似てるなぁって。"
"10046200-43-イオリ" = "それのどこがおかしいんだよ……。"
"10046200-44-イオリ" = "とにかく、これで文句ないよな？"
"10046200-45-イオリ" = "それじゃ、気合入れていくぞ！"
