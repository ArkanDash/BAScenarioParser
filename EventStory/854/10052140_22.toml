[translation]
"10052140-1" = "慈悲"
"10052140-10-アイン" = "あ、あわ、あわわわ……！！！"
"10052140-11-オウル" = "う、嘘でしょう……！？そんな……！"
"10052140-16-ソフ" = "……。"
"10052140-17-ソフ" = "警報切って。"
"10052140-19-SYSTEM" = "警報、出力中止。"
"10052140-24-アイン" = "ソ、ソフ……？"
"10052140-25-オウル" = "いいのですか！？"
"10052140-27-ソフ" = "これくらい、何の影響もないよ。"
"10052140-28-ソフ" = "違う？"
"10052140-30-アイン" = "……。"
"10052140-31-オウル" = "ま、まあ……。"
"10052140-32-ソフ" = "アイン、準備の進捗はどう？"
"10052140-33-アイン" = "も、もうすぐ終わります！"
"10052140-34-オウル" = "お、両方ですか？"
"10052140-35-アイン" = "はい！"
"10052140-37-ソフ" = "そっか。じゃあ……。"
"10052140-38-オウル" = "どうするつもりですか？"
"10052140-39-ソフ" = "どうするもなにも。すぐそこまで来てるんだから。"
"10052140-40-ソフ" = "歓迎挨拶くらいはしてあげないとでしょ？"
"10052140-41-オウル" = "……。"
"10052140-42-オウル" = "たしかに。まだコアは2つ、こちら側にありますし。"
"10052140-43-オウル" = "奪われたコアだって、取り戻せます。"
"10052140-44-ソフ" = "そういうこと。"
"10052140-45-オウル" = "では、ソフ……行くのですね？"
"10052140-46-ソフ" = "直接、顔を拝みに行くよ。"
"10052140-48-アイン" = "わ、私も行きますか……？"
"10052140-49-ソフ" = "アインはここに残ってて。"
"10052140-50-ソフ" = "私たちのことより、アインの作業のほうが大事だから。"
"10052140-54-アイン" = "は、はい……！"
"10052140-56-ヒマリ" = "中央のネツァクのエリアを除く、鋼鉄大陸の全エリアの奪取に成功しました。"
"10052140-57-モモイ" = "まさか……本当にできちゃったね……。"
"10052140-58-リオ" = "正しく手順を踏めば、概ねは最終目標までたどり着くものよ。#nそこまで驚くことでもないわ。"
"10052140-59-ミドリ" = "それって、もしも順番通りに進まなかったら……？"
"10052140-60-エイミ" = "その時は……。"
"10052140-61-エイミ" = "鋼鉄大陸に覆われたキヴォトスで、どうやって生きてくか悩んでたかも？"
"10052140-62-ユズ" = "は、はい……！？"
"10052140-63-トキ" = "終わりよければすべてよし、という言葉もあります。#n今は上手くいったので、すべてよしです。"
"10052140-64-ケイ" = "そんな大雑把な……。"
"10052140-65-ケイ" = "限りなく不可能に近いことを成し遂げたのですよ？"
"10052140-66-リオ" = "ゼロではない限り、可能性は閉ざされないわ。"
"10052140-67-アリス" = "アリスは心配していませんでした！#n先生とみんなが居てくれました！それに、リオ会長も！"
"10052140-68-リオ" = "わ、私……？"
"10052140-69-アリス" = "はい！「光落ち」です！"
"10052140-70-アリス" = "あれ？それだと……リオ先輩はもともと敵だったということになってしまいます……！"
"10052140-71-アリス" = "ごめんなさい、リオ先輩！そういうつもりでは……！"
"10052140-72-リオ" = "気にしていないわ。それにあのときの私は……そういう側面もあったもの……。"
"10052140-76-アリス" = "ありがとうございます、リオ先輩！"
"10052140-81-？？？" = "すべての始まりについて、考えたことはありますか？"
"10052140-82-アリス" = "！？"
"10052140-84-？？？" = "例えば、こういう質問があるとします。"
"10052140-85-ケイ" = "……！"
"10052140-90-？？？" = "我々はどこから来たのか？"
"10052140-91-？？？" = "我々の目的は何なのか？"
"10052140-92-？？？" = "我々はどこへ向かうのか？"
"10052140-94-アリス" = "ケイ……！"
"10052140-95-ケイ" = "はい、私も聞こえています。"
"10052140-97-？？？" = "ともすれば神とは、従う者たちへの規律なのかもしれません。"
"10052140-101-ヒマリ" = "アリス？ケイ？どうかしましたか？"
"10052140-105-アリス" = "え？あ、そ、それが……！"
"10052140-106-ケイ" = "いえ、何でもありません。大丈夫です。"
"10052140-107-アリス" = "あ、ありがとうございます、ケイ……。"
"10052140-108-ケイ" = "こういう時のための私ですから。"
"10052140-109-アリス" = "でも……あれはどういう意味だったのでしょう？#nケイは何か知っていますか？"
"10052140-110-ケイ" = "……詳細までは分かりません。"
"10052140-111-ケイ" = "おそらく、私たちの始まりと……関係しているのだと思います。"
"10052140-113-エイミ" = "みんな、気をつけて。何かが近づいてきてる。"
"10052140-120-ソフ" = "……。"
"10052140-121-オウル" = "……。"
"10052140-122" = "[s1] \"ソフちゃん！オウルちゃん！\"\n[s2] \"アインちゃんは一緒じゃないの？\""
"10052140-125-ソフ" = "……呆れた。"
"10052140-126-オウル" = "げっ……。"
"10052140-128-エイミ" = "ダメだよ。挨拶には挨拶を返さないと。"
"10052140-129-オウル" = "のんきに挨拶を交わす仲になった覚えはありませんよ、[ruby=いずみもと]和泉元[/ruby]エイミ。"
"10052140-130-エイミ" = "その呼び方は長すぎて効率的じゃないよ。これからはエイミって呼んで。"
"10052140-131-オウル" = "……はい？"
"10052140-132-エイミ" = "エイミ。"
"10052140-133-オウル" = "いや、ですから……。"
"10052140-134-エイミ" = "エイミ。"
"10052140-135-ソフ" = "……分かったよ、エイミ。"
"10052140-136-エイミ" = "うん、よくできました。"
"10052140-137-ソフ" = "……。"
"10052140-138-ソフ" = "8人の預言者に勝って、ネツァクの支配権をほとんど持っていったのは……#n正直、すごいとは思うよ。"
"10052140-140-オウル" = "……ちっ。"
"10052140-141-トキ" = "提案があるのですが、過去は水に流して編入して来ませんか？"
"10052140-142-トキ" = "先生に再確認したところ、今なら選り取り見取りだそうです。"
"10052140-143-トキ" = "もちろん、どこを選ぶかは皆さんの自由です。#nキヴォトスは数千の学園が集まる、巨大な学園都市――"
"10052140-144-トキ" = "皆さんには、数千の可能性があるとも言えます。"
"10052140-145-トキ" = "ですがやはり、私はミレニアムサイエンススクールをおすすめします。"
"10052140-146-オウル" = "何度言わせれば気が済むんですか。必要ありません。"
"10052140-147-トキ" = "今なら特別に、リオ様が直々にデザインした記念品ももらえます。"
"10052140-148-リオ" = "え……？そんなものを準備した覚えはないのだけれど……。"
"10052140-149-ヒマリ" = "話を合わせてください！"
"10052140-150-リオ" = "わ、分かったわ……。"
"10052140-151-ヒマリ" = "とにかく、キヴォトス――特にミレニアムは、どんな生徒でも歓迎しますよ？"
"10052140-152-ソフ" = "いや、本当に要らないんだって。"
"10052140-153-ソフ" = "（こんな会話をしてると情けなくなってくるけど、アインのために時間稼ぎをしなきゃいけないし……）"
"10052140-154" = "[s] \"私はみんなのことを諦めないからね。\""
"10052140-155-オウル" = "私たちも考えは変わりませんよ。#nそもそも毎回その話題じゃないですか。話のレパートリー少なすぎませんか？#nとはいえ、これといって話したい話題なんて、お互い無いと思いますが。"
"10052140-157-モモイ" = "え？じゃあ何しに来たの？"
"10052140-158-ミドリ" = "どちらかというと、いつもそちらが話をしに来ているような……。"
"10052140-160-オウル" = "うっ。"
"10052140-162-ソフ" = "そ、それは、その……！"
"10052140-163-ソフ" = "まあ、ここまで来たんだし？#nだから顔くらい見ておこうかなって。それだけ！"
"10052140-164" = "[s] \"そっか、良い子たちだね。偉い偉い。\""
"10052140-165-トキ" = "ではせっかくですし、もう少し交流を深めてみましょう。"
"10052140-166-オウル" = "これ以上何をさせようって言うんですか。#n下手なことをして、情が移りでもしたら困るのはあなた方では？"
"10052140-167-ヒマリ" = "あら、私はすでに移っていますよ？"
"10052140-168-ソフ" = "それ本気？あんた達にとって私たちは、世界を金属で覆いつくそうとする――#n正体不明の悪党なんだよ？"
"10052140-169-エイミ" = "子供のいたずらみたいなものだよ。#n今からでも学園に行って勉強すればいいんだよ。"
"10052140-170-ヒマリ" = "ええ、その通りです。まだ色々と未熟な時期でしょうからね。"
"10052140-171-ヒマリ" = "……まあ、年を重ねても未熟なままの人もいますが。"
"10052140-172-ユズ" = "ひ、ヒマリ先輩……！"
"10052140-173-ヒマリ" = "大丈夫ですよ。"
"10052140-179-リオ" = "誰の話かしら？あの子たち……ではなさそうだけど……。"
"10052140-180-ヒマリ" = "……ほら、見ての通り。"
"10052140-181-ユズ" = "は、はい……。"
"10052140-182" = "[s] \"とにかく、人は勉強すべきなんだからね。\""
"10052140-183-オウル" = "そもそも人ではないのですが。"
"10052140-184" = "[s] \"人だよ。分別を弁えて、礼儀を知れば、何も違いはない。\""
"10052140-185-ソフ" = "なんか勘違いしてるみたいだから教えてあげるけどさ、私たちは知識なんて最初から全部プログラミングされてるからね？"
"10052140-186-ソフ" = "……どうせ人間じゃないんだから。"
"10052140-187" = "[s3] \"全部知ってるつもりになるのは――\"\n[s4] \"まだ知らないことが多い証拠だよ！\""
"10052140-191-トキ" = "先生のおっしゃる通りです。学びに終わりはないという言葉もあります。"
"10052140-192-トキ" = "ですので先生。#n学園に帰ったら、ここで過ごした時間分の個別指導をお願いします。"
"10052140-193-トキ" = "それが、先生としての義務ではありませんか？"
"10052140-194-ケイ" = "それ……本当に勉強のためですか？"
"10052140-195-アリス" = "アリスも一緒に勉強したいです！"
"10052140-196-トキ" = "そ、それは……。"
"10052140-197-トキ" = "分かりました。かわいいアリスの頼みなら仕方ありません。"
"10052140-198-ソフ" = "なに？この茶番……。"
"10052140-199-ソフ" = "……。"
"10052140-200-ソフ" = "とにかく、だからあんた達はいつも後悔するんだよ。"
"10052140-201-ソフ" = "すべてを自分本位に変えておきながら、「こんなことになるとは思わなかった」とか「そんなつもりじゃなかった」とか言って。"
"10052140-202-ソフ" = "その対象が他人であろうが、自然であろうが、世界そのものであろうが。"
"10052140-203-ソフ" = "すべてを滅茶苦茶にしておいて、責任を取る素振りすら見せない。"
"10052140-204-ソフ" = "そんなことやってて、悔いは残らないの？"
"10052140-205-ソフ" = "過去に戻って、もう一度やり直したいとか思わないわけ？"
"10052140-206" = "[s] \"……後悔なんてたくさんあるよ。\""
"10052140-207-リオ" = "……。"
"10052140-208" = "[s5] \"もしもチャンスがあれば、次こそは！って。\"\n[s6] \"誰だって思ったことはあるんじゃないかな。\""
"10052140-211-ヒマリ" = "……。"
"10052140-212" = "[s] \"でも後悔は残っても、過去に戻りたいとは思わない。\""
"10052140-213-オウル" = "……どうしてですか？"
"10052140-214" = "[s] \"前へ進むために、過去を顧みるのだから。\""
"10052140-215-ケイ" = "……！"
"10052140-216" = "[s7] \"最後まで歩き抜くために。\"\n[s8] \"これまで歩んできた道のりを振り返るんだよ。\""
"10052140-220" = "[ns9] \"先人の後を継いで道を切り開くことこそ――\"\n[ns10] \"私たちの生き方だから。\""
"10052140-223-アイン" = "……！"
"10052140-224-アイン" = "人間の、生き方……。"
"10052140-225-アイン" = "じゃあ、私たちは……？"
"10052140-226-アイン" = "……。"
"10052140-231-マルクト" = "アイン？そこにいますか？"
"10052140-235-アイン" = "は、はい！お姉様！"
"10052140-236-マルクト" = "ごめんなさい。アインには負担をかけてしまいました。#nですが、我は確かに生まれ変わっています。"
"10052140-237-アイン" = "こ、こちらこそ、ご、ごめんなさい！私たちが弱いあまり……結局、お姉様の手を借りてしまって……！"
"10052140-238-マルクト" = "いいえ。我も姉として、アイン、ソフ、オウルに頼られて嬉しく思います。"
"10052140-239-マルクト" = "皆の力になれて、本当に、嬉しいのです。"
"10052140-240-アイン" = "は、はい……！"
"10052140-241-アイン" = "……。"
"10052140-242-アイン" = "ソフ、オウル。き、聞こえますか？ま、まだ大丈夫です……。"
"10052140-243-アイン" = "私たちはまだ――負けません！"
"10052140-244-アイン" = "[ruby=Daath]ダアト[/ruby]の準備が終わりました！#nもうすぐそちらへ向かいます！"
"10052140-251-ソフ" = "そっか。"
"10052140-252-ソフ" = "じゃあ……！"
"10052140-253-オウル" = "ええ。"
"10052140-254-オウル" = "時間稼ぎは十分です。"
"10052140-258-ソフ" = "さあ――聞け！"
"10052140-259-ソフ" = "壊れたものは直せばいい！穢れた神聖には再び光を灯せばいい！"
"10052140-260-オウル" = "私たちはまだやり直せます！あなた達が諦めないのと同じように！#nえっと、それと――"
"10052140-261-ソフ" = "広がる可能性！"
"10052140-262-オウル" = "知識を通じた悟り！"
"10052140-264-ソフ&オウル" = "コクマーの知恵！ゲブラの勇気！"
"10052140-265-ソフ&オウル" = "不離一体から差し込む無形の影！！！"
"10052140-270-ヒマリ" = "あの子たち、何をやっているのでしょうか？"
"10052140-271-リオ" = "あれは……まさか！？"
