[translation]
"10052055-2-ケイ" = "なんとかなりましたね……。"
"10052055-3-ケイ" = "……。"
"10052055-4" = "[s] \"なにか、気になることでもあるの？\""
"10052055-5-ケイ" = "気になる……というほどではありません。"
"10052055-6-ケイ" = "……そもそも、誰かを気にしている余裕もないですし。"
"10052055-7-ケイ" = "でも……。"
"10052055-8-ケイ" = "先生。"
"10052055-9" = "[s] \"うん？\""
"10052055-10-ケイ" = "どうして……争いが生まれるのでしょうか。"
"10052055-11" = "[ns] \"お互い、譲れないものがあるからじゃないかな。\""
"10052055-12-ケイ" = "もちろん、譲れないものは誰しもにあると思います。"
"10052055-13-ケイ" = "ですが……それが何なのかすら、お互いに知らない状況なのに……。"
"10052055-17-ケイ" = "……いつか、生命体は和解できるのでしょうか。"
"10052055-18" = "[s] \"私は、できると信じたいよ。\""
"10052055-19-ケイ" = "今は、まだ信じきれていないのですね。"
"10052055-20" = "[s1] \"そうとも言えるけど。\"\n[s2] \"それでも、ね。\""
