[translation]
"10052030-2-オウル" = "なっ、なっ、ななっ……なああああっ！！"
"10052030-3-オウル" = "これで勝ったと思わないでくださいね！！"
"10052030-8-ヒマリ" = "では、戻りましょうか。"
"10052030-9-リオ" = "……ええ。"
"10052030-18" = "[ns] \"ヒマリ！リオ！大丈夫？\""
"10052030-19-ヒマリ" = "あら、先生。ここまで心配してくださるだなんて。#n多少なり無理をした甲斐がありましたね。"
"10052030-20-ヒマリ" = "ご心配には及びませんよ♪"
"10052030-21-ヒマリ" = "なんなら、毎回この手を使うのもありだと思うくらい♪"
"10052030-22-リオ" = "それは良くない気がするわ……。"
"10052030-23" = "[ns] \"そうだよ。リオの言う通り。\""
"10052030-24-ヒマリ" = "しょぼーん。"
"10052030-25-ケイ" = "……何をわざとらしく落ち込んでいるのですか。"
"10052030-26-ケイ" = "とにかく、2人とも無事でよかったです。"
"10052030-27-ヒマリ" = "ケイも心配してくれるんですか？#nふふっ、なんだか元気が戻ってきました！"
"10052030-28-ケイ" = "そういうのはいいですから！まったく！"
"10052030-32-エイミ" = "部長、会長。ちょっといい？#nコアみたいなのを発見したよ。"
"10052030-37-ヒマリ" = "これが……コア？"
"10052030-39-リオ" = "ケイ、確認できるかしら？"
"10052030-40-ケイ" = "やってみます……。#nエイミ、それを地面に下ろしてくれますか？"
"10052030-41-エイミ" = "うん？分かった。"
"10052030-45-ケイ" = "……。"
"10052030-46-ケイ" = "理解……観察者……[ruby=JEHOVAH ELOHIM]エホバ・エロヒム[/ruby]……#n沈黙と貪欲、豊かさと悲しみ……。"
"10052030-47-ケイ" = "……！"
"10052030-48-ケイ" = "確認しました。ビナーのコアで間違いありません。"
"10052030-49-ヒマリ" = "現物を見なくても分かるのですか？"
"10052030-50-ケイ" = "はい、今なら。"
"10052030-51-リオ" = "……なるほど。#nこの穴の付近は、もう私たちの占領下にあるから……。"
"10052030-52-ケイ" = "それに加えて、ここは鋼鉄大陸のネットワークにとって玄関口のような場所です。#nこれくらいはどうとでもなりますよ。"
"10052030-53-ケイ" = "そして……預言者のコアに関して、新しく分かったことがあります。"
"10052030-54-ヒマリ" = "なんでしょうか？"
"10052030-55-ケイ" = "まずは、前にお伝えしたことの復習から。#nコアが持つ情報は、私の身体にインストールすることができます。"
"10052030-56-ケイ" = "それはつまり、ネットワークの上位権限と神威……各セフィラの位格を、私が継承するということです。"
"10052030-57-ケイ" = "そしてさらに……。"
"10052030-58-ケイ" = "預言者のコアを組み込んで応用すれば、輸送船そのものを強化することができるかもしれません。"
"10052030-59-リオ" = "どんな風に……？"
"10052030-60-ケイ" = "そうですね……ビナーのコアを輸送船に組み込めば、ビナーの能力や出力の一部を、輸送船が使用できるようになります。"
"10052030-61-ケイ" = "他の預言者のコアも、同様であるはずです。"
"10052030-66-モモイ" = "ってことはまさか！！"
"10052030-67-アリス" = "やっぱりあれですね、ケイ！敵の能力を利用する生命体！"
"10052030-68-ケイ" = "いえ、例えるなら、その……。"
"10052030-69-ケイ" = "せめて、別のものにしてください……。"
