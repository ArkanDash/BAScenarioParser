[translation]
"10052040-1" = "Uniform"
"10052040-2-ケイ" = "うぅっ……。"
"10052040-3" = "[s] \"大丈夫？\""
"10052040-4-ケイ" = "思った以上にめまいがします。特に頭の左側が……。"
"10052040-5" = "[s] \"本当に大丈夫？\""
"10052040-6-ケイ" = "原因は間違いなく、ビナーのコアを持ち帰って活性化させたことですが……。"
"10052040-7-ケイ" = "……。"
"10052040-8-ケイ" = "大丈夫です。この身体がエネルギーの流れに慣れれば済む話ですので。"
"10052040-9" = "[s] \"本当の……本当に、大丈夫なんだよね……？\""
"10052040-10-ケイ" = "心配しすぎですよ。症状は徐々に落ち着いてきていますので。#nとはいえ、コアを回収する度にこうなるなら、どうにも気が重いですね……。"
"10052040-11-ケイ" = "もしかしたら、この身体が「[ruby=欠陥あり]Defected[/ruby]」と評されたのは、これが理由なのかもしれません……。"
"10052040-12-ケイ" = "とにかく、コアを活性化する度に、輸送船の出力や機能を再設計できるはずです。"
"10052040-13-ケイ" = "そして、そのエネルギーの流れは私の身体とつながっていて……#nまあ結論だけ言いますと、私が制御できると思います。"
"10052040-14" = "[s] \"無理しすぎないでね、ケイちゃん。\""
"10052040-15-ケイ" = "誰がケイちゃんですか、もう。"
"10052040-24-ケイ" = "アリス……？#nこれは何ですか……？"
"10052040-25-アリス" = "制服です！"
"10052040-26-ケイ" = "それは見れば分かりますが、どうしてこれを……。"
"10052040-27-アリス" = "これは、アリスが初めて着せてもらった服なんです！"
"10052040-28-アリス" = "アリスは……それが本当に嬉しかったです。だから、ケイにも共有したいんです！"
"10052040-32-アリス" = "もしかして……嫌、でしたか……？"
"10052040-33-ケイ" = "まさか！その……むしろ、すごく……。"
"10052040-37-ケイ" = "えへへっ……。"
"10052040-38-リオ" = "当然よ。ミレニアムの制服こそ、最も合理的な選択だもの。"
"10052040-39-ケイ" = "……ここでひと言加えるのは、実にあなたらしいですね。"
"10052040-41" = "[ns] \"生徒の戦闘服と言ったら、やっぱり制服だよね！\""
"10052040-42-ケイ" = "いきなりなんの話ですか……？"
"10052040-43-ケイ" = "はい？勉強を敵キャラとしたら、それをやっつけるための戦場が教室で、戦闘服は制服……？"
"10052040-44-ケイ" = "……。"
"10052040-45-ケイ" = "とりあえず、それで納得してあげます……。"
"10052040-46-ケイ" = "で、では、私が……これを……。"
"10052040-47-ケイ" = "……。"
"10052040-48-アリス" = "はい！着てみてください！#nアリスはケイの制服姿が早く見たいです！"
"10052040-49-ケイ" = "……！"
"10052040-55-ケイ" = "ど、どうですか……？"
"10052040-56-アリス" = "わあ！"
"10052040-57" = "[ns] \"おぉ……。\""
"10052040-58-ケイ" = "な、なんですか、その反応は……！"
"10052040-59-ユズ" = "すごく似合ってるよ、ケイちゃん。"
"10052040-60-ミドリ" = "うん、本当にかわいい。"
"10052040-61-ケイ" = "……！！！"
"10052040-62-ケイ" = "あ、ありがとうございます……ユズ、ミドリ。"
"10052040-66-エイミ" = "大丈夫？暑くない？"
"10052040-67-ケイ" = "あなたじゃないのですから……。"
"10052040-68-トキ" = "ケイ、とてもよく似合っています。"
"10052040-69-トキ" = "一瞬、パーフェクトキュートクール系美少女の座を脅かされると思ったくらいに。"
"10052040-70-ケイ" = "……そんなのは狙っていません。"
"10052040-71-トキ" = "パーフェクトキュートクール系美少女の座は守られました。#nこれで、挫けることなく生きていられます。"
"10052040-72-ケイ" = "話聞いてますか……？"
"10052040-82-ケイ" = "こほん。その……。"
"10052040-83-ケイ" = "ありがとう、ございます。"
"10052040-84-モモイ" = "ん～？よく聞こえなかったなぁ～？"
"10052040-85-ケイ" = "くっ……！"
"10052040-89-ケイ" = "あ、ありがとうございます！これでいいですか！？"
"10052040-90-モモイ" = "そうこなくっちゃ！感謝の気持ちを伝えるのは大事だからね！"
"10052040-91" = "[ns] \"そうそう！\""
"10052040-92-ケイ" = "よりによってこの2人がまともな話を……！"
"10052040-93-ケイ" = "と、とにかく！"
"10052040-94-ケイ" = "この制服は……必要な時にだけ着ることにします。"
"10052040-95-アリス" = "どうしてですか？"
"10052040-96-ケイ" = "それは、その……。"
"10052040-97-ケイ" = "……。"
"10052040-98-ケイ" = "皆さんの思いが込められた服を、大事にしたくて……。"
"10052040-99-ミドリ" = "ケイちゃん……ありがとう。"
"10052040-100-ケイ" = "い、いえ……こちらこそ、ありがとうございます……。"
"10052040-101-モモイ" = "しょうがないなぁ！ケイは照れ屋さんだもんね！"
"10052040-102-ケイ" = "モモイ――！！！"
