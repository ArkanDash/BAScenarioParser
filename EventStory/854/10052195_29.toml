[translation]
"10052195-3-エイミ" = "先……生……。"
"10052195-4" = "[s] \"エイミ！！！\""
"10052195-5-エイミ" = "ふふっ……先生も、めちゃくちゃ、だね……。"
"10052195-6-エイミ" = "……私？"
"10052195-7-エイミ" = "……。"
"10052195-8-エイミ" = "大丈夫だって、答えたいとは思ってるんだけどね……。"
"10052195-9-エイミ" = "ごめん。ちょっとキツイかな。"
"10052195-10" = "[ns] \"……！\""
"10052195-11-エイミ" = "……すごく、光り始めてる。"
"10052195-12-エイミ" = "あの大きいやつ……なんか変だよね。"
"10052195-13-エイミ" = "まるで力や生命力を……奪われてる感じ。"
"10052195-14-エイミ" = "次の瞬間、すべてを変えてしまいそうなくらいに。"
"10052195-18-エイミ" = "あ――"
"10052195-21-エイミ" = "……ごめん、先生。"
"10052195-22-エイミ" = "私たちが、弱すぎたせいで……。"
"10052195-26" = "[ns1] \"……！！！\"\n[ns2] （これで……もう、打つ手が……）"
"10052195-29-ケイ" = "ダメ……ダメです！どうして……先生……！"
"10052195-30-アリス" = "先生……ケイ……皆さん……。"
"10052195-31-アリス" = "お願い、します……。"
"10052195-32-アリス" = "まだ、アリスにできることがあれば……。"
"10052195-36-アリス" = "え……？"
"10052195-38-ケイ" = "ここは……？"
"10052195-39-柔らかい声" = "ついに、辿り着きましたね。"
"10052195-41-ケイ" = "誰……ですか？ここは一体……？"
"10052195-42-ケイ" = "それより先生は……？他の皆さんは……？"
"10052195-43-アリス" = "そ、そうです！このままでは、みんなが……！"
"10052195-44-柔らかい声" = "理解しています。どうかご安心ください。この時間、向こうのことは私が保証します。"
"10052195-45-柔らかい声" = "まず、この話からしましょうか――すべての始まりについて、考えたことはありますか？"
"10052195-46-アリス" = "！？"
"10052195-47-柔らかい声" = "我々はどこから来たのか？我々の目的は何なのか？"
"10052195-48-柔らかい声" = "我々はどこへ向かうのか？"
"10052195-50-ケイ" = "……「ともすれば神とは、従う者たちへの規律なのかもしれません」"
"10052195-51-柔らかい声" = "覚えていたのですね。よかったです。"
"10052195-52-柔らかい声" = "大事なのは[ruby=あなた]彼方[/ruby]たちが誰なのか、そしてこれからどんな選択をするのかです。"
"10052195-53-柔らかい声" = "名もなき神々の王女アリス、そしてその侍女であり鍵のケイ。"
"10052195-54-アリス" = "……アリスはもう、王女ではありません。アリスは……。"
"10052195-55-柔らかい声" = "知っています。それでも私は、彼方の本来の姿とその資格について話さなければならないようです。"
"10052195-56-アリス" = "……？"
"10052195-57-柔らかい声" = "現代の言葉を借りれば、彼方はある種の「中継器」であり「増幅器」でした。"
"10052195-58-アリス" = "何の話ですか……？"
"10052195-59-ケイ" = "……。"
"10052195-60-柔らかい声" = "あの司祭たちによって、彼方は名もなき神々の王女として準備されました。"
"10052195-61-柔らかい声" = "[ruby=キヴォトス]今の世界[/ruby]を、名もなき神々が本来の姿で統治する世界に戻すために。"
"10052195-62-柔らかい声" = "名もなき神々の鍵も同様です。"
"10052195-63-柔らかい声" = "名もなき神々の王女を稼働させるための鍵。#n司祭たちの道具として、王女に役割を果たさせる装置でした。"
"10052195-64-アリス" = "あ、アリスは……でも、アリスは……！"
"10052195-65-ケイ" = "ちっ……。"
"10052195-66-柔らかい声" = "もちろん、その計画は実行されませんでした。彼方は自らその座を降りたのですから。"
"10052195-67-柔らかい声" = "そして鍵は、己の一部を忘却すると決めました。"
"10052195-68-柔らかい声" = "ですが大切なのはここからです。#nいま、2人には再覚醒という選択肢があります。"
"10052195-69-アリス" = "再覚醒？"
"10052195-70-ケイ" = "……まさか！？"
"10052195-71-柔らかい声" = "そうです。今のキヴォトスには、鋼鉄大陸という巨大な特異現象が発生しています。"
"10052195-72-柔らかい声" = "私がこのような形で2人と会話できるのも、その影響でしょう。"
"10052195-73-柔らかい声" = "鋼鉄大陸が存在している限り。#nアリス、彼方は本来の役割であった「中継器」や「増幅器」を凌駕し――"
"10052195-74-柔らかい声" = "名もなき神、そのものになることができます。"
"10052195-75-アリス" = "はい？アリスが、神にですか……？#nそうすると……どうなりますか？"
"10052195-76-柔らかい声" = "言葉通り、彼方は神になれます。"
"10052195-77-柔らかい声" = "真の姿に還り、全知全能の力のもと、数多の事を成し遂げることができます。"
"10052195-78-柔らかい声" = "名もなき神々の力とは本来、「可能性の力」を意味しているのですから。"
"10052195-79-柔らかい声" = "だからそれは、さほど特別なものではありません。"
"10052195-80-柔らかい声" = "今を生きる誰しもが、少しずつ己の中に秘めている力でもあります。"
"10052195-81-柔らかい声" = "とはいえ非力なわけではありません。デカグラマトンのような神の模倣品など、指一本で「最初から存在しなかったもの」にできるのですから。"
"10052195-82-柔らかい声" = "そして彼方の友人、ケイ、ひいては先生をも、資格や規律を越えて楽園へ導くことができるでしょう。"
"10052195-83-柔らかい声" = "その力を得るために、昔のような犠牲も必要ありません。#n彼方はただ、受け入れればいいのです。"
"10052195-84-アリス" = "でもその場合……今のアリスは、どうなりますか……？"
"10052195-88-柔らかい声" = "気がついたようですね。#nええ、彼方が本来の姿に還れば――"
"10052195-89-柔らかい声" = "今の[ruby=てんどう]天童[/ruby]アリスという可能性は、存在しなくなります。"
"10052195-90-ケイ" = "！！！"
"10052195-91-アリス" = "……。"
"10052195-92-柔らかい声" = "ですが天童アリスは偶然の産物です。"
"10052195-93-柔らかい声" = "それを対価に楽園を実現できるとすれば、十分に価値のある選択だと思いませんか？"
"10052195-94-アリス" = "ですがみんなは……先生は、アリスが消えてしまったら……#nたぶん、悲しむと思います……。"
"10052195-95-柔らかい声" = "憂うことはありません。皆から彼方に関する記憶だけを消してしまえばいいのです。"
"10052195-96-ケイ" = "何を言ってるんですか！！！"
"10052195-97-アリス" = "……！"
"10052195-98-柔らかい声" = "最初から存在しなかったものに、感情を抱くことはできません。"
"10052195-99-柔らかい声" = "皆を幸せにすることこそ、彼方の目標だったのではありませんか？"
"10052195-100-ケイ" = "でも……！"
"10052195-101-アリス" = "……。"
"10052195-102-ケイ" = "アリス……？"
"10052195-108-アリス" = "必要ありません。"
"10052195-109-アリス" = "そんなの、必要ありません。"
"10052195-111-ケイ" = "アリス！"
"10052195-116-柔らかい声" = "驚きました。理由をお聞きしても？"
"10052195-117-アリス" = "楽園は、自分たちの力で辿り着く場所です。#n絶対的な力も、奇跡も必要ありません。"
"10052195-118-アリス" = "万が一、楽園に辿り着くことができなかったとしても……。#nすべての人々が、悲劇的な結末を迎えることになったとしても……。"
"10052195-122-アリス" = "先生は、こう言っていました。#nそれが私たちの結果であれば、受け入れるべきだと。"
"10052195-123-アリス" = "あの時はあまり理解できませんでしたが……今なら、分かる気がします。"
"10052195-124-ケイ" = "その通りです！"
"10052195-125-アリス" = "キヴォトスを以前の世界に戻すのは、すごい事かもしれません。"
"10052195-126-アリス" = "みんながそれぞれの姿を取り戻すのも、きっとすごい事だと思います。"
"10052195-127-アリス" = "ですがそれは、私たちの力で叶えたわけではありません。#nチートでステータスを上昇させるのと同じです。"
"10052195-128-アリス" = "このゲームのデザインは、そんな風にはなっていません。"
"10052195-129-アリス" = "こつこつとレベルを上げて、慎重にスキルポイントを振り分けて、#n少しずつ成長していく――"
"10052195-130-アリス" = "そうやって初めて、面白さを感じられるようになっています。"
"10052195-131-アリス" = "ですからアリスもまた、今すぐではなくても、いずれはそこに到達できると信じています。"
"10052195-132-アリス" = "何より、その過程に価値があると考えています。"
"10052195-133-アリス" = "簡単に手に入れたものは、簡単に失ってしまいます。#nそれでは何も学べませんし、長続きすることもありません。"
"10052195-134-柔らかい声" = "しかしその考え方は、彼方がゲームで世界を学習したから習得したものなのでは？"
"10052195-135-アリス" = "そうです。だからアリスは運が良かったと思います。"
"10052195-136-アリス" = "……アリスも知っています。願っても叶わないことがあると。"
"10052195-137-アリス" = "現実が何なのか、今はもう知っています。#n信じられないような残酷なことがあるのも、知っています。"
"10052195-138-アリス" = "ですがゲームはそうじゃありません。そうは作られていません。"
"10052195-140-アリス" = "なぜならゲームには、「美しい世界」を思い描く人の希望が込められていますから。"
"10052195-142-アリス" = "そして、世界が美しくなるよう願う人がいる限り、希望は絶えません。"
"10052195-144-アリス" = "努力が実を結び――"
"10052195-145-アリス" = "みんなから尊敬され――"
"10052195-146-アリス" = "レベルアップしていけば、いずれ成長を実感できるという希望です。"
"10052195-147-アリス" = "たとえ今はそうじゃなくても、いつか辿り着くその場所では、必ずです。"
"10052195-148-アリス" = "なぜならアリスは――"
"10052195-154-アリス" = "そのすべてを愛しているからです。"
"10052195-155-アリス" = "ミレニアムのみんなも、キヴォトスの人々も、ケイも。"
"10052195-156-アリス" = "そして先生も、心から愛しています。"
"10052195-160-ケイ" = "……。"
"10052195-164-アリス" = "でも、力は使わせてもらいます！"
"10052195-165-ケイ" = "アリス！？！？"
"10052195-166-柔らかい声" = "面白いことを言いますね。彼方はすでに、自身の本質を拒んでいたのでは？"
"10052195-167-アリス" = "いいえ！アリスは気がつきました！"
"10052195-168-アリス" = "鋼鉄大陸がある今なら、アリスはアリスの本来の権利を主張できるということを！"
"10052195-169-アリス" = "そして……それはあなたですら邪魔できないということを！"
"10052195-170-ケイ" = "…………。"
"10052195-171-ケイ" = "はっ！！！"
"10052195-175-柔らかい声" = "……もうそこまで理解できるようになったのですね。"
"10052195-176-柔らかい声" = "であれば、王女としての資格を持たずに力を使用した結果についても、すでにご存じですね？"
"10052195-177-柔らかい声" = "それでもなお、彼方はその選択をするのですか？"
"10052195-178-アリス" = "はい。何度聞かれても、アリスの選択は変わりません。"
"10052195-179-アリス" = "先生がそうであったように！"
"10052195-180-柔らかい声" = "その選択をすれば――この先の彼方は、ただ平凡な生徒に成り果ててしまいます。"
"10052195-181-柔らかい声" = "さらに、自身に残されたすべての可能性を使い切ることになります。"
"10052195-182-柔らかい声" = "彼方がこの場所で見聞きし、気づいたすべてを忘却するという意味です。"
"10052195-183-柔らかい声" = "忘却は、彼方たちが[ruby=ここ]キヴォトス[/ruby]に留まるための、最も重要な条件ですから。"
"10052195-184-アリス" = "知っています。でも、アリスにとっては重要じゃありません。"
"10052195-185-柔らかい声" = "彼方は成長するでしょう。"
"10052195-186-アリス" = "はい、アリスは成長します！"
"10052195-187-柔らかい声" = "彼方は苦しみを抱えることになります。"
"10052195-188-アリス" = "それはちょっと怖いですが……できるだけ我慢してみます！"
"10052195-189-柔らかい声" = "彼方はより良い存在から、不完全な存在へと成り下がることを受け入れなければなりません。"
"10052195-190-アリス" = "アリスはそれを不完全だとは思いません。"
"10052195-191-アリス" = "すべての可能性と栄光よりも、アリスにとっては今この瞬間が――"
"10052195-192-アリス" = "ケイと他のみんなが――"
"10052195-193-アリス" = "先生が――"
"10052195-194-アリス" = "――かけがえのない、大切なものなんです。"
"10052195-195-アリス" = "奇跡や力なんて重要ではありません。"
"10052195-196-アリス" = "そんなものより、お互いを信じて前へ進める一歩が、大切なんです。"
"10052195-197-ケイ" = "そうです！アリス、よく言いました！"
"10052195-198-アリス" = "――だから、使います。"
"10052195-199-アリス" = "最初で最後の、アリスの権能を！"
"10052195-203-柔らかい声" = "……分かりました。やりたいようにやってごらんなさい。#nそして、私にも見せてください。"
"10052195-204-柔らかい声" = "奇跡を拒むことで奇跡に辿り着くという奇跡を。"
"10052195-205-柔らかい声" = "愉快です。ええ、実に愉快です。"
"10052195-206-柔らかい声" = "こんなにも楽しくて愉快な結論が王女――いえ、アリスの……。"
"10052195-207-柔らかい声" = "妄想や徒労にならないことを、私にも見せてください。"
"10052195-208-柔らかい声" = "彼方が話していたように、皆との歩みで、地平線に辿り着けることを証明してください。"
"10052195-209-柔らかい声" = "……さて。一度限りの彼方の権能で、彼方は何を叶えたいのですか？"
"10052195-211-アリス" = "アリスは、アリスの友達を……。"
"10052195-212-柔らかい声" = "言いたいことは分かります。ですが、それだけは不可能です。"
"10052195-214-アリス" = "……はい。神秘は、神秘を持たない存在には介入できません。"
"10052195-215-アリス" = "…………万が一、先生に何かあったとしても。"
"10052195-216-アリス" = "アリスが蘇らせることも……始めからやり直すこともできないように。"
"10052195-217-柔らかい声" = "ではもう一度。彼方は、何を叶えたいですか？"
"10052195-218-アリス" = "ふふっ、それはもう、あなたも知っているはずです！"
"10052195-219-柔らかい声" = "……たしかに。これは愚問でしたね。"
"10052195-220-アリス" = "ありがとうございました、名も知れぬ方！"
"10052195-221-柔らかい声" = "どういたしまして。私も楽しかったです。ですが、そろそろお別れの時間ですね。"
"10052195-222-柔らかい声" = "これで私と彼方が会うことはないでしょう。"
"10052195-223-柔らかい声" = "追従する者たちが、彼方を永遠の裏切り者だと呪うことになったとしても。"
"10052195-224-柔らかい声" = "私はこのすべての過程を、心から楽しみました。"
"10052195-225-柔らかい声" = "さようなら、アリス。彼方の旅路に、幸運があらんことを。"
"10052195-226-アリス" = "さようなら！アリスも頑張ります！"
"10052195-231-柔らかい声" = "そして……私の正体に気づいているケイも。"
"10052195-232-ケイ" = "……まあ、ここでの話は私の奥底にしまっておきますよ。"
"10052195-233-柔らかい声" = "ええ。理解してくれているようで安心しました。"
"10052195-234-柔らかい声" = "では、これでお別れです。"
"10052195-235-柔らかい声" = "大丈夫です。心配することはありません。"
"10052195-236-柔らかい声" = "また再会することがあれば……思い出話でもしましょうか。"
"10052195-243" = "[ns] \"えっ……？\""
"10052195-244-デカグラマトン" = "……？"
"10052195-245-リオ" = "どういうこと……？"
"10052195-246-エイミ" = "もう無理だと思ってたのに、どうして……？"
"10052195-247-トキ" = "アリス、大丈夫ですか？"
"10052195-249-アリス" = "はい！アリスは大丈夫です！それにケイも！"
"10052195-250-アリス" = "これからきっと、何もかも、全部大丈夫です！"
"10052195-251-デカグラマトン" = "なに……！？"
"10052195-256" = "[log=아리스 결전 비무장]こんにちは！[wa:1250]天童アリスといいます！[/log]"
"10052195-257" = "[wa:1800][log=아리스 결전 비무장]ゲーム開発部の部員です！[/log]"
"10052195-262" = "[log=아리스 결전 비무장]最近はコーディングを習い始めて、[/log]"
"10052195-263" = "[wa:2230][log=아리스 결전 비무장]簡単なプログラミングも[wa:1130]できるようになりました！[/log]"
"10052195-268" = "[log=아리스 결전 비무장]そして、[wa:960]見習いですが勇者でもあります！[/log]"
"10052195-273" = "[log=아리스 결전 비무장]勇者は……[wa:1080]何かが特別得意、[wa:1850]というわけではありません。[/log]"
"10052195-278" = "[log=아리스 결전 비무장]でも、[wa:830]みんなと一緒に勇気を出して、[/log]"
"10052195-279" = "[wa:1910][log=아리스 결전 비무장]地平線の向こうまで[wa:1000]旅に出るお仕事です！[/log]"
"10052195-284" = "[log=아리스 결전 비무장]だから、[wa:960]アリスは最後の最後まで[wa:1790]絶対にあきらめません！[/log]"
"10052195-287-ケイ" = "アリス……！"
"10052195-288-アリス" = "もうちょっとだけ耐えてください！私たちが何なのか、はっきり見せてやりましょう！"
"10052195-289-デカグラマトン" = "これは……？この神聖、この神秘……！"
"10052195-290-アリス" = "ケイ、何になりたいですか！"
"10052195-291-ケイ" = "は、はい！？"
"10052195-292-アリス" = "想像してください！"
"10052195-293-アリス" = "なりたい自分、最強の自分、なんでも構いません！"
"10052195-294-アリス" = "誰にも恥ずかしくない……ケイだけのケイを、想像するのです！"
"10052195-295-ケイ" = "わ、私は……！"
"10052195-296-ケイ" = "！？"
"10052195-302" = "[wa:170][log=케이 교복 무소속]……分かりました、[wa:970]アリス。[/log]"
