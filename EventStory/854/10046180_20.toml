[translation]
"10046180-3-ハナコ" = "うふふっ。"
"10046180-4-イチカ" = "……勘弁してほしいっす。"
"10046180-5-ハナコ" = "まだ何も言っていませんよ？"
"10046180-6-イチカ" = "今日だけはほんと勘弁してほしいっす！"
"10046180-7-ハナコ" = "あら……本格的に余裕がないみたいですね。"
"10046180-8-ハナコ" = "でも、ご心配なく。"
"10046180-9-ハナコ" = "私はイチカさんを手伝いに来たのですから。"
"10046180-10-イチカ" = "……。"
"10046180-11-ハナコ" = "……怪しい。"
"10046180-12-ハナコ" = "何か企んでいるに違いない……。#nでなければあの[ruby=うらわ]浦和[/ruby]ハナコが……。"
"10046180-13-ハナコ" = "――とでも言いたそうな表情ですね？"
"10046180-14-イチカ" = "……！"
"10046180-15-ハナコ" = "……冗談です。"
"10046180-16-ハナコ" = "相変わらずポーカーフェイスがお上手ですね。"
"10046180-17-イチカ" = "本当に、何の用っすか？"
"10046180-18-ハナコ" = "うーん、どうすれば信じてもらえるのでしょう？"
"10046180-19-ハナコ" = "本当に、イチカさんを手伝いに来ただけ、ですよ。"
"10046180-20-ハナコ" = "まあ、私の発案ではないのですが……。"
"10046180-21-ハナコ" = "ふふっ、持つべきものは素敵な仲間、ですね♡"
"10046180-22-イチカ" = "……ここに来たのはハナコさん一人じゃないって意味っすか？"
"10046180-23-ハナコ" = "それは……後のお楽しみということで。"
"10046180-24-ハナコ" = "どうすれば信じていただけるのでしょう？#nもう後は敵意がないことをこの身をもって証明するしか……。"
"10046180-25-イチカ" = "……う～ん。"
"10046180-26-イチカ" = "はあ……分かったっすよ。"
"10046180-27-ハナコ" = "あら。本当にいいのですか？"
"10046180-28-イチカ" = "あなたがそれを聞くんすか……？"
"10046180-29-イチカ" = "何を考えているかは知らないっすけど、人手が足りてないのは事実なんで。"
"10046180-30-イチカ" = "だから、よろしくっす。"
"10046180-31-ハナコ" = "お互いの全てをさらけ出して話し合うのって、とっても気持ちいいですよね♡"
"10046180-32-イチカ" = "なんで誤解されそうな言い方をするんすか！"
"10046180-33-ハナコ" = "ふふっ、事実ですから。では……。"
"10046180-38-ハナコ" = "ひと夏のイケナイ思い出づくり……始めてみましょうか♡"
