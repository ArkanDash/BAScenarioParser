[translation]
"10017085-1" = "第８話;真冬の夜の夢"
"10017085-2" = "カフェ「White&Mason」入口"
"10017085-4-チンピラA" = "ぐあぁぁっ！？"
"10017085-5-チンピラB" = "ま、負けた……！"
"10017085-6-チンピラA" = "ど、どうして……。"
"10017085-7-チンピラB" = "委員長はさておき、こいつらはさっきあんだけ戦ってたのに……。"
"10017085-8-チンピラA" = "どういうことだよ！？"
"10017085-10-ツルギ" = "きゃははははははははっ！"
"10017085-11-ハスミ" = "……甘いですね。"
"10017085-13-ミネ" = "いくら私たちが弱っていても、あなたたちが強くなったわけではないでしょう。"
"10017085-18-チンピラA" = "そりゃそうだけどさあ！"
"10017085-19-チンピラB" = "何が救護騎士団長だ！#n何もかも壊してばっかりで！"
"10017085-21-ミネ" = "……クリスマスは、楽しい日です。今はそういった日として迎えられています。"
"10017085-22-ミネ" = "ですがその本質は、感謝をし、振り返り……何かを施す日です。"
"10017085-23-ミネ" = "わが身を振り返り、寛大な気持ちを持ち直す日でもあります。"
"10017085-24-ミネ" = "そんな日に、他人の気持ちを利用したあなたたちが……。"
"10017085-25-ミネ" = "望んだ時間を迎えられると、思わないでください！"
"10017085-30-チンピラA" = "う、うるせぇ！何言ってんのか分かんねぇんだよ！"
"10017085-31-チンピラB" = "そもそも騙された方が悪いんだろうが！くそっ、あと少しだったのに……！"
"10017085-44-ハスミ" = "……逃げられてしまいましたね。"
"10017085-45-ミネ" = "悔しいですね、体調が万全だったらと思わずにはいられません。"
"10017085-46-ハスミ" = "誰のせいでこうなったと……。"
"10017085-48-セリナ" = "みなさん、大丈夫ですか！？"
"10017085-49-ハナエ" = "治療を始めます！"
"10017085-51-ハスミ" = "あ、ありがとうございます。その、治療でしたら他の方を優先して頂ければと……"
"10017085-53-セリナ" = "他の皆さんの治療は、終わってますのでご安心を。"
"10017085-54-ハナエ" = "こういう時のために、準備していますから！"
"10017085-56-ハスミ" = "そ、そうでしたか。"
"10017085-57-ハスミ" = "本当に、いつもありがとうございます。"
"10017085-62-セリナ" = "それは、こちらの台詞です。#nそれに今日は、私たちのせいで……"
"10017085-63-ハナエ" = "ハスミさん、ごめんなさい！#n謝ってどうにかなることではありませんが……！"
"10017085-70-ハスミ" = "（ミネが壊して騎士団が治す……）"
"10017085-71-ハスミ" = "（そういえば忘れていましたが……こういう方々でしたね）"
"10017085-73-ハスミ" = "……それで、ミネ団長。今回のことについて、何か言うことは？"
"10017085-74-ミネ" = "何の弁明もございません。"
"10017085-79-ハスミ" = "な、なぜ銃を、私に……？"
"10017085-80-ミネ" = "この罪、命を以て謝罪するしかありません！"
"10017085-81-ミネ" = "すべての処分を、ハスミ副委員長に託します！"
"10017085-82-ハスミ" = "はい……？"
"10017085-87-セリナ" = "だ、団長……。"
"10017085-91-ハナエ" = "うわぁん！団長～！"
"10017085-93-ミネ" = "セリナ、ハナエ、泣かないでください。#n責任を負うこともまた、私たちの「救護」。"
"10017085-94-ミネ" = "誰も責任を負おうとしなければ、もっと悲しみが生まれてしまいます。"
"10017085-95-ミネ" = "さあ、全ての武装を解除しました……どうとでも処分を！"
"10017085-96-ハスミ" = "はぁ……。"
"10017085-97-ハスミ" = "誤解が解けただけで、私は構いません。"
"10017085-98-ハスミ" = "それに私も、他の者たちも……救護騎士団の治療を受けて、回復しました。"
"10017085-99-ハスミ" = "ツルギも、これで良いですよね？"
"10017085-100-ツルギ" = "きええぇぇ……。"
"10017085-101-ハスミ" = "……だそうです。ということで、この件は一段落ですね。"
"10017085-102-ハスミ" = "ありがとうございました、セリナさん、ハナエさん。"
"10017085-107-セリナ" = "そ、そんな、私たちはただ救護騎士団としてなすべきことを……"
"10017085-108-ハナエ" = "むしろ感謝するべきなのは、私たちの方です！#n救護騎士団の過ちを、許してくれたんですから！"
"10017085-110-ハスミ" = "それは……"
"10017085-111-ハスミ" = "……いえ。#nそれでは、そういうことにさせていただきましょう。"
"10017085-112-ハスミ" = "起きてください、ミネ団長。#nずっとそのままでいられては、私の方が困ってしまいます。"
"10017085-113" = "[s] \"……だってさ？\""
"10017085-114-ミネ" = "しかし、先生……"
"10017085-115" = "[s1] \"あの子たちは、結果的に騙そうとしてたとはいえ……\"\n[s2] \"相手の話をちゃんと聞いてあげる姿勢は、何も間違ってないと思うから。\""
"10017085-118-ミネ" = "……。"
"10017085-119-ミネ" = "そう、ですね……。"
"10017085-124-セリナ" = "あの、それでは私たちはこれで……"
"10017085-125-ハナエ" = "パーティーの最中だったのにすみません！"
"10017085-127-ハスミ" = "そういえばそうでしたね……。"
"10017085-128-ハスミ" = "ではせっかくですし、皆さんも一緒にいかがですか？"
"10017085-130-セリナ" = "そ、それは……？"
"10017085-131-ハナエ" = "パーティーに参加して良いってことですか！？"
"10017085-133-ハスミ" = "はい、騒ぎも終わりましたし。#nパーティーなんですから、参加者は多い方が楽しいでしょう。"
"10017085-134-ハスミ" = "いかがですか、ツルギ？"
"10017085-135-ツルギ" = "うっ、あ、うぇぇ……。"
"10017085-140-ハスミ" = "ちょっと恥ずかしいけど、大歓迎だそうです。"
"10017085-141-ハスミ" = "先生はいかがでしょうか？"
"10017085-142" = "[s3] \"喜んで！\"\n[s4] \"せっかくだし、ありがたく！\""
