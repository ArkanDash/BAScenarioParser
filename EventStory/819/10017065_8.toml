[translation]
"10017065-11" = "カフェ「White&Mason」入口"
"10017065-17-ハスミ" = "（こんな時に、イチカがいたら……！）"
"10017065-18-ハスミ" = "（ですが今は、自分の力だけでやるしかないですね……）"
"10017065-25-ミネ" = "くっ！"
"10017065-26-ハスミ" = "くぅっ……！"
"10017065-27-ミネ" = "……やはり素晴らしいですね、ハスミ副委員長。"
"10017065-28-ハスミ" = "身に余る言葉ですね……ミネ団長。"
"10017065-29-ミネ" = "だからこそ悲しいです、こんな優れた実力の持ち主が……"
"10017065-30-ミネ" = "善人のチキンを奪うだなんて！"
"10017065-32-ハスミ" = "！？"
"10017065-33-ハスミ" = "チキン……。"
"10017065-34-ハスミ" = "もしかしてそれが……救護騎士団が正義実現委員会を襲撃した理由、ですか？"
"10017065-35-ミネ" = "他に何がありますか！"
"10017065-36-ハスミ" = "他に何か、あると思っていたのですが……。"
"10017065-37-ハスミ" = "何かその、正義実現委員会全員を敵に回してもおかしくないような深刻な事態が……"
"10017065-38-ハスミ" = "政治的な問題に発展し得るとしても、それでも動かざるを得ないような事態かと……"
"10017065-39-ハスミ" = "だからこそ、こんなクリスマスにわざわざ来たと思ってたのですが……！"
"10017065-40-ハスミ" = "結局あのチキンですか！？"
"10017065-41-ハスミ" = "言っておきますが、あのチキンは――"
"10017065-46-チンピラA" = "良い様だな、正義実現委員会！"
"10017065-47-チンピラB" = "弱い者いじめをするからそうなるのさ！"
"10017065-48-チンピラA" = "今まで私たちが受けた苦しみ、倍にして返してやる！"
"10017065-49-チンピラB" = "自分たちがやられる番になった気分はどうだ？"
"10017065-50-チンピラA" = "さあ、こっからはあたしたちのターンだ！"
"10017065-52-セリナ" = "それは、どういう……？"
