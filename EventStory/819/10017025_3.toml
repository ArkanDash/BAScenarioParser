[translation]
"10017025-1" = "第２話;Les Miserables……？"
"10017025-10" = "裏通り"
"10017025-11-チンピラA" = "はあ、はあっ……！#nおい、大丈夫か！？"
"10017025-16-チンピラB" = "ちくしょう……行き止まりだ、追い込まれた！"
"10017025-19-ハスミ" = "……追い詰めました。#nマシロ、聞こえますか？"
"10017025-20-マシロ" = "はい、問題ありません！"
"10017025-21-ハスミ" = "支援射撃、お願いします。"
"10017025-22-マシロ" = "承知しました！"
"10017025-23-ハスミ" = "よろしくお願いしますね。"
"10017025-24-？？？" = "ひひっ……ひゃはは……"
"10017025-29-チンピラA" = "痛っ！？ど、どこから飛んできたんだ今の！？"
"10017025-30-チンピラB" = "この状況、狙えるような場所も早々無いだろ……！#nくそっ、例の正義実現委員会の狙撃手か！"
"10017025-31-チンピラA" = "あたしら、別にそこまで悪いことしてないだろ！？"
"10017025-32-チンピラB" = "そうだそうだ！誰かを攫って身代金を要求したわけでもないし！"
"10017025-33-チンピラA" = "勢力争いで街を半壊させたわけでもないし！"
"10017025-34-チンピラB" = "暴動も過激なデモも、暴行すら起こしてないのに！"
"10017025-35-チンピラA" = "そもそもクリスマスなんだから、私たちだって静かに――"
"10017025-39" = "ドカアアアアアァァァァン！！"
"10017025-40-チンピラA" = "ひっ！？"
"10017025-41-チンピラB" = "な、なんだ？どうした！？"
"10017025-46-？？？" = "くくっ、ききききき……。"
"10017025-47-？？？" = "ひひひひひひひっ……！"
"10017025-49-チンピラA" = "あれは……！？"
"10017025-50-チンピラB" = "た、助けてくれ！#n私には帰りを待っている大事な――"
"10017025-52-ツルギ" = "きゃはははははははあぁ！！！！"
"10017025-64-ハスミ" = "ふぅ……。"
"10017025-65-ハスミ" = "任務完了。#nマシロ、ツルギ、お疲れ様でした。"
"10017025-66-マシロ" = "はい、お疲れ様でした。"
"10017025-71-ツルギ" = "……例のモノは？ "
"10017025-76-ハスミ" = "しっかり回収しました。"
"10017025-77-ハスミ" = "それにしても、クリスマスにこんなことを考えるとは……。"
"10017025-78-ハスミ" = "全く、悪魔的といいますか、ゲヘナっぽいことをといいますか……。"
"10017025-79-マシロ" = "どちらにしても、ひどいことですね。"
"10017025-80-マシロ" = "もう災難と言うしかありません。#nクリスマス会の直前に、こんなことになるとは……。"
"10017025-81-ハスミ" = "とはいえ、誰かに任せるわけにもいきません。"
"10017025-82-ハスミ" = "私たち「正義実現委員会」が対応するのが道理です。"
"10017025-83-ハスミ" = "正義の実現は、時と場所を選ばないものですからね。#nそれがたとえ、クリスマス当日であったとしても。"
"10017025-84-マシロ" = "なるほど、正義の実現は時と場所を選ばない……"
"10017025-85-マシロ" = "たしかにそうです、あらためて身を引き締めました。"
"10017025-86-ハスミ" = "まあ、もう少し穏便に収めたいところではありましたが……。"
"10017025-87-ハスミ" = "今となっては、言い訳はできませんね。"
"10017025-89-ツルギ" = "……遅くなったな。"
"10017025-90-ハスミ" = "そういえば、すっかり遅れてしまいました。"
"10017025-91-ハスミ" = "出発した段階からギリギリだったのに、これはもう遅刻確定ですね。"
"10017025-92-マシロ" = "急ぎましょうか、みんなが待ってくれているはずですし。"
"10017025-93-ハスミ" = "では、行きましょう。"
"10017025-98-チンピラA" = "……行ったか？"
"10017025-99-チンピラB" = "いててて……死ぬかと思った……。"
"10017025-100-チンピラA" = "ああもう、危ねぇなあ！#nまったく、私たちはクリスマスも穏便に過ごせないのか……。"
"10017025-101-チンピラB" = "ほんと、酷い仕打ちだよ……。#nさて、これからどうする？"
"10017025-102-チンピラA" = "計画は台無しだし、全部奪われちまったし……。"
"10017025-103-チンピラB" = "とにかく、場所を変えるか……"
"10017025-112" = "キヴォトス・大通り"
"10017025-116-ハナエ" = "あなたっかーら、メリークリスマス～♪#nわたしっかーら、メリークリスマス～♪"
"10017025-117-セリナ" = "は、ハナエちゃん、歩くの速い……！"
"10017025-118-ハナエ" = "そういえば先輩、今日はサンタさんが来る日なんですよね？#n私たち、サンタさんの格好をしてても良いんでしょうか？"
"10017025-119-セリナ" = "大丈夫ですよ。ただだからこそ、この格好に恥じないように活動しないと。"
"10017025-120-ハナエ" = "なるほど！#nこの服装でいるからには、それなりの責任を負うべきってことですね！"
"10017025-121-ハナエ" = "何だかより楽しくなってきました！#n早く行きましょう！"
"10017025-125-セリナ" = "ハ、ハナエちゃん気を付けて！#n道が滑りやすくなってるから……！"
"10017025-131-チンピラA" = "……救護騎士団と、シャーレの先生？#n何をしているんだ……?"
"10017025-132-チンピラB" = "救護騎士団ってことは、あれだろ。#n毎年なんか、鍋置いて募金活動してるやつだろ？"
"10017025-133-チンピラA" = "ああ、なるほどな。先生は手伝いってところか。#n何だか、クリスマスを実感するな。"
"10017025-134-チンピラB" = "救護騎士団……先生……クリスマス……"
"10017025-135-チンピラB" = "……良いこと思いついた。"
"10017025-136-チンピラA" = "ん、何だよ良いことって？"
"10017025-137-チンピラB" = "まあ聞けよ、これは多分……"
"10017025-142-チンピラA" = "……天才じゃん。"
"10017025-143-チンピラB" = "ま、運が巡ってきたのかもな。#nじゃあ、乗るってことで良いか？"
"10017025-144-チンピラA" = "ああ、やろうぜ。"
"10017025-145-チンピラB" = "まずはできる限り、可哀想な感じに……"
"10017025-146-チンピラA" = "それは大丈夫だろ。#nなにせ全部奪われて計画台無しにされて……"
"10017025-147-チンピラA" = "もうあたしら、十分可哀想だし。"
"10017025-148-チンピラB" = "……泣きたくなってきたな。"
"10017025-149-チンピラA" = "まあ、泣くなら全部が終わってからだ。"
