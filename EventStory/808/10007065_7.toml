[translation]
"10007065-1" = "第6話;工務部にモルスを！"
"10007065-2-ノドカ" = "はあ、はぁ……しつこいですね……。"
"10007065-3-ミノリ" = "そ、そっちこそ……。"
"10007065-4-ミノリ" = "そろそろ敗北を認めたらどうだ？"
"10007065-5-ノドカ" = "認めてなるものですか！この温泉郷は私たちの希望なんです！"
"10007065-6-ノドカ" = "あの酷かった旧校舎の生活に戻るぐらいなら……"
"10007065-7-ノドカ" = "いっそのこと、この温泉郷と一緒に心中した方がましです！"
"10007065-8-ミノリ" = "……その勢いは買おう。"
"10007065-9-ミノリ" = "でも、こっちも工務部のプライドが懸かってる。あたしたちだって、引き下がれないのは同じ！"
"10007065-13-ミノリ" = "くっ。今日は特に風が冷たいな……。"
"10007065-15-ノドカ" = "ふふっ……きゅ、旧校舎付近の寒波をな、舐めてましたね……！"
"10007065-16-ノドカ" = "さ、寒いなら、も、もう諦めて、お、お帰りになった方が、い、良いんじゃないですか？"
"10007065-18-ミノリ" = "……いや、そっちの方が寒そうだけど。だいぶ薄着だし。"
"10007065-19-ミノリ" = "真冬の雪山でその格好……"
"10007065-20-ミノリ" = "正気？"
"10007065-22-ノドカ" = "ううっ、正論……！"
"10007065-28-シグレ" = "ノドカ、温めたモルス持ってきたよ。"
"10007065-29-ノドカ" = "あ、シグレちゃんありがと。こく、こく……ふぅ、温かい……。"
"10007065-31-ミノリ" = "なぁっ！？戦闘中に自分たちだけ補給なんてズルい！？"
"10007065-32-ミノリ" = "この戦いは「工務部」と「227号特別クラス」の、プライドを賭けた戦いだというのに……！補給品に頼らず、正々堂々とフェアに勝負しろ！"
"10007065-37-シグレ" = "はい、工務部のみんなも一杯どう？"
"10007065-38-ミノリ" = "……え？あたしたちにも、くれるの……？"
"10007065-39-シグレ" = "うん。去年の春に漬けておいたモルスは山ほどあることだし。"
"10007065-40-シグレ" = "ほら、風邪とか引かないうちに、冷める前に飲んだら？"
"10007065-41-ミノリ" = "その気持ちはありがたいけど……。"
"10007065-42-ミノリ" = "こ、こんな飲み物一杯で揺らぐほど、あたしたち工務部の意志は弱くない！これまで数多の辛い現場を乗り越えてきた、労働者のプライドを舐めるなよ！"
"10007065-49-ミノリ" = "美味しい！"
"10007065-50-ミノリ" = "すごいなこのモルス、甘くて優しい味がする。"
"10007065-51-ミノリ" = "そこに微かな苦みもあって、温もりが身体中に染み渡る……寒いところで飲むには最高だ！"
"10007065-52-シグレ" = "喜んでくれて良かった。今回のは特に良い感じにできたと思うんだよね。まあ、ちょっと発酵してるかもだけど。"
"10007065-53-シグレ" = "もう一杯どう？"
"10007065-54-ミノリ" = "うん、頂こう！"
"10007065-57-ミノリ" = "ふふっ、うふふふ……"
"10007065-58-ミノリ" = "本当に美味しい。これならいくらでも……"
"10007065-59" = "[s] \"えっと……ミノリ、大丈夫？\""
"10007065-60-ミノリ" = "うん？どうしたんだ先生、私は問題無い！この温かいモルスさえあれば、なんでもできるに違いにゃい！"
"10007065-61-ミノリ" = "むしりょ身体が火照って、熱いくらいだ！"
"10007065-62-ミノリ" = "ん、本当に熱い……というか汗で寒気が……んんっ？"
"10007065-63" = "[s] \"やっぱり、っていうかもしかしてこれ……。\""
"10007065-64-ミノリ" = "一度寒いと思ったら、どんどん寒くなっていく感じがすりゅ……。"
"10007065-65-ミノリ" = "うっ……何だか頭もくらくらして……くっ！"
"10007065-66-シグレ" = "それは良くないね。汗が冷える前に、温泉に入って身体を温めないと。"
"10007065-67-ミノリ" = "……温泉？"
"10007065-68-ミノリ" = "それはつまり……あたしたち工務部に、ゲヘナのバカ共が建設した温泉に入れと？"
"10007065-69-シグレ" = "そうじゃないよ、ミノリ部長。"
"10007065-70-シグレ" = "半強制的にこの温泉郷を任されてはいるけど、私たちとしてはまだ、ゲヘナの生徒たちが建設したこの施設が「本当に安全なのか」は分からない。"
"10007065-71-シグレ" = "だから「キヴォトス最高の建築業者」である工務部の部員たちに温泉に入ってもらって、ちゃんと直接この温泉郷の状態を点検してほしいんだ。"
"10007065-72-ミノリ" = "キヴォトス最高の、建築業者……"
"10007065-73-ミノリ" = "ふふっ、なるほど……確かにあたしたちを超える建築業者など、きっとキヴォトスには存在しない！"
"10007065-74-シグレ" = "それに、温かい温泉に入りながらの飲み物っていうのもまた、結構格別なんだよ？"
"10007065-75-ミノリ" = "……なるほど？"
"10007065-79-ミノリ" = "これはあくまで事前調査なんだけど、もしかしてモルス以外にも美味しい飲み物があるとか……？"
"10007065-80-シグレ" = "もちろん。この227号温泉郷にはどんなお客様にも満足頂けるように、色んな飲み物を置いてるからね。"
"10007065-81-シグレ" = "ましてや工務部がお客様として来てくれるなら、カンポットでもモルスでも、幾らでも振舞うつもりだよ。発酵してるかもだけど。"
"10007065-82-ミノリ" = "な、なるほど……そこまで言われては仕方ない！ゲヘナのバカ共が一体どれだけ雑な工事をしたのか、実際に温泉に入ってゆっくり調べないと！"
"10007065-83-ミノリ" = "……決して、モルスがもっと飲みたくて言ってるわけじゃない！"
"10007065-84-シグレ" = "うんうん、もちろん分かってるよ。"
"10007065-85-シグレ" = "じゃあまずは、北の露天風呂からお願いしようかな。広いから、工務部のみんなで入れるはずだよ。"
"10007065-86-ミノリ" = "よし。さあみんな、"
"10007065-87-ミノリ" = "そうと決まればこの227号温泉郷の安全と、たくさんのモルス……"
"10007065-88-ミノリ" = "いや、休そ……えっと、そうだ、「革命的な休息」のために……！"
"10007065-89-ミノリ" = "温泉に、突撃だぁ！"
"10007065-92-傭兵バイト" = "革命的な休息のためにっ！！！"
"10007065-97-ノドカ" = "あの頑固な工務部員たちが、一気におとなしい羊の群れみたいに……。"
"10007065-98-シグレ" = "まあ、そんなに難しいことをしたわけじゃないよ。"
"10007065-99-シグレ" = "美味しい飲み物、そして気持ちを込めた言葉。それさえあれば、大抵のお願い事はスムーズに相手まで届くものだから。"
"10007065-100-ノドカ" = "シグレちゃんってたまに怖いよね……友達で良かった……。"
"10007065-101" = "[s] \"ところでシグレ、ちょっと聞きたいんだけど。\""
"10007065-102-シグレ" = "ん？どうしたの、先生？"
"10007065-103" = "[s] \"さっきの飲み物、本当に変な物じゃないんだよね？\""
"10007065-104-シグレ" = "もちろん。このモルスはコケモモと砂糖で作った、伝統的なモルスだよ。あと酵素。"
"10007065-105-シグレ" = "まあ保存環境が良くなかったし、ちょっと発酵してるかもだけど……。"
"10007065-111-シグレ" = "確認も兼ねて、先生も飲んでみる？"
"10007065-113" = "（シグレが薦めるモルスを何とか断りながら、逃げるように温泉郷の中へと戻っていった……）"
