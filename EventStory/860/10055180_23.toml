[translation]
"10055180-1" = "夕闇の高飛車トライアムヴィレイト"
"10055180-3-マコト" = "諸君、私は非常に重要な事実に気が付いた。"
"10055180-4-イロハ" = "あ、そうですか。イブキ、暗いので足元に注意してください。"
"10055180-5-イブキ" = "うん！イロハ先輩も気をつけてね！"
"10055180-10-マコト" = "我々の優勝を左右する、とんでもない手がかりだ。"
"10055180-11-サツキ" = "みんな、夜の海の何がそんなに好きなの！？ちょっとチアキ、離れないで！"
"10055180-12-チアキ" = "分っかりました～！でも、もう少しで商店街につきますので～"
"10055180-17-マコト" = "気になるだろう？気になって、夜も眠れなくなるはずだ！"
"10055180-18-マコト" = "そうだろう！？"
"10055180-19" = "[s1] \"う、うん！！\"\n[s2] \"すごく気になる！！\""
"10055180-22-マコト" = "キシシッ！よくぞ聞いてくれた。"
"10055180-23-マコト" = "それは――敵が現れる順番が決まっているということだ！"
"10055180-24-マコト" = "最初に出会ったのは誰か、思い出してみるがいい。"
"10055180-25-イロハ" = "……たしかアビドスでしたね。"
"10055180-26-マコト" = "ああ。名もほとんど忘れられた、弱小学園だ。その次は……。"
"10055180-27-チアキ" = "ヴァルキューレ警察学校、ですよね？#n公安局長、ずっと怒った顔してましたけど……何かあったのでしょうか？"
"10055180-28-マコト" = "ふむ、連邦生徒会の犬ではあるがアビドスとはワケが違う。#nそして、直前の学園はというと……。"
"10055180-29-サツキ" = "百鬼夜行連合学院。なるほど、マコトちゃんの言いたいことは分かったわ。"
"10055180-30-マコト" = "流石だサツキ。そうだ、百鬼夜行は我々ゲヘナとは比べるまでもないが、#nそれでも相当な規模の学園になる。"
"10055180-31-マコト" = "つまり、我々の相手はどんどん強くなっている！#nとなれば……百鬼夜行よりも強く、ゲヘナに匹敵する強敵――"
"10055180-32-マコト" = "いや、宿敵とも言える「あの学園」と対峙するのも時間の問題ということだ！"
"10055180-33-イブキ" = "宿敵ー？"
"10055180-34-？？？" = "オーッホッホッホッホ！順調に勝ち進んでいるようですね！"
"10055180-35-？？？" = "しかし快進撃もそこまでです！"
"10055180-37-マコト" = "やはり来たか……！"
"10055180-38-イロハ" = "何ですかこのベタな展開……。"
"10055180-43-ナギサ" = "どこの馬の骨とも知れない……。#nそれも、ヤドカリごときが旋風を巻き起こしているようで。"
"10055180-45-ナギサ" = "夕闇の高飛車#nトライアムヴィレイト"
"10055180-50-ナギサ" = "「クラブファイト」は血統のスポーツだと……その身をもって知ってもらいます！"
"10055180-51-マコト" = "はっ！好き勝手言ってくれる！"
"10055180-52-ナギサ" = "ヤドカリ風情がトリニティの名カニに勝てるとでも？#n身の程知らずも甚だしいですね。"
"10055180-53-ナギサ" = "そんなもの、夢のまた夢のお話ですよ！オーッホッホッホ！"
"10055180-54-ミカ" = "な、ナギちゃんどうしたの……？"
"10055180-55-ミカ" = "ストレス？それとも、ロールケーキの賞味期限切れてた？"
"10055180-59-セイア" = "……。"
"10055180-63-セイア" = "……！"
"10055180-64-セイア" = "……そうじゃないだろう？ミカ。"
"10055180-65-ミカ" = "え？"
"10055180-66-セイア" = "真の友人であるならば、我々のやるべきことは一つだ。"
"10055180-67-ミカ" = "ど、どういう意味……？"
"10055180-68-セイア" = "要するに……。"
"10055180-69-セイア" = "その貧相なヤドカリ……見ているだけで、せっかくのお茶が不味くなりますわ！"
"10055180-70-ミカ" = "セイアちゃん！？"
"10055180-71-ナギサ" = "オーッホッホッホ！"
"10055180-72-ミカ" = "ナギちゃんまで！？"
"10055180-76-ミカ" = "……あーもうっ！知らないから！！"
"10055180-77-ミカ" = "さあ、かかっておいでなさい！身の程を分からせてやりますわ！！"
"10055180-78-マコト" = "ついに本性を現したな！ティーパーティー！"
"10055180-79-マコト" = "3対1とは卑怯だぞ！"
"10055180-80-ナギサ" = "3対1……？ふっ。"
"10055180-81-マコト" = "何がおかしい？"
"10055180-82-ナギサ" = "先ほどお伝えしたように、クラブファイトとは血統のスポーツ……。"
"10055180-83-ナギサ" = "つまり、選手の優劣がそのまま勝敗を分けます。"
"10055180-84-ナギサ" = "では……我々トリニティの、最高の選手をご紹介しましょう！"
"10055180-91-ヒフミ" = "えっ……な、なんですか？というか、どこですかここ！？"
"10055180-92-マコト" = "そ、そいつは！？"
"10055180-96-マコト" = "……誰だ？"
"10055180-97-ナギサ" = "ヒフミさんです。"
"10055180-98-マコト" = "……名前を聞いても分からん！"
"10055180-99-ナギサ" = "ヒフミさんを知らないなんて……お里が知れますね。"
"10055180-100-ナギサ" = "では……お願いしますわ！ヒフミさん！"
"10055180-102-ヒフミ" = "へっ！？ナギサ様！？これはどういう状況で……えっ！？"
"10055180-103-ヒフミ" = "ええ～っ！？"
