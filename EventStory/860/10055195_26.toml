[translation]
"10055195-2-マコト" = "キキキッ……。"
"10055195-3-マコト" = "キシシシッ！ついにレッドウィンターまで倒れた！！"
"10055195-4-マコト" = "これでゲヘナに勝てる学園はないと証明されたのだ！"
"10055195-5-マコト" = "キヴォトスに住まう有象無象の民よ！このマコト様の英知と力に、ひざまずけ！"
"10055195-6-イブキ" = "私が貴様らを支配してやる！"
"10055195-7-イロハ" = "はあ……イブキが真似するから変なこと言わないでください。"
"10055195-8-マコト" = "「クイーンのなんでも券」よ！私の願いを叶えたまえ！"
"10055195-9-サツキ" = "それで？結局お願いは何にするの？"
"10055195-10-マコト" = "愚問だな。世界征服に決まっているだろう！"
"10055195-11-イロハ" = "だと思いました……。"
"10055195-12-マコト" = "では私の願いを……！"
"10055195-16-マコト" = "……。"
"10055195-17-イロハ" = "マコト先輩？"
"10055195-18-マコト" = "いや、やはり……。"
"10055195-22-マコト" = "私の、願いは……。"
"10055195-27-サツキ" = "あ、起きたわ。"
"10055195-28-イロハ" = "言ったでしょう？体が丈夫なことだけが、マコト先輩のとりえなんですから。"
"10055195-32-マコト" = "ん……？"
"10055195-33-マコト" = "どういうことだ、これは……？"
"10055195-34-サツキ" = "覚えてない？マコトちゃん、カモメを捕まえるって言って船の上に登ろうとして、#nそこから真っ逆さまに落ちたのよ。"
"10055195-38-マコト" = "タイガーシャーク丸はどうした！？#nどんな願いも叶える「クイーンのなんでも券」は！？"
"10055195-42-イロハ" = "はい……？"
"10055195-43-イロハ" = "あの……寝言くらいまともなこと言ってくれませんか？"
"10055195-44-サツキ" = "寝言だからまともじゃないんじゃないの？"
"10055195-45-イロハ" = "……それもそうですね。"
"10055195-46-マコト" = "あれが全部夢だと！？そんな馬鹿な！"
"10055195-50-マコト" = "認めん！私は認めんぞおおお！！！"
"10055195-54-イブキ" = "あれ？"
"10055195-55-イブキ" = "わあ～かわいいヤドカリさんだ！"
"10055195-58-セリカ" = "ホシノ先輩！"
"10055195-61-ホシノ" = "わっ！？"
"10055195-62-セリカ" = "もう！本当に寝てたの！？"
"10055195-63-ホシノ" = "あー……えーっとぉ～"
"10055195-64-セリカ" = "倉庫の整理！お願いしたでしょ！？"
"10055195-65-ホシノ" = "そうそう、そうなんだけどさ～"
"10055195-66-セリカ" = "そうなんだけど寝てたんでしょ！言い訳は？"
"10055195-67-ホシノ" = "ありません……。"
"10055195-68-セリカ" = "まったく……手伝ってあげるから、早く起きて！二人でやればすぐ終わるでしょ。"
"10055195-69-ホシノ" = "うへ～さすがセリカちゃん～持つべきは可愛い後輩だね～"
"10055195-70-セリカ" = "う、うるさいっ！あんまからかうと怒るわよ！？"
"10055195-74-セリカ" = "……ホシノ先輩？"
"10055195-75-セリカ" = "起きてからなんか変だけど、大丈夫？もしかして悪い夢でも……。"
"10055195-76-ホシノ" = "ん……？"
"10055195-77-ホシノ" = "いや～？ただの意味のない夢だよ～"
"10055195-78-ホシノ" = "いや……カニのある夢か。"
"10055195-79-ホシノ" = "まあでも……。"
"10055195-80-ホシノ" = "かわいい海の生き物たくさん見れたし、得しちゃったかな～"
