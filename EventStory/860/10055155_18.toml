[translation]
"10055155-3-ホシノ" = "やられた～"
"10055155-8-シロコ" = "まだ終わってない。もう一回勝負しよう。"
"10055155-9-ホシノ" = "シロコちゃんは元気だね～おじさんはもうついていけないよ～"
"10055155-10-セリカ" = "いやだからそんなに年変わらないってば！"
"10055155-11-セリカ" = "そもそも戦ったのはアヤネちゃんなのに、なんで先輩が倒れてるの！"
"10055155-12-アヤネ" = "あはは……シロコ先輩。ここは一度休憩しましょう。"
"10055155-13-シロコ" = "アヤネ……？"
"10055155-14-シロコ" = "どうしてそんなこと言うの？もしかしてマインドコントロール……？"
"10055155-15-ノノミ" = "そうじゃないですよ、シロコちゃん☆"
"10055155-16-ノノミ" = "アヤネちゃんは、次の試合に備えてザリガニさんを休ませようとしてるんです！"
"10055155-17-イロハ" = "次の試合……？これって試合なんですか？"
"10055155-18-アヤネ" = "え？知らなかったんですか？#n先生と一緒だったから、てっきり知っているものだと……。"
"10055155-19-アヤネ" = "ということは……ああっ！？"
"10055155-20-アヤネ" = "ごめんなさい！何も知らない方々に勝負を申し込んでしまいました！"
"10055155-21-マコト" = "ふむ。このマコト様が寛大な心で許そう。"
"10055155-22-イロハ" = "いや頑張ったのは私とヤドカリなんですけど。"
"10055155-23-チアキ" = "それはそうと、試合ってどういうことなんです？#nここはただの無人島じゃなかったんですか？"
"10055155-24-ホシノ" = "う～ん……負けちゃったし、教えてあげよっか。"
"10055155-25-ホシノ" = "今この島で行われているのは……。#n地上最強の甲殻類を争う、最恐最悪のバトルロイヤル！"
"10055155-26-ホシノ" = "その名も「[ruby=てんかいっかい]天下一蟹[/ruby]・武術大会」！"
"10055155-27-イロハ" = "……名前ダサッ！"
"10055155-28-マコト" = "おお！なんという直感的かつ、ユーモラスな名前だ！"
"10055155-29-アヤネ" = "ルールは簡単です。参加者はそれぞれ星を持ち、それを賭けて勝負をします。#n勝負に勝ったら、相手から星を奪うことができます。"
"10055155-30-アヤネ" = "そうして勝負を繰り返し……一番最初に星を5個集めたチームの優勝です。"
"10055155-31-セリカ" = "そしてなんと！優勝者には世界最強のカニという名誉と……。"
"10055155-32-セリカ" = "どんな願いでも叶えてくれる「クイーンのなんでも券」がもらえるのよ！"
"10055155-33-セリカ" = "この大会で優勝して、学校の借金を全部返してみせるわ！"
"10055155-34-マコト" = "なっ、それは本当か！？"
"10055155-35-イロハ" = "いやウソでしょ。"
"10055155-36-アヤネ" = "あはは……私たちも怪しいとは思ってるんですけど……。"
"10055155-37-アヤネ" = "あれ？そもそも何で私たちはこの大会に参加したんだっけ……？"
"10055155-38-ホシノ" = "アヤネちゃん、このザリガニくんの治療を手伝ってもらいたいんだけど～"
"10055155-39-アヤネ" = "あっはい！すぐに行きます！"
"10055155-43-マコト" = "……。"
"10055155-44-マコト" = "漂流の末にたどり着いた島で偶然タイガーシャーク丸と出会い、#nこのような大会に巡り合うとは……。"
"10055155-45-マコト" = "これはまさに……。"
"10055155-46-マコト" = "天運が味方したとしか考えられまい！天が我々に、チャンスを与えたのだ！"
"10055155-47-マコト" = "諸君、よく聞け！今から我々万魔殿は、#n総力を挙げて「天下一蟹・武術大会」の優勝を獲りにいく！"
"10055155-48-イブキ" = "総力戦ー！"
"10055155-49-マコト" = "我々の目標は頂点ただ一つ！さあ、このマコト様に続け――！！"
