[translation]
"10055060-1" = "第6話;カリビアンの万魔殿"
"10055060-10-マコト" = "ヨーホホ！みなよく似合っているぞ！"
"10055060-11-マコト" = "先生よ、改め[ruby=マン・オブ・パンデモニウム]てこの万魔船のメン[/ruby]バーとなったことを歓迎する！"
"10055060-12" = "[s1] \"あれ？\"\n[s2] \"一人見当たらないような……？\""
"10055060-15-イブキ" = "あっ、イロハ先輩がいない！"
"10055060-16-イブキ" = "イブキ探してくる！"
"10055060-20-イロハ" = "うう……どうして私がこんな格好を……。"
"10055060-21-イブキ" = "イロハ先輩、着るの大変？イブキ手伝う？"
"10055060-22-イロハ" = "あっ、大丈夫です……ちょっと気持ちを落ち着かせているというか……。"
"10055060-29-イロハ" = "笑わないでください。"
"10055060-30" = "[s3] \"笑ってません！\"\n[s4] \"海賊さんだ！！\""
"10055060-39" = "[ns5] \"わぁっ！？\"\n[ns6] \"無言で壁を蹴らないで！？\""
"10055060-43-イロハ" = "最悪すぎる……しばらく探さないでください。"
"10055060-44-イロハ" = "恥ずかしくて死にそうです。"
"10055060-48-イブキ" = "わあ！イロハ先輩もおそろい～！"
"10055060-49-イブキ" = "イブキうれしい！"
"10055060-50-イロハ" = "……イブキ。"
"10055060-51-イロハ" = "仕方ないですね、ちょっとだけ頑張ってみますか。"
"10055060-55" = "[ns7] \"えっ……。\"\n[ns8] \"あんなに壁を蹴ってたのに……。\""
"10055060-59-海賊A" = "なんで掃除なんてやってるんだ……？"
"10055060-60-海賊B" = "ピカピカな幽霊船って、聞いたことある？"
"10055060-62-マコト" = "そこ！！私語が多いぞ！"
"10055060-66-マコト" = "だべってるヒマがあるなら手を動かせ！"
"10055060-67-マコト" = "この船を新品同様、ピカピカにするのだ！"
"10055060-68-海賊A" = "は、はいぃ！"
"10055060-72-マコト" = "「キャプテン」だ！"
"10055060-73-海賊B" = "はいっ、キャプテン！"
"10055060-77-サツキ" = "……で、マコトちゃん。今度は何をしたの？"
"10055060-78-マコト" = "ん？"
"10055060-79-サツキ" = "海賊たちのこと。#nどうやって手下にしたのよ。"
"10055060-80-マコト" = "ああ、そのことか！"
"10055060-82-マコト" = "それはな……。"
"10055060-84" = "1時間前……。"
"10055060-88-マコト" = "ぜえ、ぜえ……。"
"10055060-89-マコト" = "しつこい奴らめ！いつまで追いかけてくる気だ！"
"10055060-93-イロハ" = "はあ、はあ……一応言っときますが、こっちが侵入者ですからね……！？"
"10055060-94-海賊たち" = "あっちだ！あっちから声がするぞ！"
"10055060-95-イロハ" = "くっ！"
"10055060-96-マコト" = "文句言っている場合じゃない！"
"10055060-97-マコト" = "あの部屋に逃げるぞ！"
"10055060-104-イロハ" = "ここは何の部屋でしょう。"
"10055060-105-イロハ" = "というか行き止まりじゃないですか！見つかったら終わりですよ！？"
"10055060-106-マコト" = "見つからなければいい！"
"10055060-107-イロハ" = "なにバカなことを……。"
"10055060-108-マコト" = "私を信じろ！問題はない！"
"10055060-109-イロハ" = "……信じろって？"
"10055060-110-イロハ" = "信じたから全部こうなってるんじゃないですか！"
"10055060-111-イロハ" = "そもそもマコト先輩が何も考えずこの船に乗り移ったから……！！"
"10055060-112-マコト" = "……。"
"10055060-117-イブキ" = "……ううっ。"
"10055060-118-イロハ" = "……あ。"
"10055060-119-イロハ" = "ごめんなさい、イブキ。#n声が大きすぎました。"
"10055060-120-イロハ" = "驚かせるつもりはなかったんです。"
"10055060-124-イロハ" = "でも、こんな状況で……どうしたら。"
"10055060-125-イロハ" = "せめてイブキだけでも、なんとか安全に脱出させる方法を……。"
"10055060-129-マコト" = "……。"
"10055060-133-イロハ" = "……！？マコト先輩どこ行くんですか！？"
"10055060-134-マコト" = "とろい幽霊ども！私はここに居る！"
"10055060-135-マコト" = "早く追いかけるがいい！！"
"10055060-136-海賊たち" = "あっちだ！あいつを追え！！"
"10055060-144-イロハ" = "……マコト先輩？"
"10055060-146-サツキ" = "……なるほどね。"
"10055060-147-サツキ" = "いや、全然説明になってないわよ？"
"10055060-148-サツキ" = "その感じだとマコトちゃんも幽霊になるのが正解なんじゃなくて？"
"10055060-149-サツキ" = "……まさか、もう幽霊になって！？"
"10055060-150-マコト" = "いや、いくらこのマコト様と言えどもそれは……。"
"10055060-151-マコト" = "まあ……つまりは気合いだ。"
"10055060-152-サツキ" = "気合い……？"
"10055060-153-チアキ" = "あ、マコト先輩がいつも言ってるやつですね！"
"10055060-154-チアキ" = "猫だって気合い次第でライオンになれる、って言ってますもんね！"
"10055060-155-マコト" = "ん？それは事実だからな。"
"10055060-159-マコト" = "で、その後のことだが――"
"10055060-162-マコト" = "…………。"
"10055060-167-海賊A" = "見つけた！あっちだ！"
"10055060-168-海賊B" = "追い詰めたぞ！もう逃げ場はな――"
"10055060-170-マコト" = "この……。"
"10055060-177-マコト" = "この……。"
"10055060-178-マコト" = "大馬鹿者が！！"
"10055060-184-マコト" = "死んで幽霊になったなら、それなりにストーリーがあるのだろう？"
"10055060-185-マコト" = "これほど巨大な船を持つ者が、怨念を晴らすどころか子どもの恫喝だと！？"
"10055060-187-海賊A" = "あ、いや……あっしらは……。"
"10055060-189-マコト" = "うるさい！言い訳など聞きたくない！"
"10055060-190-マコト" = "隠そうたって無駄だ。#nこの私は見つけたのだ……。"
"10055060-191-マコト" = "この箱に描かれているのは、間違いなくゲヘナのマーク！"
"10055060-192-マコト" = "つまりお前らはゲヘナの生徒……ゲヘナの幽霊なのだろう？"
"10055060-193-マコト" = "他校ならまだしも、ゲヘナ生の幽霊の無様など許すまい！"
"10055060-198-海賊A" = "いやいきなり突撃してきて、そんなこと言われてもな……。"
"10055060-199-海賊B" = "どうしろって……。"
"10055060-201-マコト" = "だが気持ちは分かっているとも！"
"10055060-202-マコト" = "愛しきゲヘナから遠く離れた遠洋で、幽霊海賊生活はさぞ辛かったことだろう。"
"10055060-203-マコト" = "身も心もすり減っていき、何もかもが遠くに感じる……漠然とした不安に駆られたはずだ。"
"10055060-204-マコト" = "しかしそれは、リーダー不在がゆえに起こったといえよう！"
"10055060-205-マコト" = "優秀な指導者が道しるべとなり、ビジョンを提示することで間違いなく状況は改善される！"
"10055060-207-海賊A" = "リーダー……？ビジョン……？"
"10055060-209-マコト" = "難しいことなど何もない！"
"10055060-210-マコト" = "運が良かったな。#nお前らの前には、歴史上最高の指導者がいるのだ！"
"10055060-211-マコト" = "ただ一つのルールだけを守ればいい――"
"10055060-215-マコト" = "これよりこの私を――「キャプテンマコト」と呼ぶのだ！！"
"10055060-218-サツキ" = "……。"
"10055060-219-イロハ" = "……。"
"10055060-220-イロハ" = "いやそんなのウソ――"
"10055060-222-チアキ" = "うわあ！すごいですね！！"
"10055060-227-チアキ" = "さすがマコト先輩！その場に居れなかったのが残念すぎます！#n写真に収めたかった～……。"
"10055060-228-イブキ" = "お～マコト先輩……いやキャプテンマコト、かっこいい！"
"10055060-229-マコト" = "ヨーホホ！もっと褒めるがいい！"
"10055060-234" = "[ns] \"イロハ……？\""
"10055060-235-イロハ" = "言いたいことは分かるんですが。"
"10055060-236-イロハ" = "私が[ruby=・   ・   ・   ・   ・   ・   ・]助けに行った時[/ruby]にはもう、あの状態で……。"
"10055060-237-サツキ" = "……ん？"
"10055060-238-イロハ" = "どうしました？"
"10055060-239-サツキ" = "いえ、なんでも。"
"10055060-240-サツキ" = "とにかく事実だけを見た時、海賊たちがマコトちゃんに従っているのは本当よ。"
"10055060-241-サツキ" = "だから誇張はあったとしても、嘘はないってこと。"
"10055060-243-イロハ" = "だとしても何もかも出来すぎた話では？"
"10055060-244-イロハ" = "[ruby=・   ・]偶然[/ruby]、遠洋で幽霊船に出会って、船員が[ruby=・   ・]偶然[/ruby]ゲヘナ生だった？"
"10055060-245-サツキ" = "ああ……そこから勘違いしているみたいね。"
"10055060-246-イロハ" = "え？"
"10055060-247-サツキ" = "この船は間違いなくゲヘナの物よ。海賊たちもゲヘナの生徒でしょうね。"
"10055060-248-サツキ" = "ただ……。"
"10055060-249-イロハ" = "ただ？"
"10055060-253-サツキ" = "……いや、これは推測に過ぎないわ。"
"10055060-254-サツキ" = "…………。"
"10055060-256" = "（そして時間は流れ……）"
"10055060-259-海賊A" = "……。"
"10055060-260-海賊B" = "……。"
"10055060-261-海賊A" = "最初は掃除って言われて意味わかんなかったけど……。"
"10055060-262-海賊B" = "綺麗になった船を見ると……。"
"10055060-263-海賊たち" = "……めっちゃ気持ちいい！"
"10055060-265-マコト" = "ヨーホホ！素晴らしいぞ諸君！"
"10055060-266-海賊たち" = "キャプテン！"
"10055060-267-マコト" = "汚れていた船は諸君どもの敗北主義を投影していたのだ。#nしかし今はどうだ？"
"10055060-268-マコト" = "誰がこの船を見てみすぼらしい幽霊船と言うだろうか！"
"10055060-269-マコト" = "諸君はすでに素晴らしい海賊船の一員だ！"
"10055060-271-海賊A" = "ああ……そうだな、生まれ変わった気分だよ。"
"10055060-272-海賊B" = "少し前まではこんなこと、想像もできなかった……。"
"10055060-274-マコト" = "まだだ！！"
"10055060-281-マコト" = "諸君が成し遂げた変化は素晴らしい！"
"10055060-282-マコト" = "しかしこの壮大できらびやかな変化さえも、今後お前たちの生涯では最も小さな成功に過ぎないだろう！"
"10055060-283-マコト" = "このキャプテンマコトの下にいればそう感じられることだろう！ヨーホホ！"
"10055060-284-海賊たち" = "キャプテン！マコト！キャプテン！マコト！"
"10055060-289-イロハ" = "……ほんと、口だけはよく回るんだから。"
"10055060-294-サツキ" = "あらすっかり綺麗になったわね。#nで、マコトちゃん。これからどうするつもり？"
"10055060-295-マコト" = "ん？"
"10055060-296-サツキ" = "この船を奪う、という目標は達成したでしょう？"
"10055060-300-マコト" = "当然だろう。"
"10055060-304-マコト" = "真の海賊がやることと言えば一つ！"
"10055060-306-マコト" = "キヴォトス中の金銀財宝を略奪するのだ！ヨーホホ！"
"10055060-311-イロハ" = "……はい？"
"10055060-312-イロハ" = "陸に戻るんじゃ……。"
"10055060-313-イロハ" = "はぁ……これ、完全にコンセプトに飲み込まれたパターンですね。#nしばらくあのままな気がします。"
"10055060-314" = "[s9] \"危険じゃないかな？\"\n[s10] \"海賊だなんて……。\""
"10055060-317-イロハ" = "いや、本気にしないでください。"
"10055060-318-イロハ" = "この船の装備見ましたよね。強そうなのは見た目だけで、実際はガラクタの大砲があっただけじゃないですか。"
"10055060-319-イロハ" = "こんなおんぼろにやられるような船は、キヴォトスのどこにもないと思いますよ。#n火薬なんてコンビニのものより少ないし。"
"10055060-320" = "[s11] \"たしかに。\"\n[s12] \"その通りだね。\""
"10055060-323-イロハ" = "あと、さっき掃除の時チラッと見たんですが、この船の大砲……。"
"10055060-330-イロハ" = "な、なんですか！？"
"10055060-331-マコト" = "何事だ！銃弾はどこからだ！？"
"10055060-332-海賊A" = "キャプテンマコト！敵襲です！"
"10055060-333-マコト" = "敵襲……？ここは海のど真ん中だぞ、誰が我々を！？"
"10055060-334-海賊B" = "敵艦が水平線付近に見えます！"
"10055060-339-イロハ" = "本気ですか……？いやウソ……。"
"10055060-340-イロハ" = "あんなに待ちわびてた時は来なかったのに、今？"
"10055060-343-海賊A" = "敵艦トライデントです！"
"10055060-345-海賊A" = "オデュッセイア海洋高等学校の風紀委員です！"
