[translation]
"10055130-1" = "後日談その4;海の賑やかな伝令者"
"10055130-4-スミカ" = "き、来ちゃいました、ゲヘナ学園……。"
"10055130-8-スミカ" = "さすがはキヴォトス三大学園といいますか……外壁から床材までピカピカです。"
"10055130-13-スミカ" = "ま、まあまあ！こんなもんですよね。"
"10055130-14-スミカ" = "オデュッセイアの「オリュンポス号」の相手にはなりませんから！"
"10055130-19-スミカ" = "……恥ずかしいからあまりキョロキョロしないようにしよ。"
"10055130-20-スミカ" = "とはいえ、部長ってば心配性なんだから。"
"10055130-21-スミカ" = "学園間の問題は「アイランド」に任せればいいのに、なんでわざわざ謝罪なんか。"
"10055130-22-スミカ" = "まあ……おかげで陸に来れたし、いっか。"
"10055130-23-スミカ" = "お使いの内容自体は簡単なものだし……。"
"10055130-24-スミカ" = "ちょ～っと時間が余るかもしれないし～初めての場所で、道に迷うかもしれないし～……。"
"10055130-25-スミカ" = "ちょ～ど！ゲヘナのビオトープは独特な植生の名所で種類豊富！昆虫コレクターたちの間でも大人気の場所！"
"10055130-26-スミカ" = "ええ……ぐ～ぜん！貴重な昆虫とお会いできるかもしれない……ふっふっふ……。"
"10055130-27-スミカ" = "あっ、こうしている場合じゃない。早くお使いを終わらせましょう！"
"10055130-30-スミカ" = "あのー突然すみませんー。"
"10055130-31-風紀委員" = "ん？あなたは……？"
"10055130-32-スミカ" = "私、オデュッセイア海洋高等学校から派遣された、外交使節の[ruby=こもり]小森[/ruby]スミカと申します。"
"10055130-33-風紀委員" = "が、外交使節？"
"10055130-34-スミカ" = "ああ、そう難しい顔しなくて大丈夫です。ただ道を聞きたいだけでして。"
"10055130-35-スミカ" = "お会いしたい方は――"
"10055130-39-スミカ" = "……あれ？そういえばお名前を知らないんでした。"
"10055130-40-風紀委員" = "えっと、ゲヘナにはいっぱい人がいるから、名前を知らないんじゃちょっと……。"
"10055130-41-風紀委員" = "何か特徴とかはないですか？"
"10055130-42-スミカ" = "あ、それなら簡単です。ゲヘナのすごく偉い人なんです。"
"10055130-43-風紀委員" = "偉い人……。"
"10055130-46-スミカ" = "あと、印象的な銀色の髪です。"
"10055130-47-風紀委員" = "……ん？"
"10055130-48-スミカ" = "あと！すごく強い人です。"
"10055130-49-風紀委員" = "ああ、それなら間違いありません。"
"10055130-54-風紀委員" = "私たちの委員長、[ruby=そらさき]空崎[/ruby]ヒナさんですね。"
"10055130-56-スミカ" = "なるほど、空崎ヒナさん。覚えておきます。"
"10055130-57-スミカ" = "その方はどこに行けば会えますか？"
"10055130-58-風紀委員" = "あ、ええっと……。"
"10055130-59-風紀委員" = "実はこの時期は、あまり会うのはオススメしないというか……。"
"10055130-60-スミカ" = "……？"
"10055130-61-風紀委員" = "一応場所は言っておきますね。ここから――"
"10055130-68" = "ヒノム火山94-13地区・麓"
"10055130-71-スミカ" = "ぜぇ……ぜぇ……ぜぇ……！"
"10055130-72-スミカ" = "暑い！熱い！！なんで私がこんな……！！"
"10055130-73-スミカ" = "というか常人はこんなとこ1日で来れませんよ！？私だからできたワケで……！"
"10055130-74-スミカ" = "青い海がこんなにも恋しくなるなんて……。"
"10055130-75-？？？" = "あれ？珍しいな。"
"10055130-77-イオリ" = "一般人がこんなとこまで来るなんて、そうそうないぞ。"
"10055130-78-イオリ" = "もしかして私たちに用？"
"10055130-82-スミカ" = "ああ、やっと人が……！"
"10055130-83-スミカ" = "はい、ぜひお会いしたい方がいまして。空崎ヒナさん、という人で……。"
"10055130-84-イオリ" = "ああ、委員長？委員長、お客さんだよ。"
"10055130-85-ヒナ" = "ん？この時期に？"
"10055130-89-ヒナ" = "風紀委員の夏の合宿訓練……それなりに有名だと思ってたけど。"
"10055130-90-ヒナ" = "それでもってことは、きっと急用なんでしょうね。"
"10055130-91-スミカ" = "……。"
"10055130-92-ヒナ" = "……。"
"10055130-93-スミカ" = "どちらさまで？"
"10055130-94-ヒナ" = "……？私を呼んだのでしょう？空崎ヒナよ。"
"10055130-95-スミカ" = "万魔殿の、トップじゃ……ない！？"
"10055130-96-ヒナ" = "！？"
"10055130-98" = "（そしてスミカは白目で下山したのであった）"
"10055130-99" = "（一方……マコトと間違われ、憂鬱なヒナだった）"
