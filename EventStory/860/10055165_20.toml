[translation]
"10055165-2-コノカ" = "おい、さっさと起きねぇか！"
"10055165-3-コノカ" = "天下の公安局のカニが、こんなとこでへばってんじゃねえ！"
"10055165-4-カンナ" = "無茶を言うな。皆がお前みたいにタフなわけじゃない。"
"10055165-5-カンナ" = "……どうやら我々のカニは限界のようだ。"
"10055165-6-チアキ" = "おお！それはつまり！"
"10055165-7-カンナ" = "ああ。おめでとう、そちらの勝利だ。"
"10055165-8-チアキ" = "わあ！やりましたよ、ブラックドリー！"
"10055165-10-マコト" = "キシシッ！公安局の星も我々がいただくとしよう。"
"10055165-11-カンナ" = "では、こちらを。"
"10055165-12-カンナ" = "……最後に、一つだけ忠告を。"
"10055165-13-マコト" = "ふん、敗者の口から聞くことなどない！"
"10055165-15-イロハ" = "はぁ……素直に聞きましょうよ。"
"10055165-16-カンナ" = "あなた方はこの連勝によって、より注目を集める立場となった。"
"10055165-17-カンナ" = "この先出会う敵は、私たちよりも遥かに手強いものになるだろう。"
"10055165-18-マコト" = "何かと思えばそんなことか。……まったく、器の小さい奴だ！"
"10055165-19-マコト" = "むしろ、都合がいいではないか！"
"10055165-20-マコト" = "この機会を利用して、我々ゲヘナが……。#nいや、万魔殿がどれだけ優秀なのか……キヴォトス中に知らしめてやるのだ！"
