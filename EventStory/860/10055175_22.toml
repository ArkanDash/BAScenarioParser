[translation]
"10055175-3-イブキ" = "わあ！サツキ先輩！すごい！"
"10055175-4-サツキ" = "わ、私が勝ったの？"
"10055175-5-チセ" = "まーけーたー"
"10055175-6-カホ" = "くうっ……チセちゃんが負けるだなんて……！"
"10055175-7-ニヤ" = "まあまあ、どんな天才だって負けることはあるから～"
"10055175-11-チセ" = "夏海に"
"10055175-12-チセ" = "ヤドカリ会いて"
"10055175-13-チセ" = "打つ手なし"
"10055175-14-カホ" = "チセちゃんの即興俳句！？"
"10055175-15-カホ" = "敗北からインスピレーションを得るなんて……！#nまさに、災い転じて福と成す……！"
"10055175-16-ニヤ" = "にゃはは。一喜一憂～右往左往～カホは本当に陰陽部らしいねぇ。"
"10055175-17-マコト" = "……これはどういうことだ！？"
"10055175-18-ニヤ" = "おっと、長居しすぎたようで。"
"10055175-22-マコト" = "百鬼夜行の陰陽部部長が、何故ここにいる！"
"10055175-24-マコト" = "……そうか。私の居ない間にそんなことが。"
"10055175-25-マコト" = "よくやった、サツキ！"
"10055175-26-マコト" = "要は、万魔殿がまた一歩優勝に近づいたということだな！"
"10055175-27-イロハ" = "いや、もっと聞くことありません？"
"10055175-28-マコト" = "勝報に勝る事実などない！さっさと陰陽部の星を出すがいい！"
"10055175-29-ニヤ" = "はい、どうぞ～"
"10055175-33-マコト" = "キシシッ！これで百鬼夜行も制覇だ！"
"10055175-34-ニヤ" = "解釈は好きにしていただいてかまいませんが～#n私たちは、百鬼夜行の代表ではありませんよ？"
"10055175-35-マコト" = "陰陽部が生徒会でないことなど百も承知だ。#n百鬼夜行は元々連合学院なのだからな。"
"10055175-36-ニヤ" = "外部の方には説明が難しいというか……んん？"
"10055175-37-マコト" = "しかし実質的に百鬼夜行を取りまとめている陰陽部を打破すれば、#n他の部活も自然とゲヘナの覇権を認めることだろう。"
"10055175-38-マコト" = "反発しうるのは、独立した武力を有する百花繚乱くらいだろうか……。#n私の所見に間違いはあるか？"
"10055175-39-ニヤ" = "……おやまあ、随分とお詳しいですね～"
"10055175-40-マコト" = "キシシッ！もっと讃えるがいい！"
"10055175-41-ニヤ" = "にゃははっ！さっすがマコト議長！"
"10055175-42-ニヤ" = "……意外に油断ならないお人で。これは直接会えてむしろラッキーだったかも。"
"10055175-46-サツキ" = "え、え～っと……何かしら？"
"10055175-47-チセ" = "これ。"
"10055175-51-サツキ" = "……これは何？……ただの砂に見えるけど。"
"10055175-52-チセ" = "綺麗でしょー？"
"10055175-53-サツキ" = "まあ、貝殻が混ざってキラキラしてるし……言われてみれば綺麗だけど……。"
"10055175-54-チセ" = "あげる。"
"10055175-58-サツキ" = "ちょっと！いきなり手に出したら……！"
"10055175-59-チアキ" = "おおっ！試合を終えて芽生える友情！これこそ青春の1ページですね！"
"10055175-60-チアキ" = "元宮チアキ、感動しました！"
"10055175-61-イロハ" = "今のどこに感動する要素が……？"
"10055175-62-サツキ" = "す、ストップ！こぼれちゃってる！こぼれちゃってるわよ！！"
