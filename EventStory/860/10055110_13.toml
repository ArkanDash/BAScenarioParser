[translation]
"10055110-1" = "後日談その2;海賊、忍者、万魔殿"
"10055110-4-イブキ" = "よっほっほ！"
"10055110-5-イブキ" = "イブキはおそろしー海賊だー！"
"10055110-6-イブキ" = "イブキがキャプテンで、くまさんが副キャプテン……。"
"10055110-7-イブキ" = "そしてニンペロさんは忍者！"
"10055110-8" = "[s1] \"忍者……？\"\n[s2] \"先生は？\""
"10055110-11-イブキ" = "あ、先生！"
"10055110-12-イロハ" = "海賊のこと、結構気に入ったようですねイブキ。"
"10055110-13-イブキ" = "うん！あのね、海賊はすごくカッコイイの！"
"10055110-14-イロハ" = "カッコイイのかは分からないですけど……イブキが好きならよかったです。"
"10055110-19-マコト" = "忍者に続き今度は海賊か。"
"10055110-20-マコト" = "もちろん、一番はマコト様だろうがな！キキキキッ！"
"10055110-21-イブキ" = "忍者……海賊……マコト先輩……？"
"10055110-25-マコト" = "全部好きってことだ！！！"
"10055110-26-マコト" = "「好き」に優劣などない！！！"
"10055110-27-イロハ" = "あ、今不安になって無理やりまとめましたね。"
"10055110-28-イブキ" = "あっ。"
"10055110-29-イブキ" = "いいこと思いついた！忍者海賊万魔殿はどう？"
"10055110-30-マコト" = "よい！！！"
"10055110-31-イロハ" = "分かってないのに適当な返事しないでください。"
"10055110-32-マコト" = "イブキの提案がよくないわけがないだろう！！"
"10055110-33-イロハ" = "いやまあ、そうですけど……。"
"10055110-34-イロハ" = "忍者海賊万魔殿って……怪しすぎませんか？"
"10055110-36" = "[ns3] \"忍者に、海賊……？\"\n[ns4] \"イブキは天才だった？\""
"10055110-39-イロハ" = "……？"
"10055110-40-イロハ" = "私が世間についていけてないのでしょうか？"
"10055110-41-チアキ" = "あははっ！イロハちゃんは空気読まない派だもんね。"
"10055110-42-イロハ" = "その反対だと思ってますけど……？"
"10055110-43-チアキ" = "ん～そうかなあ？"
"10055110-44-イロハ" = "う……チアキ？"
"10055110-45-チアキ" = "あはは！ごめんごめん、でもイロハちゃんが不安そうな姿、珍しいからつい。"
"10055110-50-イロハ" = "あの……チアキ。"
"10055110-51-チアキ" = "え？"
"10055110-52-イロハ" = "すみませんでした。"
"10055110-53-イロハ" = "その、不安にさせましたよね。船でのこと。"
"10055110-57-チアキ" = "……！"
"10055110-62-チアキ" = "今の顔、今の顔もう一回だけ！"
"10055110-63-イロハ" = "ああっ、もう！今のなしです！"
"10055110-64-チアキ" = "もう一回だけ～～！お願い！撮らせて～～！！"
"10055110-69-イロハ" = "二度とするかっ！！"
