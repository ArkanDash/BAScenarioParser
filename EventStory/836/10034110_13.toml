[translation]
"10034110-1" = "7日前：やるならきちんと"
"10034110-4-ヨシミ" = "ほら！あと1週間しかないし張り切っていくわよ！"
"10034110-5-ヨシミ" = "もちろん入選するつもりでね！"
"10034110-6-ナツ" = "決戦の日まで、残り時間わずか。この状況……"
"10034110-8-ナツ" = "……実にロック。"
"10034110-9-カズサ" = "それ、いつまで言ってるわけ？"
"10034110-10-ナツ" = "……ライブが終わって、この服を脱ぐまでかな。"
"10034110-11-カズサ" = "ゲームの期間限定ボイスじゃないんだから。"
"10034110-12-カズサ" = "っていうか、練習やらなくて良いの？"
"10034110-13-アイリ" = "が、頑張ろう！私たちなら、多分……"
"10034110-14-アイリ" = "……ううん、絶対に上手く行くから！"
"10034110-15-カズサ" = "……アイリ？"
"10034110-16-アイリ" = "あ、えっと……その……。"
"10034110-17-アイリ" = "……みんなとなら、できるかなって。"
"10034110-18-アイリ" = "……えへへ。"
"10034110-22-カズサ" = "そうだね……せっかくやるんだし、頑張ろう。"
"10034110-23-ヨシミ" = "……なんか急に態度が違くない？"
"10034110-24-カズサ" = "べ、別に……。"
"10034110-25-カズサ" = "……ほら、始めるよ！！"
"10034110-26-ヨシミ" = "っていうか、なんであんたが仕切ってるのよ。"
