[translation]
"10034090-1" = "後日談その1;椎名ツムギ"
"10034090-5" = "[ns1] \"着いたね。\"\n[ns2] \"ここで合ってるかな。\""
"10034090-8-カズサ" = "うん、教えてくれた住所で間違いなさそう。"
"10034090-10-ヨシミ" = "学園じゃないのね……。"
"10034090-11-カズサ" = "当然ながら、私たちみたいに屋上でもない、と。"
"10034090-12-アイリ" = "思っていたよりも、本格的な雰囲気……。"
"10034090-18-ヨシミ" = "ていうか、このまま入って良いの？#nチケットとかは？#nせめて挨拶するとか……。"
"10034090-19-カズサ" = "まあ、確かに挨拶くらい行きたいところだけど。"
"10034090-20-カズサ" = "本番前は忙しくなるって、本人も言ってたし。"
"10034090-21-ヨシミ" = "じゃあ、演奏が終わったら連絡入れておけば良さそうね。"
"10034090-27-ナツ" = "部を代表して、アイリに連絡してもらおう。"
"10034090-28-アイリ" = "だ、だから、部長はやらないって……。"
"10034090-29-ナツ" = "ノンノン、部長と代表は別だよ。#n……はっ、もしかして能ある鷹は爪を隠すと？"
"10034090-30-ナツ" = "それもまたロック……。"
"10034090-31-アイリ" = "うぅ、違うんだってばぁ……。"
"10034090-33-ヨシミ" = "みんな、そろそろ始まるわよ。#n先生もツムギって人のこと、知ってるのよね？"
"10034090-34" = "[s] \"うん、少しだけナツに近い雰囲気かも。\""
"10034090-35-ナツ" = "ほぉ……？"
"10034090-36-ヨシミ" = "えぇ、なんか不安になってきたんだけど……。"
"10034090-37-カズサ" = "それは、またどういう……。"
"10034090-38-アイリ" = "と、とりあえず入ろう……！"
"10034090-52-ツムギ" = "キェェェェェ！人間の死が社会の福祉だぁぁぁぁぁぁ！！！"
"10034090-53-ツムギ" = "ウォェェェェェェェェェェェェッ！！！！"
"10034090-57-ツムギ" = "死ね！死ね！全部死んじまええぇぇぇ！！！"
"10034090-58-観客たち" = "わあああああぁぁぁぁぁぁ！！！"
"10034090-63-カズサ" = "…………。"
"10034090-64-アイリ" = "…………。"
"10034090-65-ヨシミ" = "…………。"
"10034090-66-ナツ" = "…………。"
"10034090-70-ナツ" = "「ナツみたいな印象」……だっけ？"
"10034090-71" = "[s3] \"あ、いや……えっと、その……。\"\n[s4] \"私が見た時とは別人のような……。\""
"10034090-77-ナツ" = "少し、自分の行ないを振り返ろっかな……。"
