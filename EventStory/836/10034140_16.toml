[translation]
"10034140-1" = "5日前：ポジションチェンジ"
"10034140-3-ナツ" = "……これくらいにしとくー？"
"10034140-4-ヨシミ" = "ふぅ……上達してるような、してないような……。"
"10034140-5-ナツ" = "成長の最中、それを感じるのは難しい……って言われてるね。"
"10034140-6-ナツ" = "でも心配する必要は無いよ、練習計画は完璧だし。"
"10034140-8-ナツ" = "そのまま行けば、きっとたどり着けるさ……あの空の向こうまで。"
"10034140-9-ヨシミ" = "褒められてるはずなのに、何かムカつくわね。"
"10034140-10-ヨシミ" = "っていうか、あんたはどの立場から言ってるのよ。"
"10034140-11-ナツ" = "なにおう。"
"10034140-12-ナツ" = "私だって、日々上達してる！"
"10034140-13-ヨシミ" = "はいはい、まあ確かにそうね。"
"10034140-15-カズサ" = "……いつも通りだね。"
"10034140-16-カズサ" = "そういえばアイリ、そろそろ交代する？"
"10034140-17-カズサ" = "ずっと私の番だったし。"
"10034140-18-カズサ" = "はい、どうぞ。"
"10034140-19-アイリ" = "ありがと、カズサちゃん。"
"10034140-20-アイリ" = "じゃあ、演奏見ててね。何か気になったら教えて！"
"10034140-21-カズサ" = "うん、了解。"
