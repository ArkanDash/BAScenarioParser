[translation]
"11234060-1" = "チームワーク;最高のプログラム（２）"
"11234060-6-ナツ" = "もう一回……！"
"11234060-12-ナツ" = "もう、一回……！！"
"11234060-13-ヨシミ" = "……っていうか私たち、何やってるの？"
"11234060-14-カズサ" = "いや、あんたも最初はノリノリだったじゃん。"
"11234060-15-ヨシミ" = "いや、まあ、そうなんだけど……あれはその場の勢いっていうか……。"
"11234060-23-ナツ" = "もう一回……！！"
"11234060-24-カズサ" = "いやいや、もう充分でしょ。"
"11234060-25-アイリ" = "今度こそ、できそうな気がする……！"
"11234060-26-カズサ" = "アイリまで！？"
"11234060-27-ヨシミ" = "ああもう！あんたも集中しなさい！"
"11234060-28-カズサ" = "わ、分かったって……！"
"11234060-29-ナツ" = "ラストぉ……！！"
"11234060-32-ヨシミ" = "……？"
"11234060-33-アイリ" = "……あれ？"
"11234060-34-ナツ" = "…………。"
"11234060-35-ナツ" = "で、できた……。"
"11234060-37-ナツ" = "……できた！！"
"11234060-38-ヨシミ" = "すごい、本当にいけたわ！"
"11234060-39-アイリ" = "やったね！ナツちゃん！ヨシミちゃん！カズサちゃん！"
"11234060-40-カズサ" = "う、うん。そうだね……。"
"11234060-41-カズサ" = "えっとさ……。"
"11234060-43-カズサ" = "結局、なんでこんなことしてるんだっけ……。"
