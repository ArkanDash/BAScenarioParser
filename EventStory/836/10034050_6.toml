[translation]
"10034050-1" = "第5話;誰が為に"
"10034050-4" = "[ns1] \"連絡が取れない……？\"\n[ns2] \"学校も休んでるの？\""
"10034050-7-カズサ" = "うん……今日で二日目。"
"10034050-9-ヨシミ" = "一日くらいなら、全然分かるけどね。"
"10034050-10-ヨシミ" = "連絡すら取れないなんて、おかしいでしょ？"
"10034050-11-カズサ" = "……その反応、先生も知らなかったんだ？"
"10034050-12-ヨシミ" = "だ、だとしたら、正義実現委員会に連絡した方が良いんじゃない？"
"10034050-13-カズサ" = "先生、何か心当たりとかは？"
"10034050-14" = "[s3] \"心当たり……。\"\n[s4] \"どこだろう、アイリの行きそうな場所……。\""
"10034050-17-ヨシミ" = "参ったわね、普通に思いつく場所は探したんだけど。"
"10034050-18-ヨシミ" = "喧嘩したわけじゃないし、練習も順調だったし……。"
"10034050-19-ヨシミ" = "急に連絡が取れなくなるなんて、まだ信じられないくらい。"
"10034050-21-ナツ" = "音信不通になったのが私だったら、みんないつも通りだっただろうけど……これは困ったね。"
"10034050-22-ヨシミ" = "まあ、ナツだったらそりゃ……。"
"10034050-26-ヨシミ" = "……って、冗談言ってる場合？"
"10034050-27-ヨシミ" = "そもそもあんた、自覚あったのね……。"
"10034050-28-カズサ" = "……少し、様子がおかしかった気がしない？"
"10034050-29-ヨシミ" = "……？"
"10034050-30-ヨシミ" = "……おかしいって、どの辺が？"
"10034050-31-カズサ" = "何て言うか、上手く言葉にできないんだけど……。"
"10034050-32-ヨシミ" = "なにそれ……って言うか、気になったなら#nどうしてその時に言わなかったのよ？"
"10034050-33-カズサ" = "……ごめん。"
"10034050-34-カズサ" = "本当に微妙な、ほんの感覚程度の話で……。"
"10034050-35-カズサ" = "どこか少しだけ、笑顔が曇ってて……。"
"10034050-36-カズサ" = "何て言うか、その……。"
"10034050-37-ナツ" = "……どこか、ちょっと行き詰まってるような？"
"10034050-38" = "[s5] \"行き詰まってる……？\"\n[s6] \"……それは、練習が？\""
"10034050-41-ナツ" = "肩に力が入ってた感じ。#n何だろ、怖がってるって言うか……。"
"10034050-42-ナツ" = "表面的には、いつもみたいに笑ってくれてたけど。"
"10034050-43-カズサ" = "ナツもそうだったんだ……。"
"10034050-44-ヨシミ" = "……え？#n何も気づいてなかったの、私だけ？"
"10034050-45-ナツ" = "まあ無理もないよ。#n本人も、すごく言いたくなさそうだったし。"
"10034050-46-ナツ" = "……でも、一言も残さず姿をくらますとは思わなかった。"
"10034050-47-カズサ" = "何かがあったのは確実、か……。"
"10034050-48-カズサ" = "……？"
"10034050-49-カズサ" = "先生、何か知ってるの？"
"10034050-53-カズサ" = "……先生？"
"10034050-54-カズサ" = "アイリのキーボードがどうかした？"
"10034050-59-カズサ" = "……それは？"
"10034050-60-ヨシミ" = "手紙……？"
"10034050-61-ナツ" = "……中身は？"
"10034050-62-ヨシミ" = "手紙なんてどうして……。"
"10034050-63" = "[s7] \"やっぱりこういう子だよね。\"\n[s8] \"アイリなら何かしら残してると思ったよ。\""
"10034050-66-ヨシミ" = "これ、見て良いのよね……？"
"10034050-72-ヨシミ" = "……「みんなへ」。"
"10034050-73-ヨシミ" = "……「ごめんなさい」。"
"10034050-74-カズサ" = "……？"
"10034050-75-ナツ" = "……？？"
"10034050-76-ナツ" = "……ごめんなさい？"
"10034050-82-ヨシミ" = "「足を引っ張って、ごめんなさい」。"
"10034050-83-ヨシミ" = "「私の代わりに、もっと楽器が上手な人を探してくるね」。"
"10034050-85-カズサ" = "……は？"
"10034050-90-ヨシミ" = "「私がいたら、みんなまでダメになっちゃうし……」。"
"10034050-91-ヨシミ" = "「その方が、上手く行くと思うから」。"
"10034050-92-ヨシミ" = "……「ごめんね」。"
"10034050-93-ヨシミ" = "…………？？？"
"10034050-96-ヨシミ" = "な、何これ……。"
"10034050-98-ヨシミ" = "どういうこと……？"
"10034050-106-ヨシミ" = "……ねぇ。"
"10034050-107-ヨシミ" = "全部先生に任せちゃって良かったの？"
"10034050-109-カズサ" = "大丈夫でしょ。"
"10034050-110-カズサ" = "先生が…、あの人が「任せて」って言ったんだから。"
"10034050-111-カズサ" = "……アイリが抱えてる問題にも心当たりがありそうだったし……#n多分これが正解。"
"10034050-112-カズサ" = "……みんなで動いて、問題が大きくなっちゃいました、みたいなことはパス。"
"10034050-118-ナツ" = "……その視線の意味は？"
"10034050-119-カズサ" = "……いや、ちょっと思い出してただけ。"
"10034050-120-ヨシミ" = "言ってることは何となく分かるけど……。"
"10034050-121-ヨシミ" = "ここで待ってるだけってのも、違う気がするのよね。"
"10034050-122-カズサ" = "私たちが、今やれること……。"
"10034050-123-カズサ" = "……ダメだ、[ruby=ろく]碌[/ruby]な考えが思いつかない。#nアイリが帰ってきた時のために、スイーツでも用意しておくくらいしか……。"
"10034050-124-ナツ" = "キヴォトス中のチョコミントでも集めておこっか。"
"10034050-125-ヨシミ" = "ああ、もう！そういう話じゃないでしょ！"
"10034050-126-ヨシミ" = "……そもそも、バンドの話を言い出したところから変じゃなかった？"
"10034050-127-ヨシミ" = "ここ数日の問題じゃなくて、あの時から……。"
"10034050-128-ヨシミ" = "それにアイリがここまで自分の意見を押し通したのって、初めてじゃない？"
"10034050-133-カズサ" = "……確かに。"
"10034050-134-カズサ" = "それはそうかも。"
"10034050-135-カズサ" = "そこまでバンドが好きだったなんて聞いたことないし……。"
"10034050-136-カズサ" = "あの時の目は、まだ比較的いつも通りだった気がするけど。"
"10034050-137-カズサ" = "その後、徐々にプレッシャーっていうか……強迫観念みたいな？#n少しずつ、追い詰められた感じで……。"
"10034050-138-カズサ" = "どうして、バンドをやろうと思ったのか……#nきっと、何か理由があるはず。"
"10034050-139-ナツ" = "そうだね、何かしらのきっかけが……。"
"10034050-140-ナツ" = "それを考えるのは、無駄にならないかも。"
"10034050-144-ナツ" = "……？"
"10034050-145-ナツ" = "……あれ？"
"10034050-146-ナツ" = "だとしたら、もう答えは出てるんじゃ？"
"10034050-147-カズサ" = "……どういう意味？"
"10034050-148-カズサ" = "ナツは何か、心当たりあるの？"
"10034050-149-ナツ" = "言い出した理由なら既に明確。"
"10034050-153-ナツ" = "……学園祭のオープニングで入選するため。"
"10034050-154-ナツ" = "それを達成できないことを恐れてた……っていうのは？"
"10034050-156-ヨシミ" = "だから、どうして怖がる必要があるのよ？"
"10034050-157-ヨシミ" = "入選できなかったところで、問題があるわけじゃないんだし。"
"10034050-158-カズサ" = "言い出した後に、ステージに立つのが恥ずかしくなった……ってわけでもなさそうだよね。"
"10034050-159-カズサ" = "仮に失敗したところで、セムラが食べられないくらいで……。"
"10034050-163-カズサ" = "……？"
"10034050-164-ナツ" = "……？"
"10034050-165-ヨシミ" = "……？"
"10034050-169-ヨシミ" = "……！！"
"10034050-170-ヨシミ" = "……あ。"
"10034050-171-ヨシミ" = "ああああっ！ちょっと待って！"
"10034050-172-カズサ" = "……何、どうしたの？"
"10034050-173-ヨシミ" = "全部分かった気がする……！"
"10034050-174-ヨシミ" = "そもそも、アイリにしては勧誘が強引じゃなかった？"
"10034050-175-ヨシミ" = "私たちの反応が微妙だった時、どうしたか覚えてない？"
"10034050-176-ナツ" = "ポスターを見せて、私たちを説得した……。"
"10034050-177-ナツ" = "入選したら、みんなでセムラを食べられるって。"
"10034050-178-ナツ" = "……まるで「偶然」を装ったように。"
"10034050-179-ヨシミ" = "そうそう！#nたまたまポスターがあったってアイリは言ってたけど。"
"10034050-183-ヨシミ" = "最初から、セムラを食べるためだったとしたら……！"
"10034050-188-カズサ" = "……いやいや、いくら何でも飛躍しすぎじゃない？"
"10034050-189-ナツ" = "そう？#nむしろ、スイーツ好きのアイリらしいんじゃ？"
"10034050-190-カズサ" = "でもそれだったら、最初から話してくれたと思うけど……。"
"10034050-191-ナツ" = "時に、乙女には語れない理由がある。"
"10034050-193-ヨシミ" = "ほら、ナツもこう言ってるじゃない！"
"10034050-194-ヨシミ" = "どう考えてもこれよ！"
"10034050-195-ヨシミ" = "だからアイリはあんなに悩んでたんだわ！"
"10034050-196-ヨシミ" = "つまり、アイリはセムラがどうしても食べたかった！"
"10034050-197-ヨシミ" = "それで思い詰めちゃったのよ！"
"10034050-203-カズサ" = "……本気で言ってんの？#nセムラを食べてみたいのは私たちも一緒だし、普通相談してくれるでしょ？"
"10034050-204-ヨシミ" = "アイリの性格を考えてみなさいよ。#nいくらセムラを食べるためとはいえ、そのために私たちを巻き込むのは申し訳なかったに違いないわ。"
"10034050-205-カズサ" = "……それは確かにまあ、ナツじゃないんだし。"
"10034050-207-ナツ" = "私を何だと思って……？"
"10034050-208-ナツ" = "状況を整理すると、アイリはバンドをやりたがってたけど……。"
"10034050-209-ナツ" = "実際はセムラが食べたかった、ってことかぁ。"
"10034050-210-ヨシミ" = "どう、カズサも納得した？#nこれでようやく辻褄が合ったわね！"
"10034050-211-カズサ" = "まぁ、ヨシミの言うことにも一理あるけど……。"
"10034050-212-カズサ" = "……アイリなら、相談してくれると思うんだけどな。"
"10034050-213-ヨシミ" = "……まあ、言ってくれなくてショックなのも分かるけど。"
"10034050-214-ヨシミ" = "それだけセムラを食べてみたかったのよ。#nだって、あのセムラよ？"
"10034050-215-ナツ" = "大義名分が成立したわけだね。#n残るは演奏自体を完遂させるのみ、と。"
"10034050-216-ナツ" = "……でも。"
"10034050-217-ナツ" = "自分の実力が足りないせいで、#nセムラを食べることができなくなるかもしれないと思ったら……。"
"10034050-218-ヨシミ" = "まぁ、自分を責めるわよね！特にアイリは！"
"10034050-219-ヨシミ" = "あんたも想像してみなさいよ。"
"10034050-220-ヨシミ" = "自分のせいで、みんなが伝説のスイーツを食べられなくなった状況を！#nしかも、言い出したのが自分だとしたら？"
"10034050-221-カズサ" = "……それは、まぁ。"
"10034050-222-ナツ" = "……Q.E.D.#n証明完了、だね。"
"10034050-226-ヨシミ" = "……はぁ。"
"10034050-227-ヨシミ" = "アイリってば……。"
"10034050-228-ヨシミ" = "もうっ、最初から話してくれたら良かったのに！"
"10034050-229-カズサ" = "それができなかったんだって、あんたが言ったんでしょ。"
"10034050-230-ヨシミ" = "たしかにそうだけどっ……！"
"10034050-231-ナツ" = "結局、目的はセムラだった……。#nだとしたら、それを手に入れたら解決するんじゃ？"
"10034050-232-ナツ" = "アイリのために、セムラを手に入れる……にひ、実にロック。"
"10034050-233-カズサ" = "そう簡単に手に入らないからアイリも悩んでたんでしょ。"
"10034050-234-カズサ" = "けど、いくら演奏の上手い人がアイリの代わりに来ても、それは違うと思わない？"
"10034050-235-ヨシミ" = "当然じゃない。"
"10034050-236-ヨシミ" = "学園祭本番までの残り一週間、アイリを放ってはおけないし……。"
"10034050-237-ヨシミ" = "せっかくの学園祭、アイリ抜きじゃ楽しめないわ！"
"10034050-238-ヨシミ" = "こうなったら、今すぐセムラを手に入れてアイリに食べさせるわよ！"
"10034050-239-カズサ" = "それは良いけど、どうやって？"
"10034050-240-カズサ" = "学園祭の運営委員会だから用意できたわけで、#n私たちじゃ手に入れようが無いじゃん。"
"10034050-241-ヨシミ" = "そ、それは……。"
"10034050-248-ナツ" = "……？"
"10034050-249-ナツ" = "何を悩んでるの？？"
"10034050-250-ヨシミ" = "……は？"
"10034050-251-カズサ" = "いや、だから手に入れる方法が無いって話で……。"
"10034050-252-ナツ" = "……？"
"10034050-253-ナツ" = "さっき、自分で言ってたのに。"
"10034050-254-ナツ" = "学園祭の運営委員会が用意してる……って。"
"10034050-255-カズサ" = "……？"
"10034050-256-カズサ" = "何を言うかと思ったら……。"
"10034050-257-カズサ" = "「セムラをください」って言って、貰えるわけないでしょ。"
"10034050-258-ヨシミ" = "いや、待って……。"
"10034050-262-ヨシミ" = "……まさかだけど。"
"10034050-263-ヨシミ" = "「奪っちゃえば良い」って話？"
"10034050-264-ヨシミ" = "このイベント、ティーパーティーの主催よ！？#n見張りだってたくさんいるはずだし……！"
"10034050-265-ヨシミ" = "もしバレたら、絶対にヤバいでしょ！"
"10034050-266-ヨシミ" = "普通に考えて絶対無理！"
"10034050-267-ヨシミ" = "自分で言うのも何だけど、私たちよ？"
"10034050-268-ヨシミ" = "ちょっとスイーツが好きなごく普通の一般生徒。"
"10034050-269-ナツ" = "何を言ってるのさ。"
"10034050-270-ナツ" = "忘れてしまったのかね？#n我々の傍らには幾千もの修羅場を争い抜けてきた歴戦の兵がいることを。"
"10034050-271-ヨシミ" = "……はぁ？"
"10034050-276-ナツ" = "刮目せよ、かつて暗黒街を牛耳っていた恐怖の魔獣……。"
"10034050-281-ナツ" = "……この生きる伝説を！"
"10034050-286-カズサ" = "……！？#nちょっ、ナツ！あんたね……！！"
"10034050-291-ナツ" = "悪いけど、私は本気だよ。"
"10034050-292-ナツ" = "……そもそも、状況が状況。"
"10034050-293-ナツ" = "アイリがいなくなっちゃった今……#nその気持ちは、みんな同じだと思ってるけど？"
"10034050-294-カズサ" = "そ、それは……！"
"10034050-295-ナツ" = "むしろカズサ、こっちから聞きたいね。自分でも思ってたんじゃない？"
"10034050-296-ナツ" = "「私なら突破できるのに」って――ねぇ、[ruby=キャスパリーグ]杏山カズサ[/ruby]！"
"10034050-297-カズサ" = "いや、だから……。"
"10034050-298-カズサ" = "くっ……！"
"10034050-299-ヨシミ" = "…………。"
"10034050-305-カズサ" = "……はぁ。"
"10034050-306-カズサ" = "……先に言っとくけど。"
"10034050-307-カズサ" = "成功する保証は無いからね。#nそれこそ正義実現委員会が動くんなら、どうなるか分かんないし。"
"10034050-308-カズサ" = "それに、もし成功しても……#nその後のこと、分かってる？"
"10034050-309-ナツ" = "ふふっ、それは勿論。"
"10034050-314-ナツ" = "……放課後スイーツ部は、ここで終わり。"
"10034050-315-ナツ" = "部費も部室も、全部がパー。"
"10034050-316-カズサ" = "ちゃんと分かってるじゃん。#nそれでも……"
"10034050-318-ナツ" = "……それでも？"
"10034050-320-ナツ" = "その先に連なる言葉は？"
"10034050-321-ナツ" = "その言葉は、本当の気持ち？"
"10034050-322-ナツ" = "他でも無い杏山カズサ、その魂は何を叫んでる？"
"10034050-323-ナツ" = "カズサだけじゃない、ヨシミは？"
"10034050-324-ヨシミ" = "……へ？"
"10034050-325-ヨシミ" = "わ、私？"
"10034050-326-ヨシミ" = "うーん……。#nもし正義実現委員会にバレたら、放課後スイーツ部は無くなる、かぁ……。"
"10034050-327-ヨシミ" = "それどころじゃなくて、停学になる可能性もあるけど。"
"10034050-328-ヨシミ" = "……ま、別にそれは構わないか。大事なのはそっちじゃないし。"
"10034050-329-ヨシミ" = "アイリも守れない部活を守るなんて冗談、面白くもなんともない。"
"10034050-330-ヨシミ" = "だって、放課後スイーツ部は……。"
"10034050-335-カズサ" = "ヨシミ……。"
"10034050-336-ナツ" = "にひ、知ってたよ。全員、考えは一緒だってね。"
"10034050-337-ナツ" = "……さ、時間が無い。"
"10034050-338-カズサ" = "ナツ……。"
"10034050-339-ナツ" = "[ruby=きょうやま]杏山カ[/ruby]ズサ……いや、トリニティに眠る魔獣よ。"
"10034050-340-ナツ" = "この日が訪れることを、望むと望まざるとに関わらず……。"
"10034050-346-ナツ" = "……再び、放課後スイーツ団に戻る時なんじゃないかな？"
"10034050-352-ナツ" = "そう……魔獣の狩りを知るがいい……"
"10034050-357-ナツ" = "アイリのため……いや。"
"10034050-358-ナツ" = "……みんなのために。"
"10034050-364-ナツ" = "……キャスパリーグになってくれ。"
