[translation]
"11334030-1" = "コンディション;催眠効果（１）"
"11334030-4-カズサ" = "ただいまー……。"
"11334030-5-カズサ" = "……って何！？どうしてみんな倒れてるの！？"
"11334030-6-ヨシミ" = "む、無理……もう、これ以上は……。"
"11334030-7-ナツ" = "疲労困憊、満身創痍ー……。"
"11334030-8-アイリ" = "う、うぅ……。"
"11334030-9-カズサ" = "二人はともかくアイリまで！？"
"11334030-10-ヨシミ" = "……何よ「ともかく」って。"
"11334030-11-アイリ" = "あ、あはは……。"
"11334030-12-ナツ" = "おぉ、どうか慈悲を……。"
"11334030-13-ナツ" = "恵みをー……。"
"11334030-17-カズサ" = "……はぁ。"
"11334030-18-カズサ" = "まぁ、最近みんな練習頑張ってたしね……。"
"11334030-22-カズサ" = "……お菓子買ってきたし、とりあえず食べる？"
"11334030-23-ナツ" = "……！"
"11334030-24-アイリ" = "カズサちゃん……！"
"11334030-25-ヨシミ" = "偶には良いことするじゃないの、見直したわ！"
"11334030-27-カズサ" = "こういう時だけ調子良いんだから。"
"11334030-28-カズサ" = "……あれ。"
"11334030-29-カズサ" = "もしかして……。"
"11334030-30-アイリ" = "……カズサちゃん？"
"11334030-31-カズサ" = "いや、その、大したことじゃないんだけど……。"
"11334030-32-カズサ" = "…………。"
"11334030-34-カズサ" = "これならみんな、やる気出るかも。"
