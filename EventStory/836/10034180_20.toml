[translation]
"10034180-1" = "2日前：乱入"
"10034180-10-レイサ" = "[ruby=きょうやま]杏山カ[/ruby]ズサこんにちはぁ！！"
"10034180-11-ヨシミ" = "カズサ、またあんたの友達が来たわよ。"
"10034180-12-ナツ" = "「私たち」の友達、だよ。"
"10034180-13-アイリ" = "あはは……おはよう、レイサちゃん。"
"10034180-14-ヨシミ" = "……あれ、本人どこ行ったの？"
"10034180-15-アイリ" = "ほ、ほんとだ……。"
"10034180-16-レイサ" = "えっ……杏山カズサ、いないんですか？"
"10034180-20-レイサ" = "あ……えっと、その……。"
"10034180-21-レイサ" = "し、失礼しました……。"
"10034180-23-アイリ" = "待ってたら、すぐ来ると思うよ？"
"10034180-24-ヨシミ" = "そうよ。どうせ近くのコンビニとかだろうし。"
"10034180-26-レイサ" = "お、お気持ちは嬉しいのですが……。#n私は放課後スイーツ部でもないですし……。"
"10034180-27-ナツ" = "でも放課後スイーツ「団」ではある、でしょ？#nそう、即ち血盟を誓ったもの同士……。"
"10034180-28-ヨシミ" = "ま、ナツのことは置いといて。"
"10034180-29-ヨシミ" = "アイリも言ってる通り、気にする必要ないわよ。#n好きなだけいれば良いじゃない。"
"10034180-31-レイサ" = "……！！"
"10034180-32-アイリ" = "うん！カズサちゃんがいない時でも遊びにきてね！"
"10034180-33-アイリ" = "自警団の仕事で疲れたら、一緒にスイーツ食べよ？"
"10034180-37-レイサ" = "……。"
"10034180-38-レイサ" = "……はいっ！！"
"10034180-43-カズサ" = "ただいまー、アイス買ってき――"
"10034180-47-カズサ" = "……あ、やっぱりあんたもいたんだ。"
"10034180-49-カズサ" = "何となくそうかと思って、余分に買ってきたんだけど……#n正解だったね。"
