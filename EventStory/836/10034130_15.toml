[translation]
"10034130-1" = "5日前：グッパージャス？"
"10034130-3-ヨシミ" = "んー……ちゃんと弾けてるつもりなんだけど。"
"10034130-4-アイリ" = "もしかしたら私、持ち方が変だったり……？"
"10034130-6-カズサ" = "なら二人組を作って、お互いの姿勢をチェックしてみるのはどう？"
"10034130-7-カズサ" = "自分で鏡を見ながら演奏するのも難しいし。"
"10034130-8-ヨシミ" = "偶には良いこと言うじゃない。それじゃ、グッパージャスでいいわね？"
"10034130-14-カズサ" = "……？"
"10034130-15-アイリ" = "グッパー……？"
"10034130-16-ナツ" = "ジャス……？"
"10034130-20-ヨシミ" = "……え。"
"10034130-24-カズサ" = "……ぷっ。"
"10034130-25-カズサ" = "……くっ、くくっ……くふふふふっ……！"
"10034130-27-ナツ" = "……そこまでカズサのツボに入ったとは。"
"10034130-28-アイリ" = "か、カズサちゃん……。"
"10034130-30-ヨシミ" = "ぐっ……！何よ、うちではこうだったの！悪い！？"
"10034130-31-カズサ" = "ふふっ……ふっふふっ……あー、めっちゃ笑った……はぁ、ごめんごめん。"
"10034130-32-カズサ" = "でも普通、「ぐっとっぱーで分かれましょ」じゃない？"
"10034130-33-ヨシミ" = "いや地域差でしょ、普通とか知らないわよ！！"
"10034130-34-アイリ" = "わ、私は可愛いと思うよ！ヨシミちゃんのも！"
"10034130-35-ナツ" = "じゃあ、そろそろ始めよっか……「ヨシミ流」で。"
"10034130-36-ヨシミ" = "あああもうっ！！"
"10034130-38-カズサ" = "それじゃ、いくよ。ぐっとっぱー……じゃなくて何だっけ？"
"10034130-39-ヨシミ" = "もうそれで良いってば！！！"
"10034130-41-一同" = "ぐっとっぱーで分かれましょ！！"
