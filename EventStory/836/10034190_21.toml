[translation]
"10034190-1" = "1日前：出陣の時"
"10034190-3-ナツ" = "いよいよ最後の日だ、諸君。"
"10034190-4-ナツ" = "……長い、長い戦いだった。"
"10034190-5-カズサ" = "…………。"
"10034190-6-ヨシミ" = "…………。"
"10034190-7-アイリ" = "…………。"
"10034190-9-ナツ" = "雨にも負けず、風にも負けず、雪にも、えー……とにかく練習に励んだことにより。"
"10034190-10-ナツ" = "私たちは、ここまで強くなった。"
"10034190-11-ナツ" = "本番がどうなるのか、それは誰にも分からない……。"
"10034190-12-ナツ" = "それでも、私たちのやることは変わらない！"
"10034190-13-ナツ" = "セムラが待っている。"
"10034190-14-ナツ" = "……躊躇う理由は無し。"
"10034190-15-ナツ" = "怯まず走り抜け、この長い戦いに終止符を打とう！"
"10034190-20-ナツ" = "我々は必ずやセムラを手に入れる！"
"10034190-21-ナツ" = "百戦錬磨の放課後スイーツ団、出動！"
