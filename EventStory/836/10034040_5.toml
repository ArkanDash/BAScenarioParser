[translation]
"10034040-1" = "第4話;今までとは違う私"
"10034040-2" = "（数日後）"
"10034040-3" = "（仕事が一段落し、休憩をしていると……）"
"10034040-9-ヨシミ" = "あ、先生？#nちょっと時間ある？"
"10034040-10-ヨシミ" = "大した用じゃないんだけど、伝えておこうと思って。"
"10034040-11-ヨシミ" = "先生が手配してくれたスタジオ、めっちゃ広いしちゃんと練習できてるから……"
"10034040-12-ヨシミ" = "……だからその、ありがと！"
"10034040-13-ヨシミ" = "……えっ？"
"10034040-14-ヨシミ" = "今からこっちに来る！？"
"10034040-15" = "[s1] \"ヨシミの顔が見たくなって。\"\n[s2] \"ヨシミの演奏が聞きたいから。\""
"10034040-18-ヨシミ" = "……！？#nって、ああもう！また急に変なこと言って！"
"10034040-19-ヨシミ" = "良いから、先生には先生の仕事があるでしょ！？"
"10034040-20-ヨシミ" = "……電話切るけど、絶対に来ちゃダメなんだからね！フリじゃないから！"
"10034040-25" = "[ns3] \"分かった、急いで行くね！……あれ、切れてる。\"\n[ns4] すぐに出かける準備をする。"
"10034040-31" = "（近所の練習スタジオに到着した）"
"10034040-32" = "（入口付近で耳を澄ますと、少しだけ楽器の音が聞こえてくる）"
"10034040-33" = "[ns5] \"みんな頑張ってるみたいだね。\"\n[ns6] 階段を降りて地下のスタジオに向かう。"
"10034040-41-ヨシミ" = "速く！もっと速く！！"
"10034040-45-ナツ" = "げ、限界……こんなの、何もロックじゃない……。"
"10034040-46-ヨシミ" = "もっと速く！！！！"
"10034040-47-ナツ" = "うおぉぉー！"
"10034040-52-ヨシミ" = "もっとぉ！！！！"
"10034040-53-ナツ" = "うおぉぉぉー！ろおぉぉぉっく！！"
"10034040-59-ヨシミ" = "そう、その速度よ！キープして！！"
"10034040-60-ナツ" = "ぬうぉぉぉぉ……"
"10034040-66-ヨシミ" = "もっと速くっ！！！！"
"10034040-67-ナツ" = "ろおぉぉぉっく！！"
"10034040-74-アイリ" = "よ、ヨシミちゃん。#nナツちゃんも頑張ってるから……。"
"10034040-75-カズサ" = "でも、仕方ないよ。#nナツだけリズムが遅すぎるんだし。"
"10034040-76-カズサ" = "ドラムをやるんだったら、ちゃんと一定のテンポをキープしてもらわないとね。"
"10034040-77-カズサ" = "これもセムラを食べるため、でしょ。"
"10034040-78-アイリ" = "う、うん……そう、だね。"
"10034040-82-アイリ" = "……そのために、バンドをやりたいって言ったんだった。"
"10034040-83-カズサ" = "……ん？何か言った？"
"10034040-84-アイリ" = "え、あ、ううん！？#n何でもないよ！"
"10034040-88-カズサ" = "……そう？"
"10034040-89-カズサ" = "って、先生！？"
"10034040-94-アイリ" = "もしかして、私たちの練習を見に来てくれたんですか？"
"10034040-95" = "[s7] \"一気にバンドらしくなったね。\"\n[s8] \"衣装も楽器もバッチリだね。\""
"10034040-98-アイリ" = "あ、あはは……ありがとうございます！"
"10034040-99-カズサ" = "あのさ、先生……念のため聞いておきたいんだけど。"
"10034040-100-カズサ" = "……い、いつから居たの？#nもしかして、さっきの歌も聞いてた……？"
"10034040-101-カズサ" = "着いたばっかり……？本当？#nなら別にいいんだけど。"
"10034040-102-カズサ" = "まだ音程ちゃんと取れてないし……。"
"10034040-103-アイリ" = "とっても上手なんですよ、カズサちゃんの歌！"
"10034040-104-カズサ" = "あ、アイリ……。"
"10034040-109-ヨシミ" = "……はぁ、疲れたわ。"
"10034040-110-ヨシミ" = "なに話してるのよ、二人とも。"
"10034040-111-ヨシミ" = "……えっ？"
"10034040-116-ヨシミ" = "って、なんでここに先生が！？"
"10034040-117-ヨシミ" = "まだ練習中だから来ないでって伝えたでしょ！？"
"10034040-118-ヨシミ" = "先生がいると集中できないって言ったのに！！"
"10034040-119" = "[s9] \"私のこと、実は嫌いだったんだ……。\"\n[s10] \"仲良しだと思ってたのは私だけだったの……？\""
"10034040-122-ヨシミ" = "そうやってからかわれると思ったから、来ないでって言ったんだけど！？！？"
"10034040-123-ヨシミ" = "良い？#n今度は私たちが呼ぶまで勝手に来ないでよ！"
"10034040-124-ヨシミ" = "もう手伝いとかも要らないから！！"
"10034040-125-ヨシミ" = "はい、帰った帰った！"
"10034040-126-ヨシミ" = "早く出てって！"
"10034040-127-ヨシミ" = "もう、笑ってないで早く！"
"10034040-135" = "（ヨシミにスタジオから追い出されてしまったが……）"
"10034040-136" = "（……今のところ大丈夫そうで安心した）"
"10034040-138" = "（夕方、今度はこっそりと練習の様子を見に行った）"
"10034040-142" = "[ns11] \"……あれ？\"\n[ns12] スタジオの中に入る。"
"10034040-149" = "[ns13] \"アイリ……？\"\n[ns14] \"一人だけ残ってたの？\""
"10034040-152-アイリ" = "……あっ、先生。"
"10034040-156-アイリ" = "こんな時間にどうしたんですか？"
"10034040-157-アイリ" = "……私ですか？"
"10034040-158-アイリ" = "えっと……。#nみんなに付いていくだけでも精一杯なので、もう少し練習しようと思って。"
"10034040-159" = "[s15] \"頑張ってるね、アイリ。\"\n[s16] \"無理しないようにね。\""
"10034040-162-アイリ" = "……あはは。#nまぁ、全然上達はできてないのですが……。"
"10034040-163-アイリ" = "せっかくの機会ですし、頑張ります！"
"10034040-164-アイリ" = "……え？"
"10034040-165-アイリ" = "楽しいかと、言われますと……。"
"10034040-166-アイリ" = "うーん、どうでしょう……。"
"10034040-167-アイリ" = "まだ、よく分かりません。"
"10034040-168-アイリ" = "楽しいか、どうか……。"
"10034040-169-アイリ" = "今はただ教本通り、繰り返し練習しているだけで……。"
"10034040-170-アイリ" = "それでもみんなのほうが、すぐに上達していって……。"
"10034040-171-アイリ" = "どうすれば私も、あんな風に……。"
"10034040-172-アイリ" = "……。"
"10034040-174" = "\"本当にそのままで良いの？\""
"10034040-179" = "[ns] \"……アイリ？\""
"10034040-180-アイリ" = "……い、今は、楽しんでる場合じゃないですから！"
"10034040-181-アイリ" = "だってほら、私はまだ基礎すらできてませんし！"
"10034040-182-アイリ" = "とにかく、もっと頑張って練習します！"
"10034040-183-アイリ" = "演奏を楽しむ余裕、は……。"
"10034040-184-アイリ" = "……きっと、そのうち出てくると思います。"
"10034040-185-アイリ" = "だから今は、練習あるのみですよね！"
"10034040-186-アイリ" = "…………。"
"10034040-187-アイリ" = "あ、えっと……。"
"10034040-188-アイリ" = "これでは答えになってない、でしょうか……？"
"10034040-189" = "[s17] \"大丈夫だよ。\"\n[s18] \"無理に急いで答えを出す必要はないから。\""
"10034040-192-アイリ" = "……はい。"
"10034040-196-アイリ" = "えっと、実は……。"
"10034040-197-アイリ" = "もしかしたら、先生は気づいているかもしれません。"
"10034040-198-アイリ" = "その、みんなには……。"
"10034040-199-アイリ" = "セムラを食べるためにバンドをやりたいって言いましたが……。"
"10034040-200-アイリ" = "実は、セムラの話は後付けなんです。"
"10034040-201-アイリ" = "……ただ、楽器を演奏できるようになりたかっただけで。"
"10034040-202-アイリ" = "いえ、楽器じゃなくても、何だって良かったんです。"
"10034040-203-アイリ" = "自信を持って、特技だと言える何かが欲しくて……。"
"10034040-204-アイリ" = "みんなは程々にやれば良いと思っているかもしれませんが……私は違うんです。"
"10034040-205-アイリ" = "……優柔不断で、何の特技も無くて、#n自分の意見をはっきり言えない小心者の私。"
"10034040-206-アイリ" = "……そんな自分を、変えたいんです。"
"10034040-207-アイリ" = "正直に言うと、演奏の楽しさはまだ分かりません。#nそれに、言い出した私より、みんなの方が上達も早くて……#nどうにか追いつくだけでも、精一杯。"
"10034040-208" = "[s19] \"……うん。\"\n[s20] \"話してくれてありがとう、アイリ。\""
"10034040-211-アイリ" = "音楽を通じて……いえ、音楽じゃなくてもいいんですが……。#n私は何者かになりたいんです。"
"10034040-212-アイリ" = "なのに、一人で挑戦するのが怖くって。"
"10034040-216-アイリ" = "……私、悪い子なのかもしれません。"
"10034040-217-アイリ" = "自分の都合で、友達を利用するだなんて……。"
"10034040-218-アイリ" = "……？"
"10034040-219-アイリ" = "で、でも、利用してるのは確かで……。"
"10034040-220" = "[s21] \"それは利用とは違うんじゃないかな。\"\n[s22] \"みんな、好きでやってるんだよ。\""
"10034040-223-アイリ" = "そう、でしょうか……。"
"10034040-224-アイリ" = "だとしても、私は変わらないとダメなんです。#n今までの私から、新しい私に……このキーボードはその一歩……。"
"10034040-225-アイリ" = "上手になったら、その先にはきっと、胸を張って歩ける私がいると思うんです。"
"10034040-226-アイリ" = "……その、先生。"
"10034040-227-アイリ" = "みんなには、内緒にしてくださいね。"
"10034040-228-アイリ" = "……見ていてください。#n私、頑張りますから。"
"10034040-229-アイリ" = "必ず上手くなって……"
"10034040-230-アイリ" = "……今までとは違う私になってみせます！"
"10034040-231-アイリ" = "……。"
"10034040-232-アイリ" = "先生？"
"10034040-233-アイリ" = "……どうかしましたか？"
"10034040-237" = "[ns23] \"……ううん、何でもないよ。\"\n[ns24] \"……まずは一旦、無茶しすぎないようにね。\""
"10034040-240-アイリ" = "ありがとうございます、先生。"
"10034040-241-アイリ" = "あ、体調管理なら任せてください！これでも丈夫な方なので！"
"10034040-242-アイリ" = "……先生！"
"10034040-243-アイリ" = "私、頑張りますね！"
"10034040-245" = "（……数日後）"
"10034040-251-ヨシミ" = "先生……今、大丈夫？"
"10034040-252" = "[s25] \"もしかして、練習を見に行ってもいいの？\"\n[s26] \"あれ、練習中だから来ないでって言ってなかった？\""
"10034040-255-ヨシミ" = "今はそういう冗談を言ってる場合じゃないの！"
"10034040-256-ヨシミ" = "その……。"
"10034040-257-ヨシミ" = "何か聞いてない？"
"10034040-258-ヨシミ" = "……アイリから。"
"10034040-263" = "[ns27] \"……アイリ？\"\n[ns28] \"……何かあったの？\""
"10034040-266-ヨシミ" = "えっと、それが……"
"10034040-267-ヨシミ" = "……その、アイリがね。"
"10034040-269-ヨシミ" = "……2日前から、連絡が取れなくて。"
