[translation]
"10056005-1" = "プロローグ;少女の磯笛"
"10056005-4" = "（オデュッセイア海洋高等学校の艦隊がD.U.に帰港して間もない頃――）"
"10056005-5" = "（仕事で訪れた時のことだった）"
"10056005-10" = "[ns] \"何の音だろう……？\""
"10056005-11" = "（海の方から、鳥のさえずりのような音が聞こえてきた）"
"10056005-12" = "（いつだったかテレビで見た、イルカの鳴き声にも似ていて――）"
"10056005-14" = "（つい手すりから身を乗り出して、辺りを見回すと）"
"10056005-20-？？？" = "……。"
"10056005-22" = "（そこにいたのは、海鳥でもイルカでもなく――1人の少女だった）"
"10056005-28" = "（潜っては、また水面に顔を出して息継ぎをする）"
"10056005-29" = "（そのたびに、澄んだ口笛が船上まで運ばれていた）"
"10056005-33" = "[ns] \"あのー！\""
"10056005-35-？？？" = "ん……？"
"10056005-39-？？？" = "……ひいっ。"
"10056005-45" = "（こちらの存在に気づくと、少女は瞬く間に水の中へ潜ってしまった）"
"10056005-46" = "（海面に残された波紋だけが、少女がいたことを証明してくれていた）"
"10056005-50" = "[ns] \"今のは……。\""
"10056005-53" = "オデュッセイア海洋高等学校「アイランド」・士官室"
"10056005-56-ミナト" = "さて……オデュッセイアに滞在されてしばらく経ちますが――"
"10056005-57-ミナト" = "ご不便はありませんか？"
"10056005-58" = "[s1] \"みんなのおかげで楽しく過ごせてるよ。\"\n[s2] \"まだ分からないことばっかだけど……。\""
"10056005-61-ミナト" = "そうでしょうとも。オデュッセイアの規模はキヴォトスでも指折りですから。"
"10056005-62-ミナト" = "ここより大きな学園もいくつかはありますので、1番とまでは言いませんけどね。"
"10056005-63-ミナト" = "それでも、全体を見て回る難しさは群を抜いているかと。#n各々の船を部室として使っている部活が大多数ですし、#n航海の日程がかみ合わなければ、顔を合わせられないこともしばしば。"
"10056005-64-ミナト" = "真にオデュッセイアを理解されたいのなら、遠洋航海をご一緒する他ないでしょう。"
"10056005-65-ミナト" = "……いえ、もしかしたら、この広大な海を隅々まで巡らなければ、#n理解にはたどり着けないかもしれませんよ。ふふっ。"
"10056005-70-アミ" = "あの、艦長。"
"10056005-71-ミナト" = "ところで先生、ランチはお済みですか？#nもしよろしければ本艦自慢の料理をご馳走しますよ。#nなんてったって今日は金曜日！カレーの日なのです！"
"10056005-72-ミナト" = "もう昨日から楽しみで楽しみで……。"
"10056005-73-ミナト" = "なにも大げさではありません。航海中は新鮮な食材は手に入らないですから。#nすると、どうしたって冷凍野菜が中心になります。で、す、が――"
"10056005-74-ミナト" = "シェフによると、今日は新鮮なトマトがたっぷり入っているそうです。"
"10056005-78-アミ" = "艦長……。"
"10056005-79-ミナト" = "航海中は調理にも多くの制限があります。"
"10056005-80-ミナト" = "荒波の時は火を使うのさえ難しく、レトルトで済ませたりもしますから。"
"10056005-81-ミナト" = "まあ、あれはあれでイイ線いってるとは思っています。#nじっくり煮込んでとろみのある野菜パウダーは、独特な風味があるんですよ。"
"10056005-82-ミナト" = "多くの生徒からは人気ないんですけどね。"
"10056005-83-アミ" = "――ミナト先輩！"
"10056005-87-ミナト" = "わわっ！？ビックリした……。"
"10056005-88-ミナト" = "そんな大声を出してどうしたの。"
"10056005-89-ミナト" = "面会中なのは知っているでしょう？常に他者の手本たるアイランドの幹部らしからぬ行動ね。"
"10056005-90-アミ" = "そっくりそのままお返しいたします。"
"10056005-91-アミ" = "無駄話をする暇など一切ないとお伝えしていたはずです。#n鐘崎港に関する業務が山ほどあることをお忘れですか？"
"10056005-92-アミ" = "[USERNAME]先生がいらしたからといって突然面会の予定を入れるなんて……。"
"10056005-93-アミ" = "こうしておしゃべりばかりしていたら、徹夜をしても終わりませんよ？"
"10056005-99-ミナト" = "ぴえーん。"
"10056005-100-アミ" = "「ぴえーん」じゃありません。"
"10056005-101-アミ" = "オデュッセイアの生徒会――アイランドの部長なんですから、幼稚な言葉遣いは慎んでください。"
"10056005-102-ミナト" = "ぴえーん、です。"
"10056005-103-アミ" = "「です」を付けても変わりませんよ。"
"10056005-107-アミ" = "お見苦しいところをお見せしました。"
"10056005-108-アミ" = "先生もお忙しいでしょうに、#n艦長の無駄話にお付き合いくださりありがとうございます。"
"10056005-109" = "[s3] \"なんのなんの。\"\n[s4] \"サボる口実になってたし……。\""
"10056005-111-アミ" = "これが……大人？"
"10056005-112-アミ" = "……こほん。"
"10056005-113-アミ" = "なんにせよ、ご不便がないのは何よりです。"
"10056005-114-アミ" = "オデュッセイアで何かあれば、我々アイランドやトライデントにご連絡ください。#nあちらは風紀を担ってくれていますので。"
"10056005-115" = "[s] \"気にかけてくれてありがとね。\""
"10056005-119" = "[ns] \"……早速だけど、気になる生徒がいるんだ。\""
"10056005-120-ミナト" = "気になる、ですか？"
"10056005-122" = "（ミナトとアミに昨日のことについて話した）"
"10056005-124-ミナト" = "ああ、その口笛なら……。"
"10056005-125-アミ" = "おそらくはダイビング部の生徒ですね。"
"10056005-126" = "[s] \"ダイビング部？\""
"10056005-127-アミ" = "水中活動を担当している部活です。"
"10056005-128-アミ" = "先生がお聞きになったのは「磯笛」かと。#n独特の呼吸法なので、熟練ダイバーでないと難しいと聞きます。"
"10056005-129-アミ" = "それほどのフリーダイビングができる生徒となれば、#nこのオデュッセイアでも数えるほどしかいません。"
"10056005-130-ミナト" = "浅く短時間の潜水なら私たちにもできますが、ダイビング部はレベルが違うんですよ。"
"10056005-131" = "[s] \"すごいスキルだね……。\""
"10056005-135" = "[ns5] \"ダイビング部は普段なにをしてるの？\"\n[ns6] \"重要な仕事を任されてるのかな。\""
"10056005-138-ミナト" = "それが……その……。"
"10056005-139-ミナト" = "たしかに優秀ではあるのですが――"
"10056005-140-ミナト" = "隠し事が多いというか、協調性に欠けるというか……。"
"10056005-141-アミ" = "単刀直入に言えば、要注意部活なのですよ。"
"10056005-142-アミ" = "人見知りが激しいというのは置いておくとして……。"
"10056005-143-アミ" = "お金の流れに怪しい点がいくつもあるんです。"
"10056005-144" = "[s7] \"怪しい点って……。\"\n[s8] \"こっそり他の活動に使ってるとか？\""
"10056005-147-アミ" = "いえ、怪しいのは支出ではなく収入です。"
"10056005-148-アミ" = "ダイビング部が用いる器材は入手困難で高価なものばかり。#nですが、それを賄えるだけの収入源がありません。"
"10056005-149-アミ" = "漁業もしておらず、特別なスポンサーがいるわけでもない。#n……それでも、存続できている。"
"10056005-150-アミ" = "何か後ろ暗い収入を得ているのでは、という疑惑があるんです。"
"10056005-151" = "[s] \"具体的には……？\""
"10056005-152-アミ" = "水中で手に入る物には、ブラックマーケットで高額な取引をされている物も多くあります。"
"10056005-153-アミ" = "もしも彼女たちが[ruby=ちょうすい]「潮水[/ruby]の[ruby=こうりゅう]蛟龍」[/ruby]のような問題ある生徒と結託していたら――"
"10056005-154-ミナト" = "はいはい、暗い話はここまで。"
"10056005-155-ミナト" = "そんな話を突然されて、先生も困っているでしょう？"
"10056005-156-アミ" = "あ……失礼しました。"
"10056005-157" = "[s9] \"えっと、つまり……。\"\n[s10] \"ダイビング部の生徒が心配なんだよね？\""
"10056005-163" = "[ns] \"よければ私も話をしてみるよ。\""
"10056005-164-ミナト" = "……よろしいのですか？"
"10056005-165-ミナト" = "問題が表面化しているわけではないので本格的な調査も難しく……#nこれまで手を付けられずにいたんです。"
"10056005-166-ミナト" = "先生がお力を貸してくださるなら、とても助かりますが……。"
"10056005-167-アミ" = "いけません！先生はお忙しいんですから……！"
"10056005-168-アミ" = "どうか艦長の話はお気になさらないでください。#nこれはオデュッセイアの問題なので――"
"10056005-169" = "[s11] \"それでも、生徒の問題だよね？\"\n[s12] \"生徒の悩みを聞いてあげるのが先生の役目だから。\""
"10056005-175-アミ" = "そこまで仰るなら……お言葉に甘えて……。"
"10056005-176-ミナト" = "ふふっ。シャーレの先生……やはり噂どおりですね。"
"10056005-177-ミナト" = "では話を戻しますと――"
"10056005-178-アミ" = "ダイビング部は第3ターミナル東側の埠頭で器材の整備をしているはずです。"
"10056005-179-アミ" = "今すぐ出発されれば間に合うかと。"
"10056005-183-ミナト" = "ちょ、ちょっと待って。今すぐ？"
"10056005-184-ミナト" = "まだいいじゃないですか。#nほ、ほら。ちょうどここにある「お茶漬け」を召し上がってからでも――"
"10056005-185-アミ" = "それは「早く帰れ」というサインです。"
"10056005-186-アミ" = "おしゃべりはもう十分に楽しんだでしょう？#nそろそろ業務に戻らないと泣きを見ますよ。"
"10056005-187-ミナト" = "うぅ……。"
"10056005-188-アミ" = "では先生、よろしくお願いいたします。"
"10056005-189-アミ" = "……ああ、それと1つアドバイスを。"
"10056005-193-アミ" = "イルカの仲間は好奇心旺盛ですが、同じくらいに警戒心も強いです。#n近づく際にはご注意ください。"
