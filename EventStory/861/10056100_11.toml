[translation]
"10056100-1" = "第10話;ブリーチング"
"10056100-2" = "翌朝――"
"10056100-7-ナナミ" = "アホイ！"
"10056100-8-ナナミ" = "ふふ、聞いて喜べ。良い知らせを持ってきた。"
"10056100-14-ナナミ" = "お主らの言っていた何とかっていうシリンダーを手に入れたぞ！"
"10056100-15-ナナミ" = "これさえあれば「クジラの墓場」に潜れるのだろう？"
"10056100-16-ナナミ" = "さあ！すぐにでもダイビングの準備を――"
"10056100-20-ナナミ" = "ん？もう整えていたか。完璧なタイミングだな。"
"10056100-25-ココロ" = "[ruby=ちょうすい]潮水の[/ruby][ruby=こうりゅう]蛟龍…[/ruby]…いえ、[ruby=ごのかみ]護守[/ruby]ナナミ。"
"10056100-26-ココロ" = "私たちはクジラの安息を邪魔することはできません。"
"10056100-27-ココロ" = "海洋生物と適切な距離を保ち、その生態に関与しない。#nそれがダイバーの原則です。"
"10056100-28-ココロ" = "たとえ潜れなくなったとしても……あなたの指示には従えません。"
"10056100-33-ナナミ" = "はぁ……何か勘違いしておるようだな。"
"10056100-34-ナナミ" = "これは命令だ。"
"10056100-35-ナナミ" = "歯向かえば先生の身は保証しないと言ったはずだが。"
"10056100-36-ナナミ" = "よしんば逃げ出せたとして、どうするつもりだ？"
"10056100-37-ナナミ" = "まさか、泳いで帰るなどとは言いだすまいな？"
"10056100-38-ココロ" = "道がないな[ruby=ブリーチング]ら開拓す[/ruby]るまでです。"
"10056100-39-ココロ" = "ドアブリーチングは陸上だけのスキルではありませんから。"
"10056100-40-ナナミ" = "この広大な海で？#nどこのドアを開けるというのだ。"
"10056100-41-ナナミ" = "――何か企てがあるのだな。"
"10056100-42-ナナミ" = "無駄なあがきを。"
"10056100-43-ナナミ" = "救助を求めようと、トライデントが到着するまで何時間かかることやら。"
"10056100-44-ナナミ" = "ふざけた真似はやめておくのが――"
"10056100-49-ナナミ" = "これは……。"
"10056100-56-ナナミ" = "何事だ！？"
"10056100-57-ナナミ" = "クジラが――！？"
"10056100-58-コトネ" = "昨日、ホイッスルで挨拶しておいて良かった。"
"10056100-59-コトネ" = "吹いただけで集まってくれるとは思わなかったな。"
"10056100-60-サユリ" = "フライング・ホエール。"
"10056100-61-マキナ" = "かーっこいいー！"
"10056100-62-マキナ" = "みんな、しっかりつかまって！揺れるよ！"
"10056100-63-ココロ" = "……よしっ！"
"10056100-64-ココロ" = "先生、今です！"
"10056100-68-ナナミ" = "愚か者どもが……少し揺れた程度で持ち場を離れたら――"
"10056100-72-ナナミ" = "先生を逃してはならぬ！"
"10056100-77" = "（クジラの着水で起きた波に煽られて、大きく揺れた船から海に落ちた）"
"10056100-81" = "（海の中でもがいていると、誰かが寄ってきて水面に引き上げてくれた）"
"10056100-82" = "（……聞き覚えのある音が聞こえた）"
"10056100-85-ココロ" = "先生、大丈夫ですか？"
"10056100-86" = "[s1] \"何とかね。\"\n[s2] \"少し海水を飲んだけど……。\""
"10056100-92-ナナミ" = "やつらが逃げる前に先生を捕まえるのだ！"
"10056100-93-ナナミ" = "今を逃せば次はないと思え！"
"10056100-101" = "[ns] \"いや、無事だと言うには早いかな？\""
"10056100-103-ココロ" = "先生。目を閉じていただけますか？"
"10056100-109" = "[ns] \"あむっ、んぐっ……んんっ……？\""
"10056100-110-ココロ" = "私のオクトパスです。そのままくわえていてください。#nこれでは10分ほどしかもちませんが……。"
"10056100-111-ココロ" = "それだけあれば十分ですから。"
"10056100-117-ココロ" = "護守ナナミ。"
"10056100-118-ココロ" = "私たちは、目標のために道[ruby=ブリーチング]を開拓し[/ruby]ます。"
"10056100-119-ココロ" = "せいぜい、ジタバタしていてください。"
"10056100-120-ナナミ" = "何だ、その言い草は。余を嘲笑っているのか！"
"10056100-121-ココロ" = "降参したくなったら「やめろ」と言ってください。"
"10056100-122-ココロ" = "それまでは、やめませんから。"
"10056100-123-ナナミ" = "ははっ、実に滑稽だ！その程度の脅迫で余が諦めると思ったのか？"
"10056100-124-ナナミ" = "対潜戦闘用意――爆雷、投下はじめ！"
"10056100-125-ナナミ" = "やつらを海の藻屑にしてやれ！"
"10056100-137-ココロ" = "レギュレーターチェック。ファイナルチェック。オールグリーン。"
"10056100-144-ココロ" = "総員、ダイブ。"
