[translation]
"10056030-1" = "第3話;自慢の昆布茶"
"10056030-2" = "ダイビング部・部室"
"10056030-3-ココロ" = "ほんっとうにすみません……！"
"10056030-4-ココロ" = "先ほどはとんだ失礼を……。"
"10056030-5-ココロ" = "そ、それと昨日は、泳いでいるところを覗き見されているのかと思って……。"
"10056030-6-ココロ" = "本当に申し訳ありません！"
"10056030-13-マキナ" = "急に逃げてごめん……アイランドって言うから、つい。"
"10056030-14-サユリ" = "イワシアイス、おいしかった。"
"10056030-15" = "[s] \"誤解されても仕方ない状況だったからね。\""
"10056030-19" = "[ns1] \"それにしても、二人は元気そうだね。\"\n[ns2] \"全力疾走したから、私はもうクタクタで……。\""
"10056030-22-マキナ" = "そんなに走ってないけどな……。"
"10056030-23-マキナ" = "まあダイビング部だからさ。肺活量はあるほうだし。"
"10056030-24-サユリ" = "サユリは10分以上、息を止めたことある。"
"10056030-25" = "[s3] \"10分も！？\"\n[s4] \"すごいね……。\""
"10056030-28-サユリ" = "もっと褒めて良いよ。"
"10056030-29-ココロ" = "サユリは私たちの中で一番フリーダイビングの才能があるんですよ。"
"10056030-35-コトネ" = "先生、これ。お茶飲む？"
"10056030-36-コトネ" = "のどを潤すと少しは落ち着くと思うよ。"
"10056030-37" = "[s] \"ありがとう。もらうよ。\""
"10056030-41" = "[ns] \"これは……昆布茶？\""
"10056030-42-ココロ" = "はい。乾燥昆布に熱い湯を注いだものです。"
"10056030-43-ココロ" = "オデュッセイアでは食材のほとんどを海に依存しているので。#n茶葉の代わりに、昆布を。"
"10056030-44-ココロ" = "初めの頃はこの旨味がきつく感じましたが、今では昆布茶なしではいられません。"
"10056030-45-マキナ" = "オデュッセイアの昆布は品質が良いって有名なんだよ。"
"10056030-46-マキナ" = "前にトリニティも昆布茶を買ってくれたみたいだけど……それ以降はさっぱりらしい。#n好みじゃなかったのかな。"
"10056030-47-サユリ" = "昆布茶、おいしいのに……。"
"10056030-48" = "[s] \"この昆布は自分たちで採ったの？\""
"10056030-49-ココロ" = "と、とんでもないこと言わないでください！"
"10056030-50-ココロ" = "ダイビング部の漁業活動は原則的に禁じられています。"
"10056030-51-ココロ" = "ただでさえ、密漁しているんじゃないかって嫌味を言われているんですから。"
"10056030-52-コトネ" = "漁業とダイビングは別のくくりなんだよ。お互いの領域は侵さない。"
"10056030-53-マキナ" = "そうそう。潜って何か採るのが目的なら「海女部」にしてたよね。"
"10056030-54" = "[s] \"じゃあ普段はどんな活動をしてるの？\""
"10056030-55-コトネ" = "それは――"
"10056030-56-コトネ" = "ダイビング。"
"10056030-57-サユリ" = "フリーダイビング！"
"10056030-58-マキナ" = "いや、フリーダイビングで海底まで行くのはあんただけだよ。"
"10056030-59-ココロ" = "海中でできる、漁業以外の活動を色々と。"
"10056030-60-コトネ" = "落とし物を探したり、海中の撮影とか、海底地図の作成とか……。"
"10056030-61-マキナ" = "海底施設の整備だって、ダイビング部なしじゃできないってこと！"
"10056030-62-サユリ" = "お友達も作れる。サメとか、カメとか。"
"10056030-66-ココロ" = "要は、海底で起きた問題を解決し、その対価を得て活動しているんです。"
"10056030-67-ココロ" = "でも……D.U.に停泊してからは、水中での問題はほとんどないので……#n頼られることも減ってしまって……。"
"10056030-68-ココロ" = "最近はファンダイビング――ただ楽しむだけの水中探検ばかりですね……。"
"10056030-69" = "[s5] \"部活動には色んな目的があるしさ。\"\n[s6] \"暇だからって悪いわけじゃないと思うけど……。\""
"10056030-75" = "[ns] \"ダイビングの器材はどこで手に入れてるの？\""
"10056030-77-ココロ" = "えっと、それは……。"
"10056030-78-ココロ" = "つ、通販で……？"
"10056030-79" = "[s7] \"こういうのって高いよね？\"\n[s8] \"お金のやりくりが大変じゃない？\""
"10056030-82-ココロ" = "うっ、その……。"
"10056030-86-ココロ" = "実は……借金が……少し……。"
"10056030-87" = "[s] \"借金！？\""
"10056030-88-コトネ" = "厳密に言えば少し違うんだけどね。"
"10056030-89-マキナ" = "今いくらくらいだっけ。ドライスーツ4着分ぐらい……？"
"10056030-90-サユリ" = "「アクアシール」のシングルコーンを5000個買えるくらい。"
"10056030-91-ココロ" = "だ、大丈夫ですよ？ご心配には及びません！#n海底に眠る宝を見つけられたら、一気に返せますから……！"
"10056030-92" = "[s9] \"でも……借金か……。\"\n[s10] \"節約する方法はないの？\""
"10056030-95-ココロ" = "こればっかりは……。"
"10056030-96-ココロ" = "ダイビングにはどうしてもお金がかかるので……。"
"10056030-97-ココロ" = "ケチって安全を疎かにするわけにはいきませんし……。"
"10056030-98-ココロ" = "潜らなければ、私たちには何の価値も……。"
"10056030-99-マキナ" = "前はスポンサーがいたんだけど、急に連絡つかなくなっちゃったんだよね。"
"10056030-100-コトネ" = "全てのチャンネルで通信を試したけど音沙汰なし。"
"10056030-101-マキナ" = "このアビススーツを使い始めてからもう1ヶ月か……。いつまでこの状態なんだろ。"
"10056030-102-マキナ" = "このままだと繋ぎ目が錆びてきちゃうよ……。"
"10056030-103-サユリ" = "良い機会。もっと素潜りの訓練をするのはどう？"
"10056030-104-マキナ" = "サユリ基準で考えないで！？"
"10056030-108" = "[ns] \"スポンサーか……。\""
"10056030-110" = "[ns11] \"それなら、こういうのはどう？\"\n[ns12] \"私が新しいスポンサーになるよ。\""
"10056030-114-ココロ" = "先生が……？"
"10056030-115-ココロ" = "ね、狙いはなんですか……。"
"10056030-116-マキナ" = "アイランドが裏で糸引いてたり？"
"10056030-117-コトネ" = "こういう時は大抵、裏がある。"
"10056030-118-サユリ" = "とんでもないお人よしかも～？"
"10056030-119" = "[s] \"もちろん、タダじゃないよ。\""
"10056030-123" = "[ns] \"体で返してもらおうと思って。\""
"10056030-124-ココロ" = "体で返せることと言ったら……。"
"10056030-128-ココロ" = "まさか――！？"
