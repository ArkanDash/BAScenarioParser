[translation]
"10056105-4-海賊A" = "竜王様、1番エリアで爆発を確認……何かがこびりついています！"
"10056105-5-海賊B" = "機関室、圧力低下！バラストライン、損傷！"
"10056105-6-海賊C" = "2番、3番エリアも同時に被弾……被害は甚大です！"
"10056105-7-ナナミ" = "……相手はたった4人ではないか。"
"10056105-8-ナナミ" = "それで10ヶ所以上も攻撃されているだと……？"
"10056105-12-ナナミ" = "やつらはどんな手を使っておるのだ！？"
"10056105-13-海賊B" = "排水ポンプも限界です！このままでは竜宮が……艦隊が丸ごと沈没します！"
"10056105-14-海賊C" = "りゅ、竜王様……！"
"10056105-15-ナナミ" = "たかが数人の……ダイビング部なんぞに……！"
"10056105-19-海賊A" = "[ruby=ルスカ]怪物[/ruby]だあ……[ruby=ルスカ]怪物[/ruby]がいる！"
"10056105-23-ナナミ" = "……やめろ、やめろっ！"
"10056105-26-ココロ" = "……今、「やめろ」とおっしゃいましたか？"
"10056105-27-ナナミ" = "そうだ、「やめろ」と言っているのだ！"
"10056105-28-ナナミ" = "[ruby=りゅうぜんこう]龍涎香[/ruby]になど頼らずとも……余への貢物は溢れるほどにある。"
"10056105-29-ナナミ" = "お主らのお遊びに付き合うのもうんざりだ！余は帰らせてもらう！"
"10056105-30" = "[ns1] \"はあ、良かった……。\"\n[ns2] \"やっと終わった……。\""
"10056105-33-ナナミ" = "シャーレの先生と言ったな。"
"10056105-34-ナナミ" = "余が本来の力を取り戻せておらぬゆえ、今回は特別に引き下がるが……。"
"10056105-35-ナナミ" = "次は屈服させてみせる！"
"10056105-36" = "[s3] \"うん。また会おう。\"\n[s4] \"……それまで騒ぎは起こさないでね。\""
"10056105-39-ナナミ" = "な、なんだ、その言い草は！"
"10056105-43-ココロ" = "あの……ナナミさん。"
"10056105-44-ナナミ" = "竜王様と呼べ！"
"10056105-45-ココロ" = "はっ、はい！竜王様！"
"10056105-46-ココロ" = "わ、[ruby=・]私[/ruby][ruby=・]た[/ruby][ruby=・]ち[/ruby][ruby=・]は[/ruby]水の上で起きたことについて、そこまで気にしていません。"
"10056105-50-ココロ" = "ですが万が一……本当に、万に一つでも。"
"10056105-51-ココロ" = "うち[ruby=スポンサー]の先生に[/ruby]銃口を向けるようなことがあったら――"
"10056105-52-ココロ" = "あなたの身に不幸が降りかからないよう、願うばかりです。"
"10056105-53-ナナミ" = "……ぐっ。"
"10056105-54-ナナミ" = "艦隊、両舷全速！撤退だ！"
"10056105-59-マキナ" = "ひゅー、やるねー？"
"10056105-64-ココロ" = "あ、あれ……？#nおかしなことでも言ったかな……？"
"10056105-65-コトネ" = "ココロは怒ったら、本当に怖いよね。"
"10056105-66-サユリ" = "びっくりして潜りそうになった。"
"10056105-67-ココロ" = "わ、私は警告しただけなのに……。"
"10056105-68" = "[s] \"ココロ、お疲れ様。\""
"10056105-69-ココロ" = "せ、先生もお疲れ様でした！"
"10056105-70-ココロ" = "海賊はいなくなりましたし、あとはオデュッセイアに帰るだけですね。"
"10056105-71" = "[s5] \"それなんだけど……。\"\n[s6] \"私たちの船……どこ？\""
"10056105-74-マキナ" = "あっ、それは……。"
"10056105-75-サユリ" = "ひっくり返っちゃった。さっきクジラがジャンプした時。"
"10056105-76-コトネ" = "クジラがブリーチングした時の衝撃は、40個の手榴弾を同時に爆発させたのと同じぐらいだから……。"
"10056105-77-ココロ" = "ど、どうしよう……？"
"10056105-78-ココロ" = "えっ、あれ？うああ……これ、遭難ってこと？#nま、まず遭難信号を――"
"10056105-79-コトネ" = "ココロ、落ち着いて。"
"10056105-80-コトネ" = "もう無線でアイランドに信号を送っておいた。"
"10056105-81-コトネ" = "この辺りで待ってれば救助船が来るよ。"
"10056105-82-ココロ" = "よ、よかったぁ……。"
"10056105-83-マキナ" = "海上漂流か……こうして救助船を待つのも久しぶりだね。"
"10056105-84-サユリ" = "船が来るまで、[ruby=・]ア[/ruby][ruby=・]レ[/ruby]しながら待つ。"
"10056105-85" = "[s] \"……アレ？\""
"10056105-86-コトネ" = "うん。先生、こっち来て。"
"10056105-92-コトネ" = "海上漂流した時は、体温維持と、お互いが離れないようにぴったりくっつくんだ。"
"10056105-104" = "[ns] \"手を握るとかじゃダメなの？\""
"10056105-105-ココロ" = "だ、ダメです！"
"10056105-106-ココロ" = "漂流した時に一番怖いのは体温が下がることですから。"
"10056105-107-ココロ" = "あ、安全のための措置なので……。"
"10056105-111-ココロ" = "今は部長の指示に従ってください！"
"10056105-114" = "（その後、救助船が来るまで抱き合ったまま海に浮かんでいた）"
"10056105-115" = "（おかげで寒さを感じることはなかったが……）"
"10056105-119" = "（救助船に乗っていたトライデントの生徒に誤解されそうになった）"
