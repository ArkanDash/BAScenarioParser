[translation]
"80000010-1" = "不運な美食家"
"80000010-2" = "百鬼夜行連合学院・和菓子屋さん"
"80000010-5-ジュンコ" = "ここが先生の言ってた和菓子屋さん？最近新しくできたっていう……。"
"80000010-6-ジュンコ" = "わ、確かに知らないお店だ……。"
"80000010-7-ジュンコ" = "こんなところにあったなんて、あ、それに思ったよりも手ごろな値段！こんなお店を見つけるなんて、先生お手柄！紹介してくれてありがと！"
"80000010-8-ジュンコ" = "あ、それに色々珍しい味がある……！"
"80000010-9-ジュンコ" = "こっちのお団子はブルーベリー味で、"
"80000010-10-ジュンコ" = "こっちはカスタードクリーム？"
"80000010-11-ジュンコ" = "さ、入って食べてみよ！美味しかったら通おっと。さーて、どれにしよっかなー……んー、悩む……。"
"80000010-12" = "[s] \"いっそのこと全部食べてみる？\""
"80000010-13-ジュンコ" = "それは無理！結構今お財布がギリギリだから！"
"80000010-14-ジュンコ" = "それにアカリと違って私は食べられる量も限界があるから、どれを頼むかは慎重に考えないと……。"
"80000010-15-ジュンコ" = "ああー、私も早く先生みたいな大人になって、財布も胃も大きくなりたいなー。"
"80000010-16" = "[s] \"大人だからってみんながそうではないけどね。\""
"80000010-17-ジュンコ" = "そうなの？まあでもとりあえず、今は慎重に選ばないとだから……"
"80000010-18-ジュンコ" = "決めた！まず頼むなら看板メニューって書いてあるチョコレート団子かな。"
"80000010-19-ジュンコ" = "甘さと苦さのあるソースって考えると、みたらしに近いのかも？とにかく、食べてみれば分かるよね。"
"80000010-21-ジュンコ" = "このチョコレート団子を二人前ください！"
"80000010-22" = "[s] \"他のものも頼んだら？\""
"80000010-23-ジュンコ" = "ん？別に二人前を両方私が食べるんじゃないよ？"
"80000010-24-ジュンコ" = "片方は先生の分。せっかく一緒に来たんだから、一緒に食べようよ。"
"80000010-25-ジュンコ" = "先生に教えてもらわなかったらこのお店のことも知らなかったし、ここまで案内してくれたお礼もしたいし……。"
"80000010-26-ジュンコ" = "あと、今日はバレンタインデーだし……。"
"80000010-27-ジュンコ" = "とにかく私が特別に奢るから、ありがたく思ってよね！"
"80000010-32-従業員" = "（ご注文のチョコレート団子です。）"
"80000010-33-ジュンコ" = "あっ、やっと来た。"
"80000010-34-ジュンコ" = "じゃあ、いっただっきまーす！"
"80000010-42-ヘルメット団A" = "ここが例のチョコレート団子を売ってる、けしからん和菓子屋か？"
"80000010-43-ヘルメット団B" = "お団子にあんな邪道な調理をするだなんて……我々もちもちヘルメット団の目が黒いうちは許さん！"
"80000010-44-ヘルメット団A" = "そうだ！お団子に振りかけていいのは、きな粉とお醬油だけだ！"
"80000010-45-ヘルメット団B" = "まずはここにあるお団子を全部捨ててしまっ――"
"80000010-47-ジュンコ" = "私の、お団子……"
"80000010-48-ジュンコ" = "私のお団子が地面に……まだ一口も食べてないのに……。"
"80000010-49-ヘルメット団A" = "あ、あんたは誰だ？"
"80000010-50-ジュンコ" = "私はただ……一緒にゆっくりお団子を楽しみたかっただけなのにどうして……。"
"80000010-51-ジュンコ" = "どうしていつも、いつも、いつも、私がお団子を食べようとすると邪魔を……！"
"80000010-52-ヘルメット団B" = "な、何かを誤解してないか！？あんたに会うのは初めてのはずだろ！？"
"80000010-53-ジュンコ" = "そんなことはどうだって良いの……！"
"80000010-54-ジュンコ" = "積もり積もった日頃の恨みぃいいいいいいいい！！"
"80000010-61" = "（その後、もちもちヘルメット団の生徒らは、激怒したジュンコによってみんな逮捕された。）"
"80000010-62" = "（しかし騒ぎの影響で食べ物がすべて燃えてしまったので、ジュンコは結局お団子を味わえなかった……。）"
