[translation]
"10008070-1" = "第7話;危機一髪（１）"
"10008070-3-カイテンイエロー" = "ぐあーっ！や～ら～れ～た～！"
"10008070-4-カイテンブラック" = "わ、我々の夢が……！"
"10008070-5-カイテンレッド" = "こんな悪党どもの手によって、我々の正義が絶たれてしまうだなんて……！"
"10008070-12" = "[ns] \"やった……？\""
"10008070-13-ハルカ" = "や、やりました！アル様！"
"10008070-14-セリカ" = "はぁ、はぁ……これで、終わり？"
"10008070-15-ムツキ" = "意外と大したことなかったね？"
"10008070-17-カヨコ" = "まあ、別にそれならそれで。これ以上続くのはもう勘弁。"
"10008070-18-アル" = "ふふっ、みんなご苦労様。我々便利屋68＋αの団結力の賜物ね。"
"10008070-19-アル" = "ああ、もちろん先生の指揮も素晴らしかったわよ。"
"10008070-20-アル" = "おかげで思ったより苦戦しなかったことだし。"
"10008070-21-アル" = "……えっと、結構褒めてるのよ？"
"10008070-22-アル" = "流石は私たち、便利屋68のパートナーね♪"
"10008070-23" = "[s] \"うん、ありがとう。\""
"10008070-27-アル" = "さて、あとは賽銭箱を見つけて回収すれば……"
"10008070-29-？？？" = "はっはっは。みなさん、お疲れ様でございました。"
"10008070-31-アル" = "ん……？このタイミングで一体誰よ……？"
"10008070-32-ムツキ" = "アルちゃん、あっちあっち。"
"10008070-39-亀島五郎" = "私共に代わってゴロツキ共から賽銭箱を取り返してくださり、ありがとうございます。どう感謝すれば良いものか……。"
"10008070-41-アル" = "えっと……？"
"10008070-42-セリカ" = "大吉殿の管理人さんだよ。"
"10008070-44-亀島五郎" = "おっと、その格好……もしかしてアルバイトさんですかな？"
"10008070-45-亀島五郎" = "これはこれは、ただでさえお手伝いいただいているのに、その上賽銭箱を取り返すのにも協力してくださるとは……！"
"10008070-46-亀島五郎" = "ありがたい限りでございます。"
"10008070-50-亀島五郎" = "それでは、帰ったらみなさまにはしっかりお礼を致しましょう。それでは一旦……"
"10008070-51-カヨコ" = "待った。"
"10008070-52-亀島五郎" = "……どうかされましたか？"
"10008070-53-カヨコ" = "……取り返した人が中身を貰う。そういうルールじゃなかった？"
"10008070-55-セリカ" = "あ、確かに……。"
"10008070-56-ムツキ" = "そうだね～。で、何でその賽銭箱を抱えちゃってるのかな？"
"10008070-58-カヨコ" = "まさか、そのまま持っていく気じゃないよね？"
"10008070-61-亀島五郎" = "……。"
"10008070-62-亀島五郎" = "これは参りましたなあ、そういえばそんなお話もしていたような……。"
"10008070-63-亀島五郎" = "それに関しては何と言いましょうか、そうですねぇ……"
"10008070-74-アル" = "ど、どこからこんなに……！？"
"10008070-75-ムツキ" = "あははっ！なぁに？"
"10008070-76-ムツキ" = "もしかして噛みついてくるつもり？"
"10008070-78-亀島五郎" = "もう少し賢くなければ、せめて気づかない振りでもしてくれれば、丸く収まったのですが……。"
"10008070-79-亀島五郎" = "困りましたねえ、実に困りました。"
"10008070-80-カヨコ" = "……あの時の放送で言ってたこと、最初から守る気無かったでしょ。"
"10008070-81" = "[s] \"だとしたら、何であんなことを……？\""
"10008070-82-カヨコ" = "多分これまでの手口と同じ。SNSとかマスコミを利用して、人を動かす。"
"10008070-83-カヨコ" = "それで、自分の手だけは汚れないように物事を進める……そんなところじゃない？"
"10008070-85-セリカ" = "カイテンジャーから取り返すために、放送を見てる人たちを利用して……！？"
"10008070-87-亀島五郎" = "頭が回りますねぇ。仰る通りです、単にマスメディアを「使った」まで。"
"10008070-88-亀島五郎" = "「賽銭箱の中身は取り返してくれた方に」、そんなちょっとした嘘を入れ込んだだけで。"
"10008070-92-亀島五郎" = "こうしてキヴォトス各地から相当な数が集まった挙句……ほらこの通り、賽銭箱は私の手元まで戻ってきたでしょう？"
"10008070-94-アル" = "なっ……！？"
"10008070-96-亀島五郎" = "いやはや素晴らしいですね、マスコミの力というのは。"
"10008070-97" = "[s] \"これが、黒亀組のやり方……。\""
"10008070-98-亀島五郎" = "なるほど、どうやら既に私共のことも把握されているようですね。"
"10008070-99-アル" = "もちろんよ！大吉殿で、資金洗浄をしてたってこともね！"
"10008070-100-亀島五郎" = "はははっ！それでは話は簡単だ。"
"10008070-101-アル" = "……？"
"10008070-108-亀島五郎" = "バレているなら良いでしょう。裏社会の住民らしく、力で解決させてもらうとしますか。"
"10008070-109" = "[s] \"……っ、来る！\""
"10008070-111-アル" = "えっ、えっ！？"
