[translation]
"10008025-1" = "第2話;混乱はいつも突然に"
"10008025-3-セリカ" = "ちょっと！爆発音が聞こえたけど、どうしたの！？"
"10008025-4-ムツキ" = "あ、バイトちゃんお疲れ～。ちょっとこいつらがねー……"
"10008025-8-カイテンレッド" = "はっはっはっ！"
"10008025-10-セリカ" = "あ、あれって……！？"
"10008025-11-カヨコ" = "……その反応だと、やっぱり予定してたイベントとかじゃないみたいだね。"
"10008025-12-セリカ" = "絶対違う！お正月のヒーローショーとか聞いたことないし！"
"10008025-14-会場のお客さんA" = "あいつら、カイテンジャーだ……！"
"10008025-15-会場のお客さんB" = "「一度現れたら周囲を焦土と化してしまう」という、あの！？"
"10008025-16-会場のお客さんC" = "ど、どうしてここに……！？"
"10008025-18-ムツキ" = "あれさ、実はバイトちゃんのお仲間だったりしない？覆面水着団の新しいコスチュームとか。"
"10008025-19-セリカ" = "絶対に違うから！？あんなのが仲間とか嫌！"
"10008025-20-セリカ" = "あとそれは忘れて、黒歴史なのっ！！"
"10008025-21" = "[s] \"カイテンジャー……！？\""
"10008025-22-セリカ" = "あれ、先生知ってるの？"
"10008025-23" = "[s1] \"いや、初めて見るはずなんだけど……。\"\n[s2] \"BD、技術ノート……！うっ、頭が……！\""
"10008025-26-カイテンレッド" = "ふはははっ、なかなかやるではないか！"
"10008025-27-カイテンブラック" = "レッド、舐めてかかると痛い目見るぞ！"
"10008025-28-カイテンイエロー" = "ふん、だとしても問題は無い。"
"10008025-29-カイテンレッド" = "ああ、"
"10008025-30-カイテンレッド" = "我々の目的は戦うことではない！"
"10008025-31-カイテンレッド" = "とうっ！"
"10008025-44-一同" = "さ、賽銭箱が……！？"
"10008025-45-アル" = "……え？"
"10008025-46-セリカ" = "ちょぉっ！？"
"10008025-48-カイテングリーン" = "レッド、賽銭箱の奪取完了しました。しっかり成果給に反映しておいてください。"
"10008025-49-カイテンレッド" = "流石、給料が絡むとしっかりしてるな！グリーン！"
"10008025-50-カイテンブラック" = "これで第一目標は完了。"
"10008025-51-カイテンレッド" = "はっはっはっ！よし、このお金は我々カイテンジャーが公明正大に使わせてもらうこととする！"
"10008025-52-カイテンレッド" = "この賽銭箱、確かに貰い受けたぞ！"
"10008025-54-アル" = "ちょっ、何してんのよっ！？"
"10008025-55-カイテンレッド" = "では、アディオス！"
"10008025-60" = "[ns3] \"賽銭箱が……。\"\n[ns4] \"盗まれた……？\""
"10008025-63-アル" = "ええぇぇぇぇぇぇっ！？"
"10008025-64-セリカ" = "ちょっ、これ私の責任じゃないわよね！？これでバイト代無くなったりしないわよね！？"
"10008025-65-ムツキ" = "くくっ、ふふふっ……！"
"10008025-66-ムツキ" = "あははははっ！何あいつら、意味わかんない！賽銭箱持っていってるし、あははははははっ！"
"10008025-67-カヨコ" = "何この状況……。"
"10008025-69-ハルカ" = "あ、アル様！？ど、どどどどどうしましょう！？"
"10008025-70-アル" = "そんなの決まってるでしょう！すぐに追いかけるわよ！"
"10008025-71-セリカ" = "そうだよ、賽銭箱を取り返さないと！"
"10008025-72-カヨコ" = "うーん……。"
"10008025-73-カヨコ" = "……これ、追いかける必要ある？"
"10008025-74-セリカ" = "えぇっ！？"
"10008025-75-カヨコ" = "盗まれたのは賽銭箱だし、取り返したってそれが私たちのお金になるわけでもない。"
"10008025-76-カヨコ" = "それにあいつら、結構厄介だよ。指名手配されてる悪党だし、相手をするにはそこそこリスクがある。"
"10008025-77-セリカ" = "……っ！べ、別に良いわよ！どうせあんたたちに頼らなくたって、自分で何とかするから！"
"10008025-78-セリカ" = "自分の力で何とかする！アビドスのことも、今回のこともっ！"
"10008025-79-セリカ" = "じゃあ、私はもう行くから！"
"10008025-80" = "[s] \"セリカ。\""
"10008025-81-セリカ" = "止めないで先生！早く行かないと……！"
"10008025-86-アル" = "……私たちも行くわ。"
"10008025-87-ムツキ" = "えっ！？"
"10008025-88-セリカ" = "ど、どういうこと……！？"
"10008025-89-アル" = "……カヨコの言うことは、確かに正しいわ。"
"10008025-90-アル" = "もう私たちのお願いごとは済んだのだし、わざわざ自分たちから危険を背負う必要も無い。"
"10008025-91-アル" = "でもね……我々便利屋68はいつから、損得を計算して動く集団になったのかしら？"
"10008025-92-カヨコ" = "ふぅ……。"
"10008025-93-アル" = "計算上はやる必要ないわ。"
"10008025-94-アル" = "でもね、これはあくまでも気分の問題……"
"10008025-96-アル" = "年明け早々、この私たちが入れたお金を盗むなんて許せない、それだけよ！！"
"10008025-102-ムツキ" = "へぇ……。"
"10008025-103-ハルカ" = "あ、アル様……！！"
"10008025-104-カヨコ" = "……まあ、そう言うと思ったけど。"
"10008025-105-カヨコ" = "逃走ルートは大体絞れた。今から急げば、15分以内には追いつけるはず。"
"10008025-106-カヨコ" = "先生もいるから、もう少し早まるかもね。"
"10008025-107-ムツキ" = "ふーん、なるほど～？"
"10008025-108-ムツキ" = "カヨコちゃん。アルちゃんが最初っからそう言うの分かってて、調べてたんでしょ？"
"10008025-109-カヨコ" = "……まあ、いつものパターンだから。"
"10008025-111-セリカ" = "な、何か色[ruby=しゃく]々癪な[/ruby]感じもするけど……"
"10008025-112-セリカ" = "今はお礼とか言わないから。賽銭箱を取り返して、全部終わってからね！"
"10008025-113" = "[s] \"じゃあ、みんなで追いかけよっか。\""
"10008025-115-ハルカ" = "さ、流石はアル様です！これが真のアウトローの振る舞いなんですね！また一つ学びました……！"
"10008025-116-ムツキ" = "まあ、元々アルちゃんは衝動的なところあるからね～。"
"10008025-117-アル" = "ふふっ……それを言うなら「衝動」じゃなくて、「アウトローの気質」と言ってくれるかしら？"
"10008025-120-アル" = "（事業が潰れませんように、事業が潰れませんように、事業が潰れませんように、事業が潰れませんように、事業が潰れませんように、事業が潰れませんように……っ！！）"
"10008025-125-会場のお客さんC" = "「穢れ」が付いたりしたら……？"
"10008025-126-会場のお客さんC" = "蓄積された願いが丸っと裏返って、大変なことに……！"
"10008025-129-アル" = "（賽銭箱を取り返せなかったら、あの願いが裏返って……！）"
"10008025-130-アル" = "（ぜ、絶対に、何としてでも取り返さないと！！！）"
