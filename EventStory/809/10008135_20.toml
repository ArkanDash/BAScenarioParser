[translation]
"10008135-2-セリカ" = "うぅっ……結局バイト代、貰えなかった……。"
"10008135-3" = "[s] \"雇い主の管理人が捕まっちゃったんだもんね……。\""
"10008135-4-セリカ" = "まぁ、しょうがないか……。"
"10008135-5-セリカ" = "バイトしてると、よくあることだし……。"
"10008135-6" = "[s] \"よくあるの！？\""
"10008135-10-セリカ" = "それに私もそうだけど、あっちも相当ガッカリしてるみたいだし……。"
"10008135-15-アル" = "ふふ……あはは……全部、全部終わりよ……。"
"10008135-16-ハルカ" = "えっと、あ、あの……。"
"10008135-17-カヨコ" = "……はぁ、疲れた。"
"10008135-18-アル" = "結局私たちは……新年早々、何をしてたのかしら……？"
"10008135-19-ハルカ" = "そ、その、それは……。"
"10008135-21-ムツキ" = "まあまあ、終わったことはしょうがないじゃん！"
"10008135-22" = "[s] \"ムツキ？\""
"10008135-23-ムツキ" = "くふふっ、まあ私はそれなりに楽しかったし？別に虚しいとか、そんな風にも思わないし。"
"10008135-24-ムツキ" = "色々面白いことが起きて、楽しかったから！"
"10008135-25-アル" = "で、でも、願い事が……うぅっ……。"
"10008135-26-カヨコ" = "そういえばムツキ、まだ願い事してなくない？"
"10008135-27-ムツキ" = "あ、そういえばそうかも？"
"10008135-28-カヨコ" = "今からでもすれば？まあ場所はあれだけど、一応賽銭箱はあるし。"
"10008135-29-ムツキ" = "うん、"
"10008135-30-ムツキ" = "そうだね！"
"10008135-31-ムツキ" = "じゃあ、みんなで一緒に祈ろう！"
"10008135-32-ムツキ" = "ほら、オモチャのお札ならちょうど人数分あるから！"
"10008135-33-アル" = "え、えっ？"
"10008135-34-ハルカ" = "こ、これでお願いごとをしても、大丈夫なのでしょうか……？"
"10008135-36-ムツキ" = "大丈夫大丈夫！"
"10008135-44-ムツキ" = "はい、先生も！"
"10008135-45-ムツキ" = "じゃあみんなでお願いごとしよ！"
"10008135-46-ムツキ" = "あっ、もちろんさっきとは違うやつでね！"
"10008135-47-ムツキ" = "新しい気分で、新しい願い事！ねっ？"
"10008135-53-アル" = "え、ええ……。"
"10008135-54-カヨコ" = "……うん、そうだね。"
"10008135-55" = "[s] \"良いと思うよ。\""
"10008135-57-ムツキ" = "それじゃあ、せーのっ！"
"10008135-66-ムツキ" = "はい、願いごと終わり！"
"10008135-67" = "[s] \"早いね……。\""
"10008135-70-ムツキ" = "くふふっ、こういうのは早く終わらせた方が勝ちなんだよ？"
"10008135-71-カヨコ" = "……うん、良し。というか勝ち負けとか、そういうのは別に無いと思うけど。"
"10008135-72-アル" = "ところで先生は、どんなお願いごとをしたのかしら？"
"10008135-73" = "[s] \"あ、そういえば中断してた。\""
"10008135-74-ムツキ" = "アルちゃん、そういうのは聞いちゃダメなんだよ！お願いごとは誰かに言っちゃうと、効果が無くなるんだから。"
"10008135-75-ムツキ" = "アルちゃんもそんなの嫌でしょ？"
"10008135-76-アル" = "そ、それはそうだけど……。"
"10008135-77-カヨコ" = "はぁ。本当にずっと動きっぱなしだったせいで、何だか……"
"10008135-81-ハルカ" = "ご、ごめんなさいごめんなさい！私のお腹が勝手に、本当にすみません……！？"
"10008135-82-ムツキ" = "あはっ！でも確かにお腹空いたね。"
"10008135-83-ムツキ" = "じゃあ、先生に美味しいものでも奢ってもらおっか！"
"10008135-84-アル" = "そうね、そうしましょうか。"
"10008135-85-カヨコ" = "うん、先生が良いなら私も賛成。"
"10008135-86-セリカ" = "……えっと、これ、私も行って良いやつ？先生が奢ってくれるなら、せっかくだし……。"
"10008135-87" = "[s] \"すごい勢いで決定事項に……！\""
"10008135-89-アル" = "ふふっ、まさか先生は断ったりしないでしょう？それに、みんなこれだけ頑張ったんだから。"
"10008135-90-ムツキ" = "じゃあ行こっ！ほらほら早くっ！"
"10008135-91-カヨコ" = "ところで、何食べる？"
"10008135-93-セリカ" = "……ふふっ、ここも騒がしいわね。"
"10008135-94-ハルカ" = "わ、私が意見しても大丈夫なのですか……！？え、えっと、やはりアル様と一緒ならラーメンなど……！"
"10008135-97" = "（そうして、キヴォトスの新しい一年が始まった）"
"10008135-102" = "[ns] （お願い事……）"
"10008135-107" = "[ns] 静かに、それでもしっかりと、心の中で祈る。"
"10008135-108" = "新春狂想曲 第68番"
