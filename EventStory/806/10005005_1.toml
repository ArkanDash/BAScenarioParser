[translation]
"10005005-1" = "プロローグ;C&Cの新たな臨時メンバー"
"10005005-3-？？？" = "……こちら問題無し。"
"10005005-4-？？？" = "……私の方も、問題ありません。"
"10005005-5-？？？" = "……OK。"
"10005005-11" = "ゴールデンフリース号・機関室"
"10005005-14-ネル" = "……なんか、あっけねえな？"
"10005005-15-カリン" = "他の学校のクルーズ船に、こっそり乗り込む……。"
"10005005-16-カリン" = "初めての体験だったけど、上手くいって良かった。"
"10005005-17-アカネ" = "どうやら、特にまだ気づかれた様子もありませんし。"
"10005005-18-アカネ" = "ふふっ、どうやら問題なく進んでいるみたいですね？"
"10005005-19-ネル" = "……はぁ。"
"10005005-20-ネル" = "そもそも「問題」って言うんなら、この依頼自体最初っから問題だらけだろうがよ……。"
"10005005-21-ネル" = "あー、気に入らねぇー……。"
"10005005-22-ネル" = "あの会計に従うのも、こうしてひそひそと隠れて動かなきゃなんねえのも……"
"10005005-23-ネル" = "何より……！"
"10005005-24-ネル" = "（ジロッ）"
"10005005-25" = "[s1] \"よろしくね。\"\n[s2] \"どうしたの？\""
"10005005-26-ネル" = "先生がこうして一緒に来てんのが一番意味分かんねぇ！？監視とか邪魔なだけだっての！"
"10005005-27-ネル" = "先生がこうして一緒に来てんのが一番意味分かんねぇ！？監視とか邪魔なだけだっての！"
"10005005-28" = "[s] \"うーん、まあ監視というか何と言うか……。\""
"10005005-29-アカネ" = "あはは……すみません、リーダーも決して「一緒なのが嫌」と言っているわけでは無いのですが……。"
"10005005-30-アカネ" = "まあ、セミナー側の都合でこうなっているわけですし……。"
"10005005-31-カリン" = "今さら何を言っても仕方ない。先生が悪いわけでもないんだし。"
"10005005-32-ネル" = "あーもうめんどくせぇ！"
"10005005-33-ネル" = "こっちのやり方にいちいち口出してくんじゃねえよあいつ、勝手にさせろっての……！"
"10005005-34-アカネ" = "まあ、仕方ありませんね……。"
"10005005-35-カリン" = "ふぅ……。"
"10005005-36-カリン" = "まあ、何と言うか……。"
"10005005-37-カリン" = "「発端は私たちのせいではない」と言ったら、嘘になるし……。"
"10005005-39" = "（時間はさかのぼり、二日前……）"
"10005005-42-アカネ" = "……はい、こちらC&Cのアカネです。"
"10005005-43-アカネ" = "聞こえていますでしょうか？"
"10005005-44-ユウカ" = "OK、聞こえてるわ。"
"10005005-45-ユウカ" = "じゃあ本題なんだけど、はぁ……。"
"10005005-46-アカネ" = "ふふっ、いつも通りのご依頼ですか？"
"10005005-47-アカネ" = "そんなにため息をつきながら、依頼の話をしなくても……依頼は最終的にいつも達成してるじゃないですか？"
"10005005-48-ユウカ" = "それは分かってるけど！だからこうしてまた依頼してるんだけど！問題はその後！！"
"10005005-49-ユウカ" = "忘れたとは言わせないわよ、毎回誰が後始末をしているのか……「静かに処理して」って言ってるのに、毎度のごとく全然聞いてくれないじゃないの……。"
"10005005-50-ユウカ" = "いつもいつも物を壊すわ、建物を吹っ飛ばすわ……請求書の額が毎回いくらになってるか分かってる！？"
"10005005-51-ユウカ" = "ほんっと頭痛の種なのよね……先月も、本来の予算の6倍くらいかかってたし……それでもまあ、頼りにしてるというか、せざるを得ないというか……。"
"10005005-52-ユウカ" = "……でもね、"
"10005005-53-ユウカ" = "いつまでも頭を抱えてるだけの私じゃないわよ。"
"10005005-54-アカネ" = "……？それはどういう……？"
"10005005-55-ユウカ" = "今回の依頼、ひとり同行者を付けてもらうわ。"
"10005005-60-ユウカ" = "あなたたちが暴れ過ぎないように、ブレーキ役と言えば良いのかしら。まあ、あなたたちもよく知っているはずだから心配しないで。"
"10005005-61-ユウカ" = "毎度のごとく膨れ上がる被害が、本当に仕方のないことなのか……その確認くらいは、させてもらわないとね？"
"10005005-62-アカネ" = "えっと、それは……？"
"10005005-63-アカネ" = "……あら？"
"10005005-67-アカネ" = "先生？"
"10005005-69-ネル" = "あー、ったくやってらんねぇ……。"
"10005005-70-ネル" = "まさか、こんなことになるとは……。"
"10005005-71-ネル" = "ったく、ちっと物が壊れたり建物が崩れたくらいで何だよ……？"
"10005005-72-ネル" = "依頼は達成できてるんだし、その後始末はあっちの役割だろうが。"
"10005005-73-ネル" = "あー……なんか思い出したら腹立ってきた。わざと色々ぶっ壊しながら進むか？"
"10005005-74-カリン" = "いや、リーダー流石にそれは……ここは、ミレニアムの領域外だし……。"
"10005005-75-アカネ" = "そうですよ、学校間のトラブルなんて無いに越したことはありません。"
"10005005-76-ネル" = "んなことあたしの知ったことかよ……いざとなったら全部吹っ飛ばせば良いんだろ？"
"10005005-77-ネル" = "とにかく大体のことはぶっ壊せば解決、それで終わり。"
"10005005-78" = "[s3] \"ストップストップ。\"\n[s4] \"その前にもうちょっと頑張ってみない？\""
"10005005-79-ネル" = "……あぁ？"
"10005005-80-ネル" = "……あぁ？"
"10005005-86-ネル" = "んだよ、何か文句でもあんのか？"
"10005005-87-ネル" = "それとも先生は、あの会計の肩を持つつもりか？"
"10005005-88" = "[s5] \"とにかくダメ。\"\n[s6] \"ネルはやろうと思えば静かにできるでしょ？\""
"10005005-89-ネル" = "……はぁ？"
"10005005-90-ネル" = "……はぁ？"
"10005005-91-ネル" = "えぇ……。"
"10005005-95-ネル" = "あ～……ったくなんでこう……ぐっ……あぁー……。"
"10005005-96-ネル" = "……ああもう、分かった分かった！おとなしくやりゃあ良いんだろ……。"
"10005005-97-ネル" = "あーもう、だからやってらんねぇんだっての……なんだこのやわっこい雰囲気はよぉ……。"
"10005005-102-カリン" = "……おぉ。"
"10005005-103-カリン" = "アカネ、すごいことが起きてる。"
"10005005-104-アカネ" = "そうですね、私も同じことを思っていました。このやり方でどう変わるのかと半信半疑でしたが……。"
"10005005-105-アカネ" = "ふふっ、こんなに話を素直に聞くリーダーは中々見られませんね。"
"10005005-106-アカネ" = "もしかして実際の狙いは監視というより、こうして抑制する方だったのでしょうか？"
"10005005-107-ネル" = "るせぇなゴチャゴチャと、さっさと行くぞ！ああもう、むしゃくしゃする……。"
"10005005-108-アカネ" = "ふふっ。はい、確かにそろそろ動いた方が良さそうです。"
"10005005-109-アカネ" = "それでは先生、今日は特に戦闘にはならないと思いますが、よろしくお願いしますね。"
"10005005-110-アカネ" = "ああ、そういえばこちらの乗船証を先生にも。今回、私たちと一緒のグループとして招かれている方……という扱いになります。"
"10005005-112-アスナ" = "え、つまりご主人様は私たちと同じチームってこと？"
"10005005-113-アスナ" = "っていうことは実質的に、"
"10005005-114-アスナ" = "C&Cの新メンバーじゃん！！"
"10005005-119-アカネ" = "……？"
"10005005-120-ネル" = "……はぁ？"
"10005005-121-カリン" = "C&Cの新メンバー……先生が？"
"10005005-122-カリン" = "まぁ、一時的にとはいえ、今日はそういうことになるかもしれないけれど……。"
"10005005-123-アカネ" = "ふふっ、確かにそうですね。"
"10005005-124-アカネ" = "では臨時ではありますが、新メンバーということで……同じチームのメンバーなら、仲良くしないといけませんね？"
"10005005-126-アカネ" = "というわけでリーダーも、ちゃんと仲良くしてくださいね。せっかく新メンバーの初陣なんですから、いつまでも不機嫌ではいけませんよ？"
"10005005-127-ネル" = "いや別に、っていうか仲良くしろって言われたからってそれですぐ「じゃあ仲良くなりました」とかそういうもんじゃねぇだろ！"
"10005005-128-アスナ" = "あははっ、楽しくなってきたね？ほら、リーダーも笑顔笑顔！！"
"10005005-129-ネル" = "ったく、るせぇなほんとに……。"
"10005005-130-カリン" = "口ではこうは言ってるけど、今日のリーダーの表情は割と悪くない。むしろ楽しそうだ。"
"10005005-131-ネル" = "るせぇって言ってんだろうが！あたしはなんも楽しくねぇっての！？"
"10005005-132" = "[s7] \"私は結構ワクワクしてる。\"\n[s8] \"じゃああらためて、よろしくね。\""
"10005005-135-ネル" = "だから……っ！"
"10005005-136-ネル" = "……ああもうっ！！"
"10005005-140-ネル" = "……はぁ。"
"10005005-141-ネル" = "ったく、別に良いけどよ……。"
"10005005-144" = "#video;10005"
