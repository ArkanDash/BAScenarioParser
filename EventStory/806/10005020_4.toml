[translation]
"10005020-1" = "第2話;いつも通りの思考回路"
"10005020-2" = "（約30分後……）"
"10005020-9-バニーガール・ガードA" = "……ぐっ！？"
"10005020-10-バニーガール・ガードB" = "うわっ！？"
"10005020-15-カリン" = "……クリア。"
"10005020-16-アカネ" = "こちらもクリア、順調ですね。"
"10005020-21-ネル" = "……あん？"
"10005020-22-ネル" = "これで終わりか？早くねぇか？"
"10005020-23-カリン" = "「これで終わり」って、ここに来るまでの間にも、リーダーは結構な数を気絶させてなかったか……？"
"10005020-24-アカネ" = "まだまだ力が有り余っているみたいですね。"
"10005020-25-ネル" = "はぁ……。"
"10005020-26-ネル" = "こんなんばっかりだと、張り合い無くて逆に疲れんな……"
"10005020-27-ネル" = "まあ、派手にやれねえってのも理由かもしんねぇけど……。"
"10005020-29-カリン" = "作戦が順調なのは良いことだ。"
"10005020-30-カリン" = "ところでリーダー、あらためて見るとその格好……。"
"10005020-31-ネル" = "るせぇ。良いだろうがよ、バニーにスカジャン羽織っても。つかそれさっきアカネにも言われたっての。"
"10005020-32-ネル" = "これだけは譲れねぇ。"
"10005020-33-ネル" = "ってか別に順調ってわけでもねぇだろ、まだあのチビを見つけたわけでもねぇし……。"
"10005020-34-ネル" = "じれってー……全部吹っ飛ばせば、すぐ見つかるんじゃねぇか？"
"10005020-35-ネル" = "この程度のやつらなら、騒いでまとめて来たところで一蹴できるだろ？"
"10005020-36" = "[s1] \"我慢我慢。\"\n[s2] \"こういうのも実力のうちだよ、きっと。\""
"10005020-37-ネル" = "ちっ……！"
"10005020-38-ネル" = "ちっ……！"
"10005020-39-ネル" = "……わーったわーった。言ってみただけだよ。"
"10005020-41-ネル" = "おいてめぇら、先生の存在に感謝しとけよ。こうして一緒にいなかったらてめぇらは今頃……"
"10005020-42-カリン" = "リーダー。足蹴にしたところで、もう全員気絶してるんだから聞こえてない。"
"10005020-43-カリン" = "とにかく、システムを掌握したらすぐに移動しよう。"
"10005020-44-カリン" = "アカネ、進捗は？"
"10005020-46-アカネ" = "はい、お任せください。順調です。"
"10005020-47" = "[s3] \"流石はアカネ。\"\n[s4] \"頼もしい。\""
"10005020-48-アカネ" = "ふふっ。ありがとうございます、先生。"
"10005020-49-アカネ" = "ふふっ。ありがとうございます、先生。"
"10005020-50-アカネ" = "そこまで褒められると、任務中なのに何だか浮かれてしまいそうです。"
"10005020-52-ネル" = "ったく、あのチビ……めんどくせぇことさせやがって。捕まえたらボコボコにして泣かせてやる。"
"10005020-53-カリン" = "わざわざ私たちがやらなくても、セミナーに戻ればユウカがそれに近いことをやりかねない気がするけど……。"
"10005020-54-カリン" = "……ん？先生？"
"10005020-55-カリン" = "私たちと白兎の仲が良さそう……？"
"10005020-56-カリン" = "ああ、確かに否定はできないかもしれない。"
"10005020-57-カリン" = "色々と問題を起こすとは言え、別に危険な存在だとか、悪の存在ってわけでもない。"
"10005020-59-アカネ" = "何度も会っているうちに、私たちのこと「先輩」なんて呼ぶようになりましたしね。"
"10005020-60-ネル" = "あいつ「ネル先輩が追いかけてくるー！？」とか、「ネル先輩が叩いたー！」とか、いちいちうるせぇんだよな……。"
"10005020-61-ネル" = "殴られたくないなら問題を起こすんじゃねぇっつの。"
"10005020-62-ネル" = "ただの世間知らずで甘えん坊のチビだ。腕っぷしも別に、見た目通りのな。"
"10005020-63-カリン" = "……？"
"10005020-64-カリン" = "あ、そういうことか。途中まで、てっきり自分の話をしてるのかと。"
"10005020-65-ネル" = "……はぁ？"
"10005020-66-ネル" = "おいカリン、まさかとは思うがてめぇ……？"
"10005020-67-アカネ" = "はいはい、そろそろ動きますよ～。"
"10005020-68-カリン" = "システムの掌握完了？だいぶ早かったな。"
"10005020-69-アカネ" = "ありがとうございます、ではこちらへどうぞ。"
"10005020-70-アカネ" = "ちょっと場所的に、その辺は危ないので。"
"10005020-71-アカネ" = "こちらへどうぞ。もう少しこちらへ。"
"10005020-73-アカネ" = "はい、ではポチっと。"
"10005020-77-アカネ" = "OKです、動作も問題無さそうですね。"
"10005020-78-カリン" = "……？"
"10005020-79-カリン" = "……アカネ？"
"10005020-80-カリン" = "今何を押した？それにこの音って……？"
"10005020-87-カリン" = "……？"
"10005020-88-ネル" = "……？"
"10005020-89" = "[s5] \"この音は……？\"\n[s6] \"アカネ、システムを掌握したんじゃなかったの……？\""
"10005020-90-アカネ" = "えっと、"
"10005020-91-アカネ" = "えっと、"
"10005020-92-アカネ" = "いつも通りの処理をしているだけですが……？"
"10005020-93-アカネ" = "いつも通り、C4を。"
"10005020-94-カリン" = "そうか、C4か。"
"10005020-98-カリン" = "……C4って、あの爆薬のC4？"
"10005020-99-カリン" = "アカネ、どうして今ここでC4を……？"
"10005020-100-アカネ" = "……？それは当然、ここを爆破させるためですが……？"
"10005020-101-カリン" = "そうだろうな。ただ私が聞きたいのは、今回色々と静かに動かないといけない作戦で、何でいつもみたいにC4を使ったのか、という……。"
"10005020-102-アカネ" = "……あら？"
"10005020-103-アカネ" = "えっと、もしかして今の私……。"
"10005020-104-アカネ" = "何か、大きなミスを……？"
"10005020-105-カリン" = "話の流れ的に、監視システムをハッキングして逆に利用とかした方が良かったんじゃ……？"
"10005020-110-ネル" = "おい、じゃあ早く止めろよ。あと何秒残ってんだ？"
"10005020-111-アカネ" = "え、えっと……。"
"10005020-112-アカネ" = "残り時間……"
"10005020-113-アカネ" = "……０秒です。"
