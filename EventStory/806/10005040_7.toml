[translation]
"10005040-1" = "第4話;二転三転いつも通り"
"10005040-2" = "プレイラウンジ・裏手廊下"
"10005040-5-アカネ" = "……クリア、異常無しです。"
"10005040-6-ネル" = "こっちも問題ねぇ。"
"10005040-7-ネル" = "後ろは？"
"10005040-9-カリン" = "大丈夫。"
"10005040-10-カリン" = "今さらだけど、ここで本当に合っているのかどうか……色々と不確定なのが悔やまれるな。あの時、もう少し手加減ができていれば……。"
"10005040-11-アカネ" = "気にしないでください、カリン。そもそもは私のミスのせいですし。"
"10005040-12-アカネ" = "それに、途方に暮れるよりずいぶんマシです。最終的に行ってみるべきところが分かっただけでも。"
"10005040-13-カリン" = "……それもそうか。あの警備担当、最後の方は気絶したままうわ言みたいに「プレイラウンジ」しか言わなくなっていたな……ここが正解だと良いのだけど。"
"10005040-14-カリン" = "それにしても、ちょっと心配だ……あれを一回やってしまうと……。"
"10005040-15-カリン" = "いやそれより、ところでこの「プレイラウンジ」というのは……？"
"10005040-16-ネル" = "案内図に書いてあった通り、この中央にあるやたらとでけー部屋の名前だろ？"
"10005040-17-カリン" = "いや、それは分かってるけど……。"
"10005040-18-アカネ" = "何をするための部屋なのか、ということですか？"
"10005040-19-アカネ" = "確かに、そういう意味では私もはっきりとはよく分かっていませんが……。"
"10005040-20-アカネ" = "あの子が発行した債券とも、何か関係がある場所なのでしょうか？"
"10005040-21-アカネ" = "先生は、どういう場所なのかご存じです？"
"10005040-22" = "[s1] \"ちょ、ちょっと分からないかな……。\"\n[s2] \"言葉通りに捉えると、「遊び場」って意味みたいだけど……。\""
"10005040-24-アカネ" = "そうでしたか……。"
"10005040-26-アカネ" = "そうですね……。"
"10005040-28-ネル" = "ま、何だっていいだろ。やることはいつも通りだ。"
"10005040-29-ネル" = "ここがどんな場所でも関係ねぇ。とにかく突っ込んでって、あいつを捕まえる。"
"10005040-30-ネル" = "いつもとやることはほぼ変わんねぇ、だろ？"
"10005040-31-アカネ" = "そうですね、まあ基本的にはそうするしかなさそうですし……付け足すとすると、今回はせめてそれをできるだけ、静かにやるくらいで。"
"10005040-32-アカネ" = "そもそも、色々と手順が狂ってしまいましたし……。"
"10005040-33-アカネ" = "ではあらためて、あくまでも今回の目標は「白兎」です。"
"10005040-34-アカネ" = "「プレイラウンジ」に入ったら、それぞれバラバラになって彼女を捜索。見つけ次第すぐに連絡してください。"
"10005040-35-アカネ" = "速やかに制圧して、即座にこの船を抜け出しましょう。"
"10005040-36-アカネ" = "煙幕弾と閃光弾、それ以外は使わないようにしましょうか。ことを大きくすると怒られてしまいますから。"
"10005040-37-アカネ" = "それから、むやみな戦闘は無しで。警備の方々を片っ端から倒す、なんてもっての外……こんな感じで行きましょうか？"
"10005040-38-ネル" = "はぁ、めんどくせぇな……。"
"10005040-39" = "[s3] \"頑張ってね、ネル。\"\n[s4] \"ネルならできるよ、ファイト。\""
"10005040-43-ネル" = "……。"
"10005040-44-ネル" = "あーもううるせぇなぁ！んなお世辞、言われなくてもやるっての！"
"10005040-45-ネル" = "あたしを誰だと思ってる、そんくらい朝飯前だ！"
"10005040-46-ネル" = "見てろ。さっさと見つけて、ほぼ無音で後頭部ぶん殴って、すぐにここまで連れてきてやる。"
"10005040-47-カリン" = "じゃあ、始めよう。"
"10005040-48-ネル" = "おっし。あ、先生はあたしについて来い。何かあったらあたしが守ってやるから、心配すんな。"
"10005040-49-ネル" = "……んじゃ、スタート！"
"10005040-51" = "プレイラウンジ"
"10005040-53-ネル" = "ほーん……。"
"10005040-54-ネル" = "ここが「プレイラウンジ」、ねぇ……？"
"10005040-55-ネル" = "なんつーか……ただの派手なゲームセンターだな？"
"10005040-60-ラウンジガイド" = "プレイラウンジへようこそ！物珍しそうに見られていましたが、もしかしてここに来るのは初めてでしょうか？"
"10005040-61-ネル" = "……あん？"
"10005040-62-ラウンジガイド" = "初めまして、私はここの案内を担当しているラウンジガイドです！"
"10005040-63-ラウンジガイド" = "ご利用の方々へ、利用方法やルールを説明する係ですね。"
"10005040-64-ラウンジガイド" = "まず、ここ「ゴールデンフリース号」のサービスは、ここにあるこれらのゲームで手に入った財貨によって内容が変わる、というのはよろしいですよね？"
"10005040-65-ネル" = "ゲームぅ……？"
"10005040-66-ラウンジガイド" = "あら、ここに来る際にご説明がありませんでしたでしょうか……？"
"10005040-67-ラウンジガイド" = "ではあらためまして、この船におけるすべてのサービス……たとえば宿泊施設、遊戯施設、その他にも例えばトイレまで、それら全てはゲームを通じて手に入れられる引換券によって、そのサービスの等級が決まります。"
"10005040-68-ラウンジガイド" = "ランクはDからSまでありまして、基本的には「A」を獲得することができれば、船内のほぼすべてのサービスにおいて最上級のものをご利用いただけます！"
"10005040-69" = "[s5] \"っていうことは……。\"\n[s6] \"「S」は、それ以上の特別な何かが……？\""
"10005040-70-ラウンジガイド" = "ふふっ、そうですね。「S」はほぼ幻の存在といっても過言ではありません。"
"10005040-71-ラウンジガイド" = "ふふっ、そうですね。「S」はほぼ幻の存在といっても過言ではありません。"
"10005040-72-ラウンジガイド" = "このゴールデンフリース号において、ある種の超法規的な――"
"10005040-73-？？？" = "ぐあああああっ！！"
"10005040-74-ネル" = "……あんだぁ？"
"10005040-80-利用客C" = "ダメだー！！またC止まりだよ！"
"10005040-81-利用客B" = "よ、ようやくBが出た……。"
"10005040-82-利用客C" = "え、「B」出たの！？「B」は「C」と違って、カレーに唐揚げ添えてくれるんでしょ！？"
"10005040-83-利用客B" = "これ、「A」になるとどれくらいのもんなの？相当サービスが良くなる感じ？"
"10005040-84-利用客A" = "まあ、確かにBより全然良いかな。それでもSランクに比べると大したことないよ。"
"10005040-85-利用客A" = "噂だけど、Sランクの「VIPチケット」があると、この船における校則を全部無視できるとか……。"
"10005040-86-利用客C" = "校則を無視……？そんなんアリ……？"
"10005040-88" = "おっと、どうやらＣランクからBランクに上がられた方がいらっしゃるようですね！おめでとうございまーす！！"
"10005040-89" = "他の皆様も、ぜひ上のランク目指して頑張っていきましょ～～！！"
"10005040-91-ネル" = "……何してんだ、あれ？"
"10005040-92-ネル" = "あの大きなモニターに映ってるやつのランクが上がって？それでお祝いされてるってことか？意味わかんねぇ。"
"10005040-93" = "[s7] \"この船だと、ランクがすごい大事なものなんだね。\"\n[s8] \"ゲームの結果で全てが決まる世界……。\""
"10005040-94-ネル" = "ふーん……それでこいつら、周りには見向きもせずに筐体に向かってるわけか。"
"10005040-95-ネル" = "ふーん……それでこいつら、周りには見向きもせずに筐体に向かってるわけか。"
"10005040-96-ネル" = "こいつら学校にも行かずに、ずっとここでこうしてんのか……？"
"10005040-97-ネル" = "……あん？"
"10005040-98-ネル" = "そういうこと気にするんだね……？"
"10005040-99-ネル" = "って、るせぇな！あたしだって遅刻はしょっちゅうだけど、元々そんなに欠席はしてねぇから！ちゃんと行ってっから！？"
"10005040-100-ネル" = "とにかく、大事なのはそれじゃなくて……。"
"10005040-101-ネル" = "……まあこの中にあいつがいるとしても、確かにおかしくねぇな。"
"10005040-102-ネル" = "どいつもこいつも夢中になってるし、うるさくて話し声もよく聞こえねーし。"
"10005040-103-ネル" = "働きたくない、面倒なことは何もしたくない、誰にも縛られたくない……あいつにはピッタリの場所だ。"
"10005040-105-ネル" = "にしても……。"
"10005040-106-ネル" = "本当にあいつがここにいるとして、"
"10005040-107-ネル" = "一体何をしてんだ……？"
"10005040-111" = "[ns9] \"ネル？\"\n[ns10] \"どうかした？\""
"10005040-112-ネル" = "……見っけた。"
"10005040-113-ネル" = "……見っけた。"
"10005040-114-ネル" = "あそこだ……見えるか？あっちの奥の方で座ってるやつ。"
"10005040-118-白兎" = "やっはーー！今日はまあまあ悪くない感じ！"
"10005040-119-白兎" = "じゃあ今日はこの辺で勝ち逃げ……"
"10005040-120-白兎" = "……いや、この勢いならもう少し行けるんじゃ……？"
"10005040-124-白兎" = "よし、行くよ！！頑張れコユキ、行けるよコユキ！！自分の力を信じて！伝説の「S」はきっともう目の前に……！"
"10005040-129-白兎" = "……え、Bじゃん。要らないんだけど！？"
"10005040-130-白兎" = "ねーなんでぇーーーー！？信じらんない、今日いくら入れたと思ってんの！？そろそろ確定でSが出ても良くない！？"
"10005040-131-白兎" = "一体いつになったらVIPになれるのさぁ！！もう待てないんだけどーーーー！！！"
"10005040-136-バニーガール・ガードA" = "ちょっ、ちょっとやめてください！機械を叩かないで……！出禁になりますよ！"
"10005040-137-白兎" = "うっ……。"
"10005040-138-白兎" = "す、すみません……。"
"10005040-144" = "[ns11] \"……あの子が？\"\n[ns12] \"意外とあっけなく見つかったね？\""
"10005040-145-ネル" = "ああ、そうだよ……。"
"10005040-146-ネル" = "ああ、そうだよ……。"
"10005040-147-ネル" = "夢中になって、こっちに全然気づいてもないあのガキが、「白兎」だ。"
"10005040-148-ネル" = "ったく、何をしてるかと思ったら……。"
"10005040-149-ネル" = "債券の金を、ただ全部ゲームに突っ込んでたってことか……？"
"10005040-150-ネル" = "くっだらねぇ……そんなことのせいで、わざわざあたしらはここまで……！"
"10005040-151" = "[s13] \"まあ、もっと悪いことじゃなくて良かった。\"\n[s14] \"なるほど、自由な子だ。\""
"10005040-152-ネル" = "……はぁ。"
"10005040-153-ネル" = "……はぁ。"
"10005040-154-ネル" = "確かにあいつの言ってた通り、どこぞの悪党と組んで変なこと企んでるよりマシだったが……。"
"10005040-155-ネル" = "……ま、あたしは別に、それならそれで好みの展開だったけどよ。"
"10005040-159-ネル" = "あー、あー……聞こえてるか？「白兎」を見つけた、位置を送るから集まれ。"
"10005040-160-アカネ" = "あら、承知しました。"
"10005040-161-カリン" = "分かった、すぐ行く。"
"10005040-165-ネル" = "これで終わりそうだな。"
"10005040-166-ネル" = "短い時間だったが、先生もお疲れさん。"
"10005040-167-ネル" = "カリンとアカネが来たら、もうそれで終いだろ。"
"10005040-168-ネル" = "あいつも全然、あたしらのことに気づいて――"
"10005040-175" = "なんとなんと！こちらのアスナ様が、わずか10回目でAランクを獲得！"
"10005040-176" = "おめでとうございます！この勢いで一気にSランク、VIPとなるのでしょうか？"
"10005040-177-ネル" = "なさそう、だ、し……"
"10005040-181-ネル" = "……は？"
"10005040-182" = "[s15] \"アスナ……？\"\n[s16] \"今電光掲示板に、思いっきり大画面でアスナが……。\""
"10005040-183-ネル" = "え、え？嘘？"
"10005040-184-ネル" = "え、え？嘘？"
"10005040-185-白兎" = "えっ！？今のアスナ先輩じゃん！？"
"10005040-186-白兎" = "ど、どうしてここに……！？"
"10005040-187-白兎" = "っていうことは……。"
"10005040-188-白兎" = "もしかして……？"
"10005040-189-ネル" = "……ちっ。"
"10005040-193" = "[ns] \"こんにちは。\""
"10005040-194-白兎" = "うわああぁぁぁぁぁっ！？こんにちはぁぁぁ！？"
"10005040-195-白兎" = "ちょっと警備員さん！！ここに侵入者！侵入者がいるよーーーー！！！！"
"10005040-196-バニーガール・ガードA" = "なに、侵入者だと！？"
"10005040-197-白兎" = "あそこあそこ！"
"10005040-198-白兎" = "早く捕まえちゃって！"
"10005040-199-バニーガール・ガードA" = "総員集合！！侵入者と思しき者共を確保せよ！！"
"10005040-210-ネル" = "おい、先生。下がってろ。それから……"
"10005040-211-ネル" = "……こいつぁ、流石に見逃せ。"
