[translation]
"10012030-1" = "第3話;先手必勝"
"10012030-14-セリカ" = "……私たちのリゾートも、"
"10012030-15-セリカ" = "片付けたら案外キレイになったわね。"
"10012030-16" = "[s1] \"キレイになったよね「私たちのリゾート」”\n[s2] \"ちょっと愛着が湧いてきた？\""
"10012030-17-セリカ" = "ちょ、ちょっと言ってみたかっただけよ！……これなら泊まるのに十分よね。"
"10012030-18-セリカ" = "ちょ、ちょっと言ってみたかっただけよ！……これなら泊まるのに十分よね。"
"10012030-19-ノノミ" = "うんうん！セリカちゃんの言う通りです。このままホテルとしてお客様を迎えてもいいくらい☆"
"10012030-20-アヤネ" = "そ、それはまだ早いですよ……掃除しただけで、施設も機械もまだ全然動いてないですし……。"
"10012030-21-アヤネ" = "制御室を確認して、使える設備やシステムを再稼働させないと……"
"10012030-22-アヤネ" = "他の部屋の掃除もまだありますし……"
"10012030-23-アヤネ" = "……でも、部屋が片付いてるとスッキリしますね。"
"10012030-24-アヤネ" = "なんだか少し、部屋の中が輝いて見えます。"
"10012030-25-アヤネ" = "泊まる場所の片付けは終わりましたし、そろそろ制御室を……。"
"10012030-26-シロコ" = "……食料が先かも。"
"10012030-31-アヤネ" = "……食料？"
"10012030-33-シロコ" = "うん。食料。無人島で次に気にしなきゃいけないのは生存のための食料問題。"
"10012030-34-セリカ" = "……生存？"
"10012030-35-セリカ" = "別にそんな切羽詰まった状況じゃないと思うけど……ここはスマホの電波も飛んでるし、捨てられた船もあるし……。"
"10012030-36-シロコ" = "こういうところでは、魚で動物性たんぱく質を補給するのが最善。"
"10012030-37-シロコ" = "……ん。必ず獲るよ「生存」のために。"
"10012030-38-セリカ" = "……シロコ先輩、聞く耳持ってないわね。"
"10012030-42-シロコ" = "なんと、ここに釣りの道具が。"
"10012030-46-シロコ" = "……準備はできてる、行こう。"
"10012030-51-セリカ" = "……「なんと、ここに」じゃないでしょ。完全に準備してきてるじゃない。"
"10012030-52-ホシノ" = "シロコちゃんイキイキしてるねぇ。"
"10012030-53-ホシノ" = "……アヤネちゃん、どうやら制御室に行くのは後にした方が良さそうだよ。"
"10012030-55-アヤネ" = "まあ、食料も大事ですからね。電気は後からでもなんとかなりますし……。"
"10012030-56-アヤネ" = "先輩が釣りに興味があるなんて……初耳でした。"
"10012030-57-シロコ" = "サバイバル活動だから……釣りもその一環。"
"10012030-58-セリカ" = "……ああ、サバイバルがしたかったのね。"
"10012030-63-ホシノ" = "シロコちゃん一人じゃ危なくなっても続けそうだし……"
"10012030-64-ホシノ" = "先生、お願いしてもいい？"
"10012030-65" = "[s3] \"もちろん、任せて。\"\n[s4] \"行ってくるね。\""
"10012030-66-シロコ" = "……先生？"
"10012030-67-シロコ" = "……先生？"
"10012030-68-シロコ" = "一緒に行くの……？"
"10012030-70-ホシノ" = "ありがとう～じゃ、よろしくね先生。"
"10012030-71-ノノミ" = "私たちは他に何かないか、周辺を探してきますね！"
"10012030-72-セリカ" = "せっかくなら大物を頼んだわよ！"
"10012030-74-シロコ" = "……うん。"
"10012030-78-シロコ" = "任せて。"
"10012030-86" = "（シロコと一緒に海岸に向かった）"
"10012030-87" = "[ns5] \"この辺でいいかな？\"\n[ns6] \"良さそうな場所が多いね。\""
"10012030-88-シロコ" = "……うん、よし。ここで大丈夫。"
"10012030-89-シロコ" = "……うん、よし。ここで大丈夫。"
"10012030-90-シロコ" = "釣竿、餌、バケツ……いつでも始められるよ。"
"10012030-91" = "[s] \"釣った魚を持ち上げるタモ網は？\""
"10012030-92-シロコ" = "それは大丈夫。"
"10012030-93-シロコ" = "先生が釣竿を支えてくれる間に、"
"10012030-94-シロコ" = "私が撃てばいいから。"
"10012030-95" = "[s] \"なるほど……。\""
"10012030-99" = "[ns] \"……撃つ？\""
"10012030-100-シロコ" = "いちばん確実な釣りの方法。死んだ魚は逃げられない。"
"10012030-101-シロコ" = "……うん？"
"10012030-102-シロコ" = "銃で撃ったら魚が砕けちゃうんじゃないかって？"
"10012030-103-シロコ" = "……たしかに。"
"10012030-104" = "[s7] \"そこまでは考えてなかったのね。\"\n[s8] \"……タモ網を取りに行こっか。\""
"10012030-105-シロコ" = "……うん。"
"10012030-106-シロコ" = "……うん。"
"10012030-107-アヤネ" = "……大丈夫です、私が持って来てます。"
"10012030-108-シロコ" = "……あれ、アヤネ？"
"10012030-112-アヤネ" = "なんとなく心配でついて来てみたら……やっぱり。"
"10012030-113" = "[s9] \"アヤネ、どうしたの？\"\n[s10] \"来てくれたの？\""
"10012030-114-アヤネ" = "な、なんとなくお二人だけだと心配で……。"
"10012030-115-アヤネ" = "な、なんとなくお二人だけだと心配で……。"
"10012030-116-アヤネ" = "みんなもそう言ってたし……なので、あの……。"
"10012030-117-シロコ" = "……うん。ありがとう、アヤネ。"
"10012030-119-シロコ" = "じゃあ私が釣竿を持って、アヤネが拳銃で撃つってことで……。"
"10012030-120-アヤネ" = "だから撃っちゃダメですってば先輩……威力の問題じゃないですよ。"
"10012030-121-アヤネ" = "ちゃんとタモ網持ってきましたから、使ってください。"
"10012030-122-シロコ" = "……うん。"
"10012030-123" = "[s] \"シロコはアヤネの言うことはよく聞いてる気がする。\""
"10012030-124-アヤネ" = "……えっ！？"
"10012030-125-アヤネ" = "そ、そうなんですか……！？"
"10012030-126-シロコ" = "……うん。アヤネの判断は大体正しいから。"
"10012030-127-アヤネ" = "……シロコ先輩？"
"10012030-128-シロコ" = "アヤネが違うって言う時は、大体私も違うって思ってるし。みんなそうだと思うよ。"
"10012030-129-シロコ" = "ここで釣った魚たちも、調理をする前に食べていい魚なのか、毒はないのかとか……"
"10012030-130-シロコ" = "お金になる可能性はないのか……"
"10012030-132-シロコ" = "後でアヤネに聞くつもりだったの。"
"10012030-134-アヤネ" = "先輩……。"
"10012030-135-？？？" = "ここにいたのか！！"
"10012030-140-ラブ" = "あれ、さっきの連中じゃないような……？"
"10012030-141-ジャブジャブヘルメット団A" = "他に仲間がいたのかよ。"
"10012030-142-ジャブジャブヘルメット団B" = "なら、他の連中を呼ばれる前に……"
"10012030-144-アヤネ" = "あの……えっと、どちら様でしょう……？"
"10012030-146-ラブ" = "ふっふっふ……今回はうちらも負けないわよ。なんたって、こっちには「応援部隊」がいるのよ！！"
"10012030-147-ラブ" = "さあ、出番よ。給料分はちゃんと働いてちょうだいね、"
"10012030-148-ラブ" = "[ruby=・  ・  ・]ワカモ[/ruby]！！"
"10012030-153" = "[ns] \"……？\""
"10012030-155" = "[ns] \"……えっ\""
"10012030-157-ワカモ" = "あらあら……。"
"10012030-158-ワカモ" = "正直、ガッカリです。たったこれっぽっちの人数に苦戦、されていたんですか？"
"10012030-159-ワカモ" = "それでどうやってこの広いリゾートを狩り尽くすと言うんですか……たったの三人すら……"
"10012030-160-ワカモ" = "……ん？"
"10012030-161-ワカモ" = "その……お姿。"
"10012030-162-ワカモ" = "……もしかして"
"10012030-163-ワカモ" = "……先生？"
"10012030-164" = "[s11] \"……ワカモ？\"\n[s12] \"こんなところで、奇遇だね……。\""
"10012030-165-ワカモ" = "……？"
"10012030-166-ワカモ" = "……？"
"10012030-167-ワカモ" = "えっ……ど、どういう……？これは、一体どういう状況なのです……？"
"10012030-172-シロコ" = "……。"
"10012030-174-ワカモ" = "ま、待ってください……？まずは状況の整理を……。"
"10012030-178-ワカモ" = "……ひ、ひぃん！？"
"10012030-179" = "[s13] \"シロコ！？\"\n[s14] \"いきなり攻撃はちょっと……\""
"10012030-182-シロコ" = "……ん。"
"10012030-183-シロコ" = "先手必勝。先生、指揮をお願い。"
