"10012020-22-セリカ" = "あっ、先生！ちょうど良かった。ホシノ先輩見なかった？"
"10012020-23-セリカ" = "アヤネちゃんと先輩たちがヘリに物を取りに行ってる間、二人でちょっとこの辺を片付けようと思ったんだけど……。"
