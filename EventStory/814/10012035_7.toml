"10012035-44-アヤネ" = "もしかしてワカモという方はお知り合いだったり……？"
"10012035-45" = "[s3] \"えっと……話せば長くなるけど……。\"\n[s4] \"知らない方がいいかも……。\""
"10012035-48-シロコ" = "……。"
"10012035-49-シロコ" = "先生……。"
