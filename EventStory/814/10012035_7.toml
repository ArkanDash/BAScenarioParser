"10012035-11-ワカモ" = "せ、先生……？先生がどうして……ここに……？"
"10012035-12-ワカモ" = "先生は……えっ……？あれ？"
"10012035-14-ラブ" = "ワカモ、馬鹿！あんた何やってんの！"
"10012035-16-ラブ" = "ワカモってば！！"
"10012035-17-ジャブジャブヘルメット団B" = "完全に呆けてますけど。"
"10012035-18-ジャブジャブヘルメット団B" = "ま、まずは退却しましょうよ！連れ帰って、コイツがしっかりしたらまた来るとか……。"
"10012035-24-ジャブジャブヘルメット団A" = "あっ、イタタ、痛い！！"
