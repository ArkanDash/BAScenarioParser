"10012035-53-アヤネ" = "戦ってる間に、壊れてしまったみたいで……"
"10012035-57-シロコ" = "……？"
"10012035-61-シロコ" = "……！！！"
"10012035-63" = "（その後、落ち込んだシロコを慰めて、みんなでリゾートに帰った）"
