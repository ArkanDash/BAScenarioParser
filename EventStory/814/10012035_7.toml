"10012035-38-アヤネ" = "いったい誰だったんでしょうか……。"
"10012035-39-シロコ" = "セリカとホシノ先輩が言っていた……私たちのリゾートを奪おうとしていたやつらなのかも。"
"10012035-40-シロコ" = "……ね、先生？"
"10012035-41" = "[s1] \"大体はあってるけど……。\"\n[s2] \"ちょっと違うとこもあるけど……。\""
"10012035-42-アヤネ" = "そういえば、お一人、先生の名前を呼んでた方がいらっしゃいましたが……"
