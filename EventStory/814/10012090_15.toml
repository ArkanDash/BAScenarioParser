[translation]
"10012090-1" = "第9話;リゾート使用券の真実"
"10012090-6-ジャブジャブヘルメット団A" = "う、ううっ……。"
"10012090-7-ジャブジャブヘルメット団B" = "もうこれ以上は……む～り～……。"
"10012090-14-セリカ" = "……さあ、もう終わりよ！おとなしく降伏しなさい！"
"10012090-15-アヤネ" = "降伏するなら、私たちはこれ以上戦うつもりはありません。"
"10012090-17-ラブ" = "くっ……そんな……あり得ないわよ……。"
"10012090-18-ラブ" = "たった6人相手に、なんで……！？"
"10012090-19-ラブ" = "今までリゾート狩りで連勝してきた、うちらジャブジャブヘルメット団が負けるなんて……！？"
"10012090-21-シロコ" = "……連勝？"
"10012090-22-セリカ" = "……リゾート狩り？"
"10012090-23-ホシノ" = "またなんか変な話がでてきたねぇ～"
"10012090-25-ワカモ" = "……。"
"10012090-26" = "[s] \"……。\""
"10012090-28" = "[ns] \"……ワカモ。\""
"10012090-29-ワカモ" = "……申し訳ありません、あなた様。"
"10012090-30-ワカモ" = "私が至らないばかりに……。"
"10012090-31-ワカモ" = "ですが、このワカモ、絶対に諦めません……！必ずあなた様を……！"
"10012090-32-ワカモ" = "私にお時間をください。今度こそ、今度こそ必ず……！"
"10012090-33" = "[s1] \"ワカモ、それは誤解だよ。\"\n[s2] \"私は大丈夫だよ、ワカモ。\""
"10012090-34-ワカモ" = "……え？"
"10012090-35-ワカモ" = "……え？"
"10012090-39-ワカモ" = "……誤解……とは、どういう……。"
"10012090-40" = "[ns3] ワカモに近づく。\n[ns4] ワカモの頭を撫でる。"
"10012090-47-ワカモ" = "……！？"
"10012090-48-ワカモ" = "せ、先生……！？"
"10012090-49" = "[s5] \"水着姿、可愛いよ。\"\n[s6] \"ワカモの気持ちは、ちゃんと受け取ったから。\""
"10012090-54-ワカモ" = "……？……？"
"10012090-55-ワカモ" = "……あら？"
"10012090-56" = "[s] \"……あら……？\""
"10012090-57-ワカモ" = "し、し……。"
"10012090-58-ワカモ" = "失礼いたしましたー！！"
"10012090-63-セリカ" = "……結局なんだったのよ！？"
"10012090-65-ラブ" = "…………いや。"
"10012090-66-ラブ" = "うちは認めない……絶対に認めないからね！！"
"10012090-67-ラブ" = "これで諦めると思わないでよね！他の島を攻略した暁には……"
"10012090-68-ラブ" = "絶対にこの島も手に入れてやるんだから……！"
"10012090-69-ラブ" = "うちは……うちは必ずこの「リゾート群島」を統一して、ここの支配者になってやるんだから……！！"
"10012090-70-セリカ" = "い、いやいやいや、ちょっと待ってよ！"
"10012090-71-セリカ" = "認めないって……何を？"
"10012090-72-アヤネ" = "私達はリゾート券が当たってここに来たのですが……リゾート群島、とは？"
"10012090-73-セリカ" = "リゾートの統一とかなんとか……あんた達いったい何の話してんの？"
"10012090-78-ラブ" = "げぇ……マジか……。"
"10012090-79-ラブ" = "あんたら「リゾートハンター」じゃないの……？こんなんにうちら負けたの？マジあり得ないんだけど……。"
"10012090-80-ラブ" = "まぁ、いいよもう……何も知らないみたいだし、教えてあげる。"
"10012090-81-ラブ" = "あんたらがリゾート狩りをするつもりがなくても、うちらみたいなのには襲われ続けるわよ。"
"10012090-82-ラブ" = "この「群島」にいるやつらは全員敵ってワケ。"
"10012090-84-セリカ" = "……リゾート狩り？"
"10012090-85-シロコ" = "……群島？"
"10012090-86-アヤネ" = "それは、どういう……。"
"10012090-87-セリカ" = "ちょっと、人の話を聞きなさいよね！私らにはちゃんとここのリゾート使用権があるのよ？"
"10012090-89-ラブ" = "リゾート使用権なら、うちも持ってるわよ？"
"10012090-90-ラブ" = "ほら、これでしょ。"
"10012090-92-アヤネ" = "……えっ！？こ、これは一体……。"
"10012090-93-セリカ" = "なにこれ……私らと同じもの……？"
"10012090-95-ラブ" = "あんたら、何かの景品に当たってここに来たんじゃない？"
"10012090-97-セリカ" = "……！！"
"10012090-98-アヤネ" = "どうしてそれを……？"
"10012090-99-ラブ" = "ここにいる連中は皆、同じようになんらかの手段でコレを手に入れたから「群島」にやってきてんだよ。"
"10012090-100-ラブ" = "このリゾートを「使用」する権利を持ったやつらはうちら以外にも……"
"10012090-102-ラブ" = "……この群島全体にごまんといるのよ！"
"10012090-105-一同" = "えーーーーーっ！！？？"
"10012090-113-セリカ" = "そ、それって本当なの……？ちょっと、契約書どこ！？"
"10012090-114-アヤネ" = "ここにあります……あの方の言う通り、下の約款のところにびっしりと書かれています。"
"10012090-115-アヤネ" = "本契約書の当選者（以下契約者）は、「ロストパラダイスリゾート」の「使用権限」を得る。"
"10012090-116-アヤネ" = "上記の「使用権限」とはリゾート内全ての土地、物品及び設備全てに対する権限と……。"
"10012090-117-アヤネ" = "それによって生み出された、すべての収益と資源を所有できるものとして……"
"10012090-118-セリカ" = "……まさか「使用権」ってそういう意味だったの？"
"10012090-119-アヤネ" = "……やっと理解しました。これは、明白な毒素条項ですね。いわゆる、自身が不利益な条項のことです。"
"10012090-120-アヤネ" = "一見すると、島それぞれを契約したように書いてあるから、公正な取引に見えますが……"
"10012090-121-アヤネ" = "契約書の指す「ロストパラダイスリゾート」はこの群島全体。つまり、みんな同じ権利を持っているわけです。"
"10012090-122-アヤネ" = "契約書にある地図の場所がいくつかの島に分かれているから、最初はそれに気づかないだけで……"
"10012090-123-アヤネ" = "でも少しずつ……契約の「穴」を理解した人たちが、他の群島を攻撃し始めている……そういうことですね？"
"10012090-124-ラブ" = "そういう事。だから今うちらが「リゾート狩り」をしてるってワケ！！あんた達もそろそろ分かってきたんじゃない？"
"10012090-125-アヤネ" = "……はい。お互いにそれぞれの島を自分のものだと主張して戦ってる状況なんですね。"
"10012090-126-アヤネ" = "みなさん、ここは危険です。この契約書もこの島も……深入りしない方がいい。"
"10012090-127-アヤネ" = "私たちもこれ以上巻き込まれる前に、早くアビドスに帰った方が……。"
"10012090-129-ラブ" = "…………！！"
"10012090-130-ラブ" = "……隙あり！！"
"10012090-134-アヤネ" = "……！ゲホ、ゲホ！！ううっ！？"
"10012090-135-セリカ" = "煙幕弾……！？こんなものをまだ隠していたなんて……！"
"10012090-136-ラブ" = "これで終わりだと思わないでよね！次会った時は今みたいにやられないんだから！！"
"10012090-137-ラブ" = "いつまで寝てんのよ！！一旦退却するわよ！！ほら、総員退却！！"
"10012090-138-ジャブジャブヘルメット団A" = "は、はい！？あっ、た、退却！"
"10012090-139-ジャブジャブヘルメット団B" = "ホバークラフトへ退却ー！！"
"10012090-144-ノノミ" = "あら……行ってしまいましたね……。"
"10012090-146-ホシノ" = "……うへ。"
"10012090-148-ホシノ" = "……忙しないねぇ、本当に。"
