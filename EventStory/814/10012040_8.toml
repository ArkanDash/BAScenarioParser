[translation]
"10012040-1" = "第4話;先生を助けに参りました"
"10012040-2-ラブ" = "ねえ、どうなってんの？話が違うじゃん！！"
"10012040-4-ラブ" = "強いって噂は嘘だったの？"
"10012040-5-ラブ" = "ねえ、なんで黙ってんのよ！"
