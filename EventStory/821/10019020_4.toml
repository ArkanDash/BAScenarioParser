[translation]
"10019020-11-エイミ" = "防衛隊とパラシュート隊が合流。#n現在、最後の交戦中。"
"10019020-21-ネル" = "ははっ！結構やるじゃねーか！#nお前、気に入った！"
"10019020-22-ツルギ" = "ひゃっはははあぁーーっ！"
"10019020-26-エイミ" = "……あの二人、楽しそうだね。"
"10019020-27-イチカ" = "なかなか珍しい光景っすねぇ～"
"10019020-28-カリン" = "う、うーん……。"
"10019020-29-アカネ" = "それにしても……"
"10019020-36-アカネ" = "敵の数が全然減りません。"
"10019020-37-アカネ" = "これでは埒があきませんね……"
"10019020-42-？？？" = "……ご苦労、諸君！"
"10019020-43-アカネ" = "え、えっと……どちら様でしょうか？"
"10019020-51-イチカ" = "あれ、あの制服は……"
"10019020-52-アカネ" = "レッドウィンター……？"
"10019020-59-チェリノ" = "おいらこそが、このレッドウィンター連邦学園の生徒会長であり、環境美化部部長兼、書記長兼、清掃部部長兼、風紀委員長兼、給食部部長の――"
"10019020-60-チェリノ" = "偉大なるチェリノ様だ！！"
"10019020-61-チェリノ" = "カムラッドの救援要請を受けて、諸君たちを助けに来たぞ！#nこの一大事に、おいらが居なくては皆が困るだろうからな！"
"10019020-66-カリン" = "……。"
"10019020-67-ツルギ" = "……。"
"10019020-69-イチカ" = "えっーと……愉快なアクセサリーっすね。"
"10019020-70-アスナ" = "あれってヒゲ？#nあはははっ！すっご～い！"
"10019020-72-ネル" = "（何だあのヒゲ……か……カッケェ！？！？）"
"10019020-73-エイミ" = "……。"
"10019020-74-アカネ" = "……ええっと、応援部隊、なんですよね？"
"10019020-81-エイミ" = "そうだよ。レッドウィンターの応援部隊を確認。#nこれで互角に渡り合えそうだね。"
"10019020-84-ネル" = "おら！仕切り直しだ、行くぞ！！"
"10019020-85-ツルギ" = "きひひっ……"
"10019020-87-チェリノ" = "諸君、戦列を整えろ！ "
"10019020-88-チェリノ" = "これより、レッドウィンター大決戦を始める！"
