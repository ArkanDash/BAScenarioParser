[translation]
"10036110-1" = "エピローグ"
"10036110-3-サオリ" = "ふぅ。"
"10036110-4-サオリ" = "ステージが撤去されると、ずいぶん寂しくなったな。"
"10036110-13" = "[ns] \"おはよう、サオリ。\""
"10036110-15-サオリ" = "みんな……。"
"10036110-16-アツコ" = "サッちゃんは散歩中？"
"10036110-17-サオリ" = "あ、ああ……昨日のことを振り返っていたところだ。"
"10036110-18-サオリ" = "ステージに立っていたことが、いまだに信じられなくてな。"
"10036110-19-サオリ" = "……おかしくなかったのなら良いんだが。"
"10036110-20" = "[s1] \"すごく楽しかったよ！\"\n[s2] \"はしゃぎすぎて筋肉痛になったくらい！\""
"10036110-26-ヒヨリ" = "そ、そうですよ……雑誌で見た通りのイベントでした！"
"10036110-27-ミサキ" = "まぁ、悪くなかったよ。"
"10036110-28-アツコ" = "私も楽しかった。#nサッちゃんには、あんな才能があったんだね。"
"10036110-30-サオリ" = "さ、才能というわけでは……せっかくだ、少し歩こうか。"
"10036110-36-アツコ" = "静かだね……昨日の盛り上がりが嘘みたい。"
"10036110-37-アツコ" = "お祭りの施設も撤去されて、少し寂しいね。"
"10036110-38-ヒヨリ" = "そう、ですね……。"
"10036110-42-サオリ&アツコ&ミサキ&ヒヨリ" = "……。"
"10036110-49-アツコ" = "波の音に、眩しい陽射し……。"
"10036110-50-アツコ" = "誰もいない海って、こんな感じだったんだ。"
"10036110-51-ミサキ" = "早起きした甲斐があったね。"
"10036110-52-ミサキ" = "それでリーダー、悩みは解決した？"
"10036110-53-サオリ" = "な、何のことだ？"
"10036110-54-ミサキ" = "……はぁ。"
"10036110-55-ミサキ" = "何かに悩んでる時は、よくこうやって散歩してたでしょ。"
"10036110-56-ミサキ" = "それくらい、知ってるから。"
"10036110-57-サオリ" = "そ、そうか……。"
"10036110-58-アツコ" = "ふふっ。慌ててるサッちゃんも、可愛いね。"
"10036110-63-ミサキ" = "……まだ旅を続けるつもり？"
"10036110-64-ヒヨリ" = "自分探し、ですか？"
"10036110-66-サオリ" = "……そうだ。"
"10036110-67-サオリ" = "でも……今までとは少し、違うかもしれない。"
"10036110-68-サオリ" = "前は暗闇の中を走っているような気分だったが……。"
"10036110-69-サオリ" = "ほんの僅かに光が見えた気がする。"
"10036110-70-サオリ" = "だから、もうしばらく旅を続けてみようと思う。"
"10036110-71-サオリ" = "みんなには、申し訳ないと思っている……。"
"10036110-75-ミサキ" = "今さら謝る必要なんてないでしょ。"
"10036110-76-アツコ" = "サッちゃんのこと、応援してるから。#n私たちのことは心配しないで。"
"10036110-77-ヒヨリ" = "た、たまには連絡してくださいね……。"
"10036110-83-サオリ" = "……ありがとう、みんな。"
"10036110-84-サオリ" = "それと、先生も。"
"10036110-85" = "[s3] \"私も応援してるよ。\"\n[s4] \"何かあったら、いつでも呼んで。\""
"10036110-88-サオリ" = "ありがとう……。"
"10036110-89-アツコ" = "……ここでお別れ、かな。"
"10036110-91-サオリ" = "……あぁ、先に行ってくれ。#n今度は私が見送ろう。"
"10036110-93-ヒヨリ" = "気をつけてくださいね、サオリ姉さん……。"
"10036110-99-ミサキ" = "……怪我だけはしないで。"
"10036110-105-アツコ" = "またね、サッちゃん。"
"10036110-114-サオリ" = "……。"
"10036110-115" = "[s] \"サオリ、元気出して。\""
"10036110-116-サオリ" = "あの子たちは、もう行ったか？"
"10036110-117" = "[s] \"……ん？\""
"10036110-118-サオリ" = "みんなの前では伏せていたが……。"
"10036110-119-サオリ" = "……実は、バイト代をもらっていないんだ。"
"10036110-120" = "[s] \"え……？\""
"10036110-121-サオリ" = "ヘルメット団……やはり侮れないな。#nここまでキヴォトスで勢力を伸ばしただけはある。"
"10036110-122-サオリ" = "以前、先生は言っていた。#n仕事を続けていれば、色々なトラブルに巻き込まれる、と。"
"10036110-123-サオリ" = "些細な問題であれば目をつぶってやっていたが……。"
"10036110-124-サオリ" = "給料の未払いだけは、許してはならない！"
"10036110-125-サオリ" = "そこで頼みがあるんだが……。"
"10036110-126" = "[s] \"任せて、サオリ！\""
"10036110-127-サオリ" = "感謝する、先生。"
"10036110-132-サオリ" = "では、ヘルメット団の追撃を開始する！"
"10036110-134" = "（サオリの夏は、まだまだ続く！）"
"10036110-135" = "Sheside outside"
