[translation]
"10036150-1" = "スクワッドがゲームを楽しむ方法（３）"
"10036150-3-ゲームコーナーのスタッフ" = "なんと！#n中級も見事クリアです！"
"10036150-4-ゲームコーナーのスタッフ" = "ひょっとして、これは本日初の景品獲得者になるのでは！？"
"10036150-5-サオリ" = "段々慣れてきたな。"
"10036150-6-アツコ" = "次で最後だよ。"
"10036150-7-アツコ" = "少し寂しいね。#nこれ、もう一回遊べるの？"
"10036150-8-ゲームコーナーのスタッフ" = "申し訳ございません！#nお一人様、一回限りの挑戦となっております！"
"10036150-9-ゲームコーナーのスタッフ" = "何度もチャレンジできると、#n景品をすべて持っていけてしまいますので。"
"10036150-11-ミサキ" = "つまり、次のゲームで本当に最後ってことだね。"
"10036150-12-ミサキ" = "分かりやすくて助かるよ。"
"10036150-13-アツコ" = "じゃあ、始めよう。"
"10036150-20-アツコ" = "……サッちゃん、どうしたの？"
"10036150-24-アツコ" = "……具合でも悪い？"
"10036150-25-サオリ" = "いや、そうじゃない。"
"10036150-26-サオリ" = "もう最後なのか、と思っただけだ。"
"10036150-27-アツコ" = "……こうやって4人で遊ぶの、初めてだもんね。"
"10036150-29-ヒヨリ" = "そ、そうですよね……。"
"10036150-30-ミサキ" = "……。"
"10036150-31-アツコ" = "……ふふ、悔いが残らないよう頑張ろう。"
"10036150-35-サオリ" = "悔いのないよう、か……なるほど。"
"10036150-36-サオリ" = "全力で遊ぶとしよう……！"
"10036150-38-アツコ" = "みんな、準備はいい？"
"10036150-39-アツコ" = "絶対に勝って、ヒヨリのために景品をゲットしようね。"
"10036150-40-サオリ" = "ああ！"
"10036150-41-ミサキ" = "ここまで来たんだし、最後まで付き合ってあげるよ。"
"10036150-42-ヒヨリ" = "え、えへへ、ありがとうございます……。"
"10036150-46-ヒヨリ" = "でも、景品は……。"
"10036150-47-ゲームコーナーのスタッフ" = "次の難易度は、そう簡単にいかないでしょう！"
"10036150-48-ゲームコーナーのスタッフ" = "さあ、これが最後になります！"
"10036150-49-ゲームコーナーのスタッフ" = "果たして、景品をゲットできるのか！"
"10036150-50-ゲームコーナーのスタッフ" = "それとも、ここで脱落してしまうのか！"
"10036150-52-ゲームコーナーのスタッフ" = "上級、スタートです！"
