[translation]
"10036055-3-サオリ" = "……ふぅ。"
"10036055-5-司会者" = "ど、どうすれば……。"
"10036055-6-司会者" = "こ、このまま進行するのか？"
"10036055-7-司会者" = "こ、こほん！#n今回の優勝者は……！"
"10036055-8-司会者" = "パタパタヘルメット団です！"
"10036055-10-サオリ" = "（煙幕が晴れたら、全員倒れていた……）"
"10036055-11-サオリ" = "（これは、いったい……？）"
"10036055-13-パタパタヘルメット団A" = "え、えっと……とりあえず、優勝おめでとう？"
"10036055-14-パタパタヘルメット団B" = "聞いてた話と違うが……。"
"10036055-15-パタパタヘルメット団A" = "まあ、何とかなるだろ！#nよし、胴上げといくか！"
"10036055-16-パタパタヘルメット団一同" = "おーっ！"
"10036055-21-サオリ" = "ま、待ってくれ！#nそんな風に持ち上げたら――"
"10036055-31-ミサキ" = "ここまで離れたら大丈夫かな。"
"10036055-32-ヒヨリ" = "えへへ……サオリ姉さんにはバレてないですよね……？"
"10036055-33-ミサキ" = "あの顔は、まったく気づいてないと思う。"
"10036055-34-アツコ" = "サッちゃんは私たちが見てたなんて、知らないだろうね。"
"10036055-35" = "[s1] \"そ、そうだね。\"\n[s2] （ギクッ……）"
"10036055-38-ヒヨリ" = "で、でも優勝してますし、きっと今頃、喜んでいるはずです……！"
"10036055-39-ミサキ" = "むしろ、戸惑ってるかも。"
"10036055-40-ミサキ" = "ま、それで良いけど。"
"10036055-41-アツコ" = "このお祭りは、サッちゃんにとってどれも初めての経験だと思うから。"
"10036055-42-アツコ" = "楽しい思い出になってくれたら良いな。"
"10036055-43-アツコ" = "……一緒に過ごせたら、もっと嬉しかったけど。"
"10036055-44" = "[s] \"……アツコ。\""
"10036055-49-アツコ" = "……今は、これで充分。#nありがとう、先生。"
