[translation]
"10036035-13-ミサキ" = "次。"
"10036035-14-アツコ" = "お祭りの邪魔は、許さない。"
"10036035-16-スケバンB" = "こいつら、タダ者じゃねぇ……！"
"10036035-17-スケバンA" = "ど、どうするよ。逃げるか？"
"10036035-18-スケバンB" = "いや、DJを連れて行かないと……。"
"10036035-20-アツコ" = "そうはさせない。"
"10036035-22-スケバンB" = "くそっ、とりあえず撤退だ！"
"10036035-26-スケバンA&C" = "お、置いていくな！"
"10036035-31-ミサキ&アツコ" = "……これで終わり？"
"10036035-36-ヒヨリ" = "はい、敵の撤退を確認しました……。"
"10036035-37" = "[s] \"どうしてスケバンが……。\""
"10036035-38-ミサキ" = "さぁ？いつもみたいに騒いでるだけだと思うけど。"
"10036035-44-ミサキ" = "とりあえず、こいつを連れて行かれなくて良かった。"
"10036035-45-DJ B.o.B" = "んぐっ！"
"10036035-46-アツコ" = "待たせてごめんね、DJさん。"
"10036035-50-DJ B.o.B" = "ぷはあっ！"
"10036035-51-ミサキ" = "それで、話の続きだけど。"
"10036035-52-DJ B.o.B" = "……なぜ私を助けた？"
"10036035-53-DJ B.o.B" = "てっきり敵なんだとばっかり……。"
"10036035-54-アツコ" = "違う……ちょっとしたすれ違い。"
"10036035-55-アツコ" = "あなたがステージの準備中、#n嫌な態度を取ってたから怒っただけ。"
"10036035-56-ミサキ" = "自己中心的だし、高圧的だし、人に当たりすぎ。"
"10036035-62-ヒヨリ" = "そ、そうです……ひどいことは、もうしないでください……。"
"10036035-63-アツコ" = "理不尽な要求や暴言はダメ。"
"10036035-64-DJ B.o.B" = "そう、だな……。"
"10036035-65-DJ B.o.B" = "私が悪かった。"
"10036035-66-DJ B.o.B" = "人気が出て、調子に乗っていたのは事実だ。"
"10036035-67" = "[s] \"すんなり謝るんだ！？\""
"10036035-68-DJ B.o.B" = "危ない目に遭って、DJを志した理由を思い出したんだ……。"
"10036035-69-DJ B.o.B" = "もう、あんな苦労は……。"
"10036035-70-アツコ" = "うん、じゃあ行って良いよ。"
"10036035-71-ミサキ" = "もう良いの？"
"10036035-72-アツコ" = "うん、信じてあげたい。"
"10036035-73-アツコ" = "喧嘩をするために来たわけじゃないから。"
"10036035-74-ミサキ" = "……アツコがそう言うなら。"
"10036035-75-DJ B.o.B" = "あいつらから守ってくれて助かった、感謝する。"
"10036035-80-アツコ" = "……とりあえず、解決かな。"
"10036035-81-アツコ" = "あの人は、約束を守ってくれるはず。"
"10036035-84-サオリ" = "ふぅ……。"
"10036035-85-サオリ" = "次は、ターンテーブルか。"
"10036035-89-DJ B.o.B" = "じょ[ruby=じょうまえ]、錠前さ[/ruby]ん！"
"10036035-90-サオリ" = "戻ってきたか。#n指示通り、セッティングは――"
"10036035-91-DJ B.o.B" = "あ、ありがとう……。"
"10036035-92-DJ B.o.B" = "そ、そうだ。少し休んだらどうだ？#nずっと働いてくれてるだろ？"
"10036035-93-サオリ" = "良いのか……？"
"10036035-94-サオリ" = "細かい部分にまで、こだわりがあるんじゃ……。"
"10036035-95-サオリ" = "何か、あったのか？"
"10036035-96-DJ B.o.B" = "それはそうなんだが……。"
"10036035-97-DJ B.o.B" = "実は、さっき――"
"10036035-101" = "[ns] \"DJさん！\""
"10036035-102-DJ B.o.B" = "ひっ、あなたは……！"
"10036035-103" = "[s] \"DJさんも少し休憩したらどうですか？\""
"10036035-104-DJ B.o.B" = "そそそ、そうですね！#n失礼します！"
"10036035-108-サオリ" = "先生、どうしたんだ？"
"10036035-109-サオリ" = "そんな息を切らして……。"
"10036035-110" = "[s3] \"遠くからサオリを見かけて、つい。\"\n[s4] （ギリギリ間に合って良かった……！）"
"10036035-113-サオリ" = "もしかして……。"
"10036035-114-サオリ" = "みんなに何かあったのか！？"
"10036035-115" = "[s] \"大丈夫、アツコたちはお祭りを楽しんでるよ。\""
"10036035-116-サオリ" = "そうか、なら安心だ。"
"10036035-117-サオリ" = "メインイベントのDJステージにも期待していてくれ。"
"10036035-118-サオリ" = "私も準備を頑張ってきたからな。"
"10036035-119" = "[s] \"何かできることはないかな？\""
"10036035-120-サオリ" = "今のところは……。"
"10036035-124-サオリ" = "……あっ、すまない。#n気を悪くしないでくれ！"
