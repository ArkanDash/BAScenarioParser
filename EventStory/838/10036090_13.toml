[translation]
"10036090-1" = "第9話;アリウススクワッド、集結"
"10036090-5-アケミ" = "っ……！"
"10036090-7-ヘルメット団員A" = "あれ、さっきのバイトじゃないか？#n伝説のスケバンを一人で相手するなんて……！"
"10036090-8-ヘルメット団員B" = "ロケットランチャーをリロードさせないように立ち回っているような……。"
"10036090-9-ヘルメット団員B" = "ああ、たぶんそのために攻撃を仕掛け続けてるんだろうな！"
"10036090-16-アケミ" = "その機敏で優雅な動きは、まるで……。"
"10036090-17-アケミ" = "私が飼っている、ムササビの「カルレス君」のようですわね。"
"10036090-18-アケミ" = "きちんとご挨拶したい気持ちもありましたが……。"
"10036090-19-アケミ" = "今ばかりは、目障りで仕方ありません！"
"10036090-20-サオリ" = "お前がここを立ち去ればよいだけの話だ。"
"10036090-25-ヘルメット団一同" = "が、頑張れ！バイト！"
"10036090-26-ヘルメット団一同" = "頼んだぜ！"
"10036090-32-アケミ" = "……はぁ。"
"10036090-33-アケミ" = "本当に困りましたわね。"
"10036090-34-アケミ" = "矯正局に密告したヘルメット団に復讐するために、#nわざわざ来たというのに……。"
"10036090-35-アケミ" = "まさか、こんなところで邪魔をされるとは……。"
"10036090-36-アケミ" = "……そうですわね。#n人生は、山あり谷ありと申しますし。"
"10036090-37-アケミ" = "この程度で音を上げては、伝説のスケバンの名が廃りますわ。"
"10036090-38-アケミ" = "うふふっ！#nこれからは、気合を入れて活動するといたしましょう。"
"10036090-39-アケミ" = "ふんっ！"
"10036090-40-サオリ" = "……？"
"10036090-41" = "[s] \"……戦闘中に瞑想？\""
"10036090-48-アケミ" = "[ruby=くりはま]栗浜[/ruby]アケミ！#n加減せずにお相手いたしましょう！"
"10036090-49-アケミ" = "……はああっ！"
"10036090-53-サオリ" = "……！"
"10036090-54" = "[ns] \"サオリ、大丈夫！？\""
"10036090-55-サオリ" = "くっ！#n今の攻撃は……？"
"10036090-56-サオリ" = "装備が変わったわけでもないのに……。"
"10036090-57-サオリ" = "さっきよりも勢いが……！"
"10036090-58-アケミ" = "ええ。"
"10036090-59-アケミ" = "私が編み出した呼吸法には、#nスケバンの真髄が込められていますから！"
"10036090-60" = "[s] \"……す、スケバンの真髄？\""
"10036090-65-アケミ" = "ふ、ふぅ……やはり、このスキルは負担が大きすぎますわね。"
"10036090-66-アケミ" = "ですが、こうでもしなければ、あなたを倒すことはできませんでした。"
"10036090-67-サオリ" = "……そうか。"
"10036090-68-アケミ" = "うふふ……。"
"10036090-69-スケバンA" = "姐様！#nウチらも加勢します！"
"10036090-70-スケバンB" = "姐様を一人で戦わせたりしません！"
"10036090-71-アケミ" = "みんな……でも、これは私が始めた戦いですわ。#n皆さんを巻き込むわけには……。"
"10036090-72-スケバンA" = "いえ！#n姐様の戦いは、ウチらの復讐も同然です！"
"10036090-73-スケバンB" = "一生ついていきます、姐様！"
"10036090-75-サオリ" = "……驚いたな。"
"10036090-76-サオリ" = "一度の攻防で、ここまで士気を取り戻すとは。"
"10036090-77-サオリ" = "これが、信頼……か。"
"10036090-79-スケバン一同" = "行くぞ、お前たち！"
"10036090-86" = "[ns] \"サオリ……！\""
"10036090-87-サオリ" = "くっ……！"
"10036090-92-サオリ" = "……？"
"10036090-97-アツコ" = "久しぶり、サッちゃん。大変そうだね。"
"10036090-98-サオリ" = "……アツコ！"
"10036090-100-スケバンA" = "気をつけろ、ほかにも仲間が――"
"10036090-105-スケバンA" = "うぐっ……。"
"10036090-111-ヒヨリ" = "え、えへへ。#nとりあえず撃っちゃいましたけど……これで完全に敵扱いですよね？"
"10036090-116-ミサキ" = "……世話が焼けるんだから。"
"10036090-118-サオリ" = "ミサキ、ヒヨリ……。"
"10036090-119-ミサキ" = "ゆっくり話す余裕はなさそうだね。"
"10036090-126-サオリ" = "……。"
"10036090-127-サオリ" = "あぁ。"
"10036090-128-サオリ" = "つもる話は、あとにしよう。"
"10036090-132-サオリ" = "先生、指揮を！"
"10036090-133" = "[s3] \"任せて！\"\n[s4] \"アリウススクワッド、出撃だ！\""
"10036090-137-ヘルメット団一同" = "私たちも置いてかれるわけにはいかねぇ！"
"10036090-138-ヘルメット団一同" = "全員ついてこい！"
