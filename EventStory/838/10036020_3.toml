[translation]
"10036020-1" = "第2話;スクワッドの事情"
"10036020-3-アツコ" = "わがままを聞いてくれてありがとう。#n先生のおかげで、遠くまで来れた。"
"10036020-4-アツコ" = "こんな場所があったんだね。"
"10036020-5-アツコ" = "こうして人目につく場所を歩くのは、まだ慣れないかも。"
"10036020-6-アツコ" = "まるで、別世界に来たみたい。"
"10036020-8-ヒヨリ" = "わ、私たち、こんな幸せで良いんでしょうか……？"
"10036020-9-ヒヨリ" = "じ、実はこのビーチがヴァルキューレの罠だったりして……！"
"10036020-10-ヒヨリ" = "お祭りは嘘で、本当は犯罪者を一掃するための計画だったり……！？"
"10036020-11-ヒヨリ" = "終わりです！このままじゃ矯正局送りです！#n牢屋入りになってしまいます……！"
"10036020-12-ヒヨリ" = "先生が買ってくれたアイスが、最後の晩餐に……！"
"10036020-13" = "[s] \"お、落ち着いて、ヒヨリ。\""
"10036020-17-ミサキ" = "ここでヘルメット団主催のお祭りが開かれるのは間違いないよ。"
"10036020-18-ミサキ" = "正確には「ヘルメット団総連合会」って言うらしいけど……規模も大きいし、色々と手が込んでる。"
"10036020-19-ミサキ" = "ヴァルキューレに、これほど大掛かりな罠を用意できるとは思えないかな。"
"10036020-20-ヒヨリ" = "そ、そうなんですか？#nじゃあ、安心して良いんですね？"
"10036020-21-ミサキ" = "……まぁ、とりあえずはね。"
"10036020-23-アツコ" = "先生が一緒にいてくれるなら、大丈夫。"
"10036020-24-アツコ" = "そうでしょ、先生？"
"10036020-25" = "[s] \"もちろん。\""
"10036020-26-アツコ" = "ふふっ、頼もしいね。"
"10036020-27" = "[s1] \"みんなでお祭り楽しもうね。\"\n[s2] \"アツコも、ヒヨリも、ミサキも。\""
"10036020-30-アツコ" = "いろんな写真を、いっぱい撮りたいな。"
"10036020-31-ヒヨリ" = "え、えへへ、私は海の家で焼きそばと焼きトウモロコシを……#nあ、デザートにかき氷も食べたいです……。"
"10036020-32-ミサキ" = "騒がしい場所はあんまり好きじゃないし、#nお祭りには興味ないけど……"
"10036020-33-ミサキ" = "アツコとヒヨリがそうしたいなら、付き合うよ。"
"10036020-34-ミサキ" = "海の家のほかにも、砂のお城大会、水鉄砲大会……#nあと、DJステージも準備されてるんだって。"
"10036020-35" = "[s] \"興味ないと言いつつ、結構詳しいね……？\""
"10036020-36-ミサキ" = "今は臨時のリーダーだから。ちょっと調べただけ。"
"10036020-40-ミサキ" = "……なに笑ってるの、アツコまで。"
"10036020-41-アツコ" = "ふふっ、ミサキも楽しもうね。"
"10036020-42-ミサキ" = "くっ……！"
"10036020-43" = "[s3] \"じゃあ、軽く見て回ろうか？\"\n[s4] \"まずは会場を一周してみよう。\""
"10036020-46-アツコ" = "うん、行こう。"
"10036020-47-ヒヨリ" = "えへへ、楽しみですね……。"
"10036020-48-ミサキ" = "……はぁ。"
"10036020-51-アツコ" = "美味しそうな匂いがするね。"
"10036020-52-アツコ" = "先生、何か食べる？"
"10036020-53" = "[s] \"うん、ミサキとヒヨリはどうする？\""
"10036020-54-ヒヨリ" = "わ、私も食べます！#nえへへ、やっと美味しいご飯を……。"
"10036020-55-ミサキ" = "……待って。"
"10036020-59-アツコ" = "どうしたの、ミサキ。"
"10036020-60-ミサキ" = "……間違いない。"
"10036020-61-ミサキ" = "あそこ、見て……！"
"10036020-63-サオリ" = "注文したトーストと目玉焼きだ。#nさっさと……いや、ごゆっくりどうぞ。"
"10036020-64-客A" = "おい、注文と違うじゃねーか。#n半熟っつったろーがよ！"
"10036020-65-客A" = "こんなん食べてられっかよ！"
"10036020-66-サオリ" = "す、すまない。すぐに新しい物を持ってくる！"
"10036020-67-客B" = "すいませーん。#n注文してから30分も経ってるんですけど、まだですか……？"
"10036020-68-サオリ" = "もう少し待ってくれ！"
"10036020-69-客C" = "これ、頼んだ覚えないんすけど……。"
"10036020-70-サオリ" = "す、すまない……！"
"10036020-82-アツコ" = "サッちゃんだ……。"
"10036020-87-ヒヨリ" = "サオリ姉さんが、どうしてここに……？"
"10036020-88" = "[s] \"サオリ……？\""
"10036020-89-ミサキ" = "……。"
"10036020-90-ミサキ" = "あんなところで何してんの……。"
"10036020-91-ヒヨリ&ミサキ" = "サオ――"
"10036020-97-ヒヨリ&ミサキ" = "――っ！？"
"10036020-98-アツコ" = "しっ、二人とも静かに。#nこっち来て。"
"10036020-99-アツコ" = "先生も。"
"10036020-103" = "[ns5] \"どうしたの？\"\n[ns6] \"サオリに声かけないの？\""
"10036020-107-アツコ" = "……邪魔しちゃ、ダメだと思う。"
"10036020-108-アツコ" = "サッちゃんは今、自分探し中だから。"
"10036020-110-ヒヨリ" = "振り回されてるようにしか見えないですけど……。"
"10036020-111-ミサキ" = "……。"
"10036020-113-アツコ" = "サッちゃんなりに頑張ってるんだと思う。"
"10036020-114-アツコ" = "ああやって働くのも、きっと大事だから。"
"10036020-115-アツコ" = "今はサッちゃんの邪魔しないようにしよう。"
"10036020-117-ヒヨリ" = "でも、挨拶くらいはしても良いんじゃないですか……？"
"10036020-119-アツコ" = "ううん。#nサッちゃんは優しいから、私たちがいるって知ったら色々と気を遣うと思う。"
"10036020-120-アツコ" = "だから、今は遠くから見守りたい。"
"10036020-122-ヒヨリ" = "そ、そうですね……サオリ姉さん、すごく忙しそうですし……。"
"10036020-123-ミサキ" = "……まぁ、気を遣わせたら悪いし。"
"10036020-125-アツコ" = "先生はどう思う？"
"10036020-126" = "[s] \"たしかに、サオリは気を遣うかもしれないね。\""
"10036020-127-アツコ" = "ふふっ、秘密作戦みたい。"
"10036020-128-アツコ" = "せっかくだから、サッちゃんの働く姿、撮っておこうかな。"
"10036020-130-ミサキ" = "リーダーにバレないようにするんじゃなかったの？"
"10036020-132-アツコ" = "大丈夫。#nこうやって、ズームすれば……。"
"10036020-133" = "[s] \"見つからないかな……？\""
"10036020-134-アツコ" = "ふふ、良い写真が撮れそう。"
"10036020-135-アツコ" = "はい、チーズ。"
"10036020-140-アツコ" = "サッちゃんの仕事姿……ふふっ。"
"10036020-141-ヒヨリ" = "み、見つかったら、サオリ姉さんに怒られるんじゃ……。"
"10036020-142-ミサキ" = "その時はその時、だよ。"
"10036020-143-アツコ" = "ちゃんと撮れてるかな……？"
"10036020-144-アツコ" = "良かった、ちゃんと撮れてる。"
"10036020-145-ヒヨリ" = "よく撮れてます……。"
"10036020-146-ミサキ" = "古いけど、それなりに使えるんだね。"
"10036020-148-アツコ" = "うん。このカメラ、海に行くことが決まってから、#n頑張ってお金を貯めてブラックマーケットで買ったの。"
"10036020-149-アツコ" = "ちゃんと動いてくれて、良かった。"
"10036020-150-ヒヨリ" = "ビーチの写真を残すなんて、私たちにはもったいない贅沢ですね……。"
"10036020-151-アツコ" = "じゃあ、そろそろ行こっか。"
"10036020-152-アツコ" = "あんまり長居したら、サッちゃんに見つかっちゃう。"
"10036020-153-ミサキ" = "そうだね。"
"10036020-154-ヒヨリ" = "は、はい……！"
"10036020-159-アツコ" = "……先生。"
"10036020-160" = "[s] \"うん？\""
"10036020-161-アツコ" = "……サッちゃんの力になってあげたいんだ。"
"10036020-162-アツコ" = "せっかくなら、お祭りを楽しんでほしいから。"
"10036020-163-アツコ" = "いつも頑張って、苦労してるところを見てきたから……#n今日は私が、サッちゃんの夏を守りたいの。"
"10036020-164-アツコ" = "うん……サッちゃんはズッ友だから。"
"10036020-165" = "[s] \"ず、ズッ友……？\""
"10036020-166-アツコ" = "うん、「ずっと友だち」って意味らしいよ。"
"10036020-167-アツコ" = "だから先生、助けてくれる？"
"10036020-168" = "[s] \"もちろんだよ。\""
"10036020-169-アツコ" = "ありがとう……先生ならそう言ってくれると思ってた。"
"10036020-170-アツコ" = "行こう、ミサキたちが待ってる。"
"10036020-172" = "（その後、アツコたちと一緒にお祭り会場を回っていると……）"
"10036020-173" = "（途中で財布を落としてしまった）"
"10036020-176" = "[ns] \"たしか、この辺で落としたような……。\""
"10036020-186" = "[ns] \"どこだろう……。\""
"10036020-188-？？？" = "探し物はコレか？"
"10036020-189" = "[s] \"あっ。\""
"10036020-191-サオリ" = "これから届けにいこうと思っていたところだが――"
"10036020-192-サオリ" = "持ち主なら、ちょうど良か……なっ！"
"10036020-196" = "[ns] \"さ、サオリ！？\""
"10036020-197-サオリ" = "[USERNAME]先生がどうしてここに！？"
"10036020-198" = "[s] \"す、少し事情があってね。\""
"10036020-199-サオリ" = "もしかして、今日もパトロールか？"
"10036020-200-サオリ" = "相変わらず、先生は忙しそうだな。"
"10036020-201-サオリ" = "しかし……まさか会えるとは思わなかった。"
"10036020-202" = "[s] \"そうだね、サオリも元気にしてた？\""
"10036020-203-サオリ" = "ああ、おかげさまでな。"
"10036020-204-サオリ" = "先生に教わった通り、最近は色々な仕事に挑戦している。"
"10036020-205-サオリ" = "「アウトロービーチ」に来たのも、その一環だ。"
"10036020-206-サオリ" = "ところで――"
"10036020-210-サオリ" = "……！"
"10036020-211-サオリ" = "先生、隠れるぞ！"
"10036020-229-サオリ" = "……こちらには気づかなかったようだな。"
"10036020-230-サオリ" = "急に引っ張って、すまなかった。"
"10036020-231" = "[s7] （アツコたちも来ていると知ってしまった……）\n[s8] \"挨拶しなくて良いの……？\""
"10036020-234-サオリ" = "アツコ、ミサキ、ヒヨリ……久しぶりだな。"
"10036020-235-サオリ" = "本当は、会って話をしたかったが……"
"10036020-236-サオリ" = "……今の私に、そんな資格はない。"
"10036020-237" = "[s] \"……。\""
"10036020-238-サオリ" = "先生は、「資格なんて必要ない」とでも言うだろう。"
"10036020-239-サオリ" = "だが……まだ心の準備ができていない。"
"10036020-240-サオリ" = "どんな顔で会えば良いのか……。"
"10036020-241-サオリ" = "きっと、アツコたちは迎え入れてくれるだろう。"
"10036020-242-サオリ" = "でも、それに甘えてはいけないと思っている。"
"10036020-243-サオリ" = "だから……今はまだ会えない。"
"10036020-244-サオリ" = "……もちろん、これは私の[ruby=わがまま]我儘[/ruby]だ。"
"10036020-245-サオリ" = "すまない、先生。"
"10036020-246" = "[s] \"サオリ……。\""
"10036020-247-サオリ" = "……先生。#n厚かましいのは承知のうえで、ひとつ頼みがある。"
"10036020-248" = "[s] \"頼み？\""
"10036020-249-サオリ" = "みんなは海を初めて見るはずだ。"
"10036020-250-サオリ" = "少なくとも、アリウスにいた頃に見る機会はなかったからな。"
"10036020-251-サオリ" = "だから、この時間を楽しんでもらいたい。"
"10036020-252-サオリ" = "海に砂浜、屋台、DJステージ……。"
"10036020-253-サオリ" = "きっと、どれも未知の体験だろう。"
"10036020-254-サオリ" = "先生、みんなが楽しい時間を過ごせるよう、手を貸してほしい。"
"10036020-255-サオリ" = "……頼れるのは、先生しかいないんだ。"
"10036020-256-サオリ" = "もちろん、できる限りのことは自分でもやる。"
"10036020-257-サオリ" = "みんなにお祭りを楽しんでもらえるのなら、何だって……。"
"10036020-258" = "[s9] \"うん、分かった。\"\n[s10] \"任せて、サオリ。\""
"10036020-261-サオリ" = "ありがとう、先生。#nこの恩は絶対に忘れない。"
"10036020-262-ヘルメット団員" = "おーい、そろそろ作業を再開するぞ！"
"10036020-263-サオリ" = "すまない、行かなくては……。"
"10036020-264" = "[s] \"うん、何かあったらいつでも連絡してね。\""
"10036020-265-サオリ" = "助かる。"
"10036020-274-サオリ" = "それと……先生も、ぜひお祭りを楽しんでいってくれ。"
