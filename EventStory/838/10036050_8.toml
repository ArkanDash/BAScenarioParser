[translation]
"10036050-1" = "第5話;ヘルメット団水鉄砲大会"
"10036050-3-サオリ" = "ただいま戻った。"
"10036050-4-DJ B.o.B" = "あっ[ruby=じょうまえ]、錠前さ[/ruby]ん！"
"10036050-5-サオリ" = "おかげでゆっくりできた、礼を言おう。"
"10036050-6-サオリ" = "次の仕事は……。"
"10036050-7-DJ B.o.B" = "だ、大丈夫だ！#nゆっくりしていてくれ！"
"10036050-11" = "[ns] （さっきの印象が強かったのかな……）"
"10036050-12-サオリ" = "いや、給料をもらっている以上、#n何もしないわけにはいかない。"
"10036050-13-サオリ" = "ステージ近くの掃除でも……"
"10036050-17-？？？" = "そこの君、手が空いてるのか？"
"10036050-23-ヘルメット団員" = "ちょっと助けてほしいんだ！"
"10036050-24-ヘルメット団員" = "実は人手が足りなくてな。"
"10036050-26-サオリ" = "すまない。"
"10036050-27-サオリ" = "ここを離れるわけには……。"
"10036050-28-DJ B.o.B" = "いやいや、私のことは気にしなくて良いぞ！#n行ってきなさい！"
"10036050-29-サオリ" = "ほ、本当に良いのか……？"
"10036050-31-DJ B.o.B" = "もちろんだ！"
"10036050-32-サオリ" = "私にできることがあれば手伝いたいのだが……。"
"10036050-33-ヘルメット団員" = "そういえば、何をするのか説明してなかったな。#n実は水鉄砲大会に出てもらいたいんだ！"
"10036050-38" = "[ns] \"面白そうだね。\""
"10036050-39-サオリ" = "先生もそう言うのなら……。"
"10036050-40-サオリ" = "分かった、すぐ行こう。"
"10036050-44" = "[ns] （三人のところへ行ってみよう……）"
"10036050-47-アツコ" = "あっ、先生。"
"10036050-48-アツコ" = "どこ行ってたの？#nお昼、一緒に食べたかったのに。"
"10036050-49" = "[s1] \"ちょっと事情があって。\"\n[s2] \"ちょっと用事ができて。\""
"10036050-52-ヒヨリ" = "ざ、残念です……実は、さっき何かに当選して……#n食べ物をたくさん頂いたんです。"
"10036050-53-ヒヨリ" = "先生も、あの場にいらしたら……。"
"10036050-54" = "[s] \"大丈夫だよ、私も食べてきたから。\""
"10036050-55-アツコ" = "じゃあ、またサッちゃんの様子を見に行こう。"
"10036050-56-ミサキ" = "どうせまだステージの準備中でしょ。"
"10036050-61-お祭り案内放送" = "あーあー、こほん！#nヘルメット団からのお知らせだ！"
"10036050-62-お祭り案内放送" = "このあと、ビーチの競技場で各支部のチャンピオンを競う「水鉄砲大会」が開催される！"
"10036050-63-お祭り案内放送" = "盛り上がること間違いなし！#n揃って見に来てくれ！"
"10036050-64-お祭り案内放送" = "以上で放送を終了する！"
"10036050-68" = "[ns] （なら、サオリはビーチに……）"
"10036050-69-ミサキ" = "水鉄砲大会……？"
"10036050-70-アツコ" = "実弾は使わないのかな。"
"10036050-71" = "[s] \"私たちも見に行こう！\""
"10036050-72-ヒヨリ" = "あれ、サオリ姉さんのところに行くんじゃないんですか？"
"10036050-73-ヒヨリ" = "呑気に大会なんて見ていても、良いんですかね……。"
"10036050-74" = "[s] \"もしかしたら、サオリもいるんじゃないかな。\""
"10036050-75-アツコ" = "たしかに……。"
"10036050-76-アツコ" = "みんな、会場に向かってるね。"
"10036050-79-司会者" = "現在、アウトロービーチにはヘルメット団が勢揃いです！"
"10036050-80-司会者" = "観客も続々と集まってきましたね。"
"10036050-81-司会者" = "皆さん、盛り上がっていますか！？"
"10036050-82-司会者" = "今日、最強のヘルメット団が決定します！"
"10036050-83-司会者" = "さあ、最後に立っているのは誰なのか！？"
"10036050-84-司会者" = "これより、水鉄砲大会の開幕です――！"
"10036050-91-パタパタヘルメット団幹部" = "お前ら、よく聞けよ。"
"10036050-92-パタパタヘルメット団幹部" = "ウチらパタパタヘルメット団は、何もしなくて良い。"
"10036050-93-パタパタヘルメット団幹部" = "分かったな？"
"10036050-98-パタパタヘルメット団一同" = "分かってるって。"
"10036050-99-サオリ" = "（どうしてこんな状況に……）"
"10036050-104-パタパタヘルメット団幹部" = "まあ、どうせ結果は決まってるからな。"
"10036050-105-サオリ" = "それはどういう意味だ？"
"10036050-106-パタパタヘルメット団幹部" = "……ん？"
"10036050-107-パタパタヘルメット団幹部" = "えーと、呼ばれた時に聞いてなかったのか？"
"10036050-108-サオリ" = "……。"
"10036050-109-サオリ" = "ああ。"
"10036050-110-サオリ" = "もちろん任せてくれ。"
"10036050-111-サオリ" = "全力で行こう。"
"10036050-112-パタパタヘルメット団幹部" = "……は？"
"10036050-114-司会者" = "ルールは簡単！"
"10036050-115-司会者" = "この水鉄砲を使って……え？本物に見えるって？#nどう見ても水鉄砲じゃないか！"
"10036050-116-司会者" = "ともかく、これを使って最後まで立っていたチームが優勝です！"
"10036050-117-司会者" = "それでは各自、スタート位置へ移動してください！"
"10036050-120-ヒヨリ" = "うわっ……人が多すぎます……！"
"10036050-121-アツコ" = "こんなにたくさんの人が……。"
"10036050-122-ミサキ" = "ヘルメット団のほとんどが来てるんじゃない？"
"10036050-123-ヒヨリ" = "ど、どこか高いところに……#nあっ、先生、ちょっと良いですか……？"
"10036050-124" = "[s3] \"おんぶで大丈夫？\"\n[s4] \"落ちないように気をつけてね。\""
"10036050-132-ヒヨリ" = "え、えへへ……#nせっかくなので、肩車をしていただけませんか……？"
"10036050-133" = "[s5] \"うん、分かった。\"\n[s6] ヒヨリを肩に乗せる。"
"10036050-139-ヒヨリ" = "えへへ……高いですね、特等席です……！"
"10036050-140-ヒヨリ" = "なんだかズルしてるような気も……。"
"10036050-141-ヒヨリ" = "……あれ？"
"10036050-143-アツコ" = "どうかした？"
"10036050-149-ヒヨリ" = "「パタパタヘルメット団」の旗を見てください！"
"10036050-150-ヒヨリ" = "すぐ下に、サオリ姉さんが……！"
"10036050-155-アツコ" = "……本当だ。"
"10036050-156-ミサキ" = "今度はどうしてこんなところに……。"
"10036050-157-ヒヨリ" = "サオリ姉さん、目が怖いです……#n完全にリーダーの目をしています……！"
"10036050-158-アツコ" = "サッちゃん、大会に参加したんだね。"
"10036050-159-アツコ" = "……楽しんでるみたいで、良かった。"
"10036050-160-ミサキ" = "楽しんでる……のかな？"
"10036050-161-ヒヨリ" = "サオリ姉さん、勝てるんでしょうかね……？"
"10036050-162-ミサキ" = "まぁ、ヘルメット団が相手なら心配ないと思うけど……。"
"10036050-163-ミサキ" = "相手の数によるかな。"
"10036050-164-アツコ" = "もし負けちゃっても……。"
"10036050-165-アツコ" = "サッちゃんが楽しめたなら、それで良いと思う。"
"10036050-168-野次馬のヘルメット団A" = "なんか盛り上がってるなぁ。#n結果なんて決まりきってるのによ。"
"10036050-169-野次馬のヘルメット団B" = "本当だぜ、まったくよ。"
"10036050-170-野次馬のヘルメット団A" = "「トゲトゲヘルメット団」が勝つことになってんだよな？"
"10036050-171-野次馬のヘルメット団A" = "みんな知ってると思ってたぜ。"
"10036050-172-野次馬のヘルメット団B" = "ま、こういう雰囲気は嫌いじゃないし放っておくか。"
"10036050-176" = "[ns] \"ヤラセ……？\""
"10036050-181-アツコ" = "……見過ごせない。"
"10036050-182-ヒヨリ" = "サオリ姉さん、あんなに頑張ってるのに、ひどいです……！"
"10036050-183-ミサキ" = "……リーダーに知らせないと。"
"10036050-189-ヒヨリ" = "え、えへへ……#n先生、私はもう少し肩車をしてもらっても良いですか？"
"10036050-192-司会者" = "よーい……。"
"10036050-194-司会者" = "スタート！"
"10036050-195-サオリ" = "ふっ！"
"10036050-199-デコボコヘルメット団A" = "は、早い！"
"10036050-200-デコボコヘルメット団B" = "なんだアイツ！？"
"10036050-210-サオリ" = "次！"
"10036050-211-びりびりヘルメット団" = "こっちだぜ！"
"10036050-216-びりびりヘルメット団" = "なっ！？"
"10036050-221-びりびりヘルメット団" = "うわっ！"
"10036050-227-司会者" = "ど、どうなってるんだ？"
"10036050-228-司会者" = "台本と違うぞ……。"
"10036050-229-司会者" = "スタッフ！スタッフはいないのか！？"
"10036050-231-びしょびしょヘルメット団" = "話が違うだろ！"
"10036050-232-びしょびしょヘルメット団" = "チッ！#nしゃあない、アイツを倒すしかねぇ！"
"10036050-233-デコボコヘルメット団" = "もしかして、ヤラセがバレないよう演技してるのか？"
"10036050-234-びりびりヘルメット団" = "知るか！#nとりあえず倒すぞ！"
"10036050-236-サオリ" = "数で押し込むのは良い作戦だが……。"
"10036050-237-サオリ" = "支部同士の争いなんじゃなかったか？"
"10036050-244-ヘルメット団一同" = "やれ――！"
"10036050-251-ヘルメット団一同" = "うわっ！？"
