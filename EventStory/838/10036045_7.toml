"10036045-70-ヒヨリ" = "うわぁぁぁぁあああああん！ありがとうございますぅぅぅぅ！"
"10036045-71-ヒヨリ" = "いつもつらいことばっかだったのに！#nまさかこんな幸せが訪れるなんてぇぇぇ！"
"10036045-72-アツコ" = "よく分からないけど、良かった。"
"10036045-73-アツコ" = "冷めないうちに食べよう。"
"10036045-74-ヒヨリ" = "はい……！これが、焼きそば……！"
