[translation]
"10036010-1" = "第1話;海とサオリと"
"10036010-6-ヘルメット団員A" = "オーライ！オーライ！"
"10036010-7-ヘルメット団員A" = "大きい荷物から運んでいけ！"
"10036010-8-ヘルメット団員B" = "はいっ！"
"10036010-9-ヘルメット団員A" = "おーい、ちょっと良いか？"
"10036010-14-サオリ" = "……私か？"
"10036010-15-ヘルメット団員A" = "顔色が悪そうだが、大丈夫か？"
"10036010-16-サオリ" = "ああ、いや……。"
"10036010-17-サオリ" = "こんな明るい時間に堂々と動いて、良いのかと思ってな。"
"10036010-18-サオリ" = "……他の学園の治安維持部隊に見つかっても大丈夫なのか？"
"10036010-19-ヘルメット団員A" = "もしかして、新入りか？"
"10036010-20-ヘルメット団員A" = "「アウトロービーチ」は自由の地なんだ！"
"10036010-21-サオリ" = "自由の地……？"
"10036010-25-ヘルメット団員A" = "ああ！その通り！"
"10036010-26-ヘルメット団員B" = "ここは3つの自治区の境になっているから、管轄が曖昧になっているんだ。"
"10036010-27-ヘルメット団員B" = "ヴァルキューレの連中が出しゃばってくるかもしれないが……#nあのノロマたちが来たところで、何になるって話だ。"
"10036010-28-ヘルメット団員A" = "奴らが嗅ぎつけた頃には、もう総連合会は終わってるはずさ。"
"10036010-30-サオリ" = "そうか。#nだからヘルメット団のような不良集団が、こうも大胆に活動しているのか……。"
"10036010-32-ヘルメット団員A&B" = "ふ、不良集団！？"
"10036010-34-サオリ" = "……違ったか？#nすまない、謝罪する。"
"10036010-36-ヘルメット団員A" = "いや、謝ってほしいわけじゃ……。"
"10036010-37-ヘルメット団員B" = "たしかに不良の集まりではあるが……。"
"10036010-39-サオリ" = "ひとまず、この荷物を運べば良いんだな？"
"10036010-44-ヘルメット団員A" = "あの重たい鉄棒を3本同時に……。"
"10036010-45-ヘルメット団員B" = "こりゃ、大助かりだな。"
"10036010-47-サオリ" = "どこに置くんだ？"
"10036010-49-ヘルメット団員A" = "あ、ああ！#n砂浜に2メートル間隔で並べてくれ！"
"10036010-54-サオリ" = "よし、これで最後だな。"
"10036010-55-サオリ" = "次は……。"
"10036010-58-ヘルメット団C" = "そこの人！"
"10036010-59-ヘルメット団C" = "ちょっと手伝ってもらえないかな？"
"10036010-60-サオリ" = "ああ、任せてくれ。"
"10036010-62-ヘルメット団C" = "よいしょ、っと。"
"10036010-63-サオリ" = "ふっ！"
"10036010-67-ヘルメット団C" = "ありがとう、おかげで助かったよ！"
"10036010-68-サオリ" = "礼は不要だ。"
"10036010-69-サオリ" = "契約書には、護衛以外の仕事にも協力するよう書かれていたからな。"
"10036010-70-ヘルメット団C" = "真面目というか、ちょっと変わってるのかな？"
"10036010-71-サオリ" = "変わっている、だと……？"
"10036010-72-ヘルメット団D" = "おーい、こっちにも来てくれ！"
"10036010-73-ヘルメット団D" = "ビーチバレーのコートを作りたいんだけど、#n人手が足りないんだ。"
"10036010-74-サオリ" = "ああ、分かった。"
"10036010-79-サオリ" = "……ふぅ。#nこれで作業は一区切りか。"
"10036010-80-サオリ" = "そろそろ護衛の準備を……。"
"10036010-84-サオリ" = "あっ……。"
"10036010-89-サオリ" = "（そういえば、聞いたことがあったな）"
"10036010-90-サオリ" = "（地の果てには、広大な海があるという話を）"
"10036010-91-サオリ" = "（しかし、実際に目にするのは初めてだ……）"
"10036010-92-サオリ" = "……。"
"10036010-100-サオリ" = "……。"
"10036010-101-サオリ" = "……平和だ。"
"10036010-102-サオリ" = "アツコ、ミサキ、ヒヨリ……アズサ。"
"10036010-103-サオリ" = "みんなにも、この景色を……。"
"10036010-105" = "（一方、アウトロービーチの別の場所では……）"
"10036010-111-アツコ" = "先生、見て。#n本物のカニさん、可愛い。"
"10036010-112" = "[s] \"可愛いね。\""
"10036010-116-ミサキ" = "アイス、こぼれそうだよ。#n気をつけて。"
"10036010-119-ヒヨリ" = "せ、先生……私のアイス、溶けちゃいました！#nもう終わりです！うわぁぁああん！"
