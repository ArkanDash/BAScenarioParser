[translation]
"10032055-7-サオリ" = "……一度止まってくれ。"
"10032055-9-サオリ" = "ひとまず安全は確保できたようだ。"
"10032055-10-サオリ" = "だが、今のスピードじゃ奴らに追いつかれてしまう。"
"10032055-11-ドン·アランチーノ" = "……はぁ、何だと？それは私の足が遅いとでも言いたいのか？"
"10032055-12-ドン·アランチーノ" = "それを何とかするために、お前を雇ってるんだろうが！！"
"10032055-13-サオリ" = "……ふむ。"
"10032055-14-サオリ" = "たしかに、その通りだ。#nあなたは私を信頼して雇ってくれたのだろう。"
"10032055-15-サオリ" = "なのに、失礼なことを言って申し訳なかった。すまない、謝罪する。"
"10032055-16-サオリ" = "今後は言葉に気をつけよう。"
"10032055-17-ドン·アランチーノ" = "ふぅ……"
"10032055-18-ドン·アランチーノ" = "とにかく、地下の駐車場まで案内しろ。#nすでに私の部下たちが、こっちに向かっているはずだ。"
"10032055-19-ドン·アランチーノ" = "うまくいけば、車でここを抜け出せるかもしれん。"
"10032055-20-サオリ" = "なるほど、良い知らせだ。それなら、このまま進むとしよう。"
"10032055-21-サオリ" = "だが……いずれにせよ、逃げ切るには速度を上げる必要がある。"
"10032055-22-サオリ" = "今の速度では、駐車場にたどり着く前に捕まってしまう。"
"10032055-23-サオリ" = "何か良い策はないだろうか……"
"10032055-28-サオリ" = "チッ、予想より早いな。"
"10032055-29-サオリ" = "……仕方ない。こうなった以上、効率を最優先しよう。"
"10032055-30-ドン·アランチーノ" = "もっと効率的な方法があるだと？なぜ今まで言わなかった！？"
"10032055-31-サオリ" = "すまない。これには、あなたの協力も必要だから躊躇っていた。"
"10032055-32-ドン·アランチーノ" = "私の協力……？まあ、それくらい構わないが……"
"10032055-33-ドン·アランチーノ" = "……本当に確実に逃げられるんだろうな？"
"10032055-34-サオリ" = "ああ、もちろんだ。信じてくれ。"
"10032055-35-サオリ" = "安全性と機動性を両立できる。あなたは何もしなくていい。"
"10032055-40-ドン·アランチーノ" = "……？"
"10032055-41-ドン·アランチーノ" = "なっ……！"
"10032055-42-ドン·アランチーノ" = "何をするつもりだ……！？"
"10032055-43-サオリ" = "…………。"
"10032055-49-ドン·アランチーノ" = "ぐっ……！！"
"10032055-61-サオリ" = "ふむ……"
"10032055-67-サオリ" = "ふぅ……"
"10032055-68-サオリ" = "……よし。"
"10032055-72-サオリ" = "……完璧だ。"
