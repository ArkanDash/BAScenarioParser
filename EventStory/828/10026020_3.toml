[translation]
"10026020-1" = "第2話;水着ですよ♡"
"10026020-2-ハナコ" = "さあ、みなさん。"
"10026020-3-ハナコ" = "これはサクラコさんとウイさんが和解するための、大切な調査です。"
"10026020-4-ハナコ" = "ということで……せっかくなので先生もお連れしました。"
"10026020-5-ハナコ" = "……先生、どうかされましたか？"
"10026020-6" = "[s] \"…………。\""
"10026020-8" = "[ns1] \"えっと……みんな、よく似合ってるね。\"\n[ns2] \"急に呼び出されたから、ちょっと……。\""
"10026020-11-ハナコ" = "ふふ……やはり、詳しい説明が必要そうですね。"
"10026020-12-ハナコ" = "この無人島には、シスターフッドが発見した遺跡が残されています。"
"10026020-13-ハナコ" = "何のために作られた遺跡なのか、その時代など……#nこれまで何度も調査を試みたのですが……"
"10026020-15-ハナコ" = "シスターフッドでさえ解読する事ができなかった古文書や、#n複雑な構造の遺跡ばかりで調査が難航し、長らく放置されていたのです。"
"10026020-17-ハナコ" = "そこで、ウイさんの優れた古文書の解読力と考古学の知識を活かして……"
"10026020-18-ハナコ" = "この遺跡の謎を解き明かしてください！#nそうすれば、ハッピーエンドというわけです♡"
"10026020-19-ハナコ" = "……先生、何か質問はありますか？"
"10026020-20" = "[s3] \"大丈夫……なるほど、そういう約束なんだね。\"\n[s4] \"何となく理解できたような……。\""
"10026020-23-ヒナタ" = "は、ハナコさん……どうしてみんな水着なんですか……？#n島を調査するのなら、もっと適した格好があるのでは……"
"10026020-24-ヒナタ" = "そ、それに……ハナコさんが着ているのは、水着……なのでしょうか？#nなんだかちょっと違うような……"
"10026020-26-ハナコ" = "うふふっ。水着だと思えば、水着ですよ♡"
"10026020-27-コハル" = "そんなわけないでしょ！！"
"10026020-28-ハナコ" = "コハルちゃんも来てくださってありがとうございます♡"
"10026020-29-コハル" = "ちゃんと説明してよね！#n急に出動って言われて来たら、こんな所に連れてこられて……"
"10026020-30-コハル" = "ここどこなの！？意味分かんない！"
"10026020-31-ハナコ" = "……コハルちゃんと海に行けなかったから……#nそれが、ずっと気がかりで……"
"10026020-32-ハナコ" = "だから、せっかくなのでコハルちゃんとも遊びたいな、と思って……。"
"10026020-33-コハル" = "やっぱり遊びに来てるんじゃない！"
"10026020-34-ハナコ" = "まぁまぁ。……気になるようでしたら、正義実現委員会のエリートとして、みんなを監視する……という名目でどうでしょう？"
"10026020-35-コハル" = "そ、そりゃもちろん、先生もハナコもいるんだから、エリートとして監視しないわけにはいかないけど……！っていま名目って言った！？"
"10026020-36-コハル" = "うぅ……でも、こんな無人島で何日も水着のまま過ごすなんて……"
"10026020-37-コハル" = "……。"
"10026020-38-コハル" = "もしかして、あんなことやこんなことを……ま、まさか……！？"
"10026020-40-ハナコ" = "はい？"
"10026020-41-コハル" = "私も本でしか読んだことないけど……#n待って、まさかこのためにハナコは……！？"
"10026020-42-コハル" = "し、死刑！エッチなのはダメ！禁止！！死刑！！！"
"10026020-43-ハナコ" = "ふふっ。私、よく分からなくて……コハルちゃんが何を考えているのか教えていただけますか？じっくりと♡"
"10026020-44-コハル" = "なっ！な、何を言わせようとしてるの！？"
"10026020-45-ハナコ" = "エッチなことって、具体的にどういうものを指すんですか？#nそうだ……実演しながら教えていただけますか？"
"10026020-46-コハル" = "こ、怖いんだけど！なんで今日は一段とテンションが高いの！？"
"10026020-47-ハナコ" = "夏、ですから♪"
"10026020-48-コハル" = "わ、訳が分からないんだけど……こっち来ないで！#nそれ以上近寄っちゃダメ！！"
"10026020-49-ハナコ" = "うふふっ、コハルちゃんは欲しがりなんですから。えいっ♡"
"10026020-53-コハル" = "いやぁああぁぁぁー！た、助けて先生！#nううぅ、許してぇ……。"
"10026020-54" = "[ns] \"みんな楽しそうだね。\""
"10026020-55-ウイ" = "い、一体どうして……どうしてこんなことに……"
"10026020-56-ウイ" = "私は、ただ真実を明らかにしようとしただけなのに……#n何故、こんな炎天下に……"
"10026020-57-ウイ" = "水着も適当に選んでって言ってしまったせいで……こ、こんな恥ずかしい格好をする羽目に……"
"10026020-61-ウイ" = "いや……もしかしたら、これはチャンスかもしれない……？"
"10026020-62-ウイ" = "シスターフッドの前身である、聖徒会の秘密を明らかにすれば、何か弱みが掴めるかも……"
"10026020-63-ハナコ" = "……いま何か言いました？ウイさん、いや……"
"10026020-64-ハナコ" = "コ・ゼ・キ・先・輩？"
"10026020-65-ウイ" = "ひゃっっ！な、何でもない……ただの独り言！！"
"10026020-66-ウイ" = "そ、それと、急に近寄らないでください！驚いたじゃないですか！？"
"10026020-68-ヒナタ" = "で、でもこれなら、うまくいきそうですね！#nきっと、サクラコ様もお許しになるでしょうし……"
"10026020-69-ヒナタ" = "一緒に頑張って調査しましょう！ウイさんならできますよ！"
"10026020-70-ウイ" = "ヒナタさん……"
"10026020-71-ヒナタ" = "はい！ウイさんならやり遂げられると信じています！"
"10026020-72-ヒナタ" = "私も精一杯、ウイさんのお手伝いをしますから！！"
"10026020-73-ウイ" = "ぎええええっ！"
"10026020-75-ヒナタ" = "……う、ウイさん！？急にどうしたんですか、ウイさん……！？"
"10026020-76-ウイ" = "そうやって、何も疑わない無垢な表情を向けられて……！"
"10026020-77-ウイ" = "私は未だに、裏がないか探ろうとしてしまっているというのに……"
"10026020-79-ウイ" = "うぅ、眩しすぎて……目が……！"
"10026020-80-ヒナタ" = "だ、大丈夫ですか……？"
"10026020-81-ウイ" = "あ、いえ……ヒナタさんが悪いとかではなくて……これは、その……"
"10026020-82-ウイ" = "……私自身の問題ですので、気にしないでください……。"
"10026020-83-ウイ" = "はぁ……ふぅ……。"
"10026020-84-ウイ" = "……ごめんなさい、ヒナタさん、それに先生も……"
"10026020-85-ウイ" = "元はと言えば、私のせいなので……私があんな事をしなければ……"
"10026020-86-ウイ" = "皆さんまで、巻き込んでしまって……"
"10026020-87" = "[s5] \"大丈夫、次からはちゃんと相談しようね。\"\n[s6] \"ウイには、いつもお世話になってるからね。\""
"10026020-90-ヒナタ" = "そうですよ、ウイさん。サクラコ様も追い出そうとしていたわけではありませんし……"
"10026020-91-ヒナタ" = "先生の仰る通り、次からはちゃんと話し合えばいいんです！"
"10026020-92-ヒナタ" = "それに、私もウイさんのお手伝いができるのはとても嬉しいです。"
"10026020-93-ヒナタ" = "ウイさんには助けてもらってばかりでしたから……！"
"10026020-94-ウイ" = "うっ！ぐはぁっ……！"
"10026020-95-ヒナタ" = "ウイさん……！？"
"10026020-96" = "[s7] \"ウイとヒナタって仲はいいけど……\"\n[s8] \"性格は正反対だよね。\""
"10026020-99-ハナコ" = "うふふっ、そのようですね。"
"10026020-100-ウイ" = "ふぅ……はぁ。"
"10026020-101-ウイ" = "はい……まあ、仕方ありませんね。こうなった以上……"
"10026020-102-ウイ" = "皆さんのお力も、借りるわけですし……私も少し、頑張ってみようと思います。"
"10026020-103-ヒナタ" = "……はい！頑張りましょう、ウイさん！！"
"10026020-104-ウイ" = "そっ、その目でこっちを見ないでください……！"
"10026020-105-ウイ" = "と、とりあえずこの荷物を運んでもらえますか……？"
"10026020-106-ウイ" = "……この荷物、ですか？"
"10026020-107-ウイ" = "えっと……「遺跡調査キット」です。"
"10026020-108-ウイ" = "調査には、色々と道具が入り用でして。"
"10026020-109-ウイ" = "古代語辞典や拓本セット――墨や画仙紙、手作りのタンポ。#n他にも試薬など、色々と……"
"10026020-110-ウイ" = "その……一つひとつはそこまで重くなかったはずなのですが、いざカバンに詰めてみたら、持ち上げるのも大変になってしまって……"
"10026020-111-ウイ" = "うっ……"
"10026020-112-ヒナタ" = "そうなのですね。#nでは、私にお任せください！！"
"10026020-113-ヒナタ" = "よいしょっ。"
"10026020-115-ウイ" = "……？"
"10026020-116-ウイ" = "えっ……！？ひ、ヒナタさん……それを、片手で……？"
"10026020-117-ヒナタ" = "ああっ、すみません……！#nもっと丁寧に扱わないといけませんよね……！"
"10026020-118-ウイ" = "あ、いえ。取り扱いは、そこまで気にしなくて良いのですが……#nわ、私は引きずって運んできたので……"
"10026020-119-ヒナタ" = "なるほど。ですが一応、両手で運びますね。#nこう見えても、聖堂の備品管理を担当していますから！"
"10026020-120-ウイ" = "な、何だか伝わっていないような……#nまあ、本人が問題なさそうなら構いませんが……"
"10026020-124-ウイ" = "……あの、ヒナタさん。"
"10026020-125-ヒナタ" = "……何でしょう、ウイさん！"
"10026020-126-ウイ" = "手伝っていただくというのに、こんなことを言うのは申し訳なく思うのですが……"
"10026020-127-ウイ" = "……その、調査を続けるうえで、あらかじめ言っておかなければ、と。#n……なので、あまりマイナスには捉えないでください。"
"10026020-128-ウイ" = "……良いですね？"
"10026020-129-ヒナタ" = "わ、分かりました。"
"10026020-130-ウイ" = "……ありがとう、ございます、ヒナタさん。#nでは、その……"
"10026020-134-ウイ" = "しばらくの間、離れて歩いてもらっても……良いでしょうか？#nそうですね、2mくらい……"
"10026020-138-ヒナタ" = "……へ？"
"10026020-139-ヒナタ" = "ええっ！？"
"10026020-141-ウイ" = "本当に、マイナスの意味はありません……#nこれは完全に、私の問題です……はい。"
"10026020-142-ウイ" = "では、そろそろ行きますか……いつまでも、ここに居るわけにはいきませんし、適当なところに拠点を作りましょう。"
"10026020-143-ウイ" = "皆さん、移動しますよ。"
"10026020-149-ウイ" = "……2m。"
"10026020-154-ヒナタ" = "う、ウイさん……？#nウイさん、どうして……どうしてですか……！"
"10026020-158" = "[ns] \"そのうち慣れると思うんだけどね……。\""
"10026020-161" = "[ns9] \"コハルは大丈夫？\"\n[ns10] \"急に来てもらっちゃって、ごめんね。\""
"10026020-164-コハル" = "べ、別に大丈夫よ。#n聞いてた感じ、ただ遊びにきたわけでもなさそうだし……"
"10026020-165-コハル" = "遺跡を調査するんでしょ？#nよ、よく分かんないけど……重要みたいだから。"
"10026020-166-コハル" = "私も正義実現委員会のエリートだもの。当然手伝うわ！"
"10026020-167-コハル" = "……でも、こんな無人島で……#nみんな水着だし……先生だけじゃなくて、ハナコまで居るなんて……"
"10026020-168-コハル" = "……。"
"10026020-169-コハル" = "死刑っ！！！"
"10026020-170" = "[s] \"えっ！？\""
"10026020-171-コハル" = "先生が変なことしないように、私がちゃんと監視するから。"
"10026020-172-コハル" = "正義実現委員会のエリートとして、みんなには指一本触れさせないんだからね！"
"10026020-173" = "[s] \"お、お手柔らかに……。\""
"10026020-175" = "（こうして、無人島の遺跡調査が始まった）"
