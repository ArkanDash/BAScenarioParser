[translation]
"10026080-1" = "第8話;調査ポイントE「滝裏の洞窟」"
"10026080-4-ヒナタ" = "……あっ、ようやく見えてきました！"
"10026080-5-ヒナタ" = "それにしても、長い道のりでしたね。#n随分と登ってきたように思いますし……。"
"10026080-6-ハナコ" = "滝の裏に、秘密の洞窟ですか……。"
"10026080-7-ハナコ" = "たしかに、外から見るだけでは、その存在に気づけませんね。#nいかにも聖徒会の秘密が隠されていそうな……"
"10026080-8-ヒナタ" = "みなさん、お揃いですね？"
"10026080-9-ハナコ" = "は～い。"
"10026080-10-コハル" = "は、はい……なんとか……。"
"10026080-11-ヒナタ" = "先生、少しお疲れのようですし、休憩を入れましょうか？"
"10026080-12" = "[s1] \"日頃の運動不足が……。\"\n[s2] \"もう少しは頑張れるよ……。\""
"10026080-15-ヒナタ" = "はは……そこそこ険しい道を登ってきましたからね。#nすみません、私がペース配分を考えていれば……"
"10026080-16-ヒナタ" = "あれ、ウイさんは……？#n先ほどまで私の隣に居たはずですが……"
"10026080-17-ヒナタ" = "ウイさん……？"
"10026080-21-ウイ" = "ふうっ……はあっ……はぁ……ふぅ……はぁ……"
"10026080-22-ウイ" = "……ああっ……もう……どうして……本当に最悪……"
"10026080-23-ウイ" = "いや……また……よくない、言葉が……ふぅ……はぁ……"
"10026080-24-ウイ" = "はぁ……なんとか……着きまし、た……"
"10026080-29-ヒナタ" = "ウイさん！？"
"10026080-31-ウイ" = "ふはぁ……ちょっとは、落ち着きました……#n待っていただきありがとうございます……。"
"10026080-32-ウイ" = "まったく……まともに道も整備されてませんし……#n遺跡の調査に来たはずが、どうして山登りを……。"
"10026080-33-ウイ" = "でも……おそらく、それだけ重要な物があるのでしょう。"
"10026080-34-ウイ" = "……私たちが今まで調べてきた場所は、全てカモフラージュ。"
"10026080-37-ウイ" = "この先に隠された、聖徒会の恐ろしい秘密から目を逸らすための……"
"10026080-38-ウイ" = "もしかしたら、拷問室や処刑場……#nいえ、もっと恐ろしい儀式を執り行う場の可能性も……！"
"10026080-39-ウイ" = "そして、ついに……隠されてきたシスターフッドの真相が……！！"
"10026080-43" = "[ns3] \"ウイ、それ以上はストップだよ。\"\n[ns4] \"気をつけるって、約束したよね？\""
"10026080-46-ウイ" = "……あ。"
"10026080-47-ウイ" = "また余計な言葉を……"
"10026080-48-ウイ" = "え、えっと……実際に見てみないことには、分かりませんし……はい。#nな、何も見つからないことを、願っています……よ。"
"10026080-49-ウイ" = "どうか、何も見つかりませんように……"
"10026080-53-ウイ" = "……うぅ。"
"10026080-54-ウイ" = "すみません。自分の言葉なのに、違和感が……慣れないことはするもんじゃないですね……"
"10026080-55" = "[s5] \"まだ一日目だからね、これからだよ。\"\n[s6] \"とりあえず、調査を始めようか？\""
"10026080-58-ウイ" = "はい……。"
"10026080-60" = "滝の洞窟の中"
"10026080-62-ヒナタ" = "ここが……滝の中……まさか、本当に洞窟があるとは……。"
"10026080-63-ハナコ" = "外からは、全く見えませんでしたね。#nたしかに、これなら秘密が隠されていてもおかしくなさそうです。"
"10026080-68-ウイ" = "ん……？"
"10026080-69" = "[s7] \"……ウイ？\"\n[s8] \"どうかしたの？\""
"10026080-72-ウイ" = "す、すみません……！水の音がうるさいので……！"
"10026080-73-ウイ" = "……よく聞こえなくて……！"
"10026080-74-ハナコ" = "なるほど……"
"10026080-75-ハナコ" = "……■■■■■■■■■■■■■♡"
"10026080-76-ハナコ" = "■■■■■■■■♡♡♡"
"10026080-77" = "[s] \"……？\""
"10026080-78-ハナコ" = "ふふっ。ここでなら、何を言っても問題ありませんね。#nコハルちゃんもどうですか？"
"10026080-79-コハル" = "やらないわよ！なんでやると思ったの！？"
"10026080-80" = "[s9] \"こ、この辺りは何かないかな……！\"\n[s10] \"よし、調査しよっか……！\""
"10026080-85" = "（全員で洞窟の中に入り……）"
"10026080-86" = "（しばらく進んだところで、大きな木箱がいくつか現れた）"
"10026080-87" = "[ns11] \"あれ、これは……。\"\n[ns12] \"木箱……？\""
"10026080-90-ヒナタ" = "な、なぜこんなところに箱が……？"
"10026080-91-ハナコ" = "それも、人の身長くらいはありそうです。まるで……"
"10026080-95-ウイ" = "…[ruby=ひつぎ]…棺で[/ruby]すかね。"
"10026080-101-ウイ" = "ここに置かれている理由は分かりませんが……#n見た目からして、他にないでしょう。"
"10026080-102-ヒナタ" = "ひ、棺ですか……！？#nど、どうして、こんなところに……！"
"10026080-103-ウイ" = "……ヒナタさん。それと……コハル、さんも。"
"10026080-104-コハル" = "はい！？わ、私もですか……？"
"10026080-105-ウイ" = "すみませんが……#nお二人は少し離れたところで、後ろを向いて待っていただければと。"
"10026080-106-ウイ" = "……万が一に備えて、ですね。"
"10026080-107-ヒナタ" = "ま、万が一……？それは、どういう……"
"10026080-108-ウイ" = "もしかしたら……"
"10026080-109-ウイ" = "……本物の棺かもしれません。"
"10026080-110-ウイ" = "亡くなった方には失礼かと思いますが……これも、調査に必要ですので。"
"10026080-111-ヒナタ" = "で、でしたら！重いかもしれませんし、私が――"
"10026080-112-ウイ" = "――いえ、ヒナタさん。"
"10026080-113-ヒナタ" = "……！？"
"10026080-114-ウイ" = "お二人は、あちらで待っていてください。"
"10026080-115-ウイ" = "これは、私の気持ちの問題ですが……#n「もしも」の時、ヒナタさんに傷を負ってほしくはないんです。"
"10026080-116-ウイ" = "……なので、その……ここは私に任せてください。"
"10026080-118-ヒナタ" = "えっと……"
"10026080-119-ヒナタ" = "は、はい……ですが、もし何かあったら、すぐに声を上げてくださいね？"
"10026080-125-ハナコ" = "……あの。"
"10026080-126-ハナコ" = "私は一緒に居ても良いのですか……？"
"10026080-127-ウイ" = "……？"
"10026080-128-ウイ" = "あ……すみません。#nは、ハナコさんは、こういったものに耐性があるかと思いまして……"
"10026080-129-ウイ" = "もしアレでしたら、ハナコさんも後ろを向いていただいて大丈夫です。#n確認するだけですので、一人でも問題ありませんし。"
"10026080-130-ハナコ" = "あはは……ウイさんは、私にどんなイメージを……"
"10026080-131-ハナコ" = "……まあ、仰る通りですが。では、さっそく確認してみましょうか？"
"10026080-132-ハナコ" = "先生も……よろしいですね？"
"10026080-133" = "[s13] \"うん、大丈夫だよ。\"\n[s14] \"失礼にならないよう慎重にね。\""
"10026080-136-ウイ" = "……はい。"
"10026080-137-ウイ" = "それでは、少しずつ開けてみます。"
"10026080-138-ウイ" = "……うっ……お、重いですね。"
"10026080-142-ウイ" = "……暗くて中が……"
"10026080-143-ウイ" = "……えっ？"
"10026080-144-ハナコ" = "あら、これはまた……"
"10026080-148-ウイ" = "……な、何ですか、今の音は！？"
"10026080-149-コハル" = "な、なに！？どうなってるの！？"
"10026080-155-ヒナタ" = "またこうなってしまうのですね……。"
"10026080-156-ハナコ" = "どうやら、招かれざる客がいらっしゃったみたいですね。"
"10026080-157-ハナコ" = "……ふふっ。どちらかと言えば、私たちが招かれざる客のような気もしますけど。"
"10026080-159-ウイ" = "そ、そんな冗談を言っている場合では……"
"10026080-165" = "[ns15] \"まずは外に出よう！\"\n[ns16] \"みんな、走るよ！\""
"10026080-168-コハル" = "もう、なんで毎回こうなるのよ！？"
"10026080-169-ヒナタ" = "……では、指揮をお願いします。"
"10026080-170-ヒナタ" = "先生！"
