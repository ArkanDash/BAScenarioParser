[translation]
"10044030-1" = "第3話;さらに消えた列車を追って"
"10044030-2" = "貨物駅"
"10044030-5-ノゾミ" = "えー、勝手に発車したの？また？"
"10044030-6-駅員" = "私たちにも理由が分からず……そもそも時刻表に載ってない列車ですし……。"
"10044030-8-ヒカリ" = "おいかけっこー。"
"10044030-9-アオバ" = "や、やっぱり期待するから失望する羽目になるんだ……。"
"10044030-11" = "[ns] \"行き先は分かる？\""
"10044030-13-駅員" = "し、調べてみます……！"
"10044030-15-ノゾミ" = "こんなことしてる場合じゃないんだけどなー。"
"10044030-16-ヒカリ" = "見つけたらーフルスロットルー。"
"10044030-17-ノゾミ" = "ま、「なるようになる」っていうし？"
"10044030-24-駅員" = "見つけました！列車は今、上り線を走行中です！"
"10044030-25-アオバ" = "お、追いかける方法は――"
"10044030-26-駅員" = "ここからだとバスしかないですね。"
"10044030-27-アオバ" = "うっ……バス……。"
"10044030-29-ノゾミ" = "追いつければ何でもいいし！#n上にバレる前に早く行こ！"
"10044030-30-ヒカリ" = "バビューン、しゅばばばばー。"
"10044030-39-アオバ" = "……。"
"10044030-40-ノゾミ" = "……。"
"10044030-42-ノゾミ" = "バス来ないんだけど！！"
"10044030-43-ヒカリ" = "歩いたほうが早いかもー？"
"10044030-44-ノゾミ" = "なんで時間通りに来ないわけ？#nこの時刻表は飾りなの！？"
"10044030-46-アオバ" = "……。"
"10044030-47" = "[s1] \"アオバ、大丈夫？\"\n[s2] \"ちょっと顔色悪いけど。\""
"10044030-50-アオバ" = "あ、はい……。"
"10044030-51-アオバ" = "……。"
"10044030-52-アオバ" = "じ、実は私……乗り物酔いが、ひどくて……。"
"10044030-56-ヒカリ" = "ふらふらー、げろげろー？"
"10044030-57-アオバ" = "はい……特にバスとか車だと――"
"10044030-58-アオバ" = "そ、想像するだけで……おぇ……。"
"10044030-63-ノゾミ" = "あーあ、これだから車は。列車なら酔いにくいのにね。"
"10044030-64-アオバ" = "はぁ……ふぅ……。"
"10044030-65-アオバ" = "はい……だから、ハイランダーに、入学したんです……。"
"10044030-67" = "[ns3] \"ちょっとだけ乗るのも大変そう？\"\n[ns4] \"酔い止め薬買ってこようか。\""
"10044030-74-ノゾミ" = "バス来ちゃったよ！"
"10044030-75-アオバ" = "せ、先生……私は……大丈夫、なので……。"
"10044030-76-アオバ" = "まだ我慢できるうちに……早く行きましょう……！"
"10044030-77" = "[s] \"本当に無理そうだったら言ってね。\""
"10044030-78-アオバ" = "は、はい……。"
"10044030-85-ノゾミ" = "遅かったじゃん！5分も待たされたんだけど！？"
"10044030-86-バス運転手 " = "ワハハッ！すまんすまん。渋滞に捕まってな。"
"10044030-87-バス運転手 " = "暴走族が暴れてたんで遅くなっちまった！"
"10044030-89-ヒカリ" = "バスはぜいじゃくー。"
"10044030-90-ノゾミ" = "線路なら邪魔者いないのにね。"
"10044030-91-バス運転手 " = "バスにはバスの長所があるもんさ。"
"10044030-92-バス運転手 " = "にしても、ハイランダーの生徒さんもバスに乗ることあるんだな。"
"10044030-93" = "[s5] \"急ぎの用事がありまして。\"\n[s6] \"運転よろしくお願いします。\""
"10044030-96-バス運転手 " = "ま、とにかく座った座った！発車しまーす！"
"10044030-106-ヒカリ" = "背中トントンしてあげるー。"
"10044030-107-アオバ" = "お、お構いなく……。"
"10044030-109-ヒカリ" = "ヒカリ108式、サウザンドハンマー。"
"10044030-116-アオバ" = "あっ、あう……や、やめてください……余計に酔いが……。"
"10044030-117-アオバ" = "うっぷ――"
"10044030-119-ノゾミ" = "パヒャヒャッ！ビニール袋いる？いつでも言って！"
"10044030-120" = "[ns] \"アオバ、大丈夫？深呼吸しよう。\""
"10044030-121-アオバ" = "すー……はぁぁ……世界は……本当にしんどいことばかりですけど……。"
"10044030-122-バス運転手 " = "ん？ハイランダーのみんな、どうかしたのかい？"
"10044030-123-ノゾミ" = "アオバがゲロ吐きそうだって！！"
"10044030-124-アオバ" = "ち、違います！！いや、違わないですけど！！！"
"10044030-125-アオバ" = "は、恥ずかしいので、大きな声で言わないで――"
"10044030-126-アオバ" = "おえっ……！き、ぎもぢわるぃ……。"
"10044030-128-バス運転手 " = "すまないが、もうちょっとの辛抱だ。"
"10044030-129-バス運転手 " = "できるだけ頑張ってみるからさ！"
"10044030-130-ヒカリ" = "アクセル全開でーちょっぱやー？"
"10044030-131-バス運転手 " = "はっはっは、そりゃ無理だな。ダイヤは守らないと。"
"10044030-132-ヒカリ" = "列車といっしょー。"
"10044030-133-ノゾミ" = "でもバスってすぐ遅れるじゃん？#n停留所が多すぎるんじゃない？"
"10044030-134-バス運転手 " = "その分、小回りが利くのが利点だからね。"
"10044030-135-バス運転手 " = "君たちだって、必要だからバスを使ってくれてるんだろう？ハハッ！"
"10044030-136-ノゾミ" = "パヒャヒャッ、今日はそういうことにしといてあげる！"
"10044030-142-バス運転手 " = "おっと、また暴走族だ。"
"10044030-143-バス運転手 " = "こらぁ！危ないぞ！"
"10044030-144-暴走族" = "うるせぇ！ノロマなデカブツは引っ込んでろ！"
"10044030-145-バス運転手 " = "あいつら……ったくもう！"
"10044030-146-暴走族" = "総長がお呼びだ～！急げ！"
"10044030-147" = "[ns] \"また渋滞か……。\""
"10044030-148-ノゾミ" = "やっぱバスダメじゃん！なんとかならないの？"
"10044030-149-ヒカリ" = "もーむりー。"
"10044030-150-ノゾミ" = "ってか、前に進むだけなのに、なんで渋滞とかするわけ？"
"10044030-152-アオバ" = "……。"
"10044030-153-ヒカリ" = "背中トントンするー？"
"10044030-154-アオバ" = "い、いらない、です……ふぅ、ふぅ……。"
"10044030-157-ノゾミ" = "渋滞って理解できないんだけどさ――"
"10044030-158-ノゾミ" = "ハイランダーの生徒として、どう思う？"
"10044030-159-アオバ" = "こ、この話今しないとダメ……ですか？"
"10044030-160" = "[s] \"アオバ、大丈夫？\""
"10044030-161-アオバ" = "こ、この二人さえ大人しければ、なんとか……。"
"10044030-162-アオバ" = "う、運転手さんも気遣ってくれているみたいですし……。"
"10044030-164-暴走族ボス" = "おい！ソレはうちらに任せる約束だっただろ！？"
"10044030-166-依頼人" = "ククッ。理由はあなた方が一番よく分かっているのでは？"
"10044030-167-依頼人" = "雑な配達で貴重品を破損させ……事故を起こしてヴァルキューレに追われ……。"
"10044030-168-暴走族ボス" = "そっ、それは……。"
"10044030-169-暴走族ボス" = "でも、スピードならうちらが一番じゃんか！"
"10044030-170-暴走族ボス" = "だって道路のアウトローなんだぜ？"
"10044030-171-依頼人" = "ええ、ええ、もちろん存じておりますとも。"
"10044030-172-依頼人" = "しかし、適材適所というものでして。#n今回の依頼は何より安全性を重視しておりますので。"
"10044030-173-依頼人" = "ゆえに、より安全が保障される鉄道輸送を選んだだけのことです。ククッ……。"
"10044030-174-暴走族ボス" = "くそっ……うちらが負けた……？#nそんなの認めねぇぞ。"
"10044030-175-依頼人" = "それを決めるのはあなた方ではありませんよ。#nともあれ、話は以上です。では――"
"10044030-176-暴走族ボス" = "まっ、待て！話はまだ――"
"10044030-180-暴走族ボス" = "ちくしょう切りやがった！！"
"10044030-181-暴走族ボス" = "うちらがどれだけこの仕事のために準備したか分かってんのか！？"
"10044030-187-暴走族" = "ボス、大丈夫……？"
"10044030-188-暴走族ボス" = "ボスじゃねぇ！総長！！"
"10044030-189-暴走族" = "ご、ごめん……！"
"10044030-190-暴走族ボス" = "……で、何の用だ？"
"10044030-191-暴走族" = "し、指示された通り、全員集まってるけど、どうする？"
"10044030-192-暴走族ボス" = "……。"
"10044030-193-暴走族ボス" = "こうなったら、やるしかない。"
"10044030-194-暴走族" = "なにを……？"
"10044030-199-暴走族ボス" = "奪われたチャンスは、自分たちの手で取り戻すんだ！"
"10044030-201-暴走族" = "おお……！なんかカッコいい！"
"10044030-202-暴走族ボス" = "うちらの仕事を横取りしたやつめ……覚悟しろよ……！"
"10044030-206-バス運転手 " = "ハイランダーのみんな！ここで降りるんだよな？"
"10044030-207-ノゾミ" = "やっと着いた……。"
"10044030-208-ヒカリ" = "アワートレイン、どこかなー。"
"10044030-210" = "[ns] \"アオバ、具合はどう？\""
"10044030-212-アオバ" = "ぎ、ギリギリでしたが、なんとか……うっぷ……。"
"10044030-213-バス運転手 " = "よく我慢した。偉いぞ！"
"10044030-214-アオバ" = "お、おかげさまで……ありがとうございます……。"
"10044030-215-バス運転手 " = "ハハッ！いつだってお客様第一だからな！"
"10044030-216-バス運転手 " = "バスだって悪かないだろ？"
"10044030-217-アオバ" = "は、はい……。"
"10044030-218-ノゾミ" = "そもそもバスに乗らなきゃ酔わなかったよね？"
"10044030-219-ヒカリ" = "列車は快適ー。"
"10044030-220-アオバ" = "よ、余計な事言わないで欲しいんですけど……。"
"10044030-224-ノゾミ" = "でもまあ、ちょっとだけ見直したかも？パヒャヒャッ！"
"10044030-225-ヒカリ" = "またくるねーじゃねー。"
"10044030-226-バス運転手 " = "ああ！"
"10044030-228" = "[ns] \"ありがとうございました！\""
"10044030-232-ヒカリ" = "背中トントンーもう大丈夫ー？"
"10044030-233-アオバ" = "そ、それ、叩きたいだけですよね……？"
"10044030-235-ノゾミ" = "ちゃっちゃと列車を回収するよ！"
