[translation]
"10044050-1" = "第5話;道路のアウトロー再び"
"10044050-3-シノン" = "今ここにある貨物列車に――"
"10044050-4-シノン" = "――とても大事な何かが積まれているとのことです！！"
"10044050-9-暴走族ボス" = "あれだ！！"
"10044050-10-暴走族ボス" = "ついてるぜ！こんな簡単に見つかるとはな！"
"10044050-11-暴走族" = "ボス――いや、総長！指示を！"
"10044050-12-暴走族ボス" = "とりあえず近いヤツから出発だ！主力も今すぐ移動しろ！"
"10044050-13-暴走族ボス" = "あの列車を押さえるんだ！"
"10044050-18-暴走族" = "うおお！総長の命令だ！いくぞぉぉおおお！"
"10044050-25-暴走族A" = "……いや、待て。"
"10044050-26-暴走族B" = "あん？"
"10044050-27-暴走族A" = "あれ、ニュース速報だったよな？"
"10044050-28-暴走族B" = "だから？"
"10044050-29-暴走族A" = "てことは……みんながあれを知っちまったんだよな……？"
"10044050-30-暴走族B" = "あー……。"
"10044050-31-暴走族B" = "ヤバくね？"
"10044050-33-チンピラ" = "金を積んだ貨物列車！？"
"10044050-35-ブラックマーケット幹部" = "キヴォトスを制圧できるほどの武器だと？#nその話、本当か！？"
"10044050-37-ヘルメット団幹部" = "こんなの――"
"10044050-39-一同" = "奪うしかないだろ！！"
"10044050-40-一同" = "この世のすべてがそこにあるって！！"
"10044050-41-一同" = "早い者勝ちだぁっ！！！"
"10044050-46-アオバ" = "はぁ、はぁ……な、なんで次から次に……！"
"10044050-47-ヒカリ" = "うおー、ヒカリも全国区ー？"
"10044050-48-ノゾミ" = "やーばいね、大注目じゃん！"
"10044050-49" = "[ns] \"まさか、こんなことになるだなんて……。\""
"10044050-51-ノゾミ" = "とにかくちゃっちゃと回収して出発するよ！！"
"10044050-52-アオバ" = "そ、そうですね……走りだせば、そうそう手は出せないでしょうし……。"
"10044050-58-暴走族" = "先発隊、到着！"
"10044050-59-暴走族" = "探せ探せ！貨物列車だ！"
"10044050-66-ノゾミ" = "はぁ、はぁ！貨物列車！どこ！？"
"10044050-67-駅員" = "あっ……！先ほど連絡してくれたCCCの方々ですよね……！？"
"10044050-69-ヒカリ" = "どこにあるー？"
"10044050-70-駅員" = "こ、こっちです……！"
"10044050-76-暴走族A" = "ん？あいつらは……？"
"10044050-77-暴走族B" = "なんだ、知り合いか？"
"10044050-78-暴走族A" = "たしか……そうだ！ピザの時のクレーマー！！"
"10044050-79-暴走族B" = "お前が言ってたやつか？"
"10044050-80-暴走族A" = "ああ！ハイランダーの連中だ！間違いない！"
"10044050-81-暴走族B" = "なら……そのお礼はしないとだよなぁ！"
"10044050-82-暴走族A" = "もうデリバリー配達員じゃねぇ！うちらは道路のアウトロー！"
"10044050-84-暴走族B" = "おい、お前ら！"
"10044050-90-暴走族B" = "さっきぶりだな！"
"10044050-91-暴走族A" = "借りを返しに来てやったぞ！"
"10044050-93-ヒカリ" = "……。"
"10044050-94-ヒカリ" = "どなたー？"
"10044050-95-暴走族A" = "忘れたとは言わせねぇぞ？#nお前らのせいでうちらは――"
"10044050-96-ノゾミ" = "あ！ピザの配達員だ……！"
"10044050-97-暴走族A" = "お前らのクレームのせいで、あの後クビになったんだよ！"
"10044050-98-暴走族A" = "うまくいきゃ2日は粘れたはずなのに！"
"10044050-99-暴走族B" = "あの程度で騒ぎやがって……お前らはサービスを求めすぎなんだよ！"
"10044050-101-アオバ" = "さ、最低限だと思うんですけど……。"
"10044050-102-ノゾミ" = "そうそう！あんなのピザじゃないよ！"
"10044050-103-ヒカリ" = "逆ギレー、ダサいー。"
"10044050-105-暴走族A" = "言わせておけばベラベラと……！"
"10044050-106-暴走族A" = "おいっ全員集まれ！うちらの怖さを思い知らせてやるぞ！"
