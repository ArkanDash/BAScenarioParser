[translation]
"10039110-1" = "後日談その3;放課後お化け屋敷"
"10039110-3-百鬼夜行の生徒A" = "ここがトリニティのお化け屋敷カフェ……。"
"10039110-4-百鬼夜行の生徒B" = "うちのお化け屋敷と比べてどうだろうな～。"
"10039110-5-百鬼夜行の生徒A" = "どっちのほうが怖いんだろ？"
"10039110-16-ナツ" = "ぐおぉぉ、いらっしゃいませぇー……。"
"10039110-21-ナツ" = "……私はフランケンナツイン、オーダーを取りにきたのだよ。"
"10039110-22-百鬼夜行の生徒A" = "え、これ何？#n全然怖くないけど……。"
"10039110-23-百鬼夜行の生徒B" = "むしろ、ちょっと可愛いかも……。"
"10039110-27-ナツ" = "……。"
"10039110-28-ナツ" = "ぐっ、ならば次は……。"
"10039110-32-ナツ" = "行け、古代の悪霊よ……！"
"10039110-34-ナツ" = "地獄の底より這い寄る死の支配者！#n大地を窒息させる絶望と呪いを見せてやるのだ……！"
"10039110-39-百鬼夜行の生徒A" = "ひいっ……！"
"10039110-40-百鬼夜行の生徒B" = "こ、これは……！"
"10039110-52-ヨシミ" = "ちょっと、それはやりすぎでしょ！"
"10039110-56-ヨシミ" = "……。"
"10039110-61-ヨシミ" = "く、くあぁ……わ、私はミイラよ！"
"10039110-62-ヨシミ" = "注文しないと、呪いをかけちゃうんだから！"
"10039110-68-百鬼夜行の生徒A" = "……これ、可愛い系のカフェだったっけ？"
"10039110-69-百鬼夜行の生徒B" = "ホラー系じゃなかったの……？"
"10039110-71-ヨシミ" = "……。"
"10039110-72-ヨシミ" = "ナツ、どうするのよ！#n全然通じてないんだけど！"
"10039110-73-ナツ" = "くっ、まさかここまで手強いとは……。"
"10039110-74-ナツ" = "こうなった以上、我々の切り札を出すしかない！"
"10039110-78-ナツ" = "燃え上がる炎、轟く慟哭。#nその邪悪な影は世界をも埋め尽くす！"
"10039110-80-ナツ" = "いでよ、地獄の魔獣「キャスパリーグ」！"
"10039110-86-カズサ" = "だから、やめろって言ったでしょ！#nただの狼人間だし！"
"10039110-87-ナツ" = "……「ただの狼人間」で満足するのか？#n君の中に潜む野生は、その程度だとでも？"
"10039110-91-ナツ" = "もっと己をさらけ出すのだ、キャスパリーグ！#nあ、早くオーダー取りに行って。"
"10039110-96-カズサ" = "まずはあんたを始末してからね！"
"10039110-110-百鬼夜行の生徒A" = "格闘系のカフェなの……？"
"10039110-111-百鬼夜行の生徒B" = "よく分からないね……。"
"10039110-114-ヨシミ" = "ちょっと、お客さんガッカリしてるじゃない。"
"10039110-115-ナツ" = "大丈夫、これも戦略のうち。"
"10039110-116-ナツ" = "「本当」の切り札は、ほかにある！"
"10039110-122-百鬼夜行の生徒A" = "ちょっと期待しすぎてたかも。"
"10039110-123-百鬼夜行の生徒B" = "お化け屋敷カフェなんだし、もっと怖いやつを想像してたのにね。"
"10039110-124-百鬼夜行の生徒B" = "でも、これはこれで良いんじゃない？"
"10039110-125-百鬼夜行の生徒A" = "せっかく来たし、スイーツでも食べようよ。"
"10039110-126-百鬼夜行の生徒A" = "すみませーん、注文良いですか？"
"10039110-133-百鬼夜行の生徒A" = "あれ？"
"10039110-138-百鬼夜行の生徒B" = "な、なに……？"
"10039110-148-一同" = "……。"
"10039110-150-アイリ" = "……。"
"10039110-152-百鬼夜行の生徒A" = "あ、あの……。"
"10039110-157-アイリ" = "……。"
"10039110-158-百鬼夜行の生徒A" = "ちゅ、注文良いですか……？"
"10039110-167-百鬼夜行の生徒A" = "わ、わあああっ！"
"10039110-168-百鬼夜行の生徒B" = "逃げろー！"
"10039110-173-アイリ" = "……。"
"10039110-174-アイリ" = "あ、あれ？#nナツちゃんに言われた通り、立ってただけなのに……。"
"10039110-175-ナツ" = "エクセレーント。"
"10039110-176-ナツ" = "これぞ放課後お化け屋敷の切り札……#n「13日連続チョコミント」、アイリ・クリムラ！"
"10039110-177-ナツ" = "虚ろな表情、止まらぬ足音、禍々しい[ruby=バット]凶器[/ruby]。"
"10039110-179-ナツ" = "彼女は、まさに恐怖そのものだろう。"
"10039110-180-アイリ" = "な、ナツちゃん……本当にこれで良いの？"
"10039110-181-ナツ" = "ふふ、ノープロブレム。"
"10039110-183-ヨシミ" = "お客さんが逃げ出したらダメじゃない！"
"10039110-184-ナツ" = "いや！#nこれはアイリが次世代のホラー役として羽ばたくための第一歩！"
"10039110-185-ナツ" = "彼女こそ、これからのお化け屋敷界を牽引する存在になるのだ！"
"10039110-186-カズサ" = "お客さんを追い出してるだけなんだけど！？"
"10039110-187-カズサ" = "このままだと売上ゼロじゃん！#n大量に準備したスイーツとドリンクはどうするの！？"
"10039110-188-ナツ" = "恐怖と向き合った者のみが、注文できるのだ……！"
"10039110-190-ヨシミ" = "だから、それじゃダメでしょ！？"
"10039110-199" = "[ns] \"アイリ、さっきのすごかったね……。\""
"10039110-203-アイリ" = "せ、先生！#nいつからいらしてたんですか！？"
"10039110-204" = "[s1] \"「古代の悪霊」のところから……。\"\n[s2] \"「地獄の魔獣」のところから……。\""
"10039110-210-ヨシミ" = "ちょ、なに勝手に見てんのよ！#n忘れなさい！"
"10039110-211-カズサ" = "先生、それ以上言ったらどうなるか分かってる！？"
"10039110-213-ナツ" = "……どうかな、先生から見てこのカフェは。"
"10039110-214" = "[s] \"可愛いし、良くできてると思うよ。\""
"10039110-216" = "[ns3] \"でも、アイリの仮装は本当に怖かったよ……。\"\n[ns4] \"衣装も小道具も凝ってて……。\""
"10039110-220-アイリ" = "ほ、褒めてもらえてるのかな……？"
"10039110-221-ナツ" = "褒め言葉だよ、それも最上級の。"
"10039110-222-ナツ" = "さすがはアイリ、我らが部長。"
"10039110-223-アイリ" = "だ、だから……。"
"10039110-228-ヨシミ" = "私はぎこちないだろうし、羨ましい才能だわ。"
"10039110-229" = "[ns] \"さっきのもう一回やってみせて、ヨシミ!\""
"10039110-233-ヨシミ" = "ぜ、絶対にやらないんだから！"
"10039110-235-ナツ" = "はぁ……私たちのテーマはお化け屋敷だろう。"
"10039110-236-ナツ" = "もう少し、アイリを見習ってはどうだ？"
"10039110-237-ナツ" = "君たちには、真剣度が足りていない。"
"10039110-242-ヨシミ" = "はぁ？"
"10039110-243-カズサ" = "何が言いたいわけ？"
"10039110-245-ナツ" = "準備期間が短かったとはいえ、キャラクターになりきるべき。"
"10039110-246-ナツ" = "そもそもアイリより、カズサとヨシミのほうが恐ろしいモチーフだというのに。"
"10039110-247-ヨシミ" = "だからって……。"
"10039110-249-ナツ" = "君たちは、なぜ「可愛さ」を捨てきれないのか！"
"10039110-253-ナツ" = "自分自身がお化けになるのだ！"
"10039110-254-カズサ" = "最初から「可愛さ」なんて目指してないけど！？"
"10039110-255-ナツ" = "甘い、甘すぎる！"
"10039110-256-カズサ" = "そういうあんたこそ、そんな仮装で驚かせられるの！？"
"10039110-257-ナツ" = "……フランケンシュタインは、このなかでも最弱だから。"
"10039110-258-ヨシミ" = "自分だけ言い訳するんじゃないの！"
"10039110-259-ナツ" = "くっ、暴力とは……なぜ対話から逃げるのか！#nそれは論理に自信がないからだろう！"
"10039110-265-カズサ" = "ヨシミ！#nこいつ、逆さ吊りにするよ！"
"10039110-271-ナツ" = "フランケンシュタインは暴力に屈しない！#n究極のスイーツを見つけるまで、負けるわけには……！"
"10039110-278-アイリ" = "み、みんな……まずは落ち着いて？"
"10039110-279-アイリ" = "そもそも私たちの目的って、お客さんを脅かすことだったかな……？"
"10039110-284-ヨシミ" = "えっ、違うの？"
"10039110-286-アイリ" = "お化け屋敷じゃなくて、お化け屋敷[ruby=・]風[/ruby]のカフェでしょう？"
"10039110-287-アイリ" = "そこまで怖がらせる必要はないと思うの。"
"10039110-288-ナツ" = "……なるほど。"
"10039110-289-ナツ" = "テーマに熱を入れすぎたあまり、本来の目的を見失っていたわけか……。"
"10039110-290-アイリ" = "うん、可愛いおばけだっていて良いんじゃないかな。"
"10039110-295-カズサ" = "……そもそも、この話って最初にしておくべきじゃなかった？"
"10039110-296-ナツ" = "最初から完璧な者などいないのだよ。"
"10039110-297-カズサ" = "あんたのせいじゃん！"
"10039110-298-ヨシミ" = "それで、結局どうするのよ！"
"10039110-304" = "[ns] \"みんな、元気そうで良かった。\""
"10039110-307" = "（その後、可愛い系のテーマに変えると、お客さんも来てくれるようになった）"
"10039110-311" = "（一部のホラーマニアから、アイリの仮装がとても人気だったとか……）"
