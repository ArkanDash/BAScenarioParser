[translation]
"10039010-1" = "第1話;イメージチェンジ"
"10039010-2" = "48時間前"
"10039010-7-？？？" = "……ふぅ、これで最後です！"
"10039010-11-ヒナタ" = "思ったよりも早く終わりましたね。#nこれもマリーさんのおかげです。#nありがとうございました！"
"10039010-12-マリー" = "むしろ、重い荷物を全て運んでくださったヒナタさんのおかげのような……。"
"10039010-13-マリー" = "こちらこそ、ありがとうございます。"
"10039010-14-ヒナタ" = "そ、そんな……！"
"10039010-19-ヒナタ" = "……あっ、すみません。"
"10039010-20-ヒナタ" = "って、私のじゃ……。"
"10039010-21-マリー" = "……私のみたいです。"
"10039010-25-マリー" = "……？"
"10039010-26-ヒナタ" = "マリーさん？"
"10039010-27-マリー" = "えっと、サクラコ様から連絡が来まして。"
"10039010-28-マリー" = "ただ、内容が……。"
"10039010-29-ヒナタ" = "次の仕事の連絡でしょうか？"
"10039010-30-マリー" = "そうかもしれません。#n「緊急支援要請」とだけ送られてきました。"
"10039010-32-マリー" = "……何か問題でも起きたのでしょうか？"
"10039010-36-マリー" = "失礼します……。"
"10039010-37-マリー" = "……サクラコ様？"
"10039010-38-マリー" = "入ってもよろしいでしょうか？"
"10039010-45-マリー" = "……！？"
"10039010-46-マリー" = "さ、サクラコ様！？#nそれにミネ様まで……！"
"10039010-48-サクラコ" = "……。"
"10039010-49-サクラコ" = "多忙な中、急に呼び立ててしまいすみません。"
"10039010-50-サクラコ" = "マリーが来てくれなければ、大変なことになっていたので……。"
"10039010-51-ミネ" = "……おそらく、すぐにでも決着をつけていたでしょう。"
"10039010-52-マリー" = "け、決着とは、いったい何があったのですか！？"
"10039010-54-サクラコ" = "……？"
"10039010-55-サクラコ" = "……はい？"
"10039010-56-サクラコ" = "私たちは戦っていたのでしょうか……？"
"10039010-57-ミネ" = "……？"
"10039010-58-ミネ" = "サクラコさんが、そのつもりだったのでは……？"
"10039010-59-ミネ" = "先ほど「衝突する前に、マリーの声を聞かなくては」と言っておりましたよね？"
"10039010-60-サクラコ" = "……？？？"
"10039010-61-サクラコ" = "また誤解を……。"
"10039010-62-サクラコ" = "私はただ意見を求めたかっただけで……。"
"10039010-65-ミネ" = "つまり……？"
"10039010-66-マリー" = "あ、あの……！"
"10039010-67-マリー" = "もしかして、私のせいで問題が……？"
"10039010-68-ミネ" = "……いえ、そうではありません。"
"10039010-69-ミネ" = "どうかご心配なさらないでください。#n私達はマリーさんを咎めに来たわけではありませんので。"
"10039010-71-サクラコ" = "また困らせてしまいましたね……申し訳ありません。"
"10039010-72-サクラコ" = "順を追って説明しますと……。"
"10039010-73-ミネ" = "……お待ちください。"
"10039010-74-ミネ" = "ここは私が説明しましょう。"
"10039010-75-ミネ" = "サクラコさんでは、誤解を生んでしまうかもしれませんから。"
"10039010-76-サクラコ" = "……はい？"
"10039010-77-サクラコ" = "え、ええと……？"
"10039010-78-サクラコ" = "……何故でしょうか？"
"10039010-79-ミネ" = "……。"
"10039010-80-ミネ" = "今日の話し合いだけですら、いくつも誤解を生んでいたかと。"
"10039010-81-サクラコ" = "……うっ。"
"10039010-82-サクラコ" = "分かりました……では、お任せします。"
"10039010-84-マリー" = "サクラコ様……。"
"10039010-85-ミネ" = "……では、まず私たちが置かれている状況をご説明します。"
"10039010-87-ミネ" = "マリーさんもご存知の通り、現在トリニティ[ruby=カーニバル]謝肉祭[/ruby]が開催されていますよね。"
"10039010-88-ミネ" = "そのなかで「アイドルイベント」が行なわれるそうなのです。"
"10039010-89-ミネ" = "これは、トリニティだけでなく、他学園からも参加者を募る大きな催し。"
"10039010-90-ミネ" = "開催期間中は、組織間の関係性を抜きにして、交流を深める決まり。"
"10039010-91-ミネ" = "これを生かして、私たちのイメージチェンジを図ろうと考えました。"
"10039010-93-ミネ" = "……まさに、絶好の機会ですから。"
"10039010-94-ミネ" = "救護騎士団やシスターフッドが抱えるマイナスイメージを払拭するのです！"
"10039010-95-マリー" = "わ、私たちにそのようなイメージが……？"
"10039010-97-サクラコ" = "はい、残念ながら……。"
"10039010-98-サクラコ" = "マリーは初耳かもしれませんが、立場上どうしても疑いをかけられやすいのです。"
"10039010-99-サクラコ" = "例えば、陰謀を企てているのではないか、生徒を監禁しているのではないか、など……。"
"10039010-100-ミネ" = "救護騎士団も、救護のていで暴力を振るい、街を破壊して回っていると誤解されており……。"
"10039010-101-ミネ" = "みなさんのために職務を全うしているはずなのに、です。"
"10039010-102-マリー" = "ど、どうしてなのでしょう……？"
"10039010-103-サクラコ" = "私にも、よく分かりません……。"
"10039010-104-ミネ" = "この問題を解決するためには、何だってやってみせましょう。"
"10039010-105-ミネ" = "それが、たとえ初めての行ないだとしても。"
"10039010-106-マリー" = "初めて、ですか……？"
"10039010-107-サクラコ" = "……はい、マリー。"
"10039010-108-サクラコ" = "私とミネ団長は今日から……。"
"10039010-112-サクラコ" = "……アイドルになるのです！"
"10039010-113-マリー" = "アイドル……！？"
"10039010-114-サクラコ" = "似合わないことは承知のうえです。#n私もミネ団長も、アイドルのような可愛いものに興味はありませんから……。"
"10039010-115-ミネ" = "……？"
"10039010-116-ミネ" = "いえ、むしろ私は……。"
"10039010-117-サクラコ" = "頑張ったところで滑稽に映るかもしれませんが、その覚悟はできております。"
"10039010-118-ミネ" = "……お待ちください！"
"10039010-119-ミネ" = "アイドルが滑稽と言いましたか！？"
"10039010-120-サクラコ" = "はい、それでも皆様から親しみを持っていただけるのなら……。"
"10039010-121-ミネ" = "……！"
"10039010-122-サクラコ" = "私は、どのような格好も甘んじて受け入れましょう。"
"10039010-124-マリー" = "……サクラコ様。"
"10039010-128-マリー" = "分かりました。それでは……私も全力で皆さんのサポートをいたします。"
"10039010-129-マリー" = "私にできることがありましたら、なんでも仰ってください。"
"10039010-130-サクラコ" = "マリー……！"
"10039010-131-ミネ" = "マリーさん……！"
"10039010-132-ミネ" = "ありがとうございます。#nさっそくですが、まずはこちらを……。"
"10039010-137-マリー" = "これは……？"
"10039010-138-サクラコ" = "私とミネ団長がそれぞれ考えた「アイドルの企画書」です。"
"10039010-139-サクラコ" = "「衣装」、「ダンス」、「曲」の三つに別けて案を出したのですが、#nなかなか意見がまとまらず……。"
"10039010-140-ミネ" = "ええ、マリーさんに決めていただければ、と。"
"10039010-141-ミネ" = "サクラコさんも私も、それがいいと考えました。"
"10039010-142-マリー" = "わ、私が決めるんですか！？"
"10039010-143-サクラコ" = "はい、マリーは私たちよりもアイドルに詳しいでしょうから。"
"10039010-144-サクラコ" = "普段からお店でポイントを貯めたり、セルフレジを使ったり、トレンドを知っているように。"
"10039010-145-ミネ" = "それくらいでしたら、私は普通に……。"
"10039010-146-サクラコ" = "相談を通して、若者の意見を聞く機会も多いでしょう。"
"10039010-147-ミネ" = "年の差はほとんどないと思いますが……。"
"10039010-148-サクラコ" = "つまり、私やミネ団長とは違い、今時の学生として適任なのです！"
"10039010-149-ミネ" = "おかしくありませんか！？"
"10039010-150-ミネ" = "どうして私がサクラコさんと同じ立場に！？全てサクラコさんのお話でしょう！"
"10039010-151-ミネ" = "たしかに、そこまでアイドルには詳しくありませんが、#n可愛いものは好きですから、興味はありました！"
"10039010-152-サクラコ" = "なのに「騎士団誓約」の内容を歌詞に加えたのですか？#nいくら何でも、あれが不自然なことくらい私でさえ分かります！"
"10039010-153-ミネ" = "ですから、それはオリジナリティを出すためだと説明したではありませんか！"
"10039010-154-ミネ" = "サクラコさんこそ、「聖歌」を推していたでしょう！"
"10039010-155-サクラコ" = "皆様から、とても評判ですよ？"
"10039010-156-ミネ" = "その「皆様」とは誰なのですか！"
"10039010-158-サクラコ" = "聖堂の皆様です！"
"10039010-159-ミネ" = "それは当然でしょう！"
"10039010-160-サクラコ" = "マリーも聖歌は好きですよね！？"
"10039010-161-マリー" = "えっ？#nも、もちろん聖歌は好きですが……。"
"10039010-162-サクラコ" = "言った通りでしょう、ミネ団長！"
"10039010-164-ミネ" = "それとこれとは別ですよね！？"
"10039010-169-ミネ" = "……ふぅ。#nマリーさんのお力を借りようとした理由、分かっていただけましたか？"
"10039010-170-ミネ" = "マリーさんなら、公正に選んでくださると信じております。"
"10039010-171-ミネ" = "サクラコさんの企画になったとしても、異論はございません。"
"10039010-176-マリー" = "……ええと。"
"10039010-177-マリー" = "その……。"
"10039010-178-サクラコ" = "ええ、マリーにお任せします！"
"10039010-179-マリー" = "あぅ……。"
"10039010-181-サクラコ" = "さあ、お選びください！#n私たちが進むべき道を！"
"10039010-182-マリー" = "そ、その！"
"10039010-186-マリー" = "少し……。"
"10039010-188-マリー" = "……考える時間を、頂けませんか？"
"10039010-192-マリー" = "――という話になってしまいまして。"
"10039010-193" = "[s1] \"大変だったね……。\"\n[s2] \"お疲れ様、マリー。\""
"10039010-196-マリー" = "あはは……。"
"10039010-197-マリー" = "ですが、サクラコ様とミネ団長のお気持ちは理解しました。"
"10039010-198-マリー" = "誰かのためを思う一心で、頑張っているのだと。"
"10039010-199-マリー" = "お二人は組織を率いる立場で、色々な問題に直面しているのでしょう。"
"10039010-200-マリー" = "それに対して、私は目の前の仕事をこなすだけ……。"
"10039010-201-マリー" = "ですから、こんな私でもお役に立てるのならサポートしたいのです。"
"10039010-202-マリー" = "ただ……。"
"10039010-203-マリー" = "片方の意見を肯定すると、もうひとつの意見を否定することになってしまい、#nどうすれば良いのか分からず……。"
"10039010-207" = "[ns3] \"マリー。\"\n[ns4] \"ほかの部活を見て回るのはどうかな？\""
"10039010-210-マリー" = "……えっ。"
"10039010-211-マリー" = "もしかして……。"
"10039010-212-マリー" = "……手伝って、くださるんですか？"
"10039010-213-マリー" = "ほかの部活を一緒に見て回る……？"
"10039010-214-マリー" = "お、お気持ちは嬉しいのですが……。"
"10039010-215-マリー" = "先生はお仕事で忙しいでしょうし、負担をかけるわけにはいきません。"
"10039010-216-マリー" = "……はい？"
"10039010-217-マリー" = "気にする必要はない、と？"
"10039010-218" = "[s5] \"マリーの力になりたいんだ。\"\n[s6] \"みんなの力になりたいんだ。\""
"10039010-221-マリー" = "先生……。"
"10039010-225-マリー" = "……ふふっ。"
"10039010-226-マリー" = "ありがとうございます。"
"10039010-227-マリー" = "そこまで言ってくださったのに……。"
"10039010-228-マリー" = "遠慮しては、却って失礼ですよね。"
"10039010-229-マリー" = "ここはご厚意に、甘えさせていただきます。"
"10039010-230-マリー" = "今は、余計なことを考えず……。"
"10039010-231-マリー" = "期待に応えられるよう、頑張ります。"
"10039010-232-マリー" = "……先生。"
"10039010-233-マリー" = "いつも通り、お手伝いをするだけのはずでしたが……。"
"10039010-234-マリー" = "……今は、明日からの時間を楽しみにしている自分がいます。"
"10039010-239-マリー" = "……では先生、よろしくお願いいたしますね。"
