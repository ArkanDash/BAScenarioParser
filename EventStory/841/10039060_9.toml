[translation]
"10039060-1" = "第6話;頂上決戦"
"10039060-11-トリニティの生徒B" = "……今の見た？"
"10039060-12-トリニティの生徒A" = "すごいスピードだった……。"
"10039060-13-トリニティの生徒A" = "……うん、カッコ良かったね。"
"10039060-14-トリニティの生徒B" = "でも……。"
"10039060-15-トリニティの生徒B" = "バイクに乗ってた人……。"
"10039060-16-トリニティの生徒A" = "あれ、たぶん……。"
"10039060-20-トリニティの生徒A" = "……シスターさん、だよね？"
"10039060-23" = "（急いでマリーに言われた場所へ向かった）"
"10039060-24-？？？" = "先生！"
"10039060-29" = "[ns1] \"マリー！？\"\n[ns2] \"本当にバイクに……。\""
"10039060-35-マリー" = "急にお呼び立てして、申し訳ありません……。"
"10039060-36-マリー" = "……ですが、先生がいてくだされば、最悪の事態は免れるはずです。"
"10039060-37-マリー" = "ヘルメットは、こちらをお使いください。"
"10039060-38" = "[s3] \"分かった、ありがとう。\"\n[s4] バイクの後ろに座る。"
"10039060-41-マリー" = "しっかりつかまってください、先生！"
"10039060-42-マリー" = "……では、出発します！"
"10039060-50-？？？" = "何かあるの？"
"10039060-51-？？？" = "シスターフッドと救護騎士団が部の存続をかけて決闘するんだって！"
"10039060-52-？？？" = "えっ、こんな時期に……？"
"10039060-53-？？？" = "むしろ、今だからじゃない？"
"10039060-54-ヒフミ" = "え、えっと……どういうことなのでしょう？"
"10039060-55-ヒフミ" = "いきなり決闘だなんて……。"
"10039060-56-アズサ" = "……なるほど。#n謝肉祭の隙を狙ったのか。"
"10039060-57-アズサ" = "それに決闘なら、すぐに終わる。"
"10039060-58-コハル" = "なに言ってるの！？#nおかしいわよ！"
"10039060-60-ハナコ" = "たしかに、コハルちゃんの言う通りですが……。"
"10039060-61-ハナコ" = "……些細な問題から決闘に発展してしまった可能性も否定できません。"
"10039060-62-ハナコ" = "ただ話が食い違っているだけという線も考えられますが……。"
"10039060-63-ハナコ" = "……ふふっ。#n楽しそうですし、そっとしておきましょうか。"
"10039060-64-ヒフミ" = "た、楽しそうって……。"
"10039060-66-シスターフッドの生徒A" = "この騒ぎは、いったい……。"
"10039060-67-シスターフッドの生徒A" = "サクラコ様は？"
"10039060-68-シスターフッドの生徒B" = "何度も電話してますが、ずっと繋がりません……。"
"10039060-69-シスターフッドの生徒B" = "モモトークも既読が付くだけですし……。"
"10039060-70-シスターフッドの生徒A" = "本当に何かが起きて……？"
"10039060-71-シスターフッドの生徒B" = "詳細は一部のメンバーにしか知らされていないとかでしょうか……。"
"10039060-72-シスターフッドの生徒B" = "私たちとてサクラコ様の考えを、全て理解できているわけではないですから……。"
"10039060-73-シスターフッドの生徒A" = "そうだとしても……。"
"10039060-74-シスターフッドの生徒B" = "ええ、もし決闘になってしまったら……。"
"10039060-75-シスターフッドの生徒A" = "勝ち目がないのでは！？#n相手はあのミネ団長なのですから！"
"10039060-76-シスターフッドの生徒B" = "となれば……。"
"10039060-77-シスターフッドの生徒B" = "私たちにできることを探さねばなりませんね。"
"10039060-78-シスターフッドの生徒A" = "……！"
"10039060-80-ハナエ" = "何がどうなっているんでしょう……。"
"10039060-81-ハナエ" = "決闘だなんて……ミネ団長から何か聞いてます？"
"10039060-82-セリナ" = "いえ……私も初耳です……。"
"10039060-83-セリナ" = "団長のことですし、あり得ない話ではありませんが……これはいくらなんでも……。"
"10039060-84-セリナ" = "何か誤解があったような気がします……。"
"10039060-91-セリナ" = "わあぁぁ……！み、皆さん、落ち着いてください！"
"10039060-92-セリナ" = "私たちは戦いに来ているわけではないんですよ……！？"
"10039060-96-セリナ" = "……？"
"10039060-97-セリナ" = "あの方たちは……。"
"10039060-102-セリナ" = "……！"
"10039060-103-セリナ" = "……ナギサ様……！？"
"10039060-110-ミカ" = "ねぇ、ナギちゃん……？"
"10039060-111-ミカ" = "本当なの？"
"10039060-112-ミカ" = "いくら何でも、こんな日に争いを起こそうとするわけないじゃん。"
"10039060-113-ミカ" = "私たちが顔を出したら、余計にこじれるかもよ？"
"10039060-115-ナギサ" = "……ミカさん。"
"10039060-116-ナギサ" = "ティーパーティーは常に、ありとあらゆる事態に備えなければなりません。"
"10039060-117-ナギサ" = "ミカさんには、あちらのシスターフッドと救護騎士団の兵力が見えないのですか？"
"10039060-118-ナギサ" = "「決闘」と聞いてますが、#n我々ティーパーティーへ反旗を翻す計画をしている可能性もあります。"
"10039060-119-ナギサ" = "これは、トリニティの内戦を招きかねない事案です。"
"10039060-120-ナギサ" = "むしろ、こんな日だからこそ警戒すべきでした。"
"10039060-121-ナギサ" = "いざとなったら、その時はミカさんが……。"
"10039060-127-ミカ" = "……わ、私！？"
"10039060-128-ミカ" = "え、なに？#n私が戦うの……？"
"10039060-129-ミカ" = "ナギちゃん本気？#nそのために連れてきたの！？"
"10039060-130-ナギサ" = "全てはトリニティの安寧のためなのです！"
"10039060-131-ミカ" = "い、いやいや！"
"10039060-132-ミカ" = "私それ関係なくない！？#nそれに、まだ自粛中だし……。"
"10039060-133-ミカ" = "ねえ、ナギちゃん！#nお願いだから、もう少し冷静になろうよ！"
"10039060-134-ミカ" = "どうしよう、もう先生に連絡するしか……！"
"10039060-140-ナギサ" = "……。"
"10039060-141-ナギサ" = "……ついに現れましたね、当事者のお二人が。"
"10039060-148-ミネ" = "……時間通りですね、サクラコさん。"
"10039060-149-ミネ" = "結論は出せましたか？"
"10039060-150-サクラコ" = "ええ。"
"10039060-151-サクラコ" = "もちろんです。"
"10039060-153-サクラコ" = "このような重大な場に遅れるはずが――"
"10039060-159-サクラコ" = "それより、どうしたのでしょうか。"
"10039060-160-サクラコ" = "この人の数は……。"
"10039060-161-ミネ" = "救護騎士団の皆さんも揃ってますね……。"
"10039060-162-ミネ" = "……何かあったのでしょうか？"
"10039060-163-ナギサ" = "……どうやら、情報は正しかったようですね。"
"10039060-168-ナギサ" = "サクラコさん、ミネ団長。"
"10039060-170-サクラコ" = "……ナギサさん？"
"10039060-171-ミネ" = "謝肉祭でお忙しいはずの方が、どうしてここに……？"
"10039060-173-ナギサ" = "この期に及んで白を切るとは……ずいぶんと侮られたものですね？"
"10039060-175-サクラコ" = "……？"
"10039060-176-ミネ" = "……はい？"
"10039060-178-ナギサ" = "ティーパーティーのホストとして、正式に問います。"
"10039060-179-ナギサ" = "ここに集まっている理由をお答えください。"
"10039060-180-ミネ" = "……それは、「[ruby=カーニバル]謝肉祭[/ruby]運営委員長」でなく、#n「ティーパーティーのホスト」としての質問、ですか？"
"10039060-181-ナギサ" = "はい、何か問題でも？"
"10039060-182-ミネ" = "……なるほど。"
"10039060-183-ミネ" = "お答えしましょう。"
"10039060-187-ミネ" = "――そちらとは関係ない話です。"
"10039060-188-ナギサ" = "…………。"
"10039060-189-ナギサ" = "…………！"
"10039060-190-ナギサ" = "……ミカさん！"
"10039060-191-ミカ" = "ナギちゃん！？もうちょっと冷静になって！？"
"10039060-192-ミカ" = "も、もうちょっと話を……。"
"10039060-193-ナギサ" = "ミカ！"
"10039060-194-ミカ" = "あ～っ！#nもう、ナギちゃんったら！"
"10039060-195-ミカ" = "うぅ……どうなっても知らないんだからね！！"
"10039060-201-ミネ" = "……？"
"10039060-202-ミネ" = "銃を構えて、どうしたのですか！？"
"10039060-203-ミネ" = "ティーパーティーは……ナギサ様は何をお考えで！？#nついに自暴自棄になってしまったのですか！？"
"10039060-204-ミネ" = "……ナギサ様がご乱心であるのなら、私が救護騎士団の団長として受けて立ちます。"
"10039060-205-ミネ" = "サクラコさん、準備を！"
"10039060-207-サクラコ" = "……え？"
"10039060-208-ミネ" = "早く……！"
"10039060-209-サクラコ" = "え、えぇ……！？"
"10039060-210-サクラコ" = "どうしてこんなことに……！？"
"10039060-211-シスターフッドの生徒A" = "最初からこれを狙っていたのですね、サクラコ様……！"
"10039060-212-シスターフッドの生徒B" = "総員、戦闘準備！！"
"10039060-219-救護騎士団の団員A" = "戦闘態勢、用意！"
"10039060-220-セリナ" = "え、ええええええっ！？"
"10039060-227-ナギサ" = "よくも、こんな日にクーデターを……！"
"10039060-228-ミネ" = "いいえ！#nこれは権力に対する抗議です！"
"10039060-229-サクラコ" = "どうして、私は何も……！"
"10039060-230-ミカ" = "本当に知らないんだからね！"
"10039060-232" = "[log=마리]お待ちください！[/log]"
"10039060-245-マリー" = "……皆さん！"
"10039060-250-マリー" = "どうか……。"
"10039060-251-マリー" = "戦いをやめてください！！"
