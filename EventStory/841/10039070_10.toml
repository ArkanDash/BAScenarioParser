[translation]
"10039070-1" = "第7話;[ruby=Antique Seraphim]アンティーク・セラフィム[/ruby]・ビギニング"
"10039070-3" = "[log=마리]\"皆さん、どうか戦いをやめてください！\"[/log]"
"10039070-8-ナギサ" = "……？"
"10039070-9-ミカ" = "せ、先生！？"
"10039070-11-ミネ" = "マリーさん……それに、先生……。"
"10039070-12-サクラコ" = "どうして、こちらに？"
"10039070-13-サクラコ" = "それよりも、そのバイクは……。"
"10039070-18-マリー" = "事情は分かりませんが、戦いはやめてください！"
"10039070-19-マリー" = "まずは話し合いをしましょう！#nシャーレの先生もお連れしましたから！"
"10039070-20-マリー" = "……ほかでもない、平和と安全を象徴する[ruby=カーニバル]謝肉祭[/ruby]の開催期間中です！"
"10039070-21-マリー" = "皆さん、どうか銃を下ろしてください！"
"10039070-22" = "[ns1] \"みんな、とりあえず落ち着こうか。\"\n[ns2] \"何があったのか、説明してくれる？\""
"10039070-25-ナギサ" = "……。"
"10039070-26-ナギサ" = "……また、先生の手を煩わせてしまうとは。"
"10039070-27-ナギサ" = "少し長くなるかもしれませんが、最初からご説明しましょう。"
"10039070-28-ナギサ" = "トリニティにおいて、重大な――"
"10039070-29-サクラコ" = "……よく来てくれました！"
"10039070-30-サクラコ" = "実はマリーにお願いがあるのです。"
"10039070-31-ナギサ" = "……？"
"10039070-32-ナギサ" = "……はい？"
"10039070-34-マリー" = "……？"
"10039070-35-マリー" = "わ、私にですか……？"
"10039070-36-サクラコ" = "はい……もちろん、無理強いはしません。"
"10039070-43-ミネ" = "……！"
"10039070-44-ミネ" = "ちょうど私も、サクラコさんと同じ考えでした。"
"10039070-45-サクラコ" = "ふふ。ありがとうございます、ミネ団長。"
"10039070-47-マリー" = "すみません……。"
"10039070-48-マリー" = "お話が見えてこないのですが……。"
"10039070-50-サクラコ" = "……ふふっ。"
"10039070-51-サクラコ" = "おそらく私たちは同じ結論に至ったのでしょう。"
"10039070-55-サクラコ" = "……マリー。"
"10039070-56-ミネ" = "マリーさん。"
"10039070-57-サクラコ&ミネ" = "……アイドルグループの[ruby=リーダー]指導者[/ruby]になってくれませんか？"
"10039070-59-マリー" = "はい！？"
"10039070-60-ナギサ" = "……！？"
"10039070-61" = "[ns3] \"マリーをアイドルグループの……。\"\n[ns4] \"[ruby=リーダー]指導者[/ruby]に！？\""
"10039070-64-サクラコ" = "まずは謝らせてください。#n今まで練習に必死だったあまりに、マリーの気持ちを考えられていませんでした。"
"10039070-65-サクラコ" = "ですが、思い返すとアイドルについて話しているマリーは、#nとても楽しそうな表情をしていたと気づいたのです。"
"10039070-66-サクラコ" = "私たちよりも、マリーのほうが……。"
"10039070-67-サクラコ" = "「アイドル」に[ruby=ふさわ]相応[/ruby]しいと思うのです。"
"10039070-68-サクラコ" = "……私なりに、アイドルとはどのような存在なのかを考えてみました。"
"10039070-69-サクラコ" = "そして舞台に立ち、#n素敵なパフォーマンスで皆を笑顔にする者がそうなのだと思ったのです。"
"10039070-70-サクラコ" = "まさしく、光のように。"
"10039070-71-サクラコ" = "……この結論に至った時、ふとマリーの顔が浮かんだのです。"
"10039070-72-サクラコ" = "マリーこそ、誰よりもアイドルに相応しい存在……。"
"10039070-73-サクラコ" = "そして、私たちにとっての「アイドル」。"
"10039070-74-ミネ" = "もっと早く気づいていれば……。"
"10039070-75-ミネ" = "そもそも、グループの方向性やレッスンの内容は、#nマリーさんが決めてくれましたね。"
"10039070-76-ミネ" = "……ぜひ、リーダーになっていただけないでしょうか？"
"10039070-77-ミネ" = "私とサクラコさんの目標は、あくまでマイナスイメージを払拭するため。#nリーダーの座に拘っているわけではありませんから。"
"10039070-78-サクラコ" = "マリーはシスターフッドでも、クラスでも信頼されているでしょう。"
"10039070-79-サクラコ" = "だからこそ、任せられると思ったのです。"
"10039070-81-マリー" = "え、えっと、つまり……。"
"10039070-86-マリー" = "わ、私が……。"
"10039070-87-マリー" = "私が、アイドルに……？"
"10039070-89-サクラコ" = "……はい、その通りです。"
"10039070-90-ミネ" = "突然の提案で、混乱させてしまったかもしれませんが……。"
"10039070-91-サクラコ" = "……マリー。"
"10039070-92-サクラコ&ミネ" = "一緒にアイドルをやりませんか？"
"10039070-94-マリー" = "皆さん……。"
"10039070-99-マリー" = "あれ……。"
"10039070-100-マリー" = "では、この集まりは……。"
"10039070-101" = "[ns5] \"指導者って……。\"\n[ns6] \"アイドルグループのリーダーのことだったんだね……。\""
"10039070-104-サクラコ" = "……？"
"10039070-105-サクラコ" = "そう、ですが……？"
"10039070-106-ミネ" = "まさか先生まで来てくださるとは思いませんでしたが、#n私たちの行く末を決める重大な場面でしたから助かりました。"
"10039070-107-ミネ" = "……？"
"10039070-108-ミネ" = "どうかされましたか……？"
"10039070-109-ミネ" = "……はっ。"
"10039070-110-ミネ" = "もしかして、私たちはマリーさんに無理強いを……！？"
"10039070-111-サクラコ" = "……！"
"10039070-112-サクラコ" = "そうだったのですか！？#n申し訳ありません、無理にとは……！"
"10039070-114-マリー" = "い、いえ、違います！"
"10039070-115-マリー" = "実は、やってみたいと思っていましたので……と、とても嬉しいです！"
"10039070-120-マリー" = "……うぅ。"
"10039070-121-マリー" = "い、今の言葉は忘れてください……！"
"10039070-122-マリー" = "……ではなく、私もアイドルになって良いのでしょうか？"
"10039070-123-マリー" = "歌のパートは決まっていますし、衣装の準備がこれからとなると……。"
"10039070-129" = "[ns7] \"それなら心配いらないよ。\"\n[ns8] 写真を取り出す。"
"10039070-133-マリー" = "……？"
"10039070-139-マリー" = "……せ、先生！？"
"10039070-141-サクラコ" = "これは……！"
"10039070-142-サクラコ" = "事前にご用意してくださったのですね。"
"10039070-143-ミネ" = "……ありがとうございます、先生。"
"10039070-145-マリー" = "で、ですが……！"
"10039070-146-マリー" = "ううぅ……！"
"10039070-147" = "[ns] \"……マリー。\""
"10039070-149" = "[ns9] \"みんな、マリーを大事に思ってるんだよ。\"\n[ns10] \"正直に答えてくれると嬉しいな。\""
"10039070-152-マリー" = "そんな……。"
"10039070-153-マリー" = "……うぅ。"
"10039070-154-マリー" = "で、では……。"
"10039070-155-マリー" = "……………………。"
"10039070-156-マリー" = "よ……。"
"10039070-157-マリー" = "よろしく……お願い、しますね。"
"10039070-161-マリー" = "……えへへっ。"
"10039070-167" = "[ns11] \"この破壊力は……！\"\n[ns12] \"す、すごい……！\""
"10039070-172-一同" = "マリー！マリー！マリー！マリー！"
"10039070-173-マリー" = "み、皆さん……！？"
"10039070-174-マリー" = "う、うぅ……。"
"10039070-177-ミカ" = "……。"
"10039070-178-ミカ" = "ねえ、ナギちゃん。"
"10039070-179-ミカ" = "言いたいことは？"
"10039070-183-ナギサ" = "み、ミカさん……。"
"10039070-184-ナギサ" = "これは、その……。"
"10039070-186-ミカ" = "……なぁに？"
"10039070-187-ナギサ" = "えっと……。"
"10039070-188-ナギサ" = "……いえ。"
"10039070-192-ミカ" = "……ふ～ん☆"
"10039070-193-ミカ" = "とりあえず、帰ろっか。"
"10039070-194-ミカ" = "ずっとここにいても、お邪魔だろうし。"
"10039070-195-ミカ" = "……お話は、あとで聞かせてもらうね？"
