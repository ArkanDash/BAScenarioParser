[translation]
"10039035-2-キリノ" = "――シスターさん！"
"10039035-3-キリノ" = "本当に素晴らしい活躍でした！#nご協力ありがとうございます……！"
"10039035-4-マリー" = "お、お役に立てたならなによりです……。"
"10039035-5-フブキ" = "いやぁ、大助かりだったよ。"
"10039035-6" = "[s1] \"キリノの動きを完全にコピーしてたよ。\"\n[s2] \"マリーはダンスが上手なんだね。\""
"10039035-9-マリー" = "つい夢中になっていました……えへへ。"
"10039035-10-フブキ" = "そういえば、二人はアイドルについて勉強してるんだっけ？"
"10039035-11-フブキ" = "せっかく助けてくれたのに、ダンスをちょっと教えただけってのもねぇ。"
"10039035-12-マリー" = "い、いえ……私のことはお気になさらず！"
"10039035-13-フブキ" = "ふふっ、大丈夫。"
"10039035-14-フブキ" = "私が何かするわけじゃないよ。"
"10039035-15-フブキ" = "シスターさんも一緒にダンスレッスンを受けてみない？"
"10039035-16-フブキ" = "私が……。"
"10039035-17-フブキ" = "……ううん、キリノが話を通しとくから。"
"10039035-19-キリノ" = "つ、ついにフブキがやる気を……！"
"10039035-20-フブキ" = "生徒が増えると楽できるしね～。"
"10039035-21" = "[s3] （いつも通りのフブキだった……）\n[s4] \"マリーにとっても良い話だと思う。\""
"10039035-24-マリー" = "皆さん……！"
"10039035-25-？？？" = "フブキ～、キリノ～！"
"10039035-28-フブキ" = "……げっ。"
"10039035-32-アルバイト" = "助けてくれてありがとー！流石うちの常連さん！"
"10039035-33-アルバイト" = "ライブ、楽しみにしてるよ！#nその日はシフト入れずに……#nというか、臨時休業にして店長も行くんじゃないかな！"
"10039035-34-フブキ" = "う……。"
"10039035-39" = "[ns5] \"二人とも、人気なんだね。\"\n[ns6] \"大活躍だったね。\""
"10039035-44-マリー" = "なるほど……。"
"10039035-45-マリー" = "もし、アイドルになったら……。"
"10039035-46-マリー" = "……ふふっ。"
"10039035-47-マリー" = "とても楽しそうですね。"
"10039035-59" = "ダンス、クリア"
