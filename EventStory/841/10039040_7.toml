[translation]
"10039040-1" = "第4話;アイドルの道：曲"
"10039040-2-マリー" = "衣装とダンスは大丈夫そうですね。"
"10039040-3-マリー" = "ありがとうございます、先生。"
"10039040-4-マリー" = "おかげで順調に進んでます。"
"10039040-5-マリー" = "あとは曲の問題を解決すれば……。"
"10039040-6-マリー" = "……すれば、もうおしまいなんですね。"
"10039040-10" = "[ns1] \"……マリー？\"\n[ns2] \"どうかしたの？\""
"10039040-13-マリー" = "……い、いえ！"
"10039040-14-マリー" = "少しぼーっとしてしまっただけです。"
"10039040-15-マリー" = "では、アイドルソングについて……。"
"10039040-16-？？？" = "やあ、先生。"
"10039040-17-マリー" = "……？"
"10039040-18-マリー" = "先生、お客さんが……。"
"10039040-19" = "[ns3] \"この声は……。\"\n[ns4] \"……ウタハ？\""
"10039040-24-ウタハ" = "……話は聞かせてもらったよ。"
"10039040-25-ウタハ" = "水臭いじゃないか、先生。#nアイドルだなんて、面白そうな――"
"10039040-29-ウタハ" = "――大事なイベントを前に、一言も相談してくれないとは。"
"10039040-30" = "[s5] \"……言い直した！？\"\n[s6] \"「面白そう」って言わなかった！？\""
"10039040-33-ウタハ" = "気のせいじゃないか？#nとにかく、助けが必要だと思ってね。"
"10039040-34-ウタハ" = "何か困っていることはないのかい？"
"10039040-35-ウタハ" = "……なるほど、曲か。"
"10039040-36-ウタハ" = "それなら、いくつかストックがあるよ。"
"10039040-37-ウタハ" = "……どうして準備が良いのかって？"
"10039040-38-ウタハ" = "それはもちろん……。"
"10039040-39-ウタハ" = "……私も、アイドルイベントに参加するつもりだからさ。"
"10039040-40" = "[s7] \"ウタハが！？\"\n[s8] \"エンジニア部が！？\""
"10039040-43-ウタハ" = "ふふ、予想通りの反応だね。"
"10039040-44-ウタハ" = "だが、ステージに立つのは私だけなんだ。"
"10039040-45-ウタハ" = "ヒビキたちとは音楽性の違いがあったのさ。"
"10039040-46-ウタハ" = "二人には、まだ早かったのかもしれない……。"
"10039040-47-ウタハ" = "けど、私のステージを見てくれれば、きっと気づいてくれるはず。"
"10039040-48-ウタハ" = "……アイドルの役割に。"
"10039040-49-マリー" = "アイドルの、役割……？"
"10039040-50-ウタハ" = "ああ、そうさ。アイドルになりたい理由は人それぞれだからね。"
"10039040-51-ウタハ" = "皆それぞれ、気持ちを言葉に乗せて、感情を伝えるんだ。"
"10039040-52-ウタハ" = "……私の場合、ついでに「雷ちゃんミラーボールVer」を披露したりもする。"
"10039040-53-ウタハ" = "大事なのは「心」。#n意外にも、アイドルはマイスターと似ているね。"
"10039040-54-ウタハ" = "ところで今さらだが、こちらの方は……？"
"10039040-55-ウタハ" = "……なるほど。"
"10039040-56-ウタハ" = "シスターさんがアイドルについて勉強しているところなのか。"
"10039040-57-ウタハ" = "てっきり、先生がアイドルデビューするのだと思っていた。"
"10039040-58" = "[s9] \"私がアイドルって……。\"\n[s10] \"生徒たちの学園祭だからね……。\""
"10039040-61-ウタハ" = "ふふ。冗談だよ、冗談。"
"10039040-62-ウタハ" = "応援しているよ、シスターさん。"
"10039040-63-ウタハ" = "きっと素敵なアイドルになれるはずさ。#nこのマイスターが保証する。"
"10039040-64-マリー" = "あ、はいっ！#nありがとうございます！"
"10039040-69-マリー" = "……え？"
"10039040-70-マリー" = "わ、私がアイドルに……？"
"10039040-71-ウタハ" = "……ん？"
"10039040-72-ウタハ" = "アイドルになるために勉強しているんじゃなかったのかい？"
"10039040-73-ウタハ" = "あれ、じゃあやっぱり先生がアイドルに……？"
"10039040-74" = "[s11] \"いやいや、違うよ！\"\n[s12] \"私はアイドルやるつもりないよ！？\""
"10039040-77-マリー" = "あはは……。"
"10039040-78-マリー" = "私はアイドルのサポートをしているだけなんです。"
"10039040-79-ウタハ" = "……？"
"10039040-83-ウタハ" = "……ふむ。"
"10039040-84-ウタハ" = "そう、だったのか。"
"10039040-85-ウタハ" = "ステージに君が立っている姿を見てみたかったのだが、少し残念だね。"
"10039040-86-マリー" = "わ、私は……。"
"10039040-87-マリー" = "それよりも、曲があると先ほど言っていましたが、#n聞かせていただけないでしょうか？"
"10039040-88-ウタハ" = "もちろん、最初からそのつもりさ。"
"10039040-89-ウタハ" = "先生、ここは私に任せてくれるかい？"
"10039040-93" = "[ns13] \"うん、任せるよ。\"\n[ns14] \"期待してるよ、ウタハ。\""
"10039040-96-ウタハ" = "そう言われたら、マイスターとして応えるしかないね。"
"10039040-97-ウタハ" = "シスターさん、先にこの場所へ向かっていてくれるかい？#n私は先生と少し話があるんだ。"
"10039040-98-マリー" = "ここは……？"
"10039040-99-ウタハ" = "カラオケだよ、これも曲選びのためさ。"
"10039040-100-ウタハ" = "話が終わったら、私たちも追いかけよう。"
"10039040-101-マリー" = "はい！"
"10039040-102-マリー" = "ありがとうございます、ウタハさん！#nでは、先に向かっています！"
"10039040-108-ウタハ" = "……。"
"10039040-109-ウタハ" = "……ふむ。"
"10039040-113" = "[ns15] \"……ウタハ。\"\n[ns16] \"話って、マリーのこと？\""
"10039040-116-ウタハ" = "ああ、ちょっと確認をしたくてね。"
"10039040-117-ウタハ" = "本当にやらないのかい？"
"10039040-118-ウタハ" = "……アイドル。"
"10039040-119-ウタハ" = "先生も気づいてるだろう？"
"10039040-120-ウタハ" = "彼女はアイドルに興味を持っている。"
"10039040-121-ウタハ" = "まだ自覚はないだろうけど。"
"10039040-122-ウタハ" = "言いたかったのは、それだけさ。"
"10039040-123-ウタハ" = "……ん？"
"10039040-124-ウタハ" = "もう少し状況を見ておきたい、と？"
"10039040-125-ウタハ" = "……なるほど、考えがあってのことなんだね。"
"10039040-126-ウタハ" = "楽しみにしているよ、あの子のステージ。"
"10039040-130-ウタハ" = "それはそうと、先生は私の好きな曲のジャンルを理解しているはずだ。#n……カラオケに行くわけだから、当然一緒に歌ってくれるだろう？"
"10039040-131" = "[s] \"それが目的だったの！？\""
"10039040-133" = "（その後、カラオケでアイドルソングをいくつか聞いてから、ウタハのカラオケに付き合った）"
"10039040-140" = "曲、クリア"
"10039040-145" = "（……翌日）"
"10039040-146-サクラコ" = "これは……。"
"10039040-147-サクラコ" = "まさか、ここまで調べてくれるとは。"
"10039040-148-ミネ" = "……驚きました。"
"10039040-149-ミネ" = "こんなに調べるのはさぞ大変だったでしょう……。"
"10039040-150-サクラコ" = "私たちの勉強不足のせいで……。"
"10039040-151-ミネ" = "……？"
"10039040-152-ミネ" = "私「たち」と仰いましたか……？"
"10039040-157-ミネ" = "……否定はできないですね。"
"10039040-158-ミネ" = "クマもできていますし、とても頑張ってくださったのでしょう。"
"10039040-159-ミネ" = "……マリーさん、申し訳ありませんでした。"
"10039040-161-マリー" = "ど、どうか頭を上げてください……！"
"10039040-162-マリー" = "私も楽しい時間でしたので。#n寝不足なのは、どの曲が良いのか夢中になって考えていただけですし……。"
"10039040-163-サクラコ" = "ここは謝罪ではなく、感謝の気持ちを伝えたほうがマリーの気も楽でしょう。"
"10039040-164-サクラコ" = "本当に、ありがとうございました。"
"10039040-165-マリー" = "サクラコ様……！"
"10039040-166-サクラコ" = "ですから……。"
"10039040-167-サクラコ" = "あとはゆっくり休んでください。"
"10039040-174-マリー" = "……えっ？"
"10039040-175-サクラコ" = "これだけの資料をまとめるだけでも、相当大変だったでしょう？"
"10039040-176-サクラコ" = "あとは、私とミネ団長で何とかします。"
"10039040-177-ミネ" = "ええ、マリーさんの頑張りを無駄にはいたしません。"
"10039040-179-マリー" = "あっ、はい……。"
"10039040-181-サクラコ" = "……？"
"10039040-182-ミネ" = "どこか気になる点でもあるのでしょうか？"
"10039040-184-マリー" = "……い、いえ！#n何でもありません！"
"10039040-185-マリー" = "そ、それでは、お二人とも頑張ってください！"
"10039040-190-サクラコ" = "……マリー？"
"10039040-191-サクラコ" = "何かあったのでしょうか……？"
"10039040-192-ミネ" = "サクラコさん？"
"10039040-193-ミネ" = "もう時間がありません。"
"10039040-194-ミネ" = "やるべきことは山積みです！"
"10039040-195-ミネ" = "さっそく始めましょう！マリーの犠牲を無駄にしないためにも。"
"10039040-197-サクラコ" = "ぎ、犠牲！？マリーは生きてますよ！？"
"10039040-198-ミネ" = "……サクラコさんっ！"
"10039040-199-サクラコ" = "うっ、わ、分かりました！"
"10039040-206-マリー" = "…………。"
"10039040-212-マリー" = "ヒナタさん、どうされましたか？"
"10039040-213-マリー" = "……はっ！"
"10039040-214-マリー" = "聖堂の仕事が――！"
"10039040-215-マリー" = "……え？"
"10039040-216-マリー" = "あ、もうほとんど終わっているのですね。"
"10039040-217-マリー" = "……はい。"
"10039040-218-マリー" = "分かりました。"
"10039040-219-マリー" = "では、またご連絡しますね。"
"10039040-224-マリー" = "お休みをもらってしまいました……。"
"10039040-225-マリー" = "久々にゆっくりできるかもしれませんね。"
"10039040-226-マリー" = "……ですが、何なのでしょうか。"
"10039040-228-マリー" = "この気持ちは……。"
