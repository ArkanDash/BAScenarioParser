"10039005-23" = "\"あの噂、聞いた……？\""
"10039005-27" = "\"二時間後にトリニティ・スクエアで何か起きる、ってやつだよね。\""
"10039005-31" = "\"学園祭期間なのに……。\""
"10039005-35" = "\"……どうなるんだろう。\""
