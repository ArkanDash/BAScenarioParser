"10028005-72-組織員A" = "さっさと入れ！悪足掻きはするなよ。"
"10028005-77-組織員B" = "……よし、止まれ！#n大人しくしてるんだぞ。"
"10028005-78-組織員A" = "鎖、足枷の固定完了！！"
"10028005-83-組織員B" = "お前の処分は本部で決まる。陽の光が見られるのも今日で最後だろうな。#nせいぜい、最後の1日を楽しむといい。"
"10028005-84-？？？" = "…………。"
"10028005-85-組織員B" = "……チッ、黙りやがって。"
