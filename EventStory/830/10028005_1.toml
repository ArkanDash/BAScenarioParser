"10028005-89-組織員C" = "あのゲヘナの風紀委員が、要注意人物として目を光らせてるくらいだ。"
"10028005-90-組織員A" = "だが、それも今日で最後。#nなんせ私たちのファミリーでも悪名高い――"
"10028005-91-組織員A" = "――「アランチーノ・ファミリー」が、始末を請け負ったんだ。"
"10028005-92-？？？" = "…………。"
"10028005-93-組織員B" = "ドアを閉めろ！全員、中に移動して座るんだ！！"
