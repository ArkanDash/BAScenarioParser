"10049040-152-スズミ" = "えっ、あ、それは本当ですか？"
"10049040-153-レイサ" = "はい！きっと、友情エネルギーを奪おうとしているんです！"
"10049040-168-スズミ" = "（良かった……なんとか乗り切れそうですね……）"
"10049040-169-スズミ" = "（先生の言う通り、ステージの上からだと周りがよく見えます……これなら……）"
"10049040-170-スズミ" = "（あっ、汗が……）"
