[translation]
"10049040-1" = "第4話;ステージショー開演！"
"10049040-2" = "控え室"
"10049040-3-レイサ" = "わぁっ！！ここが控え室！！"
"10049040-4-レイサ" = "キャストさんになった気分です！！"
"10049040-5-スズミ" = "レイサさん！"
"10049040-7-公演のマネージャー" = "ふーむ……。"
"10049040-8-公演のマネージャー" = "あなた達、本当にキャストですか？"
"10049040-9-公演のマネージャー" = "名簿に載ってなかったような……#nあー、ったく、名簿持ってくるの忘れたな……。"
"10049040-10-スズミ" = "！！"
"10049040-15-スズミ" = "（よくないですね……もし正体がバレてしまえば……）"
"10049040-16-スズミ" = "（潜入もバレて……ターゲットに気づかれてしまうかも……）"
"10049040-17-スズミ" = "（どうしましょう……？）"
"10049040-18-スズミ" = "（なにか……打開策を考えなければ……）"
"10049040-22-レイサ" = "フィードランプよりチャンバーへ……6条右回りの魔法よ！揺るぎなき力をっ！"
"10049040-28-レイサ" = "ボルトフォワード！テルミットピンク！"
"10049040-29-レイサ" = "これで準備完了です！"
"10049040-30-スズミ" = "レイサさん！？"
"10049040-31-レイサ" = "自然にポーズをとれば大丈夫です！"
"10049040-32-スズミ" = "っ……うぅ……。"
"10049040-38-スズミ" = "まじかる、りりかる……#nてるみっとほわいと！"
"10049040-42-公演のマネージャー" = "心配しすぎか……#nショーは10分後から始めますので、よろしくお願いしますね。"
"10049040-46-スズミ" = "はあぁ……。"
"10049040-47-レイサ" = "なんとか誤魔化せましたね！"
"10049040-48-スズミ" = "ひとまずは切り抜けられましたが……問題はこれからです。"
"10049040-49-スズミ" = "まさかこんな事になるだなんて……このままでは、10分後にはステージの上ですよ！"
"10049040-50" = "[s1] \"むしろ好都合じゃないかな？\"\n[s2] \"ステージの上だと、見晴らしが良くなるし。\""
"10049040-53-スズミ" = "そ、そうでしょうか……。"
"10049040-54-スズミ" = "ですが、私……魔法少女の作品は子供のころに観たっきりですし……。"
"10049040-55-スズミ" = "なにより、大勢の前に立つのは……想像するだけで怖いです……。"
"10049040-56-レイサ" = "スズミさんはカッコいいですから！心配する必要なんてありません！"
"10049040-57-レイサ" = "自警団として、いつも堂々としてるじゃないですか！"
"10049040-58-スズミ" = "それとこれとは別問題です！"
"10049040-59-スズミ" = "私はどうしたら……。"
"10049040-61" = "[ns3] \"それっぽいセリフを言うのはどう？\"\n[ns4] \"時間稼ぎだと思ってさ。\""
"10049040-64-スズミ" = "ですが、どんなセリフを言えばいいか……。"
"10049040-65-レイサ" = "ふふん、テルミットホワイトのセリフですね！"
"10049040-66-レイサ" = "私にお任せください！"
"10049040-73-スズミ" = "それは……ペンですか？"
"10049040-74-レイサ" = "「ペン」ではありません！"
"10049040-75-レイサ" = "「マジカル・カンニング」です！"
"10049040-76-レイサ" = "今からこれで――"
"10049040-77-レイサ" = "スズミさんの手のひらにセリフを書いてあげます！"
"10049040-82-スズミ" = "ま、待ってください！そんないきなり――きゃっ！"
"10049040-87-スズミ" = "くっ、ふふっ……くすぐったいです！あははっ！！"
"10049040-89" = "[ns] （スズミってあんな笑い方もするんだ）"
"10049040-95-レイサ" = "準備オッケーです！"
"10049040-96-スズミ" = "はぁ、はぁ……。"
"10049040-97-スズミ" = "私、くすぐりには弱くて……。"
"10049040-98-スズミ" = "手のひらは特に……！！"
"10049040-99-レイサ" = "でも、これでなんとかなると思います！"
"10049040-100-スズミ" = "なんとかって……。"
