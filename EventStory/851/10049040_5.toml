"10049040-107-レイサ" = "はい！！"
"10049040-108-スズミ" = "ま、まだセリフの確認が……！もう少し時間を……！"
"10049040-109-スズミ" = "それに、敵役のシミコさんがいなくていいんですか！？"
"10049040-110-レイサ" = "スケジュールだと……今は私たちだけでいいみたいです！"
"10049040-112" = "[ns5] \"がんばれ！\"\n[ns6] \"ファイト！テルミットホワイト！\""
"10049040-115-スズミ" = "う、うわあぁぁああ！！"
"10049040-121-子供A" = "テルミットホワイトだ！"
"10049040-122-子供B" = "テルミットピンクもいる！"
"10049040-123-子供A" = "かわいいね！お姫さまみたい！！"
"10049040-125-スズミ" = "（さっきよりも観客が増えていませんか！？）"
"10049040-126-スズミ" = "（みなさん、私を見て、歓声を……）"
"10049040-127-スズミ" = "（怖い……どうしよう、足がすくむ。指先の感覚がない、こわい）"
"10049040-128-スズミ" = "（私には……できません。こんな風に、期待されてしまうのは……）"
"10049040-129-レイサ" = "ボルトフォワード！テルミットピンク！"
"10049040-130-観客たち" = "わあああっ！！！"
"10049040-131-スズミ" = "レイサさん！？"
