"10020045-12-コタマ" = "「アトラ・ハシースの箱舟」、全エリアのハッキング完了。#n占有率100%を達成。"
"10020045-13-ハレ" = "これで、箱舟の「自爆シーケンス」を起動できるよ。"
"10020045-17-チヒロ" = "皆、準備が完了したら報告して！"
"10020045-18-チヒロ" = "「自爆シーケンス」は一度起動したら取り消すことはできないからね。すぐ船に戻って！"
"10020045-28-アヤネ" = "制御室、破壊完了です！"
"10020045-29-ホシノ" = "シロコちゃんは？"
"10020045-30-アヤネ" = "シロコ先輩がいるセクションには、先生が向かわれました！"
"10020045-34" = "[ns] シロコのいる部屋の扉を開ける。"
"10020045-37-シロコ" = "……先生。"
"10020045-38" = "[s] \"シロコ……大丈夫？\""
"10020045-39-シロコ" = "ん。話したいことがたくさんあるけど、今はとりあえず行かないとだよね。"
"10020045-40" = "[s] \"そうだね。詳しい話はまた後で聞くね。\""
"10020045-41-アヤネ" = "シロコ先輩、大丈夫ですか！？"
"10020045-42-シロコ" = "ん、このまま先生と一緒に行く……道を教えて。"
