[translation]
"10020010-5-リン" = "そちらが「次元エンジン」です！"
"10020010-6-アユム" = "気をつけてください、先生。#n「次元エンジン」を守っている防御システムを確認いたしました……。"
"10020010-7-リン" = "箱舟の主要設備である分、それ相応の戦力を覚悟していたつもりでしたが……これほどとは。"
"10020010-11-モモカ" = "おっと……ちょ～っと、しんどい戦いになりそうだねぇ。"
"10020010-12" = "[s] \"でも、やるしかないよ。\""
"10020010-14-？？？" = "……そんな事をしても、無駄。"
"10020010-19-リン" = "……先生、お気を付けて。#n「[ruby=・   ・]彼女[/ruby]」です。"
"10020010-26" = "[ns] \"シロコ……！！\""
"10020010-27-シロコ" = "……。"
"10020010-28" = "[s] \"シロコ、一体何をするつもり！？\""
"10020010-29-シロコ" = "ん――単純な事。"
"10020010-30-シロコ" = "先生が、箱舟を壊すのを阻止する。"
"10020010-31-シロコ" = "そうすれば、予定通り――キヴォトスは終焉を迎える。"
"10020010-36-シロコ" = "それが私の――「役割」だから。"
"10020010-37" = "[ns] \"………………！！！\""
"10020010-39-アヤネ" = "し、シロコ先輩が、再び現れました！"
"10020010-52-ホシノ" = "どこ！？"
"10020010-53-アヤネ" = "第1エリアの「次元エンジン」前です！#n今、先生と交戦中です！"
"10020010-54-ホシノ" = "……っ！！ "
"10020010-61-セリカ" = "ああっ、もう！！こんなことしてる場合じゃないのに……#n早くシロコ先輩のとこに行かなきゃ！！"
"10020010-62-ノノミ" = "でも、私たちはここを守らないと…… "
"10020010-64-ホシノ" = "……うん、そうだね。#n今は防衛に集中しないと。"
"10020010-65-ホシノ" = "ここは、先生に任せよっか。"
"10020010-67-アヤネ" = "はい……！！先生、お願いします！"
"10020010-68-アヤネ" = "シロコ先輩を……止めてください！！"
"10020010-77-アユム" = "せ、戦闘態勢に入りました……！先生、お気をつけて！"
