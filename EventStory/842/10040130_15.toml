[translation]
"10040130-1" = "後日談その5;みんなが寝静まった夜"
"10040130-2-ハレ" = "う、うっ……。"
"10040130-3-ユウカ" = "も、もう……飲めないわ……。"
"10040130-4-マキ" = "ふ、ふふ……来年は……世界をもっと、カラフルに……。"
"10040130-10-ノア" = "あら……？#nもうお目覚めでしたか。"
"10040130-11-ノア" = "最近、徹夜続きだったと伺ったような……大丈夫ですか？"
"10040130-12-チヒロ" = "ちょっと仮眠しちゃってたから、眠りが浅かったみたい。"
"10040130-13-チヒロ" = "まあ、まだサーバーのメンテナンスも残ってるし。"
"10040130-14-チヒロ" = "コユキのハッキング対策も、徹底的にやっておきたいから。#nちょうどよかったかも。"
"10040130-15-ノア" = "ふふっ。本当に、実直な方です。"
"10040130-19-ノア" = "ひとつお聞きしても良いでしょうか？"
"10040130-20-チヒロ" = "なに？"
"10040130-21-ノア" = "どうして、セミナーに入らなかったんですか？"
"10040130-22-チヒロ" = "今さらな質問だね……？"
"10040130-23-ノア" = "ですね。でも、一緒に過ごすうちに、気になってしまって。#nヴェリタスは本来、情報を自由に共有できる世界を求め、#n統制に抵抗するため作られた部活……でしたよね？"
"10040130-24-ノア" = "だというのに、チヒロ副部長はミレニアム全体のセキュリティを#n守ってくれていますし、ヴェリタスの他の皆さんのような奔放さも、あまり感じられません。"
"10040130-26-チヒロ" = "自由には責任が伴う、って言うでしょ。自由と無秩序をはき違えないように、#n私はそこを意識してるから。"
"10040130-27-チヒロ" = "とはいえ……#n他人の選択にまで責任を負いたがるのは、私は良くないと思ってる。"
"10040130-28-ノア" = "リオ会長のことですね？"
"10040130-29-チヒロ" = "まあ、強いて言えば。"
"10040130-30-チヒロ" = "でも……#n今でこそ対立してるけど、リオと考えが一致してた時期もあったんだよ。"
"10040130-31-チヒロ" = "ヒマリと三人で、ミレニアムの難題を解決しようとしてたんだ……。"
"10040130-32-ノア" = "ヒマリ部長もですか？#nちょっと想像できないですね。"
"10040130-33-チヒロ" = "仲が良かった、とは言ってないよ。"
"10040130-37-チヒロ" = "いや……もしかすると仲良しだったかも。"
"10040130-38-ノア" = "リオ会長は、気持ちを表に出さない方ですから。"
"10040130-39-チヒロ" = "ヒマリもそうだよ。"
"10040130-40-チヒロ" = "だから、もしかすると仲直りするきっかけを探してるのかも。"
"10040130-41-チヒロ" = "あ。今の、ヒマリには内緒ね。たぶん怒るから。"
"10040130-42-ノア" = "もちろんです。ふふっ。"
"10040130-44-チヒロ" = "ふーっ……随分遅い時間になっちゃった。"
"10040130-45-チヒロ" = "メンテナンスも終わったし、そろそろ帰ろうかな。"
"10040130-46-ノア" = "ご苦労様でした。いつもありがとうございます。"
"10040130-47-チヒロ" = "まあ、それこそいつもやってるから。たいしたことじゃないよ。"
"10040130-48-ノア" = "そのいつもは、明日も、来年も……今日みたく続くのでしょうか？"
"10040130-49-チヒロ" = "……どうだろう。#nでも、きっと続くんじゃないかな。"
"10040130-50-ノア" = "私は書記なので……どんな変化も欠かさず記録する者として、#nこの穏やかな日常が続いてくれたら、うれしいです。"
"10040130-52-ノア" = "そういうわけで……#n今年も変わらず、よろしくお願いしますね、先輩。"
"10040130-53-チヒロ" = "うん。こちらこそ、よろしく。"
