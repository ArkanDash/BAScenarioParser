[translation]
"10040010-1" = "第1話;そして共犯者に"
"10040010-2-？？？" = "ふっふっふっ。"
"10040010-4-？？？" = "今年も残りわずか。"
"10040010-5-？？？" = "嵐のような一年でした。#nいま余裕でいられるのが、嘘のように感じるほど。"
"10040010-6-？？？" = "……しかし、私は生き残りました。"
"10040010-7-？？？" = "そう、最後まで生き残ったのです。#n私の幸せを妬み、遮る者から逃げ抜きました。"
"10040010-8-？？？" = "ふっ、そんな自分が誇らしい……。"
"10040010-9-？？？" = "そろそろいいのではないでしょうか。#n激動の時間を生き抜いた自分自身に、ささやかなプレゼントを贈っても。"
"10040010-14-？？？" = "……孤独に、祝杯をあげようじゃありませんか。"
"10040010-15-？？？" = "この歪んだ世界に……自由を渇望する私の孤高の魂に。"
"10040010-19-？？？" = "……\"[ruby=Cheers]乾杯[/ruby]\"。"
"10040010-26-コユキ" = "……あ。"
"10040010-31-ユウカ" = "「あ」じゃないわよ……何よこれ？#n変な画像なんか映して……。"
"10040010-32-ノア" = "綺麗ですね。#n夜景の画像でそれっぽい雰囲気でも出そうとしてたんです？"
"10040010-34-コユキ" = "分かってるならそっとしといてくれません！？#n先輩は空気も読めないんですか！？"
"10040010-35-ユウカ" = "あんたにだけは言われたくないんだけど……。"
"10040010-36-コユキ" = "ひとり寂しく年末パーティーをしてただけじゃないですか！#nみじめな自分を慰めるために！"
"10040010-37-ユウカ" = "なんで反省部屋でパーティーしてるのよ……。"
"10040010-38-ユウカ" = "というか、みじめには見えないんだけど！？#n思いっきりくつろいでるじゃない！？"
"10040010-39-コユキ" = "ずいぶんな言いようですね！？#nそもそも誰のせいでこんなとこに閉じ込められてると！？"
"10040010-40-ユウカ" = "懲りずにセミナーの予算に手を出したあんたの自業自得でしょ！！"
"10040010-41-ユウカ" = "まったく、今度は何に使ったのよ！？"
"10040010-42-ユウカ" = "予算はあんたのポケットマネーじゃないんだから、#n勝手に使っちゃダメって何度言えば……！！"
"10040010-46-ユウカ" = "はぁ……。"
"10040010-47-ユウカ" = "反省部屋に閉じ込めても無駄なのかしら……。"
"10040010-49-コユキ" = "……！？"
"10040010-50-コユキ" = "つまり、釈放ってことですか！？"
"10040010-51-ユウカ" = "……はぁ？"
"10040010-52-ユウカ" = "そんなわけないでしょ……。"
"10040010-53-コユキ" = "ええぇぇぇぇ！？#nでもさっき、無駄って言ったじゃないですか！？"
"10040010-54-コユキ" = "あああぁぁぁ～！！！#nひどい！ひどすぎますっ！"
"10040010-55-ユウカ" = "……話すだけ無駄みたいね。"
"10040010-57-ノア" = "まあコユキちゃんらしいと思いますよ。"
"10040010-59-コユキ" = "はぁ……。"
"10040010-60-コユキ" = "まあ……百歩譲って私のせいだとしましょう。"
"10040010-61-ユウカ" = "百歩譲って……？"
"10040010-62-コユキ" = "今日が何の日かくらい分かりますよね？#n年末ですよ？今年最後の一日なんですよ？"
"10040010-63-コユキ" = "だというのに、こんな監獄みたいなとこでひとりぼっちなんて……！"
"10040010-64-コユキ" = "あまりにもあんまりじゃないですか？"
"10040010-65-コユキ" = "今日くらい……楽しんだっていいじゃないですかぁ……？"
"10040010-70-ユウカ" = "だから反省しなさいって言ってるの――！！！"
"10040010-76-ユウカ" = "反省を！"
"10040010-80-ユウカ" = "しなさい！"
"10040010-84-ユウカ" = "良いわね？"
"10040010-88-ユウカ" = "ちゃんと！"
"10040010-92-ユウカ" = "反省するのよ！！"
"10040010-97-コユキ" = "いたたたたっ！暴力反対！！"
"10040010-98-ユウカ" = "まったく、もう……。"
"10040010-99-ユウカ" = "分かったわ、要は退屈なのよね？"
"10040010-105-コユキ" = "……あれ？"
"10040010-106-ノア" = "なにか考えが？"
"10040010-108-ユウカ" = "コユキはとりあえず、そこで大人しくしてなさい。"
"10040010-109-ユウカ" = "ノアは、その……#n悪いけど、今日って時間大丈夫？"
"10040010-110-ノア" = "はい、私は大丈夫ですよ。"
"10040010-111-ユウカ" = "ありがとう。じゃあ、ちょっと時間もらうわね。"
"10040010-112-ユウカ" = "ちゃんと大人しくしてなさいよ！#nもし何かしでかしたら、今度こそただじゃおかないんだから！"
"10040010-113-コユキ" = "ただじゃおかないって、いったい何を……。"
"10040010-117-コユキ" = "……はっ！"
"10040010-118-コユキ" = "まさか、またノア先輩を使って……！"
"10040010-119-ユウカ" = "何よいきなり……#nっていうか、ノアと私で態度違くない？"
"10040010-120-ユウカ" = "もしかして、私なんて怖くないって言いたいわけ！？"
"10040010-121-ユウカ" = "たしかにノアの記憶力はすごいけど……。"
"10040010-122-コユキ" = "いや、それもありますけど……もっとこう……。"
"10040010-123-コユキ" = "先輩も感じたことありません？"
"10040010-124-コユキ" = "独特の[ruby=あつ]圧[/ruby]……というか？"
"10040010-125-コユキ" = "言ってることと本音が違ってそうで、考えが読めない、的な？"
"10040010-126-コユキ" = "……感じません？"
"10040010-130-ノア" = "…………。"
"10040010-132-コユキ" = "……？"
"10040010-133-ノア" = "……………………。"
"10040010-134-コユキ" = "…………？？？"
"10040010-135-ノア" = "……コユキちゃん。"
"10040010-136-ノア" = "そういう話は、本人のいないところでしましょうね……？"
"10040010-137-コユキ" = "……あ。"
"10040010-138-コユキ" = "えっと、その……ノア先輩は、気にしないかなって……。"
"10040010-142-ノア" = "……………………。"
"10040010-147-コユキ" = "……びゃっ！"
"10040010-149-ユウカ" = "……さっきから何の話してるのよ？"
"10040010-150-ユウカ" = "というか、何考えてるのか分かんないのはあんたの方でしょ！"
"10040010-151-ユウカ" = "まあ、ノアのイタズラに思うところがないわけじゃないけど。#nあんたに比べたらたいしたことないわ。"
"10040010-157-コユキ" = "え、ええ……マジで言ってます？"
"10040010-159-ユウカ" = "何よ、その顔……。"
"10040010-160-コユキ" = "あ、いえ……ユウカ先輩は、それで良いんじゃないですか？"
"10040010-161-ユウカ" = "……！？"
"10040010-168-コユキ" = "な、なんでー！？#n今のは何がダメなんです！？"
"10040010-169-ユウカ" = "なんかちょっと、許せなくて。"
"10040010-170-ユウカ" = "それで、さっきの返事は？#nちゃんと大人しくできる？"
"10040010-171-コユキ" = "はいぃ……。"
"10040010-172-ユウカ" = "……はぁ、なんか疲れちゃった。#n行きましょ、ノア。"
"10040010-178-ノア" = "……………………。"
"10040010-179-コユキ" = "……な、何ですか先輩？"
"10040010-180-ノア" = "ふふっ……。"
"10040010-181-ノア" = "なんでもないです。"
"10040010-191-コユキ" = "…………。"
"10040010-192-コユキ" = "…………くくくっ。"
"10040010-193-コユキ" = "……行きましたね？"
"10040010-198-コユキ" = "くくくくっ……には、にはははは……！！"
"10040010-200" = "（……その頃、シャーレでは）"
"10040010-207" = "[ns1] \"はぁ……仕事が多すぎる。\"\n[ns2] \"大晦日なのに……。\""
"10040010-211-ユウカ" = "年末調整が終わってないって……もう年末ですよ？"
"10040010-212-ユウカ" = "しかも、こんなに残って……#nどうしてもっと早く相談してくれなかったんですか！"
"10040010-213-ユウカ" = "せ～ん～せ～い～！！"
"10040010-215-ユウカ" = "締め切りは来週だから大丈夫……？"
"10040010-216-ユウカ" = "どこが大丈夫なんですか！"
"10040010-217-ユウカ" = "これは[ruby=・   ・]年末[/ruby]調整ですよ！#n今年中に終わらせてください！"
"10040010-218-ユウカ" = "……リタイア？#nもう、ゲームじゃないんですよ！"
"10040010-219-ユウカ" = "言い訳してないで、手を動かしてください！"
"10040010-220-ユウカ" = "あとで確認しますからね……！！"
"10040010-221-ユウカ" = "……絶対ですよ！！"
"10040010-223" = "（…………）"
"10040010-224" = "（まあ、完全に自業自得だもんなぁ）"
"10040010-229" = "[ns3] \"……こんな時間に誰だろう？\"\n[ns4] 電話を取る。"
"10040010-234-コユキ" = "……あ、つながった。"
"10040010-235-コユキ" = "やっほー先生！こんばんは！"
"10040010-236" = "[s5] \"コユキ、どうかしたの？\"\n[s6] \"こんな時間に連絡だなんて、珍しいね。\""
"10040010-239-コユキ" = "もう～冷たいなぁ。私たちの仲じゃないですか？"
"10040010-243-コユキ" = "というか、今なにしてるんですか？#n仕事です？"
"10040010-244-コユキ" = "あ、いえ……やっぱそうですよね。"
"10040010-245-コユキ" = "……はい？"
"10040010-246-コユキ" = "……？"
"10040010-247-コユキ" = "からかうために連絡したのか、って？#nちょっと、ひどくないですか！？私を何だと思ってるんです！？"
"10040010-248-コユキ" = "ふっふっふ……。"
"10040010-249-コユキ" = "用ならちゃんとありますよ。"
"10040010-250-コユキ" = "実は、先生が好きそうなものを用意したんです。"
"10040010-251-コユキ" = "それは……。"
"10040010-252-コユキ" = "じゃかじゃかじゃかじゃか……じゃん！"
"10040010-257" = "[ns7] \"こ、これは、ムシクイーンカードの！？\"\n[ns8] \"まさか、最新パック……！？\""
"10040010-260-コユキ" = "にはははは！先生なら分かりますよね！#n発売間もない最新パック、しかも初回生産分のレアモノです！"
"10040010-261-コユキ" = "今からこのパックを開封しちゃいま～す。#nどんなカードが入ってるか、楽しみですねぇ？"
"10040010-262-コユキ" = "……え？"
"10040010-263-コユキ" = "どこで手に入れたのかって？#nもちろん、ちゃんと買いましたよ……？"
"10040010-264-コユキ" = "そのお金はどこからって？#nそりゃあ……。"
"10040010-268-コユキ" = "……なんでそんなこと聞くんです？"
"10040010-269" = "[s9] \"コユキ、また怒られるよ……。\"\n[s10] \"バレたらどうなるか、わかるでしょ……。\""
"10040010-272-コユキ" = "怒られる……？"
"10040010-273-コユキ" = "にはははは！面白いことを言いますね、先生！"
"10040010-274-コユキ" = "今日は今年の最後の日じゃないですか？#nだから怒られたとしても、それは来年の話！"
"10040010-275-コユキ" = "来年のことなんて、今はどうでもいいんです！#nホント先生は心配性なんですから！"
"10040010-276-コユキ" = "目の前のカードパックのほうが今は大事！そう思いません？"
"10040010-277" = "[s11] \"なるほど、すごい考え方だ……。\"\n[s12] \"さすが、斬新な発想だね……。\""
"10040010-280-コユキ" = "とにかく！今からこのパックを開封しますからねっ！"
"10040010-281-コユキ" = "せっかく楽しい時間を共有しようと思ったのに、#n先生は薄情なことばっかり言うんですね！"
"10040010-282-コユキ" = "……どこにいるのか、って？"
"10040010-283-コユキ" = "いつも通り、反省部屋ですけど？"
"10040010-287" = "[ns13] \"いつも通りって……。\"\n[ns14] \"反省部屋が本来の用途で使われる日はくるのかな……。\""
"10040010-290-コユキ" = "にははは！#nなんですか、その顔！もしかして感心しました？"
"10040010-291-コユキ" = "それで、いつ来るんです？#n夜は長いですし、先生が来るまで待っててあげますよ！"
"10040010-292-コユキ" = "……はい？"
"10040010-293-コユキ" = "忙しいから無理……？"
"10040010-294-コユキ" = "今日中に終わらせないと、明日ユウカ先輩に怒られる……？"
"10040010-295-コユキ" = "それって……。"
"10040010-299-コユキ" = "はぁ……。"
"10040010-300-コユキ" = "さっきの話、忘れちゃいました？"
"10040010-301-コユキ" = "怒られたとしてもそれは来年の話、って言いましたよね？"
"10040010-302-コユキ" = "ごちゃごちゃ考えて動かないなんて、先生らしくないですよ！"
"10040010-303" = "[s15] \"私らしいって……？\"\n[s16] \"いや、いくらなんでもそれは……。\""
"10040010-306-コユキ" = "やれやれ、ここまで言ってもダメですか……。"
"10040010-307-コユキ" = "良いでしょう。#nならこっちにも考えがあります。先生を試させてもらいますよ。"
"10040010-308-コユキ" = "ふっふっふっ……。"
"10040010-309" = "[s17] \"こ、コユキ？\"\n[s18] \"何をするつもり……？\""
"10040010-315-コユキ" = "さぁ始まりました、開封タイム！"
"10040010-316-コユキ" = "まずはひとパックめ！"
"10040010-317-コユキ" = "てりゃあっ～！！"
"10040010-321" = "[ns] \"…………。\""
"10040010-323" = "[ns19] \"……！！！！！！\"\n[ns20] \"実況するなんて……！！\""
"10040010-327-コユキ" = "う～ん、ハズレかぁ……。"
"10040010-328-コユキ" = "にははは！いや、残念ですよぉ。#nレアカードが出ると思ったんですけどねぇ。"
"10040010-329-コユキ" = "まあ、まだまだパックはいっぱいありますけどぉ？"
"10040010-330-コユキ" = "でも、私が一人で開け続けたら……。"
"10040010-336-コユキ" = "……すぐなくなっちゃいますねぇ！いいんですかぁ、先生？"
"10040010-337" = "[s21] \"…………くっ！！\"\n[s22] \"負けるわけには……！！\""
"10040010-340-コユキ" = "いや～！先生と一緒にパックの開封式、したかったなぁ～？"
"10040010-341-コユキ" = "でも先生は立派な大人だから、カードなんかに興味ないんですよねぇ～？"
"10040010-342-コユキ" = "……じゃあ、私一人で楽しむしかないですよねぇ～？"
"10040010-343-コユキ" = "最新パックだから、見たことない性能のカードが入ってるかもしれませんねぇ……。"
"10040010-344-コユキ" = "今ならすぐにデッキを組めますし、#n新しい戦略を試せるかもしれないのになぁ～？"
"10040010-345-コユキ" = "そういえばこのパック、次の入荷まで一週間もかかるらしいですよぉ～？"
"10040010-346-コユキ" = "まぁ、新しくデッキを組むのは諦めて、#n人のデッキを真似るだけで先生が満足できるならぁ……。"
"10040010-347-コユキ" = "……私はぜーんぜん、構いませんけどねぇ～？"
"10040010-348-コユキ" = "なにせ、先生は……[ruby=・   ・   ・]お仕事[/ruby]で忙しそうですし？"
"10040010-349-コユキ" = "そうですよね？"
"10040010-350" = "[s23] \"こ、このっ……！\"\n[s24] \"[ruby=くろさき]黒崎[/ruby]コユキ……！！\""
"10040010-353-コユキ" = "……ふっふっふっ。"
"10040010-354-コユキ" = "もう一度聞きましょう。"
"10040010-355-コユキ" = "どうです？#n今年の最後を、一緒にアツい夜で締めくくりません？"
"10040010-359-コユキ" = "……野暮は言いっこなしです。どうします？"
