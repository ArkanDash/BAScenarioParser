[translation]
"10040065-2-コユキ" = "はぁ、はぁ……。"
"10040065-3-コユキ" = "ほんと、もうダメかと思いましたよ……。"
"10040065-4" = "[s1] \"今日は走ってばっかりだね。\"\n[s2] \"ある意味で反省させられてるのかも……。\""
"10040065-7-コユキ" = "ところでヴェリタスの二人と連絡は取れますか？#n地下の深いところは、通過したはずですし。"
"10040065-8-コユキ" = "そろそろ連絡が来てもいい頃なんじゃ？"
"10040065-9-コユキ" = "あれ、もしかして道を間違えちゃいました……？"
"10040065-10-コユキ" = "はっ……！それとも……！"
"10040065-16-コタマ" = "ちゃんと聞こえてます。#n二人とも、無事たどり着けたようですね。"
"10040065-17-コタマ" = "あとはそこのドアから地上に出れば、脱出完了です。"
"10040065-18-コタマ" = "ほかにもいくつか出口はありますが、#n最も使用頻度が少ないのはそこです。"
"10040065-20-ハレ" = "いろいろ大変だったけど、なんとかたどり着けたね。"
"10040065-21-ハレ" = "じゃあ、マキにドアを開けるように連絡するよ。"
"10040065-22-ハレ" = "って、あれ……。"
"10040065-28-ハレ" = "今、何か音しなかった……？"
"10040065-29" = "[s3] \"……音？\"\n[s4] \"何も聞こえなかったけど。\""
"10040065-32-ハレ" = "あ、そっちじゃなくて……。"
"10040065-39-ハレ" = "……！？"
"10040065-40-ハレ" = "……？"
"10040065-41-ハレ" = "ふ……。"
"10040065-43-ハレ" = "……副部長！？"
"10040065-45-コタマ" = "……ど、どうしてここに！！"
"10040065-46-コタマ" = "いえ違います、これは……！！"
"10040065-50" = "[ns5] \"チヒロ……！？\"\n[ns6] \"ハレ！コタマ！大丈夫！？\""
"10040065-53-ハレ" = "こ、これは……！秘密……！"
"10040065-54-コタマ" = "まさか……！くっ、罠でしたか！#nこんな策をめぐらしていたなんて……！"
"10040065-55-ハレ" = "とりあえず、逃げて……！"
"10040065-56-コタマ" = "うああっ……！"
"10040065-60-コユキ" = "え、え～っと……。"
"10040065-61-コユキ" = "せ、先生、これって……。"
"10040065-65-コユキ" = "あ、ドアが開きますよ……！"
"10040065-66-コユキ" = "あっちでトラブルがあったみたいですけど、仕方ないですって、先生！#nひとまず、逃げないと……！"
"10040065-67-コユキ" = "マキさんと合流して、脱出を……！"
"10040065-71-コユキ" = "……？"
"10040065-72-コユキ" = "あれれ、これって……？"
"10040065-73" = "[s7] \"……コユキ！？\"\n[s8] \"……どうしたの？\""
"10040065-76-コユキ" = "その、何だか……。"
"10040065-77-コユキ" = "すごく、嫌な予感がですね……。"
"10040065-82-コユキ" = "…………。"
"10040065-83-コユキ" = "……ふふ。"
"10040065-84-コユキ" = "ふふふ、ふふふふふっ……。"
"10040065-85-コユキ" = "にはは……結局こうなっちゃうんですね。"
"10040065-94" = "[ns9] \"……コユキ！？\"\n[ns10] （うおっ……）"
"10040065-97-コユキ" = "……しっ。"
"10040065-98-コユキ" = "ここなら見つかりませんから。"
"10040065-99-コユキ" = "時間がないので、ひと言だけ。"
"10040065-100-コユキ" = "先生……。"
"10040065-104-コユキ" = "……どうか、ご無事で。"
"10040065-106-？？？" = "コ～ユ～キ～～～！！"
"10040065-125-ユウカ" = "ただでさえ忙しい年末に！"
"10040065-129-ユウカ" = "またトラブルを起こしてくれちゃって！"
"10040065-133-ユウカ" = "今日という今日は絶対に許さないんだから！！"
"10040065-134-ユウカ" = "覚悟しなさいっ！！"
"10040065-138-コユキ" = "ぎやあああぁぁぁああっ！"
"10040065-143-コユキ" = "私のこと、忘れないでくださぁぁぁいっ！！！"
"10040065-151" = "[ns] \"…………。\""
"10040065-153" = "[ns11] コタマに指示されていた扉へ向かう。\n[ns12] コユキに感謝の祈りを捧げる。"
"10040065-159" = "[ns] \"……？\""
"10040065-161" = "[ns13] \"……あれ？\"\n[ns14] \"また足音が聞こえたような……。\""
"10040065-166" = "[ns] 再び歩きだす。"
"10040065-170" = "[ns] 歩く速度を上げる。"
"10040065-179" = "[ns] 音を出さず静かに歩く。"
"10040065-188" = "[ns] \"…………。\""
"10040065-190" = "[ns] 全力で走る。"
