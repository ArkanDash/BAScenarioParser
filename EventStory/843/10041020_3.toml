[translation]
"10041020-1" = "第2話;役割分担"
"10041020-9-セイア" = "……ふぅ。"
"10041020-10-セイア" = "なんとか戻れたか。#n遅れてはいないようだ。"
"10041020-11-セイア" = "そこにトリニティ生もいる。この列に混ざれば自然だろうか。"
"10041020-12-セイア" = "気づかれぬように調査を進めるのは手間だが……。"
"10041020-16-セイア" = "致し方ない。自分で決めたことだからね。"
"10041020-17-セイア" = "さて……。"
"10041020-22-？？？" = "あっ！ティーパーティーさん見っけ！探したよ～？"
"10041020-31-アスナ" = "今までどこに居たの？"
"10041020-32-カリン" = "移動や見学は自由だが、護衛がついていることを忘れないで欲しい。#n急に姿を消さないでくれ。"
"10041020-33-カリン" = "会場付近は比較的安全ではあるが……。"
"10041020-34-カリン" = "ご自身の立場を、弁えてもらえると助かる。どこかへ行く時にはひと言くれ。"
"10041020-36-セイア" = "済まない。少し道に迷っていたんだ。"
"10041020-40-セイア" = "ところで、先生の姿が見えないようだが……？"
"10041020-45-アスナ" = "ご主人様？ご主人様はねー。"
"10041020-47-セイア" = "（……ご主人様？）"
"10041020-50-カリン" = "せ、先輩……！今は「先生」……！！"
"10041020-52-セイア" = "（……？？）"
"10041020-53-セイア" = "（先生、君は彼女たちと一体何を……？）"
"10041020-58-アスナ" = "あっ、そうだ先生！先生は他校生の面倒を見てて忙しいんだって！"
"10041020-59-カリン" = "トリニティ総合学園の生徒を引率しているらしい。"
"10041020-60-カリン" = "あなたなら把握しているものだと思ったが、意外だな。"
"10041020-66-セイア" = "……引率？"
"10041020-70-セイア" = "……そうか。なるほど。"
"10041020-75-セイア" = "（しかし、なぜ先生が……？）"
"10041020-76-セイア" = "（わざわざ……）"
"10041020-81-セイア" = "いや、先生のことだ。何か考えがあるのだろう。"
"10041020-82-アスナ" = "どうかしたの？"
"10041020-83-アスナ" = "顔色があんまよくないよ？"
"10041020-84-セイア" = "いや……むしろ、足取りが軽くなったよ。"
"10041020-85-セイア" = "自由の身になったからには、楽しい時間を送るべきだろう。"
"10041020-89-セイア" = "君たちと行動を共にすれば良いのだね。"
"10041020-91-アスナ" = "そっ！よろしくね～！"
"10041020-92-カリン" = "よろしく頼む。他のメンバーも、ここには居ないがそれぞれの持ち場でサポートする。"
"10041020-98-トキ" = "お呼びですか？"
"10041020-99-アカネ" = "気にしなくて大丈夫ですよ。#nトキさんは引率に集中していただければと。"
"10041020-100-トキ" = "なるほど……承知しました。"
"10041020-109-カリン" = "……そういうことだから、思う存分EXPOを楽しんでくれ。"
"10041020-111-セイア" = "君たちの噂は私も知るところだ。頼りにしているよ。"
"10041020-112-セイア" = "では――"
