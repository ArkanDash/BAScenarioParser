"10021015-78-ハナコ" = "……たとえその結果として、誰かに裏切られても？"
"10021015-81-シロコ" = "どうして……先生はどうして、そんなに……。"
"10021015-82" = "[s3] \"先生が生徒を信じないと、何も始まらない……。\"\n[s4] \"大人だから、みんなを信じたい。\""
"10021015-85-シロコ" = "………………………………。"
