"10021015-142-シロコ" = "……。"
"10021015-146-シロコ" = "わ、たし……わたし、の、せい、なの……！"
"10021015-147-シロコ" = "わたし、が、いるから、せかいが……滅亡、した……#nそんな、こと、望んで、ないのに……"
"10021015-150-シロコ" = "こんな結末、望んで、なかった……"
"10021015-151-シロコ" = "先生を、殺したく、なかった……！"
"10021015-152-シロコ" = "ごめん、なさい……わたし、は、こんな……"
"10021015-153-シロコ" = "最後、まで、やり通せもしない、意気地なしで、ごめんなさい。#nでも、私は、もう……だめ……むり、だよ、もう……"
"10021015-154-シロコ" = "わたしの、せい……すべて、は、わたし、がアビドスに、いたせい……"
"10021015-155-シロコ" = "わたし、が、いなければ……"
"10021015-156-シロコ" = "わたし、さえ、いなければ――！！"
"10021015-157-シロコ" = "こうなると、分かって、いたら……もらう、べきじゃ、なかった……"
"10021015-158-シロコ" = "さむくて、おなかへってて、……なんで、ここにいるのかも、分からなくて……"
"10021015-159-シロコ" = "でも、あたたかくて……"
"10021015-160-シロコ" = "あたたかい、から……もう、これ以上、さむいのは、イヤ、だから……"
"10021015-161-シロコ" = "さみしい、のは、イヤ、だから……！"
"10021015-164-シロコ" = "私が、間違っていたの……あの時、マフラーをもらわずに、そのまま、倒れていたら……"
"10021015-165-シロコ" = "どうせ、こうなって、しまうのなら……"
"10021015-166-シロコ" = "そうしたら……私が……早く、そのことに気付いていたら、先生は――みんなは、生きて、いたかも、しれないのに。"
"10021015-167-シロコ" = "私が、ここにいるから……私が、間違ったせいで……！"
"10021015-170-シロコ" = "ごめんなさい……"
"10021015-171-シロコ" = "先生を殺して……世界を滅ぼして……ごめんなさい……"
"10021015-172-シロコ" = "先生が……色彩に、飲み込まれて……"
"10021015-173-シロコ" = "私を、ここに呼んだの……すべての世界を、消すために。"
"10021015-174-シロコ" = "私……わたし、は……"
"10021015-176-アヤネ" = "……！"
