"10021015-186-セリカ" = "なっ……それって……！"
"10021015-187-ノノミ" = "世界が滅亡……？#n先生が……？"
"10021015-188-ホシノ" = "……。"
"10021015-191" = "[ns] \"シロコは……\""
"10021015-193" = "[ns] \"ずっと、苦しんでいたんだね。\""
"10021015-197-ホシノ" = "……そっか。"
"10021015-198-ホシノ" = "おじさんさ、「シロコ」の眼差しが、ずっと気になってたんだよね……"
"10021015-199-ホシノ" = "でも、今の先生の言葉を聞いて、やっと分かったよ。"
"10021015-202-ホシノ" = "あれは……「シロコちゃん」は絶対にしない眼差し。"
"10021015-203-ホシノ" = "でも、どこかで見たことがあって……懐かしい感じがしたんだ。"
"10021015-204-ホシノ" = "誰だったかな……似てる人が、いたんだよね。"
"10021015-205-ホシノ" = "うーん……"
"10021015-206-ホシノ" = "ああ……"
"10021015-207-ホシノ" = "思い出した。"
"10021015-210-ホシノ" = "ここに居たんですね。"
"10021015-213-ホシノ" = "まったく……探しましたよ、"
"10021015-214-ホシノ" = "……ユメ先輩。"
"10021015-218-ホシノ" = "……私と同じ。"
"10021015-219-ホシノ" = "見覚えがあると思ったんだけど……それもそうだよね。#nアレは、私と同じだったんだよ。"
"10021015-221-ノノミ" = "……。"
"10021015-222-アヤネ" = "……え、ええっと……#nこちらのシロコ先輩は、別の世界から来た、んですよね？"
"10021015-223-シロコ" = "うん、そう。"
"10021015-224-アヤネ" = "箱舟の「多次元解釈」の能力で……？#nあれ、それでは……"
"10021015-225-セリカ" = "で、でもそういうことなのよね……！？"
"10021015-226-シロコ" = "この「シロコ」は、私がそうなる可能性の一つ……"
"10021015-231-シロコ" = "……マフラー。"
"10021015-235-シロコ" = "あなたは、まだ持ってるんだね。"
"10021015-236-シロコ" = "私は……どこにやったんだっけ。"
"10021015-237-シロコ" = "思い出せない……いつ、それを失くしたのかも……もう、分からない。"
"10021015-238-シロコ" = "すごく大切だったのに、どうしてだろ……"
"10021015-239-シロコ" = "ホシノ先輩が、死んだ後だったっけ……"
"10021015-240-シロコ" = "セリカが行方不明になった時……？"
"10021015-241-シロコ" = "それとも、アヤネが生命維持装置を外した時？"
"10021015-242-シロコ" = "ノノミが、アビドスを離れて「そうなった」と連絡をもらった時？それとも――"
"10021015-243-シロコ" = "――先生が、もう蘇生の可能性がないという連絡を、もらった時？"
"10021015-245-シロコ" = "いつ、だったかな……私――"
