"10021015-58" = "[ns1] \"一体、「何」があったの？\"\n[ns2] \"「何」が、起きたの？\""
"10021015-64-シロコ" = "どうして……"
"10021015-65-シロコ" = "そんなことを、聞くの……？"
"10021015-66-シロコ" = "言ったでしょ……私は、世界を滅ぼす存在……"
"10021015-67-シロコ" = "世界を滅亡に導いて……先生を殺して……「箱舟」を利用して、"
"10021015-68-シロコ" = "今度は、別の時間軸の世界までも滅亡させるためにやってきた、と……。"
"10021015-69-シロコ" = "そんな私に、「何」があったか……聞く、の？"
"10021015-74-シロコ" = "何か、事情があると、思ってるの？#n世界を滅亡させようとする……私に。"
