"10021015-44-シロコ" = "うん……。"
"10021015-50-シロコ" = "ああ……そうだった。"
"10021015-51-シロコ" = "伝えたいことがあるって……言ってたよね、先生。"
"10021015-52-シロコ" = "何を――"
