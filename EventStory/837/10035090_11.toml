[translation]
"10035090-1" = "第9話;ワニ、制圧開始！"
"10035090-7-キリノ" = "うわっ！"
"10035090-8-キリノ" = "やっぱり、外殻が硬すぎますね！"
"10035090-9-ラブ" = "ねえ！さっきから外れっぱなしじゃないの！"
"10035090-10-ラブ" = "ちゃんと撃ってよ！"
"10035090-12-フブキ" = "言うなって。あれはもう自然の摂理みたいなもんだから。"
"10035090-13-フブキ" = "ま、ワニの防御力が高いのは認めるけどさー。"
"10035090-14-フブキ" = "これだけ撃ったのに、ほとんど傷もついてないしね。"
"10035090-15-フブキ" = "これさ、ほんとに誰が作ったんだろうね？"
"10035090-16-カンナ" = "動作は俊敏で、攻撃のバリエーションも多彩だ。"
"10035090-17-カンナ" = "見たところ、攻撃対象が利用客ではなく、施設なのは救いだが……。"
"10035090-18-カンナ" = "やつの行動ロジックは、一体どうなっているんだ。"
"10035090-19-カンナ" = "そもそも、やつが作られた目的は……。"
"10035090-29-キリノ" = "メカワニ、方向を変えました！"
"10035090-30-ラブ" = "ちっ！逃げるんじゃないの！"
"10035090-39" = "[ns1] \"あっちにあるのは……！\"\n[ns2] \"子供用プールが……！\""
"10035090-44-ジャブジャブヘルメット団A" = "ははっ！あいつ尻尾を巻いて逃げやがった！"
"10035090-45-ジャブジャブヘルメット団B" = "もう二度と現れるなよ！"
"10035090-50-カンナ" = "まずい！あの先は……！"
"10035090-54-子供の利用客A" = "きゃぁぁぁ！"
"10035090-55" = "[ns] \"子供たちが……！\""
"10035090-60-カンナ" = "くっ！"
"10035090-70-キリノ" = "カンナ局長！？"
"10035090-72-フブキ" = "ちょっとっ！"
"10035090-73-ラブ" = "狂犬！？"
"10035090-74" = "[s] \"カンナ！\""
"10035090-83-フブキ" = "こ、子どもは無事だね！"
"10035090-84-キリノ" = "し、しかし、まだワニが……！"
"10035090-85-フブキ" = "あのままじゃ、ワニとぶつかる！"
"10035090-91-カンナ" = "……。"
"10035090-92-カンナ" = "下がれ。"
"10035090-101" = "[ns3] \"あ、あれ！？\"\n[ns4] \"ワニが……止まった！？\""
"10035090-104-ラブ" = "な、なんだ……？"
"10035090-105-キリノ" = "メカワニの動きが……止まりました。な、何があったんでしょうか！？"
"10035090-107-ジャブジャブヘルメット団A" = "それより、はやく仕留めよう！"
"10035090-108-ジャブジャブヘルメット団A" = "手榴弾だ！はやく投げて！"
"10035090-110-ラブ" = "ワニめ！全部お前のせいだ！"
"10035090-111-ラブ" = "命で償えっ！"
