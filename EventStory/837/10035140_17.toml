[translation]
"10035140-1" = "後日談その3;河駒風ラブのシークレットバカンス（１）"
"10035140-4-ジャブジャブヘルメット団A" = "この自販機もなかなかだぜ、ひひっ。"
"10035140-5-ジャブジャブヘルメット団B" = "場末の自販機を蹴ってお金を稼ぐ……。"
"10035140-6-ジャブジャブヘルメット団B" = "すげえビジネスモデルだ。やっぱり隊長は頭がいいですね！"
"10035140-11-ラブ" = "あはははっ！"
"10035140-12-ラブ" = "そう！うちこそヘルメット団のブレインよ！"
"10035140-13-ラブ" = "で、今日の収穫はいくらだったの？"
"10035140-18-ジャブジャブヘルメット団A" = "自販機26台を蹴って……"
"10035140-19-ジャブジャブヘルメット団B" = "530円です。"
"10035140-25-ラブ" = "少なくない？"
"10035140-27-ジャブジャブヘルメット団B" = "そりゃあ、こんな場所にある自販機ですから……。"
"10035140-28-ジャブジャブヘルメット団A" = "表の自販機はブラックマーケットの管轄で、うかつに手を出せないし……。"
"10035140-33-ラブ" = "ああもうっ！これじゃ夏休みの計画を大幅修正するしかないじゃない！"
"10035140-35-ジャブジャブヘルメット団A" = "そんな……。"
"10035140-42-ラブ" = "モモトーク？こんな時に誰が……。"
"10035140-46-ラブ" = "知らない番号……。#n「ヘルメット団の本部」？そんなのあったっけ？"
"10035140-47-ジャブジャブヘルメット団A" = "ヘルメット団は普段バラバラに活動してても、規模はデカいですから。#n本部くらいあるかもしれませんよ。"
"10035140-48-ラブ" = "たしかに……入団の時、聞いた覚えがあるような……。"
"10035140-49-ラブ" = "まぁ、確認してみるけど。"
"10035140-55-ラブ" = "え！？「ヘルメット団総連合会」開催決定！？"
"10035140-59-ジャブジャブヘルメット団A" = "総連合会……！って、なんすか？"
"10035140-61-ラブ" = "ヘルメット団の全団員が海辺で一堂に会する集会よ！"
"10035140-62-ラブ" = "フードコートにアミューズメント、それにライブも！#nもうパーティーみたいなもんじゃない、これ！"
"10035140-63-ラブ" = "最高ね！これなら今年の夏休みはバッチリだわ！"
"10035140-68-ジャブジャブヘルメット団A" = "う、うちらも一緒に行けるんですか？"
"10035140-70-ラブ" = "当ったり前でしょ！"
"10035140-71-ラブ" = "参加費も取らないみたいだし。#n残った金で水着を買うわよ！"
"10035140-74-一同" = "やったぁ！"
"10035140-82-ジャブジャブヘルメット団A" = "こ、この水着、高すぎませんか？"
"10035140-83-ジャブジャブヘルメット団B" = "3人分買うには、金が足りませんね……？"
"10035140-88-ラブ" = "うーーん……。"
"10035140-89-ラブ" = "仕方ないわね！1着だけ買って着回しましょ！"
"10035140-90-ラブ" = "予算内で、できるだけ準備するのよ！"
"10035140-121-ラブ" = "あ～、楽しかった！"
"10035140-123-ジャブジャブヘルメット団A" = "たくさんは買えなかったけど。いい買い物ができましたね、隊長！"
"10035140-124-ジャブジャブヘルメット団B" = "貯金がほとんどすっからかんですけど……。#nこれもヘルメット団のパーティーのためですからね！"
"10035140-126-ラブ" = "そう！そのとおり！"
"10035140-127-ラブ" = "うちらの夏は、ここから始まるの！"
"10035140-134-ラブ" = "あれ、新しいメッセージ？"
"10035140-138-ラブ" = "どれどれ……。"
"10035140-143-ラブ" = "は、はぁ？バカにしてるわ。何よ、これ？"
"10035140-145-ジャブジャブヘルメット団A" = "え？どうかしたんですか？"
"10035140-146-ジャブジャブヘルメット団B" = "隊長？顔色が悪いですよ。"
"10035140-154-ラブ" = "……これ見て。"
"10035140-159-ジャブジャブヘルメット団A" = "パーティーの参加者名簿……？"
"10035140-160-ジャブジャブヘルメット団B" = "隊長の名前だけで……う、うちらの名前が……無い？"
"10035140-161-ジャブジャブヘルメット団A" = "え……じゃあ、うちらはパーティーに参加できない、ってことですか？"
"10035140-162-ジャブジャブヘルメット団B" = "そんな……せっかく楽しみにしていたのに……。"
"10035140-164-ラブ" = "ふ、ふざけてるわ！全員じゃなきゃ意味ないでしょ！"
"10035140-165-ラブ" = "待ってなさい！ちゃんと抗議するから……！"
"10035140-171-ジャブジャブヘルメット団A" = "いえ……隊長だけでも行ってきてください。"
"10035140-176-ラブ" = "え？"
"10035140-177-ジャブジャブヘルメット団B" = "仕方ないですよ。#n本部も末端の団員まで呼ぶ余裕はないみたいだし……。"
"10035140-178-ジャブジャブヘルメット団A" = "隊長だって、楽しみにしてたでしょ。#nだから、うちらの分まで楽しんできてください。"
"10035140-179-ジャブジャブヘルメット団A" = "うちらのことは……気にしないで……。"
"10035140-180-ラブ" = "あんたたち……。"
"10035140-185-ラブ" = "……よし、決めたわ。"
"10035140-189-ラブ" = "あんたたち、ついてくるのよ。"
"10035140-194-一同" = "え？ど、どこに行くんですか？"
"10035140-196-ラブ" = "いいからっ！"
"10035140-200-ラブ" = "せっかく水着も買ったんだし！今から水遊びに行くわよ！"
"10035140-201-ラブ" = "あんたたちの夏を、このまま終わりにはさせないわ！"
