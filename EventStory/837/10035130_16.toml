[translation]
"10035130-1" = "後日談その2;エンジニア部の過ち（２）"
"10035130-2" = "(……メカワニの試運転、当日)"
"10035130-6-ヒビキ" = "うん、本体の最終調整は完了。#n後は行動制御プログラムをインストールするだけ。"
"10035130-7-コトリ" = "燃料タンクよーし！"
"10035130-8-コトリ" = "試験水槽に水も溜めました！#nテストは、いつでも開始できます！"
"10035130-10-ウタハ" = "よし。それでは、行動制御プログラムのインストールを開始しよう。"
"10035130-11-ヒビキ" = "あれ？プログラム間に合ったんだ。"
"10035130-12-ウタハ" = "納期に間に合わせるためには、妥協も必要だからね。"
"10035130-13-ウタハ" = "昨日、インターネットでそれらしいプログラムのサンプルを見つけた。#n試運転なら、これで十分さ。"
"10035130-14-ウタハ" = "さあ、テストを開始しよう。"
"10035130-24-ヒビキ" = "あ、動いた。"
"10035130-34-ヒビキ" = "あたりを警戒してるね……。#nワニを模倣するアルゴリズムが動いている証拠だよ。"
"10035130-35-ウタハ" = "本物のワニに見せかけるために、本能アルゴリズムを上位に設定したからね。"
"10035130-36-コトリ" = "尻尾まで振ってますね！"
"10035130-37-コトリ" = "そうだ、説明しますと――ワニが尻尾を振る動きには攻撃、もしくは威嚇の意味があるそうです！"
"10035130-41-ウタハ" = "……攻撃？"
"10035130-42-ヒビキ" = "……威嚇？"
"10035130-43-コトリ" = "わ、わわっ！？"
"10035130-51-コトリ" = "うわあぁ！一ヶ月かけて開発した、ジェットブースター・コーヒーマシンが！"
"10035130-57-ヒビキ" = "わ、私の超音速水ロケット発射台が……！"
"10035130-58-ウタハ" = "こ、これは！？一体、どうして暴れているんだ！？"
"10035130-59-ウタハ" = "設計通りなら、水槽のなかに入るはず……。"
"10035130-64-ウタハ" = "はっ！？"
"10035130-72-ヒビキ" = "す、水槽が破壊された！"
"10035130-73-コトリ" = "水がここまで来ます！逃げてください！"
"10035130-79-ウタハ" = "ううっ！"
"10035130-80-ウタハ" = "わ、ワニの電源を切らなくては……！"
"10035130-81-コトリ" = "うわああっ！ダメです！近づくことすらできません！"
"10035130-82-ウタハ" = "くっ！こうなった以上、雷ちゃんを呼ぶしか……！"
"10035130-83-ヒビキ" = "先輩、もう手遅れみたい。"
"10035130-89-ウタハ" = "へ、部屋の壁を破壊して逃げてしまった……。"
"10035130-90-ヒビキ" = "あのパワーとスピード……設計以上のパフォーマンスだね。"
"10035130-91-コトリ" = "行動も設計以上でしたけどね……。"
"10035130-92-コトリ" = "これ、どうすればいいんでしょうか……？"
"10035130-97-？？？" = "ちょっと！今の音は何！？また何か爆発させたの！？"
"10035130-101-ウタハ" = "この声は……。"
"10035130-108-チヒロ" = "爆発音で来てみれば……。やっぱりあんた達か。"
"10035130-109-チヒロ" = "この部屋、水浸しじゃない。何があったの？壁に穴も空いてるし……。"
"10035130-110-ウタハ" = "ち、チーちゃん……。"
"10035130-112-チヒロ" = "発明品のテストは慎重にって、何度も言ったよね？#nサーバー室はすぐ隣なの。"
"10035130-113-チヒロ" = "セミナーに報告してもらうよ。#nさあ、今度は何をやったの？"
"10035130-114-ウタハ" = "こ、これは……。"
"10035130-118-ウタハ" = "わ、私たちがやったことじゃないんだ。"
"10035130-121-一同" = "（し、知らんぷり！？）"
"10035130-123-ウタハ" = "そ、そうだ！私たちはこの件に関与していない！"
"10035130-124-ウタハ" = "そうだろう？ヒビキ。私たちもここに来たばかりだろう？"
"10035130-125-ヒビキ" = "あ、うん。も、もちろん……。"
"10035130-126-ウタハ" = "と、言うわけさ。は、ははっ、ここを片付けるのは大変だが……。#n力を合わせて頑張ろう！"
"10035130-131-チヒロ" = "下手な演技はやめて。"
"10035130-132-チヒロ" = "もういい、あんた達に聞いたのがバカだった。#n勝手に調べさせてもらう。"
"10035130-137-コトリ" = "あっ！私たちの作業データを……！"
"10035130-143-チヒロ" = "……このワニ、何？"
"10035130-144-ウタハ" = "……くっ！"
"10035130-145-ウタハ" = "仕方ない……。こうなったら、白状するしか……。"
"10035130-153-チヒロ" = "試運転中のメカワニが急に暴れ出した……？"
"10035130-154-チヒロ" = "設計の段階で、何か問題があったんじゃないの？"
"10035130-155-ウタハ" = "それはない！"
"10035130-156-ウタハ" = "この華道兼レジャー用メカワニに欠陥など無い！#nマイスターの肩書にかけて！"
"10035130-157-チヒロ" = "じゃあ、インストールしたプログラムの問題だね。"
"10035130-161-ウタハ" = "た、確かにソフトウェアは完璧ではなかったかも、しれないが……。"
"10035130-165-チヒロ" = "……やっぱり、内部の問題だったんだね。"
"10035130-166-コトリ" = "えっと？アルゴリズムに何かエラーでもありましたか？"
"10035130-167-チヒロ" = "レジャー用プログラムをインストールしようとしてたみたいだけど……。#nログを見た感じ、解体工事用のプログラムがインストールされてる。"
"10035130-172-コトリ" = "どうしてそんなものが？"
"10035130-174-ウタハ" = "どうやら……ダウンロードしたプログラムに問題があったようだ……。"
"10035130-176-チヒロ" = "これ、ちゃんとテストされていないプログラムじゃない。#n開発元も、目的も分からない。"
"10035130-177-チヒロ" = "セキュリティには気をつけろって、いつも言ってるでしょ……"
"10035130-178-チヒロ" = "どうせ寝不足で頭が働いてなかったんじゃない？#nはぁ……いつも最後の詰めが甘いんだから。"
"10035130-183-ウタハ" = "そうか！信頼性の低いプログラムは使ってはいけないんだ！"
"10035130-184-ウタハ" = "みんな！これからはちゃんと正規のソフトウェアを購入して使用しよう！"
"10035130-185-コトリ" = "はい！エンジニア部は健全なソフトウェアの使用を推奨しています！"
"10035130-186-ヒビキ" = "パンパカパーン。"
"10035130-191-チヒロ" = "だから、下手な演技はやめて。"
"10035130-192-チヒロ" = "ほら、はやくワニを回収しに行くよ。"
