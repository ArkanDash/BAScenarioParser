[translation]
"10035110-1" = "第11話;エピローグ"
"10035110-3-キリノ" = "失礼します！"
"10035110-4-キリノ" = "生活安全局の[ruby=なかつかさ]中務[/ruby]キリノ、公安局に用があって、参りました！"
"10035110-5-キリノ" = "入室してもよろしいでしょうか！"
"10035110-6-フブキ" = "だから、そういうの要らないって。"
"10035110-7-キリノ" = "たしかに……この前もそうでしたけど、返事してくれる人がいません……。"
"10035110-8-フブキ" = "そうそう、だから適当に入っちゃえばいいんだよ。"
"10035110-9-フブキ" = "それに、今日は公安局のほうから呼ばれて来てるんだからさ。"
"10035110-10-キリノ" = "あ、そうでしたね！"
"10035110-11-キリノ" = "この前の出向の特別報酬の件で！"
"10035110-12-フブキ" = "特別報酬、なんて素敵な響き……。"
"10035110-13-フブキ" = "何をくれるんだろうねー？11日間の特別休暇？#nそれとも、マスタードーナッツの1ヶ月食べ放題？"
"10035110-14-キリノ" = "もしかしたら、ついに！#n警備局か公安局に特別スカウトされるかもしれません！"
"10035110-15-フブキ" = "それは遠慮したいなぁ……。"
"10035110-22-カンナ" = "お前たち、何をしている。"
"10035110-23-カンナ" = "ドアの前で突っ立って話をするな。#n中に入るか避けるかにしろ。"
"10035110-25-キリノ" = "あっ！カンナ公安局長！"
"10035110-26-フブキ" = "相変わらず、疲れた顔だねぇ。"
"10035110-28-カンナ" = "いいから入れ。"
"10035110-29-カンナ" = "副局長が特別に報酬を用意しているそうだ。"
"10035110-30-フブキ" = "おぉ、それはいい知らせだ。"
"10035110-31-フブキ" = "ねえねえ、報酬ってなんなの？こっそり教えてよ。"
"10035110-32-カンナ" = "いや、私も知らないんだ。"
"10035110-44-コノカ" = "はっくしょん！"
"10035110-49-コノカ" = "あ、来たんすね、姉御。"
"10035110-50-カンナ" = "……風邪でも引いたか？"
"10035110-51-コノカ" = "はくしょん！"
"10035110-52-コノカ" = "ええ、ま、気にしないでほしいっす。#nちょいと事情がありまして。"
"10035110-53-コノカ" = "とにかく、ナイスタイミングっす。待ってたっすよ。"
"10035110-54-キリノ" = "おはようございます！副局長！#n生活安全局所属、中務キリノです！"
"10035110-55-コノカ" = "あぁ～いつも姉御が世話になってるっす！"
"10035110-56-コノカ" = "今度一緒に牛丼でも食べに行くとしましょう。"
"10035110-58-カンナ" = "雑談はやめろ。"
"10035110-59-カンナ" = "彼女たちは報酬を受け取りに来たんだ。手早く済ませろ。"
"10035110-60-コノカ" = "そうっすね。ではでは、これを受け取ってくださいっす！"
"10035110-62-フブキ" = "おぉ、ついに！"
"10035110-63-キリノ" = "小さな封筒ですね？"
"10035110-65-カンナ" = "私にもあるのか……。なんだ、これは？"
"10035110-66-コノカ" = "開けてみてください。"
"10035110-76-フブキ" = "これは……。"
"10035110-77-キリノ" = "ウォーターパーク「エーギル」の利用券？"
"10035110-79-コノカ" = "正解っす！"
"10035110-80-コノカ" = "功労者よ、思い出の地に戻れ！"
"10035110-81-コノカ" = "ウォーターパークは、今度は客として諸君らを歓迎する！"
"10035110-82-コノカ" = "……って言うのはどうっすか？#n特別な思い出になると思うんすけど……って、あれ？"
"10035110-83-コノカ" = "皆さん、顔色が悪くないっすか？"
"10035110-84-フブキ" = "まーたあそこに行けって？もうこりごりだよ。"
"10035110-89-キリノ" = "本官も、その……まだ筋肉痛でして……。"
"10035110-91-カンナ" = "私には不要だ。辞退しよう。"
"10035110-96-コノカ" = "あ、あれれ？"
"10035110-97-コノカ" = "なんでっすか。先輩。#nウォーターパークから帰ってきた時、ニコニコでしたよね？"
"10035110-98-コノカ" = "プール、楽しかったんじゃなかったんすか？"
"10035110-99-カンナ" = "ニコニコだった？いや、水遊びの趣味はない。"
"10035110-100-カンナ" = "笑っていたなら……、別の理由だ。"
"10035110-101-コノカ" = "……何かいいことがあったっすか？"
"10035110-107-カンナ" = "ふっ、機密事項だ。"
