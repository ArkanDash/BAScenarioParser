[translation]
"10035030-1" = "第3話;みんなで遊びましょう！"
"10035030-2-キリノ" = "新しい配置先はあそこですね！"
"10035030-3-キリノ" = "子供たちが遊んでいるプールです！"
"10035030-4-フブキ" = "屋内に来たのはいいけど、子供の世話は面倒だなぁ……。"
"10035030-5-フブキ" = "あっちこっち走り回って疲れるじゃん。"
"10035030-9-カンナ" = "……。"
"10035030-10" = "[s1] \"ミスは誰だってするものだから。\"\n[s2] \"あまり気にしすぎないようにね。\""
"10035030-13-カンナ" = "……はい、先生。"
"10035030-14-カンナ" = "先ほどはつい、いつもの癖が出てしまいました。"
"10035030-15-カンナ" = "長年、公安局にいたせいで、体に染み付いてしまったのでしょう。"
"10035030-16-キリノ" = "気にしないでください！ミスぐらい、誰だってするものですから！"
"10035030-17-フブキ" = "最初から完璧な人なんて、いないからね～"
"10035030-18-フブキ" = "まっ、元気出してよ、局長。"
"10035030-19-カンナ" = "……ありがとう。"
"10035030-20-カンナ" = "たしかに、市民対応に関しては、お前たちの方が私より上だ。"
"10035030-21-カンナ" = "アドバイスをもらえるか？さっきのような事を起こさないためにも。"
"10035030-22-フブキ" = "簡単かんたん！力を抜いて、適当に働いて適当に休めばそれで――"
"10035030-23-キリノ" = "フブキ！休む以上に大切なことがあるでしょう！"
"10035030-24-キリノ" = "こほん。それでは局長のために……。#n生活安全局の市民対応三大原則をお教えしましょう！"
"10035030-26-カンナ" = "三大原則か。"
"10035030-27-フブキ" = "なーんか、楽しそうだねー。"
"10035030-29-キリノ" = "はい！生活安全局の市民対応三大原則。#nそれは――"
"10035030-30-キリノ" = "「奉仕、傾聴、誠実」です！"
"10035030-31-キリノ" = "奉仕！常に市民に奉仕する気持ちで！"
"10035030-32-キリノ" = "傾聴！常に市民の声に耳を傾けて！"
"10035030-33-キリノ" = "誠実！常に市民に誠実な対応を！"
"10035030-34-キリノ" = "前期の市民対応で、本官は高い点数を獲得しましたが……。#nすべてこの三大原則を忠実に守っていたおかげだと思います！"
"10035030-35-フブキ" = "一番重視される射撃の評価は0点だったけどね。"
"10035030-36-キリノ" = "そ、それは、今は関係ないでしょう！"
"10035030-37-キリノ" = "それと、もう一つ大事なことがあるのですが。"
"10035030-38-カンナ" = "他にもあるのか？"
"10035030-39-キリノ" = "これは三大原則ではありません……。#n本官が生活安全局で、勤務するなかで気づいたことです。"
"10035030-40-キリノ" = "市民対応で大事なこと。#nそれは――「笑顔」です！"
"10035030-41-カンナ" = "笑顔……？"
"10035030-42-キリノ" = "はい。本官は、いつどんな時も！#n市民には笑顔で接することを心がけています。"
"10035030-43-キリノ" = "そうすれば、市民の皆さんも笑顔になってくれて。#n本官も前向きな気持ちになれますから！"
"10035030-44-カンナ" = "分かった。参考にさせてもらう。"
"10035030-45-キリノ" = "はい！では、さっそく行きましょう！"
"10035030-49-キリノ" = "このプール、本当に子供用なんですね。"
"10035030-50-キリノ" = "深さも腰までしかありませんし……。"
"10035030-51-キリノ" = "本官はまだ水泳に慣れていないのですが。#nこれなら救助活動に支障はなさそうです！"
"10035030-52-キリノ" = "それに、子供たちもみんな、可愛らしいですね！"
"10035030-53-子供の利用客A" = "んん、なんだ？新米が入ってきたぞ？"
"10035030-54-子供の利用客B" = "へへっ。お前らも一緒に遊ぶか？"
"10035030-55-キリノ" = "あ、あれ？"
"10035030-56-フブキ" = "うーん、不穏な感じ……。"
"10035030-57-キリノ" = "あっ！そこの黄色い水着の子！走らないで！危ないですよ！"
"10035030-58-子供の利用客C" = "けけけっ！捕まえてみろー！"
"10035030-59-キリノ" = "こらぁ、待ちなさい！"
"10035030-63-カンナ" = "キリノ！危ない！"
"10035030-65-子供の利用客" = "今だっ！撃て！"
"10035030-72-キリノ" = "うわっ！？"
"10035030-77-フブキ" = "おぉ～、綺麗に落とされたね。"
"10035030-78-フブキ" = "あの子、射撃の素質がありそうだよ。"
"10035030-79-キリノ" = "あっぷあっぷ！"
"10035030-80-キリノ" = "ふ、フブキ！助けてください！"
"10035030-81-フブキ" = "普通に足つくでしょ。水深も浅いんだしさ。"
"10035030-82-キリノ" = "あ、そうでした……。"
"10035030-83-子供の利用客A" = "わぁ！魔女がよみがえったぞ！"
"10035030-84-子供の利用客B" = "撃て！撃て――！"
"10035030-85-キリノ" = "うわっ！顔に水をかけるのはやめてください！"
"10035030-86-キリノ" = "ううっ！本官も負けませんよ！"
"10035030-87-キリノ" = "くらえっ！やっ！"
"10035030-91-カンナ" = "……。"
"10035030-92" = "[s] \"なんだか、仲良く遊んじゃってるね。\""
"10035030-93-フブキ" = "だね～"
"10035030-94-フブキ" = "しょうがない。私が落ち着かせてくるよ。"
"10035030-95-カンナ" = "どうするつもりだ？"
"10035030-98-フブキ" = "は～い。みんな注目！"
"10035030-99-子供の利用客A" = "なんだ？あのチビ？"
"10035030-100-子供の利用客B" = "弱そうなやつ！"
"10035030-101-フブキ" = "今から……「だるまさんがころんだ」を始めるよ！"
"10035030-102-子供の利用客" = "だるまさんがころんだ！？"
"10035030-103-フブキ" = "誰が一番長く立っていられるかなぁ。勝負だよ！"
"10035030-104-カンナ" = "（そんなこと、いきなり言って子供が応じるのか……？）"
"10035030-105-フブキ" = "最後まで立っていた人には、プラス10点！"
"10035030-106-カンナ" = "（なんの点数かわからないのに、受け入れるわけが……）"
"10035030-107-フブキ" = "それじゃあ、ゲームスタート！"
"10035030-108-フブキ" = "だるまさんが～～ころんだ！"
"10035030-109-子供の利用客A" = "……（なんとなく始めたけど！）"
"10035030-110-子供の利用客B" = "……（なんかよく分かんないけど……！）"
"10035030-111-子供の利用客C" = "……（負けたくない……！）"
"10035030-113-フブキ" = "あ！そこ、動いたね。アウト！"
"10035030-117-カンナ" = "さっきまで走り回っていたのに……。"
"10035030-118-キリノ" = "大人しくなりましたね……！"
"10035030-119-フブキ" = "さあ、もっかい行くよ。#nだるまさんが～ころんだ！"
"10035030-121" = "（フブキは子供たちが飽きるまで遊んだ……。）"
"10035030-123" = "[ns3] \"すごかったよ、フブキ。\"\n[ns4] \"フブキは子供の相手、慣れてるね。\""
"10035030-126-フブキ" = "まぁ、それなりにねー。"
"10035030-127-フブキ" = "無理やり押さえつけるより、競わせる方が楽なんだよ。"
"10035030-128-フブキ" = "パトロール中は、子供の相手をすることも多いからさ。"
"10035030-129-カンナ" = "そ、そうなのか……。"
"10035030-130-カンナ" = "なるほどな。勉強になった。"
"10035030-131-フブキ" = "これで、子供たちのことはゆっくり見守るだけでいいよ。"
"10035030-132-フブキ" = "んじゃ、後は任せた～。"
"10035030-134-キリノ" = "はい！お任せください！"
"10035030-135-キリノ" = "さっきは油断しましたが、二度目はありません！"
"10035030-136-カンナ" = "では、私は反対側を見張っておこう。"
"10035030-137" = "[s] \"私もカンナの近くにいるね。\""
"10035030-138-キリノ" = "はい！では二手に分かれて両サイドを担当しましょう！"
"10035030-139-キリノ" = "先生もお手伝い、ありがとうございます。"
"10035030-142-カンナ" = "ライフセーバーの仕事は、思った以上に難しいですね。"
"10035030-143" = "[s] \"カンナなら、すぐに慣れるよ。\""
"10035030-144-カンナ" = "そうだといいんですが……正直、自信はありません。"
"10035030-145-カンナ" = "さっきのミスもありますし、私にはフブキのような手際の良さもありませんので。"
"10035030-146" = "[s] \"落ち込むのはまだはやいよ。\""
"10035030-148" = "[ns] \"奉仕、傾聴、誠実、それと笑顔でしょ？\""
"10035030-150-カンナ" = "ふふ、そうでしたね。"
"10035030-151-カンナ" = "仰るとおりです。もう少し頑張ってみましょう。"
"10035030-155-カンナ" = "！？"
"10035030-156-子供の利用客" = "ううっ！ごふっ！"
"10035030-157-子供の利用客" = "た、助けてー！"
"10035030-158-子供の利用客" = "あっぷ！あっぷ！"
"10035030-159-カンナ" = "子供が溺れている……！"
"10035030-160-カンナ" = "先生、助けに行ってきます！"
"10035030-165-カンナ" = "はぁ、はぁ。"
"10035030-166-カンナ" = "大丈夫だったか？"
"10035030-167-子供の利用客" = "げほげほ……！"
"10035030-168-子供の利用客" = "み、水の中にワニが！大きなワニが……！"
"10035030-169-カンナ" = "驚いて幻を見たんだな。もう大丈夫だ、安心してくれ。"
"10035030-170-子供の利用客" = "プール怖いよぅ！"
"10035030-171-子供の利用客" = "もう入りたくない……！"
"10035030-172-カンナ" = "心配するな。溺れないように私が見ている。"
"10035030-173" = "[s] \"カンナ！笑顔！笑顔！\""
"10035030-174-カンナ" = "……あ！"
"10035030-178-カンナ" = "も、もう安心して、いいんだよ。"
"10035030-179-子供の利用客" = "ふぇ……。"
"10035030-180-子供の利用客" = "うわああああぁぁん！！"
"10035030-188-カンナ" = "……？"
"10035030-189" = "[ns] （カンナの顔を見て、プールに逃げた……？）"
"10035030-190-子供の利用客" = "あのお姉ちゃんも怖いよぉぉ！うわあぁぁん！"
"10035030-194-カンナ" = "……先生。"
"10035030-195-カンナ" = "私は……、本当に市民を守れるのか……。"
"10035030-196-カンナ" = "自信が無くなりました……。"
