[translation]
"10000085-2-魑魅一座A" = "ぐあっ！"
"10000085-3-魑魅一座B" = "こ、こんなの手に負えないっす！"
"10000085-8-ニャテ・マサムニェ" = "会長として、使える限りの資金をすべて使って動員した魑魅一座がこんなことに……！"
"10000085-9-ニャテ・マサムニェ" = "まだ、まだ足りないだと……？"
"10000085-10-シズコ" = "先生の指揮もあるし、今の私たちならいくらでもお相手できますよ！"
"10000085-11-フィーナ" = "これがワタシたちの力！デス！"
"10000085-13" = "[ns] \"私たちの勝ち、かな？\""
"10000085-14-ニャテ・マサムニェ" = "……ふふっ、参ったな。"
"10000085-15-ニャテ・マサムニェ" = "儂の数年を賭した計画が……たかが学生と、先生ごときのせいで失敗させられるだと？"
"10000085-16-ニャテ・マサムニェ" = "認められない……"
"10000085-18-ニャテ・マサムニェ" = "認めてなるものか！"
"10000085-19-シズコ" = "大人しく諦めてください、ニャン天丸会長。名残惜しかろうと、もう全て終わりです。"
"10000085-20-ニャテ・マサムニェ" = "ふふふ……まだだ、まだ終わっていない！"
"10000085-21-ニャテ・マサムニェ" = "儂の資金をすべて使ったんだぞ。その魑魅一座が本当に、これで全部だとでも思ったか？"
"10000085-22-シズコ" = "……まさか。"
"10000085-23-ミモリ" = "まだまだいるということですか……！？"
"10000085-24-ニャテ・マサムニェ" = "その通り、会長の資金力を甘く見るな！"
"10000085-25-ニャテ・マサムニェ" = "さあ！まだこの街に残っている、すべての魑魅一座をここに集めよ！"
"10000085-27-ニャテ・マサムニェ" = "大量の魑魅一座……文字通り魑魅魍魎を、その目に焼き付けるがいい！！これで今度こそ――"
"10000085-29-魑魅一座A" = "あー、その件なんだけど……。"
"10000085-30-魑魅一座A" = "実は元々は来るはずだった子たちが、ほとんど「やっぱりパス」って……。"
"10000085-31-魑魅一座B" = "「ここで働くより百夜ノ春ノ桜花祭を楽しみたい」って言って、みんな遊びに行っちゃったんで、もうこれ以上はほぼいないっす。"
"10000085-35-ニャテ・マサムニェ" = "……"
"10000085-36-シズコ" = "……"
"10000085-37-カエデ" = "……"
"10000085-38-ミモリ" = "……"
"10000085-39-ツバキ" = "……眠い。"
"10000085-40-魑魅一座A" = "えっと、これって……。"
"10000085-41-魑魅一座B" = "もうダメかもしんないっすね。"
"10000085-42-魑魅一座A" = "……うん、よし！解散！"
"10000085-44-カエデ" = "あっ！？ここで逃げるのとかズルでしょ！？"
"10000085-45-ツバキ" = "待て～。"
"10000085-47-ニャテ・マサムニェ" = "……。"
"10000085-50" = "（シュババッ！）"
"10000085-51-ニャン天丸" = "えっと、その、だな……諸君、全部水に流すというのは……どうだろう？"
"10000085-52-シズコ" = "んなことできるかあぁぁっっ！シズコ[ruby=マジギレ]本気の[/ruby]看板娘パーーンチ！"
