"10011050-10-魑魅一座のリーダー" = "これは一体、どういう状況なんだ……？"
"10011050-11-イブキ" = "ねぇねぇ、イブキは何もしなくて良いの？"
"10011050-12-魑魅一座A" = "と、とにかく静かに！今は逃げるので精一杯だから！"
"10011050-13-魑魅一座のリーダー" = "くそっ、次はどうすれば……！"
