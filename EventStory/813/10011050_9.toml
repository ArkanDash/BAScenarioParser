[translation]
"10011050-1" = "第5話;第二関門：眠り姫"
"10011050-7-魑魅一座A" = "はぁ、はぁ……何とか追っ手は振り切ったが……。"
"10011050-8-ニヤ" = "相変わらずお姫様を誘拐した悪党は全力で逃走中！果たして誰が最初に、彼女たちを捕まえられるのか～！？"
