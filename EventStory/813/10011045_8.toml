[translation]
"10011045-2-シズコ" = "はい、お疲れ様でしたー！"
"10011045-3-ミチル" = "……え、どういうこと？もう終わりで良いの？"
"10011045-4-シズコ" = "まあ別に、そういうアトラクションだし……？"
"10011045-5-ミチル" = "あ、そっか。"
"10011045-9-フィーナ" = "ですがそれでも、胸が熱くなるようなバトルでした！フィーナ、感動デス！"
"10011045-10-フィーナ" = "これが噂で聞く「ニンジャ」なのでデスネ！"
"10011045-11-シズコ" = "そうね、百夜ノ春ノ桜花祭の時は気づかなかったけど、"
"10011045-12-シズコ" = "これはもしかして集客になるかも……？"
"10011045-13" = "[s] \"考える方向性がいつも通りだ……。\""
"10011045-17-シズコ" = "べ、別に悪いことじゃないじゃないですか！？"
"10011045-18-シズコ" = "……忍術研究部、だったわよね？"
"10011045-19-シズコ" = "忍者の部活とか、最初は何のことかと思ったけど……"
"10011045-20-シズコ" = "うん、良いんじゃない？まあ頑張ってね。"
"10011045-21-ミチル" = "あ、ありがとう……。"
"10011045-22-シズコ" = "先生とお話したいことが色々あるのですが、今日についてはそれはさておき……"
"10011045-23-シズコ" = "とにかく合格です！では、次のコースへどうぞ！"
"10011045-24-ミチル" = "よ、よし！"
"10011045-28-ミチル" = "じゃあ、張り切って進んでいこう！"
