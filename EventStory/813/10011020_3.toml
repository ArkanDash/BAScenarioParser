[translation]
"10011020-1" = "第2話;大きな乙女"
"10011020-2" = "百鬼夜行 公演 準備 ステージ"
"10011020-4-公演スタッフ" = "公演スタッフの方々は、こちらにお集まりください！"
"10011020-5" = "[s] \"よし、行こっか。\""
"10011020-6-イズナ" = "いざ！"
"10011020-11-ツクヨ" = "はいっ……！"
"10011020-19-ミチル" = "いやー、何させられるんだろうねー。"
"10011020-20-公演スタッフ" = "では本格的な作業の前に、役割分担を決めようと思います。"
"10011020-21-ミチル" = "……役割分担？"
"10011020-22-公演スタッフ" = "そこのあなた、こちらにお願いします。"
"10011020-23-ミチル" = "あ、うん。"
"10011020-27-公演スタッフ" = "そこのあなたはあちらへ。"
"10011020-28-イズナ" = "ニンニン！"
"10011020-32-公演スタッフ" = "そこの背の高い方は、そちらの方へ。"
"10011020-33-ツクヨ" = "はいっ……！"
"10011020-38-公演スタッフ" = "それでは、各スタッフに従って動いてください。"
"10011020-40-ミチル" = "うーん、ばらけちゃったけど仕方ないか。"
"10011020-42-イズナ" = "イズナ、頑張ってきます！"
"10011020-43-ツクヨ" = "私も、頑張る……。"
"10011020-44" = "[s] \"じゃあ、みんなまた後でね。\""
"10011020-48" = "（そうして、一時間後……）"
"10011020-52" = "[ns] \"……まだ来なさそうかな？\""
"10011020-53" = "（また少し時間が経ち……）"
"10011020-58" = "[ns] \"……？何かの騒ぎ……？\""
"10011020-64" = "[ns] \"あれって……。\""
"10011020-65-ツクヨ" = "あの、どいていただけ、ないでしょうか……。"
"10011020-66-チンピラA" = "んー？まあまあ、もうちょっとそこにいてよ。"
"10011020-67-チンピラB" = "そうだよ、あんたがそこにいてくれないと目印が無いじゃん。"
"10011020-68-チンピラA" = "でっかいやつがいるからって伝えて約束してるんだからさ。"
"10011020-69-ツクヨ" = "私、目印じゃないですよぉ……。"
"10011020-70-ツクヨ" = "それに私、公演の準備が……。"
"10011020-71" = "[s] \"ツクヨ？\""
"10011020-72-ツクヨ" = "……！！"
"10011020-76-チンピラA" = "誰だお前？"
"10011020-77-チンピラB" = "何だ、私たちの邪魔をする気か？"
"10011020-78-チンピラA" = "こうして楽しく遊べそうな日に、邪魔させるわけにはいかねぇなぁ！"
"10011020-79-チンピラB" = "痛い目見ないと分からねぇか？じゃあいくぞおらっ！"
"10011020-80" = "[s] \"うーん……ごめん、ツクヨ。一緒に対応してくれる？\""
"10011020-82-ツクヨ" = "え、えぇっ……！？"
"10011020-83" = "[戦闘突入 - スケバン]"
