[translation]
"10016070-1" = "第7話;協力（2）"
"10016070-2-傭兵生徒A" = "いったい何なのよこのこの戦車！#nどうして動かないの！？"
"10016070-3" = "[s1] \"そりゃあ、戦車じゃないからね……。\"\n[s2] \"エンジニア部が昨日修理した時に戦闘機能を封じたんだね……。\""
"10016070-4-アコ" = "思ったよりつまらない敵でしたね。準備運動にもなりません。"
"10016070-5-アコ" = "思ったよりつまらない敵でしたね。準備運動にもなりません。"
"10016070-6-ハスミ" = "そうですね。大きな問題にならなかったのは幸いですが、こんなに簡単に制圧されるとは……肩透かしです。"
"10016070-10-傭兵生徒A" = "うっ……目の前で私たちを馬鹿にするなんて……！"
"10016070-11-傭兵生徒A" = "クソッ！後退後退！会場の外で、週休4日に賛同する同志を集め直しよ！"
"10016070-16-ユウカ" = "ああっ！！待ちなさい！！！"
"10016070-19-シノン" = "クロノスチャンネルをご覧の皆さん、こんにちは！お昼はおいしかったでしょうか？"
"10016070-20-シノン" = "個人対抗種目が主だった午前の試合がすべて終わりましたので、#nここで学園別中間順位を確認していきましょう！"
"10016070-21-マイ" = "開幕直後はゲヘナ学園が圧倒的な大差で1位に君臨していましたが……"
"10016070-22-マイ" = "現在の順位は果たして――"
"10016070-23-マイ" = "なんと！ミレニアムサイエンススクールがトップに躍り出ています！"
"10016070-24-シノン" = "ミレニアムサイエンススクールですか？運動と縁遠い学園ですから、いつもと同じように今回も成績が奮わないと思っていたのですが……。"
"10016070-25-シノン" = "やはり主催校としてのプライドでしょうか？"
"10016070-26-マイ" = "しかし、ゲヘナとトリニティが追い上げているので油断はできません！"
"10016070-27-シノン" = "目が離せませんねぇ……午後に行われる学園別対抗種目の結果にも注目です！"
"10016070-28-シノン" = "続いて次の試合は……「障害物競走」です！"
"10016070-29-マイ" = "障害物競走というと、障害物を乗り越えていく競技でしょうか？"
"10016070-30-シノン" = "はい。トラックの上には選手たちを妨害する障害物がたくさん配置されています。"
"10016070-31-シノン" = "「忍者用撒菱」から「500円玉に見えるボトルキャップ」、「拾ってくださいと書かれた箱に入ったぬいぐるみ」まで……"
"10016070-32-マイ" = "なるほど、そういったものがトラック上にあると走りにくそうですね。"
"10016070-33-シノン" = "それに加え、今回の障害物競走は特別ルールが追加されています。"
"10016070-34-シノン" = "そう……バトンの代わりに電子式雷管を挿入した柄付き手榴弾を使用するという点です！"
"10016070-35-マイ" = "バトンの代わりに手榴弾を渡していくのですか？#nそれはあまりにも危険じゃないでしょうか？"
"10016070-36-シノン" = "はい。ですが、一定時間内に次の走者に手榴弾を渡せば爆発しないそうです。"
"10016070-37-シノン" = "あまりにも長時間折り返し地点に入れないと、そのまま手榴弾が爆発して脱落してしまいますが！"
"10016070-38-マイ" = "なるほど、特定の選手に頼らず、全員がベストを尽くせるよう配慮した措置なのですね。"
"10016070-40-シノン" = "さあ……この試合で勝利の女神が微笑むのはどの学園なのでしょうか？"
"10016070-42-アヤネ" = "「障害物競走」のアビドス代表は……"
"10016070-43-アヤネ" = "セリカちゃんとホシノ先輩、そしてシロコ先輩ですね。"
"10016070-47-ホシノ" = "うへ～緊張するなぁ。"
"10016070-48-シロコ" = "……ん、任せて。"
"10016070-49-セリカ" = "手榴弾だの、びっくり箱だの……競技に何か変なのがたくさん混ざってるみたいだけど……"
"10016070-50-セリカ" = "晄輪大祭の総合優勝賞金を獲得するためにも、この試合は必ず1位を獲得するわよ！"
"10016070-54-アヤネ" = "あはは……いくらなんでも、私たちのような弱小校が総合優勝するのは難しいんじゃないでしょうか……？"
"10016070-55-アヤネ" = "ですが……最善を尽くして試合に臨んでください。"
"10016070-56-アヤネ" = "私たちが大運動会で活躍すれば、#nアビドス高等学校に転校してくる生徒が増えるかもしれませんから。"
"10016070-57-ホシノ" = "うへ～アヤネちゃんはまだまだだねぇ～"
"10016070-58-ホシノ" = "大運動会で注目されたいなら、競技場より観客席で頑張る方が効果的なんだよ。"
"10016070-59-アヤネ" = "……観客席、ですか？"
"10016070-60-ノノミ" = "はい！観客席でのチアリーディング……そう、応援合戦です☆"
"10016070-61-ノノミ" = "ホシノ先輩のお話を聞いて、応援も用意してきたのに……"
"10016070-62-ノノミ" = "頑張れ！"
"10016070-63-ノノミ" = "頑張れ！"
"10016070-64-ノノミ" = "水着応援団～☆"
"10016070-65-セリカ" = "水着応援団って何よ！？#nもっとマシな名前なかったの！？"
"10016070-69-シロコ" = "……ん。応援なら、私も準備してきたのがある。"
"10016070-70-アヤネ" = "なんだか不吉な予感が……"
"10016070-74-シロコ" = "……60mm対戦車ロケットだよ。"
"10016070-76-アヤネ" = "……なんですか！？"
"10016070-77-シロコ" = "威嚇射撃。"
"10016070-78-シロコ" = "応援って味方の士気を上げることもだけど、相手の士気を落とすことも大事。"
"10016070-79-シロコ" = "リレーでこの対戦車ロケットを持ってトラックに入ったら、#n圧倒的な火力差に相手チームの士気が落ちるはず。"
"10016070-80-ホシノ" = "いや～いいねぇ。#nやっぱ戦いは出鼻を挫くに限るよねぇ～"
"10016070-81-ノノミ" = "うふふ、楽しそうですね☆"
"10016070-84-アヤネ" = "そんな……"
"10016070-85-アヤネ" = "そんなの許されるわけないじゃないですか！"
"10016070-87-コトリ" = "ふっふっふ……障害物競走に使われる手榴弾は摩擦式遅延信管を使用した旧型に見えますが……実は最先端の電気信管を使用しているんです！"
"10016070-88-コトリ" = "ですが、昨日急ごしらえで作ったので、きちんと動作するか少し不安ですが……"
"10016070-89-コトリ" = "であれば……競技に参加して性能テストを行うのが[ruby=マイスター]職人[/ruby]の道理と言えるでしょう！"
"10016070-90-コトリ" = "それでは、ウタハ先輩。手榴弾のテストは私が行いますので、#n選手たちの応援はお願いしますね！"
"10016070-94-ウタハ" = "うむ、応援は任せておけ！"
"10016070-95-ヒビキ" = "うぅ……私が確認したかった……"
"10016070-96-ウタハ" = "いつまでそうやってるんだ、ヒビキ。"
"10016070-97-ウタハ" = "応援団がそんな顔をしてたら、選手も実力を発揮できないだろう？"
"10016070-98-ウタハ" = "さあ、笑って！お腹から声を出そう！"
"10016070-99-ウタハ" = "行け！行け！勝て！勝て！ミレニアム！"
"10016070-100-ヒビキ" = "み、ミレニアム……！"
"10016070-102-サキ" = "はぁ……"
"10016070-103-サキ" = "昨日も今日も変な事件ばっかりで……流石に疲れたな……"
"10016070-104-ミユ" = "ちょっとでも緊張が解けたら倒れちゃいそう……"
"10016070-105-ミヤコ" = "みんな、あとちょっとですから頑張りましょう。#n晄輪大祭はまだ終わっていません。"
"10016070-106-ミヤコ" = "今もなお、極悪非道なテロリストがどこで悪巧みをしているか分からないのですよ。"
"10016070-110-モエ" = "ねえ、こっちに近づいてくる巨大な物体がレーダーに引っかかったんだけど……"
"10016070-111-モエ" = "これ、大丈夫かな……？"
"10016070-113-ジュンコ" = "（はぁ……こんな面倒くさそうな試合には出場したくなかったのに……）"
"10016070-114-ジュンコ" = "（でも、3位内に入ったら晄輪大祭で何でも食べられる「万能食券」をくれるってアコが言ってたし……）"
"10016070-117-ジュンコ" = "（とりあえず頑張ってみようかな……？）"
"10016070-125-シノン" = "さあ、開始の合図が鳴りました！各選手、一斉に走り出します！"
"10016070-129-シノン" = "猛烈な勢いでトラックを疾走していく！"
"10016070-133-シノン" = "最初の障害物「まきびしトラック」を無事突破し、#n第二走者にバトン――いや、手榴弾が渡された！"
"10016070-134-シノン" = "続く次の障害物は……"
"10016070-135" = "キュルキュルキュル！"
"10016070-136-シノン" = "これは一体何の音でしょうか！？異音がグラウンドに響き渡ります！"
"10016070-141-傭兵生徒A" = "し、しつこいわね……"
"10016070-142-傭兵生徒A" = "ついてこないで！"
"10016070-148-シノン" = "おおっと！！これは一体どういった事でしょう！？#n戦車です！グラウンドに突如として戦車が現れました！"
"10016070-149-コトリ" = "そちらにつきましてはエンジニア部よりご説明します！"
"10016070-150-コトリ" = "このロボットは、私たちエンジニア部が大運動会用に作った応援ロボットなのです。"
"10016070-151-コトリ" = "どんな場所でも迅速に移動できるよう、空気抵抗を減らした丸い胴体、そして段差も乗り越えられるカタピラをセットしました！"
"10016070-152-ヒビキ" = "今はちょっと「小さな問題」があるから公式には使ってないけど……"
"10016070-154-ヒビキ" = "どうしてアレがここにあるんだろ……？"
"10016070-155-シノン" = "なんと！応援ロボットとの事でした！#nですが、応援ロボットと呼ぶには些か無理があるのでは？"
"10016070-156-ウタハ" = "ああ。それは騒動やテロが発生した際、すぐ鎮圧できるよう搭載した戦闘システムだよ。"
"10016070-157-ウタハ" = "もちろん今は勝手に動かないように調整しているがね。#nそう……強力な衝撃を与えたりしない限り異常作動することはまずな――"
"10016070-158" = "プシュー"
"10016070-159" = "ドッカーン！"
"10016070-160-セリカ" = "シロコ先輩！それ使わないでって言ったでしょ！"
"10016070-161-セリカ" = "対戦車ロケットを撃つ応援団がどこにいるのよ！？"
"10016070-162-シロコ" = "ダメか……"
"10016070-163-セリカ" = "ダメに決まってるでしょ！"
"10016070-164-セリカ" = "うわぁ……なんか高そうな戦車に当たってる。#n大丈夫かな……"
"10016070-166-応援ロボット" = "＜400mm以上の貫通力を持つ弾頭の爆発を感知。戦闘システムを起動します＞"
"10016070-167-応援ロボット" = "＜半径1km以内の不良生徒を探知中……＞"
"10016070-168-応援ロボット" = "＜不法JHP弾を所持した生徒が3人、許可されていない自家製体操着を着用した生徒が7人、歩行しながら飲食する生徒が5人……＞"
"10016070-170-コトリ" = "……不良かどうかの判断基準が思ったより厳しいですね。"
"10016070-171-ウタハ" = "AIのマシンラーニングにセミナーの意思決定アルゴリズムを使ったのさ。"
"10016070-172-ウタハ" = "その過程で「どこかの冷酷な会計」に影響を受けたのかも……"
"10016070-174-応援ロボット" = "＜調査完了。半径1km以内のすべての生徒を「不良生徒」とみなします＞"
"10016070-175-応援ロボット" = "＜全員――因数分解します！＞"
"10016070-176" = "ドッカーン！"
"10016070-178-ジュンコ" = "ちょ、ちょっと何アレ！？#nどうして戦車があるの！？"
"10016070-179" = "さっきのロケットのせいで戦車が暴走した！？"
"10016070-180-セリカ" = "さっきのロケットのせいで戦車が暴走した！？"
"10016070-181-セリカ" = "もう……！これ全部シロコ先輩のせいじゃん！"
"10016070-183-コトリ" = "わ、わぁっ！制御不能になってしまいました！#n先輩ー！助けてください！！"
"10016070-184-応援ロボット" = "＜大運動会の円満開催を妨害する不良生徒は……直ちに排除します＞"
"10016070-186-サキ" = "ついに姿を現したな、ミレニアムのテロリストめ！"
"10016070-187-サキ" = "こうなった以上、手榴弾でカタピラを切るしか……"
"10016070-191-サキ" = "……あれ？手榴弾が作動しな――"
"10016070-193" = "ドッカーン！"
"10016070-194-ミユ" = "さ、サキちゃん――！"
"10016070-196-シノン" = "み、皆さん……ご覧になりましたか？"
"10016070-197-シノン" = "障害物競走に戦車が乱入し、生徒を攻撃しています！"
"10016070-198-マイ" = "皆さんで手を取り合って取り組むはずの晄輪大祭に、あんなものが現れるとは……"
"10016070-199-マイ" = "前代未聞の大型スクー……いえ、事件ですね！"
"10016070-201-ハスミ" = "ユウカ、あの戦車は一体？"
"10016070-202-ハスミ" = "「晄輪大祭」にあんな戦車を使う競技があるなんて聞いておりませんが。"
"10016070-203-ユウカ" = "わ、私もよ！#nあんな戦車があるなんて聞いてない！"
"10016070-204-ユウカ" = "彼らのことだから、どうせ形だけのハリボテだと思ってたけど……。"
"10016070-205-アコ" = "本当に知らないんですか？#nあなたのような言葉遣いで騒いでいますよ。"
"10016070-206-アコ" = "「因数分解してやる～」とか「完璧～」とか言っていますけど……。"
"10016070-207-ユウカ" = "それ、私の話し方を真似してるつもりなの！？"
"10016070-208-ユウカ" = "先生は、あの戦車の事何か知ってますか？#nもしかして私が寝てる間に何かあったとか！？"
"10016070-209" = "[s3] \"えっと、それが……。\"\n[s4] \"説明すると長くなるんだけど……。\""
"10016070-212-ハスミ" = "説明は後からでも遅くないでしょう。"
"10016070-213-ハスミ" = "マリーさん、まずは観客の避難誘導をお願いします。"
"10016070-214-マリー" = "……は、はいっ！"
"10016070-215-ハスミ" = "残った私たちで戦車を無力化しましょう！"
"10016070-217-アコ" = "はいはい。あなたの指示がなくたって、そのように動くつもりでしたよ？"
"10016070-218-ユウカ" = "もう、先生！#n後で始末書の覚悟をしておいてくださいね！"
