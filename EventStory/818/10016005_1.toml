[translation]
"10016005-1" = "プロローグ;燃え上がる開会式"
"10016005-2" = "スタジアム放送室"
"10016005-3-マイ" = "クロノスチャンネルをご覧の皆さん、こんにちは！"
"10016005-4-マイ" = "この放送はキヴォトス陸上大会の聖地「アスレチックスタジアム」の中継席からお送りしています！"
"10016005-5-シノン" = "早朝にもかかわらず、ここアスレチックスタジアムはたくさんの生徒で溢れています。"
"10016005-6-シノン" = "その理由は……言わずとも、皆さんご存知ですよね？"
"10016005-7-シノン" = "そう！いよいよ本日、キヴォトス大運動会――#nその名も「[ruby=こうりんたいさい]晄輪大祭[/ruby]」が開催されるからです！"
"10016005-8-マイ" = "2年毎に開かれる晄輪大祭は、ゲヘナやトリニティ、ミレニアムをはじめとする様々な学園が一堂に会して競い合う、キヴォトス有数の大型イベント！"
"10016005-9-マイ" = "さらに今回はミレニアムサイエンススクールの主管でお送りしているため、#n新しい発明品など様々な見どころが用意されています。#nきっと例年以上の盛り上がりを見せてくれることでしょう！"
"10016005-10-シノン" = "視聴者の中には、都合が合わず各自治区や寮からこの放送をご覧になっている方もいらっしゃると思いますが……"
"10016005-11-シノン" = "もし会場に足を運べなかったとしても問題ありません！"
"10016005-12-シノン" = "私たちクロノスチャンネルが、今年の晄輪大祭も高解像度な映像と迫力のサウンドで独占中継しております！"
"10016005-13-マイ" = "さあ、晄輪大祭で行われる多種多様な競技をご覧になりたい方は、#nぜひクロノスチャンネルの概要欄からチャンネル登録と高評価、そして通知のオンを――"
"10016005-18-マイ" = "おっと、実行委員会がお怒りのようで……"
"10016005-19-マイ" = "失礼いたしました。"
"10016005-20-シノン" = "それではこれより生徒の熱い歓声と共に――"
"10016005-21-シノン" = "晄輪大祭、"
"10016005-22-シノン" = "開幕です！"
"10016005-30-シノン" = "いや～今年は年始めから凶悪な事件が相次いで発生していましたから、#n晄輪大祭が延期するという噂も耳にしましたが……無事に開催されて良かったですね。"
"10016005-31-シノン" = "これもミレニアムの優秀な技術力のおかげでしょうか？"
"10016005-32-マイ" = "ええ。今年の晄輪大祭は「ミレニアム博覧会」とも言われるほどで、#nミレニアムサイエンススクールの最先端技術が惜しみなく使われております。"
"10016005-33-マイ" = "そのおかげで、このような大型建造物や案内ロボットを限られた準備期間で用意できたとのことですが……"
"10016005-34-マイ" = "……噂によると、ミレニアム内で開催が危ぶまれるような問題が発生したのだとか。"
"10016005-35-マイ" = "開会式を翌日に控えたにも関わらず、一部の競技種目が調整されたのも……#nそれを裏付ける証拠だと言われていますね。"
"10016005-36-シノン" = "一体どんな問題が起こったのでしょうか？"
"10016005-37-マイ" = "残念ながらミレニアムの厳重なセキュリティを前に、#nその真相へと至ることはできませんでしたが……"
"10016005-38-マイ" = "私たちクロノス報道部は、取材途中に衝撃的な事実を目撃しました。"
"10016005-39-マイ" = "突然の競技種目の調整、それを提案した人物とは他でもない……"
"10016005-40-シノン" = "他でもない……？"
"10016005-41-マイ" = "シャーレの先生だというのです！"
"10016005-42-シノン" = "シャーレの先生、ですか？"
"10016005-43-シノン" = "あらゆる事件に関与しているというシャーレの先生が、#nまさか晄輪大祭の準備にも関わっていたとは……"
"10016005-44-シノン" = "怪しさ満て――いえ、まさかの人物でしたね！"
"10016005-45-マイ" = "そうなんです！何だかスクープの香りが……。"
"10016005-50-マイ" = "おっと、また実行委員会から無線が……。"
"10016005-51-シノン" = "あっ！ただ今より、開会式の最後を締めくくる選手宣誓が行われます！#n選手代表のお二人が壇上に登りました！"
"10016005-52-マイ" = "今年の選手代表は……アビドス高等学校の「[ruby=おくそら]奥空[/ruby]アヤネ」選手と#nトリニティ総合学園の「[ruby=うらわ]浦和[/ruby]ハナコ」選手ですね。"
"10016005-53-シノン" = "皆さん、このまま壇上にご注目ください！"
"10016005-56-アヤネ" = "うぅ……こんな大勢の前に立つのは初めてなので、少し緊張しますね……。"
"10016005-57-アヤネ" = "何度も練習はしましたが、噛んでしまったらと思うと……。"
"10016005-58-ハナコ" = "そんなに緊張する必要はありませんよ、奥空さん。"
"10016005-59-ハナコ" = "選手代表とはいえ、皆さんの前で自分の決意を表明するだけのこと。"
"10016005-60-ハナコ" = "他人の視線など気にせず、自分の気持ちに素直になれば良いのです。"
"10016005-61-ハナコ" = "ふふっ、目に映る相手をキュウリやニンジンだと思えば、少しは気持ちも楽になるのではないでしょうか？"
"10016005-65-アヤネ" = "ハナコさんはすごいですね。#n大勢の前でも堂々としていて……トリニティの気品を感じます。"
"10016005-66-アヤネ" = "あはは……私も見習わないと。"
"10016005-67-ハナコ" = "あら、そう言っていただけて光栄です。"
"10016005-69-アヤネ" = "（ふう……焦らず、落ち着いて……）"
"10016005-70-アヤネ" = "選手一同を代表して、宣誓します！"
"10016005-71-ハナコ" = "選手一同を代表して、宣誓します～。"
"10016005-72-アヤネ" = "私たちは晄輪大祭に参加する者として……"
"10016005-73-ハナコ" = "私たちは晄輪大祭に参加する者として……"
"10016005-74-アヤネ" = "正々堂々、スポーツの精神に則って……"
"10016005-75-ハナコ" = "「ありのままの欲望」に誓って……"
"10016005-76-アヤネ" = "ひとつひとつの競技に全力で取り組むことを……"
"10016005-77-ハナコ" = "「身体の対話」に取り組むことを……"
"10016005-81-アヤネ" = "ちょっと待ってください、ハナコさん。#n今おっしゃったのは一体……？"
"10016005-82-ハナコ" = "うふふっ、先ほど申し上げたでしょう？#n他人の視線など気にせず、自分の気持ちに素直になれば良い、と。"
"10016005-83-ハナコ" = "晄輪大祭は、様々な学園の生徒が武器を置き、お互いの素肌をぶつけ合って親交を深める友愛の場……。"
"10016005-84-ハナコ" = "それはつまり……"
"10016005-85-ハナコ" = "■■と同じでしょう？"
"10016005-89-アヤネ" = "そ、それはどういう……"
"10016005-90-アヤネ" = "ちょ、ちょっと待ってくださいハナコさん！#nマイク！マイクがオンになっていますよ！"
"10016005-91-ハナコ" = "お気になさらず。#nここにいるのはキュウリやニンジンなのですから。"
"10016005-92-ハナコ" = "前々から思っていたのです。#nお互いの素肌をぶつけ合うだなんて……晄輪大祭はなんと淫らなお祭りなんだろうって……うふふっ。"
"10016005-93-スタッフ" = "ちょっと……彼女は何を言っているの！？"
"10016005-94-ハナコ" = "ですが、私はとても良い機会だと思っています。#n所属やちょっとした先入観で、お互いの気持ちは容易く理解できなくなってしまいますが……身体は正直なものですから。"
"10016005-95-ハナコ" = "キヴォトスの全生徒が集まって仲良く■■■■をする姿は、まさに泰平なるキヴォトスを目指しく様であり――"
"10016005-96-スタッフ" = "今すぐあいつを壇上から下ろせ！"
"10016005-97-スタッフ" = "トリニティは一体何のつもりであんな生徒を代表に――"
"10016005-98-ハナコ" = "うふふっ……■■、■■です！みんなで■■いたしましょう！"
"10016005-99-ハナコ" = "激しく、もっとお互いを求めて！#n■■を！■■を！■■を――！"
"10016005-105-シノン" = "ええっと……放送事故、でしたね？"
"10016005-106-マイ" = "トリニティの代表が、公衆の面前であんな電波に乗せられないような事をまくし立てるなんて……"
"10016005-108-マイ" = "スクープですね！"
"10016005-109-マイ" = "録音室、ちゃんと撮影してありますよね？#nすぐに号外記事の作成を……"
"10016005-114-マイ" = "……えっ？ちょっと待ってください。#n先ほどの映像は流すなって、どういうことですか？"
"10016005-115-マイ" = "晄輪大祭で撮影した全ての映像は、私たちクロノススクールが独占中継するという約束を交わしましたよね？"
"10016005-116-マイ" = "約束を反故にするのであれば、こちらにも手段がありますよ！#nレッドウィンター連邦学園自治区から入手した某同人誌の内容が事実だと――"
"10016005-117-シノン" = "わっ！それをここで言うのはマズいですよ、先輩！"
"10016005-121-シノン" = "いやいや、お騒がせしました！#n引き続きクロノスチャンネルでは晄輪大祭の様子を独占中継でお送りします！"
"10016005-125-シノン" = "皆さん、チャンネルはそのままですよ！"
"10016005-127" = "#video;10016"
