[translation]
"10046150-3-ミカ" = "やっほー☆"
"10046150-4-イチカ" = "ミカ様！？"
"10046150-5-ミカ" = "ナギちゃんがプライベートビーチの一般開放なんてするから、イチカちゃんが大変になっちゃったって聞いて――"
"10046150-6-ミカ" = "手伝いに来ちゃった！"
"10046150-10-ミカ" = "……あれ、喜んでくれると思ったのに。"
"10046150-11-ミカ" = "私、また余計なことしちゃった……？"
"10046150-12-イチカ" = "い、いえ！そんなことないっす！"
"10046150-13-イチカ" = "ただ……ちょっとびっくりしただけで。"
"10046150-14-ミカ" = "そう？よかったぁ。"
"10046150-15-イチカ" = "でも、ミカ様は休んでて大丈夫っすよ。"
"10046150-16-ミカ" = "えっ？どうして？"
"10046150-17-イチカ" = "どうしてもなにも……パトロールは危ないこともあるっすから……。"
"10046150-18-ミカ" = "……もしかして心配してくれるの？"
"10046150-19-イチカ" = "まあ、はい……パトロールも重要ですが、それ以上にティーパーティーの皆さんの安全確保が第一っすから。"
"10046150-20-ミカ" = "それなら大丈夫！"
"10046150-21-ミカ" = "私、こう見えて結構強いんだ！"
"10046150-22-イチカ" = "あはは……そもそも戦わないでもらうためのパトロールなんすけど……。"
"10046150-23-ミカ" = "えぇ～？#nティーパーティーは手伝っちゃダメなの？"
"10046150-27-ミカ" = "……んー、じゃあこうするのはどうかな？"
"10046150-28-ミカ" = "あくまで、[ruby=・]イ[/ruby][ruby=・]チ[/ruby][ruby=・]カ[/ruby][ruby=・]ち[/ruby][ruby=・]ゃ[/ruby][ruby=・]ん[/ruby][ruby=・]の[/ruby][ruby=・]友[/ruby][ruby=・]達[/ruby]が手伝ってるってことで。"
"10046150-29-イチカ" = "……同じじゃないっすか？"
"10046150-30-ミカ" = "あはっ！やっぱりそう思う？"
"10046150-31-イチカ" = "ははっ、なんすかもう……。"
"10046150-32-イチカ" = "……仕方ないっすね。"
"10046150-33-ミカ" = "おぉっ？それじゃあ……？"
"10046150-34-イチカ" = "お言葉に甘えさせてもらうっす。"
"10046150-35-ミカ" = "やったぁ！よろしくね、イチカちゃん！"
