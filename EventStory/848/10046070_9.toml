[translation]
"10046070-1" = "第7話;一難去ってまた一難"
"10046070-8-カスミ" = "なるほど、概ね予想通りだな。"
"10046070-13-ミカ" = "もう分かったの！？"
"10046070-14" = "[s1] \"早くない！？\"\n[s2] \"何か知ってるの？\""
"10046070-20-カスミ" = "ん？まあ元々温泉開発のために調べていたからな。"
"10046070-21-カスミ" = "それに、何より……。"
"10046070-22-カスミ" = "経験からくる慣れというものだ、ハーハッハッハ！！"
"10046070-23-カスミ" = "では、諸君――"
"10046070-27-カスミ" = "――開発を始めるぞ。"
"10046070-31-ハスミ" = "これはどういうことですか！？"
"10046070-38-ハスミ" = "なぜ温泉開発部が！？"
"10046070-39-ハスミ" = "イチカ、早く準備を！今度こそ奴らを追い払います！"
"10046070-44-イチカ" = "私が呼びました。"
"10046070-48-ハスミ" = "……イチカ？"
"10046070-53-イチカ" = "ハスミ先輩……私からのお願いっす。#n今回だけ、見逃してくれないっすか？"
"10046070-54-ハスミ" = "何があったのですか……？"
"10046070-55-ハスミ" = "温泉開発部の危険性については、あなたが一番理解しているはず……。"
"10046070-56" = "[s3] \"私からもお願い。\"\n[s4] \"イチカは最善を尽くしてくれたんだ。\""
"10046070-61-ハスミ" = "先生まで……そうですか。"
"10046070-62-ハスミ" = "お二人がここまで言うのでしたら、きっと何かあるのでしょう。"
"10046070-63-ハスミ" = "この件が片づいたら、きちんと説明してもらいますからね。"
"10046070-64-イチカ" = "ありがとうございます！"
"10046070-68-メグ" = "お～い！お友達さん～！"
"10046070-72-イチカ" = "だから友達じゃないって言ったっすよね！？"
"10046070-73-メグ" = "え？でも部長が言ってたし……。"
"10046070-74-イチカ" = "……。"
"10046070-75" = "[s5] \"これを機に仲良くなるのはどうかな……。\"\n[s6] \"って私は思うけど……。\""
"10046070-81-イチカ" = "先生。"
"10046070-82-イチカ" = "……言っていいことと、悪いことがあるんすよ。"
"10046070-83" = "[s7] \"ご、ごめんなさい！\"\n[s8] （目を逸らす）"
"10046070-86-メグ" = "部長は、えっと……社交的で誰とも仲良くなれる性格だよ？"
"10046070-87-イチカ" = "本人が言ってるだけじゃないっすか。"
"10046070-88-メグ" = "あ、知ってた？#nあははっ、やっぱ二人って仲良いんだね！"
"10046070-89-イチカ" = "じゃなくて……はぁ。#n部員を責めても意味ないっすよね。"
"10046070-90-イチカ" = "……いや、あるかも？"
"10046070-91-メグ" = "あっ！忘れてた！部長が呼んでたんだった！"
"10046070-92-イチカ" = "私をっすか……？#n工事にトラブルでも？"
"10046070-93-メグ" = "工事はもう終わったよ。#n竣工式があるから、依頼主も来るべきだって。"
"10046070-94-イチカ" = "えっ、もう？#nまさか手を抜いたんじゃ……？"
"10046070-95-メグ" = "こっち、ついてきて～！"
"10046070-105-イチカ" = "……温泉じゃないっすか。"
"10046070-110-カスミ" = "これだから素人は困るなぁ！"
"10046070-111-カスミ" = "パッと見はそう見えるかもしれんが――"
"10046070-112-カスミ" = "肝心な温泉が湧いていない！これでは温泉とは呼べんぞ！！"
"10046070-113-カスミ" = "なので、沸かした湯に入浴剤を入れて、雰囲気だけ出しているものだ。"
"10046070-114-カスミ" = "もちろん、いずれは必ず……#n本物の温泉を湧かせてみせるから、安心してくれ。"
"10046070-115-イチカ" = "……本当に温泉が好きなんすね。"
"10046070-116-イチカ" = "にしても、もうちょっと何とかならなかったんすか？#n元の建物と全然違うっすよ！？"
"10046070-120-カスミ" = "急ぎの依頼だっただろう？"
"10046070-121-カスミ" = "ありものの資材を使ったら、こうなった。#n元々が温泉施設を建てるために持ってきた資材だからな。"
"10046070-122-イチカ" = "……返した資材を、そのまま使ったんすか？"
"10046070-123-カスミ" = "そうだが？"
"10046070-124-イチカ" = "それじゃあ、何の利益にもならないのでは？"
"10046070-125-カスミ" = "まあ、成り行きでな。"
"10046070-126-イチカ" = "どうしてここまで……？"
"10046070-127-カスミ" = "契約を履行しただけに過ぎんよ。"
"10046070-131-イチカ" = "あなた、やっぱり……。"
"10046070-136-ミカ" = "みんな！ナギちゃんこっち来てるって！"
"10046070-137-ミカ" = "カスミちゃん！ほんっとうに悪いんだけど――"
"10046070-138-カスミ" = "ああ、分かっているとも。#n招かれざる客……脇役はそろそろ退場の時間だ。"
"10046070-139-カスミ" = "大切な友達のためにも、な？"
"10046070-143-ミカ" = "本当にありがとうね！"
"10046070-144-カスミ" = "感謝ならイチカちゃんにしておくことだ！"
"10046070-152-ナギサ" = "まさかティーパーティーの品位について論ずることになるだなんて……。"
"10046070-153-セイア" = "不可抗力だ。#nあれだけ茶を飲ませて、何を求めていたというのだい？"
"10046070-154-ナギサ" = "この件は、後ほどミカさんの前でもう一度――"
"10046070-158-ナギサ" = "あら？別荘が……？"
"10046070-159-ミカ" = "みんなお帰り！楽しんでた？"
"10046070-160-ナギサ" = "あ、ミカさん。聞いてください。セイアさんが本当にもう……。"
"10046070-161-ナギサ" = "ところで、別荘の趣が……少し変わっていませんか？"
"10046070-165-ミカ" = "え、そうかな！？#n掃除したから、綺麗になってちょっと雰囲気変わったかも？"
"10046070-166-ナギサ" = "ちょっと、どころではないと思いますが……。"
"10046070-168-セイア" = "ナギサ、それこそ君に疲労が溜まっている証拠だろう。#n私からしても別荘に問題はない。"
"10046070-170-ナギサ" = "そうでしょうか？まあ、セイアさんもそうおっしゃるのなら……。"
"10046070-171-ナギサ" = "では入りましょうか。もうくたくたです……。"
"10046070-175-ミカ" = "あ、お風呂沸かしてあるからね！"
"10046070-176-ナギサ" = "あら、ご配慮ありがとうございます。では、お先に失礼します。"
"10046070-182-セイア" = "……ふふっ。ちょっと、か。#n苦労がしのばれるね。"
"10046070-183-セイア" = "どうやって建て直したのかは見当もつかないが。"
"10046070-184-ミカ" = "気づいてたの！？"
"10046070-185-セイア" = "これだけの変化に、まさか気づかないとでも？"
"10046070-186-セイア" = "私のフォローがあったとて――#n普段のナギサであれば誤魔化すことなど到底不可能だっただろう。"
"10046070-187-セイア" = "……そう、[ruby=・]普[/ruby][ruby=・]段[/ruby][ruby=・]の[/ruby]ナギサ、だったなら。"
"10046070-188-ミカ" = "ん？どういう意味？"
"10046070-189-セイア" = "言い換えれば、少しは肩の力を抜いても良いということだ。#n今の君にとって、それが難しいことも理解しているがね。"
"10046070-190-セイア" = "その理由……負い目については、私も無頓着ではない。#nだが……君とナギサの関係は、それほど希薄なものではないだろう？"
"10046070-191-セイア" = "これは……ただそれだけの話さ。#nでは、私もミカの厚意に甘えることにしよう。先に失礼するよ。"
"10046070-197-ミカ" = "……ま～た難しいことばっか言って。"
"10046070-198-ミカ" = "先生は分かった？"
"10046070-199-ミカ" = "え、先生にも分からなかったの……？#nなのに、私になら分かるかもしれない……？"
"10046070-200-ミカ" = "……なにそれ。先生もセイアちゃんに似てきたの？"
"10046070-205-セイア" = "……ミカ、なにか焦げたような香りがしないかい？"
"10046070-209-ミカ" = "……あっ！お鍋を火にかけたままだった！"
"10046070-210-ミカ" = "ごめん、先生！先行くね！"
"10046070-222" = "（その後、夕食を終え、ナギサとセイアは部屋に戻った）"
"10046070-225-ミカ" = "みんな、お疲れ～！"
"10046070-226-イチカ" = "お疲れっす～！"
"10046070-231-ハスミ" = "ミカ様に、イチカ、そして先生……#nまさか裏であれほど動いてくださっていたとは。"
"10046070-232-ハスミ" = "そうとは露知らず、私はのんきにバカンスを満喫して……お恥ずかしい限りです。"
"10046070-233-ミカ" = "ううん。ハスミちゃんが二人の相手をしてくれていたから、安心して準備に集中できたんだよ。"
"10046070-234-カスミ" = "寂しいじゃないか。私たちは除け者扱いかな？"
"10046070-235-ハスミ" = "温泉開発部……。"
"10046070-236-ハスミ" = "よくもまぁ、ぬけぬけと……#nここに顔を出せたものですね……。"
"10046070-237-カスミ" = "ははっ！そうかね？お褒めにあずかり光栄だよ。"
"10046070-238-ハスミ" = "――ですが、助けられたのは事実です。"
"10046070-239-ハスミ" = "まさか、あなた方に感謝する日がくるとは……。"
"10046070-244-メグ" = "全部解決！みんなハッピー！……いいことじゃないの？"
"10046070-245-カスミ" = "そうだそうだ！もっと言ってやれ！"
"10046070-246-ミカ" = "あ、そういえば。結局は何が原因だったの？"
"10046070-247-ミカ" = "地面が崩れるってよっぽどだよね？"
"10046070-248-カスミ" = "ああ、それは地下に水脈があったのが原因だ。"
"10046070-249-ミカ" = "水脈？"
"10046070-250-カスミ" = "地下水の移動によって土砂流出が起こり、地盤が弱くなっていた。#n来るべき時が来ただけの、時間の問題だったというわけだ。"
"10046070-251-カスミ" = "こんな場所に建てるなら、事前調査と基礎工事を入念に行うべきだったというのに。"
"10046070-252-カスミ" = "ま、いわゆる「安全意識の欠如」による人災ってことさ。"
"10046070-254-ミカ" = "へぇ～カスミちゃんって、ちゃんと詳しいんだね。"
"10046070-258" = "[ns9] \"待って、今なんて……？\"\n[ns10] \"地下に、水脈……？\""
"10046070-261-カスミ" = "さすがは先生。察しがいいじゃないか！"
"10046070-265-カスミ" = "ああ、つまり……！"
"10046070-270" = "[ns11] \"みんな！カスミを止めて！！\"\n[ns12] \"マズい、もう遅――\""
"10046070-275-カスミ" = "ハーハッハッハッハ！！#nああ、おんせ――！"
"10046070-287-カスミ" = "……ごふっ！？"
"10046070-288-カスミ" = "い、いつから気づいて……？"
"10046070-295-イチカ" = "初めからっす。"
"10046070-296-カスミ" = "……ははっ、やっぱりお前は、私と似て――"
"10046070-300-イチカ" = "……ほんと、最後まで油断できないっすよね。"
"10046070-302-ミカ" = "え、ええ？何がどうなってたの？"
"10046070-303-ミカ" = "さっきカスミちゃんが取り出したのって……起爆スイッチ！？"
"10046070-304-イチカ" = "はい。まあ、工事中に爆弾を仕掛けておいたんでしょうね。"
"10046070-305-イチカ" = "念のため警戒しておいたんすけど、まさか本当にやらかすなんて。#nまあ、スイッチさえ回収してしまえば――"
"10046070-314-ナギサ" = "何事ですか？やけに騒がしいような……。"
"10046070-315-セイア" = "気にしないのが最善だと思うのだが……。"
"10046070-326-セイア" = "……ゲヘナ？これは……どういう状況だ……？"
"10046070-330-ミカ" = "ま、まって！私が説明するから！"
"10046070-331-ナギサ" = "あら、これはなんでしょう？"
"10046070-335-ナギサ" = "スイッチ、ですかね？"
"10046070-339-イチカ" = "ちょっ、待っ――"
"10046070-340-ナギサ" = "えいっ。"
"10046070-361-ナギサ" = "……？？？"
