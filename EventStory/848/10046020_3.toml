[translation]
"10046020-1" = "第2話;温泉クライシス"
"10046020-14-ハスミ" = "なぜ、ここに部外者が……。#nあそこで一体何を……？"
"10046020-18" = "[ns1] \"メグ！？\"\n[ns2] \"どうして……？\""
"10046020-24-ハスミ" = "ここは私有地です！"
"10046020-25-ハスミ" = "許可のない活動は直ちにやめてください！"
"10046020-29-ハスミ" = "……？"
"10046020-30-ハスミ" = "聞こえませんでし――"
"10046020-35-メグ" = "わぁ！誰か来た！#n……って、先生！"
"10046020-39-メグ" = "ごめんねー、まだ温泉には入れないんだ。#n……あれ？でも、なんで知ってるの？"
"10046020-43-ハスミ" = "……先生？お知り合いですか？"
"10046020-44" = "[s3] \"えっと、その……。\"\n[s4] \"お、落ち着いて聞いてくれる？\""
"10046020-47-メグ" = "私は温泉開発部のメグ！#n温泉開発のために、爆弾を設置してるところだよ！"
"10046020-51-ハスミ" = "……はい？#n爆弾、ですか……？"
"10046020-52-ハスミ" = "いえ、待ってください。温泉開発……？#n聞き覚えが……。"
"10046020-58-ハスミ" = "温泉開発部！！#nゲヘナのテロリスト集団ではありませんか！！"
"10046020-59-ハスミ" = "こんな日にまで厄介ごとを……！#nやはりゲヘナ！！ゲヘナは許しません！"
"10046020-60-ハスミ" = "先生、手出しは無用です……っ！#nえ……？"
"10046020-61-ハスミ" = "落ち着いて話し合いを……？"
"10046020-66-ハスミ" = "落ち着いてなどいられるものですか！ゲヘナはゲヘナです！"
"10046020-67-ハスミ" = "それともまさか、何か他の目的があるかもしれないと。#n先生はそうおっしゃりたいのですか！？"
"10046020-68" = "[ns5] \"いや、そこは聞いてみないことには……！\"\n[ns6] \"まだどっちか分からないでしょ……？\""
"10046020-71-ハスミ" = "そもそもここは私有地です！#n勝手に立ち入っているのですから、不法侵入じゃないですか！！"
"10046020-72-ハスミ" = "しかも爆弾まで設置して……！！"
"10046020-73-ハスミ" = "作業を直ちにやめ、ここから立ち去りなさい。#nこれは正義実現委員会からの正式な勧告です！！"
"10046020-78-メグ" = "なんで……？#nどうせ崩れるんだし、温泉にしちゃおうよ！"
"10046020-79-ハスミ" = "なぜ崩れるのが前提なんですか！"
"10046020-80-メグ" = "だって、「確実に崩れる」って部長が言ってたよ？"
"10046020-81-ハスミ" = "……それはどういう？"
"10046020-82-ハスミ" = "いえ。相手は言葉が通じないテロリスト！#n議論しようと思ったのが間違いでした！"
"10046020-83" = "[s7] \"ハスミ、一度冷静になろう……。\"\n[s8] \"まだ話の続きがあるみたいだし……。\""
"10046020-93-ハスミ" = "まずは手を止めなさい！なぜ平然と作業を続けているんですか！！#n致し方ありません。こうなれば力ずくで……。"
"10046020-97-メグ" = "……え？ちょ、ちょっとダメだよ！#nこれは必ず設置しろ、って部長に言われてるんだから！"
"10046020-98-ハスミ" = "ですからここは私有地で――なぜ話が通じないのですか！！"
"10046020-103-ハスミ" = "な、なんですか、この力は……！"
"10046020-115-ハスミ" = "くっ……なぁっ！？"
"10046020-116" = "[s9] \"ハスミを投げた！？\"\n[s10] \"あれは……パワースラム！？\""
"10046020-127-ハスミ" = "けほっ、けほっ……！#nまったく……無茶苦茶ですよ！"
"10046020-128-ハスミ" = "誰かに放り投げられたのは初めてです……！！"
"10046020-129-メグ" = "これだけ！この爆弾だけだから！設置するまで待っててよ！"
"10046020-130-ハスミ" = "だからそれをするなと言っているんです！#nどうしてこんな簡単なことも伝わらないのですか！！"
"10046020-131" = "[s11] \"ハスミとメグは……。\"\n[s12] \"相性が悪いのかも……。\""
"10046020-134" = "[ns13] \"私が説得してみるよ。\"\n[ns14] \"できるかどうかは、分からないけど……。\""
"10046020-137-ハスミ" = "いえ、先生。#nここは……私に任せてください。"
"10046020-138-ハスミ" = "このままでは正義実現委員会の名折れ……。#nこれは私のプライドの問題です！"
"10046020-139-ハスミ" = "いくら素手とはいえ、ゲヘナ生に――"
"10046020-140-ハスミ" = "テロリストに後れを取るわけにはいきません！！"
"10046020-144-ハスミ" = "……はい？"
"10046020-145-ハスミ" = "一人で温泉を掘れるほどの怪力……？"
"10046020-146-ハスミ" = "だ――"
"10046020-151-ハスミ" = "だからといってゲヘナには負けられませんっ！！！"
"10046020-152" = "[ns15] \"ですよねー。\"\n[ns16] \"逆鱗に触れてしまったか……。\""
"10046020-157-ハスミ" = "もう油断しません！覚悟してください……！！"
"10046020-158-メグ" = "も～！早く終わらせて帰んなきゃなのに！"
"10046020-159-ハスミ" = "あくまで無視するつもりですか……！"
"10046020-186-イチカ" = "大丈夫っすか？#nなんか変な音が聞こえたっすけど……。"
"10046020-190-イチカ" = "……へ？"
"10046020-200-イチカ" = "えっ……ええっ？？"
"10046020-212-イチカ" = "……げほっ、げほっ！"
"10046020-213-イチカ" = "い、いったい何が……。"
"10046020-218-ハスミ" = "あああああーっ！もう限界です！！"
"10046020-222-イチカ" = "は、ハスミ先輩……？"
"10046020-228-イチカ" = "ひとまず落ち着いて欲しいっす……。"
"10046020-229-イチカ" = "それから、状況の説明を――"
"10046020-236-メグ" = "……あ！やっほー！#nこの前、部長と列車に乗ってたよね？"
"10046020-242-イチカ" = "……。"
"10046020-244-イチカ" = "はあぁぁぁぁぁああああぁっ！？！？"
"10046020-247-イチカ" = "お、温泉開発部！？どうしてここにいるんすか！？"
"10046020-248-イチカ" = "今度は何を……！"
"10046020-249-イチカ" = "いや、聞くだけ無駄っすね。問答無用っす！！"
"10046020-253-イチカ" = "……え、先生？"
"10046020-254-イチカ" = "とりあえず落ち着いてほしい……？"
"10046020-258-イチカ" = "な、何を言ってるんすか！#nまさか、何か他の目的があるかもしれないって言いたいんすか！？"
"10046020-259" = "[s17] \"イチカぁぁぁっ！？\"\n[s18] \"ハスミと同じことを……。\""
"10046020-262-イチカ" = "ヤツらの目的なんて分かり切ってるっす！"
"10046020-263-イチカ" = "……はい？"
"10046020-264-イチカ" = "……話し合い？"
"10046020-269-イチカ" = "……温泉開発部だけは例外っす！#nあの日からそう決めたっす！！"
"10046020-270-ハスミ" = "行きましょう、イチカ！！"
"10046020-274-イチカ" = "私が動きを止めるっす！先輩はその隙をついてください！"
"10046020-279-一同" = "はあああっ！！"
"10046020-294-イチカ" = "……っ！そ、そんな……！"
"10046020-295-メグ" = "あはは！お相撲やってるみたいだね！"
"10046020-297-ハスミ" = "イチカ！この馬鹿力相手に遠慮は無用です！#n倒すことだけを考えてください！"
"10046020-303-イチカ" = "はあああっ！！"
"10046020-316-ミカ" = "ちょ、ちょっと！なになに、何の音！？"
"10046020-324-ミカ" = "……え？"
"10046020-341-ミカ" = "いったた……も～、なに……？"
"10046020-345-ミカ" = "あれ、あの子は……？"
"10046020-351-メグ" = "え～、また増えちゃった……。"
"10046020-352-メグ" = "邪魔者が多い時は、すぐ帰ってこい、だもんね。#nあとちょっとだったのに！"
"10046020-353-ミカ" = "……え？どういうこと……？"
"10046020-354-メグ" = "でも、部長の言ったことだし！"
"10046020-355-メグ" = "よし、撤収ー！"
"10046020-356-ミカ" = "ちょっと話を……あなたは誰……？"
"10046020-357-メグ" = "それじゃ、まったね～！！"
"10046020-363-ミカ" = "あの子……ゲヘナ……？"
"10046020-369-ハスミ" = "待ちなさい！！まだ決着はついていません！！"
"10046020-370-イチカ" = "逃がさないっす！！"
"10046020-375-ミカ" = "わ、わああ！とりあえず落ち着いて！？"
"10046020-377" = "（なんとかして二人を落ち着かせたあと、ミカに事情を説明した）"
"10046020-380-ミカ" = "そんなことがあったんだね……。"
"10046020-381-ハスミ" = "……醜態を晒してしまい、申し訳ございません。"
"10046020-382-ミカ" = "ううん！全然気にしてないよ！#n二人にも色々と事情はあるだろうし！"
"10046020-386-ミカ" = "……え、なに？先生。"
"10046020-387-ミカ" = "私？大丈夫だけど……どうして？"
"10046020-388-ミカ" = "あー、そっか。うん。"
"10046020-389-ミカ" = "あの時……かわいくないところ、見せちゃったもんね……。"
"10046020-390-ミカ" = "でもほら、それはそれとしてさ？#n決めつけはよくないけど、あの子、怪しいコトしてたんでしょ？"
"10046020-391-ミカ" = "しかも、ゲヘナだし……。"
"10046020-392-ミカ" = "うーん……ちょっと、アレだよね？"
"10046020-393-ミカ" = "でも……今はここを片づけるのが先だと思う。"
"10046020-394-ミカ" = "こんなのナギちゃんが見たら、また気にしちゃうかもしれないし。"
"10046020-395-ミカ" = "あの子もどっか行っちゃったし、もう来ないんじゃないかな……？"
"10046020-397-イチカ" = "いえ、そんなわけないっす！！"
"10046020-401-ミカ" = "え！？"
"10046020-402-ハスミ" = "……イチカ？"
"10046020-407-イチカ" = "あいつは温泉開発部……ここに目をつけた以上、必ず戻ってくるっす！"
"10046020-408-イチカ" = "事あるごとに現れて、色んな事が台無しに……。#n全部ごまかし切れるとは限らないんすよ！？"
"10046020-409-イチカ" = "そうなったら、先生にも指揮なり演技なりお願いすることになるっすから……#nすごく迷惑をかけてしまうに決まってるっす！"
"10046020-410-ミカ" = "流石にそこまでは……ね？先生？"
"10046020-411" = "[s19] \"そ、んなことは……ない……。\"\n[s20] \"こともない……かも、しれない……。\""
"10046020-416-ミカ" = "せ、先生まで！？じゃあ、ハスミちゃんは……？"
"10046020-417-ハスミ" = "僭越ながら申し上げますが……。#n相手がゲヘナの時点で「常識」は通じません。"
"10046020-418-ハスミ" = "なにより、イチカのあの断固とした態度。"
"10046020-419-ハスミ" = "正義実現委員会の中で最も柔軟な思考を持つイチカでさえ、これほど言うのです。"
"10046020-420-ハスミ" = "この機を逃せば、さらに邪魔が入ってくるかと思います。"
"10046020-421-ミカ" = "今日だけは、騒ぎを起こしたくないのに……。"
"10046020-422-ミカ" = "分かった。"
"10046020-423-ミカ" = "脅威が残ってたら、二人もちゃんと休めないもんね。"
"10046020-424" = "なら、片づけちゃおっか。"
"10046020-427-ミカ" = "なら、片づけちゃおっか。"
