[translation]
"80000132-1" = "マスターのためにマナチャージ"
"80000132-2" = "（今朝、エリから連絡があり――）"
"80000132-5-エリ" = "マスター！今日、学院に来るんですよね？"
"80000132-6-エリ" = "実はお伝えしたいことがありまして！"
"80000132-7-エリ" = "にゅふふっ！では、秘密の場所でお会いしましょう！"
"80000132-9" = "（……そうしてワイルドハント芸術学院の、空き地へとやってきた）"
"80000132-12-エリ" = "ひと気のない空き地"
"80000132-14-エリ" = "あっ、マスター！#n早かったですね！"
"80000132-15" = "[s] \"こんな場所に呼んで、どうしたの？\""
"80000132-16-エリ" = "……ここなら、マナの共鳴を最大化できますから。"
"80000132-17-エリ" = "人がいる場所では、その……魔力が干渉してしまいますし……。"
"80000132-18" = "[s] \"……？二人きりで会いたかったってこと？\""
"80000132-19-エリ" = "そ、そうです！"
"80000132-20-エリ" = "流石はマスター、鋭いですね。"
"80000132-21-エリ" = "というわけで、二人っきりですし……！"
"80000132-22-エリ" = "……脱いでも、良いですよね？"
"80000132-23" = "[s] \"……んん！？\" "
"80000132-24-エリ" = "私の覚悟、マスターに見てほしいんです。"
"80000132-25-エリ" = "……ええいっ！！！"
"80000132-30-エリ" = "ひゃあぁぁっ……！"
"80000132-39-エリ" = "い、いくらマスターのためとはいえ、外でだなんて……や、やっぱり恥ずかしいですね。"
"80000132-40" = "[s] \"……え？\""
"80000132-41-エリ" = "す、すみません、変ですよね！分かってはいるのですが……！"
"80000132-42-エリ" = "私にとっては、裸になるのとあまり変わらないので……。"
"80000132-43-エリ" = "オカ研のみんなの前で練習した時は、平気だったんですけど……。"
"80000132-44" = "[s] \"み、みんなの前なら恥ずかしくないの？\""
"80000132-45-エリ" = "まぁ、一緒にお風呂入ったりしますし……。"
"80000132-46-エリ" = "なので、帽子を取っても別に……。"
"80000132-47-エリ" = "同じこと、と、言いますか……。"
"80000132-48-エリ" = "……！？#nあ、いえ、だからと言ってどうこうという意味ではなく！"
"80000132-49" = "[s] \"む、無理しないで！もう被って大丈夫だよ。\""
"80000132-50-エリ" = "で、ですが私も、覚悟を決めてきたんです……！"
"80000132-51-エリ" = "効率の良いマナ共有には、この格好が最適……。"
"80000132-52-エリ" = "……。"
"80000132-53-エリ" = "だ、大丈夫です、ちゃんとできますので……！"
"80000132-54-エリ" = "ふぅ……。"
"80000132-55-エリ" = "で、では、マスター！"
"80000132-60-エリ" = "私のマナ……たっぷり込めました。"
"80000132-61-エリ" = "今回は帽子に頼らず、自分の力で作ってみたので……。"
"80000132-62-エリ" = "なので、帽子を被ったままでは良くないかもと思い……！"
"80000132-63-エリ" = "……ま、マスター？"
"80000132-64" = "[s] \"すごい、見てるだけで力が湧いてくるチョコだ……！\""
"80000132-65-エリ" = "ほ、本当ですか？"
"80000132-66-エリ" = "で、では、その……。"
"80000132-67-エリ" = "「あーん」をしても、良いでしょうか……！？ "
"80000132-68" = "[s] \"……なるほど、マナチャージだね！\""
"80000132-69-エリ" = "は、はいっ！"
"80000132-70-エリ" = "この理解力……やっぱり、マスターはすごいです！"
"80000132-71-エリ" = "ぼ、帽子無しで近づくのは、覚悟が要りますが……。"
"80000132-72-エリ" = "すぅー……はぁー……#nい、いきますよ？"
"80000132-73" = "[s] \"いつでも！\""
"80000132-74-エリ" = "ではっ……！"
"80000132-75-エリ" = "まずは、星のチョコレートを……！"
"80000132-80-エリ" = "ど、どう……ですか？"
"80000132-85" = "[ns] \"すごい、パチパチ弾けてる！\""
"80000132-86-エリ" = "えへへっ……ポッピングキャンディを入れてみたんです！"
"80000132-87-エリ" = "眠い時に食べると、目がパッチリするはずです！"
"80000132-88" = "[s] \"ハートのチョコは何の味？\""
"80000132-89-エリ" = "それは……食べてからのお楽しみ、です。"
"80000132-90-エリ" = "で、ではどうぞ……！"
"80000132-94" = "[ns] \"こ、これは……！？\""
"80000132-95" = "（甘くて……ちょっとだけ、酸味がある？）"
"80000132-96" = "（まるで、マナが回復していくかのような感覚……！）"
"80000132-97-エリ" = "ど、どうでしょうか？"
"80000132-98-エリ" = "色々とビタミンを入れてみました。"
"80000132-99-エリ" = "チョコでもあり、栄養剤でもあるわけです。"
"80000132-100-エリ" = "……マスターは、いつも忙しいですから。"
"80000132-101-エリ" = "食事すら取れずに、遅くまで仕事する日も多いと聞き……。"
"80000132-102-エリ" = "うぅ、考えるだけで何だか悲しく……。"
"80000132-103-エリ" = "なのでそういう夜には……#n私のことを思い出しながら、このチョコを食べてください！"
"80000132-104-エリ" = "きっと、マナが湧き出るはずですから！"
"80000132-105" = "[s1] \"エリの気持ちが染みていく……。\"\n[s2] \"今すぐ全部食べたい！\""
"80000132-108-エリ" = "た、食べ過ぎはダメですよ！？"
"80000132-109-エリ" = "マナの補給も、過剰になると良くないですから。"
"80000132-110" = "[ns] \"確かに、気をつけるね。\""
"80000132-112" = "[ns] \"エリも一緒に食べない？\""
"80000132-115-エリ" = "ま、マスターからの逆マナ供給……！？"
"80000132-116-エリ" = "確かに相互チャージをすれば、結果として倍以上の効果があるはず！"
"80000132-117-エリ" = "では……お願いします、マスター！"
"80000132-119" = "（その後もエリと一緒に、魔力に満ちた時間を過ごした）"
