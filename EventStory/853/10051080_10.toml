[translation]
"10051080-1" = "第8話;それぞれの場所で"
"10051080-2" = "写真集撮影現場"
"10051080-4-ツクヨ" = "（ひぇぇ……いつぶりの休憩でしょうか……）"
"10051080-5-ツクヨ" = "（疲れました……）"
"10051080-6-ツクヨ" = "（撮影……終わりが見えません……）"
"10051080-7-ツクヨ" = "（照明は肌を刺すように強いし……靴は綺麗だけど、ずっと履いてると足が痛くて……）"
"10051080-8-ツクヨ" = "（なによりこのメイク……厚塗りすぎて肌が苦しい……）"
"10051080-9-ツクヨ" = "（私は……いつになったら戻れるんでしょうか……？）"
"10051080-17-シャインキャット" = "調子はどうかな？"
"10051080-18-ツクヨ" = "はい！？"
"10051080-19-シャインキャット" = "……うん、順調そうでなによりだ。"
"10051080-20-ツクヨ" = "えっ？いや、その……本当に、うまくできてるんでしょうか……？"
"10051080-21-ツクヨ" = "私は言われたとおりにしてるだけで……。"
"10051080-22-シャインキャット" = "ついていけてるなら、それで十分だ。"
"10051080-23-ツクヨ" = "ついていけてる、なら……。"
"10051080-24-ツクヨ" = "あの、でも……。"
"10051080-25-シャインキャット" = "うん？"
"10051080-26-ツクヨ" = "その……もう、帰っても……いいですか？"
"10051080-27-シャインキャット" = "帰る？どこに？"
"10051080-28-シャインキャット" = "……あの忍者部か何かっていうところ？"
"10051080-29-ツクヨ" = "はい、忍術研究部です……。"
"10051080-30-シャインキャット" = "つまり、元いた場所に戻りたいってことかな？"
"10051080-31-シャインキャット" = "逆に聞きたいんだけど、君はそこでどういう存在だったの？"
"10051080-32-ツクヨ" = "え……？"
"10051080-33-シャインキャット" = "そこで君は、どんな存在だった？どんな価値があった？何を与えられていた？"
"10051080-34-ツクヨ" = "そ、それは……。"
"10051080-38-シャインキャット" = "これを見て。今日、君を撮った写真だ。"
"10051080-39-ツクヨ" = "……！"
"10051080-40-シャインキャット" = "どうかな。美的センスがなくても、誰もが口を揃えて言うはずだ。"
"10051080-41-シャインキャット" = "――美しい、って。"
"10051080-42-ツクヨ" = "……。"
"10051080-43-シャインキャット" = "ツクヨ。君は私たちにとって最高のモデルだ。"
"10051080-44-シャインキャット" = "そしてそれこそが、君がここにいるべき理由。#n君の本当の価値は、この場所でこそ輝く。"
"10051080-48-ヘルメット団幹部" = "これは……この服の真の価値を引き出せる場所に移してるだけだ！"
"10051080-51-ツクヨ" = "本当の……価値……。"
"10051080-52-シャインキャット" = "もちろん、選ぶのは君の自由だ。#n「居心地のいい」場所にいるのか、「本当の価値を発揮できる」場所にいるのか。"
"10051080-53-ツクヨ" = "そ、それは……。"
"10051080-54-シャインキャット" = "それに、もう君をメインに据えたファッションショーを企画してるんだ。"
"10051080-55-ツクヨ" = "ええっ！？"
"10051080-56-シャインキャット" = "場所は百鬼夜行自治区。新年を記念したショーの予定だ。"
"10051080-57-ツクヨ" = "そ、そんな大きなイベントに……私が……？"
"10051080-58-シャインキャット" = "当然さ。君以上にふさわしいモデルなんていない。"
"10051080-59-シャインキャット" = "とにかく覚えておいてくれ。その想定でスケジュールを進めるから。"
"10051080-63-ツクヨ" = "あ、あのっ、えっと、その……！"
"10051080-70-マネージャー" = "シャインキャット様、お食事が到着しました。"
"10051080-71-シャインキャット" = "……やっと来たの？どうしてこんなに遅いわけ？"
"10051080-72-マネージャー" = "申し訳ありません。配達の途中で、魑魅一座の襲撃を受けたとのことでして……。"
"10051080-73-シャインキャット" = "まったく、最近の不良生徒たちは……。"
"10051080-74-シャインキャット" = "でも……何だろうね。最近やけに私への出前だけ襲撃されてる気がしない？"
"10051080-75-マネージャー" = "ええ、何か恣意的なものを感じる頻度ではあります……。"
"10051080-76-シャインキャット" = "まあいいか。私が神経質になってるだけかもしれないし。"
"10051080-77-シャインキャット" = "それで、今日のメニューは？"
"10051080-78-マネージャー" = "ラーメンとチャーハン、餃子です。"
"10051080-79-シャインキャット" = "いいね。苦労した後は、しっかり腹ごしらえしないと。行くよ。"
"10051080-85-シャインキャット" = "ツクヨ。君の食事は隣の部屋に用意してあるからね。"
"10051080-86-ツクヨ" = "え……？"
"10051080-87-シャインキャット" = "そんなに驚かないでくれ。#n君ももうモデルなんだから、食事制限は当たり前だよ。"
"10051080-88-シャインキャット" = "ゼロカロリーのこんにゃく麺とサラダを用意してあるから、それを食べなさい。#n私たちにはついてこなくていい。"
"10051080-89-ツクヨ" = "えっ！？#nさっきは、「ついてこれてるなら問題ない」って、言ったじゃないですか……！"
"10051080-90-シャインキャット" = "こんな時までついて来いとは言ってないだろう！？"
"10051080-91-シャインキャット" = "それじゃ、ごゆっくり。"
"10051080-92-シャインキャット" = "で、何ラーメンを取ってあるのかな？"
"10051080-93-マネージャー" = "いつも通りのものを。細麺で、脂抜き、辛さ控えめでご用意しました。"
"10051080-94-シャインキャット" = "完璧だ。"
"10051080-95-ツクヨ" = "ま、待ってください！？"
"10051080-100" = "写真集撮影現場"
"10051080-101-ツクヨ" = "うぅぅ……。"
"10051080-102-ツクヨ" = "ひどすぎます……。#n夕飯がこんにゃく麺とサラダだけなんて……。"
"10051080-103-ツクヨ" = "自分たちはラーメンにチャーハン、餃子まで食べてるのに……。"
"10051080-104-ツクヨ" = "しかも……没収したスマホ、返してくれないですし……。"
"10051080-105-ツクヨ" = "……。"
"10051080-106-ツクヨ" = "ラーメン……食べたい……。"
"10051080-107-ツクヨ" = "部長と……イズナちゃんと……先生と、一緒に……。"
"10051080-108-ツクヨ" = "麺は極太麺で、背脂をトッピングして、最後にラー油で仕上げて……。"
"10051080-109-ツクヨ" = "忍者にとってのラーメンは、そういうものだから……。"
"10051080-110-ツクヨ" = "……。"
"10051080-116-ツクヨ" = "モデル……それとも忍者……。"
"10051080-117-ツクヨ" = "本当に私は……モデルの方が向いてるのかな……？"
"10051080-118-ツクヨ" = "モデルになる方が、「価値ある人」になれる、のかな……？"
"10051080-119-ツクヨ" = "私って……忍術研究部だと、価値のない存在……だったのかな……？"
"10051080-121-ツクヨ" = "うぅ……わからない……。"
"10051080-122-ツクヨ" = "誰か……答えを教えてください……。"
"10051080-124" = "百鬼夜行某所のラーメン屋"
"10051080-126" = "（数時間後、撮影終わりに、ミチルとイズナと一緒にラーメン屋を訪れた）"
"10051080-130-ミチル" = "すうぅ……この芳醇な豚骨の香り……。"
"10051080-131-ミチル" = "やっぱり、撮影のあとはラーメンに限るよね。"
"10051080-132-イズナ" = "イズナもそう思います！ニンニン！"
"10051080-133" = "[s] \"今日は私が奢るから、気にせず食べていいよ。\""
"10051080-134-ミチル" = "本当！？ふふ、それなら、いつもよりちょっと贅沢しちゃおうかな！"
"10051080-135-ミチル" = "店長、注文お願い！"
"10051080-136-店長" = "はいっ、何にしましょう？"
"10051080-137-ミチル" = "ラーメン4つと、餃子を1皿。"
"10051080-138-ミチル" = "ラーメンのトッピングは――"
"10051080-139-店長" = "極太麺に、背脂トッピング、仕上げにラー油。で、よろしいですね？"
"10051080-140-ミチル" = "えっ、なんで知ってるの！？"
"10051080-141-店長" = "ははっ！忍者の皆さんは毎回それを頼まれてますからね！"
"10051080-142-店長" = "この前、迷惑な客を追い払ってくれたでしょう？#nそのお礼もかねて、「忍者定食」として新メニューにしたんですよ！"
"10051080-143-店長" = "これからは「忍者定食」って注文してもらえれば大丈夫ですからね！"
"10051080-145-ミチル" = "な、なんと……！"
"10051080-146-ミチル" = "ついに世界が、忍者を認め始めたということなのか……！"
"10051080-147-店長" = "ところで、いつも一緒に来てたもう1人の方は遅れていらっしゃるんですか？#n姿が見えませんが……。"
"10051080-148-ミチル" = "え？何のこと――"
"10051080-149-ミチル" = "あっ、そうだった……今、ツクヨはいないんだった……。"
"10051080-150-イズナ" = "店長さん！ラーメンは4つじゃなくて3つに変更でお願いします！"
"10051080-152-店長" = "はいっ、かしこまりました！"
"10051080-157-ミチル" = "なんか、自然とツクヨの分まで注文しちゃってたね……。"
"10051080-158-イズナ" = "イズナも気がつきませんでした……。"
"10051080-159-ミチル" = "ツクヨに、会いたいな……。"
"10051080-160-イズナ" = "あっ！そういえば！"
"10051080-161-イズナ" = "部長！これ、見ましたか？"
"10051080-162-ミチル" = "ん？何を？"
"10051080-163-イズナ" = "さっき、ツクヨ殿の動画がアップされたんです！"
"10051080-164-ミチル" = "……！"
"10051080-165-ミチル" = "一緒に見よう！"
"10051080-166-イズナ" = "はい！"
"10051080-171" = "（そうしてミチルとイズナは、しばらくの間ツクヨの動画を見続けた）"
"10051080-173-ミチル" = "……。"
"10051080-174-ミチル" = "すごいね……。#nツクヨにこんな大胆な一面があったなんて。"
"10051080-175-ミチル" = "しかも、この動画の再生数……。"
"10051080-179-ミチル" = "え、ちょっと待って？#nこの再生数、本当に合ってる！？"
"10051080-180-ミチル" = "私、見間違えてないよね？"
"10051080-181-ミチル" = "アップされてまだ数分なのに、もうこんなに回ってるってこと！？"
"10051080-182-イズナ" = "この動画だけで、私たちのチャンネルの総再生数を超えてます……。"
"10051080-183-ミチル" = "……。"
"10051080-184-イズナ" = "まるで……別の世界の出来事みたいです……。"
"10051080-185-ミチル" = "別の世界、か……。"
"10051080-192-ミチル" = "……。"
"10051080-193-ミチル" = "ねえ、イズナ。"
"10051080-194-イズナ" = "なんでしょうか？"
"10051080-195-ミチル" = "ツクヨは……もう戻ってくる気……ないのかな……？"
"10051080-196-イズナ" = "はい！？"
"10051080-197-店長" = "はい、お待たせしました！"
"10051080-198-店長" = "それでは、ごゆっくりお召し上がりください！"
"10051080-202-ミチル" = "待ってました、「忍者定食」……！"
"10051080-203-イズナ" = "あの、部長……さっきのって……。"
"10051080-204-ミチル" = "とりあえず、食べよっか！#nあれは……気にしないで！"
"10051080-206-ミチル" = "いただきます！"
"10051080-207-イズナ" = "はい……い、いただきます！"
"10051080-209" = "（その後は特別なこともなく、ラーメンを食べて解散した）"
"10051080-210" = "（けれど、数日後……）"
"10051080-217-イズナ" = "あっ、主殿……！"
"10051080-218" = "[s] \"どうしたの？\""
"10051080-219-イズナ" = "あの……その……。"
"10051080-220-イズナ" = "部長が……部長の様子がおかしいんです……！"
