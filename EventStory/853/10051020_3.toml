[translation]
"10051020-1" = "第2話;依頼の条件"
"10051020-2" = "百鬼夜行・第38旧校舎のとある教室"
"10051020-3-ミチル" = "……と、いうわけで。#n護衛を任されることになったよ！"
"10051020-4-イズナ" = "おおおっ！"
"10051020-5-イズナ" = "さすがです、部長……！"
"10051020-6-ツクヨ" = "ご、護衛……。"
"10051020-7-ツクヨ" = "足を引っ張らないよう、私も頑張ります……！"
"10051020-8-ミチル" = "あ、あれ……？"
"10051020-9-ミチル" = "面倒なことを持ってきたって、怒られるかと思ってたんだけど……。"
"10051020-10-イズナ" = "まさか！"
"10051020-11-イズナ" = "これは、名高い御仁の護衛を通じて、忍術研究部の名を世に広める好機……！"
"10051020-12-イズナ" = "断る理由など、1つもございません！"
"10051020-13-ツクヨ" = "わ、私もそう思います……！"
"10051020-14-ミチル" = "ツクヨ……イズナ……。#nそれじゃあさ、ちょっと聞きたいんだけど……。"
"10051020-15-ミチル" = "2人はシャインキャットって知ってる？"
"10051020-16-イズナ" = "初めて聞きました！"
"10051020-17-ミチル" = "返事早っ！？"
"10051020-18-ミチル" = "え、じゃあ、知らないのになんで有名って分かったの？"
"10051020-19-イズナ" = "説明の中で部長が言っていたからです！"
"10051020-20-ミチル" = "あ、そっか。"
"10051020-21-ミチル" = "まぁ私も、ニヤから聞いて初めて知ったんだけど……。"
"10051020-23-ツクヨ" = "あ、あの……。"
"10051020-24-ツクヨ" = "私、知ってます……。"
"10051020-25-ミチル" = "おぉ……！"
"10051020-26-ツクヨ" = "古典美の現代的再解釈を斬新な様式で確立し――"
"10051020-27-ツクヨ" = "ふ、ファッション界のパラダイムを覆した方です……！"
"10051020-28-ツクヨ" = "だから、現存する全てのデザイナーのロールモデルとまで言われていて……。"
"10051020-29-ミチル" = "なんか詳しい……！"
"10051020-30-ツクヨ" = "そう、ですか……？"
"10051020-31-ミチル" = "ま、とにかく！賛成してくれてありがとう！"
"10051020-32-ミチル" = "だが！"
"10051020-33-ミチル" = "忍者とはプロ！プロとは、報酬なくして動かぬもの！"
"10051020-34-ミチル" = "ということで……じゃじゃーん！"
"10051020-35-ミチル" = "報酬の前払いとして、カメラをもらってきたよ！"
"10051020-36-ミチル" = "これで「少女忍法帖ミチルっち」の撮影を再開できるね！"
"10051020-37-イズナ" = "おおおっ！"
"10051020-38-ツクヨ" = "すごい、です……！"
"10051020-39-ツクヨ" = "これ、今までのものより、ずっと高性能です……！"
"10051020-40-ツクヨ" = "このカメラなら、もっと鮮明に部長の忍法を映せます！"
"10051020-41-イズナ" = "それに、防水機能付きです！"
"10051020-42-ツクヨ" = "ほ、本当ですね……！"
"10051020-43-イズナ" = "ということは……沸騰したラーメンのスープの中でも撮影できそうです！"
"10051020-44-ミチル" = "ふふ、喜んでもらえて何よりだよ。"
"10051020-45-ミチル" = "でも、忍者とは「忍」ぶ者……！"
"10051020-46-ミチル" = "だからこそ、喜びはひとまず脇に置いて――#n任務を完遂するためのブリーフィングを始める！"
"10051020-47-イズナ" = "はいっ！"
"10051020-48-ツクヨ" = "部長……！"
"10051020-49-ミチル" = "まずは、陰陽部から預かったものを見てみよう！"
"10051020-54-ツクヨ" = "スーツケース、ですか……？"
"10051020-55-イズナ" = "イズナ、ワクワクしてきました！"
"10051020-56-イズナ" = "中には一体何が……。"
"10051020-57-イズナ" = "もしかして、忍法が記された巻物ですか！？"
"10051020-58-ミチル" = "これに入っているのは、今回の任務の必須アイテム！"
"10051020-59-ミチル" = "それは――"
"10051020-61-ミチル" = "――ドレスだよ！"
"10051020-62-イズナ" = "ドレス……？"
"10051020-63-ツクヨ" = "ドレス……ですか……？"
"10051020-69-イズナ" = "おおっ！こんな華やかな衣装、初めて見ました！"
"10051020-70-ツクヨ" = "本当に綺麗……。"
"10051020-71-ツクヨ" = "わ、私の大きな身体には全然似合わないですけど……。"
"10051020-72-ミチル" = "えっと……まぁ、服自体は気に入ってくれたみたいでよかった。"
"10051020-73-ミチル" = "というのも、これ、私たちが着るんだよね。"
"10051020-77-イズナ＆ツクヨ" = "えええぇぇぇっ！？"
"10051020-78-イズナ" = "この服装だと動きにくいのではないでしょうか！？"
"10051020-79-ツクヨ" = "ま、まさか……。"
"10051020-80-ツクヨ" = "私たち……ファッションショーのステージに、立つんですか……？"
"10051020-81-ツクヨ" = "そ、それが忍の道だと、部長が仰るなら……。"
"10051020-82-ツクヨ" = "が、頑張り、ます……！"
"10051020-83-ミチル" = "いやいや！私たちの任務はあくまで護衛！"
"10051020-84-ミチル" = "会場の観衆に紛れ込んで、不審な動きがあれば真っ先に制圧するのが今回の仕事！"
"10051020-85-ミチル" = "でもそのためには、会場内を自由に動けなきゃいけないでしょ？"
"10051020-86-ツクヨ" = "そう、ですね……？"
"10051020-87-ミチル" = "で、こういうフォーマルな格好じゃないと入れない場所もあるらしいんだよ。"
"10051020-88-ミチル" = "例えば……ほら、えっと……偉い人たちが集まる……なんだっけ……。"
"10051020-89-ツクヨ" = "え、宴会場でしょうか？"
"10051020-90-ミチル" = "それ！宴会場！"
"10051020-91-ツクヨ" = "ど、ドレスコードがあるんですね……。"
"10051020-92-ミチル" = "うん。だから、陰陽部が衣装を用意してくれたってわけ。"
"10051020-93-ツクヨ" = "でも、イズナちゃんも言ってた、みたいに……。"
"10051020-94-ツクヨ" = "動きにくくないですか……？#n柔軟性や俊敏性は、忍者にとって基本中の基本、なのに……。"
"10051020-95-ツクヨ" = "そ、それに、私には全然合わないような……！"
"10051020-96-ツクヨ" = "着れたとしても……少し動いたら、服が破けてしまうかも……！"
"10051020-97-イズナ" = "でしたら、みんなで試着してみましょう！"
"10051020-98-ミチル" = "え？"
"10051020-99-ツクヨ" = "……！"
"10051020-100-イズナ" = "部長、いつも言っていましたよね。"
"10051020-101-イズナ" = "「忍者とはどんな窮地でも、決して諦めないもの」……と！"
"10051020-102-イズナ" = "だからこそ、こんなことで挫けるわけにはいきません！"
"10051020-103-イズナ" = "試着して慣れておけば――"
"10051020-104-イズナ" = "本番は楽に動けるはずです！"
"10051020-105-ミチル" = "……たしかに、今のうちに慣れておけばやりやすくなるね。"
"10051020-106-ミチル" = "それに忍者とは、どんな状況にも自然と溶け込める者……！"
"10051020-107-ミチル" = "ドレスなんかで挫けちゃいられない！"
"10051020-108-イズナ" = "その通りです！ニンニン！"
"10051020-109-イズナ" = "ではイズナ、1番に試着させていただきます！"
"10051020-112-イズナ" = "私のドレスはこれですか？"
"10051020-113-ミチル" = "うん、それがイズナの分。で、こっちがツクヨの……。"
"10051020-114-ツクヨ" = "ひ、ひぇええ……！"
"10051020-116-イズナ" = "ドレス姿のイズナ、参上です！"
"10051020-122-ミチル" = "おおっ……！"
"10051020-123-ツクヨ" = "わあ……！"
"10051020-124-ミチル" = "なになに、似合ってるじゃん！"
"10051020-125-ツクヨ" = "き、綺麗です……！"
"10051020-126-イズナ" = "そ、そうですか？えへへっ。"
"10051020-127-イズナ" = "こんなに褒めていただけるだなんて思いませんでした……！"
"10051020-128-ミチル" = "動きにくくない？"
"10051020-129-イズナ" = "ところどころ締めつけはありますが……。"
"10051020-130-イズナ" = "慣れれば問題ありません！"
"10051020-131-イズナ" = "それより、こんなに綺麗で華やかな服を着るのは初めてで……。"
"10051020-133-イズナ" = "イズナ、とってもドキドキしています！"
"10051020-134-ミチル" = "おおっ、いいね、いい感じ！"
"10051020-135-ミチル" = "よし、それじゃあ……。"
"10051020-136-ミチル" = "次はツク――"
"10051020-137-ツクヨ" = "ぶ、部長！お先に、どうぞ……！"
"10051020-138-ツクヨ" = "きっと、よく似合うと思います！"
"10051020-139-ミチル" = "え、そ、そうかな？"
"10051020-140-ミチル" = "じゃあ、えっと……これが私ので……。"
"10051020-142-ミチル" = "これを……ここに通せばいいのかな……？"
"10051020-143-イズナ" = "上下が逆です！"
"10051020-144-ミチル" = "嘘っ！？"
"10051020-145-ミチル" = "これ、着方が複雑すぎるよ……！"
"10051020-146-ツクヨ" = "こ、ここから順番に着ていくと……。"
"10051020-147-ツクヨ" = "それから、ここをしっかり締めれば――"
"10051020-148-ミチル" = "おお……！"
"10051020-149-イズナ" = "部長！髪をおろしてみませんか？"
"10051020-150-イズナ" = "そのほうが似合いそうです！"
"10051020-151-ミチル" = "髪型まで変えるの！？"
"10051020-152-ミチル" = "べ、別にそこまでしなくても……。"
"10051020-153-ツクヨ" = "た、試しにやってみませんか……？"
"10051020-154-ツクヨ" = "た、たまたまヘアアイロンを持ってますので……！"
"10051020-155-ミチル" = "そんなの持ってたの……！？"
"10051020-157-ミチル" = "ど、どうかな……？"
"10051020-158-イズナ" = "おおっ！全然雰囲気が違います！"
"10051020-159-ツクヨ" = "清楚で、少女みたいで……。"
"10051020-160-ツクヨ" = "忍者の可能性って、無限大なんですね……！"
"10051020-161-ミチル" = "そ、そんなに持ち上げないでよ……！"
"10051020-162-ミチル" = "ちょっと恥ずかしいんだから……！"
"10051020-163-ミチル" = "そ、それに……正直、こういう服はツクヨの方が一番似合う気がするし……！"
"10051020-164-ツクヨ" = "え、ええっ！？"
"10051020-165-イズナ" = "その通りです！"
"10051020-166-イズナ" = "ツクヨ殿も早く着てみましょう！"
"10051020-167-ツクヨ" = "ひ、ひぇえ……！"
"10051020-168-ツクヨ" = "そ、それなら……私も……。"
"10051020-172-ツクヨ" = "あの……これ、本当に私のサイズなんでしょうか……？"
"10051020-173-ツクヨ" = "全然……入らなくて……。"
"10051020-174-ミチル" = "最初はちょっときつく感じるから大丈夫だよ。"
"10051020-175-ツクヨ" = "ううぅ……！"
"10051020-176-ツクヨ" = "それにこれ、裾が短すぎませんか……？"
"10051020-177-ミチル" = "これくらいなら十分長いんじゃない？"
"10051020-178-ツクヨ" = "そう、ですか……？#nや、やっぱり、私が大きすぎるだけ……でしょうか……。"
"10051020-179-ツクヨ" = "私なんて、ただ大きいだけですから……。"
"10051020-180-ツクヨ" = "ちゃんと着られる服すら、なくなってきてて……！"
"10051020-181-ツクヨ" = "うぅっ……！"
"10051020-182-イズナ" = "そんなことありません！あと少しです！"
"10051020-183-ツクヨ" = "で、でも……！"
"10051020-184-ツクヨ" = "こ、こんなに無理やり押し込んだら……！"
"10051020-188" = "ビリィィィィッ！"
"10051020-191-ミチル" = "あっ……。"
"10051020-192-イズナ" = "ドレスが破れて……！"
"10051020-193-ツクヨ" = "ぼ、ボタンも全部、飛んで……！"
"10051020-194-ツクヨ" = "うぅっ……。"
"10051020-195-ツクヨ" = "やっぱり、私にはこんな綺麗な服は着られないんです……。"
"10051020-196-ツクヨ" = "大きいだけで、可愛くもなくて……。"
"10051020-197-ミチル" = "そ、そんなことないよ！#nでも……ごめん、無理やり着せようとしちゃって……！"
"10051020-198-イズナ" = "ツクヨ殿、大丈夫ですか？"
"10051020-199-ツクヨ" = "私は平気、ですけど……。"
"10051020-200-ツクヨ" = "こ、この服って、陰陽部から借りたもの、ですよね……？"
"10051020-201-ツクヨ" = "こ、このせいで陰陽部に怒られたり……。"
"10051020-202-ツクヨ" = "か、カメラを取り上げられたりしたら……。"
"10051020-203-ツクヨ" = "「少女忍法帖ミチルっち」の撮影ができなくなって――"
"10051020-204" = "[s] \"大丈夫だよ。破れた服は直せばいいから。\""
"10051020-205-ミチル" = "そうそう、修繕して返せばOKだって。"
"10051020-206-ミチル" = "きっとこれくらいなら綺麗に直せるよ！"
"10051020-207-ミチル" = "だからあんまり深刻に――"
"10051020-211-ミチル" = "――先生殿！？なんでここに！？"
"10051020-212" = "[s] \"近くに用事があったから、寄ってみた。\""
"10051020-213-ミチル" = "来た理由は置いとくとして……。"
"10051020-214-ミチル" = "……いつからそこにいたの！？！？"
"10051020-215-ツクヨ" = "せ、先生……！？"
"10051020-216-イズナ" = "主殿……！？"
"10051020-217-ミチル" = "もしかして……着替え中も……？"
"10051020-222-ミチル" = "にっ――忍法！「曲者退治の術」！！"
"10051020-223" = "[s] \"ちょ、ちょっと待って……！\""
