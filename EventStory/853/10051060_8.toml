[translation]
"10051060-1" = "第6話;高まる名声"
"10051060-2" = "どこかの裏路地"
"10051060-3-ヒヨリ" = "えへへ……ついに手に入れました！"
"10051060-4-ヒヨリ" = "ファッション雑誌「BiBi」と「ron-ro」の最新号……！"
"10051060-5-ヒヨリ" = "古紙や薬きょうを集めて売って、ご飯は全部コンビニの廃棄弁当でしのいで、水道水だけで喉を潤して……がんばってお金を貯めた甲斐がありました。"
"10051060-6-ミサキ" = "……半分は先生が出してくれたんじゃなかったっけ？"
"10051060-7-ヒヨリ" = "で、でも半分は私が払いました！先生も褒めてくれたんですよ！"
"10051060-8-ヒヨリ" = "それより、見てください！#n「BiBi」の今月号は、シャインキャットさんの特集記事が載ってるんです！"
"10051060-9-ヒヨリ" = "キヴォトスのファッション界に革命を起こした、天才デザイナーですよ！"
"10051060-10-ヒヨリ" = "えっと……百鬼夜行でのファッションショーを手がけたみたいですね。"
"10051060-11-ヒヨリ" = "わあ……。"
"10051060-12-ヒヨリ" = "素敵な服がたくさん……。"
"10051060-13-ヒヨリ" = "ファッションモデルになったら、こういう服を好きなだけ着られるんでしょうか？"
"10051060-14-ヒヨリ" = "もちろん、私みたいな身長じゃ……モデルなんて夢のまた夢ですけど……。"
"10051060-15-ミサキ" = "うーん……そういう需要もあるんじゃない？"
"10051060-16-ヒヨリ" = "えぇっ！？そ、そうなんですか！？"
"10051060-17-ミサキ" = "まぁ、背は高い方がモデルとしてプラスになるんだろうけど。"
"10051060-18-ミサキ" = "この「ron-ro」の特集記事に出てる「[ruby=おおの]大野[/ruby]ツクヨ」って新人モデルも、身長180cmだって。"
"10051060-19-ミサキ" = "しかも関係者も大絶賛。"
"10051060-20-ヒヨリ" = "あ、「BiBi」にも載ってます！#nモデル界に彗星のごとく現れた新人で、ものすごく注目されてるって……。"
"10051060-21-ヒヨリ" = "評論家のコメントもすごいです。#n「未熟さを遥かに凌駕する才能を持つ」とか、「限りなく宝石に近い原石」とか……。"
"10051060-22-ヒヨリ" = "才能を持っている方は……きっと幸せなんでしょうね……。"
"10051060-23-？？？" = "必ずしもそうとは限らないよ。"
"10051060-28-アツコ" = "華やかさの裏には、地道な努力があるんだよ。"
"10051060-29-アツコ" = "綺麗な花を咲かせるために、手入れの積み重ねが必要なのと同じでね。"
"10051060-30-ヒヨリ" = "アツコちゃん……。"
"10051060-31-アツコ" = "ところでさ、2人とも。"
"10051060-32-アツコ" = "私が育ててたハーブの葉っぱが無くなってるんだけど、何か知ってる？"
"10051060-37-アツコ" = "傷んだ肉にハーブで下味をつける……みたいな話をしてた気がするんだけど……。"
"10051060-43-アツコ" = "……えっ、あれ！？"
"10051060-45" = "トリニティ総合学園広場"
"10051060-48-トリニティの生徒A" = "今月の「ハートガールズ」、もうお読みになって？"
"10051060-49-トリニティの生徒B" = "もちろんですわ。"
"10051060-50-トリニティの生徒B" = "最近はライフスタイルに偏っておりましたので、少々物足りませんでしたが……。"
"10051060-51-トリニティの生徒B" = "最新号はファッションテーマに戻っていて嬉しいですの。"
"10051060-52-トリニティの生徒A" = "ええ、評論の深みも増して、ファッションのトレンド分析や業界の話題も濃くなっておりましたわね。"
"10051060-53-トリニティの生徒A" = "それと、今月デビューした新人モデルのレビューも印象的でしたわ。"
"10051060-54-トリニティの生徒B" = "百鬼夜行出身のモデルのことですわね？名前は確か――"
"10051060-55-トリニティの生徒A" = "大野ツクヨさん、ですわ。"
"10051060-56-トリニティの生徒B" = "そう！グラビアだけでもものすごいオーラでしたし……。"
"10051060-57-トリニティの生徒B" = "業界人も評論家も、口を揃えて絶賛の嵐ですの。"
"10051060-58-トリニティの生徒A" = "今後が楽しみですわね。"
"10051060-64" = "ミレニアムサイエンススクール"
"10051060-68-ミレニアムの生徒A" = "それ、何読んでるの？"
"10051060-69-ミレニアムの生徒A" = "学術誌？"
"10051060-70-ミレニアムの生徒B" = "いっつも学術誌ばっか読んでるわけじゃないって……。"
"10051060-71-ミレニアムの生徒B" = "「ron-ro」の最新号だよ。"
"10051060-72-ミレニアムの生徒B" = "トレンドに遅れないための必読書。"
"10051060-73-ミレニアムの生徒A" = "「ron-ro」？何それ？"
"10051060-74-ミレニアムの生徒B" = "嘘でしょ……？有名なファッション誌だよ？"
"10051060-75-ミレニアムの生徒A" = "ファッション誌か……。"
"10051060-76-ミレニアムの生徒A" = "服なんて、制服のサイズを測った時以外は、気にしたことなかったな……。"
"10051060-77-ミレニアムの生徒A" = "論文読むので精一杯で、他の文字は入らないし。"
"10051060-78-ミレニアムの生徒B" = "う、うん……まあ、そういう子もいるよね。"
"10051060-79-ミレニアムの生徒A" = "それで？すごく集中して読んでたけど、何か面白いことでも載ってたの？"
"10051060-80-ミレニアムの生徒B" = "新人モデルについての評論が良い感じ。"
"10051060-81-ミレニアムの生徒B" = "デビューしたばっかでまだキャリアは短いけど、すごく注目されてるみたい。"
"10051060-82-ミレニアムの生徒A" = "えーっと……名前は……ツクヨ？"
"10051060-83-ミレニアムの生徒A" = "おお……たしかに、ただ者じゃなさそうな雰囲気してるね。"
"10051060-89" = "クロノス放送局インタビュールーム"
"10051060-91-シノン" = "ここまで、インタビューへのご協力ありがとうございました！"
"10051060-92-ツクヨ" = "は、はい……こちらこそ、ありがとうございます……。"
"10051060-93-シノン" = "では最後の質問です！#nツクヨさんの今後の目標を、一言で教えていただけますか！"
"10051060-94-ツクヨ" = "え、ええっ！？"
"10051060-95-ツクヨ" = "私、これから……その……。"
"10051060-99-シャインキャット" = "……。"
"10051060-100-ツクヨ" = "そ、その、その……。"
"10051060-102-シノン" = "さあ、ツクヨさん！心の中にあることを、ずずいっと、素直にお話しください！"
"10051060-103-ツクヨ" = "す、素直に……。"
"10051060-104-シャインキャット" = "（ギロッ）"
"10051060-105-ツクヨ" = "あ、あの……これから、か、かっこいいファッションモデルになれるよう、#n頑張り、ます……！"
"10051060-106-シャインキャット" = "（うなずく）"
"10051060-107-シノン" = "はい！不器用ながらも心のこもったお言葉、確かに受け取りました！"
"10051060-108-シノン" = "そんなツクヨさんのこれからの活躍、楽しみにしてます！#nではここで一旦CMです！"
"10051060-114-シャインキャット" = "お疲れさま。初めてのテレビインタビューにしてはよくやったね。"
"10051060-115-ツクヨ" = "あ、あの……これってどういう状況なんでしょうか……。"
"10051060-116-シャインキャット" = "まあ、今の状況をすぐに理解しろって方が無理な話かな。"
"10051060-117-シャインキャット" = "この画面を見て。さっきの生放送を何人が見たか、再生数がどれだけ伸びたか、どんな反応が出ているか……。"
"10051060-118-ツクヨ" = "……！"
"10051060-119-シャインキャット" = "こんな数字、初めて見るのではないか？"
"10051060-120-シャインキャット" = "これは君が生み出した数字。君が引き寄せた視線なんだよ。"
"10051060-121-シャインキャット" = "君ほどの才能には、時代が応えるってこと。"
"10051060-122-ツクヨ" = "で、でも、私は忍術研究部に……。"
"10051060-123-シャインキャット" = "私は忍術とか忍者のことは何も分からない。"
"10051060-124-シャインキャット" = "だけど、モデルの世界で……君はトップになれる。#nそれは確信してるんだ。"
"10051060-125-ツクヨ" = "でも私は、忍者が……。"
"10051060-126-シャインキャット" = "何かを掴むなら、何かを手放さなきゃならない。選ぶのは君だよ。"
"10051060-127-ツクヨ" = "私は……。"
"10051060-128-シャインキャット" = "答えが出ないなら、私が教えてあげる。#n……私について来なさい。それが答えだよ。"
"10051060-129-ツクヨ" = "でも……。"
"10051060-134-シャインキャット" = "それに、さっき君は宣言したよね？#n大勢の視聴者の前で「モデルになります」って。"
"10051060-135-ツクヨ" = "……！"
"10051060-136-シャインキャット" = "その約束を、破るつもり？"
"10051060-137-マネージャー" = "お車の準備ができました。"
"10051060-138-シャインキャット" = "さあ、次の仕事に行くよ。"
"10051060-147" = "「少女忍法帖ミチルっち」撮影現場"
"10051060-148-イズナ" = "部長！見てください！#n先週アップした動画、再生数が2回増えましたよ！"
"10051060-149-ミチル" = "おおっ！またしても忍者の魅力に酔いしれる者が増えたか！"
"10051060-150-ミチル" = "ツクヨ！ツクヨもこっち来て見てごらんよ！"
"10051060-154-イズナ" = "部長、ツクヨ殿はまだ来ていません。"
"10051060-155-ミチル" = "え？まだなの？"
"10051060-156-ミチル" = "珍しいね……どうしたんだろう？"
"10051060-157-イズナ" = "先ほどからモモトークでメッセージ送っているのですが、全然既読がつきません……。"
"10051060-158-ミチル" = "この時間に撮影があることは、誰よりも知ってるはずなのに。"
"10051060-159-ミチル" = "まさか、何かあったんじゃ……？"
"10051060-160-？？？" = "ごめんくださぁい。今日の撮影場所はこちらで合ってますか？"
"10051060-161-イズナ" = "むむ？"
"10051060-162-ミチル" = "そ、その声は……！"
