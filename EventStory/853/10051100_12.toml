[translation]
"10051100-1" = "第10話;ショーの終幕"
"10051100-4" = "ファッションショー控室"
"10051100-5-シャインキャット" = "……いよいよ本番だね。"
"10051100-6-シャインキャット" = "準備はいい？"
"10051100-7-ツクヨ" = "……。"
"10051100-8-シャインキャット" = "緊張しなくてもいいよ。でも、心の準備だけはしておいて。"
"10051100-9-シャインキャット" = "今日は事実上、君の本当のデビューステージになるんだから。"
"10051100-10-ツクヨ" = "本当の……デビュー？"
"10051100-11-シャインキャット" = "今までのステージは、どれも小規模だった。#nだから多少拙いウォーキングでも大した問題にはならなかった。"
"10051100-12-シャインキャット" = "もちろん、それでもある程度注目はされたけど……あくまで[ruby=・]新[/ruby][ruby=・]人[/ruby][ruby=・]と[/ruby][ruby=・]し[/ruby][ruby=・]て[/ruby]の話。"
"10051100-13-シャインキャット" = "だけど今日は違う。#n新年を祝うこのショーは、これまでより何倍も多くの人が君を見ることになる。"
"10051100-14-シャインキャット" = "だから今日が終われば、君の名前はもっと広く知れ渡る。"
"10051100-19-シャインキャット" = "今日をもって――君は真のプロモデルへと生まれ変わるんだよ。"
"10051100-20-ツクヨ" = "プロの……モデル……。"
"10051100-21-ツクヨ" = "本当に……私が……？"
"10051100-22-シャインキャット" = "そうさ。感慨深い？"
"10051100-23-ツクヨ" = "……。"
"10051100-24-シャインキャット" = "それとも、まだ未練があるのかな？まだ戻りたいと思ってる？"
"10051100-25-ツクヨ" = "わ、私は……。"
"10051100-26-ツクヨ" = "えっと……。"
"10051100-27-シャインキャット" = "そんな時は、今までの努力を思い出しなさい。"
"10051100-28-シャインキャット" = "過酷な食事管理に運動、ポージングのトレーニング、その他にもたくさん。"
"10051100-30-シャインキャット" = "君の才能、そしてその努力を無駄にしないで。#nわかった？"
"10051100-31-ツクヨ" = "は、はい……。"
"10051100-35-スタッフ" = "時間です。準備をお願いします。"
"10051100-36-シャインキャット" = "よし、行ってきなさい。"
"10051100-37-ツクヨ" = "……はい。"
"10051100-44-イズナ" = "前回のファッションショーより、ずっと人が多いですね！"
"10051100-45-ミチル" = "そうだね……規模も大きくなってる……。"
"10051100-46-ミチル" = "このステージを……もうすぐ、ツクヨが歩くんだよね？"
"10051100-47-イズナ" = "そうです。"
"10051100-48-イズナ" = "……そしてショーが終わったら、ツクヨ殿に直接会えるかもしれません。"
"10051100-49-イズナ" = "最後に退場する時、モデルと警備員は同じ通路を使うそうなので。"
"10051100-50-ミチル" = "ツクヨ……。"
"10051100-51-ミチル" = "ねえ、イズナ……。"
"10051100-52-イズナ" = "はい！"
"10051100-56-ミチル" = "私……本当にツクヨに会うべきかな？"
"10051100-57-イズナ" = "はい！？"
"10051100-62-ミチル" = "あ……。"
"10051100-63-イズナ" = "……始まりました。"
"10051100-74-ミチル" = "……ツクヨだ。"
"10051100-75-イズナ" = "……ツクヨ殿です。"
"10051100-76-ミチル" = "……人が輝くって、ああいうことなんだね。"
"10051100-77-イズナ" = "歩き方が、前よりずっと自然になっています。"
"10051100-78-ミチル" = "もう完全に……モデルだね……。"
"10051100-79-ミチル" = "素敵な服を着て、ステージの上で――"
"10051100-80-ミチル" = "スポットライトを一身に浴びながら……全力で走って――"
"10051100-81-ミチル" = "走って――"
"10051100-85-ミチル" = "待って、走ってる？"
"10051100-87-ミチル" = "ツクヨ！？なんで急に走り出してるの！？"
"10051100-88-イズナ" = "えええっ！？"
"10051100-89-イズナ" = "部長！ツクヨ殿がステージから飛び降りました！！"
"10051100-90-ミチル" = "なんでぇぇぇぇ！？"
"10051100-93" = "[log]（1分前）[/log]"
"10051100-96-ツクヨ" = "（こんなに人が多いなんて……）"
"10051100-97-ツクヨ" = "（ふぅ……）"
"10051100-98-ツクヨ" = "（大丈夫……練習した通りに歩けば……）"
"10051100-99-ツクヨ" = "（そう、こうして歩いていけば……）"
"10051100-100-ツクヨ" = "（その先に……私は、何になれるんだろう？）"
"10051100-103-ツクヨ" = "（あっ、始まった……！）"
"10051100-107-ツクヨ" = "（……あれ？）"
"10051100-108-ツクヨ" = "（観客席のあの人、何してるの……？）"
"10051100-113-ツクヨ" = "（な、な、なんで！？）"
"10051100-114-ツクヨ" = "（あの人のバッグの中……爆弾が！？）"
"10051100-115-ツクヨ" = "（しかも、ピンを抜こうとしてる！？）"
"10051100-116-ツクヨ" = "（周りの人たち、なんで気づかないんですか……！？）"
"10051100-117-ツクヨ" = "（まさか、ステージからじゃないと見えてないとか……？）"
"10051100-118-ツクヨ" = "（ひぃぃ……！）"
"10051100-119-ツクヨ" = "（なぜ、そんなことを……？）"
"10051100-120-ツクヨ" = "（ううん、理由よりも先に――）"
"10051100-121-ツクヨ" = "（まずは爆発を阻止しないと！）"
"10051100-122-ツクヨ" = "（叫ぶ？ダメ。それだと混乱を招くだけ……！）"
"10051100-123-ツクヨ" = "（どうすれば……！）"
"10051100-128" = "[log]忍者とは[wa:1040]どんな[/log]"
"10051100-130" = "[log]窮地でも――[/log]"
"10051100-133-ツクヨ" = "決して諦めないもの……！"
"10051100-134-ツクヨ" = "えいっ！"
"10051100-138" = "タタタッ！"
"10051100-139-ミチル" = "ツクヨ！？なんで急に走り出してるの！？"
"10051100-140-イズナ" = "えええっ！？"
"10051100-151-イズナ" = "部長！ツクヨ殿がステージから飛び降りました！！"
"10051100-160" = "ドドン！！！"
"10051100-163-ツクヨ" = "……捕まえました！"
"10051100-167-シャインキャット" = "あの子、何をやってるの……！？"
"10051100-168-スタッフ" = "ひいいぃぃっ……！"
"10051100-173-ミチル" = "ツクヨ！"
"10051100-174-イズナ" = "ツクヨ殿！"
"10051100-175-ミチル" = "何してるの！？ドレスがボロボロじゃん！？"
"10051100-176-ミチル" = "しかも……ファッションショーが……！"
"10051100-177-ツクヨ" = "部長！とにかくこの人のバッグを！"
"10051100-178-ツクヨ" = "中に爆弾が入ってます！"
"10051100-184-イズナ" = "バッグ確保！本当に爆弾が入っています！"
"10051100-185-ミチル" = "えぇっ！？"
"10051100-186-ミチル" = "これ！威力が凄すぎてコンビニとかスーパーでも販売禁止にされてるやつじゃん！？"
"10051100-187-ミチル" = "っていうか、ツクヨ、大丈夫！？"
"10051100-188-ツクヨ" = "はい、私は、大丈夫です。"
"10051100-189-ツクヨ" = "ちょっとだけ、ドレスが……破れましたけど……。"
"10051100-190-ツクヨ" = "えへへ、ちょっと……みっともないですね？"
"10051100-191-ミチル" = "そ、それどころじゃないでしょ！？モデルがドレスを破るって……！"
"10051100-192-ミチル" = "そのドレス、すごく高いやつなんじゃ……！"
"10051100-193-ツクヨ" = "部長、大丈夫です。"
"10051100-194-ミチル" = "大丈夫じゃないでしょ！"
"10051100-195-ミチル" = "だって、ツクヨは――"
"10051100-197-ミチル" = "――モデルなんだから！"
"10051100-202-ツクヨ" = "……はい？"
"10051100-203-ミチル" = "……え？"
"10051100-204-ミチル" = "違うの？"
"10051100-205-ツクヨ" = "私はツクヨですよ？"
"10051100-206-ミチル" = "え、いや、えっと、そういう意味じゃなくて……。"
"10051100-207-ツクヨ" = "いえ、これで合ってます。"
"10051100-208-ツクヨ" = "私は[ruby=おおの]大野[/ruby]ツクヨ、です。#n背が高くて、気弱で、忍者が好きな……ただの高校生。それが、私です。"
"10051100-209-ミチル" = "……モデルは？"
"10051100-210-ツクヨ" = "正直、よくわかりません。"
"10051100-211-ツクヨ" = "たしかに周りの人は、私を最高のモデルって褒めてくれます。"
"10051100-212-ツクヨ" = "でも、そう言われる度に……モデルとして当然だとされることをこなす度に……。"
"10051100-213-ツクヨ" = "……合わない服を無理に着てるみたいに、苦しくて……辛くなりました。"
"10051100-214-ミチル" = "合わない服……。"
"10051100-215-ツクヨ" = "部長も見ましたよね？合わない服は、無理に着れば――"
"10051100-216-ツクヨ" = "……いつか、破けてしまうんです。"
"10051100-217-ミチル" = "ツクヨ……。"
"10051100-218-ツクヨ" = "部長……私、戻ります。"
"10051100-222-ツクヨ" = "――忍術研究部に。"
"10051100-226-ミチル" = "……。"
"10051100-227-ミチル" = "う……うぅ……。"
"10051100-228-ツクヨ" = "ぶ、部長……！？"
"10051100-229-ツクヨ" = "ど、どうして泣くんですか！？"
"10051100-230-ミチル" = "私……ツクヨが戻ってこないと思ってた……。"
"10051100-231-ミチル" = "だって、あんなにすごい才能があるんだもん……。"
"10051100-232-ミチル" = "だから、引き止めちゃいけないって、思った。"
"10051100-234-ミチル" = "下手に引き戻したら、大切な才能を潰すかもしれないって……。"
"10051100-235-ミチル" = "だから……戻らない方がいいって、自分に言い聞かせて……応援してた……。#nツクヨは、ステージの上で本当に輝いてたから。"
"10051100-236-ミチル" = "でも……。"
"10051100-239-ミチル" = "でも、やっぱり……ツクヨに戻ってきてほしかった……！"
"10051100-240-ミチル" = "一緒に活動してた時間が楽しかったから！"
"10051100-241-ミチル" = "だから……だから……！"
"10051100-245-ツクヨ" = "部長……。"
"10051100-250-イズナ" = "ところで、ツクヨ殿。"
"10051100-251-イズナ" = "今、下敷きになっている人……もぞもぞ動いています！"
"10051100-254-ミチル" = "はっ……！"
"10051100-255-ツクヨ" = "い、いけない、すっかり忘れてました……！"
"10051100-259-ツクヨ" = "……あれ？#nこの人……どこかで見たような……？"
"10051100-263-一同" = "あ……！"
"10051100-264-ミチル" = "この前のショーの時！#n戦闘に巻き込まれて運ばれてったモデルだ！"
"10051100-265-イズナ" = "イズナも思い出しました！#nこの人が搬送されたから、代わりにツクヨ殿が出ることになったんです！"
"10051100-266-ツクヨ" = "な、なんでこの人がまた……？"
"10051100-271-倒れていたモデル" = "うう……頭が……。"
"10051100-275-倒れていたモデル" = "ま、待って、私の爆弾はどこ！？"
"10051100-276-ツクヨ" = "ば、爆弾は、私たちが押収しました。"
"10051100-277-ツクヨ" = "どうして、こんなことを……？"
"10051100-278-倒れていたモデル" = "どうして？よく言うわよ。"
"10051100-280-倒れていたモデル" = "全部、あんたのせいじゃない！"
"10051100-281-ツクヨ" = "はい！？"
"10051100-282-倒れていたモデル" = "あの日、あんたが私の居場所を奪ったのよ！"
"10051100-283-倒れていたモデル" = "ステージも、衣装も、スポットライトも、称賛も……。"
"10051100-284-倒れていたモデル" = "本当は全部、私のものだったのに！"
"10051100-285-ミチル" = "なに言ってるのさ。#nツクヨだって、あの時は望んでステージに立ったわけじゃないのに。"
"10051100-286-倒れていたモデル" = "う、うるさいっ……！"
"10051100-287-倒れていたモデル" = "とにかく……爆弾1つ奪われたぐらいで、私は屈しない！"
"10051100-288-倒れていたモデル" = "もう終わりよ！このファッションショーをぶっ壊してやるんだから！"
"10051100-289-ミチル" = "もう十分壊してると思うけど！？"
"10051100-290-倒れていたモデル" = "うるさい！こっちよ、魑魅一座！！"
"10051100-301-イズナ" = "そ、外から魑魅一座が大勢押し寄せています！"
"10051100-302-ミチル" = "まさか、あいつが全部雇ったの……？"
"10051100-303-イズナ" = "ということは……呉服屋さんで騒いでた魑魅一座も……。"
"10051100-304-ツクヨ" = "シャインキャットさんの配達員を襲ってたのも……？"
"10051100-305" = "[s1] \"ニヤも言ってたね。\"\n[s2] \"最近、魑魅一座の暴走が増えてるって……。\""
"10051100-308-倒れていたモデル" = "あはははっ！正解だよ、デコボコの忍者さんたち！"
"10051100-309-倒れていたモデル" = "そう！魑魅一座を雇ったのは私！全部私が仕組んだの！"
"10051100-310-倒れていたモデル" = "外から少しずつこのショーをぶっ壊すためにね！！"
"10051100-311-ツクヨ" = "ぶ、部長、敵が多すぎます……！"
"10051100-312-ミチル" = "大丈夫だよ、ツクヨ。"
"10051100-316-ミチル" = "指揮、お願いしていいかな、先生殿？"
"10051100-317" = "[s] \"もちろん！\""
"10051100-318-ミチル" = "よし、忍術研究部！"
"10051100-323-ミチル" = "いくよ！！"
