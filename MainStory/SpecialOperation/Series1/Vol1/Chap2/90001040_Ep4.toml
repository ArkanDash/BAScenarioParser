"90001040-17-トキ" = "……。"
"90001040-18-トキ" = "私が時間を稼ぎますので、その間に――"
"90001040-19-エイミ" = "それ、本当に悪癖だと思うよ。"
"90001040-25-ヒマリ" = "（しかし、この状況でヘリだけを離陸させられるでしょうか……？）"
"90001040-26-ヒマリ" = "（せめて先生だけでも、そして……）"
"90001040-28-？？？" = "AMAS部隊――出撃。"
"90001040-32" = "[ns] \"え……？\""
"90001040-33-ヒマリ" = "まさか！？"
"90001040-39-？？？" = "――挨拶は非効率的だから省かせてもらうわ。"
"90001040-43-リオ" = "今はそんなことをしている場合ではないでしょう？"
"90001040-46-ヒマリ" = "あっ────あなた──！？"
"90001040-48" = "[ns] \"リオ！\""
"90001040-49-リオ" = "目の前の敵に集中しなさい。"
"90001040-50-リオ" = "5番目の預言者――ゲブラに関しては……対策があるの。#n支援するわ。"
