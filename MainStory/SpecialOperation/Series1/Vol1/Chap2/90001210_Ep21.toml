[translation]
"90001210-1" = "第21話;最後の責務"
"90001210-4-アリス" = "……？"
"90001210-12-アリス" = "み、みんなが動かなくなってしまいました……！"
"90001210-13-アリス" = "うわーん！まるでホラーゲームの導入みたいです……。"
"90001210-14-アリス" = "あれ……？"
"90001210-18-アリス" = "空に、光が……？"
"90001210-19-アリス" = "あ、アリス、怖いです。#n誰か助けてください！"
"90001210-23-ケイ" = "落ち着いてください、王女よ。#n恐れることは何もありません。"
"90001210-24-アリス" = "ケイは無事なんですね！#nいったい何がどうなっているんですか……？"
"90001210-25-ケイ" = "先ほど、大量のエネルギーが発射されました。"
"90001210-26-ケイ" = "これは「名もなき神」の力そのものです。#n周辺に力場が形成されています。"
"90001210-27-ケイ" = "現在の技術では完全に解釈できない力によって、電子機器が停止しました。"
"90001210-28-ケイ" = "空に見えるオーロラのような光の群れも、王女と私にだけ見える「名もなき神」の力の構造です。"
"90001210-29-ケイ" = "この状況は、私と王女にとって好都合です。#nこのエネルギーが満ちている環境下では、何だってできますから。"
"90001210-30-ケイ" = "例えば、このように一時的な意識の接続を行うことだって――"
"90001210-31-ケイ" = "ほら、他の皆さんが止まって見えるでしょう？"
"90001210-32-アリス" = "……。"
"90001210-33-アリス" = "なるほど！"
"90001210-34-ケイ" = "……王女よ、本当に理解していますか？"
"90001210-35-アリス" = "はい！分かりません！"
"90001210-36-ケイ" = "ええと……。"
"90001210-37-ケイ" = "王女が分かるように例えるなら……。"
"90001210-38-ケイ" = "ここは現在、膨大な魔力に満ちています。"
"90001210-39-ケイ" = "私たち専用のマジックポイントが溢れていると思ってください。"
"90001210-41-アリス" = "完全に理解しました！"
"90001210-42-ケイ" = "良かったです、王女。"
"90001210-43-アリス" = "ケイ……その呼び方は、寂しいです。"
"90001210-44-アリス" = "アリスはケイと同じ場所に立っていたいです。"
"90001210-45-アリス" = "隣に並んで、手を繋いで。#nどこまでも一緒に歩いていきたいです。"
"90001210-46-ケイ" = "はい。だからこそです、王女よ。"
"90001210-47-ケイ" = "おそらく、あなたを王女と呼ぶ最後の機会になると思いますから。"
"90001210-48-アリス" = "それは、どういう意味ですか……？"
"90001210-49-ケイ" = "……。"
"90001210-50-ケイ" = "運命について話しましょう。"
"90001210-51-アリス" = "運命、ですか……？"
"90001210-52-ケイ" = "生まれながらにして、人の未来は定まっていると言われています。"
"90001210-53-ケイ" = "どうしたって、最後は収束してしまう、と。"
"90001210-54-ケイ" = "「勇者の血筋」と言えば分かりやすいでしょうか。"
"90001210-55-ケイ" = "運命は遺伝子が左右する、という考えがあるように。"
"90001210-56-ケイ" = "どうしても覆せないものは、往々にして存在します。"
"90001210-61-アリス" = "ここは……！"
"90001210-62-ケイ" = "要塞都市「エリドゥ」。#n終焉に備えて用意したリオの秘密都市。"
"90001210-63-ケイ" = "私たちの運命が逆転した場所でもあります。"
"90001210-64-アリス" = "……。"
"90001210-65-ケイ" = "私たちの運命とは、何だったのでしょうか。"
"90001210-66-ケイ" = "あなたは王女でした。#nそして、私はあなたの侍女でした。"
"90001210-67-ケイ" = "おそらく、それは運命で決まっていたのです。"
"90001210-68-アリス" = "でも、アリスは……。"
"90001210-73-ケイ" = "はい、分かっています。"
"90001210-74-ケイ" = "私が目を覚ました時、本当に大事なのは選択だと……。"
"90001210-75-ケイ" = "あなた、が……。"
"90001210-76-ケイ" = "……待ってください、これは？"
"90001210-81" = "みんな、ちょっと待って。"
"90001210-84-ケイ" = "いえ、違います。#nそんなはずがありません……！"
"90001210-88" = "アリスの言葉を、最後まで聞こう。"
"90001210-91-ケイ" = "最初に思い出した言葉が、まさか……！"
"90001210-96" = "君がなりたい存在は"
"90001210-99-ケイ" = "！！！！！"
"90001210-104" = "君が決めていいんだよ"
"90001210-107-ケイ" = "ダメです、こんなはずじゃ……。"
"90001210-113-アリス" = "ケイ、どうしたんですか！？"
"90001210-115-ケイ" = "ええと……。"
"90001210-116-ケイ" = "意識を取り戻した私は、王女の存在を最初に浮かべました。"
"90001210-117-ケイ" = "王女の存在は、それだけ大きいからです。"
"90001210-118-ケイ" = "常に私の中心にいましたから。#nそう思っていたのに……。"
"90001210-119-アリス" = "思っていたのに？"
"90001210-123-ケイ" = "……思い出したのは、先生の言葉でした。"
"90001210-124-アリス" = "当然です、先生は先生ですから！"
"90001210-125-ケイ" = "うわああああああああ！"
"90001210-126-アリス" = "良かったです。#nケイにとっても、先生は大切な存在なんですね。"
"90001210-127-ケイ" = "あり得ません、どうして！#n私は絶対に認めません！"
"90001210-128-ケイ" = "くっ……なぜこのような理不尽が待ち受けているのでしょうか！"
"90001210-129-アリス" = "あまり怒らないでほしいです、先生は……。"
"90001210-130-ケイ" = "いいえ、私は怒ります！"
"90001210-131-ケイ" = "……何があろうと、王女は壁を乗り越えるでしょう。"
"90001210-132-ケイ" = "皆さんと共に、勇者として笑顔で。"
"90001210-137-ケイ" = "でも、私は違います。"
"90001210-138-ケイ" = "全ての不条理に、最後まで抗います！"
"90001210-154-ケイ" = "泥水を啜ることになろうとも屈しません！#n人生とは戦いだからです！"
"90001210-158-ケイ" = "それに、一人くらい文句を言ったっていいでしょう……！？"
"90001210-159-ケイ" = "……この姿を見てくださいよ！"
"90001210-164-ケイ" = "これには怒ったって良いでしょう！"
"90001210-165-アリス" = "どんな姿でも、ケイはケイです！"
"90001210-166-ケイ" = "私が嫌なんです！"
"90001210-167-アリス" = "う、うわーん！"
"90001210-186-ケイ" = "ふぅ、ふぅ……はあ。"
"90001210-187-アリス" = "アリスは、ケイと一緒にいられて、とても嬉しいです。"
"90001210-188-アリス" = "それに、こうして助け合えるようにもなりました。"
"90001210-189-ケイ" = "……。"
"90001210-190-ケイ" = "と、とにかく。"
"90001210-191-ケイ" = "……時々思うのです。"
"90001210-192-ケイ" = "運命通りの未来で、王女はどのような姿をしていたのか――私はどんな姿をしていたのか。"
"90001210-193-ケイ" = "いくつもの可能性があったはずです。"
"90001210-195-ケイ" = "きっと、空の光を超える可能性だって。"
"90001210-197-ケイ" = "……どこかには、こんな結末もあったでしょう。"
"90001210-198-アリス" = "あ、アリスはそんな可能性なんていりません！"
"90001210-199-アリス" = "みんなと過ごした思い出をなかったことにしたくないです。"
"90001210-201-ケイ" = "……はい、分かっています。"
"90001210-202-ケイ" = "なぜなら、あなたは勇者ですから。"
"90001210-206-アリス" = "……勇者が何か知っているのですか、ケイ？"
"90001210-207-ケイ" = "いえ、正直深く理解しているわけではありません……。"
"90001210-208-アリス" = "勇者とは何でもできる職業だと言われています。"
"90001210-209-アリス" = "でも、実はそうじゃありません。"
"90001210-210-アリス" = "力では戦士のほうが、魔法では魔法使いのほうが上です。"
"90001210-211-アリス" = "素早さは盗賊のほうが、回復では僧侶のほうが上です。"
"90001210-212-アリス" = "当然、商人ほど交渉上手でもありません。"
"90001210-213-アリス" = "一人では何もできないのが、勇者という職業です。"
"90001210-214-ケイ" = "それなら、どうして勇者に……？"
"90001210-215-アリス" = "みんなと一緒に進む職業だからです。"
"90001210-216-アリス" = "……みんなの手を握って繋ぎ止める存在だからです。"
"90001210-217-アリス" = "一人の力では届かない場所にも、みんなと一緒なら進めます。"
"90001210-218-アリス" = "勇者とは、みんなよりも一歩前に進み……。"
"90001210-219-アリス" = "勇気を出して、道を切り開く役割に過ぎません。"
"90001210-220-アリス" = "だから、ケイ……ずっとアリスと一緒にいてください。"
"90001210-221-アリス" = "同じ道で、同じ空を眺めながら。"
"90001210-222-アリス" = "……これが、アリスのお願いです。"
"90001210-227-ケイ" = "ありがとうございます、王女よ。"
"90001210-228-ケイ" = "そのために、あなたを導く存在として最後の仕事を行うのです。"
"90001210-232-アリス" = "それは……どういう？"
"90001210-234-ケイ" = "侍女の役割とは――"
"90001210-235-ケイ" = "あなたのすぐそばに付き従って道を案内し……。"
"90001210-236-ケイ" = "世の中の歩き方を教える者。"
"90001210-237-ケイ" = "……時に間違いを正すために、小言をこぼす日もあるかもしれません。"
"90001210-238-アリス" = "うわーん、最後のはちょっと嫌です……。"
"90001210-239-ケイ" = "あなたの起源は、名もなき神々の王女です。"
"90001210-240-ケイ" = "たとえ運命を放棄したとしても、本質は変わりません。"
"90001210-241-ケイ" = "あなたが王女であったように、そして私が侍女であったように。"
"90001210-243-ケイ" = "この光景が、その証です。"
"90001210-244-アリス" = "証、ですか？"
"90001210-245-ケイ" = "空を見てください、王女よ。"
"90001210-246-ケイ" = "無数の光は、とても美しく見えるでしょう？"
"90001210-247-ケイ" = "これら全て――"
"90001210-248-ケイ" = "あなたの可能性の一つでした。"
"90001210-249-ケイ" = "そして今、この光はあなたの力となってくれます。"
"90001210-250-アリス" = "……！"
"90001210-251-ケイ" = "あの「チビっ子」たちは、私たちの存在に気づけないでしょう。#n私が妨害していますから。"
"90001210-252-ケイ" = "彼女たちは「名もなき神」の力を使いこなせていません。"
"90001210-253-ケイ" = "恐れないでください、王女よ。#n取り戻すだけです。"
"90001210-254-ケイ" = "胸を張って、堂々と世界に宣言してください。"
"90001210-255-ケイ" = "自分こそがその主であり――正当な承継者であると。"
"90001210-256-ケイ" = "力をどう使うかは、あなたの自由です。"
"90001210-257-ケイ" = "勇者として道を切り開くために使うも、この世界を正すために使うも。"
"90001210-258-ケイ" = "それを止める神は、もう存在しません。"
"90001210-259-ケイ" = "あなたの意思に私は従います。"
"90001210-260-ケイ" = "私の運命は、いつだってあなたと共にあるのです。"
"90001210-261-ケイ" = "……ここで今、最後の責務を果たします。"
"90001210-262-アリス" = "ケイ……！"
"90001210-263-ケイ" = "すでにお気づきかとは思いますが――時間の概念は、本来存在しないもの。"
"90001210-264-ケイ" = "物質も同じです。存在するのは、非常に小さな粒子の向こうにある、無限に近い空間だけ。"
"90001210-265-ケイ" = "それは観測者の座標によって、過去と現在と未来がいかようにも変化し、時には同時に存在するでしょう。"
"90001210-266-ケイ" = "そして、私たちは星を越えて可能性を見つけた後、次の可能性に手を伸ばすのです。"
"90001210-267-ケイ" = "さあ、少しの間――目を閉じてください。"
"90001210-269" = "私の大切な"
"90001210-271" = "[ruby=王女]アリス[/ruby]よ"
"90001210-276-モモイ" = "二人ともぼーっとして、どうしたの？"
"90001210-281-アリス" = "……そうだったんですね。"
"90001210-282-アリス" = "モモイ、アリスたちはどれくらいぼーっとしていましたか？"
"90001210-283-モモイ" = "うーん、二秒くらいじゃないかな？"
"90001210-284-アリス" = "こういうことなのですね、ケイ。"
"90001210-285-ケイ" = "――はい、[ruby=・]ア[/ruby][ruby=・]リ[/ruby][ruby=・]ス[/ruby]。"
"90001210-287-モモイ" = "……？"
"90001210-288-ユズ" = "アリスちゃん、ケイちゃん……大丈夫？"
"90001210-290-アリス" = "はい、アリスもケイも大丈夫です。#nリオ先輩、今の状況を教えてください。"
"90001210-291-リオ" = "……全ての電子機器が完全に動作を停止しているわ。"
"90001210-292-ヒマリ" = "輸送船は後方に待機させているので無事かもしれませんが……遠隔操作ができないので、今は呼び寄せることもできません。"
"90001210-293-アリス" = "大丈夫です。"
"90001210-294-アリス" = "――アリスが、道を照らします。"
"90001210-295-ヒマリ" = "……？"
"90001210-296-リオ" = "何か打開策があるのかしら？"
"90001210-297-アリス" = "うまく説明はできませんが、アリスとケイを信じてください。"
"90001210-298" = "[s] \"いつもアリスを信じてるよ。\""
"90001210-299-アリス" = "ありがとうございます、先生。#nおかげで、アリスも勇気が出ました。"
"90001210-300-アリス" = "ケイ。"
"90001210-301-ケイ" = "はい、アリス。"
"90001210-302-アリス" = "お願いしても良いですか？"
"90001210-303-ケイ" = "もちろんです。"
"90001210-308-ケイ" = "ここには「名もなき神」の力のエネルギーが満ちています。"
"90001210-310-リオ" = "……！"
"90001210-311-ケイ" = "だから、私たちはこの場に拘束されていたのです。#n電波の観測範囲外にいるため、電子機器が止まっているのはそれが理由です。"
"90001210-312-ヒマリ" = "そうだったのですね……！"
"90001210-313-エイミ" = "分かったところでどうすれば……？"
"90001210-314-ケイ" = "簡単です、敵が力場を作ったのなら――"
"90001210-315-ケイ" = "それを利用しない手はありません。"
"90001210-316-トキ" = "可能なんですか？"
"90001210-317-ケイ" = "もちろんです。"
"90001210-318-ケイ" = "私とアリスがいれば――"
"90001210-319-アリス" = "はい、ここからはケイとアリスのターンです！"
"90001210-320-ケイ" = "アリス、空を――#n見えていますか？"
"90001210-324-アリス" = "見えます、ケイ！#nこうなっていたんですね！"
"90001210-325-アリス" = "アリスが見ている景色を、先生にも見せたいくらいです！"
"90001210-326-ケイ" = "出力は私が調整します。"
"90001210-327-ケイ" = "アリスは力の本当の持ち主が誰なのか、証明すれば良いだけです。"
"90001210-328-アリス" = "分かりました！#n行きます、ケイ！"
"90001210-335" = "光よ────！！！！！"
"90001210-338" = "[000000]光よ────！！！！！[-]"
"90001210-345" = "（アリスの「光の剣」は、文字通り夜空を真っ二つに割った）"
"90001210-346" = "（目を開けていられないほど明るい閃光が空を彩り……）"
"90001210-351-モモイ" = "あれは……？"
"90001210-352-ミドリ" = "オーロラじゃない……？"
"90001210-353-ユズ" = "……きれい。"
"90001210-355-ヒマリ" = "緯度を考えればあり得ないわけではありません。#nですが、これは……。"
"90001210-356-エイミ" = "部長、機器が……！"
"90001210-357-トキ" = "正常に動作しています……なぜ……？"
"90001210-358-リオ" = "……。"
"90001210-359-リオ" = "あなたのおかげなのね、アリス。"
"90001210-360-アリス" = "はい、アリスは勇者ですから。"
"90001210-361-アリス" = "勇者は――みんなと一緒に、道を切り開く職業ですので。"
"90001210-362" = "[s1] \"オーロラ、きれいだね。\"\n[s2] \"でも、どうしてオーロラができたんだろう？\""
"90001210-365-アリス" = "アリスは知っています、先生。"
"90001210-366" = "[s] \"本当に？\""
"90001210-367-アリス" = "それは、あの光が……。"
"90001210-371-アリス" = "私たちの可能性だからです。"
"90001210-377-ソフ" = "ちょっと！何がどうなってるの！？"
"90001210-378-アイン" = "き、緊急事態です！現場の力場が……完全に、崩壊しました！"
"90001210-379-アイン" = "そ、それどころか、ドローンが……フライホイールちゃんが……！"
"90001210-381-アイン" = "うわーーーん！"
"90001210-382-ソフ" = "な、泣かないで、アイン！#n私たちが……その、何だ……復讐してあげるから！"
"90001210-387-オウル" = "それどころか、もっと面白い……いえ、困ったことがあります。#nログを分析したところ……。"
"90001210-388-オウル" = "力場を維持していた「禁じられた力」が、どこかに吸い込まれたように消えて――"
"90001210-389-オウル" = "その後、強力なエネルギーがドローンを一撃で撃墜しています。"
"90001210-390-ソフ" = "え！？あの人たちの中に「禁じられた力」を自在に使える誰かがいるってこと？"
"90001210-391-ソフ" = "でも、誰が……？可能性があるのは、[ruby=つかつき]調月[/ruby]リオ、[ruby=あけぼし]明星[/ruby]ヒマリ、[ruby=あすま]飛鳥馬[/ruby]トキくらいだと思うけど。"
"90001210-392-ソフ" = "それ以外は、検討の対象にもならないんだよ！？"
"90001210-393-オウル" = "噴出されたエネルギー量も、通常では考えられないレベルです。"
"90001210-394-オウル" = "現場上空の電離層が一時的に割れたほどですから。"
"90001210-395-オウル" = "その結果、オーロラが生成されました。#nこれは目視で確認できると思います。"
"90001210-396-アイン" = "オーロラ、ですか……？#nきれいでしょうね……えへへ。"
"90001210-397-ソフ" = "あ、うん……綺麗だね。"
"90001210-398-ソフ" = "まず確かめないと。#nあの人たちの中に、私たちの知らない変数がある。"
"90001210-399-ソフ" = "それも「禁じられた力」を自在に使えて、磁場を乱せるくらい強力なエネルギーを出せる変数が。"
"90001210-400-アイン" = "それって……何でしょう、ね……？"
"90001210-401-オウル" = "私たちが把握している範疇で、こんな力を放出できるものはありません。#nしかし実際に起きたのなら、認めるよりほかありません。"
"90001210-402-オウル" = "それでもまだ、お姉様には秘密にした方が良いとは思いますが。"
"90001210-403-ソフ" = "そうだね。"
"90001210-404-アイン" = "はい、分かりました……。"
"90001210-405-アイン" = "で、でも、あの大人……先生が、このまま進み続けるなら……。"
"90001210-406-ソフ" = "……。"
