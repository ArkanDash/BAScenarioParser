[translation]
"90001150-1" = "第15話;雪合戦"
"90001150-7-ヒマリ" = "……以上が、これまでの状況です。"
"90001150-8-ヒマリ" = "何か質問はありますか？"
"90001150-10-モモイ" = "えっと、ハッカージョーク……とかじゃないよね？"
"90001150-11-ミドリ" = "お姉ちゃん……。"
"90001150-13-ヒマリ" = "現実味がないのはとても分かりますが……。"
"90001150-15-リオ" = "――これが事実よ。"
"90001150-16-リオ" = "いま、私たちが直面している問題はあの時と同じ。"
"90001150-17-リオ" = "多次元バリアを解除しなければ、全てが始まらない。"
"90001150-22" = "[ns1] \"だから、みんなを呼んだんだ。\"\n[ns2] \"ごめんね。\""
"90001150-25" = "[ns3] \"どうか、力を貸してほしいんだ。\"\n[ns4] \"このお礼は、いつか必ず。\""
"90001150-30-モモイ" = "仕方ないなぁ！#nそこまで先生に言われたら、やらないわけにはいかないよね！"
"90001150-31-ミドリ" = "そ、そうですよ！#nそれに……そんなに頭を下げないでください！"
"90001150-33-ユズ" = "そ、そうするしかないんですよね……。"
"90001150-35-アリス" = "……はい、理解しました。#nアリスのやるべきことも。"
"90001150-44-アリス" = "アリスは、先生のためなら何でもします。"
"90001150-45-アリス" = "ただ……。"
"90001150-46" = "[s] \"ただ……？\""
"90001150-51-アリス" = "いえ、大丈夫です。#n魔法も奇跡もありますから、きっと……。"
"90001150-52-トキ" = "アリス……？"
"90001150-53-アリス" = "……でも、アリスだけではダメです。足りません。"
"90001150-58-ヒマリ" = "どういうことでしょうか？"
"90001150-59-アリス" = "あの日、アリスは「祝福された」光の剣を持ち上げました。"
"90001150-60-アリス" = "ですが……。"
"90001150-61-アリス" = "あれはアリスだけの力ではありません。"
"90001150-66-アリス" = "――ケイが必要です。"
"90001150-68-モモイ" = "……？"
"90001150-73-モモイ" = "あっ！"
"90001150-74-ミドリ" = "もしかして、あの時もケイちゃんがアリスちゃんのお願いを……？"
"90001150-76-アリス" = "はい、ケイが手伝ってくれました。#nだから、祝福された光の剣を持ち上げられたのです。"
"90001150-77-アリス" = "……。"
"90001150-78-アリス" = "……どうしてアリスだけが残され、ケイがいなくなったのかは分かりません。"
"90001150-79-アリス" = "ただ、同じように魔王の城を攻略するためにはケイの手助けが必要不可欠です。"
"90001150-80" = "[s] \"でも、ケイは……。\""
"90001150-81-リオ" = "……振り出しに戻ったわね。"
"90001150-82-リオ" = "せめて、ケイに関する手がかりがあれば手が打てるのだけれども……。"
"90001150-84-エイミ" = "……部長。"
"90001150-89-ヒマリ" = "ええ、分かっております。"
"90001150-91-トキ" = "お話しても、よろしいでしょうか？"
"90001150-93-ヒマリ" = "これは……研究倫理の問題です。"
"90001150-94-ヒマリ" = "ですが……そうですね。#n存在するものを、なかったことにはできませんから。"
"90001150-95-エイミ" = "……そうだね。"
"90001150-100-トキ" = "分かりました、ヒマリ部長に従います。"
"90001150-105-ヒマリ" = "リオ。#n手がかりなら残っています。"
"90001150-110-リオ" = "……どこに？"
"90001150-111-ヒマリ" = "ウトナピシュティムの[ruby=もとぶね]本船[/ruby]で、アトラ・ハシースの箱舟に突入したあの日――"
"90001150-118-リオ" = "なるほど……アリスのキーホルダーにケイを移植した、と。"
"90001150-120-アリス" = "……。"
"90001150-121-ヒマリ" = "「Kei」という名のセーブデータをUSBに移した――ただ、それだけです。"
"90001150-122-ヒマリ" = "あのデータはわずか2キロバイトでした。#nそもそもケイかどうかも分かりません。"
"90001150-123-リオ" = "……それは本当に、自然発生したデータだったのかしら？"
"90001150-129-アリス" = "リオ先輩？"
"90001150-131-ヒマリ" = "一体何を言っているのですか？"
"90001150-132-リオ" = "……。"
"90001150-133-リオ" = "糸口が掴めたわ。"
"90001150-134-ヒマリ" = "！？"
"90001150-136-アリス" = "本当ですか！？"
"90001150-137" = "[s] \"詳細を教えてもらえるかな。\""
"90001150-140-リオ" = "私の推測が正しければ、そのデータ――"
"90001150-141-リオ" = "2キロバイトのファイルが突破口になってくれるわ。"
"90001150-142-ヒマリ" = "ビット単位まで分析しましたが、中身は……。"
"90001150-143-リオ" = "ええ、そうでしょうね。#n「一般的な技術」では解析できないもの。"
"90001150-144-ヒマリ" = "それで……どうアプローチするつもりなのです？"
"90001150-145-リオ" = "それは――"
"90001150-147-アリス" = "……ケイにもう一度会えるんですか！？"
"90001150-152-ヒマリ" = "落ち着いてください、アリス。#nまだ決まったわけでは……。"
"90001150-153-アリス" = "リオ先輩、アリスは何をすれば良いですか？"
"90001150-159-リオ" = "……ごめんなさい、少し先走ってしまったわね。#n実際のところ、確率で言えば、半々。"
"90001150-160-リオ" = "いえ、それよりも低いかもしれない。#n一か八かの賭けのようなものよ。"
"90001150-161-リオ" = "それに……失敗したら、残されていた2キロバイトのデータさえも消えてしまうかもしれない。"
"90001150-163-アリス" = "それは……！"
"90001150-165-モモイ" = "アリス……。"
"90001150-166-ミドリ" = "アリスちゃん……。"
"90001150-167-ユズ" = "……。"
"90001150-169-アリス" = "今度こそ、ケイを失うかもしれないのですね……？"
"90001150-170-リオ" = "……。"
"90001150-171-リオ" = "責任が重たいかもしれないけれど……。"
"90001150-172-リオ" = "貴女の選択に委ねられているわ。"
"90001150-173-アリス" = "アリスは、ケイと……。"
"90001150-179" = "（アリスと目線を合わせた）"
"90001150-180" = "[ns] \"アリスはどうしたい？\""
"90001150-184-アリス" = "アリスは……。"
"90001150-185-アリス" = "でも、ケイのことを勝手に決めるのは……。"
"90001150-186" = "[s] \"私たちには決められないけど……。\""
"90001150-188" = "[ns5] \"他の誰でもない、アリスには……。\"\n[ns6] \"……その権利があると思うよ。\""
"90001150-191-アリス" = "……！"
"90001150-192-アリス" = "アリスは……。"
"90001150-193-アリス" = "……アリスは、やっぱり。"
"90001150-200-アリス" = "ケイに、会いたいです。"
"90001150-203-アリス" = "もう一度、会いたいです。"
"90001150-204-アリス" = "ケイならどうするか考えてみましたが……。"
"90001150-205-アリス" = "見習い勇者のアリスには、よく分かりませんでした。"
"90001150-206-アリス" = "もしかしたら、このまま放っておいてほしいのかもしれません。"
"90001150-213-アリス" = "でも、アリスが残されたのは、きっと偶然じゃないと思います。"
"90001150-214-アリス" = "だから……アリスが、決めます。"
"90001150-218-アリス" = "ケイと、またお話がしたいです。"
"90001150-219-アリス" = "今度は仲間として、友達として……一緒に過ごしたいです。"
"90001150-220-アリス" = "ケイに何を言われたって構いません。"
"90001150-221-アリス" = "……たとえ、永遠に失ってしまったとしても。#n絶対、リオ先輩のせいにはしません。"
"90001150-222-アリス" = "アリスは、勇者失格です。"
"90001150-223-アリス" = "自分勝手な都合でケイを振り回しています。#nリオ先輩にも、辛いことをお願いしています。"
"90001150-224-アリス" = "……ごめんなさい、リオ先輩。"
"90001150-226-リオ" = "いえ、私は……。"
"90001150-228-アリス" = "先生、ごめんなさい。#nアリスは勇者になりたいと言いながら、こんなにも欲張りで……。"
"90001150-229" = "[s] \"……。\""
"90001150-230-アリス" = "それでも……。"
"90001150-231-アリス" = "アリスは……。"
"90001150-236-アリス" = "……。"
"90001150-238-アリス" = "ケイを、お願いします。"
"90001150-239-リオ" = "……！"
"90001150-240-ヒマリ" = "ええ、分かりました。#n可愛い後輩の頼みを断るわけにはいきません。"
"90001150-241-ヒマリ" = "すぐに始めましょう、リオ。#n「全知」の超天才病弱美少女の手を借りておいて、失敗なんて許しません。"
"90001150-243-リオ" = "さっきも言った通り、成功確率は……。"
"90001150-248-ヒマリ" = "絶対に成功させます。#nできないとは言わせませんよ？"
"90001150-252-リオ" = "……そうね。今は可能性の話をしている場合じゃなかったわ。"
"90001150-254-アリス" = "アリスも……お手伝いしてもいいですか？"
"90001150-259-リオ" = "アリス？"
"90001150-260-ヒマリ" = "急にどうしたのですか？"
"90001150-261-リオ" = "残念だけれど……これはとても危険な工程なの。"
"90001150-262-リオ" = "貴女を巻き込むわけには……。"
"90001150-264-アリス" = "それでも、アリスは……。"
"90001150-269" = "（ヒマリが突然、目配せをしてきた）"
"90001150-270" = "（意図が分からなかったが、視線を追う内に察した）"
"90001150-276" = "[ns] \"アリス、ゲーム開発部のみんな。\""
"90001150-278-アリス" = "は、はい……？"
"90001150-279-ミドリ" = "なんですか、先生？"
"90001150-283" = "[ns] \"外で一緒に雪合戦でもしない？\""
"90001150-285-ユズ" = "えっ……今からですか？"
"90001150-291-モモイ" = "……良いよ、先生！"
"90001150-292-モモイ" = "それじゃ、私とアリスは先に行ってるね！"
"90001150-297-ミドリ" = "お姉ちゃん、急にどうしたの！？"
"90001150-298-アリス" = "も、モモイ？#nアリスはそんなことをしている場合では……！"
"90001150-304-ユズ" = "モモイ……待って！"
"90001150-305-ヒマリ" = "ありがとうございます、先生。"
"90001150-306" = "[s] \"これくらい、いつでも任せて。\""
"90001150-308-トキ" = "風邪にはお気をつけください。#nまあ、発熱した際には一日中おそばで看病しますが。"
"90001150-309-トキ" = "……うん、悪くありませんね。"
"90001150-310-エイミ" = "どっちなの……。"
"90001150-311-トキ" = "私にもよく分かりません。"
"90001150-312-エイミ" = "うーん……。"
"90001150-318" = "[ns] \"おっ！やってるね！\""
"90001150-326-モモイ" = "ほら、次行くよ！ミドリ！"
"90001150-327-ミドリ" = "冷たっ……もう、負けないから！"
"90001150-330-アリス" = "モモイ、ミドリ……。"
"90001150-331-アリス" = "どうして急に……？#nアリスは、まだ……。"
"90001150-332" = "[s] \"アリス、大丈夫？\""
"90001150-336-アリス" = "よく、分かりません。#nこういう時間も大切ですが、今は……。"
"90001150-337-アリス" = "……ケイを。"
"90001150-338" = "[s] \"今だからこそ、じゃないかな。\""
"90001150-342-アリス" = "どういう意味ですか、先生？"
"90001150-343" = "[s] \"ケイにも、こういう楽しい姿を見せたくない？\""
"90001150-344-アリス" = "……。"
"90001150-355-アリス" = "……そうですね。"
"90001150-359-アリス" = "こんなに雪がいっぱいの場所があるなんて、思いもしませんでした。#nあれはペンギンでしょうか？"
"90001150-360-アリス" = "モモイは氷河に着いたらすぐに凍ってしまうと言っていましたが、実際は全然違いました。"
"90001150-361-アリス" = "ここも……素敵な場所です。"
"90001150-362" = "[s7] \"それを伝えるためには……。\"\n[s8] \"アリスが楽しんでる姿を見せるのが良いんじゃないかな？\""
"90001150-365" = "[ns] \"それに、必ず戻ってくるってアリスは信じてるよね。\""
"90001150-369-アリス" = "ケイは、必ず……。"
"90001150-373-アリス" = "……。"
"90001150-374-アリス" = "そうですね、先生。#nアリスが間違っていました！"
"90001150-375-アリス" = "世界がどれだけ素敵なのか伝えるためには……。"
"90001150-376-アリス" = "まずは、アリスが詳しくないといけません！#nだから……。"
"90001150-385-アリス" = "わあっ！？"
"90001150-387-ユズ" = "ミドリの雪玉が、アリスちゃんに……！"
"90001150-393-アリス" = "アリス、分かりました。#nこれはモモイを狙うように見せかけて、アリスを攻撃する作戦ですね！"
"90001150-399-アリス" = "アリスも負けませんよ！"
"90001150-407-ミドリ" = "ぷわあっ！？"
"90001150-408-モモイ" = "あはは！今のめっちゃ面白……うぉわ！"
"90001150-417-ユズ" = "今度はアリスちゃんの雪玉がモモイに……。"
"90001150-418-モモイ" = "お！アリスもやる気になったんだね！？"
"90001150-420-アリス" = "今のアリスは無敵モードです！#n手加減しませんよ！"
"90001150-438-ユズ" = "気づかれないように後ろを狙って……。"
"90001150-444" = "[ns] \"じゃあ、私も参戦するよ！\""
"90001150-450-モモイ" = "うにゃっ！？！？"
"90001150-451-ミドリ" = "きゃあっ！？！？"
"90001150-452-アリス" = "うわっ！？！？"
"90001150-456-ユズ" = "ひ、ひぃっ！？#n先生……！？"
"90001150-457" = "[ns9] \"みんな、油断したね！\"\n[ns10] \"この戦場において……！\"\n[ns11] \"よそ見なんて命取りだよ！\""
"90001150-465-モモイ" = "よーし、絶対負けないんだから！"
"90001150-466-ミドリ" = "同じ手は何度もくらいません。#n先生、覚悟はできてますね？"
"90001150-467-アリス" = "アリス、知っています！#nこれは「万人の万人に対する闘争」です！"
"90001150-474-ユズ" = "そうですね……この戦いの間は、全員敵です……！"
"90001150-483" = "[ns] \"くっ、やられてたまるか！\""
"90001150-484-モモイ" = "わははは！"
"90001150-485-ミドリ" = "私を捕まえてみてください、先生！"
"90001150-487-アリス" = "連続技は回数を当てることが大事だと教わりました！"
"90001150-493-ユズ" = "わたしも少し、本気を出します……！"
"90001150-499" = "（その後も、真剣な雪合戦は続いた）"
"90001150-503" = "（あの時の私たちには、そういう時間が必要だった）"
"90001150-507" = "（ゲーム開発部のみんなが楽しく遊んでいる様子を眺めながら）"
"90001150-509" = "（バレないよう、こっそりベースに戻った）"
"90001150-515-トキ" = "おかえりなさい、先生。#nまずは雪を落としましょう。#nお手伝いします。"
"90001150-516-エイミ" = "良いところに来たね、先生。#nちょうどストレージが揃ったところだよ。"
"90001150-517-トキ" = "できるだけ多くの容量が必要だとリオ様が仰っていたので……。"
"90001150-518-トキ" = "エイミと手分けして、使えそうなストレージを探していました。"
"90001150-519" = "[s] \"じゃあ、これから……。\""
"90001150-520-エイミ" = "うん。"
"90001150-521-エイミ" = "先生も一緒に、ケイの復活を見守ってて。"
"90001150-523" = "次回;呼ぶ声"
