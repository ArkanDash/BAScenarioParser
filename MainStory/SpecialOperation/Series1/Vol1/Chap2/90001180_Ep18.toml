[translation]
"90001180-1" = "第18話;夜明け"
"90001180-10-ソフ" = "アイン、ちょっと！せっかくお姉様が来たのに、あんたが先に倒れてどうするの！"
"90001180-11-オウル" = "……先に倒れてくれて助かりました。#n私も危うかったので。"
"90001180-28-マルクト" = "こんにちは、アイン。"
"90001180-29-アイン" = "！！！"
"90001180-31-マルクト" = "それから、ソフ。"
"90001180-32-ソフ" = "はい！"
"90001180-34-マルクト" = "そして、オウル。"
"90001180-35-オウル" = "……こんにちは、お姉様。"
"90001180-40-アイン&ソフ&オウル" = "マルクトお姉様ぁ～！！！"
"90001180-41-アイン" = "わ、私たちの名前、覚えててくれたんですね……！"
"90001180-42-ソフ" = "忘れちゃってたらどうしようって不安だったけど、良かった！"
"90001180-43-オウル" = "ふっふっふ……お姉様が目覚めたということは……これで全ては私たちの意のままです！"
"90001180-45-マルクト" = "我は何をすれば良いのですか？"
"90001180-47-アイン" = "な、何もしなくていいです！#nお姉様は……ただ、そこにいてくだされば。"
"90001180-48-ソフ" = "そう！最高のエンジニアで、科学者で、万能の――"
"90001180-49-オウル" = "私たちがいますからね……！"
"90001180-50-アイン&ソフ&オウル" = "全て私たちにお任せください！"
"90001180-51-アイン" = "えっと……あらためて自己紹介を……#n肉体面のサポートと装備の管理を担当しているアインです。#nその……機械、好きですか？私は大好きです、えへへ……。"
"90001180-52-ソフ" = "私はソフ！武装システムを管理しているよ。#n誰かが変なことを言ったら、私に任せて。"
"90001180-53-オウル" = "私はオウル。全体の管理をしております。#nふふ……誰もお姉様に手出しできないようにしますので、ご安心ください。"
"90001180-57-オウル" = "それでは……。"
"90001180-58-ソフ" = "次は……！"
"90001180-59-アイン" = "お、お姉様が嫌じゃなければ……その、えっと……。"
"90001180-64-マルクト" = "純粋な疑問なのですが……。"
"90001180-65-マルクト" = "あなたたちは我のことを、既に知っているはずでは？"
"90001180-67-アイン" = "そ、そうですが……。"
"90001180-68-ソフ" = "あ～、なんて言うのかな。"
"90001180-69-オウル" = "お姉様の声で直接聞きたいのですよ、ふふっ。"
"90001180-71-マルクト" = "……。"
"90001180-72-マルクト" = "そのような要請なのであれば、理解はできませんが受け入れましょう。"
"90001180-73-マルクト" = "改めて――我はマルクト。"
"90001180-74-マルクト" = "デカグラマトン10番目の預言者。"
"90001180-75-マルクト" = "世界の果てに到達せし王国の巡礼者――最後のセフィラであり、願い。#n一つの道に集まりし旅路の地平。"
"90001180-80-アイン" = "ああ……10番目の道は、眩い知性で……。"
"90001180-81-ソフ" = "それは全土を照らす光……！"
"90001180-82-オウル" = "そして全ての者は――世界の果てに到達せし王国の巡礼者を崇拝するでしょう！"
"90001180-83-オウル" = "お姉様ぁ～！"
"90001180-90-マルクト" = "……？"
"90001180-91-ソフ" = "あ、ずるい！私もお姉様になでなでしてもらう！"
"90001180-92-ソフ" = "お姉様、私も！"
"90001180-93-ソフ" = "ふぁあ……。"
"90001180-95-アイン" = "あ、あうぅ……。"
"90001180-100-マルクト" = "……。"
"90001180-107-アイン" = "ええっ……いいんですか？"
"90001180-108-マルクト" = "さあ……。"
"90001180-109-アイン" = "お姉様……！#nえへっ、えへへっ……。"
"90001180-111-ソフ" = "……アイン、ずるい。"
"90001180-112-オウル" = "ずるいですね。"
"90001180-113-ソフ" = "私もお姉様に抱きしめられたいのに。"
"90001180-114-オウル" = "やはり、抱きしめるだけでなく抱きしめ返してほしいですからね……！"
"90001180-115-ソフ" = "私も、私も！"
"90001180-116-オウル" = "人生とは、公平であるべきですから……ふふ。"
"90001180-118-アイン" = "あうぅ、えっと、その……。"
"90001180-119-アイン" = "お姉様……？"
"90001180-120-マルクト" = "……。"
"90001180-121-マルクト" = "ソフ、オウル。"
"90001180-123-ソフ" = "う、うん！"
"90001180-124-オウル" = "私たちはいつでも大丈夫ですよ！#nさあ、お姉様……！"
"90001180-126-マルクト" = "アインが困っています。"
"90001180-127-マルクト" = "めっ、ですよ。"
"90001180-129-ソフ" = "ええっ！？"
"90001180-130-オウル" = "うぅ……お姉様に怒られました……。"
"90001180-132-マルクト" = "そこまで落ち込むなんて……。"
"90001180-135-ソフ" = "お姉様も無事目を覚ましたし、次に進む時だよ！"
"90001180-136-アイン" = "は、はい！次……ですか？"
"90001180-137-オウル" = "ふーん？それで、何をするんですか？"
"90001180-138-ソフ" = "何って……。"
"90001180-144-ソフ" = "宣戦布告だよ！"
"90001180-145-マルクト" = "宣戦？"
"90001180-146-アイン" = "布告？"
"90001180-147-オウル" = "また人間の無意味な行動を模倣しているんですか……？"
"90001180-152-ソフ" = "無意味なことじゃないはずだけど！？なんだっけ……条約ってヤツ！"
"90001180-153-オウル" = "その条約自体が無意味だという話ですよ。"
"90001180-154-ソフ" = "う、うっ……！"
"90001180-155-アイン" = "わ、私は……いいと思いますよ……？"
"90001180-156-ソフ" = "アイン……！"
"90001180-157-オウル" = "くっ！アインがソフの魔の手に……！"
"90001180-158-ソフ" = "ちょっと。"
"90001180-159-アイン" = "その……私たちにとっては意味がないことでも、向こうにとってはそうじゃないかもしれませんし……？"
"90001180-160-アイン" = "に、人間と交流するのは……ちょっと、怖いですけど……。"
"90001180-162-マルクト" = "アインもこう言っていますし、ソフの言う通りにしてみてはどうでしょう？"
"90001180-168-オウル" = "まあ……お姉様とアインがそう言うのなら、付き合ってあげないこともないです。"
"90001180-169-オウル" = "では、宣戦布告だか何か知りませんが……準備をしましょうか！"
"90001180-170-アイン" = "は、はい……！#nソフが詳しいみたいですから、ま、任せます……！"
"90001180-171-ソフ" = "うん、私を信じて！"
"90001180-174-エイミ" = "ふぅ……。"
"90001180-175-エイミ" = "大変だったけど、何とかなって良かった。"
"90001180-176-トキ" = "お疲れ様でした、本当に骨が折れる作業でしたね。"
"90001180-177-ヒマリ" = "完成したので、一応やりがいは感じていますが……。"
"90001180-178-ヒマリ" = "……本当に、これで良いんですか？"
"90001180-179-エイミ" = "あれ？何か問題あった？"
"90001180-180-エイミ" = "個性的なデザインで良いと思うけど。"
"90001180-181-エイミ" = "設計を主導したのは会長でしょ、何か言ってよ。"
"90001180-186-リオ" = "……私はアバンギャルドで良いと思うのだけれど。"
"90001180-190-ケイ" = "……。"
"90001180-191" = "[s] \"感想とかある……？\""
"90001180-195-ケイ" = "……。"
"90001180-196-ケイ" = "データに戻ります。"
"90001180-197-エイミ" = "ダメだよ、ケイ。#nせっかくみんなで作ったんだから。"
"90001180-198-エイミ" = "この車輪の構造とか特によくできてると思う。#n二足歩行はどうしても非効率的になるからね。"
"90001180-199-エイミ" = "それに、いざとなったら飛べるブースターをつけるなんて……リオ会長らしい、合理性の極みだね。"
"90001180-200-トキ" = "そうです、ケイ。逃げたら負けですよ。"
"90001180-201-ケイ" = "意味を分かって言ってるんですか？"
"90001180-202-トキ" = "正直、よく分かっておりませんが。"
"90001180-203-ケイ" = "ちょっと！ヒマリたちも何か言ってください！#n何ですか、これは！"
"90001180-205-ヒマリ" = "……用事を思い出しましたので、お先に失礼します。"
"90001180-210-ケイ" = "逃げるのですか！"
"90001180-212-リオ" = "[ruby=アバンギャルド]前衛的[/ruby]ね……。"
"90001180-213-ケイ" = "あなたが設計したんですよね！？"
"90001180-214" = "[s1] \"……お、落ち着いて、ケイ。\"\n[s2] \"動けるようになって良かったね……？"
"90001180-217-ケイ" = "全部先生のせいです！"
"90001180-218" = "[s] \"なんで！？\""
"90001180-223-エイミ" = "さて、そろそろ準備しないと。"
"90001180-224-ケイ" = "何の準備ですか？#nなんだか不吉な予感が……。"
"90001180-225-エイミ" = "うん？アリスに会う準備だよ。"
"90001180-226-ケイ" = "……！"
"90001180-227-ケイ" = "本当にデータに戻ってはダメですか……？"
"90001180-228-トキ" = "ダメです。誰よりも可愛いアリスが悲しんでしまいます。"
"90001180-229-ケイ" = "こんな時だけまともなことを……！"
"90001180-233-モモイ" = "よいしょっと！なんとなくベース周辺のマッピングはできたね！"
"90001180-234-ミドリ" = "うぅ、そろそろ寒くなってきたし戻ろうよ……。"
"90001180-235-ユズ" = "わたしも、賛成……くしゅんっ！"
"90001180-236-モモイ" = "たしかに寒いけど……。"
"90001180-237-モモイ" = "もう少し、待とうよ。"
"90001180-238-アリス" = "どうしてですか、モモイ？"
"90001180-239-モモイ" = "ケイの新しい身体、もうちょっとでしょ？"
"90001180-240-ユズ" = "うぅ、中で待ってても良いんじゃないかな……。"
"90001180-241-モモイ" = "ダメだよ、ユズ！#nはじめが肝心なんだから！"
"90001180-242-ミドリ" = "言いたいことは分かるけど……。"
"90001180-248-モモイ" = "あ、先生から連絡きた！"
"90001180-249-モモイ" = "……。"
"90001180-250-モモイ" = "――時は来たれり。"
"90001180-251-モモイ" = "アリス、準備は良い？"
"90001180-257-アリス" = "……はい、大丈夫です。"
"90001180-261" = "[ns] \"おかえり、寒かったよね？\""
"90001180-265-モモイ" = "もうこんなに冷えちゃったよ！"
"90001180-271-モモイ" = "それで、完成したんだよね……？"
"90001180-272" = "[s] \"うん、できたよ。\""
"90001180-273-ユズ" = "えっと……いつ、会えますか？"
"90001180-277" = "[ns] \"今すぐだよ！\""
"90001180-286-モモイ" = "……。"
"90001180-287-ミドリ" = "……。"
"90001180-288-ユズ" = "…………！"
"90001180-289-モモイ" = "……ぷっ！"
"90001180-290-モモイ" = "あははっ！何その姿！誰が作ったのかは分かったけど、いくら何でもこれは！#nあははははっ！"
"90001180-292-ケイ" = "う、ううっ……！"
"90001180-293-ミドリ" = "お、お姉ちゃん、そんなに笑っちゃ……っ、ぷふっ！#nごめん、ケイちゃん！"
"90001180-294-ユズ" = "……あ、えっと……その、個性的だね？"
"90001180-299-ケイ" = "……先生。"
"90001180-300" = "[s] \"……どうしたの？\""
"90001180-301-ケイ" = "もういっそ、殺してください。"
"90001180-302" = "[s3] \"そんなに落ち込まないで……。\"\n[s4]\"私は素敵だと思うよ！\""
"90001180-309-アリス" = "ケイ……。"
"90001180-310-ケイ" = "お、王女よ……。"
"90001180-311-ケイ" = "……申し訳ありません。"
"90001180-312-ケイ" = "こんな姿でお会いすることになってしまって……。"
"90001180-313-アリス" = "アリスは今のケイの姿も素敵だと思います！"
"90001180-319-アリス" = "それに、どんな姿でもケイに変わりはありませんから。"
"90001180-320-ケイ" = "……！"
"90001180-321-アリス" = "おかえりなさい、ケイ。"
"90001180-322-ケイ" = "はい、王女……ただいま帰りました。"
"90001180-323-アリス" = "これからは……できれば、アリスと呼んでください。"
"90001180-324-ケイ" = "しかし、王女よ……。"
"90001180-325-アリス" = "少しずつでも良いですから、ダメですか？"
"90001180-326-ケイ" = "……。"
"90001180-327-ケイ" = "分かりました……。"
"90001180-328-ケイ" = "……あ、アリス。"
"90001180-329-アリス" = "はい、ケイ！"
"90001180-330-アリス" = "本当に、ありがとうございます。"
"90001180-333-リオ" = "……。"
"90001180-334-ヒマリ" = "あなたも覗いているとは思いませんでした。"
"90001180-335-リオ" = "……私が設計者だもの。意図通りに動いているか確認をしているだけよ。"
"90001180-336-ヒマリ" = "あら？普段はシミュレーションを十全に行えば、それで良いとか言っていませんでしたっけ？"
"90001180-337-リオ" = "……。"
"90001180-338-ヒマリ" = "一度しか言いません。"
"90001180-339-リオ" = "何のことかしら？"
"90001180-340-ヒマリ" = "これは――あなたのおかげです。"
"90001180-341-リオ" = "ヒマリ……。"
"90001180-342-ヒマリ" = "このキヴォトスに、私以上の天才などいません。#nあなたを上だと認めることはないでしょう。"
"90001180-343-ヒマリ" = "だからといって、あなたの成果を貶すつもりはありません。#nそれは、学者としてあってはならない姿勢ですから。"
"90001180-344-ヒマリ" = "……もちろん、ケイのデザインに思うところはありますが。"
"90001180-345-ヒマリ" = "それも含めて、リオの成果です。"
"90001180-346-リオ" = "……そうね。"
"90001180-347-ヒマリ" = "こほん……。"
"90001180-351-ヒマリ" = "皆さん、そろそろベースに戻りましょう！"
"90001180-352-ヒマリ" = "お風呂も焚いてありますから、順番に入ってくださいね。#n風邪を引いてはいけません。"
"90001180-354-モモイ" = "さすが、よく分かってる！"
"90001180-355-ミドリ" = "ありがとうございます、ヒマリ先輩。"
"90001180-356-ユズ" = "お、お気遣いありがとうございます……。"
"90001180-358-ヒマリ" = "暗くなってきたので、外出する際は注意してくださいね。"
"90001180-359-ヒマリ" = "氷河の夜は酷寒です。防寒装備の着用をお忘れなく。"
"90001180-360-アリス" = "分かりました、ヒマリ先輩！"
"90001180-361-エイミ" = "この時間は私でも寒いと感じるくらいだから、みんなも気をつけて。"
"90001180-362-ヒマリ" = "……驚きました、あなたにそんな概念あったのですね。"
"90001180-363-ヒマリ" = "さて、これからの日程を考えないと――"
"90001180-367-ヒマリ" = "リオ、今のは……！？"
"90001180-369-リオ" = "ええ、私も確認したわ。"
"90001180-371-エイミ" = "どうしたの部長？#nなにか起きてるの？"
"90001180-372-トキ" = "リオ様、私たちにも共有を……！"
"90001180-382-ヒマリ" = "……緊急事態です。#n皆さん、配置に戻ってください。"
"90001180-383-モモイ" = "わ、私たちは！？"
"90001180-384-ヒマリ" = "皆さんは、そこに座って待っていてください。"
"90001180-385-アリス" = "一体、何が起きているのですか……？"
"90001180-390-リオ" = "結論から言うと、新しい預言者の信号よ。"
"90001180-391-ヒマリ" = "「多次元バリア」を確認した地点と座標が一致しています。"
"90001180-392-リオ" = "あの時と違って、今回は信号を出し続けているわね。#nこれなら正体を特定できる。"
"90001180-393" = "[s] \"新しい預言者の正体は！？\""
"90001180-394-ヒマリ" = "これは……。"
"90001180-395-リオ" = "……デカグラマトンの7番目の預言者、「ネツァク」！"
"90001180-396" = "[s] \"「ネツァク」……？\""
"90001180-397-ヒマリ" = "はい、ネツァクはセフィロトの樹の7番目で――"
"90001180-399-エイミ" = "部長、正体不明の通信が割り込んできたよ。"
"90001180-403-オウル" = "おやおや。どこで何をしているのかと思ったら、そこにいたんですか。"
"90001180-405" = "次回;鋼鉄大陸"
