[translation]
"90001060-1" = "第6話;火花"
"90001060-6-ヒマリ" = "……。"
"90001060-7-エイミ" = "……。"
"90001060-12-トキ" = "？"
"90001060-17" = "[ns1] \"痕跡を辿ってきたけど……。\"\n[ns2] \"雪の上に……火山が？\""
"90001060-20-ヒマリ" = "暖かい……！"
"90001060-21-エイミ" = "暑い！"
"90001060-22-トキ" = "ちょうど良い気温かと。"
"90001060-27-ヒマリ" = "私にはまだ少し寒いくらいです。エイミがズレているんですよ。"
"90001060-28-ヒマリ" = "人間は本来、このくらいの……いえ、もっと高い気温が適温なのですよ。"
"90001060-29-エイミ" = "でも、暑いものは暑いよ。さっきまで涼しくてちょうど良かったのに。"
"90001060-33-エイミ" = "ダメだ、先生……私、ちょっと脱ぐね。"
"90001060-34" = "[s] \"待って、エイミ！落ち着いて！\""
"90001060-35-エイミ" = "なんで？人間は本来、寒さより暑さに弱い生き物なんだよ。"
"90001060-36-エイミ" = "暑いと熱中症になっちゃうし……。"
"90001060-37-エイミ" = "熱中症になったら、意識が[ruby=もうろう]朦朧[/ruby]として、[ruby=けいれん]痙攣[/ruby]、低血圧、脱水症状を起こしちゃうし……最悪の場合死に至ることだってある。"
"90001060-38-エイミ" = "その場合――死因の特定が難しくなるの。"
"90001060-39-エイミ" = "というか、暑いのを無理に我慢して作戦を続けるのは非合理的だよ。"
"90001060-40" = "[s3] \"熱中症に詳しいのはわかったけど……。\"\n[s4] \"でも少しだけ我慢して……。\""
"90001060-43-ヒマリ" = "……大変ですね、先生。"
"90001060-44-ヒマリ" = "え？私に同情される日が来るなんて、感無量？"
"90001060-45-ヒマリ" = "一体何を仰っているのですか？#n私ほど他人の心を自分のことのように理解でき――"
"90001060-46-ヒマリ" = "そっと寄り添える……清楚系病弱天才ハッカーかつ、優しくて万能で「全知」である美少女はいませんよ？"
"90001060-47-ヒマリ" = "この程度、息をするようにできますとも。ええ、簡単です。#n大事なことなので二度言いました。"
"90001060-51" = "[ns] \"……うんうん。ヒマリの言う通りだね。\""
"90001060-52-ヒマリ" = "表情と言動が一致してないように見えますが……？"
"90001060-56-エイミ" = "この辺りで途切れてるね。周囲を調べてはいるけど……。"
"90001060-57-ヒマリ" = "地形も状況も変わりましたからね。"
"90001060-58-ヒマリ" = "それに、あちこちで……。"
"90001060-66-トキ" = "機械が動いていますね。"
"90001060-67-エイミ" = "うん。地面を掘って、運んで……忙しそうだね。"
"90001060-68-ヒマリ" = "あれは……[ruby=しすいき]試錐機[/ruby]、でしょうか？"
"90001060-69-エイミ" = "試錐……資源探査のために地面に穴を掘ることだっけ？#nじゃあ、ここでも何かを採取してるのかな？"
"90001060-70-リオ" = "たしかに、火山地帯は様々な鉱石が存在する環境ではあるわね。"
"90001060-71-リオ" = "銅鉱石が採掘できることもあるし、活火山の近くで硫黄を採取できたりする。#nでも――"
"90001060-82-エイミ" = "会長！？"
"90001060-83-ヒマリ" = "ジャミングでしょうか！トキ？"
"90001060-85-トキ" = "はい。今、強力な妨害電波が周辺全域に放たれていることを確認しました。そして……。"
"90001060-90-トキ" = "……妨害電波の影響でしょうか、アビ・エシュフの調子が悪いです。"
"90001060-91-エイミ" = "大丈夫。こういう時はたいてい叩けば直るよ。"
"90001060-93-ヒマリ" = "え、エイミ！？"
"90001060-100-トキ" = "直らないですね。"
"90001060-101-エイミ" = "おかしいな……角度が悪かった？"
"90001060-102" = "[s] \"そういう問題じゃないと思う……。\""
"90001060-103-エイミ" = "そっか……。"
"90001060-104-トキ" = "仕方がありません。通常モードに移行します。"
"90001060-105-トキ" = "アビ・エシュフを、リオ様が用意してくださった臨時移動トレーラーに格納……。"
"90001060-106-トキ" = "……なんと。トレーラーもジャミングの影響で停止しているようです。#nそうなると私に残された方法は――"
"90001060-107-トキ" = "手動で、アビ・エシュフを解除するしかない、ということですか……。"
"90001060-109-エイミ" = "私も手伝うよ。"
"90001060-110-トキ" = "ありがとうございます。"
"90001060-116-ヒマリ" = "待ってください。今、どうにか動く機器で――"
"90001060-117-ヒマリ" = "この妨害電波は通常のレベルを遥かに超えているので、それを利用すれば……。"
"90001060-118-ヒマリ" = "見つかりました！あそこから放たれています。"
"90001060-128-エイミ" = "変な施設が見えるけど……レーダー基地？"
"90001060-129-トキ" = "それとも、この妨害電波を出している無線局でしょうか。"
"90001060-130-ヒマリ" = "とにかく……このジャミングを解決しなければ、私たちは一巻の終わりです。"
"90001060-131-エイミ" = "根拠は？"
"90001060-132-ヒマリ" = "このままではアビ・エシュフを使えなくなります。戦力不足は否めません。"
"90001060-133-ヒマリ" = "そして……これはあまり認めたくありませんが……。"
"90001060-134-ヒマリ" = "……。"
"90001060-135-ヒマリ" = "……リオのAMAS部隊とナビゲーションなしでいつまでもこの地域にいるのは、とても危険です。"
"90001060-136-ヒマリ" = "これはあくまで、皆さんの安全を考慮しての決断です。"
"90001060-137-エイミ" = "（まったく、会長のことになると素直じゃないんだから……）"
"90001060-138-トキ" = "ふむ……「リオ様が関わるとヒマリ部長は素直じゃなくなるんだから」と思っていますね、エイミ。"
"90001060-140-ヒマリ" = "！？！？"
"90001060-142-エイミ" = "私、そんな分かりやすいっけ？"
"90001060-143-トキ" = "いえ、言ってみただけです。"
"90001060-144-エイミ" = "そう……。"
"90001060-145" = "[s] \"とりあえず、行ってみようか。\""
"90001060-146-ヒマリ" = "ええ、そうしましょう。"
"90001060-147-トキ" = "私が先陣を切ります。"
"90001060-148-エイミ" = "部長も先生も、みんな気をつけてね。"
