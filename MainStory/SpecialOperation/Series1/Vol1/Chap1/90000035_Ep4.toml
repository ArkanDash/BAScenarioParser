[translation]
"90000035-2" = "PMCのデータベースを分析中……"
"90000035-7-エイミ" = "部長、何か使えそうなデータあった？"
"90000035-8-ヒマリ" = "……いえ、見事に空っぽですね。"
"90000035-9-エイミ" = "空っぽ？"
"90000035-10-ヒマリ" = "はい、ほとんど文字通りに。データベース内の全ての情報が暗号化されて、本社に送信した履歴だけがあります。"
"90000035-11-エイミ" = "セキュリティのためかな。でも、何でそんなことを？"
"90000035-12-ヒマリ" = "そうですね、かなり怪しいです。民間軍事会社がここまでセキュリティに気を遣うなんて……。"
"90000035-13-ヒマリ" = "……目標を、本社の方に変えましょうか。"
"90000035-14-エイミ" = "そっちは侵入しにくい、みたいなこと言ってなかった？"
"90000035-15-ヒマリ" = "そうですね、多少難易度は変わるでしょう。"
"90000035-20-ヒマリ" = "……「多少」の難易度ごとき、この美少女ハッカーにとっては無意味ですが。"
"90000035-21-エイミ" = "さすが部長。「美少女」は関係ないと思うけど。"
"90000035-22-ヒマリ" = "関係ありますとも、「美少女」は「天才」と相性が良いのです。"
"90000035-26-ヒマリ" = "さて、データの中身を見せていただくとしましょうか。"
"90000035-30-ヒマリ" = "……なるほど。"
"90000035-31-エイミ" = "あったね。"
"90000035-32-ヒマリ" = "はい……ビナーの戦闘記録、それもかなりの数の。"
"90000035-33-ヒマリ" = "PMCは発掘区域で、ビナーと戦っていた……いえ、このパターンは……"
"90000035-34-エイミ" = "ビナーが発掘区域に近づかないよう、PMCが防衛してた……みたいな？"
"90000035-35-ヒマリ" = "そうですね、一体これは……。"
"90000035-41-ヒマリ" = "……「発掘区域」そのものに関するデータ、やたらと厳重に守られてますね。初めて見るタイプのファイアウォール……"
"90000035-42-ヒマリ" = "新しい技術でしょうか、生意気ですね……楽しくなってきてしまいます。"
"90000035-43-ヒマリ" = "パターンそのものはワンタイムパスワード……乱数アルゴリズムですか。物理的に時間がかかるタイプですね。"
"90000035-44-ヒマリ" = "時間を稼ぎつつパターンを変える、と……なるほど。"
"90000035-45-ヒマリ" = "まあ4時間くらいで何とかなりそうです。"
"90000035-46-エイミ" = "……部長、とりあえずビナーを探さない？"
"90000035-47-ヒマリ" = "ですが、美少女ハッカー魂がですね……"
"90000035-48-エイミ" = "そっちは今の目標じゃないでしょ？「美少女」関係無いし。"
"90000035-49-ヒマリ" = "……。"
"90000035-50" = "[s]（しゅんってなっちゃった……）"
"90000035-53-ヒマリ" = "……そうですね。今はデカグラマトンの預言者を追いかけることが最優先。これは後日に……ううん……。"
"90000035-54-エイミ" = "（……往生際が悪いなぁ）"
"90000035-55-ヒマリ" = "分かりましたから、そんな目で見ないでください。仕方ないですねぇ。"
"90000035-56-エイミ" = "それはこっちの台詞。"
"90000035-63" = "[ns]（不思議な関係性だ……）"
"90000035-66" = "次回;「データ収集（４）ビナー」"
