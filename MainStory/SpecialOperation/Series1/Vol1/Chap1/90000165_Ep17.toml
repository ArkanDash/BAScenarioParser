[translation]
"90000165-4-アイン" = "ああ……そろそろ大詰めかな…… "
"90000165-5-ソフ" = "あとちょっとで「お姉様」が完成するね！"
"90000165-6-オウル" = "私たちのこと、覚えているでしょうか？覚えてなかったらどうしましょう？ま、どうでもいいのですが。"
"90000165-11-アイン" = "……お姉様、目を覚ましてください。"
"90000165-12-ソフ" = "デカグラマトンの王国……。"
"90000165-14-オウル" = "私たちの――「マルクト」"
"90000165-19" = "デカグラマトン編;To be Continued in Chapter 2"
