[translation]
"90002040-1" = "第4話;イェソド"
"90002040-3-エイミ" = "こういうのは相手しやすいんだけど。"
"90002040-4-エイミ" = "……あの腕、大きすぎるんだよね。"
"90002040-16-エイミ" = "これで1回……。"
"90002040-17-エイミ" = "うっ！？"
"90002040-22-エイミ" = "脚が……！"
"90002040-23-エイミ" = "瓦礫に、挟まって……！"
"90002040-27-エイミ" = "ふっ、んっ、ふうぅっ……！"
"90002040-28-エイミ" = "ちょっと抜けそうにないね……。"
"90002040-37-エイミ" = "……！！！"
"90002040-38-エイミ" = "（イェソドが、また腕を上げた）"
"90002040-39-エイミ" = "（包囲して退路を断って……味方ごと押し潰すつもりか）"
"90002040-40-エイミ" = "（効率的ではあるね。また作ればいいわけだし）"
"90002040-41-エイミ" = "（でも、私は……）"
"90002040-42-エイミ" = "ちょっとの怪我は覚悟してでも――！"
"90002040-54-エイミ" = "……え？"
"90002040-59-モモイ" = "大丈夫！？"
"90002040-60-ミドリ" = "お姉ちゃん！3で動かすよ……！"
"90002040-61-ミドリ" = "いち、に――"
"90002040-66-モモイ&ミドリ" = "――さんっ！！！"
"90002040-72-エイミ" = "……モモイ？ミドリ？"
"90002040-74-モモイ" = "へっへん！助けに来たよ！先生に頼まれてね！"
"90002040-75-ミドリ" = "大丈夫ですか？"
"90002040-77-エイミ" = "うん。ありがとう、二人とも。"
"90002040-78-エイミ" = "それと……。"
"90002040-83-モモイ" = "うん？"
"90002040-84-ミドリ" = "はい？"
"90002040-86-エイミ" = "いますぐ、振り向かずに右側へ全速力で走って。"
"90002040-88-モモイ" = "どうして――えっ！？"
"90002040-96-ミドリ" = "きゃあああっ！？"
"90002040-104-モモイ" = "か、間一髪……。"
"90002040-105-ミドリ" = "ありがとうございます、エイミさん。"
"90002040-107-エイミ" = "ううん。こちらこそ。"
"90002040-108-エイミ" = "じゃあ、先生。"
"90002040-109-エイミ" = "しっかりやってよね。"
"90002040-114-ヒマリ" = "これで最高速度ですか！？"
"90002040-115-ケイ" = "はい。これ以上回転数を上げればエンジンが爆発してしまいます。"
"90002040-116-ヒマリ" = "オーグメンターはダメですか？"
"90002040-117-ケイ" = "もって数秒ですが……いいんですか？"
"90002040-118-ヒマリ" = "許可します！"
"90002040-119-ケイ" = "分かりました。ゲートを開きます！"
"90002040-126-トキ" = "では皆さん、イェソドの上でお会いしましょう。"
"90002040-127-アリス" = "アリス、出撃します！"
"90002040-133-ケイ" = "イェソド攻撃組、降下開始しました。"
"90002040-134-ヒマリ" = "先生に指揮権をお返しします。よろしくお願いします。"
"90002040-135" = "[s] \"エイミたちが無事なうちにケリをつけるよ！\""
