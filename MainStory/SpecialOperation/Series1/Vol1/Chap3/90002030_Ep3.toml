[translation]
"90002030-1" = "第3話;出撃"
"90002030-2-リオ" = "では、状況を整理するわ。"
"90002030-3-ヒマリ" = "「分かった事」と「やるべき事」がありますが、どちらから聞きたいですか？"
"90002030-5-ケイ" = "では、分かった事から話してください。"
"90002030-7-リオ" = "私たちを襲撃してきた個体の詳細が見えてきたわ。"
"90002030-8-ヒマリ" = "モデル名は、[ruby=Labor]レイバー[/ruby]。"
"90002030-10-モモイ" = "れいばー……？"
"90002030-15-リオ" = "労働者という意味よ。このモデルの役割からして、適切な名前とも言えるわね。"
"90002030-16-ヒマリ" = "レイバーの種類は、私たちが把握した限りで3種類あるようです。"
"90002030-17-エイミ" = "現場で見たのだと……装甲みたいなのを纏った直方体のモデルがいたね。"
"90002030-18-アリス" = "とても頑丈でした！"
"90002030-19-トキ" = "そのモデルは「防御型レイバー」と名づけていいと思います。"
"90002030-20-リオ" = "次は、一目で分かるほど大きな砲を搭載したモデル。"
"90002030-22-ミドリ" = "デザインは惜しいですけど……「砲塔型レイバー」と呼べそうです。"
"90002030-23-ユズ" = "あ、あとは……2つのプロトタイプみたいな……#nちょっと小さいモデルもいました……。"
"90002030-25-ヒマリ" = "では、そのモデルは「基本型レイバー」と呼びましょう。"
"90002030-26-ヒマリ" = "一般的に、小さければ可愛く見えるものですが……#nこれはどうにもクモにしか思えなくて……。"
"90002030-27-リオ" = "クモが可愛くないと言うの？"
"90002030-28-ヒマリ" = "もちろん、美学は主観によるものです。あなたの美的センスが変わっていることも理解していますが……。"
"90002030-30-エイミ" = "部長も会長も、今はそれを話してる場合じゃないから。"
"90002030-31" = "[s] \"他にも分かった事はある？\""
"90002030-35-リオ" = "ええ。これが最も重要だと思うわ。"
"90002030-36-リオ" = "レイバーは周囲の無機物を、鋼鉄大陸に変化させることができるの。"
"90002030-37-トキ" = "それは、つまり……？"
"90002030-38-モモイ" = "じゃあ、レイバーが鋼鉄大陸を広げてたってこと？"
"90002030-39-ヒマリ" = "間違いではないと思います。"
"90002030-40-ヒマリ" = "レイバーの量産が始まったのは、ある程度まで鋼鉄大陸が構築されてから、と考えるのが妥当でしょう。"
"90002030-41-ヒマリ" = "レイバーが輸送船に近づいたのも、鋼鉄大陸に取り込もうとしていた可能性が高いと思われます。"
"90002030-42-リオ" = "すべてのレイバーを調べたわけじゃないから、可能性の域はでないのだけれど。#nただ、そもそも全部調べるなんて、現実的ではないわ。"
"90002030-43-リオ" = "気になるのは……#n鋼鉄大陸の内部構造をレイバーが再整備しているように見える点ね。"
"90002030-44-ミドリ" = "再整備……？"
"90002030-45-リオ" = "構造物の建築や、損傷した箇所の修復――"
"90002030-46-リオ" = "鋼鉄大陸の拡張過程で混入した無機物に対する同化作業などよ。"
"90002030-47-ユズ" = "あ、だから輸送船を……。"
"90002030-49-エイミ" = "うん、「分かったこと」は理解したよ。じゃあ、「やるべき事」は？"
"90002030-50-ヒマリ" = "口にするだけなら簡単ですが――"
"90002030-54-ヒマリ" = "――イェソドを突破する必要があります。"
"90002030-55" = "[s] \"……。\""
"90002030-56-リオ" = "現時点で判明している、9番目の預言者「イェソド」に関する情報を共有するわ。"
"90002030-57-リオ" = "不思議なことに、イェソドには原型となるものが存在しない。"
"90002030-58-トキ" = "それはどういう意味ですか？"
"90002030-59-リオ" = "例えばホドの場合、元々はミレニアムの通信ユニットAI「ハブ」だった。"
"90002030-60-リオ" = "コクマーは工作船で、ゲブラは無人探査機だったわね。"
"90002030-61-リオ" = "このように、AIシステムを基盤とする構造体が、そのAIごとデカグラマトンによってハッキングされることで、預言者に成ってきた。"
"90002030-62-リオ" = "唯一の例外と言えるのがビナーね。#n初めて目撃されたのは、数十年前のアビドス砂漠だったから。"
"90002030-63-ヒマリ" = "イェソドも、例外だと？"
"90002030-64-リオ" = "ええ。これは推測なのだけれど――"
"90002030-65-リオ" = "イェソドは、鋼鉄大陸がある程度構築された後に[ruby=・]作[/ruby][ruby=・]ら[/ruby][ruby=・]れ[/ruby][ruby=・]た[/ruby]のだと考えているわ。"
"90002030-68-リオ" = "そうでなければ、あれほど巨大なイェソドの信号を、今まで把握できなかった説明がつかないの。"
"90002030-69-ヒマリ" = "妥当な推理だと思います。"
"90002030-71-ヒマリ" = "そしてそれを真と置くならば……#nイェソドはとても純粋である、ということになります。"
"90002030-72-ヒマリ" = "目的のためだけに作られた、「最適化」された預言者……ですか。"
"90002030-73-リオ" = "……おそらくは。"
"90002030-74-リオ" = "あの巨大さと威力もまた、最適化の結果でしょうね。"
"90002030-76-ケイ" = "議論を深めるほど、打開策がなくなっていくような気がしますが……。"
"90002030-77-アリス" = "あ、アリスは……みんなは！きっと大丈夫です！"
"90002030-78-アリス" = "勇者は……冒険に出る前から怖気づきません……うわーん！"
"90002030-79" = "[s] （すでに怖がっているように見えるけど……）"
"90002030-81-エイミ" = "でも、弱点はあると思うよ。"
"90002030-82-ミドリ" = "そうなんですか……？"
"90002030-83-エイミ" = "あれ、壁の上からは動けないんじゃないかな。"
"90002030-84-ユズ" = "た、たしかに……#nゲームでも、超大型ボスは……簡単に移動できない、ものですから……。"
"90002030-85-エイミ" = "ゲームに例えるつもりはなかったけど……。"
"90002030-87-ヒマリ" = "ふふっ、今のは的を射ているかもしれませんよ。"
"90002030-88-ヒマリ" = "なんであれ質量がある以上、避けられないものがあります。"
"90002030-89-リオ" = "避けられないもの？#n……なるほど。"
"90002030-90-リオ" = "速度と耐久性の問題ね。"
"90002030-91-ヒマリ" = "そうです。#n質量の大きい物を動かすには、その分多くのエネルギーが必要となります。"
"90002030-92-ヒマリ" = "エネルギーさえあれば、素早く動かすこともできますが、動くより先に耐久性に限界がくるはずです。"
"90002030-93-ヒマリ" = "もちろん、謎の物質の強度や耐久性については、まだ不可解なことが多いです。"
"90002030-94-ヒマリ" = "とはいえ物質であるからには、必ず限界があると思います。"
"90002030-95" = "[s] \"つまり……？\""
"90002030-96-ヒマリ" = "要するに、こういうことです。"
"90002030-97-ヒマリ" = "イェソドの攻撃には、動きに制約があると予想されます。"
"90002030-98-ヒマリ" = "それを基に作戦を考えると――"
"90002030-99-リオ" = "――陽動を用いた短期決戦になるわね。"
"90002030-100-ヒマリ" = "……その通りです。"
"90002030-101-ヒマリ" = "イェソドの攻撃……より厳密に言えば「腕を振るう攻撃」は、脅威そのものです。"
"90002030-102-ヒマリ" = "とはいえ予想通りなら、動きは鈍いはず。"
"90002030-103-リオ" = "回避に専念すれば、チャンスを作ることができるかもしれない。"
"90002030-104-ヒマリ" = "大きさに物を言わせた、[ruby=・]面[/ruby]への影響力はいったん無視します。"
"90002030-105-ヒマリ" = "少なくとも、数回イェソドの注意を逸らすには十分かと。"
"90002030-106-ヒマリ" = "そして、その隙に本隊は輸送船で移動し――"
"90002030-107-ヒマリ" = "壁の上から、イェソドを奇襲するのです。"
"90002030-113-リオ" = "ヒマリ……この作戦を、[ruby=・]貴[/ruby][ruby=・]女[/ruby]が提案するのね。"
"90002030-114-ヒマリ" = "……[ruby=・]以[/ruby][ruby=・]前[/ruby][ruby=・]の[/ruby]あなたなら、相談もなく強行していたのでは？"
"90002030-115-リオ" = "今の貴女は、こんな作戦を私より先に提示するくらい――"
"90002030-116-リオ" = "――違うわね。それだけ、私たちが窮地に追い込まれているということ……。"
"90002030-117-ヒマリ" = "……時間がありません。"
"90002030-118-リオ" = "ええ……。"
"90002030-119" = "[s1] \"みんな、ちょっと待って。\"\n[s2] \"その作戦って……。\""
"90002030-122-ヒマリ" = "……。"
"90002030-123-リオ" = "そうよ。"
"90002030-124-リオ" = "これは、誰かを囮にしてイェソドを倒す作戦。"
"90002030-125-リオ" = "しかも囮の安全を保証できない上に、イェソドを必ず仕留められる確証もない。"
"90002030-126-リオ" = "つまり、極めて危険な作戦になる……ということよ。"
"90002030-127" = "[s3] \"私は……賛成できない。\"\n[s4] \"みんなの……先生として。\""
"90002030-130-リオ" = "でも、これ以上の手段が思いつかないの。"
"90002030-132-アリス" = "で、では……！アリスが……！"
"90002030-133-ケイ" = "……。"
"90002030-135-リオ" = "ダメよ、アリス。"
"90002030-136-アリス" = "どうしてですか？まだ見習いですが、アリスは勇者です！#nだから、みんなを――"
"90002030-137-リオ" = "そう。貴女が、勇者だからよ。"
"90002030-138-リオ" = "貴女はきっと、[ruby=・]切[/ruby][ruby=・]り[/ruby][ruby=・]札[/ruby]になる。"
"90002030-139-ケイ" = "……それには、私も含まれるのですよね？"
"90002030-140-リオ" = "……ええ。"
"90002030-141-ケイ" = "相変わらず、あなたは冷たく振舞うのですね。"
"90002030-142-リオ" = "……慣れているわ、こんなこと。"
"90002030-143-ケイ" = "私は、あなたのそういうところが嫌いです。"
"90002030-147-ケイ" = "我慢できないくらい……怒りが込み上げてくるんです……！"
"90002030-148-トキ" = "ケイはいつも怒っていませんか？"
"90002030-149-ケイ" = "それはそうですが……ああもう！そういう意味じゃないでしょう！"
"90002030-150-ケイ" = "これは別のベクトルで怒っているんです！火に油を注がないでください！！"
"90002030-151" = "[s] \"本当に……他の方法はないの？\""
"90002030-153-リオ" = "……。"
"90002030-154-ヒマリ" = "……。"
"90002030-155" = "（場の空気が重く沈み込んだ）"
"90002030-156" = "（それでも時間は容赦なく過ぎていく……）"
"90002030-161-？？？" = "じゃあ、私がやるよ。"
"90002030-165" = "[ns] \"！？\""
"90002030-166-ヒマリ" = "エイミ！？"
"90002030-171-エイミ" = "要は、注意を引けばいいんだよね？"
"90002030-173-モモイ" = "で、でも……！"
"90002030-174-ミドリ" = "エイミさん！先生も心配したように……！"
"90002030-176-エイミ" = "大丈夫。これが一番効率的だよ。#n「たぶん」なんて言葉が要らないくらい、明確に。"
"90002030-177-エイミ" = "現場のことは慣れてるし、私、結構頑丈で素早いんだ。"
"90002030-178-ユズ" = "で、でも……もしも上手くいかなかったら……！"
"90002030-179" = "[s5] \"エイミ、もう一度考え直してくれない……？\"\n[s6] \"私は……君たちが怪我するのを見たくないんだ……。\""
"90002030-182-エイミ" = "……。"
"90002030-190-ヒマリ" = "！？"
"90002030-191-リオ" = "！？"
"90002030-192" = "（そっと、エイミが抱きしめてきた）"
"90002030-193" = "[s] \"え、エイミ……？\""
"90002030-196-エイミ" = "やっぱり先生の身体……ぬるくていいね。"
"90002030-197-エイミ" = "大丈夫だよ、先生。"
"90002030-198" = "[s] \"でも……！\""
"90002030-199-エイミ" = "うん。分かってるよ。"
"90002030-200-エイミ" = "でも、大丈夫。#n私たちのことを考えてくれるなら――"
"90002030-201-エイミ" = "私たちを、信じて。"
"90002030-202-エイミ" = "先生が生徒を助けるのが当たり前なら、生徒が先生の力になりたいって思うのも、当然じゃない？"
"90002030-203-エイミ" = "そうだなぁ……私にもしものことがあったら――"
"90002030-204-エイミ" = "思いっきり先生のこと恨むから。一生責任とってね。"
"90002030-205-エイミ" = "じゃあ、行ってくる。"
"90002030-210" = "[ns] \"エイミ！\""
"90002030-213-ヒマリ" = "……作戦開始です。"
"90002030-214-リオ" = "ええ、取りかかりましょう。"
"90002030-215-リオ" = "エイミを無事に帰らせるために、私たちも覚悟を決めるべきだわ。"
"90002030-216-リオ" = "そうでしょう、先生？"
"90002030-217" = "[s] \"……やるべきことを、教えてほしい。\""
"90002030-224" = "[ns] \"では、各自持ち場へ。\""
"90002030-225-トキ" = "エンジンの修理状況を報告します。#n緊急離陸および緊急着陸、いずれも可能な状態です。"
"90002030-226-トキ" = "これより私は、格納庫へ移動し降下準備に入ります。"
"90002030-228-アリス" = "はい！アリスもトキについていきます！"
"90002030-229-ユズ" = "が、頑張ります……！"
"90002030-231-リオ" = "ヒマリ、あとは頼んだわ。"
"90002030-232-ヒマリ" = "……トキとアリスは、私たちの最大戦力であり切り札です。"
"90002030-233-ヒマリ" = "ユズは、こういった任務で意外な活躍を見せる可能性があります。"
"90002030-234-ヒマリ" = "ですが……リオ、あなたまで行く必要があるのですか？"
"90002030-235-リオ" = "……現場にも、戦術の指揮官が必要よ。"
"90002030-236-ヒマリ" = "それは、あなたの責任感や負い目からくる感情的な行動では？"
"90002030-237-リオ" = "……行ってくるわね。"
"90002030-244-ヒマリ" = "はぁ……#n最近、私の人望が失われているような気がするのですが、どう思いますか？"
"90002030-245" = "[s] \"みんな、ヒマリを信頼してるからだと思うよ。\""
"90002030-246-ヒマリ" = "ふふっ、そういうことにしておきましょう。"
"90002030-247-ヒマリ" = "さて、おしゃべりはこのくらいにして……始めましょうか。"
"90002030-248-ヒマリ" = "では、先生？"
"90002030-249" = "[s] \"作戦開始！\""
"90002030-250-ヒマリ" = "格納庫、聞こえますか？状況を教えてください。"
"90002030-256-トキ" = "ただいま格納庫に到着しました。ポッドに搭乗します。"
"90002030-257-トキ" = "アリス、手順は分かっていますね？"
"90002030-259-アリス" = "はい！もちろんです！"
"90002030-260-アリス" = "えっと……何から始めるんでしたっけ……？"
"90002030-261-ユズ" = "わ、わたしが教えてあげるね、アリスちゃん……。#nこれは、ゲームのマニュアルみたいなもので……。"
"90002030-263-トキ" = "ではユズ、アリスを頼みます。"
"90002030-266-リオ" = "降下準備完了。いつでもどうぞ。"
"90002030-267-ヒマリ" = "では――"
"90002030-268-ヒマリ" = "発進！"
"90002030-278-エイミ" = "本当、あり得ない大きさだね。"
"90002030-279-エイミ" = "さて。"
"90002030-280-エイミ" = "効率的にいこっか。"
"90002030-281-エイミ" = "まずは――"
"90002030-293-エイミ" = "――目の前の敵から。"
