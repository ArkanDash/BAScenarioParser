[translation]
"90002045-2" = "[ns] \"よっし！\""
"90002045-3-ケイ" = "イェソドの信号、極限まで弱まっています！"
"90002045-4" = "[s] \"やったか！？\""
"90002045-8-ケイ" = "ちょっ、そのセリフは――！！"
