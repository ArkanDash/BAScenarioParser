"90002045-55-エイミ" = "走って！"
"90002045-57-モモイ" = "また！？"
"90002045-58-ミドリ" = "お姉ちゃん早く！壁ができたら中に入れなくなっちゃう！"
"90002045-63-モモイ" = "ぜぇ、ぜぇ……！"
"90002045-64-ミドリ" = "はぁ、はぁ……！"
"90002045-65-エイミ" = "ジャンプして！"
"90002045-74-エイミ" = "二人とも、大丈夫？"
