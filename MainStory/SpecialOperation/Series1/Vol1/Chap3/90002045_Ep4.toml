"90002045-84-ミドリ" = "わあぁ……。"
"90002045-88-モモイ" = "す、すごい……。"
"90002045-89-ミドリ" = "夢の中みたい……。"
"90002045-95-エイミ" = "[ruby=いずみもと]和泉元[/ruby]エイミ、現場より報告。"
"90002045-96-エイミ" = "鋼鉄大陸の壁内に進入したよ。"
"90002045-98" = "次回;前進基地"
