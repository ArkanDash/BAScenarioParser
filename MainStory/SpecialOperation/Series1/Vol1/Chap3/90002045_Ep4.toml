"90002045-27-エイミ" = "ありがとう、先生。おかげで助かったよ。"
"90002045-30-ヒマリ" = "イェソド攻撃組、早く帰還してください！"
"90002045-31-ケイ" = "すでに回収を進めています。格納庫、聞こえますか？"
