[translation]
"901010800110-8-警備員A" = "ただいま。"
"901010800110-9-警備員B" = "遅かったじゃん。一人で門番するの退屈なんだよね。"
"901010800110-10-警備員A" = "ごめんって。思ったよりもドラム缶が重くてよ……運ぶのに時間がかかっちまった。"
"901010800110-11-警備員B" = "慣れないと転がすのも難しいもんな。"
"901010800110-12-警備員A" = "でも中に何も入ってないドラム缶を転がして港を歩き回って、一体何の意味があるんだ？"
"901010800110-13-警備員A" = "それも深夜にさ……騒音の苦情が来るんじゃないのか？"
"901010800110-14-警備員B" = "上の考えがうちらに分かるわけないだろ？"
"901010800110-15-警備員B" = "うちらみたいな末端は、言われた通り仕事をすりゃいいんだよ。"
"901010800110-20-ニコ" = "こちらFOX2。現在、ポイントウィスキーで待機中。"
"901010800110-21-ニコ" = "指定ポイントから離れたタンゴ2の復帰を確認。その他、特にないよ。"
"901010800110-25-クルミ" = "……あいつら何やってるの？夜中にドラム缶を転がすなんて。"
"901010800110-26-クルミ" = "まさか……あのドラム缶にカニや人が入っているんじゃないわよね？"
"901010800110-27-ニコ" = "そうは見えないよ。"
"901010800110-28-ニコ" = "倉庫を出てからすぐに戻ってきたし――"
"901010800110-29-ニコ" = "ドラム缶の音が軽すぎる。中に何か入っていたらもっと重たい音がすると思うよ。"
"901010800110-30-オトギ" = "深夜のトレーニングじゃないなら、何か理由があるんだろうね。"
"901010800110-32-ユキノ" = "FOX3、ターゲットを裏門方向へ誘導できるか？"
"901010800110-33-クルミ" = "任せて。鬼ごっこなら私の専門よ。"
"901010800110-34-ユキノ" = "FOX4は現場の管制を、FOX2はターゲットの注意が逸れた隙に倉庫内部へ進入するように。"
"901010800110-37-オトギ&ニコ" = "了解。"
"901010800110-43-警備員A" = "なんの音だ？"
"901010800110-44-警備員B" = "ネコとかカラスじゃない？"
"901010800110-45-警備員A" = "いや、足音が聞こえた気がする……。"
"901010800110-46-警備員A" = "確認しに行こう。"
