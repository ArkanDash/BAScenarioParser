[translation]
"90101090-1" = "第9話;SRT式尋問法"
"90101090-2" = "鐘崎港倉庫前"
"90101090-7-カルパッチョ構成員B" = "誰だ？"
"90101090-12-カルパッチョ幹部" = "私だよ。あんたらの[ruby=Capo]支部長[/ruby]だ。"
"90101090-13-カルパッチョ幹部" = "私の顔を忘れたわけ？"
"90101090-14-カルパッチョ構成員A&B" = "あっ、姐さん……失礼しました！"
"90101090-15-カルパッチョ幹部" = "はいはい。で、午後は何もなかった？"
"90101090-16-カルパッチョ構成員A" = "はい！私らがここを守ってる間、カニ一匹近寄りませんでした！"
"90101090-17-カルパッチョ幹部" = "まぁ、そりゃそうだ。#nカルパッチョ・ファミリーの縄張りをうろつくような怖いもの知らずなんて――"
"90101090-18-カルパッチョ幹部" = "――いや、最近ちょっと増えてきてる気もするけどね。"
"90101090-20-ニコ" = "すみません～デリバリーをお届けに来たのですが、入り口に誰もいなくて。"
"90101090-21-ニコ" = "外においておいたら悪くなっちゃうので、人を探しにここまで来てしまいました。"
"90101090-22-カルパッチョ幹部" = "本当か？正門の警備がここまで通したと？"
"90101090-23-ニコ" = "えっと……正門には誰もいませんでしたよ？"
"90101090-25-カルパッチョ幹部" = "チッ……カルパッチョ・ファミリーの格も、昔ほどじゃないってことか。"
"90101090-26-カルパッチョ幹部" = "ボスの信頼を取り戻すためにも、次の入札を落とすわけにはいかない……！"
"90101090-27-カルパッチョ構成員B" = "姐さん、何か心配事でも？"
"90101090-28-カルパッチョ幹部" = "いや、別に。"
"90101090-29-カルパッチョ幹部" = "それよりあんた達、昼の巡回当番じゃなかった？#nもう18時過ぎてるのに、なんでまだ倉庫に張り付いてるわけ？"
"90101090-30-カルパッチョ構成員A" = "あ、それが……。"
"90101090-31-カルパッチョ構成員B" = "夜の巡回だった連中が腹を壊しまして。"
"90101090-32-カルパッチョ幹部" = "弱っちい奴らね。何食ったらそうなるの？"
"90101090-33-カルパッチョ構成員B" = "なんとか寿司？だったような。#n昨日デリバリーで頼んだとかで。"
"90101090-34-カルパッチョ構成員A" = "それで今夜の巡回に穴が空いちまって、どうするか悩んでたとこです。"
"90101090-35-カルパッチョ幹部" = "こんのバカども……。"
"90101090-36-カルパッチョ幹部" = "私が来なかったら一晩中待つつもりだったの！？"
"90101090-37-カルパッチョ構成員A&B" = "す、すみません！"
"90101090-38-カルパッチョ幹部" = "寮に行ってサトウとスズキ連れてきな。今日は非番だから暇してるはずさ。"
"90101090-39-カルパッチョ幹部" = "休みは後でカポが埋め合わせするって言っときな。今日はちょいと頑張れって。"
"90101090-40-カルパッチョ構成員A&B" = "は、はい……！"
"90101090-46-カルパッチョ幹部" = "……何グズグズしてんの？"
"90101090-47-カルパッチョ構成員A" = "あ、どっちが行くかで悩んでまして。"
"90101090-48-カルパッチョ構成員B" = "いつもボスが言ってるじゃないですか。#n区画守る時は常に2人1組。持ち場を空けるなって。だから……。"
"90101090-49-カルパッチョ幹部" = "はぁ……ほんっと、手がかかるわね。"
"90101090-50-カルパッチョ幹部" = "じゃあ何？#n片方が呼びに行ってる間、もう片方はここで私と駄弁るつもりだったの？"
"90101090-51-カルパッチョ幹部" = "1分1秒でも早く連れてくるなら、2人で動いた方が早いに決まってんでしょ！"
"90101090-52-カルパッチョ幹部" = "それとも……いっちょ前に私の心配でもしてるわけ？"
"90101090-53-カルパッチョ構成員A&B" = "い、いえ！"
"90101090-54-カルパッチョ幹部" = "さっさと行って連れてきな！"
"90101090-59-カルパッチョ幹部" = "……はぁ。あんな間抜けを抱えて区画を回す羽目になるなんて。"
"90101090-60-？？？" = "あの……。"
"90101090-61-？？？" = "さすがに不意打ちされたら、カポでも危ないんじゃないですかね？"
"90101090-62-カルパッチョ幹部" = "は？いま、何て――"
"90101090-67-カルパッチョ幹部" = "――っぐ。"
"90101090-72-クルミ" = "多分あんたのボスは、こういう状況を心配してたんだろうけど。"
"90101090-75-クルミ" = "こちらFOX3。カルパッチョ・ファミリーの中間管理職を確保したわ。"
"90101090-76-オトギ" = "FOX4、了解。半径50m以内に他構成員の気配なし。"
"90101090-77-ユキノ" = "FOX1、了解。ターゲットは秘匿してポイントチャーリーへ移送。目撃者に注意しろ。"
"90101090-78-カルパッチョ幹部" = "何なんだ、よ……。"
"90101090-86-カルパッチョ幹部" = "うっ……うぅぅ……。"
"90101090-95-？？？" = "……意識、戻りました？"
"90101090-99-カルパッチョ幹部" = "ここは……どこだ。お前らは……？"
"90101090-100" = "鐘崎港外れの廃倉庫"
"90101090-104-ニコ" = "FOX1、ターゲットの意識が回復したよ。"
"90101090-108-ユキノ" = "横で騒音を出し続けた甲斐があったな。"
"90101090-109-ユキノ" = "では、尋問を始める。"
"90101090-114-カルパッチョ幹部" = "尋問……？ハッ、私をか？"
"90101090-115-カルパッチョ幹部" = "あんたら、見たことない制服だが――"
"90101090-116-カルパッチョ幹部" = "アランチーノ・ファミリーの差し金か？"
"90101090-117-カルパッチョ幹部" = "大人まで連れて、ずいぶん威勢がいいじゃないか。#nこんなことして、うちのボスが黙っちゃいないよ？"
"90101090-118" = "[s] \"え、えっと……。\""
"90101090-119-ユキノ" = "耳を貸す必要はありませんよ。"
"90101090-120-ユキノ" = "苦し紛れの脅しですから。"
"90101090-124-ユキノ" = "黙れ。お前に質問は許していない。"
"90101090-125-カルパッチョ幹部" = "はは、ずいぶん偉そうだね。"
"90101090-126-カルパッチョ幹部" = "いいよ、見せてもらおうか。何をしようが私は口を割らないけどね。"
"90101090-127-カルパッチョ幹部" = "組織を裏切るくらいなら、いっそカニの餌になった方が――"
"90101090-134-オトギ" = "FOX2。これ、発電機逝ってない？"
"90101090-135-オトギ" = "他にないの？ついでにもうちょっとパワフルなやつ。"
"90101090-136-カルパッチョ幹部" = "ま、待て！何をする気だ！？"
"90101090-137-オトギ" = "何って。さっき言ったでしょ？#n尋問。"
"90101090-138-オトギ" = "でも悪いけど、もう少し待ってくれる？#n配線がまだ途中なんだよね。"
"90101090-139-カルパッチョ幹部" = "そ、それで拷問しようってのか！？"
"90101090-142-カルパッチョ幹部" = "そんな残酷なこと……連邦生徒会が黙ってないぞ！"
"90101090-143-カルパッチョ幹部" = "お、お前らも聞いたことくらいあるだろ？#nD.U.で度を過ぎたことをすると、連邦生徒会長直属の特殊部隊が来るって……！"
"90101090-149-カルパッチョ幹部" = "逃げたってキヴォトスの果てまで追ってくるんだぞ……！#nお、お前ら、連邦生徒会長が怖くないのか！？"
"90101090-150" = "[s] \"あ、その特殊部隊なら……。\""
"90101090-151-クルミ" = "問題ないわ。話はつけてきたから。"
"90101090-152-オトギ" = "うんうん。ものすごーく誠実な「対話」をしてきたよ。"
"90101090-153-カルパッチョ幹部" = "あんたらが連邦生徒会長と直で話した？ホラも大概に――"
"90101090-154-オトギ" = "まぁまぁ。そんなに心配しなくていいよ。#n傷跡が残るようなことまではするつもりないし。"
"90101090-155-オトギ" = "この発電機は、サーバーを回すために持ってきただけ。#n人に使うためじゃないから。"
"90101090-156-カルパッチョ幹部" = "サーバー……？"
"90101090-160-ニコ" = "あなたのお名前は、タカハシさん。#nカルパッチョ・ファミリーのカポで、鐘崎港を警備するチームのリーダー……ですよね？"
"90101090-161-ニコ" = "構成員からは、血も涙もないと怖がられているみたいですけど、#n実は「可愛いもの集め」が趣味だとか――"
"90101090-162-カルパッチョ幹部" = "お、お前……どうしてそれを……！"
"90101090-163-ニコ" = "ご自身で全部書いているじゃないですか。「フルリンク」の裏アカに。"
"90101090-164-ニコ" = "もちろん、隠しているつもりだったようですが……。"
"90101090-165-ニコ" = "フォローしているアカウントと、タカハシさんの行動ルーティンを照らし合わせたら、#nすぐに特定できました。"
"90101090-166-ニコ" = "先月はウロミちゃんの限定ぬいぐるみを買いに、#nコーギータウンのポップアップストアにも行ってて……。"
"90101090-167-ニコ" = "あら。可愛い猫も一匹、飼ってるんですね。"
"90101090-168-カルパッチョ幹部" = "くっ……。"
"90101090-169-ニコ" = "さて。この裏アカをバラしたら……どうなるでしょう？"
"90101090-170" = "[s1] \"なんて恐ろしい発想なんだ……！\"\n[s2] \"怖い……怖すぎます……。\""
"90101090-173-カルパッチョ幹部" = "や、やめろ！そんなことをされたら私の威厳が――！"
"90101090-174-ニコ" = "であれば、質問に素直に答えた方がいいと思いますよ。"
"90101090-175-ニコ" = "「化け蟹」の噂を流した理由は何ですか？"
"90101090-176-カルパッチョ幹部" = "チッ……そこまで掴んでるのか。"
"90101090-177-カルパッチョ幹部" = "だが……私はボスの寵愛を受けるカポ。港の商人会が震える恐怖の――"
"90101090-178-オトギ" = "まだ分かってないみたいだねぇ。"
"90101090-179-クルミ" = "FOX1。さっき言われたやつ、持ってきたわよ。"
"90101090-180-クルミ" = "これでしょ？"
"90101090-181-ユキノ" = "……よし、ご苦労。"
"90101090-182-ユキノ" = "FOX3、交渉が決裂したらすぐカポの家に行け。これを飼い猫に食わせるんだ。"
"90101090-183-カルパッチョ幹部" = "なっ、何を食わせる気だ……！？"
"90101090-184-クルミ" = "「いなり社」のツナ味ウェットの缶。#n猫がどれだけ食いつくか……猫好きなら分かるわよね？"
"90101090-185-クルミ" = "知らない人から高級缶を差し出されたら……猫はどうすると思う？"
"90101090-186-カルパッチョ幹部" = "ま、まさか……。"
"90101090-187-クルミ" = "いつもの味気ないカリカリとは段違い。たまらず普段は見せないような甘え方をしたり――"
"90101090-188-クルミ" = "あ。[ruby=・]ま[/ruby][ruby=・]ず[/ruby][ruby=・]い[/ruby][ruby=・]餌[/ruby][ruby=・]し[/ruby][ruby=・]か[/ruby][ruby=・]く[/ruby][ruby=・]れ[/ruby][ruby=・]な[/ruby][ruby=・]い[/ruby][ruby=・]飼[/ruby][ruby=・]い[/ruby][ruby=・]主[/ruby]とは、ちょっと距離できちゃうかも？"
"90101090-189-カルパッチョ幹部" = "どうしてそんな残酷なことができるんだ！？"
"90101090-190-ユキノ" = "……残酷？"
"90101090-191-ユキノ" = "勘違いしているみたいだな。"
"90101090-192-ユキノ" = "私たちは人じゃない。「執念深くて残酷な狐」だ。"
"90101090-193-ユキノ" = "取引に応じないのなら、お前が想像している以上のことも平気でやる。"
"90101090-194-カルパッチョ幹部" = "ぐぅっ……！"
"90101090-195" = "[s3] \"みんな落ち着いて。\"\n[s4] \"相手が話す隙は残してあげよう？\""
"90101090-198-カルパッチョ幹部" = "大人……お前は誰だ？"
"90101090-199-カルパッチョ幹部" = "お前らにしたって、大人を連れてるってことは、ただのチンピラじゃないな。#n企業の人間か？"
"90101090-200" = "[s5] \"私はシャー……この子たちの保護者だよ。\"\n[s6] \"乱暴なやり方で連れてきてごめんね。\""
"90101090-203-カルパッチョ幹部" = "はっ、今さら謝られて誰が信じる？"
"90101090-204-カルパッチョ幹部" = "丸め込もうったって、腹の底は見え見えなんだよ。"
"90101090-205" = "[s7] \"私の顔を賭けて誓うよ。\"\n[s8] \"私たちはカルパッチョ・ファミリーの利権に、欠片も興味がない。\""
"90101090-208-カルパッチョ幹部" = "そんな言葉を信じ――"
"90101090-212-カルパッチョ幹部" = "……本当に、今回の入札には興味ないのか？"
"90101090-217-オトギ" = "お、先生が出ると一気に空気が柔らかくなるねぇ。"
"90101090-218-ユキノ" = "古典的だが、飴とムチは有効な戦略だ。先生が飴役とは想定外だったが。"
"90101090-219-ニコ" = "たぶん先生はそういう意図で宥めたわけじゃないと思うけど……。"
"90101090-224" = "[ns] \"私たちは、噂を流した理由が知りたいだけだよ。\""
"90101090-225-カルパッチョ幹部" = "恐怖を煽る理由くらい、大人なら分かるだろ。"
"90101090-230-カルパッチョ幹部" = "人間は感情が昂ると判断が鈍る。それが喜びでも、悲しみでも、恐怖でも……。"
"90101090-231-カルパッチョ幹部" = "感情が先に立てば理性的には考えられない。他人の言葉にも簡単に振り回される。"
"90101090-236-カヤ" = "このキヴォトスには、[ruby=・]恐[/ruby][ruby=・]怖[/ruby]が足りない。"
"90101090-238" = "[log=카야]このキヴォトスには、[ruby=・]恐[/ruby][ruby=・]怖[/ruby]が足りない。[/log]"
"90101090-240-カヤ" = "……ありったけの恐怖を見せれば、"
"90101090-244-カヤ" = "……ありったけの恐怖を見せれば、"
"90101090-245" = "誰もが私の言うことを聞くようになる。"
"90101090-247" = "[log=카야]……ありったけの恐怖を見せれば、誰もが私の言うことを聞くようになる。[/log]"
"90101090-249-カルパッチョ幹部" = "その中で最もコントロールしやすいのが「恐怖」だ。#n未知の存在は、とりあえず怖がるからな。"
"90101090-250-カルパッチョ幹部" = "そう、連邦生徒会長の特殊部隊みたいなもんだよ。#nいるかもしれない。それだけでチンピラどもは手を出しにくくなるだろ？"
"90101090-251-カルパッチョ幹部" = "本当に存在するか、何人捕まえたかなんて、重要じゃない。"
"90101090-255-ミヤコ" = "人々の恐怖の上に建てられた学園が……"
"90101090-257" = "[log=미야코]人々の恐怖の上に建てられた学園が……[/log]"
"90101090-261-ミヤコ" = "どうしてSRT特殊学園になれるというのですか？"
"90101090-263" = "[log=미야코]どうしてSRT特殊学園になれるというのですか？[/log]"
"90101090-265-ユキノ" = "………。"
"90101090-266-カルパッチョ幹部" = "組織を維持するために、似た手を借りただけだ。"
"90101090-267-カルパッチョ幹部" = "「怖い目にあいたくないなら、ウチの仕事に手を出すな」、ってな。"
"90101090-268-ユキノ" = "恐怖を植えつけるなら、他にも手段はあったはずだ。"
"90101090-269-ユキノ" = "わざわざ「カニ」の噂を選んだ理由は何だ？"
"90101090-270-カルパッチョ幹部" = "港で動く連中に馴染みがある怪談を見つけたから使っただけだ。"
"90101090-271-カルパッチョ幹部" = "「カルパッチョに逆らえばカニの餌。未知の恐怖に直面する」"
"90101090-272-カルパッチョ幹部" = "とはいえ、一番大事なのは誰も傷つかないってことだ。"
"90101090-273-カルパッチョ幹部" = "少し調べれば――いや、港で働く者ならすぐに分かる。#n[ruby=・]普[/ruby][ruby=・]通[/ruby][ruby=・]サ[/ruby][ruby=・]イ[/ruby][ruby=・]ズ[/ruby][ruby=・]の[/ruby][ruby=・]カ[/ruby][ruby=・]ニ[/ruby]に大した力は無い。"
"90101090-274-カルパッチョ幹部" = "だけど私らが相手にしてるのは不特定多数の一般人だ。"
"90101090-275-カルパッチョ幹部" = "鋭そうなハサミと硬そうな甲羅、そのイメージだけで恐怖を連想する。"
"90101090-276-カルパッチョ幹部" = "ただの噂話じゃあヴァルキューレは動かない。"
"90101090-277-カルパッチョ幹部" = "私らは形のない恐怖を利用しているだけだ。"
"90101090-278-カルパッチョ幹部" = "何も問題ないだろう？なにせ、誰も消えてないじゃないか。"
"90101090-285-ユキノ" = "……よくもまぁぬけぬけと。"
"90101090-289-ユキノ" = "多くの者が不安を抱き、入札が始まる前から勝者が決まってしまう。"
"90101090-290-ユキノ" = "どうして「問題がない」と言い切れる！？"
"90101090-291-カルパッチョ幹部" = "な、なんだよ急に。何か地雷踏んだか？"
"90101090-294" = "[ns] \"ユキノ、落ち着いて。\""
"90101090-295-ユキノ" = "ですが、私は――"
"90101090-301-オトギ" = "ん？何の音？"
"90101090-302-クルミ" = "なんか「カチカチ」してる？"
"90101090-303-クルミ" = "昆虫とか、節足動物が動く時みたいな……。"
"90101090-304-オトギ" = "……ゴキブリが大量発生してるとか？"
"90101090-305-クルミ" = "ゾッとすること言わないで！#nゴキブリがこんな音出すわけないでしょ！？"
"90101090-306-クルミ" = "ていうか、この揺れなに？近くで重機でも使ってるわけ？"
"90101090-307-ニコ" = "この時間に工事の予定があるなんて聞いてないよ。"
"90101090-308-ニコ" = "……それに、音がどんどん大きくなってる。"
"90101090-309-ユキノ" = "先生、下がってください。"
"90101090-313-ユキノ" = "……来ます。"
"90101090-314" = "[s] \"な、何が……？\""
"90101090-320-カルパッチョ幹部" = "なんだよアレ――！？"
