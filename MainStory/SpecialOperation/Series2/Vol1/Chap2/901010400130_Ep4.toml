[translation]
"901010400130-11-ニコ" = "……こんにちは！"
"901010400130-15-漁師A" = "……っ！"
"901010400130-16-漁師A" = "驚かせやがって……手元が狂ったらどうするんだ。"
"901010400130-17-ニコ" = "すみません。ビッグニュースをお伝えしたくて、つい。"
"901010400130-22-漁師B" = "……ビッグニュース？"
"901010400130-24-ニコ" = "はい。夕方になったら小腹が空いてきますよね？#nそんな皆さんのために――"
"901010400130-25-ニコ" = "お得なプロモーションをご用意してきました！"
"901010400130-26-ニコ" = "今「FOX EATS」で開催中のアンケート調査にご協力いただくと――"
"901010400130-30-ニコ" = "有名いなり寿司店「吉野いなり」のお弁当を無料でプレゼントします！"
"901010400130-31-ニコ" = "この機会にいかがでしょう？"
"901010400130-33-漁師A" = "……怪しいな。"
"901010400130-34-漁師B" = "無料のお弁当……何か企んでいるのか？"
"901010400130-36-ニコ" = "もちろん食べて頂くためのアンケートには、条件がいくつかありまして……。"
"901010400130-37-ニコ" = "このアンケート調査は「FOX EATS」の製品およびサービス向上のため使用され、特定製品に関する調査および広報を目的として第3者に提供される可能性があります。調査結果は調査時点から36ヶ月間保存され、内容に異議がある場合は「FOX EATS」のお客様相談窓口へ――"
"901010400130-39-漁師A" = "……もういい、分かった。"
"901010400130-40-漁師A" = "はぁ……またどこぞのマーケティング企業が余計なことにお金を使っているようだな。"
"901010400130-41-漁師B" = "まあ、食べ物に罪はないが。"
"901010400130-42-漁師B" = "ちょうどお腹も減ってたところだし。"
"901010400130-43-漁師A" = "どれ……。"
"901010400130-49-漁師B" = "おお、これは中々……。"
"901010400130-50-漁師B" = "旨い！米がふっくらしていて、油揚げも厚みがあって……気に入った。"
"901010400130-51-漁師A" = "一つ気になるのは……。"
"901010400130-53-ニコ" = "何かありましたか？"
"901010400130-54-ニコ" = "ご意見はいつでも大歓迎です！"
"901010400130-55-漁師A" = "……この具は、カニカマか？"
"901010400130-56-漁師A" = "こんなに美味いおいなりさんなのに、カニカマを使うなんて、勿体ないな。"
"901010400130-60-ニコ" = "ですが、「本物のカニ」はすごく高いので……。"
"901010400130-61-ニコ" = "カニのような高級食材を使っては、お弁当の利益が――"
"901010400130-62-漁師A" = "いつの話をしてるんだ？カニの値段が底値まで下がって数ヶ月経ってるんだぞ。"
"901010400130-64-漁師B" = "ああ……あまりにも安くなりすぎちまった。#n最近は漁に出る回数を減らすか悩んでるくらいでな。"
"901010400130-66-ニコ" = "そうなんですか？市場やスーパーでは、まだ高いみたいですが……。"
"901010400130-67-漁師A" = "信じられないなら、あっちの物流倉庫を見てみな。#n出荷されてないカニが山ほど残っとる。"
"901010400130-68-ニコ" = "なるほど……ありがとうございます。#nいただいたフィードバックは、お店に伝えておきますね。"
"901010400130-69-ニコ" = "あ、そうだ。もう一つお伺いしたいことがあるのですが。"
"901010400130-70-ニコ" = "――「ドラム缶ガニ」について、何かご存知ですか？"
"901010400130-71-漁師A" = "ドラム缶ガニ……？カニをドラム缶に入れて輸送する業者がいるのか？"
"901010400130-73-漁師B" = "他は知らんが、うちは木箱に入れて納品するんだ。#n物流倉庫に行けば分かると思うぞ。"
"901010400130-74-ニコ" = "はい！ご協力いただき、ありがとうございました。"
"901010400130-75-ニコ" = "よい一日を！"
