[translation]
"42090-1" = "第9話;D.U.の新しい朝"
"42090-2" = "（翌朝、子ウサギ公園前）"
"42090-6-自動音声" = "<市民の皆様にお知らせします。#n 本日午前0時より、新たな行政命令が施行されます。>"
"42090-7-自動音声" = "<市民の皆様は連邦生徒会のホームページ、もしくは各地域の行政機関に告示された内容をご確認ください。治安機関からの検問要請があった場合には、ご協力をお願いします。>"
"42090-8-自動音声" = "<……行政命令を認知していない、もしくは検問に応じなかった場合に#n生じる不利益に関して、連邦生徒会は責任を負いません。>"
"42090-9-自動音声" = "<繰り返し市民の皆様にお知らせします。本日午前0時より、新たな行政命令が……>"
"42090-10-サキ" = "……一体何がどうなっているんだ？"
"42090-11-モエ" = "さあね、こっちが聞きたいくらいだよ。"
"42090-12-モエ" = "一応連邦生徒会のホームページは見たけど、#n小難しい話ばかりで何が何だかサッパリだし……。"
"42090-13-ミユ" = "先生は大丈夫かな……？#n昨日、連邦生徒会に呼ばれてたよね……。"
"42090-15-ミヤコ" = "きっと大丈夫でしょう。#nサンクトゥムタワーに大きな変化はありませんでしたし……。"
"42090-16-ミヤコ" = "それに、今優先しなければならないのは、市街地で起きている出来事です。"
"42090-17-サキ" = "ああ。さっきの放送もだが、朝から武装兵を乗せた車や装甲車が市街地に向かっているのも気になるな。"
"42090-18-サキ" = "まさかまたクーデターでも起こるのか？"
"42090-19-モエ" = "でも、それにしては静かすぎるんだよねぇ。"
"42090-20-ミユ" = "状況を確認しようにも、この公園からじゃ市街地の様子はわからないし……。"
"42090-26-ミヤコ" = "……キャンプを離れ、市街地の様子を確認しに行きましょう。"
"42090-27-ミヤコ" = "みなさん、偵察用の装備と弾薬を用意してください。#n準備が終わり次第、目的地へ向かいます。"
"42090-28-ミユ" = "何も起こってないといいんだけど……。"
"42090-32-モエ" = "ねえ、あいつらカイザーコーポレーションの特殊部隊じゃない？"
"42090-33-サキ" = "どうして企業の兵が街中にいるんだ……？"
"42090-35-カイザーセキュリティガード" = "市民の皆様にお知らせします。本日から施行された行政命令により、子ウサギタウンを含む47の行政区域の治安維持業務は、カイザーセキュリティに移管されました。"
"42090-36-カイザーセキュリティガード" = "これは連邦生徒会代行の許可を受けた業務です。#nカイザーセキュリティは行政命令に従い、公正に業務を遂行することをお約束します。"
"42090-37-カイザーセキュリティガード" = "市民の皆様のご理解とご協力をお願い申し上げます――"
"42090-39-市民" = "やばい、遅刻だ遅刻！"
"42090-43-市民" = "ああ、何で今日に限って信号が変わるのが遅いんだ！"
"42090-44-市民" = "このままじゃほんとに遅刻するぞ……。"
"42090-45-市民" = "……車も来てない。今なら――"
"42090-47-カイザーセキュリティガード" = "そこのお前、止まれ！"
"42090-48-市民" = "えっ！？わ、私ですか……？"
"42090-49-カイザーセキュリティガード" = "そう、お前だ。"
"42090-50-カイザーセキュリティガード" = "今、赤信号なのに横断歩道を渡ろうとしただろう。"
"42090-51-市民" = "そ、それは……約束の時間に遅れそうになって、思わず……。"
"42090-52-市民" = "すみません！ですが今回だけは、見逃していただけませんか……？"
"42090-53-カイザーセキュリティガード" = "ダメだ！ルールは皆に公平に適応されなければならない！"
"42090-54-カイザーセキュリティガード" = "連邦生徒会の規定を無視し、#n交通システムを撹乱しようとした代償として――"
"42090-56-カイザーセキュリティガード" = "10万円を徴収する！"
"42090-58-市民" = "じゅ、10万円！？#nちょっと信号無視しただけなのに！？"
"42090-59-市民" = "いや、もちろん悪いのはわかっていますが、こんなのあまりにも――"
"42090-60-カイザーセキュリティガード" = "……今の言葉、連邦生徒会に対する反抗と捉えていいな？"
"42090-61-カイザーセキュリティガード" = "――この者を、内乱助長の罪で緊急逮捕する！"
"42090-62-市民" = "そ、そんなバカなぁぁあああ！！"
"42090-64-老人" = "ええと、このボタンは……なんじゃったかのう？"
"42090-65-カイザーセキュリティガード" = "あそこのATM……どうしてあんなに混んでいるんだ？"
"42090-66-カイザーセキュリティガード" = "おい、そこのお前！何をぐずぐずしている？"
"42090-67-老人" = "ヒッ……！ま、待っておくれ。機械の操作が難しくて……。"
"42090-68-老人" = "この歳になると、お金を下ろすのにも時間がかかってしまってのう……。"
"42090-69-カイザーセキュリティガード" = "言い訳は聞かん！後ろの列が見えないのか！？"
"42090-71-カイザーセキュリティガード" = "長時間だらだら居座るな！#n誰もが利用する公共施設を独占するんじゃない！"
"42090-72-老人" = "うぅ……どうしてこんな……。"
"42090-77-カイザーセキュリティガード" = "おい、その手に持っているのはなんだ。"
"42090-78-市民1" = "……え？ただの手榴弾ですが……。"
"42090-79-カイザーセキュリティガード" = "手榴弾だと？"
"42090-80-カイザーセキュリティガード" = "ピンを抜いて投げるだけで多くの被害を生み出す危険な火器を公然と持ち歩くなど……。"
"42090-81-カイザーセキュリティガード" = "貴様、テロでも起こすつもりだな！"
"42090-82-市民1" = "ちょ、ちょっと待ってください。#n手榴弾の携帯が禁止されてるなんて話、聞いたことないですよ！？"
"42090-83-市民1" = "そもそも手榴弾なんて、キヴォトスじゃ日用品みたいなものでしょう！？"
"42090-84-カイザーセキュリティガード" = "D.U.管轄区域内で100g以上の爆薬が含まれた火器を許可なく持ち歩くことは本日午前0時より禁止されている！"
"42090-86-カイザーセキュリティガード" = "やつをテロ未遂で逮捕しろ！"
"42090-87-市民1" = "ううっ……こんなの理不尽すぎる……！"
"42090-89-モエ" = "あっちでも逮捕、こっちでも逮捕……逮捕祭りだねぇ。"
"42090-90-モエ" = "にしても、手榴弾の持ち歩き禁止ってなに？#nそんな規則があるなんて一度も聞いてないんだけど！"
"42090-91-サキ" = "行政命令で告示されていた内容だ。#n他にも治安や統制に関する規則が追加されている……。"
"42090-92-サキ" = "だが、どうしてヴァルキューレではなく#nカイザーコーポレーションが治安維持業務を行っているんだ？"
"42090-93-サキ" = "やつらはこの前のクーデターで捕まったんじゃなかったのか？"
"42090-95-ミヤコ" = "それに犯罪防止のためだとしても、#n市民を連行して不安を煽るのは正しいと思えません。"
"42090-96-ミユ" = "でも……今日の市街地はやっぱりなんだか静かだね……。"
"42090-97-モエ" = "たしかに～いつもだったら、銃を乱射したり爆弾を投げたりするやつが一人や二人はいるからねぇ。"
"42090-99-サキ" = "銃や爆弾を出そうものならすぐに捕まるこの状況で、#n暴れようとするバカはいなかったみたいだな。"
"42090-100-ミヤコ" = "（……何だか、変な気分です）"
"42090-101-ミヤコ" = "（誰もが規則を守り、法によって正義が実現された社会なのに……#nまったく安心できないなんて）"
"42090-102-ミヤコ" = "（これが私の夢見ていた正義の姿なのでしょうか……？）"
"42090-104-カイザーセキュリティガード" = "おい、そこのお前。身分を明かせ。"
"42090-106-？？？" = "おやおや……私たちをご存じでないと？"
"42090-107-？？？" = "[ruby=せいひん]清貧[/ruby]な人生を追求する者なら誰でも知っているというのに……。#n皆さんはそれとは縁遠い日々を送ってきたようですね。"
"42090-111-デカルト" = "私の名はデカルト。#n清貧のための求道の会――「所有せずとも確かな幸せを探す集い」、#n略して「所確幸」を率いるリーダーです！"
"42090-112-カイザーセキュリティガード" = "所確幸……？"
"42090-113-デカルト" = "ええ。私たちは働かず、所有せずをモットーに、#n廃墟での生活を続ける求道者です。"
"42090-114-デカルト" = "いかがですか、皆さんも清貧の暮らしにご興味は――"
"42090-115-カイザーセキュリティガード" = "ブラボー1、連れて行け。"
"42090-119-デカルト" = "ま、ままま、待ってください！？#n私たちが何をしたというのです！？"
"42090-120-デカルト" = "連行するなら、その理由を言うべきじゃないですか！？"
"42090-121-カイザーセキュリティガード" = "……何もやっていないからだ。"
"42090-122-カイザーセキュリティガード" = "お前たちはこの社会に寄生し、働かずして資源を欲する害虫にすぎない。"
"42090-123-カイザーセキュリティガード" = "健康な社会の存続のためには、#nお前らのような社会の寄生虫を更生させる必要があるだろう。"
"42090-124-カイザーセキュリティガード" = "よってお前らをカイザーコーポレーションの就職斡旋施設に送る。#nそこで仕事を手に入れ働けば、すぐに社会に貢献する素晴らしい労働者として生まれ変わるだろう！"
"42090-125-デカルト" = "い、イヤだああぁぁ！！"
"42090-127-デカルト" = "社畜になんかなりたくないぃぃ！！！！"
"42090-128-ミヤコ" = "待ってください。"
"42090-132-ミヤコ" = "いくら治安のためとはいえ、#n令状もなしに市民を連行することはできないはずです。"
"42090-133-ミヤコ" = "これ以上権限を乱用するのなら、あなたたちを――"
"42090-134-カイザーセキュリティガード" = "何を言う、これは連邦生徒会長代行の「命令」だ――逆らうつもりなのか？"
"42090-135-ミヤコ" = "命令、ですか……。"
"42090-137-ユキノ" = "武器は自ら判断しないからこそ、価値があるのだから。"
"42090-139-ミヤコ" = "………。"
"42090-140-カイザーセキュリティガード" = "しかし、お前たちはどこの学園の者だ？#n初めて見る制服だが。"
"42090-141-ミユ" = "え、SRT特殊学園、ですけど……。"
"42090-142-カイザーセキュリティガード" = "……SRT特殊学園？#n学園名簿にそんな学園はなかったが。"
"42090-143-サキ" = "なんだと？ケンカ売ってるのか？"
"42090-144-モエ" = "……まあ知らないなら知らないで別にいいよ。#n今からじーっくり教えてあげればいいだけだし？#nくひひひっ……。"
"42090-145-カイザーセキュリティガード" = "それにお前ら、行政命令に反する火器をたくさん保有しているようだな……"
"42090-150-カイザーセキュリティガード" = "お前らを全員逮捕する！今すぐ武器を捨てて両手を挙げろ！"
"42090-154-サキ" = "……RABBIT1、対応は？"
"42090-155-ミヤコ" = "……許可します。合図したらすぐに――"
"42090-157-？？？" = "……構わん、解放してやれ。"
"42090-159-ジェネラル" = "久しいな、RABBIT小隊。"
"42090-160-ミヤコ" = "あなたは……あの時の……？"
"42090-161-サキ" = "シャーレ奪還作戦の時、私たちの目の前で建物を爆破しようとしたあの指揮官か？"
"42090-162-ジェネラル" = "私の決断をSRT特殊学園のエリートに覚えてもらえていたとは光栄だな。"
"42090-163-サキ" = "……いや。"
"42090-164-サキ" = "どちらかというと、足掻く姿が印象的で覚えていただけだが。"
"42090-165-ジェネラル" = "ふふ……そんなこともあったな。"
"42090-166-ジェネラル" = "たしかに、あの時は君たちを過小評価していた。"
"42090-167-ジェネラル" = "だが、今は違う。私は失敗から教訓を得られない能なしとは違うからな。"
"42090-169-ミヤコ" = "……どうして、私たちを見逃すのですか？"
"42090-170-ジェネラル" = "「命令」があったからだ。"
"42090-171-ジェネラル" = "SRT特殊学園の生徒との敵対は禁ずるという、連邦生徒会長代行直々のな。"
"42090-172-ミヤコ" = "カヤ防衛室長が……？"
"42090-173-ジェネラル" = "ああ。#n――そういえば彼女、SRT特殊学園を復活させて自分の指揮下に置くとも言っていたな。"
"42090-174-ジェネラル" = "そうなれば君たちとは味方になる。#n未来の友と敵対していいことはないからな。"
"42090-175-ミヤコ" = "SRT特殊学園の……復活……。"
"42090-177-ジェネラル" = "ん？顔色が悪いぞ。食事はちゃんと摂っているのか？"
"42090-178-ジェネラル" = "補給が足りないなら、我々カイザーコーポレーションが支援するぞ。#nなに、弾薬であれ補給品であれ、我々には十分なストックがある。#n必要とあらば、いつでもカイザーエクスプレスで公園の前まで届けさせよう。"
"42090-180-ジェネラル" = "必要なのが条例に反する武器でも……"
"42090-182-ジェネラル" = "支援できないことはない。"
"42090-183-モエ" = "……オイシイ話だけど、こんだけ露骨に出られるとかえって怪しく感じるねぇ。"
"42090-184-サキ" = "ああ……何故こんなに親切なんだ？"
"42090-185-ミユ" = "私たちのせいで計画が失敗して、大きな損害を受けたはずなのに……。"
"42090-186-ミヤコ" = "あなたは、私たちを恨んでいるのでは？"
"42090-188-ジェネラル" = "ふふ、当然のことを聞くんだな。"
"42090-193-ジェネラル" = "――ああ、もちろん私は君たちSRTを嫌悪している。"
"42090-194-ジェネラル" = "凡人では一生努力しても手に入らない強い力を持っていながら、#n君たちはそれを正義や信念のような、くだらないもののために浪費して……。"
"42090-195-ジェネラル" = "その馬鹿馬鹿しい正義ごっこのおかげで、#n私は半生をかけて築き上げたすべてを失いかけた。"
"42090-196-ジェネラル" = "ここで君たち全員を跪かせ、靴で頭を踏んでやっても足りないくらいだ……！"
"42090-197-ミユ" = "ひ、ひぃっ……。"
"42090-198-ジェネラル" = "……だが、どれだけ憎い相手であっても#n笑顔で握手できてこそ社会人だからな。"
"42090-199-ジェネラル" = "個人の恨みで付き合う相手を選んでいては、大業は成し遂げられない。"
"42090-200-ジェネラル" = "そういう意味では、カヤ連邦生徒会長代行は本当に立派な模範生だな。#n自分の後頭部に銃を突きつけた裏切り者だとしても、将来のために遠慮無く手を差し伸べる人なのだから。"
"42090-201-ジェネラル" = "互いの使い方を理解している者同士の絆は、何よりも強い。"
"42090-202-ジェネラル" = "友情や戦友というくだらないものは、能力のない者を慰めるためのまやかしだ。"
"42090-203-ミヤコ" = "……あなたに信念はないのですか？"
"42090-204-ジェネラル" = "信念？もちろんあるに決まっている。#nだがそれは、任務の遂行とは別の話だろう。"
"42090-205-ジェネラル" = "命令を受け、遂行する。たとえ自分の信念とは違っていても。"
"42090-206-ジェネラル" = "それが正しい社会人であり、正しい特殊部隊のあり方だ。"
"42090-207-ジェネラル" = "それに比べて君たちは……力を持っただけの赤子のようだな。"
"42090-208-ジェネラル" = "目の前の不正に怒りながらも、手の届かない不条理には目をつぶる臆病者だ。"
"42090-209-ジェネラル" = "だから「戦闘」では勝てても、「戦争」では勝てないのだよ。"
"42090-214-一同" = "………。"
"42090-215-ミヤコ" = "……帰りましょう。"
"42090-216-ミヤコ" = "現場の情報は十分に集められました。"
"42090-220-ジェネラル" = "もう行くのか？補給品を少し持って行ったらどうだ？"
"42090-221-ミヤコ" = "いえ、結構です。"
"42090-222-ミヤコ" = "何を望んでいるのかも分からない相手に借りを作るほど#n愚かではありませんから。"
"42090-223-ジェネラル" = "はは、小隊長は多少頭が切れるようだな。安心したよ。"
"42090-224-ジェネラル" = "では、また会おう。"
"42090-229-サキ" = "ちっ……なんであんな奴に説教をされなきゃならないんだ。"
"42090-230-モエ" = "……な～んか変。"
"42090-231-サキ" = "何がだ。私の顔にゴミでも付いてるのか？"
"42090-232-モエ" = "や、あの指揮官に挑発された時のことだよ。"
"42090-233-モエ" = "サキのことだし、絶対途中でキレて飛び出すって思ってたのに、#n最後まで我慢できてたから。"
"42090-234-モエ" = "くひひっ、成長しててえらいねぇ～"
"42090-235-サキ" = "モエは私を何だと思ってるんだ。#nいくら何でもあの状況で飛び出すほど間抜けじゃない。"
"42090-236-サキ" = "……それに、最後の言葉はあながち間違ってもいなかった。"
"42090-237-サキ" = "いくら私たちが戦闘で相手を倒しても、#n偉い人たちが状況を覆してしまったら[ruby=・   ・]戦争[/ruby]に勝つ術はないからな。"
"42090-238-モエ" = "まあねぇ。しょせん私たちは、命令に従って#n作戦を遂行する隊員に過ぎないし。"
"42090-239-ミユ" = "感情を優先してしまったら、戦闘に集中できないのも事実だもんね……。"
"42090-241-ミヤコ" = "………。"
"42090-242-サキ" = "ミヤコ、これからどうする？"
"42090-243-ミヤコ" = "は、はい？これから、とは？"
"42090-244-サキ" = "色々あるだろう？昨日FOX小隊の先輩から言われた支隊の件とか。"
"42090-245-サキ" = "正直、気は進まないが……#n学園が復活するならデモを続けるのもおかしいし……。"
"42090-246-サキ" = "先輩の言うことを聞くのが、一番いい選択なのかもしれない。"
