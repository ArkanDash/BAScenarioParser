[translation]
"51170-1" = "第17話;街を歩く怪談（１）"
"51170-2" = "燈籠祭の会場・広場"
"51170-4-ウミカ" = "こちらの準備は終わりました！"
"51170-12-フィーナ" = "巫女様のご登場デース！"
"51170-20-使用人" = "ああ！素晴らしい！#nよくお似合いですよ、お嬢様！"
"51170-22-シズコ" = "苦しくないですか？#n何か飲み物とか……"
"51170-24-ユカリ" = "いえ、お構いなく。#n慣れておりますので。"
"51170-25-使用人" = "ふふっ……ええ！ええ！勘解由小路のご令嬢ですもの。#nずっとこの時を心待ちにしておりました。"
"51170-26-使用人" = "お嬢様が百花繚乱から戻ってきてくださって、本当に良かった……！"
"51170-27-使用人" = "これでもう心配はいりませんね、すべて[ruby=つつがな]が恙無く[/ruby]運ぶことでしょう。"
"51170-32-シズコ" = "こほん、ユカリさん。"
"51170-33-シズコ" = "知っての通り、巫女の舞は祭りの締めとして「勘解由小路の巫女様」に[ruby=おこな]行って[/ruby]いただきます――"
"51170-34-シズコ" = "その様子は、テレビやネットを介して中継する予定です。"
"51170-35-シズコ" = "舞が意味するの[ruby=そうこげいしん]は送故迎新―[/ruby]―古きを送り新しきを迎える……"
"51170-37-ウミカ" = "より良い明日、未来を描くという意味を持つ舞です！"
"51170-38-フィーナ" = "20年前の舞が最後だったと聞いたのデスが、こうしてまた見られるナンテ！"
"51170-39-フィーナ" = "フィーナ、すっごく楽しみデス！"
"51170-44-シズコ" = "ここに儀式の手順をまとめたから――"
"51170-45-使用人" = "それならご心配には及びません。#nお嬢様は小さい頃から、儀式の手順を叩き込まれておりますので。"
"51170-46-シズコ" = "……そうでしたか。"
"51170-48-ユカリ" = "ええ――身共の義務ですから。 "
"51170-49-ユカリ" = "完璧にやり遂げますので、ご安心ください。"
"51170-50-シズコ" = "それなら、いいですが……"
"51170-51-シズコ" = "本当に……大丈夫なんですよね……？"
"51170-52-ユカリ" = "はい。"
"51170-53-ユカリ" = "身共は……"
"51170-54-ユカリ" = "身共は……大丈夫です。"
"51170-55-シズコ" = "分かりました。"
"51170-56-シズコ" = "それじゃ、行きましょう！"
"51170-61-ユカリ" = "はい……これでいいのです。"
"51170-66-ユカリ" = "全部。"
"51170-72-キキョウ" = "――ということがあったよ。"
"51170-73-レンゲ" = "マジでやったのかよ……ユカリと継承戦って……。 "
"51170-74-レンゲ" = "いやぁ、継承戦をしたっていうのもビックリしたけどさぁ。"
"51170-75-レンゲ" = "……何でそれをわざわざアタシに？"
"51170-76-キキョウ" = "…………。"
"51170-77-キキョウ" = "あの子、調停室に来る前にあんたと会ったでしょ。"
"51170-78-キキョウ" = "だから一応、知らせとこうと思って。"
"51170-79-レンゲ" = "あいつ……あんだけ言ったのに……まだ諦めてなかったのかよ……。 "
"51170-80-レンゲ" = "……チッ、知るかよ。アタシは言ったかんな。#n戻ったって無意味だって。"
"51170-81-レンゲ" = "だからもういいよ、キキョウ。"
"51170-82-キキョウ" = "…………いい、って？"
"51170-83-レンゲ" = "こんな風に、連絡してこなくていい。"
"51170-84-レンゲ" = "気遣いとかいらないから。#nアタシはもう……自分の青春を探すって決めたんだ。"
"51170-85-レンゲ" = "もう、百花繚乱になんか興味ないからさ。"
"51170-91-キキョウ" = "……………………そう。"
"51170-92-キキョウ" = "そうだよね、アンタはそれを求めてここを出て行った。 "
"51170-93-キキョウ" = "……うん。私もそう思ってたから、いいよ。これでこの話は終わり。#nアンタは好きにしたらいい、レンゲ。"
"51170-94-キキョウ" = "これでも一応、友達だし……あんたの幸せを願っとくよ。"
"51170-95-キキョウ" = "……そうだね、幸せ太りで10キロくらい体重が増えますようにってね。"
"51170-96-レンゲ" = "はぁ！？ちょっと何を――"
"51170-100-レンゲ" = "あいつ……！言いたい放題いいやがって……！！"
"51170-101-レンゲ" = "くっそ……！"
"51170-102-レンゲ" = "そっちこそお・し・あ・わ・せ・に！！"
"51170-103-レンゲ" = "はぁぁーっ……もう……"
"51170-104-レンゲ" = "全部終わったことなのに……#n何で今も……"
"51170-106-カエデ" = "わっ！？"
"51170-107-カエデ" = "どうしたのレンゲ先輩！？"
"51170-108-ミモリ" = "レンゲちゃん？"
"51170-109-ツバキ" = "ふぁあ……？"
"51170-114-レンゲ" = "いや……何でもない。"
"51170-115-レンゲ" = "こっちの話というか、終わったことっていうか。"
"51170-116-ミモリ" = "百花繚乱……のことですね？"
"51170-117-レンゲ" = "まあ、そうだけど…… "
"51170-118-レンゲ" = "いや、もう大丈夫。百花繚乱なんか、どうでもいい！"
"51170-119-レンゲ" = "せっかくのお祭りなんだ、修行部の一員として楽しまないと……他のことを気にする暇なんてないわけだし。"
"51170-120-レンゲ" = "えーと、なんだ……お祭りを楽しむのも修行の一環！#n青春は待っちゃくれない。少女は夜を駆けるべき！"
"51170-121-レンゲ" = "なっ！ツバキ部長、ミモリ副部長、カエデ！"
"51170-127-ミモリ" = "レンゲちゃんは嘘が苦手なんですね。"
"51170-129-レンゲ" = "ん……？"
"51170-132-ミモリ" = "「百花繚乱なんか」なんて……本当は思っていないのに。"
"51170-133-カエデ" = "そうそう！レンゲ先輩、ここに来てからずーっと百花繚乱のことばっか話してるじゃんね！"
"51170-135-レンゲ" = "い、いや、そこまでは……！？"
"51170-136-ツバキ" = "本当に気にしてないなら……電話が終わってから怒ったりしない、と思う。"
"51170-141-ミモリ" = "ツバキちゃんの言う通りです。レンゲちゃん、このまま終わらせたくないんですよね？"
"51170-142-カエデ" = "ふっふっふ～！ミモリ先輩はなんと！百鬼夜行最強の読心術師だからね！"
"51170-143-カエデ" = "このお方の前で嘘は通用しな～い！！"
"51170-144-ミモリ" = "あっ、カエデちゃんってば……違いますからね！"
"51170-150-レンゲ" = "……何でみんなして、そんなこと言うんだよ。"
"51170-151-レンゲ" = "もう全部……終わった話だろ。"
"51170-152-レンゲ" = "いくら声を上げたって、ナグサ先輩もみんなも帰ってこなかった。"
"51170-153-レンゲ" = "それならもう、終わらせた方がいいんだって。"
"51170-154-レンゲ" = "すべて投げ出して、青春を探そうって思ったのに……どうして。"
"51170-155-ツバキ" = "でも、レンゲ……ユカリに優しかったよね。"
"51170-156-レンゲ" = "アタシが？ユカリに……？そんなわけないだろ。"
"51170-157-レンゲ" = "あの時アタシはユカリを傷つけるようなことばっか言って……"
"51170-158-ツバキ" = "レンゲは、待つ人が苦しむだけなら、無くなればいい、と言ってた。"
"51170-159-ツバキ" = "あの時のレンゲの言葉は、ユカリのための言葉……#n後輩が傷つかないための嘘だってみんな気づいてると思うよ。"
"51170-160-ミモリ" = "レンゲちゃんはキキョウちゃんと幼馴染だと言っていましたね。"
"51170-161-レンゲ" = "…………。"
"51170-162-ミモリ" = "本心と違う言葉を口にしちゃうときもありますよ。心配なら、なおさら。"
"51170-163-ミモリ" = "心配する気持ちの方が勝って……思ってもない言葉が出てしまう時だって。"
"51170-164-ミモリ" = "私にもありますから、よく分かります。"
"51170-166-カエデ" = "えっ、ミモリ先輩も！？"
"51170-167-ミモリ" = "ふふっ……ええ、そうですよカエデちゃん。"
"51170-168-ミモリ" = "ツバキちゃんと私は幼馴染ですから……#nこれまでに色んなことがあったんですよ？"
"51170-169-ミモリ" = "ね、ツバキちゃん。"
"51170-171-ツバキ" = "……本気で怒った時のミモリは怖いよ。"
"51170-173-カエデ" = "それは私も分かるかも～！"
"51170-174-ミモリ" = "え、ええっ？"
"51170-175-ミモリ" = "二人とも……"
"51170-179-ミモリ" = "ですからレンゲちゃん。"
"51170-184-レンゲ" = "アタシはもう……"
"51170-185-レンゲ" = "百花繚乱をやめて、修行部に体験入部してるのに……今更……"
"51170-186-ミモリ" = "でもレンゲちゃんは、まだあるんですよね？#n大切な人たちに伝えたい言葉が。"
"51170-187-レンゲ" = "……まだ、いいのかな……図々しいとか、思われないかな。"
"51170-188-ミモリ" = "大事なのは「気持ち」だと思いますよ、レンゲちゃん。"
"51170-189-レンゲ" = "ミモリ副部長……。"
"51170-195-ツバキ" = "……レンゲの体験入部はここで終わり。これは部長命令。"
"51170-197-レンゲ" = "へっ！？"
"51170-199-ツバキ" = "やりたい事、やっておいで。"
"51170-200-ミモリ" = "私たちもお手伝いしますので。"
"51170-201-カエデ" = "元修行部のよしみで、ね！でしょ？"
"51170-203-レンゲ" = "ツバキ、ミモリ、カエデ……。"
"51170-209-レンゲ" = "……うん。分かった。"
"51170-211-レンゲ" = "キキョウから聞いたんだ。"
"51170-212-レンゲ" = "ユカリにつらい思いをさせたかもしれないって。"
"51170-213-レンゲ" = "心配だから見に行ってくれないか、って。"
"51170-215-レンゲ" = "……自分でやればいいのを人にやらせるあたり、アイツらしいけど。"
"51170-216-レンゲ" = "アタシ、ユカリと話してみるよ。"
"51170-219-ミモリ" = "ええ。それでは今から会いに行きましょう。"
"51170-220-カエデ" = "よし！みんなでしゅっぱーつ！"
"51170-222-レンゲ" = "みんな、ありがとな。"
"51170-230-カエデ" = "あ、花火！"
"51170-231-ミモリ" = "お祭りが始まったみたいですね。"
"51170-232-ミモリ" = "私たちも遅れる前に――"
"51170-237-商店街の住人A" = "うわああっ！に、逃げろ！！"
"51170-242-ツバキ" = "どうしたんだろう。"
"51170-253-カエデ" = "……えっ、えっ？ツバキ先輩、ミモリ先輩！あ、あれ何……！？"
"51170-254-ミモリ" = "！！"
"51170-256-ツバキ" = "う～ん、分かんないけど……#nお友達になれそうな感じじゃないねぇ～"
"51170-266-レンゲ" = "っ……！#nみんな気をつけろ！"
"51170-267-レンゲ" = "来るぞ！！"
"51170-278-ミチル" = "なな、なにこれーっっ！！？"
"51170-284-ミチル" = "うにゃぁああっ！？"
"51170-297-イズナ" = "部長！大丈夫ですか！？"
"51170-298-ツクヨ" = "部長……！！"
"51170-300-ミチル" = "あっ、う、うん！"
"51170-301-ミチル" = "私は大丈夫……でも、お祭り会場が……！"
"51170-302-ミチル" = "この怪物……どこから来たのっ！？"
"51170-304-イズナ" = "部長、これ……前に空が赤く染まった時と同じに……"
"51170-305-ツクヨ" = "え、ええっ！？#nあ、あの時と……同じ、ですか！？"
"51170-306-ツクヨ" = "部長……イズナちゃん！#nど、どうしましょう！？"
"51170-308-ミチル" = "どどどうしよう！？"
"51170-309-ミチル" = "うわっ！あっちにもいる……！"
"51170-314-ミチル" = "（ここは逃げるべき！？）"
"51170-315-ミチル" = "（でも、まだ会場に人が残ってるのに……）"
"51170-316-ミチル" = "（でもでも、イズナとツクヨまで危険にさらすわけには……）"
"51170-324-ミチル" = "うわわっ！？"
"51170-325-ツクヨ" = "部長！！"
"51170-332-イズナ" = "ご心配には及びません！部長、ツクヨ殿！"
"51170-335-ミチル" = "い、イズナ？"
"51170-336-ツクヨ" = "イズナちゃん……？"
"51170-338-イズナ" = "今、[ruby=ここ]百鬼夜行[/ruby]には主殿がいますから！"
"51170-339-イズナ" = "主殿は私たち忍術研究部を頼ってくれたのです！"
"51170-345-イズナ" = "イズナはそれに応えるために全力を尽くします！"
"51170-346-ミチル" = "……そうだね！イズナの言う通りだ。#nよーし、じゃあまずは、ここのみんなを助けよう！ "
"51170-347-ミチル" = "絶対、先生殿がなんとかしてくれる！"
"51170-352-ミチル" = "それまで我々、忍術研究部――特殊エージェント一同で、みんなを守りぬくよ！"
"51170-354-ツクヨ" = "は、はいっ、分かりました！"
"51170-355-イズナ" = "はい！それでは作戦開始です！ニンニン！"
"51170-365-陰陽部の部員A" = "カホ副部長！お祭り会場の周囲に正体不明の何かが出現……騒ぎが起きているようです！"
"51170-366-陰陽部の部員B" = "西地区では負傷者が続出しているとのことです！"
"51170-367-陰陽部の部員C" = "カホ副部長！商店街に正体不明の怪物が現れたという通報が……！"
"51170-369-陰陽部の部員たち" = "カホ副部長！一体どうすれば……！！"
"51170-371-カホ" = "皆さん、落ち着いてください……！"
"51170-372-カホ" = "これは……一体……。"
"51170-373-カホ" = "お祭り会場に正体不明の怪物……一体どうすれば……。"
"51170-374" = "お祭りの開始と同時に動き出した未知の襲撃者……これを予見する手掛かりは……ただ一つ。"
"51170-379-ニヤ" = "お祭りの開始と同時に動き出した未知の襲撃者……これを予見する手掛かりは……"
"51170-380-ニヤ" = "ただ一つ。"
"51170-382-ニヤ" = "……花鳥風月部。"
"51170-387-ニヤ" = "あの手紙は単なる脅し……いつものボヤ騒ぎ程度だと判断した。"
"51170-392-ニヤ" = "その程度の些事にシャーレを巻き込んで、借りを作るのは避けたい……そう思ったのに。"
"51170-393-ニヤ" = "……最初から、判断ミスだった？"
"51170-395-ニヤ" = "そもそも花鳥風月部は、記録上にしかない、言い伝えの存在。"
"51170-396-ニヤ" = "実体を想定すべきだった――というのか。"
"51170-397-ニヤ" = "どこで何を見落とした……？#n私の思い至らなかった要素……何か別の手掛かりが……？"
"51170-399-カホ" = "ニヤ様。"
"51170-401-ニヤ" = "……タイミング的に、やはりクズノハと関係が……？#nいや、それとも……"
"51170-402-カホ" = "ニヤ様……。"
"51170-403-ニヤ" = "百花繚乱の方に……？#n行方を[ruby=くら]晦[/ruby]ませた委員長…‥何か我々の知らない情報が……？"
"51170-404-ニヤ" = "脅威に備えるためには、そちらを探るべきだった……？ "
"51170-405-カホ" = "ニヤ様……！"
"51170-406-ニヤ" = "私の知らない……得られなかった情報を集めなければ……#n一体どこで何を見落としたのかを把握しないと――"
"51170-411-カホ" = "ニヤ――"
"51170-422-チセ" = "ニヤ部長、めっ。#nデコピンだよ～"
"51170-430-ニヤ" = "あうっ……！？#nち、チセ……！？"
"51170-431-カホ" = "チセちゃん！？"
"51170-436-チセ" = "………………。"
"51170-437-チセ" = "！！"
"51170-438-チセ" = "恐るるな"
"51170-439-チセ" = "目をそらさずに"
"51170-440-チセ" = "向き合ってこ～"
"51170-441-チセ" = "部長。じっとしてちゃだめ。"
"51170-442-チセ" = "ほら、みんな怖がってる。"
"51170-447-カホ" = "チセちゃん……。"
"51170-448-ニヤ" = "……あ。"
"51170-449-ニヤ" = "ああ……"
"51170-450-ニヤ" = "…………。"
"51170-455-ニヤ" = "にゃははっ、そうだね。チセの言う通りだ。"
"51170-456-ニヤ" = "[ruby=おんみょう]陰陽部[/ruby]の部長だもの、こんな状態ではお手本にならない。"
"51170-457-ニヤ" = "カホ、お祭り運営委員会に連絡をお願いできる？#n現状の共有を。"
"51170-459-カホ" = "は、はい！"
"51170-466-カホ" = "あれ……繋がらない……#n何かに通信を邪魔されている、ような……？"
"51170-467-ニヤ" = "ふむ……まぁ、そういう事をしていてもおかしくないねぇ。"
"51170-468-ニヤ" = "そうねぇ……うん、じゃあそっちは私が行ってくるから……"
"51170-469-ニヤ" = "カホは、お祭りに協力してくれた百鬼夜行の商会に、聞き込みをしてくれる～？"
"51170-470-ニヤ" = "今は状況を整理して基盤を作るのが先決。#n時間別、種類別に情報の取りまとめを頼めるかな～？"
"51170-471-ニヤ" = "責任の追及は後からでもできるからね、よろしく。"
"51170-473-カホ" = "……はい、承知しました。#nお任せください！"
"51170-474-カホ" = "ではみなさん、これより私たち陰陽部は、ニヤ様の指示の下動きます！"
"51170-476-カホ" = "ここからは時間勝負です！全力で参りますよ！#nよろしくお願いいたします！"
"51170-477-陰陽部の部員たち" = "はい！！"
"51170-479" = "次回;街を歩く怪談（２）"
