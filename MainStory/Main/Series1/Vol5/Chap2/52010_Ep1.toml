[translation]
"52010-1" = "第1話;届かない指先"
"52010-13-百花繚乱の部員" = "……百花繚乱紛争調停委員会1年、[ruby=ごりょう]御稜[/ruby]ナグサ。"
"52010-21-百花繚乱の部員" = "同じく百花繚乱紛争調停委員会1年、[ruby=ななかど]七稜[/ruby]アヤメ。"
"52010-27-百花繚乱の部員" = "両者とも、前へ。"
"52010-30-百花繚乱の部員" = "古来より伝わる百花繚乱のしきたりに従い――"
"52010-31-百花繚乱の部員" = "いざ尋常に――"
"52010-38-百花繚乱の部員" = "勝負！"
"52010-46-ナグサ" = "……隙あり。"
"52010-64-アヤメ" = "そこっ――！！"
"52010-71-ナグサ" = "ぐっ……。"
"52010-72-百花繚乱の部員" = "一本！それまで！"
"52010-77-アヤメ" = "これで201戦、201勝……。"
"52010-78-アヤメ" = "今日もありがと、ナグサ！良い試合だったよ。"
"52010-82-ナグサ" = "うっ……うぅっ……。"
"52010-83-アヤメ" = "な、ナグサ？"
"52010-84-ナグサ" = "また……アヤメに負けちゃった……。"
"52010-85-アヤメ" = "な、泣かないで！ナグサも強かったよ！？"
"52010-86-ナグサ" = "でも……これじゃ、また役立たずになっちゃう。"
"52010-87-ナグサ" = "ずっと……頑張ってきたのに、いつもこう……。#n私はアヤメの足元にも及ばない。"
"52010-88-アヤメ" = "あまり自分を責めないの。"
"52010-94-アヤメ" = "ほら、手。"
"52010-97-アヤメ" = "私はいつでもそばにいるから。#nナグサが転んだら、すぐ手を差し伸べられるように。"
"52010-101-ナグサ" = "……足手まといでも？"
"52010-102-アヤメ" = "もちろん。"
"52010-103-ナグサ" = "……泣き虫でも？"
"52010-104-アヤメ" = "うん。"
"52010-105-ナグサ" = "優柔不断で、一人じゃ何も決められなくて――"
"52010-106-アヤメ" = "大丈夫だよ！#nだって私は――"
"52010-114-アヤメ" = "私は……あんたを友達だと思ったことなんてないから。"
"52010-132-ナグサ" = "……！！"
"52010-133-ナグサ" = "はぁっ……はぁ……っ！#n……夢？"
"52010-134-ナグサ" = "たしかに、アヤメが……そこにいたのに。"
"52010-139-ナグサ" = "……っ！"
"52010-142-ナグサ" = "痛……っ。"
"52010-143-ナグサ" = "腕の中で、炎が渦巻いているみたい……熱い……。"
"52010-144-ナグサ" = "あの時、私がアヤメを止められていれば……。"
"52010-148-ナグサ" = "うぅ……っ。"
"52010-149-ナグサ" = "ごめ……んっ、アヤメ……。"
"52010-150-ナグサ" = "ごめんなさい……っ。"
"52010-152-ナグサ" = "役立たずで、弱虫で……。"
"52010-153-ナグサ" = "こんな私で……。"
"52010-157-ナグサ" = "……ごめんなさい、アヤメ。"
"52010-159" = "次回;新たな怪談"
