[translation]
"52180-1" = "第18話;同床異夢"
"52180-3-レンゲ" = "ふんっ……ぬぬぬぬぬ……！"
"52180-4-レンゲ" = "もう……ちょっとで……！"
"52180-8-レンゲ" = "キキョウ、見てないで手伝えよ！"
"52180-9-レンゲ" = "この鉄格子、あとちょっとで人が通れるくらいの隙間ができ……そうっ！#n……なんだよ……！"
"52180-10-キキョウ" = "そんな無駄なことしないで、ちょっとは体力を温存したら？"
"52180-11-キキョウ" = "あいつらは監視も立ててない……つまり、私たちをここから出さないだけの自信があるってことだよ。"
"52180-12-レンゲ" = "だからってじっとしてろってか！？#nやれることは試してみないとだろ！？"
"52180-13-キキョウ" = "はぁ……今、脱出方法を考えてるところなんだけど。#nみんながあんたみたいに、気合と根性で解決するタイプじゃないの。"
"52180-14-キキョウ" = "そもそも最初から[ruby=・]あ[/ruby][ruby=・]の[/ruby]アヤメを信じなければ……。"
"52180-15-レンゲ" = "それは、そうだけど……。"
"52180-16-レンゲ" = "な、何か考えがあるなら言ってくれよ！"
"52180-17-キキョウ" = "集中したいからちょっと黙ってて！"
"52180-18-レンゲ" = "なっ、キキョウお前――！"
"52180-19-ユカリ" = "き、キキョウ先輩、レンゲ先輩！落ち着いてくださいまし！"
"52180-20-ユカリ" = "今は言い争っている場合では……！"
"52180-26" = "[ns1] \"なんだか騒がしいね……。\"\n[ns2] \"……私、どれくらい寝てたんだろう。\""
"52180-29-ユカリ" = "[USERNAME]先生！"
"52180-30-レンゲ" = "師匠！"
"52180-31-キキョウ" = "先生、大丈夫？怪我はない？"
"52180-32" = "[s3] \"うん、ちょっと頭は痛いけど平気。\"\n[s4] \"みんなも怪我はない？\""
"52180-37-レンゲ" = "ああ。こっちは軽い擦り傷程度だよ。"
"52180-38-ユカリ" = "百花繚乱たるもの、この程度へっちゃらですの！"
"52180-40" = "[ns] \"ここは……？\""
"52180-41-キキョウ" = "ここは「彼岸邸」の地下。"
"52180-42-キキョウ" = "私たちは花鳥風月部との戦闘に負けて……ここに連れてこられた。"
"52180-43-ユカリ" = "勘解由小路家の地下にも似たような倉庫がありますが……それを牢屋として使っているなんて。"
"52180-44-レンゲ" = "ちっ、アイツらに銃弾が通ればな……。"
"52180-45" = "[s5] \"花鳥風月部……？\"\n[s6] \"何があったの？\""
"52180-48-キキョウ" = "結論から言えば――"
"52180-49-キキョウ" = "北部自治区であの女から見聞きしたことは、全部ウソだったってこと。"
"52180-51" = "（気絶していた時の出来事を説明してもらった）"
"52180-59" = "[ns] \"……まさか、アザミが花鳥風月部の一人だったなんて。\""
"52180-60-ユカリ" = "ええ。あの優しそうな会長さんが……しょっくです。"
"52180-61-キキョウ" = "最初から私たちを騙すための芝居だったんだよ。#nあの笑顔、思い出すだけで寒気がする。"
"52180-62-レンゲ" = "じゃあエビス分校の自治区も、住民もニセモノだったってことか……？"
"52180-63-キキョウ" = "いや、あの人たちは関係ないんじゃないかな。"
"52180-64-キキョウ" = "いくら百物語が強力だとしても、お祭りに使われる食材までは作り出せないと思うよ。"
"52180-65-キキョウ" = "それに、一部の人は[ruby=はぶ]土生[/ruby]アザミに対して初対面みたいな反応だったし。"
"52180-66" = "[s] \"じゃあ……アヤメもニセモノだったのかな？\""
"52180-67-レンゲ" = "それなんだけどさ……。"
"52180-68-キキョウ" = "私たちも気になって、アヤメ先輩と最後まで一緒だったナグサ先輩に聞いてみたんだけど……。"
"52180-69-ユカリ" = "でも、何があったのかまでは……。#nナグサ先輩、ずっと塞ぎ込んでしまっておりまして。"
"52180-74" = "[ns7] \"……大丈夫？\"\n[ns8] \"どこか具合でも悪い？\""
"52180-77-ナグサ" = "……大丈夫。"
"52180-78-ナグサ" = "ごめんなさい……私が未熟だから、みんなを危険な目に遭わせた。"
"52180-79-レンゲ" = "先輩は何も悪くないだろ！全部花鳥風月部のせいだって！"
"52180-80-ユカリ" = "ええ、ナグサ先輩は皆のために最善を尽くしていましたわ！"
"52180-81-キキョウ" = "いま自分を責めてもしょうがないでしょ。"
"52180-82-キキョウ" = "この事態を招いたのはあんたじゃなくてアヤメ先輩でしょ？"
"52180-83-ナグサ" = "……ううん、アヤメのせいじゃない。#n彼女は間違ってないの。"
"52180-84-キキョウ" = "は？"
"52180-85-ナグサ" = "結局私が、アヤメを理解できていなかったから――"
"52180-86-？？？" = "そうですよねぇ。都合のいい夢に甘えてた、[ruby=てめぇ]手前[/ruby]のせいですよぉ。#nねっ、ナグサちゃん？"
"52180-92-キキョウ" = "[ruby=やぶき]箭吹[/ruby]シュロ……！"
"52180-93-シュロ" = "あはっ、アハハハッ！"
"52180-94-シュロ" = "何ですかぁ、その無様な姿。"
"52180-95-シュロ" = "あの時の威勢のよさは、どこ行っちゃったんですぅ？"
"52180-96-シュロ" = "まさかぁ……優しい優しいアヤメがニセモノだなんて思ってなかったんですぅ？#n夢にまで見た親友を、間違えちゃったんですかぁ？"
"52180-100-シュロ" = "……ウソばっかり。"
"52180-101-シュロ" = "都合の悪い現実に、蓋をしてただけですよねぇ？"
"52180-102-キキョウ" = "そう……じゃあ、私たちが会ったアヤメ先輩は本物じゃなかったんだね。"
"52180-103-シュロ" = "ええ、そうですよぉ？"
"52180-104-シュロ" = "仲間の危機に颯爽と駆けつけて、感動の再会を果たす親友だなんてぇ……ご都合主義も大概にしてくださいよぉ？"
"52180-105-シュロ" = "あのアヤメ……いえ、「アレ」は、怪書「[ruby=とうていぶっかいろく]稲亭物怪録[/ruby]」から生まれた、ナグサちゃんの「恐怖」なんですよぉ！"
"52180-106-ユカリ" = "で、でも、あのお方はとても明るくて……恐怖だなんてとてもそんな風には。"
"52180-107-シュロ" = "相変わらず、なぁんにも知らないんですねぇ？"
"52180-108-シュロ" = "恐怖は、ときに[ruby=・]幸[/ruby][ruby=・]せ[/ruby]の姿をしてやってくるんですよぉ？"
"52180-109-シュロ" = "心の中でずぅっと否定してきた、夢みたいな幸せ。#nそれが現実になるほど恐いことなんて、ないですよねぇ？"
"52180-113-シュロ" = "偽りの幸せを享受すればするほど……残酷な現実がくっきり浮かび上がるんですから。"
"52180-114-ナグサ" = "っ……。"
"52180-115-シュロ" = "だ～か～らぁ、あなたはアヤメの代わりになれないんですよ、ナグサちゃん。"
"52180-116-レンゲ" = "お前にナグサ先輩の何がわかるんだよ！？"
"52180-117-シュロ" = "アハッ！ムキになっても無駄ですよぉ？"
"52180-118-シュロ" = "いくら泣いたって怒ったって、現実は変わらないんですからぁ。"
"52180-119-シュロ" = "手前らがいくら努力したって、あのアヤメの足元にも及びませんよぉ？"
"52180-120-シュロ" = "どうせ、いつかは捨てられる消耗品に、何一つできやしないんですから！"
"52180-121" = "[s] \"シュロ、一つ聞きたいんだけど。\""
"52180-122-シュロ" = "何ですかぁ？"
"52180-123-シュロ" = "もう屁理屈は聞き飽きてますよぉ。"
"52180-124-シュロ" = "負け犬の遠吠えなんて、手前には響きませんしぃ？"
"52180-125" = "[s9] \"最初から、全部知ってたんだよね？\"\n[s10] \"あの時アヤメに撃たれたのも、演技だったのかな。\""
"52180-131-シュロ" = "……はぁ？"
"52180-132-シュロ" = "そんなくだらないことが聞きたかったんですぅ？手前、興醒めなんですけど？"
"52180-133-シュロ" = "当然でしょう？全部ぜ～んぶ、手前さん方を捕まえるためのお芝居だったんですから。"
"52180-134-シュロ" = "アレに捕まったのも、手前さん方を彼岸邸に誘い出したのもぉ……。"
"52180-138-シュロ" = "……え？"
"52180-139-シュロ" = "……シャーレの先生？"
"52180-142-シュロ" = "手前様を盾にしたのも、全部、全部――"
"52180-143-シュロ" = "……っ、コクリコ様のための演技だったんですからぁ！"
"52180-146" = "[ns11] \"捕まっといて言うことでもないし……。\"\n[ns12] \"それに、もう聞き飽きてるかもしれないけど……。\""
"52180-149" = "[ns13] \"……自分以外の何かを演じるのは、悪いことじゃない。\"\n[ns14] \"誰だってすることだからね。\""
"52180-152" = "[ns] \"でも、だからこそ……自分がした行動に目を背けないで。\""
"52180-154" = "[ns] \"シュロは、シュロのすべきことをしたんだよね？\""
"52180-155-シュロ" = "は、ハハッ……何を言うかと思えばぁ。"
"52180-156-シュロ" = "それっぽいこと言って、手前を引き入れようって魂胆ですかぁ？"
"52180-157-シュロ" = "助けられたからって、コクリコ様を裏切るとでもぉ？"
"52180-158-シュロ" = "ほんっと、頭お花畑なんですねぇ……。"
"52180-159-シュロ" = "幼稚でくだらない、おままごとみてぇな発想……。"
"52180-160-シュロ" = "全部、[ruby=てめえ]手前[/ruby]らが信じるクズノハと同じ、くだらないくだらない妄想ですよぉ！"
"52180-164-ナグサ" = "……クズノハ。"
"52180-165-ナグサ" = "……あの時どうして私を助けたのかな。"
"52180-166-ナグサ" = "どうして、アヤメじゃなくて私を……あのまま放っておいてくれたらよかったのに……。"
"52180-167-シュロ" = "は？何言ってるんです？"
"52180-168-シュロ" = "まるで本当にクズノハと会ったかのような……。"
"52180-169" = "[s15] \"クズノハはただのおとぎ話じゃないよ。\"\n[s16] \"私も前に、ナグサからクズノハの手紙をもらったんだ。\""
"52180-172-シュロ" = "クズノハが……いるっていうんですかぁ？"
"52180-173-シュロ" = "全ての怪書の始まりであり、百花繚乱の初代委員長――大預言者クズノハが？"
"52180-174-シュロ" = "そんな世迷言……手前をからかってるんですね？#nでしたら――！"
"52180-181-シュロ" = "いや、でも……。"
"52180-182-シュロ" = "コクリコ様は、あの時ナグサは大雪原のど真ん中にいたって……それなのに、生きて帰ってきてる。"
"52180-183-シュロ" = "獣も寄りつかない大雪原で、誰がナグサを……？"
"52180-184-シュロ" = "それに、シャーレの先生は……屁理屈をこねても嘘はつかない……。"
"52180-185-シュロ" = "本当に大預言者クズノハが……黄昏の寺院にいるのなら……。"
"52180-186-シュロ" = "失くした「稲生物怪録」の代わりの怪書が作れる……？#nそうしたら……コクリコ様だって、もっと手前を……。"
"52180-192-シュロ" = "……本当に本当に残念でしたねぇ、ナグサちゃん。#n針のむしろに座ってる気分でしょう？"
"52180-193-シュロ" = "ああ、可哀想なナグサちゃん。#n心の底から同情しちゃいますぅ。"
"52180-194-シュロ" = "そんなナグサちゃんに……優しい優しい手前が機会を差し上げましょうかぁ？"
"52180-195-ナグサ" = "……機会？"
"52180-196-シュロ" = "ナグサちゃんは、なんとしてでも助けたい存在がいるのでしょう？"
"52180-201-シュロ" = "だったら、また会えばいいんですよぉ……クズノハに。"
"52180-203" = "次回;彼岸の記憶"
