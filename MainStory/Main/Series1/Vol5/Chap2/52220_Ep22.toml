[translation]
"52220-1" = "第22話;祭りは続く"
"52220-5-陰陽部の部員" = "カホ様……カホ様！"
"52220-6-カホ" = "……そんなに慌てて、今度はどうしました？"
"52220-7-カホ" = "和楽まつりの開始まで1時間を切っているのです。#n火急の用以外は、部室に居るニヤ様に、とお伝えしたはずですが。"
"52220-8-カホ" = "まさか、またニヤ様が……？"
"52220-9-陰陽部の部員" = "はい。[ruby=・]ま[/ruby][ruby=・]た[/ruby]消えてしまいました……それよりも……。"
"52220-10-カホ" = "こ、こんな時にまで……！？#n今回こそはと、あれだけお願いしたのに……！"
"52220-11-カホ" = "ああ、「それよりも」とは……？"
"52220-12-カホ" = "和楽まつり直前にニヤ様が消えたことよりも、深刻な問題が？"
"52220-13-カホ" = "もしや、主役にして至高のアイドル、チセちゃんに何か異変が――"
"52220-14-チセ" = "ここに居るよ～"
"52220-15-カホ" = "ああ、チセちゃん。ご無事だったのですね。"
"52220-16-カホ" = "とすれば、一体何が……？"
"52220-17-陰陽部の部員" = "その……外に出られた方が早いかと思われます。"
"52220-21-カホ" = "こ、これは一体……。"
"52220-22-カホ" = "学園全体を目玉が覆っている……。"
"52220-23-チセ" = "あっちこっちいっぱいー。"
"52220-24-陰陽部の部員" = "……先ほど、会場付近にあの目玉が突然現れたのです。"
"52220-25-陰陽部の部員" = "お祭り運営委員会のシズコさんも心当たりがないとのことで、てっきりカホ様の方で用意された出し物なのかと……。"
"52220-26-カホ" = "チセちゃんの可愛さをアピールするのに、あのような不気味なものは飾りません！"
"52220-27-カホ" = "ですが、シズコさんも知らないとは……。"
"52220-33-カホ" = "いや、あの気味の悪い瞳……どこかで見たことが……。"
"52220-34-チセ" = "カホー、あれとにらめっこしてもいい～？"
"52220-35-カホ" = "いけません！"
"52220-38-魑魅一座A" = "げっ、なにこの目玉。"
"52220-39-魑魅一座B" = "気持ちわる……瞬きしてるよ？"
"52220-40-魑魅一座A" = "撃ってみる？ビックリして逃げるかも。"
"52220-41-カホ" = "お、お待ちください！正体が分かるまで、不用意に刺激を与えな――"
"52220-45-魑魅一座A" = "弾が……通り抜けた？"
"52220-46-魑魅一座A" = "全然手応えないんだけど……。"
"52220-54-魑魅一座B" = "うわっ、増えたぞ！？"
"52220-55-魑魅一座A" = "っていうかこれ……前の火事のときの化け物じゃん……！"
"52220-56-魑魅一座B" = "う、うちらじゃ無理だ！逃げろー！"
"52220-60-カホ" = "……付喪神。"
"52220-61-カホ" = "花鳥風月部の仕業ですね。"
"52220-62-カホ" = "よりによって百花繚乱が不在の今とは……。"
"52220-63-カホ" = "いえ、今だからこそでしょうね……いずれにせよ、最悪のタイミングです。"
"52220-64-陰陽部の部員" = "か、カホ様。私たちはどうしたら……？"
"52220-65-カホ" = "まずは来場者とスタッフ全員に、あの「目」との交戦は避けるよう伝えてください！"
"52220-66-カホ" = "そして、みなさんをできる限り遠くに避難させるのです！"
"52220-67-陰陽部の部員" = "で、ですが学園中にあの目が出現しているようです。どこに逃げたら……。"
"52220-68-カホ" = "そ、それは……！"
"52220-70-陰陽部の部員A" = "カホ副部長！あの目に加え、前回現れた怪物たちも出現しました！市民を襲っています！"
"52220-71-陰陽部の部員B" = "まるで待ち伏せでもしていたかのようで――"
"52220-72-陰陽部の部員C" = "逃げ場がありません！"
"52220-77-陰陽部の部員B" = "このままでは、和楽まつりが中止に……。"
"52220-78-陰陽部の部員C" = "カホ様、どうしたら……！"
"52220-80-カホ" = "……ニヤ様。"
"52220-81-カホ" = "せめてここに、ニヤ様が居れば。"
"52220-82-カホ" = "私にできることは、あくまで現状把握と整理にすぎません……。"
"52220-83-カホ" = "この状況を打開することは……。"
"52220-87-チセ" = "……カホ。"
"52220-88-カホ" = "申し訳ございません、チセちゃん。"
"52220-89-カホ" = "今日まで精一杯お祭りの準備に励んでいただきましたが、今回和楽まつりは――"
"52220-90-チセ" = "ううん、そうじゃなくて。"
"52220-91-チセ" = "そこに忍者がいる～"
"52220-92-カホ" = "忍者……？"
"52220-98-ミチル" = "[ruby=にんじゅつけんきゅうぶ]忍術研究部[/ruby]、ここに参上！"
"52220-99-イズナ" = "カホ殿、ご無事でしたか！"
"52220-100-ツクヨ" = "と、突然怪物が現れて……時間がかかってしまいました！"
"52220-102-カホ" = "忍術研究部の皆さんが、なぜこちらに……？"
"52220-103-カホ" = "もしかして助けに来てくださったのですか？"
"52220-104-ミチル" = "もちろんだよ！"
"52220-105-ツクヨ" = "[USERNAME]先生からお願いされていまして！"
"52220-106-イズナ" = "そしてこちらにニヤ殿からのお便りがあります！ニンニン！"
"52220-107-カホ" = "[USERNAME]先生……？#nそれに、ニヤ様から……？"
"52220-109" = "（約30分前……）"
"52220-112-ニヤ" = "にゃは……この有り様、みっともないですねぇ。"
"52220-113-ニヤ" = "紛い物の影とはいえ、簡単には倒せませんか。"
"52220-114-ニヤ" = "アヤメ委員長ったら手強いんだから～"
"52220-119-ニヤ" = "怪談が始まりましたか。"
"52220-120-ニヤ" = "ここまでは想定通り……しかし、監禁されてしまっては打つ手なし、です。"
"52220-121-ニヤ" = "あ～ん……もう切れる手札がないなぁ……。"
"52220-128-イズナ" = "ニヤ殿！"
"52220-129-ミチル" = "助けに来たよ！"
"52220-130-ツクヨ" = "お、お怪我はありませんか？"
"52220-131-ニヤ" = "忍術研究部のみなさん……？なぜこちらに……。"
"52220-132-イズナ" = "実は、先ほどから後を尾けていたのです！"
"52220-133-ミチル" = "先生殿から護衛の依頼があってねー。"
"52220-134-ニヤ" = "先生が皆さんに……？"
"52220-135-ツクヨ" = "は、はいっ！百花繚乱が不在の隙に、陰陽部が狙われるかもしれないから、とのことで。"
"52220-136-ミチル" = "ふふーん、闇の中でひっそりと見守る……まさに忍者の務めだね！"
"52220-137-ニヤ" = "つまり……私がアヤメ委員長の影と戦っていた時も、見守ってたんです？"
"52220-141-ミチル" = "それは……ええっと……ビックリして動けなかったというか……。"
"52220-142-ミチル" = "加勢しても、アヤメ委員長は止められなかった気がするっていうか……。"
"52220-143-ツクヨ" = "はい……気圧されてしまって、一歩も動けませんでした……。"
"52220-144-ミチル" = "で、でも！忍者の本分は正面突破じゃないからね！"
"52220-145-ミチル" = "「急がば回れ」！不利な状況は避け、機を見て忍び寄る！"
"52220-146-ミチル" = "最初から、ニヤ殿が一人になるこのときを待ってたんだよ！"
"52220-147-イズナ" = "さすがです部長！忍び足の術、ですね！"
"52220-148-ミチル" = "さあ、ニヤ殿！いまのうちにここから抜け出そう！"
"52220-149-ニヤ" = "……ありがたい申し出ですが、難しいでしょう。"
"52220-150-ツクヨ" = "えっ……！？ど、どうしてですか？"
"52220-151-ニヤ" = "今の百鬼夜行は、あちこちにヒトツメがいますから。"
"52220-152-ニヤ" = "ヒトツメはすべてを見渡し、見通す。"
"52220-153-ニヤ" = "あの目が百鬼夜行にいる限り、全ての事柄が筒抜けでしょう。"
"52220-154-ニヤ" = "百鬼夜行を出るも入るも、勘づかれて先回りされるはず。"
"52220-155-ニヤ" = "この会話も……覗き見てるかもしれませんね？"
"52220-156-ミチル" = "わ、我々の計画がバレバレだなんて！？ど、どこ！"
"52220-161-ミチル" = "あ、あっちか？それともこっち！？"
"52220-162-ツクヨ" = "ど、どうしましょう……計画を立てても、それが全て知られるのでは……。"
"52220-163-イズナ" = "ツクヨ殿！諦めてはいけません！"
"52220-164-イズナ" = "主殿の依頼とあらば、どんな危険な任務にも全力を尽くすのが忍者です！"
"52220-165-ニヤ" = "ふふ、いいこと言いますね。"
"52220-166-ニヤ" = "孤立無援の八方塞がり。とはいえ、何もしないならそれこそ愚策。"
"52220-167-ニヤ" = "見られていようと、[ruby=・]こ[/ruby][ruby=・]れ[/ruby][ruby=・]ま[/ruby][ruby=・]で[/ruby][ruby=・]通[/ruby][ruby=・]り[/ruby]にやればいいんですよ。"
"52220-168-ニヤ" = "忍術研究部の皆さん、ひとつ……お祭り会場にいるカホに伝言をお願いできます？"
"52220-172-ニヤ" = "――お祭りはどんな時も続けるべきである、と。"
"52220-174-カホ" = "ニヤ様が……そのようなことを？"
"52220-175-ミチル" = "そうなんだってば！この状況でお祭りをやろうだなんて本気なの！？"
"52220-176-ツクヨ" = "で、でも、陰陽部の部長さんがそう仰るのですから……。"
"52220-177-カホ" = "ちなみに、他には何か仰っていませんでしたか？"
"52220-178-ミチル" = "ええっと、陰陽部は百鬼夜行の均衡を維持する組織だから、[ruby=・]こ[/ruby][ruby=・]れ[/ruby][ruby=・]ま[/ruby][ruby=・]で[/ruby][ruby=・]通[/ruby][ruby=・]り[/ruby]調和を保つだけでいいって……。"
"52220-182-カホ" = "……なるほど。"
"52220-183-カホ" = "忍術研究部の皆さん、申し訳ないのですが……。#nもう一つお願いを聞いていただけないでしょうか？"
"52220-184-イズナ" = "はいっ、なんなりと！"
"52220-185-カホ" = "直ちにお祭り運営委員会のシズコさんを、こちらにお連れいただけませんか？"
"52220-190-カホ" = "シズコさんが到着次第……和楽まつりは、予定通り開催いたします！"
"52220-192" = "次回;四面和楽歌"
