[translation]
"52070-1" = "第7話;雪国"
"52070-7" = "エビス分校付近の小さな駅"
"52070-10-レンゲ" = "うう……さぶっ！大して離れてないのに、こんな冷えるのか！？"
"52070-15-キキョウ" = "……だから着込めって言ったでしょ。"
"52070-16-キキョウ" = "北側からの寒気が、この地域の山脈にぶつかって雪を降らせてるの。#nこの北部自治区は「山を境に季節が変わる」って言われてるくらいだよ。"
"52070-17-キキョウ" = "とある本では、国境の長いトンネルを抜けると――"
"52070-22-ユカリ" = "雪国ですわーっ！"
"52070-23-ユカリ" = "こんな美しい景色、初めて見ましたの！"
"52070-28-ユカリ" = "先生先生！ほら、あそこですの！#n愛らしいイタチが元気に雪の中を走り回って……！"
"52070-29-キキョウ" = "……鼻水出てる。ほら、ハンカチ。"
"52070-33-ユカリ" = "ふ、不覚でひゅの！ありがとうございますの！"
"52070-38-ナグサ" = "……綺麗な町だね。#n大雪原の近くに、こんなところがあったなんて。"
"52070-39" = "[s] \"前来た時は、ここを通らなかったの？\""
"52070-40-ナグサ" = "あの時はアヤメを探すことに必死で、ひたすら北を目指してたから。"
"52070-41-ナグサ" = "……駅を経由した方が、早く着いてたかな。"
"52070-42" = "[s1] \"雪山を徒歩で越えるなんて……すごい。\"\n[s2] \"でも、危ないからもうやめようね。\""
"52070-45-ナグサ" = "うん、気をつける。"
"52070-46-レンゲ" = "で、幻魎百物語はどこにいるんだよ？日暮れまで待つのか？"
"52070-47-キキョウ" = "たしか、ニヤ部長はエビス分校から迎えが来るって言ってたよね。"
"52070-48-キキョウ" = "こっちは時間通りに着いたし、そろそろ……。"
"52070-53-？？？" = "百花繚乱紛争調停委員会の皆さん、ですか？"
"52070-63-？？？" = "初めまして、お待ちしていました。"
"52070-64-ナグサ" = "あなたがエビス分校の……？"
"52070-65-アザミ" = "ええ。#nエビス分校の自治委員会会長――[ruby=はぶ]土生[/ruby]アザミと申します。"
"52070-66-アザミ" = "会長といっても、他の生徒は皆、出ていってしまったのですが。"
"52070-68-レンゲ" = "大変そうだな……。"
"52070-69-ユカリ" = "たったひとりで学園を守り続けていらっしゃるだなんて、#nすごいですわ！"
"52070-70-アザミ" = "ふふっ、恐縮です。"
"52070-71-アザミ" = "とはいえ、こんな僻地に仕事と呼べるほどのこともありませんから。#n時間を持て余しているくらいですよ。"
"52070-75-アザミ" = "おや、あなたがシャーレの[USERNAME]先生ですね？"
"52070-76-アザミ" = "ニヤ部長から伺っております。#n数えきれないほどの功績をお持ちの方だと。"
"52070-77" = "[s] \"大したことはしてないよ。\""
"52070-78-アザミ" = "そうなのですか？#n想像を絶するような胆力をお持ちだと伺っておりますが……。"
"52070-79-アザミ" = "たしか、一糸まとわぬ姿で野原を疾走したとか――"
"52070-80" = "[s3] \"すごいってそっち！？\"\n[s4] \"そ、それには理由が……。\""
"52070-83-アザミ" = "ふふ、ご謙遜なさらずに。"
"52070-84-アザミ" = "大火災を収束させ、百花繚乱をまとめ――百物語を討伐した。#nその噂は、山を越えてこちらにも伝わっています。"
"52070-85-アザミ" = "[USERNAME]先生と百花繚乱の皆さんの手にかかれば、#nこの辺りの怪談も一掃できそうですね。"
"52070-86-ナグサ" = "その怪異……姿を変えて人を襲う幻魎百物語は――"
"52070-87-ナグサ" = "どこに行けば会えるの？"
"52070-88-アザミ" = "そうですね……あちこちで目撃されているのですが……。"
"52070-89-アザミ" = "いずれにしても、日が暮れるまでは出てこないかと。#nそれまでは、目撃情報があった場所を見て回るのはいかがでしょう？"
"52070-90-アザミ" = "自治区の紹介も兼ねて、私がご案内いたします。"
"52070-92-レンゲ" = "そうだな……アタシたちは土地勘もないし。頼んだよ。"
"52070-95-ユカリ" = "新しい冒険みたいで、身共、うきうきしてきましたの！"
"52070-96-キキョウ" = "まぁ……これも、任務か。"
"52070-102" = "[ns] \"よろしくね、アザミ。\""
"52070-103-アザミ" = "はい。ではこちらへ――"
"52070-109" = "エビス分校近くの商店街"
"52070-112-アザミ" = "ここは北部自治区の住民が利用する商店街です。"
"52070-113-アザミ" = "百鬼夜行の商店街には及びませんが、商会や宿泊施設もありますよ。"
"52070-119-ユカリ" = "あら？こちらのお花の彫刻はガラス製ですの？#nきらきらして、まるで宝石みたい……！"
"52070-120-アザミ" = "こちらのガラス細工は、特産品の一つでして。"
"52070-121-アザミ" = "長年ガラス細工に携わってきた職人たちが、一つ一つ手掛けております。"
"52070-122-アザミ" = "実は……最初に百物語と遭遇したのが、そのガラス職人の方でして。#n明け方に工房へ出向いた時にかち合ったとか。"
"52070-123-ナグサ" = "そのとき、百物語はどんな姿をしていたの？"
"52070-124-アザミ" = "聞くところによれば、白いイタチのような姿だったとかで……。"
"52070-125-レンゲ" = "……イタチ？全然怖くなくないか？"
"52070-126-アザミ" = "それは……。"
"52070-132-アザミ" = "ああ、ちょうどいらっしゃいました。"
"52070-139-アザミ" = "おはようございます。"
"52070-143-ガラス職人" = "……んん？どちらさんかな？"
"52070-144-アザミ" = "エビス分校の自治委員会会長、土生アザミです。#nもう、お忘れですか？"
"52070-145-ガラス職人" = "あそこにまだ生徒さんがいたのかい？#nここんとこ、物覚えが悪くなってねぇ。"
"52070-146-アザミ" = "もう、昨日もお会いしましたのに。"
"52070-147-アザミ" = "2週間ほど前、#n工房付近で目撃したという怪異についてお聞きしたいのですが……。"
"52070-151-ガラス職人" = "怪異……？ああ！あの白いイタチかい？"
"52070-152-ガラス職人" = "もちろん覚えてるとも！そりゃあ凶暴なやつだった。"
"52070-153-ガラス職人" = "小さい頃、山でイタチに噛まれたのを思い出したよ……#n本当に、あいつは恐ろしいんだ。"
"52070-168-ガラス職人" = "明け方頃、工房に入ろうとしたら……「アイツ」が目に入ってな。#nビックリして瓶を落としちまったよ。"
"52070-179-ガラス職人" = "床にガラスが飛び散ったんだが……#nそれでもアイツは、平気な顔で破片の上を歩いてた。"
"52070-180-ガラス職人" = "そこで気付いたんだ。こいつは、本物のイタチじゃないってな。"
"52070-181-キキョウ" = "……子どもの頃に怖がっていたイタチ。"
"52070-182-レンゲ" = "そういうことか……。"
"52070-183-ユカリ" = "そんな……大事なガラス瓶が割れてしまうなんて。"
"52070-184-ユカリ" = "ここに並ぶ品々を見ただけで、こだわりが伝わってきますのに……。"
"52070-188-ガラス職人" = "ああ、それなら気にしないでくれ！#nあの時に割れたのはただの牛乳瓶さ。"
"52070-189-ガラス職人" = "……にしてもこいつの価値に気づくとは、お嬢さん見る目あるね！"
"52070-190-ガラス職人" = "中に他のもあるぞ。見てみるかい？"
"52070-194-ユカリ" = "ええ、喜んで！"
"52070-201" = "エビス分校付近の農地"
"52070-202-アザミ" = "ここはエビス自治区の農地になります。"
"52070-203-アザミ" = "百鬼夜行のお祭りに使われるトウモロコシやジャガイモ、#nニンジンなどは、ここら一帯の畑で採れたものなんですよ。"
"52070-204-アザミ" = "百鬼夜行で食べるエビス産の野菜も美味しいとは思いますが……#n作物は収穫したそばから糖度が落ちていくもの。#nやはり一番は採れたてです。"
"52070-208-アザミ" = "と、いうことで……#nこちらに今しがた収穫したトウモロコシがございます。#nいかがですか？"
"52070-209-レンゲ" = "じゃあ、せっかくだし……。"
"52070-216-レンゲ" = "……あ、甘い！砂糖でもかかってるみたいだ！"
"52070-217-ユカリ" = "トウモロコシの風味が全開で、とっても美味しいですの！"
"52070-218-アザミ" = "ふふっ、この味を皆さんにお届けできて、私も嬉しいです。"
"52070-219-ナグサ" = "……ここにも百物語が出没したの？"
"52070-220-アザミ" = "ええ。#nこちらのお方が大きなクマの姿をしたものと遭遇したそうで……。"
"52070-223-農家" = "ああ、俺はこの目で見た！"
"52070-224-農家" = "先週末のことだ……畑仕事中に気配を感じて振り向いたら、#nクマがじっとこっちを見てて……。"
"52070-242-農家" = "また畑を荒らしに来たのかと思って猟銃をぶっぱなしたんだが、#nそいつはびくともしねえ！"
"52070-243-農家" = "……おかげで、本物のクマじゃないって気づいたんだけどな。"
"52070-245-キキョウ" = "野生のクマでも、猟銃で仕留めきれないヤツはいるんじゃない？"
"52070-246-レンゲ" = "このあたりじゃ、珍しくないのか？"
"52070-248-農家" = "今年は日照り続きでどんぐりや栗が少ないからな。#n冬眠し損ねたやつが、作物を狙って下りてくるんだ。"
"52070-249-農家" = "なんたって……#nうちのジャガイモは、サツマイモ顔負けの甘さだからな！"
"52070-250-農家" = "焚き火で焼き芋をしたら、#n熊も怪異も匂いに釣られて出てくるってもんよ！"
"52070-254-農家" = "せっかくだ。おやつに持ってきたんだが、お嬢ちゃん達もどうだい？"
"52070-258-ユカリ" = "ええ、いただきますわ！"
"52070-261-レンゲ" = "うおお……一口食べるたびに濃厚な甘さが広がる……#nこれ、ほんとにジャガイモなのか！？"
"52070-262-ユカリ" = "もっちりした食感も相まって……これはもう天然のすいーつですの！"
"52070-263-農家" = "はっはっは。そんなに喜んでくれると気持ちがいいな！"
"52070-264-農家" = "ちょっと待ってろ、まだあるからな！"
"52070-271-ナグサ" = "ここは……。"
"52070-272-アザミ" = "船着場です。ここから海産物をキヴォトス各地に出荷しております。"
"52070-273-アザミ" = "近海で獲れるさまざまな海産物も、#nエビス自治区の特産品の一つですからね。"
"52070-274-アザミ" = "お祭りの屋台で一番人気のイカ焼き。#nきっと、ここのイカを使っているはずですよ。"
"52070-275-キキョウ" = "……ここでも百物語が目撃されたの？"
"52070-276-アザミ" = "はい。朝の仕事を終えた漁師の方が、巨大なタカアシガニを……。"
"52070-277-キキョウ" = "……タカアシガニ？"
"52070-278-キキョウ" = "漁師なのに、カニを怖がるの？"
"52070-279-アザミ" = "私もそう思ったのですが、クモに似ていると言われまして……。"
"52070-280-アザミ" = "虫が嫌いな方は、だめかもしれませんね。"
"52070-281-ユカリ" = "今回は目撃者の方とお会いできないのですか？"
"52070-282-アザミ" = "残念ながら、今は漁に出ている時間なので……。"
"52070-283-レンゲ" = "じゃあしょうがないな。#nあんまりゆっくりもできないし、次の場所に――"
"52070-284-アザミ" = "ですが……#n実はこの近くに、すごく美味しい焼き魚を出すお店があるんです。"
"52070-285-アザミ" = "もうすぐお昼時ですし、この辺りでお食事でもいかがでしょう？"
"52070-287-キキョウ" = "……焼き魚？"
"52070-288-アザミ" = "ええ。エビスの伝統的な調理法がありまして――"
"52070-289-アザミ" = "皮がパリッとなるまで焼いた後、溶いた味噌をかけてホイル蒸しにするんです！"
"52070-290-アザミ" = "今が旬のホッケなんかは、肉厚の皮に味噌が絡みついて……#n本当に絶品なんですよ！"
"52070-291-キキョウ" = "……。"
"52070-292-アザミ" = "ですが、時間がないのでしたら致し方ありません。#n分校の方で軽くおにぎりなど――"
"52070-293-キキョウ" = "ずっと歩きづめだったし、この辺で休憩したほうが良いんじゃないかな。"
"52070-297-キキョウ" = "補給は兵法の基本だよ。そろそろお昼に――"
"52070-302-レンゲ" = "ん？そんな歩いてないだろ？"
"52070-303-キキョウ" = "私は疲れたの。"
"52070-304-キキョウ" = "……とにかく。少し休憩するのはどうかな。"
"52070-305-ユカリ" = "身共は賛成ですわ！"
"52070-306-レンゲ" = "なーんか釈然としないけど……まぁいいや。#nんじゃ、腹ごしらえしよっか！"
"52070-314" = "（その後もエビス分校の近くで聞き込みを続けたけれど、#nこれといった情報はつかめず……）"
"52070-315" = "（……気づけば日が暮れていた）"
"52070-320-ナグサ" = "……暗くなってきたね。"
"52070-321-ナグサ" = "百物語は、日が暮れてから出るっていってたよね。#n本格的な調査はこれから――"
"52070-325-アザミ" = "いえいえ。お客様に、そんなご無理はさせられません。"
"52070-326-アザミ" = "遠路はるばるいらっしゃって、お疲れでしょう。#nよろしければ、寮の部屋を好きに使ってください。#n他に生徒はいないので、数は足りると思います。"
"52070-327-ナグサ" = "いや、まだそんなには……。"
"52070-328-アザミ" = "そうだ、寮には温泉もありますよ？"
"52070-329-アザミ" = "それはそれは風流で立派な温泉なのですが……#nもし、よろしければ……。"
"52070-334-レンゲ" = "温泉！？"
"52070-335-ユカリ" = "寮に温泉があるんですの！？"
"52070-337-アザミ" = "ええ。昔は大浴場として全校生徒で使っていたようですが……#n今は私専用になってしまっていたので。"
"52070-338-アザミ" = "どうぞ旅の疲れを癒やしていってください。#nその間に、お食事の用意をしてまいりますので。"
"52070-339-レンゲ" = "くぅ～！委員会のみんなで温泉！#nこれって青春の1ページじゃん！夜は枕投げか！？"
"52070-340-レンゲ" = "みんな、早く行くよっ！"
"52070-346-キキョウ" = "はぁ……。#n水を差すようで悪いけど、あくまでこれは任務。"
"52070-347-キキョウ" = "私は部屋にいるから、入るならあんた達だけで行ってきて。"
"52070-351-レンゲ" = "え～？ノリ悪いなぁ。"
"52070-352-ユカリ" = "ぜひキキョウ先輩も一緒に参りましょう！#n身共は、先輩方と湯浴みをするのが夢だったのです！"
"52070-353-キキョウ" = "そんなこと言われても……。"
"52070-354-ユカリ" = "これからは歯磨きも忘れませんし、アイスも一日一個にしますから！"
"52070-355-キキョウ" = "それは元々約束してたでしょ？"
"52070-360-ユカリ" = "キ～キョ～ウ～せ～ん～ぱ～い～！"
"52070-365-キキョウ" = "……1時間だけね。"
"52070-366-レンゲ" = "よし、話はまとまったな？#nんじゃ、いざ温泉へ！"
"52070-367-ユカリ" = "身共、お風呂上がりにふる～つ牛乳が飲みたいですの！"
"52070-373-アザミ" = "お着替えをご用意しましょうか？"
"52070-377-ナグサ" = "あ……うん、お願い。"
"52070-378-ナグサ" = "先生はまだ休まないの？"
"52070-379" = "[s5] \"うん、ちょっと考え事があってね。\"\n[s6] \"私のことは気にしないで。\""
"52070-382-ナグサ" = "そっか。じゃあお先に。"
"52070-392-レンゲ" = "はぁぁぁ……極楽極楽ぅ。"
"52070-393-レンゲ" = "体はポカポカなのに、風が冷たくて気持ちいい～……。"
"52070-394-ユカリ" = "なんて美しい雪景色！ろまんちっくですの～！"
"52070-395-ユカリ" = "それに、こんな大きなお風呂に入るのも初めてですし……#n来られてよかったですの！"
"52070-402-キキョウ" = "……。"
"52070-403-レンゲ" = "キキョウ、なにモタモタしてんだ？"
"52070-404-レンゲ" = "もしかして……入るのが怖いのか？"
"52070-405-キキョウ" = "なっ！？百花繚乱の参謀が水を怖がるわけ――！"
"52070-409-キキョウ" = "……か、勘違いしないで。私はお風呂の入り方を守っているだけ。"
"52070-410-キキョウ" = "足先から少しずつお湯をかけて慣らしていかないと。#nヒートショックが怖いからね。"
"52070-411-レンゲ" = "寒い中飛び込むのも楽しいぞ？"
"52070-412-レンゲ" = "ナグサ先輩もそう思わないか？"
"52070-413-ナグサ" = "……うん。#nお風呂、温かくて気持ちいいね。"
"52070-414-ナグサ" = "なんだか、一日の疲れが流れていくみたい。"
"52070-415-キキョウ" = "……今日は観光してただけな気がするけど。"
"52070-416-レンゲ" = "だなぁー。#n……なんだかんだで、どっかの誰かさんが一番楽しんでたけど。"
"52070-417-キキョウ" = "何か言った？"
"52070-418-ユカリ" = "身共も、今日は本当に楽しかったですわ！"
"52070-419-ユカリ" = "美しい景色に、住民の皆さまとお話するひととき……#nそれに、トウモロコシもジャガイモも焼き魚も、#nとーってもおいしゅうございました！"
"52070-420-ユカリ" = "ただ……。"
"52070-421-ユカリ" = "ナグサ先輩のお顔が、なんだか暗いように見えて……。"
"52070-422-ナグサ" = "……そう？"
"52070-423-キキョウ" = "うん。エビス分校に着いてから、ずっと険しい顔してたよ。"
"52070-424-キキョウ" = "大雪原に行った日のことでも思い出してた？"
"52070-425-レンゲ" = "それか、百物語の気配を感じたり――"
"52070-426-ナグサ" = "そんなんじゃないよ。百物語の気配はしなかった。"
"52070-427-ナグサ" = "ただ……。"
"52070-428-ナグサ" = "相手の恐怖を形にする怪異は、#n私の前でどんな姿を見せるんだろうって思ったの。"
