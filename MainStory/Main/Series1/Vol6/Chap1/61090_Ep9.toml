[translation]
"61090-1" = "第9話;授業の時間"
"61090-2-サオリ" = "ふぅ……。"
"61090-3-スバル" = "うっ、ううっ……！"
"61090-8-サオリ" = "僅かな差だったが……。"
"61090-9-サオリ" = "これで、決着はついたはずだ。"
"61090-10-スバル" = "スクワッド……少し、鈍りましたか？"
"61090-11-サオリ" = "そうかもしれないな。"
"61090-12-サオリ" = "だが、お前たちほどじゃない。#n動きが全体的に精彩を欠いている。"
"61090-13-スバル" = "……！"
"61090-14-ミサキ" = "で、どうするつもりなの？"
"61090-15-ミサキ" = "「存在価値」は証明できたと思うけど。"
"61090-19-不安げなアリウスの生徒A" = "まあ、しょうがないとは思うけど……。"
"61090-20-不安げなアリウスの生徒B" = "あいつら、調子に乗って……！"
"61090-21-不安げなアリウスの生徒C" = "どうせ「外」でいろいろ経験してきたんでしょ。#n最初から勝敗なんて見えてたんだし。"
"61090-22-不安げなアリウスの生徒A" = "アリウスを捨てたくせに、今さら口出ししないでよ……！"
"61090-23-ミサキ" = "はぁ……。"
"61090-24-アツコ" = "落ち着いて、ミサキ。"
"61090-25-アツコ" = "これは、私たちが受け止めるべきことだよ。"
"61090-26-不安げなアリウスの生徒A" = "先生って大人もそう。#n勝手で、強引で……。"
"61090-27-不安げなアリウスの生徒B" = "「アリウスのため」とか言いながら、どうせ裏では別のこと考えてるんでしょ……。"
"61090-35-不安げなアリウスの生徒B" = "うわっ！？"
"61090-36-不安げなアリウスの生徒C" = "ちょ、ちょっと！？大丈夫！？"
"61090-37-不安げなアリウスの生徒B" = "気絶してる……。"
"61090-38-不安げなアリウスの生徒C" = "予備動作もなしに、胸へのダブルタップからのヘッドショット……。"
"61090-39-不安げなアリウスの生徒B" = "スバル先輩は鈍ったって言ってたけど……全然そんな感じじゃないよ……。"
"61090-41-ミサキ" = "アツコ！？"
"61090-42-ヒヨリ" = "ひいいいぃぃっ！？"
"61090-43-アツコ" = "私たちのことは何と言おうと構わない。#nでも、先生のことも悪く言うのはやめてくれる？"
"61090-44-アツコ" = "そのくらいの分別は、あると思ってるよ。"
"61090-45-アツコ" = "私も、まだアリウスの一員なんだからね？"
"61090-46-アリウスの生徒たち" = "は、はいっ！"
"61090-47-スバル" = "……。"
"61090-49" = "（みんな、どこか怯えたような顔で縮こまっている）"
"61090-50" = "（もう少し、明るい雰囲気で話をするためには……） "
"61090-51" = "[ns]\"よし、みんな！勉強をしよう！\""
"61090-52-スバル" = "勉強って……一体何をしろっていうんですか！？#n私たちにはなにもないんですよ！"
"61090-53-スバル" = "知識はない、教室もボロボロ。#n道具も、教える人すら……。"
"61090-54-スバル" = "……言葉にすると悲しくなりますね。"
"61090-55" = "[s1]\"大丈夫だよ。\"\n[s2]\"椅子と机と黒板さえあれば、どうとでもなるから。\""
"61090-60" = "[ns]\"それに、教える人もちゃんといるよ。\""
"61090-64-スバル" = "……本当にここでやるんですか？"
"61090-65" = "[s3]\"机はあるし、椅子も起こせば問題ない。\"\n[s4]\"教卓も黒板もある！完璧な教室じゃないかな？\""
"61090-68-スバル" = "「完璧」という言葉の定義が、私の知らない間に大きく変わったんでしょうか……。"
"61090-69-スバル" = "意味を調べようにも、辞書なんてアリウスにはほとんど残っていないわけですが……。"
"61090-70-スバル" = "いずれにせよ、今日はもういい時間です。#nもうすぐ夜になりますし……。"
"61090-71" = "[s5]\"初回は短めだから大丈夫だよ。\"\n[s6]\"出席を取って、軽くガイダンスをして終わりかな。\""
"61090-74-サオリ" = "それで本当に大丈夫なのか……？"
"61090-75" = "[s]\"大丈夫。私はサオリを信じてるよ！\""
"61090-76-ミサキ" = "！？"
"61090-77-ヒヨリ" = "！？"
"61090-78-サオリ" = "なぜこの流れで私の名前が出てくるんだ……？"
"61090-79" = "[s7]\"それは……選抜された教育実習の先生方が！\"\n[s8]\"1時間目の授業を行うからです！\""
"61090-82-アツコ" = "その選抜はいつの間に行われてたの？"
"61090-83-アツコ" = "今……？……ああ、なるほどね。"
"61090-84-サオリ" = "まさか、先生の話していた「壮大な計画」はこれのことだったのか！？"
"61090-85-ミサキ" = "勉強はちゃんとやってる？って、このための確認だったんだ……。"
"61090-86-ミサキ" = "もっと事前に打ち合わせするとかできたでしょ……はぁ……。"
"61090-87-サオリ" = "では、私は……私が……？"
"61090-88" = "[s]\"教えてください、サオリ先生！\""
"61090-89-アツコ" = "うん、教えてくださいな。サオリ先生。"
"61090-90-サオリ" = "アツコまで……！？"
"61090-92" = "（サオリは、ぎこちない表情ながらも教壇に立った）"
"61090-94-サオリ" = "（何をどう教えれば……）"
"61090-95-サオリ" = "（ん？これは……社会の教科書か。……社会文化、社会契約論？）"
"61090-99-サオリ" = "（できる……これなら！）"
"61090-100-サオリ" = "授業を始める！着席！"
"61090-101-アリウスの生徒A" = "え、本当に座らなきゃダメ？"
"61090-102-アリウスの生徒B" = "あ、私……もう座ってるんだけど……。"
"61090-103-サオリ" = "ノートを開け。無ければ生徒手帳でもいい！#nそれなら全員一冊ずつ持っているはずだ。"
"61090-104-サオリ" = "それすら無いなら、隣のやつのを後で写しておけ。"
"61090-105-サオリ" = "聞くだけと、手を動かすのとでは、残る知識の量がまったく違うからな。"
"61090-106-アリウスの生徒A" = "は、はいっ！"
"61090-107-アリウスの生徒B" = "まんま、教官やってた頃のサオリ先輩だ……。"
"61090-108-サオリ" = "授業に入る前に、一つ言っておくことがある。"
"61090-112-サオリ" = "契約書は！本当に重要だ！！"
"61090-113-アリウスの生徒A" = "けいやくしょ……？"
"61090-114-アリウスの生徒B" = "なにそれ……外の文化……？"
"61090-115-サオリ" = "契約書とは、約束を忘れないために、相手と取り交わす書類のことだ。"
"61090-116-サオリ" = "これがなければ！どれだけ仕事こなしても！報酬を受け取れない！"
"61090-117-サオリ" = "苦労だけして、手ぶらで帰ってくるなんてザラだということだ！！"
"61090-118-アリウスの生徒A" = "魂のこもった叫びだ……。"
"61090-119-アリウスの生徒B" = "まさか……実体験……？"
"61090-120-アツコ" = "頑張って、サッちゃん……！"
"61090-121-ヒヨリ" = "サオリ姉さん……！"
"61090-123-サオリ" = "……社会とは、実体のないものだ。#n構成員の契約で成り立っている、人工的な仕組みというのが「社会契約論」のメインだ。"
"61090-124-サオリ" = "つまり、最初から社会というものはなく、全ての人には生まれながらに与えられた固有の権利がある、ということだ。"
"61090-125-マイア" = "あ、あのっ……質問、してもいいですか？"
"61090-126-サオリ" = "言ってみろ。"
"61090-127-マイア" = "最初からないって言いましたけど、それなら……生まれつきの権利も存在しないんですか……？"
"61090-128-サオリ" = "いい質問だ。たしかに一見、矛盾しているように聞こえるかもしれない。"
"61090-129-サオリ" = "だが、こういう前提があると思ってほしい。"
"61090-130-サオリ" = "人間には生まれながらに権利がある、と「仮定する」ことが――"
"61090-131-サオリ" = "より良い社会を作る可能性を高めるのだと。"
"61090-132-アリウスの生徒A" = "実際は違っても、そうだと「考えてしまった方が」結果的にはいいってこと……？"
"61090-133-アリウスの生徒B" = "そんな風に考えたことなかった……！"
"61090-137-サオリ" = "時間だな。今日の授業はここまでだ。"
"61090-138-サオリ" = "質問があれば、次の授業で尋ねるといい。"
"61090-139-サオリ" = "予習は……まだ難しいだろうが、復習はしっかりやっておくように。"
"61090-140-サオリ" = "学習効果は、予習より復習のほうが高いからな。"
"61090-144-サオリ" = "その……どうだっただろうか……？"
"61090-145" = "[s9]\"最高でした、サオリ先生……。\"\n[s10]\"感動しました、サオリ先生……。\""
"61090-148-サオリ" = "「先生」と呼ばれるほど、私はまだ……。"
"61090-149-サオリ" = "ともかく、うまくやれていたなら、よかった。"
"61090-151" = "[ns]\"それじゃあ次は、物理担当のミサキ先生です！\""
"61090-152-ミサキ" = "……私？しかも物理って……冗談でしょ？"
"61090-153-ミサキ" = "は？弾道学は古典力学と近い……？"
"61090-154-ミサキ" = "……。"
"61090-155-ミサキ" = "完全に無関係でもないけどさ……。"
"61090-156-ミサキ" = "はぁ……やればいいんでしょ。"
"61090-159-ミサキ" = "まずは公式を覚えて。どうせ頭のスイッチ入ってないだろうし？"
"61090-160-ミサキ" = "内容の理解までは求めてないから！その領域にないし。"
"61090-161-ミサキ" = "数学も物理も、とりあえず暗記することが始まりだからね！"
"61090-162-ミサキ" = "まあ……もし最初から理解できるなら、そっちの道をおすすめするけど。"
"61090-163-ミサキ" = "でも、そういうタイプの子って、数値と統計で人を見ようとしたり――"
"61090-164-ミサキ" = "他人の気持ちを理解できなくて、余計な騒ぎを起こすこともあるけどね……。"
"61090-166-アツコ" = "こんにちは。生物の授業を担当する[ruby=はかり]秤[/ruby]アツコです。"
"61090-167-アツコ" = "早速授業を始めようか。#n生物学は楽しいし、とても大切な分野なんだよ。"
"61090-168-アツコ" = "例えば「細胞」とは何か？"
"61090-169-アツコ" = "打撲がどんなプロセスを経て治っていくのか――実例を見ながら。"
"61090-170" = "[s]\"アツコ！ストップ！ストップ！\""
"61090-171-アツコ" = "どうして止めるの？これは、すごく大事な話なんだよ？"
"61090-172-アツコ" = "ふふ、大丈夫。ちゃんと加減はわかってるつもり。"
"61090-173-アツコ" = "じゃあまずは「白血球と赤血球」から始めようか。"
"61090-175-アツコ" = "これで、細胞の構成要素とその役割についてはざっくり説明できたかな。"
"61090-176-アツコ" = "細胞は、生き物の一番基本になる単位とも言えるものだから、しっかり覚えておいてね。"
"61090-178-ヒヨリ" = "……。"
"61090-179-ヒヨリ" = "あ、あの……皆さん。えへへ……お久しぶりですね……。"
"61090-180-ヒヨリ" = "えっと、それで……。"
"61090-184-ヒヨリ" = "せ、先生！？わ、私はどうしたらいいんでしょうか……？"
"61090-185-ヒヨリ" = "私、普段は雑誌くらいしか読んでないですし……専門的に知ってることなんて……。"
"61090-186" = "[ns]\"……！\""
"61090-188" = "[ns]（雑誌と聞いて、ひらめいた）"
"61090-189-ヒヨリ" = "えっ？外の世界の暮らしについて話してみたら……って？"
"61090-190-ヒヨリ" = "雑誌で見た服とか……食べものとか……？"
"61090-191-ヒヨリ" = "……。"
"61090-192-ヒヨリ" = "はい！それなら……話せそうです……！"
"61090-194-ヒヨリ" = "あ、あらためて……こんにちは……。"
"61090-195-ヒヨリ" = "突然でびっくりしちゃうかもしれないんですけど……あの……。"
"61090-196-ヒヨリ" = "「ファッション」って、どう思いますか？"
"61090-200-ヒヨリ" = "えへへ……そ、そうですよね。突拍子もない話題ですよね……。"
"61090-201-ヒヨリ" = "でも、ファッションって……ただ服を着るんじゃなくて……#n他人からどう見られたいかを、自分で決めること……だと思うんです……。"
"61090-202-ヒヨリ" = "そういうのって意外と……大事なんじゃないかなって……。"
"61090-203-ヒヨリ" = "そ、それと……「外」の人たちの暮らし方とか……#n「生活」のことも……！"
"61090-205" = "（ヒヨリの講義は、4人の中で一番好評だった）"
"61090-209" = "（スクワッドのみんなが先生として活躍してくれたおかげか）"
"61090-210" = "（アリウスの生徒たちから「授業」への警戒心が薄れていくのを感じた）"
"61090-211" = "（まさに、この瞬間を待っていた！）"
"61090-213" = "[ns11]\"――なので、こういう結論が導き出せます。\"\n[ns12]\"自明であるということは――\""
"61090-219" = "（少なくない生徒たちが、しっかりと授業についてきてくれた）"
"61090-225" = "（……もちろん、真逆の生徒もいたけれど）"
"61090-226" = "（そのどちらもが「学園生活」なのだろうと思った）"
"61090-228" = "[ns]\"今日の授業はここまで！お疲れさまでした！\""
"61090-229-アリウスの生徒A" = "お疲れさまでした……。"
"61090-230-アリウスの生徒B" = "うーん……頭痛い……。"
"61090-231-アリウスの生徒A" = "でも、意外とやる価値あったかも？"
"61090-232-アリウスの生徒B" = "ちょっとノート見せて。"
"61090-233-アリウスの生徒A" = "さっき何やってたんだよ？"
"61090-234-アリウスの生徒B" = "いや、ちょっとボーッとしてて……。"
"61090-238-スバル" = "……。"
"61090-240-サオリ" = "とりあえず……ここは先生が自由に使ってくれ。"
"61090-241-サオリ" = "……すまない。こんな場所しか用意できなくて。"
"61090-242" = "[s13]\"寝袋を持ってきたから大丈夫だよ。\"\n[s14]\"ほら。うん、悪くない。\""
"61090-248" = "[ns]\"……サオリ？\""
"61090-249-サオリ" = "……先生。"
"61090-250-サオリ" = "ほんの少しでいい。"
"61090-251-サオリ" = "今日のことも含めて、相談したいことがあるんだが……いいだろうか。"
"61090-253" = "次回;傷と痕跡"
