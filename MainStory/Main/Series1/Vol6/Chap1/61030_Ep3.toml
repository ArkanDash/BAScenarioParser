[translation]
"61030-1" = "第3話;夢のような日々"
"61030-6-控えめなトリニティの生徒A" = "どうぞ、上がってください。"
"61030-7-控えめなトリニティの生徒B" = "こ、ここが……私たちの、部屋でして……。"
"61030-9" = "[ns1]\"お邪魔します。\"\n[ns2]\"それで……何の用かな。\""
"61030-12-控えめなトリニティの生徒A" = "あっ、そうだった……！うっかりしてた……！"
"61030-13-控えめなトリニティの生徒B" = "えっ？な、なにが……？あっ……！"
"61030-14-控えめなトリニティの生徒A" = "せ、せせせ、先生っ！本当に、本当に申し訳ないんですけど……。"
"61030-15-控えめなトリニティの生徒B" = "5分だけ、部屋の外で待っててもらえたり……しませんかっ！？"
"61030-16-控えめなトリニティの生徒A" = "お呼びしておいて、こんなお願いをするのは#n失礼だって分かってるんですけど……！"
"61030-17-控えめなトリニティの生徒B" = "お、お願いしますっ！5分だけでいいんです！"
"61030-19" = "（2人に従って、廊下で待つことにした）"
"61030-20" = "（しばらくして……）"
"61030-24-控えめなトリニティの生徒A" = "もう入っても大丈夫です……。#nい、いえ！どうぞお入りくださいっ！"
"61030-31" = "[ns]\"え……！？\""
"61030-32-アリウスの生徒A" = "あ、改めまして……こんにちは、先生。"
"61030-33-アリウスの生徒B" = "すみません！びっくりさせてしまって……。#nでも、そんなつもりじゃなくて……！わ、私たち……えっと……。"
"61030-34-アリウスの生徒A" = "トリニティの皆さんの言い方を借りるなら――#n私たちはアリウスからの編入生です！"
"61030-36" = "[ns]\"あ……！\""
"61030-44-アリウスの生徒A" = "……あの日、マダムはアリウスからいなくなりました。"
"61030-45-アリウスの生徒B" = "そこまではよかったんです。#nでも、残された私たちは……この先どうなるのか、どうやって生きていけばいいのか、って。みんな不安でした。"
"61030-46-アリウスの生徒A" = "そんな中、ある日突然……知らない子が声をかけてきたんです。"
"61030-49-？？？" = "……ここなら、大丈夫そうですね。"
"61030-53-アリウスの生徒A" = "えっ……！？その制服……！"
"61030-54-アリウスの生徒B" = "ト、トリニティ！？"
"61030-58-見知らぬトリニティの生徒" = "しーっ。#nごめんなさい、驚かせてしまいましたね。"
"61030-59-見知らぬトリニティの生徒" = "おっしゃる通り、私はトリニティから来ました。#n本来はこれではなく……「ティーパーティー」の制服を着ているのですが。"
"61030-61-アリウスの生徒A" = "ティーパーティー……？"
"61030-62-アリウスの生徒B" = "それって……何ですか？"
"61030-64-見知らぬトリニティの生徒" = "……。"
"61030-65-見知らぬトリニティの生徒" = "紅茶を嗜む集まり……のようなものです。"
"61030-67-アリウスの生徒A" = "えっ！？トリニティに編入できるんですか！？"
"61030-68-アリウスの生徒B" = "でも私たちは、その……トリニティとは……。"
"61030-70-見知らぬトリニティの生徒" = "ええ、おっしゃりたいことは分かります。"
"61030-71-見知らぬトリニティの生徒" = "ですから、強要するつもりも、プレッシャーをかけるつもりもありません。#nあくまで……ただの「提案」です。"
"61030-72-見知らぬトリニティの生徒" = "トリニティで新たな生活を始める。#nその道があるのだと、ご理解いただければ。"
"61030-73-見知らぬトリニティの生徒" = "もちろん、他の道を選んだとしても……私たちはその選択を尊重します。"
"61030-74-アリウスの生徒A" = "で、でも、急にこんな話をされても……。"
"61030-75-見知らぬトリニティの生徒" = "ご安心ください。返答は急ぎません。#nだからこそ、時間をかけてゆっくり考えていただきたいのです。"
"61030-76-見知らぬトリニティの生徒" = "トリニティ……いえ、ティーパーティー……の一部、には皆さんを歓迎する用意がありますから。"
"61030-77-見知らぬトリニティの生徒" = "…[ruby=おおやけ]…公に[/ruby]は、難しいかもしれませんが。"
"61030-78-アリウスの生徒B" = "あ、あの……私たちがトリニティに編入できて……#n一部の人がそれを歓迎してくれるとして……。"
"61030-79-アリウスの生徒B" = "他の方々は、果たして認めてくれるのでしょうか……？"
"61030-80-見知らぬトリニティの生徒" = "ええ、そこが私たちにとって一番悩ましいところです。#nトリニティには……本当にたくさんの派閥や部活が存在しますので。"
"61030-81-見知らぬトリニティの生徒" = "そのため、もし編入を選ばれた場合――#n書類上は「田舎からの転校生」として、処理されることになります。"
"61030-82-見知らぬトリニティの生徒" = "……それが、今の私たちにできる最大限の支援です。"
"61030-87-アリウスの生徒A" = "……。"
"61030-88-アリウスの生徒B" = "……。"
"61030-90-見知らぬトリニティの生徒" = "重ねてになりますが、焦らず、ゆっくり考えていただいて構いません。"
"61030-94-見知らぬトリニティの生徒" = "そして、思い定まったその時は……この番号にご連絡ください。"
"61030-97-アリウスの生徒A" = "……。"
"61030-98-アリウスの生徒B" = "……。"
"61030-100-アリウスの生徒A" = "……私たちは悩みました。"
"61030-101-アリウスの生徒B" = "本当に……たくさん悩んで話し合いました。"
"61030-102-アリウスの生徒A" = "不安だったんです。#n私たちの立場、アリウスの外の世界、トリニティのこと……。"
"61030-106-アリウスの生徒B" = "決定打になったのは……今よりはマシになるかもしれない、という気持ちでした。"
"61030-115" = "[ns]\"そんなことがあったんだね……。\""
"61030-116-アリウスの生徒A" = "はい……。 "
"61030-117-アリウスの生徒B" = "最近……私たち以外にも、トリニティに来る子が増えてきたんです。"
"61030-118-アリウスの生徒A" = "ほとんどが1年生か2年生ですけど……。"
"61030-120" = "[ns3]\"君たち以外にも……。\"\n[ns4]\"……本当に、大変だったね。\""
"61030-123-アリウスの生徒A" = "いえ、大変なんてことは。#nでも……まだ夢の中にいるような感じで……。"
"61030-124-アリウスの生徒B" = "前は……布団なんて贅沢すぎて、古い毛布が手に入るだけで幸せだったのに。"
"61030-125-アリウスの生徒A" = "ベッドって、本当に素晴らしいですね。えへへ……。"
"61030-126-アリウスの生徒B" = "あっ、一応「ベッドのようなもの」はアリウスにもあったんですが……#nそういうものを頼ると弱くなるって……。"
"61030-131" = "[ns]\"……ごめんね。\""
"61030-134" = "（頭を下げて、2人に謝った）"
"61030-135-アリウスの生徒A" = "ええええっ！？な、ななな、なんで先生が謝るんですかっ！？"
"61030-136-アリウスの生徒B" = "そ、そうです！先生のおかげで、私たちは……。"
"61030-137" = "[s]\"それでも、君たちのことを気にかけてこなかった。\""
"61030-138-アリウスの生徒A" = "で、でも！そんなこと言われたら、私たちは……。"
"61030-139-アリウスの生徒B" = "そ、それに！先生に相談したかったのは、そういうことじゃなくて……！"
"61030-141" = "（2人の話を聞くために、ここに来ていたことを思い出した）"
"61030-143-アリウスの生徒A" = "えっと……相談というのはですね……。"
"61030-144-アリウスの生徒B" = "その……えっと……今更なんですが……。"
"61030-145-アリウスの生徒B" = "[ruby=・   ・   ・   ・   ・   ・   ・]そうごうしけん[/ruby]……ってなんですか？"
"61030-146" = "[s]\"……え？\""
"61030-147-アリウスの生徒A" = "そもそも、「しけん」というものが何なのか、よく分からなくて……。"
"61030-148-アリウスの生徒B" = "アリウスにいたときとは、何もかもが違うので……。"
"61030-149-アリウスの生徒A" = "でも、周囲の子に聞くのはちょっと変な気がしてしまって。"
"61030-150-アリウスの生徒B" = "トリニティの生徒は、みんな知ってて当たり前のようでしたし……。"
"61030-151-アリウスの生徒A" = "でも、先生なら……と思って。"
"61030-152-アリウスの生徒B" = "そうです！先生はその……先生、ですから！"
"61030-154" = "[ns]\"……なるほどね。\""
"61030-156" = "[ns]\"そういえば、今更だけど……こうして顔を合わせるのは初めてだよね？\""
"61030-157-アリウスの生徒A" = "そ、そうですね……それも、当然のことだとは思いますが。"
"61030-158-アリウスの生徒B" = "そうですよ。だって私たちは……アリウス出身、ですから……。"
"61030-159-アリウスの生徒A" = "そんな風には言わないで……って、それは、でも……。"
"61030-160-アリウスの生徒B" = "わ、分かりました。少なくとも、先生の前では――"
"61030-166-アリウスの生徒A" = "……っ！？"
"61030-167-アリウスの生徒B" = "ひっ――！"
"61030-169" = "（頭を撫でようと手を伸ばした。けれど――）"
"61030-170" = "（2人は怯えて、反射的に数歩後ずさりした）"
"61030-177-アリウスの生徒A" = "す、すすすす、すみません先生。#nこれは、その！"
"61030-178-アリウスの生徒B" = "ち、違うんです……！先生を怖がってるわけじゃなくて……！"
"61030-179" = "[s]\"うん。大丈夫だよ。\""
"61030-180-アリウスの生徒A" = "で、でも……。"
"61030-181-アリウスの生徒B" = "……。"
"61030-183" = "[ns]\"大丈夫。\""
"61030-185" = "[ns]\"……もう全部、大丈夫だから。\""
"61030-189" = "（まるで、怯えた小動物のように、2人はそろそろと近づいてきた）"
"61030-190-アリウスの生徒A" = "あうぅ……。"
"61030-191-アリウスの生徒B" = "うっ……ぐすっ……。"
"61030-193" = "（今度はゆっくりと手を伸ばす。2人の体格は、普通の生徒よりも……少しだけ小さい気がした）"
"61030-194" = "（2人が落ち着くまで待ってから、試験とは何か、それがなぜ大切なのかを、少しずつ説明した）"
"61030-196-アリウスの生徒A" = "そう、なんですね……。1回の試験だけで評価しようとするのって、ちょっともったいない気もするけど……。"
"61030-197-アリウスの生徒B" = "でも、勉強したことをちゃんと覚えてるか確認するためなんですね。"
"61030-198-アリウスの生徒A" = "……そう考えると、アリウスにも「試験」はあったのかもしれません！"
"61030-199-アリウスの生徒B" = "弾倉の重さだけで残弾数を判断したり、接近戦の対応法とか……。"
"61030-203-アリウスの生徒A" = "ヘイローを効率よく壊すには、とか……そんなのばっかりでしたけど。"
"61030-204-アリウスの生徒B" = "ちょっ、ちょっと……！"
"61030-205-アリウスの生徒A" = "え……？あっ！"
"61030-206-アリウスの生徒A" = "ご、ごめんなさい！変な話しちゃって……！"
"61030-207-アリウスの生徒A" = "え？今はどうしているのか……ですか？#nそれは、えっと……。"
"61030-208-アリウスの生徒B" = "その……普通の「学園生活」をしてました！えへへ……。#n私たちがそう言うと、なんか、変な感じですけど。"
"61030-209-アリウスの生徒A" = "楽しい……のはそうなんですけど……#nなんだか、不思議でした……。"
"61030-210-アリウスの生徒B" = "夜に見張りをしなくてもいいし、一日に何回もご飯を食べられるし。#n怒鳴られたり、独房に入れられたりもなくて……。"
"61030-211-アリウスの生徒A" = "だから、でしょうか。温かいというより、ちょっと……暑いかもしれません。"
"61030-212-アリウスの生徒B" = "……アリウスは、寒かったので。"
"61030-214" = "[ns]\"トリニティの子とは仲良くできてる？\""
"61030-215-アリウスの生徒A" = "あ、はい。もちろん。#nアリウスではなく、田舎の学園から来た転校生ということになってるので。"
"61030-216-アリウスの生徒A" = "皆さん、すごく優しくて……逆に気を使わせちゃってる気もして。#nちょっと落ち着かないんですけどね。"
"61030-217-アリウスの生徒B" = "そうそう！たまに、みんなと一緒に「カフェ」に行ったりするんです。"
"61030-218-アリウスの生徒B" = "あんなに高いものを迷いなく注文するので……#n驚かないようにするの、大変なんですよ。"
"61030-219-アリウスの生徒A" = "あと、コーヒーとかケーキの名前、全然覚えられなくて……#nでも、すっごくおいしいです。えへへ……。"
"61030-220-アリウスの生徒B" = "その……お茶代とか、いろいろ出費があるのでアルバイトもしてて……。"
"61030-221-アリウスの生徒A" = "それも楽しいんです！#n色々社会勉強になるといいますか。"
"61030-222-アリウスの生徒B" = "給料日前になると、お財布が軽く感じたりするんですが……#nそれが、逆にちゃんと自分でお金を稼いでいる実感があったりもして……。"
"61030-223" = "[s]\"大人になっても、給料日前はお財布が軽くて悲しくなるんだよね……。\""
"61030-224-アリウスの生徒A" = "せ、先生もなんですか！？#n先生ってもっと……もっとこう、すごい人だと思ってたのに……。"
"61030-225-アリウスの生徒A" = "もっとお金持ちで、余裕があるというか……。"
"61030-226-アリウスの生徒B" = "意外とみんな蓋を開ければ似たようなもの……と、先生が言うのなら……#nなんだか、それだけで救われる気がします……。"
"61030-227-アリウスの生徒B" = "はい……なんか、嬉しいです……。"
"61030-228-アリウスの生徒A" = "……。"
"61030-229-アリウスの生徒B" = "……。"
"61030-230-アリウスの生徒A" = "あの、先生……。"
"61030-231-アリウスの生徒A" = "もうお気づきかもしれませんが……。"
"61030-232-アリウスの生徒B" = "アリウスの全員が、トリニティに来たわけじゃないんです……。"
"61030-233" = "[s]\"……やっぱり、そうなんだね。\""
"61030-234-アリウスの生徒A" = "うまく伝えられるか、分からないのですが……。"
"61030-235-アリウスの生徒A" = "アリウスに残ることを選んだ子もいました。"
"61030-236-アリウスの生徒B" = "理由はそれぞれでしたけど……。"
"61030-237-アリウスの生徒B" = "でも結局は、トリニティやこの世界が受け入れられない。#nその気持ちが大きかったんだと思います。"
"61030-238-アリウスの生徒B" = "……ここで過ごすようになってから、たまに考えるんです。"
"61030-245-アリウスの生徒B" = "たまたま、育ってきた場所が違うというだけで――"
"61030-246-アリウスの生徒B" = "片方は、一日に一回ご飯を食べるだけでも精一杯で……。"
"61030-247-アリウスの生徒B" = "もう片方は、カフェで高いお菓子を当たり前のように楽しんでる。"
"61030-248-アリウスの生徒B" = "本来なら……2つの学園の差なんて、ほとんどなかったはずなのに。"
"61030-255-アリウスの生徒A" = "アリウスに残ったみんなが、今どうしてるのかは……私たちにもよく分かりません。"
"61030-256-アリウスの生徒A" = "想像はできますけど……それは、想像でしかないですし……。"
"61030-257-アリウスの生徒A" = "でも、噂で聞いたことがあるんです。"
"61030-258-アリウスの生徒B" = "外部との接触を断って、今もどこかで……抵抗を続けてるって。"
"61030-260-アリウスの生徒A" = "考え方は人それぞれだから、できるだけ尊重すべきだと……#n頭では分かってます。"
"61030-261-アリウスの生徒B" = "でも、どうしても……残ったみんなのことが心配で……。"
"61030-262-アリウスの生徒A" = "毎晩のように、夢で見るんです。アリウスにいた頃のことを。"
"61030-263-アリウスの生徒B" = "うなされて目を覚ますんですけど……#n時々、それが同時になることもあるくらいで。"
"61030-264-アリウスの生徒A" = "あまりに数が多いので……どっちが多く飛び起きたか、声が大きかったか。記録をつけてるんです。えへへ……。"
"61030-265-アリウスの生徒B" = "今のとこ、私の勝ちだよね。"
"61030-266-アリウスの生徒A" = "今日はほとんど同じ時間だったよ！"
"61030-267-アリウスの生徒B" = "ほとんどって、1分差ついてたでしょ！"
"61030-272-アリウスの生徒A" = "これは、変に聞こえるかもしれませんが……。"
"61030-273-アリウスの生徒A" = "さっきの先生の話……試験の説明を聞いて、思ったんです。"
"61030-274-アリウスの生徒A" = "アリウスに残ったみんなにも、試験を受けられるようにしてあげたいなって……。"
"61030-276-アリウスの生徒B" = "えっ、そんなこと考えてたの？"
"61030-277-アリウスの生徒A" = "や、やっぱり変かな……？"
"61030-278-アリウスの生徒B" = "ううん。私も同じこと思ってたから、ちょっとびっくりして……。"
"61030-279" = "[ns]\"どうしてそう思ったのか、聞いてもいいかな。\""
"61030-281-アリウスの生徒A" = "えっと、その、なんというか……。"
"61030-282-アリウスの生徒A" = "朝起きて、授業を受けて、友達と遊んで、温かいベッドで眠って……#nそれでたまに試験もあって……そういうのが……。"
"61030-283-アリウスの生徒A" = "なんだか、素敵だと思って。生徒の本分、というか。"
"61030-284-アリウスの生徒B" = "勉強が嫌とか、面倒くさいとか。トリニティの子がよく言ってるのを聞きます。"
"61030-285-アリウスの生徒B" = "でも、私たちは勉強が嫌いなわけじゃないんです。#n追いつくのが大変だなとは思いますけどね。"
"61030-286-アリウスの生徒A" = "ここで教わったんです。#n生徒の本分は――勉強だって。"
"61030-288" = "[ns]\"……！\""
"61030-295-アリウスの生徒A" = "せ、せせせ……先生っっっ！？"
"61030-296-アリウスの生徒B" = "せ、先生！？！？"
"61030-297" = "（たまらず、2人の頭をわしゃわしゃとなでた）  "
"61030-299" = "[ns]\"あっ、ごめん！つい……。\""
"61030-301-アリウスの生徒A" = "だ、大丈夫ですっ！本当に、へ、平気ですから！"
"61030-302-アリウスの生徒B" = "せ、先生さえよければ、もう少しだけ……#nこのままでも……いい、ですか……？"
"61030-303-アリウスの生徒A" = "……。"
"61030-304-アリウスの生徒B" = "……。"
"61030-305-アリウスの生徒A" = "先生の手……あったかいです……。"
"61030-306-アリウスの生徒A" = "ほんとに、あったかい……です。えへへ……。"
