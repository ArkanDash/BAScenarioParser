[translation]
"63050-1" = "第5話;あの日のハーモニカ"
"63050-3-マイア" = "これ、ハーモニカ……。#n先輩が落としたみたいだったので、拾っておきました……。"
"63050-7-マイア" = "あっ、でも、今すぐ吹いてほしいとかじゃなくて……！"
"63050-8-マイア" = "今はきっと、いろいろ大変でしょうし……！"
"63050-9-マイア" = "でも、いつかまた……あの時みたいに……。"
"63050-10-マイア" = "先輩の演奏、聴かせてほしいです……。"
"63050-11-スバル" = "あ……ああ……。"
"63050-12-スバル" = "（こんな結末を望んだ訳じゃなかった）"
"63050-13-スバル" = "（責任から目を背けてはいけない）"
"63050-14-スバル" = "（それは、当然のことなのに）"
"63050-19-ミサキ" = "消えた……！？"
"63050-20-マイア" = "先輩！"
"63050-21-アツコ" = "探そう。アリウス分校の外には出られないはずだから。"
"63050-29" = "[ns] \"もしもし？どうしたの？\""
"63050-30-アリウスの生徒たち" = "天使が……3体目の天使が現れました！"
"63050-31-アリウスの生徒たち" = "で、でも……なんて説明すれば……。#nえっと、えっと、3体目が現れたと思ったら、それまでいた2体は消えたんです！"
"63050-32-アリウスの生徒たち" = "3体目の天使に吸収されたようにも見えて……。"
"63050-33-アリウスの生徒たち" = "で、でもそれよりも！#n天使の中に、人みたいなのが見え隠れしてて……。"
"63050-34-アリウスの生徒たち" = "信じてもらえないかもですが……スバル先輩そっくりなんです！"
"63050-35-サオリ" = "先生！"
"63050-36" = "[ns] \"スバルだ！\""
"63050-40" = "[ns] \"ありがとう、みんな！また何かあったら連絡して！\""
"63050-41-アリウスの生徒たち" = "はい！"
"63050-47-スバル" = "（……）"
"63050-49-スバル" = "（ここから見える空は、こんなにも曇ってるのに）"
"63050-50-スバル" = "（たしか、サオリの記憶で見た空は……）"
"63050-53-スバル" = "そうか。"
"63050-54-スバル" = "サオリ。"
"63050-55-スバル" = "君の見ていた空は……こんな光景だったのか。"
"63050-57-スバル" = "（アリウスの風景は、いつも同じだった）"
"63050-58-スバル" = "（そこに生きる私たちも、やはりそうだった）"
"63050-60-スバル" = "（すべてが流れ着き、堆積して、忘れ去られる場所）"
"63050-61-スバル" = "（アリウスはきっと、そんな場所だったんだ）"
"63050-62-スバル" = "（たとえ違ったとしても、いつの間にか、そうなってしまっていたのだろう）"
"63050-64-スバル" = "（世界はアリウスを隔離し、ついには忘れることを選んだ）"
"63050-65-スバル" = "（いや、それすら甘い評価かもしれない）"
"63050-66-スバル" = "（世界は横柄で、勝手気ままで。予想もつかない方向へ、無遠慮に進んでいくものなのだから）"
"63050-67-スバル" = "（……煩わしいものや邪魔なものを、簡単に払い捨てながら）"
"63050-69-スバル" = "（それなら……。#n忘れられた者たちは、誰が覚えていてくれるのか）"
"63050-70-スバル" = "（届かぬ声を、誰が覚えていてくれるのか）"
"63050-72-？？？" = "先輩、先輩！ハーモニカ吹いてくださいよ！"
"63050-73-スバル" = "廃墟で、ひとり感傷にひたりながらハーモニカを吹くなんて……。"
"63050-74-スバル" = "それって、ちょっと……カッコつけすぎのような……。"
"63050-78-マイア" = "あの、私も……。"
"63050-82" = "[log=스바루]やめて……。[/log]"
"63050-85-マイア" = "久しぶり、ですし……。"
"63050-89" = "[log=스바루]……お願い、です。やめてください。[/log]"
"63050-93-マイア" = "先輩の演奏……聴きたいです。"
"63050-97" = "[log=스바루]！！！[/log]"
"63050-101" = "[log=스바루]！？！？[/log]"
"63050-108-アツコ" = "後悔してる？"
"63050-109-スバル" = "アツ……コ……。"
"63050-110-アツコ" = "大丈夫だよ。私たちだって、そうだったんだから。"
"63050-111-スバル" = "でも、アリウスは……。"
"63050-112-スバル" = "……トリニティがアリウスにしてきたことは……！"
"63050-113-アツコ" = "うん、そうだね。"
"63050-114-アツコ" = "でも、それはそれ。"
"63050-115-アツコ" = "そのせいで今こうして先輩が苦しんでるのって、ちょっと不公平なんじゃない？"
"63050-116-アツコ" = "……この言葉、覚えてる？"
"63050-117-アツコ" = "『とげのあるむちをければ、傷を負うだけである』"
"63050-118-スバル" = "……！"
"63050-119-アツコ" = "一緒にやろう。"
"63050-120-アツコ" = "全部をひとりで背負わないで。"
"63050-121-スバル" = "今……さら？"
"63050-122-アツコ" = "うん。#n[ruby=・]そ[/ruby][ruby=・]れ[/ruby][ruby=・]で[/ruby][ruby=・]も[/ruby]――"
"63050-123-アツコ" = "正直に話せば、先生はきっと助けてくれる。"
"63050-124-スバル" = "……！"
"63050-125-アツコ" = "あ、でも私たちは、ちょっと矯正局にお世話になるかもしれないから……その間はよろしくね？"
"63050-126-スバル" = "……。"
"63050-127-スバル" = "いや……だめですよ。そんなのは……。"
"63050-128-スバル" = "そんなの、できません。"
"63050-129-スバル" = "私は。"
"63050-130-スバル" = "私たちは。"
"63050-131-スバル" = "アリウスは、まだ……納得していないんです。"
"63050-132-スバル" = "あなたが言ったように、ここはもう「そういう場所」に成り果ててしまったのですから。"
"63050-133-スバル" = "何の断罪も、裁きもないまま、すべてを葬ってしまおうだなんて、許されません。"
"63050-134-スバル" = "それは、アリウスに生きたもの達への冒涜に他ならない！"
"63050-135-アツコ" = "そういうつもりじゃないんだけどな……。"
"63050-136-アツコ" = "もう自分自身に飲み込まれちゃってるんだね。#nこれじゃあ、どんな言葉も届かない。"
"63050-137-アツコ" = "でも大丈夫。私たちも、そうだったから。#nそして、こういう時どうすればいいか……アリウスは知ってる。"
"63050-138-スバル" = "……？"
"63050-139-アツコ" = "さあ。"
"63050-140-アツコ" = "アリウス式で、お話しよっか。"
"63050-143-サオリ" = "アツコ？大丈夫か？#n祈るような仕草をしていたが……。"
"63050-144-アツコ" = "うん。ちょっと……[ruby=・]お[/ruby][ruby=・]話[/ruby]してただけ。"
"63050-146-ミサキ" = "話……？"
"63050-147-ヒヨリ" = "そ、それって……そういうこと、ですか……？"
"63050-148-アツコ" = "うん、そういうこと。"
"63050-149-アツコ" = "それじゃあ、先生。"
"63050-150" = "[s] \"うん。\""
"63050-151-アツコ" = "夢に囚われたままの先輩を、起こしてあげよう。"
"63050-152-アツコ" = "アリウスらしいやり方で。"
"63050-153" = "[s] \"何をすればいい？\""
"63050-154-アツコ" = "いつもと同じだよ。先生にしかできないこと。"
"63050-155-アツコ" = "マイアも、手伝ってくれる？"
"63050-159-マイア" = "……もちろんです。"
"63050-160-マイア" = "先輩のためなら、なんでもします！"
