[translation]
"63100-1" = "第10話;遺された未来のためのエクレシア"
"63100-5" = "[log]総合試験当日[/log]"
"63100-9-アリウスの生徒たち" = "……どう？"
"63100-10-アリウスの生徒A" = "うん。"
"63100-11-アリウスの生徒A" = "分かんないけどさ。"
"63100-12-アリウスの生徒A" = "すっごい自信あるんだよね。"
"63100-13-アリウスの生徒A" = "まぁ、根拠は無いんだけど。"
"63100-17-アリウスの生徒B" = "それってつまり、全然勉強してないってことじゃん……。"
"63100-19-アリウスの生徒C" = "でもさ。"
"63100-20-アリウスの生徒D" = "ん？"
"63100-21-アリウスの生徒C" = "教科書って、勉強のための本でしょ？"
"63100-22-アリウスの生徒D" = "そうだね。"
"63100-23-アリウスの生徒C" = "ってことは、私たちの教科書は失敗作なんだよ。"
"63100-24-アリウスの生徒C" = "だって、私を教えるのに失敗してるからさ。"
"63100-25-アリウスの生徒D" = "わぁ、斬新な発想……。"
"63100-26-アリウスの生徒D" = "とにかく、試験頑張ろうね……。"
"63100-27-アリウスの生徒C" = "そっちもね……。"
"63100-28-アリウスの生徒C" = "……みんながケアレスミスしますように。"
"63100-29-アリウスの生徒D" = "お互いに頑張るんじゃなかったの……？"
"63100-34" = "[ns] \"みんな！ちゃんと勉強してきたかな？\""
"63100-35-アリウスの生徒A" = "あ、先生！"
"63100-36-アリウスの生徒B" = "先生……。"
"63100-37-アリウスの生徒B" = "どう考えても赤点取りそうな時って……どうしたらいいですか……？"
"63100-38" = "[s1] \"心配しなくても大丈夫。\"\n[s2] \"やってみなきゃ分からないよ。\"\n[s3] \"だって、結果が出るまでは赤点じゃないからね。\""
"63100-42-アリウスの生徒C" = "わあ……すっごい励まされる一言だ……。"
"63100-43" = "[s] \"とにかく、みんな頑張ってね！\""
"63100-44-アリウスの生徒D" = "はい……。"
"63100-49-アツコ" = "先生、おはよう。もしかして、見送りに来てくれたの？"
"63100-50-ミサキ" = "心配しなくても、試験はちゃんと受けるよ。これまでの苦労がもったいないし。"
"63100-55-サオリ" = "ん？先生は応援しに来てくれたんだと思ったが……。"
"63100-56-ヒヨリ" = "あ……。み、ミサキさんも、それは分かってて……#nあ、あえてそう言ったんじゃ……。"
"63100-57-サオリ" = "そうだったのか？すまない、気づけなくて……。"
"63100-59-ミサキ" = "いや、そうじゃなくて……！"
"63100-60-ミサキ" = "はあ……もういいよ。"
"63100-61-アツコ" = "それじゃあ、行ってきます。"
"63100-62-ヒヨリ" = "が、頑張ってきますね……。"
"63100-71-スバル" = "おはようございます、先生。"
"63100-72-マイア" = "お、おはようございます……。#n……あれ？今日はお休み……なんですか？"
"63100-73" = "[s4] \"今日はここで仕事があるんだ。\"\n[s5] \"みんなの応援っていう仕事がね。\""
"63100-76-マイア" = "そ、そうなんですね……。"
"63100-80-スバル" = "……先生、なんですか？私のことをじっと見て。"
"63100-81-スバル" = "はい？試験を受けることに抵抗があるか、ですか……。"
"63100-82-スバル" = "……正直、ないとは言えません。"
"63100-83-スバル" = "でも……信じてみることにしました。"
"63100-84-スバル" = "もう一度やってみようと声を上げた、[ruby=あの子たち]アリウス[/ruby]の声を。"
"63100-85-スバル" = "……そして、先生を。"
"63100-86" = "[s] \"……ありがとう。\""
"63100-90-スバル" = "な、なんですか急に！？"
"63100-91" = "[s] \"私を信じてくれて、ありがとう。\""
"63100-92-スバル" = "そ、れは……。"
"63100-93-スバル" = "え？先生だって、生徒に信じてもらえなきゃ、実は不安になってブレることもある……？"
"63100-94-スバル" = "……。"
"63100-95-スバル" = "それはちょっと……想定外の答えですね……。"
"63100-97-マイア" = "それじゃ私も、先生の役に立ててますか！？"
"63100-98" = "[s] \"もちろん。マイアも、ありがとう。\""
"63100-105" = "（マイアの頭を撫でた）"
"63100-106-マイア" = "えへへ……。なんか……嬉しいです……。ありがとうございます、先生。"
"63100-111-スバル" = "……。"
"63100-112-スバル" = "私も――"
"63100-118-マイア" = "あ、先輩！もう時間みたいです！急ぎましょう！"
"63100-119-スバル" = "えっ、あ、あぁ……。"
"63100-120-スバル" = "はい、行きましょう……。"
"63100-125" = "[ns] \"そろそろ……トリニティの方も、試験が始まってる頃かな……。\""
"63100-126" = "（大人でよかったと思えることが一つあるとすれば）"
"63100-127" = "（試験を受けなくていいということかもしれない。なんてことを考えながら）"
"63100-128" = "（近くのカフェで仕事をして、試験が終わるのを待つことにした）"
"63100-135-アリウスの生徒A" = "あぁ……これで終わりなんだね……。"
"63100-136-アリウスの生徒B" = "どうだった？"
"63100-142-アリウスの生徒C" = "……。"
"63100-143-アリウスの生徒D" = "……。"
"63100-144-アリウスの生徒D" = "……全滅。"
"63100-148-アリウスの生徒A" = "まだ自己採点もしてないのに！？"
"63100-149-アリウスの生徒D" = "なんていうか……感覚ってあるじゃん。"
"63100-151-アリウスの生徒B" = "まぁ……実は、私もそんな感じなんだけど……。"
"63100-152-アリウスの生徒D" = "心の友よ……。"
"63100-157" = "[ns] \"みんな、おかえり！\""
"63100-159-アリウスの生徒A" = "先生……。"
"63100-160-アリウスの生徒B" = "うぅ……。"
"63100-161-アリウスの生徒C" = "試験……ダメでしたぁぁぁぁ！"
"63100-162" = "[s6] \"言ったでしょ？結果が出るまでは赤点じゃないって。\"\n[s7] \"だから今は、試験が終わった後の伝統行事をやりに行こう！\""
"63100-165-アリウスの生徒D" = "試験が終わった後の……伝統行事？"
"63100-166-アリウスの生徒A" = "何ですか、それ？"
"63100-167" = "[s8] \"それはね……「テストの打ち上げ」だよ！\"\n[s9] \"美味しいものを食べて、思いっきり遊ぶ！\"\n[s10] \"絶対に守り抜くべき、伝統なんだ！\""
"63100-174-アリウスの生徒B" = "そんな素敵な伝統があったなんて……！"
"63100-175-アリウスの生徒C" = "試験も、意外と悪くないかもしれませんね！"
"63100-177-アリウスの生徒D" = "いや、それはちょっと考え直したほうが……#n準備、あんなに大変だったじゃん……。"
"63100-178-アリウスの生徒A" = "でもそれはもう終わったこと！#nつまり――！"
"63100-179-アリウスの生徒A" = "喉元過ぎれば熱さ忘れる！"
"63100-180-アリウスの生徒D" = "……！"
"63100-181-アリウスの生徒D" = "これこそアリウス流だね！"
"63100-183-アリウスの生徒B" = "だね！"
"63100-184-アリウスの生徒B" = "先生！たくさん食べても……いいですか？"
"63100-185" = "[s11] \"もちろん！\"\n[s12] \"じゃあ、他の子たちも呼んでおいで！\""
"63100-189-アリウスの生徒たち" = "はい！"
"63100-195" = "（こうして、アリウスの子たちにとって初めての試験は）"
"63100-196" = "（派手な打ち上げで、幕を閉じたのだった……）"
"63100-208-アツコ" = "こんにちは、スバル。マイアも、どうぞ座って。"
"63100-210-スバル" = "こんにちは、アツコさん。"
"63100-211-マイア" = "あ、こ、こんにちは……アツコ、姫様……。"
"63100-213-アツコ" = "ふふっ。もっと気軽に呼んでくれていいのに。"
"63100-214-アツコ" = "そう決めたでしょ？二人で。"
"63100-215-マイア" = "そ、そうは言っても……！でも、でも……うぅ……。"
"63100-216-マイア" = "あ……アツコ、さん……。"
"63100-217-アツコ" = "うん。ありがとう。"
"63100-219-スバル" = "それで……今日は、どういうご用件ですか？"
"63100-221-アツコ" = "「外」では普通、試験が終わったらこうするって聞いたから。"
"63100-222-アツコ" = "さ、まずは食べよう？このカフェ、ペカンパイが有名なんだって。"
"63100-223-マイア" = "は、はい……いただきます……。"
"63100-224-アツコ" = "ふふっ、後はね、こうやってお茶をしながら、試験の感想を言い合うらしいんだけど……二人はどうだった？"
"63100-225-マイア" = "分かるところは全部書きました！"
"63100-226-マイア" = "分からないことの方が多かったですけど……。"
"63100-227-アツコ" = "スバルは？"
"63100-229-スバル" = "これが3年生なのか、と。少しギャップを感じましたね。"
"63100-230-アツコ" = "ふふ。でも、自分の実力を知るための模試だからね。"
"63100-231-アツコ" = "ペナルティとか処分もないし、気楽に結果を受け止めればいいと思うよ。"
"63100-235-マイア" = "えっ？ほ、本当の試験だと処分とかあるんですか！？"
"63100-236-アツコ" = "結果が悪かったら補習が入ったり――"
"63100-237-アツコ" = "ずっと成績が低いと……留年とか、卒業できなくなることもあるみたい。"
"63100-238-マイア" = "あ……処分って、そういう……。"
"63100-239-アツコ" = "……うん。"
"63100-240-アツコ" = "ある意味、優しい世界とも言えるかな。"
"63100-241-スバル" = "……。"
"63100-242-アツコ" = "……。"
"63100-243-スバル" = "これから……スクワッドはどうするんですか？"
"63100-244-アツコ" = "やっぱり気になるよね。まぁ、当然かな。"
"63100-245-アツコ" = "……。"
"63100-250-アツコ" = "アリウスへの責任を取ろうと思ってるよ。"
"63100-251-スバル" = "……具体的には？"
"63100-252-アツコ" = "アリウスにも生徒会ができるまで、私たちは臨時生徒会の役割を担いたいと思ってる。"
"63100-257-マイア" = "スクワッドが……生徒会に？じゃ、じゃあ――！"
"63100-258-マイア" = "私たちの学園も……やっと……ちゃんとした学園に戻れるんですか！？"
"63100-259-マイア" = "何百年ぶりに！？"
"63100-260-アツコ" = "そうなれるように、精一杯頑張るよ。"
"63100-261-アツコ" = "――アリウスの臨時生徒会長として。"
"63100-262-マイア" = "生徒会長！？"
"63100-263-スバル" = "マイア、声が大きいですよ。"
"63100-264-マイア" = "あ、す、すみません……。"
"63100-265-スバル" = "……実際、アリウスの伝統に則れば、その役目はあなたを置いて他にいません。"
"63100-266-スバル" = "それで、他のメンバーは？"
"63100-267-アツコ" = "多分、ミサキが会計をやることになると思う。"
"63100-268-アツコ" = "「なんで私が……はぁ、やればいいんでしょ……」って本人は言ってたけど。"
"63100-269-アツコ" = "言い換えれば、「やるからには、ちゃんと頑張る」って意味だから。"
"63100-270-スバル" = "そうなんですか……？"
"63100-271-アツコ" = "ミサキは素直じゃないからね。#nあ、これ本人に言うとすっごく怒るから、内緒にしてね。"
"63100-272-スバル" = "……はぁ。"
"63100-273-アツコ" = "あとは……サッちゃんが総務兼副会長。"
"63100-274-スバル" = "妥当ですね。"
"63100-275-アツコ" = "学校の運営方針で、こういう提案も出してたよ。 「みんなできるだけアルバイトをしよう」って。"
"63100-276-スバル" = "なんでまた……？"
"63100-277-アツコ" = "社会のことを学べるし、お小遣いも稼げる。#nそれがアリウスの復興にもつながる、って言ってたかな。"
"63100-278-アツコ" = "みんなが慣れるまでは、契約書は全部目を通させろ、とも言ってたね。"
"63100-279-スバル" = "……自分の経験を押し付けてるだけじゃないですか。"
"63100-280-アツコ" = "ほら、人は経験から学ぶ生き物だから。#nでも、それ以外の提案もあったんだ。"
"63100-281-スバル" = "というと？"
"63100-282-アツコ" = "……。"
"63100-286-サオリ" = "これで、おおよその方向性は見えてきたな。"
"63100-287-サオリ" = "部活動設立の申請については、予算と妥当性を勘案して#n許可する必要はあるが……。"
"63100-288-サオリ" = "それは実際の状況を見ながら進めればいいだろう。"
"63100-289-サオリ" = "……ん？アツコ、もっと個人的な希望を聞きたい……とはどういう意味だ？"
"63100-290-サオリ" = "私たちは今、学園のことについて話をしているはずだ。"
"63100-291-サオリ" = "生徒会長としてのお願い……？"
"63100-292-サオリ" = "……。"
"63100-293-サオリ" = "そういうことなら……。#nいや、これは聞き流してもらって構わないのだが……。"
"63100-297-サオリ" = "制服を……作ってもいいんじゃないか……と。"
"63100-298-サオリ" = "可愛くて、お洒落だったら……いいなって……。"
"63100-299-アツコ" = "ありがとう、サッちゃん。そういうのを聞きたかったんだ。"
"63100-302-アツコ" = "ごめん、これはもう少し整理してから話すね。"
"63100-303-スバル" = "え？あ……そうですか。"
"63100-304-アツコ" = "えっと、それで……あとはヒヨリだね。"
"63100-305-アツコ" = "ヒヨリは……。"
"63100-306-アツコ" = "……書記？"
"63100-307-スバル" = "まさに、記録係としての書記でしょうね。それは……。"
"63100-308-アツコ" = "うん……本人もそれを自覚してたのか、最初は「うわあぁぁん」って泣いちゃってさ。"
"63100-309-アツコ" = "でもすぐに気を取り直して、本気で頑張るってやる気を見せてくれて。"
"63100-310-アツコ" = "ヒヨリがやる気出すのはいいことだから、私も嬉しかったな。"
"63100-311-マイア" = "わ、私にはよく分かりませんけど……でも、いいですね……ヒヨリさん、優しいですし……。"
"63100-312-スバル" = "そうですね……まあ、あなたがそう思うなら……。"
"63100-313-アツコ" = "それでね、「ニコメディアトゥループ」にもお願いしたいことがあるの。"
"63100-314-スバル" = "……私たちに？"
"63100-315-アツコ" = "風紀委員としての役割を引き受けてもらえないかな。"
"63100-316-スバル" = "風紀……委員、ですか……？"
"63100-317-アツコ" = "うん。学園の治安や風紀を守るお仕事だね。"
"63100-318-アツコ" = "これは、スバルじゃなきゃ頼めないと思うんだ。"
"63100-319-スバル" = "……もし私が断ったら？"
"63100-320-アツコ" = "断るの？"
"63100-321-スバル" = "……。"
"63100-323-マイア" = "せ、先輩……？"
"63100-328-スバル" = "……はぁ。"
"63100-329-スバル" = "そういう言い方はどうかと思いますよ。"
"63100-330-アツコ" = "そうかな？でも、臨時とはいえ生徒会長だし。"
"63100-331-スバル" = "はぁ、構いませんよ。"
"63100-332-スバル" = "（なんだかんだ人がついて行くのは……才能ですね）"
"63100-333-スバル" = "……。"
"63100-334-スバル" = "で、最終的にはどうするつもりですか？"
"63100-340-アツコ" = "アリウスを素敵な学園にしたい。"
"63100-341-スバル" = "……その点は、意見が一致しているようですね。"
"63100-342-アツコ" = "アリウスに残った生徒なら、みんな似たような気持ちなんじゃないかな。"
"63100-343-スバル" = "……それはそうかもしれません。#nただ……実現するためには、やるべきことが山積みでは？"
"63100-344-アツコ" = "分かってる。だからこそ、今度は責任を放棄したくないの。#n……この話、前にもしたよね。"
"63100-345-スバル" = "自信はあるんですか？"
"63100-346-アツコ" = "全然。私1人じゃ、できないと思うんだ。#nだから、手を貸してほしいの。"
"63100-347-スバル" = "手を取り合って、みんなで転ぶことになったら……？"
"63100-348-アツコ" = "逆に、転んだ誰かを起こしてあげられるかもしれない。"
"63100-349-アツコ" = "どうせ未来は分からないし、悪い方にばかり考えたくないんだ。"
"63100-350-スバル" = "それこそ、根拠のない楽観主義では？"
"63100-351-アツコ" = "でも、[ruby=・]動[/ruby][ruby=・]く[/ruby][ruby=・]こ[/ruby][ruby=・]と[/ruby]に意味があるんじゃないかな。"
"63100-352-アツコ" = "私は、それが一番大事だと思ってる。"
"63100-353-アツコ" = "そのためには、未来への漠然とした希望が必要でしょ？"
"63100-358-アツコ" = "みんなと一緒に、前へ進みたいんだ。"
"63100-359-スバル" = "……。"
"63100-360-スバル" = "……分かりました。"
"63100-361-スバル" = "私も、最大限協力しましょう。"
"63100-362-スバル" = "何が起こるか、何が待っているかなんて、私たちには分かりませんから。"
"63100-363-スバル" = "……試験を受けることになるとすら、思いもしませんでしたし。"
"63100-364-アツコ" = "ふふっ。私もびっくりだったな。"
"63100-365-マイア" = "そ、そういえば……トリニティの団長さん、ですけど……。"
"63100-366-アツコ" = "ミネさん？そっか、その話もしないとだね。"
"63100-367-マイア" = "き、聞いた話だと、あの日は意識が戻らなかったって……。"
"63100-368-アツコ" = "うん、そうだったみたい。"
"63100-369-アツコ" = "でも心配しないで。もう完全に回復したって。"
"63100-373-マイア" = "ほ、本当ですか！？よかった……！"
"63100-374-アツコ" = "しかも、その間は試験勉強できてなかったのに、大きな影響は無いらしいよ。"
"63100-375-スバル" = "そうですか……それは何よりですね。"
"63100-376-アツコ" = "すごいよね。「黙示録の天使」4人分の力を、自分の中に封じ込めてるようなものだったのに。"
"63100-377-スバル" = "はい！？"
"63100-378-アツコ" = "ミネさんは4人の天使を倒して、自分も気を失ったでしょ？"
"63100-379-アツコ" = "そのおかげで、7人の天使が全て調和して力を解放する――なんてことにはならずに済んだの。"
"63100-380-スバル" = "じゃあ……天使を4人も抱えたまま耐えてたってことですか！？"
"63100-382-マイア" = "す、スバル先輩……？"
