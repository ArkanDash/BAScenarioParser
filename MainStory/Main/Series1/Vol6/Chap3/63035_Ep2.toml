[translation]
"63035-1" = "第3話;ラッパ吹きの天使"
"63035-4-サオリ" = "くっ……！"
"63035-5" = "[ns] \"サオリ！\""
"63035-6-ヒヨリ" = "サオリ姉さん！"
"63035-7-サオリ" = "問題ない……かすり傷だ。"
"63035-8-ミサキ" = "大丈夫には見えないけど……リーダーがそう言うなら……。"
"63035-9-ミサキ" = "で、本当にどうする？#n「ああいうの」には勝てたためしがないけど……。"
"63035-10-ミサキ" = "しかも、今回のは次元が違う。"
"63035-14-アリウスの生徒C" = "え……？ラッパの音……？#nあっ！前に言ってたのってこれのこと……！？"
"63035-15-アリウスの生徒A" = "そうだよ！#nでも……なんか、空が暗くなってきてない……？"
"63035-17-アリウスの生徒B" = "まだお昼なのに……！？"
"63035-18-アリウスの生徒D" = "何が起きてるの……？"
"63035-25-アリウスの生徒A" = "いきなり夜になっちゃった、ってこと……！？"
"63035-26-アリウスの生徒B" = "これ……私知ってる！経典に書いてあるやつだよ……！"
"63035-27-アリウスの生徒B" = "太陽の三分の一と、月の三分の一と、星の三分の一とが打たれて、これらのものの三分の一は暗くなり――"
"63035-28-アリウスの生徒B" = "昼の三分の一は明るくなくなり、夜も同じようになった。#n……って！"
"63035-34-アリウスの生徒C" = "また……！？"
"63035-35-アリウスの生徒D" = "これで6回目……！"
"63035-36-アリウスの生徒D" = "でも、おかしくない？何でまた鳴ってるの……？"
"63035-37-アリウスの生徒A" = "そうだよね……このままだと7回どころか、14回のラッパになっちゃうよ……？"
"63035-41-ヒヨリ" = "き、急に暗くなりましたね……何が起こってるんですか……？"
"63035-42-サオリ" = "スバル！やめろ！何を考えているんだ！#nお前に……何があったんだ！"
"63035-46-ミサキ" = "……こっちの声は聞こえてないっぽいね。"
"63035-47-マイア" = "……。"
"63035-48-マイア" = "せ、先輩……！"
"63035-49-マイア" = "スバル先輩！！！"
"63035-54-スバル" = "……。"
"63035-55-スバル" = "どう、して……？"
"63035-56-スバル" = "今まで……どこに……なぜ、ここに……？"
"63035-58-アツコ" = "この子は、ずっとここにいたよ。"
"63035-59-アツコ" = "この場所に、私たちと一緒に。"
"63035-60-アツコ" = "どうして気づけなかったのかって？それはね……。"
"63035-61-アツコ" = "あなたが、この子を見ようとしなかったから。"
"63035-62-アツコ" = "そうだよね、スバル？"
"63035-63-アツコ" = "ううん……今はもう、「現象」になってしまった。#n「ラッパ吹きの天使」って呼ぶべきかな？"
"63035-64-サオリ" = "アツコ……何か、知っているのか？"
"63035-65-アツコ" = "今まではただの推測だったけど……これで、確信に変わった。"
"63035-66-アツコ" = "ちゃんと、順番に話すね。"
"63035-67-アツコ" = "それと。こうなった以上、はっきり言っておくよ。"
"63035-68-アツコ" = "スバル。#nあなた一人だけが「アリウス」な訳じゃないんだよ。"
"63035-70" = "次回;ロイヤルブラッド"
