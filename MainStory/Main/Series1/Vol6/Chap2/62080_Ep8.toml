[translation]
"62080-1" = "第8話;ポルタパシス（２）"
"62080-4-ウイ" = "秘儀……？"
"62080-5-ウイ" = "あまり良いものではなさそうですね。"
"62080-6-シミコ" = "委員長！"
"62080-7-ウイ" = "う、うぅ……。"
"62080-12-サオリ" = "たしかに、私も聞いたことがない。"
"62080-13-アツコ" = "これはたぶん、私しか知らないことだと思うから。"
"62080-14-アツコ" = "私も最初は、怪談とか伝説の類だと思ってたんだけど……。"
"62080-15-アツコ" = "「エデン条約」が結ばれる少し前。#nベアトリーチェは、ポルタパシスの記録保管庫に行ってたの。"
"62080-16-アツコ" = "私以外の誰にも、何も言わずに、こっそりと。"
"62080-21-ミサキ" = "！"
"62080-22-ヒヨリ" = "ええぇっ！？"
"62080-27-マイア" = "で、でも、あそこって……入っちゃいけないはずじゃ……。"
"62080-28-アツコ" = "ベアトリーチェが、そんなこと気にすると思う？"
"62080-29-マイア" = "そ、それは……そうかもしれないですけど……。"
"62080-30-アツコ" = "ベアトリーチェには多くの秘密があった。その一つがそれ。"
"62080-31-サオリ" = "まさか……ユスティナ聖徒会の[ruby=ミメシス]複製[/ruby]が顕現したのも？"
"62080-32-アツコ" = "どうだろう。もう、その真実を知る方法はほとんどないけど……。"
"62080-33-アツコ" = "まったく無関係だったとは思えないかな。"
"62080-34-アツコ" = "だって、アリウスで異常現象が増え始めたのは、その頃からだから。"
"62080-35-マイア" = "覚えています……。いつの間にか、見たことのないものがいっぱい転がってて……武器だけなら潤沢に支給されていたりして……。"
"62080-36-マイア" = "あの頃は……やっぱり大人ってすごいなって、思うだけで……疑問にも思わなかったですけど……。"
"62080-37" = "[s] \"……。\""
"62080-38-アツコ" = "ここで大事なのは「増え始めた」って部分なの。"
"62080-39-ウイ" = "えっ……？まさか……？"
"62080-40-アツコ" = "そのまさかだよ。"
"62080-41-アツコ" = "元々、アリウスでは変なことが起こっていたんだ。#nあまり頻度は高くないんだけどね。"
"62080-43-サオリ" = "どの学園にも怪談のひとつやふたつはあるものだが……#nアリウスはそのレベルを遥かに超えていた。"
"62080-44-ミサキ" = "アリウスを出てから分かったよ。あれは「ちょっと」とかそういう次元じゃなかったって。"
"62080-49" = "[ns] \"それは……どうして？\""
"62080-50-アツコ" = "正確な理由は、私もよく分からない。"
"62080-51-アツコ" = "だけど……。"
"62080-52-アツコ" = "アリウスは、そういう「場所」になっちゃってた気がするんだ。"
"62080-53-アツコ" = "ここには、もともと「何か」があった。"
"62080-54-アツコ" = "怒り、嘆き、恨み、絶望、諦念……そういう思念が積もり積もって、ここに集まってる。"
"62080-55-アツコ" = "強い想いって、何かの形で現れるって言うでしょ？"
"62080-56-ヒヨリ" = "そ、それって……ただの例え話、なんじゃ……。"
"62080-57-アツコ" = "でも、私たちはもう見てるはずだよ。ユスティナ聖徒会とか、バルバラとか。"
"62080-58-サオリ" = "すべてマダム……ベアトリーチェの仕業だと思っていたが……。"
"62080-59-サオリ" = "いや、そう考えることで、アリウスの「裏の真実」から無意識に目を逸らしていたのかもしれないな……。"
"62080-60-アツコ" = "そこまで決めつけたくはないけど……でも、時々怖くなる。"
"62080-61-アツコ" = "積もり積もった強い想いの奥底には、何があるんだろうって。"
"62080-62-アツコ" = "想像するだけで……怖い。"
"62080-63-ミサキ" = "……。"
"62080-64-マイア" = "ううう……。"
"62080-69-シミコ" = "こほん。#n……では、黙示録の話をしましょう。"
"62080-70-シミコ" = "どうやら、アリウスで起きている「現象」の核心に関わるようですから。"
"62080-71-アツコ" = "うん、ありがとう……シミコさん。"
"62080-72-シミコ" = "いえ、お気になさらずアツコさん。#nそれでは、まずは概要から。"
"62080-73-シミコ" = "黙示録とは、トリニティとアリウスの両校に伝わる経典の最終章を指します。"
"62080-74-シミコ" = "二つの学園が持つ経典は、もとは同一のものでした。その解釈が異なるだけで、ルーツは同じなんです。"
"62080-75-ウイ" = "トリニティにおいて黙示録は、あくまで参考文献のような扱いをされています。"
"62080-76-ウイ" = "教訓や助言を集めた[ruby=しんげんしゅう]箴言集[/ruby]として……それ以上の重みは、ほとんどありません。"
"62080-77-サオリ" = "だがアリウスでは、黙示録の研究が特に重視されていた。"
"62080-78-サオリ" = "なにしろ……「世界の滅亡」について記されているからな。"
"62080-79" = "[s] \"つまり、それって……！\""
"62080-80-ミサキ" = "アリウスは世界の滅亡を望んでいたのか、って？"
"62080-81-ミサキ" = "……。"
"62080-82-ミサキ" = "その通りだよ。"
"62080-83-マイア" = "み、みみみみみ、ミサキさんっ！？"
"62080-84-ミサキ" = "驚くことじゃないでしょ。事実だし。"
"62080-86-ウイ" = "……理解はできる気がします。"
"62080-87-ウイ" = "温もりを得られなかった子どもが、温もりを得るために村を燃やす――そんな話があるくらいですから。"
"62080-88-ウイ" = "失うものがない人にとって……世界の終わりは「救済」なのかもしれません。"
"62080-89-ウイ" = "少なくとも、全てが「公平」になったような気がするのでしょう。"
"62080-90-アツコ" = "自分が消えることと、世界が終わること。どっちも、[ruby=・]自[/ruby][ruby=・]分[/ruby][ruby=・]に[/ruby][ruby=・]と[/ruby][ruby=・]っ[/ruby][ruby=・]て[/ruby][ruby=・]の[/ruby]結果としては同じだもんね。"
"62080-91-アツコ" = "……だったら、どこかの時点で、その前後が入れ替わっちゃうのも、不思議じゃないと思うな。"
"62080-93-シミコ" = "手段と目的を取り違えてしまうことはよくありますから……。"
"62080-94-シミコ" = "……。"
"62080-95-ウイ" = "……。"
"62080-96-シミコ" = "黙示録には、7人の天使が3組登場します。それを総称して、「黙示録の天使」と呼ぶんです。"
"62080-98-サオリ" = "まさか……実在する、というのか？"
"62080-99-サオリ" = "恐怖や苦痛を煽るような……あくまで、物語に過ぎないと思っていたが……。"
"62080-100-ミサキ" = "さっきの話だけど……強い想いは、いつか形を成すってやつ？"
"62080-102-アツコ" = "黙示録に記されている、世界の終わりを告げる天使。"
"62080-103-アツコ" = "最初は「封印を解く天使」の七人。次が「ラッパを吹く天使」の七人。そして最後が「鉢を注ぐ天使」の七人。"
"62080-104-アツコ" = "その中でも、今回は「ラッパを吹く天使」なんだと思う。"
"62080-105-アツコ" = "確認されているラッパの音は、4回。"
"62080-106-アツコ" = "それは空から聞こえてきた声とも一致する。"
"62080-107-アツコ" = "「なお三人の御使がラッパを吹き鳴らそうとしている」って言葉とね。"
"62080-108" = "[s] \"7人全員がラッパを吹いたら……どうなるの？\""
"62080-109-アツコ" = "ふふっ、どうなるんだろうね。"
"62080-110-アツコ" = "黙示録の内容が、そのまま現実になったとしたら……。"
"62080-111-アツコ" = "次は、「激しい怒りが盛られた7つの金の鉢を持つ天使」たちの番になる。"
"62080-112-ミサキ" = "それが終わったら、今の世界は滅んで……信仰ある者のために、新しい世界が訪れる。"
"62080-113-ミサキ" = "……って、私たちは教わった。"
"62080-114-アツコ" = "……うん。黙示録の通りなら、そうなるね。"
"62080-115-アツコ" = "でも……あれは本当に「ラッパを吹く天使」だったのかな？"
"62080-116-サオリ" = "……他の「何か」かもしれないということか？"
"62080-120-アツコ" = "うーん……今はまだ、何とも言えない。"
"62080-121-アツコ" = "そもそもアリウスは、何かがあって、何かが起こる場所だから。"
"62080-127-アリウスの生徒A" = "ほ、本当に来ちゃった……。"
"62080-128-アリウスの生徒B" = "うわ……うわあああ……。"
"62080-130-スバル" = "皆さん、静かにしてください。ただの建物です。不安がる必要はありません。"
"62080-132-アリウスの生徒C" = "は、はい……！"
"62080-134-スバル" = "確認します。私たちの目的地は、ここ――ポルタパシスの地下にあるとされる記録保管庫。"
"62080-135-スバル" = "そこには、アリウスの「真実」が眠っているそうです。"
"62080-136-スバル" = "だとすれば、「ラッパ吹きの天使」についても、何か手がかりを得られるかもしれません。"
"62080-137-スバル" = "問題は、ここが100年以上も封鎖されているということですが……。"
"62080-139-アリウスの生徒D" = "せ、先輩？#n扉……開いてますけど……？"
"62080-141-スバル" = "……本当ですか？#nまさか、誰かがすでに……？"
"62080-145-スバル" = "……ふむ、むしろ好都合です。"
"62080-146-スバル" = "閉ざされた扉を開く者は、何かを失うことになる――"
"62080-147-スバル" = "誰かが開いてくれたのなら、これで懸念が一つ減りましたね。"
"62080-149-アリウスの生徒A" = "それじゃあ、私たち、本当に……。"
"62080-150-アリウスの生徒A" = "この下に……降りるんですか……？"
"62080-152-スバル" = "……。"
"62080-153-スバル" = "いえ、進むのは私一人です。"
"62080-154-スバル" = "……恐ろしいことが起きるかもしれませんから。"
"62080-156-アリウスの生徒C" = "……！"
"62080-157-アリウスの生徒C" = "わ、分かりました……！"
"62080-158-アリウスの生徒D" = "では、私たちは何をすれば……？"
"62080-160-スバル" = "ここに陣地を築いてください。"
"62080-162-アリウスの生徒A" = "陣地……ですか？"
"62080-164-スバル" = "はい。作り方は分かりますよね？"
"62080-165-スバル" = "ああでも、外部からの攻撃に加えて――"
"62080-166-スバル" = "内部からの攻撃にも対応できる形でお願いします。"
"62080-168-アリウスの生徒B" = "そ、それって……！"
"62080-169-アリウスの生徒B" = "先輩に何かあった時のために……？"
"62080-171-スバル" = "……二度言わせないでください。"
"62080-173-アリウスの生徒C" = "！！！"
"62080-174-アリウスの生徒C" = "わ、分かりました！"
"62080-179" = "[ns] \"ラッパの聞こえ方に……違いがあった？\""
"62080-180-マイア" = "はい。ラッパが聞こえた子と……。"
"62080-181-マイア" = "……。"
"62080-182-マイア" = "聞こえなかった子がいました。"
"62080-183-サオリ" = "理由は分かるのか？"
"62080-184-マイア" = "い、いえ……そこまでは……。#nあっ、わ、私は……聞こえた側で……。"
"62080-185-マイア" = "……。"
"62080-186-マイア" = "スバル先輩は、たぶん……聞こえてなかったと思います……。"
"62080-187-マイア" = "……うぅっ。"
"62080-188-ミサキ" = "急に泣かないでよ……。"
"62080-189-マイア" = "す、すみません……でも……。"
"62080-190-アツコ" = "やっぱり、昨日……何かあったんだね。"
"62080-191-マイア" = "！？"
"62080-192-アツコ" = "あっ、ごめんね。びっくりさせるつもりはなかったの。"
"62080-193-アツコ" = "でも……よかったら教えてほしいな。"
"62080-194-アツコ" = "どうしてあなただけが先生のところに来て、他の子たちは何も言わずに姿を消してしまったのか――"
"62080-195-アツコ" = "どうして、あの子たちがポルタパシスに向かったって分かったのか。"
"62080-196" = "[s] \"アツコ、それは……。\""
"62080-197-アツコ" = "うん？"
"62080-198-アツコ" = "……。"
"62080-199-アツコ" = "そっか。先生は待つつもりなんだね。"
"62080-201" = "（マイアはしゃがみ込んでしまった。その体は……小さく震えていた）"
"62080-202" = "（誰も、言葉をかけられずにいたが……）"
"62080-204-ヒヨリ" = "あ、あの……先生には……#n話しても、きっと大丈夫だと思うんです……。"
"62080-205-サオリ" = "ヒヨリ……？"
"62080-206-アツコ" = "しーっ。"
"62080-207-ヒヨリ" = "す、すみません……。私、話すのがその……あんまり得意じゃなくて……え、えへへ……。"
"62080-208-ヒヨリ" = "でも、えっと……すっごく辛いこととか……苦しいことがあったときって……。"
"62080-209-ヒヨリ" = "誰でもいいから……思ってることを話しちゃうんです。#nそ、そしたら……少し、楽になります……。"
"62080-210-マイア" = "誰でも……？"
"62080-211-ヒヨリ" = "誰でもです。だ、だけど……こういう時は、先生がおすすめですよ！#n……あっ、邪魔なら、私たちはあっちに行ってるので……！"
"62080-213-ウイ" = "……こちらも、しばらく通話を切りましょうか。"
"62080-214-シミコ" = "そうですね。"
"62080-216-ヒヨリ" = "だ、大丈夫です！先生は……信頼できる人です。#n少なくとも、私にとっては……。"
"62080-217-ヒヨリ" = "何を話しても、ちゃんと聞いてくれて……全力で助けてくれるんです。#n胃薬をくれたし、雑誌も買ってくれたし……。"
"62080-218-ヒヨリ" = "で、でも！先生は……全部[ruby=・・・・・・]やってくれる[/ruby]訳じゃなくて……。#n自分でできることは……自分で頑張らないといけないんですけど……。"
"62080-219-ヒヨリ" = "ちょっと、それは残念だなぁ……って思ったりするんですけどね。"
"62080-220-ヒヨリ" = "でも……そうすることで、生徒が自立できるようになるって……先生が言うので……。"
"62080-221-ヒヨリ" = "うぅ……うまく言えないんですけど……。#nとっ、とにかく！こういうのって……。"
"62080-222-ヒヨリ" = "一人で抱えて悩んでも……辛いことがどんどん増えてくだけなんです……。"
"62080-223-ヒヨリ" = "アリウスの子は、誰かに頼ったり、話したりするのが苦手ですから……。#n私もそうでしたし……今も、ちょっと……。"
"62080-224-ヒヨリ" = "そ、それで、少しでも助けになればと思って……！え、えへへ……。"
"62080-226-マイア" = "ヒヨリさん……。"
"62080-232-ヒヨリ" = "じゃ、じゃあ、私たちはあっちに行ってるので……。人に聞かれたくない話って、いっぱいありますし……。"
"62080-233-ミサキ" = "ついでに、外の様子を見てこようか。"
"62080-234-サオリ" = "ああ、そうしよう。それじゃ――"
"62080-236-マイア" = "ちょ、ちょっと待ってください……！"
"62080-238-アツコ" = "え？"
"62080-239-ヒヨリ" = "は、はい？"
"62080-241-マイア" = "……。"
"62080-242-マイア" = "皆さんにも……お話したいです……。"
"62080-244-ウイ" = "そ、そこまで無理しなくても……。"
"62080-245-シミコ" = "やっとの思いで出した勇気ですし、聞いてあげましょうよ。"
"62080-246-ウイ" = "わ、私なら絶対しないですけどね……。"
"62080-251" = "[ns] \"……大丈夫？\""
"62080-252-マイア" = "……はい。"
"62080-253-マイア" = "たくさんの人の意見を聞けた方が……私も、どうすればいいのか……ちゃんと決められると思うので……！"
"62080-255" = "（マイアは、ゆっくりと昨晩の出来事を語りはじめた）"
"62080-256" = "（みんな、固唾をのんで聞いていた……）"
"62080-258-サオリ" = "……。"
"62080-259-ミサキ" = "……。"
"62080-260-ウイ" = "……。"
"62080-261-ヒヨリ" = "うっ、うぅっ……うわああああん！！！"
"62080-266-アツコ" = "ヒヨリ！？そんなに泣いちゃったら……！"
"62080-267-ヒヨリ" = "でもでも！こんなのあんまりですっ！悲しすぎますよおおおっ！#nこんなの聞いて、平気でいられる訳ないじゃないですか！うわあああああああん！！"
"62080-274-マイア" = "ひ、ひひひひ、ヒヨリさん！？く、苦しい……です……。"
"62080-275-ヒヨリ" = "うわあああん！"
"62080-276-マイア" = "わ、私、なんとか、泣かずに、いたのに……。"
"62080-277-ヒヨリ" = "だからこそなんですよぉぉぉぉぉぉ〜〜〜〜〜〜っ！！！"
"62080-279-アツコ" = "ヒヨリって、やっぱり優しいよね。"
"62080-280-サオリ" = "ああ……いつもそうだった。#n……ミサキ？"
"62080-281-ミサキ" = "なっ、なんでもないから。こっち見ないで。"
"62080-282-アツコ" = "ふふっ。いいんだよ、我慢しなくても。"
"62080-283-ミサキ" = "泣いてないってば！！"
"62080-285" = "[ns] \"話してくれて、ありがとう。\""
"62080-286-マイア" = "えっ、いや……こっちこそ……聞いてくださって……ありがとうございます……。"
"62080-287-マイア" = "でも、こうして話してみて改めて思うんです。ラッパの音……どうして私は聞こえたんでしょうか……。"
"62080-288-ウイ" = "……ラッパが聞こえている方には、何らかの共通項があるはずです。"
"62080-289-ウイ" = "得られた情報からの推論にすぎませんが……。"
"62080-290-マイア" = "その共通項って……。"
"62080-291-ウイ" = "――おそらくは、先生の授業です。"
"62080-292-マイア" = "えっ？でも、授業ならみんな一緒に……。"
"62080-293-ウイ" = "授業を受けただけで、すべてを理解できるとは限りませんからね……。#n本を読んでも、斜め読みでは理解できないのと同じです。"
"62080-294-ウイ" = "いるんですよ……斜め読みしかしてないのに、さも理解したかのように語りだす人や――"
"62080-295-ウイ" = "本をインテリアにしか思ってない人……！"
"62080-296-ウイ" = "そもそも本は、著者と読者が対話するための媒体なんですよ！#nそれを適当に読んで！通じ合えるわけないじゃないですか！"
"62080-298-ウイ" = "もっとこう！この子たちに敬意を払うべきで――"
"62080-300-シミコ" = "委員長、話が脱線しています。"
"62080-302-ウイ" = "えっ！？あ……うぅ……。"
"62080-303-ウイ" = "し、失礼しました……。とにかく……読書と同じで、授業もまたそういうものなんです。"
"62080-304-ウイ" = "勉強とは、自分の知識外のものを、中に取り入れる行為ですから……。"
"62080-305-ウイ" = "勉強を補助するために、先生が導いてくれる時間というのが授業なんです。"
"62080-306-ウイ" = "だから、どれだけ授業を受けたとしても……。"
"62080-307-ウイ" = "聞き流したり、終わった後に忘れたりするようなら……#nそれは授業を受けたとは言えません。"
"62080-308-マイア" = "あ……！"
"62080-309-ウイ" = "なので、ラッパの音を聞いた生徒。つまり黙示録の言葉を借りるなら、「世界の終わりの兆し」を感じ取った生徒は――"
"62080-310-ウイ" = "「アリウスの外の知識」を、抵抗なく受け入れられた生徒だったのではないか、と考えています。"
"62080-311-ウイ" = "言い換えると、「新しい考え方」に対して拒否反応が少なかった生徒です。"
"62080-312-ウイ" = "もちろん、これはあくまで仮説です。#nそして、これを証明できるのは……あなたしかいません。"
"62080-313-ウイ" = "い、いかがでしょうか？"
"62080-314-マイア" = "そうです！たしかにそうかもしれません！#nすごいです、ウイさん！"
"62080-315-ウイ" = "い、いえ……か、勝手に推測しただけなので……。"
"62080-316-シミコ" = "称賛は、素直に受け取ったほうがいいって、いつも言っていますよね？"
"62080-317-ウイ" = "う、あ、うぅ……。"
"62080-318-ウイ" = "そ、それに……「アリウスの外」を受け入れ始めたのだとしたら……。"
"62080-319-ウイ" = "きっと、「今のアリウス」に疑問を持ち始めてもいるはず……。"
"62080-320-ウイ" = "……知識は、人を変える力を持ってますから。"
"62080-325-サオリ" = "それは、つまり……。"
"62080-326-シミコ" = "はい。"
"62080-327-シミコ" = "他の子も、遅かれ早かれ……。"
"62080-328-シミコ" = "アリウスを変えたくないと考える生徒から――#n「敵」と見なされる可能性がある、ということです。"
"62080-330-ミサキ" = "まさかと思うけど、ラッパ吹きの天使って……。"
"62080-331-ウイ" = "それは分かりません。#nもしかしたら本当に……黙示録に出てくる天使そのもの、なのかもしれませんし。"
"62080-332-ウイ" = "ですが、別の解釈もできると思いませんか？"
"62080-333-ウイ" = "「外の世界」に対するアリウスの敵意、不安、怒り……そういったものが集まって――"
"62080-334-ウイ" = "一つの「現象」として現れた……そんな可能性も……。"
