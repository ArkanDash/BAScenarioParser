[translation]
"62050-1" = "第5話;アリウス・バシリカ"
"62050-7-アリウスの生徒A" = "先輩、[ruby=バシリカ]大聖殿[/ruby]に集合って言ってたけど……。"
"62050-8-アリウスの生徒B" = "あの日以降、ほとんど使ってなかったのに……。"
"62050-13-アリウスの生徒C" = "アリウス・バシリカ……。"
"62050-14-アリウスの生徒D" = "ずっと昔……アリウスが追放された後に、ここを使い始めたんだよね。"
"62050-16-アリウスの生徒A" = "そう。バシリカって名前も、その時につけたんだっけ。"
"62050-17-アリウスの生徒B" = "でも、なんで今さら……。"
"62050-22-アリウスの生徒たち" = "……よく、分からない。"
"62050-23-アリウスの生徒たち" = "ここは……今の[ruby=アリウス]私たち[/ruby]にとって、何なんだろう。"
"62050-24-アリウスの生徒たち" = "……なんで先輩は、私たちをここに集めたんだろう。"
"62050-30-スバル" = "皆さん、揃いましたか？"
"62050-36-スバル" = "……不安そうですね。"
"62050-37-スバル" = "大丈夫です。私も同じですから。"
"62050-38-スバル" = "まず、ひとつ確認したいことがあります。"
"62050-39-スバル" = "私の認識が正しければ、ここにいる皆さんは今日――"
"62050-45-スバル" = "「黙示録」に記された声を、聞いたはずです。"
"62050-46-スバル" = "聞いていないという方がいれば、遠慮なくおっしゃってください。"
"62050-52-スバル" = "……いないようですね。#nでは、あの声は私たち全員に届いていた、と。"
"62050-53-スバル" = "……ですが私は、あの声が「黙示録」そのものを意味するのかどうか、まだ確信を持てていません。"
"62050-54-アリウスの生徒たち" = "え……？どうしてですか？#nあれだけはっきり……みんな聞いてたのに……？"
"62050-55-スバル" = "黙示録の記述はあれだけではありません。"
"62050-56-スバル" = "「またわたしが見ていると、一羽の[ruby=わし]鷲[/ruby]が中空を飛び、大きな声でこう言うのを聞いた」"
"62050-57-スバル" = "「ああ、わざわいだ、わざわいだ、地に住む人々は、わざわいだ」"
"62050-58-スバル" = "「なお三人の御使がラッパを吹き鳴らそうとしている」"
"62050-59-スバル" = "……私が確信を持てない理由は、前半の部分――空を飛ぶ「[ruby=わし]鷲[/ruby]」のくだりです。"
"62050-60-スバル" = "鷲どころか、鳥の姿すら私は見ていません。"
"62050-61-スバル" = "鷲……あるいは鳥のようなものを見た、という方はいますか？"
"62050-65-スバル" = "……こちらも、いないようですね。分かりました。"
"62050-66-スバル" = "それと、もうひとつ。#n……ラッパの音は、7回鳴り響くとされていますよね？"
"62050-67-アリウスの生徒A" = "はい……そうだったはずです。"
"62050-68-スバル" = "そして声によれば、すでにラッパの音は4回鳴り響いたことになっている。#nこれも、あっていますよね？"
"62050-69-アリウスの生徒B" = "……その通りです。"
"62050-70-スバル" = "……ですが、私は今まで一度もラッパの音を聞いていません。#n皆さんは、どうですか？"
"62050-75-アリウスの生徒A" = "私は聞こえましたよ？"
"62050-76-アリウスの生徒C" = "私には聞こえなかったです！"
"62050-77-アリウスの生徒A" = "えっ、あんなに大きな音だったのに！？"
"62050-78-アリウスの生徒C" = "だから前にも言ったじゃん！#nそっちの聞き間違いじゃないかって……！"
"62050-79-アリウスの生徒A" = "でも、声は全員に聞こえてるんだよ？"
"62050-86-スバル" = "分かりました。それでは……。"
"62050-87-スバル" = "……。"
"62050-88-スバル" = "皆さん？これから行うのはただの確認ですので、お気になさらず。"
"62050-89-スバル" = "ラッパの音が聞こえたという方は左へ、聞こえなかったという方は右へ分かれてください。"
"62050-105-スバル" = "（……聞こえた側の人数が、明らかに少ないですね）"
"62050-109-スバル" = "（よく見ると、他にも共通点があるような……？）"
"62050-110-スバル" = "はい、ありがとうございます。"
"62050-111-スバル" = "それでは、現時点での結論をお話します。"
"62050-118-スバル" = "「ポルタパシス」へ向かい、今回の出来事の真相を調査すべきだ、と私は考えています。"
"62050-123-アリウスの生徒A" = "ポルタパシス！？先輩、本気なの……？"
"62050-124-アリウスの生徒B" = "先輩はいつだって本気だったよ……しかも、こういうときは特にね。"
"62050-126-アリウスの生徒C" = "あそこって、マダムですら中に入らなかった場所じゃ……？"
"62050-127-アリウスの生徒D" = "でも、もうマダムはいないし……。"
"62050-128-アリウスの生徒D" = "マダムの言ってたことが、全部正しかった訳でもないし……。"
"62050-130-アリウスの生徒A" = "それはそうだけどさ……。"
"62050-132-スバル" = "皆さんの不安は分かっています。"
"62050-133-スバル" = "ですが、手がかりがあるとしたら……#n少なくともアリウスの中では「ポルタパシス」をおいて他にないというのも、また事実です。"
"62050-134-スバル" = "……あそこには、アリウスの歴史と、経典の様々な解釈が保管されているのですから。"
"62050-135-アリウスの生徒A" = "で、でも「ポルタパシス」に入ったら……。"
"62050-136-スバル" = "……そうですね。"
"62050-137-スバル" = "資格なき者、信仰を持たぬ者、信仰を失った者が入れば――"
"62050-138-スバル" = "その果てで己を見失い、アリウスを永遠に彷徨うことになる。#nそう言われています。"
"62050-142-スバル" = "それでも、私たちは向き合わねばなりません。#n他でもない、私たちのアリウスで起こっている現象に。"
"62050-143-スバル" = "……人知の及ばぬことが起きる場所。"
"62050-144-スバル" = "それがアリウスですから。"
"62050-147-スバル" = "ましてや……真実から目を背け、自分たちの罪を隠すために、私たちを「存在しなかったこと」にしようとした――"
"62050-148-スバル" = "あの不道徳なトリニティと、同じ道を進むわけにはいきません。"
"62050-151-スバル" = "まだ仮説の域を出ませんが、黙示録の内容が現実になったのは、トリニティと――"
"62050-152-スバル" = "シャーレの「先生」の影響かもしれません。"
"62050-154-アリウスの生徒B" = "せ、先生が！？トリニティはともかく、先生は……。"
"62050-155-アリウスの生徒B" = "先生って、良い人に見えたのに……。"
"62050-156-スバル" = "ええ。先生は、良い方だと思います。それは、私も認めます。"
"62050-157-スバル" = "……ですが善意がいつも良い結果を生むとは限りません。#nそれは、皆さんもよく知っているはずです。"
"62050-158-アリウスの生徒たち" = "……。"
"62050-159-スバル" = "どうあれ、[ruby=トリニティ]救護騎士団[/ruby]は再び、アリウスの地に足を踏み入れました。"
"62050-160-スバル" = "事実、黙示録が発現したのは、その直後です。"
"62050-161-スバル" = "つまり、トリニティを呼び込んだのが「先生」である以上――"
"62050-162-スバル" = "今回の件の原因も、やはりトリニティ……ひいては先生にあると考えるのが自然でしょう。"
"62050-168-アリウスの生徒C" = "そ、それはそうかも……。"
"62050-169-アリウスの生徒D" = "勉強とか試験とか……そんな余計なことをしなくたって……。"
"62050-170-アリウスの生徒D" = "私たちは私たちで、どうにか生きていけたはずだよね。"
"62050-171-アリウスの生徒C" = "そもそも、勉強って何？意味あるの？"
"62050-172-アリウスの生徒C" = "難しいし、分かんないし、眠くなるし。"
"62050-173-アリウスの生徒D" = "時間の無駄じゃん。もったいないって。"
"62050-174-アリウスの生徒D" = "まぁ、他にやることなかったのはそうだけどさ……。"
"62050-176-スバル" = "（こちらは……ラッパの音が「聞こえなかった」側ですね）"
"62050-181-アリウスの生徒A" = "……でも、私は勉強、嫌いじゃなかったかも。"
"62050-182-アリウスの生徒B" = "私も。外の世界がどうなってるかも、少しは分かったし……。"
"62050-183-アリウスの生徒B" = "誰かを傷つける方法の訓練をするよりは……。"
"62050-184-アリウスの生徒A" = "正直、勉強の内容は全然分かんなかったし……つまんないし。#n退屈だし、眠かったけど……。"
"62050-185-アリウスの生徒A" = "それでも……よかったんだ。"
"62050-186-アリウスの生徒A" = "自分の話をちゃんと聞いてもらえて、自分の言葉を伝えられるっていうのが……。"
"62050-192-スバル" = "（こちらはラッパの音が「聞こえた」側……？）"
"62050-196-スバル" = "（……まさか！？）"
"62050-197-スバル" = "（いえ……もう少し様子を見るべきですね……）"
"62050-201-スバル" = "ところで皆さん。"
"62050-202-スバル" = "万が一、天使が7つのラッパをすべて吹いたとしたら……どうなると思いますか？"
"62050-204-アリウスの生徒A" = "えっ？そ、それって……！"
"62050-205-アリウスの生徒B" = "そんなはずないよ！"
"62050-207-アリウスの生徒C" = "でも黙示録には……。"
"62050-208-アリウスの生徒D" = "そうだよ。私たち、黙示録だけはいっぱい勉強してきたじゃん。#nだから、7つのラッパが鳴っていたら……。"
"62050-213-アリウスの生徒たち" = "アリウスは……滅亡する？"
"62050-216-スバル" = "……。"
"62050-217-スバル" = "ええ。#n経典の記述が正しいのなら、世界が滅び始めるはずです。"
"62050-218-スバル" = "アリウスは、その始まりを告げる場所に過ぎない。"
"62050-219-スバル" = "記述通り進むのであれば……次は、7人の天使が鉢を地に傾ける番でしょうか。"
"62050-221-アリウスの生徒C" = "ど、どどどうしよう！？"
"62050-222-アリウスの生徒D" = "い、今ならまだ……！"
"62050-226-アリウスの生徒D" = "！！！"
"62050-227-アリウスの生徒D" = "アリウスを「浄化」しなきゃ！"
"62050-228-アリウスの生徒C" = "浄化……？"
"62050-229-アリウスの生徒C" = "！！！"
"62050-230-アリウスの生徒C" = "そうだ！先生やスクワッドを……#nみんなアリウスから追い出さなきゃ！"
"62050-231-アリウスの生徒A" = "で、でも勉強は？それに、試験も……。"
"62050-232-アリウスの生徒D" = "今はそれどころじゃないでしょ！？"
"62050-233-アリウスの生徒D" = "そんなこと気にしてる場合じゃないって！"
"62050-235-スバル" = "はい……だから私は、この状況下で皆さんの意見を聞きたかったんです。"
"62050-236-スバル" = "なので、長らく使われていなかったアリウス・バシリカの扉を開けました。"
"62050-237-スバル" = "ここは偽りの礼拝堂であり……マダムによって歪められた地でもありますが……。"
"62050-238-スバル" = "……それでもずっと、[ruby=アリウス]追放された者たち[/ruby]の礼拝堂だった場所です。"
"62050-239-アリウスの生徒D" = "私たちのアリウスに戻さなきゃ！"
"62050-240-アリウスの生徒D" = "ラッパはあと3回残ってるんですよね！？"
"62050-241-アリウスの生徒C" = "で、でも……それ、私たちは聞いてないけど……？"
"62050-242-アリウスの生徒D" = "全部「浄化」しちゃえば聞こえなくなるんだし、そんなの気にする必要ないって！"
"62050-244-アリウスの生徒B" = "で、でも……。"
"62050-245-アリウスの生徒B" = "（私、復習もちゃんとしてたのに……）"
"62050-246-アリウスの生徒B" = "（こんな中途半端なところで終わりなのは……ちょっと……）"
"62050-251-？？？" = "あ、あの……トリニティや先生のせいじゃないかも……しれない、とは思いませんか……？"
"62050-256-アリウスの生徒C" = "は？"
"62050-257-アリウスの生徒D" = "誰、今の？"
"62050-258-アリウスの生徒C" = "あの子は……。"
"62050-265-スバル" = "……続きを話していただけますか？"
"62050-266-マイア" = "は、はいっ。#nあの……これは、私が思うだけ、なんですけど……。"
"62050-267-マイア" = "黙示録に書かれてることが、そのまま起きるって……#n確証は、ないじゃないですか……？"
"62050-269-アリウスの生徒C" = "！！！"
"62050-270-アリウスの生徒D" = "何あの子……！？"
"62050-271-アリウスの生徒C" = "そ、そんなの経典への冒涜だ……！"
"62050-273-スバル" = "……どうして、そう思うんですか？"
"62050-275-マイア" = "だって、やっぱり鷲を見てないですし……。"
"62050-276-マイア" = "ラッパの音が鳴るたびに、ひどい災厄が起きるって書かれてましたけど……。"
"62050-277-マイア" = "そんな気配もなかったし……。"
"62050-279-アリウスの生徒C" = "ふざけないでよ！"
"62050-280-アリウスの生徒D" = "トリニティがここに踏み込んできたこと自体が、災厄じゃないの！？"
"62050-281-アリウスの生徒C" = "思い返してみてよ、先生だってそうじゃん！"
"62050-282-アリウスの生徒D" = "スクワッドも！"
"62050-283-アリウスの生徒C" = "そう！スクワッドのやつら！"
"62050-284-アリウスの生徒C" = "正直、トリニティよりムカつく……。"
"62050-285-アリウスの生徒D" = "そうだよ……#nなんか自分たちだけ、全部分かってるような顔して……！"
"62050-286-アリウスの生徒D" = "もともとあいつら、アリウスから逃げたくせに！！！"
"62050-289-アリウスの生徒たち" = "あいつらならできたはずなんだ！"
"62050-290-アリウスの生徒たち" = "あいつらならやれたはずなんだ！"
"62050-293-アリウスの生徒たち" = "スクワッドだったら、私たちを導けたはずでしょ！？"
"62050-294-アリウスの生徒たち" = "ロイヤルブラッドって呼ばれてたくせに！！！"
"62050-297-アリウスの生徒たち" = "どうして……？サオリ先輩……なんで行っちゃったの……？"
"62050-298-アリウスの生徒たち" = "どうして……私たちから逃げちゃったの……？"
"62050-299-アリウスの生徒たち" = "先輩に憧れてた子も、たくさんいたのに……！"
"62050-302-アリウスの生徒たち" = "虚しいって、何が虚しいって言うの……？"
"62050-303-アリウスの生徒たち" = "あんたも、ここにいたじゃん。私たちと同じだったじゃん……。"
"62050-304-アリウスの生徒たち" = "今さら救われたみたいな顔して、一人で……一人だけ……！"
"62050-309-アリウスの生徒たち" = "……。"
"62050-310-アリウスの生徒たち" = "…………。"
"62050-311-アリウスの生徒たち" = "………………。"
"62050-312-アリウスの生徒たち" = "あの子たちを見てると、ふと思っちゃうんだ。"
"62050-313-アリウスの生徒たち" = "このままでいいのかなって。#nこんな風に生きてていいのかなって。"
"62050-314-アリウスの生徒たち" = "私達の未来って、どうなるんだろうって……。"
"62050-319-アリウスの生徒たち" = "ああ、本当は。"
"62050-320-アリウスの生徒たち" = "[ruby=私も]私たちも[/ruby]そうやって。"
"62050-321-アリウスの生徒たち" = "今とは違う道を、生きてみたかったんだ。"
"62050-324-アリウスの生徒たち" = "でも、そんなことは――"
"62050-325-アリウスの生徒たち" = "もう、できないから……！"
"62050-329-マイア" = "できます！！"
"62050-330-アリウスの生徒A" = "！！！"
"62050-331-マイア" = "きっと……きっとできます！#n多分……おそらく、きっと……。"
"62050-332-アリウスの生徒B" = "……どうやって？"
"62050-333-マイア" = "そ、それは、先生に聞くことになりますが……。"
"62050-334-マイア" = "わ、私はよく分からないけど……先生ならきっと、私たちが知らないことを知ってるはずです！"
"62050-340-アリウスの生徒C" = "……。"
"62050-341-アリウスの生徒C" = "また先生？"
"62050-342-アリウスの生徒D" = "先生、先生って、もううんざりだよ！"
"62050-343-アリウスの生徒D" = "先生が何？あの人の言う通りにしてたら、なんでもうまくいくの？"
"62050-348-アリウスの生徒たち" = "そんな訳ないでしょ！！！！"
"62050-349-アリウスの生徒C" = "あんたさ、さっきから……あっちの肩ばっか持ってるよね？"
"62050-350-アリウスの生徒D" = "外に出て戻ってきたんでしょ？#n絶対、妙な考えに染まってるよ！"
"62050-351-アリウスの生徒C" = "アリウスはずっとこのままだった。#n先生は私達に何かしてくれた？トリニティは――？"
"62050-352-アリウスの生徒D" = "トリニティ……！！！"
"62050-354-アリウスの生徒D" = "そもそも！トリニティが！私たちをこんな風にしたんだ！！！"
"62050-355-アリウスの生徒D" = "……先輩。"
"62050-356-アリウスの生徒C" = "その子の言うことを聞くんですか？"
"62050-361-スバル" = "それは……。"
"62050-363-アリウスの生徒C" = "先輩は、[ruby=・]私[/ruby][ruby=・]た[/ruby][ruby=・]ち[/ruby]の味方ですよね？そうですよね？"
"62050-364-アリウスの生徒D" = "[ruby=・]ア[/ruby][ruby=・]リ[/ruby][ruby=・]ウ[/ruby][ruby=・]ス[/ruby]を守ってくれるんですよね？"
"62050-366-アリウスの生徒たち" = "証明してください、先輩！！！"
"62050-368-スバル" = "す、少し……時間をください。"
"62050-373" = "[log]証明[/log]"
"62050-376" = "[log]証明[/log]"
"62050-379" = "[log]証明証明[/log]"
"62050-382" = "[log]証明証明[/log]"
"62050-385" = "[log]証明証明証明[/log]"
"62050-388" = "[log]証明証明証明証明[/log]"
"62050-391" = "[log]証明証明証明証明証明証明[/log]"
"62050-395" = "[log]証明！！！[/log]"
"62050-399-マイア" = "せ、先……輩……。"
"62050-400-マイア" = "わ、私……ちが……うんです……。"
"62050-401-マイア" = "ほんとに、ほんとにちがうんです……私は、ただ……。"
"62050-402-マイア" = "先輩、ここ……みんなの家を……#n巣を守るって、言ってたじゃないですか……？"
"62050-403-スバル" = "……！"
"62050-407-スバル" = "一つだけ、聞いてもいいですか？"
"62050-408-マイア" = "は、はいっ！"
"62050-413-スバル" = "ラッパの音は……聞こえましたか？"
"62050-417-マイア" = "…………はい。"
"62050-418-スバル" = "そうですか。"
"62050-419-スバル" = "……ごめんなさい。"
