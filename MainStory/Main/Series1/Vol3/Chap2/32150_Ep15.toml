[translation]
"32150-1" = "第15話;火蓋は切られて"
"32150-6-アリウスの生徒A" = "……チームIV、到着。"
"32150-7-アリウスの生徒B" = "特段変わった様子は無し、警戒も予想通り。"
"32150-11-アリウスの生徒C" = "チームV、チームVI、チームVIII、全て準備完了とのことです。"
"32150-12-アリウスの生徒A" = "ターゲットの位置は確認済み。予定通り作戦を開始する。"
"32150-13-アリウスの生徒A" = "総員、前へ。"
"32150-20-ナギサ" = "……ふぅ。"
"32150-24-ナギサ" = "……紅茶でしたらもう結構です。"
"32150-29-ナギサ" = "……？"
"32150-30-？？？" = "……可哀そうに、眠れないのですね。"
"32150-31-ナギサ" = "っ！？"
"32150-37-ハナコ" = "それもそうですよね、正義実現委員会がほとんど傍にいない状態……不安にもなりますよね、ナギサさん？"
"32150-38-ナギサ" = "う、[ruby=うらわ]浦和[/ruby]ハナコさん……！？あなたがどうして、ここに……！？"
"32150-39-ハナコ" = "それはこのセーフハウスをどうやって知ったのか、という意味ですか？それはもちろん、全て把握しているからですよ。合計87個のセーフハウス、そしてそのローテーションまで……ふふっ♡"
"32150-40-ナギサ" = "……！？"
"32150-41-ハナコ" = "変則的な運用もおおよそ把握しています。例えば……今のように心から不安な時は、ここの秘密の屋根裏部屋に隠れるということも♡"
"32150-42-ナギサ" = "なっ……！"
"32150-46-アズサ" = "動くな。"
"32150-47-ナギサ" = "……！"
"32150-48-ハナコ" = "あぁ、もちろんここまでの間に警護の方々は全員片付けさせていただきました。だからこそこうやって堂々と来たわけですが。"
"32150-49-ナギサ" = "[ruby=しらす]白洲[/ruby]アズサさん、[ruby=うらわ]浦和[/ruby]ハナコさん……まさか……！"
"32150-50-ナギサ" = "「裏切り者」はひとりではなく、ふたり……！？"
"32150-51-ハナコ" = "……ふふっ、単純な思考回路ですねぇ♡私もアズサちゃんも、ただの駒に過ぎませんよ。指揮官は別にいます。"
"32150-52-ナギサ" = "……！！"
"32150-53-ナギサ" = "それは、誰ですか……！"
"32150-54-ハナコ" = "そのお話の前にナギサさん……ここまでやる必要、ありましたか？"
"32150-55-ナギサ" = "……。"
"32150-56-ハナコ" = "補習授業部のことです。ナギサさんの心労は、よく分かります。ですがこうして「シャーレ」まで動員して、何もここまでやる必要は無かったのではありませんか？"
"32150-57-ナギサ" = "それは……。"
"32150-58-ハナコ" = "最初から怪しかった私や、アズサちゃんは仕方ありません。ですが……ヒフミちゃんとコハルちゃんに対しては、あんまりだと思いませんか？"
"32150-59-ナギサ" = "……。"
"32150-60-ハナコ" = "特にヒフミちゃんは……ナギサさんと、仲が良かったじゃないですか。"
"32150-61-ハナコ" = "どうしてこんなことをしてしまったのですか？ヒフミちゃんがどれだけ傷ついてしまうのか、考えなかったのですか？"
"32150-62-ナギサ" = "……。"
"32150-63-ナギサ" = "……そう、ですね。ヒフミさんには悪い事をしたかもしれません……。"
"32150-64-ナギサ" = "ですが、後悔はしていません。全ては大義のため。確かに彼女との間柄だけは、守れればと思っていましたが……私は……。"
"32150-65-ハナコ" = "……ふふっ♡"
"32150-66-ハナコ" = "ではあらためて私たちの指揮官からナギサさんへ、メッセージをお伝えしますね。"
"32150-68-ハナコ" = "「あはは……えっと、それなりに楽しかったですよ。ナギサ様とのお友達ごっこ」……とのことです♡"
"32150-69-ナギサ" = "……っ！？ま、まさか、ということは……！？"
"32150-74-アズサ" = "目標を確保。"
"32150-75-アズサ" = "近距離で5.56mm弾を丸々一弾倉分当てたから、1時間くらいはこのまま気を失っているはず。"
"32150-76-ハナコ" = "ふふっ♡ではアズサちゃん、ここからは敵の誘導をお願いできますか？"
"32150-77-アズサ" = "了解。これで、まだどこかにいる「本当のトリニティの裏切り者」に嘘の情報が流れるはず……？"
"32150-78-アズサ" = "そのハナコの仮説の通りであれば、確かにアリウスも襲撃を急ぐに違いない。"
"32150-79-ハナコ" = "はい。私の推測通りなら、まだ分かっていないこともいくつかあるものの……。"
"32150-80-ハナコ" = "まだはっきりした証拠は無い状態ですが……「本当の裏切り者」については、個人的にはほぼ確信がありますし。"
"32150-81-アズサ" = "……ところで、さっきの最後のあのセリフ、必要だった？"
"32150-82-ハナコ" = "あぁ、あれはヒフミちゃんの頑張りの分、勝手な仕返しと言いますか……ちょっとくらいはショックを受けてもらおうかと。"
"32150-83-ハナコ" = "まあ全てが終われば、すぐに誤解は解けるでしょう。"
"32150-84-アズサ" = "……。"
"32150-85-ハナコ" = "ところでアズサちゃん、アリウスの兵力はどれぐらいか分かりますか？正確に言うと、ひとりでどれぐらい持つかを把握したいのですが。"
"32150-86-アズサ" = "詳細は分からない。けど備えはもうずいぶん前からしてきたから、どれほどの相手だったとしてもかなり時間は稼げるはず。"
"32150-87-アズサ" = "このために毎晩、学園の周辺にトラップやら塹壕やらを作っておいたから。そこに誘導しつつ、ゲリラ戦で時間を稼ぐ。"
"32150-88-アズサ" = "じゃあ、一旦ここで。後でまた、合流地点で会おう。"
"32150-89-ハナコ" = "はい、また後ほど！"
"32150-95-アリウスの生徒A" = "セーフハウスを発見！ターゲットは見当たりません！"
"32150-96-アリウスの指揮官" = "……先客があったか。[ruby=・   ・   ・   ・]あの情報[/ruby]が本当だったとはな。"
"32150-97-アリウスの指揮官" = "周辺を捜索しろ！できるだけ静かに！"
"32150-98-アリウスの指揮官" = "合流するはずの「スパイ」はどこだ？！あいつを早く探せ！"
"32150-99-アリウスの生徒C" = "こちらチームIV、奇襲に遭遇！"
"32150-100-アリウスの指揮官" = "何っ！？"
"32150-103-アリウスの生徒C" = "「スパイ」です！「スパイ」が裏切りました！"
"32150-104-アズサ" = "（シューッ、シューッ……）"
"32150-106-アリウスの生徒C" = "うわあぁぁっ！？"
"32150-107-アリウスの指揮官" = "「スパイ」が裏切っただと！？な、何が起きてるんだ！！"
"32150-112-？？？" = "裏切り、それ以上でもそれ以下でもない。"
"32150-113-アリウスの指揮官" = "！？"
"32150-114-アズサ" = "目標は私が先に貰った。"
"32150-115-アリウスの指揮官" = "な、何故だ！どうしてそんなことを……！"
"32150-116-アズサ" = "早く終わらせて、試験を受けなきゃいけないから。"
"32150-117-アリウスの指揮官" = "……え？"
"32150-118-アズサ" = "ちなみにもう正義実現委員会に報告は届いてる、逃げるなら今のうち。"
"32150-119" = "（ピッ）"
"32150-120-アリウスの指揮官" = "……。"
"32150-121-アリウスの生徒A" = "……退却しますか？"
"32150-122-アリウスの指揮官" = "いや、ブラフだ。[ruby=・]情[/ruby][ruby=・]報[/ruby]が正しければ、正義実現委員会は絶対に動かないはず。"
"32150-123-アリウスの指揮官" = "気にすることは無い、行け！"
"32150-124-アリウスの生徒たち" = "了解！"
"32150-126" = "次回;激戦"
