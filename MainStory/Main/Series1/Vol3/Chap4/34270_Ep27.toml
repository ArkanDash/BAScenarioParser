[translation]
"34270-1" = "第27話;エピローグ"
"34270-7-ヒヨリ" = "こ、こっちの道は初めてです……。"
"34270-8-ヒヨリ" = "どこに繋がっているんでしょうか……。"
"34270-9-アツコ" = "とりあえず進んでみよう。"
"34270-10-アツコ" = "どこだって、これから私たちが初めて歩く道だから。"
"34270-11-ヒヨリ" = "はい……そうですね。"
"34270-15-ヒヨリ" = "……あれ。"
"34270-16-ヒヨリ" = "り、リーダーは！？"
"34270-17-アツコ" = "あれ？"
"34270-18-ヒヨリ" = "た、たしかリーダー後ろにいたはずなんですが………#nい、いなくなりました！？"
"34270-20-ミサキ" = "……チッ。"
"34270-21-アツコ" = "ミサキ……？"
"34270-22-ミサキ" = "リーダーは、どっか行ったよ……。"
"34270-23-ヒヨリ" = "ど、どっか行ったって、なんですか！？"
"34270-24-ミサキ" = "私に、みんなを頼むって言い残して……勝手だよね。"
"34270-25-ヒヨリ" = "リーダー……ど、どうして……。"
"34270-26-アツコ" = "……。"
"34270-27-ミサキ" = "ずるいよサオリ。#nこんな風に足枷を残すなんて……。"
"34270-28-ミサキ" = "私には、重すぎる……。"
"34270-29-アツコ" = "……大丈夫、ミサキ。"
"34270-30-ミサキ" = "姫……。"
"34270-35-アツコ" = "サオリには、もう少しだけ時間が必要なんだ。"
"34270-36-アツコ" = "――己を振り返り、自身を知る時間が。"
"34270-37-アツコ" = "自分の命題に答えるための時間が……。"
"34270-38-ヒヨリ" = "リーダーは……サオリ姉さんは、帰ってくるんでしょうか？"
"34270-39-アツコ" = "うん……サッちゃんは帰ってくるよ。"
"34270-40-ヒヨリ" = "今後、私たちだけで……生きていかないといけないんですか？"
"34270-41-アツコ" = "うん……いつまでもサッちゃん頼りじゃいけないからね。"
"34270-43-ミサキ" = "そんな……"
"34270-44-ミサキ" = "私たちは、これからどうすればいいの……？"
"34270-45-ミサキ" = "アリウス自治区にも、トリニティにも、ゲヘナにも……私たちの居場所はない。"
"34270-46-ミサキ" = "……追撃から逃げるために、街を転々とし続ける事になると思う。"
"34270-47-ミサキ" = "私たちを待ち受けているのは、そんな未来だよ……姫。"
"34270-48-アツコ" = "うん……それでも、私たちは大丈夫。"
"34270-49-ミサキ" = "……。"
"34270-50-ヒヨリ" = "姫ちゃん……。"
"34270-51-ミサキ" = "姫……簡単なことじゃないよ。"
"34270-52-アツコ" = "ううん、大丈夫だよ。"
"34270-53-ミサキ" = "……。"
"34270-54-アツコ" = "こんな事で弱音を吐いたら、コンクリートに咲いてる花に失礼だからね。"
"34270-55-アツコ" = "アズサはあの時、花を見てこう言ってた。"
"34270-60-アツコ" = "それがたとえ虚しいことであっても……抵抗し続けることを止めるべきじゃないと。"
"34270-61-アツコ" = "アズサがやり遂げているのだから、私たちもできないわけないよ。#n私たちの青春は、私たちだけのものだから。"
"34270-62-アツコ" = "ちゃんと見守ってくれる人もいるし……そうでしょう？"
"34270-68-ヒヨリ" = "……先生、ですね。"
"34270-69-ミサキ" = "……うん。"
"34270-70-ミサキ" = "そうだね……。"
"34270-72-アツコ" = "うん、一緒に頑張ろう。"
"34270-76-サオリ" = "……。"
"34270-86-ブラックマーケット幹部" = "……ククッ。見たことのない顔ですね。#nここまで流れてきたということは、それなりの事情がおありなのでしょう。"
"34270-87-ブラックマーケット幹部" = "実力さえあれば何でも構いません。#nさて、どんな依頼をお望みですか？#n簡単なもの？難しいもの？"
"34270-89-サオリ" = "難しいやつで……いや、どれほど不可能な依頼でも解決してみせよう。#n依頼料が高い任務をくれ。"
"34270-94-サオリ" = "（私は犯罪者だ――追われる身でもあるし、この先は辛く苦しい日々が続くだろう）"
"34270-95-サオリ" = "（しかし、その苦難の旅路の果てに……）"
"34270-96-サオリ" = "（私たちにも素晴らしい未来があるというのなら……）"
"34270-100-アツコ" = "うん、訪れるよ……私たちにも……"
"34270-101-アツコ" = "……最後には、きっとハッピーエンドを迎えられる。"
"34270-102-アツコ" = "私たちもそうだよね、サオリ。"
"34270-125-ミカ" = "……。"
"34270-130-ナギサ" = "……。"
"34270-135-セイア" = "……。"
"34270-138-セイア" = "先生……私は、もう予知夢を視る事はないだろう。"
"34270-139-セイア" = "其れが――かの夢から抜け出すための代償だった。"
"34270-140-セイア" = "最後の予知夢で目撃した事……其れを、先生と議論しなければならない……。"
"34270-147-セイア" = "だが……其れは、もう少し未来でも良いだろうか？"
"34270-148-セイア" = "今はただ……此処に集まっている、私たちの「現在」に注力したいから。"
"34270-149-セイア" = "そして……私たちは……"
"34270-150-セイア" = "今までのように力を合わせ――努力を重ねて、その試練を乗り越えるから。"
"34270-152" = "[ns] \"それじゃあ、聴聞会を始めようか。\""
"34270-169-サオリ" = "待て、約束が違うぞ。"
"34270-170-ブラックマーケット幹部" = "はて、何の事でしょうか？"
"34270-171-サオリ" = "これはなんだ？#n予定額の半分も入っていないぞ！！"
"34270-172-ブラックマーケット幹部" = "先に約束を破ったのはそちらですが。"
"34270-173-ブラックマーケット幹部" = "こちらの契約書にも書かれておりますように、生徒は時給1000円です。"
"34270-174-ブラックマーケット幹部" = "ところが、あなたは中退ということを隠したじゃありませんか？#nだから時給500円です。"
"34270-175-サオリ" = "ちょっと待て……それは……"
"34270-176-ブラックマーケット幹部" = "そこに税金と各種費用、食費を除いたのがこの金額ですが……何か問題でも？"
"34270-177-ブラックマーケット幹部" = "ああ……それに、指名手配までされているようですが。#nこの事実が知られたら困るのはそちらではないのですか？"
"34270-178-ブラックマーケット幹部" = "ということで、口止め料としてさらに15%差し引かせていただきます。"
"34270-180-サオリ" = "ま、待て……それじゃあ私の給料は……。"
"34270-186-ブラックマーケット幹部" = "0円ですね。"
"34270-187-ブラックマーケット幹部" = "さあ、では出口はあちらです。"
"34270-188-ブラックマーケット幹部" = "何か言いたいことでも？#nそれともヴァルキューレ警察学校にでも訴えてみますか？"
"34270-193-サオリ" = "……いや、分かった。"
"34270-194-サオリ" = "教訓を得たということにしよう。"
"34270-203-ハルカ" = "し、失礼します。"
"34270-204-ブラックマーケット幹部" = "あなたは……この間、依頼をした……！？"
"34270-205-ハルカ" = "あ、はい……え、えっと……。#nうっかりしてしまって……。"
"34270-206-ブラックマーケット幹部" = "精算は済ませたはずですが。"
"34270-207-ハルカ" = "は、はい……そ、そ、そうです。#nその通りです……だ、だから……。"
"34270-211-ハルカ" = "ゆ、許せ……"
"34270-212-ブラックマーケット幹部" = "ゆるせ？"
"34270-214-ハルカ" = "許せません！！！！！！！"
"34270-224-ブラックマーケット幹部" = "ひ、ひいぃっ！？た、助けて！？"
"34270-225-ハルカ" = "アル様のお金を踏み倒すなんて、絶対許せません！！！"
"34270-237-ハルカ" = "……はぁ、はぁ。"
"34270-238-ハルカ" = "あ、アル様が、ちゃんと挨拶して……#nし、しっかりと計算してくるようにって……だ、だから……。"
"34270-239-ハルカ" = "こ、これでしたら、ちゃんと、挨拶になりましたよね……？"
"34270-240-サオリ" = "……。"
"34270-241-ハルカ" = "あ、ああっ……！？#n他の方がいらっしゃっていたなんて！？"
"34270-242-ハルカ" = "お、お騒がせし、た、大変失礼しました！！"
"34270-243-サオリ" = "……いや、別に。"
"34270-244-ハルカ" = "で、では、また今度……#n私は爆弾を設置しに行かなければならないので……。"
"34270-248-サオリ" = "これが、裏世界のやり方か……。"
"34270-251-アル" = "なっ、何ですってーーーー！？"
"34270-253-ハルカ" = "ご、ごめんなさい……ごめんなさい……ごめんなさい……。#n「挨拶」ってそういうのではなかったなんて……ま、またご迷惑をかけてしまいました。し、死にましょうか？死んでもいいですか？"
"34270-254-カヨコ" = "……はぁ。"
"34270-255-ムツキ" = "あははははは！超ウケる！！#nハルカちゃん本当に挨拶してるー。"
"34270-256-ムツキ" = "そこ、すっごく怖そうな連中だったのに、これからどうするのー？"
"34270-257-カヨコ" = "また騒がしくなりそう……はぁ。"
