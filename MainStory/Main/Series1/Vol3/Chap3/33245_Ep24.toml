[translation]
"33245-3-マエストロ" = "……。"
"33245-4-マエストロ" = "心から感謝しよう、先生。"
"33245-5-マエストロ" = "不完全な姿でお見せしてしまったことは汗顔の至りだが、すぐに完成させてみせる。"
"33245-6-マエストロ" = "黒服の言う通りだったな……普段はあまり共感できないものの、この件については感謝をせざるを得まい。"
"33245-7-マエストロ" = "……では[USERNAME]先生。そなたにまた会える時を、心待ちにしている。"
"33245-8-マエストロ" = "また、夢の中で。"
"33245-13" = "その後アリウススクワッドのみんなを探したものの、とうとう見つけることはできなかった。"
"33245-14" = "古聖堂のどれかの地下通路から逃げたのだろうけど、それを特定することもできず……。"
"33245-16-サオリ" = "げほっ、げほっ……！"
"33245-17-ヒヨリ" = "だ、大丈夫ですか、リーダー……。"
"33245-18-ミサキ" = "……で、どこに行く？"
"33245-19-サオリ" = "……自治区には戻れない。彼女に、殺される……。"
"33245-20-ミサキ" = "……まあ、そういう終わり方も悪くないけど。"
"33245-21-ヒヨリ" = "そ、それは苦しそうですね……そうでなくても、この先もずっと……。"
"33245-22-ミサキ" = "うん、それが人生だから。"
"33245-30-アツコ" = "……。"
"33245-32" = "次回;エピローグ"
