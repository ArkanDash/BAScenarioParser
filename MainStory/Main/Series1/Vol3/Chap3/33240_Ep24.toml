[translation]
"33240-1" = "第24話;誰の憎しみ"
"33240-2-サオリ" = "う、くっ……。"
"33240-3-サオリ" = "アズ、サ……。"
"33240-7-アズサ" = "はぁ、はぁ、はぁ……。"
"33240-12" = "[ns] \"アズサ！\""
"33240-13-アズサ" = "先生……。"
"33240-16-アツコ" = "……。"
"33240-17-アズサ" = "アツコ……。"
"33240-18-サオリ" = "げほっ！姫、どうして逃げなかった……。"
"33240-19-アツコ" = "私たちの負けだよ、アズサ。"
"33240-23-サオリ" = "だ、ダメだ、姫！喋ると、彼女が――"
"33240-24-アツコ" = "大丈夫、もう全部終わりだから。"
"33240-25-アツコ" = "それにどちらにせよ、彼女は私を生かしておくつもりは無かったはず。だから、良いの。"
"33240-26-サオリ" = "……？"
"33240-27-アツコ" = "もうやめよう、サオリ。"
"33240-28-サオリ" = "……やめる？"
"33240-29-サオリ" = "アリウスに帰るということか……？帰ったところで、私たちは殺されるだけ……。"
"33240-30-アツコ" = "だから逃げよう、一緒に。"
"33240-31-サオリ" = "逃げる……。"
"33240-32-アツコ" = "うん。"
"33240-33-アツコ" = "アズサが教えてくれた。"
"33240-34-アツコ" = "いつからか持っていたこれは……私たちの憎しみじゃない。"
"33240-35-アツコ" = "この憎しみを、私たちは習った。それからずっと、私たちのものだと思い込んでいた。"
"33240-36-アツコ" = "……アズサはきっと、それに気づいたんでしょう？"
"33240-37-アズサ" = "……。"
"33240-38-アツコ" = "アズサは色々なことを学び、様々な経験を得た……"
"33240-39-アツコ" = "良い大人に出会えたんだね、アズサ。"
"33240-40-アツコ" = "そして、自分のいるべき場所を見つけた……。"
"33240-41-アツコ" = "だから、サオリ。"
"33240-42-アツコ" = "……逃げよう。"
"33240-43-アツコ" = "この場から、アリウスから。"
"33240-44-アツコ" = "いつの間に植え付けられた、私たちのものじゃないはずの憎しみから。"
"33240-45-サオリ" = "逃げるだなんて、そんな……。"
"33240-48-マエストロ" = "素晴らしい……。"
"33240-49-マエストロ" = "知性と品格、礼儀と信念、そして培ってきた経験と知恵……。"
"33240-50-マエストロ" = "やはり、そなたならば……。"
"33240-51-マエストロ" = "私の「崇高」を、理解してくれるに違いない……！"
"33240-54-アズサ" = "こ、これは……。"
"33240-55-アツコ" = "……まさか。"
"33240-56-アツコ" = "あの「教義」が、完成した……？"
"33240-57" = "[s] （これは……）"
"33240-58-アツコ" = "これは、レベルが違う……。"
"33240-59-サオリ" = "どういうことだ……。"
"33240-64-アズサ" = "せ、先生。これは……。"
"33240-65-アズサ" = "マズい、逃げないと……！"
"33240-66" = "[s] \"……どうやら、反則みたいだね。\""
"33240-67-アズサ" = "先生……？"
"33240-68" = "[ns1] \"出さないで終わらせたかったけど……。\"\n[ns2] 大人のカードを取り出す。"
"33240-73-マエストロ" = "おお、おおおおっ……！"
"33240-74-マエストロ" = "そうか、あれが例の「カード」……！"
"33240-75-マエストロ" = "人生を、時間を代価として得られる力……その根源も限界も、私たちですら把握できない不可解なもの……！！"
"33240-76-マエストロ" = "嗚呼、ゴルコンダならあれをどう呼称しただろう……何か高次的な表現を教えてくれたのであろうか……。"
"33240-77-マエストロ" = "見せてくれたまえ、先生。そなたが払ってきた代価を……"
"33240-78-マエストロ" = "そうして手に入れたものの輝きを……！"
"33240-83-マエストロ" = "私の作品に、全力で応えてくれたまえ！"
