[translation]
"101135-7-PMC兵士A" = "撤退、撤退だ！ "
"101135-8-PMC兵士B" = "建物内部に撤退して再整備だ！"
"101135-17-ミヤコ" = "1階のコンビニ、確保しました！"
"101135-18-ソラ" = "あっ、以前「廃棄品」を持って行ってくださった方々ですよね？#n助けに来てくれたんですね！"
"101135-19-ミヤコ" = "……えっと。"
"101135-20-ソラ" = "ここはいつも物騒な事件ばかりなので……#n隠れ方ばっか上手くなってく気がします。もう慣れっこ、ですけど……。"
"101135-21-ミヤコ" = "……それは災難でしたね。"
"101135-22-ソラ" = "あ！そうだ。廃棄弁当いりますか？#n今回も大量に余ってしまってて。"
"101135-23-ミヤコ" = "……ありがとうございます、後で是非。"
"101135-25-サキ" = "よし、入口もクリア！"
"101135-26-ミヤコ" = "助けていただいて、ありがとうございます。公安局のみなさん。"
"101135-27-モエ" = "というか、ルールを破って私たちの手助けをして本当に大丈夫なの？"
"101135-28-モエ" = "「ルールも守れない警察だ」って、犯罪者にバカにされるんじゃない？"
"101135-29-公安局の生徒A" = "あはは……「RABBIT小隊」にこんな事を言われるのは不本意ではありますが……"
"101135-30-公安局の生徒B" = "問題ありません。カンナ局長のお力になれるのなら。"
"101135-31-公安局の生徒A" = "それに、ヴァルキューレの生徒が犯罪者にバカにされるのは、日常茶飯事ですし……"
"101135-32-公安局の生徒C" = "後続の部隊は私たちが相手しますので、建物の奪還の方をお願いします！"
"101135-33-ミヤコ" = "みなさん、ありがとうございます。"
"101135-35-ミヤコ" = "では、私たちは今からシャーレの建物に突入します。#nここからは2つの任務を同時に遂行しなくてはなりません。"
"101135-36-ミヤコ" = "1つ目、建物の地下にある「クラフトチェンバー」をPMCから奪還。"
"101135-37-ミヤコ" = "2つ目、建物のどこかに幽閉されている、リン行政官の救出。"
"101135-38-モエ" = "でも……行政官がどこにいるのか全然分からないんだよ？"
"101135-39-モエ" = "人質の位置を把握せずに開始するのはちょっと……#n安全の保証が難しいと思うんだけど。"
"101135-40-モモカ" = "それはこっちに任せて。"
"101135-41-ミユ" = "だ……誰……？"
"101135-42-アユム" = "わ、私たちは連邦生徒会です。"
"101135-43" = "[s] \"モモカ、アユム！無事だったんだ！\""
"101135-45-モモカ" = "うん。ここはサンクトゥムタワーの地下通信センター。#n監視の目を避けてここまで来るの、ほんと大変だったよ。"
"101135-46-モモカ" = "サボる時に使ってた、通風孔がここで役に立つとはね！あははっ！"
"101135-47-アユム" = "モモカちゃん……。"
"101135-48-モモカ" = "どうにか通信ログを復旧して、リン先輩の位置を突き止めたよ。"
"101135-49-モモカ" = "シャーレ居住区の北部、今は使われてない3番目の部屋。#nそこに先輩はいる。"
"101135-50-アユム" = "先生……どうか、リン先輩を……"
"101135-52" = "[ns] \"うん、任せて。\""
"101135-53-アユム" = "……はい！"
"101135-55" = "次回;[ruby=S.C.H.]シャーレ[/ruby]奪還作戦（２）"
