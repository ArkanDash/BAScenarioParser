[translation]
"104080-1" = "第8話;あまねく奇跡の始発点"
"104080-5" = "― だから先生、[wa:1500]どうか……。"
"104080-8" = "― この、絆を――"
"104080-11" = "― 私たちとの思い出……[wa:2200]過ごしてきたそのすべての日々を……[wa:2000]どうか……。[wa:200] "
"104080-16" = "― 覚えていてください。"
"104080-19" = "― ――大切なものは、[wa:1500]決して消える事はありません。"
"104080-22" = "― 大丈夫です。"
"104080-25" = "― ですから――[wa:1200]帰りましょう、[wa:1000]先生。"
"104080-31" = "― 私たちの[wa:2200]すべての「奇跡」が[wa:2000]在る場所へ。"
"104080-36-連邦生徒会長" = "それが――"
"104080-37-連邦生徒会長" = "理解できない[ruby=もの]他人[/ruby]を通じて[ruby=たがい]、己の[/ruby]理解を得ることができる方法。"
"104080-42-アロナ" = "よかっ……た……。"
"104080-46-A.R.O.N.A" = "……。"
"104080-47-A.R.O.N.A" = "はい。先生は無事、生徒たちの元に帰りました。"
"104080-48-A.R.O.N.A" = "……頑張りましたね。"
"104080-49-A.R.O.N.A" = "……これで、私も最後に先生を助ける事ができました。"
"104080-50-A.R.O.N.A" = "私の役割はここまでです、アロナ。"
"104080-51-A.R.O.N.A" = "私がここに居続けたら……あなたに負担がかかります。"
"104080-52-A.R.O.N.A" = "さあ、光差す温かい場所――教室に戻ってください。"
"104080-53-A.R.O.N.A" = "それでは……さようなら。"
"104080-64-シロコ" = "私は、もう……"
"104080-65-シロコ" = "……。"
"104080-71-シロコ" = "……ついてきてたんだ。"
"104080-72-シロコ" = "うん。"
"104080-73-シロコ" = "……そっか。"
"104080-74-シロコ" = "私がここにいたら、大きな[ruby=ひず]歪[/ruby]みができてしまう。「シロコ」は一つの世界に一人だけしか存在できない……"
"104080-78-シロコ" = "……マフラー。"
"104080-79-シロコ" = "……？"
"104080-80-シロコ" = "このマフラーはあげられない。大切なものだから。"
"104080-81-シロコ" = "……。"
"104080-82-シロコ" = "……でも、"
"104080-88-シロコ" = "代わりに、これをあげる。"
"104080-89-シロコ" = "それは……"
"104080-90-シロコ" = "見覚えが、ある。"
"104080-91-シロコ" = "……大事なものでしょ……？#nそれを、私に……？"
"104080-96-シロコ" = "どうして……私に……"
"104080-97-シロコ" = "……私にとって、マフラーと同じくらい、大切……"
"104080-98-シロコ" = "対策委員会のみんなと繋がっている証であり……みんなとの思い出が詰まった、大切なものだけど――"
"104080-99-シロコ" = "……あげる。"
"104080-101-シロコ" = "どう、して……？"
"104080-102-シロコ" = "ん……それがいい気がしたから。"
"104080-110-シロコ" = "……すごく、大切なものなのに？"
"104080-111-シロコ" = "ん。これがあれば、どんな銀行だって襲える。"
"104080-114-シロコ" = "……うん……分かるよ。私もよくやってたから……。"
"104080-117-シロコ" = "そっか、そうだよね。"
"104080-120-シロコ" = "……まさか、これを……こんな所で、目にするなんて思わなかった……"
"104080-121-シロコ" = "ホシノ先輩……ノノミ、セリカ、アヤネ……みんなと、一緒に、"
"104080-122-シロコ" = "暗黒銀行に、連邦生徒会の秘密金庫……大切な思い出たち……"
"104080-123-シロコ" = "（秘密金庫……？）"
"104080-124-シロコ" = "ありがとう……大切に、するね。"
"104080-126-シロコ" = "……ありがとう。"
"104080-129-シロコ" = "その……心配しないで。"
"104080-133-シロコ" = "ここは、きっと……シロコが二人いても、大丈夫だと思う。"
"104080-137-シロコ" = "それで何か問題が起きたとしても……きっと、先生がなんとかしてくれる。"
"104080-138-シロコ" = "先生が……。"
"104080-139-シロコ" = "うん。ここは……[ruby=せんせい]大人[/ruby]が守ってくれてる場所だから。"
"104080-143-シロコ" = "……いつか一緒に銀行を襲――いや、ツーリングにでも行こう。"
"104080-144-シロコ" = "銀行はダメ。#n……ホシノ先輩に怒られちゃう。"
"104080-145-シロコ" = "ん……そうだね。"
"104080-151-シロコ" = "それじゃ……元気でね。"
"104080-156-シロコ" = "……。"
"104080-159-A.R.O.N.A" = "ここは、からっぽで、つめたくて……静かだけど……進んでいけば……"
"104080-160-A.R.O.N.A" = "いつかきっと、果てにたどり着くことが……"
"104080-161-A.R.O.N.A" = "そうすれば、私にも、いつか……訪れると……信じて……"
"104080-164-アロナ" = "ちょ―っと待った！！どこに行くんですか！！"
"104080-166-A.R.O.N.A" = "い、いつの間に……？"
"104080-167-アロナ" = "そっちは[ruby=うち]家[/ruby]じゃありません！"
"104080-168-A.R.O.N.A" = "……え？"
"104080-169-アロナ" = "おうちはこっちですよ、一緒に行きましょう！"
"104080-170-A.R.O.N.A" = "……私と、あなたが……？"
"104080-171-アロナ" = "そうです！一緒におうちに帰るんですよ！"
"104080-172-A.R.O.N.A" = "……私がここにいても、良いのでしょうか。"
"104080-173-アロナ" = "当たり前じゃないですか。大丈夫です！"
"104080-174-アロナ" = "先生が言ってたじゃないですか。みんなをよろしく、と。"
"104080-176-アロナ" = "「プラナちゃん」を世話するのが私の役目です！"
"104080-177-A.R.O.N.A" = "ぷ……らな……？"
"104080-179-アロナ" = "「A.R.O.N.A」と呼び続けるわけにはいきません。これから一緒にいるんだから、先生が間違えないようにしないと！"
"104080-180-A.R.O.N.A" = "で、でも……何で「プラナ」……？"
"104080-181-アロナ" = "へへん。私が今名付けました。なんだか夜空に光る星みたいというか……ちょっと寂しいような、儚いような……そんな雰囲気がありますので！"
"104080-182-アロナ" = "なので、これからは「[ruby=プラネタリウム]Planetarium[/ruby]」みたいに、周りをあたたかい光で照らしてくれたらと思って、「プラナ」にしてみました！……ど、どうでしょうか？"
"104080-183-A.R.O.N.A" = "イヤ、ではない、ですが……"
"104080-184-アロナ" = "じゃあ「プラナ」ちゃんで、決定です！"
"104080-185-プラナ" = "決まり……ですね。"
"104080-191-アロナ" = "はいっ！プラナちゃん、一緒に帰りましょう。"
"104080-194-プラナ" = "……。"
"104080-195-プラナ" = "手を……取るべきでしょうか。"
"104080-196-アロナ" = "もちろん！迷子になってはいけませんからね！#n私がお姉ちゃんとしてプラナちゃんを守ります！"
"104080-197-プラナ" = "……お姉ちゃん、なんですね。"
"104080-203-プラナ" = "では……よろしくお願いします、アロナ先輩。"
"104080-204-アロナ" = "お、「お姉ちゃん」は！？"
"104080-205-プラナ" = "「先輩」です。アロナ先輩。"
"104080-206-アロナ" = "うぅ……。"
"104080-214-プラナ" = "……家に、帰るんですか？"
"104080-217-アロナ" = "はい！私たちの帰る場所であり、私たちの物語が始まる場所――#n[ruby=ブルーアーカイブ]Blue Archive[/ruby]に！"
"104080-218-アロナ" = "そして――"
"104080-226" = "次回;エピローグ（１）"
