[translation]
"104070-1" = "第7話;同じ状況、同じ選択"
"104070-3-アロナ" = "せ、先生……"
"104070-4-アロナ" = "自分用の、シーケンスを……"
"104070-5-アロナ" = "シロコさん、に……？"
"104070-6-アロナ" = "……そ、それじゃ先生は……"
"104070-7-アロナ" = "先生の身体では……この高度からは……"
"104070-8-アロナ" = "だ、ダメです先生――――！！！！！！"
"104070-10" = "「脱出シーケンス」：残り0回"
"104070-22-A.R.O.N.A" = "……私は、間違っていたのでしょうか。"
"104070-23-A.R.O.N.A" = "先生の願いは……違っていたのでしょうか。"
"104070-24-A.R.O.N.A" = "理解、不可能……ならば何故……先生は箱舟を通じてここに来たのですか。"
"104070-25-A.R.O.N.A" = "それは……"
"104070-29-A.R.O.N.A" = "もしかすると……"
"104070-47-A.R.O.N.A" = "……先生は、信じていたのですか？"
"104070-48-A.R.O.N.A" = "この結末に至った[ruby=・]自[/ruby][ruby=・]身[/ruby]がやり遂げられなかったことを、"
"104070-49-A.R.O.N.A" = "この結末を避けた[ruby=・]自[/ruby][ruby=・]身[/ruby]なら、やり遂げられると……？"
"104070-50-A.R.O.N.A" = "[ruby=じぶん]先生[/ruby]なら……"
"104070-52-A.R.O.N.A" = "同じ状況で、同じ選択を取る……と？"
"104070-55-アロナ" = "……いいえ。このまま諦める事はできません。"
"104070-56-アロナ" = "先生を助けます。"
"104070-57-アロナ" = "「シッテムの箱」のOSであるアロナが、先生を助けます！！"
"104070-58-アロナ" = "今まで何度も奇跡を起こして、先生を守ってきました。これくらい……これくらい、私の力で、なんとか……！！"
"104070-59-アロナ" = "私の力で……！！！"
"104070-84-アロナ" = "ゲホッ……！！"
"104070-90-アロナ" = "ゲホ、ゲホッ……っ……！！"
"104070-92-アロナ" = "なんとか爆発からは守れましたが……"
"104070-93-アロナ" = "だ、ダメ……墜落スピードが、変わりません……。"
"104070-94-アロナ" = "どうして……？わ、私の力が足りない……？"
"104070-95-アロナ" = "ゲホッ……！！"
"104070-96-アロナ" = "む、無理なの……？"
"104070-97-アロナ" = "力を、使い過ぎた……？"
"104070-98-アロナ" = "ウトナピシュティムで受けたダメージと、箱舟の演算で……？"
"104070-99-アロナ" = "いいえ！！それくらいではスーパーアロナは……！！"
"104070-100-アロナ" = "だ……ダメ！！"
"104070-101-アロナ" = "ここは先生が生存できる高度じゃありません。#nはやく……はやくなんとかしないと……"
"104070-102-アロナ" = "先生……。"
"104070-105" = "[ns1] \"……もう大丈夫だよ、アロナ。\"\n[ns2] \"私の代わりに、あの子に手を差し伸べてあげて。\""
"104070-108-アロナ" = "せ、先生！？"
"104070-109" = "[ns3] \"今までありがとうアロナ、ごめんね。\"\n[ns4] \"これでお別れかな……元気でね。\""
"104070-112-アロナ" = "ま、待ってください、お別れだなんてそんな……！？#n……せ、先生？"
"104070-115-アロナ" = "先生――！！！！！"
"104070-122-A.R.O.N.A" = "（……「ナラム・シンの玉座」が崩壊しました。）"
"104070-123-A.R.O.N.A" = "（私も、そう遠からず……）"
"104070-128-A.R.O.N.A" = "……！？"
"104070-133-A.R.O.N.A" = "……ここは。"
"104070-134-アロナ" = "……よかったです！シッテムの箱のOSデータをここに転送できました。"
"104070-135-A.R.O.N.A" = "私を、ここに……？どうして……？"
"104070-136-A.R.O.N.A" = "理解不可能。何故私を助けたのですか？#n……私は、あなたの敵であるはず。"
"104070-140-A.R.O.N.A" = "……理解。"
"104070-141-A.R.O.N.A" = "今までそうだったように……先生は、シロコを助けた……"
"104070-142-A.R.O.N.A" = "先生は……私のことも、助けるべき生徒と考えたのですね。"
"104070-146-A.R.O.N.A" = "……質問。#n先生は……どこに？"
"104070-147-アロナ" = "先生は……。"
"104070-148-A.R.O.N.A" = "……理解。状況分析……状況を確認。"
"104070-149-A.R.O.N.A" = "なるほど。先生は今……"
"104070-150-アロナ" = "はい……先生は、助けようとしましたが……"
"104070-154-A.R.O.N.A" = "……。"
"104070-155-アロナ" = "ぐすっ……っ……"
"104070-156-アロナ" = "私じゃ、力不足で……別の方法も……探せなくて……！"
"104070-157-アロナ" = "ううっ……っ……！！"
"104070-161-A.R.O.N.A" = "……状況を確認。方法、リサーチ。"
"104070-165-A.R.O.N.A" = "「シッテムの箱」A.R.O.N.A、これより先生の保護に移行、強制干渉を始めます。"
"104070-166-アロナ" = "え、え……？#n今なんと……？"
"104070-173-アロナ" = "こ、これは……？"
"104070-174-A.R.O.N.A" = "……私が力になります。アロナ。"
"104070-180-A.R.O.N.A" = "――方法は、あります。"
"104070-181-A.R.O.N.A" = "今からあなたと私の力をあわせ、奇跡を起こします。"
"104070-182-アロナ" = "奇跡、を……？"
"104070-183-A.R.O.N.A" = "そうすれば、先生を無事地上に送り届けることができるでしょう。"
"104070-184-A.R.O.N.A" = "アロナ、手を。"
"104070-185-アロナ" = "て、手、ですか……？"
"104070-186-A.R.O.N.A" = "はい。……私を信じてくれますか？"
"104070-189-アロナ" = "……はい。先生があなたを信じましたから。私も、信じます。"
"104070-192-A.R.O.N.A" = "……ありがとうございます。"
"104070-193-A.R.O.N.A" = "はじめましょう。 あなたと私……私たちの、奇跡を。"
