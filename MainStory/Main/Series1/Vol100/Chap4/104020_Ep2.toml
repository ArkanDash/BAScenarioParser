[translation]
"104020-1" = "第2話;抵抗（１）"
"104020-4-ハルカ" = "あ、アル様……また空が……。"
"104020-5-ムツキ" = "これ、ちょっとヤバいんじゃな～い？"
"104020-6-アル" = "……急ぐわよ。"
"104020-7-ムツキ" = "アルちゃん……？"
"104020-8-アル" = "今、先生とカヨコが頑張っているのよ！！"
"104020-9-アル" = "私達が立ち止まってどうするのよ！#nそんなんじゃ、二人に顔向けできないじゃない！！"
"104020-10-ハルカ" = "あ、アル様……！"
"104020-11-ムツキ" = "……へぇ。"
"104020-12-アル" = "さ、行くわよ！今私達にできることをやらなくちゃ！"
"104020-17-ハルカ" = "は、はい！！どこまでもついていきます、アル様！！"
"104020-23-ムツキ" = "……やっぱ、ここぞって時のアルちゃんはカッコイイ♪"
"104020-31-トキ" = "……遠方に不自然な光を確認。"
"104020-32-トキ" = "データ上、測定不能な位置……。"
"104020-33-トキ" = "……万が一に備え、調査を実行します。"
"104020-38-ヒナ" = "――状況は？"
"104020-39-ミヤコ" = "……再びサンクトゥムが出現したようです。"
"104020-40-サキ" = "むぅ……。"
"104020-41-ミユ" = "せ、先生……大丈夫かな……。"
"104020-42-ヒナ" = "……了解、急ごう。敵の出現に備えて。"
"104020-48-ヒナ" = "狙撃手は次の位置で待機。RABBIT小隊長は指揮をお願い。#nアリスがいない分、火力支援は私が担当する。"
"104020-49-サキ" = "了解。やってみよう。"
"104020-50-ミヤコ" = "了解です。"
"104020-53-SYSTEM" = "繰り返します。搭乗者は急いで避難してください。#n17秒後、「自爆シーケンス」が――"
"104020-54-ユウカ" = "ひ、ヒマリ先輩……これって、本当に止められるんですよね？"
"104020-55-ヒマリ" = "少々、お待ち下さい……。"
"104020-61-SYSTEM" = "搭乗者は急いで避難してください。#n9秒後、「自爆シーケンス」が――"
"104020-62-ヒマリ" = "くっ…………これ以上は、流石の私でも……もう……"
"104020-63-リオ" = "――諦めるのはまだ早いわ。"
"104020-67-ヒマリ" = "り、リオ！？"
"104020-68-リオ" = "「これ以上はもう？」――「天才」の貴女らしくない台詞ね、ヒマリ。"
"104020-72-SYSTEM" = "9秒後、「自爆シーケンス」が発動――9秒後、「自爆シーケンス」が発動――9秒後、「自爆シーケンス」が発動――"
"104020-73-ユウカ" = "と……止まった？"
"104020-74-リオ" = "「多次元解釈」の抑制機能を利用して、強制的にウトナピシュティムを停止させたわ。"
"104020-75-リオ" = "――ただ、あくまで足止めに過ぎない。"
"104020-76-ヒマリ" = "……そうですね。抑制が解けてしまえば、いずれにせよ船は深刻な被害を受けるでしょう。"
"104020-77-ヒマリ" = "――ですが、時間稼ぎにはなりますね。ありがとうございます、リオ。"
"104020-78-リオ" = "どういたしまして……さあ、足止めが効いている間に解決しなくては。#n厄介なシステムとはいえ、攻略法は必ずあるはずよ。"
"104020-79-リオ" = "――でも、私一人での攻略は不可能。#nだから、不本意かもしれないけれど皆の力を貸してちょうだい。"
"104020-80-ヒマリ" = "……それは、[ruby= ・    ・    ・    ・    ・    ・    ・    ・ ]あなたらしくない[/ruby]台詞ですね、リオ。"
"104020-84-ヒマリ" = "そうですね――これだけの規模の船ですから、命令を中継する「端末」がどこかに存在しているはず。"
"104020-85-ヒマリ" = "であれば、中継端末を破壊する事で、この状態を解除できると思います。"
"104020-86-リオ" = "物理的な通信を断つ手法ね。もちろん、それで解決はできるでしょうけれど――"
"104020-87-ヒマリ" = "ええ、一時的しのぎにしかなりません。#n予備の「端末」もあるでしょうし……"
"104020-88-ヒマリ" = "ですが、その間にウトナピシュティムのシステムを復旧させ、#n「箱舟」の管制権を取り戻せれば……"
"104020-90-ヒマリ" = "「箱舟」の「自爆シーケンス」を起動できます。"
"104020-91-リオ" = "そうね……そうすれば、念のために用意しておいた「脱出シーケンス」も使えるようになるはずよ。"
"104020-93-ヒマリ" = "……あなたという人は、本当に。"
"104020-94-リオ" = "……不要だったのなら、謝罪するわ。"
"104020-95-ヒマリ" = "いいえ。あなたの事は嫌いなままですが――今回ばかりは助かりましたよ、リオ。#nチーちゃん！「端末」の位置は分かりますか？"
"104020-97-チヒロ" = "……了解、いま確認中。#n「箱舟」内部の通信が集中している場所が分かれば――"
"104020-98-マキ" = "ハードウェアの探知はハッキングじゃ限度があるよ！#n私たちの専門分野じゃなくない！？"
"104020-99-コタマ" = "そうですね……正確な探知を行うには、「箱舟」そのものの設計図が必要です。"
"104020-103-ハレ" = "……エンジニア部の力が必要かな。"
"104020-106-ウタハ" = "――そういう事なら、任せてくれ。#n今確認しているよ。"
"104020-107-ヒビキ" = "「箱舟」の設計図を解析、構造図と「箱舟」の3D空間スキャンデータを分析中……"
"104020-108-コトリ" = "はい。通信量が多い場所から順に、ですね！#n――もうしばらくお待ちを！"
"104020-111-ヒヨリ" = "リーダー……。"
"104020-112-サオリ" = "不安なのは同じだ。#nだが――"
"104020-113-アツコ" = "うん……信じて待とう。"
"104020-114-ミサキ" = "……。"
"104020-118-イオリ" = "うーん……。"
"104020-123-マコト" = "キキキッ……そう緊張するな。"
"104020-124-イオリ" = "だ、誰が緊張してるって！？"
"104020-138-シロコ" = "はぁ……はぁ……。"
"104020-139" = "[ns] \"まだ、終わってないよ。\""
"104020-140-シロコ" = "……うん。まだ、いける。"
"104020-141-シロコ" = "……。"
"104020-143-ヒビキ" = "……見つけた！信号、ここから出てる！"
"104020-144-ウタハ" = "チーちゃん、位置情報を送ったよ！#n「シャル・カリ・シャッリ回廊」だ！"
"104020-145-コトリ" = "「箱舟」の最下層セクションです！！"
"104020-147-チヒロ" = "位置を確認したよ、ありがとう。#nナビゲーションデータに切り替えて転送するね。"
"104020-148-チヒロ" = "ヒマリ、これを破壊すれば、箱舟との接続を解除できるはず。"
"104020-150-ヒマリ" = "「箱舟」最下層セクションに「シャル・カリ・シャッリ回廊」を確認。#nこれは……ここから1,200mほど下りなくてはなりませんね……。"
"104020-151-ウタハ" = "その上、そこのセキュリティシステムが難解でね……！#n今から解除方法を説明する――"
"104020-152-ハナコ" = "私にお任せください…………"
"104020-157-ハナコ" = "…………システムの全容、把握しました！"
"104020-158-ウタハ" = "いつの間に……！？"
"104020-159-ハナコ" = "一度状況を整理いたします……「箱舟」の最下層「シャル・カリ・シャッリ回廊」にある「端末」を破壊するためには、セキュリティシステムを突破しなくてはなりません。"
"104020-160-ハナコ" = "現在、ウトナピシュティムはハッキングされた状態……ここからセキュリティシステムを突破するのは不可能です。"
"104020-161-ハナコ" = "まだ可能性があるとすれば……「箱舟」最東端と、最西端のセクションに存在する解除装置を同時に破壊すること。"
"104020-162-ハナコ" = "上手くいけば、約5秒ほどセキュリティシステムを停止させることができます。#nその間に端末を破壊すれば、あるいは――"
"104020-163-カヨコ" = "5秒……？"
"104020-164-アコ" = "ああもう！それしか無いのでしたら、すぐにチームを分けましょう。#n箱舟の東と西、最下層を担当するメンバーを――"
"104020-165-ハナコ" = "問題は最下層担当です。#n1,200mをこの短時間で駆け抜けられる方なんて――"
"104020-167-ハルナ" = "……うふふっ。"
"104020-174-ハルナ" = "フウカさん。ついに、やってまいりましたわ。"
"104020-175-フウカ" = "え？何が？……まさか、アレじゃないよね？"
"104020-176-ハルナ" = "ええ、その通り。アレですよ……#nついに、フウカさんの才能が花開く時です。"
"104020-180-ハルナ" = "私は知っております……#nフウカさんが、どれほど自身の才能を磨き、努力してきたかを――"
"104020-181-ハルナ" = "日々の鍛錬と精進を怠らない、その姿勢――"
"104020-182-ハルナ" = "そう！！その才能――実力を、ついに発揮する時が来たのです！#nこれを運命といわずしてなんと言うのでしょう！！"
"104020-183-アカリ" = "はい、運転のお時間です～★"
"104020-184-イズミ" = "あ！給食部の部長が一番得意なやつだね！！"
"104020-185-ジュンコ" = "こういう時の適任といえば、フウカよね。"
"104020-190-フウカ" = "ハルナ……？これ、わざとだよね？そうなんだよね？"
"104020-191-ハルナ" = "うふふっ、故意かどうかなど、さして重要ではありませんわ。#nフウカさんは、このために船に乗ったのでしょう？"
"104020-192-フウカ" = "……いや、宇宙食は？"
"104020-194-ジュンコ" = "とにかく！#n破壊は私たちに任せてちょうだい！！"
"104020-195-イズミ" = "うんうん！セキュリティシステムの方はよろしくね～！！"
"104020-197-ホシノ" = "はいはい、わかったよ。"
"104020-198-セリカ" = "東の解除装置は私たちが担当するわ！"
"104020-199-ノノミ" = "はい！ここから向かうのが一番早いので☆"
"104020-200-ホシノ" = "ささっと片付けちゃおっか。#n先生とシロコちゃんのところに行かないとだからね。"
"104020-201-アヤネ" = "はい！では、私がサポートします。#n行きましょう！"
"104020-204-アリス" = "では、西はアリスたちに任せてください！"
"104020-205-ユウカ" = "ちょっ……ゲーム開発部！？"
"104020-206-ユズ" = "は、はい……！た、たぶんわたし達が、一番近いと思います……。"
"104020-207-ユウカ" = "そう……なら、私が案内するわ！"
"104020-209-モモイ" = "よし、行くよ！"
"104020-213-ミドリ" = "お、お姉ちゃん、待って……！"
"104020-218-ヒマリ" = "アリス、本当に大丈夫なんですね？"
"104020-219-アリス" = "はい！問題ありません！"
"104020-220-アリス" = "それに、「光の剣：アトラ・ハシースのスーパーノヴァ」もまだ壊れていませんから。"
"104020-221-ヒマリ" = "……その名前になったのですね。"
"104020-222-アリス" = "はい。もし良かったら、後でヒマリ先輩に見てもらいたいです。#nもしかしたら何か――"
"104020-223-ヒマリ" = "そうですね。何か、お力になれるかもしれません……#nでは、気をつけてくださいね、アリス。"
"104020-224-アリス" = "はい！行ってきます、ヒマリ先輩！"
"104020-228-ハルナ" = "フウカさん、準備はよろしいでしょうか？"
"104020-230-フウカ" = "はぁ……何でこんなことに……"
"104020-231-イズミ" = "私たちも準備OKだよ～！"
"104020-232-アカリ" = "「箱舟」でひと暴れできるなんて！ドキドキしちゃいます★"
"104020-233-ジュンコ" = "全員乗ったなら早く出発するわよ！時間がないんだってば！！"
"104020-234-フウカ" = "はぁ……1,200m下まで行くんだっけ……？#nまぁ、いつものデリバリーだと思えば――"
"104020-235-ハルナ" = "さあ、出発ですよフウカさん！#n全てを終えたら最後に「グッ！」と親指を立てるのです！"
"104020-236-フウカ" = "イヤ。絶対やらないわよ。"
"104020-238-フウカ" = "それじゃ……行くわよ！！"
"104020-251-一同" = "うりゃああああああ――――！！！"
"104020-253" = "次回;抵抗（２）"
