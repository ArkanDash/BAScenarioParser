[translation]
"103050-1" = "第5話;アビドスに在るもの（２）"
"103050-5" = "対策委員会・教室"
"103050-8-ヒマリ" = "ふむ……。"
"103050-15-アヤネ" = "えっと……その……アビドスに、ようこそ……？"
"103050-17-リン" = "失礼いたします。"
"103050-18-リン" = "カイザーコーポレーションがサンクトゥムタワーを襲撃した際……#nプレジデントは私に言いました。"
"103050-21-プレジデント" = "サンクトゥムタワーを掌握するのだよ。 "
"103050-22-プレジデント" = "……超古代兵器が手に入ったものでね。サンクトゥムタワーの力が必要になった、というわけさ。"
"103050-23-プレジデント" = "これでキヴォトスは、カイザーコーポレーションの支配下になる。#nゲマトリアでも、連邦生徒会でもない……我々が学園都市の主となるのだ。"
"103050-26-リン" = "当時は余裕がなかったので、その意味を考える時間もありませんでしたが……今思うと不自然な物言いです。"
"103050-27-リン" = "「超古代兵器」……私企業のトップが口にする単語とは思えません。"
"103050-28-リン" = "そして、平時であれば気付くことはなかったでしょう……#n「カイザーコーポレーション」と「超古代兵器」――この2つの接点など。"
"103050-29-アヤネ" = "はい……その2つは――"
"103050-33-ホシノ" = "なるほどねぇ～"
"103050-34-アヤネ" = "ホシノ先輩？"
"103050-40-ホシノ" = "カイザーがアビドス砂漠で探してたのって、#n「超古代兵器」だったって事だよね？"
"103050-43" = "アビドス砂漠・発掘区域付近"
"103050-44-ホシノ" = "おじさん、ずっと気になってたんだよね。#nカイザーがアビドス自治区の土地を奪った理由……"
"103050-45-ホシノ" = "砂漠化しちゃってるのにどうして、って思ってたんだけど……#nそういう事だったんだねぇ～"
"103050-47-セリカ" = "というか、「超古代兵器」って何よ！？#nそんな物のためにあんな事したっていうの！？"
"103050-48-ノノミ" = "カイザーが言っていた「宝探し」も、その事だったんですね……"
"103050-50-ホシノ" = "……まぁ、それだけ強力な武器なんでしょ。#nそんなもの、お店で売ってないからねぇ。"
"103050-51-リン" = "ええ。そして、カイザーコーポレーションは「超古代兵器」を起動させるために連邦生徒会を襲撃しました。 "
"103050-52-リン" = "最早、キヴォトス全土を敵に回しても構わない――#nとでも言わんばかりの勢いで……。"
"103050-53-ホシノ" = "最近、砂漠にカイザーPMCが多かったのもそれが理由なんだとしたら……"
"103050-54-ホシノ" = "おじさんたちも、今からアビドス砂漠に行って「超古代兵器」を手に入れたらいいわけだ。"
"103050-56-アヤネ" = "で、ですが……あの場所はカイザーの私有地で――"
"103050-57-ホシノ" = "うん、でも緊急事態だからさ。#nここからはシロコちゃんスタイルで行こうか。"
"103050-62-アヤネ" = "シロコ先輩……スタイル！？"
"103050-68-アヤネ" = "ま、待ってください！そういう意味ではなくて――"
"103050-69-セリカ" = "はぁ、あんまり気は乗らないけど……#n要はバレなきゃいいんでしょ？ちゃちゃっとやるわよ。"
"103050-70-ノノミ" = "シロコちゃんを捕まえるために、ちょ～っと借りるだけですから☆"
"103050-78-アヤネ" = "はぁ……分かりました。事態の収拾のために、借りるだけ……#nカイザーPMCは既に基地から撤収していますので、今は無人のはずです。"
"103050-79-ホシノ" = "ありゃ、そうなの？ "
"103050-80-アヤネ" = "はい。ですが、カイザーの私有地であることに変わりはありません。#nそれに、ひょっこり戻ってくるかもしれませんので、気をつけてくださいね。"
"103050-85-ホシノ" = "うへ～、戦う事を想定してたから、ちょっと拍子抜けだよ。"
"103050-92-ノノミ" = "うふふっ、ちゃんと覆面をつけてくれるアヤネちゃん、可愛いです☆"
"103050-98-アヤネ" = "あ、あう……そ、それは……"
"103050-99-セリカ" = "じゃあ、ここに「超古代兵器」を持ってくればいいのよね？"
"103050-100-セリカ" = "思ったより大したことないわね……"
"103050-102-ヒマリ" = "いえ――おそらく、持ってくるのは難しいかと。"
"103050-103-アヤネ" = "ヒマリさん……？"
"103050-104-ヒマリ" = "ですので私たちも後から参ります。#n皆さんは、全員が到着するまでの間、安全の確保をお願いできればと。"
"103050-106-ホシノ" = "「超古代兵器」ってそんなに大きいんだねぇ～"
"103050-108-ヒマリ" = "ええ。"
"103050-109-ヒマリ" = "先生によると、かの「超古代兵器」は――"
"103050-115-ヒマリ" = "[ruby=・   ・   ・   ・]宇宙戦艦[/ruby]、なのだそうです。"
"103050-121-一同" = "宇宙戦艦！？"
"103050-131-PMC兵士A" = "なっ、何だお前らは！？ "
"103050-132-PMC兵士B" = "これは……一体！？"
"103050-141-ホシノ" = "そっか。サンクトゥムが消えたから戻ってきてるんだね。"
"103050-142-ノノミ" = "ですが、ここは元々[ruby=私たち]アビドス[/ruby]の自治区です！"
"103050-143-セリカ" = "そうよ！カイザーは勝手に居座ってるだけじゃない！"
"103050-145-アヤネ" = "で、ですが、書類上は……"
"103050-146-アヤネ" = "うう、大丈夫でしょうか……"
"103050-147-ホシノ" = "まあ、キヴォトス全域はまだ混乱の真っ只中だし、#n何かあったとしても、先生がなんとかしてくれるんじゃない？"
"103050-148-ノノミ" = "これが大人のパワー、ですね☆"
"103050-149-アヤネ" = "あ、あはは……"
"103050-158-セリカ" = "わっ、"
"103050-159-セリカ" = "まだいたの！？ "
"103050-160-ホシノ" = "よ～し、気合入れていくよ～！"
"103050-161-アヤネ" = "はい！指定座標に移動します。"
"103050-162-アヤネ" = "先生、指揮をお願いします！"
"103050-163" = "[ns] \"それじゃ、始めるよ！\""
