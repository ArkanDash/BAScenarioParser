"103160-141-ニヤ" = "……。"
"103160-142-カホ" = "先生……"
"103160-144-コユキ" = "そ、空が……！せ、先輩どうしましょ！？"
"103160-145-ノア" = "ユウカちゃん……先生……"
"103160-147-サキ" = "空が……"
"103160-148-ミユ" = "せ、先生に何かあったんじゃ……"
"103160-149-モエ" = "これって……"
"103160-153-ミヤコ" = "……。"
"103160-160-ナギサ" = "せ、セイアさん、ミカさん！"
"103160-161-ミカ" = "遅かったね、ナギちゃん。#nセイアちゃんは、さっきどこかに行っちゃった。　"
"103160-162-ナギサ" = "……ええっと？　"
"103160-163-ミカ" = "なんだか不吉な「気配」を感じるからそれに備えたいって言ってたよ？"
"103160-164-ミカ" = "――「自分が居ない間、何か起きた時は後を頼む」ってさ。"
"103160-165-ナギサ" = "そうですか……では、私たちもすぐに取り掛かりましょう。 "
"103160-166-ミカ" = "うん。了解☆"
"103160-167-ミカ" = "先生が帰ってきた時、うまく対処できてなかったら、きっとガッカリしちゃうよね！"
"103160-168-ミカ" = "――だから、先生の心配は後回し。"
"103160-170-ヒヨリ" = "そ、空が――！？"
"103160-171-ミサキ" = "ヒヨリ、あれは言わなくていいからね。"
"103160-172-ヒヨリ" = "な、何のことですかミサキさん……そんなに私は「もう人生終わりだ」とか、「この世は苦痛だらけです」とか、ネガティブ発言ばかりの印象なんですか……？うぅ……いえ、事実ではありますが……！"
"103160-174-サオリ" = "……行くぞ。"
"103160-175-アツコ" = "うん――どんなことがあっても、努力を止めるべきじゃない、からね。"
"103160-177-ヒヨリ" = "はい……い、行きましょう！ "
"103160-178-ミサキ" = "……うん。私たちにできることをやろう。"
"103160-180-ハレ" = "今の「ウトナピシュティム」の制御権は、相手に渡っている状態……。"
"103160-181-コタマ" = "現在ハッキング位置を追跡中です……"
"103160-182-コタマ" = "……確認完了。「アトラ・ハシースの箱舟」第4エリアの中央部です。 "
"103160-183-マキ" = "……え？これがその場所の名前？"
