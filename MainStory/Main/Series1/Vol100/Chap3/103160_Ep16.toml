"103160-192-ノノミ" = "……時間稼ぎがしたかっただけ、ということでしょうか。"
"103160-193-セリカ" = "そ、そんな……じゃあ、私たちは今まで……"
"103160-195-アヤネ" = "作戦は失敗……。今までの努力は全部、水の泡――"
