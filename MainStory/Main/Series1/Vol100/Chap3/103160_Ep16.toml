"103160-185-ハレ" = "ここから「ウトナピシュティム」をハッキングしてる……止めないと！！"
"103160-187-アヤネ" = "みなさん、大丈夫ですか？ "
"103160-188-セリカ" = "うん……大丈夫。特に怪我はないけど……"
