"103160-4-ハナコ" = "……。"
"103160-8-リン" = "……。"
"103160-9-モモカ" = "みんな、はやく……。"
"103160-10-アユム" = "……。"
"103160-12-ハレ" = "「自爆シーケンス」の構成、完了。あとは実行ボタンを押すだけ。"
"103160-13-コタマ" = "シミュレーション結果も問題ありません。#nこれであれば、「アトラ・ハシースの箱舟」は確実に破壊できます。"
"103160-14-マキ" = "すっごい爆発が起きるんじゃない？#n箱舟の破片が、キヴォトスのあちこちに降ってきちゃうかも。"
"103160-16-チヒロ" = "……こっちの準備は完了してるよ。#n脱出の用意ができたら教えて。"
"103160-17-リオ" = "ちょっと待ってちょうだい！！"
"103160-18-ヒマリ" = "……リオ？"
"103160-19-リオ" = "何かがおかしいわ――今、私たちは箱舟を掌握しているはずなのに……"
"103160-20-リオ" = "……ヒマリ！#n今すぐ「ウトナピシュティム」の中枢システムを見てちょうだい。 "
"103160-21-ヒマリ" = "……中枢システム、ですか？"
"103160-25-リオ" = "……。"
"103160-26-ヒマリ" = "……こ、これは一体？"
"103160-27-リオ" = "……[ruby=・   ・   ・   ・   ・]ハッキング[/ruby]されたのよ。"
"103160-31-リオ" = "こんな数値では……一体、誰が……いつの間に……"
"103160-32-リオ" = "「ウトナピシュティムの本船」が――ハッキングされているわ！！"
"103160-34-チヒロ" = "こ、れは……どういう……！？"
"103160-35-コタマ" = "な、何かがおかしいです……！#nどうして今「自爆シーケンス」が起動するんですか……！？"
"103160-36-マキ" = "な、なんで……？もうボタン押したの？#nまだ脱出準備、終わってないんじゃないの！？"
"103160-37-ハレ" = "いや、これは……！ "
"103160-39-SYSTEM" = "「自爆シーケンス」を実行します。"
"103160-53-みんな" = "――――！？！？"
"103160-55-ユウカ" = "え……？「自爆シーケンス」が起動？"
"103160-56-アコ" = "はい……？今なんと……？"
"103160-57-ハナコ" = "これは……一体？"
"103160-58-カヨコ" = "みんな、伏せて！！ "
"103160-68-チヒロ" = "……。"
"103160-69-マキ" = "いったい、どうして……。"
"103160-70-ハレ" = "何が起きてるの……？"
"103160-71-コタマ" = "これは……船の、自爆……？#nな、何故……？"
"103160-75-チヒロ" = "一体、何が……どうなってるの……。"
"103160-77-アユム" = "げほっ、げほっ……みなさん、ご無事ですか……？ "
"103160-78-モモカ" = "ちょっと、何事！？"
"103160-79-リン" = "ぐっ……！！"
"103160-80-ユウカ" = "幸い、爆発はそれほど大きくなかったけど……"
"103160-81-ユウカ" = "この状態……大丈夫なのよ、ね……？"
"103160-84-ユウカ" = "ヒマリ部長。現状の説明をお願いしてもいいかしら？"
"103160-85-ヒマリ" = "……やられました。"
"103160-86-ユウカ" = "えっ、やられたって……何によ？"
"103160-87-ヒマリ" = "……私たちが、「アトラ・ハシースの箱舟」の占領を進めている間、敵は……"
"103160-88-ヒマリ" = "――バックドアから「ウトナピシュティム」の掌握を進めていたのです。"
"103160-89-ユウカ" = "……なっ！？"
"103160-92-ヒマリ" = "……現在、「ウトナピシュティムの本船」の所有権は、敵に渡っています。"
"103160-93-ユウカ" = "い、いつの間に……！というか、それを実行するには、内部からの物理的な接触が必要でしょ！？"
"103160-94-ユウカ" = "内部に誰も入れた覚えは――"
"103160-105-ユウカ" = "ま……まさか、あの時……"
"103160-106-ヒマリ" = "箱舟の自爆どころか……「アトラ・ハシース箱舟」の多次元解釈を、「ウトナピシュティムの本船」が助けた形になりました。"
"103160-107-ヒマリ" = "このままでは、また「虚妄のサンクトゥム」が……"
"103160-113-リン" = "……これは。"
"103160-114-モモカ" = "そ、空が……！？ "
"103160-115-アユム" = "また……虚妄のサンクトゥムが……！？"
"103160-127-イオリ" = "な、何……！？"
