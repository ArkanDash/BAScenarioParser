"103160-197-アヤネ" = "し、シロコ先輩……？"
"103160-199" = "[ns] \"まだ諦めるには早いよ。\""
"103160-200-アヤネ" = "せ、先生まで……シロコ先輩とご一緒なのですか？#n今はどちらに……！？ "
"103160-209-シロコ" = "ん。第4エリア中央の「ウトナピシュティム」をハッキングしてる場所に先生と向かってるよ。"
