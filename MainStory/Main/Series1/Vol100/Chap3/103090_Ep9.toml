[translation]
"103090-1" = "第9話;地上最後の夜"
"103090-2" = "シャーレ・仮宿"
"103090-4-ユウカ" = "……そういう事だから、ノア。"
"103090-5-ノア" = "はい。ユウカちゃん、お話は伺いました。"
"103090-6-ノア" = "その間、ミレニアム自治区は――"
"103090-7-ノア" = "いえ、キヴォトスは私たちが守りますので。"
"103090-8-ユウカ" = "うん、よろしくね。 "
"103090-11-ノア" = "こちらこそ……よろしくお願いしますね。 "
"103090-18-ノア" = "どうか怪我だけはしないよう、気をつけて行ってきてください。"
"103090-23-ユウカ" = "……うん。"
"103090-26-アヤネ" = "――ホシノ先輩……"
"103090-27-ホシノ" = "そういうことだから、アヤネちゃん。#n私たちも「ウトナピシュティム」に乗って、先生と一緒に「箱舟」に向かうよ。"
"103090-28-セリカ" = "アヤネちゃん一人を行かせるわけないでしょ！"
"103090-29-アヤネ" = "で、ですが…… "
"103090-31-ノノミ" = "箱舟に着いたら戦うことになるかもしれないんですよね？"
"103090-32-ノノミ" = "それでしたら、人手は多ければ多いほど良いと思うんです。"
"103090-33-ノノミ" = "それに……"
"103090-34-ノノミ" = "その箱舟には、シロコちゃんがいるんですよね？"
"103090-41-ノノミ" = "……。"
"103090-42-アヤネ" = "……はい、おそらくは。"
"103090-43-セリカ" = "シロコ先輩に会いたいのは、アヤネちゃんだけじゃない。#nここにいるみんな同じなのよ。"
"103090-45-ホシノ" = "あの状態のシロコちゃんだったら、私たちの邪魔に来るだろうし……"
"103090-46-ホシノ" = "捕まえるのは、おじさん達の役目だからね～"
"103090-47-ホシノ" = "それは、先生にも伝えてるよ。"
"103090-48-アヤネ" = "ですが……この作戦は、成功確率がとても低いんです。#n私たちが失敗した時の事を考えないと――"
"103090-52-？？？" = "そんな辛気臭いこと言うんじゃないわよ！"
"103090-53-アヤネ" = "あ、あなた達は……！ "
"103090-62-ノノミ" = "わあ～便利屋のみなさん☆"
"103090-65-ムツキ" = "やっほ～、遊びに来たよ！"
"103090-66-ハルカ" = "ご、ご苦労様です……！"
"103090-67-カヨコ" = "はぁ……ここの空気も重い。"
"103090-68-アル" = "まだ作戦が始まってもいないのに、もう失敗した時の話？ "
"103090-70-アヤネ" = "はっ、はい？ええっと……"
"103090-73-アル" = "こういう時はね！ "
"103090-78-アル" = "「無事に帰ってきたら、みんなでラーメン食べに行こう！」とでも言いなさいよ！"
"103090-85-ハルカ" = "な、なるほど……それがハードボイルド！さすがはアル様です！！"
"103090-86-カヨコ" = "……いや、むしろフラグに聞こえるんだけど。"
"103090-87-ムツキ" = "くふふっ……でもアルちゃんね、カヨコちゃんが一人で行くって話を聞いたらすっごい涙ぐみながら――"
"103090-89-アル" = "ちょ、ちょっと！私がいつ――"
"103090-90-ムツキ" = "あははっ！怪我しないように～、とか重々気をつけてほしい～、だとか――"
"103090-91-アル" = "そ、そんなこと言ってないわよ！？"
"103090-93-カヨコ" = "……まぁ色々心配事があるだろうけど、大丈夫でしょ。"
"103090-94-カヨコ" = "学園を越えて力を合わせた計画だし――[USERNAME]先生も一緒だから。 "
"103090-95-カヨコ" = "先生がいるから……どんなことが起きても、きっと大丈夫。"
"103090-96-アヤネ" = "……はい。"
"103090-98-ホシノ" = "そうだねぇ……"
"103090-99-ホシノ" = "先生がいたから、今までも――"
"103090-100-ノノミ" = "……。"
"103090-101-セリカ" = "……。"
"103090-121-ノノミ" = "はい……私たちだけでは絶対できなかった事も、なんとかなりました。"
"103090-122-ホシノ" = "そうだね……だから、今回もきっと大丈夫って信じればいいんだよ。"
"103090-127-アヤネ" = "……はい！"
"103090-128-ホシノ" = "私たちでシロコちゃんを助けよう。"
"103090-129-ノノミ" = "うんうん！シロコちゃん捕獲作戦です☆"
"103090-131-セリカ" = "だから、シロコ先輩は野生動物じゃないってば……"
"103090-133" = "砂漠・発掘エリアの仮宿"
"103090-136-ミドリ" = "「宇宙戦艦」が発見された、って聞いたから来てみたけど…… "
"103090-137-モモイ" = "うーん、私たちの想像してたのとはちょっと違ったね。"
"103090-139-ユズ" = "そうだね……宇宙には出られないし、武装も無いみたいだし。#nこれって、宇宙戦艦とは違う別の何か……なのかな。"
"103090-141-モモイ" = "先生は「これに乗って本拠地の攻略に行く」って言うし……"
"103090-142-ミドリ" = "……お姉ちゃん、私たちはどうするの？"
"103090-143-モモイ" = "んー……ユウカが言ってたように、ミレニアムに帰った方がいいと思う。#n……ここにいたところで、みんなに迷惑をかけちゃうだけだし……"
"103090-149-アリス" = "アリスは、先生と一緒に行きたいです。"
"103090-151-ミドリ" = "……アリスちゃん？"
"103090-152-ユズ" = "ど、どうして……？"
"103090-153-モモイ" = "えっ、なんで！？#nこれは宇宙に出られないから、「宇宙勇者」デビューはできないよ？"
"103090-154-アリス" = "それはとても残念ですが……"
"103090-155-アリス" = "この戦艦を守れるのはアリスだけだから、です。"
"103090-157-ミドリ" = "えっ……アリスちゃん、それはどういう事？"
"103090-158-ユズ" = "えっと……それって、戦艦に、武器が無いから……？"
"103090-159-ミドリ" = "「光の剣」を持ってるから、アリスちゃんは行きたいの……？"
"103090-161-アリス" = "はい。アリスが持っている「光の剣」は、エンジニア部のみなさんが宇宙戦艦用として製作した武器です。 "
"103090-162-アリス" = "今のキヴォトスで、これを扱えるのはアリス以外いません。"
"103090-165-ユズ" = "……。"
"103090-167-アリス" = "エンジニア部のみなさんは、「半分は遊びで作ったものだし、この程度の出力では戦艦級の戦闘には役に立たない」と言っていましたが……"
"103090-168-アリス" = "だとしても……あの戦艦を守れる、唯一の方法がアリスなら、"
"103090-169-アリス" = "アリスが少しでも、先生の役に立てるのなら……アリスは行きたいです。"
"103090-171-ミドリ" = "で、でも…… "
"103090-172-モモイ" = "うん、アリスの気持ちも分かるよ。#n先生には、本当にいっぱい助けてもらったから。 "
"103090-181-ユズ" = "……じゃ、じゃあ、わたし達みんなで行く？"
"103090-183-モモイ" = "えっ……ええっ！？"
"103090-184-ミドリ" = "ユズちゃん……？"
"103090-186-ユズ" = "ほ、ほら……今までも危険な出来事はたくさんあったし…… "
"103090-187-ユズ" = "その中には、理解できないようなことも……わたし達だけじゃ絶対解決できないようなことも、たくさんあった……"
"103090-188-モモイ" = "そ、そうだけど……"
"103090-189-ユズ" = "わたし、未だにどうして生徒会長がアリスちゃんを狙っているのか……あの時、何があったのかも、よく分かってなくて……"
"103090-190-モモイ" = "そ、それは私もそうだけど……"
"103090-191-モモイ" = "でもだからといって、私達が行く必要ないじゃん！"
"103090-192-ミドリ" = "そ、そうだよ……"
"103090-194-アリス" = "……。"
"103090-196-ユズ" = "わたし、は――わたし達が、これ以上仲間はずれにされるのは、いやなの。 "
"103090-197-ユズ" = "たとえ、状況が分からなくても、みんなと一緒なら……大丈夫だと、思うから……"
"103090-198-ユズ" = "今回も分からない事がたくさんあったけど……でも、みんなと、先生と一緒だったから……あんまり怖くなかったの……"
"103090-199-ユズ" = "新しい人とも出会えた……RABBIT小隊の方とか、風紀委員長、とか……#nも、もちろん怖かったけど、でも――"
"103090-204-ユズ" = "――ロッカーに隠れて震えているよりは……良かった、って思ってる。"
"103090-205-ユズ" = "だから、わたしは……アリスちゃんと一緒に行きたい。 "
"103090-206-ユズ" = "アリスちゃんがいたから、わたし達ゲーム開発部は今も続いているんだし……"
"103090-207-ユズ" = "だから、アリスちゃんがやりたい事があるのなら……#n今度は、わたし達が協力する番、だと思うの……"
"103090-208-ユズ" = "わたし達は――な、仲間、だから……！"
"103090-213-アリス" = "……。"
"103090-215-モモイ" = "そうだね、ユズ……よくぞ言ってくれた！#nミドリ、私たちも行こう！"
"103090-216-ミドリ" = "うん、お姉ちゃん……アリスちゃん、「宇宙勇者」にはなれなくても……戦艦のメイン火力になろう！"
"103090-218-アリス" = "……はい！みんなと一緒なら百人力です！#nアリスはもう、怖くありません！"
"103090-220-ユズ" = "アリスちゃんも……怖かったの？"
"103090-221-アリス" = "はい。とてもとても、怖かったです。"
"103090-226-アリス" = "……アリスの中には、まだ「ケイ」が残っています。"
"103090-232-モモイ" = "え！？け、ケイが……ホント！？#nあいつ、光の剣でぶっ飛ばしたはずじゃ……"
"103090-233-ミドリ" = "結局「ケイ」……で、いいのかな……名前……"
"103090-235-アリス" = "アリスには、ケイの正体が何なのか……#nアリスに何を望んでいるのか、よく分かりません。"
"103090-236-アリス" = "……アリスは、「アリス」の事さえ、よく分かっていません。 "
"103090-237-アリス" = "ケイはアリスの事を……「名もなき神」が残した王女、と言っていました。#nリオ会長は、世界を滅亡させる兵器、と言っていました。"
"103090-238-アリス" = "「王女」も、「ケイ」も、「箱舟」も、「名もなき神」も……アリスはアリスと関係している何もかもが分かりません……"
"103090-239-アリス" = "でも……皆がいたから……そして、先生がいたから……"
"103090-240-アリス" = "そういった事が分からなくても、「アリス」になれたんだと、思います。"
"103090-244" = "[ns] \"うん。勇者になっていいんだよ。\""
"103090-246" = "[ns] \"君がなりたい存在は、君自身が決めていいんだよ――アリス。\""
"103090-248-アリス" = "……"
"103090-249-アリス" = "アリスはみんなと――仲間たちと一緒に、先生を助けに行きたいです。 "
"103090-250-アリス" = "アリスが勇者でいたいから……ゲーム開発部の、一員でいたいから、"
"103090-251-アリス" = "他の誰でもないアリス自身が……「アリス」の事を、決めたいから！"
"103090-252-ユズ" = "アリスちゃん……"
"103090-254-ミドリ" = "うん……アリスちゃん、明日みんなで出発しよう。絶対、一緒にいるからね。"
"103090-255-モモイ" = "アリス、カッコよかったよ！今の、本当の勇者みたいだった！！"
"103090-257-アリス" = "はい！当然です！アリスは勇者ですから！ "
"103090-258-アリス" = "それと、今回はダメでしたが……いつか、宇宙勇者にもなる予定です！"
"103090-260-ミドリ" = "それ、まだ諦めてなかったんだね…… "
"103090-262-ユズ" = "り、流行に左右されそうだし、早めに取り入れないとダメかも……"
"103090-264-モモイ" = "いーや！"
"103090-265-モモイ" = "こういうのは案外長続きするもんだよ？"
"103090-267-モモイ" = "「恐竜トルネード」みたいなさ、すえながーく愛される名作みたいに！"
"103090-272-ミドリ" = "「迷」作……じゃなくて？"
"103090-277-アリス" = "う、宇宙勇者は……"
"103090-278-アリス" = "恐竜トルネード、なんですね……"
"103090-280-ミドリ" = "あっ……アリスちゃんが落ち込んでる……！？"
"103090-286-ハナコ" = "という訳で――そういう事に、なりました。"
"103090-287-ヒフミ" = "ハナコちゃん……"
"103090-288-アズサ" = "そうか、大変な任務になるだろう。"
"103090-290-コハル" = "だ、大丈夫なんだよね？"
"103090-291-コハル" = "いや……まぁ、先生も一緒だし…… "
"103090-292-ハナコ" = "ええ、きっと大丈夫だと思います。うふふっ♡"
"103090-293-ヒフミ" = "そうですね、先生がいるのなら、きっと……"
"103090-294-ハナコ" = "……たまに、こんな事を考えるんです。"
"103090-298-ハナコ" = "あの時、先生が補習授業部の担任としていらっしゃらなかったら、"
"103090-299-ハナコ" = "私たちは一体どうなっていたのだろう――と。"
"103090-307-ヒフミ" = "そ、それは……"
"103090-308-ハナコ" = "そして、先生がいたからこそ、私たちがやり遂げられた事……"
"103090-327-ハナコ" = "……。 "
"103090-328-コハル" = "……。 "
"103090-329-ヒフミ" = "ハナコちゃん……"
"103090-330-アズサ" = "気をつけていってくるんだぞ、ハナコ。#n私たちはその間、学園を守っているから。"
"103090-331-コハル" = "そうよ！私たちがキヴォトスを守っている間に、ちゃちゃっと片付けてきてよね！"
"103090-333-ハナコ" = "ふふっ、分かりました――すぐ、戻ってきますね。"
"103090-335-ヒナ" = "アコ、体には気をつけて。"
"103090-336-アコ" = "委員長……"
"103090-337-ヒナ" = "ここには私が残った方がいい――その判断は間違ってない。#n緊急事態が起きた時、一番効率的に解決できるのは私だろうから。"
"103090-338-アコ" = "……はい。では、戻りましたらまたご報告いたします。"
"103090-339-ヒナ" = "うん、待ってる。"
"103090-341-セイア" = "……。"
"103090-343-ミカ" = "……。"
"103090-345-ナギサ" = "心配ですか？セイアさん。"
"103090-346-セイア" = "いや、そういうわけでは――"
"103090-348-ミカ" = "そう言うナギちゃんだって、今何杯目～？#nそんなに飲んで大丈夫？夜寝られる？"
"103090-350-ナギサ" = "い、いえこれは……"
"103090-351-セイア" = "……私にまだ予知夢の力が残っていれば、と考えていた。"
"103090-352-ナギサ" = "セイアさん……"
"103090-354-ミカ" = "へぇ、セイアちゃんも心配なんだね。"
"103090-355-ミカ" = "まぁ、私もそうだけど。"
"103090-356-ミカ" = "でも、こういうお話ってハッピーエンドになるものじゃん？#nだから――信じようよ。"
"103090-357-セイア" = "……ああ。私たちがこうして顔を合わせる事も、先生がいなければ不可能だった。"
"103090-358-セイア" = "だから……ミカの言う通り、信じる事としよう。"
"103090-359-ミカ" = "そうそう☆#n先生がいなかったら――"
"103090-363-ミカ" = "いや、今そういう事を考えるのはやめとこ。"
"103090-368-セイア" = "先生、そして皆――どうか、"
"103090-369-ナギサ" = "……どうか、ご武運を。"
"103090-370-ミカ" = "地上の安全は私たちが守るから、任せてね☆"
"103090-372-ミユ" = "わ、私たちはどうしましょう？"
"103090-373-ミヤコ" = "特に平時と変わりありません。#n先生が作戦を進行する間、私たちはD.U.を――"
"103090-374-ミヤコ" = "いえ、キヴォトスの安全を守るだけです。"
"103090-375-ミヤコ" = "「先生がいない間、キヴォトスの治安を維持すること」、それが私たちSRTの任務ですから。"
"103090-376-サキ" = "ああ。今でこそカイザーは姿を消したが、またいつ事態を引っ掻き回してくるか分からないしな。"
"103090-377-モエ" = "そうだね～#nそれに連邦生徒会も、なんとか現状を整理しようとあちこち走り回ってるみたいだし。"
"103090-378-モエ" = "……まぁ、あいつらのスピード感からして、先生が地上に帰ってきてからになりそうだけど？"
"103090-380-ミユ" = "うう……先生、無事だといいんだけど。"
"103090-381-サキ" = "そんなに心配しなくていいと思うぞ、ミユ。#n先生なら、どうせ何でもない顔で帰ってくるに決まってる。"
"103090-383-ミヤコ" = "……そうですね。先生は、なんだかそんな感じがします。"
"103090-384-モエ" = "くひひ……そうだね。たしかに、そういうイメージあるかも。 "
"103090-389-ミサキ" = "……敵の痕跡は見当たらなかったよ。"
"103090-394-サオリ" = "……。"
"103090-395-アツコ" = "サッちゃん、どうしたの？"
"103090-396-サオリ" = "……いや、何でもない。"
"103090-398-ミサキ" = "どうせ、私たちがトリニティと共闘するなんて……とか思ってたんじゃない？"
"103090-399-ヒヨリ" = "そ、そうですね……以前なら想像できないようなことが、立て続けに起こってるというか……"
"103090-400-ヒヨリ" = "生きる事が苦しいのは変わりませんが……なんというか…… "
"103090-401-アツコ" = "「明日」を待つように、なるよね。"
"103090-402-ヒヨリ" = "は、はい……それを、なんと表現したらいいのか、分からないですが…… "
"103090-403-ミサキ" = "……。"
"103090-405-サオリ" = "……感想を言うのは、すべてが終わってからでも遅くない。"
"103090-406-サオリ" = "「虚妄のサンクトゥム」の脅威は、まだ終わってないようだからな。"
"103090-409-ヒヨリ" = "は、はいっ……！"
"103090-410-ヒヨリ" = "そうですよね、人生は辛く苦しいものですからね、えへへっ……"
"103090-411-ミサキ" = "ま、主人公が活躍するためにも、私たちみたいなのが裏で頑張る必要があるわけだし。"
"103090-416-アツコ" = "……。 "
"103090-417-アツコ" = "……でも、こうしてみんなとまた一緒にいられて、嬉しい。 "
"103090-419-ヒヨリ" = "ひ……姫ちゃん……。"
"103090-420-ミサキ" = "……。"
"103090-426-アツコ" = "そして、いつかは―― "
"103090-427-サオリ" = "――ああ……そうだな。"
"103090-441-アユム" = "……リン先輩、いらっしゃいますか？ "
"103090-442-リン" = "……はい、どうしましたアユム。"
"103090-452-アユム" = "お休み中のところ申し訳ありません……"
"103090-453-アユム" = "至急確認していただきたいことがありまして……"
"103090-460-アユム" = "連邦生徒会の非常用通信網が先ほどからずっと鳴っていて……#nどうやら、リン先輩を探しているみたいで。"
"103090-461-リン" = "……通信網の復旧に成功したのですね。 "
"103090-465-リン" = "このコードは……"
