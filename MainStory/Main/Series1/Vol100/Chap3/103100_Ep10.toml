"103100-432-アユム" = "も、もう少しだけ耐えてください、先生。"
"103100-434-リン" = "これより、「アトラ・ハシースの箱舟」に向かって加速します。"
"103100-435-モモカ" = "うわっ、みんなしっかり掴まってね！#nマニュアル通りなら、尋常じゃない速度が出るはずだから！"
"103100-437-アヤネ" = "最大出力……加速します！！"
"103100-441-ユウカ" = "さあ、「オーパーツ」の性能とやらをチェックさせてもらうわよ。"
