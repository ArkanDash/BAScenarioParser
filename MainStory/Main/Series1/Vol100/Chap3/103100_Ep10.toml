[translation]
"103100-1" = "第10話;天上の遥か彼方へ"
"103100-12-ヒビキ" = "先生に、良いニュースがある。"
"103100-13-ヒビキ" = "なんと―― "
"103100-14-ヒビキ" = "オペレーターの衣装が、間に合ったよ。"
"103100-15" = "[s] \"おお……！？\""
"103100-31" = "[ns] \"これがオペレーターの衣装！！\""
"103100-33-ユウカ" = "えっと……これって、本当に必要なの？ "
"103100-34-ハナコ" = "うふふっ♡宇宙戦艦のオペレーターなら、ジャンルのルールは絶対、という強力な要請を受けまして……"
"103100-36-アコ" = "誰の要請ですか、それ。"
"103100-37-アヤネ" = "あの……これは宇宙戦艦ではない、という結論だった気がしますが……"
"103100-38-カヨコ" = "はぁ……なんで私まで……"
"103100-39-モモカ" = "まあまあ、運命を受け入れなって。#nこーんな分厚いマニュアルを覚えられて、かつ、この船に乗ってたのが運の尽きだよ。"
"103100-41-アユム" = "リン先輩……コート、お似合いです。"
"103100-45-リン" = "……なぜ、私だけデザインが違うのでしょうか。"
"103100-46" = "[s] \"そりゃあ、リンは[ruby=キャプテン]船長[/ruby]だからね！ロングコートじゃなきゃ！！\""
"103100-47-リン" = "はぁ……。"
"103100-48-アヤネ" = "あ、あはは……少しの間なら、この格好も悪くないと思います……"
"103100-49-ヒマリ" = "ふふ……さて、ここにいる方には多次元解釈を計算・検証する重要な役を担ってもらいます。"
"103100-50-ヒマリ" = "ちなみに、この衣装は着用者の脳波や脈拍など、身体のコンディションを記録し――更には、任務遂行に支障が出ないよう、サポートする機能も搭載しております。"
"103100-51-ヒマリ" = "他にも、防炎・防爆・防水などなど――様々な機能が盛りだくさんの、「オペレーター専用装備」だと思ってください♪"
"103100-53-アコ" = "……「余計な機能しかないリモコン」ではなく？"
"103100-54-カヨコ" = "これに防水機能を……？#n何か意味あるの？"
"103100-55-ハナコ" = "まあまあ♡私たちには時間が無いのですから、細かいことは気にしないで、本題に移りましょう。"
"103100-57-リン" = "……そうですね。 "
"103100-64-リン" = "今から私たちは「ウトナピシュティムの本船」に乗り、キヴォトスの上空75,000mにある「アトラ・ハシースの箱舟」に突入…… "
"103100-65-リン" = "箱舟を占領し、機能を無力化――そして、無事地上に戻らなくてはなりません。"
"103100-66-リン" = "それでは、点呼をとります――"
"103100-71-リン" = "オペレーター、[ruby=うらわ]浦和[/ruby]ハナコ、[ruby=あまう]天雨[/ruby]アコ。"
"103100-75-リン" = "オペレーター、[ruby=おくそら]奥空[/ruby]アヤネ、[ruby=はやせ]早瀬[/ruby]ユウカ。"
"103100-79-リン" = "オペレーター、[ruby=おにかた]鬼方[/ruby]カヨコ、[ruby=あけぼし]明星[/ruby]ヒマリ。"
"103100-83-リン" = "オペレーター、[ruby=ゆらき]由良木[/ruby]モモカ、[ruby=いわびつ]岩櫃[/ruby]アユム。"
"103100-87-リン" = "……そして私「ウトナピシュティムの本船」の統括責任者――[ruby=なながみ]七神[/ruby]リンです。"
"103100-88" = "[s] \"よろしくね、みんな。\""
"103100-89-リン" = "「ウトナピシュティムの本船」の発進後、地上で航空管制および技術支援を担当するのは――"
"103100-94-リン" = "ミレニアムサイエンススクールのヴェリタス、[ruby=おとせ]音瀬[/ruby]コタマ、[ruby=おまがり]小鈎[/ruby]ハレ。"
"103100-98-リン" = "[ruby=こぬり]小塗[/ruby]マキ、[ruby=かがみ]各務[/ruby]チヒロ。そして――"
"103100-102-リン" = "エンジニア部、[ruby=ねこづか]猫塚[/ruby]ヒビキ、[ruby=しらいし]白石[/ruby]ウタハ、[ruby=とよみ]豊見[/ruby]コトリ。"
"103100-104-リン" = "箱舟の突入後、襲撃に備え占領戦のサポートをするのは――"
"103100-109-リン" = "アビドス対策委員会の[ruby=たかなし]小鳥遊[/ruby]ホシノ、[ruby=くろみ]黒見[/ruby]セリカ、[ruby=いざよい]十六夜[/ruby]ノノミ。"
"103100-110-アヤネ" = "よ、よろしくお願いします……！ "
"103100-111-ホシノ" = "おっけ～任せなって。 "
"103100-112-セリカ" = "よし、準備は完璧！"
"103100-113-ノノミ" = "うんうん！みんなでシロコちゃんを助けに行きますよ☆"
"103100-115-リン" = "はい。対策委員会の皆さ[ruby=すなおおかみ]んは、砂狼シロコ[/ruby]の確保をするという事で、志願してくださりました。"
"103100-116-リン" = "……そして、"
"103100-123-リン" = "現在、この船唯一の武装であるレールガンの所有者、ゲーム開発部の[ruby=てんどう]天童[/ruby]アリス――"
"103100-131-リン" = "そして、[ruby=さいば]才羽[/ruby]モモイ、[ruby=さいば]才羽[/ruby]ミドリ、[ruby=はなおか]花岡[/ruby]ユズ……こちらの4名が、占領戦のサポートおよび、力を貸してくれるとのことです。"
"103100-132-ユズ" = "よ、よろしくお願いします……"
"103100-134-ユウカ" = "はぁ……しょうがない、私が面倒を見ればいいのね。"
"103100-135-ユウカ" = "……絶対に無茶は禁物よ。安全が最優先だからね、いい？ "
"103100-137-リン" = "そして最後に――"
"103100-138-モモカ" = "ん～？まだいるの？"
"103100-151-リン" = "皆さんの食事を担当する、ゲヘナ給食部の[ruby=あいきよ]愛清[/ruby]フウカと……美食研究会。"
"103100-152-フウカ" = "まってまって！なんか流れおかしくない！？"
"103100-154-ハルナ" = "うふふっ、皆さん、よろしくお願いしますね。"
"103100-155-フウカ" = "いや、なんで私がここにいるの！？"
"103100-156-フウカ" = "全然意味分かんない……宇宙戦艦って何！？"
"103100-157-フウカ" = "百歩譲って、料理を作るためっていうのは理解できるけど……#nそれなら、なんでジュリがいないのに美食研究会がいるのよ？ "
"103100-158-ハルナ" = "ふふっ……そんなの、当然でしょう？"
"103100-159-ハルナ" = "一生に一度、口にできるかどうかの料理を食べるチャンスが――目の前にあるからですわ。"
"103100-161-フウカ" = "一生に一度……？"
"103100-162-ハルナ" = "ええ。私たちが動く理由はいつだって同じ――"
"103100-163-ハルナ" = "美食を追求するためなのですから！"
"103100-164-ハルナ" = "――宇宙で口にする食事は、どれほど美味なのでしょうね？"
"103100-168-イズミ" = "そうだよ～！宇宙でご飯食べる機会なんて、もう二度とないかもしれないじゃん！"
"103100-169-ジュンコ" = "映画で観た空中に浮かんでる液体をストローで吸うヤツ、やってみたいのよね。"
"103100-171-アカリ" = "と～っても楽しみです★"
"103100-173-ハルナ" = "そう――宇宙食は、無重力状態を想定して作られる、特別な食べ物。 "
"103100-174-ハルナ" = "液体類の取り扱いはもちろん、調理が不可能な環境、食中毒防止のための殺菌過程など……気を配らなければならないことがたくさんある、奥深いジャンルです。"
"103100-175-ハルナ" = "であるが故に…… "
"103100-180-ハルナ" = "フウカさんが、ここにいるのです！！"
"103100-185-フウカ" = "だから、何で私――！？"
"103100-186-アカリ" = "もしもの時に備えて、給食部のトラックも乗せておきました★#nなので、フウカさんがいないとダメなんです。"
"103100-187-フウカ" = "えっ、給食部のトラックまで……！？いっ、いつの間に……！？"
"103100-188-ジュンコ" = "もっと自信持ちなさいよ。山、川……そして今度は宇宙でしょ？なかなかそんな体験できないわよ。"
"103100-189-イズミ" = "そうそう！こんな経験豊富なトラック見たことないよ！今度は無重力だよ！？"
"103100-190-フウカ" = "いや……そんな経験、いらないから……"
"103100-191" = "[s1] （…………）\n[s2] （無重力の高度までは行かないけど、それは内緒にしておこう……）"
"103100-196-リン" = "……先生、「ウトナピシュティムの本船」の起動に関してですが――#n本来はサンクトゥムタワーによって起動するのだと聞きました。"
"103100-197-リン" = "カイザーPMCがこの船を見つけた直後に、サンクトゥムタワーを掌握しようとした一連の流れも、その理由からでしょう。"
"103100-198-リン" = "サンクトゥムタワーが破壊された今、これを起動できるのは、#n「シッテムの箱」を所有している先生――あなただけです。"
"103100-199" = "[s] \"うん、任せて。\""
"103100-200-リン" = "はい……では、よろしくお願いします。"
"103100-202-アロナ" = "……はい。私の能力でこのオーパーツを起動する事は……可能です。"
"103100-203-アロナ" = "でも……これは、今までとは異なります。私は大丈夫でも…… "
"103100-204-アロナ" = "このオーパーツに宿っている力は……「シッテムの箱」の所有者である先生に、影響を及ぼします……"
"103100-205" = "[s] \"大丈夫だよ、アロナ。\""
"103100-206-アロナ" = "せ、先生の肉体は普通の人と変わりません……！#n銃弾1つで、危険な状況に陥るかもしれないんですよ！ "
"103100-207" = "[s] \"でも、いつもアロナが守ってくれたよね。\" "
"103100-208-アロナ" = "で、でも、これは……今までとは違うんです……"
"103100-212-アロナ" = "もう一度考え直してください、先生……#nどれだけの負担がかかるのか、私でさえ把握できていないんです……"
"103100-214-黒服" = "……その前に、一つ警告を。"
"103100-215-黒服" = "[USERNAME]先生の肉体は、これを使用した瞬間――#n取り返しのつかない被害に遭うでしょう。"
"103100-216-黒服" = "二度と、以前の状態に戻る事はできません。#n――死に至る事さえ、有り得るのです。 "
"103100-217-黒服" = "――それでも、よろしいのですか？"
"103100-218-黒服" = "その結末が、火を見るよりも明らかだとしても？"
"103100-223" = "[ns] \"大丈夫だよ、アロナ。よろしくね。\""
"103100-227-アロナ" = "ど、どうしてそこまで――"
"103100-229-黒服" = "……何故、そこまでするのですか？"
"103100-230-黒服" = "この破滅を逃れることなどできません――#nこれは、古より定まっていた事象……それが私の結論です。"
"103100-231-黒服" = "[ruby=すなおおかみ]そう、砂狼シロコ[/ruby]――彼女がこの世界に存在した瞬間から、決定された結末。"
"103100-232-黒服" = "時間は連続する事なく、決まりきった因果を繰り返すのみ―― "
"103100-233-黒服" = "我々――全ての存在は、そうした決定論の下にある布石でしかないのです。"
"103100-234-黒服" = "……。"
"103100-235-黒服" = "これを防ぎたいというのであれば――"
"103100-236-黒服" = "あなたは、過去に戻って彼女を殺すべきでした……クックックッ。"
"103100-240-黒服" = "あなたは、絶対に己を理解できないだろうと豪語しておりましたね……ええ。私は今もなお、あなたという存在を理解する事などできません。 "
"103100-241-黒服" = "何故、既に定められた運命を変えられると考えるのですか？#n何故、破滅を迎える未来にあえて突き進むのでしょうか？"
"103100-242-黒服" = "……今一度、お聞きします。 "
"103100-247-黒服" = "……何故？と。"
"103100-251" = "[ns] \"…………。\""
"103100-253" = "[ns3] \"大人として――子供を守り、先生として生徒を守るため。\"\n[ns4] \"大人の責任――先生の義務を、果たすためだよ。\""
"103100-257-黒服" = "それがどのような方法であろうと……"
"103100-258-黒服" = "いかなる代償を支払うことになろうと？"
"103100-259" = "[s5] \"そう。どんな方法だったとしても、\"\n[s6] \"いかなる代償を支払うことになったとしても。\""
"103100-262-黒服" = "……。 "
"103100-263-黒服" = "――生徒を、助けに行くのですね？[USERNAME]先生。"
"103100-268" = "[ns] \"そうだよ。\""
"103100-271-リン" = "……先生？"
"103100-275" = "[ns] \"リン、一つ聞きたいことがあるんだ。\""
"103100-276-リン" = "……？#nはい、どうぞ。"
"103100-277" = "[s] \"「二つ目の古則」についてなんだけど。\""
"103100-281-リン" = "「理解できないものを通じて、理解を得ることができるのか」――連邦生徒会長が言っていた、あの質問ですか……？……はい。覚えております。"
"103100-282" = "[s] \"……リンはその時、何と答えたの？\""
"103100-283-リン" = "なぜ、そのような質問を……"
"103100-284-リン" = "いえ……私はあの時、"
"103100-285-リン" = "……。"
"103100-290-？？？" = "……リンちゃん。"
"103100-295-連邦生徒会長" = "きっと私たちは、永遠にお互いを理解する事なんて、できないと思う。 "
"103100-296-連邦生徒会長" = "リンちゃんにとっての私は、きっと理解ができない不思議な存在――"
"103100-297-連邦生徒会長" = "そして、私たちはお互いが交わらないまま――別々の道を歩むしかないんだと思うの。"
"103100-298-連邦生徒会長" = "それがきっと――この世界の真意なんだ。"
"103100-300-連邦生徒会長" = "……でも、それでも構わない。"
"103100-301-連邦生徒会長" = "たとえ、理解できない存在だったとしても、"
"103100-302-連邦生徒会長" = "お互いにとって、相手が実体のない風のような……"
"103100-303-連邦生徒会長" = "隙間を通り過ぎていく――そんな存在だったとしても構わないの。"
"103100-305-連邦生徒会長" = "だからこそ……私は、リンちゃんが完成させてくれた文が好きなんだ。"
"103100-306-連邦生徒会長" = "だからね、その質問の答えは……私が大事にしまっておくね。"
"103100-307-連邦生徒会長" = "そう……私たちは、"
"103100-312-連邦生徒会長" = "「理解できない[ruby=もの]他人[/ruby]を通じて、[ruby=たがい]己[/ruby]の理解を得ることができるのか」"
"103100-319-リン" = "――その答えは、地上に戻ってからでも……よろしいでしょうか？"
"103100-320" = "[s] \"うん、それで十分だよ。ありがとう。\""
"103100-325" = "[ns] \"それじゃあ、出発しよっか。\""
"103100-333" = "[ns] ウトナピシュティムの起動装置にシッテムの箱を繋げる。"
"103100-339-アコ" = "メインパワーの起動を確認しました！"
"103100-348-アユム" = "メインコントロールシステムの稼働、完了……！！"
"103100-349-モモカ" = "各エリアの通信システム、演算システムのチェック、オールクリア――#nここまではマニュアル通り、ばっちりだね。"
"103100-358-カヨコ" = "エンジンシステム、クリア。"
"103100-359-ハナコ" = "多次元解釈システムのチェック、クリア。#nオールクリアです！ "
"103100-368-ユウカ" = "管制システムチェック、オールクリア……#nよし！これで全部使えるわよ！"
