"103100-370-リン" = "先生、発進の号令をお願いします……！"
"103100-371" = "[ns7] \"ウトナピシュティムの本船、発進！！\"\n[ns8] \"宇宙戦艦「ウトナピシュティム」、発進！！\""
"103100-381-アヤネ" = "これより「ウトナピシュティムの本船」――離陸します！！"
"103100-396-アヤネ" = "高度上昇……現在、780m！ "
"103100-397-ユウカ" = "多次元解釈システムの起動は今でいいのよね？"
"103100-399-ヒマリ" = "計算は終わりました。ハナコさん、お願いします。"
"103100-400-ハナコ" = "計算完了……多次元解釈システム、起動します！"
"103100-406" = "[ns9] \"…………！！！\"\n[ns10] （体に衝撃が伝わってくる……）"
"103100-409-リン" = "……先生？ "
"103100-410-アユム" = "せ、先生？顔色があまり良くありません。大丈夫ですか……？"
"103100-411-モモカ" = "あれ、震えてない……？#nどうしたの、先生……？"
"103100-412" = "[s] \"ちょっと乗り物酔いがね……\""
"103100-413-リン" = "……申し訳ありません、もう少しの辛抱です。 "
"103100-414-ハナコ" = "システムの正常動作を確認！ "
"103100-415-ハナコ" = "現在、私たちのウトナピシュティムの本船は、箱舟と同じ「確率的な存在」となりました。"
"103100-416-モモカ" = "えっと、どういうこと？"
