[translation]
"102060-1" = "第6話;第1サンクトゥム「アビドス砂漠」"
"102060-3-アヤネ" = "みなさん！作戦開始です！"
"102060-4-アヤネ" = "私たちはランデブーポイントに向かい――その後、第2部隊が砂漠横断鉄道に目標を誘導し合流。「守護者」までの道を確保します！"
"102060-5-マキ" = "さっきも言ったかもだけど、ビナーのレーザーには気を付けてね！"
"102060-9-ノノミ" = "はい、わかりました☆"
"102060-10-ホシノ" = "じゃ、出発しよっか～"
"102060-11-セリカ" = "やってやるんだから！"
"102060-13-カヨコ" = "こっちも始めよっか。準備はいい？"
"102060-14-ムツキ" = "おっけ～"
"102060-15-ハルカ" = "は、はいっ！"
"102060-16-アル" = "始めていいわよ、カヨコ。"
"102060-18-カヨコ" = "OK。じゃ、列車を動かすね。"
"102060-27-ハルカ" = "あ、ああっ！#nあ、あちらに何かが……！"
"102060-28-カヨコ" = "襲撃……！？"
"102060-29-ムツキ" = "へぇ～私たちを狙って来たの？やるじゃん♪"
"102060-33-アル" = "ふん、こんなものじゃ私たちは止められないわ。#n誤算だったってこと、教えてあげないとね。"
"102060-34-アル" = "さぁ、ハードボイルドに決めるわよ！"
