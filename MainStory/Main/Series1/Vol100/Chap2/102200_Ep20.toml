[translation]
"102200-1" = "第20話;最終防衛戦「シャーレ」"
"102200-8-アユム" = "第1から第5サンクトゥムまでの突入準備、できてます……！"
"102200-9-モモカ" = "全自治区の防衛戦も完了してるよ。#nおつかれ～"
"102200-11-リン" = "――全ての準備が整いましたね。"
"102200-15-リン" = "……っ！#n何事ですか！？"
"102200-16-モモカ" = "えーっと……"
"102200-20-モモカ" = "……うえぇっ！？"
"102200-21-アユム" = "ど、どうしたんですかモモカちゃん……！？"
"102200-28-モモカ" = "しゅ、襲撃！！シャーレ周辺に敵襲！#nい、いつの間にこんな……！"
"102200-57-カンナ" = "正門の防衛は私たちが担当しよう。"
"102200-58-カンナ" = "後門は余力のある者に頼みたい。"
"102200-60-スケバン" = "クックックッ……ちょうど暇してたんだよなぁ。"
"102200-61-スケバン" = "後門側の防衛はあたしらが引き受けた！"
"102200-62-スケバン" = "こわーいお姉さんたちの力を見せてやるぜ！#nクックックックッ！"
"102200-63-スケバン" = "うし、行くぞ！"
"102200-64-スケバン" = "ダテにツッパってねぇんだよこちとらよぉ！！"
"102200-66-ラブ" = "ヘルメット団、全員集合！！"
"102200-75-ラブ" = "ま、そういうこと。#nヘルメット団幹部――[ruby=こまかぜ]河駒風[/ruby]ラブ、助太刀しようじゃないの！！"
"102200-76-ラブ" = "ほら、シャーレを守るんだよ！全員突撃！！"
"102200-81-？？？" = "うふふふふ……♡"
"102200-87-ワカモ" = "なんと不憫なあなた様……ですがご安心を。#nこのワカモにお任せください。"
"102200-88-ワカモ" = "果ての果てまで、あなた様をお守りいたしましょう。"
"102200-92-ワカモ" = "うふふっ……では、始めましょうか？"
