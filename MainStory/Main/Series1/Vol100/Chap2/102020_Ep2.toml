[translation]
"102020-1" = "第2話;作戦会議"
"102020-4-？？？" = "はぁ……はぁ……。"
"102020-5-ホシノ" = "いやぁ、ちょっと乱暴だったかなぁ……。"
"102020-7" = "アビドス高等学校の駐輪場"
"102020-8-ノノミ" = "ホシノ先輩……"
"102020-9-ホシノ" = "でも、下手に加減したらこっちがやられる可能性だってあったからねぇ～#nこの子、かなり強かったし。"
"102020-10-？？？" = "……。"
"102020-11-ホシノ" = "でもおかしいなぁ。こんな子がいたなんて……おじさん全然知らなかったよ。"
"102020-12-ホシノ" = "お名前は？"
"102020-13-？？？" = "……シロコ[ruby=すなおおかみ]。砂狼シ[/ruby]ロコ。"
"102020-14-ホシノ" = "へぇ……シロコちゃんっていうんだ。#nそれで、シロコちゃんはここで何をしてたんだい？"
"102020-15-シロコ" = "……。"
"102020-16-ホシノ" = "ここさ、廃墟に見えるけど……一応アビドス分校――#nいや、アビドス本校なんだよ。"
"102020-17-ノノミ" = "その制服……初めて見ました。"
"102020-18-ホシノ" = "ね。それに、そんな薄着じゃ寒いよ。"
"102020-20-ホシノ" = "えっと、シロコちゃんはどこの学園？"
"102020-21-シロコ" = "……分からない。"
"102020-22-ノノミ" = "……？"
"102020-23-シロコ" = "気づいたら、ここにいた。#n名前以外……分からない……"
"102020-24-ホシノ" = "そ、それって……もしかして記憶喪失！？#n最近流行ってるっていうアレ？おじさん、そういうのちょっと疎いんだよな～"
"102020-25-ノノミ" = "では……シロコちゃんは、名前以外何も分からない、と……？#n通っている学園も、電話番号も、メールアドレスも……？"
"102020-26-シロコ" = "（こくり）"
"102020-28-ノノミ" = "……。"
"102020-29-ホシノ" = "……。"
"102020-30-ノノミ" = "ほ、ホシノ先輩、どうしましょう？"
"102020-31-ホシノ" = "ん～困ったねぇ。"
"102020-33-ホシノ" = "とりあえず……なか入ろっか、シロコちゃん。"
"102020-34-ノノミ" = "えっ！？い、一緒に行くんですか？"
"102020-36-ホシノ" = "これ、巻いておきな～"
"102020-39-シロコ" = "マフラー……？"
"102020-40-ホシノ" = "うん。無いよりはいいかなって。"
"102020-41-ホシノ" = "どう？ちょっとはマシになったでしょ？"
"102020-42-シロコ" = "……うん。"
"102020-44-シロコ" = "あったかい。"
"102020-47-ノノミ" = "先輩…… "
"102020-48-ホシノ" = "シロコちゃんを探そう。#n――嫌な予感がする。"
"102020-49-ノノミ" = "ですが……"
"102020-50-ホシノ" = "おじさん、ちょっとシャーレの呼び出しはパスするね。#nノノミちゃんは先に行ってて。"
"102020-51-ノノミ" = "……シロコちゃんがどこにいるのか、まだ分かっていませんよね。#n先輩一人で、一体どうやって探すんですか？"
"102020-52-ホシノ" = "……。"
"102020-53-ノノミ" = "彼女の時とは違うんですよ？#nシロコちゃんは遭難したわけじゃないんです。"
"102020-54-ホシノ" = "――同じだよ。"
"102020-56-ノノミ" = "今は――違いますよ。"
"102020-57-ホシノ" = "……！！"
"102020-65-セリカ" = "いた！先輩たち、ここで何してるのよ！！"
"102020-66-アヤネ" = "ホシノ先輩……一緒に、先生に会いに行きましょう。"
"102020-67-ホシノ" = "……みんな。"
"102020-68-アヤネ" = "先生が、きっと助けてくれますから。"
"102020-70-ノノミ" = "……ホシノ先輩。"
"102020-71-ホシノ" = "……。"
"102020-72-ホシノ" = "……そうだね。 "
"102020-73-ホシノ" = "先生が、助けてくれるよね……きっと……いつもみたいに。"
"102020-74-ホシノ" = "だから、大丈夫だよね……そうだよね……？"
"102020-78-セリカ" = "……。"
"102020-79-アヤネ" = "……。"
"102020-83-ノノミ" = "……はい、きっと大丈夫です！"
"102020-87-リン" = "……。"
"102020-88-アユム" = "各自治区から、続々と生徒が集まってきて……まもなくこちらに到着する予定です……。"
"102020-89-リン" = "……。"
"102020-90-モモカ" = "……先輩さぁ、連邦生徒会じゃなくてシャーレに居て大丈夫なの～？"
"102020-91-リン" = "……サンクトゥムタワーが破壊され、代行である私は不信任状態ですから。 "
"102020-92-リン" = "連邦生徒会は瓦解したも同然。#n他の室長を招集したところで、動いてくれるとは到底思えません。"
"102020-93-リン" = "今は、「シャーレ」が唯一の希望なのです。"
"102020-94-モモカ" = "……そう。#n分かったけどさぁ……後片付けが大変かもよ。 "
"102020-96-リン" = "……そうですね。"
"102020-97-リン" = "ですが……それは、この件が全て解決してから考える事です。"
"102020-98-リン" = "モモカ、アユム。その時まで、よろしくお願いしますね。"
"102020-99-アユム" = "は、はい……！こ、こちらこそ……"
"102020-100-モモカ" = "う、なんかこれ、余計な事に首突っ込んじゃったような……。 "
"102020-101-モモカ" = "ま、でもリン先輩がそう言うのなら、ついていくよ。どこまでも、ね。"
"102020-105-カヨコ" = "……。"
"102020-107-モモカ" = "ん、誰？"
"102020-109-リン" = "……[ruby=おにかた]鬼方[/ruby]カヨコさん。"
"102020-110-カヨコ" = "一番乗りか……まあ、いいけど。"
"102020-111-カヨコ" = "先に言っとくけど……私は専門家じゃないし、あまり役に立てないと思う。"
"102020-112-リン" = "……あなたを呼んだのは、連邦生徒会ではなくシャーレの先生です。"
"102020-113-カヨコ" = "知ってる。だから来た。"
"102020-121-ユウカ" = "来たわよ、代行！これは私たちの方で現状を分析したレポート。#n大した量じゃないけど――"
"102020-122-アコ" = "ゲヘナ風紀委員会所属、[ruby=あまう]天雨[/ruby]アコです。#nシャーレの要請に応じるべく、ただいま到着しました。"
"102020-124-リン" = "ユウカさん、アコさん。"
"102020-125-アコ" = "ところで、先生はどちらに？ "
"102020-126-リン" = "先生は現在、D.U.を守るべく席を外しております。#nまもなく帰還されるかと。"
"102020-127-カヨコ" = "いま忙しいんだ、先生……"
"102020-128-アコ" = "って、先生はカヨコさんまで呼んでいたんですか……！？"
"102020-129-カヨコ" = "……まあ、そういうこと。"
"102020-130-アコ" = "はぁ……"
"102020-135-ハナコ" = "なるほど……この方々と手と手を取り合う事になるのですね♡"
"102020-136-ユウカ" = "ん……？[ruby=うらわ]浦和[/ruby]ハナコ……？"
"102020-137-ハナコ" = "ふふっ、お久しぶりですユウカさん。"
"102020-138-アヤネ" = "アビドス高等学校代表、[ruby=おくそら]奥空[/ruby]アヤネです。#n先生の要請を受け、ただいまシャーレに到着しました！"
"102020-139-ハナコ" = "あら、奥空さん……"
"102020-140-アヤネ" = "あっ、あはは……ハナコさんもいらしたんですね……お元気でしたか？#n……その、"
"102020-141-ハナコ" = "ええ、アヤネさん――事情は伺っております。"
"102020-142-ハナコ" = "必ず、シロコさんを見つけ出しましょう。私も微力ながらお力添えします。"
"102020-143-アヤネ" = "はい……ありがとうございます。"
"102020-144-アヤネ" = "悲しんでいるだけでは、何も変わらないですから……#n今は、とにかく行動しなくちゃ……"
"102020-145-ハナコ" = "……そうですね。私のお友達も、似たようなお話をよくしていました。"
"102020-146-ハナコ" = "アヤネさんは、強い方ですね……私よりも、ずっと。"
"102020-147-アヤネ" = "……い、いえ。#nその……私は……"
"102020-148-ハナコ" = "もっと自信を持ってください。大丈夫、あなたは強い方です。"
"102020-149-アヤネ" = "……。"
"102020-154-モモカ" = "えーっと、先生は今、D.U.全域に出現した正体不明の兵を相手に交戦中だよ。"
"102020-155-モモカ" = "そろそろ片付くみたい。一旦、こっちに戻ってくるって～"
"102020-157-リン" = "分かりました。先生が到着次第、すぐに会議室へ向かいましょう。"
"102020-179-リン" = "皆様お手元の資料をご覧ください。#nこちらが作戦計画書となります。"
"102020-180-アヤネ" = "これほどの資料を、いつの間に……"
"102020-181-ハナコ" = "ご自身も大変だったでしょうに……本当にお疲れ様でした、リン行政官。"
"102020-182-リン" = "今はリンで大丈夫です。#n行政官としての権限は停止されておりますので。"
"102020-183-ハナコ" = "ああ、そうでしたね……失礼しました。"
"102020-184-アコ" = "連邦生徒会長代行の権限は停止され、例の塔によってサンクトゥムタワーは倒壊――そして、今動けるのはシャーレだけ。"
"102020-185-アコ" = "なるほど……。"
"102020-186-ユウカ" = "連邦生徒会はサンクトゥムタワーに頼りすぎなんじゃないの？"
"102020-187-ユウカ" = "……ノア、今から報告書を送るから確認しておいてちょうだい。あと――"
"102020-188-アヤネ" = "わ、私たち対策委員会が入手した情報と相違ないか、確認します！"
"102020-196-リン" = "結論から申し上げますと、あの塔を2週間以内に破壊しなくてはなりません。"
"102020-197-カヨコ" = "……。"
"102020-198-リン" = "現在、キヴォトスに出現した6つの塔。#nそれらを今から「虚妄のサンクトゥム」と命名します。"
"102020-199-ユウカ" = "えーっと、つまり。あれは偽物のサンクトゥムタワーって事？#nまぁ、それならこの空の色も超高濃度エネルギー体のことも納得がいくけど……。"
"102020-201-アヤネ" = "これを……2週間以内に破壊する、と……？"
"102020-202-リン" = "はい、そうです。"
"102020-204-ハナコ" = "こちらは、セイアちゃん……いえ、ティーパーティーとシスターフッドが協力し、#n古書館から発見したデータです。"
"102020-205-ハナコ" = "今まで、ティーパーティーとシスターフッドが力を合わせるだなんて、想像すらできなかったのですが……これも先生のお陰ですね。"
"102020-207-セイア" = "此れは預言ではなく――私自身が体験したものであるがゆえに、断言しよう。"
"102020-208-セイア" = "今起きている忌まわしい変化――其れは、「色彩」と呼ばれる存在が我々の世界に足を踏み入れたが故に引き起こされた現象だ。"
"102020-210-サクラコ" = "――「色彩」に関しては、シスターフッドが所有している古書にも記録があります。"
"102020-211-サクラコ" = "あれは――人々を「狂気」に陥れる光です。"
"102020-213-ユウカ" = "「色彩」……？#n狂気に、陥る……？いったい何の話？"
"102020-214-ノア" = "ユウカちゃん、信じ難いのは分かりますが……#nこれらは全て事実です。"
"102020-215-ユウカ" = "ノア？"
"102020-216-ノア" = "今、エンジニア部が例のタワーを分析してくれていまして……#nそこから人の精神を錯乱させる信号を感知しました。"
"102020-218-ウタハ" = "どうやら、この光に触れると、人格と意識に変化が起こるようだね。#n一種の精神攻撃のようだけど――"
"102020-219-ウタハ" = "だが、説明できない事が多すぎる。もっとデータがないと……"
"102020-220-ヒビキ" = "うん。私たちの持ってる装置では、信頼度は10%未満。#nあくまで仮説でしかない。"
"102020-221-ウタハ" = "それで、ヴェリタスにデータ解析をお願いしたんだ。#n――でも、これでもまだ足りない。"
"102020-222-コトリ" = "こういう時こそ、別の観点からも解析すべきです！#nというわけで、トリニティ古書館の本を持ってきました！どこに置きましょう？"
"102020-223-コトリ" = "あ、そうです！このままでは読みづらいですし、全部バラしてスキャンしちゃいますか？電子化すれば持ち運びやすいですし、検索性も――"
"102020-224-ヒビキ" = "借り物なんだからそれはダメ。#nそれに、そんな事したらトリニティの図書委員長に殺されるよ……"
"102020-226-チヒロ" = "これはまだ仮説の段階だけど――あの塔から感じるエネルギー……"
"102020-227-チヒロ" = "このままいけば、約300時間後に臨界点に到達するよ。"
"102020-228-チヒロ" = "放っておいたら――最終的にはキヴォトス全域にアレが広がるだろうね。"
"102020-229-ハレ" = "カフェインが……足りない……"
"102020-230-コタマ" = "妖怪MAX、あと10箱くらい注文しますか？"
"102020-232-セイア" = "これは――以前、私が先生に告げた予知夢そのものだ。"
"102020-233-セイア" = "天から巨大な塔が飛来し、虚空が緋色に染められ――"
"102020-234-セイア" = "不吉な塔は、まるで悲鳴を上げるように鳴動し……この世界を少しずつ削りとって……そうして、世界の破片を「何か」に被せていった。"
"102020-236-カヨコ" = "（終末の預言……？）"
"102020-237-カヨコ" = "（そっか……そう……#n　まあ、トリニティにもありそうだよね）"
"102020-238-アコ" = "……。 "
"102020-239-ハナコ" = "約300時間――つまり、2週間後に「色彩」がキヴォトス全域に広がるのだとしたら、早期決戦をしなければなりませんね。"
"102020-241-セイア" = "削られた世界の欠片が嵐のように吹き荒れる中で、黒い光が天から舞い降りて……世界が終焉に傾いていく……。 "
"102020-242-セイア" = "そうして……キヴォトスのすべてが崩壊し―― "
"102020-244-セイア" = "塵一つ残さずに、すべてが虚無へと消える。"
"102020-246" = "[ns] \"それと、「色彩」に触れてしまった人を元に戻す方法も探さなきゃね。\""
"102020-248-セイア" = "……。 "
"102020-253-セイア" = "……そうだな。"
"102020-254-セイア" = "私が口にできる事は殆ど無い……然し、或いは彼女なら――"
"102020-255-セイア" = "百鬼夜行の大預言者、クズノハ。#n――彼女を探すべきかもしれない。"
"102020-256-ニヤ" = "にゃはは～、クズノハ、ですか？"
"102020-257-セイア" = "……。"
"102020-259-ニヤ" = "いやぁ～ここでその名を聞くとは思わなかったというか。"
"102020-260-ニヤ" = "ふむ……おおよそ状況は理解できました。#nカホが「連邦生徒会が、クズノハの事で話があるそうです」と言っていたのは、このことだったんですね。ふむむ……。"
"102020-261-ニヤ" = "まあ、こちらは後ほど、二人で話しましょ、先生♪"
"102020-262-ニヤ" = "ちょ～っと込み入った事情があるのですが……#nなにやら重要そうですし……ま、なんとかしてみましょう。"
"102020-264" = "[ns] \"ありがとう、ニヤ。\""
"102020-265-ニヤ" = "にゃはは、ではでは～"
"102020-269-リン" = "まとめますと、「虚妄のサンクトゥム」はこのままでは約2週間後に臨界点到達の見込みとなります。"
"102020-270-カヨコ" = "そうなったら…… "
"102020-271-ハナコ" = "世界は終焉を迎える……すべてが終わりですね。"
"102020-273-アコ" = "それを防ぐために、「虚妄のサンクトゥム」を破壊する……"
"102020-274-アコ" = "まぁなんとも、シンプルな話ですね。"
"102020-275-ユウカ" = "そう――[ruby=・]2[/ruby][ruby=・   ・   ・   ・   ・]週間以内に[/ruby]、ね。"
"102020-276-リン" = "――「虚妄のサンクトゥム」は、計6か所存在します。"
"102020-277-リン" = "アビドス砂漠、D.U.近郊の遊園地、ミレニアム郊外の閉鎖地域、トリニティとゲヘナの境界付近、ミレニアム近郊の新しい都市――そして、D.U.の中心地点。"
"102020-278-アユム" = "この中ですと、D.U.のエネルギー体が一番大きいので、#nまずは他の5つを破壊してからD.U.の塔を処理した方が良いかと……"
"102020-279-ヒマリ" = "でしたら良かったのですが――そう簡単なお話でもないみたいですよ。"
"102020-281-ユウカ" = "ヒマリ先輩……！？ "
"102020-282-ヒマリ" = "ふふふっ、ええ――#nミレニアムの超天才病弱美少女ハッカー、満を持しての登場です♪"
"102020-283-アコ" = "……天才？"
"102020-284-ハナコ" = "病弱美少女……？"
"102020-286-ヒマリ" = "私たちは、ビッグシスターが残したデータを利用して「虚妄のサンクトゥム」にアクセスを試みたのですが……"
"102020-287-ヒマリ" = "「虚妄のサンクトゥム」を防衛している存在に阻まれました。#n――通常の戦力では到底太刀打ちできないようなものに。"
"102020-288-エイミ" = "トキ、データ収集はもう大丈夫。無理せず撤収して。"
"102020-290-トキ" = "ぐっ……！ですが……"
"102020-298-ヒマリ" = "そして、面白いことに――"
"102020-299-ヒマリ" = "「虚妄のサンクトゥム」を守っている存在――あれらは今までキヴォトスに出現した、奇怪な現象の全てが凝縮されているのです。"
"102020-300-ヒマリ" = "デカグラマトンの預言者、トリニティの[ruby=ミメシス]複製[/ruby]、そして先日ミレニアムの廃墟で観測された「Divi:Sion」――"
"102020-301-ヒマリ" = "そう――"
"102020-303" = "アビドス砂漠"
"102020-305-ヒマリ" = "デカグラマトン3番目の預言者――「ビナー」。"
"102020-307" = "D.U.近郊の廃墟化した遊園地"
"102020-310-ヒマリ" = "スランピアに[ruby=ミメシス]複製[/ruby]されたアミューズドール――「シロ&クロ」。"
"102020-312" = "トリニティとゲヘナの境界付近"
"102020-314-ヒマリ" = "「聖徒の交わり」――「ヒエロニムス」。"
"102020-316" = "ミレニアム郊外の閉鎖地域"
"102020-318-ヒマリ" = "デカグラマトン4番目の預言者――「ケセド」。"
"102020-320" = "ミレニアム近郊の都市"
"102020-324-ヒマリ" = "デカグラマトン8番目の預言者――「ホド」……"
"102020-326" = "[ns] \"なるほど……そういう事なんだね。\""
"102020-327-ヒマリ" = "……先生は、彼らをご存知なのですね。"
