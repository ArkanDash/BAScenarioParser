[translation]
"102180-1" = "第18話;大雪原の中で"
"102180-10-イズナ" = "う、うわぁっ！部長！こっちも塞がれてしまいました！"
"102180-11-ミチル" = "うっ、一体どうなってるの……大雪原は比較的安全だって聞いてたのに……"
"102180-12-ミチル" = "敵がこんなにいるなんて聞いてないよー！"
"102180-13-ツクヨ" = "ま、まさか……私たちの後をつけて来たのでしょうか……？"
"102180-14-イズナ" = "イズナたちをですか！？#nどうやって特別任務のことを――"
"102180-15-ミチル" = "いや、この任務の事は誰にも言ってないし、そもそもそんな時間もなかったよ！"
"102180-17-マコト" = "……キキキッ。"
"102180-25-イズナ" = "こ、こっちも……！囲まれてしまいました！#nど、どうしましょう、部長？"
"102180-26-ツクヨ" = "こ、このままじゃ、私たち……"
"102180-27-ミチル" = "だぁーっ！弱音を吐くんじゃない！！"
"102180-28-ツクヨ" = "部長……"
"102180-30-イズナ" = "部長……！"
"102180-31-ミチル" = "先生が、私たち忍術研究部を信じて任せてくれた任務だよ！#nこの程度のトラブルで失敗するわけにはいかないの！"
"102180-32-ミチル" = "そう――「忍者とは、一度交わした約束は必ず守るもの」！"
"102180-33-ミチル" = "ツクヨ、イズナ！「忍者」の絆を、見せつけるよ！"
"102180-34-ツクヨ" = "……絆の力、ですね！はいっ、部長！"
"102180-35-イズナ" = "はい！イズナも主殿との約束、必ず守ってみせます！"
"102180-36-ミチル" = "よし、いっくよー！！"
"102180-41-ミチル" = "ミチル流忍法っ！！"
"102180-42-イズナ" = "イズナ流忍法！"
"102180-43-ツクヨ" = "つ、ツクヨ流、忍法……！"
"102180-50-マコト" = "今だ、いくぞ！！"
"102180-51-マコト" = "「超無敵鉄甲「[ruby=とらまる]虎丸[/ruby]」」！！"
"102180-52-マコト" = "降下！！！"
"102180-53-イロハ" = "そのネーミングはもうちょっとなんとか……はぁ……"
"102180-54-イロハ" = "はい、降下しますね。"
"102180-68-ツクヨ" = "……？#nあ、あれ……？"
"102180-69-ミチル" = "この音は……"
"102180-71-イズナ" = "部長、ツクヨ殿！！#n上を見てください、飛行船です！"
"102180-72-ミチル" = "な、何あれ！？何かが降ってきてる！？"
"102180-80-ミチル" = "なっ、何……"
"102180-81-イズナ" = "こ、これは……！"
"102180-82-ツクヨ" = "戦車が……！？#n降って、きました……！"
"102180-91-マコト" = "キキキッ！バッチリのタイミングだったぞ、イロハ！"
"102180-92-イブキ" = "あははっ！すっご～い！降下～！"
"102180-93-イロハ" = "……ああ、はい。#nところで先輩、何でここに来たんですか？"
"102180-94-マコト" = "知らないのか？危機に瀕した仲間を助けるために決まってるだろう！"
"102180-95-イロハ" = "……はい？"
"102180-96-マコト" = "ああ、そうだ！正義の味方になるためだとも！！#nイブキが愛してやまない忍者のためにな！！"
"102180-97-イブキ" = "こんにちは、忍者のおねえちゃんたち！#nイブキが助けに来たよ～！！"
"102180-99-イズナ" = "あっ、あの声は……！"
"102180-100-ミチル" = "い、イブキ……！？"
"102180-101-ツクヨ" = "イロハさん、まで……どうして、ここに……？"
"102180-103-マコト" = "キキキッ……このマコト様の情報網を甘く見てもらっては困る。#n危険な任務に忍者があたるという情報を掴んでいたのだ！"
"102180-104-マコト" = "イブキの愛する忍者たちが怪我でもしたら、イブキが悲しむことは目に見えている。"
"102180-105-マコト" = "だから上空で見守りつつ、危機一髪の瞬間を狙っていたのだ！"
"102180-106-イロハ" = "……はぁ。"
"102180-107-イロハ" = "じゃあ、ここに来たのも……イブキのために？"
"102180-108-マコト" = "ああ、そうだとも！！イブキの好感度を上げるための絶好のチャンスを、みすみす逃すわけがあるまい！！"
"102180-109-マコト" = "前回のプリン事件以降、イブキが目も合わせてくれないのだからな！"
"102180-110-イロハ" = "……イブキが大事に取っておいたプリンを食べるからでしょ。"
"102180-111-マコト" = "お前のプリンだと思っていたのだ！"
"102180-112-イロハ" = "私のプリンでも良くないですよ……？"
"102180-113-イブキ" = "あの時のマコト先輩は嫌いだったけど、もう大丈夫！マコト先輩だーい好き！！"
"102180-114-マコト" = "キャハハハハハハハッ――！！聞いたかイロハ？#n分かったら今すぐあの忍者たちを助けろ！！"
"102180-118-マコト" = "超無敵鉄甲「[ruby=とらまる]虎丸[/ruby]」！！"
"102180-120-イロハ" = "はぁ、分かりましたよ……出撃。"
"102180-121-イブキ" = "おねえちゃんたち！イブキが助けるからね！"
"102180-123-ツクヨ" = "た、助けに、来てくれたのですね！ありがとう、ございます！"
"102180-124-ミチル" = "それじゃ！行くよ！"
"102180-125-イズナ" = "はい！！"
