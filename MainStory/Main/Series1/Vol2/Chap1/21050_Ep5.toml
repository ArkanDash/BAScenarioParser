[translation]
"21050-1" = "第5話;私はアリスです"
"21050-2" = "ミレニアム・ゲーム開発部"
"21050-4-ミドリ" = "うーん、やっぱり心配……。"
"21050-5-ミドリ" = "この子をうちの部員に偽装するなんて……本当に大丈夫？"
"21050-6-アリス" = "「大丈夫」の意味を確認……「状態が悪くなく問題が発生していない状況」のことと推定、肯定します。"
"21050-7-ミドリ" = "……いやいや、肯定できないって！この口調じゃ絶対疑われるよ！"
"21050-8-ミドリ" = "やめておこう！？これは無理だって！"
"21050-10-モモイ" = "今やめるって選択肢の方が無理だよ。何としても、私たちのゲーム開発部を守らなきゃ。"
"21050-11-モモイ" = "そうしないと、ユズの居場所が……寮に戻るわけにはいかないし……。"
"21050-12-ミドリ" = "……。"
"21050-13-ミドリ" = "そう、だったね……。"
"21050-16-モモイ" = "服装もある程度整ったし、あとは武器と……学生登録をして、学生証を手に入れないと。"
"21050-17-モモイ" = "学生証については、私の方で何とかするから。"
"21050-18-モモイ" = "ミドリはユズと二人で、アリスに「話し方」を教えてあげて。"
"21050-19-ミドリ" = "は、話し方？"
"21050-20-モモイ" = "今のままだとミドリが言った通り、疑われちゃうかもしれないから。"
"21050-21-モモイ" = "ただでさえ「友達もいないあなたたちに、新しい部員の募集なんて出来るはずないでしょ」って言われてるし……。"
"21050-22-モモイ" = "もし、何かの拍子にユウカに「本当にゲーム開発部なのか」って聞かれたとして……"
"21050-25-モモイ" = "「肯定、あなたの質問に対し、アリスの回答を提示。私はゲーム開発部の部員」"
"21050-26-モモイ" = "……なんて言っちゃった暁には、全部台無しになりかねない。"
"21050-27-ミドリ" = "いや、それはそうだけど……。"
"21050-28-ミドリ" = "はぁ……。"
"21050-29-ミドリ" = "仕方ない、やれるだけやってみるよ。"
"21050-30-モモイ" = "よし、じゃあ任せた！"
"21050-33-ミドリ" = "ちょ、ちょっと待って！"
"21050-34-ミドリ" = "うーーん……。"
"21050-36-アリス" = "？？？"
"21050-37-ミドリ" = "え、えっと……アリス、ちゃん？"
"21050-38-アリス" = "肯定。本機の名称、アリスです。"
"21050-39-ミドリ" = "うん、じゃあアリスちゃんって呼ぶね。それにしても話し方かあ……よく考えると、どうやって習得するんだろ。普通は動画を見たり、周りの言葉を真似していくうちに自然に、って感じだと思うけど。"
"21050-40-ミドリ" = "……うーん。子供用の教育プログラムって、インターネットに落ちてるかな……。"
"21050-43-アリス" = "（キョロキョロ）"
"21050-44-アリス" = "？"
"21050-45-アリス" = "正体不明の物を発見、確認を行います。"
"21050-46-ミドリ" = "ん？"
"21050-47-ミドリ" = "あっ、そ、それは……っ！？"
"21050-51-ミドリ" = "えっと……ちょっと恥ずかしいけど、実はその中に、私たちが作ったゲームが載ってるの。まあ、すごい酷評されちゃったんだけどね。"
"21050-52-ミドリ" = "あ、そうだ！"
"21050-53-ミドリ" = "クソゲーランキングでは1位になっちゃったし、アリスちゃんがどう思うかは分からないけど……"
"21050-54-ミドリ" = "アリスちゃん、私たちのゲーム……やってみない？"
"21050-55-ミドリ" = "「会話」をしながら進められるから、ゲームをやってみるのも勉強になるかも。"
"21050-56-アリス" = "……？"
"21050-57-アリス" = "ここまでの言動の意図、完璧には把握しかねます。しかし……"
"21050-58-アリス" = "……肯定、アリスはゲームをします。"
"21050-59-ミドリ" = "ほ、本当に！？ちょ、ちょっと待ってて、すぐにセッティングするから！"
"21050-62-ミドリ" = "よし、準備完了！"
"21050-63-アリス" = "……。"
"21050-66-アリス" = "アリス、ゲームを開始します……"
"21050-68-ミドリ" = "タイトルから分かるかもしれないけど、このゲームは童話テイストで、色彩豊かな王道ファンタジーRPGなの。"
"21050-69" = "[56cd7b]コスモス世紀2354年、人類は劫火の炎に包まれた……"
"21050-71-アリス" = "……？"
"21050-72-ミドリ" = "えっと、王道とは言っても、色々な要素を混ぜてたりするんだけどね。トレンドそのままでもダメだけど、王道に拘りすぎても古くなるからってことで。"
"21050-73-アリス" = "……。"
"21050-74-アリス" = "ボタンを押します……"
"21050-75" = "[56cd7b]チュートリアルを開始します。"
"21050-77" = "[56cd7b]まずはBボタンを押して、目の前の武器を装着してみてください。"
"21050-79-アリス" = "Bボタン……"
"21050-82" = "（ドカーーーーン！！）"
"21050-83-アリス" = "？？？"
"21050-84" = "[FF6666]＜GAME OVER＞"
"21050-86-アリス" = "！？！？"
"21050-87-モモイ" = "あははははっ！"
"21050-89-モモイ" = "予想できる展開ほどつまらないものはないよね！本当はここで指示通りじゃなくて、Aボタンを押さなきゃいけないの！"
"21050-90-ミドリ" = "お姉ちゃん……？学生証を作りに行くって言ってなかった？"
"21050-91-モモイ" = "行ってきたんだけど、遅い時間だったからか誰もいなかったの。また明日行く。"
"21050-92-ミドリ" = "それはさておき、あらためて見てもこの部分はちょっと酷いと思う。"
"21050-95-アリス" = "……。"
"21050-96-アリス" = "も、もう一度始めます……。"
"21050-97-アリス" = "再開……テキストでは説明不可能な感情が発生しています。"
"21050-98-モモイ" = "あっ、私それ分かるかも！きっと「興味」とか「期待」とか、そういう感情だと思う！"
"21050-99-ミドリ" = "どう考えても「怒り」か「困惑」だと思うけど……。"
"21050-101" = "[56cd7b]武器を装備しました。"
"21050-103-アリス" = "装備完了……。"
"21050-104-モモイ" = "お、良い感じ。そのまま進めば、RPGの花である戦闘が……"
"21050-105" = "[FF6666]エンカウントが発生しました！"
"21050-107-アリス" = "！？"
"21050-108" = "[56cd7b]野生のプニプニが現れた！"
"21050-110-アリス" = "緊張、高揚、興味。"
"21050-111-モモイ" = "Aボタンを押して！今度は嘘じゃないから！"
"21050-112-アリス" = "Aボタン……「秘剣つばめ返し：敵に対して2回攻撃をする」"
"21050-113-アリス" = "行きます、プニプニに対して……"
"21050-114-アリス" = "秘剣！つばめ――"
"21050-115" = "[56cd7b]ッダーン！"
"21050-117" = "[56cd7b]攻撃が命中、 即死しました"
"21050-120" = "[FF6666]＜GAME OVER＞"
"21050-122-アリス" = "！？！？"
"21050-123" = "[56cd7b]プニプニ：どれだけ剣術を鍛えたところで、我が銃の前では無力……ふっ。"
"21050-126-モモイ" = "うーん、やっぱりプニプニが「ふっ」って言うのは不自然かな。"
"21050-127-ミドリ" = "……ツッコみどころはそこじゃないと思う。"
"21050-130-アリス" = "思考停止、電算処理が追いつきません。"
"21050-131-ミドリ" = "あ、アリスちゃん？大丈夫？"
"21050-132-アリス" = "……。"
"21050-133-アリス" = "リブート、再開します。"
"21050-134-アリス" = "今度は銃の射程距離把握に努めながら、接近しすぎないようにプニプニを排除します。"
"21050-135-モモイ" = "そう、まさにそれ！諦めずに繰り返し挑戦して、試行錯誤の末に答えを見つける！それがレトロチックなゲームのロマンだよ！"
"21050-137" = "（2時間後……）"
"21050-138-アリス" = "……電算処理系統、および意思表示システムに致命的なエラーが発生。"
"21050-139-モモイ" = "頑張ってアリス、ここさえ乗り越えれば待望のクライマックスだよ！"
"21050-140-ミドリ" = "うう……っ！"
"21050-141-ミドリ" = "今のはどう考えても、「草食系」って言葉が思い出せないからって、それを「植物人間」って書いたお姉ちゃんのせいでしょ！？"
"21050-142-ミドリ" = "「ごめんなさい。私は植物人間ですので、女性に対して気軽に声をかけることはできません」ってテキストを読んだ瞬間に、アリスちゃんが一瞬意識を失ってたじゃん！"
"21050-143-アリス" = "……質問。どうして母親がヒロインで、それでいて実は前世の妻で、"
"21050-144-アリス" = "さらにどうしてその妻の元に、子供の頃に別れたきりの腹違いの友人がタイムリープしてきているのか……#nいえ、そもそも「腹違いの友人」という表現はキヴォトスの辞書データに登載されていな――"
"21050-145-アリス" = "エラー発生、エラー発生！"
"21050-146-ミドリ" = "が、頑張ってアリスちゃん！クライマックスまでもう少しだから！"
"21050-147-アリス" = "……リブート。"
"21050-148-アリス" = "プロセスを回復。"
"21050-149-アリス" = "……ふぅ。"
"21050-150-アリス" = "これが、ゲーム……。"
"21050-153-アリス" = "再開します。"
"21050-155" = "（1時間後……）"
"21050-156-アリス" = "こ、ろ、し、て……"
"21050-158-モモイ" = "すごいよアリス！開発者二人が一緒とはいえ、3時間でトゥルーエンドなんて！"
"21050-159-ミドリ" = "そ、それもそうだけど、"
"21050-160-ミドリ" = "もしかして、本当にゲームをやればやるほど……"
"21050-161-ミドリ" = "アリスちゃんの喋り方のパターンが、どんどん多彩になってきてる……！？"
"21050-164-アリス" = "勇者よ、汝が同意を求めるならば、私はそれを肯定しよう。"
"21050-165-モモイ" = "うん、確かにそう……かも？"
"21050-166-ミドリ" = "ゲームからそのまま覚えたせいで、ちょっとまだ不自然かもだけど……言葉を羅列してただけの時よりは、かなり良くなったと思う！"
"21050-167-ミドリ" = "と、ところでその……"
"21050-168-ミドリ" = "こういうのを面と向かって聞くのは緊張するんだけど……"
"21050-172-ミドリ" = "わ、私たちのゲーム、どうだった？面白かった！？"
"21050-173-アリス" = "……。"
"21050-174-アリス" = "……説明不可。"
"21050-175-モモイ" = "え、ええっ！？なんで！？"
"21050-176-アリス" = "……類似表現を検索。"
"21050-177-アリス" = "ロード中……"
"21050-178-ミドリ" = "も、もしかして、悪口を探してる……？そんなこと無いよね？"
"21050-179-アリス" = "……面白さ、"
"21050-180-アリス" = "それは、明確に存在……"
"21050-181-モモイ" = "おおっ！"
"21050-182-アリス" = "プレイを進めれば進めるほど……"
"21050-183-アリス" = "まるで、別の世界を旅しているような……"
"21050-184-アリス" = "夢を見ているような、そんな気分……もう一度……"
"21050-188-アリス" = "もう一度……"
"21050-190-アリス" = "……"
"21050-191-アリス" = "（ポロッ）"
"21050-193-モモイ" = "ええっ！？"
"21050-194-ミドリ" = "あ、アリスちゃん！？どうして泣いてるの！？"
"21050-195-モモイ" = "決まってるじゃん！それぐらい、私たちのゲームが感動的だったってことでしょ！"
"21050-196-ミドリ" = "い、いくらなんでもそれは……というかこのゲーム、ギャグ寄りのRPGのはずだし……。"
"21050-197-モモイ" = "ありがとうアリス！その辺の評論家の言葉なんかより、その涙の方が100倍嬉しいよ！あー、早くユズにも教えてあげたい……！"
"21050-199-？？？" = "……ちゃ、ちゃんと、全部見てた。"
"21050-200" = "（ギギーッ）"
"21050-201-モモイ" = "え？ロッカーが勝手に開いて……"
"21050-203-ミドリ" = "きゃあああっ！お、お、お化け！？"
"21050-204-モモイ" = "落ち着いて、ミドリ！プライステーションを投げちゃダメ！そろそろ壊れる！"
"21050-206-ユズ" = "……。"
"21050-207-アリス" = "……？"
"21050-208-モモイ" = "ユズ！"
"21050-209-ミドリ" = "ユズちゃん、あれだけ探しても見つからなかったのに！いつからロッカーの中にいたの？"
"21050-210-ユズ" = "み、みんなが、廃墟から帰ってきた時から……。"
"21050-211-ミドリ" = "だいぶ前じゃん！？その時からずっとロッカーの中にいたの？あ、もしかしてアリスちゃんが怖かったから？"
"21050-212-ミドリ" = "モモトークか何かで伝えてくれれば良かったのに、びっくりしたよ……。"
"21050-213-モモイ" = "あ、アリスは初めてだよね。この人が私たちゲーム開発部の部長、ユズだよ。"
"21050-216-ユズ" = "（スッ）"
"21050-219-アリス" = "？"
"21050-220-ユズ" = "えっと、あの、その……。"
"21050-221-ユズ" = "あ、あ、あ……"
"21050-222-アリス" = "あ……？"
"21050-223-ユズ" = "……ありがとう。"
"21050-224-ユズ" = "ゲーム、面白いって言ってくれて……もう一度やりたいって言ってくれて……。"
"21050-225-ユズ" = "泣いてくれて……本当に、ありがとう。"
"21050-226-アリス" = "？？？"
"21050-229-ユズ" = "面白いとか、もう一度とか……そういう言葉が、ずっと聞きたかったの。"
"21050-233-ミドリ" = "ユズちゃん……。"
"21050-235" = "次回;言葉を学ぶ方法"
