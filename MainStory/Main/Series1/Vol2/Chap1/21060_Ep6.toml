[translation]
"21060-1" = "第6話;言葉を学ぶ方法"
"21060-2" = "ミレニアム・ゲーム開発部"
"21060-3-ユズ" = "とにかく、あらためまして。"
"21060-4-ユズ" = "ゲーム開発部の部長、ユズです。"
"21060-5-ユズ" = "この部に来てくれてありがとう、アリスちゃん。"
"21060-6-ユズ" = "これからよろしくね。"
"21060-7-アリス" = "よろ、しく……？"
"21060-8-アリス" = "……理解。"
"21060-9-アリス" = "ユズが仲間になりました、パンパカパーン！"
"21060-10-アリス" = "……合ってますか？"
"21060-11-ユズ" = "あ、うん。だいたいそんな感じ、かな。"
"21060-12-ユズ" = "ふふっ、その様子だと、本当にわたしたちのゲームを楽しんでくれたんだね……仲間が増えるのは、RPGの醍醐味の一つだもんね。"
"21060-13-ユズ" = "あ、もしRPGを面白いなって思ってくれたなら……"
"21060-14-ユズ" = "わたしが、他にもおすすめのゲームを教えてあげる。"
"21060-15-モモイ" = "ちょっと待ったぁ！アリスにおススメするのは私が先！"
"21060-16-モモイ" = "良質なゲームをやればやるほど話し方も自然になって、私たちの計画の成功率も上がるんだし！"
"21060-17-モモイ" = "さあ、まずは『英雄神話』と『ファイナル・ファンタジア』と『アイズ・エターナル』と……"
"21060-18-ミドリ" = "何言ってるの、アリスちゃんはゲーム初心者だよ！？『ゼルナの伝説・夢見るアイランド』から始めるのが一番だって！"
"21060-19-ユズ" = "これだけは譲れない、次にやるべきは『ロマンシング物語』だよ。あ、でも第3弾だけはちょっと、個人的には、やらなくても良いかなって……。"
"21060-22-アリス" = "……？？"
"21060-23-アリス" = "……。"
"21060-25-アリス" = "……期待。再び、ゲームを始めます。"
"21060-27" = "（2時間後）"
"21060-28-アリス" = "（ピッ、ピッ、ピッ、ピッ、ピッ、ピッ……）"
"21060-29-モモイ" = "うわっ、アリス、読むスピード速くない……？会話が出力されるとほぼ同時に読み終わってるみたいな……。"
"21060-30-ミドリ" = "アリスちゃん、次は「伝説のオークバトル」やろう！ターン制バトルの面白さを教えてあげる！"
"21060-31-アリス" = "（こくり）"
"21060-32-アリス" = "（ピッ、ピッ、ピッ、ピッ、ピッ、ピッ……）"
"21060-34-ミドリ" = "（Zzz……）"
"21060-35-モモイ" = "……ふにゃ。"
"21060-36-アリス" = "（ピッ、ピッ、ピッ、ピッ、ピッ、ピッ……）"
"21060-38-アリス" = "（ピッ、ピッ、ピッ、ピッ、ピッ、ピッ……）"
"21060-39-アリス" = "……クリア。"
"21060-41-アリス" = "（ピッ、ピッ、ピッ、ピッ、ピッ、ピッ……）"
"21060-42-アリス" = "……クリア。"
"21060-44" = "チュンチュン……"
"21060-45-ミドリ" = "うーーん……。"
"21060-46-ミドリ" = "えっ、もう朝！？しまった、準備しなきゃ……！"
"21060-47-アリス" = "……。"
"21060-48-アリス" = "ようやく気が付いたか……。"
"21060-49-アリス" = "無事に目を覚ましたようで何よりだ、君は運がいいな。"
"21060-50-ミドリ" = "え！？"
"21060-51-ミドリ" = "あ、アリスちゃんか……調子はどう？色々と覚えられた？"
"21060-52-アリス" = "君の言葉を肯定しよう、必滅者よ。"
"21060-53-ミドリ" = "な、何か偏った台詞ばっかり覚えてない……！？"
"21060-54-ユズ" = "ふぁ……みんな、おはよう……。"
"21060-56" = "（ガチャッ）"
"21060-57-モモイ" = "おはよう！"
"21060-58-モモイ" = "アリス、これ。"
"21060-62-アリス" = "……？"
"21060-63-アリス" = "アリスは「正体不明の書類」を獲得した。"
"21060-65-モモイ" = "おっ、またさらに口調が洗練されてるね。これは「学生証」だよ。"
"21060-66-ミドリ" = "洗練っていうか、レトロゲームの会話調そのものだけどね……。"
"21060-67-アリス" = "学生証……？"
"21060-68-モモイ" = "この学生証は、私たちの学校の生徒だっていう証明書。生徒名簿にもヴェリタスがハッキ……いや、登録してくれたから、もうアリスも正式に私たちの仲間だよ！"
"21060-69-アリス" = "仲間……なるほど、理解しました。"
"21060-71-アリス" = "パンパカパーン、アリスが「仲間」として合流しました！"
"21060-73-ミドリ" = "ねえ、今「ハッキング」って言わなかった……？"
"21060-74-モモイ" = "大丈夫大丈夫！さて服装と学生証、それに話し方！この辺は全部解決できたから……。"
"21060-75-モモイ" = "あとは……"
"21060-76-モモイ" = "武器、だね。"
"21060-77-モモイ" = "よし。アリス、せっかくだし案内するよ。"
"21060-78-アリス" = "案内……？"
"21060-81-モモイ" = "私たちの学校、ミレニアムを！"
"21060-83" = "次回;銃と呼ぶには大きすぎる"
