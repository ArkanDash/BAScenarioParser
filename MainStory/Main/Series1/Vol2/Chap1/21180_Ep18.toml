[translation]
"21180-1" = "第18話;G.Bible"
"21180-2" = "ミレニアム・ゲーム開発部"
"21180-4-アリス" = "G.Bible……起動！"
"21180-6" = "[56cd7b]G.Bibleの世界へようこそ。"
"21180-8-モモイ" = "は、始まった！"
"21180-9" = "[56cd7b]最高のゲームとは何か……この質問に対して、#n[56cd7b]世界中で様々な答えが模索され続けてきました。"
"21180-11" = "[56cd7b]作品性、人気、売上、素晴らしいストーリーや爽快感、鳥肌の立つ演出など。"
"21180-13" = "[56cd7b]そういったものが最高のゲームの「条件」として挙げられることは多いですが、#n[56cd7b]それらは全て、あくまで「真理」の枝葉に過ぎません。"
"21180-16" = "[56cd7b]最高のゲームを作る秘訣、それはたった一つです。"
"21180-18" = "[56cd7b]そしてこのG.Bibleには、その真理が秘められています。"
"21180-20-モモイ" = "い、いよいよ！"
"21180-21-ミドリ" = "何だかすごそう……。"
"21180-22" = "[56cd7b]最高のゲームを作るたった一つの真理、秘密の方法……#n[56cd7b]それを今こそお教えしましょう。"
"21180-24-アリス" = "来ます……っ！"
"21180-25" = "[56cd7b]……"
"21180-28" = "[56cd7b]……"
"21180-30" = "[56cd7b]ゲーム"
"21180-32" = "[56cd7b]を"
"21180-34" = "[56cd7b]愛"
"21180-36" = "[56cd7b]し"
"21180-38" = "[56cd7b]な"
"21180-40" = "[56cd7b]さ"
"21180-42" = "[56cd7b]い"
"21180-44-モモイ" = "おお……オープニング、みたいな感じかな。それっぽい！"
"21180-45-ミドリ" = "そ、そう？"
"21180-46" = "[56cd7b]ゲームを愛しなさい"
"21180-48-ユズ" = "……まさか、これで終わり……じゃ、ないよね？"
"21180-49-ミドリ" = "な、何かバグってるんじゃない？"
"21180-50-モモイ" = "ちょっと待って！"
"21180-51-モモイ" = "ええっと、設定変更はどこから……。"
"21180-52" = "[56cd7b]ゲームを愛しなさい"
"21180-56" = "[56cd7b]あなたがこのボタンを押したということは、#n[56cd7b]ファイルが壊れた、もしくは何か問題があったのでは、"
"21180-58" = "[56cd7b]何らかのエラーが生じたのでは……と疑っている状況なのでしょう。"
"21180-60-モモイ" = "あっ、やっぱり！このまま終わるはずないよね！"
"21180-61" = "[56cd7b]しかし、[wa:500]エラーではありません。"
"21180-63-ミドリ" = "嘘ぉ！？"
"21180-64" = "[56cd7b]残念ですが、これが結論です。"
"21180-66" = "[56cd7b]ゲームを愛しなさい！"
"21180-69-モモイ" = "そ、そんなはずはない！きっと何かエラーが……！"
"21180-70-ミドリ" = "ファイルの損傷とか修正も見当たらない……最後の転送情報、ファイルサイズ、それにデータ構成も問題無し。"
"21180-71-ユズ" = "そ、それじゃ、本当に……。"
"21180-72-モモイ" = "こ、これで終わり！？"
"21180-73-モモイ" = "……お、"
"21180-74-ミドリ" = "お姉ちゃん……私たち、何か悪い夢でも見て……"
"21180-76-モモイ" = "終わりだああぁぁぁああ！！！"
"21180-78" = "（そして今……）"
"21180-79-アリス" = "あの、モモイ……デイリークエストしないのですか？"
"21180-80-アリス" = "いつも、「デイリークエストより大事なものなんてない」と言っていたのに……。"
"21180-81-モモイ" = "アリス……私のHPはもうゼロだよ……。"
"21180-82-アリス" = "えっと……。"
"21180-83-アリス" = "ミドリ……？"
"21180-84-ミドリ" = "ごめんね、アリスちゃん……知ってたけど、現実って元々こういうものなの……そう、つまりこれがトゥルーエンド……ハッピーエンドとはまた別の到達点……。"
"21180-85-アリス" = "……。"
"21180-86-アリス" = "ゆ、ユズは……ユズはどこに？"
"21180-87-モモイ" = "多分、またロッカーの中に引きこもってるんだと思う。よく見て、ロッカーがたまにプルプルしてるでしょ？"
"21180-89-アリス" = "今のみんなの姿は……"
"21180-90-アリス" = "まるで、正気がログアウトしたみたいです。"
"21180-91-モモイ" = "うぅっ……。"
"21180-92-モモイ" = "仕方ないじゃん、最後の手段だったのに！それが、あんな誰でも知ってる文章が一つ入ってるだけだなんて！釣りにもほどがある！"
"21180-93-モモイ" = "知ってた！世界にはそんな、それ一つで全部が変わって上手く行くような、便利な方法なんか無いって！でも期待ぐらいしたっていいじゃん！うああぁぁぁんっ！"
"21180-95-ミドリ" = "はぁ……。"
"21180-96-ミドリ" = "ごめんね、アリスちゃん……私たちは……G.Bible無しじゃ、良いゲームは作れない……。"
"21180-97-アリス" = "……。"
"21180-98-アリス" = "いいえ。"
"21180-99-アリス" = "否定します。"
"21180-100-アリス" = "アリスは『テイルズ・サガ・クロニクル』をやるたびに思います。"
"21180-101-アリス" = "あのゲームは、面白いです。"
"21180-102-ミドリ" = "え？"
"21180-103-アリス" = "感じられるのです。"
"21180-104-アリス" = "モモイが、ミドリが、ユズが……。"
"21180-105-アリス" = "このゲームを、どれだけ愛しているのかを。"
"21180-106-アリス" = "そんな、たくさんの想いが込められたあの世界で旅をすると……"
"21180-107-アリス" = "……胸が、高鳴ります。"
"21180-108-アリス" = "仲間と一緒に新しい世界を旅する、あの感覚は……。"
"21180-109-アリス" = "夢を見るというのが、どういうことなのか……その感覚を、アリスに教えてくれました。"
"21180-110-アリス" = "だから、待望のエンディングに近づくほどに、あんなに苦しんだのに、思ってしまうのです……。"
"21180-111-アリス" = "この夢が、覚めなければいいのに……と。"
"21180-112-アリス" = "アリスは、そう思うのです。"
"21180-113-モモイ" = "アリス……。"
"21180-114-ユズ" = "……。"
"21180-115-ミドリ" = "ってうわっ、ユズちゃん！？いつからそこに！？"
"21180-116-ユズ" = "『テイルズ・サガ・クロニクル』の話が始まった時から……。"
"21180-117-モモイ" = "最初からいたの！？"
"21180-118-ユズ" = "……作ろう。"
"21180-119-ミドリ" = "え？"
"21180-120-ユズ" = "わたしの夢は……わたしが作ったゲームを、みんなに面白いって言ってもらうこと。"
"21180-121-ユズ" = "でも、わたしが初めて作った『テイルズ・サガ・クロニクル』のプロトタイプは……四桁以上の低評価コメントと、冷やかしだけで終わっちゃって……。"
"21180-122-ユズ" = "それが辛くて、ゲーム開発部に引きこもってた時……。"
"21180-124-ユズ" = "二人が、訪ねてきてくれた。"
"21180-126" = "（6か月前……）"
"21180-129" = "[56cd7b]これがゲーム？"
"21180-131" = "[56cd7b]これを作った人の頭の中、逆に気になる……。"
"21180-133" = "[56cd7b]それはさすがに脳みそ……って言おうと思ったけど、本当に入ってるのか怪しいね。"
"21180-135" = "[56cd7b]ゲームのことをよく知らない人が作ってない？"
"21180-137" = "[56cd7b]身の程を知った方が良い。"
"21180-139" = "[56cd7b]これはゲームなんかじゃない、ゲームによく似たゴミだよ。"
"21180-141-ユズ" = "うぅ……。"
"21180-142-ユズ" = "やめて……ごめんなさい、ごめんなさい……。"
"21180-143-ユズ" = "もうお願いだから……許して……！"
"21180-145" = "（ドンドンドン！）"
"21180-147-ユズ" = "ひぃっ！"
"21180-148-ユズ" = "だ、誰……？"
"21180-149-？？？" = "えっと、ここって『テイルズ・サガ・クロニクル』のプロトタイプを作った、ミレニアムのゲーム開発部で合ってますか？"
"21180-150-ユズ" = "な、何……？今度は直接……？"
"21180-151-ユズ" = "ご、ごめんなさい、ごめんなさい……！もう二度とゲームは作りません、だから、許して……！"
"21180-152-？？？" = "えぇっ！？"
"21180-153-？？？" = "何言ってるんですか、こんなに面白いのに！プロトタイプだけ作ってやめちゃうなんて！"
"21180-154-？？？" = "続き、すごい気になってるんですよ！？ここまでワクワクさせておいて、そんなの無しでしょ！"
"21180-155-ユズ" = "……え？"
"21180-156-？？？" = "『テイルズ・サガ・クロニクル』、すっごく面白かったです！"
"21180-157-？？？" = "お姉ちゃん、徹夜でやってたもんね。"
"21180-158-？？？" = "ミドリだってニヤニヤしながらプレイしてたじゃん！もともとゲームにそんな興味なかったのに！"
"21180-159-？？？" = "え、う、うーん……確かに、ドットだけどキャラとかすごい可愛かったし……。"
"21180-160-？？？" = "とにかく、あの！失礼します！"
"21180-161" = "（ガチャッ！）"
"21180-163-ユズ" = "……！？"
"21180-164-モモイ" = "あなたがUZ様！？"
"21180-165-ユズ" = "えっ……あ、は、はい……。"
"21180-166-ミドリ" = "ファンです！！"
"21180-167-モモイ" = "私も、ミドリも！UZ様みたいに、面白いゲームが作りたいです！"
"21180-168-ユズ" = "……っ！！"
"21180-174" = "……"
"21180-177-ユズ" = "……それで、二人が来てくれた。"
"21180-178-ユズ" = "一緒に『テイルズ・サガ・クロニクル』を完成させて……今年のクソゲーランキング1位になっちゃったけど……。"
"21180-179-モモイ" = "うっ……。"
"21180-180-ミドリ" = "……。"
"21180-181-ユズ" = "その後、アリスちゃんが訪ねてきてくれて……。"
"21180-182-ユズ" = "面白いって、言ってくれた。それで、わたしの夢は叶ったの。"
"21180-183-ユズ" = "心の通じ合う大事な仲間たちと、一緒にゲームを作って、それを面白いって言ってもらう……ずっと一人で思い描いてるだけだった、その夢が。"
"21180-184-モモイ" = "……。"
"21180-185-ユズ" = "これ以上は、欲張りかもだけど。叶うなら、わたしはこの夢が……この先も、終わらないでほしい。"
"21180-186-ミドリ" = "ユズちゃん……。"
"21180-187-モモイ" = "……うん、よし！"
"21180-188-モモイ" = "ねえ、今からミレニアムプライスまで、時間どれぐらい残ってる？"
"21180-190-ミドリ" = "お姉ちゃん……！"
"21180-191-アリス" = "6日と4時間38分です。"
"21180-192-モモイ" = "……それだけあれば十分。"
"21180-193-モモイ" = "さあ、ゲーム開発部一同！"
"21180-194-モモイ" = "『テイルズ・サガ・クロニクル２』の開発、始めよう！！"
"21180-196-ミドリ" = "うん！"
"21180-198" = "次回;ダブルオー"
