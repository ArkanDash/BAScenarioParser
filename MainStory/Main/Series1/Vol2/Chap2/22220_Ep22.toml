[translation]
"22220-1" = "第22話;王女のためのパヴァーヌ（１）"
"22220-4-モモイ" = "あっ！あそこ！見て！"
"22220-5-チヒロ" = "……本当に倒すなんて。"
"22220-6-モモイ" = "ネル先輩すごい！"
"22220-8-ミドリ" = "ユズちゃんもすごかった！全部、ユズちゃんの作戦のおかげだからね！"
"22220-9-ユズ" = "わ、わたしは……と、特に何か、したわけじゃ、ないから……"
"22220-13-ネル" = "…………。"
"22220-19" = "[ns] \"ネル……！大丈夫！？\""
"22220-21-ネル" = "……しびれる。"
"22220-22" = "[s] \"……え？\""
"22220-23-ネル" = "身体がしびれて……動けねぇ……。"
"22220-24-ネル" = "クソ、あんま騒ぐな……頭に響く……#n……大丈夫だ、ちょっと休んだら良くなる。"
"22220-25-ネル" = "つーか、うちの連中は？"
"22220-26" = "[s1] \"みんな無事だよ。しばらくは動けないと思うけど。\"\n[s2] \"先に上がって、ネルの世話を頼んだって言ってたよ。\""
"22220-27-ネル" = "……そうか。#nは、誰が誰の世話をしろっていうのやら。"
"22220-28-ネル" = "……そうか。#nは、誰が誰の世話をしろっていうのやら。"
"22220-29-ネル" = "……おい、チビども。"
"22220-30-モモイ" = "う、うん？"
"22220-31-ネル" = "アカネやアスナ、カリンと……あたしらがここまで繋いできた。"
"22220-32-ネル" = "あとはもう一つだけだろ。"
"22220-33-ネル" = "そいつ、ぜってぇ連れ戻せよ。"
"22220-39-モモイ" = "うん！"
"22220-40" = "[s] \"ありがとう、ネル……みんな、行こう！\""
"22220-42-モモイ" = "着いた！"
"22220-43-ミドリ" = "ここがエリドゥ中央タワーの最上階……"
"22220-44-ユズ" = "（……ゴクッ）"
"22220-46-チヒロ" = "地図によると、ここのどこかにアリスがいるはず。"
"22220-51-リオ" = "そう、アリスならここにいるわ。"
"22220-52-モモイ" = "会長……！"
"22220-53-ミドリ" = "……！"
"22220-54-モモイ" = "まだ戦うつもり！？"
"22220-56-リオ" = "いいえ。トキが倒れた時点で、私が持っている手札はすべて消えた。"
"22220-57-リオ" = "認めましょう……私の負けよ。"
"22220-58" = "[s] \"リオ……。\""
"22220-59-リオ" = "本当に……貴女たちはここまで来たのね。"
"22220-60-リオ" = "近い将来、キヴォトスの脅威になる事が確定しているあの子を救うために……"
"22220-61-リオ" = "遮るものをすべてを薙ぎ払って……。"
"22220-62-モモイ" = "当たり前だよ！最初からそう決めてたからね！"
"22220-63-リオ" = "アリスが、[ruby=  ・    ・    ・    ・    ・    ・    ・    ・    ・    ・    ・  ]キヴォトスに終焉を招く[/ruby]としても？"
"22220-64-モモイ" = "急に何？アリスの事そんな風に言わないでよ！"
"22220-65-リオ" = "私は、ただ……"
"22220-66" = "[ns3] \"リオが何を根拠に動いたのかは分からない。\"\n[ns4] \"でも、一つだけはっきりと言えるよ。\""
"22220-69" = "[ns5] \"リオは、誰にも相談せず、一人で全てを判断して結論づけた。\"\n[ns6] \"そして、君が正しいと信じる事を他人に強要した。\""
"22220-70-リオ" = "……！！"
"22220-71-リオ" = "……！！"
"22220-75-リオ" = "先生……貴方も、私の行動が独善だと言うの……？"
"22220-76-リオ" = "でも……私は……！！"
"22220-77-リオ" = "私、は……"
"22220-78-チヒロ" = "先生、アリスの場所が分かったよ。"
"22220-79-チヒロ" = "その部屋の隅に、電力が集中する施設があるはず。アリスはそこにいる。"
"22220-80-モモイ" = "ミドリ！ユズ！"
"22220-81-ミドリ" = "うん！お姉ちゃん！"
