"22220-87-リオ" = "…………。"
"22220-93-モモイ" = "アリス！お待たせ！"
"22220-94-ミドリ" = "アリスちゃん！"
"22220-96-ユズ" = "アリスちゃん……。"
"22220-97-アリス" = "…………。"
"22220-98" = "[ns] \"アリス……？\""
"22220-102-モモイ" = "な、なにが起きてるの！？"
"22220-103-ミドリ" = "あ、あそこのモニターが……！"
"22220-105-リオ" = "これは………！！"
"22220-119-チヒロ" = "ぃま……急に……な…が……！？"
"22220-121-チヒロ" = "通信が……き……"
"22220-123-チヒロ" = "……み…な……応答……！？"
"22220-127" = "[ns] \"チヒロ……！\""
"22220-128-リオ" = "エリドゥのシステム全体が……ハッキング…………"
"22220-129-リオ" = "いえ、これは単純なハッキングではない……"
"22220-130-リオ" = "都市全体が「何か」に変質していっている？"
"22220-131-モモイ" = "こんな事してる場合じゃない！早くケーブルを外してアリスを……！"
"22220-132-？？？" = "その行為は推奨しません。"
"22220-133-モモイ" = "！！"
"22220-136-？？？" = "現在「王女」の表層人格は内部データベースの深層部に隔離されています。"
"22220-137-？？？" = "強制的に接続を解除すると、取り返しのつかない損傷が起こるでしょう。"
"22220-138-モモイ" = "アリス……！？一体何を……？"
"22220-139-ミドリ" = "お姉ちゃん、これアリスじゃないよ……"
"22220-140-？？？" = "アリス……？"
"22220-141-？？？" = "それは、あなた達が私たちの「王女」を呼ぶ際の名称……。"
"22220-142-？？？" = "「王女」に名前は不要です。#n名前は存在の目的と本質を乱します。"
"22220-143-ミドリ" = "何を言ってるの！？ねえ、あなたは誰！アリスちゃんを返して！"
"22220-145" = "私の個体名は＜Key＞。"
"22220-148-Key" = "王女を助ける無名の司祭たちが残した修行者であり、#n彼女が戴冠する玉座を継ぐ「鍵」＜Key＞です。"
"22220-149" = "[s] \"……なに？\""
"22220-150-Key" = "彼女は「王女」であり、私は「鍵」。#nそれが私たちの存在であり目的。"
"22220-151-Key" = "今、我々を妨害していた攻撃が止まったことを確認しました。"
"22220-152-Key" = "只今よりエラーを修正し、本来あるべき玉座に「王女」を導かせていただきます。"
"22220-154-Key" = "AL-1Sに接続された利用可能リソースを確保するため、全体検索を実行。"
"22220-156-Key" = "リソース領域の拡大。"
"22220-158-Key" = "リソース名、要塞都市「エリドゥ」の全体リソース――1万エクサバイトのデータを確認。"
"22220-159-Key" = "………現時刻をもって、プロトコルATRAHASIS稼動。"
"22220-161-Key" = "コード名「アトラ・ハシースの箱舟」起動プロセスを開始します。"
"22220-163-リオ" = "……！！#nアトラ・ハシース……！？"
"22220-168-Key" = "プロセスサポートのため[ruby=Divi:Sion]追従者[/ruby]を呼び出します。"
"22220-182-リオ" = "……エリドゥ各地で、[ruby=Divi:Sion]追従者[/ruby]の出現……？"
"22220-183" = "[s] \"リオ……一体これは何が起きてるの？アリスは……。\""
"22220-184-リオ" = "いえ、そんなはずが……私の計算は……でも……！"
"22220-185-リオ" = "私は……キヴォトスに終焉がもたらされることを懸念して、#nこの要塞都市エリドゥを建設した。"
"22220-186-リオ" = "私が動員できるミレニアムのすべての技術と力、エネルギー、#nそして資源をここに集めたというのに……。"
"22220-187-リオ" = "けれど……むしろ、そのせいで……この都市が……"
"22220-188-リオ" = "終焉の発端に……？"
"22220-189-リオ" = "私は……"
"22220-190-リオ" = "――間違っていた？"
"22220-191-Key" = "箱舟製作に必要なリソース確保23%…………。"
"22220-192-Key" = "……46%…………。"
"22220-193-リオ" = "先生！このままでは……！"
"22220-194-リオ" = "このまま、エリドゥのすべてのリソースを奪われてしまったら、#nキヴォトスが終わってしまう。"
"22220-195-リオ" = "決断を下さなければ……！"
"22220-196" = "[s] \"……決断？\""
"22220-199-Key" = "王女は鍵を手に入れ、箱舟は用意された。"
"22220-200-Key" = "無名の司祭の要請により、この地に新しい「サンクトゥム」を建立する。"
"22220-201-Key" = "その到来で初めて、すべての神秘はアーカイブ化され――"
"22220-202-リオ" = "このままでは、世界が滅びる……！！"
"22220-206-リオ" = "みんなと一緒に逃げてちょうだい、先生。"
"22220-207" = "[s] \"逃げてって、リオ……いったい何を。\""
"22220-208-リオ" = "今からこの都市自体が変貌し、箱舟という新しい概念に歪曲される。#nそうしたら……このキヴォトスは……。"
"22220-209-リオ" = "私のせいよ……。"
"22220-210-リオ" = "私がこの都市を作らなかったら、最初からこんな事にならなかったのに……。"
"22220-211-リオ" = "私が……私のせいで……。"
"22220-212-リオ" = "だから私が、止めないと……。"
"22220-214-ユズ" = "ど、どういう意味ですか……？"
"22220-215-リオ" = "……私一人で、システムを止めてみせるわ。"
"22220-216" = "[s] \"……リオ。\""
"22220-217-リオ" = "私の命一つで……世界の終焉を防ぐことができるというのなら#nそうするわ――そうしなければならない。"
"22220-218-リオ" = "……早く！！これは極めて論理的な選択よ、先生！"
"22220-226" = "[ns] \"トロッコ問題について……話してたよね。\""
"22220-228" = "[ns7] \"トロッコ問題には二つの選択肢しかない。\"\n[ns8] \"君はそこで犠牲の少ない方を選ぼうとしたわけだし。\""
"22220-229-リオ" = "私は……。"
"22220-230-リオ" = "私は……。"
"22220-231" = "[ns] \"……それが君の優しさなんだね、リオ。\""
"22220-233" = "[ns] \"でも二つの選択は、誰かが犠牲になる結果しかないのであれば……。\""
"22220-235" = "[ns] \"私はその質問自体が間違っていると答えるよ。\""
"22220-236-リオ" = "それは……問題の答えではないわ、先生。ただの詭弁よ。"
"22220-237-リオ" = "思考実験の前提条件を否定するのは、ただの屁理屈でしかないわ。"
"22220-238" = "[s] \"レバーを引く人が、見落としたものがあるんじゃないのかな？\""
"22220-239-リオ" = "……！？"
"22220-240" = "[s] \"本当に周囲に手を差し伸べてくれる人がいなかったのか、とか。\""
"22220-241-リオ" = "……！？"
"22220-242-Key" = "……73%………………89%…………"
"22220-244-Key" = "リソース確保99%……………………。"
"22220-246" = "[ns] \"私は、全員で力を合わせて「全てを救う」選択肢を選びたい。\""
"22220-247-リオ" = "そ、そんな選択肢はないわ……。"
"22220-248-ユウカ" = "ノア！今よ！#n電力という電力を全部落としちゃって！"
"22220-249-ノア" = "は～い、ユウカちゃん。#nその言葉を待ってました♪"
"22220-250-ノア" = "えいっ！"
