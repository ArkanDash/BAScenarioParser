[translation]
"22160-1" = "第16話;チェックメイト"
"22160-17-ヒマリ" = "…………"
"22160-21-リオ" = "トキに任せた、C&Cの分断――"
"22160-23-ヒマリ" = "C&Cという最大の戦力を無力化してしまえば、残っているのは先生だけ……。"
"22160-25-リオ" = "いくらシャーレの先生といえど、#n最終的には受け入れるしかないわ。"
"22160-26-リオ" = "何が正しいのか、そして――"
"22160-30-リオ" = "どれが「合理的な判断」なのか。"
"22160-31-リオ" = "――チェックメイトよ。"
"22160-35-ヒマリ" = "なるほど……リオ、あなたの考えは分かりました。"
"22160-36-ヒマリ" = "綿密に練られた計画、そしてその手法も……"
"22160-37-ヒマリ" = "それは、ある意味では「合理的」なのかもしれません。"
"22160-38-リオ" = "ヒマリ……。"
"22160-39-ヒマリ" = "ですが、やはり私はそのような独善には賛同できません。"
"22160-40-リオ" = "………………そう。"
"22160-41-ヒマリ" = "――ひとつだけ、忠告しておきます。"
"22160-42-ヒマリ" = "あなたは確かに優秀です。"
"22160-43-ヒマリ" = "よくもまぁ、バレずにこのような都市を建設できたものだと……"
"22160-44-ヒマリ" = "ある種、感心すらしてしまいます。"
"22160-45-リオ" = "……どういう意味かしら？"
"22160-46-ヒマリ" = "あなたは……自身が正しいと信じたら、振り返らずに突き進むでしょう？"
"22160-47-ヒマリ" = "それはあなたの長所であり……"
"22160-48-ヒマリ" = "同時に弱点でもあります。"
"22160-49-リオ" = "弱点？そんなわけ……"
"22160-50-ヒマリ" = "リオ……あなたは、悩みを後輩に打ち明けた事がありますか？"
"22160-51-リオ" = "……。"
"22160-52-ヒマリ" = "弱点というのは、そこまで大袈裟なものではありません。"
"22160-53-ヒマリ" = "優秀すぎるが故に――人と歩幅を合わせる事も、相手を待つ気もない。#nあなたのそういうところが。"
"22160-54-ヒマリ" = "最大の弱点なのですよ。"
"22160-60-リオ" = "爆発音！？#n一体どこが……。"
"22160-61-ヒマリ" = "本番はこれからですよ。"
"22160-62-リオ" = "ヒマリ、ちょっ……！"
"22160-67-リオ" = "……外部からの襲撃？"
"22160-68-リオ" = "あり得ないわ。"
"22160-69-リオ" = "事前に「脅威」になり得る勢力はすべてマーク済。"
"22160-70-リオ" = "それなのに、一体誰が……。"
"22160-73-エイミ" = "こっちだよ、ヒマリ部長。"
"22160-74-ヒマリ" = "ふふ、まさかエイミ……あなたが私を助けに来てくださるとは……。"
"22160-75-ヒマリ" = "これはリオへの裏切りになると思いますが、大丈夫なんですか？"
"22160-76-エイミ" = "うーん……さあ？"
"22160-77-エイミ" = "「私がリオに会いに行った後、24時間経っても戻って来なかったら、冷蔵庫にあるプリンを食べてもいい」#nって部長が言ったでしょ？"
"22160-78-エイミ" = "でも、どうせなら一緒に食べたいなって思っただけ。"
"22160-79-ヒマリ" = "そうなのですね……。"
"22160-80-ヒマリ" = "ふふっ……後輩がどうやって助けに来てくれるのか、想像しながら待つというのは思いの外楽しいものですね。"
"22160-81-ヒマリ" = "おかげさまで、リオの面白い表情が見れました。#n満足です。"
"22160-82-エイミ" = "……一体、どっちが悪趣味なんだか。"
"22160-83-ヒマリ" = "あら、悪趣味だなんて失礼な。#n超天才病弱美少女ハッカーの高尚な趣味と訂正していただけませんか？"
"22160-84-エイミ" = "はいはい。というか部長、状況が悪いのは変わらなくない？"
"22160-85-エイミ" = "このままじゃ、負け戦だよ？#n私たちが加勢しても互角になるかどうか……。"
"22160-86-ヒマリ" = "あら、それなら大丈夫ですよ。"
"22160-87-エイミ" = "うん？何か切り札でもあるの？"
"22160-88-ヒマリ" = "ええ、もちろんです。"
"22160-89-ヒマリ" = "エイミがこうやって私を助けに来てくださったように。"
"22160-90-ヒマリ" = "私には頼れる後輩が、たーくさんいるんですよ？"
"22160-92-エイミ" = "……？"
"22160-94" = "ヴェリタスの部室"
"22160-95-マキ" = "うわあっ！これ、どうすればいいの！？回線がダメになっちゃってるよ！？"
"22160-100-ハレ" = "……ダメ。ネットワークが完全に沈黙した。"
"22160-101-ハレ" = "これじゃあ手の打ちようが……"
"22160-102-マキ" = "一体どうすればいいの……考えなきゃ……どうすれば……。"
"22160-103-コタマ" = "このままでは、C&Cどころか、先生まで負けてしまいます。"
"22160-104-ハレ" = "……チッ、相手の対応をナメてた。"
"22160-105-ハレ" = "最初からどんなルートで行くにせよ、ジャミング対策をしっかりする必要があったのに……。"
"22160-106-コタマ" = "……私たちだけでは……ここまでなのでしょうか？"
"22160-107-マキ" = "そんなの嫌だよ！アリスちゃんの事諦めるなんて、絶対イヤ……！"
"22160-109-ハレ" = "何か、方法は……"
"22160-112" = "……"
"22160-114-ハレ" = "ちょっと待って。#nマキ、コタマ先輩。"
"22160-115-マキ" = "えっ、急にどうしたの？ハレ先輩。"
"22160-116-ハレ" = "モニターに……文字が……。"
"22160-117" = "…………………"
"22160-119" = "………………………………………"
"22160-121-コタマ" = "これは……。"
"22160-122" = "…………………………………………………………「Optimus Mirror System」"
"22160-125" = "「[ruby=ミラー]鏡[/ruby]」起動。"
"22160-129-ヴェリタスのみんな" = "……え？"
"22160-140-コトリ" = "つ、強すぎます……。"
"22160-141-ヒビキ" = "……このままじゃ本当に危ないかも。"
"22160-142-ウタハ" = "危機一髪って感じだね。"
"22160-143" = "[ns] \"何でそんなに落ち着いてるの……？"
"22160-147-モモイ" = "うわぁーん！こ、今度はこっちを狙ってるよ！？"
"22160-148" = "[s] \"危ない！気をつけて……！\""
"22160-155-ミドリ" = "アバンギャルド君の動きが……"
"22160-156-ユズ" = "急に……遅くなっ、た？"
"22160-164-チヒロ" = "ふう……なんとか間に合ったかな。"
"22160-165-チヒロ" = "みんな、大丈夫？"
"22160-166" = "[s] \"…………チヒロ！\""
"22160-168" = "次回;逆転の踏み台"
