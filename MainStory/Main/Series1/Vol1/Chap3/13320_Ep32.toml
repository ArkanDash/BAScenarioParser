"13320-149" = "殺したんだ。"
"13320-152" = "殺したんだ。"
"13320-157" = "……この苦しみは、誰にも分かるはずない。"
"13320-161" = "何も知らないくせに。"
"13320-187-地下生活者" = "ウオオオオオオオオ――！"
"13320-188-地下生活者" = "ついに、ついにやったぞ！"
"13320-189-地下生活者" = "これこそが、古則の答え！"
"13320-197" = "[ns] \"……！\""
"13320-198-アヤネ" = "な、何が起きて……？"
"13320-199-セリカ" = "あっちで爆発が！#nっていうか、空が……。"
"13320-200-シロコ" = "……！"
"13320-201-ノノミ" = "これは……。 "
"13320-205-スオウ" = "ぐっ……。"
"13320-209-ノゾミ" = "おい、しっかりしろって監督官！#n寝てる場合じゃないけど！？"
"13320-210-ヒカリ" = "むーりー、完全に伸びてるー。"
"13320-215-シロコ" = "先生……。"
"13320-216-アヤネ" = "ひとまず、列車砲は停止できましたが、今度は何が……？"
"13320-217-セリカ" = "も、もはや列車砲どころじゃなさそうだけど！？"
"13320-222" = "[ns] \"ホシノ、ヒナ……！\""
"13320-232" = "次回;顕現"
