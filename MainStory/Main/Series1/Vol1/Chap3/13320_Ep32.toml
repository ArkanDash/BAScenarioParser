[translation]
"13320-1" = "第32話;唯一の真実（２）"
"13320-3-ヒナ" = "雷帝の遺産は厄介だろうけど……先生たちなら、何とかしてくれる。"
"13320-4-ヒナ" = "[ruby=あさぎり]朝霧[/ruby]スオウの安全を確保したら、こっちに合流すると思う。#nそれまでおとなしく待ってることね。"
"13320-5-ヒナ" = "……最初からこれで良かったって、#nあなたも分かっているんじゃないの？"
"13320-9-ホシノ" = "……。"
"13320-10-ホシノ" = "知ったような口ぶりだね、風紀委員長ちゃん。"
"13320-12-ホシノ" = "でも、最初から絶対って言い切れた？"
"13320-13-ホシノ" = "すべてが思い通りに行くわけがない。むしろ、思い通りに行かないことのほうが多い。"
"13320-14-ヒナ" = "……。"
"13320-15-ホシノ" = "亡くなった人は蘇らないし。"
"13320-16-ホシノ" = "過去は変えられない。"
"13320-17-ホシノ" = "ユメ先輩の死が、決し[ruby=くつがえ]て覆ら[/ruby]ないように。"
"13320-18-ヒナ" = "それは……。"
"13320-19-ホシノ" = "……どうして？"
"13320-20-ホシノ" = "なんで、先輩が死ななくちゃいけなかったの？"
"13320-21-ホシノ" = "一体どこから間違えちゃったんだろ……あんな最期になるなんて……。"
"13320-22-ホシノ" = "……ねぇ、どうして？"
"13320-23-ヒナ" = "（幻覚を見ている……？）"
"13320-24-ホシノ" = "手帳、手帳は？"
"13320-25-ヒナ" = "……？"
"13320-30-ホシノ" = "どこ？"
"13320-31-ホシノ" = "先輩が言う「あそこ」って？"
"13320-32-ホシノ" = "いったい、あの手帳には何が書いてあるの？"
"13320-33-ヒナ" = "……？"
"13320-34-ホシノ" = "私はずっと、最後の言葉を知らないまま生きていくの……？"
"13320-35-ヒナ" = "（……明らかに様子がおかしいわ） "
"13320-37-地下生活者" = "オオッ……あと少し、あと少しだ！"
"13320-38-地下生活者" = "邪魔者は、もういなくなった。"
"13320-39-地下生活者" = "たとえ、手帳が見つかったとしても。"
"13320-40-地下生活者" = "小鳥遊ホシノが、梔子ユメの死の真実を知る余地はない。"
"13320-41-地下生活者" = "梔子ユメの死は、すでに遠い過去のもの！"
"13320-42-地下生活者" = "「死」という絶対的な真実に、我々はたどり着けない。"
"13320-43-地下生活者" = "それが不変の真理だからだ！"
"13320-52-地下生活者" = "だが、たしかに小鳥遊ホシノはこの世界で死に最も迫った存在となった。#n――キヴォトス最高の神秘、暁に囚われし太陽の神よ！"
"13320-53-地下生活者" = "あなたは6つ目の古則の答えへの手がかりとなる。"
"13320-54-地下生活者" = "これほどまでの神聖が「死」に晒された時に、#n何が起きるのか見せてくれたまえ！"
"13320-55-地下生活者" = "それが、勝利者たる小生に与えられし報酬だ！"
"13320-57-ホシノ" = "あの手帳には、書いてあるはずなんだ。"
"13320-58-地下生活者" = "（ええ……あなたは真実を知るべき存在です）"
"13320-59-ホシノ" = "……そう。必ず、見つけないと。"
"13320-60-地下生活者" = "（そこには、長らく欲してきた答えがあるでしょう）"
"13320-61-ヒナ" = "ねえ、さっきから誰と会話を……？"
"13320-64-ホシノ" = "もう付き合ってられません！#n生徒会は終わりです！"
"13320-65-ホシノ" = "あの時、私が怒らなければ……。"
"13320-68-ユメ" = "見て見て、ホシノちゃん。リュックサック型の水筒だって！#n便利そうじゃない？"
"13320-69-ホシノ" = "あの時、私が反対しなければ……。"
"13320-72-ホシノ" = "そのためにも……まずは先輩、これを受け取ってください。"
"13320-74-ユメ" = "うん……？"
"13320-75-ホシノ" = "あの時、私が生徒会に入らなければ……。"
"13320-78-ユメ" = "待って！"
"13320-82-ユメ" = "……ひんっ！？"
"13320-90-ホシノ" = "あの時、私が手を差し出さなければ……。"
"13320-93-ユメ" = "住民の皆さん！"
"13320-94-ユメ" = "署名をお願いします！"
"13320-95-ホシノ" = "……。"
"13320-96-ホシノ" = "そもそも、私がいなければ――"
"13320-97-ホシノ" = "――ユメ先輩は、死なずに済んだ。"
"13320-105-ホシノ" = "……あぁ。"
"13320-106-ホシノ" = "――やっぱり。"
"13320-107-ホシノ" = "ユメ先輩を殺したのは――"
"13320-110-ホシノ" = "――私だ。"
"13320-115-ホシノ" = "私のせいだ。"
"13320-116-ホシノ" = "私が殺したんだ。"
"13320-125-ホシノ" = "私が、私が……私が。"
"13320-129" = "私が。"
