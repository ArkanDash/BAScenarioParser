[translation]
"13310-1" = "第31話;唯一の真実（１）"
"13310-3-ホシノ" = "（……体が動かない）"
"13310-5-ヒナ" = "そのまま横になってなさい。#nあなたの負けよ。"
"13310-6-ホシノ" = "（これで、本当に終わり……？）"
"13310-13-ホシノ" = "どうして？ "
"13310-14-ホシノ" = "アビドスの問題に、首を突っ込んでくるなんて……。"
"13310-15-ヒナ" = "先生に頼まれたから。#n[ruby=たかなし]小鳥遊[/ruby]ホシノを止めてほしい、って。"
"13310-16-ヒナ" = "……それに、私も無関係じゃない。"
"13310-17-ホシノ" = "……。"
"13310-18-ヒナ" = "雷帝の遺産を、私はひとつ残らず破壊しなくちゃいけないから。"
"13310-19-ホシノ" = "ゲヘナの暴君……雷帝？ "
"13310-20-ヒナ" = "彼女の置き土産は、何度もキヴォトスを危険に晒してきた。"
"13310-21-ヒナ" = "……まさか、アビドスにも存在するとは思わなかったけど。"
"13310-22-ホシノ" = "そっか……風紀委員長ちゃんも列車砲を狙ってるんだね。"
"13310-23-ホシノ" = "でも、アレはカイザーが――"
"13310-24-ヒナ" = "何とかなるわ、先生がいれば。"
"13310-25-ヒナ" = "それくらい、あなたも分かってるでしょう？"
"13310-27-ホシノ" = "……。"
"13310-28-ヒナ" = "分からなかったとは言わせないわ！"
"13310-29-ヒナ" = "「きっと、何とかなる」。"
"13310-33-ヒナ" = "先生も、アビドスの子たちも、言っていたはずよ。"
"13310-34-ヒナ" = "私にとっても、そうだったように……。"
"13310-35-ホシノ" = "……。"
"13310-36-ヒナ" = "それでも、あなたは止まらなかった……いや、止まれなかった。"
"13310-38-ヒナ" = "[ruby=くちなし]梔子[/ruby]ユメがいたから。"
"13310-39-ホシノ" = "……。"
"13310-40-ヒナ" = "彼女の意志を守りたい、と思ったのでしょう？#n鉄道の権利を取り戻そうとしていたのは、列車砲を破壊するためだと決めつけて。"
"13310-41-ヒナ" = "でも、それは違う。"
"13310-42-ヒナ" = "そもそも彼女は、存在自体知らなかったはず。#n当時から雷帝の遺産を追っていた、私とマコトでさえ知らなかった。"
"13310-43-ホシノ" = "……。"
"13310-44-ヒナ" = "「砂漠横断鉄道」は、アビドス生徒会とネフティスが#n共同で自治区を復興させようとした証。だから、残したいと思っただけ。"
"13310-45-ヒナ" = "これもアビドスの一部だから、と。#n採算なんて気にせずに、ね。"
"13310-47-ヒナ" = "そして残金を振り込むために、自治区の外れにある銀行へ向かう途中の砂漠で……#n不慮の事故に遭った。"
"13310-52-ホシノ" = "売主「セイント・ネフティス」と買主「アビドス生徒会」は……#n砂漠横断鉄道の施設使用権を100万円で売り渡し……#n乙は契約金の一部として1万円を即時に支払うことを約束する。 "
"13310-54-債権者団体の代表" = "ええ。契約金の支払いまでは確認できましたが、#nまだ残金が納められておりません。"
"13310-56-ホシノ" = "どうして、それを知ってるの？"
"13310-60-ヒナ" = "……アビドス生徒会長の死は、それだけ大きな事件だったから。"
"13310-61-ヒナ" = "それこそ、ゲヘナの情報部が動くくらいには、ね。"
"13310-63-ヒナ" = "アレは事故よ、小鳥遊ホシノ。"
"13310-64-ヒナ" = "誰のせいでもない。#n強いて言うのなら、天変地異のせい。"
"13310-65-ヒナ" = "だから、あなたが責任を感じる必要はないの。"
"13310-66-ホシノ" = "……私の何を知ってるわけ？"
"13310-67-ホシノ" = "それに、ユメ先輩は会長として……。"
"13310-68-ヒナ" = "……。"
"13310-69-ヒナ" = "知ってるわ、色々と。#nだって、梔子ユメの死を調べたのは、私だもの。"
"13310-70-ホシノ" = "君が……？"
"13310-71-ヒナ" = "当時から、あなたは誰よりも強かった。"
"13310-72-ヒナ" = "情報部がマークしていても、おかしくないでしょう？"
"13310-74-ヒナ" = "けど、だからこそ助けを求められなかった。"
"13310-75-ヒナ" = "あなたより強い人は、そうそういないし。"
"13310-76-ヒナ" = "「一人で守らなくちゃいけない」……。"
"13310-77-ヒナ" = "もちろん、その考えが間違っているとは言わないけれど。"
"13310-79-ヒナ" = "最後まで、あなたは逃げずにアビドスに残った。"
"13310-80-ヒナ" = "……やっぱり、私よりも強い。"
"13310-81-ヒナ" = "それだけ、守りたいものがある証拠ね。"
"13310-82-ホシノ" = "……守りたい、もの。"
"13310-84-ホシノ" = "もう、何やってるんですか！"
"13310-87-？？？" = "お待ちしておりましたよ、暁のホル……"
"13310-88-？？？" = "いや、ホシノさんでしたね。これは失礼。"
"13310-90-ホシノ" = "……黒服の人、今度は何の用なのさ？"
"13310-91-？？？" = "……クックックッ、そうでした。"
"13310-92-？？？" = "まだ[ruby=ここ]キヴォトス[/ruby]での呼び名が決まっていませんでしたね。"
"13310-94-？？？" = "「黒服」ですか……良いでしょう。#n今後はそのように名乗るとします。"
"13310-95-ホシノ" = "……？"
"13310-98-黒服" = "話は聞いております。 "
"13310-99-黒服" = "生徒会長がいない今、副会長であるあなたが借金を返していく、ということでよろしいでしょうか？[ruby=たかなし]小鳥遊[/ruby]ホシノさん？"
"13310-100-黒服" = "それとも……私の提案を受け入れますか？"
"13310-101-ホシノ" = "興味ないね。"
"13310-102-黒服" = "……なぜ？#nあなたがアビドスに残る理由はないはずです。"
"13310-105-黒服" = "アビドス高校を退学し、私共の企業に所属する……その条件を呑んでいただければ、#n今アビドスが背負っている借金の半分近くをこちらで負担しましょう。"
"13310-106-黒服" = "ククッ、ククククッ……さあ、答えを聞きましょう。#nもしイエスならば、こちらにサインを。"
"13310-108-ホシノ" = "……何度も言ったはずだよ、断るって。"
"13310-109-黒服" = "……どうして？"
"13310-110-黒服" = "理由をお聞かせ願えますか？"
"13310-112-ホシノ" = "……私は、何のために。"
"13310-113-ホシノ" = "それでも、列車砲を放置するわけには……。"
"13310-114-ヒナ" = "列車砲は、先生たちが止めてくれるはずだわ。"
"13310-120-ノゾミ" = "うおおおおおおおおおっ！"
"13310-121-ヒカリ" = "うおー。"
"13310-125-アヤネ" = "もう少しで列車砲に追いつきます！"
"13310-126-ノゾミ" = "……って、さすがにアレはヤバくない？"
"13310-127-ノノミ" = "だからこそ、止めなくてはいけません！#nシロコちゃん、アヤネちゃん、セリカちゃん、飛び乗る準備を！"
"13310-128-シロコ" = "ん、分かった。"
"13310-129-セリカ" = "に、にしても速すぎない？"
"13310-131-アロナ" = "先生、列車砲からものすごいエネルギー量を検知しました！"
"13310-132-プラナ" = "検知。地下生活者がホシノさんに接近しています。"
"13310-133-プラナ" = "妨害を試みていますが、状態の共存下にあるため、これ以上は……！"
"13310-134" = "[s1] \"分かった！\"\n[s2] \"何とかして止めないと……！\""
"13310-139-アヤネ" = "衝突、5秒前！"
"13310-140-ノゾミ" = "行くよ！#n準備オッケー？"
"13310-141-ヒカリ" = "列車砲、もったいなーい。"
"13310-146-アヤネ" = "行きます！"
"13310-148-シロコ" = "ん！"
"13310-150-セリカ" = "うわあああっ！"
"13310-158" = "次回;唯一の真実（２）"
