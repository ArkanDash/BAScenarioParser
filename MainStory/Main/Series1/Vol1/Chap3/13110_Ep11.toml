[translation]
"13110-1" = "第11話;明かされる秘密"
"13110-8-アヤネ" = "こちらにお座りください。"
"13110-9-ネフティス幹部" = "ありがとうございます……ここが対策委員会の教室なんですね。#nこんな形で来ることになるとは、思っておりませんでしたが……。"
"13110-14-ネフティス幹部" = "こちらのスオウ監督官は、昨日も申し上げた通りネフティス側の者です。#n今日も私の護衛を務めてくださいました。"
"13110-15-スオウ" = "……とのことだ。"
"13110-19-ネフティス幹部" = "直接お会いするのは、二年ぶりですね。#nお変わりありませんでしたか？"
"13110-20-ノノミ" = "……はい、おかげさまで。"
"13110-21-ネフティス幹部" = "でしたら何よりです。……電話でお伝えしたように、限度額を増やした新しいカードをお持ちしました。"
"13110-22-ノノミ" = "……い、いえ。それは大丈夫です。#n特に困っていませんし……。"
"13110-23-ネフティス幹部" = "……お嬢様、今からでも戻ってくるつもりはありませんか？"
"13110-24-ノノミ" = "戻る、とは……？"
"13110-25-ネフティス幹部" = "もちろん、ハイランダー鉄道学園に。"
"13110-26-ノノミ" = "それは……。"
"13110-28-ホシノ" = "ノノミちゃんが困ってるでしょ。"
"13110-29-シロコ" = "ん、本題に入って。"
"13110-31-ネフティス幹部" = "……はい、失礼しました。"
"13110-32-スオウ" = "これくらい構わないだろう。"
"13110-33-スオウ" = "元々、ネフティスはハイランダーと協力関係を結ぶはずだった。#nにもかかわらず、そこのご令嬢がアビドスに行ったせいで、破綻しかけたわけだ。"
"13110-35-ノノミ" = "……。"
"13110-36-スオウ" = "自分のわがままを聞いてくれた相手に対して、#nあまりにも失礼な態度を取っている自覚は無いのか？"
"13110-42-セリカ" = "我慢して、シロコ先輩！"
"13110-43-シロコ" = "ん……別に、何もするつもりはない。"
"13110-45-スオウ" = "その気なら、かかってくると良い。#n――勝てると思っているのならな。"
"13110-46-ネフティス幹部" = "……スオウさん、あまり挑発なさらないでください。"
"13110-47-スオウ" = "……ふん。"
"13110-51-ネフティス幹部" = "……ご安心を。#n何も、連れ戻すために来たわけではありません。"
"13110-53-アヤネ" = "早く本題に移ってもらっても良いでしょうか？"
"13110-54-ネフティス幹部" = "そう、ですね……。"
"13110-56-ホシノ" = "……。"
"13110-57-ノノミ" = "……。"
"13110-62-ネフティス幹部" = "結論から申しますと、「砂漠横断鉄道」の裏には……。"
"13110-63-ネフティス幹部" = "アビドス生徒会とネフティス間で秘密裏に進めていた、#n「非対称戦力兵器」計画がありました。"
"13110-69-アヤネ" = "……はい！？"
"13110-70-ホシノ" = "生徒会が……？"
"13110-72-シロコ" = "非対称戦力兵器？"
"13110-73-セリカ" = "な、何よそれ……。"
"13110-75-ネフティス幹部" = "その名は――"
"13110-76-スオウ" = "――「列車砲シェマタ」。"
"13110-82-ネフティス幹部" = "シェマタは破壊力も射程距離も、従来の規格と比べ物になりません。#n列車砲……いえ、要塞兵器と言ったほうが良いでしょう。"
"13110-83-ネフティス幹部" = "1トン以上の爆弾を500km先まで飛ばす、超長距離砲。"
"13110-84-ネフティス幹部" = "そんな代物が、鉄道路線の上を走り回る計画です。"
"13110-85-ネフティス幹部" = "話している私でさえ、本当に実現できるのか信じられません。"
"13110-86-ネフティス幹部" = "ですが……もし完成すれば、#n周辺自治区に対して圧倒的な抑止力となることでしょう。"
"13110-89-ホシノ" = "……そんな兵器がねぇ。"
"13110-94-アヤネ" = "い、いったいなぜ……！？"
"13110-95-スオウ" = "簡単じゃないか。"
"13110-96-スオウ" = "借金を返済するため、だろう。"
"13110-97-セリカ" = "……？"
"13110-98-スオウ" = "強力な兵器の使い道なんて、いくらでもあるからな。"
"13110-100-ノノミ" = "そ、そんな……。"
"13110-101-アヤネ" = "「シェマタ」……もしかして名前の由来は、あの生徒会長ですか？"
"13110-103-スオウ" = "よく知っているな。#n……鉄拳政治のシェマタを。"
"13110-105-セリカ" = "……しぇまた？"
"13110-106-アヤネ" = "同時に70人の生徒会長が存在した混乱期を治めて、#nアビドス全盛期を率いた伝説的な生徒会長の二つ名だよ。"
"13110-107-セリカ" = "70人って、意味が分からないんだけど……。"
"13110-109-スオウ" = "……アビドス出身ではない私も知っているくらいだ。"
"13110-110-スオウ" = "全盛期のアビドスは圧倒的な兵力、資金力を誇り、#n全自治区から恐れ、羨まれていた、と。"
"13110-111-スオウ" = "そう考えると、列車砲の名付けは興味深い。"
"13110-112-ホシノ" = "強力な武器さえあれば、借金を返済できると思ったのかな。"
"13110-114-セリカ" = "……ホシノ先輩。"
"13110-115-ノノミ" = "つまり……砂漠横断鉄道はシェマタを隠蔽するために作られたんですか？"
"13110-120-ネフティス幹部" = "お嬢様、それは違います。#nあくまでも非対称戦力兵器計画は、#n鉄道事業が動き出してから話に出たものです。"
"13110-121-ネフティス幹部" = "おそらく、アビドス生徒会に入れ知恵をした者がいたのでしょう。"
"13110-122-ノノミ" = "誰がそのようなことを……！"
"13110-123-ネフティス幹部" = "そこまでは私も……。#nなにせ、詳しく説明されぬまま、秘密裏に進められたものでして……。"
"13110-125-スオウ" = "落ち着いて話を聞くんだな、ご令嬢。#nすでに、この計画は破綻している。"
"13110-126-ネフティス幹部" = "ええ、その通りです。"
"13110-127-ネフティス幹部" = "シェマタほどの常識外れな要塞兵器が、正常に動くはずありません。"
"13110-128-ネフティス幹部" = "結局、エンジンが動くことはありませんでした。#n今も未完成のまま、アビドス砂漠のどこかに放置されています。"
"13110-129-ネフティス幹部" = "そして、計画は中止――"
"13110-130-ネフティス幹部" = "……となっていたのです。#nほんの少し前までは。"
"13110-136-ネフティス幹部" = "最近になって再度シミュレーションをしたところ、#nシェマタの実現性は限りなく高いものとなっていました。"
"13110-137-ネフティス幹部" = "設計者は、数年先を見据えて設計をしていたのか、#nそれともただの偶然なのかは当人しか知り得ませんが……。"
"13110-139-スオウ" = "いずれにせよ、砂漠横断鉄道の重要性が一気に増したわけだ。"
"13110-140-スオウ" = "保有しているだけで抑止力となり得る存在。#n時代を先取りした革新的な技術。"
"13110-141-スオウ" = "これらの事実が明らかとなった以上、行動しない手はない。"
"13110-142-ネフティス幹部" = "「私募ファンド」が砂漠横断鉄道の権利に執着しているのは、#nまさにこれが理由なのです。"
"13110-146-ネフティス幹部" = "鉄道の権利さえ得てしまえば、列車砲も手に入れられますから。"
"13110-147-ネフティス幹部" = "もちろん、私募ファンドも一枚岩ではないでしょうが。"
"13110-150-ネフティス幹部" = "そして、あの者たちだけで債権の購入資金を集めることは叶わず、#nネフティスの力を借りに……。"
"13110-151-ネフティス幹部" = "我々としても、砂漠横断鉄道はできれば保存しておきたかったので、#n非対称戦力兵器計画の再始動を知らずに手を結んでしまいました。"
"13110-154-ホシノ" = "……。"
"13110-155-ネフティス幹部" = "後に計画の全貌を知った頃には、私募ファンドから手を引ける状況になく……。"
"13110-156-ネフティス幹部" = "このまま、あの者たちに列車砲の権利を渡してはいけません。"
"13110-157-ホシノ" = "そうだね。#nそんな兵器が悪党の手に渡ったら、必ず争いの種になる。"
"13110-159-シロコ" = "私たちが先に見つけて壊そう。"
"13110-160-ノノミ" = "列車砲がどこにあるのか、執事さんはご存知ですか？"
"13110-162-ネフティス幹部" = "いえ……申し訳ありません。#n私たちも皆目検討がつかないのです。"
"13110-163-ネフティス幹部" = "この計画自体、極秘事項でしたから。#n当時の書類は見つからず……。"
"13110-168-シロコ" = "そっか……。"
"13110-169-ネフティス幹部" = "今に思うと、私募ファンドが我々に接近した理由は、#n列車砲の位置を知るためでもあったのでしょう。"
"13110-170-ネフティス幹部" = "その企みは叶わなかったわけですが、いずれにせよ時間の問題。"
"13110-171-ネフティス幹部" = "[ruby=Central Control Center]中央管制センターは[/ruby]列車砲の存在も、この計画も知らないはずです。#nしかし、工事が再開されれば、近いうちに見つけてしまうでしょう。"
"13110-172-ネフティス幹部" = "……私募ファンドは、正式な契約をもって列車砲の権利を手に入れようとしています。"
"13110-173-アヤネ" = "正式な契約、ですか……？"
"13110-174-ネフティス幹部" = "ええ。#n権利関係について、何度も尋ねてきましたので。"
"13110-175-ネフティス幹部" = "実際、アビドス生徒会とネフティスだけでなく、#n設計者も一部権利を有しているため、複雑になっていますから……。"
"13110-176-ネフティス幹部" = "事業家としては、優れているのでしょう。#n権利関係を明白にしておけば、あとから生じるトラブルを避けられますし。"
"13110-177-アヤネ" = "……カイザーは列車砲の存在を知らなかったんですか？"
"13110-178-ネフティス幹部" = "どうでしょう。仮に知っていたとしても、関心が薄いのだと思います。カイザープレジデントは、サンクトゥムタワーの方に関心があると話に聞いていますので。"
"13110-179-ネフティス幹部" = "真偽の定かではない噂に振り回されるくらいなら、#n債権を売って資金を集めておくのが良いと判断したのかと……。"
"13110-183-ネフティス幹部" = "……しかし、誰にも予想できなかった事態が発生しました。"
"13110-187-ネフティス幹部" = "アビドス生徒会長とネフティスの間で交わされた契約書が発見されたのです。"
"13110-189-ネフティス幹部" = "経緯までは分かりませんが……#nこれがある以上、列車砲の権利は私募ファンドのものになりません。"
"13110-190-ホシノ" = "契約書について、ネフティスは本当に何も知らないの？"
"13110-191-ホシノ" = "それと、ユメ先輩の身に、何が起きたのかも……！"
"13110-193-ノノミ" = "……ホシノ先輩。"
"13110-198-ネフティス幹部" = "……申し訳ありません。#n私たちも契約書の存在を知りませんでしたので……。"
"13110-199-ホシノ" = "……。"
"13110-200-ネフティス幹部" = "当時の状況に鑑みると、#nおそらく破産を避けるために少しでも現金が欲しかったのでしょう。"
"13110-201-ネフティス幹部" = "その過程で売られた権利のひとつが、砂漠横断鉄道だったというだけかと。"
"13110-202-ホシノ" = "……。 "
"13110-203-ネフティス幹部" = "とにかく、私募ファンドは先に契約書の問題を解決しようとするでしょう。"
"13110-204-ネフティス幹部" = "あの者たちにとって、それが最優先事項のはずですから。"
"13110-209-アヤネ" = "……明日の12時に、アビドス中央駅旧庁舎で行なわれる総会ですね。"
"13110-210-ネフティス幹部" = "ええ、そうです。"
"13110-211-ネフティス幹部" = "生徒会の代表者が総会で契約を破棄するか、#n欠席した時点で契約は無効に。#nそして、権利はネフティスに渡ります。"
"13110-215-ノノミ" = "ということは……！？"
"13110-216-ネフティス幹部" = "……いえ、お嬢様。#nネフティスが権利を完全に得るわけではありません。"
"13110-217-ネフティス幹部" = "合同で債権を購入した以上、持ち分は互いに発生します。"
"13110-222-ホシノ" = "……それじゃ、残った方法はひとつしかないね。"
"13110-228-ホシノ" = "私が総会に参加して、契約継続の意思表示をするよ。"
"13110-229-ネフティス幹部" = "……そうしていただけるのなら、私としても幸いです。"
"13110-230-ホシノ" = "お金は少しずつ支払うしかないだろうけど、#nとりあえず手出しできなくなるなら安心だね。"
"13110-231-ホシノ" = "その間に砂漠中を探し回って、列車砲を見つければ良いだけじゃん？"
"13110-233-セリカ" = "なんだ、思ったより簡単で拍子抜けだわ。"
"13110-234-アヤネ" = "それは――"
"13110-236-スオウ" = "それはどうだろうな。"
"13110-241-スオウ" = "私募ファンドは、あんたらの出席を妨害するに決まっている。"
"13110-242-アヤネ" = "いくら何でも、それは……。"
"13110-243-スオウ" = "多少考えれば分かると思うが？#n数百名規模の兵士で旧庁舎を封鎖し、入ってこられないようにするはずだ。"
"13110-244-セリカ" = "……そんな！"
"13110-249-スオウ" = "すでに動き出しているだろうな。#n……ありとあらゆる手段を駆使して。"
"13110-251" = "中央駅旧庁舎東側地域"
"13110-256-私債労働組合長" = "……あなたたちには、あちらを任せましたよ。"
"13110-258-ふわふわヘルメット団" = "行くぞ、仕事だー！！"
"13110-264" = "中央駅旧庁舎・西側広場"
"13110-270-押収品競売組合長" = "よし、ヘリも到着したか。"
"13110-271-押収品競売組合長" = "戦車は指定地点を死守しろ。#nマーケットガードは封鎖区域を徹底的に守れ。#nネズミ一匹通すんじゃないぞ。"
"13110-276" = "中央駅旧庁舎・南側広場"
"13110-278-質屋連合長" = "……計画は聞いているでしょうね？"
"13110-280-黒亀組の組員A" = "ああ、もらった金の分だけ働いてやる。"
"13110-286-質屋連合長" = "列車砲……あのゲヘナの雷帝が残した遺産ですからね。#nくくっ、必ず手に入れてみせますよ。"
"13110-288" = "中央駅旧庁舎・北側広場"
"13110-293-ZK社長" = "ここにバリケードを積むのだ。"
"13110-297-ZK社長" = "ショベルカー、ブルドーザー、フォークレーン……#n動員できるものは、すべて持ってきなさい。"
"13110-307-債権者団体の代表" = "……明日の12時までに来られなければ、列車砲は私たちの物に。"
"13110-308-債権者団体の代表" = "ふっふっふ……精々、頑張ることですね。"
"13110-310-セリカ" = "えっ！？"
"13110-311-ホシノ" = "……なるほどねぇ。"
"13110-312-シロコ" = "うーん……。"
"13110-313-アヤネ" = "それだけの規模に対して、私たちは……。"
"13110-315-セリカ" = "せ、先生さえいれば、なんとかなるんじゃない？"
"13110-316-スオウ" = "「シャーレ」の先生は、#nどんな大義名分を掲げて私的な取引に介入するんだ？"
"13110-320-セリカ" = "妨害してるあいつらが悪いのに、#n先生に助けてもらって何がいけないの！"
"13110-322-ホシノ" = "……セリカちゃん、考えてみて。"
"13110-324-セリカ" = "どういうこと？"
"13110-325-ホシノ" = "総会が開かれる場所は、中央駅旧庁舎。#nあそこは、砂漠横断鉄道の路線がいくつも交差する中心部。"
"13110-326-ノノミ" = "すでに鉄道の権利は私募ファンドにありますから……。"
"13110-327-ホシノ" = "あいつらは、自分が所有している場所を守っているだけ。"
"13110-328-セリカ" = "そ、そんな言い分が許されるの！？"
"13110-334-スオウ" = "ところで、総会に出席するのは――君たち[ruby=・   ・   ・   ・   ・]対策委員会[/ruby]なのか？"
"13110-336-ホシノ" = "……？"
"13110-337-シロコ" = "全員で行く。"
"13110-342-スオウ" = "聞き方が悪かったな。"
"13110-343-スオウ" = "君たちは「アビドス生徒会」として出席するのか、#nそれとも「対策委員会」として出席するのか、という話だ。"
"13110-344-アヤネ" = "そ、それは……。"
"13110-345-スオウ" = "[ruby=くちなし]梔子[/ruby]ユメが結んだ契約書上、名義人はアビドス生徒会になっている。#nしかし、それは今となっては名前だけが残っているのだろう？"
"13110-346-スオウ" = "だとすれば、まずは生徒会の立場を明確にする必要があるんじゃないのか？"
"13110-347-スオウ" = "と言っても、総会の場にたどり着けなければ、#nこんな議論をしたところで無意味だがな。"
"13110-348-ホシノ" = "……。 "
"13110-350-シロコ" = "……強行突破しよう。"
"13110-351-セリカ" = "だから、それが難しいから困ってるんでしょ。"
"13110-353-ノノミ" = "どうにかして、ほかの方法を探さないと……。"
"13110-355-ネフティス幹部" = "……方法ならあります、お嬢様。"
"13110-363-ネフティス幹部" = "それも、皆様が正面から戦うよりも、遥かに簡単な方法が。#nお嬢様がハイランダーに入学して、生徒会長になってくだされば良いのです。"
"13110-364-ノノミ" = "……はい！？"
"13110-370-ネフティス幹部" = "「ネフティス」の幹部として権力を行使すれば、この契約を取り消せます。"
"13110-371-ネフティス幹部" = "ネフティス、ハイランダー、私募ファンド……三勢力のうち、二つの勢力が反対すれば、残る私募ファンドはどうすることもできません。"
"13110-372-ノノミ" = "……で、でも。"
"13110-373-ノノミ" = "そうすると、私はアビドスから……。"
"13110-375-ホシノ" = "却下ー。"
"13110-376-セリカ" = "なに訳の分からないこと言ってるのよ！#nノノミ先輩が犠牲になる必要なんてない！"
"13110-381-ノノミ" = "……執事さん。#nその方法はお断りします。"
"13110-382-ノノミ" = "私はアビドスを去りたくありません！"
"13110-383-ネフティス幹部" = "……そう仰ると、思っておりました。"
