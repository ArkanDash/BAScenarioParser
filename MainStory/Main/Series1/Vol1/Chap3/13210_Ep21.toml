"13210-130-ホシノ" = "はぁ……。"
"13210-131-ユメ" = "ダメ、かな……？"
"13210-132-ホシノ" = "まったく、ユメ先輩は……。"
"13210-133-ユメ" = "は、はぅ……。"
"13210-138-ホシノ" = "なんでもっと早く言わないんですか！#nすぐ行きますよ！"
"13210-139-ユメ" = "ホシノちゃん！"
"13210-141-ホシノ" = "今度こそお宝を見つけましょう！"
"13210-146-ユメ" = "ほ、ホシノちゃん待って。#n先に着替えないと！"
"13210-149-ホシノ" = "あっ！"
"13210-160-ホシノ" = "ユメ先輩、何も見つかりませんよ。"
"13210-161-ユメ" = "……こっちもハズレみたい、うぅ。"
"13210-165-ホシノ" = "……。"
"13210-169" = "アビドス砂漠閉鎖地区・セクター35-9"
"13210-171-ホシノ" = "……変わらないな。"
"13210-174-ノノミ" = "……囚われているんだと思います。"
"13210-175-セリカ" = "それって……。"
