[translation]
"13210-1" = "第21話;二度目の追跡"
"13210-2-セリカ" = "みんな、大丈夫？"
"13210-3-債権者団体の代表" = "お、おかげで助かりました……。"
"13210-5-質屋連合長" = "これ以上は無理です。手を引きましょう。"
"13210-6-ZK社長" = "アビドスに手を出そうとしたのが間違っていたんだ……。"
"13210-8-押収品競売組合長" = "まさか、こうなるとは思いも……。"
"13210-9-私債労働組合長" = "最初から関わっていなければ……。"
"13210-11-アヤネ" = "プレジデントは、じきに兵力を送り込んでくるはずです。#n早ければ、今日の夕方にでも……。"
"13210-12-アヤネ" = "アビドスが戦場と化す前に、皆さんは逃げてください。"
"13210-13-債権者団体の代表" = "わ、分かりました……。"
"13210-16-ネフティス幹部" = "お嬢様……。"
"13210-17-ノノミ" = "執事さん、大丈夫ですか……？"
"13210-18-ネフティス幹部" = "わ、私はなんてことを……。"
"13210-19-ノノミ" = "アビドスは、すぐ戦場になってしまうでしょう。"
"13210-20-ネフティス幹部" = "こんな、はずじゃ……。"
"13210-21-ノノミ" = "分かっています、執事さん。"
"13210-22-ネフティス幹部" = "……お嬢様。"
"13210-23-ノノミ" = "手段こそ違いましたが、#n執事さんもアビドスの復興を願っていたんですよね。"
"13210-24-ネフティス幹部" = "……。"
"13210-25-ノノミ" = "結果はどうあれ……。"
"13210-26-ネフティス幹部" = "……申し訳、ありません。"
"13210-27-ネフティス幹部" = "列車砲の存在を知ってからというもの、#nそれで頭がいっぱいになってしまい……。"
"13210-28-ネフティス幹部" = "アレさえあれば、また過去の栄光を取り戻せる、と。"
"13210-29-ネフティス幹部" = "ネフティスは、再びアビドスに戻れるはずだ、と……。"
"13210-30-ノノミ" = "私から言えることは、何もありません。"
"13210-31-ネフティス幹部" = "……。"
"13210-32-ノノミ" = "では執事さん、お元気で。"
"13210-33-ネフティス幹部" = "ど、どこに行くのですか、お嬢様！"
"13210-34-ノノミ" = "ホシノ先輩を止めに行きます。"
"13210-35-ノノミ" = "このままでは、列車砲を破壊した責任を一人で負って、#n退学するつもりでしょうから。"
"13210-36-ネフティス幹部" = "し、しかしどうやって……？"
"13210-37-ノノミ" = "……まだ、何も。ですが、みんなで考えれば、きっとうまくいきます。"
"13210-41-ネフティス幹部" = "……。"
"13210-43-シロコ" = "また止められなかった。#n私がもっと強かったら……。"
"13210-44-セリカ" = "だから、シロコ先輩のせいじゃないって。#nホシノ先輩が強すぎるんだよ。"
"13210-45-ノノミ" = "……元気出してください、シロコちゃん。"
"13210-46-シロコ" = "……。"
"13210-47-アヤネ" = "このままでは、ホシノ先輩がいなくなってしまいます。"
"13210-48-アヤネ" = "すべて独断の犯行だと証言すれば……。"
"13210-49-アヤネ" = "何か問題が発生した時、アビドスが責任を問われることはないから……。"
"13210-50-セリカ" = "ちょっと変だったわよね、先輩。"
"13210-51-セリカ" = "うまく言えないけど、追い詰められてるような。"
"13210-52-アヤネ" = "いつもの先輩なら、みんなで解決策を考えてたはずなのに……。"
"13210-54-シロコ" = "……あの時と似てる。"
"13210-59-ノノミ" = "ホシノ先輩は、列車砲の破壊をユメ会長の意志だと思っているみたいです。"
"13210-60-セリカ" = "えっ、ユメ会長はそんなこと言ってないはずよね？"
"13210-61-シロコ" = "うん。でも、ホシノ先輩は「ユメ先輩ならこうするはず」って。"
"13210-62-セリカ" = "どうして……。"
"13210-64-ノノミ" = "これは、私の想像でしかありませんが……。"
"13210-65-ノノミ" = "おそらく……。"
"13210-74-ユメ" = "今日は宝探しをするよ！"
"13210-75-ユメ" = "お～い、ホシノちゃん……？"
"13210-81-ホシノ" = "あっ、先輩。今度はどうしたんですか？"
"13210-82-ユメ" = "それはね……って、ホシノちゃんこそどうしたの？"
"13210-83-ホシノ" = "これは……。"
"13210-84-ユメ" = "もしかして、ついに自分のことをお魚さんだと勘違いしちゃったとか……。"
"13210-88-ホシノ" = "そんなわけないじゃないですか！"
"13210-89-ホシノ" = "水道の修理をしてたら濡れちゃったので、着替えただけです！"
"13210-90-ユメ" = "あっ、グラウンドのところ？#n直してくれたんだね。"
"13210-91-ホシノ" = "いえ、まだ直せてません。#n思ったより難しくて……。"
"13210-92-ユメ" = "ふふっ、ホシノちゃんにもできないことがあるんだ。"
"13210-93-ユメ" = "不器用なおじさんみたいで、ちょっと可愛いね。"
"13210-94-ホシノ" = "そ、"
"13210-95-ホシノ" = "それより宝探しがどうしたんです？"
"13210-97-ユメ" = "あっ、そうなの。見て見て、ホシノちゃん！"
"13210-101-ユメ" = "すごい情報を手に入れたんだ！"
"13210-102-ホシノ" = "先輩の言う「すごい」は、もう信用できないんですけど……。"
"13210-103-ユメ" = "今度こそ大丈夫だから、信じて！"
"13210-104-ホシノ" = "また騙されてないですよね？"
"13210-105-ホシノ" = "「生徒会の谷」……？"
"13210-106-ユメ" = "昔、アビドスの生徒会長が作った展示館があるらしいの！"
"13210-107-ユメ" = "貴重な物が、いーっぱい展示されてるんだって！"
"13210-108-ホシノ" = "もし本当だとしても、#nとっくに売り払ったか盗まれてると思いますよ。"
"13210-109-ユメ" = "ふっふっふ、そう思うよね？"
"13210-110-ユメ" = "でもここは、一般に公開されてない秘密の場所にあるんだって。"
"13210-112-ホシノ" = "つまり……。"
"13210-113-ユメ" = "学校が経営難で売っちゃってたら仕方ないけど、#n少なくとも盗まれてる可能性は少ないよ！"
"13210-114-ホシノ" = "だから……探しに行こう、と？"
"13210-115-ユメ" = "うん！"
"13210-116-ホシノ" = "……誰も場所を知らないのに、どうやって探すんですか？"
"13210-117-ユメ" = "ふふん！"
