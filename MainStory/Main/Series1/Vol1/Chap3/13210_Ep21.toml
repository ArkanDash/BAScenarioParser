"13210-119-ホシノ" = "……何ですか、これ。"
"13210-123-ホシノ" = "黒く塗りつぶされてるところが多くて、全然読めませんけど。"
"13210-124-ユメ" = "ほら、ここ見て。"
"13210-125-ホシノ" = "「アビドス砂漠閉鎖地区セクター35-9」？"
