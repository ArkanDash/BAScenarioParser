"13210-260-ネフティス幹部" = "実は「生徒会の谷」に繋がる分岐駅になっています。"
"13210-261-ネフティス幹部" = "お嬢様のカードを使って権限にアクセスすれば、#n列車のシステムを再起動できるはずです。"
"13210-262-アヤネ" = "ということは……。"
"13210-263-ノノミ" = "執事さん……。"
