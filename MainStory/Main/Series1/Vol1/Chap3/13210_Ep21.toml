"13210-270-ネフティス幹部" = "……いえ。"
"13210-271-ネフティス幹部" = "お嬢様、本当に申し訳ありませんでした。"
"13210-272-ノノミ" = "……執事さん。"
"13210-273-ネフティス幹部" = "どうか急いでください。#nホシノさんもスオウさんも、そこに向かったはずです。"
"13210-274-ノノミ" = "はい……。"
"13210-275-ノノミ" = "ところで……スオウさんは、いったい何者なのでしょうか？"
"13210-276-ノノミ" = "最初はハイランダーの方だと思っていました。#nですが、ネフティスにも私募ファンドにも所属していたようで、#n最終的にはカイザーなのかと思えば、それも裏切り……。"
"13210-277-ノノミ" = "そのうえ、どうしてホシノ先輩に目を……。"
"13210-281-ネフティス幹部" = "元[ruby=あさぎり]々朝霧ス[/ruby]オウは、特定の学園に所属せずふらついていた不良でした。"
