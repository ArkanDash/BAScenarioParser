"13210-205-シロコ" = "うーん……。"
"13210-206-ノノミ" = "ホシノ先輩は知っているようでしたが……。"
"13210-208-ネフティス幹部" = "……お嬢様。"
"13210-209-アヤネ" = "……？"
"13210-210-ノノミ" = "どうかしま――"
"13210-216-ノノミ" = "もしかして執事さんは、どこにあるのか知っているのですか！？"
"13210-217-ネフティス幹部" = "「アビドス砂漠閉鎖地区セクター35-9」と、プレジデントは言っていました。"
"13210-218-ネフティス幹部" = "おそらく、ここから480kmほど離れた岩石砂漠地帯のことでしょう。"
"13210-223-ネフティス幹部" = "そこには砂漠横断鉄道の駅があります。"
"13210-226-ホシノ" = "……開いてる。"
"13210-237-ホシノ" = "……管制システムが動いてる。"
"13210-238-ホシノ" = "ただのガラクタだと思ってたけど……。"
"13210-242-ホシノ" = "管理者権限、「[ruby=いざよい]十六夜[/ruby]ノノミ」……。"
