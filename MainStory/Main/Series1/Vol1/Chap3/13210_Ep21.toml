"13210-244-ホシノ" = "ずっと使われてなかっただけで、機能はそのままだったんだ。"
"13210-245-ホシノ" = "目的地は……「生徒会の谷」っと。"
"13210-246-ホシノ" = "少し前に発車した電車は、#nあの眼帯ちゃんが乗っていったやつだろうね。"
