"13210-285-ネフティス幹部" = "気づけば、監督官の座に。"
"13210-286-ネフティス幹部" = "彼女とは、今回の一件で久しぶりに連絡を取ったのです。"
"13210-291-ネフティス幹部" = "……本当は何者なのか、何を考えているのか、#nそれは私にも分かりません。"
"13210-292-ノノミ" = "生徒会の谷に行けば……。"
"13210-293-ネフティス幹部" = "はい、おそらく。#nですが、追いつくためには高速鉄道でも使用しなければなりません。"
"13210-295-アヤネ" = "……そこが問題になってきますね。"
"13210-296-アヤネ" = "どうすれば……。"
"13210-302-？？？" = "パヒャヒャッ、何だか助けが必要そうじゃん？"
"13210-311-ヒカリ" = "ヒーローさんじょー。"
"13210-313-アヤネ" = "あなたたちは……！"
