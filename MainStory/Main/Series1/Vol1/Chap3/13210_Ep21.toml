"13210-317-ノゾミ" = "そうそう。#n鉄道のことなら、私たちにも関係あるし。"
"13210-318-ヒカリ" = "そーそー、被害者だしー。"
"13210-319-ノゾミ" = "連れてってやるよ！"
"13210-321-セリカ" = "気が利くじゃない！"
"13210-322-ノノミ" = "うんうん☆#nありがとうございます、ハイランダーの皆さん！"
"13210-323-シロコ" = "ん、ありがとう。"
"13210-325-ヒカリ" = "うぉー、複線ドリフト決めちゃうよー。"
"13210-326-ノゾミ" = "あははっ！#n危ないからちょっとだけにしときなよ？"
"13210-328-アヤネ" = "だ、大丈夫なんですかね？#n安全面的に……。"
