[translation]
"13080-1" = "第8話;アビドス生徒会（１）"
"13080-5" = "[ns1] 集めた資料を整理する。\n[ns2] \"……これで準備は完了かな。\""
"13080-11-プラナ" = "待機中。#n先生、必要なものはありませんか？"
"13080-12" = "[s] \"ありがとう、プラナ。アロナは？\""
"13080-13-プラナ" = "アロナ先輩なら、寝ています。寝坊助です。#n何か仕事があれば、私に命令をしてください。"
"13080-14" = "[s3] \"それじゃあ……。\"\n[s4] プラナにいくつか頼み事をする。"
"13080-19-プラナ" = "理解。#nすぐに処理します。"
"13080-20-プラナ" = "それより、先生は少しでも寝るべきです。#n徹夜は健康に良くありません。"
"13080-21" = "[s] \"でも、そろそろ出発しないといけないんだ。\""
"13080-22-プラナ" = "分かりました。#nでは、また何かあったら連絡をします。"
"13080-28-プラナ" = "異常発生。"
"13080-33" = "[ns] \"プラナ、どうしたの？\""
"13080-46-地下生活者" = "……。"
"13080-47-地下生活者" = "なぜだ？"
"13080-48-地下生活者" = "小生の計算が間違っていたのか……？"
"13080-51" = "[ns] \"な、何が起きたの！？\""
"13080-53" = "[ns] \"この衝撃は！？\" "
"13080-56-アロナ" = "先生、先生！"
"13080-57" = "[s] \"アロナ、状況を教えてくれる？\""
"13080-60-アロナ" = "シャーレが爆発しました！"
"13080-61-アロナ" = "ですが、それよりもプラナちゃんが……！"
"13080-67-プラナ" = "先生の保護は、"
"13080-68-プラナ" = "間に合いました……。"
"13080-73-アロナ" = "ぷ、プラナちゃん！？"
"13080-75-プラナ" = "先生が傷付く姿は、もう二度と……。"
"13080-76" = "[s] \"プラナ、大丈夫！？\""
"13080-77-アロナ" = "気を失っているだけみたいです！"
"13080-88" = "[ns] \"……！\""
"13080-96" = "[ns] （意識が……） "
"13080-103-地下生活者" = "……なるほど。 "
"13080-104-地下生活者" = "私の計算以上ですね。"
"13080-105-地下生活者" = "あの不可解な奇跡を起こす[ruby=ARK]聖櫃[/ruby]は、#nジェリコの城壁でさえ崩した兵器だというのに、過小評価していました。"
"13080-106-地下生活者" = "……ですが、構いません。#n攻略法を修正すれば良いだけのこと。"
"13080-110-地下生活者" = "攻略法、その2……「肉体には物理的限界がある」。#nこの前提条件は、崩れていないのですから。"
"13080-111-地下生活者" = "最も重要な物語は、先生が関与できない場所で進行されています。#n目を覚ました頃には、すでに手遅れ。"
"13080-113-地下生活者" = "では、ゲームを続けましょう。"
"13080-121-アヤネ" = "……先生に連絡がつきません。"
"13080-125-シロコ" = "うーん。"
"13080-126-ノノミ" = "何かあったのでしょうか？"
"13080-127-セリカ" = "寝てるんじゃないの？"
"13080-129-アヤネ" = "今日に限って、それはないと思うけど……。"
"13080-130-シロコ" = "ホシノ先輩は？"
"13080-134-アヤネ" = "それが、先輩も音沙汰がありません。"
"13080-136-セリカ" = "まったく、何してるのよ。"
"13080-137-ノノミ" = "……。"
"13080-141-ホシノ" = "……もう朝か。 "
"13080-142-ホシノ" = "そろそろ戻らないと。#n先生もシロコちゃんも……みんな、待ってるはずだし。"
"13080-143-ホシノ" = "最近のシロコちゃんは、どんどん強くなってきて大変だよ。#nあっという間に、勝てなくなっちゃうのかな。"
"13080-144-ホシノ" = "はぁ、おじさんも歳には勝てないねぇ。"
"13080-149-ホシノ" = "ここは変わらないなぁ。"
"13080-150-ホシノ" = "まあ、もう捨てられた街だし、それもそっか。"
"13080-154-？？？" = "お願いします！どうか署名を！"
"13080-168-ユメ" = "アビドスの環境を改善するために、署名を集めています！"
"13080-169-ユメ" = "皆さんの協力が必要なんです！"
"13080-171-アビドス市民A" = "……チッ。"
"13080-175-アビドス市民B" = "今さら何かしたところで……。"
"13080-179-ユメ" = "あ、あの、すみません。#nよければ、こちらに署名を……。"
"13080-180-アビドス市民C" = "いよいよネフティスまで自治区を去るっていうのに、#n署名が何の役に立つんだよ！"
"13080-192-ユメ" = "あっ！ちょ、ちょっと待って！"
"13080-198-ユメ" = "えへへ……最近入学してくれた子だよね？#nえっと、たしか名前は……。"
"13080-204-ユメ" = "……ホシノちゃん、だよね！#nあれ、違った？"
"13080-205-ユメ" = "ま、待って、ホシノちゃん！"
"13080-214-ホシノ" = "はあ……。 "
"13080-219-ユメ" = "アビドス治安維持強化方針の説明会を開催します！#n皆さん、どうかご参加ください！"
"13080-220-ユメ" = "説明会のプリントです！#n目を通していただくだけでも……。"
"13080-227-ユメ" = "……あっ、ホシノちゃん！"
"13080-233-ユメ" = "待って！"
"13080-237-ユメ" = "……ひんっ！？"
"13080-245-ホシノ" = "……はぁ。"
"13080-251-ユメ" = "あ、ありがとう。"
"13080-252-ユメ" = "わっ、握手しちゃった……。"
"13080-253-ホシノ" = "どうして私を知ってるんですか？"
"13080-254-ユメ" = "もちろん！すっごく強い新入生がいるって、噂になってるよ？#n……あと、ちょっぴりイジワルだとか何とか。"
"13080-255-ユメ" = "って、私が一人で言ってるだけなんだけど……。"
"13080-256-ユメ" = "この前、暴力集団の喧嘩を止めたのって、ホシノちゃんだよね？"
"13080-257-ユメ" = "アビドスのために、ありがとう。#n生徒会長として、お礼がしたかったの。"
"13080-261-ホシノ" = "……さっさと帰ったほうが良いですよ[ruby=くちなし]、梔子ユ[/ruby]メ会長。#n暗くなったら、ここは危険なので。"
"13080-262-ユメ" = "でも、まだやることが……。"
"13080-269-ユメ" = "……あれ？ "
"13080-270-ユメ" = "私、ホシノちゃんに名前教えたっけ……？"
"13080-282-ユメ" = "もうこんな時間になっちゃった。"
"13080-283-ユメ" = "署名は全然集まってないし、プリントはこんなに余ってるし……。"
"13080-284-ユメ" = "今週中に署名を集めないといけないのに。"
"13080-288-ユメ" = "……そうだ、早く帰るようホシノちゃんに言われたんだった。"
"13080-298-チンピラ1" = "なんだコイツ？"
"13080-300-ユメ" = "ひゃうっ。"
"13080-305-チンピラ2" = "説明会、だぁ？#nお前、もしかしてアビドスの生徒だな？"
"13080-306-チンピラ1" = "おい、分かってんのか？#nお前たちが金を払わないせいで、上からとばっちりを受けたんだぞ！"
"13080-311-ユメ" = "わ、私は、その……。"
"13080-314-チンピラ2" = "どうやって責任取るつもりだよ！#nあぁん！？"
"13080-320-ユメ" = "しょ、署名用紙が……。"
"13080-322-チンピラ1" = "んだよ、この邪魔なゴミは。"
"13080-326-ユメ" = "や、やめてくださいっ！"
"13080-329-チンピラ2" = "知るかよ！"
"13080-330-チンピラ1" = "あーあ、気分わりーな。#nちょっとツラ貸せや。"
"13080-362-ユメ" = "ほ、ホシノちゃん……？"
"13080-364-ホシノ" = "だから言ったじゃないですか！#n早く帰ってください、って！"
"13080-365-ホシノ" = "なんで帰らなかったんですか？#nバカなんですか！？"
"13080-370-ユメ" = "ご、ごめんなさい……。"
"13080-371-ホシノ" = "今のアビドスは無法地帯なんですよ！？"
"13080-372-ユメ" = "……。"
"13080-381-チンピラ1" = "お、ウチらに逆らうつもりか？"
"13080-382-チンピラ2" = "その顔、覚えたからな！"
"13080-387-ホシノ" = "はあ……。"
"13080-388-ホシノ" = "……怪我してませんか、梔子ユメ会長。"
"13080-389-ユメ" = "う、うん……ありがとう、ホシノちゃん。"
"13080-390-ホシノ" = "どうして戦わなかったんですか？"
"13080-391-ユメ" = "戦って問題を解決しても、それは次の争いの火種になるだけ……。"
"13080-392-ユメ" = "それに、何でも武力で解決するようになったら、#nいつか自分を見失っちゃうと思うの……。"
"13080-393-ホシノ" = "……何を言ってるのか分かりません。"
"13080-394-ホシノ" = "じゃあ、どうやって解決するんですか？"
"13080-395-ユメ" = "……。"
"13080-399-ホシノ" = "……早く帰ってください。#nあいつらが仲間を連れてくるかもしれないですから。"
"13080-404-ユメ" = "ま、待って、ホシノちゃん！"
"13080-415-ユメ" = "住民の皆さん、"
"13080-416-ユメ" = "署名をお願いします！"
"13080-417-ホシノ" = "……。"
"13080-421-ユメ" = "み、皆さんの力が必要なんです……！"
"13080-422-ユメ" = "……あれ。#nホシノちゃん、今日はどうしたの？"
"13080-423-ホシノ" = "昨日の奴らが、仕返しに来るかもしれないと思ったので。"
"13080-424-ユメ" = "私を守るために来てくれたの？"
"13080-425-ホシノ" = "いえ、会長に釣られたところをまとめて倒したほうが楽かなと。"
"13080-426-ユメ" = "餌ってこと！？"
"13080-427-ホシノ" = "……アビドス生徒会を狙う人たちは多いですから。"
"13080-431-ユメ" = "そっかそっか～。"
"13080-435-ユメ" = "ホシノちゃんは素直じゃないんだね！#n実は、心配してくれてるんでしょう？"
"13080-436-ホシノ" = "だ、誰が心配なんか……！"
"13080-437-ユメ" = "ホシノちゃん、いつも顔をしかめてるけど……。"
"13080-441-ユメ" = "こんなに可愛いんだから、もったいないよ？"
"13080-442-ホシノ" = "な、なに言ってるんですか！#n余計なこと言うなら、もう知りませんよ！"
"13080-443-ユメ" = "ふふっ……ありがとう。ホシノちゃん。 "
"13080-444-ユメ" = "こんなに頼もしい後輩が力になってくれるなんて、心強いよ……！"
"13080-445-ホシノ" = "良いから集中してください。"
"13080-446-ホシノ" = "それと、生徒会の仕事を手伝うのは、これが最初で最後です。"
"13080-447-ユメ" = "ふふっ、ありがとう。#nでも、梔子ユメ会長じゃなくてユメ先輩って呼んでくれたら、#nも～っと嬉しいかも、みたいな……。"
"13080-451-ホシノ" = "……私の話、聞いてましたか？"
"13080-455" = "次回;アビドス生徒会（２）"
