"13270-81-ホシノ" = "ユメ先輩は、どんな時も生徒会長として頑張ってくれてたんだ。"
"13270-84-ホシノ" = "優しくて、心配性で、何があっても私を抱きしめてくれてた。"
"13270-85-ホシノ" = "でも、そんなユメ先輩が残したものを、私は何も守れなかった。#nいつも不満を漏らして、怒ってばかり。"
