"13270-274-プラナ" = "混沌の領域から、こちらの世界に介入できるようです。"
"13270-275-アロナ" = "じゃあ、シャーレを爆破したのも……？"
"13270-276-プラナ" = "はい。ですが、おそらく私たちの存在はイレギュラーなのでしょう。"
