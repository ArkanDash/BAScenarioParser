"13270-213-地下生活者" = "これこそ、紙一重の勝負。"
"13270-214-地下生活者" = "[USERNAME]先生、あなたは今まで戦っていたどの相手よりも手強いです。"
"13270-215-地下生活者" = "しかし、もう奇跡は起きません。#nあなたの力は無効化されました。"
