[translation]
"13250-1" = "第25話;最後の戦い（１）"
"13250-6-スオウ" = "がはっ……！"
"13250-9-スオウ" = "げほっ、げほっ……！"
"13250-10-スオウ" = "ま、まだだ……うぐっ。"
"13250-11-ホシノ" = "……。"
"13250-12-スオウ" = "なぜだ……なぜ、勝てない。"
"13250-15-スオウ" = "アビドスを否定するには、力が足りなかったか。"
"13250-16-スオウ" = "あれだけ砂漠を彷徨ったというのに、私は……。"
"13250-19-ホシノ" = "……何がしたかったの？"
"13250-20-スオウ" = "はぁ、はぁっ……。"
"13250-21-ホシノ" = "私と戦うためだとか言ってたよね。#nどこかで会ったことあるっけ？"
"13250-22-スオウ" = "……。"
"13250-23-ホシノ" = "……ちなみに、手帳の話は本当？"
"13250-24-スオウ" = "手帳……？#nああ、生徒会長のアレか。"
"13250-27-スオウ" = "まさか、あんな物が本当にあると思ったのか？#n二年も見つかっていないのだろう？"
"13250-33-スオウ" = "……いつまでも過去に囚われているとは、愚かだな。"
"13250-45-スオウ" = "私は……。"
"13250-46-スオウ" = "最強にならなくてはいけない。"
"13250-47-スオウ" = "……この呪われた地とは、別れを告げて。"
"13250-52-ホシノ" = "最強？"
"13250-53-ホシノ" = "……ま、良いや。もう終わりだよね？"
"13250-57-ホシノ" = "それじゃ、列車砲は破壊させてもら……"
"13250-59-？？？" = "そうはさせないから！"
"13250-63-ホシノ" = "あれ……？"
"13250-68-シロコ" = "おかえり、ホシノ先輩。"
"13250-70-ホシノ" = "また、その言葉を聞く日が来るとはねぇ……。"
"13250-71-ホシノ" = "けどまさか、こんなに早く来るとは思ってなかったよ。"
"13250-72" = "[s] \"ホシノ、止めに来たよ。\""
"13250-73-ホシノ" = "先生までいるし、手強そうだなぁ。"
"13250-78-ホシノ" = "でも、どうして？#n列車砲を破壊しないと、アビドスは……いや、キヴォトスは大混乱に陥る。"
"13250-79-ノノミ" = "それでも、勝手に学校を辞めないでください！"
"13250-80-ホシノ" = "後輩に迷惑をかけるわけにはいかないからね。"
"13250-81-セリカ" = "誰が頼んだのよ！"
"13250-83-ノノミ" = "そうです！どうして一人で決めてしまうんですか？#nこれでは、前と変わりません！"
"13250-84-シロコ" = "ん、私たちよりも年上なのに。"
"13250-86-ホシノ" = "し、シロコちゃん……。"
"13250-87-アヤネ" = "先輩が話し合いに応じないなら、"
"13250-88-アヤネ" = "捕獲します！"
"13250-90-ホシノ" = "元気だねぇ、アヤネちゃんも。"
"13250-95-アヤネ" = "アヤネちゃん、アヤネちゃんって……。"
"13250-96-ホシノ" = "う、うん……？"
"13250-97-セリカ" = "……？"
"13250-103-アヤネ" = "今の私は、アヤネちゃんじゃありません……。"
"13250-104-ホシノ" = "あ、アヤネちゃん……？"
"13250-105-アヤネ" = "私のことは……。"
"13250-110-アヤネ" = "アヤネ生徒会長と呼んでください！"
