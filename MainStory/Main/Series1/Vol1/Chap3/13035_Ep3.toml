[translation]
"13035-3-ノゾミ" = "うわあっ！？#nこいつら、めちゃくちゃ強いじゃん！"
"13035-4-ヒカリ" = "損傷大きめー……。"
"13035-8-ノゾミ" = "しかも囲まれてるし……もしかしてこれ、納期間に合わない感じ？"
"13035-9-ヒカリ" = "詰みかなー？"
"13035-11-セリカ" = "何なのよ、こいつら……"
"13035-13-アヤネ" = "お願いです、説明してください……"
"13035-14-アヤネ" = "ハイランダー鉄道学園の皆さん。#nアビドス自治区で何をしていたんですか？"
"13035-15-？？？" = "大方、そちらも察しがついているのでは？"
"13035-23-ノゾミ" = "監督官！"
"13035-24-ヒカリ" = "ヘルプミー。"
"13035-26-アヤネ" = "……どなたですか？"
"13035-27-ホシノ" = "へぇ、助けに来たんだ？"
"13035-29-スオウ" = "……いや、そうではない。"
"13035-31-ノゾミ" = "嘘ぉ！？"
"13035-32-ヒカリ" = "裏切りー？"
"13035-34-スオウ" = "裏切りじゃない。#nだが、仲間だと思われても困るからな。"
"13035-35-スオウ" = "私の名は、[ruby=あさぎり]朝霧[/ruby]スオウ。#nハイランダー鉄道学園、理事会直属の管理監督官だ。"
"13035-36-アヤネ" = "管理監督官……？"
"13035-37-スオウ" = "お上の使い走りだと思ってくれて構わない。そこのバ……"
"13035-38-スオウ" = "双子[ruby=たちばな]は橘ヒ[/ruby]カリ[ruby=たちばな]と橘ノ[/ruby]ゾミ。#n二人とも[ruby=Central Control Center]中央管制センター[/ruby]の幹部だ。"
"13035-39-スオウ" = "私とあいつらは互いに監視、牽制し合う関係にある……#nそこだけ理解してもらえれば。"
"13035-41-ノゾミ" = "っていうか敵！工事の敵で納期の敵！"
"13035-42-ノゾミ" = "あとさっき、バカとか言いかけてなかったか！？"
"13035-43-ヒカリ" = "双子じゃなくてバカなんだけどー？#nあれー？"
"13035-48-スオウ" = "我々の学園では、いずれの組織も独立した権限を持っている。#n同じ学園だからといって、あんたたちと仲良しごっこをしてたまるか。"
"13035-49-スオウ" = "各組織が管理する路線――つまり、地域ごとに派閥があると思ってもらって構わない。"
"13035-50-スオウ" = "長々と話してしまったが、まずは謝罪が先だったな。"
"13035-51-スオウ" = "責任の所在は中央管制センター、つまりこのバカどもにあるとはいえ、#n監督官として謝罪する。迷惑をかけた。"
"13035-52-アヤネ" = "……。"
"13035-53-スオウ" = "だが、あんたたちもすでに知っているだろう？#n現在アビドス砂漠横断鉄道の開発権は、我々のもとにある、と。"
"13035-55-アヤネ" = "えっ！？"
"13035-56-ノノミ" = "それは、ネフティスのはずでは？"
"13035-58-スオウ" = "ああ――認識が異なっているようだな。#nあらためて説明しよう。"
"13035-59-スオウ" = "前提として、ハイランダー鉄道学園が私企業と提携することはよくある。"
"13035-60-スオウ" = "そして今は、その相手がネフティスというだけ。#nあんたなら詳しいんじゃないか？#n――[ruby=いざよい]十六夜[/ruby]ノノミ。"
"13035-65-シロコ" = "知り合い？"
"13035-66-ノノミ" = "い、いえ。#nですが……"
"13035-68-スオウ" = "とにかく、そのバカどもを解放してもらえないか。#n本件の詳細説明は後日、正式にアビドスで行なうことを約束する。"
"13035-69-アヤネ" = "そ、それは……"
"13035-70-ホシノ" = "……放してあげて。"
"13035-78-ノゾミ" = "助かったぁ！"
"13035-79-ヒカリ" = "ビビったー。"
"13035-80-スオウ" = "質問があれば当日までにまとめておいてほしい。"
"13035-81-スオウ" = "では、失礼する。"
"13035-86-セリカ" = "行っちゃった……"
"13035-90-ノノミ" = "……。"
"13035-91-ホシノ" = "とりあえず、私たちも帰ろっか。#n向こうから説明に来てくれるって言ってたしさ。"
"13035-92" = "[ns] 対策委員会の部室に戻る。"
"13035-97" = "次回;流れ行くものたち"
