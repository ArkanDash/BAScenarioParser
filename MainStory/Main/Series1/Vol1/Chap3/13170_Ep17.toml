[translation]
"13170-1" = "第17話;追跡"
"13170-5-地下生活者" = "……良いでしょう。 "
"13170-6-地下生活者" = "次は[USERNAME]先生……あなたのターンです。"
"13170-7-地下生活者" = "ゲームとは、攻守が入れ替わるもの。 "
"13170-8-地下生活者" = "もちろん、防戦一方でいるつもりはありませんがね。#nヒッ、ヒヒヒッ……。"
"13170-9-地下生活者" = "このキャンペーンは、あくまでも小生の求道。#n実験でも研究でも、儀式でもないですから。#nルールに縛られる必要性もないのです。"
"13170-10-地下生活者" = "攻略法3つ目――「心は予測も制御もできない」。"
"13170-11-地下生活者" = "欲望や罪悪、恐怖、執念、悲嘆……。"
"13170-12-地下生活者" = "……それらが衝突し生み出された混沌が、#nあなたの前にのしかかってくることでしょう。"
"13170-16-地下生活者" = "さて、プレイヤーとなったあなたが、どう攻略していくのか見ものです。"
"13170-19" = "本作で登場する法解釈は実際のものとは#n一切関係のないフィクションです。"
"13170-24" = "[ns] \"ノノミの位置が分かったよ。\""
"13170-25-アヤネ" = "どこですか！？"
"13170-26" = "[ns] \"アビドス中央駅旧庁舎。\" "
"13170-27-アヤネ" = "そこは……。"
"13170-28-シロコ" = "債権者団体の総会が開催される場所。 "
"13170-29-アヤネ" = "二手に分かれることも想定していましたが……#n助かりましたね。"
"13170-30-シロコ" = "ありがとう、先生。"
"13170-31-シロコ" = "これでホシノ先輩の捕獲、契約の継続、ノノミの救出……#n全部まとめて解決できる。"
"13170-33-セリカ" = "やっぱり、先生はすごいわね。"
"13170-34-シロコ" = "うん。セリカがヘルメット団に連れて行かれた時も、#nこうやって先生が助けてくれた。"
"13170-35-セリカ" = "い、いつの話よ！#nもう忘れてってば！"
"13170-36-シロコ" = "……だって、心配だったから。"
"13170-37-セリカ" = "そう言われると、ちょっと恥ずかしいわね……。"
"13170-39-アヤネ" = "あはは……#nでも、本当に驚いたんだよ？"
"13170-40-シロコ" = "ん、ホシノ先輩が内心一番焦ってた。"
"13170-41-シロコ" = "先生にお願いするって言って、一人で出ていっちゃうくらい。"
"13170-42-セリカ" = "それ、本当……？"
"13170-43" = "[ns1] \"それだけセリカのことが大事なんだよ。\"\n[ns2] \"普段は言葉にしてないみたいだけど。\""
"13170-48-ノノミ" = "電話はしてみました？"
"13170-49-アヤネ" = "……はい。でも数時間前から、電源が入ってないみたいで……。"
"13170-50-シロコ" = "バイト先では定時に店を出たみたい。その後、家に帰ってないってことかな。"
"13170-51-ノノミ" = "こんな遅くまで帰らないなんてこと、これまでなかったですよね……？"
"13170-52-シロコ" = "まさか……ヘルメット団の連中？"
"13170-53-アヤネ" = "えっ！？ヘルメット団がセリカちゃんを……！？"
"13170-54-シロコ" = "とりあえず待とう。ホシノ先輩と先生が調べてるから。"
"13170-55-アヤネ" = "……。"
"13170-57" = "（ガチャッ）"
"13170-58-ホシノ" = "みんな、お待たせー。"
"13170-59-アヤネ" = "ホシノ先輩！先生！"
"13170-60" = "[s] \"ただいま。\""
"13170-61-シロコ" = "どうだった、先輩？"
"13170-62-ホシノ" = "先生が持ってる権限を使って、連邦生徒会が管理するセントラルネットワークにアクセスできた。"
"13170-63-アヤネ" = "セントラルネットワークに……#n先生、そんな権限までお持ちなのですね……。"
"13170-64-ホシノ" = "うへ～もちろんこっそりだけどね。バレたら始末書だよー？"
"13170-67-セリカ" = "そうだったんだ……。"
"13170-68-シロコ" = "先輩は、わざわざ言わなかったけど。"
"13170-69-アヤネ" = "……何だか、すごく昔のように感じますね。"
"13170-70-シロコ" = "ん。"
"13170-71-セリカ" = "……ありがとう、みんな。"
"13170-73" = "[ns] \"先生として当然だよ。\""
"13170-78" = "AM 08:5X"
"13170-80-アヤネ" = "では、会議を始めます！"
"13170-84-アヤネ" = "私たちは、アビドス中央駅旧庁舎で開催される#n「債権者団体の総会」に出席しなければなりません。#nタイムリミットは、本日正午。"
"13170-85-アヤネ" = "目標は、捕らわれているノノミ先輩の救出。"
"13170-86-アヤネ" = "そして、ホシノ先輩がアビドス生徒会の存在を否定する前に、#n対策委員会の正当性を主張します。"
"13170-87-シロコ" = "了解、生徒会長。"
"13170-88-アヤネ" = "……。"
"13170-89-セリカ" = "どうしたのよ、アヤネちゃん。#n生徒会長なんだから、早く慣れないと。"
"13170-90-アヤネ" = "わ、私が生徒会長になったのは、あくまでも契約のためで……。"
"13170-91" = "[s3] \"アヤネ会長の力を見せてやろう！\"\n[s4] \"任せたよ、アヤネ会長。\""
"13170-94-アヤネ" = "……総会で発言する必要があるため、今回は私も現場へ向かいます。"
"13170-96-セリカ" = "あっ、誤魔化した。"
"13170-97-シロコ" = "逃げた。"
"13170-99-アヤネ" = "次の作戦会議に移ります！"
"13170-100-アヤネ" = "現在、アビドス中央駅に続くルートは、#n私募ファンドの兵力によって封鎖されています。"
"13170-102" = "中央駅旧庁舎・東地区"
"13170-103-アヤネ" = "東地区は、ふわふわヘルメット団が守っています。"
"13170-104-アヤネ" = "単体の戦力はさておき、数が圧倒的です。"
"13170-105-アヤネ" = "時間が限られている以上、このルートは避けましょう。"
"13170-107" = "中央駅旧庁舎・西地区"
"13170-111-アヤネ" = "西地区は、マーケットガードが集中しています。"
"13170-112-アヤネ" = "戦闘ヘリやタンク、強力な重火器を使用している可能性が高いです。"
"13170-113-アヤネ" = "戦術的な優位に立てない限り、ここも避けたいですね。"
"13170-115" = "中央駅旧庁舎・南地区"
"13170-117-アヤネ" = "南地区は、黒亀組です。"
"13170-118-アヤネ" = "無人砲塔を大量に保有しているため、容易には近づけないかと……。"
"13170-120" = "中央駅旧庁舎・北地区"
"13170-123-アヤネ" = "北地区は雇われ傭兵の集まりと思われますが、#n特殊なバリケードが設置されているようです。"
"13170-124-アヤネ" = "戦闘能力はそれほど高くありませんが、#n通常の装備で突破するのは困難でしょう。"
"13170-127-シロコ" = "……どのルートにしよう。"
"13170-128-セリカ" = "ホシノ先輩が通る場所にすれば良いんじゃないの？"
"13170-129-アヤネ" = "となると、先輩の立場で考える必要が……。"
"13170-130-セリカ" = "シロコ先輩なら分かるでしょ！"
"13170-132-シロコ" = "んー……。"
"13170-133-アヤネ" = "そうですね……#nシロコ先輩から見て、どのルートだと思いますか？"
"13170-134-シロコ" = "……ホシノ先輩の強さは、白兵戦。"
"13170-135-シロコ" = "昔は、もっと自分の身を顧みない戦闘スタイルだったって聞いた。"
"13170-136-シロコ" = "たぶん、大量の重火器を持った相手との戦いにも慣れているはず。"
"13170-137-シロコ" = "だから……。"
"13170-142" = "中央駅旧庁舎・西地区"
"13170-146-マーケットガード１" = "誰だ！"
"13170-154-マーケットガード２" = "あ、あいつは……！"
"13170-155-マーケットガード１" = "来たぞ、[ruby=たかなし]小鳥遊[/ruby]ホシノだ！"
"13170-164-マーケットガード１" = "ど、どこへ行った！？"
"13170-188-シロコ" = "……西地区だと思う。"
"13170-189-セリカ" = "それじゃ、行くわよ！"
"13170-196-押収品競売組合長" = "全兵力を小鳥遊ホシノに集中させろ！"
"13170-197-押収品競売組合長" = "総会が始まるまで、絶対に通すな！"
"13170-199-マーケットガード３" = "はっ、はい！"
"13170-204-ホシノ" = "……またヘリ？"
"13170-207-マーケットガード１" = "ターゲットの位置を確認！"
"13170-208-マーケットガード２" = "6時の方向です！！"
"13170-213-マーケットガードのパイロット" = "ターゲット確認、ロックオン。"
"13170-219-マーケットガードのパイロット" = "AGM-114空対地ミサイル、発射！"
"13170-226-マーケットガードのパイロット" = "ターゲットに命中！"
"13170-231-マーケットガードのパイロット" = "なっ……！？"
"13170-239-マーケットガード１" = "こちらに向かってきます……！"
"13170-240-マーケットガードのパイロット" = "なに言ってんだよ。#nこっちは空中に――"
"13170-248-マーケットガード１" = "ど、どこに消えた！？"
"13170-249-マーケットガード２" = "し、下です！#nヘリの足にぶら下がっています！"
"13170-255-マーケットガード１" = "う、うああっ！？"
"13170-264-押収品競売組合長" = "何が起きてるんだ……。"
"13170-269-債権者団体の代表" = "くっ……。"
"13170-274-ネフティス幹部" = "失敗したようですね。"
"13170-276-押収品競売組合長" = "黙れ、ネフティス！"
"13170-288-ネフティス幹部" = "何の真似でしょうか？"
"13170-289-押収品競売組合長" = "お前たちの企みなど、とっくに知っている。"
"13170-290-ネフティス幹部" = "企み、ですか……。"
"13170-291-債権者団体の代表" = "[ruby=われわれ]私募ファンド[/ruby]を裏切ろうとしているのだろう？"
"13170-304-債権者団体の代表" = "か、カイザーPMC！？"
"13170-310-ネフティス幹部" = "言葉には気をつけてください。"
"13170-311-ネフティス幹部" = "列車砲は、最初から私たちの物です。"
"13170-317-債権者団体の代表" = "や、やれっ！"
"13170-331-ノノミ" = "こ、この音は……？"
"13170-333-スオウ" = "……。"
"13170-338" = "中央駅旧庁舎・西地区"
"13170-348-マーケットガード１" = "と、捕らえろ！"
"13170-357" = "AM 09:4X"
"13170-360-セリカ" = "どうなってるのよ、これ！"
"13170-361-シロコ" = "ホシノ先輩は……。"
"13170-366-アヤネ" = "……見つけました、600m先です！"
"13170-367-アヤネ" = "700m、750m……どんどん遠ざかっています！"
"13170-369-セリカ" = "は、速すぎない……！？"
"13170-370-シロコ" = "追いかける。"
