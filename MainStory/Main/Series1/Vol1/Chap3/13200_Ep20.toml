[translation]
"13200-1" = "第20話;宝探し"
"13200-4-ホシノ" = "……。"
"13200-8-シロコ" = "ホシノ先輩！"
"13200-9-アヤネ" = "プレジデントはどこに……？"
"13200-12-プレジデント" = "ふっ……。"
"13200-17-スオウ" = "……。"
"13200-20-セリカ" = "ヘリ……！？"
"13200-25-ホシノ" = "……っ！"
"13200-27-プレジデント" = "惜しかったな。"
"13200-28-プレジデント" = "これで列車砲は私の物だ。"
"13200-31-プレジデント" = "スオウ君、例の物は？"
"13200-32-スオウ" = "ここに。"
"13200-37-ノノミ" = "い、いつの間に私のカードを……！"
"13200-38-プレジデント" = "「生徒会の谷」に行くためには、これが必要だからな。"
"13200-40-アヤネ" = "生徒会の谷……？"
"13200-41-プレジデント" = "ああ。そこへ行くには、どうやらネフティスグループの権限が必要らしい。"
"13200-42-プレジデント" = "本人を連れていきたいところだが、#n生憎とそれは叶わなかった。"
"13200-44-スオウ" = "……しかし、このカードさえあれば問題ない。"
"13200-45-アヤネ" = "列車砲は「生徒会の谷」という場所にあるのですか……？"
"13200-46-プレジデント" = "まさか、君たちも来ようとでも？"
"13200-47-プレジデント" = "「列車砲シェマタ」は戦略的価値や技術的価値、歴史的価値を考慮すると――"
"13200-48-プレジデント" = "その価値は、約800億円にも[ruby=のぼ]上[/ruby]る！"
"13200-49-アヤネ" = "は、800億円……！？"
"13200-50-セリカ" = "で、デタラメに決まってるわ！"
"13200-52-プレジデント" = "もし列車砲に傷ひとつでも付けたら、#n多額の賠償金を支払ってもらおう。"
"13200-53-プレジデント" = "それだけの覚悟はあるのか？"
"13200-56-プレジデント" = "そうだな。賠償金の支払いが済むまで、ホシノ君には働いてもらおう。#nきっと、黒服も喜ぶはずだ。"
"13200-57-プレジデント" = "……それとも、法に則って戦うかね？#n相手になってやっても構わないぞ。"
"13200-60-プレジデント" = "君たちが卒業したら、今度は新入生をいたぶってやろう。#nもっとも、アビドスに未来があるとしたらの話だがな。#nハッハッハッハッハ！"
"13200-65-プレジデント" = "……ん？"
"13200-66-プレジデント" = "どうした、スオウ君？"
"13200-72-プレジデント" = "なっ……。"
"13200-73-プレジデント" = "う、うおおおおおっ！？"
"13200-79-カイザーヘリのパイロット" = "プレジデント！？"
"13200-88-カイザーヘリのパイロット" = "ぐああぁぁっ！"
"13200-92-アヤネ" = "仲間割れでしょうか……！？"
"13200-93-ホシノ" = "……！"
"13200-94-セリカ" = "えっ、どういうこと！？"
"13200-95-ノノミ" = "いったい、これは……。"
"13200-100-プレジデント" = "ぐ……。"
"13200-101-プレジデント" = "うっ……！"
"13200-105-PMC兵士A" = "プレジデント！"
"13200-106-PMC兵士B" = "お怪我は！？"
"13200-107-プレジデント" = "うっ……げほっ、げほっ。"
"13200-111-PMC兵士A" = "い、急いで本社に連絡を！"
"13200-113-スオウ" = "……[ruby=たかなし]小鳥遊[/ruby]ホシノ。#n生徒会の谷がどこを指しているのか、あんたなら知っているだろう？"
"13200-114-スオウ" = "列車砲を止めたいのなら、そこに来い。"
"13200-116-ホシノ" = "君は……。"
"13200-117-スオウ" = "もし来なければ、列車砲は私が動かす。"
"13200-121-ホシノ" = "……。"
"13200-122-アヤネ" = "どこなのでしょうか……？"
"13200-123-セリカ" = "私も知らないわ。"
"13200-127-ホシノ" = "（生徒会の谷……）"
"13200-128-ホシノ" = "（そうだ、セクター35-9！）"
"13200-130-ホシノ" = "どこも同じだと思いますよ。"
"13200-131-ホシノ" = "高価な展示品があったとしても、とっくに前生徒会が売り払ってますから。"
"13200-134-ホシノ" = "かつてアビドス生徒会が、砂漠に展示館を建てたんだ。#nその場所が、生徒会の谷。"
"13200-135-ホシノ" = "そっか、あそこに隠されてたんだ。"
"13200-141-シロコ" = "待って、ホシノ先輩！"
"13200-146-セリカ" = "そうよ、先輩！"
"13200-147-アヤネ" = "待ってください、話があるんです！"
"13200-148-ノノミ" = "ホシノ先輩！"
"13200-149-アヤネ" = "ノノミ先輩は助かったんです！"
"13200-151-シロコ" = "アビドス生徒会もなくならずに済んだ。"
"13200-152-アヤネ" = "そうです、だから落ち着いてください！#nみんなで作戦を考えましょう！"
"13200-153-ホシノ" = "……ごめんね。"
"13200-154-アヤネ" = "っ！？"
"13200-155-セリカ" = "ホシノ先輩……。"
"13200-156" = "[s] \"ホシノ、待って。\""
"13200-158-ホシノ" = "私が対策委員会にいたら、列車砲を破壊できなくなる。"
"13200-159-ノノミ" = "……！"
"13200-160-ホシノ" = "……私は対策委員会じゃない。#nアビドス生徒会なんだ。"
"13200-161-アヤネ" = "もう違います！"
"13200-162-アヤネ" = "対策委員会は、アビドス生徒――"
"13200-164-ホシノ" = "――契約を継続できなかった以上、その決定に意味はなくなる。"
"13200-165-ホシノ" = "この問題に、対策委員会は関わるべきじゃない。"
"13200-166-アヤネ" = "……！"
"13200-167-ホシノ" = "これは生徒会を自称している小鳥遊ホシノによる、#n独断の犯行じゃないといけないんだ。"
"13200-171" = "[ns] \"待って、ホシノ！\""
"13200-177-アヤネ" = "きゃっ！？"
"13200-185-ホシノ" = "ごめん、シロコちゃん。"
"13200-195-シロコ" = "くっ！"
"13200-196-ホシノ" = "列車砲は、アビドスにあっちゃいけないんだ。"
"13200-197-ホシノ" = "だから、私が壊す。#n可愛い後輩たちの、未来を守るために。"
"13200-198-ホシノ" = "……ユメ先輩と過ごした思い出を守ろうとしてくれて、ありがとう。"
"13200-203-シロコ" = "ホシノ先輩！！"
"13200-209-PMC兵士A" = "も、もう少しです！"
"13200-210-プレジデント" = "ぐっ……早くアビドスから離れるぞ。"
"13200-211-プレジデント" = "……それと、カイザーグループの全社員を招集しろ。"
"13200-212-PMC兵士A" = "ぜ、全社員ですか！？"
"13200-214-プレジデント" = "そうだ！"
"13200-215-プレジデント" = "カイザー・インダストリー。"
"13200-216-プレジデント" = "カイザーローン。"
"13200-217-プレジデント" = "カイザーコンストラクション。"
"13200-218-プレジデント" = "カイザーコンビニエンス。"
"13200-219-プレジデント" = "カイザーPMC。"
"13200-220-プレジデント" = "我が社の全勢力をもって、総力戦に臨むのだ……！"
"13200-221-PMC兵士B" = "総力戦……！"
"13200-222-プレジデント" = "目標は生徒会の谷だ……！#n良いか、ごほっごほっ……！"
"13200-223-プレジデント" = "必ずや、列車砲を手に入れろ！"
"13200-224-PMC兵士A" = "しょ、承知しました！"
"13200-230-アヤネ" = "……。"
"13200-231-ノノミ" = "ホシノ先輩……。"
"13200-232-シロコ" = "……。"
"13200-239-ホシノ" = "……。"
"13200-245" = "次回;二度目の追跡"
