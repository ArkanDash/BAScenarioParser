[translation]
"13150-1" = "第15話;副生徒会長の命令"
"13150-7-ユメ" = "ねえ、ホシノちゃん。"
"13150-8-ユメ" = "私はね。ホシノちゃんと初めて会った時、これは夢なんじゃないかなって思って、何度も頬をつねったの。"
"13150-9-ユメ" = "ホシノちゃんみたいな、可愛くて強くて、頼れる後輩がそばにいてくれるなんていう夢みたいなことが、本当に嬉しくて……。 "
"13150-10-ユメ" = "うーん、上手く説明できてないかもしれないけど……。"
"13150-11-ユメ" = "ただ、こうしてホシノちゃんと一緒にいられることが、私にとっては奇跡みたいなものなの。"
"13150-13-ホシノ" = "……毎日毎日、こうして一緒にいるじゃないですか。 "
"13150-14-ホシノ" = "昨日も今日も、明日もそうです。こんな当たり前なことで、何を大袈裟なことを。"
"13150-15-ユメ" = "はぅ……だって……。"
"13150-16-ホシノ" = "「奇跡」というのはもっとすごくて、珍しいもののことですよ。"
"13150-17-ユメ" = "……ううん、"
"13150-18-ユメ" = "ホシノちゃん。"
"13150-22-ユメ" = "私は、そうは思わないよ。"
"13150-23-ユメ" = "ねえ、ホシノちゃん。いつかホシノちゃんにも可愛い後輩ができたら、その時は――"
"13150-24-ユメ" = "いつも、そばにいてあげてね？#nそういう時間こそ、奇跡みたいなものだから。"
"13150-25-ユメ" = "きっと、いつかホシノちゃんにも分かるよ。"
"13150-27-ホシノ" = "こんな学校に後輩が来るなんて、"
"13150-28-ホシノ" = "たしかに奇跡ですね。"
"13150-29-ユメ" = "もう、そうじゃないよホシノちゃん。"
"13150-30-ホシノ" = "はいはい、分かりましたって。"
"13150-31-ユメ" = "……ふふっ。#nじゃあ、もしホシノちゃんに後輩ができたら……。"
"13150-32-ユメ" = "何があっても、必ず守ってあげるんだよ？"
"13150-33-ホシノ" = "まあ、善処しますよ。"
"13150-45-セリカ" = "うっ……。"
"13150-46-アヤネ" = "あれだけ攻撃したのに、"
"13150-47-アヤネ" = "息すら上がってないなんて……。"
"13150-51-ホシノ" = "……ごめんね。"
"13150-52-ホシノ" = "ヘリ3台が相手じゃ、うまく手加減できなくってさ。"
"13150-53-ホシノ" = "……これでアヤネちゃんの言う通り、前と同じことの繰り返しになっちゃったね。"
"13150-54-ホシノ" = "先生にも、謝っておいてもらえるかな。"
"13150-55-ホシノ" = "せっかく助けてもらったのに、ごめんって。"
"13150-58-アヤネ" = "……。"
"13150-59-セリカ" = "……。"
"13150-62-ホシノ" = "……二人はアビドスの「未来」だよ。"
"13150-63-ホシノ" = "こんな状態の学校に来てくれて、私は嬉しかったんだ。"
"13150-64-ホシノ" = "だから、守らなくちゃいけない。#n先輩は後輩のことを守ってあげるものだからね。"
"13150-70-アヤネ" = "……。"
"13150-71-セリカ" = "でも、"
"13150-72-セリカ" = "それじゃあ先輩が……！"
"13150-74-ホシノ" = "大丈夫だよ、セリカちゃん。"
"13150-75-ホシノ" = "私は三年だから、どっちにしろ卒業が近いしね。"
"13150-76-ホシノ" = "今度はアヤネちゃんとセリカちゃんが、後輩を守ってあげて。"
"13150-79-ホシノ" = "みんなには、アビドスの未来を背負う役目がある。"
"13150-80-ホシノ" = "列車砲さえなくなれば……きっと、全部解決するから。"
"13150-81-ホシノ" = "いなくなるのは、おじさんだけで良い。"
"13150-84-ホシノ" = "ノノミちゃん、シロコちゃん、アヤネちゃん、セリカちゃん……#nみんなで力を合わせれば、大丈夫。"
"13150-85-ホシノ" = "ユメ先輩と私のアビドス生徒会は、今日をもって解散。#nでも対策委員会は、これからも続くから。"
"13150-91-ホシノ" = "そしたら、次の後輩にもバトンをつないであげて。"
"13150-92-ホシノ" = "これが、アビドス生徒会長・[ruby=くちなし]梔子[/ruby]ユメの意志を継いだ……。"
"13150-94-ホシノ" = "副生徒会長・[ruby=たかなし]小鳥遊[/ruby]ホシノからの、最後の命令。"
"13150-103-シロコ" = "みんな、大丈夫？"
"13150-105-アヤネ" = "シロコ先輩……。 "
"13150-106-セリカ" = "先輩が一番怪我してるじゃん……。"
"13150-108-シロコ" = "……ん。ホシノ先輩は？"
"13150-109-アヤネ" = "止められませんでした……。"
"13150-110-シロコ" = "……力不足。"
"13150-111-セリカ" = "シロコ先輩、これからどうしたら良いのかな……？"
"13150-112-シロコ" = "私も、分からない……。"
"13150-114-アヤネ" = "こんな先輩の姿、"
"13150-115-アヤネ" = "初めて見るような気がしますね……。"
"13150-117-シロコ" = "……。"
"13150-130-アヤネ" = "そういえば、生徒会長の契約書……。"
"13150-132-セリカ" = "あれがどうかしたの？"
"13150-137-アヤネ" = "今日で、あの契約書が結ばれてから二年が経ちます。"
"13150-138-シロコ" = "ということは……。"
"13150-140-アヤネ" = "会長が失踪したのは、二年前の今日……。"
"13150-156-ホシノ" = "……ノノミちゃん、待っててね。"
"13150-158-ホシノ" = "もう二度と……。"
"13150-161-ホシノ" = "……あの過ちは、繰り返さない。"
"13150-163" = "次回;反撃"
