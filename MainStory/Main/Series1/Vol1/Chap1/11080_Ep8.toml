[translation]
"11080-2" = "第8話;便利屋参上！"
"11080-3" = "対策委員会・教室"
"11080-4-アヤネ" = "……それでは、アビドス対策委員会の定例会議を始めます。"
"11080-5-アヤネ" = "本日は先生にもお越しいただいたので、いつもより真面目な議論ができると思うのですが……。"
"11080-6-ノノミ" = "は～い☆"
"11080-7-シロコ" = "もちろん。"
"11080-8-セリカ" = "何よ、いつもは不真面目みたいじゃない……。"
"11080-9-ホシノ" = "うへ、よろしくねー、先生。"
"11080-10" = "[s] \"よろしく。\""
"11080-12-アヤネ" = "早速議題に入ります。本日は、私たちにとって非常に重要な問題……#n「学校の負債をどう返済するか」について、具体的な方法を議論します。"
"11080-13-アヤネ" = "ご意見のある方は、挙手をお願いします！"
"11080-14-セリカ" = "はい！はい！"
"11080-15-アヤネ" = "はい、1年の[ruby=くろみ]黒見[/ruby]さん。お願いします。"
"11080-16-セリカ" = "……あのさ、まず名字で呼ぶの、やめない？ぎこちないんだけど。"
"11080-17-アヤネ" = "せ、セリカちゃん……でも、せっかく会議だし……。"
"11080-18-ホシノ" = "いいじゃーん、おカタ～い感じで。それに今日は珍しく、先生もいるんだし。"
"11080-19-シロコ" = "珍しくというより、初めて。"
"11080-20-ノノミ" = "ですよね！なんだか委員会っぽくてイイと思いま～す☆"
"11080-21-セリカ" = "はぁ……ま、先輩たちがそう言うなら……。"
"11080-22-セリカ" = "……とにかく！対策委員会の会計担当としては、現在我が校の財政状況は#n破産の寸前としか言いようがないわっ！"
"11080-23-セリカ" = "このままじゃ廃校だよ！みんな、わかってるよね？"
"11080-24-ホシノ" = "うん、まあねー。"
"11080-25-セリカ" = "毎月の返済額は、利息だけで788万円！#n私たちも頑張って稼いではいるけど、正直利息の返済も追いつかない。"
"11080-26-セリカ" = "これまで通り、指名手配犯を捕まえたり、苦情を解決したり、ボランティアするだけじゃ限界があるわ。"
"11080-27-セリカ" = "このままじゃ、らちが明かないってこと！何かこう、でっかく一発狙わないと！"
"11080-28-アヤネ" = "でっかく……って、例えば？"
"11080-29-セリカ" = "（ピラッ）これこれ！街で配ってたチラシ！"
"11080-30-アヤネ" = "これは……！？"
"11080-31-ホシノ" = "どれどれ……。"
"11080-32-ホシノ" = "「ゲルマニウム麦飯石ブレスレットであなたも一攫千金」……ねえ…？"
"11080-33-セリカ" = "そうっ！これでガッポガッポ稼ごうよ！"
"11080-34-アヤネ" = "……。"
"11080-35-セリカ" = "この間、街で声をかけられて、説明会に連れていってもらったの。#n運気を上げるゲルマニウムブレスレットってのを売ってるんだって！"
"11080-36-シロコ" = "……。"
"11080-37-セリカ" = "これね、身に着けるだけで運気が上がるんだって！で、これを周りの3人に売れば……。"
"11080-39-セリカ" = "……みんな、どうしたの？"
"11080-40-ホシノ" = "却下ー。"
"11080-41-セリカ" = "えーっ！？何で？どうして！"
"11080-42-アヤネ" = "セリカちゃん……それ、マルチ商法だから…… 。"
"11080-43-シロコ" = "儲かるわけない。 "
"11080-44-セリカ" = "へっ！？ "
"11080-45-アヤネ" = "そもそもゲルマニウムと運気アップって関係あるのかな……#nこんな怪しいところで、まともなビジネスを提案してくれるはずなんてないよ……。"
"11080-46-セリカ" = "そっ、そうなの？私、2個も買っちゃったんだけど！？"
"11080-47-ノノミ" = "セリカちゃん、騙されちゃいましたね。可愛いです☆"
"11080-48-セリカ" = "……！！"
"11080-49-ホシノ" = "まったく、セリカちゃんは世間知らずだねー。#n気を付けないと、悪い大人に騙されて、人生取り返しのつかないことになっちゃうかもよー？"
"11080-50-セリカ" = "そ、そんなあ……そんな風には見えなかったのに……#nせっかくお昼抜いて貯めたお金で買ったのに……。"
"11080-51-ノノミ" = "大丈夫ですよセリカちゃん。お昼、一緒に食べましょう？私がご馳走しますから。"
"11080-52-セリカ" = "ぐすっ……ノノミせんぱぁい……。"
"11080-54-アヤネ" = "えっと……それでは、黒見さんからの意見はこの辺で……#n他にご意見のある方……。"
"11080-55-ホシノ" = "はい！はい！"
"11080-56-アヤネ" = "えっと……はい、3年の[ruby=たかなし]小鳥遊[/ruby]委員長。ちょっと嫌な予感がしますが……。"
"11080-57-ホシノ" = "うむうむ、えっへん！"
"11080-58-ホシノ" = "我が校の一番の問題は、全校生徒がここにいる数人だけってことなんだよねー。"
"11080-59-ホシノ" = "生徒の数イコール学校の力。トリニティやゲヘナみたいに、#n生徒数を桁違いに増やせれば、毎月のお金だけでもかなりの金額になるはずー。"
"11080-60-アヤネ" = "え……そ、そうなんですか？"
"11080-61-ホシノ" = "そういうことー！だからまずは生徒の数を増やさないとねー、まずはそこからかなー。"
"11080-62-ホシノ" = "そうすれば議員も輩出できるし、連邦生徒会での発言権も与えられるしね。"
"11080-63-アヤネ" = "鋭いご指摘ですが……でもどうやって……。"
"11080-64-ホシノ" = "簡単だよー、他校のスクールバスを拉致ればオッケー！"
"11080-65-アヤネ" = "はい！？"
"11080-66-ホシノ" = "登校中のスクールバスをジャックして、うちの学校への転入学書類にハンコを#n押さないとバスから降りられないようにするのー。"
"11080-67-ホシノ" = "うへ～、これで生徒数がグンと増えること間違いなーし！"
"11080-68-シロコ" = "それ、興味深いね。"
"11080-69-シロコ" = "ターゲットはトリニティ？それともゲヘナ？ミレニアム？"
"11080-70-シロコ" = "狙いをどこに定めるかによって、戦略を変える必要があるかも。"
"11080-71-ホシノ" = "お？……えーっと、うーん……そうだなあ、トリニティ？いや、ゲヘナにしよーっと！"
"11080-72-アヤネ" = "ちょ、ちょっと待ってください！そんな方法で転校とかってありなんですか！？"
"11080-73-アヤネ" = "それに、他校の風紀委員が黙っていませんよ……。"
"11080-74-ホシノ" = "うへ～やっぱそうだよねー？"
"11080-75-アヤネ" = "やっぱそうだよねー、じゃありませんよ、ホシノ先輩……#nもっと真面目に会議に臨んでいただかないと……。"
"11080-77-シロコ" = "いい考えがある。"
"11080-78-アヤネ" = "……はい、2年の[ruby=すなおおかみ]砂狼[/ruby]シロコさん……。"
"11080-79-シロコ" = "銀行を襲うの。"
"11080-80-アヤネ" = "はいっ！？"
"11080-81-シロコ" = "確実かつ簡単な方法。ターゲットも選定済み。#n市街地にある第一中央銀行。"
"11080-82-シロコ" = "金庫の位置、警備員の動線、現金輸送車の走行ルートは事前に把握しておいたから。"
"11080-83-アヤネ" = "さっきから一生懸命見てたのは、それですか！？"
"11080-84-シロコ" = "5分で1億は稼げる。はい、覆面も準備しておいた。"
"11080-88-アヤネ" = "いつの間にこんなものまで……。"
"11080-89-ホシノ" = "うわー、これ、シロコちゃんの手作りー？"
"11080-92-ノノミ" = "わあ、見てください！レスラーみたいです！"
"11080-93-アヤネ" = "……。"
"11080-94-ホシノ" = "いやー、いいねぇ。人生一発でキメないと。ねえ、セリカちゃん？"
"11080-97-セリカ" = "そんなわけあるか！！却下！却下ー！！"
"11080-98-アヤネ" = "そっ、そうですっ！犯罪はいけませんっ！"
"11080-101-シロコ" = "……。"
"11080-102-アヤネ" = "そんなふくれっ面をしてもダメなものはダメです、シロコ先輩っ！"
"11080-103-アヤネ" = "はあ……みなさん、もうちょっとまともな提案をしていただかないと……。"
"11080-105-ノノミ" = "あのー！はい！次は私が！"
"11080-106-アヤネ" = "はい……2年の[ruby=いざよい]十六夜[/ruby]ノノミさん。犯罪と詐欺は抜きでご意見をお願いします……。"
"11080-107-ノノミ" = "はい！犯罪でもマルチ商法でもない、とってもクリーンかつ確実な方法があります！"
"11080-108-ノノミ" = "アイドルです！スクールアイドル！"
"11080-109-アヤネ" = "ア、アイドル……！？"
"11080-110-ノノミ" = "そうです！アニメで観たんですけど、学校を復興する定番の方法はアイドルです！#n私たち全員がアイドルとしてデビューすれば……。"
"11080-111-ホシノ" = "却下。"
"11080-112-ノノミ" = "あら……これも駄目なんですか？"
"11080-113-セリカ" = "なんで？ホシノ先輩なら、特定のマニアに大ウケしそうなのに。"
"11080-114-ホシノ" = "うへーこんな貧相な体が好きとか言っちゃう輩なんて、人間としてダメっしょー。ないわー、ないない。"
"11080-115-ノノミ" = "決めポーズも考えておいたのに…… 。"
"11080-116-ノノミ" = "（じゃーん！）"
"11080-117-ノノミ" = "水着少女団のクリスティーナで～す♧"
"11080-118-セリカ" = "どういうことよ……。"
"11080-119-セリカ" = "何が「で～す♧」よ！それに「水着少女団」って！だっさい！"
"11080-120-ノノミ" = "えー、徹夜で考えたのに……。"
"11080-122-アヤネ" = "あのう……議論がなかなか進まないんですけど、そろそろ結論を……。"
"11080-123-ホシノ" = "それは先生に任せちゃおうー。先生、これまでの意見で、やるならどれがいい？"
"11080-124-アヤネ" = "えっ！？これまでの意見から選ぶんですか！？も、もう少しまともな意見を出してからの方がいいのでは！？"
"11080-125-ホシノ" = "大丈夫だよー。先生が選んだものなら、間違いないって。"
"11080-126-アヤネ" = "ちょ、ちょっと待ってください！何でそう言い切れるんですか！？"
"11080-128-セリカ" = "まさかアイドルをやれなんて言わないよね？"
"11080-129-ノノミ" = "アイドルで☆お願いします♧"
"11080-130-シロコ" = "……（スッ）"
"11080-131" = "[s1] \"スクールバスをジャックする！\"\n[s2] \"銀行を襲う！\"\n[s3] \"アイドルグループ結成！私がプロデューサーになる！\""
"11080-135-アヤネ" = "えぇっ！？本気ですか！？"
"11080-136-ホシノ" = "あはははー！よし、決まりー！それじゃあ出発だー！"
"11080-137-ノノミ" = "きゃあ～☆楽しそうです！"
"11080-138-セリカ" = "ほ、ホントに？これでいいの？"
"11080-139-ホシノ" = "うへ～いいんじゃなーい？"
"11080-140-シロコ" = "計画は大胆なほどいい。でしょ、アヤネ？"
"11080-141-アヤネ" = "……い……。"
"11080-142-セリカ" = "い……？"
"11080-144-アヤネ" = "いいわけないじゃないですかぁ！！"
"11080-145" = "ガッシャーン！"
"11080-146-ホシノ" = "出たー！アヤネちゃんのちゃぶ台返しー！"
"11080-147-シロコ" = "……。"
"11080-148-ノノミ" = "きゃあ、アヤネちゃんが怒りました！非常事態です！"
"11080-149-ホシノ" = "うへ～キレのある返しができる子に育ってくれたねえ。ママは嬉しいよーん。"
"11080-150-アヤネ" = "誰がママですかっ！もうっ、ちゃんと真面目にやってください！"
"11080-151-アヤネ" = "いつもふざけてばっかり！銀行強盗とかマルチ商法とかそんなことばっかり言って！"
"11080-153-セリカ" = "（ギクッ）"
"11080-154-シロコ" = "……。"
"11080-156" = "（その後めちゃくちゃ説教された）"
"11080-158-ホシノ" = "いやぁー、悪かったってば、アヤネちゃーん。ラーメン奢ってあげるからさ、怒らないで、ねっ？"
"11080-159-アヤネ" = "怒ってません……。"
"11080-160-ノノミ" = "はい、お口拭いて。はい、よくできましたねー☆"
"11080-161-アヤネ" = "赤ちゃんじゃありませんからっ。"
"11080-162-セリカ" = "……なんでもいいんだけどさ。なんでまたウチに来たの？"
"11080-163-シロコ" = "アヤネ、チャーシューもっと食べる？"
"11080-164-アヤネ" = "（もごもご）ふぁい。"
"11080-165" = "（ガタッ、ガララッ）"
"11080-166-ハルカ" = "……。"
"11080-167-ハルカ" = "あ……あのう……。"
"11080-168-セリカ" = "いらっしゃいませ！何名様ですか？"
"11080-169-ハルカ" = "……こ、ここで一番安いメニューって、お、おいくらですか？"
"11080-170-セリカ" = "一番安いのは……"
"11080-171-セリカ" = "580円の柴関ラーメンです！看板メニューなんで、美味しいですよ！"
"11080-172-ハルカ" = "あ、ありがとうございます！"
"11080-173" = "（ガララッ）"
"11080-174-セリカ" = "ん？"
"11080-175" = "（ガララッ）"
"11080-181-ムツキ" = "えへへっ、やっと見つかった、600円以下のメニュー！"
"11080-183-アル" = "ふふふ。ほら、何事にも解決策はあるのよ。全部想定内だわ。"
"11080-184-ハルカ" = "そ、そうでしたか、さすが社長、何でもご存知ですね……。"
"11080-185-カヨコ" = "はあ……。"
"11080-188-セリカ" = "4名様ですか？お席にご案内しますね。"
"11080-189-ムツキ" = "んーん、どうせ1杯しか頼まないし大丈夫。"
"11080-190-セリカ" = "一杯だけ……？でも……どうせならごゆっくりお席へどうぞ。今は暇な時間なので、空いてる席も多いですし。"
"11080-191-ムツキ" = "おー、親切な店員さんだね！ありがとう、それじゃあお言葉に甘えて。"
"11080-192-ムツキ" = "あ、わがままのついでに、箸は4膳でよろしく。優しいバイトちゃん。"
"11080-193-セリカ" = "えっ？4膳ですか？ま、まさか1杯を4人で分け合うつもり？"
"11080-194-ハルカ" = "ご、ご、ごめんなさいっ。貧乏ですみません！！お金がなくてすみません！！"
"11080-195-セリカ" = "あ、い、いや……！その、別にそう謝らなくても……。"
"11080-196-ハルカ" = "いいえ！お金がないのは首がないのも同じ！生きる資格なんてないんです！#n虫けらにも劣る存在なのです！虫けら以下ですみません……！"
"11080-197-カヨコ" = "はあ……ちょっと声デカいよ、ハルカ。周りに迷惑……。"
"11080-198-セリカ" = "そんな！お金がないのは罪じゃないよ！胸を張って！"
"11080-200-ハルカ" = "へ？……はい！？"
"11080-201-セリカ" = "お金は天下の回りもの、ってね。そもそもまだ学生だし！#nそれでも、小銭をかき集めて食べに来てくれたんでしょ？そういうのが大事なんだよ！"
"11080-202-セリカ" = "もう少し待っててね。すぐ持ってくるから。"
"11080-205-カヨコ" = "……何か妙な勘違いをされてるみたいだけど？"
"11080-206-ムツキ" = "まあ、私たちもいつもはそんなに貧乏ってわけじゃないんだけどね。しいて言えば、金遣いの荒いアルちゃんのせいだし。"
"11080-207-アル" = "「アルちゃん」じゃなくて社長でしょ？ムツキ室長、肩書はちゃんと付けてよ。"
"11080-208-ムツキ" = "ん？だってもう仕事終わった後じゃん？ところで、社長のクセに社員にラーメン1杯奢れないなんて。"
"11080-209-アル" = "……。"
"11080-210-カヨコ" = "今日の襲撃任務に投入する人員を雇うために、ほぼ全財産使っちゃったし……。"
"11080-211-アル" = "ふふふ。でもこうして実際ラーメンは口にできるわけでしょ？それぐらい想定内よ。"
"11080-212-カヨコ" = "たったの1杯分じゃん。せめて4杯分のお金は確保しておこうよ……。"
"11080-213-ムツキ" = "ぶっちゃけ、忘れたんでしょ？ねえ、アルちゃん。夕飯代取っておくの、忘れたんでしょ？"
"11080-214-アル" = "……ふふふ。"
"11080-215-カヨコ" = "はあ。ま、リスクは減らせたほうがいいし。今回のターゲットは、ヘルメット団みたいなザコみたいには扱えないってことには同意する。"
"11080-216-カヨコ" = "でも全財産をはたいて人を雇わなきゃいけないほど、アビドスは危険な連中なの？"
"11080-217-アル" = "それは……。"
"11080-218-ムツキ" = "多分アルちゃんもよくわかってないと思うよ。だからビビっていっぱい雇ってるんだよ。"
"11080-219-アル" = "誰がビビってるって！？全部私の想定内！"
"11080-220-アル" = "失敗は許されない。あらゆるリソースを総動員して臨むわ。それが我が便利屋68のモットーよ！"
"11080-221-カヨコ" = "初耳だね、そんなモットー……。"
"11080-222-ムツキ" = "今思いついたに決まってるよ。"
"11080-223-アル" = "うるさい！じゃあ今回の依頼を成功させて報酬が手に入ったら、すき焼きにするわ！だから気合入れなさい、みんな！"
"11080-224-ハルカ" = "すっ……すき焼きとはっ……！？それは一体！？"
"11080-225-カヨコ" = "大人の食べ物だね、すごく高価な……。"
"11080-226-ハルカ" = "う、うわあ……私なんかが食べていいものなんでしょうか？食べた後はハラキリですか……？"
"11080-227-アル" = "ふふふ。うちみたいなスゴイ会社の社員なら、それぐらいの贅沢はしないとね。"
"11080-228-ムツキ" = "へえ～やる気満々じゃん、アルちゃん。"
"11080-229-アル" = "「アルちゃん」じゃなくて、社・長！！"
"11080-231-セリカ" = "はい、お待たせいたしました！お熱いのでお気をつけて！"
"11080-232" = "（ダンッ！）"
"11080-233-ムツキ" = "ひぇっ、何これ！？ラーメン超大盛じゃん！"
"11080-234-カヨコ" = "ざっと、10人前はあるね……。"
"11080-235-ハルカ" = "こ、これはオーダーミスなのでは？こんなの食べるお金、ありませんよう……。"
"11080-236-セリカ" = "いやいや、これで合ってますって。580円の柴関ラーメン並！ですよね、大将？"
"11080-237-柴大将" = "ああ、ちょっと手元が狂って量が増えちまったんだ。気にしないでくれ。"
