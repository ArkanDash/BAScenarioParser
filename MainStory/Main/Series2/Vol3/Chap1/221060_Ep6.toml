[translation]
"221060-1" = "第6話;好奇心は猫をも……"
"221060-2" = "（翌日から、時間を見つけてはオデュッセイアに立ち寄って、#n生徒とサミーがじゃれ合う様子を見守った）"
"221060-3" = "（サミーはどこに行っても可愛がられていたのだが――）"
"221060-6-オデュッセイアの生徒A" = "ふぅ……洗濯おわり！"
"221060-7-オデュッセイアの生徒B" = "めちゃくちゃあったね……干すだけで3時間かかってるでしょ。"
"221060-8-オデュッセイアの生徒B" = "こんなに溜まる前にちょこちょこ洗えなかったの？"
"221060-9-オデュッセイアの生徒A" = "無理だって。航海中は水の使用が制限されてるんだから。#n布団を洗うなんてできなかったんだよ。"
"221060-10-オデュッセイアの生徒A" = "せっかく陸に戻ってきて真水を好きに使えるんだし。#n溜まった服も一気に洗っとかないと――"
"221060-12-サミー" = "にゃあ～"
"221060-13-オデュッセイアの生徒A" = "あ、サミーだ。"
"221060-14-オデュッセイアの生徒A" = "や、調子はどう？"
"221060-15-オデュッセイアの生徒B" = "最近ぜんぜん会わないよね。見つけても昼寝してるし。"
"221060-16-オデュッセイアの生徒A" = "まあ仕方ないって。歳考えなよ。"
"221060-17-サミー" = "にゃあん……。"
"221060-20-サミー" = "けふっ、けふっ……。"
"221060-21-オデュッセイアの生徒A" = "だっ、大丈夫？どこか苦しいの？"
"221060-26-サミー" = "…………。"
"221060-27-オデュッセイアの生徒A" = "行っちゃった。"
"221060-28-オデュッセイアの生徒A" = "最近のサミー、なに考えてるのか分からないんだよね。"
"221060-29-オデュッセイアの生徒B" = "……ていうか、大丈夫かな。"
"221060-30-オデュッセイアの生徒A" = "何が？"
"221060-31-オデュッセイアの生徒B" = "ほら……猫が咳をすると嵐が来るって話。"
"221060-32-オデュッセイアの生徒B" = "最近のサミー、咳してること多いし……なんか嫌な予感が……。"
"221060-38-オデュッセイアの生徒B" = "うわっ、スコールだ！"
"221060-39-オデュッセイアの生徒A" = "やっぱりサミーが咳したから！？"
"221060-40-オデュッセイアの生徒B" = "こんな話してる場合じゃないって！早く布団取り込んで！"
"221060-44-オデュッセイアの生徒A" = "せっかく洗ったのに……これじゃあやり直しだよぉ……。"
"221060-48" = "クルーズ運営部旗艦「ゴールデンエリジウム」前の渡り桟橋"
"221060-50-ミツキ" = "はーい、注目！ちゅーもーく！"
"221060-51-ミツキ" = "本日より改めて、賞味期限が短い食品の積み込みを開始します。"
"221060-52-ミツキ" = "特に今日は重いものが多いので、怪我のないよう注意してください。"
"221060-53-クルーズ運営部員A" = "はい、支配人！"
"221060-54-ミツキ" = "もしも、ふざけた拍子に落としたり、こぼしたりしたら――"
"221060-55-ミツキ" = "私とオートマチック拳銃でロシアンルーレットをすることになりますので、#n覚悟しておいてくださいね？"
"221060-56-クルーズ運営部員B" = "……承知しました！"
"221060-58-クルーズ運営部員A" = "次は……瓶牛乳5ケース、入りまーす！"
"221060-59-クルーズ運営部員B" = "瓶牛乳5ケース、受け取り！"
"221060-64-クルーズ運営部員A" = "……ん？#n今、何か横切らなかった？"
"221060-68-サミー" = "にゃお。"
"221060-69-クルーズ運営部員B" = "なんだ、サミーか。"
"221060-70-クルーズ運営部員B" = "サミー、そこは手すりだから危ないよ。"
"221060-71-クルーズ運営部員B" = "最近はジャンプもつらそうじゃない。#nそんなとこで足を滑らせでもしたら――"
"221060-72-サミー" = "にゃあ～"
"221060-77-サミー" = "うにゃっ！？"
"221060-78-クルーズ運営部員B" = "ちょっ、サミー！？#nそっちは――"
"221060-87-ミツキ" = "……注意しろと、言いましたよね？"
"221060-88-ミツキ" = "そんなに私と賭けがしたいのなら……仕方ありません。"
"221060-89-クルーズ運営部員B" = "誤解です！今のはサミーが――"
"221060-94-クルーズ運営部員A" = "……サミー？もしかして、逃げた……？"
"221060-95-クルーズ運営部員A" = "うぅ……やっぱ猫が転ぶとろくなことがない！"
"221060-97" = "（サミーが近くにいる時に悪いことが起きると、#nオデュッセイアの生徒は反射的に関連づけてしまうのだった）"
"221060-98" = "（サミーが好奇心旺盛すぎるのも一因ではあったが……）"
"221060-100" = "トライデント旗艦「ロードス号」・上部甲板前"
"221060-104-スミカ" = "さあさあ、甲板清掃を開始します！"
"221060-105-スミカ" = "入港後の甲板清掃が初めての1年生も多いと思いますが、気を引き締めてください！#nこれはただの水洗いではありません！"
"221060-106-スミカ" = "常に潮風に晒されている甲板は、定期的に掃除しないと錆びる！#nそれすなわち戦闘力の低下に直結します！"
"221060-107-スミカ" = "トライデントの名誉のためにも、隅々までツヤッツヤに磨くこと！#nいいですね！？"
"221060-108-トライデントの部員A" = "はーい。"
"221060-109-トライデントの部員B" = "……てか、なんでスミカがキャプテン役なの？#nハルピュイア号と勘違いしてない？"
"221060-110-トライデントの部員B" = "まさか……甲板清掃が面倒だから監督役に回ろうとか思ってるんじゃ――"
"221060-111-スミカ" = "そんなわけないじゃないですか！"
"221060-112-スミカ" = "この手の集団作業は、誰かが全体の進行を監督することで、見落としなくできるんですよ！"
"221060-113-スミカ" = "私がその役目を買って出ることに、何か問題でも？"
"221060-114-トライデントの部員A" = "スミカがやる必要なくない？"
"221060-115-スミカ" = "やらない理由だってありません！"
"221060-116-スミカ" = "ほらほら！こうしてる間にも船は錆びていくんですから。#nさっさと掃除を始めますよ！"
"221060-117-トライデントの部員B" = "はいは～い。"
"221060-123-トライデントの部員A" = "わ～！シャボン玉だ～！"
"221060-124-トライデントの部員B" = "粉石けん混ぜたからかな。めっちゃ泡出るね。"
"221060-125-トライデントの部員A" = "きれい……。"
"221060-126-トライデントの部員A" = "そういえば……こうやって掃除してると、決まってお客さんが――"
"221060-131-トライデントの部員B" = "サミー！"
"221060-132-トライデントの部員B" = "なにさ、シャボン玉で遊びに来たの？"
"221060-133-トライデントの部員A" = "悪いんだけど、今は遊んでるわけじゃなくってさ。#nちょーっとどいててくれる？"
"221060-137-スミカ" = "そこ、雑談してないで掃除に集中し――"
"221060-138-サミー" = "にゃおっ！？"
"221060-139-スミカ" = "うわっ！？"
"221060-144" = "[ns] \"危ない！\""
"221060-150" = "[ns1] \"ギリギリセーフ……。\"\n[ns2] \"怪我はない？\""
"221060-153-スミカ" = "[USERNAME]先生！？"
"221060-154-スミカ" = "ありがとうございます……！#nおかげで海に落ちずに済みました……！"
"221060-155-スミカ" = "急にサミーが目の前で滑ったので、つい焦っちゃって……。"
"221060-156" = "[ns] \"掃除中の床は滑りやすいから気をつけないと。\""
"221060-160-スミカ" = "はい……ごめんなさい……。"
"221060-161-スミカ" = "それで……先生、さっきすごい衝撃でしたけど……大丈夫ですか？"
"221060-162" = "[ns] \"もちろん！これくらいヘッチャラ――\""
"221060-166" = "[ns3] \"腰が……痛い……。\"\n[ns4] \"力が、入らない……。\""
"221060-170-スミカ" = "先生！？"
"221060-175" = "次回;落ち着かない待ち時間"
