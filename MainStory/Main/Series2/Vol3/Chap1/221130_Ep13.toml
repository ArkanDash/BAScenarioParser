[translation]
"221130-1" = "第13話;最後の航海"
"221130-10-マイ" = "クロノスチャンネルをご覧の皆さん、おはようございます！#nクロノス報道部の[ruby=かざまき]風巻[/ruby]マイです！"
"221130-11-マイ" = "未だ日も昇らぬ時間ですが、私は今、#nオデュッセイアの船団が停泊中のアオハマ港に来ています！"
"221130-12-マイ" = "クロノス報道部が極秘で入手した情報によると、#nオデュッセイアの生徒会――アイランドが単独で出航を準備しているとのことです！"
"221130-13-マイ" = "それを証明するかのように、旗艦オリュンポス号は[ruby=げんもん]舷門[/ruby]を撤去し[ruby=いかり]、錨を[/ruby]上げています！"
"221130-14-マイ" = "定期航海を終えたオデュッセイアの船団が、#nひと月も経たずに再び出航するのは前例がありません！"
"221130-15-マイ" = "SNSでは出航の理由をめぐって様々な憶測が飛んでいる模様です。"
"221130-16-マイ" = "先日オデュッセイアを特別訪問したシャーレの先生および連邦生徒会長と関係があるのでしょうか？"
"221130-17-マイ" = "まだ正式発表は出ていませんが、新しい情報が入り次第――"
"221130-21-クロノス報道部の生徒" = "先輩、速報です。"
"221130-25-マイ" = "あっ、ただいま速報が入りました！"
"221130-26-マイ" = "先ほど、オリュンポス号が港湾管理局に出航理由を通知したとのことです。"
"221130-27-マイ" = "出航の目的は「友を見送るため」とのことですが――"
"221130-31-マイ" = "うん？見送るって、どういう意味です？"
"221130-32-マイ" = "誰か、海に出る生徒でもいるんでしょうか……？"
"221130-34" = "アイランド旗艦「オリュンポス号」・第1艦橋"
"221130-37-オデュッセイアの生徒A" = "出航5分前！"
"221130-43-アミ" = "これより出航態勢に入る。#n艦内放送を舷門から艦橋へ切り替えて。"
"221130-49-オデュッセイアの生徒B" = "舷門、撤去完了しました！"
"221130-50-ミナト" = "よし。総員、係留索回収。"
"221130-51-オデュッセイアの生徒A" = "総員、係留索回収！"
"221130-56-オデュッセイアの生徒A" = "出航！"
"221130-66-ミナト" = "やっぱり、防波堤を越えるだけでも海の色が変わるね。"
"221130-71-サミー" = "……にゃあ。"
"221130-75-ミナト" = "サミー、見える？"
"221130-76-ミナト" = "海だよ。君がずっと眺めていたキヴォトスの海。"
"221130-77-ミナト" = "今日は他の船がいないから、いつもとはちょっと違うけど……。"
"221130-78-ミナト" = "せめてもの贈り物だ。"
"221130-83-サミー" = "…………にゃぁ。"
"221130-84-ミナト" = "どうしたの？舷側の窓を開けたい？"
"221130-85-ミナト" = "あっちには何もないけ――"
"221130-89-ミナト" = "あれ？あの船は……。"
"221130-94-アミ" = "艦長、クルーズ運営部のゴールデンエリジウムから通信要請です！"
"221130-98-ミナト" = "許可する。"
"221130-103-アミ" = "……通信要請、許可。6番チャンネルへ接続します。"
"221130-109-ミツキ" = "こちらゴールデンエリジウム。#nクルーズ運営部部長、[ruby=せんごく]千石[/ruby]ミツキでございます。"
"221130-110-ミツキ" = "お話は聞かせてもらいました。#nサミーへ手向けを贈ろうとしているのですね？"
"221130-111-ミツキ" = "であれば、私たちもお供します。"
"221130-112-ミツキ" = "黄金色に輝くこの船が隣にいないと、サミーも寂しがるでしょう？"
"221130-113-ミツキ" = "つきましては……事後承諾となりますが、クルーズ運営部の出航許可を願います。"
"221130-114-ミナト" = "でも……クルーズ運営部はD.U.に戻ってこっちも営業中だったよね？"
"221130-115-ミナト" = "ゲストのスケジュールを確認せずに出航していいの？"
"221130-116-ミツキ" = "ちょっとだけです。#nそれに、サプライズならお客様も喜ばれるでしょうから。"
"221130-117-ミツキ" = "1件のクレームも出ないことにクルーズ運営部の今月分の部費を賭けます！"
"221130-122-ミナト" = "……許可する。"
"221130-124-アミ" = "艦長、続いてロードス号からも通信要請です。"
"221130-125-アミ" = "……8番チャンネルへ切り替えます。"
"221130-131-スミカ" = "こちらロードス！#nトライデントの通信当番、[ruby=こもり]小森[/ruby]スミカです！"
"221130-132-スミカ" = "勝手に割り込んですみません。#nトライデントからも、どうしてもお伝えしたいことがありまして……！"
"221130-133-トライデントの部員A" = "ひどいですよ艦長！サミーを見送るのに置いてくなんて！"
"221130-134-トライデントの部員B" = "私たちもオデュッセイアです！白と黒両方の制服が揃わなかったら、サミーが寂しがります！"
"221130-135-トライデントの部員B" = "今回の航海の安全も、トライデントにお任せください！"
"221130-136-スミカ" = "ちょ、ちょっと！みんな落ち着いてくださ～い！#n今日の通信当番は私なんですよ！？"
"221130-137-スミカ" = "えっと……艦長、ロードス号を含むトライデント巡視船にも出航許可をお願いします！"
"221130-141-ミナト" = "うん、一緒に行こう。"
"221130-142-アミ" = "……その他、複数の部活から続々と出航許可願が届いています。"
"221130-143-アミ" = "これで、サミーに[ruby=海]日常の風景[/ruby]を見せてあげられますね。"
"221130-144-ミナト" = "うん、よかった。"
"221130-148-ミナト" = "サミー、見える？#n君が愛する――君を愛する学園のみんなが。"
"221130-150-サミー" = "……にゃあ。"
"221130-151-ミナト" = "君の特等席はあっちだよね？行こう。"
"221130-158-ミナト" = "……海風だ。"
"221130-159-ミナト" = "朝日が昇り、気温が上がれば、君はここで風と共に学園を眺めてたよね。"
"221130-162-ミナト" = "どうかな、サミー。私たちのオデュッセイアは。"
"221130-163-サミー" = "…………。"
"221130-167" = "（その瞳に映るのは、船乗りの仲間たち）"
"221130-168" = "（サミーはいつもの場所で、見慣れた風景を眺めながら、友に囲まれて――）"
"221130-176" = "（――満ち足りた表情で、静かに目を閉じた）"
"221130-181" = "（……こうして、サミーの航海は幕を下ろした）"
"221130-183" = "次回;空席の存在感"
