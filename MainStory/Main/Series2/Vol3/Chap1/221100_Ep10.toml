[translation]
"221100-1" = "第10話;船上の追いかけっこ"
"221100-2" = "（数日後）"
"221100-3" = "（形式的な行政手続きを踏んで、いくつかの書類を交わしたあと――）"
"221100-4" = "（サミーを下船させる準備が整った）"
"221100-9" = "オリュンポス号・アイランド士官室"
"221100-11-ミナト" = "お待ちしてました、先生。#n……連邦生徒会長も。"
"221100-12-アミ" = "アイランドへようこそ。"
"221100-13" = "[s1] \"2人とも、お疲れ様。\"\n[s2] \"変わりない？\""
"221100-16-アミ" = "はい、おかげさまで。"
"221100-17-アミ" = "サミーの下船をめぐってちょっとした騒ぎはありましたが、#nトライデントの迅速な対応で大事には至りませんでした。"
"221100-18" = "[s] \"ちょっとした騒ぎ？\""
"221100-19-ミナト" = "サミーと別れるのは寂しいと言って、一部の生徒が騒ぎを起こしまして。"
"221100-20-ミナト" = "怪しい民間療法でサミーを治そうとする生徒や、#nサミーの毛で玉を作りたいとアイランドに無断侵入する生徒など……。"
"221100-21-アミ" = "たしかにサミーは抜け毛が多いほうですが……無茶ぶりが過ぎます。"
"221100-22-ミナト" = "とはいえ、問題らしい問題はそれくらいでした。#n連邦生徒会の決定ということで、みんな従ってくれています。"
"221100-23-ミナト" = "最初から連邦生徒会長の意見を仰いでおけばよかったですね。"
"221100-28-連邦生徒会長" = "いえ。"
"221100-29-連邦生徒会長" = "私はただ、名前を貸しただけですよ？"
"221100-30-ミナト" = "ですがそのおかげで、残された時間を気持ちの整理に使うことができました。#nあのままでは答えのない争いを続けていたでしょうから。"
"221100-31-ミナト" = "やはり、禁忌と慣習には抗えないみたいですね。"
"221100-32-連邦生徒会長" = "……。"
"221100-37" = "[ns] \"それで、サミーはどこに……？\""
"221100-38-アミ" = "いつもの場所にいると思います。"
"221100-39-アミ" = "朝ご飯を食べた後は、決まってテーブルの下にあるクッションで昼寝をするので。"
"221100-45-アミ" = "きっと今も――"
"221100-49-アミ" = "サミー！？"
"221100-50-ミナト" = "サミーがいない！？どこに行ったの？"
"221100-51-アミ" = "分かりません……この時間は毎日必ずここにいたのに……。"
"221100-52-アミ" = "誰か、サミーを見た人は？"
"221100-53-アイランド部員" = "じ、実はさっき……朝ご飯を食べたサミーが、甲板に出て行くのを見かけて……。"
"221100-54-アイランド部員" = "申し訳ありません。朝の散歩かと思い……。"
"221100-55-アミ" = "おかしいですね。"
"221100-56-アミ" = "どうして今日に限って……。"
"221100-57-ミナト" = "まさか、船から下ろそうとしていることに気づいて……？"
"221100-58" = "[s] \"サミーは言葉が分かるの？\""
"221100-59-ミナト" = "いいえ。ですが、年相応に察しはいいほうでして。"
"221100-60-ミナト" = "シャワーの準備をしたり、予防接種をしようとしたら、すぐいなくなって……。"
"221100-61-ミナト" = "オデュッセイアは隠れられる場所が多いので、#n前には1週間も姿をくらませていたこともありましたね……。"
"221100-63-アミ" = "それは今より元気だったころの話です。#n今のサミーの体調を考えたら、いつ何が起きるかも分かりません。"
"221100-64-連邦生徒会長" = "こうしている場合ではないようですね。"
"221100-65-連邦生徒会長" = "みんなでサミーを探しましょう。"
"221100-71-ミナト" = "サミー！"
"221100-72-アミ" = "出てきなさーい！"
"221100-73-アミ" = "どこにいるの――"
"221100-78-サミー" = "にゃお。"
"221100-79" = "[ns] \"あそこ！ロープの上！\""
"221100-81-ミナト" = "私が引きつけます。"
"221100-82-ミナト" = "ほ～ら、サミー。君の大好きなおやつだよ～"
"221100-83-ミナト" = "こっちにおいで～美味しいよ～"
"221100-87-サミー" = "にゃん。"
"221100-88-ミナト" = "くっ。"
"221100-89" = "[ns] \"船を飛び移った！？\""
"221100-90-連邦生徒会長" = "まだまだ身のこなしが軽やかですね。#n海に落ちるかもしれないのに、ものともしないだなんて。"
"221100-91-アミ" = "サミーにとっては船全体がキャットタワーのようなものですから。"
"221100-92-アミ" = "毎日のように船の間を行き来して学園中を駆け回ってきたので……#nオデュッセイアの地理に一番詳しいのはサミーかもしれません。"
"221100-93-ミナト" = "とにかく追いかけましょう！"
"221100-95" = "（その後も、サミーとの追いかけっこが続いた）"
"221100-96" = "（しかし、手すりや狭い通路を巧みに使うせいでなかなか捕まらず――）"
"221100-98-アミ" = "やっ！"
"221100-99-連邦生徒会長" = "あら。"
"221100-100" = "[s] \"捕まえた？\""
"221100-101-ミナト" = "取り逃がしました！"
"221100-102-サミー" = "にゃおーん。"
"221100-104" = "（さらには予想外の邪魔も入った）"
"221100-107-アミ" = "はぁ、はぁ……。#nこ、ここに、サミーが来ませんでしたか？"
"221100-108-オデュッセイアの生徒" = "サミーというと……猫のサミーですか？"
"221100-109-オデュッセイアの生徒" = "すみませんが、今日は見ていません。"
"221100-110-ミナト" = "おかしいな。こっちに逃げてきたはずなのに……。"
"221100-115-サミー" = "にゃお。"
"221100-116-オデュッセイアの生徒" = "しーっ！静かにしててって言ったじゃん！"
"221100-117-アミ" = "……まさか、サミーを匿っていたんですか！？"
"221100-118-オデュッセイアの生徒" = "も、申し訳ありません！#nサミーが下船する前にもっと顔を見たくて……。"
"221100-120-サミー" = "にゃお～"
"221100-121-アミ" = "待ちなさい！"
"221100-126-アミ" = "あの……。"
"221100-127-トライデントの部員" = "あれ、艦長と副長……それにシャーレの先生まで？"
"221100-128-トライデントの部員" = "そんなに急いでどうされました？"
"221100-129-アミ" = "サミー、こっちに来ましたよね？"
"221100-130-トライデントの部員" = "……。"
"221100-131-トライデントの部員" = "……いいえ？"
"221100-132-アミ" = "……本当に？"
"221100-137-ミナト" = "まさか、船内の風紀を守るトライデントが嘘をつくわけ――"
"221100-138-サミー" = "にゃあ～"
"221100-143-トライデントの部員" = "……バレたか。"
"221100-144-アミ" = "あなた達まで！"
"221100-145" = "[s] \"ごめん、ちょっと通るね！\""
"221100-148" = "（一部の生徒がサミーを匿ったり、探すのを邪魔したことにより、#n追いかけっこは想像以上に長引いてしまった）"
"221100-150-アミ" = "はぁ、はぁ……。"
"221100-151-アミ" = "皆さん……どうしてサミーを匿うのですか？#n昨日までは何も不満を言わなかったじゃないですか！"
"221100-152-ミナト" = "言ってないから不満がないとは限らないけど……。"
"221100-153-ミナト" = "まさかトライデントの生徒まで加勢するとは思わなかった。"
"221100-157-ミナト" = "どうして、いつもと違うことを……。"
"221100-158-連邦生徒会長" = "それは、いつもと違う状況だからでしょう。"
"221100-162-連邦生徒会長" = "それより……サミーはこれを遊びだと思っているのか、とても楽しそうに見えますね。"
"221100-163-サミー" = "ごろんごろん……ごろにゃーん。"
"221100-168-アミ" = "あのバカ猫……。"
"221100-169-ミナト" = "このままではらちが明かないので、二手に分かれましょう。"
"221100-170-ミナト" = "アミ副長と先生は左舷からサミーを誘い出してもらえますか？"
"221100-171-ミナト" = "私は右舷で待機しながら、船首の行き止まりでサミーを捕えます。"
"221100-172-アミ" = "下手すれば海に落ちる危険もありますが……もうこの手しかありません。"
"221100-173-アミ" = "艦長、健闘を祈ります。#n行きましょう、[USERNAME]先生。こちらです。"
"221100-174" = "[s] \"任せて！\""
"221100-178-アミ" = "サミー……止まりなさい！"
"221100-179" = "[ns] \"ガオー！食べちゃうぞぉ！\""
"221100-180-サミー" = "にゃふっ……！"
"221100-181-アミ" = "サミーが船首に行きました……！"
"221100-182-アミ" = "艦長！今です！"
"221100-186-ミナト" = "捕まえ――"
"221100-187-サミー" = "にゃあ！"
"221100-188-ミナト" = "あれっ！？"
"221100-194" = "[ns] \"ミナト……！\""
"221100-195-アミ" = "艦長！大丈夫ですか！？"
"221100-196-ミナト" = "だ……大丈夫！"
"221100-197-ミナト" = "ちゃんと泳げるし、掴まれるものもあるから！"
"221100-198-アミ" = "ですが……。"
"221100-199-ミナト" = "副長、忘れたの？#n水面で垂直に浮いて溺れている者は助けない。何度も言ったはずだよ。"
"221100-200-ミナト" = "とりあえず……はしごか何か、登れそうなもの投げてほしいな。"
"221100-201-アミ" = "すぐ用意します！少々お待ちを！"
"221100-207-サミー" = "にゃあ――"
"221100-208-ミナト" = "え……？"
"221100-210-ミナト" = "ちょっ、サミー！？危ないでしょ！早く甲板に上がりなさい！"
"221100-211-サミー" = "にゃん……にゃうん……。"
"221100-212-ミナト" = "なあに、溺れた私が心配なの？"
"221100-213-ミナト" = "泳げないくせに、いっちょ前に心配してくれちゃって。"
"221100-214-サミー" = "にゃぁ――"
"221100-215-ミナト" = "あれだけ追いかけっこさせといて、君は元気そうだね。"
"221100-216-ミナト" = "まったく……泳げる私たちは海を恐れてるのに、泳げない君が海を怖がらないなんて。"
"221100-217-ミナト" = "ふふっ、こういうのを怖いもの知らずって言うのかな？"
"221100-218-ミナト" = "……いや、違うか。#n君も水は怖いんだよね。お風呂は毎度おっかなびっくりだったし。"
"221100-219-ミナト" = "でも、それ以上に……私を心配してくれてるんだ。"
"221100-221-ミナト" = "サミー……ありがとう。"
"221100-222-ミナト" = "ごめんね……。"
"221100-223-アミ" = "艦長！はしごを下ろしました！こちらへ！"
"221100-224-ミナト" = "さあ、サミー。もう時間だよ。"
"221100-225-サミー" = "にゃあ――"
"221100-230" = "次回;心変わり"
