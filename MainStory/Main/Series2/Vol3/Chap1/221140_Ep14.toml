[translation]
"221140-1" = "第14話;空席の存在感"
"221140-2" = "（サミーが旅立ってから半月ほど経った頃……）"
"221140-3" = "（あの日以来、久しぶりにオデュッセイア海洋高等学校を訪れた）"
"221140-4-トライデントの部員" = "スミカ～甲板掃除に使う洗剤、なんかおかしくない？"
"221140-5-トライデントの部員" = "いつもの粉石鹼じゃないの？"
"221140-6-スミカ" = "今回は比率を減らして、余ってた歯磨き粉を入れました。"
"221140-7-トライデントの部員" = "なんで？"
"221140-8-スミカ" = "だって粉石鹼じゃシャボン玉がたくさんできちゃうじゃないですか。#nそしたら前みたいに、またサミーが――"
"221140-9-スミカ" = "……あ。"
"221140-10-スミカ" = "すみません、つい。"
"221140-11-トライデントの部員" = "ううん、私だってツナ缶が残ってるの見たらつい1個取っちゃうもん。"
"221140-12-スミカ" = "慣れって恐ろしいですね。"
"221140-13-トライデントの部員" = "……だね。"
"221140-14" = "[ns1] \"今日もお疲れ様。\"\n[ns2] \"甲板の掃除中？\""
"221140-15-スミカ" = "[USERNAME]先生！？"
"221140-16-スミカ" = "来校予定はなかったはずですが……まさか、私たちに手違いが……！？"
"221140-17" = "[s] \"大丈夫だよ。ちょっと寄っただけだから。\""
"221140-18-スミカ" = "よ、よかったです……。#n先生のメッセージを見落としたのかと……。"
"221140-19-スミカ" = "では、改めて。#n……こほん。"
"221140-20-スミカ" = "シャーレの先生が乗船され――！"
"221140-21" = "[s3] \"待って待って！叫ばなくていいから！\"\n[s4] \"今日はプライベートだよ……。\""
"221140-22-スミカ" = "それだと先生のご訪問を他の生徒に伝えられませんよ？"
"221140-23-スミカ" = "それに、お客さんが船を乗り降りする際は、必ず大声で周知させるのがオデュッセイアの慣習で……。"
"221140-24" = "[s] \"でもそれは「お客さん」の場合でしょ？\""
"221140-25" = "[ns5] \"「友達」が遊びに来たってことにしてくれないかな？\"\n[ns6] \"友達なら、わざわざ知らせるようなものでもないだろうし。\""
"221140-26-スミカ" = "それなら……まぁ？"
"221140-27-スミカ" = "う～ん……オデュッセイアは航海が多いので、#n学外から友達が来るってイメージはあんまり湧かないですが……。"
"221140-28-スミカ" = "友達なら、全員に知らせるのはちょっと恥ずかしいですね。"
"221140-29" = "[s] \"でしょ？\""
"221140-30" = "でも、いきなり先生を友達って呼ぶのは、それはそれで……ねぇ？"
"221140-31-トライデントの部員B" = "でも、仲良しってわけでもないですし～？"
"221140-32" = "ま、待ってください！先生に対して失礼ですよ！"
"221140-33" = "[s] \"言い出しっぺは私だし、気にしないよ。\""
"221140-34" = "[ns] \"それより、みんな元気だった？\""
"221140-35-スミカ" = "……はい。#nオデュッセイアは何事もなくいつも通りです。"
"221140-36-スミカ" = "嵐が襲来することも、誰かが大怪我を負うこともありませんでした。"
"221140-37-スミカ" = "もちろん私たちはアイランドの幹部じゃないので、#nオデュッセイアの事故を全部把握できているわけじゃないですが……。"
"221140-38-スミカ" = "あ、そうだ。アイランドにも行かれるんですか？"
"221140-39" = "[s] \"うん。艦長に挨拶しておこうかなって。\""
"221140-40-スミカ" = "ではタラップまでご案内します。#n前に船を出して以来、位置が変わりましたので。"
"221140-41-スミカ" = "先生。"
"221140-42-スミカ" = "一応、船に乗る際は右足からお願いします。"
"221140-43" = "[s] \"……やっぱり、禁忌は気になる？\""
"221140-44-スミカ" = "はい。"
"221140-45-スミカ" = "迷信だとしても、先生に何かあったら困りますので。"
"221140-46-ミナト" = "おや、[USERNAME]先生。"
"221140-47-ミナト" = "急にいらっしゃるだなんて……何か緊急事態ですか？"
"221140-48" = "[s] \"ううん、ミナトに会いに来たんだ。\""
"221140-49-ミナト" = "私に……ですか？"
"221140-50-ミナト" = "あはは、先日の件でしょうか。心配をかけてしまったみたいですね。"
"221140-51-ミナト" = "大丈夫ですよ。#n私やアミ副長……それにオデュッセイアのみんなは元気にしています。"
"221140-52-ミナト" = "……表面上は。"
"221140-53-ミナト" = "入港手続きも一通り終わったので、来週にも陸地での活動を始められると思います。"
"221140-54-ミナト" = "あっ……お茶をお出ししたいところなのですが、茶葉が底をついてしまっていて……。"
"221140-55-ミナト" = "缶でも大丈夫ですか？"
"221140-56" = "[s] \"もちろん。いただくね。\""
"221140-57" = "[ns] \"……サミーのことは残念だったね。\""
"221140-58-ミナト" = "……いえ。"
"221140-59-ミナト" = "最善の方法でサミーを見送ることができました。先生のおかげです。"
"221140-60-ミナト" = "みんなも満足しているみたいでして。"
"221140-61" = "[s] \"これで禁忌を気にしなくて済むかな？\""
"221140-62-ミナト" = "どうでしょう。すぐには難しいと思います。"
"221140-63-ミナト" = "今回の件は多くの生徒にとって、#n「禁忌を破ったからといって問題が発生するとは限らない」という学びになりました。"
"221140-64-ミナト" = "それでも、禁忌と慣習はオデュッセイアに深く根付いています。"
"221140-65-ミナト" = "気にしてしまうのも無理からぬことでしょう。"
"221140-66-ミナト" = "私も……これを捨てられずにいます。"
"221140-67" = "[s] \"サミーのクッションもそのままだね。\""
"221140-68-ミナト" = "はい。片づけようとも思ったのですが……しばらくは置いておくことにしました。"
"221140-69-ミナト" = "このクッションがあるだけで、まだサミーがいるような気がするんです。"
"221140-70-ミナト" = "とはいえ……この暮らしが続き、いつか慣れた頃には、#nまた新しい出会いが訪れるでしょう。"
"221140-71-ミナト" = "先生が私たちと縁を結んでくださったように。"
"221140-72-ミナト" = "……いずれ来るその時には、過去に縛られず、自分たちの行く末を、#n自分たちで決められるようになっていればいいなと願うばかりです。"
"221140-73" = "[s7] \"きっとできるよ。\"\n[s8] \"人生の主人公は自分自身だからね。\""
"221140-74-ミナト" = "……私も、主人公になれるように頑張ります。"
"221140-75-ミナト" = "では、これからもよろしくお願いします、先生。"
"221140-76" = "（その後、シャーレに帰るために駅のホームで待っていると――）"
"221140-77" = "（向かいのホームから声をかけられた）"
"221140-78-？？？" = "……またお会いしましたね、[USERNAME]先生。"
"221140-79" = "[ns9] \"やあ、こんにちは。\"\n[ns10] \"こんなところでどうしたの？\""
"221140-80-連邦生徒会長" = "列車を待っています。"
"221140-81-連邦生徒会長" = "先生も同じ理由なのでは？"
"221140-82" = "[s11] \"でも、連邦生徒会の建物の外で会うのは珍しいよね。\"\n[s12] \"オデュッセイアに用事だったとか？\""
"221140-83-連邦生徒会長" = "そうですね……。"
"221140-84-連邦生徒会長" = "オデュッセイアにというよりも、オデュッセイアを訪れた先生に用事があったと言うべきでしょうか。"
"221140-85" = "[s] \"私に……？\""
"221140-86-連邦生徒会長" = "一段落つきましたし、オデュッセイアに関する意見交換をと思いまして。#nそれでシャーレに伺ったのですが、あいにくご不在で。"
"221140-87-連邦生徒会長" = "聞けば、オデュッセイアに向かったと。"
"221140-88-連邦生徒会長" = "電話やメールでは話しにくい内容だったとはいえ、勝手に行き先を聞き出したこと、#nお詫び申し上げます。"
"221140-89" = "[s13] \"いやいや、こちらこそごめん。\"\n[s14] \"話があるなら、カフェとか行く？\""
"221140-90-連邦生徒会長" = "いえ、話自体はすぐに終わります。"
"221140-91-連邦生徒会長" = "ちょうど誰もいませんし、次の列車が来るまで時間もあります。"
"221140-92-連邦生徒会長" = "このまま、お話しさせていただいても？"
"221140-93" = "[s] \"もちろん。\""
"221140-94-連邦生徒会長" = "ではお言葉に甘えて。#nまず、今回のオデュッセイアの件、お疲れ様でした。"
"221140-95-連邦生徒会長" = "多くの生徒にとって、より良い明日へ進むきっかけになったでしょう。"
"221140-96" = "[s] \"それはみんなが頑張ったからだよ。\""
"221140-97" = "[ns] \"特に、ミナトが決断を下してくれて良かったと思う。\""
"221140-98-連邦生徒会長" = "ええ、そうですね。#n優柔不断ゆえに厳しい評価をしたこともありましたが、[ruby=うみじ]海路[/ruby]さんは優秀な生徒です。"
"221140-99-連邦生徒会長" = "今回の件で多くの教訓を得たからこそ、これからの活躍が楽しみです。"
"221140-100-連邦生徒会長" = "……オデュッセイアには、まだたくさんの問題が残っていますが。"
"221140-101-連邦生徒会長" = "今の彼女なら、きっと上手くできるでしょう。"
"221140-102" = "[ns] \"みんなが認めるオデュッセイアの艦長だもんね。\""
"221140-103-連邦生徒会長" = "……やはりそうでしたか。#n先生。その点には1つ、誤りがあります。"
"221140-104-連邦生徒会長" = "海路さんが優秀なのは確かですが……彼女にはどうしても手の届かない限界が存在しています。"
"221140-105-連邦生徒会長" = "オデュッセイア海洋高等学校の[ruby=・]本[/ruby][ruby=・]物[/ruby][ruby=・]の[/ruby][ruby=・]艦[/ruby][ruby=・]長[/ruby][ruby=・]で[/ruby][ruby=・]は[/ruby][ruby=・]な[/ruby][ruby=・]い[/ruby]というのも、その一つですね。"
"221140-106" = "[ns15] \"……え？\"\n[ns16] \"それ、どういう意味？\""
"221140-107-連邦生徒会長" = "おや、列車が来てしまいました。"
"221140-108-連邦生徒会長" = "お伝えしたかったのは、それだけです。"
"221140-109-連邦生徒会長" = "では、またお会いしましょう。[USERNAME]先生。"
"221140-110" = "[ns] \"本物じゃないってどういうこと！？\""
"221140-111" = "オデュッセイア編;To be Continued in Chapter 2"
