[translation]
"212190-1" = "第19話;残したもの"
"212190-3" = "（ゲヘナが落ち着きを取り戻した頃）"
"212190-4" = "（ゲヘナの全生徒を対象にした集会が行われた）"
"212190-11-ゲヘナの生徒A" = "なに言われるんだろうね。"
"212190-12-ゲヘナの生徒B" = "さあ。とにかく重要らしいけど。"
"212190-13-ゲヘナの生徒A" = "この前みたいのだったらどうする？"
"212190-14-ゲヘナの生徒B" = "キヴォトスに攻撃するとか、って？もうお腹いっぱい。"
"212190-15-ゲヘナの生徒A" = "……。"
"212190-16-ゲヘナの生徒A" = "なんか変だったよね、あの時。何となくそうしなきゃって気になってたんだよな。"
"212190-17-ゲヘナの生徒B" = "私も。やらなきゃダメって感じだったというかさ。"
"212190-18-ゲヘナの生徒B" = "今は全然だけど、意味わかんないよね。"
"212190-19-ゲヘナの生徒A" = "そういえば準備してたやつって結局どうなったの？やめた？"
"212190-20-ゲヘナの生徒C" = "ねね、あんたたちも弾薬全部取られたでしょ？"
"212190-21-ゲヘナの生徒B" = "あ、そうそう。あれ返ってこないのかな。ポイントにはなったけど。"
"212190-22-ゲヘナの生徒C" = "私のなんか限定品だったんだよ？そのへん、今日の発表で何かないかな。"
"212190-27-ゲヘナの生徒A" = "うわ……鳥肌が……。"
"212190-28-ゲヘナの生徒B" = "あんたも？この前の聞いてから、こういう音ちょっと怖くてさ……。"
"212190-32" = "[ns] \"……。\""
"212190-34-ゲヘナの生徒C" = "あっ。始まるみたい。"
"212190-35-ゲヘナの生徒A" = "ん？あれは――"
"212190-41-アコ" = "委員長……。"
"212190-42-ヒナ" = "……。"
"212190-44-ゲヘナの生徒A" = "風紀委員長……？"
"212190-45-ゲヘナの生徒B" = "なに話すつもりだろ？"
"212190-49-ヒナ" = "……ゲヘナのみんな。"
"212190-50-ヒナ" = "最初に、この数日の悲劇的な事態について、風紀委員長として謝罪します。"
"212190-51-ヒナ" = "私は呪縛に囚われて、あれが真の秩序であり、平和なのだと信じこんでいた。"
"212190-52-ヒナ" = "みんなの意思を踏みにじって、キヴォトスに向けて銃を取ったこの手は……#n間違いなく私のものだった。"
"212190-53-ゲヘナの生徒A" = "……。"
"212190-54-ゲヘナの生徒B" = "うーん……。"
"212190-55-ヒナ" = "洗脳されていたから、なんて言い訳はしない。"
"212190-56-ヒナ" = "結果として、雷帝と何ひとつ変わらないことをしてしまった。#n自分があれほど嫌悪していたというのにね。"
"212190-57-ヒナ" = "みんなが享受するはずだった騒がしくて勝手気ままな日常を……#n私の独善的な判断で消し去ろうとした。"
"212190-58-ヒナ" = "この場を借りて、最後まで私の前に立ちはだかってくれた後輩たち、#n勇気を持って立ち向かってくれたすべての生徒に、伝えたい。"
"212190-61-イオリ" = "委員長……。"
"212190-67-ヒナ" = "みんなが正しかった。#nみんなが私たちを止めてくれなければ、ゲヘナは取り返しのつかない道を進んでいたかもしれない。"
"212190-68-ヒナ" = "……みんなが私に向ける非難も、恨みも、その全部を背負うつもりです。"
"212190-69-アコ" = "委員長……。"
"212190-73-ヒナ" = "私は、本日をもって風紀委員長としてのすべての権限を返上し――"
"212190-74-？？？" = "ならぬ！！！"
"212190-82-ヒナ" = "マコト……？"
"212190-83-マコト" = "[ruby=そらさき]空崎[/ruby]ヒナ！誰が権限を返上していいと言った！？#nこの[ruby=はぬま]羽沼[/ruby]マコト様は許可した覚えがないぞ！"
"212190-84-ヒナ" = "何を言っているの……。"
"212190-88-マコト" = "ふん、らしくもない沈んだ表情だな。"
"212190-89-マコト" = "そもそも、お前が全部の責任をかぶって退いたら、私の立場はどうなる？"
"212190-90-マコト" = "万魔殿の議長ともあろう者が風紀委員長ひとり御しきれず、この大惨事を招いたと触れ回れとでも言うのか！？"
"212190-91-アコ" = "マコト議長！委員長は本気で――"
"212190-92-マコト" = "うるさいぞ、[ruby=あまう]天雨[/ruby]アコ行政官！今は私が話しているのだ！"
"212190-93-マコト" = "ゲヘナの諸君！聞け！"
"212190-94-ゲヘナの生徒C" = "万魔殿議長……？"
"212190-95-ゲヘナの生徒D" = "キヴォトスを攻撃しようって言いだしたの、あの人だよね……？"
"212190-96-マコト" = "そうだ！この私、羽沼マコト様だ！"
"212190-97-マコト" = "此度の大馬鹿騒ぎ――"
"212190-101-マコト" = "愚かにもこの私が！雷帝の亡霊にまんまと踊らされてしでかしたのだ！！"
"212190-106-マユミ" = "あれ言って良いの！？"
"212190-108-ヒナ" = "マコト……。"
"212190-109-マコト" = "情けない話だが、ゲヘナの頂点たるこのマコト様が！古臭い計画に振り回されて、お前たちに銃を取れと命じた！"
"212190-110-マコト" = "この私の落ち度であり――この私の敗北だ！#n詫びよう！すまなかった！！"
"212190-116-イロハ" = "……謝り方までやかましいんですね。"
"212190-117-サツキ" = "ふふ……マコトちゃんらしいわ。"
"212190-118-マコト" = "だが、空崎ヒナは違う！"
"212190-119-マコト" = "こいつは最後の最後まで、ゲヘナを守るために必死に抗っていた！"
"212190-120-マコト" = "諸君らの前に立ちはだかったこともあっただろう。#nしかしそれは、この愚かな議長がまともな判断を下せなかったせいだ！"
"212190-121-ヒナ" = "マコト、私は自分で――"
"212190-122-マコト" = "黙れ！お前の責任は、すなわち私の責任だ！"
"212190-123-マコト" = "ゲヘナのすべての責任は、この私が背負う！#n故に生徒諸君――！"
"212190-124-マコト" = "風紀委員長に石を投げたければ、全て私に向けるがいい！まとめて受け止めてやる！"
"212190-126-ゲヘナの生徒A" = "おぉ……。"
"212190-127-ゲヘナの生徒C" = "意外と熱いところあるじゃん？"
"212190-129-マコト" = "それから空崎ヒナ！辞任だの権限返上だの、そんな弱音は捨てろ！"
"212190-130-マコト" = "お前はこれからも私の下で、一生ゲヘナの後始末をしながら罪を償うのだ！#nキシシッ！この私がそう決めた！"
"212190-135-ヒナ" = "……最後まで自分勝手ね。"
"212190-136-マコト" = "よし！謝罪はここまでとしよう！戦闘計画は白紙撤回だ！"
"212190-137-マコト" = "諸君から徴発した弾薬やらその他もろもろは、近く万魔殿が何とかして返還しよう！"
"212190-138-マコト" = "皆、ゲヘナらしく好き勝手に日々を謳歌するといい！以上だ！！"
"212190-144-ゲヘナの生徒たち" = "うおおおお～～！！格好いいじゃん！！"
"212190-145-ゲヘナの生徒" = "そうそう、これでこそゲヘナだよね！！"
"212190-146" = "[ns] \"謝罪までマコトらしいね……。\""
"212190-148-アコ" = "……まあ、結果としては……悪くない空気ですね。"
"212190-149-ヒナ" = "そうね。"
"212190-150-ヒナ" = "……おかげで、少し肩の荷が下りた気がする。"
"212190-154-アコ" = "委員長。"
"212190-155-ヒナ" = "……言わなくても分かるわ。"
"212190-156-アコ" = "……。"
"212190-157-ヒナ" = "私たちは私たちでケジメをつけないとね。"
"212190-158-ヒナ" = "マコトが言ったみたいに、責任から逃げずに。"
"212190-159-アコ" = "……はい。そうですね。"
"212190-160-アコ" = "まずは……勇敢で誇らしい後輩たちに。"
"212190-161-ヒナ" = "うん……。"
"212190-163-マユミ" = "……。"
"212190-164-カレン" = "議長先輩が風紀委員長をかばうなんてね。"
"212190-165-カレン" = "言い方はアレだったけど、考えてることはすっごい伝わってきた。"
"212190-166-マユミ" = "カレン、これって――"
"212190-167-カレン" = "うん。"
"212190-168-マユミ" = "もしかして、ゲヘナが一つになる瞬間だったんじゃないかな？"
"212190-169-カレン" = "やはっ。委員長、すっきりした顔してるじゃん。"
"212190-170-マユミ" = "……私たちが夢見てた偉大なゲヘナも、ちゃんと実現できるのかもしれない。"
"212190-171-カレン" = "当然っしょ。これからうちらで作るんだから。違う？"
"212190-172-マユミ" = "うん！私たちはゲヘナ再興委員会だもん！"
"212190-176-カレン" = "でも、その名前……このまま使うの？"
"212190-177-カレン" = "ショウコ……ちゃんがつけた名前だし。#n雷帝時代を呼び戻すって意味で名づけたっぽいけど。"
"212190-178-マユミ" = "名前そのものは悪くないって思うの。「再び立て直す」って意味だから。"
"212190-179-マユミ" = "ゲヘナはさ、毎日どっかで爆発して壊れてるような学園でしょ？#nだから私たちみたいなのが何度でも立て直していかなきゃ。"
"212190-180-カレン" = "過去の栄光じゃなくて、未来のために日常を直してく……みたいな？"
"212190-181-マユミ" = "そうそう！雷帝がどうとかなんて関係ない。#n私たちは私たちのやり方で、ゲヘナを作り直していくんだから。"
"212190-182-マユミ" = "それが、これからのゲヘナ再興委員会だよ。"
"212190-188-カレン" = "やはっ！よっ、委員長！"
"212190-196-イオリ" = "えっと、広場ので十分だったからさ。別にわざわざ……。"
"212190-197-チナツ" = "……委員長、まだ顔色がよくありません。"
"212190-201-ヒナ" = "……イオリ、チナツ。#nあなたたちを撃った瞬間の感触が……今もこの手に残ってる。"
"212190-205-ヒナ" = "私を呼びながら必死で抗うあの目も……全部覚えてる。"
"212190-206-イオリ" = "……！"
"212190-207-ヒナ" = "風紀委員長として――ひとりの先輩として、絶対にやってはいけないことをした。"
"212190-208-ヒナ" = "守るって約束しておきながら、私が一番深い傷を負わせた。"
"212190-209-ヒナ" = "……本当にごめんなさい。#nどんな言葉でも拭えない過ちだって、分かってる。"
"212190-214-アコ" = "私からも謝罪します。#n後輩の本気を踏みにじったこと、そう簡単に許してもらえるとは思っていません。"
"212190-218-イオリ" = "……痛かった。すっごく痛かったんだ。#n弾もだけどさ、そんなのより――"
"212190-219-イオリ" = "私たちを見るあの冷たい目が……弾より何十倍も痛かった。#n胸にぽっかり穴が空いたみたいで……。"
"212190-220-ヒナ" = "…………。"
"212190-221-イオリ" = "戻ってきてって、あんなに叫んだのに……！バカ委員長！間抜け行政官！！"
"212190-222-ヒナ" = "ごめん……ごめんなさい……。"
"212190-223-チナツ" = "……私も、怖かったです。"
"212190-224-チナツ" = "信じてきたものが、全部崩れていくような気がして。"
"212190-229-チナツ" = "でも……それでも私たちがもう一度銃を取れたのは、先輩たちに教わった正義が私たちの中に生きていたからです。"
"212190-230-チナツ" = "だから今回は、先輩たちに代わって私たちが線を守りました。"
"212190-231-チナツ" = "……あまりご自分を責めないでください。#nだって、こうして戻ってきてくださったじゃないですか。"
"212190-235-イオリ" = "……うん。そうだよ。戻ってきてくれて、よかった。"
"212190-239-ヒナ" = "……ありがとう。#nそれと――"
"212190-240-ヒナ" = "あなたたちを誇りに思うわ。私なんかよりずっと立派な風紀委員だった。"
"212190-241-イオリ" = "へへ……。"
"212190-242-チナツ" = "……ふふ。"
"212190-243-ヒナ" = "謝るのはもうおしまい。犯した過ちは、これからの行動で償うわ。"
"212190-244-アコ" = "そうですね。さっそく仕事が山積みですから。#n被害の復旧、懲戒手続き、紛失備品のリストアップ……挙げればキリがありません。"
"212190-245-アコ" = "お二人は休ませてあげたいところですが、状況が状況です。すぐ復帰できますか？"
"212190-246-イオリ" = "はぁ！？本性出すの流石に早すぎない！？"
"212190-247-チナツ" = "ふふ……アコ行政官なりの謝り方なんじゃないでしょうか。#n「いつだってあなたたちが必要です」って。"
"212190-248-アコ" = "ええ、その通りです。#n積もりに積もった業務の山。あなたたち抜きでどう片づけろというんですか。"
"212190-252-アコ" = "……お願いします。#nどうか一緒に、ゲヘナの線を守ってくれますか？"
"212190-256-イオリ" = "も～、アコちゃんは仕方ないなぁ。"
"212190-262-ヒナ" = "……ありがとう。"
"212190-265-マコト" = "永遠の闘争……などと言ってはあまりに大仰か。"
"212190-266-マコト" = "だが、自由とはそういうものだ。"
"212190-267-マコト" = "完成することはなく、安全でもなく、終わりもしない。"
"212190-271-マコト" = "自由であるということは――"
"212190-272-マコト" = "考え、判断する責任を放棄しないという選択なのだ。"
"212190-273-マコト" = "私の……。"
"212190-274-マコト" = "……。"
"212190-275-マコト" = "いや。"
"212190-276-マコト" = "私たちのゲヘナは、これからも自由な学園であり続けるだろう。"
"212190-281-マコト" = "諸君。存分に楽しみ、赴くままに生きるがいい。"
"212190-282-マコト" = "あらゆる責任は、この羽沼マコト様が引き受けてやるのだから。"
"212190-287-チアキ" = "あ～、雰囲気がある良い演説だったんですけどね～"
"212190-288-チアキ" = "視聴率は0.3％でした！"
"212190-292-マコト" = "なぜだ！！！"
"212190-297-サツキ" = "前からこれくらいだったでしょう？これがゲヘナの平常運転なのではないかしら。"
"212190-298-イロハ" = "前と同じなら良いじゃないですか。"
"212190-299-イロハ" = "あれだけ大騒ぎしても、根本は何も変わってないってことですから。"
"212190-300-マコト" = "くっ……！この私の哲学を込めた、ゲヘナ史上空前絶後の名演説だったのだぞ！？"
"212190-301" = "[s] \"私はちゃんと聞いてたよ。\""
"212190-305-マコト" = "おお！"
"212190-306-マコト" = "流石は先生だ。私が日頃より抱いてきた高潔なる理想と価値を理解できるのだな！"
"212190-307-マコト" = "今後どのような指導者が現れようとも、高潔な理想を説くのは並大抵のことではない。#n比肩しうるのは、せいぜいレッドウィンターの書記長くらいのものか。"
"212190-308" = "[s] \"……ん？\""
"212190-309-マコト" = "さあ、遠慮する必要はないぞ。今となっては先生にも分かったはずだ。"
"212190-310-マコト" = "ゲヘナに伸びた邪悪な魔の手は、私の雷鳴のごとき一喝によって砕け散り、#nその痕跡すら残っておらん。"
"212190-311-マコト" = "ゲヘナはこの上なく安全で、これからも偉大であり続けるのだ。"
"212190-312-マコト" = "今こそ永遠の同盟を結ぶにふさわしいとは思わんか？"
"212190-316" = "[ns] \"ありがとう！\""
"212190-318" = "[ns1] \"今回はマコトのおかげで危機を乗り越えられた。\"\n[ns2] \"先生として、大人として感謝してる。\""
"212190-321-マコト" = "ふ、ふんっ……。"
"212190-322-マコト" = "そんな顔で言うなど反則だ。"
"212190-327-マコト" = "この一件、先生には多大な迷惑をかけてしまった。"
"212190-328-マコト" = "なかなか言い出しにくくてな……。"
"212190-329-マコト" = "なにより、先生に与えた肉体的、精神的苦痛をどう償ったものか見当もつかん。"
"212190-330-マコト" = "脅迫し、拘束し、苦労をかけた。#n……もはや迷惑の域を超えている。"
"212190-331-マコト" = "……何をすればいい？"
"212190-332-マコト" = "どうすれば、先生が納得する謝罪になる？"
"212190-333" = "[s] \"マコトが、マコトのままでいてくれることかな。\""
"212190-334-マコト" = "なっ……！？"
"212190-335-マコト" = "それは……どういう意味だ？"
"212190-336-マコト" = "いまひとつ真意を汲み取りかねるのだが……。"
"212190-337" = "[s] \"じゃあ、これは宿題ね。\""
"212190-341" = "[ns] \"その意味を考え続けて欲しい。\""
"212190-342-マコト" = "…………。"
"212190-343-マコト" = "私が私のままでいること……それでよいのか……？"
"212190-344-マコト" = "自分がどんな人間なのかを見つめ直せということか？"
"212190-345-マコト" = "……難しいな。先生の言葉はいつもそうだ。"
"212190-349-マコト" = "宿題として、胸に深く刻んでおこう。"
"212190-350-マコト" = "重ねて、万魔殿の議長としてもう1つ。"
"212190-351-マコト" = "二度と、このような事は起こさせないと誓おう。"
"212190-352-マコト" = "ゲヘナは大丈夫だ。"
"212190-353" = "[s] \"うん。信じてる。\""
"212190-354-マコト" = "……ああ。"
"212190-355-マコト" = "信頼にこたえ続けるためにも、まだまだ励まねばな。"
"212190-360-イロハ" = "……。"
"212190-364-イロハ" = "で、いつまでしょぼくれてるつもりですか？調子が狂うじゃないですか。"
"212190-365-マコト" = "それは、この私に言っているのか？"
"212190-366-イロハ" = "他に誰がいるんですか。#n馬鹿っぽくて、意地っ張りで、自己肯定感だけは天井知らずなマコト先輩に言ってるんです。"
"212190-367-マコト" = "はっ、安い挑発だな。この私の元気がないなど――"
"212190-368-イロハ" = "分かりますよ。"
"212190-369-イロハ" = "あの日からずっと、ちゃんと眠れなくて無駄に寝返り打ってますよね。"
"212190-370-マコト" = "……。"
"212190-371-イロハ" = "あれは間違いなく失態でした。ですが、罪人みたいな顔してないでくださいよ。"
"212190-372-イロハ" = "雷帝のことを考えすぎるのもやめましょうよ。#n「またこんなことが起きたらどうしよう」って、びくびくして。"
"212190-373-イロハ" = "不安がって怖がってるのなんて、先輩には似合いません。"
"212190-374-イロハ" = "今まで通り、勢いで押し切ってください。"
