[translation]
"212170-1" = "第17話;ゲヘナ奪還作戦（２）"
"212170-5-マコト" = "……。"
"212170-7-イオリ" = "マ、マコト議長……！？"
"212170-13-イオリ" = "くっ！！"
"212170-17-チナツ" = "イオリ……！！"
"212170-23-マコト" = "キキキッ……なかなか善戦したようだが、ここまでだ。"
"212170-24-マコト" = "[ruby=しろみ]銀鏡[/ruby]イオリ、[ruby=ひのみや]火宮[/ruby]チナツ。たかがその程度の戦力でゲヘナの転覆を企てたのか？"
"212170-25-マコト" = "お前たちは[ruby=そらさき]空崎[/ruby]ヒナが特に目をかけていると聞いていたが。"
"212170-26-マコト" = "なぜこんな選択をした？#n反旗を翻してまで成し遂げたいことがあったのか？"
"212170-31-イオリ" = "……そうだな。どうしても分からせなきゃいけないんだ。"
"212170-32-マコト" = "……。"
"212170-37-ヒナ" = "マコト、ここは私が話す。"
"212170-38-マコト" = "……ふん。蒔いた種は自分で刈り取る、というやつか。"
"212170-42-ヒナ" = "……イオリ、チナツ。"
"212170-43-チナツ" = "委員長……。"
"212170-47-ヒナ" = "……警告はしたはずよ。"
"212170-48-ヒナ" = "これ以上、ゲヘナの結束を乱す行動はするなって。"
"212170-49-イオリ" = "ゲヘナの結束……？"
"212170-50-イオリ" = "委員長の言う「ゲヘナの結束」って何なんだよ？"
"212170-51-ヒナ" = "……。"
"212170-52-ヒナ" = "みんなが一つの目標のために動くこと。統制に従うこと。#n究極の目標であるキヴォトス統一に向けて一つの心でまとまること。"
"212170-53-ヒナ" = "ただそれだけ。簡単なことよ。"
"212170-54-イオリ" = "ふっ……。"
"212170-60-イオリ" = "違うよ、委員長。簡単なんかじゃない。#n委員長にとっても、私たちにとっても。"
"212170-61-イオリ" = "それが簡単なことであっちゃいけないんだ。"
"212170-66-ヒナ" = "諦めて。そんな身体じゃ、もう戦えない。"
"212170-67-イオリ" = "……委員長、覚えてる？#n風紀委員会に入りたいって、私が言いに行った日のこと。"
"212170-68-ヒナ" = "……ええ。覚えてるわ。"
"212170-69-イオリ" = "私は勝手気ままな空気がゲヘナの魅力だって思ってた。#nだけど同時に、怖くもあったんだ。"
"212170-70-イオリ" = "みんながみんな自分勝手だったら……結局、何も残らない気がしたから。"
"212170-71-イオリ" = "そんな時に委員長を見た。"
"212170-73-イオリ" = "何人も暴れ回る修羅場で1人だけ黙って線を引いて立ってた、委員長の背中を。"
"212170-75-ヒナ" = "……。"
"212170-76-イオリ" = "あの背中を見て、私もその線を守る人になりたくて……風紀委員会に入ったんだ。"
"212170-81-チナツ" = "私も同じです。#n委員長が引いてくださった線があったから、ゲヘナの自由は保たれていたんです。"
"212170-82-チナツ" = "必要最低限の秩序を保ってきたのは、委員長なんですよ。"
"212170-83-チナツ" = "ですが……委員長が進もうとしている道は、あの時とは違います。"
"212170-99-ヒナ" = "くっ……！ぐうぅっ……！"
"212170-103-イオリ" = "委員長……！"
"212170-133-チアキ" = "先生、こっちです！"
"212170-137" = "[ns] \"危ない！\""
"212170-143-チナツ" = "委員長、思い出してください！あなたが誓った決意を！"
"212170-144-ヒナ" = "うぅっ……。"
"212170-149-アコ" = "……イオリ、チナツ。どうしてそこまで意地を張るんですか？#nもう傷だらけなのに……。"
"212170-153-イオリ" = "アコちゃん……！"
"212170-154-アコ" = "はあ……。あなたたちのためにも、委員長のためにも、やめてください。"
"212170-155-チナツ" = "え……？"
"212170-156-アコ" = "ヒナ委員長をこれ以上苦しませないでください。"
"212170-157-アコ" = "分かっているでしょう？#nあなたたちの言う「線」を誰よりも必死に守ってきたのは委員長です。"
"212170-158-アコ" = "いつも疲れていて、苦しんでいた姿を……あなたたちも見てきましたよね。#nそんな委員長が、ようやく平穏を手に入れたんです。"
"212170-159-アコ" = "ゲヘナの誰一人として委員長を苦しめず、すべてが整然と流れているのに……#nなぜあなたたちは以前の姿を押しつけようとするんですか？"
"212170-160-イオリ" = "違うよ……押しつけなんかしてない。#nそれに今のゲヘナを支配してるのは秩序なんかじゃない。"
"212170-161-アコ" = "別に、なんだろうといいんですよ。#n私はヒナ委員長が幸せでいられる世界を望んでいるだけですから。"
"212170-162-アコ" = "そしてそれは、外に敵がいる状態でなら実現できる。"
"212170-163-アコ" = "ゲヘナがまとまるためには憎むべき相手が必要なんです。#n学園の外……キヴォトスという存在が。"
"212170-198-イオリ" = "アコちゃんは……植え付けられた思想に操られてるんだよ……。"
"212170-199-アコ" = "侮辱的な物言いですね。"
"212170-200-イオリ" = "違う！先輩たちを解放したいだけなんだ……！"
"212170-201-イオリ" = "銃を取ったのだって、先輩たちが憎いからじゃない！"
"212170-202-イオリ" = "これで助けられるなら、後で怒られたって構わない！！"
"212170-203-チナツ" = "委員長は仰っていましたよね。力があっても、勝手はしないと。"
"212170-204-ヒナ" = "……。"
"212170-205-チナツ" = "力があっても、守るべき一線を守る。"
"212170-206-チナツ" = "――力があるからこそ、守るべき一線を守る。"
"212170-207-チナツ" = "私たちは力尽き倒れるその時まで止まりません。"
"212170-211-チナツ" = "それが――あなたの教えに報いる[ruby=私たち]風紀委員会[/ruby]のやり方です。"
"212170-216-イオリ" = "何度だって言うよ。今の委員長は間違ってる。だから――"
"212170-220-イオリ" = "委員長に教えてもらった「線」を、私たちが委員長に引きなおす！！"
"212170-221-マコト" = "ふん、敗者どもの戯言ももう十分だろう。ヒナ、何を迷っている？"
"212170-222-マコト" = "秩序を乱す反逆者に、容赦なき処罰を下せ！"
"212170-223-ヒナ" = "……うっ、くっ……処罰……いや、線……私が引いたものは……。"
"212170-224-アコ" = "委員長……！！"
"212170-225-ヒナ" = "……違う。私は、私は――！"
"212170-231-ヒナ" = "私は……！！！"
"212170-240-イオリ" = "くっ……！"
"212170-244-チナツ" = "イオリ……！！"
"212170-250-イオリ" = "戻ってきてよ、先輩……。"
"212170-258" = "[ns] \"イオリ、よく耐えてくれたね。\""
"212170-259-イオリ" = "せ、先生……。"
"212170-260-イオリ" = "バカ、遅すぎるって……！！"
"212170-261" = "[s] \"ごめん。後は私に任せて。\""
"212170-266-ヒナ" = "先生……。"
"212170-267-マコト" = "ここにいてはいけないはずだが……どうやって？"
"212170-283-カスミ" = "ああ、先生。"
"212170-284-カスミ" = "私たちは後方で待機しているとしよう。"
"212170-285-カスミ" = "どうにもあっちとは相性が悪くてね。"
"212170-286-カスミ" = "特に今みたいな本気モードだと、私はあまり役に立てそうもない。"
"212170-287-チアキ" = "大丈夫です！ここからは私が責任をもってお連れしますから！"
"212170-288-カスミ" = "何かあれば遠慮せず呼んでくれたまえ。すぐに駆けつけよう。"
"212170-289-チアキ" = "はいっ！ご協力ありがとうございますっ！！"
"212170-293" = "[ns] \"カスミのお陰で助かったよ。\""
"212170-296-カスミ" = "なに、山場はまだ先だろう？気を抜くんじゃないぞ。"
"212170-298-ヒナ" = "……不穏分子はこんなに残っていたのね。"
"212170-299-ヒナ" = "まだ片づいてないのは私の責任か……。"
"212170-300" = "[s] \"ヒナ。これがヒナのやりたかったことなの？\""
"212170-304-ヒナ" = "……。"
"212170-305-ヒナ" = "前に言ったはずよ。#n私はゲヘナのために生きてきたって、やっと気づいたの。"
"212170-309-ヒナ" = "はぁ……。"
"212170-310-ヒナ" = "どうしてみんな、私がおかしいって言うんだろう。"
"212170-311-ヒナ" = "……ただ応援して、認めてくれればいいだけなのに。"
"212170-312-アコ" = "委員長……。"
"212170-313" = "[s] \"……。\""
"212170-314-？？？" = "やはっ、笑わせんなし！"
"212170-318-アコ" = "何ですって？"
"212170-326-カレン" = "崖っぷちから飛び降りようとしてんのに、それを応援するのは流石に馬鹿っしょ。"
"212170-327-カレン" = "あー、あー、駆けつけてみれば、後輩ぶん殴りながら言うことがそんだけ？#nやはっ、ウケんね。呆れるんだけど。"
"212170-328-ヒナ" = "ゲヘナ再興委員会……どうりで姿が見えないと思った。"
"212170-329-マユミ" = "勘違いしないでよね。私たちは先輩に憧れてここまで来たんじゃないから。#nなんなら逆。やってることが温くて、ずっともどかしかった。"
"212170-330-マユミ" = "それでもあの頃の[ruby=そらさき]空崎[/ruby]ヒナは、みんなに信じさせる力があった。"
"212170-335-イオリ" = "お前たち……。"
"212170-336-カレン" = "よく頑張ったじゃん。2人は休んでて。"
"212170-337-イオリ" = "うん……。"
"212170-338-チナツ" = "お二人がここにいるということは――"
"212170-339-マユミ" = "そういうこと！"
"212170-340-チナツ" = "ああ、よかった……です。"
"212170-347-イロハ" = "……マコト先輩。"
"212170-348-マコト" = "……イロハ。ここに現れないことを願っていたのだがな。"
"212170-349-イロハ" = "……。"
"212170-350-マコト" = "チアキ、お前もか。"
"212170-351-チアキ" = "は～い……。"
"212170-355-マコト" = "……キシシッ、そうか。そういうことか。"
"212170-356-？？？" = "あはっ……あははっ、あはははっ！！"
"212170-360-マユミ" = "この声は……。"
"212170-366-ショウコ" = "ようやく役者が揃いましたね。"
"212170-368-マユミ" = "ショウコ……。"
"212170-369-カレン" = "ショウコちゃん、なに言ってるの？"
"212170-375-ショウコ" = "クライマックス、ということです。"
"212170-376-ショウコ" = "秩序は既に築かれたというのに。#n今さら揺るがそうとして集っている姿……実に哀れですね。"
"212170-380-ショウコ" = "――負け犬どもが。"
"212170-381-イオリ" = "何が言いたいんだ。"
"212170-382-ショウコ" = "貴女方の些細な悪あがきは歴史に記録されることすらありません。"
"212170-383-ショウコ" = "虚しく、無意味な出来事として終わるでしょう。#nなぜなら……歴史は勝者の視点から綴られるのですから。"
"212170-384-ショウコ" = "……そう、勝者だけが生き残るのです。"
"212170-385-ショウコ" = "そして今、新たな……いえ、正当な歴史が刻まれる。"
"212170-386-ショウコ" = "彼女の思想と価値観こそが正しかったと。#n……その偉大な意志を肯定する世界が生まれるのです。"
"212170-387-イロハ" = "彼女……？誰の話をしてるんですか？"
"212170-391-カレン" = "……まさか。"
"212170-397-ショウコ" = "雷帝。"
"212170-399" = "次回;炎となる私たち"
