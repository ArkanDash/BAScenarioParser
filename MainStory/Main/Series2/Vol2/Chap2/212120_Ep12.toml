[translation]
"212120-1" = "第12話;応援してくれる、先生？"
"212120-4-イオリ" = "……終わった。"
"212120-5-マユミ" = "だよねぇ……。"
"212120-6" = "[s] \"……。\""
"212120-8-チアキ" = "放送室の警備があそこまで厳重だなんて……。"
"212120-16-風紀委員" = "建物への立ち入りは禁止です。"
"212120-17-チアキ" = "え？あ、取材したいことがあって来たんですけど――"
"212120-18-風紀委員" = "ダメです。"
"212120-19-チアキ" = "えっと……私、週刊万魔殿の記者で……それでもダメですか？"
"212120-20-風紀委員" = "はい。誰だろうと立ち入りはできません。"
"212120-21-チアキ" = "どうしよう……。"
"212120-25-カレン" = "建物の前もだけど、ちらっと見た感じ中も警備がびっしりだったよ。"
"212120-26-マユミ" = "めちゃくちゃ警戒されてるじゃん……。"
"212120-27-カレン" = "……もう強行突破しかなくない？"
"212120-29-イオリ" = "単純に頭数が足りないし、突破できたとしてもその先がない。"
"212120-30-イロハ" = "サツキ先輩が入れたとしても、すぐに手掛かりを見つけられる保証はありません。"
"212120-31-イロハ" = "その間に別の戦力が……特に風紀委員長が増援に来たら終わりです。"
"212120-32-イオリ" = "……。"
"212120-38-サツキ" = "見方を変えれば、私たちの仮説が正しい証拠とも言えるわね。"
"212120-39-マユミ" = "どうして？"
"212120-40-サツキ" = "警備にあれだけの人数を割いているのだもの。"
"212120-41-サツキ" = "そうまでして守るべきものが放送室にあるということよ。"
"212120-42-マユミ" = "あ、そっか。じゃあ良いことではあるのかな？"
"212120-43-サツキ" = "警備が固すぎて入れないことを除けばね。"
"212120-48-イオリ" = "……。"
"212120-49-イオリ" = "……何か変じゃないか？"
"212120-50-カレン" = "何が？"
"212120-51-イオリ" = "警備って何かを守るためにするだろ？"
"212120-52-イオリ" = "それで放送室が守られてるってことは――"
"212120-54-チナツ" = "……。"
"212120-55-イロハ" = "その言い方だと……。"
"212120-56-イオリ" = "あそこに手掛かりがあることを知ってる[ruby=・]誰[/ruby][ruby=・]か[/ruby]がいる。"
"212120-60-イオリ" = "つまり……この状況を仕組んだやつがいるってことなんじゃ……？"
"212120-61-マユミ" = "……！！"
"212120-62-イオリ" = "それなら、これは事故なんかじゃない。"
"212120-63-カレン" = "……事件を起こした犯人がいるってことね。"
"212120-64" = "[s] \"……。\""
"212120-65-イロハ" = "状況証拠から見れば……ほぼ確実でしょうね。"
"212120-66-マユミ" = "……でも、誰が？"
"212120-72-イオリ" = "ん？他に誰か来る予定なんてあっ――"
"212120-82-ショウコ" = "……。"
"212120-84-マユミ" = "ショウコ？"
"212120-85-カレン" = "ショウコちゃん……！"
"212120-87-ショウコ" = "……皆さん、こちらにいらしたんですね。"
"212120-88-マユミ" = "わぁ～！ショウコもこっちに来てくれたの？"
"212120-89" = "[s] \"待って、マユミ……！\""
"212120-94-イオリ" = "動くな！"
"212120-98-ショウコ" = "……。"
"212120-99-イオリ" = "……何をしに来たんだ？"
"212120-100-ショウコ" = "チャンスを差し上げるために。"
"212120-101-イロハ" = "チャンス……？"
"212120-102-ショウコ" = "何がゲヘナにとって正しいことなのか、悟るための機会を。"
"212120-103-チナツ" = "……。"
"212120-105-イオリ" = "へえ？お前の言う正しさってのは何なんだ？"
"212120-109-ショウコ" = "ゲヘナを裏切らないことです。"
"212120-115-ショウコ" = "秩序に則り、偉大なるゲヘナに貢献すること。"
"212120-116-ショウコ" = "そして戦列に加わり、血と鉄をもって敵を打ち倒すこと。"
"212120-117-ショウコ" = "以上です。"
"212120-118-イオリ" = "笑わせるなよ。そんなの、正しいはずがない。"
"212120-119-ショウコ" = "いずれ歴史が証明するでしょう。"
"212120-120-ショウコ" = "その歴史とは、力ある者によって記されるのですがね。"
"212120-121-ショウコ" = "皆さんの活躍は見届けさせていただきますよ。"
"212120-127-マユミ" = "ショウコ……！"
"212120-128-カレン" = "……本気なの？"
"212120-129-ショウコ" = "委員長、カレン。選択の機会は十分に差し上げたつもりです。"
"212120-130-カレン" = "……。"
"212120-131-ショウコ" = "……これで、道は分かれましたね。"
"212120-132-マユミ" = "……。"
"212120-136-ショウコ" = "二人とも手が焼けますね。"
"212120-137-ショウコ" = "私がいなかったらどうするつもりだったんですか？"
"212120-142-カレン" = "そしたらこんなことやってないし！"
"212120-143-マユミ" = "言い出しっぺはショウコじゃん！！"
"212120-145-ショウコ" = "それもそうですね。"
"212120-148-マユミ" = "ショウコ……。"
"212120-149-マユミ" = "私たち、どうしてこんなことになっちゃったのかな……？"
"212120-150-ショウコ" = "……ゲヘナのためです。"
"212120-151-ショウコ" = "ゲヘナを、再興するため。"
"212120-152-カレン" = "……。"
"212120-153-マユミ" = "違う、こんなの……全然違うよ。"
"212120-155-ショウコ" = "感傷はここまでです。"
"212120-158-ショウコ" = "1本、線を引きましょう。"
"212120-159-ショウコ" = "貴女方が邪魔をすれば、ゲヘナの結束に綻びが生じます。"
"212120-160-ショウコ" = "これは警告です。"
"212120-161-ショウコ" = "真にゲヘナを思うのならば、分裂を煽らないでください。"
"212120-162-ショウコ" = "貴女方の行いはゲヘナの不利益となります。"
"212120-168-ショウコ" = "ええ。どうぞ、こちらに。"
"212120-176-ヒナ" = "……。"
"212120-177" = "[s] \"ヒナ……。\""
"212120-178-イオリ" = "委員長……！"
"212120-179-ヒナ" = "……イオリ、チナツ。"
"212120-180-チナツ" = "……はい。"
"212120-181-ヒナ" = "今まで何をしていたの？"
"212120-182-イオリ" = "そ、それは……。"
"212120-183-ヒナ" = "知っているわよね？#n無断での離脱は、その場で処分することもできるほどの案件よ。"
"212120-185-チナツ" = "……。"
"212120-186-イロハ" = "風紀委員長、落ち着いてください。私たちはただ話を――"
"212120-191-ヒナ" = "イロハ。万魔殿を辞めると言ったそうね。"
"212120-192-イロハ" = "……その通りです。"
"212120-193-ヒナ" = "それはつまり、ゲヘナに反発するという理解でいいのかしら。"
"212120-194-ヒナ" = "風紀委員会の中核が、反旗を翻した者と一緒にいるのだけど……#n私はこの事実をどう受け取ればいいのかな。"
"212120-195-イロハ" = "……。"
"212120-199-ヒナ" = "サツキ、チアキ。あなたたちも万魔殿を辞めたの？"
"212120-206-ヒナ" = "そうじゃないなら万魔殿へ戻って。人手が足りなくててんてこ舞いなのだから。"
"212120-207-ヒナ" = "それからゲヘナ再興委員会。あなたたちにも聞きたいことがある。"
"212120-208-マユミ" = "私たちも……！？"
"212120-209-ヒナ" = "あなたたちの書記は睡眠を削ってまで最善の計画を組んでいるわ。"
"212120-210-ヒナ" = "叫び続けていたゲヘナが目の前にあるのに、あなたたちは何をしているの？"
"212120-214-マユミ" = "……それ、私たちが夢見てたゲヘナなの？"
"212120-215-ヒナ" = "勝手気ままな放縦を捨て、ただ1つの目標に向かって進む統制された集団。"
"212120-216-ヒナ" = "それを求めていたのでしょう？"
"212120-220-カレン" = "やはっ、それはちょっと違うっしょ。"
"212120-221-ヒナ" = "何が違うの？"
"212120-222-カレン" = "それは狂気って言うんだよ、先輩。"
"212120-223-ヒナ" = "同じゲヘナとして、最後の言葉と受け取っていいのかしら。"
"212120-228-ヒナ" = "間違わないように、はっきり言ってくれる？もう一度。"
"212120-229-カレン" = "やはっ……圧すっご……！"
"212120-230-マユミ" = "こ、これが風紀委員長の……本気……。"
"212120-235" = "[ns] \"ヒナ……！\""
"212120-239-ヒナ" = "ふぅ……。"
"212120-241-カレン" = "くっ……。"
"212120-242-マユミ" = "はぁ、はぁ……。"
"212120-247-ヒナ" = "改めて明言しておく。"
"212120-248-ヒナ" = "空虚な「自由」にかまけて怠惰を放置していたゲヘナは終わった。"
"212120-249-ヒナ" = "全員、持ち場に戻って。"
"212120-250-ヒナ" = "今後、また不穏な動きを見せるなら――"
"212120-254-ヒナ" = "相応の覚悟をすることね。"
"212120-255" = "[s] \"……。\""
"212120-256-ヒナ" = "……先生。"
"212120-257-ヒナ" = "どうしてここにいたのかは聞かない。"
"212120-258-ヒナ" = "その代わり、少し時間を貰えるかしら。"
"212120-259" = "[s] \"……分かった。\""
"212120-260-ヒナ" = "……うん。じゃあ、ついて来て。"
"212120-264" = "（ヒナに連れられて別の場所へ向かった）"
"212120-268" = "（残してきたみんなには、心配しないように伝えたけど……）"
"212120-269" = "（どう転ぶかは予想もつかなかった）"
"212120-273-ヒナ" = "先生……。"
"212120-274" = "[s] \"聞かせて。\""
"212120-275-ヒナ" = "……大丈夫？"
"212120-276" = "[s] \"どういう意味……？\""
"212120-277-ヒナ" = "だって、最近ずっとゲヘナにいるでしょ？"
"212120-278-ヒナ" = "先生も気にかけてくれてるんだよね。"
"212120-279-ヒナ" = "私たちにとって、とても大事な局面だから……。"
"212120-280" = "[s] \"……。\""
"212120-281-ヒナ" = "ねぇ、先生。"
"212120-282-ヒナ" = "ゲヘナが本格的にキヴォトスへの攻撃を始めたら、先生はどうするの？"
"212120-283" = "[s] \"私は……。\""
"212120-284-ヒナ" = "その時も、前みたいに言ってくれる？"
"212120-288-ヒナ" = "頑張ってくれてありがとう。#n力を尽くしてくれてありがとう。"
"212120-289-ヒナ" = "これからもずっと、応援するよ。"
"212120-290-ヒナ" = "――って。"
"212120-291" = "[s] \"…………。\""
"212120-292-ヒナ" = "……そっか。"
"212120-293-ヒナ" = "先生は……間違いだと思ってるんだね。"
"212120-294-ヒナ" = "でも、私は……。"
"212120-295-ヒナ" = "私は、自分の心がおかしいとは思わない。"
"212120-296-ヒナ" = "こんなに頭が冴えてたことも、行動に確信を持てることも、今までなかった。"
"212120-301-ヒナ" = "気づいたんだ。これが私の存在理由。"
"212120-302-ヒナ" = "私の力も、私の決断も、私の立場も。"
"212120-303-ヒナ" = "その全部は、キヴォトスをゲヘナが統べるためにある。"
"212120-304" = "[s] \"ヒナ……。\""
"212120-307-ヒナ" = "……どうしてだろうね。"
"212120-308-ヒナ" = "ふと、昔のことを思い出すんだ。"
"212120-309-ヒナ" = "どうしてあの時、私は……。"
"212120-310-ヒナ" = "どうして、雷帝に抗いながら――"
"212120-311-ヒナ" = "自由、の、ため、に……？"
"212120-317-ヒナ" = "くっ！ぐううっ……！"
"212120-318" = "[s] \"ヒナ……！\""
"212120-323-ヒナ" = "うああああ……！！"
"212120-335-ヒナ" = "……。"
"212120-336-ヒナ" = "……先生。"
"212120-337-ヒナ" = "私たちを……私を、今までみたいに応援して。"
"212120-338-ヒナ" = "それだけで、私はもっと頑張れる。どんなに辛いことだって乗り越えられる。"
"212120-339" = "[s] \"……。\""
"212120-341" = "[ns] \"うん、ヒナなら乗り越えられるよ。\""
"212120-343" = "[ns] \"私もヒナのために全力を尽くすね。\""
"212120-344-ヒナ" = "……信じるね。"
"212120-345-ヒナ" = "だから、お願い。これからは私の言う通りにして。"
"212120-356" = "[ns] \"ヒナ！？\""
"212120-357-ヒナ" = "さっきも言ったけど、一つになったゲヘナに異物はいらない。"
"212120-358-ヒナ" = "みんながまとまらなきゃいけない時だから。"
"212120-359-ヒナ" = "どうして逆らう生徒がいるのかは分からないけど……。"
"212120-360-ヒナ" = "支柱が無くなれば、自然消滅するはず。"
"212120-361-ヒナ" = "……その支柱が先生なんだって。"
"212120-362-ヒナ" = "だからしばらくは、先生を保護させてもらうね。"
"212120-368-ヒナ" = "こんなこと……できればやりたくない。"
"212120-369-ヒナ" = "先生に嫌われるかもって思うと、怖い。"
"212120-370-ヒナ" = "でも、こうしないと先生を守れないんだ。だから……私の気持ちを分かってほしい。"
"212120-377" = "（怪しく輝くヒナの目を見ながら、私は何も言えなかった）"
"212120-381" = "（生徒の夢を応援できないという現実が……）"
"212120-382" = "（言葉にならない気持ちとして心に渦巻いていた）"
"212120-384" = "次回;監禁"
