[translation]
"212030-1" = "第3話;ゲヘナ再興委員会の反応"
"212030-4-マユミ" = "……。"
"212030-5-カレン" = "……。"
"212030-6-ショウコ" = "……。"
"212030-9-マコト" = "歪んだキヴォトスを正し、ゲヘナの名の下に真の秩序を打ち立てる――戦いの始まりだ。"
"212030-15-マユミ" = "……。"
"212030-16-カレン" = "……。"
"212030-17-ショウコ" = "……。"
"212030-18-マユミ" = "ダメだー、ぜんっぜん分かんない。"
"212030-19-カレン" = "それなー。"
"212030-20-マユミ" = "でも……何が何だかさっぱりだけどさ……。"
"212030-21-マユミ" = "私たちが望んでたことだったりしない？"
"212030-22-カレン" = "え？"
"212030-23-マユミ" = "だって、ゲヘナがまとまろうとしてるじゃん。"
"212030-24-マユミ" = "万魔殿の議長と風紀委員長が対立してるのって、大きな問題だったわけだし。#nそれが解消されたんだよ。"
"212030-25-カレン" = "まあ、それはそうだけど……いいの？ほんとに。"
"212030-26-マユミ" = "んー、こういうのはなんか違う気がするんだよね……。"
"212030-27-カレン" = "攻め込む、って……。"
"212030-29-ショウコ" = "……。"
"212030-31-カレン" = "言葉の綾だったりしないかな……？"
"212030-32-カレン" = "ほら、あるじゃん？#n大きな敵と戦うために、これまでのライバルと手を組む～みたいな。"
"212030-33-マユミ" = "それにしては本気っぽかったけど……いやいや、まさかね。"
"212030-34-マユミ" = "そもそも、そんな簡単にできることでもないし。"
"212030-36-ショウコ" = "ですが、攻め込んではいけない理由もありません。"
"212030-41-マユミ" = "んん？"
"212030-42-カレン" = "どういう意味？"
"212030-44-ショウコ" = "言葉通りです。"
"212030-45-ショウコ" = "ゲヘナをまとめる最善の方法。それは、共通の敵を作ることです。"
"212030-46-カレン" = "でも、その相手がキヴォトスってのはやりすぎじゃない？"
"212030-47-ショウコ" = "そうは思いません。#nこれまで、ゲヘナを問題児集団だと見なして抑えつけてきたのは誰ですか？"
"212030-48-ショウコ" = "キヴォトスです。ゲヘナを認めさせるには、圧倒的な力が必要でしょう。"
"212030-49-ショウコ" = "ですから、これはゲヘナの正当な権利であり、キヴォトスからの認識に対する応答であると考えています。"
"212030-50-マユミ" = "そうかなぁ……？"
"212030-51-ショウコ" = "動かなければ、偉大さは得られません。"
"212030-53-カレン" = "それで……攻撃、か……。"
"212030-55-マユミ" = "こういうの、真面目に考えたことなかったな……。"
"212030-56-ショウコ" = "といっても、今までと大きく変わることはありません。"
"212030-57-ショウコ" = "「トリガー・ハッピー・ゾーン」がキヴォトスに広がる。その程度の違いです。"
"212030-58-マユミ" = "どういうこと？"
"212030-59-ショウコ" = "号令に合わせて撃ち、爆破し、破壊する。"
"212030-60-ショウコ" = "その対象が、トリニティの本館、ミレニアムタワー、百鬼夜行の神木などに変わるだけ。"
"212030-61-ショウコ" = "それで十分です。"
"212030-63-カレン" = "でも、反撃してくるよね？"
"212030-64-カレン" = "壊されるための標的とはだいぶ違う気がするけど。"
"212030-65-マユミ" = "そうそう。他の学園だって、かなり強いだろうし。"
"212030-66-マユミ" = "いくら私たちが一つになったって――"
"212030-68-ショウコ" = "可能です。"
"212030-75-ショウコ" = "委員長も言っていたじゃないですか。私たちのあらゆる行動には意味があったと。"
"212030-76-マユミ" = "あ……うん。そんなこと言ったね。"
"212030-77-ショウコ" = "私たちの活動によって、今やゲヘナの大多数の生徒が隊列を維持して歩けますし――"
"212030-82-ゲヘナの生徒A" = "みんなで一緒に動くのも、意外と楽しいよね。"
"212030-83-ゲヘナの生徒B" = "分かる！やってると癖になるって言うか。"
"212030-89-ショウコ" = "戦術的な行動を取れるようになっています。"
"212030-94-ゲヘナの生徒C" = "前方にクレイモア！回避して右側から射撃開始！"
"212030-101-ゲヘナの生徒D" = "建物の上に狙撃手を確認！"
"212030-102-ゲヘナの生徒D" = "グレネードランチャー持ってきて！2階ごと吹っ飛ばすよ！#nあれを落とせば200ポイントだって！"
"212030-117-マユミ" = "そ、それはストレスを発散させるためで……。"
"212030-118-ショウコ" = "それを作り上げたのは誰でしょうか。"
"212030-123-ショウコ" = "私たちが。私が。貴女が。"
"212030-124-ショウコ" = "ゲヘナを作り替えたんです。"
"212030-125-マユミ" = "私、たちが……？"
"212030-126-カレン" = "作り替えた……？"
"212030-127-ショウコ" = "ええ。"
"212030-128-ショウコ" = "他の誰でもない、私たちが。"
"212030-129-マユミ" = "……。"
"212030-130-ショウコ" = "私たちがしてきたことには全て意味があったんです。"
"212030-131-カレン" = "……。"
"212030-132-ショウコ" = "歪んだキヴォトスを正し、ゲヘナの名の下に真の秩序を打ち立てる戦いが始まります。"
"212030-133-ショウコ" = "かつてのように、恐怖の象徴――どの学園も軽々しく見上げられなかったゲヘナへと戻るんです。"
"212030-137-ショウコ" = "ゲヘナが世界の基準となり、唯一の規則となる。"
"212030-138-ショウコ" = "旧き夢が叶う瞬間に、また一歩……。"
"212030-147-万魔殿の3年生" = "君が[ruby=いがらし]五十嵐[/ruby]ショウコだね？"
"212030-151-ショウコ" = "何かご用ですか？"
"212030-152-万魔殿の3年生" = "マコト議長から呼び出しだよ。万魔殿の作戦会議室に来てほしい。"
"212030-153-ショウコ" = "承知しました。"
"212030-157-ショウコ" = "それでは、行ってまいります。"
"212030-159-マユミ" = "あ、うん。頑張ってね。……何の用か分かんないけど。"
"212030-160-カレン" = "いってらっしゃ～い。"
"212030-166-万魔殿の3年生" = "そういえば、君たちも一緒なんだったね。"
"212030-171-マユミ" = "あ、えっと……。"
"212030-172-カレン" = "あの時のセンパイじゃん？#n昔のゲヘナのこと話してくれた――"
"212030-174-万魔殿の3年生" = "ついに成就するんだよ！どうかな。君たちも嬉しいだろ？"
"212030-175-マユミ" = "えっ？何が……？"
"212030-176-万魔殿の3年生" = "ついにゲヘナが過去の姿を取り戻すんだよ！"
"212030-177-万魔殿の3年生" = "君たちもそれを夢見ていたんだろう？"
"212030-178-マユミ" = "え……昔の、ゲヘナ……？"
"212030-179-万魔殿の3年生" = "そう！恐怖で君臨していたあの時代！偉大だったゲヘナさ！"
"212030-180-マユミ" = "で、でも、あんまり良くなかったって言ってたよね？"
"212030-182-カレン" = "戻りたくないって言ってたのに、何でそんな嬉しそうなの？"
"212030-184-万魔殿の3年生" = "ああ、それは忘れてくれ。私が間違ってたんだ。"
"212030-185-マユミ" = "……。"
"212030-186-万魔殿の3年生" = "昔のゲヘナは秩序と統制で支配されていた。まさに、君たちが夢見た通りに。"
"212030-187-万魔殿の3年生" = "みんな同じ心で、一つの目的だけを目指して動いていた。#n面倒で複雑なことなんて考えなくていい、偉大な学園だったのさ。"
"212030-188-カレン" = "……。"
"212030-189-万魔殿の3年生" = "あの時は果たせなかったことが、ようやく実現しようとしてるんだ。"
"212030-190-万魔殿の3年生" = "キヴォトスに攻撃を仕掛ける！こんなに痛快なことがあるか？"
"212030-191-万魔殿の3年生" = "ついにゲヘナが戻ってくるんだ。昔の、偉大で恐ろしかったゲヘナが。"
"212030-197-マユミ" = "なんか……前とキャラ違くない……？"
"212030-198-カレン" = "先輩、大丈夫？"
"212030-200-万魔殿の3年生" = "もちろん。最高な気分だよ！"
"212030-201-万魔殿の3年生" = "この前まではさ、無責任な自由が好きで、昔に戻りたいなんて考えもしなかった。"
"212030-202-万魔殿の3年生" = "でも、ようやく気づいたんだ。"
"212030-203-万魔殿の3年生" = "じゃあ、私はこれで戻るよ。"
"212030-204-万魔殿の3年生" = "君たちもせいぜい頑張りなよ。#nこの戦いに参加できること自体、本当に光栄なことなんだから。"
"212030-210-カレン" = "……ねぇ。"
"212030-211-カレン" = "あの先輩、過去に幻想を抱くなって言ってたよね？"
"212030-212-マユミ" = "……だね。"
"212030-213-カレン" = "……。"
"212030-217" = "次回;一つになったゲヘナ"
