[translation]
"212110-1" = "第11話;そばにいたい"
"212110-8-イブキ" = "……。"
"212110-9-マコト" = "……それで、進撃路は――"
"212110-10-イブキ" = "マコト先輩……。"
"212110-14-マコト" = "イブキ、どうした。今は忙しいのだが……。"
"212110-15-イブキ" = "……すごく忙しいの？"
"212110-16-マコト" = "うむ。どうにも人手が足りなくてな。処理すべき仕事が山積みなのだ。"
"212110-17-マコト" = "話は後にしてくれ。"
"212110-18-イブキ" = "……わかった。"
"212110-23-イブキ" = "サツキ先輩～"
"212110-27-イブキ" = "チアキ先輩～"
"212110-31-イブキ" = "……。"
"212110-32-イブキ" = "誰もいない……。"
"212110-33-イブキ" = "イロハ先輩は……ほんとに、もう帰ってこないのかな……。"
"212110-34-イブキ" = "イブキは、ずっと一緒にいたいのに……。"
"212110-39-イロハ" = "イブキ。"
"212110-43-イブキ" = "わあ～！イロハ先輩だ～！！"
"212110-44-イブキ" = "帰ってきてくれたの？イブキ、すっごくうれしい！"
"212110-45-イロハ" = "あ……それは違います。"
"212110-46-イブキ" = "え……？"
"212110-47-イブキ" = "でもイロハ先輩、まだ腕章つけてるよね……？"
"212110-48-イロハ" = "これは……。"
"212110-52-イロハ" = "自分でもどうしてまだ持っているのか分かりませんけど……。"
"212110-53-イロハ" = "マコト先輩が元通りになるまでは、万魔殿に戻るつもりはありません。"
"212110-54-イブキ" = "マコト先輩、ずっと変なまま……。"
"212110-55-イロハ" = "……。"
"212110-56-イロハ" = "イブキはどう過ごしていましたか？"
"212110-57-イロハ" = "心配で様子を見に来たんです。"
"212110-58-イブキ" = "イブキはね、すっごく元気に――"
"212110-59" = "……。"
"212110-62-イブキ" = "……。"
"212110-63-イロハ" = "……元気に過ごせているわけではなさそうですね。"
"212110-64-イブキ" = "うん……みんな、すっごく忙しそう。"
"212110-65-イブキ" = "イロハ先輩が出ていっちゃってから、マコト先輩も一生懸命お仕事してる。"
"212110-66-イブキ" = "他の人たちといろいろやってるの。"
"212110-67-イブキ" = "作戦とか、計画とか、そういうのをいーっぱい。"
"212110-68-イブキ" = "だから疲れてるみたいで……イブキともあんまり遊んでくれない。"
"212110-69-イロハ" = "……。"
"212110-70-イブキ" = "サツキ先輩とチアキ先輩も、最近はあんまり来てないんだ。"
"212110-71-イブキ" = "だから、イブキさみしい。"
"212110-72-イロハ" = "……予想通りでしたか。"
"212110-73-イロハ" = "イブキ、私と一緒に来ますか？"
"212110-74-イブキ" = "え？ほんとに？"
"212110-75-イロハ" = "はい。万魔殿は……もうイブキにとって良い環境じゃない気がするんです。"
"212110-76-イロハ" = "ちゃんと見てくれる人もいないのならなおさら。"
"212110-77-イロハ" = "私と一緒に来れば髪をとかしてあげますし、本も読んであげますよ。"
"212110-78-イブキ" = "わあ～！イブキ、イロハ先輩に髪とかしてもらうのが一番好き！"
"212110-79-イロハ" = "……ふふ。はい。"
"212110-80-イブキ" = "でも……。"
"212110-84-イブキ" = "そしたら、マコト先輩がひとりぼっちになっちゃう。"
"212110-85-イロハ" = "……。"
"212110-86-イブキ" = "ひとりだとさみしいって、イブキ知ってるんだ。"
"212110-87-イブキ" = "マコト先輩……すごくさみしいと思う。"
"212110-88-イロハ" = "……そうですね。"
"212110-89-イブキ" = "だから、イブキはね――"
"212110-90-イブキ" = "マコト先輩と一緒にいる。"
"212110-91-イロハ" = "……大丈夫ですか？"
"212110-92-イブキ" = "うん。イブキ、つよいもん。おりこうにしてられるよ！"
"212110-93-イロハ" = "イブキの気持ちがそうなら……分かりました。"
"212110-94-イブキ" = "イロハ先輩、マコト先輩が元に戻るまで、ちゃんと待っててね。"
"212110-95-イブキ" = "それで、絶対に万魔殿に戻ってくるの。いい？"
"212110-96-イロハ" = "……はい。そうします。"
"212110-101-イブキ" = "約束！"
"212110-106-イロハ" = "約束です。"
"212110-116-マコト" = "……。"
"212110-117-マコト" = "ふぅ……ようやく一息つけそうだ。"
"212110-122-イブキ" = "……マコト先輩、もう忙しいの終わった？"
"212110-123-マコト" = "ああ、イブキ。"
"212110-124-マコト" = "1つ山場を越えただけだ。まだまだ終わりは見えんな。"
"212110-125-マコト" = "イロハのやつはこんなものを黙々と処理していたのか……。"
"212110-126-マコト" = "ふん、いないやつの話をしても仕方あるまい。"
"212110-127-イブキ" = "マコト先輩、イロハ先輩に会いたい？"
"212110-128-マコト" = "はっ！誰がそんなことを言った？"
"212110-129-マコト" = "この程度、私ひとりでも処理できるということだ。"
"212110-130-マコト" = "普段は仕事をしていないからといって、実務も完璧に把握しているのでな。キシシッ。"
"212110-131-イブキ" = "違うよ。イブキは、会いたい？って聞いたの。"
"212110-135-マコト" = "…………。"
"212110-136-イブキ" = "……最近のマコト先輩、すごくさみしそう。"
"212110-137-マコト" = "……そんなことはない。"
"212110-138-マコト" = "この[ruby=はぬま]羽沼[/ruby]マコト様は、来る者拒まず、去る者追わずだ。"
"212110-139-マコト" = "特に今のような大事な時に反旗を翻した者であれば、なおさらな。"
"212110-140-マコト" = "なにより、優れた指導者とは孤独なものだ。お前にはまだ分からぬだろうがな。"
"212110-141-イブキ" = "うん……イブキ、そういう難しいのはよく分かんない……。"
"212110-142-イブキ" = "でもマコト先輩、前に言ってたよね？反抗はかっこいいことだって。"
"212110-146-マコト" = "……私が？"
"212110-147-イブキ" = "うん。"
"212110-151-マコト" = "……反抗。反抗か。"
"212110-152-マコト" = "……。"
"212110-153-マコト" = "……ああ。"
"212110-158" = "[log=???][ff4444]イブキ、どうして命令に従わないのですか？[-][/log]"
"212110-161-？？？" = "マコトさんがかわいそうだから……#nイブキがスイッチを上げたら、マコトさん痛がるから……。"
"212110-165" = "[log=???][ff4444]あれはゴミですよ、イブキ。[-][/log]"
"212110-167" = "[log=???][ff4444]統制に従わず、[-][/log]"
"212110-169" = "[log=???][ff4444]体制に反抗して留年までしたゴミ。[-][/log]"
"212110-172-？？？" = "ち、違うよ……ゴミじゃない……。"
"212110-176-？？？" = "ごほっ、ごほっ……キシシッ、どうした雷帝？#n……思い通りにならんのか？"
"212110-183-マコト" = "くっ……！頭が……。"
"212110-184-イブキ" = "マコト先輩……！！"
"212110-185-イブキ" = "マコト先輩……大丈夫……？#nごめんなさい……イブキが……。"
"212110-190-マコト" = "……。"
"212110-191-マコト" = "ああ、いや……違うんだ。"
"212110-192-マコト" = "大したことではない。少し頭痛がしただけだ。"
"212110-193-イブキ" = "大丈夫……？"
"212110-194-マコト" = "もちろんだ。お前は悪くない。謝る必要なんて何ひとつない。"
"212110-195-マコト" = "……そうだ。お前には何の罪もない。"
"212110-200-マコト" = "お前が望むことを、お前がしたいことをやればいい。"
"212110-201-マコト" = "それでいいのだ。"
"212110-205-イブキ" = "……だったら、イブキはマコト先輩のそばにいたい。"
"212110-206-マコト" = "……。"
"212110-207-マコト" = "……ああ。"
"212110-212-マコト" = "そうしよう。"
"212110-214" = "次回;応援してくれる、先生？"
