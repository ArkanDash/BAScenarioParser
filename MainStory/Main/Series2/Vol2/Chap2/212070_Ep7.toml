[translation]
"212070-1" = "第7話;よく分からない"
"212070-4" = "（マユミとカレンから、思い悩んでいるような連絡が来た）"
"212070-10" = "（待ち合わせ場所に急いで向かった）"
"212070-15-マユミ" = "先生……。"
"212070-16-カレン" = "……やっほ、先生。"
"212070-17" = "[s] \"ごめん、お待たせ。\""
"212070-18-カレン" = "先生、知ってるよね……？ゲヘナの状況……。"
"212070-19" = "[s] 頷く。"
"212070-20-カレン" = "やはっ、やっぱり。先生って大変だね。"
"212070-21-カレン" = "全部の学園に気を配らなきゃいけないのに、ゲヘナがこんな事になってさ……。"
"212070-22-マユミ" = "……先生はどう思う？"
"212070-24" = "[ns] \"どうにかするよ。全力で。\""
"212070-25-マユミ" = "……言うと思った。"
"212070-26-マユミ" = "私たちがどう思ってるか、って？"
"212070-30-マユミ" = "どう思ってるんだろうね……何が何だかさっぱりなんだ……。"
"212070-31-マユミ" = "万魔殿と風紀委員が手を組んだのは良かったと思う。#nゲヘナがまとまる第一歩だし、私たちが言ってきたことでもあるから。"
"212070-34-マユミ" = "でも、この雰囲気は……違う。#n高圧的で、生徒を恐怖で統制しようとしてて……。"
"212070-35-マユミ" = "それにキヴォトスに攻撃って何？撃ったり壊したりするのとはぜんぜん違うじゃん。"
"212070-38-マユミ" = "先輩たちは準備にかかりきりみたいだけど……あれ、本当に本気なのかな？"
"212070-39-マユミ" = "周りの子も、裏切り者扱いされたくなくて巻き込まれてるし……。"
"212070-42-マユミ" = "これって本当に正しいの？これが本当に、偉大なゲヘナへ向かう道なの？#n……どうしたらいいのかな。"
"212070-43-カレン" = "委員長……。"
"212070-44-マユミ" = "ずーっと、頭ぐるぐるしちゃってるんだ。"
"212070-48-カレン" = "悪い事ばっかりでもないよね。"
"212070-52-カレン" = "普段は言うこと聞かない連中も、みんな静かになった。見方によっちゃ平和そのもの。"
"212070-53-カレン" = "万魔殿と風紀委員会だって上手くやってるみたいだし。"
"212070-54-カレン" = "うちらが思ってたゲヘナには近いのかもね。"
"212070-58-カレン" = "うちは……まあ、ケンカ好きだし、ぶん殴るのも好きだし？#nあ、ちゃんと相手は選んでるからね？"
"212070-59-カレン" = "今のゲヘナは……変な目的さえなければなぁ……。"
"212070-60-カレン" = "キヴォトスに攻撃するってのは、よく分かんない。"
"212070-61-カレン" = "理由もなく殴るのは意味不だし、後味が悪いだけだから。"
"212070-62-カレン" = "ゲヘナがやろうとしてることには大義がない。"
"212070-63-カレン" = "なーんでこんなことになってるんだろ。頭痛くなってきた。"
"212070-64-マユミ" = "……私が今いちばん怖いの、何だと思う？"
"212070-65-カレン" = "何？"
"212070-66-マユミ" = "……私たちは昔のゲヘナに憧れてた。"
"212070-67-マユミ" = "だから委員会の名前は、ゲヘナ再興委員会。ゲヘナを「再び」偉大に、って。"
"212070-68-マユミ" = "でも、「昔」を勘違いしてたとしたら……？"
"212070-69-マユミ" = "高圧的に生徒を押さえつけて、他学園に危害を及ぼそうとする。#nこれが昔のゲヘナだったとしたら……。"
"212070-70-カレン" = "……。"
"212070-71-マユミ" = "私たち、何をしてきたんだろう……？"
"212070-72-マユミ" = "「偉大なゲヘナ」って、こんなのだったの？"
"212070-73-カレン" = "委員長……。"
"212070-74-マユミ" = "それに……それに……っ！"
"212070-75-マユミ" = "私たちは……ゲヘナに取り返しのつかないことをしちゃったんじゃ……。"
"212070-76-マユミ" = "何も知らないまま[ruby=・]昔[/ruby][ruby=・]の[/ruby][ruby=・]ゲ[/ruby][ruby=・]ヘ[/ruby][ruby=・]ナ[/ruby]に憧れたせいで……！！"
"212070-82" = "[ns] マユミの手を取って落ち着かせる。"
"212070-87-マユミ" = "先生……。"
"212070-88" = "[s1] \"君たちのせいじゃないよ。\"\n[s2] \"私が保証する。\""
"212070-94-カレン" = "……。"
"212070-95-マユミ" = "私たち、間違ってたのかな……全部、無駄だったのかな……。"
"212070-96-マユミ" = "頑張ったつもりなんだけどな……。"
"212070-97" = "[s] \"無駄じゃない。\""
"212070-98-マユミ" = "え……？"
"212070-99" = "[s] \"だって、違和感を覚えてるんだから。\""
"212070-100-カレン" = "違和感……？"
"212070-101" = "[s3] \"もしも君たちが中途半端だったら――\"\n[s4] \"今のゲヘナを偉大だと認めてたかもしれない。\""
"212070-106" = "[ns5] \"でも、二人はそうじゃなかった。\"\n[ns6] \"目指してた偉大さとは違うからだよね？\""
"212070-111" = "[ns7] \"私は知ってる。\"\n[ns8] \"マユミも、カレンも、再興委員会のみんなも。\"\n[ns9] \"ゲヘナを良い方向へ変えようと頑張ってきた。\""
"212070-119-マユミ" = "うわあああぁぁん～～～！！"
"212070-123-カレン" = "い、委員長……！"
"212070-124-カレン" = "泣かないでよ……つられて、うちまで……！！"
"212070-129-マユミ" = "ああぁぁ～～～～～！！！"
"212070-131" = "（二人が泣き止むまで、なだめ続けた）"
"212070-135-マユミ" = "ふっ、うぅ……っ、ぐすっ！"
"212070-136-カレン" = "メイク、全部落ちちゃったじゃん……。"
"212070-137-マユミ" = "ごめん……。"
"212070-138-マユミ" = "でもあんなこと言われたら、私……。"
"212070-139-カレン" = "はあ……。"
"212070-143-マユミ" = "だけど、もう大丈夫！立ち直りは早いから！"
"212070-144-マユミ" = "完全復活！"
"212070-145-カレン" = "……。"
"212070-146-カレン" = "やはっ、それでこそ委員長だよね。"
"212070-147" = "[s] \"二人はこれからどうする？\""
"212070-148-カレン" = "こんなの、偉大なゲヘナじゃない。"
"212070-149-カレン" = "だよね、委員長？"
"212070-150-マユミ" = "うん！全部やめさせなきゃ！"
"212070-151-マユミ" = "本当に偉大なゲヘナを――私たちが作る！"
"212070-152" = "[s] \"じゃあ、紹介したい子がいるんだ。\""
"212070-156-マユミ" = "え、同じ志の生徒……？他にもいるの？"
"212070-157-カレン" = "やはっ、大歓迎。今は多ければ多いほどいいし。"
"212070-158" = "[s] \"だけど、その……ショウコは？\""
"212070-162-マユミ" = "ショウコは――"
"212070-163-カレン" = "うちらとは少し考えが違うみたい。"
"212070-164-カレン" = "センパイたちのところで作戦参謀みたいなことやってるんだ。"
"212070-165-マユミ" = "自分からやりたがってるっぽくて……。"
"212070-166-マユミ" = "そもそも、話もちゃんとできてないんだけどね……。"
"212070-167" = "[s] \"私から話してみるよ。\""
"212070-168-マユミ" = "うん……お願い。"
"212070-169-マユミ" = "先生の話なら、ショウコも聞いてくれると思うから。"
"212070-170-カレン" = "ショウコちゃん……。"
"212070-171-マユミ" = "ねぇ、先生……。"
"212070-172-マユミ" = "今日は話を聞いてくれて、ありがとね。"
"212070-173-カレン" = "マジマジ！うちも！！やはっ。"
"212070-175" = "（二人の笑顔が消えませんように）"
"212070-179" = "（そう、心から願った）"
"212070-181" = "次回;チアキ"
