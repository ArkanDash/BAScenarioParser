[translation]
"212100-1" = "第10話;レジスタンス結成"
"212100-7" = "[ns] \"みんな顔見知りだよね？\""
"212100-9-イオリ" = "……この組み合わせ、本気なのか？"
"212100-11-マユミ" = "力を合わせるって、風紀委員会と万魔殿だったの……？"
"212100-12-カレン" = "ちょっと、ちょっと！信用していいの？"
"212100-13-カレン" = "問題の中心にいるのって、この子らの先輩じゃん？"
"212100-15-チアキ" = "言い方はあれですが、反論の余地がありません……！"
"212100-16-イオリ" = "おい、ゲヘナ再興委員会、口の利き方には気をつけろ。"
"212100-17-イオリ" = "それに、怪しいのはお前らもだからな？"
"212100-18-カレン" = "へぇ？何が怪しいっていうわけ？"
"212100-19-イオリ" = "いつも言ってたよな、「一つになったゲヘナ」って。"
"212100-20-イオリ" = "この状況、無関係なわけないだろ？"
"212100-21-マユミ" = "そ、れは私たちにも分からなくて……！こんなの望んでなかったってば！！"
"212100-22-チナツ" = "皆さん、落ち着いてください。"
"212100-28-チナツ" = "ここにいるのは先生が集めた生徒だけです。"
"212100-29-チナツ" = "信用する理由はそれで十分ではないでしょうか。"
"212100-30-イオリ" = "むぅ……。"
"212100-32-カレン" = "……まあ、それはそう。"
"212100-34-イロハ" = "流石は先生。信頼が厚いですね。……まあ、私も同意見ですけど。"
"212100-35-イロハ" = "ともかく、現状に問題を感じる者が集まっている。そういうことでしょう。"
"212100-36-イオリ" = "というか……お前ら、もう1人いなかったか？"
"212100-41-マユミ" = "あ――"
"212100-42-カレン" = "……ショウコちゃんは考えが違うみたい。"
"212100-47-イオリ" = "風紀委員会の中ですら意見が割れるくらいだしな……。"
"212100-48" = "[s] \"大変な状況なのに集まってくれてありがとう。\""
"212100-50" = "（分かっていることの全てを説明した）"
"212100-54-マユミ" = "洗脳って……そんなことできるの……？"
"212100-55-カレン" = "3年生が変わったのも、それが原因……？"
"212100-57-チアキ" = "NKウルトラって本当にあったんですか！？なんで？何のために？"
"212100-58" = "[s1] \"急に言われても混乱するとは思う。\"\n[s2] \"でも、何としても阻止しなきゃいけない。\""
"212100-61-イロハ" = "はい、必ず。"
"212100-62-マユミ" = "洗脳を解く方法ってあるの？"
"212100-63-イオリ" = "それは……別で研究中。"
"212100-64-マユミ" = "……できるのかな？"
"212100-65-チナツ" = "原理は不明でも、完全に不可能ではないと聞いています。"
"212100-66-カレン" = "もしも洗脳が解けなかったら……？"
"212100-67-イロハ" = "……。"
"212100-68-マユミ" = "このまま進んで、キヴォトス全部がゲヘナになるなんて、私は嫌だよ！"
"212100-69-マユミ" = "そんなの誇れるゲヘナじゃないもん！"
"212100-70-マユミ" = "私が作りたかったのは、いつも堂々としていられて恥ずかしくないゲヘナなの。#n誰かを踏みにじるようなのじゃなかったんだから！"
"212100-71-マユミ" = "どれだけ強くたって、そんなのは絶対ヤダ！"
"212100-72-カレン" = "やはっ！そういうこと！誰彼構わず撃つための銃じゃないんだからさ！"
"212100-73-イオリ" = "……嫌いじゃないよ、そういうの。"
"212100-74-チナツ" = "私も、マユミ委員長のお話には賛成です。"
"212100-75-チナツ" = "私たちは、越えてはならない線を守るために風紀委員会に入りました。"
"212100-76-チナツ" = "その線は必ずしも明文化されているわけではありません。#n時には自分で判断しなければならないものだと思っています。"
"212100-77-イオリ" = "今がその時なんだ。線を越えようとするのがゲヘナそのものでも、貫いてみせる。"
"212100-78-イオリ" = "……その相手が身内だとしても。"
"212100-79-チナツ" = "委員長……行政官……。"
"212100-91-サツキ" = "手掛かりが見つかったわ！"
"212100-95-マユミ" = "うわっ、万魔殿の議員！！"
"212100-96-カレン" = "ねぇ、この人3年生じゃないの？"
"212100-98-サツキ" = "あら、あなた達もいたのね。呼ぶとは聞いていたけど。"
"212100-99-カレン" = "3年生はみんなおかしくなったって話じゃなかった？"
"212100-100-イロハ" = "サツキ先輩は例外です。さっき言ったでしょう？NKウルトラを研究していたと。"
"212100-101-マユミ" = "あ、そっか。びっくりした。"
"212100-107-サツキ" = "ふーん、チアキも来たのね。"
"212100-108-チアキ" = "はい～！マコト先輩があんな風になっちゃったのに、じっとしてなんていられません！"
"212100-109-チアキ" = "サツキ先輩までこっち側だとは思ってませんでしたけど！"
"212100-110-サツキ" = "あっちとかこっちとか……間違ってはいない表現かもしれないわ。"
"212100-114-サツキ" = "じゃあ今、イブキは？"
"212100-115-イロハ" = "……。"
"212100-116-サツキ" = "ここに連れてくるには、さすがにまだ幼いものね。"
"212100-117-サツキ" = "なにせ「反逆者クラブ」なのだから。"
"212100-119-イオリ" = "反逆者って……。"
"212100-121-イロハ" = "イブキは何も知らないままの方がいいのかもしれません。"
"212100-122-イロハ" = "……それはそうと、サツキ先輩は手掛かりを見つけたのでは？"
"212100-123-サツキ" = "あ、そうそう。ふふ。聞いて驚きなさい。"
"212100-124" = "[s] \"何か分かったの？\""
"212100-125-サツキ" = "ええ。ここからはよく聞いて頂戴。"
"212100-126-サツキ" = "人間の神経網にはそれぞれ固有の共振周波数がある。それは知っているわよね？"
"212100-127-マユミ" = "いや、全然。"
"212100-128-サツキ" = "そう……まぁ知らなくても構わないわ。"
"212100-129-サツキ" = "真なるNKウルトラ計画――つまり雷帝の洗脳は、この固有振動数を外部の周波数によって強制同期させた……と仮定してみたの。"
"212100-130-サツキ" = "すると、1つの仮説が浮かぶわ。"
"212100-131-サツキ" = "脳波を特定の状態に無理やり固定しているのだとしたら、#n波の打ち消し効果でその固定を解けるかしら？"
"212100-132-イオリ" = "……え、あの、何て？"
"212100-133-サツキ" = "それが可能なのよ！理論上は！"
"212100-134-サツキ" = "でも、本当の問題はここから。"
"212100-135-サツキ" = "この方法は、洗脳に使われた周波数が分かっていることが大前提。"
"212100-136-サツキ" = "どうやって割り出すのかが問題なのよね。#nもう1回洗脳してみろ、なんて言えるわけもないし。"
"212100-137-チアキ" = "……あ。言ってることはほとんど分からなかったですけど、#n最後のだけ心当たりあるかもです！"
"212100-138-サツキ" = "教えて頂戴。"
"212100-139-チアキ" = "それ、放送室にあるんじゃないですか？"
"212100-143-チアキ" = "マコト先輩の演説は放送室の機材を使っていました。"
"212100-144-チアキ" = "一緒にずっと流れてたノイズとか変な単語も同じなのかも？"
"212100-145-チアキ" = "放送室を探れば、何か出てくるんじゃないかなって……。"
"212100-148-サツキ" = "……。"
"212100-149-チアキ" = "あ、やっぱり的外れでしたかね？"
"212100-151-サツキ" = "違うわ、逆よ！大手柄！どうしてその発想に至らなかったのかしら！"
"212100-153-イロハ" = "鋭い着眼点だと思いますよ。"
"212100-154-チアキ" = "あはっ、記者としての勘ってやつですかね。"
"212100-155-マユミ" = "じゃあ放送室に行けば何とかできるの！？"
"212100-156-サツキ" = "まだ何とも言えないけれど、使われた機材を解析できれば手掛かりは得られるはずよ。"
"212100-157-サツキ" = "そのために必要なのは、キャリアウェーブを抽出できる装置と――"
"212100-163" = "[ns] \"なんか、うまくいきそう……！\""
"212100-165" = "（楽観は禁物だが、小さくとも希望が芽生えた気がした……）"
"212100-167" = "次回;そばにいたい"
