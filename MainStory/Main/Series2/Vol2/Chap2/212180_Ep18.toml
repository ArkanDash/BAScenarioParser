[translation]
"212180-1" = "第18話;炎となる私たち"
"212180-3-イロハ" = "彼女……？誰の話をしてるんですか？"
"212180-4-カレン" = "……まさか。"
"212180-9-ショウコ" = "雷帝。"
"212180-13-ショウコ" = "天才的な発明家にして戦略家、最高の政治家、偉大なる暴君。恐怖の絶対者。"
"212180-14-ショウコ" = "私は、あのお方の追従者です。"
"212180-19-イオリ" = "何だと……？"
"212180-20-チナツ" = "雷帝の追従者……？"
"212180-21-マユミ" = "じゃあ……事件の黒幕はショウコだったってこと？"
"212180-22-マユミ" = "みんなを洗脳して、ゲヘナを狂気の中に叩き込んだのもショウコなの……？"
"212180-23-ショウコ" = "ええ。"
"212180-24-ショウコ" = "この学園が、偉大なる先覚者の足跡を辿れるように手助けしたまでです。"
"212180-25-ショウコ" = "あのお方が果たせなかった夢を、遅ればせながらこの手で成し遂げるために。"
"212180-26-イオリ" = "お前が……お前のせいで……！！"
"212180-30-カレン" = "ショウコちゃん……それ、ガチ？"
"212180-35-マコト" = "これは……そうか。雷帝の思想だったのか。"
"212180-36-マコト" = "恐怖による統制。個より全体を優先すること。ゲヘナによる統一。"
"212180-37-ヒナ" = "ただ1人の絶対者によって支配される社会……。"
"212180-38-ヒナ" = "どうして……それを、私たちが……？"
"212180-55-マコト" = "くっ！！"
"212180-56-ヒナ" = "うっ……うああっ！！"
"212180-57-ショウコ" = "ああ、ご覧になっていますでしょうか……#nかつて貴女様を引きずり下ろした反逆者たちが操り人形になった姿を……！"
"212180-58-イロハ" = "先輩……！！"
"212180-59-イオリ" = "委員長！！"
"212180-60-ショウコ" = "これは、在るべき座を追われた方のための復讐なんです。"
"212180-61-ショウコ" = "本来捧げられるはずだった賛辞と称揚……やっとお返しできます。反逆者自らの手で！"
"212180-62-ショウコ" = "偉大なるあの方へ、廃された皇帝へ――！"
"212180-63-マユミ" = "ショウコが言ってたことは全部これのためだったの？"
"212180-64-マユミ" = "偉大なゲヘナは「雷帝時代」のこと……？"
"212180-65-カレン" = "……ずっとうちらに嘘ついてたってことでいい？"
"212180-66-ショウコ" = "どうせ結論は同じだったんですよ！！"
"212180-67-ショウコ" = "ゲヘナが偉大になるためには、雷帝の思想に従うほかないのですから！"
"212180-68-ショウコ" = "安っぽい自由より、統制された秩序の方が偉大で強い……それを示したかったんです！"
"212180-73-イロハ" = "どんな理想を掲げたって……その手段が洗脳じゃ意味ないじゃないですか。"
"212180-77-ショウコ" = "そうは思いません。説得の過程を省略しただけです。"
"212180-78-ショウコ" = "主張の是非を問う。煩わしい議論は手間ですからね。"
"212180-79-ショウコ" = "なにより結果として、皆が正しい道を歩けるようになりました。"
"212180-83-ショウコ" = "貴女方のような不穏分子を除けば、ですが。"
"212180-88-イオリ" = "お前……狂ってるよ。"
"212180-89-チナツ" = "先輩たちを……返してください！！"
"212180-90-ショウコ" = "あははっ！負け惜しみにしか聞こえませんね。#nあの方の偉大な遺産「真のNKウルトラ計画」から逃れる術などありません！"
"212180-91-ショウコ" = "貴女方にできることは、1つだけ！"
"212180-92-ショウコ" = "反逆を骨の髄まで悔いながら、あのお方の思想と価値観に従って戦列に加わること！"
"212180-96-ショウコ" = "戦って、戦って、戦って……キヴォトス全土で、あのお方の遺産が炸裂するのです！"
"212180-101-ショウコ" = "灰の上に築かれる真の秩序！世界の果てまでゲヘナの旗が翻ることになるでしょう！"
"212180-103-ショウコ" = "その時ようやく……あのお方へ捧げる[ruby=レクイエム]鎮魂歌[/ruby]が完成するのです。"
"212180-107-ヒナ" = "……そう。偉大なるゲヘナのために。"
"212180-112-マコト" = "諸君、キヴォトスへ向けて銃剣を高く掲げよ！！"
"212180-124-イオリ" = "はぁ……はぁ……。"
"212180-125-チナツ" = "……。"
"212180-131-ショウコ" = "Long Live The Emperor."
