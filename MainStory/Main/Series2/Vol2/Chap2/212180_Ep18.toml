"212180-145-ショウコ" = "誰かにねじ込まれた、植えつけられた思考だとでも……？"
"212180-146-ショウコ" = "まるで、このNKウルトラ計画みたいに……？"
"212180-150-ショウコ" = "はっ！"
"212180-151-ショウコ" = "先生は、どこまで行っても私を見くびるんですね。"
"212180-152-ショウコ" = "ええ、貴方のような大層ご立派な大人からすれば、私は子供に過ぎないのでしょう。"
"212180-153-ショウコ" = "ですが、私こそ……！！"
"212180-154-ショウコ" = "……。"
"212180-155-ショウコ" = "その目――"
"212180-156-ショウコ" = "どうして……どうしてそんな目で私を見るんですか！この前も……今も！"
"212180-157-ショウコ" = "見るな……。"
"212180-158-ショウコ" = "そんな目で私を見るな！！！"
