[translation]
"211090-1" = "第9話;チャンス"
"211090-2" = "ゲヘナ再興委員会"
"211090-4-マユミ" = "先生！やっほー！"
"211090-5-カレン" = "やっほ～！"
"211090-6" = "[s] \"やっほー。\""
"211090-7-ショウコ" = "お越しいただきありがとうございます。"
"211090-8-ショウコ" = "早速本題で恐縮なのですが、本日協力していただきたいのは――"
"211090-12-ショウコ" = "「ポイント提携店」との新規契約です！"
"211090-13" = "[s] \"気合の入れ方が違う……！\""
"211090-14-カレン" = "最近SNSでめっちゃバズってるお蕎麦屋さんだよ。#n昼休みは2時間待ちが当たり前。"
"211090-15" = "[s] \"昼休みに……2時間待ち？\""
"211090-16-ショウコ" = "授業をサボって昼休み前から並ぶか、次の授業をサボるかしているそうです。"
"211090-17-ショウコ" = "実にゲヘナらしいですね。"
"211090-18-ショウコ" = "規律に従わない生徒がいるのなら、そうせずに済む環境を整えるのが私たちの目標。"
"211090-19-ショウコ" = "この店を新規提携先に選んだ理由も、そこにあります。"
"211090-20-ショウコ" = "前置きはこのくらいにして、ひとまず行きましょう。"
"211090-25-ショウコ" = "こちらです。"
"211090-26-マユミ" = "蕎麦食べるの久しぶりかも！#n最近忙しかったし、ずっと売店で済ませてたからね。"
"211090-27-カレン" = "食べてみようって話には賛成だけど、奢ってもらっちゃっていいの？"
"211090-28" = "[s] \"大丈夫、大丈夫。\""
"211090-32-ショウコ" = "人に厚意を示せる機会はそう多くありません。どうか私たちに感謝してください。"
"211090-33" = "[s] \"あ、そっちが感謝される側？\""
"211090-34-マユミ" = "奢ってもらうのに何言ってんのさ。"
"211090-35-ショウコ" = "私はこれでいいんです。一介の書記ですから。"
"211090-36-カレン" = "ショウコちゃんの中で書記って……。"
"211090-37-マユミ" = "とにかく！ありがとう、先生！"
"211090-38-ショウコ" = "おや？なにやら面白いイベントをやっているようですね。"
"211090-39-ショウコ" = "わんこそば100杯チャレンジ成功で全額無料……。"
"211090-40-カレン" = "やー、100杯は無理じゃない？そんな食べらんないよ。"
"211090-41-マユミ" = "フードファイターか、お腹に亜空間を持ってる人しか挑戦しないでしょ。"
"211090-42-マユミ" = "早く順番来ないかな～！"
"211090-51-店主" = "ありがとうございました～！"
"211090-52-ゲヘナの生徒A" = "……。"
"211090-53-ゲヘナの生徒B" = "……もう来なくていいかな。"
"211090-54-ゲヘナの生徒A" = "だよね。あんなに待たされたのに。時間の無駄だった。"
"211090-59" = "[ns] \"……。\""
"211090-61" = "（その後も、楽しそうな顔で出てくる人はほとんどいなかった）"
"211090-62" = "（かなり長い時間待ち続けた）"
"211090-64" = "（ようやく席について注文を済ませると……）"
"211090-68-店主" = "はい、お待ちどうさま～！ざるそば定食、四人前で～す！"
"211090-73-マユミ" = "えっ、早すぎない！？もうお腹ぺこぺこだから嬉しいけど！"
"211090-74-カレン" = "見た目はめちゃ美味しそうだね。"
"211090-75-一同" = "いただきまーす！"
"211090-76" = "[s] \"いただきます！\""
"211090-80-カレン" = "……。"
"211090-81-マユミ" = "……。"
"211090-82-ショウコ" = "……。"
"211090-83-マユミ" = "うーん……。"
"211090-84-マユミ" = "……味、薄くない？"
"211090-85-ショウコ" = "私のは驚くほどしょっぱいです。#nそちらの塩分がすべて移ってきたのかと思うくらい。"
"211090-86-カレン" = "なんか、バランスがさ……。"
"211090-87" = "[s] \"美味しくは……ないね。\""
"211090-88-カレン" = "だよね、かなり微妙。"
"211090-89-ショウコ" = "空腹補正がかかっていてこの評価なら、かなり深刻です。"
"211090-90-マユミ" = "なんで人気なんだろ……？"
"211090-91-カレン" = "先生が奢ってくれたし、楽しく食べたかったのに……。"
"211090-92-ショウコ" = "私たちはまんまと騙されたわけです。"
"211090-93-ショウコ" = "わんこそば100杯という噂に！！"
"211090-94-マユミ" = "それ気にしてたのショウコだけじゃない？"
"211090-98-？？？" = "これは……見過ごせませんわね。"
"211090-102" = "[ns] \"この声は……！\""
"211090-105-ハルナ" = "SNSで話題だと聞き、美食の地平を広げるべく足を運んでみれば――"
"211090-106-ハルナ" = "とんだ無駄骨でした。"
"211090-113-店主" = "ひっ……！あ、あなた達は……！"
"211090-114-ハルナ" = "蕎麦は「三たて」……すなわち、挽きたて・打ちたて・茹でたてが命です。#nですが……これはどうでしょう？"
"211090-115-ハルナ" = "蕎麦の香りはまったく感じられず。#nすすぎ切れていないでんぷん質は、まるで泥を噛んでいるような舌触り。"
"211090-116-ハルナ" = "何より絶望的なのは、つゆのアンバランスさ！#n醤油と出汁が好き勝手に暴走して悲鳴を上げています。"
"211090-117-ジュンコ" = "見てこれ！麺が伸びて団子みたいに固まってるんだけど！？#nどうやって食べろって言うのよ！"
"211090-118-アカリ" = "期待していたんですけど……残念ですね★#nただただ[ruby=・]量[/ruby]しか言及するところがないなんて。"
"211090-119-イズミ" = "ピーナッツバターとタバスコを一緒に入れたらどうかな？#nちょっとはマシになるかも！"
"211090-123-ハルナ" = "基本すら忘れた飲食店に存在価値はありません。"
"211090-124-店主" = "や、やめて……！！心を入れ替えるから、どうかお慈悲を……！"
"211090-125-ハルナ" = "いえ……このような店は存在自体が食への冒涜！ならば――！！"
"211090-130" = "[ns] \"待って……！\""
"211090-132-ハルナ" = "あら、先生もいらしたのですね。ごきげんよう。"
"211090-133-アカリ" = "こんにちは～"
"211090-134-イズミ" = "わ～先生だ！"
"211090-138-ジュンコ" = "え、先生も食べたの？これ……。"
"211090-139-ハルナ" = "……。"
"211090-140-ハルナ" = "なるほど。この粗末な蕎麦を先生にも出したのですね。#nもはや考慮の余地はありません。"
"211090-141" = "[s] \"ちょっ、ちょっと考え直さない？\""
"211090-142-ハルナ" = "……。"
"211090-143-ハルナ" = "なぜ止めるのですか？#nまさか……料理がお気に召したとでも？"
"211090-144" = "[s] \"あ、不味いのは確かだよ、うん。\""
"211090-145-店主" = "ぐふぅっ……！？"
"211090-147-ショウコ" = "美食研究会の爆破行為は、ゲヘナの評判をひどく傷つけています。"
"211090-148-ショウコ" = "彼女たちを統制できれば、理想に大きく近づきます。"
"211090-149-マユミ" = "……よし、勝負だね！"
"211090-156-マユミ" = "こんにちは！"
"211090-157-ハルナ" = "あなた方は……。"
"211090-158-マユミ" = "私たちはゲヘナ再興委員会！"
"211090-159-ハルナ" = "存じています。ゲヘナを変えようとしているのだとか。"
"211090-160-マユミ" = "そう！#nそれで相談なんだけどさ、このお店の「改善」に賭けてみない？"
"211090-164-ハルナ" = "改善？あり得ませんわね。"
"211090-171-ショウコ" = "それでも爆破は下策かと。可能性の芽を摘んでしまうのですから。"
"211090-172-カレン" = "気持ちは分かるけど、即爆破はやりすぎじゃない？"
"211090-173-マユミ" = "だから、私たちと勝負！"
"211090-177-マユミ" = "このお店に時間をあげるの。1週間くらい！"
"211090-178-マユミ" = "それまでは爆破をいったん保留。"
"211090-179-ハルナ" = "……？"
"211090-180-マユミ" = "この店が改善して合格点に届いたらさ、希望が証明されるでしょ？"
"211090-181-ハルナ" = "……？"
"211090-182-マユミ" = "しかも、もしかしたら美食の聖地になるかも！"
"211090-183-ハルナ" = "……。"
"211090-184-マユミ" = "……。"
"211090-185-マユミ" = "えっと……なんか反応ほしいな……。"
"211090-191" = "[ns] \"あっ……！！\""
"211090-193" = "ドカーン！！"
"211090-195-店主" = "あああああ！私の店がぁ！！"
"211090-196" = "[ns] \"ハルナ～！\""
"211090-198-マユミ" = "げほっ、げほっ……！"
"211090-202-カレン" = "結局こうなるんじゃ～ん。"
"211090-203-ショウコ" = "はあ……。"
"211090-207-ハルナ" = "当然の帰結です。"
"211090-208-ハルナ" = "ああ、みなさんの言いたいことは理解しました。"
"211090-209-マユミ" = "じゃあどうして！！"
"211090-210-ハルナ" = "私たちの信念とは相反するからです。"
"211090-211-ハルナ" = "すでにこの店は美食の道を踏みにじりました。#nなぜ「チャンス」という贅沢を与えねばならないのでしょうか？"
"211090-212-ハルナ" = "なにより、この店だけ特別扱いしては、今まで木っ端微塵になってきた数多の店が浮かばれませんわ。"
"211090-213-アカリ" = "そういうことです★"
"211090-214-イズミ" = "うえっ、ぺっぺっ！木くず入った！"
"211090-215-ジュンコ" = "私、まだ一口も食べれてないのに……。"
"211090-216-マユミ" = "うぅ……本気でこれ続ける気！？"
"211090-217-マユミ" = "あっちこっちの店を爆破して回るつもりなの！？"
"211090-218-ハルナ" = "勘違いされては困ります。私たちは手当たり次第に爆破しているわけではありません。"
"211090-219-ハルナ" = "美食への想いを、軽く見ないでいただけますか？"
"211090-220-マユミ" = "こんなことしてるからゲヘナの印象が悪くなるんだよ！テロリストじゃん！"
"211090-221-ハルナ" = "本質的な過ちは、対価に見合うサービスを提供できない飲食店側にあるのでは？"
"211090-222-ハルナ" = "客は代金を支払い、店は金額に見合う料理を出す。簡単なことでしょう？"
"211090-223-ハルナ" = "この基本すらできない店に存続する価値があるとでも？"
"211090-224-マユミ" = "言ってることは正論だ……！"
"211090-228-ハルナ" = "覚えておいてください。私たちは美食研究会。"
"211090-229-アカリ" = "美味しいものを食べるためなら。"
"211090-230-ジュンコ" = "どんな苦難も乗り越えてみせる――"
"211090-231-ジュンコ" = "――あれ、なんだっけ？"
"211090-232-イズミ" = "EAT OR DIE～！"
"211090-237-ハルナ" = "では、またお会いしましょう。先生と――"
"211090-238-ハルナ" = "「料理の後に残ったオイスターソース保存委員会」の皆さん！"
"211090-239-マユミ" = "ちがーう！「ゲヘナ再興委員会」だから！！"
"211090-246" = "[ns] \"結局こうなるのか……。\""
"211090-248-ショウコ" = "やはり彼女たちは一筋縄ではいきませんね。"
"211090-249-カレン" = "そもそも、どうにかできるのかな？#n力ずくでねじ伏せるとかならともかく――"
"211090-250-ショウコ" = "なんであれ、努力は続けなければなりません。#nゲヘナのために、制御不能な存在を減らすのです。"
"211090-251-ショウコ" = "……必ず。"
"211090-252-マユミ" = "次こそは説得してみせる！"
"211090-253-ショウコ" = "とはいえ……美食研究会の考え方自体には共感できる部分もあります。"
"211090-254-カレン" = "どのへん？"
"211090-255-ショウコ" = "弱肉強食の世界で「もう1度」は贅沢だ、という点です。"
"211090-260-マユミ" = "ショウコ、たまに冷たいよね。"
"211090-261-ショウコ" = "事実ですから。"
"211090-262" = "[s] \"でも、やり直すチャンスはあるといいよね。\""
"211090-266-ショウコ" = "……そうですか。"
"211090-267-ショウコ" = "誰にでも等しく与えられるなら、それも悪くはないかもしれません。"
"211090-268-マユミ" = "まあまあ。今日は失敗しちゃったけど気にしない！"
"211090-269-マユミ" = "私たちの歩みは止まらないんだから！"
"211090-270-カレン" = "んー、とりあえず何か食べない？もうお腹ぺこぺこ……。"
"211090-271-ショウコ" = "わんこそばにしましょう。近くに別の店があるので。"
"211090-272-カレン" = "そんなに食べたかったの？"
"211090-273-マユミ" = "行こ行こ！先生もお腹空いてるでしょ？"
"211090-277-ショウコ" = "その言葉を待ってたよ。是非ご馳走させてほしいな。"
"211090-278-ショウコ" = "――と、先生は考えました。"
"211090-279" = "[s] \"元々そのつもりだよ！\""
"211090-295" = "（食べるそばから出てくるお代わりと格闘しながら、与えられなかったチャンスについて考えた）"
"211090-297" = "（なお、その店はポイント提携をしてくれることになった）"
"211090-299" = "次回;交渉……？"
