[translation]
"211130-1" = "第13話;森の中の木"
"211130-7-ショウコ" = "こんにちは、[ruby=はたみ]旗見[/ruby]エリカさん、[ruby=よざくら]夜桜[/ruby]キララさん。"
"211130-12-キララ" = "あれ、あたしたちのこと知ってるの？"
"211130-13-エリカ" = "そっちは最近話題の委員会だよね？"
"211130-14-エリカ" = "名前はたしか――"
"211130-16-ショウコ" = "ゲヘナ再興委員会。私は[ruby=いがらし]五十嵐[/ruby]ショウコです。"
"211130-17-キララ" = "あたしたちタメなんだよね。知ってた？"
"211130-18-ショウコ" = "ええ、ある程度は。"
"211130-19-キララ" = "そっかそっか、よろしくね！#nそれで、何か用？"
"211130-26-マユミ" = "ちょっと聞きたいことがあるんだ。"
"211130-27-カレン" = "あ、無理にとは言わないよ。"
"211130-29-キララ" = "……あれ？先生も一緒だったんだ！"
"211130-30" = "[s] \"やぁ、キララ、エリカ！\""
"211130-31-エリカ" = "もしかして意外と大事？"
"211130-32-ショウコ" = "いえ、お手間は取らせませんので。"
"211130-33-エリカ" = "もう帰ろうとしてたとこだから。なんでも聞いて。"
"211130-34-ショウコ" = "では、お言葉に甘えて。"
"211130-36-キララ" = "おっけおっけ、新しい友だちはいつでも歓迎だし。"
"211130-40-キララ" = "ん～！やっぱここのホワイトチョコが一番だよね！"
"211130-41-エリカ" = "奢ってもらっちゃって悪いね。ここまでしてもらわなくてもいいのに。"
"211130-43-ショウコ" = "私が払うから遠慮せず食べてね。お代わりもどんとこいだよ。"
"211130-44-ショウコ" = "――と、先生は考えました。"
"211130-45" = "[s] \"またそれか……！\""
"211130-46-エリカ" = "あはは、二人はそういうノリなんだ。#nさすが、先生は誰とでも馴染むね。"
"211130-47-エリカ" = "それで、話って？"
"211130-48-マユミ" = "えっと……。"
"211130-49-マユミ" = "前に校内放送やってたよね？"
"211130-50-エリカ" = "ああ、あれね。"
"211130-51-キララ" = "1回だけだったけどすっごく楽しかったよ！ああいうの初めてだったし！"
"211130-52-キララ" = "校内放送に興味あるの？"
"211130-53-マユミ" = "なくはないんだけど、今は調べたいことがあってさ。"
"211130-54-マユミ" = "最近、校内放送やってないじゃん？たぶん、二人の放送の後から。#n……何かあった？"
"211130-55-キララ" = "言われてみればそうだね。"
"211130-56-エリカ" = "失敗したわけでもないし、機材壊したりもしてないし……なんでだろ。"
"211130-57-キララ" = "あたしたちが上手すぎて、次の人がプレッシャー感じちゃったとか？"
"211130-58-エリカ" = "ないない。"
"211130-59-エリカ" = "あ、でも……放送部長が戻ってきたって話は聞いてないね。"
"211130-60-キララ" = "実はあの時、あたしたちが放送を続けるって話もあったんだ。"
"211130-61-エリカ" = "元からやってた人のほうがいいと思って断っちゃったけど。"
"211130-66-ショウコ" = "それから放送は止まったまま……。"
"211130-67-ショウコ" = "お二人が放送していたとき、何かおかしな点はありませんでしたか？"
"211130-68-エリカ" = "例えば？"
"211130-69-ショウコ" = "何かトラブルが起きたとか、聞こえないはずの音が混ざっていたとか……。"
"211130-70-キララ" = "そういえば、一瞬だけピーッって音が鳴ってたかも。#nすっごい高いキーン！ってやつ。分かるでしょ？"
"211130-71-ショウコ" = "……そうでしたか。"
"211130-72-キララ" = "うん。でもエリカちゃんがすぐ何とかしてくれたんだ！"
"211130-74-エリカ" = "ケーブルが絡まってただけだったから。ちょっと配線を直したらすぐ収まったよ。"
"211130-75-ショウコ" = "あとは特に何も？"
"211130-79-エリカ" = "えっと……あ。"
"211130-80-エリカ" = "何か変な声を聞いた気もするんだよね。"
"211130-81-キララ" = "そんなのあったっけ？"
"211130-82-エリカ" = "聞き間違いかもしれないから、誰にも言ってなかったんだけど。"
"211130-84-ショウコ" = "どんな声でしたか？"
"211130-85-エリカ" = "うーん……女の人の声で……。"
"211130-86-エリカ" = "何か……単語を言ってたかな。"
"211130-87-エリカ" = "[ruby=・]て[/ruby][ruby=・]っ[/ruby][ruby=・]け[/ruby][ruby=・]つ[/ruby]？とか、[ruby=・]ち[/ruby][ruby=・]つ[/ruby][ruby=・]じ[/ruby][ruby=・]ょ[/ruby]とか……#nそんなのだったと思うけど、細かくは覚えてないや。"
"211130-91-カレン" = "あ、エリカちゃんって呼んじゃっていい？"
"211130-92-エリカ" = "もちろん。エリカでもいいよ。"
"211130-93-カレン" = "エリカちゃんには、はっきり聞こえてたってこと？#nうちらが聞いたのはもうちょっと曖昧だったんだけど。"
"211130-94-エリカ" = "いや、私も細かく聞き取れたわけじゃないよ。だいたいのニュアンスってくらい。"
"211130-95-カレン" = "そっか……不思議だねぇ。"
"211130-96-キララ" = "でも、どうして気になってるの？"
"211130-97-カレン" = "うちら、その「幽霊騒ぎ」を解決してるところでさ。"
"211130-98-キララ" = "わーっ、何それ！すっごく楽しそう！キラキラしてる～！"
"211130-99-カレン" = "生徒のお悩み解決みたいなことをやってるんだ。成り行きでね。"
"211130-100-キララ" = "そういうのもやってるんだ？あははっ！絶対面白いじゃん！"
"211130-102-マユミ" = "どう？興味あるなら入らない？"
"211130-103-エリカ" = "残念。私たち、キラキラ部なんだ。"
"211130-104-マユミ" = "二人にはピッタリだと思うんだけどな！一緒にゲヘナを偉大にしようよ！"
"211130-105-エリカ" = "ゲヘナを偉大に、か……。"
"211130-106-エリカ" = "偉大になりすぎてもちょっと困るかも？"
"211130-107-マユミ" = "どうして？キヴォトスで一番がよくない？"
"211130-108-エリカ" = "うーん……私には、ちょっと看板が重すぎるかなって。"
"211130-109-エリカ" = "別に、否定するわけじゃないよ。#n私はもっとこじんまりしてるほうが性に合うってだけだから。"
"211130-110-キララ" = "ねえ、偉大なゲヘナってどんなの？"
"211130-114-マユミ" = "ふふん、偉大なゲヘナとは！"
"211130-115-マユミ" = "秩序だった規則と統制のもと、みんなが一つになって――"
"211130-117-マユミ" = "心を一つに同じ目標へ向かって突き進んでいく！"
"211130-118-マユミ" = "絵に描いたみたいに理想的な学園だよ！#nまさに、昔のゲヘナみたいに！"
"211130-124-キララ" = "みんなが同じだったらつまんなくない？"
"211130-129-マユミ" = "そんなことないよ！長く険しい道の先にあるから、偉大でワクワクするんだよ！"
"211130-130-エリカ" = "でも……ドラマも音楽も、同じようなのばっかりになっちゃうよね。"
"211130-131-エリカ" = "バラバラだからこそ面白くなるんじゃないかな……。"
"211130-132-マユミ" = "……。"
"211130-134-カレン" = "あ、マユミちゃんフリーズしちゃった。"
"211130-136-マユミ" = "ち、違くて！コンテンツと……その、なんだっけ？全体の方向性は！別だから！"
"211130-137-エリカ" = "ふーん……？"
"211130-141-マユミ" = "……ショ……！"
"211130-143-マユミ" = "ショウコ！！"
"211130-149-マユミ" = "……ショウコ？考え込んでないで助けてよ！"
"211130-153-ショウコ" = "……あ。"
"211130-154-カレン" = "どしたん？なんかあった？"
"211130-155-ショウコ" = "いえ。ちょっと考えさせられることがあって。"
"211130-156-カレン" = "なになに？"
"211130-157-ショウコ" = "……。"
"211130-158-ショウコ" = "どうやら、放送室に入る必要がありそうです。"
"211130-160-マユミ" = "あっ、そっち？まあ決着はつけないとだよね。"
"211130-162-カレン" = "でも、どうやって入るつもり？"
"211130-163-ショウコ" = "万魔殿と……正面から交渉する他ないでしょうね。"
"211130-164-キララ" = "か～っこいい～！"
"211130-165-ショウコ" = "活動の甲斐もあって、私たちの格はそれなりに上がりました。#n今なら正面から話しても、そう簡単には押し切られないはずです。"
"211130-167-エリカ" = "急に話がヘビーになってきたね……応援してるよ。"
"211130-168-キララ" = "うん！これもキラキラかも！"
"211130-169-ショウコ" = "……その前に。"
"211130-175-ショウコ" = "ホワイトチョコチップフラペチーノ……もう一杯頼んでもいいですか？"
"211130-179" = "[ns] \"お代わりもどんとこいだよ。\""
"211130-184" = "次回;揺れる炎の影"
