[translation]
"211160-1" = "第16話;起こるべくして起こる"
"211160-4-ゲヘナの生徒A" = "なになに？"
"211160-5-ゲヘナの生徒B" = "万魔殿が何かやるのって久しぶりじゃない？"
"211160-8-ゲヘナの生徒C" = "てか、これ聞かなきゃダメなの？"
"211160-9-ゲヘナの生徒D" = "え、でもイカツイ音響用意してるし、派手に何かやるんじゃない？"
"211160-10-ゲヘナの生徒C" = "時間の無駄な気もするけど……。"
"211160-13" = "[ns] \"すごい人だかりだね……！\""
"211160-14-マコト" = "キシシッ……！この反応こそ待ち望んでいたものだ。"
"211160-15-マコト" = "ゲヘナの注目は私にこそ集まっているべきなのだ！"
"211160-16-サツキ" = "さすがマコトちゃん。これだけ人がいても緊張してないのね～"
"211160-17-チアキ" = "おぉっ、すごいです！ここ最近で一番集まってる気がします！#nこんな大群衆を撮れる機会、なかなかありませんよ！"
"211160-18-チアキ" = "これは来週の週刊[ruby=ぱんでも]万魔殿[/ruby]が豪華になる予感……！#n来ました！早速シャッターチャンス！"
"211160-40-マコト" = "キキキッ、まもなくだ……空前絶後の名演説が始まるぞ。"
"211160-41-マコト" = "先生よ、足元に座布団でも敷いておくがいい！#nこの私のカリスマに屈服し、演説が終わる頃には膝をついているかもしれんからな！"
"211160-42" = "[s] \"いや、大丈夫だと思う……。\""
"211160-43-マコト" = "キシシッ、やはり肝が据わっているな。#nその気概がいつまで持つか……見届けさせてもらおう！"
"211160-50-ゲヘナの生徒A" = "おっ、始まりそう？"
"211160-51-ゲヘナの生徒B" = "また変なこと言い出さないといいけど。"
"211160-52-ゲヘナの生徒A" = "途中で風紀委員長が乱入したら面白いのに。"
"211160-57-マコト" = "ふむ、ふむ。"
"211160-58-マコト" = "諸君――"
"211160-74-ゲヘナの生徒たち" = "うわっ！？"
"211160-78-マコト" = "機材トラブルだと……！？"
"211160-84-ゲヘナの生徒A" = "な、なに……？"
"211160-90" = "[log][i][ff4444]鉄血――[-][/i][/log]"
"211160-93-ゲヘナの生徒B" = "なんか変な声しない……？"
"211160-101" = "[log][i][ff4444]秩序――[-][/i][/log]"
"211160-104-サツキ" = "……！！！"
"211160-105" = "[s] \"これは……！？\""
"211160-110" = "[log][i][ff4444]応答――[-][/i][/log]"
"211160-115" = "[log][i][ff4444]服従――[-][/i][/log]"
"211160-119-カスミ" = "メグ……？"
"211160-124" = "[log][i][ff4444]初期化――[-][/i][/log]"
"211160-130-イズミ" = "おーい？どうしたの？"
"211160-131-ジュンコ" = "なに？急に固まって……。"
"211160-139" = "[log]執行。[/log]"
"211160-153" = "[log][i][ff4444]鉄血、[-][/i][/log]"
"211160-155" = "[log][i][ff4444]鉄血、秩序、[-][/i][/log]"
"211160-157" = "[log][i][ff4444]鉄血、秩序、応答、[-][/i][/log]"
"211160-159" = "[log][i][ff4444]鉄血、秩序、応答、服従、[-][/i][/log]"
"211160-161" = "[log][i][ff4444]鉄血、秩序、応答、服従、初期化、[-][/i][/log]"
"211160-165" = "[log]鉄血、秩序、応答、服従、初期化、執行。[/log]"
"211160-173-ゲヘナの生徒A" = "……。"
"211160-174-ゲヘナの生徒B" = "な、なんだったの……？"
"211160-175-ゲヘナの生徒A" = "変な声だったね……。"
"211160-183-ゲヘナの生徒A" = "あれ……？固まってる。"
"211160-184-ゲヘナの生徒B" = "ビックリしすぎちゃったのかな……？"
"211160-189-？？？" = "舞台は整い――"
"211160-194-？？？" = "役者は集う――"
"211160-199-？？？" = "いざ――幕開けだ。"
"211160-205-マコト" = "……。"
"211160-206-マコト" = "万魔殿の議長、[ruby=はぬま]羽沼[/ruby]マコトが告げる。"
"211160-207-マコト" = "これよりゲヘナは――"
"211160-211-マコト" = "キヴォトスを支配すべく攻撃を開始する！！"
"211160-215-チアキ" = "え……？"
"211160-216" = "[s] \"マコト……？\""
"211160-217-マコト" = "諸君、顔を上げよ。"
"211160-218-マコト" = "偉大なる鉄血の伝統を持ちながら、我々は何をしてきた？#n些末な逸脱と無意味な騒擾に高貴さを浪費してきた。"
"211160-219-マコト" = "だが、そのような日々は終わった。"
"211160-220-マコト" = "ゲヘナは――多数決や空虚な協議、軟弱な妥協によって進むのではない。"
"211160-221-マコト" = "鉄と血！それこそが歴史の車輪を回す唯一の動力なのだ！！"
"211160-222-マコト" = "銃剣を取れ！！#nゲヘナは塀の中に収まるものではない！"
"211160-223-マコト" = "我らが踏みしめる大地こそ、すべてゲヘナの領土でなければならん！"
"211160-225-マコト" = "腑抜けたキヴォトスは、団結した我々の前に恐怖し膝を折るだろう！！"
"211160-229-ゲヘナの生徒たち" = "……。"
"211160-230-イロハ" = "また訳の分からないことを……！！"
"211160-231" = "[ns] \"何を言ってるの……？\""
"211160-240-ゲヘナの生徒C" = "おおお！！"
"211160-241-ゲヘナの生徒D" = "進め！！ゲヘナの力を一つに！！"
"211160-242-ゲヘナの生徒C" = "戦え！！ゲヘナを取り戻そう！！"
"211160-243-ゲヘナの生徒A" = "な、なに！？"
"211160-244-ゲヘナの生徒B" = "今、何が起きてるの！？"
"211160-249-チアキ" = "こ、これドッキリですか！？ドッキリですよね！？#nだとしたら大成功ですけど……！"
"211160-250-イブキ" = "マコト先輩……？"
"211160-251-サツキ" = "…………。"
"211160-253-興奮したゲヘナの生徒" = "行こう！戦おう！ゲヘナのために！！"
"211160-263-ゲヘナの生徒A" = "ふ、風紀委員長……！"
"211160-264-ゲヘナの生徒B" = "万魔殿議長を止めに来たの？"
"211160-266" = "[ns] \"ヒナ……！\""
"211160-270-ヒナ" = "……。"
"211160-273-マコト" = "……。"
"211160-275-ヒナ" = "――始まった。"
"211160-280-ヒナ" = "ついに――"
"211160-281-ヒナ" = "ゲヘナの偉大な時間が、再び始まった。"
"211160-283" = "[ns] \"……ヒナ？\""
"211160-284-ヒナ" = "どうして今まで気づけなかったんだろう。"
"211160-285-ヒナ" = "風紀委員会の役割は、ゲヘナ内部の騒ぎを鎮めることじゃない。#nゲヘナの意志がキヴォトス唯一の秩序になるよう「強制」することだったんだ。"
"211160-289-イオリ" = "委員長……！"
"211160-293-アコ" = "ふふっ、さすがはヒナ委員長です。"
"211160-294-チナツ" = "え……？"
"211160-299-アコ" = "時宜を得た、極めて迅速な判断。#nいつだって委員長は私たちの進むべき道を示してくださります。"
"211160-300-チナツ" = "行政官……？それはどういう……。"
"211160-305-ヒナ" = "[ruby=はぬま]羽沼[/ruby]マコト議長、あなたの宣言は正しいわ。"
"211160-306-ヒナ" = "決して仲が良かったとは言えないけど……それは本当に進むべき方向が見えていなかったから。"
"211160-307-ヒナ" = "これより風紀委員会は、ゲヘナ最鋭の剣、最速の弾丸となって先陣を切らせてもらう。"
"211160-317-マコト" = "キシシッ……。歓迎しよう、空崎ヒナ。"
"211160-318-ヒナ" = "これでゲヘナは、本当の意味で一つになった。"
"211160-320-ヒナ" = "一緒に壊そう。塀の外の、忌まわしい敵を。"
"211160-321-マコト" = "ああ、もちろんだ。"
"211160-325-マコト" = "歪んだキヴォトスを正し、ゲヘナの名の下に真の秩序を打ち立てる――戦いの始まりだ。"
"211160-329-カレン" = "……。"
"211160-330-マユミ" = "カレン、見たよね！？万魔殿と風紀委員会が……。"
"211160-331-カレン" = "いや、それより……今の、何の話……？"
"211160-332-マユミ" = "分かんないよ！"
"211160-333-マユミ" = "なんにも分かんない……！！"
"211160-335" = "[ns] \"何が起きてるの！？\""
"211160-338" = "次回;過去の遺産"
