[translation]
"211140-1" = "第14話;揺れる炎の影"
"211140-2" = "万魔殿・執務室"
"211140-5-サツキ" = "マコトちゃ～ん。"
"211140-11-マコト" = "なんだ？"
"211140-12-サツキ" = "再興委員会の子たちが来てるわよ。先生も一緒に。"
"211140-13-マコト" = "キキキッ！あの無礼な後輩どもか。どの面下げて来たのか見ものだな。"
"211140-14-マコト" = "前回は先生の顔を立ててやったが、今回はそう易々とはいかんぞ。"
"211140-16-イロハ" = "……どうだか。"
"211140-18-マコト" = "よし、通せ！"
"211140-19-サツキ" = "どうぞ、入っていいわよ。"
"211140-25-マユミ" = "こんにちは！"
"211140-26" = "[s] \"やあ、マコト。\""
"211140-28-マコト" = "ご機嫌とは程遠い心持ちだったが……。"
"211140-29-マコト" = "先生の挨拶であれば受けてやろう。万魔殿にとって最大の協力者だからな。"
"211140-30-ショウコ" = "ふふっ……。"
"211140-34-マコト" = "何がおかしい。"
"211140-35-マコト" = "見ないうちに随分と図太くなったようだ。#nさて、来訪の理由を聞いてやるとしようか。"
"211140-36-マコト" = "また「お願い」か？#n願い通りに事が運ぶ確率は、まさしくゼロに限りなく近いと心得ておけ！"
"211140-37-マユミ" = "うっ……やっぱりこのプレッシャー、すごい……！"
"211140-38-ショウコ" = "マユミ委員長、ここは私が。"
"211140-39-カレン" = "また媚びモードやるの？"
"211140-40-ショウコ" = "うるさいですよ。ちゃんと考えあってのことですから。"
"211140-42-マコト" = "私の時間を奪っておいて何をこそこそ話している！#n自信がないならとっとと引き返すがいい！"
"211140-47-ショウコ" = "なぜ、議長殿のもとを訪ねたのか……。"
"211140-48-ショウコ" = "万魔殿の威信を、より確かなものとするため──と言ったら、どうでしょうか。"
"211140-49-マコト" = "ほう？"
"211140-50-ショウコ" = "ゲヘナ再興委員会の影響力が日ごとに増していることは、#nマコト議長も把握されているはずです。"
"211140-51-ショウコ" = "同時に、私たちが活動を始めてからというもの、生活満足度の調査結果が以前の数値をはるかに上回っていることも。"
"211140-52-マコト" = "それがどうしたと言うのだ！"
"211140-53-ショウコ" = "校内の事件や事故は大幅に減少し、自治区の経済も活性化しています。"
"211140-54-ショウコ" = "どうして万魔殿は何もしてこなかったのかという声も上がり――"
"211140-55-ショウコ" = "一部では「選挙」の話まで出ています。"
"211140-56-ショウコ" = "再興委員会に任せたほうがいいのではないか。そんな意見もあるようで。"
"211140-57-マコト" = "くぅっ……。"
"211140-59-イロハ" = "出まかせでもないんですよね。実際に出ている話です。"
"211140-60-サツキ" = "マコトちゃん続投ピンチじゃない？"
"211140-62-マコト" = "後輩風情が……。"
"211140-66-ショウコ" = "その展開は、私たちの本意ではありません。"
"211140-67-マコト" = "何だと？"
"211140-68-ショウコ" = "ゲヘナ再興委員会は、万魔殿のサポート役に徹するべきだと考えています。"
"211140-69-マコト" = "なんのつもりだ。"
"211140-71-マユミ" = "どういうこと……？"
"211140-72-カレン" = "とりあえず聞いてみよう。何か考えがあるはず。"
"211140-73-マユミ" = "うーん……。"
"211140-75-ショウコ" = "言うなれば、再興委員会はアマチュアの集まりです。#n情熱と勢いはあっても、経験が足りない。"
"211140-76-ショウコ" = "政策の決定や、大局を見据えた判断を迫られたとして……#n柔軟かつ的確に対処できるとは限りません。"
"211140-77-ショウコ" = "それどころか、生徒会の役割を担おうものなら、失敗を重ね……積み上げた信頼も瞬く間に崩れていくでしょう。"
"211140-78-マコト" = "ふむ……。"
"211140-79-ショウコ" = "ゲヘナを偉大にする役目は、万魔殿にこそ果たせるものだと考えています。"
"211140-80-ショウコ" = "再興委員会でも、風紀委員会でもなく──万魔殿にしかできない仕事です。"
"211140-81-マコト" = "……。"
"211140-82-マコト" = "キシシッ、どうやら少しは話が分かるようだ。"
"211140-87-マコト" = "この[ruby=はぬま]羽沼[/ruby]マコト様こそ真のリーダーに相応しいと言いに来たわけだな！#nゲヘナ再興委員会、見どころがあるじゃないか！"
"211140-88-イロハ" = "そこまで言ってませんけどね。"
"211140-89-ショウコ" = "……そう捉えていただいても構いません。"
"211140-90-ショウコ" = "ですが。"
"211140-96-ショウコ" = "多くのゲヘナ生はそう思っていないのが問題なのです。"
"211140-97-マコト" = "あり得ん！#n万魔殿の予算のうち、ゆうに六割以上はマコト様の偉大さを広めるために使っているはずだ！"
"211140-98-マコト" = "万魔殿はぼんやりとしか認知しておらずとも、マコト様の名を知らぬ者など――"
"211140-100-サツキ" = "マコトちゃん、それは逆だと思うのだけど……。"
"211140-102-ショウコ" = "ここからは数字の出番ですね。こちらをご覧ください。"
"211140-107-ショウコ" = "先日、キラキラ部が校内放送を担当したときの聴取率です。"
"211140-108-ショウコ" = "普段に比べて800％以上の伸びを記録しています。"
"211140-109-マコト" = "な、なんだそのグラフは……！！"
"211140-111-イロハ" = "実際、相当盛り上がってましたからね。体感としてもそんなところかと。"
"211140-112-サツキ" = "聞き逃したのが残念だわ。"
"211140-114-ショウコ" = "この数値が示していることは明白です。#n生徒は目新しいものに熱狂し、繰り返しの内容には飽きてしまう。"
"211140-115-ショウコ" = "従って、万魔殿の影響力を今以上に拡大するためには――"
"211140-116-ショウコ" = "戦略を変える必要がある、ということです。"
"211140-117-マコト" = "つまり何が言いたいのだ！"
"211140-118-ショウコ" = "ゲヘナ再興委員会に校内放送をお任せいただけませんか。"
"211140-119-マコト" = "……またその話か。"
"211140-120-ショウコ" = "ただお知らせを垂れ流すだけではなく――#nコンテンツ制作に力を入れ、コミュニケーションの窓口としても活用するのです。"
"211140-121-ショウコ" = "さらに私たちなら、洗練された形で万魔殿の広報も同時に行えます。"
"211140-123-チアキ" = "お、いいんじゃないですか？#nずっとお休みしたままですし。"
"211140-125-ショウコ" = "あまつさえ、万魔殿の権威を損ないかねません。#nシステムが機能していない状況は、行政能力への不信を招きます。"
"211140-126-マコト" = "代わりが見つからないばかりに、やむを得ず放置していたが……。"
"211140-127-マコト" = "……。"
"211140-128-マコト" = "その空白を埋められると言うのだな？"
"211140-129-ショウコ" = "はい。生徒の心を掴んできた実績は、すでにご存じのとおりです。"
"211140-130-マコト" = "それは……認める他あるまい。"
"211140-131" = "[s] （勝負あったかな……）"
"211140-133-サツキ" = "マコトちゃん、どうする？"
"211140-142-マコト" = "いいだろう！#n舞台を用意されたなら、その上で踊るのはマコト様でなければならない！"
"211140-143-マコト" = "ゲヘナ再興委員会。お前たちの望み――この私が徹底的に利用してくれるわ！！"
"211140-145-マコト" = "無知蒙昧な風紀委員には、この手の青写真は一生理解できまい！キシシッ！！"
"211140-147-マユミ" = "なーんか感じ悪いけど……放送室には入れるようになったね。"
"211140-148-カレン" = "万魔殿の手先になった気分で嫌なんだけど……。"
"211140-150-ショウコ" = "全部、計画のうちです。"
"211140-152-チアキ" = "あははっ、じゃあ写真いきまーす！はい、ゲヘナ！"
"211140-163-チアキ" = "万魔殿と再興委員会が手を取り合った歴史的瞬間！これは特ダネになる予感～！"
"211140-164" = "[s] \"なんだかんだ、またうまく収まったね。\""
"211140-165-サツキ" = "でも、放送室の設備は慎重に扱って頂戴。"
"211140-166-サツキ" = "ちょくちょく事故が起きてるのよね。前の放送部長も急に辞めてしまったし。"
"211140-167-ショウコ" = "……理由は分かっているんですか？"
"211140-168-サツキ" = "何だったかしら。#nぼーっとした顔で「一身上の都合です」って繰り返していたらしいわ。"
"211140-172-サツキ" = "未だに復帰の目途は立ってないのよ。だからあなたたちも気をつけてね。"
"211140-173-ショウコ" = "はい、承知しました。"
"211140-174-ショウコ" = "……。"
"211140-175-ショウコ" = "サツキ情報部長は、もしかして……。"
"211140-176-サツキ" = "なにかしら。"
"211140-177-ショウコ" = "……いえ、改めて伺います。"
"211140-178-サツキ" = "なによ、気になるじゃない。ちゃんと最後まで言ってほしいのだけど。"
"211140-179-ショウコ" = "本当に大したことではありませんので。"
"211140-185-マユミ" = "じゃあ私たちはこのへんで。"
"211140-187-マコト" = "ふっ。どれだけ走り回ろうと、この私の手のひらの上だと肝に銘じておけ。"
"211140-189-カレン" = "なんか腹立つ……。"
"211140-191-マコト" = "不満があるなら頂点まで登ってくるがいい！#nマコト様と同じ高さから世界を見渡すのは容易くないがな！キシシッ！"
"211140-193-マユミ" = "早く行こ……。"
"211140-201-イロハ" = "ところでマコト先輩。放送の権限なんて、ぽんと渡して大丈夫なんですか？"
"211140-202-マコト" = "まだ私ほど先は見えていないようだな。"
"211140-203-マコト" = "再興委員会はゲヘナで最もホットな話題だ。"
"211140-204-マコト" = "そんな連中に、私は万魔殿のお墨付きを与えてやった。#nつまり、人気そのものを取り込んだのだ！"
"211140-205-マコト" = "さらにだ。もしも放送が大失敗したとして、生徒は誰を責める？"
"211140-206-マコト" = "そうとも、実行した再興委員会の方だ！"
"211140-207-マコト" = "座っているだけで宣伝効果を享受し、責任はやつらに押し付けられる……。"
"211140-208-マコト" = "これは完璧な策なのだ！！"
"211140-210-イロハ" = "その頭の回転、もうちょっと建設的なことに使ってくれませんかね……。"
"211140-217" = "放送室"
"211140-220" = "[ns] \"暗っ！\""
"211140-221-マユミ" = "電気つけよ！"
"211140-222-カレン" = "スイッチスイッチ！"
"211140-233-マユミ" = "ここが……。"
"211140-234-ショウコ" = "放送室……。"
"211140-235-カレン" = "ちょっと古びてるけど、必要なものは揃ってそうだね。"
"211140-241-マユミ" = "うわ、これ何だろ？"
"211140-243-カレン" = "えー、触んない方がいいって。"
"211140-250-マユミ" = "わわっ……！！"
"211140-252-カレン" = "マユミちゃん！"
"211140-253-マユミ" = "ご、ごめん！こんなだとは思わなくて！"
"211140-254-マユミ" = "よく分かんない機械がいっぱいで……ちょっと怖いね。"
"211140-258-マユミ" = "ショウコは……何してるの？"
"211140-264-ショウコ" = "ふふ、ふふふ……。"
"211140-265-カレン" = "な、なに……どしたの。"
"211140-269-ショウコ" = "……あ。"
"211140-270" = "[s] \"大丈夫？\""
"211140-271-ショウコ" = "はい、問題ありません。"
"211140-272-ショウコ" = "委員長が変な物を触ったせいです。"
"211140-274-マユミ" = "ごめんてば！"
"211140-275-カレン" = "それで、幽霊の声の手がかりはどうやって見つける？"
"211140-277-ショウコ" = "では……電磁波測定器を……。"
"211140-284-ショウコ" = "このあたりですね。"
"211140-290-カレン" = "やはっ！ショウコちゃん専門家っぽい！"
"211140-291-マユミ" = "何か分かった？"
"211140-293-ショウコ" = "……。"
"211140-294-ショウコ" = "このあたりから、特に強い反応が……。"
"211140-302-ショウコ" = "……。"
"211140-304-カレン" = "……。"
"211140-308-マユミ" = "カレン、また変な驚かせ方しちゃダメだからね。"
"211140-309-カレン" = "バレたか。"
"211140-310-カレン" = "じょーだんだって。何か見つけたっぽいし、大人しくしとく。"
"211140-316-ショウコ" = "なるほど……ここにあったんですね……。"
"211140-317-マユミ" = "どんな感じ？"
"211140-321-ショウコ" = "……スピーカーへ繋がっているケーブルが劣化しているようです。"
"211140-322-ショウコ" = "単なる接続不良の可能性が高いかと。"
"211140-324-カレン" = "そういうのって見ただけで分かるんだ？"
"211140-325-ショウコ" = "通信や電波関係は、それなりに勉強しましたので。"
"211140-329-ショウコ" = "このケーブルを抜けば、幽霊騒ぎは起きなくなるはずです。"
"211140-330-ショウコ" = "……機材は、いずれ交換が必要でしょうけど。"
"211140-331-カレン" = "こんなにあっさり解決しちゃうんだ。"
"211140-332-マユミ" = "一件落着！"
"211140-333-マユミ" = "私たちにできぬことなし！ショウコ最高！"
"211140-334-マユミ" = "あ、依頼人に伝えに行こう！#nもう怖がらなくて済むし、絶対喜ぶよ！"
"211140-335-カレン" = "またエンジンかかったね。"
"211140-337-ショウコ" = "私はもう少し見ていきます。他にも問題がないとは限りませんから。"
"211140-338" = "[s] \"一緒に残ろうか？\""
"211140-339-ショウコ" = "いえ、私だけで十分です。"
"211140-340-ショウコ" = "お気遣いありがとうございます。"
"211140-341-マユミ" = "あんまり遅くならないようにね！他にもやることあるんだし！"
"211140-342-ショウコ" = "これから長い旅に出ますので。探さないでください。"
"211140-343-マユミ" = "いいから早く帰ってきて！！"
"211140-351-ショウコ" = "……。"
"211140-355-ショウコ" = "そうですね……この場所で――"
"211140-359" = "次回;マユミ"
