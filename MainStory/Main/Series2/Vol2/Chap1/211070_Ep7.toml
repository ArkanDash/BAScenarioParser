[translation]
"211070-1" = "第7話;カレン"
"211070-8-スケバンA" = "やぁやぁ。こ～ん～に～ち～は～？"
"211070-14-スケバンB" = "無視ってのはひどいじゃんよ。"
"211070-15-ゲヘナの生徒" = "……何か用？"
"211070-19-スケバンB" = "いや～あたし、ゲヘナの奴が大っ嫌いでさ。"
"211070-20-スケバンB" = "もう見るだけでアレルギー出んの。"
"211070-21-スケバンB" = "で、お前を見ちゃったじゃん？#nだから……ほらここ、蕁麻疹。"
"211070-22-スケバンA" = "……あれ、消えてない？"
"211070-23-スケバンB" = "ちっ、水性かよ。もっかいペン貸して。"
"211070-27-スケバンB" = "ほら、見ろ。お前のせいで腕にホクロが7個もできた。#nこれ、どう責任取ってくれんだ？"
"211070-28-ゲヘナの生徒" = "いま自分で描いたよね！？"
"211070-29-スケバンB" = "うるせぇな！つべこべ言わずに慰謝料払え！"
"211070-30-ゲヘナの生徒" = "無茶苦茶な……。"
"211070-31-スケバンB" = "さっさと財布出すのが身のためだと思うぜ？"
"211070-32-ゲヘナの生徒" = "うぅ……あんた達……。"
"211070-33-スケバンA" = "はーっ、ゲヘナったって1人で歩いてりゃ楽な獲物だぜ。"
"211070-34-スケバンB" = "結束力はねぇし、風紀委員会は自治区内のことで手一杯。"
"211070-35-スケバンB" = "つまり、誰もあんたを助けない！"
"211070-37" = "[ns] 前へ出る。"
"211070-40" = "[ns] \"ん……？あれは……。\""
"211070-41-？？？" = "やはっ！マジうけんね。"
"211070-42-スケバンA" = "あぁん？今なんつった？"
"211070-43-スケバンB" = "誰だテメェ？"
"211070-48-スケバンB" = "なんだ、またゲヘナか？"
"211070-52-カレン" = "そう。ゲヘナ。"
"211070-53-カレン" = "だからさ――"
"211070-54-カレン" = "うちの生徒から手ぇ離して、とっとと消えてくれる？"
"211070-59" = "[ruby=みょうらく]明楽[/ruby]カレン"
"211070-60" = "ゲヘナ再興委員会の委員長補佐"
"211070-61" = "見た目に反して短気で、暴力に一切のためらいがない"
"211070-65-スケバンB" = "あぁん？"
"211070-66-スケバンA" = "なになに、あんた何様？#n腕章……はつけてねぇし、風紀委員会じゃなさそうだな。"
"211070-67-スケバンA" = "てこたぁ、お前の[ruby=ダチ]友達[/ruby]か？"
"211070-68-ゲヘナの生徒" = "えっ、違っ……別に、そういうんじゃ――"
"211070-72-カレン" = "今から友達だから。よろしく。"
"211070-73-ゲヘナの生徒" = "えぇっ……。"
"211070-74-スケバンB" = "ま、なんでもいいけどよ。1人で何ができる。#n世の中の理不尽ってやつを教えてやるよ！"
"211070-75-スケバンA" = "キヴォトスの苦みと冷たさ体験コースだぁっ！"
"211070-77" = "[ns] \"ちょ、ちょっと……！\""
"211070-87-スケバンA" = "ぐはっ！こ、この……！"
"211070-97-スケバンA" = "うぐっ！痛っ――！！"
"211070-98-スケバンB" = "お、覚えてやがれ……！"
"211070-103-ゲヘナの生徒" = "一瞬で終わった……。"
"211070-108-カレン" = "だいじょぶ？"
"211070-109-ゲヘナの生徒" = "え、あ……うん。"
"211070-110-カレン" = "固い固い。もっとフランクでいいって。#n怪我はしてなさそうだし、取られたものもなさそうだね。"
"211070-111-ゲヘナの生徒" = "ホントにありがとね。助けてくれなかったらどうなってたか……。"
"211070-112-カレン" = "さっき言ったっしょ？もう友達って。#nうちの友達いじめるやつは絶対許さないから。"
"211070-113-ゲヘナの生徒" = "かっこいい……。"
"211070-114-カレン" = "あ、全然話変わるんだけどさ、ゲヘナ再興委員会って知ってる？"
"211070-115-ゲヘナの生徒" = "……聞いたことあるかも。なんか最近有名だよね？"
"211070-116-カレン" = "うち、そこ入ってるんだ。"
"211070-117-ゲヘナの生徒" = "え、マジ？私、部活とか入ってなくてさ。"
"211070-118-カレン" = "やはっ、じゃあ入っちゃいなよ！"
"211070-119-カレン" = "はい、うちのモモトーク。何かあったら連絡ちょうだい。"
"211070-120-カレン" = "うちらは「外」でもゲヘナの生徒を守ってるから。風紀委員会とは違ってね。"
"211070-121-ゲヘナの生徒" = "めっちゃカッコいいじゃん……。"
"211070-122-ゲヘナの生徒" = "入会届だしちゃおっかな！"
"211070-123-カレン" = "ゲヘナを再び偉大に！"
"211070-127-ゲヘナの生徒" = "ゲヘナを再び偉大に！"
"211070-132-カレン" = "やはっ、今日も一件落着！"
"211070-137-カレン" = "あれ、先生？"
"211070-138" = "[s] \"やぁ。\""
"211070-139-カレン" = "わっ、本物だ！"
"211070-140-カレン" = "何してんの？ってか、うちの活躍見てた？"
"211070-141" = "[s1] \"かっこよかったよ。\"\n[s2] \"友達を守ったんだね。\""
"211070-144-カレン" = "マジ？見てくれてたんだ！"
"211070-145-カレン" = "えー、ヤバ。嬉しいかも。"
"211070-149-カレン" = "じゃ、なでなで！良いことしたら褒められるのが当然でしょ？"
"211070-150" = "[s] 撫でる。"
"211070-155-カレン" = "やはっ。"
"211070-159-カレン" = "ん～？いつもこういうことしてるのかって？"
"211070-160-カレン" = "まあ、そこそこ？"
"211070-162-カレン" = "自治区の外だとたまにあるんだよね。風紀委員会は中だけだから。"
"211070-163-カレン" = "1人で歩いてるゲヘナ生は狙われやすいんだよ。#nや、それはどの学園も似たようなもんか。"
"211070-164-カレン" = "でも、ゲヘナの生徒に手ぇ出したやつは絶対逃がさない。"
"211070-166-カレン" = "え？いつでも呼んでね、って……先生を？"
"211070-170-カレン" = "やっさし～そういうこと言われたの久しぶりだなぁ。"
"211070-171-カレン" = "だけどねぇ、うち、けっこう強いんだよ？#n数が多くても大抵はなんとかなるし。"
"211070-172-カレン" = "負けそうだなって思ったら、一回引いてから奇襲かければオッケー。"
"211070-173-カレン" = "てか、危ないのは先生のほうじゃない？#nさっきみたいに、ここの治安結構ガタガタだから。"
"211070-174-カレン" = "せっかくだし、先生の用事が終わるまでエスコートしてあげる！"
"211070-175-カレン" = "あ、気にしないで。やることなくて暇だったから。"
"211070-182" = "（道中、他にも何度か脅されたが……）"
"211070-196" = "（カレンが撃退してくれた）"
"211070-202" = "[ns] \"今日はありがとね。\""
"211070-203-カレン" = "なんのなんの。力になれたならよかったよ。"
"211070-204-カレン" = "一緒にあちこち回れて、うちも楽しかったし。"
"211070-205-カレン" = "でも先生、やっぱ絡まれやすいタイプだよね。今日だけでも狙われ過ぎ。"
"211070-206" = "[s] \"困っちゃうよね……。\""
"211070-207-カレン" = "今度からは遠慮なく呼んでいいからね？"
"211070-208-カレン" = "あ、モモトーク教えとこっか。メッセでも電話でも、好きなほうで～"
"211070-213-カレン" = "よし、登録完了！"
"211070-214-カレン" = "なんか繋がった感じしていいよね。"
"211070-215-カレン" = "うち、大人とこういうことするの初めてでさ。やはっ、めっちゃ楽しい。"
"211070-219-カレン" = "あ、そろそろ戻らないと。"
"211070-220-カレン" = "最後に、何か聞きたいこととかある？"
"211070-221-カレン" = "今日は出血大サービス。何でも答えたげるよ？"
"211070-225" = "[ns] \"カレンはどうしてゲヘナ再興委員会の活動をしてるの？\""
"211070-226-カレン" = "おっ、予想外の質問。"
"211070-227-カレン" = "うーん……。"
"211070-231-カレン" = "ゲヘナが好きだから？"
"211070-232-カレン" = "たぶんそれが一番！"
"211070-233-カレン" = "みんなと一緒に何かやるのも楽しいし。#n先生も見て分かったでしょ？うちのメンツ、みんな面白いからさ。"
"211070-234-カレン" = "んー？ゲヘナが好きな理由？"
"211070-235-カレン" = "……。"
"211070-236-カレン" = "うーん……うぅ～ん……。"
"211070-237-カレン" = "難しいなぁ。いろいろあるとは思うんだよね。"
"211070-238-カレン" = "まず……後腐れのない空気？っていうの？"
"211070-239-カレン" = "偽善ってマジで嫌いなんだよね。#n表じゃニコニコしておいて、裏でごちゃごちゃ言うとか。#nああいうの、ホント無理。"
"211070-240-カレン" = "でも、うちってそうじゃないでしょ？#nやる時は派手にやるけどそれっきり。表も裏もない。"
"211070-241-カレン" = "あとは～好き勝手していい感じかな。自由な感じ。あれが好き。"
"211070-242-カレン" = "委員会の方向性とちょっと違くないかって？"
"211070-243-カレン" = "それねー、たしかに。ゲヘナに秩序と統制を、ってね。"
"211070-244-カレン" = "こう言うと聞こえ悪いかもだけど……それ、[ruby=うちのブレイン]ショウコちゃん[/ruby]の受け売りなの。"
"211070-245-カレン" = "でも……やっぱマユミちゃんの見てる景色が気になるからかな。#nうちもそれを見たいから一緒に走ってるんだ。"
"211070-246-カレン" = "めちゃくちゃなゲヘナも嫌いじゃないけどさ。"
"211070-247-カレン" = "マユミちゃんって、うちが知ってる中で1番ゲヘナを愛してるから！"
"211070-249-カレン" = "そんなマユミちゃんが作りたい学園ってどんな場所なんだろう、って。"
"211070-250-カレン" = "突っ走って事故るタイプだけど、そこが良いっていうか。"
"211070-251-カレン" = "ショウコちゃんはたまに変なこと言うけど、ゲヘナ好きなのは同じだし。"
"211070-253-カレン" = "見てみたくない？#nみんなが一つになったゲヘナ。"
"211070-254-カレン" = "バラバラじゃなくて、みんなが同じ方向を見てるの。"
"211070-255-カレン" = "どんな感じかは全然想像つかないけどさ。"
"211070-257-カレン" = "やはっ、それかな。うちが再興委員会で頑張ってる理由。"
"211070-258-カレン" = "どう？ちゃんと答えになってた？#nまとまってなかったらごめんね。勉強苦手なんだ。"
"211070-259" = "[s] \"大丈夫、十分伝わったよ。\""
"211070-260-カレン" = "そっか。よかった。#n……あ！あとこれも言わなきゃ。"
"211070-265-カレン" = "手伝ってくれてありがとね、先生。"
"211070-266-カレン" = "うちらだけじゃ、きっともっと大変だったと思う。#n先生のおかげでスムーズに進んでる。"
"211070-267-カレン" = "最近は入会してくる生徒も増えてきたんだよ。"
"211070-268-カレン" = "だから、これからもよろしくね！"
"211070-270" = "（カレンのおかげで、安全に予定を終えられた）"
"211070-271" = "（ゲヘナへの想いも「本気」だと感じた）"
"211070-273" = "次回;トリガー・ハッピー・ゾーン"
