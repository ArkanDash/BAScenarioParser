[translation]
"211030-1" = "第3話;ゲヘナを偉大に！"
"211030-6-マユミ" = "もー！"
"211030-7-マユミ" = "AT4無反動砲ぶっ放したの誰！？"
"211030-11-ゲヘナの生徒" = "ごめ～ん！#nロケットジャンプの練習してたら飛んでっちゃった！"
"211030-12-マユミ" = "なんで校内でそんな練習するの！"
"211030-13-ゲヘナの生徒" = "ここじゃなきゃどこでやるの？"
"211030-14-マユミ" = "人のいないとことか！#n見てよこれ！駐車場に大穴あいてるし、街灯は折れてるし！"
"211030-15-ゲヘナの生徒" = "おー！ほんとだー！"
"211030-16-マユミ" = "こんなだから「ゲヘナはいつも散らかっててカオスだ」って言われるんだよ！"
"211030-20-ゲヘナの生徒" = "え、今さら？ゲヘナって元からこうでしょ？"
"211030-21-マユミ" = "なぁっ……！"
"211030-22-ゲヘナの生徒" = "ま、風紀委員会が来る前に逃げるね！お疲れ～"
"211030-30-カレン" = "おー、ちょっと目を離した隙にコレかぁ。"
"211030-31-ショウコ" = "マユミ委員長、大丈夫ですか。"
"211030-32-マユミ" = "どうにかね。#n交通整理してたんだけど、無反動砲ぶっ放して逃げた生徒がいてさ……はぁ。"
"211030-33-ショウコ" = "1発で済んだのは幸いでしたね。"
"211030-34-カレン" = "どんまいどんまい。"
"211030-35-カレン" = "まあ最初だし、こんなもんっしょ。#n交通整理とか校内ボランティアとか。コツコツやってこうよ。"
"211030-36-マユミ" = "うん……。"
"211030-37-マユミ" = "……失敗したのはいいの。やってればこういうこともある。"
"211030-38-マユミ" = "でも、あの一言だけは許せないんだ。"
"211030-42-マユミ" = "私がいっちばん嫌いな言葉。"
"211030-43-マユミ" = "「ゲヘナは元からこう」ってやつ！！"
"211030-44-マユミ" = "何が「元から」なの？#nそれって何も変える気ありませんってことじゃん！"
"211030-45-マユミ" = "それに、ゲヘナは最初からこんなんじゃなかったんだよ？#nいつからこうなっちゃったのさ！"
"211030-46-？？？" = "それはそう。ゲヘナは元々こんなじゃなかった。"
"211030-50-マユミ" = "誰……？"
"211030-56-万魔殿の3年生" = "君たち、あれでしょ？ゲヘナ再興委員会。"
"211030-57-マユミ" = "そうだけど……。"
"211030-58-カレン" = "センパイは？"
"211030-59-万魔殿の3年生" = "通りすがりの万魔殿さ。"
"211030-60-万魔殿の3年生" = "気になったから、一言だけね。話に混ざる気はないから、それじゃ……。"
"211030-61-マユミ" = "待って！"
"211030-62-マユミ" = "先輩は昔を知ってるの？"
"211030-63-マユミ" = "秩序が保たれて、学園全体が統制に従ってた頃の話。"
"211030-64-万魔殿の3年生" = "知ってるさ。よく知ってる。"
"211030-65-マユミ" = "その頃のゲヘナはカッコよかったんでしょ？"
"211030-66-マユミ" = "今みたいなカオスじゃなくて……。"
"211030-67-万魔殿の3年生" = "……。"
"211030-68-万魔殿の3年生" = "そうか。君たちは昔を知らないんだな。"
"211030-69-マユミ" = "誰もちゃんと話してくれないんだもん！"
"211030-73-万魔殿の3年生" = "……皆が口をつぐむなりの理由があるんだよ。"
"211030-77-マユミ" = "どういうこと？"
"211030-78-万魔殿の3年生" = "手放しには褒められないってことさ。"
"211030-79-万魔殿の3年生" = "君たちは憧れてるみたいだけど……。"
"211030-83-万魔殿の3年生" = "私は……あの頃に戻りたいとは思わない。"
"211030-84-マユミ" = "どうして！？"
"211030-89-カレン" = "じゃあセンパイは、今の方がいいってこと？"
"211030-90-万魔殿の3年生" = "ああ。"
"211030-91-カレン" = "……。"
"211030-92-万魔殿の3年生" = "詳しいことを話す気はないし、話せることでもない。"
"211030-93-万魔殿の3年生" = "君たちがゲヘナのために何かしようとしてるのは分かるよ。#nそれにはきっと意味がある。"
"211030-94-万魔殿の3年生" = "ただ、幻想を抱きすぎない方がいいってだけさ。"
"211030-98-万魔殿の3年生" = "ま、応援してるよ。頑張ってる姿を見るのは悪くないからな。"
"211030-103-カレン" = "……。"
"211030-104-マユミ" = "……。"
"211030-105-マユミ" = "あの先輩は何も分かってないんだよ！きっとそう！"
"211030-106-マユミ" = "昔のゲヘナはちゃんと秩序があって、カッコいい学園だったに決まってる！#nでしょ？"
"211030-107-ショウコ" = "……はい。もちろんです。"
"211030-108-マユミ" = "よし！落ち込んでる場合じゃない！#n私たちのやることには意味があるんだから！！"
"211030-109-カレン" = "やはっ、それでこそ委員長だよね！"
"211030-110-マユミ" = "さっきの先輩にも思い知らせてやるんだから。"
"211030-111-マユミ" = "私たちが頑張って、ゲヘナの偉大さを取り戻す！"
"211030-112-カレン" = "もち！"
"211030-113-マユミ" = "そのためには、何か――"
"211030-117-マユミ" = "今みたいに地道に走り回ってるだけじゃ限界があるよね。"
"211030-121-マユミ" = "私たちに足りないものって何だと思う？"
"211030-125-ショウコ" = "ちょうど、いくつか計画を立ててあります。"
"211030-126-カレン" = "さっすがうちのブレイン！ショウコちゃん！"
"211030-127-マユミ" = "聞きたい聞きたい！"
"211030-128-ショウコ" = "その前に。"
"211030-132-ショウコ" = "どれだけ立派な主張でも、聞いてもらえなければ意味がありません。"
"211030-133-マユミ" = "それは、まあ……そうだよね。"
"211030-134-ショウコ" = "主張を通すために必要なもの。"
"211030-138-ショウコ" = "それは「権威」です。"
"211030-139-マユミ" = "権！"
"211030-140-カレン" = "威！"
"211030-144-ショウコ" = "ええ。"
"211030-145-ショウコ" = "そして――お誂え向きな象徴がありまして。"
"211030-147" = "次回;ゲヘナを偉大に……！"
