[translation]
"3603-1" = "おかしなノスタルジー（３）"
"3603-2" = "（ブウウーーン）"
"3603-4-セイア" = "……。"
"3603-5-ミカ" = "……。"
"3603-6-ナギサ" = "……。"
"3603-11-ミカ" = "ナギちゃん、大丈夫？"
"3603-13-ナギサ" = "私は……大丈夫です……。"
"3603-14-ナギサ" = "おかげさまで、楽しかったです……とても……。"
"3603-15-ミカ" = "そんな顔で言われても説得力ないんだけど！？"
"3603-16-ミカ" = "う～ん……。"
"3603-17-ミカ" = "遊園地とかの方が良かったのかなぁ……。"
"3603-18-ミカ" = "……あれ？"
"3603-22-ミカ" = "公園だ。"
"3603-23-ミカ" = "ねえねえナギちゃん、ほら見て。懐かしくない？"
"3603-24-ミカ" = "小さい頃、何かあった時はよく公園に行ったよね。"
"3603-25-セイア" = "公園……。"
"3603-29-セイア" = "それだ。"
"3603-33" = "（キキーーッ！）"
"3603-34-ナギサ" = "！？"
"3603-35-ミカ" = "急ブレーキなんてどうしたの！？"
"3603-36-セイア" = "済まない。急に眠気を催してしまった。"
"3603-37-セイア" = "居眠り運転をするわけにもいくまい。少し公園で休ませてくれ。"
"3603-38-ミカ" = "……。"
"3603-39-ミカ" = "ふぅ～ん……？"
"3603-40-ミカ" = "りょーかいっ☆"
"3603-41-ナギサ" = "……？"
"3603-45-ミカ" = "ここ、昔の公園にそっくりじゃない？"
"3603-46-ミカ" = "人気がなくて、雑草だらけってところを除けば……だけど。"
"3603-52-ミカ" = "ほらナギちゃんも！こっち！"
"3603-53-ナギサ" = "私は……このままで……。"
"3603-54-ミカ" = "だーめっ☆"
"3603-55-ナギサ" = "えっ……。"
"3603-64" = "（ナギサはミカに手を引かれるまま公園へと向かった）"
"3603-67-ナギサ" = "……。"
"3603-69-ナギサ" = "（どこか、座れる場所は……）"
"3603-70-ナギサ" = "（あ、すべり台……）"
"3603-75" = "ジュッ……！"
"3603-76-ナギサ" = "きゃっ！？"
"3603-78-ナギサ" = "熱っ……！"
"3603-79-ミカ" = "あははっ！ナギちゃん、思った通り！"
"3603-80-ナギサ" = "笑い事ではありません！滑り台が熱せられていて――"
"3603-81-ナギサ" = "火傷するところだったんですよ！"
"3603-85-ミカ" = "でも、ちょっと元気出たみたいだね？"
"3603-86-ナギサ" = "えっ……？ああ……。"
"3603-87-ナギサ" = "そう……ですね。"
"3603-88-ミカ" = "よかったぁ～"
"3603-89-ミカ" = "本当に心配したんだよ？#nさっきなんてお茶になろうとしてたし……。"
"3603-90-ナギサ" = "何の話ですか……？"
"3603-91-ナギサ" = "ですが……たしかに。#nいつも元気をもらう場所でしたね、公園は。"
"3603-92-セイア" = "消費過多になれば、元気は容易に枯渇するものだ。"
"3603-93-セイア" = "だから……これを。"
"3603-98-ナギサ" = "……？"
"3603-99-ナギサ" = "これは……駄菓子？"
"3603-100-セイア" = "二人がじゃれ合っている間に、近くで買ってきたんだ。"
"3603-101-セイア" = "今日はせいぜい紅茶くらいしか、胃にものを入れていないだろう？"
"3603-102-ナギサ" = "あ……で、では……。"
"3603-108-ナギサ" = "……甘すぎます。"
"3603-109-ナギサ" = "中も、外も。全部甘いです。"
"3603-110-ナギサ" = "こっちは……塩っ辛いです。"
"3603-114-ナギサ" = "こちらは苦みが強すぎる印象が。"
"3603-115-ナギサ" = "どれも単純で、粗末な味です。"
"3603-116-セイア" = "だが……幼き時分には美味しく感じていたはず。"
"3603-117-セイア" = "違うかい？"
"3603-118-ナギサ" = "……そうですね。あの頃は最高のお菓子だと思っていました。  "
"3603-120-ミカ" = "昔のこと、思い出すなぁ。"
"3603-121-ミカ" = "あーあ、あの頃のナギちゃんは可愛かったのに～"
"3603-122-ナギサ" = "なっ、何の話ですか！？"
"3603-124-セイア" = "駄菓子の味は変わっていない。"
"3603-125-セイア" = "変わったのは、ナギサだ。"
"3603-126-セイア" = "優雅で、繊細で、味の機微が分かるようになった。"
"3603-127-ナギサ" = "……？"
"3603-128-ミカ" = "つまり、昔は良かったことも、#n後で振り返ったら普通に思えたりするよね、ってこと。"
"3603-129-ミカ" = "この駄菓子みたいにね。"
"3603-130-ナギサ" = "……。"
"3603-131-ミカ" = "逆に、今の辛い記憶が、未来には良い思い出になるかもしれない。"
"3603-132-ミカ" = "ナギちゃんも、私たちも。#nずっと成長し続けるし、変わっていくから。"
"3603-133-ナギサ" = "それはつまり……。"
"3603-134-ナギサ" = "「いつかは良い思い出になるから頑張れ」というアドバイスでしょうか？"
"3603-135-ナギサ" = "……ありきたりな言葉ですね。"
"3603-136-ミカ" = "えー、きびしーなぁ。"
"3603-137-ナギサ" = "ふふっ……。#nとはいえ、真実は往々にしてありきたりなものです。"
"3603-138-ナギサ" = "だからついつい、忘れてしまうのですが……。"
"3603-139-ナギサ" = "ですから、これも。#nその……忘れてしまう前に。"
"3603-141-ナギサ" = "ミカさん、セイアさん……ありがとうございます。"
"3603-143-セイア" = "……。"
"3603-144-ミカ" = "じゃあさ！忘れられないようにしたらいいんじゃない？#nこれからもたまに、こうやって遊びに行けば思い出せるよ！"
"3603-148-ミカ" = "たしか、ティーパーティーのプライベートビーチとかもあったよね？#n次はそこ行こっ！"
"3603-149-ナギサ" = "……ふふっ、いいですね。"
"3603-150-ミカ" = "じゃっ、約束！#n……忘れないでよ？"
"3603-151-ナギサ" = "ええ、もちろん。#nではそろそろ、帰りましょうか。"
"3603-152-ナギサ" = "私たちの[ruby=家]トリニティ[/ruby]に。"
"3603-153-ナギサ" = "最高級の茶葉に、やたらと甘いお菓子がありますから。#n戻ったら、お茶会にいたしましょう。"
"3603-161-ミカ" = "うまくいったみたいだね？"
"3603-162-セイア" = "ああ。"
"3603-163-セイア" = "ただ――"
"3603-164-ミカ" = "あくまで一時しのぎだ、って言いたいんでしょ？"
"3603-165-セイア" = "……すこし、周りが見えるようになったじゃないか。"
"3603-166-ミカ" = "これだけで、きれいさっぱりストレスが無くなるわけないし。"
"3603-167-ミカ" = "それに、帰ったらまた仕事が山積みだもんね。"
"3603-168-ミカ" = "……でも、いいんじゃない？一時しのぎでも。"
"3603-169-ミカ" = "ナギちゃんが大変な時は、私たちが助けてあげればいいんだし。"
"3603-170-ミカ" = "今度は……思い切って長いお休みを取ってみたり？#nさっき言った、プライベートビーチとか！"
"3603-171-セイア" = "……。"
"3603-172-ミカ" = "だから毎日を頑張るの。"
"3603-173-ミカ" = "今日みたいな日のために。"
"3603-174-セイア" = "……。"
"3603-175-ミカ" = "なに？私の顔になにか付いてる？"
"3603-176-セイア" = "いいや、今日は驚かされてばかりだな。#n君の言葉に、完全に同意できる日がくるとはね。"
"3603-177-ミカ" = "それ、褒めてるってことでいいんだよね……！？"
"3603-181-セイア" = "……先にエンジンを温めておく。#n好きに戻ってきてくれ。"
"3603-190" = "おかしなノスタルジー"
