[translation]
"2901-1" = "そうして一堂に会して（１）"
"2901-7" = "百鬼夜行・第38旧校舎のとある教室"
"2901-8-ミチル" = "いんやぁー、やーっと撮影終わったよ～。"
"2901-9-ツクヨ" = "部長、お疲れ、様でした……！お水、どうぞ……！"
"2901-10-ミチル" = "おっ、ありがとー！"
"2901-11-ツクヨ" = "あと、汗を拭くためのタオルと、昨日作ったレモンのはちみつ漬けも、ありますので……。"
"2901-12-ミチル" = "あ、美味しそー。"
"2901-13-ミチル" = "ありがとね、いっただっきまーす！"
"2901-14-ミチル" = "……っていうかこれ、完全に「運動部のマネージャーさんが持ってくるセット」じゃん！目指せ全国大会！？"
"2901-15-ミチル" = "にしてもツクヨは本当に気が利くねぇ。"
"2901-17-ツクヨ" = "私には、その、これくらいしかできませんので……。"
"2901-18-ミチル" = "そんなことないよー。今日の撮影だって、ツクヨが手伝ってくれたから上手く撮れたんだよ？"
"2901-19-ミチル" = "ツクヨがいなかったら、例えばさっきのあの……"
"2901-20-ミチル" = "印を結んだ瞬間のピカッ！！ってきらめくシーンとか、あれはツクヨ無しじゃ絶対に撮れなかったよ！"
"2901-21-ミチル" = "レフ版の角度完璧だった！"
"2901-22-ツクヨ" = "そう、ですか……？私としては、それ以外にも、できればもっと、お役に立てればなと思ってて……。"
"2901-23-ツクヨ" = "あくまでも、撮影補助とかしか、できませんし……。"
"2901-24-ツクヨ" = "それに、あの時は……"
"2901-25-ミチル" = "「あの時」って、あぁー……"
"2901-27-ミチル" = "OK！ツクヨ、そこにいて！めっちゃ良い感じ！"
"2901-28-ツクヨ" = "はいっ、了解です……！レフ版の角度も、こんな感じで……？"
"2901-32-ツクヨ" = "えっ？あ、えっと……？"
"2901-36-ツクヨ" = "猫さんたちが、たくさん……？あの、そんなに集まられると、困ってしまうのですが……！"
"2901-37-ツクヨ" = "私、今はやらなくてはいけないことが、あぁ……！"
"2901-43-ツクヨ" = "そんなに集まられると、私、動けなく……！"
"2901-44-ツクヨ" = "私、待ち合わせの目印じゃ、ないんですよぉ……！？"
"2901-46-公園の子どもA" = "ねえねえあれ見て！猫ちゃんがいっぱい！"
"2901-47-公園の子どもB" = "すごい、猫の集会みたいだね？"
"2901-48-公園の子どもA" = "写真撮っとこー！"
"2901-55-ツクヨ" = "わわっ、えっと、撮らないで、ください……！？"
"2901-56-ツクヨ" = "撮影中とは、言いましたが、そうではなく……！"
"2901-58-ミチル" = "あはー、確かにあれはあれは災難だったねー。"
"2901-59-ツクヨ" = "結局、撮影がちゃんと始まるまで、30分もかかってしまい……。"
"2901-60-ツクヨ" = "うぅ……部長、あらためて、すみませんでした……。"
"2901-61-ツクヨ" = "私の、私のせいで～……。"
"2901-62-ミチル" = "いやいや、別にツクヨのせいじゃないって。"
"2901-63-ミチル" = "優しそうだし、もしかしたら猫たちも「この人はエサをくれるかも」って勘違いしたんじゃない？"
"2901-64-ツクヨ" = "でしたら、えっと……これからは、餌を用意した方が……？"
"2901-65-ミチル" = "いや、別にそこまでしなくて良いと思うけどね！？まあそういう真面目なところ、ツクヨっぽくて良いと思うけど！"
"2901-69-ミチル" = "まあとにかく、撮影も無事に終わったことだし。"
"2901-70-ミチル" = "今日はこれにておさらばするとしようではないか、ツクヨ殿！"
"2901-72-ツクヨ" = "え、え……？ツクヨ、「殿」……？"
"2901-73-ツクヨ" = "あ、なるほど、忍者っぽい感じですね……！"
"2901-74-ツクヨ" = "承知、しました……！"
"2901-75-ミチル" = "まあ過ぎたことは忘れて、私たちの明るい未来へと向かうとしよう！"
"2901-76-ミチル" = "取り急ぎは……さっき撮った動画の編集でもしよっか！"
"2901-77-ツクヨ" = "はいっ……！"
"2901-84" = "（約1時間後……）"
"2901-86-ミチル" = "ん～……"
"2901-87-ミチル" = "うーーーん……"
"2901-88-ミチル" = "うにゃああぁっ！"
"2901-89-ツクヨ" = "えっと、部長……？どうか、されましたか……？"
"2901-90-ミチル" = "今さら言うのもアレなんだけど……。"
"2901-91-ミチル" = "……やっぱり何か足りない。"
"2901-93-ツクヨ" = "えっと、足りない……というのは……？"
"2901-94-ミチル" = "撮影の直前までは、すっごい構図とカメラワーク、その先の仕上げまで見えてたんだけど……"
"2901-95-ミチル" = "それにツクヨの補助もあったし、完璧な感じになりそうだったんだけど……"
"2901-96-ミチル" = "もう少しこう、バババッ……みたいな。"
"2901-97-ミチル" = "こう、シュシュシュッ！みたいなカッコ良い絵になるはずだったんだけど……"
"2901-98-ミチル" = "なーんか上手く仕上がらない……足りない気がするなぁ……これはすぐアップロードしない方が良いかも。"
"2901-99-ツクヨ" = "あ……。"
"2901-100-ミチル" = "ま、たまにはこういうことあるよね。気にしない気にしない。"
"2901-101-ツクヨ" = "すみません……！私の、せいで……！"
"2901-102-ミチル" = "……え？"
"2901-103-ツクヨ" = "私が、至らないばかりに……！部長が、あんなに頑張ったのに、私は何も、できなくて……！"
"2901-104-ツクヨ" = "私が、忍者について、何も知らないせいで……。"
"2901-106-ミチル" = "いやいやいや！そうじゃないって！"
"2901-107-ミチル" = "ツクヨはまだ忍者初心者なんだし、そのせいじゃないって！それにツクヨは普段から、頑張って勉強もしてるでしょ？"
"2901-108-ミチル" = "ツクヨのせいじゃないし、そもそもツクヨはまだ成長期だよ。気にしないの、ね！"
"2901-109-ツクヨ" = "そう、ですか……？"
"2901-110-ミチル" = "そうそう。とはいえ、何というかこう……。"
"2901-111-ミチル" = "私たち二人だと、アイデアに限界があるのも確かかなあ。"
"2901-115-ミチル" = "そろそろ考えないといけないかも。"
"2901-116-ツクヨ" = "考えないと、というのは……？"
"2901-117-ミチル" = "新しい部員の勧誘。"
"2901-121-ツクヨ" = "新しい、部員……！？"
"2901-123-ミチル" = "そうそう、でも色々と難しいんだよねー。そもそも私たち、今は正式な部活じゃないし……。"
"2901-124-ミチル" = "そのせいで、部費も無ければ部室も無いし……。"
"2901-125-ミチル" = "その結果人目を避けて、こうして百鬼夜行の隅にある旧校舎でひっそり活動するしかないし……。"
"2901-126-ツクヨ" = "ですが……！"
"2901-127-ミチル" = "そう！だからといって、それが我々の道を妨げる理由にはならない！"
"2901-128-ミチル" = "もっと多くの人に、キヴォトス中のみんなに忍者のことを、そのカッコよさを理解してもらわないと！忍者がどれだけカッコよくて、最高の存在なのかを！"
"2901-129-ミチル" = "……っていう野望を抱いて、今まで「少女忍法帖ミチルっち」のチャンネルを数ヶ月運営してきたわけだけど。"
"2901-130-ミチル" = "視聴者数の伸びも頭打ちだし……。"
"2901-131-ミチル" = "最近アップした映像は悪質なコメントどころか、一つもコメント付かないし……。"
"2901-132-ミチル" = "……あ、"
"2901-133-ミチル" = "でも一個だけあったか。"
"2901-134-ミチル" = "「面白かったです、最高です……！」ってのは嬉しいけど、"
"2901-135-ミチル" = "この名前の「O・C」ってツクヨだよね！？"
"2901-136-ツクヨ" = "えっと、本当に、面白かったので……。"
"2901-137-ツクヨ" = "内容は、きちんと理解できてないかもですが……すごいと、思います！"
"2901-138-ツクヨ" = "その……すみません……。"
"2901-139-ミチル" = "いや、すっごく嬉しいんだけどね！？嬉しいんだけど、でもやっぱこのままじゃ……。"
"2901-140-ミチル" = "これを乗り越えるには、やっぱり新たな突破口……"
"2901-141-ミチル" = "すなわち、新入部員が必要なんだよ！"
"2901-142-ツクヨ" = "なるほど……！"
"2901-143-ツクヨ" = "でしたら、新しい方は……それこそ、本物の忍者さん……みたいな方が、来てくれると良いですね。えへへっ……。"
"2901-144-ミチル" = "いや、まあ本物の忍者なんて来ないだろうけど……っていうか実際には、いないとは思うけど……。"
"2901-146-ツクヨ" = "え、そうなん、ですか……！？すみません、あまり詳しくなくって……。"
"2901-147-ミチル" = "詳しいかどうかっていうか、うん……。"
"2901-148-ミチル" = "あ、でも忍者が偽物とか、そういう話じゃないよ！"
"2901-149-ミチル" = "この世に実在しないとしても、「忍者の精神」は本物！"
"2901-150-ミチル" = "その心意気を胸に、忍者としての生きざまを見習ってこそ、真の「忍者メイト」になれるものだから！"
"2901-155-ミチル" = "ただ、そういう「忍者メイト」と出会えるかどうかが問題なんだけど……。"
"2901-156-ミチル" = "忍者をバカにしてなくて、私たちの話にも共感してくれて……ゆくゆくは忍術研究部を一緒に盛り上げてくれそうな――"
"2901-157-ミチル" = "息がぴったり合って、お互いに色んな前向きな話ができる……何よりも、「可愛い子」！"
"2901-158-ミチル" = "そんな子、どこかにいないかな～？"
"2901-164-ツクヨ" = "ごめんなさい、"
"2901-165-ツクヨ" = "私、友達がいなくて……あと可愛くなくて……。"
"2901-166-ミチル" = "いやいやいや！？気にしなくて良いよ！あとツクヨは可愛いよ！"
"2901-167-ツクヨ" = "ありがとう、ございます……ですが確かに、正式な部活でも無いですし……。"
"2901-168-ツクヨ" = "どんな理由がある方なら、ここに来るんでしょうか……。"
"2901-169-ミチル" = "うっ、現実が痛い！辛い！事実だけど！"
"2901-170-ツクヨ" = "あ、すみません……！"
"2901-171-ミチル" = "大丈夫、ツクヨの言う通りだから……にしても問題だねぇ……。"
"2901-175-ミチル" = "……ま、こうしてダラダラしてても、誰かが来てくれるわけじゃないし。"
"2901-176-ミチル" = "……私たちは忍者について探究し、研究し、そしてその存在を広く知らしめんとする忍者メイト！"
"2901-177-ミチル" = "そろそろ単なるファンを超えて、忍者そのものになりつつあると言っても過言ではない！そんな私たちは、人呼んで……！"
"2901-182-ミチル" = "そう、「忍術研究部」！"
"2901-183-ミチル" = "私たち「忍術研究部」は、どんな逆境でも諦めない！"
"2901-184-ミチル" = "さあ、視聴者数を増やそう！あと部員も増やそう！ついでに正式な部活にもなっちゃおう！"
"2901-185-ミチル" = "『忍者ニンペロさん』でも、こう言ってた。"
"2901-186-ミチル" = "「忍者とはどんな窮地でも、決して諦めないもの」……って！"
"2901-188-ツクヨ" = "なるほど、了解です……！"
"2901-189-ミチル" = "よーし、じゃあ叫んで気合が入ったところで、明日の撮影のことでも考えようかな。えーっとツクヨは……"
"2901-193-ツクヨ" = "……いっ！？"
"2901-194-ミチル" = "……？"
"2901-195-ツクヨ" = "お客様、でしょうか……？"
"2901-196-ミチル" = "こ、こんなところにお客様ぁ……！？"
"2901-197-ツクヨ" = "ですが、それ以外には無いような……？"
"2901-198-ミチル" = "も、もしかして……百花繚乱調停委員会！？それとも、あの狡猾な陰陽部！？"
"2901-199-ミチル" = "私たちが勝手に旧校舎を使ってることがバレた！？"
"2901-200-ツクヨ" = "えぇっ……！？"
"2901-201-ミチル" = "ぐっ、いつかこんな日が来るとは思ってたけど……！"
"2901-202-ツクヨ" = "部長、どうしましょう……！？"
"2901-203-ミチル" = "大丈夫、慌てないで。心頭滅却すれば……"
"2901-204-ミチル" = "えーっと……何とかなる！！"
"2901-205-ツクヨ" = "それ、大丈夫ですか……！？"
"2901-211-？？？" = "失礼します……！"
"2901-218-ツクヨ" = "部長……っ！"
"2901-219-ミチル" = "わ、私たちは出ていかないからね！？たとえ追い出しても、忍者の精神は永遠に……！"
"2901-223-イズナ" = "……？"
"2901-224-ミチル" = "……あれ？陰陽部でも、百花繚乱でもない……？"
"2901-225-ツクヨ" = "えっと、どちら様でしょうか……？"
"2901-226-イズナ" = "あ、申し遅れました！イズナはイズナと申します！"
"2901-227-イズナ" = "忍術研究部、入部希望です！"
"2901-228-ミチル" = "……。"
"2901-232-ミチル" = "……え？"
