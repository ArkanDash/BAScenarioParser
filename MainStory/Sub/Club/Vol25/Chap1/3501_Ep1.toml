[translation]
"3501-1" = "雪見風呂"
"3501-4-？？？" = "……よっし、完成～！"
"3501-5-？？？" = "バッチリだね！これならみんなも喜ぶんじゃないかな？#nね、メグちゃん？"
"3501-6-メグ" = "おぉ～！！すっごーい！！#n今週掘ったヤツの中で一番いい温泉かも！！"
"3501-7-メグ" = "早くみんなにも見せてあげよーっと！！"
"3501-8-温泉部の部員A" = "ふぅ……にしても、ずっと掘ってたから疲れたなぁ。"
"3501-9-温泉部の部員B" = "奥まったとこにあるし……資材を運ぶのも一苦労だったね。"
"3501-10-温泉部の部員B" = "こんなんじゃ、いくら泉質が良くても人が来ないかも……。"
"3501-11-温泉部の部員A" = "うーん、たしかに……。"
"3501-12-温泉部の部員A" = "どうしよう……。"
"3501-17-メグ" = "……あれ、どうしたの？"
"3501-18-メグ" = "私たちが悩む必要ないんじゃない？#nそういうのはカスミ部長に聞けばいいよ！"
"3501-19-メグ" = "部長ならきっと、なんとかしてくれると思う！#nというか、もしかしたらもう既に手を打ってくれてるかもだし！"
"3501-24-温泉部の部員A" = "あははっ！たしかに！"
"3501-25-温泉部の部員B" = "カスミ部長なら、なんとかしてくれるよね。"
"3501-26-温泉部の部員B" = "そういや部長は？一緒じゃないの？"
"3501-27-メグ" = "部長も来てるよ～！ちょっと聞きに行ってくるね！"
"3501-28-メグ" = "みんなは先に休んでて！"
"3501-29-温泉部の部員B" = "え……メグちゃんが？"
"3501-30-温泉部の部員A" = "メグちゃんだって一緒に頑張ってくれたのに、私たちだけ先に休むのも……。"
"3501-31-メグ" = "ううん、気にしないで！まだ全然大丈夫だよ！元気いっぱい！"
"3501-32-メグ" = "みんな疲れてるでしょ？温泉でゆっくり疲れをとっていっちゃいなよ！"
"3501-33-メグ" = "後は任せて！"
"3501-34-メグ" = "いってきま～す！"
"3501-42-温泉部の部員A" = "ほんと、いつも頑張ってくれてるよねメグちゃん。"
"3501-43-温泉部の部員B" = "仕事も一番やってて……#nそういえば、メグちゃんって小さな温泉くらいなら一人でも掘れるらしいよ。"
"3501-44-温泉部の部員A" = "えっ、そうなの！？ほんとに……？"
"3501-45-温泉部の部員B" = "実際にこの目で見たわけじゃないんだけど、#n今日の作業ぶりを見てたら納得だよね……。"
"3501-46-温泉部の部員A" = "……た、たしかに。"
"3501-47-温泉部の部員A" = "メグちゃんってすごいんだね……。"
"3501-48-温泉部の部員B" = "だよね。元部長は伊達じゃないんだなぁ。"
"3501-49-温泉部の部員A" = "……え？"
"3501-50-温泉部の部員A" = "元部長？"
"3501-51-温泉部の部員B" = "あれ？……知らなかったの？"
"3501-52-温泉部の部員B" = "そういえば、君は新入りか。#nうちの部は、何度も解散したり再結成したりするもんね。"
"3501-53-温泉部の部員B" = "実はメグちゃん、温泉開発部の部長だったんだ。#nでも、カスミ部長が来たからその座を譲ったの。"
"3501-54-温泉部の部員A" = "なんで？"
"3501-55-温泉部の部員B" = "さぁ、理由まではわかんない。"
"3501-56-温泉部の部員B" = "まあでも普通に考えたら、カスミ部長がブレインだからじゃない？#nそれにメグちゃん自身、あんまり肩書きにこだわってないみたいだし。"
"3501-57-温泉部の部員A" = "……それが本当なら作業班長らしい話だね。"
"3501-58-温泉部の部員B" = "ははっ！たしかに……。"
"3501-60-温泉部の部員B" = "それもそうだね。"
"3501-64-メグ" = "部長～！カスミ部長～～！！"
"3501-65-カスミ" = "……ん？"
"3501-66-カスミ" = "おお、メグではないか。#nどうしたんだ、そんな大声を出して。"
"3501-67-メグ" = "部長ここにいた！！"
"3501-68-メグ" = "って、あれ？もう温泉入ってる！？#nいつもは最後なのに。"
"3501-69-カスミ" = "ははっ、まあ、大した理由じゃあないさ。"
"3501-70-カスミ" = "少しばかり昔を思い出してね。#n今日はなんだかやる気が沸いてきたんだ。"
"3501-71-カスミ" = "ところで、どうしたんだい？#nみんなと一緒にいたんじゃ……"
"3501-72-カスミ" = "なにかトラブルでも？"
"3501-73-メグ" = "トラブルってほどじゃないんだけど……。"
"3501-74-メグ" = "ここを掘ってくれたみんなが、#nこんな僻地じゃ人が来ないんじゃないのかって気にしてて……。"
"3501-75-メグ" = "私たちでさえ資材を運ぶのも一苦労だったのに、温泉目当ての人がここまで来れるのかな～って。"
"3501-76-カスミ" = "ハーハッハッハッハ！何かと思いきや、そんなことか。"
"3501-77-カスミ" = "心配ご無用！人なんぞ、シャトルバスで運べばいいだけだ。#n資材と違って自力で歩けるからな！"
"3501-78-カスミ" = "たしかに奥まったところにはあるが、道は舗装している。#nあとでバスを何台か手配すれば問題ないだろう。"
"3501-80-メグ" = "おおーー！さすが部長……！"
"3501-84-メグ" = "……あれ、うちってバスあるっけ？"
"3501-85-カスミ" = "ハーハッハッハッハ！"
"3501-86-カスミ" = "……無い！"
"3501-87-カスミ" = "だが、バスくらい適当にカイザーPMCかブラックマーケットの輸送車両をジャックすればいい。"
"3501-88-カスミ" = "つまり、すべて想定の範囲内ってことだ！"
"3501-89-カスミ" = "部員のみんなには、#n余計なことなど気にせず温泉でのんびりするといい、と伝えてくれ。"
"3501-90-カスミ" = "まだここの温泉は完成してないからな！温泉は建物があればいいってわけじゃあない。"
"3501-92-メグ" = "そっか！わかった～！みんなに伝えておくね！"
"3501-97-メグ" = "えーっと……「とりあえず寝て起きたら何とかなる」、ってことでいい？"
"3501-98-カスミ" = "ハーハッハッハッハ！ああ、その通りだ！賢いな！流石だぞ、メグ！"
"3501-99-メグ" = "えへへ……部長にそう褒められると、なんか照れちゃうね……。"
"3501-105-カスミ" = "ん？メグ？"
"3501-106-カスミ" = "意外だな。メグもこっちの湯が気に入ったのか？#n他に、もっと広くて熱々の温泉もあるのに。"
"3501-107-メグ" = "さっき部長が言っていた事を思い出して、ちょっとね！"
"3501-108-カスミ" = "うん……？"
"3501-109-カスミ" = "……あぁ、昔の話か？"
"3501-110-メグ" = "うん！部長、雪好きでしょ？#n雪見風呂ならなおさら！"
"3501-111-カスミ" = "ははっ――"
"3501-115-カスミ" = "……ん？"
"3501-116-カスミ" = "待て……そんなこと言ったか？"
"3501-117-メグ" = "ううん、言ってないよ。"
"3501-118-メグ" = "でも部長、初めて会った時、雪の中で寝てたじゃん？"
"3501-119-メグ" = "私が温泉を掘ってお湯に入れたら、つらそうな顔が気持ちよさそうになってたもん！"
"3501-120-カスミ" = "雪の中……つらそうな寝顔……"
"3501-121-カスミ" = "……あぁ。"
"3501-122-カスミ" = "……なるほど。"
"3501-123-カスミ" = "……そういうことか。"
"3501-124-カスミ" = "「雪の中で寝ていた」、ねぇ――本当に、メグらしい表現だな。"
"3501-125-メグ" = "……部長？"
"3501-126-カスミ" = "ははっ、いや。なんでもない。"
"3501-127-カスミ" = "しかし、それは初めて聞く話だな！#nあの時の私は、お湯の中で気持ちよさそうにしてたのか？"
"3501-128-メグ" = "うん！だから見た瞬間ピンと来たの！#n「あ、この人。雪が降る温泉が大好きなんだなぁ」って！"
"3501-129-カスミ" = "なるほど……。"
"3501-130-カスミ" = "……ふふっ。"
"3501-131-メグ" = "……部長？"
"3501-132-カスミ" = "ハーハッハッハッハ！！ああ！雪見風呂こそ温泉の[ruby=だいごみ]醍醐味[/ruby]ではないか！上は涼しく、下は温かい！"
"3501-133-カスミ" = "死に際の人間さえ生き返らせるほどの威力を持っている！"
"3501-134-カスミ" = "痛みをお湯で洗い流す！まさに至高そのものといえよう！"
"3501-135-メグ" = "うんうん！温泉最高！#n雪見風呂、最高！！"
"3501-136-メグ" = "みんなもいつか、この素晴らしさに気づいてほしいなぁ～！"
"3501-137-カスミ" = "まあまあ……じきに分かるはずだ。そう焦らずとも良い。"
"3501-138-カスミ" = "今日はメグもゆっくり休んでおけ。明日もやることが山積みだからな！"
"3501-139-メグ" = "うん！あ、そうだ！みんなにさっきの件言ってこないと！"
"3501-140-メグ" = "じゃあ私、先に行くね！"
"3501-141-カスミ" = "ああ。滑りやすいから気をつけるんだぞ～！"
"3501-142-メグ" = "はーい！！"
"3501-147-カスミ" = "温泉、なぁ……。"
"3501-151-カスミ" = "ふふ……"
"3501-153-カスミ" = "……そりゃあ、好きになるに決まってるだろう？"
"3501-154" = "雪見風呂"
