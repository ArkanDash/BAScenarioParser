[translation]
"70014040-1" = "薬屋の彷徨い（４）"
"70014040-2-老人" = "保護費……？普段から何もしとらんだろうが。"
"70014040-3-ブラックマーケットギャングA" = "何も起きないようにするのがパトロールだからな。#n強盗に入られても知らねぇぞ？"
"70014040-4-老人" = "ならそうすればよかろう。#n強盗に取られるか、あんたらに取られるか。違いはそれだけよ。"
"70014040-5-ブラックマーケットギャングB" = "ったく、話が通じねぇなぁ。#nあれか？カイとかいうのを置いてるから強気になってんのか？"
"70014040-6-老人" = "あの子は関係ない！"
"70014040-7-ブラックマーケットギャングC" = "良い機会だから教えてやるよ。あの[ruby=しんたに]申谷[/ruby]カイってのはな――"
"70014040-8-ブラックマーケットギャングA" = "手の付けられない問題児で、七囚人って呼ばれるほどの極悪人なんだよ！"
"70014040-9-ブラックマーケットギャングA" = "山海経とかいう学園を引っ掻き回してたらしいぜ？"
"70014040-10-ブラックマーケットギャングC" = "しかもブラックマーケットの住人もわんさか雇っていたらしいし？"
"70014040-11-ブラックマーケットギャングA" = "あいつは、お前が思ってる以上にヤベェんだ！"
"70014040-12-老人" = "……！"
"70014040-13-ブラックマーケットギャングB" = "ああ、そうそう。"
"70014040-14-ブラックマーケットギャングB" = "あいつ、やろうと思えば婆さんの病気だって治せるらしいな！"
"70014040-15-老人" = "……。"
"70014040-16-カイ" = "ほう……物知りだな。"
"70014040-17-ブラックマーケットギャングC" = "腕だけは良いみたいなんだよな。"
"70014040-18-ブラックマーケットギャングC" = "じゃあ、なんで婆さんをほったらかしてるんだろうな？"
"70014040-19-ブラックマーケットギャングA" = "それはな……婆さんの家を乗っ取るためさ！"
"70014040-20-ブラックマーケットギャングB" = "ここじゃ隠し事なんてできやしねぇ。"
"70014040-21-ブラックマーケットギャングB" = "いずれ知れ渡るのがブラックマーケットなんだよ！"
"70014040-22-ブラックマーケットギャングC" = "あと……カイには借りがあってな。"
"70014040-27-ブラックマーケットギャングC" = "わりぃが、婆さんが代わりになってくれよな！"
"70014040-31-老人" = "……！！！"
"70014040-33" = "[ns] \"止めないと！\""
"70014040-34-カイ" = "……。"
"70014040-35" = "[s] \"カイ……？\""
"70014040-40-老人" = "……ふんっ、若造が。"
"70014040-41-老人" = "そんなこと、とうに知っておったわい。"
"70014040-45-ブラックマーケットギャングA" = "なっ、なにぃ！？！？"
"70014040-46-カイ" = "……？"
"70014040-47-老人" = "……伊達に長い間、ここに住んどらん。"
"70014040-48-老人" = "騙し騙される連中をどれほど見てきたか。あんたらには分かるまいよ。"
"70014040-49-老人" = "言われんでも、最初から気づいておったわ。"
"70014040-50-ブラックマーケットギャングB" = "じ、じゃあ、どうして……？"
"70014040-51-老人" = "家を譲ろうとしたことか？"
"70014040-52-老人" = "それでもう十分なんだよ。"
"70014040-53-老人" = "カイがどんな子であろうと、外で何をしていようと、ワシには関係ない。"
"70014040-54-老人" = "あの子は確かにここに居た。短い間でもワシの家で暮らしていた。#nそれで良い。これ以上、何を求める。"
"70014040-55-老人" = "独りより、2人のほうが良い。そして……空よりは、独りのほうが良い。#n家も、そう思っているに違いない。"
"70014040-56-老人" = "だから――掃除の邪魔をするでない！"
"70014040-57-老人" = "あの子に、この家を引き継がせねばならんのじゃ！"
"70014040-61-ブラックマーケットギャングC" = "だっ、だからってなぁ！あたしらにゃそんな事情関係ねぇ！"
"70014040-62-ブラックマーケットギャングA" = "講釈垂れんのもここまでだ！"
"70014040-63-ブラックマーケットギャングB" = "事を荒立てたのは婆さんだからな！"
"70014040-65-ブラックマーケットギャングC" = "お前ら！出てこい！"
"70014040-75-カイ" = "……腹立たしい。"
"70014040-76" = "[s] \"カイ……？\""
"70014040-77-カイ" = "気に入らないねぇ。ああ、実に気に入らない。"
"70014040-78-カイ" = "……。"
"70014040-79-カイ" = "家を引き継がせるだなんだと言う老人も。"
"70014040-80-カイ" = "阿保らしく騒ぐ連中も。何もかも。"
"70014040-81-カイ" = "先生、邪魔立てはしてくれるな。これは警告だ。"
"70014040-85-カイ" = "……心配せずとも、殺しはしない。"
"70014040-86-カイ" = "殺し[ruby=・]は[/ruby]しないさ。"
"70014040-92-？？？" = "お、お前は！？#nカイだ！申谷カイが――！！"
"70014040-93-？？？" = "い、息がっ――！#n苦、しい……！"
"70014040-94-？？？" = "ふっ、はぁっ！？ぜ、全身が、かゆい――！うあああああ――っ！！！"
"70014040-99-？？？" = "や、やめろ……これ以上は……堪えられ――！！"
"70014040-100-？？？" = "幻覚……？#nく、来るな！近づくな――っ！！！"
"70014040-105-？？？" = "雨だ……！ああ！雨だ……！"
"70014040-106-？？？" = "か、身体が溶けるような……！足が……！腕が……！髪が……！！！"
"70014040-107-？？？" = "ぐあああああああああああああああっ！！！！！"
"70014040-111" = "[ns] \"カイ。今のは……？\""
"70014040-112-カイ" = "見ての通りさ。"
"70014040-113-カイ" = "……。"
"70014040-114-カイ" = "全員無事だろう？#n……見た目は。"
"70014040-115" = "[s] \"それは、そうだけど……！\""
"70014040-116-カイ" = "心配するな。"
"70014040-117-カイ" = "私は取り返しのつかないことはしない。#n……よほどのことがない限り。"
"70014040-118-老人" = "カイ……？"
"70014040-119-カイ" = "……！"
"70014040-120-老人" = "……。"
"70014040-121-老人" = "帰ろう。もう日が暮れておる。"
"70014040-125-カイ" = "……ああ。"
"70014040-131-老人" = "怪我はないかい？"
"70014040-132-カイ" = "……それはこちらの台詞だと思うが。"
"70014040-133-老人" = "ほっほっほっ……元気も元気。これでも、此処の住民なのでな。"
"70014040-135" = "（カイと老人の会話は、自然に途切れることなく続いた）"
"70014040-136" = "（2人の話を、黙って聞いていた）"
"70014040-138-老人" = "もうこんな時間か……。"
"70014040-139-老人" = "先に休ませてもらうとしよう。"
"70014040-140-老人" = "2人も、あまり遅くならんようにな。"
"70014040-141-カイ" = "……そうする。"
"70014040-145-투명" = "（老人は前よりも少し軽やかに、足を引きずりながら部屋に戻った）"
"70014040-146-투명" = "（……まもなく、寝息が聞こえてきた）"
"70014040-147-カイ" = "……。"
"70014040-148" = "[s] \"強い方だね。\""
"70014040-149-カイ" = "……まあ、そうだな。"
"70014040-150" = "[s] \"大丈夫？\""
"70014040-151-カイ" = "……変なことを聞くねぇ。"
"70014040-152-カイ" = "その台詞は、先ほどの輩どもにかけるべきじゃないかい？"
"70014040-153" = "[s] \"でも、複雑そうな顔をしてるから。\""
"70014040-154-カイ" = "……！"
"70014040-155-カイ" = "……。"
"70014040-159-カイ" = "どう言ったものか……。"
"70014040-160-カイ" = "……馴染みがなくてな。"
"70014040-161" = "[s] \"ご老人を助けたこと？\""
"70014040-162-カイ" = "……！"
"70014040-163-カイ" = "……こんなことで先生を騙そうとしても無駄か。"
"70014040-164-カイ" = "だが「良い事」などという判断軸で行動したわけではない。"
"70014040-165-カイ" = "心の赴くままに行動し、その結果がこうなっただけだ。"
"70014040-166-カイ" = "……今日1日、私がそうしたように。"
"70014040-167" = "[s] \"それでいいんだよ。\""
"70014040-168-カイ" = "なに……？"
"70014040-169" = "[s] \"善人じゃなくたって、良いことをしてもいいんだよ。\""
"70014040-170-カイ" = "理解に苦しむな。"
"70014040-171" = "[s1] \"なんとなくも大事だよ。\"\n[s2] \"結果良ければすべて良し、ってね。\""
"70014040-174-カイ" = "いいのか？そんな考えで。"
"70014040-175" = "[s] \"少なくとも、今はね。\""
"70014040-176-カイ" = "……！"
