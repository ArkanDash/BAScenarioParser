[translation]
"70014050-1" = "薬屋の彷徨い（５）"
"70014050-2-カイ" = "……。"
"70014050-3-カイ" = "教育者たるもの、生徒の言うことは何でも聞いてくれるんだろう？"
"70014050-4" = "[s] \"何でも……じゃないけど、だいたいは。\""
"70014050-5-カイ" = "それでいい。"
"70014050-6-カイ" = "私と結んだ約束を、果たしてくれ。"
"70014050-7" = "[s] \"今？\""
"70014050-8-カイ" = "ああ。"
"70014050-9-カイ" = "素直に答えるだけで構わない。"
"70014050-10-カイ" = "――先生にとって、私はどんな生徒だ？"
"70014050-11" = "[s] \"とても……とても手ごわい問題児だね。\""
"70014050-12-カイ" = "……即答だ。"
"70014050-13-カイ" = "うん？ああ、質問の理由か？"
"70014050-14-カイ" = "私は他者のことなど意に介さない。#n故に、他者が私をどう捉えようと気にしなかった。"
"70014050-15-カイ" = "……少なくとも、最近までは。"
"70014050-16-カイ" = "だが、今は……。"
"70014050-17-カイ" = "……。"
"70014050-18-カイ" = "不確かなことは悪だ。"
"70014050-19-カイ" = "不完全なもの、削られていくもの……ひいては日々壊れていくものも同様だ。"
"70014050-20-カイ" = "形を成したものが歪むほど、不確実性は増えていく。"
"70014050-21-カイ" = "だからこそ、[ruby=我々]人間[/ruby]はその先にある……#n超越を目指して進んでいくべきだ。"
"70014050-22" = "[s] \"仙丹の話？\""
"70014050-23-カイ" = "そうだ。それ以外、私の気を引くものはなかった。"
"70014050-24-カイ" = "神仙とは、限界を超えし者。そして、限界の上に立つ者を意味する。"
"70014050-25-カイ" = "考えたことはあるか？"
"70014050-27-カイ" = "地上を生きる人間が、すべてを克服できるとして。#nそれなら我々は、どこまで辿り着くことができるのか。"
"70014050-29-カイ" = "その問いが、この行いに身を投じた根本的な理由でもある。"
"70014050-30-カイ" = "私は、人間に対する探究を続けてきたつもりだ。"
"70014050-31-カイ" = "他人に関することは、ある程度は把握している自負があった。"
"70014050-32-カイ" = "……だが、ある時から……「自分」が分からなくなってしまった。"
"70014050-33" = "[s] \"それは……いつのこと？\""
"70014050-34-カイ" = "厳密に言うならば――"
"70014050-38" = "[log]君が、君自身を諦めないでほしい。[/log]"
"70014050-42-カイ" = "あの瞬間だ。"
"70014050-43" = "[s] \"……。\""
"70014050-44-カイ" = "先生。あの言葉の真意を聞かせてほしい。"
"70014050-45-カイ" = "何を込めて、私に投げかけたんだ？"
"70014050-46" = "[s] \"カイ。\""
"70014050-47-カイ" = "……？"
"70014050-48" = "[s] \"私なりに、信念があるんだ。\""
"70014050-49-カイ" = "ほう？"
"70014050-50" = "[s1] \"私はいつだって[ruby=君たち]生徒[/ruby]の力になりたい。\"\n[s2] \"でもそれは、私ひとりじゃできないことなんだ。\""
"70014050-54-カイ" = "それは……どういう意味だ？"
"70014050-55-カイ" = "ほう……すべての主体は生徒である……と？"
"70014050-59-カイ" = "……面白いことを言うね。"
"70014050-60-カイ" = "生徒がどうであれ、最後まで生徒を諦めないのが「先生」のあるべき姿では？"
"70014050-61-カイ" = "それが所謂――教育者としての理想、というものじゃないのかい？"
"70014050-62" = "[s] \"そうだね。でも、理想論だ。\""
"70014050-66" = "[ns3] \"拒否することを決めてしまった生徒には……。\"\n[ns4] \"私ができることは、何もない。\""
"70014050-70-カイ" = "……そうか。"
"70014050-71-カイ" = "どんな薬剤を用いても反応を示さない、壊れた身体のように……か。"
"70014050-72" = "[s5] \"だけど私には、君を導く義務がある。\"\n[s6] \"だから、チャンスを与えてほしいんだ。\""
"70014050-77" = "[ns] \"私が、君に教えるチャンスをね。\""
"70014050-78-カイ" = "……。"
"70014050-79-カイ" = "「悔毒之歎」という言葉を知っているか？"
"70014050-80-カイ" = "もはや取り返しのつかないことを、ずっと深く悔やんでいる、という意だ。"
"70014050-81-カイ" = "温い言葉だよ。#n「人間の本性は生まれながらにして善である」と同じように。"
"70014050-82-カイ" = "生半可な気持ちでは、山の麓さえも登れない。"
"70014050-83-カイ" = "……今まではずっと、そう思っていた。#nだが……。"
"70014050-87-カイ" = "……やはり、あの時のことが問題だったようだ。"
"70014050-88-カイ" = "大したことではないと思っていたが……。"
"70014050-89-カイ" = "私の内に、[ruby=ひび]罅[/ruby]が入ってしまったに違いない。"
"70014050-90" = "[s] \"自分を物みたいに言うんだね……？\""
"70014050-91-カイ" = "そもそも、人間と物に大差はない。"
"70014050-92-カイ" = "生の始まりは化学反応に過ぎず、人間の存在は記憶の情報に潜む影だ。"
"70014050-93-カイ" = "精神は、神経細胞のスパーク。魂など在りはしない。"
"70014050-94-カイ" = "だからこそ、流れをねじ曲げ、制御することも可能となる。#nその過程の1つが薬学だ。"
"70014050-95-カイ" = "私にとって、人間は物に過ぎない。"
"70014050-96-カイ" = "……。"
"70014050-97-カイ" = "苦痛や悲しみも、よく分からない概念だ。理解はできても、心には響かない。"
"70014050-98-カイ" = "誰かのために涙を流すと言うが、#nそこに「身体が涙を流している」以上の意味はない。"
"70014050-99-カイ" = "人と人の間には、根本的に届かない距離が確かに存在する。"
"70014050-100-カイ" = "そして私は、その距離感を誰よりも感じている……と思っていた。"
"70014050-101" = "[s] \"どうして……そう思うようになったの？\""
"70014050-102-カイ" = "……さあ。"
"70014050-106-カイ" = "それを知れたなら、少しは[ruby=・]普[/ruby][ruby=・]通[/ruby][ruby=・]の[/ruby]暮らしを享受できたのかもしれないね。"
"70014050-107-カイ" = "あくまで自分を分析してみた限りでは……おそらく、生まれながらにこうなんだ。"
"70014050-108-カイ" = "いや、こう作られていた。"
"70014050-109" = "[s] \"作られた……？\""
"70014050-110-カイ" = "生物学的な例えだよ。#nすべての生命は、細胞を素材にした創造物だ。"
"70014050-112-カイ" = "その中で、始まり方に個体差がある。"
"70014050-113-カイ" = "であれば他人を理解できない者もいるだろう。"
"70014050-114-カイ" = "他人の思考、感情、行動原理……それらを直感的に感じ取ることができず、#n一つひとつを理論的に分析せねばならないような者が。"
"70014050-116-カイ" = "とりわけ私は顕著なほうだったのかもしれないがね。"
"70014050-117-カイ" = "とかく、そこには理由などない。そういう人間だっただけだ。"
"70014050-118-カイ" = "唯一言えるとすれば、それがより強くなるよう育てられたのは一因だろうか。#nとはいえ、それは過程だ。始まりじゃない。"
"70014050-119-カイ" = "私は「情けは人の為ならず」という概念が理解できない。"
"70014050-120-カイ" = "その意味は理解できても、なぜその行動を選ぶのかが分からない。"
"70014050-121-カイ" = "なにせ時間がかかりすぎる。あまりに非効率だ。"
"70014050-122" = "[s] \"だから力で屈服させる方法を取ってきたの？\""
"70014050-123-カイ" = "そうだ。"
"70014050-124-カイ" = "シンプルで、手っ取り早い。"
"70014050-125-カイ" = "……と、思っていたんだけどね。#n今は……何かを逃した気がするが、それの正体が分からない。"
"70014050-126-カイ" = "ここまで「分からない」感覚は久しぶりだ。#nだから――"
"70014050-127-カイ" = "――これの答えを私に出させること。#nそれを、先生の果たすべき「約束」にしようかね。"
"70014050-128" = "[s] \"じゃあ、勉強してみない？\""
"70014050-132-カイ" = "勉強？"
