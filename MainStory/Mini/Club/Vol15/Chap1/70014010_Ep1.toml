[translation]
"70014010-1" = "薬屋の彷徨い（１）"
"70014010-2" = "（ブラックマーケットは初めてじゃないけど……）"
"70014010-3" = "（こんな奥まで来たことはなかったな）"
"70014010-12" = "（1人はまずかったかな……）"
"70014010-13" = "（何かあったら、みんなに怒られるかも――）"
"70014010-18" = "[ns] \"！？\""
"70014010-23-ブラックマーケットギャングA" = "いたぞ！"
"70014010-25-ブラックマーケットギャングB" = "カモがいるって話は本当だったんだな！"
"70014010-26-ブラックマーケットギャングC" = "ここに慣れてないのが丸わかり。"
"70014010-27-ブラックマーケットギャングA" = "はっはぁ！攫ってくれって言ってるようなもんだぜ？"
"70014010-28-ブラックマーケットギャングB" = "つ、連れて行けばいいんだよな？"
"70014010-32-ブラックマーケットギャングB" = "身代金で大儲けだ！"
"70014010-33-ブラックマーケットギャングA" = "余所者は金払いが良いからありがてぇよな！"
"70014010-34-ブラックマーケットギャングC" = "大人しくしてろ。ケガしたかないだろ？"
"70014010-36" = "[ns1] （準備してきたつもりだったけど……）\n[ns2] （無事に帰れても、みっちりお説教コースかなぁ……）"
"70014010-44-ブラックマーケットギャングA" = "とりま連れてきたけど、どうする？"
"70014010-45-ブラックマーケットギャングB" = "まずは……あれだ！連絡先！"
"70014010-47-ブラックマーケットギャングC" = "ああ。取引できそうなやつを探して……その後は……。"
"70014010-48-ブラックマーケットギャングC" = "って、あれ……？"
"70014010-49-ブラックマーケットギャングA" = "どうした？"
"70014010-50-ブラックマーケットギャングC" = "いや、なんでも……。"
"70014010-51-ブラックマーケットギャングB" = "んだよ？"
"70014010-57-ブラックマーケットギャングC" = "（こいつ、シャーレの先生に似てないか……？）"
"70014010-58-ブラックマーケットギャングC" = "（いや、まさかな。先生がこんなところに来るはずがない）"
"70014010-61-ブラックマーケットギャングC" = "とにかく、しっかり稼がせてもらうとしよう。"
"70014010-62-ブラックマーケットギャングA" = "ったりめぇだ！笑いが止まらねぇぜ！"
"70014010-63-？？？" = "耳障りだ。"
"70014010-76-カイ" = "弱い犬ほどよく吠えるな。"
"70014010-77" = "[ns] \"……？\""
"70014010-78-カイ" = "……？"
"70014010-79" = "[s] \"カイ？\""
"70014010-80-カイ" = "先生！？"
"70014010-81" = "[s] \"えっ、なんで！？\""
"70014010-82-カイ" = "それはこちらの台詞だよ。"
"70014010-87-カイ" = "……と、言っては見たものの。"
"70014010-88-カイ" = "まあ、なんだっていいさ。さしたる興味もない。"
"70014010-92-カイ" = "……だが、先生はそうでもないようだねぇ？"
"70014010-93-カイ" = "ククッ……あの日、確かに私は矯正局に送られた。"
"70014010-94-カイ" = "他でもない、先生の手によって。"
"70014010-95-カイ" = "巡ってきたこの機会……復讐には絶好のチャンスかな？"
"70014010-96" = "[s] \"……！\""
"70014010-97-カイ" = "ハハハッ！良い顔をするじゃないか。"
"70014010-98-カイ" = "なに、取って食いやしないさ。"
"70014010-99-투명" = "（今はなるべく、カイの神経を逆なでしないようにしよう……）"
"70014010-101-カイ" = "話を戻そう。#n私は矯正局の車両で移送されていた。"
"70014010-102-カイ" = "だが、連れていかれたのは別の場所でね。"
"70014010-112-カイ" = "本物だったのは車両だけ、ということさ。"
"70014010-113-カイ" = "これで、彼女は貸しを作ったつもりなのだろう。"
"70014010-114-カイ" = "まあ、「約束」は大事だからな。"
"70014010-116" = "[ns] \"彼女……？\""
"70014010-117-カイ" = "気になるかい？#nしかしなぁ、勝手に話すことはできないんだよ。"
"70014010-118-カイ" = "残念ながら、それも約束でね。"
"70014010-119-カイ" = "とはいえ絶対ではない。物事は絶えず流動的だ。"
"70014010-120-カイ" = "より良い約束を、先生が結んだなら――あるいは。"
"70014010-121-カイ" = "配合の比率によって、全く異なる結果が出る。新薬の開発のようにね。"
"70014010-122" = "[s] \"じゃあ質問を変えるけど……ずっとここにいたの？\""
"70014010-123-カイ" = "いいや？"
"70014010-124-カイ" = "身分を隠すには都合がいいが……材料やら試薬の入手が困難でね。"
"70014010-125-カイ" = "しばらくは、偽名を使って放浪医の真似事をしていたよ。"
"70014010-126-カイ" = "百鬼夜行で世話になったこともあったかな。"
"70014010-127" = "[s] \"……その時は問題を起こさなかったんだね。\""
"70014010-128-カイ" = "結果論だよ。"
"70014010-132-カイ" = "……着いたぞ。#nここが今の「住処」だ。"
"70014010-134" = "（カイの後に続いて、古くて暗い階段を上った）"
"70014010-142" = "[ns] \"……。\""
"70014010-144" = "[ns] \"ここがカイの家なんだね。\""
"70014010-145-カイ" = "正確には居候だ。"
"70014010-147" = "（意味を聞こうとした時――）"
"70014010-148" = "（不自由そうな足取りで老人が姿を見せた）"
"70014010-155-老人" = "ああ……おかえり。"
"70014010-156-老人" = "ゴホゴホッ……。"
"70014010-157-老人" = "おや、そちらの方は？"
"70014010-158-カイ" = "客だ。"
"70014010-159-老人" = "おや、珍しい。"
"70014010-160-老人" = "それだけ、信頼している方なんだろうねぇ。"
"70014010-161-老人" = "ゴホゴホッ……！"
"70014010-162-老人" = "見苦しくてすまないねぇ……。#n立つのがやっとで……どうにも芳しくない。"
"70014010-163-カイ" = "部屋に戻ったらどうだ？"
"70014010-164-老人" = "そうさせてもらうよ……。"
"70014010-165-老人" = "お茶も出せぬが……。"
"70014010-166-老人" = "……どうか、くつろいでおくれ。"
"70014010-172-투명" = "（老人は足を引きずりながら部屋へ戻った）"
"70014010-173-투명" = "（まもなく、寝息が聞こえてきた）"
"70014010-177" = "[ns] \"今の方は？\""
"70014010-178-カイ" = "ここの家主だ。"
"70014010-179-カイ" = "関節リウマチのようなものでね。#n他に肺と気管支も患っている。"
"70014010-180-カイ" = "あれじゃ、外出すらままならない。"
"70014010-181-カイ" = "とはいえ改善はしてるんだ。前はもっと酷かった。"
"70014010-182-カイ" = "多少はマシになるよう、私が維持させている。"
"70014010-186-カイ" = "その様子……さては、病状を理解していないな？"
"70014010-187-カイ" = "リウマチとは、自己免疫疾患だ。"
"70014010-188-カイ" = "体内の免疫系が、外部の抗原でなく内部の正常な細胞を攻撃することで生じる。"
"70014010-189-カイ" = "つまり、自分で自分を破壊するわけだ。"
"70014010-190-カイ" = "関節は初期から症状が見られる部位でね。"
"70014010-191-カイ" = "といっても、脊椎を除けばどこだろうと安心はできない。#n運が悪ければ、リンパ腫にまで発展する可能性もある。"
"70014010-192" = "[s] \"そうなの！？\""
"70014010-193-カイ" = "あくまで最悪のケースだ。"
"70014010-194" = "[s3] \"驚かせないでよ……。\"\n[s4] \"それで、完治させられるの？\""
"70014010-197-カイ" = "[ruby=・]一[/ruby][ruby=・]般[/ruby][ruby=・]的[/ruby][ruby=・]に[/ruby][ruby=・]は[/ruby]無理だ。"
"70014010-198" = "[s] \"それって……。\""
"70014010-199-カイ" = "通常は、進行を抑える治療が中心だ。"
"70014010-200-カイ" = "場合によっては、無理やり免疫の働きを調整することもある。"
"70014010-201-カイ" = "要は、その場しのぎしか手段がないのさ。"
"70014010-202-カイ" = "そう、[ruby=・]一[/ruby][ruby=・]般[/ruby][ruby=・]的[/ruby][ruby=・]に[/ruby][ruby=・]は[/ruby]な。"
"70014010-203-カイ" = "ククッ……。言わんとすることは分かるよ。"
"70014010-204-カイ" = "[ruby=・]私[/ruby][ruby=・]な[/ruby][ruby=・]ら[/ruby]できるのか？"
"70014010-205-カイ" = "――ああ、もちろん。"
"70014010-206" = "[s] \"それなら、なんで治してあげないの？\""
"70014010-207-カイ" = "ちょうど、段階を進めようと考えていたところさ。"
"70014010-208-カイ" = "数日前、あの老人から約束を取り付けた。"
"70014010-212-カイ" = "家を譲る。"
"70014010-213-カイ" = "そういう約束をね。"
"70014010-214-カイ" = "私は考えた。"
"70014010-215-カイ" = "家の所有権さえ手に入れば、この関係を終わらせてもいいのではないか、と。"
"70014010-216" = "[s] \"じゃあ、なんで維持はしてあげたの？\""
"70014010-217-カイ" = "健康な時と、病に侵されている時。頭が回るのはどちらだろうねぇ？"
"70014010-218-カイ" = "損得勘定さ。"
"70014010-219-カイ" = "家を手にするためのね。"
"70014010-220" = "[s] \"……！！！\""
"70014010-221-カイ" = "詰まる所、もうすぐ用済みなんだよ。"
"70014010-222-カイ" = "軽蔑したいなら好きにするといい。"
"70014010-223-カイ" = "[ruby=しんたに]申谷[/ruby]カイとはこういう人間だ。隠すつもりもない。"
"70014010-224-カイ" = "あえて喧伝するものでもないがね。"
"70014010-225" = "[s] \"でも、治してあげられるんでしょ？\""
"70014010-226-カイ" = "ああ。"
"70014010-227-カイ" = "できるか否かであれば……いくらでも。"
"70014010-231-カイ" = "うむ？ならそうしてほしい？"
