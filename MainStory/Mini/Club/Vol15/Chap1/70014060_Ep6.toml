[translation]
"70014060-1" = "薬屋の彷徨い（６）"
"70014060-2-カイ" = "勉強？"
"70014060-3" = "[s] \"うん。カイは頭がいいからね。\""
"70014060-7" = "[ns1] \"人々は何を頼りに生きるのか。\"\n[ns2] \"人々の生きる基盤には何があるのか。\""
"70014060-10" = "[ns3] \"数えきれないほどあるんだ。\"\n[ns4] \"教科書とか、論文とか。\"\n[ns5] \"これまでに人類が積み重ねてきたものがね。\""
"70014060-14-カイ" = "一般的なやり方を勉強してみろ、と？今さら？"
"70014060-15" = "[s] \"そうだよ。\""
"70014060-16-カイ" = "……。"
"70014060-20-カイ" = "すでに理解はしている。だが、そのやり方は……。"
"70014060-21-カイ" = "呼吸法を一つひとつ意識して必死に続けていくようなことだ。"
"70014060-22-カイ" = "他人には、生まれながらにして与えられたごく自然な呼吸法のはずなのに。"
"70014060-23-カイ" = "それが私にとっては自然じゃない。#nそれでも、試せと言うのか？"
"70014060-24" = "[s] \"うん。\""
"70014060-25-カイ" = "私がそれを拒んだら？"
"70014060-26-カイ" = "私にとって、その過程は苦痛でしかない。"
"70014060-27-カイ" = "誰であれ、苦痛を拒む権利はあるだろう？"
"70014060-28" = "[s6] \"そうだね。強制はできない。\"\n[s7] \"でも、一度はやってみてほしいんだ。\""
"70014060-31-カイ" = "どうして……？"
"70014060-32" = "[s] \"同じやり方なのに違う結果を望むのは、よくないでしょ？\""
"70014060-33-カイ" = "ほう。"
"70014060-34-カイ" = "ククッ……これは一本取られたな。"
"70014060-35-カイ" = "1つ、明言しておこう。"
"70014060-36-カイ" = "私は矯正されていないし、このあとも矯正されることはない。"
"70014060-37" = "[s] \"まあ……そう簡単にいくとは思ってないよ。\""
"70014060-41" = "[ns] \"でも、そういう練習を一度はしてみてほしい。\""
"70014060-42-カイ" = "……。"
"70014060-43-カイ" = "そうか。"
"70014060-50-老人" = "おや、行くのかね？"
"70014060-51" = "[s8] \"はい。お世話になりました。\"\n[s9] \"どうか、ご自愛ください。\""
"70014060-54-老人" = "ほっほっほっ……心配は無用さ。"
"70014060-55-老人" = "カイがいてくれるからのう。"
"70014060-56-カイ" = "……当分はやることもないしな。"
"70014060-57-カイ" = "しかし本当にいいのか？#n私はこの家を乗っ取ろうとしたのに？"
"70014060-58-老人" = "またその話かい？#n別に、今すぐ譲ってやってもいいのさ。"
"70014060-59-老人" = "今まで何とか生き延びてきたんだ。今更どこに行こうが、行き倒れになることもあるまいよ。"
"70014060-63-カイ" = "…………興醒めだ。"
"70014060-64-老人" = "そうか、ほっほっほっ。"
"70014060-66" = "（カイと老人に別れを告げてブラックマーケットを出た）"
"70014060-67" = "（帰り道、カイの言葉を反芻した）"
"70014060-68" = "（そして、心配になるもう1人の生徒を思いながら――）"
"70014060-69" = "（重く感じる足取りで、シャーレに戻った）"
"70014060-73-カイ" = "口に合うか？"
"70014060-74-老人" = "ほっほっ……料理もできたのか。"
"70014060-75-カイ" = "病人食くらいだ。味が薄いと避けられるがな。"
"70014060-76-老人" = "むしろ、胃に優しくてありがたいくらいだよ。"
"70014060-77-老人" = "しかしのう……どうして急にこんなことまで？"
"70014060-78-カイ" = "まあ、大したことじゃない。ただ……。"
"70014060-82-カイ" = "……。"
"70014060-83-カイ" = "気分転換に、呼吸法の練習でもしてみようかと思ってね。"
"70014060-84-カイ" = "ちょうど、良い「練習相手」もいることだから。"
"70014060-86" = "薬屋の彷徨い"
