[translation]
"70006010-1" = "美食とクッキー、そして救護（１）"
"70006010-2-ジュンコ" = "あー、お腹空いた……。今日のお昼は何にするの？"
"70006010-3-ハルナ" = "あら、もう良い時間ですわね。"
"70006010-7-イズミ" = "私はみんなと食べられるなら何でもいいよ！"
"70006010-8-アカリ" = "それなら、食べ放題でしょうか。"
"70006010-10-ジュンコ" = "私、金欠なんだよね……最近の食べ放題高くない？"
"70006010-11-ハルナ" = "低価格でありながらボリューミーで、満足のいく味のお店を探す……大変悩ましいお題ですね。"
"70006010-13-アカリ" = "うふふっ★良い事を思いつきました。"
"70006010-14-ジュンコ" = "もしかして……アレやるの？"
"70006010-15-イズミ" = "アレだね！"
"70006010-16-アカリ" = "ええ。アレですよ★"
"70006010-18-ハルナ" = "そうですか、なるほど……皆さんがそう仰るのであれば。"
"70006010-19-ハルナ" = "今日も、フウカさんにお願いしに行きましょうか。"
"70006010-20-ジュンコ" = "いや、それさ……。"
"70006010-21-ジュンコ" = "いっつも「お願い」じゃなくない！？"
"70006010-23-アカリ" = "「お願い」にもいろんな種類があるんですから。誤解しちゃダメですよ★"
"70006010-24-イズミ" = "私はフウカが作ってくれるものなら何でもいいよ！"
"70006010-26-ジュンコ" = "はぁぁ、もー……。"
"70006010-30-ハルナ" = "あら。少々お待ちを。"
"70006010-31-ハルナ" = "……ジュリさんからですね。"
"70006010-35-ハルナ" = "はい、[ruby=くろだて]黒舘[/ruby]です。どうかなさいましたか？"
"70006010-39-ジュリ" = "もしもし、ハルナさん。#nその、確認したいことがありまして……。"
"70006010-40-ジュリ" = "フウカ先輩、今そちらにいらっしゃいますか？"
"70006010-42-ハルナ" = "いえ、ちょうど私たちも伺おうとしていたところなのですが……。"
"70006010-43-ジュンコ" = "というかそれ、私たちに聞いていいの？"
"70006010-45-ジュリ" = "あっ、連絡がつかない時は大体皆さんとご一緒だったので……。"
"70006010-46-ジュリ" = "今日は違うんですね。"
"70006010-47-ジュリ" = "どこに行ったんだろう……油がもう切れちゃいそうなのに……。"
"70006010-48-アカリ" = "ああ、油でしたらキッチンの入口側にある棚の奥にありますよ。"
"70006010-49-ジュリ" = "えっと、この棚の奥に……。"
"70006010-56-ジュリ" = "ありました！ありがとうございます……！"
"70006010-58-ジュンコ" = "えっ、何で知ってるの？"
"70006010-59-アカリ" = "ウフフッ、どうしてでしょうね？"
"70006010-61-ジュリ" = "助かりました！おかげで大丈夫そうです！"
"70006010-62-ジュリ" = "それでは、今日も先輩をよろしくお願いしますね！"
"70006010-66-ジュンコ" = "……なんか、自然な流れでフウカ探しをお願いされちゃったような。"
"70006010-67-ハルナ" = "ふむ……フウカさん、どうされたのでしょう。"
"70006010-68-イズミ" = "誰かが誘拐しちゃったのかなぁ？"
"70006010-69-アカリ" = "それは許せませんね★"
"70006010-70-ハルナ" = "ええ。私たち以外がフウカさんを連れ去るなど、決してあってはなりません。"
"70006010-71-ハルナ" = "というわけで……これよりフウカさんの安全確保のため、捜索を開始します。"
"70006010-73-イズミ" = "フウカを助け出して美味しいもの、作ってもらお！"
"70006010-75-ジュンコ" = "結局、私たちに協力してもらうなら変わらなくない！？"
"70006010-76-アカリ" = "フフッ。私たちはあくまで「お願い」ですから。"
"70006010-78-イズミ" = "しゅっぱーつ！"
"70006010-92-ジュンコ" = "くんくん……。"
"70006010-93-ジュンコ" = "ねえ、なんかこっちから嗅ぎ慣れた匂いがするよ？"
"70006010-94-イズミ" = "うん！絶対美味しいものの匂い！"
"70006010-95-ジュンコ" = "食べ物の匂いもするけど……なんか別の馴染のある感じもするような……？"
"70006010-97-ハルナ" = "フウカさんが近くにいるのかもしれませんね。"
"70006010-98-イズミ" = "わあ！ジュンコはフウカの匂いが分かるんだね！"
"70006010-99-ジュンコ" = "そ、そんなわけないでしょ！"
"70006010-105-アカリ" = "匂いまでは分かりませんが、足跡からしてフウカさんがここに来たのは間違いなさそうです。"
"70006010-106-アカリ" = "これです。この足跡……フウカさんがよく履いている靴の形をしています。"
"70006010-107-ジュンコ" = "こんないっぱいある足跡から、それが分かるの……？"
"70006010-108-アカリ" = "なんとなくです★"
"70006010-110-ハルナ" = "フウカさんの行動パターンを考えると、今日はこちらの商店街にいる可能性が高いです。"
"70006010-111-ハルナ" = "普段から贔屓にしているお店がこの辺りに……。"
"70006010-112-ジュンコ" = "みんなフウカのストーカーなの！？"
"70006010-113-ジュンコ" = "……ん？あれ？あそこにいるのって……。"
"70006010-119-ジュンコ" = "嘘っ！？本当に居た……。"
"70006010-120-ハルナ" = "楽しそうに食材を選んでますね。#n事件性がなくて良かったです。"
"70006010-121-アカリ" = "どうします？探して欲しいと言われてますし、念のために私たちで保護しましょうか？"
"70006010-123-イズミ" = "うんうんっ！危なくなる前に保護しよ～！"
"70006010-124-ジュンコ" = "はあ……もうツッコむのも疲れてきたわね……。"
"70006010-135-フウカ" = "なっ！？あんた達、どうやってここに……。"
"70006010-136-アカリ" = "あら？そんなに驚かなくても……。"
"70006010-137-アカリ" = "私たちの仲じゃありませんか★"
"70006010-138-イズミ" = "フウカ～！今日のお昼な～に～？"
"70006010-140-ハルナ" = "ジュリさんが心配しておりましたわよ。"
"70006010-141-フウカ" = "ジュリ？……あっ。"
"70006010-142-フウカ" = "完全に連絡忘れてた……後で謝っとこ。"
"70006010-143-イズミ" = "今日はいつもよりすごいのを作る感じ？楽しみ～！"
"70006010-144-フウカ" = "すごいと言えばすごい……のかな。"
"70006010-145-フウカ" = "茶々入れるつもりなら、今日はやめておいた方が良いと思うよ。"
"70006010-147-ハルナ" = "あら？それはどういった――"
"70006010-148-ジュンコ" = "あっ！みんな気を付けて！！"
"70006010-156-ハルナ" = "けほっ、けほっ……何が起きて……"
"70006010-170-ハルナ" = "あなた方は……救護騎士団……でしょうか？"
"70006010-171-ジュンコ" = "「団長が壊して騎士団が治す」っていう、あの！？"
"70006010-172-アカリ" = "私も聞いたことあります。瀕死まで追い込んでから、治療を施すのだとか……。"
"70006010-174-イズミ" = "ええっ！？何でそんな人たちとフウカが一緒にいるの？"
"70006010-175-ミネ" = "救護が必要な場に救護を！！フウカさん、ご無事ですか？"
"70006010-177-セリナ" = "まさか、噂が他校の方にまで知れ渡っているとは……。"
"70006010-178-ハナエ" = "えへへ。怪我をされても綺麗に治しますからね！心配しないでください！"
"70006010-180-ジュンコ" = "怪我する前提なの！？"
"70006010-181-ミネ" = "皆さんのことはフウカさんから伺っております。"
"70006010-182-ミネ" = "窮地に陥った者に手を差し伸べることもまた、救護……。"
"70006010-183-ミネ" = "救護騎士団団長[ruby=あおもり]蒼森[/ruby]ミネ……参ります！"
"70006010-222-ハルナ" = "アカリさん、ありがとうございます……間一髪でしたわね。"
"70006010-223-アカリ" = "うーん……手ごわいですね★"
"70006010-224-イズミ" = "うわーん！痛い！痛いよぉ！"
"70006010-225-ジュンコ" = "は、ハルナ！どうするのこれ！？"
"70006010-226-ハルナ" = "これは……迷うまでもなく――"
"70006010-230-ハルナ" = "――撤退しましょう！"
"70006010-234-アカリ" = "ですよね★"
"70006010-240-ミネ" = "逃がしません……！"
"70006010-251-セリナ" = "要救護者を確保！直ちに治療を開始します！"
"70006010-252-ハナエ" = "はい、じっとしててくださいね。動いたら痛いですよ！"
"70006010-253-イズミ" = "うわーん！ハルナ、アカリ、ジュンコ待って！置いてかないでーー！！"
"70006010-255-ジュンコ" = "ごめん！イズミのこと、忘れないから！！  "
"70006010-256-イズミ" = "うわあぁぁん！！覚えてなさいよっ！死んでも仕返ししてやるんだからっっ！！"
"70006010-260-ミネ" = "仲間を置き去りにするなど、なんと不届きな……。"
"70006010-261-ミネ" = "その性根……救護の名のもとに叩き直して差し上げます！"
"70006010-262-イズミ" = "そーだそーだ！みんな捕まえちゃえっ！"
"70006010-263-ジュンコ" = "あんたが言うの！？"
"70006010-264-ジュンコ" = "……あれ？"
"70006010-273-ハルナ" = "これが救護とは……聞いて呆れますわね……"
"70006010-274-アカリ" = "その場で治せばOKという考えが怖いですね～★"
"70006010-276-セリナ" = "ジュンコさん、脚を怪我されてますね……。"
"70006010-277-ハナエ" = "大変です！早く切断しないと！"
"70006010-279-ジュンコ" = "ええっ！？嘘でしょ！？嘘だよね！？"
"70006010-280-イズミ" = "うぅ……お腹が空いてなければ捕まらなかったのに……。"
"70006010-281-ジュンコ" = "ちょっ！？私の腕は食べられないわよ！？"
"70006010-283-ハルナ" = "脱落したお二人のことは残念ですが、ここは態勢を立て直して……"
"70006010-287-ハルナ" = "……アカリさん？"
"70006010-288-アカリ" = "私もどうやらここまでのようです……。"
"70006010-289-アカリ" = "ハルナをかばった傷が……後はよろしく……。"
"70006010-290-アカリ" = "ぐふっ……。"
"70006010-295-ハルナ" = "アカリさん……！！"
"70006010-300-ミネ" = "残るはあなただけですね。"
"70006010-304-ハルナ" = "ふふ……ふふふっ……。"
"70006010-305-ハルナ" = "抵抗しても無駄なようですね。降参いたしますわ。"
"70006010-306-ハルナ" = "噂には聞いておりましたが……まさかこれほどとは。"
"70006010-307-ハルナ" = "さすがは破壊のミネさん、といったところでしょうか。"
"70006010-309-ミネ" = "は、破壊……！？またあらぬ誤解が……。"
"70006010-310-ハルナ" = "ともかく。私のことは大丈夫ですので、みなさんの治療を――"
"70006010-313-ハナエ" = "あっ、これは腕を切断しないとダメかも……。"
"70006010-314-イズミ" = "うわああぁぁん！！"
"70006010-315-セリナ" = "ハナエちゃん、怖がらせてはいけません。本当に切断すると思われてしまいますよ？"
"70006010-316-ハナエ" = "えっ？本当ですよ？"
"70006010-318-ジュンコ" = "あのキラキラした笑顔が余計怖いんだけど！？"
"70006010-319-アカリ" = "ウフフッ。大ピンチですね。こういう時こそ精をつけて……。"
"70006010-324-ジュンコ" = "うわっ！？腕舐めないでよ！？"
"70006010-327-ハルナ" = "適切な治療をお願いできればと……。"
"70006010-328-ミネ" = "心配は無用です。彼女たちも、れっきとした救護騎士団ですから。"
"70006010-329-フウカ" = "たまには痛い目見たほうが、良い薬になるんじゃない？"
"70006010-331-ハルナ" = "ところで……なぜ救護騎士団のみなさんがフウカさんと一緒に？"
"70006010-332-ミネ" = "そ、それは……。"
