"70002010-40-キララ" = "え、いや別に！？何もないよ？"
"70002010-41-キララ" = "強いて言えば、昨日夜ふかししたからかも？ちょっと寝不足でさー。"
"70002010-46-エリカ" = "……？"
"70002010-49-キララ" = "うん、今日もキラキラしてる！"
"70002010-50-キララ" = "帰りにどこ寄ってく～？"
"70002010-51-キララ" = "あ！エリカちゃん、見て見て！"
"70002010-52-エリカ" = "ん？"
"70002010-59-エリカ" = "ああ、あの子……。"
"70002010-60-キララ" = "タピオカ良いな～！#nっていうかあれって、噂の限定品だよね？"
"70002010-61-エリカ" = "ああ、なかなか手に入らないってやつ？#nどうやって買ったんだろ？"
"70002010-62-キララ" = "直接聞いてみよっか♪"
"70002010-66-エリカ" = "……また始まった。"
