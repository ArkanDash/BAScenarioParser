"70002010-76-ゲヘナの生徒" = "あ、う、うん……大丈夫、だけど……。"
"70002010-78-キララ" = "んじゃ、ちょっとだけ時間ちょうだい！"
"70002010-79-ゲヘナの生徒" = "う、うん……まぁいいけど……。"
