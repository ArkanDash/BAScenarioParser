[translation]
"70002020-1" = "キララとエリカのキラキラな日（２）"
"70002020-5-キララ" = "はろはろ～！"
"70002020-6-キララ" = "[ruby=パンデモニウム・ソサエティー]万魔殿の休憩室[/ruby]ってここであってる？"
"70002020-7-エリカ" = "体験入部したいんだけど、良いかな？"
"70002020-15-マコト" = "……よく来た。"
"70002020-16-マコト" = "――ようこ[ruby=パンデモニウム・ソサエティー]そ、万魔殿へ。[/ruby]"
"70002020-17-マコト" = "ゲヘナ学園生徒会長であるこのマコト様と接する栄誉を、お前たちに授けよう。"
"70002020-22-キララ" = "授かった～！で、合ってる？"
"70002020-23-エリカ" = "多分。"
"70002020-24-キララ" = "どこかで見たことある気がするけど、あなたが受付の人？"
"70002020-26-マコト" = "なっ……！？受付……！？"
"70002020-27-マコト" = "このマコト様を……知らない、だと！？"
"70002020-28-マコト" = "私こそ[ruby=パンデモニウム・ソサエティー]が、万魔殿の永[/ruby]遠不滅のリーダー！#nいつかキヴォトスの覇者となる最も偉大な指導者、マコト様だ！"
"70002020-29-キララ" = "へー、そうなんだ？"
"70002020-30-マコト" = "なんだこいつは……無礼な奴め……。"
"70002020-31-マコト" = "……いや。まだ天地の見分けもつかぬ新人に、いちいち振り回されてはならない。"
"70002020-32-マコト" = "こほん。話を戻そう……。"
"70002020-33-マコト" = "キキキッ……！[ruby=パンデモニウム・ソサエティー]我が万魔殿の活[/ruby]動を体験したいと言ったな。"
"70002020-34-マコト" = "歓迎しよう！キララ、そしてエリカよ！"
"70002020-35-エリカ" = "あれ？私たちの名前知ってるの？"
"70002020-36-マコト" = "キシシッ、無論だ。"
"70002020-37-マコト" = "我々万魔殿に直接足を運び、さらには体験入部を求める者の名を覚える程度のこと……。"
"70002020-38-マコト" = "このマコト様にとっては造作もない。"
"70002020-39-マコト" = "キキキッ……期待しても良いぞ。#n今後、我々万魔殿の幹部になることだって夢では――"
"70002020-40-キララ" = "んー、それは良いかな。"
"70002020-41-マコト" = "なにぃっ！？"
"70002020-42-マコト" = "くっ。なるほど、そこまではまだ時間が必要、ということか。"
"70002020-43-マコト" = "幹部ではなく下っ端だからこそ、見えてくる景色もあると……ふむ。"
"70002020-44-マコト" = "そこまで見越していたのだな、[ruby=よざくら]夜桜[/ruby]キララ……！"
"70002020-45-エリカ" = "違うと思うけど……。"
"70002020-48-イロハ" = "はい、ありがとうございます。体験入部希望ですね。"
"70002020-49-イロハ" = "しかし体験入部だなんて、何と言うか……奇特な方々ですね。"
"70002020-51-キララ" = "普段、万魔殿って何してるの？"
"70002020-52-エリカ" = "ゲヘナ学園の生徒会みたいな役割とは聞いてるけど……。"
"70002020-53-エリカ" = "学園の運営に関わる予算管理、とか？"
"70002020-55-イロハ" = "はい、そういう仕事もありますね。"
"70002020-56-イロハ" = "他にもゲヘナの顔として、対外業務や外部との契約などを担っていますが……。"
"70002020-57-イロハ" = "まぁ最近は……マコト先輩のやらかしに対する後始末が多いですね……。"
"70002020-58-イロハ" = "じー……。"
"70002020-59-マコト" = "ん？何だ、イロハ。#nマコト様の顔に、尊厳以外なにか付いているのか？"
"70002020-60-イロハ" = "いえ、何でもありません。#nはぁ……。"
"70002020-62-エリカ" = "なんだか大変そうだね。"
"70002020-66-イブキ" = "たっだいまー！"
"70002020-67-イブキ" = "あれ？帰宅部のお姉さんたち？"
"70002020-69-キララ" = "え？"
"70002020-70-キララ" = "イブキちゃーん！はろはろ～！"
"70002020-71-エリカ" = "やっほ、イブキちゃん。また会ったね。"
"70002020-72-イブキ" = "わあ、お姉さんたち！会えて嬉しい！#n遊びに来てくれたのー？"
"70002020-73-キララ" = "そうそう！今日は体験入部に来たんだ♪#nまあ、遊びに来たのと同じかな！"
"70002020-74-イブキ" = "ほんと？やったー！"
"70002020-75-エリカ" = "イブキちゃんと会うのは久しぶりなのに、全然そんな感じしないね。"
"70002020-76-エリカ" = "「週刊万魔殿」で、イブキちゃんの写真をいっぱい見てるからかな？"
"70002020-78-イロハ" = "なるほど……。#nマコト先輩とチアキが作っているあの週刊誌、無意味ではなかったのですね。"
"70002020-79-マコト" = "クククッ！ようやくマコト様の真価が分かったか！"
"70002020-80-イロハ" = "はいはい……。"
"70002020-81-マコト" = "さて……。"
"70002020-83-マコト" = "イブキ～？"
"70002020-84-マコト" = "何を隠そう、冷蔵庫にプリンがあるぞー？"
"70002020-86-キララ" = "そういえばイブキちゃん、お手玉が得意なんだっけ？#n「週刊万魔殿」で読んだよ！"
"70002020-87-キララ" = "よかったら見せてくれない？"
"70002020-88-イブキ" = "いいよー！"
"70002020-89-イブキ" = "お姉さんたちにもお手玉教えてあげる！"
"70002020-90-キララ" = "やった～、イブキちゃんのお手玉♪"
"70002020-91-エリカ" = "あっちでやろっか。"
"70002020-97-マコト" = "……！"
"70002020-98-マコト" = "い、イブキ……？"
"70002020-99-マコト" = "プリン……は……？"
"70002020-101-マコト" = "い、イブキぃ！？#n私よりあいつらの方が良いと言うのか！？"
"70002020-102-マコト" = "そ、そんな……違うよな？"
"70002020-103-マコト" = "イブキ！う、嘘だと言ってくれ！#nイブキぃ！！"
"70002020-109-イロハ" = "……。"
"70002020-110-イロハ" = "今日は静かに過ごせそうですね。"
"70002020-116-キララ" = "イブキちゃんと遊ぶの、すっごく楽しかった～！"
"70002020-117-エリカ" = "意外と時間使っちゃったね。#n次の体験入部に間に合わないかも、急ごう。"
"70002020-118-キララ" = "あははっ、そうだね！次ってどこだっけ？"
"70002020-120-エリカ" = "次は……"
"70002020-123-ジュリ" = "ようこそ、ゲヘナ給食部です！"
"70002020-124-ジュリ" = "体験入部、歓迎します！"
"70002020-126-キララ" = "わ～！美味しそうな匂い！お腹空いてきちゃった！"
"70002020-127-エリカ" = "食堂はよく来てたけど、キッチンに入ったのは初めてかも。"
"70002020-129-フウカ" = "ここでみんなの食事を作ってるの。#nゲヘナの台所へようこそ。"
"70002020-130-フウカ" = "ちなみに二人とも、料理経験はある？"
"70002020-131-エリカ" = "うーん、たまに肉じゃが作るくらいかな？"
"70002020-132-キララ" = "あたしはからっきしー！"
"70002020-134-ジュリ" = "大丈夫ですよ！これから勉強していけばいいですから！"
"70002020-135-ジュリ" = "今日は私がお教えしますね！"
"70002020-136-フウカ" = "ごめんね、私も手伝えたら良かったんだけど、#n夕食の仕込みをしないといけなくて……。"
"70002020-137-フウカ" = "いつもみたいにトラックで一気に食材を運べれば、こんなに時間かからなかったのに……。"
"70002020-138-フウカ" = "私たちの……。"
"70002020-142-フウカ" = "私たちの、給食部のトラックが……！"
"70002020-143-ジュリ" = "ふ、フウカ先輩！大丈夫です！#nきっと戻っ……何とかなります！"
"70002020-144-フウカ" = "と、とりあえずそういうことだから、#n後はジュリに任せるね。"
"70002020-145-ジュリ" = "はい、お任せください！基礎から丁寧に教えます！"
"70002020-146-フウカ" = "ありがとう。それじゃあ二人も、ごゆっくり……。"
"70002020-150-ジュリ" = "それでは、私についてきてください！"
"70002020-151-ジュリ" = "施設見学の後に、実際の料理へと移っていきましょう。"
"70002020-153-キララ" = "シェフ・キララの第一歩、って感じ？#nワクワクしてきた！"
"70002020-156-ジュリ" = "こちらがキッチン内部です。"
"70002020-157-ジュリ" = "ここが食器棚でこちらはグリル……コンロはこれで……。"
"70002020-159-エリカ" = "このキッチンでいつも何人分の料理を作ってるの？"
"70002020-161-ジュリ" = "そうですね……数千人分くらいでしょうか。"
"70002020-163-キララ" = "えっ！？マジ！？"
"70002020-164-キララ" = "あーでも、毎日食堂に来る生徒数すごいもんね。"
"70002020-165-キララ" = "大変そ～。"
"70002020-166-ジュリ" = "最初は大変でしたが、もう慣れました！"
"70002020-167-ジュリ" = "それではそろそろ、料理に移ります！"
"70002020-168-ジュリ" = "今日はまず……基本の料理であるオムライスを！"
"70002020-169-キララ&エリカ" = "おお……！"
"70002020-180-ジュリ" = "こうして器に盛れば……ジャーン！"
"70002020-182-ジュリ" = "ど、どうでしょう？"
"70002020-186-エリカ" = "さすがベテランは一味違う――"
"70002020-194-エリカ" = "……いや、ちょっと待って。"
"70002020-195-エリカ" = "オムライスってこんな色だっけ？"
"70002020-196-ジュリ" = "え？違うんですか？"
"70002020-197-エリカ" = "というかこれ動いてるんだけど？何作ったの？"
"70002020-198-キララ" = "あははっ！くねくねしてるの、ちょっとキモカワい～！"
"70002020-199-キララ" = "ん？手が出てきた、挨拶？"
"70002020-200-エリカ" = "ちょ、ちょっと待って、それ本当に大丈夫なの？"
"70002020-202-キララ" = "え、かわいくない？#nハイタ～ッチ！"
"70002020-207-エリカ" = "通じ合った……！？"
"70002020-211-エリカ" = "ビックリしたけど……。"
"70002020-212-エリカ" = "まあ、こういうところもキララちゃんらしいね。"
"70002020-213-キララ" = "あれ、オムちゃん？"
"70002020-223-エリカ" = "あっ、逃げた。"
"70002020-224-エリカ" = "……オムちゃん、って何？名前？"
"70002020-225-ジュリ" = "ちょ、ちょっと待ってください！オムちゃん！"
"70002020-226-エリカ" = "……あ、名前なんだ。っていうか共通認識なんだ。"
"70002020-227-ジュリ" = "逃げないでください！？"
"70002020-228-ジュリ" = "ま、待って～！"
"70002020-232-エリカ" = "給食部も……色々大変だったね。"
"70002020-233-キララ" = "あはははっ！なんか愉快で面白かったね！"
"70002020-234-ジュリ" = "オムちゃぁぁん！！"
"70002020-236" = "（給食部の体験入部は主催側の都合により中断された）"
"70002020-241-セナ" = "あなた達が体験入部の希望者でしょうか。"
"70002020-243-キララ" = "はろはろ～、キララでーす！よろしくお願いしま～す！"
"70002020-244-エリカ" = "私はエリカ、よろしく。"
"70002020-246-セナ" = "救急医学部の部長、[ruby=ひむろ]氷室[/ruby]セナです。"
"70002020-247-エリカ" = "ここも体験入部を受け入れてるなんて、意外だね。"
"70002020-248-エリカ" = "いつも忙しそうっていうか、余裕無さそうだったのに。"
"70002020-249-セナ" = "むしろ逆です。目が回るほど忙しいからこそ、体験入部を受けたのです。"
"70002020-250-キララ" = "え？そうなの？"
"70002020-251-セナ" = "現在、自治区内で不良たちのいざこざが勃発し、多数の死体……#nいえ、負傷者が移送されています。"
"70002020-253-セナ" = "早速ですが皆さんは、戦力として対応していただきますので。"
"70002020-254-エリカ" = "え、良いの？私たち何も知らないけど？"
"70002020-255-キララ" = "絆創膏貼るくらいならできるけどねー？"
"70002020-257-セナ" = "ご心配なく、もちろん専門家でない皆さんに難しいことはさせません。"
"70002020-258-セナ" = "私が注射の準備をしている間、皆さんは負傷者を落ち着かせていただければ。"
"70002020-259-セナ" = "では、準備を！"
"70002020-261-キララ" = "合点承知～。"
"70002020-265-エリカ" = "まぁ……やってみよっか。"
"70002020-268-チンピラA" = "い……痛っ……。"
"70002020-269-チンピラB" = "ちっ、まだいけるのに、膝が……。"
"70002020-270-チンピラC" = "弱音はそこまでにしときな！#nこのままだとあたしらのエリアが奪われるんだぞ！"
"70002020-272-チンピラC" = "こんな怪我でくたばってる場合かっ！"
"70002020-273-チンピラA" = "おっし！"
"70002020-274-チンピラC" = "早く抜け出すぞ！救急医学部の部長にバレないように、こっそりな！"
"70002020-275-チンピラA&B" = "はい！姉御！"
"70002020-280-キララ" = "はろはろ～！#n臨時だけど白衣の天使、キララ参上～！"
"70002020-284-チンピラA" = "だ、誰だ！？"
"70002020-286-エリカ" = "今日一日、体験入部で入ったの。あなた達が負傷者さん？"
"70002020-287-キララ" = "よろしくね～！"
"70002020-289-チンピラB" = "よ、よろしくもなにも！あたしらは今から戻るんだよ！"
"70002020-290-チンピラA" = "そうだそうだ！こんな所にいつまでも居られるか！"
"70002020-292-エリカ" = "ん？治療したくないの？"
"70002020-293-エリカ" = "その傷とか、放っておいたら結構痛いと思うけど？"
"70002020-294-チンピラC" = "んなもん知るか！"
"70002020-295-チンピラB" = "あたしらのエリアを守る方が大事なんだよ！"
"70002020-297-キララ" = "そうなの？君たちのエリアって？"
"70002020-298-チンピラA" = "そこの十字路から少し入った屋台裏の路地、あそこだよ。"
"70002020-299-キララ" = "え？クレープ屋さんのとこ？あたし、そこ知ってる！"
"70002020-300-キララ" = "めっちゃおいしいよね！#nあたし常連なんだ！"
"70002020-302-チンピラB" = "え、えっと……そうなの？それは奇遇だね。"
"70002020-303-キララ" = "いつもイチゴとソフトクリーム、チョコチップトッピングが好きなんだけど、そっちは？"
"70002020-304-チンピラA" = "私はやっぱりバナナかな。"
"70002020-305-チンピラB" = "パイナップルとアイスクリームの組み合わせは食べてみた？美味しかったよ！"
"70002020-306-キララ" = "えっ、マジ？でもそれ聞くだけで美味しそう～！"
"70002020-308-チンピラC" = "あたしは果物好きじゃないから、チョコチップクッキーと生クリーム特盛りだな！"
"70002020-309-キララ" = "え～いいな！今度やってみよ♪"
"70002020-310-キララ" = "あ、そうだ！ついでに――"
"70002020-315-チンピラたち" = "あっ！？救急医学部の部長！？"
"70002020-325-チンピラたち" = "思わず……おしゃべりに……。"
"70002020-331-セナ" = "麻酔完了。"
"70002020-332-エリカ" = "患者に銃を向けても良いの？"
"70002020-333-セナ" = "治療のために必要な措置です。#n何かを守る時には、やむを得ないこともあります。"
"70002020-334-セナ" = "……お二方には素質がありますね。#nこのトラブルメーカーたちの足をきちんと止められるとは。"
"70002020-335-エリカ" = "まあ、狙ってやったわけじゃないけど……キララちゃんの力っていうか……。"
"70002020-336-キララ" = "クレープ、一緒に食べに行きたかったなー……。"
"70002020-337-エリカ" = "IDでも残しておいたら？#nみんな目を覚ましたら、その後一緒に行けば良いでしょ。"
"70002020-338-キララ" = "あっ、そうだね！部長、良いかな？"
"70002020-342-セナ" = "本来なら、患者との個人的な連絡はよろしくありませんが……。"
"70002020-343-セナ" = "今回は良いでしょう、皆さんが立派に仕事を遂行してくださったお礼に。"
"70002020-344-キララ" = "やったー！ありがとう、部長！部長の分も買ってくるね！"
"70002020-345-セナ" = "いえ、私は結構です。"
"70002020-346-キララ" = "良いから良いから、遠慮しないで～！"
"70002020-349-キララ" = "ぷは～！楽しかった～！"
"70002020-350-キララ" = "こんなにたくさん部活があると思わなかった！"
"70002020-351-エリカ" = "おかげで、私も色んな経験ができたよ。"
"70002020-352-エリカ" = "それで、見つかった？"
"70002020-353-キララ" = "ん？何が？"
"70002020-354-エリカ" = "体験入部の目的、忘れちゃったの？"
"70002020-355-エリカ" = "キララちゃんが入りたい部活を探してたんでしょ？"
"70002020-356-キララ" = "あ、そうだった！うっかりうっかり、あははっ！"
"70002020-357-キララ" = "うーん……どこもめっちゃ楽しかったよね。"
"70002020-358-キララ" = "新しい友達もできて、色んな経験もできて！"
"70002020-359-キララ" = "そうだなぁ……体験入部した中で、一番行きたいところ……。"
"70002020-363-キララ" = "……無いかも！"
"70002020-365-エリカ" = "え？"
"70002020-366-エリカ" = "さっき、めっちゃ楽しかったって言ってなかった？"
"70002020-367-キララ" = "うん！めっちゃ楽しかった！ワクワクしたし！"
"70002020-368-キララ" = "イブキちゃんと遊んだことも、給食部のキッチンに入ったことも、#n患者さんの面倒を見たことも！"
"70002020-369-キララ" = "どれも新鮮で楽しかった！"
"70002020-370-エリカ" = "じゃあどうして？"
"70002020-371-キララ" = "うーん……その中から一つを選ぶってなると、それは……。"
"70002020-372-キララ" = "何か勿体なくない！？"
"70002020-373-エリカ" = "勿体ない……？"
"70002020-374-キララ" = "ほら！部活ってさ！"
"70002020-375-キララ" = "入部したら毎日同じ活動することになるでしょ？"
"70002020-376-キララ" = "それはそれで良いけど、あたしの性に合わないっていうか……。"
"70002020-377-キララ" = "何か、もったいないなーって。"
"70002020-378-エリカ" = "……そっか。キララちゃんは毎日新しいことをしたいってこと？"
"70002020-379-キララ" = "そうそう、さっすがエリカちゃん！あたしの気持ちを一番良く分かってる～！"
"70002020-380-キララ" = "だってその方があたし的に、キラキラしてワクワクする最高の毎日になりそうだし？"
"70002020-381-キララ" = "それってすっごく青春じゃん！"
"70002020-386-キララ" = "例えば、新しい友達を作ったり――"
"70002020-394-キララ" = "トラックを追いかけて走ったり――"
