[translation]
"70005020-1" = "とある2月19日の記録（１）"
"70005020-3" = "[log]2月19日[/log]"
"70005020-6" = "ゲヘナ学園・風紀委員会の教室"
"70005020-8-アコ" = "……。"
"70005020-9-イオリ" = "……。"
"70005020-10-チナツ" = "……。"
"70005020-11-アコ" = "この状況。どなたか説明してくださいますか？"
"70005020-12-チナツ" = "……これは、誤配ですね。"
"70005020-13-イオリ" = "本来の宛て先は……山海経高級中学校の玄龍門ってところみたい。"
"70005020-14-アコ" = "いま冷静に分析している場合ですか！？"
"70005020-15-イオリ" = "説明してくれって言ったのはアコちゃんでしょ！？"
"70005020-16-アコ" = "もういいです！私が連絡してみます！すぐに対応しないと……！"
"70005020-17-チナツ" = "お待ちください。"
"70005020-18-アコ" = "はい？"
"70005020-19-チナツ" = "玄龍門は、山海経高級中学校で生徒会機能を持った組織です。#n言わば、ゲヘナに[ruby=パンデモニウム・ソサエティー]おける万魔殿。[/ruby]"
"70005020-20-アコ" = "それで？"
"70005020-21-チナツ" = "対して風紀委員会は、ゲヘナの風紀と治安を維持する組織です。"
"70005020-22-チナツ" = "状況によっては外部と協力する場合もありますが……。"
"70005020-23-チナツ" = "……それが、他学園の「生徒会」と直接的な交流になってしまえば……。"
"70005020-24-アコ&イオリ" = "あ。"
"70005020-25-チナツ" = "お二人のご想像通りです……。"
"70005020-26-イオリ" = "捉え方次第で外交問題になる可能性もある……。"
"70005020-27-アコ" = "これがもし万魔殿の耳に入ってしまえば……。"
"70005020-32-イオリ" = "どんな難癖をつけてくるか、想像するだけでも……。"
"70005020-33-アコ" = "ああもう！誰か、山海経に友達とかいないんですか！？"
"70005020-34-チナツ&イオリ" = "……。"
"70005020-35-アコ" = "えっ！？本当にいないんです……？"
"70005020-36-チナツ" = "その、一応……連絡を取ろうと思えば……「錬丹術研究会」と繋がりはあるのですが……。"
"70005020-37-アコ" = "錬丹術研究会？どういうところです？"
"70005020-38-チナツ" = "強いて言えば……救急医学部のような部活です。"
"70005020-39-アコ" = "ああ、それで。"
"70005020-40-アコ" = "……。"
"70005020-42-アコ" = "ではその伝手で、山海経と「プライベート」な連絡を取ってみましょう。"
"70005020-47-玄龍門の構成員" = "……。"
"70005020-48-ミナ" = "……。"
"70005020-49-ミナ" = "どうすれば……。"
"70005020-50-玄龍門の構成員" = "私に聞かれましても……。"
"70005020-51-ミナ" = "これ、どこのケーキだ？"
"70005020-55-玄龍門の構成員" = "ゲヘナと書かれていますね。えっと……「[ruby=そらさき]空崎[/ruby]ヒナ委員長に、心を込めて」？"
"70005020-56-ミナ" = "空崎ヒナ？聞いたことがあるような……"
"70005020-60-ミナ" = "たしか……ゲヘナの風紀委員長だったか？学園を一人で支える完璧超人だとか……。"
"70005020-61-ミナ" = "ふんっ！門主様の方が優秀に決まってるがな！"
"70005020-62-玄龍門の構成員" = "いきなりどういう話です……？"
"70005020-64-ミナ" = "ところで、うちのケーキは……？"
"70005020-65-玄龍門の構成員" = "分かりません。ただ、このケーキが届いていることをゲヘナの風紀委員会に伝える必要はあるかと。"
"70005020-66-ミナ" = "……そうだな。"
"70005020-67-玄龍門の構成員" = "こういう場合、担当するのは……。"
"70005020-68-ミナ" = "……広報部長、だろうか？"
"70005020-69-玄龍門の構成員" = "……「香主」様、ですか？"
"70005020-70-ミナ" = "原則に従えばそうなるな。"
"70005020-71-玄龍門の構成員" = "だ、大丈夫なんでしょうか……？"
"70005020-72-ミナ" = "……致し方あるまい。"
"70005020-79-ミナ" = "ん？錬丹術研究会から電話？"
"70005020-83-サヤ" = "よく聞いてほしいのだ、ミナ執行部長！#nゲヘナの救急医学部から、「プライベート」な連絡が来ているのだ！"
"70005020-84-サヤ" = "今から繋ぐのだ！"
"70005020-85-ミナ" = "「プライベート」な連絡……？"
"70005020-90-チナツ" = "初めまして、ミナさん。私はゲヘナ学園のチナツと申します。"
"70005020-91-ミナ" = "あ、ああ……。"
"70005020-92-チナツ" = "今日、そちらに届くはずだったケーキが、こちらに届いていまして。"
"70005020-93-ミナ" = "！！！"
"70005020-99-チナツ" = "ご説明ありがとうございます。たしかに、ケーキが入れ替わっているのですね。#nでは今後の対応方針について……"
"70005020-100-チナツ" = "こちら側でも検討いたします。方針が固まり次第、再度ご連絡させていただきますね。"
"70005020-105-玄龍門の構成員" = "どうしましょう……。"
"70005020-106-ミナ" = "これでは、またあいつらに……。"
"70005020-107-玄龍門の構成員" = "あいつら？"
"70005020-108-ミナ" = "なっ、なんでもない！"
"70005020-109-ミナ" = "とにかく、ここは私が責任を持ってなんとかしよう！お前には手間をとらせたな。"
"70005020-110-玄龍門の構成員" = "あ、いえ。執行部長もご無理なさらず。"
"70005020-115-ミナ" = "はぁ……。"
"70005020-119-レイジョ" = "……もし何かあった場合、こちらに連絡してください。"
"70005020-120-レイジョ" = "正直、玄龍門が門主様抜きで事をうまく処理できるとは思えませんので。"
"70005020-122-ミナ" = "はああああ……。"
"70005020-123-ミナ" = "やむを得ないか……自身の限界を認めるのもまた強さ……"
"70005020-124-ミナ" = "だが……。"
"70005020-125-ミナ" = "いや、悩むのはハードボイルドではないな。即断即決だ！"
"70005020-127" = "玄武商会"
"70005020-128-ルミ" = "……そりゃ災難だったね。でも、素直にうちを頼ったのは正解かも。#nちょうど、良いアイデアがあるんだ。"
"70005020-129-ミナ" = "ほ、本当か？"
"70005020-130-レイジョ" = "会長。玄武商会とて、まだゲヘナとは取引をしたことがありません。どうするつもりですか？"
"70005020-131-ルミ" = "うん。だからこれを機に間口を広げたくてね。"
"70005020-132-ルミ" = "ところで、みんな歌は好き？"
"70005020-133-ミナ" = "歌？"
"70005020-134-レイジョ" = "ですか？"
