[translation]
"70008030-1" = "何にも縛られぬ者たち（３）"
"70008030-2-？？？" = "さて、皆さんお集まりのようですので――"
"70008030-3-？？？" = "ここに……魑魅一座ナイトの開幕を宣言します！"
"70008030-13-アラタ" = "（うわ……あっちも……こっちも……魑魅一座でも有名なリーダーばっかり……）"
"70008030-14-アラタ" = "（あたし……ここにいていいのか……？）"
"70008030-15" = "ざわざわ……。"
"70008030-16-喧騒流のリーダー" = "おい、あいつじゃないか？"
"70008030-17-瀬戸際流のリーダー" = "マジかよ……今年は荒れそうだな……。"
"70008030-18-アラタ" = "（おいおい、どんなやべぇやつが来てるんだ！？）"
"70008030-23-変転流のリーダー" = "あいつ、本当に魑魅一座なのか……？"
"70008030-24-彷徨い流のリーダー" = "百鬼夜行の外だと、あんな恰好のやつらがいるって聞いたけど……。"
"70008030-29-初志貫徹流のリーダー" = "皆さん！お静かに～！！"
"70008030-33-初志貫徹流のリーダー" = "積もる話もあるでしょうが……皆さん、私語は慎んでいただきますよう。"
"70008030-37-初志貫徹流のリーダー" = "……では、本題に入りましょう。"
"70008030-38-初志貫徹流のリーダー" = "近頃の我々は、百鬼夜行から無視されている――そうは思いませんか？"
"70008030-39-喧騒流のリーダー" = "たしかにね……あたしらのこと、誰も怖がってないし。"
"70008030-40-変転流のリーダー" = "勝手に神木祭を再開するしな……。"
"70008030-41-瀬戸際流のリーダー" = "そうだそうだ！我々のことをバカにしてやがるんだ！"
"70008030-42-初志貫徹流のリーダー" = "ええ、ええ。皆さんのお気持ち……私も痛いほど分かります。"
"70008030-43-初志貫徹流のリーダー" = "幸いにして――先の神木祭においては、路上流のアラタ殿の活躍で、我々が恥をかくことは免れました。"
"70008030-44-アラタ" = "えっ、あたし！？#n……そ、そうだな！神木祭は百鬼夜行――ようは、あたしらの祭りだろ？"
"70008030-45-アラタ" = "邪魔させるわけにはいかなかったっていうか……#nまぁ……陰陽部とか百花繚乱のやつらに超怒られた記憶しかねぇけどよ……。"
"70008030-46-初志貫徹流のリーダー" = "百鬼夜行の物は、すなわち我々魑魅一座の物と同義！#n自分の物を守ろうとして、何がいけないと言うのでしょう！"
"70008030-47-初志貫徹流のリーダー" = "百花繚乱など根拠がない口だけの集団！#n魑魅一座こそ、百鬼夜行の体現者！伝統の守護者なのです！"
"70008030-48-魑魅一座" = "おお！よく言った！"
"70008030-49-アラタ" = "そうだ！そうだ！"
"70008030-50-アラタ" = "（そうだ！これが魑魅一座！あたしらは百鬼夜行の伝統を守ってんだ！）"
"70008030-51-初志貫徹流のリーダー" = "今までは陰陽部の顔を立ててきましたが……もうその必要はありません！"
"70008030-52-初志貫徹流のリーダー" = "日取りは次回のお祭り。我々は――百花繚乱に宣戦布告をするのです！"
"70008030-54-アラタ" = "（……ん？）"
"70008030-55-魑魅一座" = "うおお！目にもの見せてやれ！！"
"70008030-56-初志貫徹流のリーダー" = "皆さん、今こそ動く時です！"
"70008030-57-初志貫徹流のリーダー" = "百花繚乱は治安維持のために、街中に散らばるはず。#n我々は観光客のふりをして潜伏し……チャンスがきたら、一斉に奇襲するのです！"
"70008030-58-喧騒流のリーダー" = "やってやろうぜ！"
"70008030-59-右往左往流のリーダー" = "私たちのお祭りを取り戻すんだ！観光客だろうがなんだろうが、そんなの関係ねぇ！"
"70008030-60-アラタ" = "いや、それは……違うんじゃねぇ？"
"70008030-61-初志貫徹流のリーダー" = "……今のはどなたですか？"
"70008030-67-アラタ" = "あっ、おっ、おい！押すなって！#n……ええと、あたしだけど。"
"70008030-68-初志貫徹流のリーダー" = "……アラタ殿。#n誰よりも神木祭の再開に反対していたあなたが……なぜ？"
"70008030-69-アラタ" = "それとこれとはちょっと違うというか……！"
"70008030-70-アラタ" = "いや、その……もちろん、百花繚乱の連中をやっつけようってのはいいんだけどさ……。"
"70008030-71-アラタ" = "今回のお祭りって別に問題ないじゃん？#n無関係の人とか、お祭りのために頑張ってきた人たちまで巻き込むのはどうなんだ？"
"70008030-72-魑魅一座" = "じゃあこっちが悪いっていうのか！？#n我々だってちょっとは悪いけどさ！"
"70008030-73-魑魅一座" = "もう作戦は始まってんだ。自分だけ抜ける気か！？"
"70008030-74-初志貫徹流のリーダー" = "アラタ殿、がっかりです。我々の未来を担う方だと思っていたのに……。"
"70008030-75-初志貫徹流のリーダー" = "集会の内容を知られた以上……このまま帰すわけにはいかなくなってしまいました。"
"70008030-76-アラタ" = "うわっ！近づくな！だ、誰か……！"
"70008030-81-？？？" = "話は聞かせてもらいましたっ！"
"70008030-85-イズナ" = "その計画――イズナが阻止いたします！"
"70008030-87-変転流のリーダー" = "忍者だと！？"
"70008030-88-瀬戸際流のリーダー" = "陰陽部が忍者を養成してるって噂は本当だったのか！！"
"70008030-90-ニヤ" = "にゃははっ！忍者の良さが分かるだなんて、見る目あるじゃないですか♪"
"70008030-91-ニヤ" = "これほど面白……いや、良い展開はないですからねぇ。"
"70008030-92-初志貫徹流のリーダー" = "これはどういうことです、[ruby=あまち]天地[/ruby]ニヤ……！#nあの陰陽部が中立を破るおつもりか？"
"70008030-93-ニヤ" = "はて、私にはなんのことやら……。#n可愛い後輩が散歩をしていたら……たまたま不思議な集会に迷い込んでしまっただけでして～"
"70008030-94-初志貫徹流のリーダー" = "そんな嘘が通じると本気で思っているのですか……？"
"70008030-95-初志貫徹流のリーダー" = "いや、どのみちもう遅い。#n魑魅一座が団結すれば、いくら陰陽部や百花繚乱であっても――"
"70008030-96-ニヤ" = "はいは～い、わかってますよ～"
"70008030-97-ニヤ" = "野良犬って1、2匹ならどうってことないんですがねぇ。#nこれが群れると厄介で……。"
"70008030-98-イズナ" = "はぁっ！イズナ流忍法！ペンペンの術！"
"70008030-99-魑魅一座" = "ぐあああ、痛い！取れちゃうーっ！"
"70008030-100-魑魅一座" = "たった一人に何を苦戦してんだ！#nさっさと片づけ――ぐあああっ！痛いーっ！"
"70008030-101-ニヤ" = "やっぱり、群れる前なら可愛いですね～にゃはは！では、お先に～"
"70008030-105-初志貫徹流のリーダー" = "天地ニヤぁぁあああ！！！"
"70008030-106-魑魅一座の門番" = "リーダー！大変です！百花繚乱が乱入してきました！"
"70008030-108-喧騒流のリーダー" = "忍者の次は百花繚乱だと！？"
"70008030-112-変転流のリーダー" = "にっ、逃げろーっ！"
"70008030-120-初志貫徹流のリーダー" = "お、落ち着いてください！数はこちらが上です！連携すれば我々にも勝機が……！"
"70008030-121-イズナ" = "悪の親玉、発見です！お覚悟……っ！"
"70008030-122-初志貫徹流のリーダー" = "痛っ！！うわああん！せっかく皆を集めたのに！"
"70008030-123-初志貫徹流のリーダー" = "もう知らないんだからー！"
"70008030-135-アラタ" = "はぁはぁ……逃げ切れた……。"
"70008030-136-アラタ" = "あたしは魑魅一座らしい人間になりたかっただけなのに！どうしてこんなことに……。"
"70008030-137-アラタ" = "魑魅一座・路上流のリーダー……#nアラタ……お前は何がしたいんだ……？"
"70008030-138-アラタ" = "くっ……こんなお面――っ！"
"70008030-139-？？？" = "そこのあんた。"
"70008030-140-アラタ" = "この声は……。"
"70008030-141-アラタ" = "ああ、お面を貸してくれたお姉さまか――"
"70008030-142-ラブ" = "貸した？奪われたの間違いでしょ？"
"70008030-143-ラブ" = "ヘルメット団たるもの、ヘルメットなくしちゃダメでしょ！……ほんと、予備のヘルメットがあってよかったわ。"
"70008030-144-ラブ" = "うちの大事なヘルメット、無事なのよね？"
"70008030-145-アラタ" = "奪って悪かったな……はいよ。"
"70008030-150-ラブ" = "え、ああ、どうも。なんだ、すんなり返してくれるんだ。"
"70008030-155-ラブ" = "はぁ……。#n見つけたら復讐してやるって思ってたのに――"
"70008030-156-ラブ" = "あんたの落ち込みをみたら、そんな気分でもなくなったわね。#n何があったのよ。"
"70008030-157-アラタ" = "話してどうなるもんでもねぇよ。"
"70008030-158-ラブ" = "分からないじゃない。話すだけでも案外スッキリするものよ。"
"70008030-159-アラタ" = "……魑魅一座らしさって何だと思う……？"
"70008030-160-ラブ" = "魑魅一座？なにそれ？"
"70008030-161-アラタ" = "だよな……。"
"70008030-167-ラブ" = "魑魅一座か何だか知らないけど、この町で暮らしてるんだよね？"
"70008030-168-ラブ" = "だったら、普通に楽しんだら？"
"70008030-169-アラタ" = "普通に……楽しむ……か。"
"70008030-170-ラブ" = "勉強とか部活とか、めんどくさいんでしょ？"
"70008030-171-アラタ" = "そりゃ、まぁ……。"
"70008030-172-ラブ" = "やりたいことをやって、やりたくないことはやらない。それだけよ。"
"70008030-173-アラタ" = "ま……たしかにそうかもな……。"
"70008030-174-ラブ" = "それはそれとして――"
"70008030-175-ラブ" = "ヘルメットを奪われた……違う、貸してあげた対価をもらわないとね。"
"70008030-176-アラタ" = "ええっ！？お金なんてあるわけないだろう！"
"70008030-177-ラブ" = "話は最後まで聞きなさい！#n百鬼夜行の案内をしてくれれば、それでチャラにしてあげる。"
"70008030-178-ラブ" = "初めて来たんだけど……何の下調べもしてないのよね。"
"70008030-179-アラタ" = "えっ、じゃあ神木展望台にもまだ行ってねぇのか？"
"70008030-180-ラブ" = "神木？あの大きな木のこと？"
"70008030-181-アラタ" = "あそこは百鬼夜行の必須コースなんだよ！"
"70008030-182-アラタ" = "仕方ねぇ。百鬼夜行の案内、このあたしに任せておきな！"
"70008030-183-ラブ" = "復活早いわね。"
"70008030-184-アラタ" = "こうしちゃいられねぇ！早く行くぞ！"
"70008030-185-アラタ" = "まずは展望台だ！#n日が落ちてからもいいけど、落ちる前も絶景なんだ！！"
"70008030-186-ラブ" = "ちょっ、置いてかないでってば！"
"70008030-188" = "もしかしたら、毎日新たな楽しみを求めるアラタこそ、最も魑魅一座らしいのかもしれない。"
"70008030-189" = "今や誰も覚えていないが……かつてその言葉は「何にも縛られぬ者たち」を指していた。その言葉こそ――「魑魅一座」である。"
"70008030-190" = "何にも縛られぬ者たち"
