[translation]
"70008020-1" = "何にも縛られぬ者たち（２）"
"70008020-4-ナグサ" = "あ。"
"70008020-5-アラタ" = "ひっ。"
"70008020-6-アラタ" = "なんでこんなときにまで……！"
"70008020-7-ナグサ" = "……。"
"70008020-8-ナグサ" = "はぁ……。"
"70008020-9-アラタ" = "な、何だよ、その反応は！"
"70008020-10-ナグサ" = "今度は何をやらかしたの？"
"70008020-11-アラタ" = "まだ何もしてない！！"
"70008020-12-ナグサ" = "まだ……？"
"70008020-13-アラタ" = "ゆっ、誘導尋問だ！"
"70008020-14-ナグサ" = "……ちょっと調べさせて。"
"70008020-15-アラタ" = "いや、今日は本当に何もしてない……ってか、急いでて――"
"70008020-19-？？？" = "その声は……アラタだね？"
"70008020-21-商人A" = "おや本当だ。友達も連れてきてくれたのかい？"
"70008020-22-商人B" = "すまないねぇ、今日は頼むことがないんだ。"
"70008020-27-ナグサ" = "……知り合い？"
"70008020-28-アラタ" = "小遣いのために、お使いしただけ。"
"70008020-29-アラタ" = "お祭りにはお金がいるからな……。"
"70008020-31-商人A" = "まぁまぁ、寄っていきなぁ。羊羹があるんだよ。お茶も用意しようねぇ。"
"70008020-32-魑魅一座A" = "いいんですか！？リーダー、どうします？"
"70008020-34-アラタ" = "ばか！あほ！どうしたもこうしたもねぇ！"
"70008020-36-魑魅一座A" = "あ、そうだった……ごめん、今日はちょっと急いでて……。"
"70008020-37-商人A" = "そうかいそうかい。お腹がすいたら、いつでも来るんだよ。"
"70008020-42-商人B" = "やんちゃなところもあるけど、本当は良い子たちなんだ。"
"70008020-43-ナグサ" = "あ……はい。"
"70008020-44-商人B" = "百鬼夜行同士なんだから、みんな仲良くしなね。"
"70008020-46-アラタ" = "しっ！しっ！！早く行っちまえ！！"
"70008020-48-商人A" = "アラタ、照れ隠しもほどほどに――"
"70008020-49-商人B" = "ささ、後は若い者に任せて。私たちは退散するとしよう。"
"70008020-53-ナグサ" = "ふ～ん？"
"70008020-58-ナグサ" = "仲良くする？"
"70008020-59-アラタ" = "するかよ！！"
"70008020-60-アラタ" = "百花繚乱と仲良くなんて、まっぴらごめんだね！！"
"70008020-65-魑魅一座" = "リーダー！置いてかないでくださいよ～！"
"70008020-72-アラタ" = "はぁ、はぁ、撒いたか……？"
"70008020-73-アラタ" = "あれっ？#n今日は別に、逃げなくてもよかったんじゃ……。"
"70008020-78-魑魅一座A" = "はぁ、はぁ……リーダー、足速くなったよね……。"
"70008020-79-魑魅一座B" = "逃げ回ってばっかだもんね……。"
"70008020-80-アラタ" = "うるさい！速くなるのはいいことだろうが！"
"70008020-81-魑魅一座A" = "でも……さっきの話、よかったんじゃないですか？"
"70008020-82-アラタ" = "なにが？"
"70008020-83-魑魅一座A" = "百花繚乱と仲良くする、って。そうすれば、逃げる必要なくなりますよね？"
"70008020-84-魑魅一座B" = "たしかに。百花繚乱はエリートだし、お祭りの金券とかもらえるかも？"
"70008020-85-アラタ" = "それ、本気で言ってんのか……！？"
"70008020-87-魑魅一座A" = "そこまで怒らなくても……。"
"70008020-88-アラタ" = "いいか？魑魅一座と百花繚乱は何があっても仲良くできない。そう決まってるんだ！"
"70008020-90-魑魅一座B" = "え……そんなの、誰が決めたんです……？"
"70008020-91-アラタ" = "そ、それは……最初からだよ！！そう決めた人はな……！"
"70008020-92-アラタ" = "……。"
"70008020-93-アラタ" = "ともかく！そんな間抜けな話は二度とするなよな！！"
"70008020-95-魑魅一座A" = "……リーダーもよく知らないっぽいね？"
"70008020-96-魑魅一座B" = "あんま聞かないであげよう。"
"70008020-98-アラタ" = "はぁ……あいつのせいで無駄な時間を食っちまったな。"
"70008020-99-アラタ" = "商店街は地味なのばっかだし……目を引く、特別なお面はねぇのか……？"
"70008020-100-？？？" = "百鬼夜行って、全部が観光地なんじゃないの？"
"70008020-101-？？？" = "こんなことなら下調べしてくるんだったわね……。"
"70008020-105-アラタ" = "……あれだ！"
"70008020-106-アラタ" = "見つけたぞ！！"
"70008020-112-ラブ" = "ん？"
"70008020-113-ラブ" = "えっ……えっ！？なに！？"
