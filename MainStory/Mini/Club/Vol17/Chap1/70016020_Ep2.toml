[translation]
"70016020-1" = "竜宮への道（２）"
"70016020-3-ナナミ" = "ふふ～ん、ふふふ～ん～♪"
"70016020-4-ナナミ" = "ザネームオブザシップワズザッ、ビリオブティ～♪"
"70016020-9-トラックの運転手G" = "ああっ、ダッシュボードには足を乗せないでください。"
"70016020-10-ナナミ" = "ん？"
"70016020-11-ナナミ" = "心配ない！このブーツは新品同然だ！"
"70016020-12-トラックの運転手G" = "そうじゃなくて、危ないので！事故が起きたらエアバッグも出てきますし。"
"70016020-13-ナナミ" = "えあばっぐ？"
"70016020-14-ナナミ" = "……よく分からぬが、舵取りの言うことだ。従っておくとしよう。"
"70016020-15-トラックの運転手G" = "（……もしかして、一度も車に乗ったことないのかな？）"
"70016020-16-トラックの運転手G" = "そういえば……さっきにおいがするって言ってましたけど、大丈夫ですか？"
"70016020-17-ナナミ" = "大丈夫に決まっているだろう！むしろ……磯の香りを嗅ぐと、心が落ち着く。"
"70016020-18-トラックの運転手G" = "海が好きなんですね。こんな時間に突然海に行こうだなんて。"
"70016020-19-ナナミ" = "突然ではない！余は本来の居場所に帰るだけだ！"
"70016020-20-トラックの運転手G" = "海に……帰る……？"
"70016020-21-トラックの運転手G" = "はは、まるで童話に出てくる竜宮の使者みたいですね。"
"70016020-22-トラックの運転手G" = "竜王様のところに行くと思うと、なんだか楽しくなってきました。"
"70016020-23-ナナミ" = "ん？お主は竜王が怖くないのか？"
"70016020-24-トラックの運転手G" = "怖い？何故ですか？"
"70016020-25-トラックの運転手G" = "童話にもよくあるじゃないですか。#n困っているカメを海へ連れていったら、竜王様が願いを叶えてくれたとか――"
"70016020-26-トラックの運転手G" = "そんな話を聞いたら……怖いどころか、むしろ会ってみたいくらいです。"
"70016020-27-ナナミ" = "ふむ……お主にも願いがある、と。"
"70016020-28-トラックの運転手G" = "そりゃあ、もちろん。まあ、地味な願いではありますが……。"
"70016020-29-トラックの運転手G" = "……お金の心配をしなくてもいい人生を送りたい、とか。"
"70016020-30-トラックの運転手G" = "もっと余裕のある……いや、せめてまともな生活ができるくらい稼げたらと思いますよ。"
"70016020-31-ナナミ" = "……。"
"70016020-32-トラックの運転手G" = "……すみません。こんなつまらない話なんて聞きたくないですよね？"
"70016020-33-ナナミ" = "いいや、そういう話は大好物だ！欲望こそ人間を動かす原動力だからな！"
"70016020-34-ナナミ" = "なるほど。陸地の人間は、竜王に対してそんなことを思っているのか。"
"70016020-41-ナナミ" = "……うん？ここはどこだ？海はさっきの分かれ道を曲がった先だが……。"
"70016020-42-ナナミ" = "まさか余を騙したのでは――"
"70016020-43-トラックの運転手G" = "いえ、まず今日の仕事を終わらせないといけなくて……。#nちょっと事務所に寄ってるんです。"
"70016020-44-トラックの運転手G" = "すぐ戻ってくるので、ここで待っていてください。#nラジオ壊れちゃってるから、暇を潰せるものがなくて申し訳ないですが……。"
"70016020-48-トラックの運転手G" = "うわっ、もうこんな時間だ！とにかく、じっとしていてくださいね！"
"70016020-52-ナナミ" = "……ふーむ。"
"70016020-53-ナナミ" = "……ふむ。"
"70016020-54-ナナミ" = "……さっきまで悠々自適に揺蕩うクラゲのようだったのに、#n今はまるでサメに遭遇したアジのようだな。"
"70016020-60-運送業者の社長" = "6番トラック！出てこい！"
"70016020-64-6番トラックの運転手" = "は、はいっ！！"
"70016020-65-運送業者の社長" = "なんだ、これ？タイヤ交換の請求書？"
"70016020-66-6番トラックの運転手" = "は、はい。タイヤの摩耗が酷くて……。"
"70016020-67-運送業者の社長" = "はあ？破れてもねぇし、まだ使えんだろ！勝手なことしてんじゃねぇ！"
"70016020-68-6番トラックの運転手" = "破れたりなんかしたら、それこそ大事故ですよ……。"
"70016020-69-運送業者の社長" = "破れたら、な。許可なく変えた分は給料から引いておくから。"
"70016020-70-6番トラックの運転手" = "そんな……！"
"70016020-71-運送業者の社長" = "次！3番トラック！#nその程度の積載量で、よくサービスエリアで仮眠なんてできたな！この穀潰しが！"
"70016020-72-3番トラックの運転手" = "このトラックでこれ以上載せたら違反になっちゃいますよ……。#n罰金だって、俺たちの給料で賄ってるのに……。"
"70016020-73-3番トラックの運転手" = "仮眠っていったって、3徹で走ってたんですよ！？#n1時間の休憩も許されないんですか！？"
"70016020-74-運送業者の社長" = "だったらもっとスピード出してさっさと終わらせろ！規制も振り切れて一石二鳥だろ？"
"70016020-75-運送業者の社長" = "怠けた分は給料から引くからな！"
"70016020-76-運送業者の社長" = "次！7番トラック！どこだ！"
"70016020-77-トラックの運転手G" = "は、はい！ただいま！"
"70016020-78-運送業者の社長" = "とっくに時間は過ぎてんのに……いいご身分だな？"
"70016020-82-運送業者の社長" = "つーか、どこでオイルを無駄遣いしてきた！？#n御大層にディーゼルなんて入れやがって！"
"70016020-83-トラックの運転手G" = "ディーゼル車にディーゼルオイルを入れて何が悪いんですか……。"
"70016020-84-運送業者の社長" = "もっと安い灯油を使えって言ってるだろ！#nオイルは土を掘りゃ出てくると思ってんのか！？"
"70016020-86-3番トラックの運転手" = "（石油なんだから、土を掘れば出るだろ……）"
"70016020-87-6番トラックの運転手" = "（クソ！給料もまともに払わないくせに……！）"
"70016020-89-運送業者の社長" = "お前、クビになりてぇのか？#n今までの前払い分の給料、全部ここで吐き出してもらってもいいんだぜ？"
"70016020-93-トラックの運転手G" = "くっ！……お願いです、それだけは……。"
"70016020-99-ナナミ" = "なぜ動かぬ陸地で吐き出す必要がある？めまいでもするのか？"
"70016020-100-ナナミ" = "そういうときは何かを噛めばよくなる。干し肉でも口にするといい。"
"70016020-105-トラックの運転手G" = "ちょ、ちょっと！待っていてくださいって言いましたよね！？"
"70016020-106-運送業者の社長" = "ああん？誰だお前は？"
"70016020-108-ナナミ" = "何をやっているかは知らぬが、早く終わらせてくれ。#nこの者は余を海へ連れていかねばならんのだ。"
"70016020-110-運送業者の社長" = "おいおい、今度はタクシーの副業か？勝手に客を取りやがって。"
"70016020-111-トラックの運転手G" = "い、いえ！道端で一人だったので、可哀想に思って乗せただけですよ……。"
"70016020-112-運送業者の社長" = "はあ？タダで？じゃあ、その分のオイルを使っちまったってことだな！？"
"70016020-113-運送業者の社長" = "おい、嬢ちゃん。この世にタダのモンなんてねぇんだ。#nここまで乗せてやったんだから、何か払うべきだよなぁ？"
"70016020-114-トラックの運転手G" = "この子は無関係ですよ……！？"
"70016020-119-ナナミ" = "当然だ。"
"70016020-120-運送業者の社長" = "……はあ？"
"70016020-121-ナナミ" = "この世にタダのものなどないことは、陸に限った話ではない。余もよく知っている。#n親切にしてくれた者を手ぶらで帰らせるつもりはない。"
"70016020-122-ナナミ" = "お主がここの船長か？なら、2人で話がしたい。場所を変えよう。"
"70016020-123-ナナミ" = "それか、ここで話そうか？お主は他の者と利益を分け合うタイプには見えぬが。"
"70016020-124-運送業者の社長" = "……どういうつもりだ？"
"70016020-125-ナナミ" = "何か支払うべき、と言ったではないか。余が持っているものなら、いくらでも与えよう。"
"70016020-126-ナナミ" = "どちらにせよ、話を聞いてもお主が損をすることはあるまい。#nここで雑魚相手に端銭をむしり取るよりはな。"
"70016020-127-運送業者の社長" = "……。"
"70016020-131-運送業者の社長" = "おい、全員仕事に戻れ。"
"70016020-132-運送業者の社長" = "嬢ちゃんは事務室に来な。"
"70016020-133-ナナミ" = "ふふ、話が早くて助かる。"
"70016020-142-トラックの運転手G" = "一体どうするつもりなんだ……？どう見ても一文無しにしか見えないのに……。"
"70016020-152-トラックの運転手G" = "疲れてるし、もう帰りたいけど……あの子が心配だ……。"
"70016020-163-運送業者の社長" = "いやいや、ドアなんて私めが開けますから！お荷物も多いでしょう！"
"70016020-164-ナナミ" = "そこまで媚びへつらわなくてよい。"
"70016020-165-運送業者の社長" = "さ、左様ですか。へへ……。"
"70016020-166-運送業者の社長" = "では、私めの車でご案内しましょうか？トラックなんかにお乗せするわけには……。"
"70016020-167-ナナミ" = "いや、いい。どんな車に乗って、誰と一緒に行くかは、すでに話を通してある。"
"70016020-168-ナナミ" = "船人は警戒心が強い。知らない人間がいては怪しまれるぞ。"
"70016020-169-運送業者の社長" = "な、なるほど！おい、7番トラック！この方を海まで案内しろ！"
"70016020-171-トラックの運転手G" = "えっと……お嬢さんがお金を払ったということですか？"
"70016020-173-運送業者の社長" = "お前には関係ねぇだろ！いいから、何も聞かずに案内しとけ！"
"70016020-174-ナナミ" = "いざ行かん、海へ！"
"70016020-179-トラックの運転手G" = "わ、分かりましたよ……。"
"70016020-185-トラックの運転手G" = "……。"
"70016020-186-ナナミ" = "おお！海の匂いだ！近づいてきたぞ！"
"70016020-187-トラックの運転手G" = "……。"
"70016020-188-ナナミ" = "……。"
"70016020-189-ナナミ" = "ふむ。何も聞かんのか？"
"70016020-190-トラックの運転手G" = "社長から何も聞くなって言われましたから。"
"70016020-191-ナナミ" = "なら、ここからは余の独り言だ。"
"70016020-192-ナナミ" = "お主はそのまま聞いていればよい。"
"70016020-193-ナナミ" = "海は人と違い……透明で、本音を隠さぬ。"
"70016020-194-ナナミ" = "絶えず渦巻き、己の全てをさらけ出しているが、陸地の人間は聞く耳すら持たない。"
"70016020-195-ナナミ" = "余が海から聞いたことをありのまま話すと、#nまるで初めて聞いたような顔をする始末だ。"
"70016020-196-トラックの運転手G" = "……。"
"70016020-197-ナナミ" = "それゆえ……#n余が知っている話に、相手が聞きたい話を混ぜて話せば……#n何の疑いもせず信じてしまう。"
"70016020-198-トラックの運転手G" = "一体、どんな話を……？"
"70016020-199-ナナミ" = "ようやく気になってきたか？なら教えてやろう。お主は知っておいた方がいい。"
"70016020-200-ナナミ" = "さっき、分かれ道の先に海が見えたが……そこに[ruby=しゅんせつせん]浚渫船[/ruby]があった。"
"70016020-201-ナナミ" = "また、海岸の地形からして……クジラがよく遊びにきていると推察できる。"
"70016020-202-トラックの運転手G" = "え、ええ。たしかにそうです。でもどうして？ここに来るのは初めてでしたよね？"
"70016020-203-ナナミ" = "言っただろう。すべて海が話してくれると。これが「余が知っている話」だ。"
"70016020-204-ナナミ" = "それで余はこう話した――浚渫船の砂にクジラの[ruby=りゅうぜんこう]龍涎香[/ruby]が混ざっていると。"
"70016020-205-ナナミ" = "だが、龍涎香は想定外の副産物。#nそのため、こっそり処理してくれる業者を探している……#nそうお主の社長に言ってやったのだ。"
"70016020-206-ナナミ" = "少額の手数料を支払うだけで、手間をかけることなく多額の銭を手に入れられる。"
"70016020-207-ナナミ" = "これが、「相手が聞きたかった話」だ。陸地の人間はこういう話に弱い。"
"70016020-208-ナナミ" = "そうして、最初の代価を前払いで受け取ってきた。仲介人に払う分と言ってな。"
"70016020-209-ナナミ" = "どうだ。思ったより大したことないだろう？"
"70016020-210-トラックの運転手G" = "大したことないって、とんでもない話ですよ……。"
"70016020-211-トラックの運転手G" = "（海に行きたいって言ったのも、結局これのためだったのか？）"
"70016020-216-ナナミ" = "ふっふっふっ！"
"70016020-217-ナナミ" = "海だ！ちょうど朝日も昇っておる！よし！"
"70016020-218-ナナミ" = "止まれ、止まれ！両舷停止だ！ははは！"
"70016020-219-トラックの運転手G" = "あ、危ない！まだ走ってるんですから、ドアを開けないでください！"
"70016020-231-ナナミ" = "すぅ～、はぁ～……。"
"70016020-232-ナナミ" = "果敢に進む小舟を打ち払う波、導きの風……。"
"70016020-236-ナナミ" = "海よ、竜王が帰ってきた。"
"70016020-241-トラックの運転手G" = "あれ？浚渫船はあっちですけど、約束の場所はここでいいんですか？"
"70016020-242-トラックの運転手G" = "風も強いし、車の中で待ちましょう。体が冷えちゃいます。"
"70016020-243-ナナミ" = "強すぎる風も、約束もない。それに――"
"70016020-247-ナナミ" = "竜王が、海を怖がるとでも？"
"70016020-251-トラックの運転手G" = "はい！？じゃあ、社長に言ったのって全部……？"
"70016020-253-ナナミ" = "仮にそんな話があったとして、彼奴に教える必要がどこにある？#n舵を取り、余をここまで連れてきてくれたのはお主だろう？"
"70016020-254-ナナミ" = "おかげで助かった。海から離れると、どうにも気が滅入ってしまうからな。"
"70016020-255-ナナミ" = "そういえば、お主は竜王の話をしていたな。#n親切のお礼として、願いを聞いてくれる竜王様に会いたいと。"
"70016020-256-ナナミ" = "彼奴から受け取った銭は車に置いてある。どうせ弱い者からむしり取ったものだろう。#nそれを持ってどこかへ行けば、しばらくは何も気にせず生きていけるはずだ。"
"70016020-257-トラックの運転手G" = "で、でも……そんなの、犯罪ですよ……それに……。"
"70016020-258-ナナミ" = "やれやれ、困ったやつだ。"
"70016020-259-ナナミ" = "あの童話を、本当に最後まで読んだのか？"
"70016020-260-ナナミ" = "願いには対価がつくもの。竜王と関わったものはみな、いずれ不幸になるのだ。"
"70016020-264-ナナミ" = "目の前の幸せを掴まぬなら、#nいっそ最初から関わらなければよかったと思うようになるぞ。"
"70016020-265-トラックの運転手G" = "そ、そんな……。"
"70016020-266-ナナミ" = "ああ、そういえばまだ名乗っていなかったな。"
"70016020-267-ナナミ" = "余はキヴォトスの大洋を支配する竜王であり、風と波を治める潮水の蛟龍――"
"70016020-271-ラジオニュース" = "続いてのニュースです……。"
"70016020-272-ラジオニュース" = "脱獄犯、[ruby=ごのかみ]護守[/ruby]ナナミ……非常に暴力性のある……危険人物です。"
"70016020-275-ラジオニュース" = "目撃した場合……至急、通報してくださ――"
"70016020-276" = "竜宮への道"
