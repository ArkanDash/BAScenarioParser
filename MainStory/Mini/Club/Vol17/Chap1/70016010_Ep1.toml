[translation]
"70016010-1" = "竜宮への道（１）"
"70016010-2-ラジオニュース" = "本日ヴァルキューレ矯正局にて発生した集団脱獄事件に関して、新情報が入りました。"
"70016010-3-ラジオニュース" = "脱走した囚人は計7人で、#n連邦生徒会長失踪の混乱に乗じて脱獄を決行したとのことです。"
"70016010-4-ラジオニュース" = "ヴァルキューレ警察学校は、周囲の全エリアに対し最高レベルの厳戒態勢を――"
"70016010-5-？？？" = "どのチャンネルも、脱獄事件の話ばかりですね。"
"70016010-6-？？？" = "この時間は、クラシック音楽番組を楽しむ予定だったのに……。"
"70016010-7-ラジオニュース" = "……ただいま、ヴァル……矯……局が、緊急声明を……。"
"70016010-8-？？？" = "おや、やっと電波の届かないところまで来ましたか。#nそれでは、ここで解散するとしましょう。"
"70016010-9-アケミ" = "ふう……ようやくちゃんと息ができますわ。"
"70016010-10-アケミ" = "酸素が多すぎて有酸素運動になってしまわないか心配でしたが……。#nやっぱりシャバの空気はいいものですね。"
"70016010-11-ニヤニヤ教授" = "これから何を？"
"70016010-12-アケミ" = "そうですね……まずは、旧友に会いに行こうかと。"
"70016010-13-アケミ" = "獄中生活で筋肉が減ってしまいましたので、#nヘルメット団でラットプルダウンがしたいですわ。"
"70016010-14-ニヤニヤ教授" = "おやおや。それは楽しい旅になりそうですね。"
"70016010-15-ニヤニヤ教授" = "こういう場合、普通は感謝の言葉を述べるものだが……。"
"70016010-16-ニヤニヤ教授" = "似合わないことはやめておいた方がいいですよ。#nそれに、あなたに普通は求めていません。"
"70016010-17-カイ" = "ククッ……理解が早くて助かるよ。"
"70016010-18-ニヤニヤ教授" = "それで？これからどうしますか？"
"70016010-19-カイ" = "……そうさな、いくつか考えていたんだが――"
"70016010-20-カイ" = "まずは古き恩を返そうと思っている。それが、[ruby=・]道[/ruby][ruby=・]理[/ruby]というものだろう？"
"70016010-21-ニヤニヤ教授" = "……あなたが世の道理を語る際は、他人にそれを当てはめる時だけ。"
"70016010-22-ニヤニヤ教授" = "誰のことを言っているのかは、大方予想がつきますが……。"
"70016010-23-ニヤニヤ教授" = "いえ、これ以上は余計なお世話ですね。"
"70016010-24-カイ" = "よく分かっているじゃあないか。"
"70016010-25-ニヤニヤ教授" = "ええ、ではよい恩返しを。"
"70016010-26-ニヤニヤ教授" = "さて……。"
"70016010-27-ニヤニヤ教授" = "ほむ、あなたは降りないのですか？"
"70016010-28-ニヤニヤ教授" = "早く出たほうがよいかと。じきに設置した爆弾が爆発します。"
"70016010-29-ナナミ" = "ここはどこだ……？せめて、海に近いところで降ろしてくれ……。"
"70016010-30-ニヤニヤ教授" = "私はコンサルタントです。#nお手伝いをしてあげることもありますが、運転手ではありませんので。"
"70016010-31-ニヤニヤ教授" = "それに、この車は追跡されています。これ以上の走行は危険ですよ。"
"70016010-32-ナナミ" = "な、なら！余はどうすればいいのだ！ここがどこかも分からぬし、銭すら……。"
"70016010-33-ニヤニヤ教授" = "あなたはキヴォトスの大洋を恐怖で震え上がらせた#n「[ruby=ちょうすい]潮水[/ruby]の[ruby=こうりゅう]蛟龍[/ruby]」なのでしょう？#nそのくらい、一人で何とかできると思いますが。"
"70016010-34-ニヤニヤ教授" = "私は秒刻みのスケジュールで動いています。#nこれ以上あなたに時間を割くことはできません。それでは。"
"70016010-35-ナナミ" = "うぅ……。"
"70016010-36-ニヤニヤ教授" = "そうだ。矯正局で鏡くらいは見たことがあるでしょう？"
"70016010-37-ニヤニヤ教授" = "あなたの容姿は目立ちます。#n今ヴァルキューレは血眼になって私たちを探しているので、#nくれぐれも正体は隠しておいた方がいいでしょう。"
"70016010-38-ニヤニヤ教授" = "最後に忠告しておきますが、私のことは探らないように。#nこの借りを返して欲しいときは、私の方から会いに行くので。"
"70016010-39" = "……。"
"70016010-40-ナナミ" = "海は……どこだ……。"
"70016010-41-ナナミ" = "……行ったか。"
"70016010-42-ナナミ" = "港を探さなくては……だが、ここでは明るすぎて星も見えん……。"
"70016010-43-ナナミ" = "風も……建物が邪魔でとても読めんぞ……。"
"70016010-44-ナナミ" = "……やはり陸地は嫌いだ。海……海はどこだ！？"
"70016010-45-ナナミ" = "海が余を待っているのだ！こんなところで時間を浪費するわけには――！"
"70016010-46-ラーメン屋の店主" = "あいよ！豚骨ラーメンに、ニンニクましまし！"
"70016010-47-ナナミ" = "（うぅ……）"
"70016010-48-ナナミ" = "（陸地の食物の分際でやたらといい匂いをさせよって。#n……やはり腹を満たしてから脱獄すべきだったか）"
"70016010-49-ナナミ" = "（欲しい……だが、銭が……）"
"70016010-50-ナナミ" = "（いや、海では皆が余に食物を貢いできたではないか！気にすることなどない！）"
"70016010-51-ナナミ" = "誰か――！"
"70016010-52-コノカ" = "はあ……ただでさえ忙しいのに脱獄事件ってさぁ……。"
"70016010-53-公安局の生徒" = "気持ちは分かりますけど……。#n今日初めての食事なんですから、ちゃんと食べましょうよコノカ[ruby=・]さ[/ruby][ruby=・]ん[/ruby]。"
"70016010-54-コノカ" = "コノカさぁ～ん！？あたしが降格したからって、友達気取りかぁ！？"
"70016010-55-公安局の生徒" = "じょ、冗談ですって！うぎゃー！暴力反対っ！！"
"70016010-56-コノカ" = "脱獄者の代わりに、お前を病院送りにしてもいいんだけどなぁ？"
"70016010-57-公安局の生徒" = "お、お巡りさーん！あ、私たちか……。"
"70016010-58-ナナミ" = "（ヴァルキューレ……！）"
"70016010-59-ナナミ" = "（あれはたしか……陸地のトライデントのような存在だったはず。まずい！）"
"70016010-60-コノカ" = "ん？誰か呼んだ？"
"70016010-61-公安局の生徒" = "え？今度は幻聴っすか？"
"70016010-62-コノカ" = "んー、ここ数日寝てないからそのせいかも……。"
"70016010-63-公安局の生徒" = "ファイトっすよ、[ruby=・]元[/ruby]副局長！#n降格なんてもう慣れっこじゃないですか！"
"70016010-64" = "なぁにが慣れっこだ！まだ怒られ足りねぇみたいだなぁ？"
"70016010-65-ナナミ" = "まったく、どこへ行っても警察ばかり……。"
"70016010-66-ナナミ" = "あのヴァルキューレとかいうやつら、次から次へと……！#nまるでフナムシではないか！"
"70016010-67-ナナミ" = "いや、フナムシは磯の香りがする分いくらかマシだな……。#n土臭いやつらに捕まるのはまっぴらごめんだぞ！"
"70016010-68-ナナミ" = "だが、このまま海まで歩いていくのは難しいか……。"
"70016010-69-ナナミ" = "……そうだ！"
"70016010-70-ナナミ" = "矯正局のテレビで、車にタダで乗れる方法を観たことがあるぞ。たしか……。"
"70016010-71-ナナミ" = "こうして道路沿いで……親指を立てる！"
"70016010-72-ナナミ" = "……片腕でいいんだよな？それとも両腕？"
"70016010-73-ナナミ" = "おお、来た！"
"70016010-74-ナナミ" = "そこの者！地べたを這い回る下賤の民よ。#nこの身に仕える栄誉を授けてやろう！"
"70016010-75-ナナミ" = "ただちに止まってこうべを垂れるが――"
"70016010-76-ナナミ" = "およ……！？"
"70016010-77-ナナミ" = "やはり、両腕だったか？"
"70016010-78-ナナミ" = "うぅ……腕が痺れる……。"
"70016010-79-ナナミ" = "ま、待てぇ……！"
"70016010-80-ナナミ" = "うぅ……喉が渇いたぞ……腹の虫も鳴ってきた……。"
"70016010-81-ナナミ" = "止まった！"
"70016010-82-トラックの運転手A" = "おっ、ヒッチハイクか。どこまで行くんだい？"
"70016010-83-ナナミ" = "不敬だぞ！余を走らせよったな！"
"70016010-84-トラックの運転手A" = "ふ、ふけい？"
"70016010-85-ナナミ" = "こうして竜王が呼んでおるのだ。貴様の方から馳せ参じるのが筋であろう！#nここが海ならば板歩きの刑だぞ！"
"70016010-86-トラックの運転手A" = "竜王……？海……？"
"70016010-87-トラックの運転手A" = "そういえば、見ない格好をしているね。どこか遠くの学園から来たのかな？"
"70016010-88-ナナミ" = "ふん。知らぬなら教えてやろう。余こそは潮水の蛟――"
"70016010-89-ニヤニヤ教授" = "そうだ。矯正局で鏡くらいは見たことがあるでしょう？"
"70016010-90-ニヤニヤ教授" = "あなたの容姿は目立ちます。#n今ヴァルキューレは血眼になって私たちを探しているので、#nくれぐれも正体は隠しておいた方がいいでしょう。"
"70016010-91-ナナミ" = "こう……。"
"70016010-92-トラックの運転手A" = "こう？"
"70016010-93-ナナミ" = "……高等学校に通う普通の生徒である。"
"70016010-94-トラックの運転手A" = "……。"
"70016010-95-トラックの運転手A" = "親切に乗せてやろうとしてるのに、その態度はなんだ？#n一人で歩いてるんだな！"
"70016010-96-ナナミ" = "あっ、えっ……。"
"70016010-97-ナナミ" = "ま、待てぇ～！"
"70016010-98-ナナミ" = "そうだ。正体を隠さねばならんのだった……。"
"70016010-99-ナナミ" = "次からは気をつけよう。矯正局に逆戻りは御免だからな。"
"70016010-100-ナナミ" = "できるだけ話さぬようにせねば……。"
"70016010-101-ナナミ" = "……来た！"
"70016010-102-トラックの運転手B" = "なんだ、ヒッチハイクか？"
"70016010-103-ナナミ" = "（余計なことを言えば疑われる）"
"70016010-104-ナナミ" = "（怪しまれないよう、慎重に……）"
"70016010-105-ナナミ" = "ふ、ふふ……。"
"70016010-106-ナナミ" = "さあ、どうかな……。"
"70016010-107-トラックの運転手B" = "はあ？"
"70016010-108-トラックの運転手B" = "ヒッチハイクじゃないの？"
"70016010-109-ナナミ" = "あ、えと……。"
"70016010-110-トラックの運転手B" = "ったく、いたずらか。こっちは急いでるんだよ！"
"70016010-111-ナナミ" = "あ、ああっ……。"
"70016010-112-バス運転手" = "あの、お客さん？"
"70016010-113-ナナミ" = "ん……？"
"70016010-114-バス運転手" = "乗らないんですか？今日最後のバスですよ。"
"70016010-115-ナナミ" = "えっと、その……。"
"70016010-116-ナナミ" = "よ、余がこんな下賤[ruby=はしけ]な艀に[/ruby]など乗るものか！"
"70016010-117-ナナミ" = "まあ……タダで乗せるというのなら、考えてやらんこともない。"
"70016010-118-バス運転手" = "……。"
"70016010-119-バス運転手" = "あ、そうですか。"
"70016010-120-ナナミ" = "うぅ……これだから陸は……。"
"70016010-121-ナナミ" = "風も波もない上……何をするにも銭、銭、銭……。"
"70016010-122-ナナミ" = "早く海に帰らねば……。"
"70016010-123-ナナミ" = "スヤ……。"
"70016010-124-ナナミ" = "おわあっ！？"
"70016010-125-トラックの運転手G" = "お嬢さん、どうされました？"
"70016010-126-トラックの運転手G" = "こんなところで居眠りして……大丈夫ですか？"
"70016010-127-ナナミ" = "び、びっくりした……！よ、余を驚かせるとは……無礼だぞ！"
"70016010-128-ナナミ" = "……うん？これは……磯の香り！"
"70016010-129-ナナミ" = "おい、この車は海に向かうのか？"
"70016010-130-トラックの運転手G" = "磯の香り？ああ、さっき魚を載せたからかな。"
"70016010-131-トラックの運転手G" = "一応海の方には行きますが……。"
"70016010-132-トラックの運転手G" = "鐘崎港でよければ、お嬢さんも乗っていきます？"
"70016010-133-ナナミ" = "よい、よい！海であればどこでもな！"
"70016010-134-ナナミ" = "……よいしょっ！"
"70016010-135-ナナミ" = "では、しゅっこ――いや、出発だ！"
"70016010-136-トラックの運転手G" = "（海ならどこでもいいって……）"
"70016010-137-トラックの運転手G" = "（何かの悩み事でもあるのかな。青春だねぇ）"
"70016010-138-トラックの運転手G" = "はいはい、出発しますよ。"
"70016010-139-トラックの運転手G" = "海までは時間がかかるので、ゆっくりしていてくださいね。"
"70016010-140-ナナミ" = "ああ！待つのは問題ない！早いに越したことはないがな！"
