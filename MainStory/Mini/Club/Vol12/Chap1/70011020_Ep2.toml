[translation]
"70011020-1" = "監原ミスズの憂鬱（２）"
"70011020-2-？？？" = "それ、いくらになるの？"
"70011020-6-ミスズ" = "えっ……？"
"70011020-7-ミスズ" = "あの……「外にお友達はいないのか」と聞いたつもりなのですが……。"
"70011020-8-？？？" = "だから。作ったとして、それでいくら儲かるの？"
"70011020-9-ミスズ" = "少々、理解が難しいです……お友達を作るのは、お金のためではなくて……。"
"70011020-10-？？？" = "それじゃあ何の役にも立たないな。"
"70011020-11-ミスズ" = "えっと……世の中には、お金には代えられないものがたくさん……。"
"70011020-12-？？？" = "なぁ。"
"70011020-13-？？？" = "「お金には代えられない」……？ハッ。"
"70011020-14-？？？" = "アンタの自己満足で、私の時間を無駄にしないでくれる？"
"70011020-15-ミスズ" = "あ、そ、そうじゃなく……わ、私は……。"
"70011020-17-？？？" = "なぁ――"
"70011020-19-問題児" = "おい！"
"70011020-20-ミスズ" = "はふひっ！？"
"70011020-21-問題児" = "呼び出したのはそっちだろ？目の前で寝てんじゃねぇよ。"
"70011020-22-ミスズ" = "あっ、ごめんなさい……少し疲れていて。"
"70011020-23-問題児" = "なんだ、徹夜でもしたのか？"
"70011020-24-ミスズ" = "まあ、似たようなものといいますか……えへへ。"
"70011020-25-ミスズ" = "……それより。呼び出された理由、分かりますか？"
"70011020-26-問題児" = "ああ、うん。まあ。"
"70011020-27-ミスズ" = "問い詰めたいわけじゃありません。ただ、理由が知りたいのです。#n普段の生活に何か不満でも？"
"70011020-28-問題児" = "別に。"
"70011020-29-ミスズ" = "別に……ですか。悪い答えじゃありません。"
"70011020-30-ミスズ" = "といっても、良い答えでもないですが。"
"70011020-31-ミスズ" = "生活記録は拝見しましたが、書面だけでは分からなくて。なぜ脱走を？"
"70011020-32-問題児" = "……別に理由なんてねぇよ。"
"70011020-33-問題児" = "私にもできるんじゃねぇかなって思っただけ。"
"70011020-34-ミスズ" = "脱走を、ですか……。"
"70011020-35-ミスズ" = "……その自信の根拠を伺っても？"
"70011020-36-問題児" = "いや、前に7人も脱獄したらしいじゃん？"
"70011020-37-問題児" = "外じゃ「七囚人」とかって呼ばれてるやつ。"
"70011020-38-問題児" = "だったら私でも、って。"
"70011020-39-ミスズ" = "7人の脱走……それは事実です。"
"70011020-40-ミスズ" = "といっても、7人[ruby=・]し[/ruby][ruby=・]か[/ruby]脱走できなかったということです。"
"70011020-41-ミスズ" = "矯正局の設立以来、その7人以外の脱走を許したことはありません。#n当時だって、更なる脱走は防ぎきっています。"
"70011020-42-問題児" = "へぇ……聞いてた話とは違うな。#n矯正局のセキュリティはガバガバなんじゃなかったのか？"
"70011020-43-問題児" = "「災厄の狐」なんて好き勝手に出たり入ったりしてたんだろ？"
"70011020-44-ミスズ" = "……ワカモ、ですね。"
"70011020-45-ミスズ" = "……。"
"70011020-46-ミスズ" = "本題に戻りましょう。今はワカモの話ではありません。"
"70011020-47-ミスズ" = "なんにせよ、私たちは皆さんを苦しめたくて外出に制限をかけているのではありません。"
"70011020-48-ミスズ" = "ご存じだとは思いますが、矯正局に収監されるケースは2つ。#n「学園側が指導を諦めた生徒」もしくは「そもそも学籍が不明な生徒」です。"
"70011020-49-ミスズ" = "いわば、学園がお手上げ状態の問題児ということですね。"
"70011020-50-問題児" = "酷い言われようだな。"
"70011020-51-ミスズ" = "もちろん、基準は学園によってそれぞれです。#n最近のゲヘナのように、1人として矯正局送りにしない学園もあれば、#n些細なミス1つで見放す学園だってあります。"
"70011020-52-ミスズ" = "ですから「矯正局にいた」という事実は、将来にとって必ずしも大きな障害になるわけではない、ということです。"
"70011020-53-問題児" = "それ、慰めのつもり……？"
"70011020-54-ミスズ" = "……一応は。"
"70011020-55-ミスズ" = "ヴァルキューレ警察学校はキヴォトスの治安を担う学園です。#n予測不可能な問題児を野放しにするわけにはいきません。"
"70011020-56-ミスズ" = "といっても、反省して改心すれば、いつだって出所が認められます。"
"70011020-57-ミスズ" = "矯正局は「刑務所」ではないのですから。"
"70011020-58-ミスズ" = "わざわざ脱走なんてしなくてもいいんですよ。"
"70011020-59-問題児" = "わかったわかった。反省すりゃいいんだろ。"
"70011020-63-ミスズ" = "もう1つ。大事な質問があります。"
"70011020-64-ミスズ" = "脱走をして、何をしようとしたのですか？"
"70011020-65-問題児" = "は？だから、別に理由はないって。"
"70011020-66-ミスズ" = "脱走を決めた理由は「やれそうだと思ったから」……ですよね？#nでは脱走に成功したら、その後は何をするつもりだったのですか？"
"70011020-67-問題児" = "なんでそんなにこだわるんだよ。聞く必要ないだろ？"
"70011020-68-ミスズ" = "そんなことはありません。本人の口から聞くまで、真相は分からないものですから。"
"70011020-69-問題児" = "……わーったよ、言えばいいんだろ！でも！……絶対笑うなよ？"
"70011020-73-問題児" = "……今日、誕生日なんだよ。"
"70011020-74-問題児" = "でもさ、私ってここに来たばっかだから。仲のいい奴もいなくてさ……。"
"70011020-75-問題児" = "それでちょっとだけ、[ruby=ダチ]友達[/ruby]に会ってこようと思って……。#n逃げる気もないし、ちゃんと帰ってくるつもりだったんだよ！"
"70011020-76-ミスズ" = "……そうでしたか。"
"70011020-77-問題児" = "ふんっ、どうせお前らは信じねぇんだろうけど。"
"70011020-78-ミスズ" = "そう思わせてしまったのならごめんなさい。でも……。"
"70011020-84-ミスズ" = "――すみません、例の物を持ってきていただけますか？"
"70011020-85-矯正局の警備" = "はい、先ほどお預かりしたやつですよね？"
"70011020-87-問題児" = "なんだよ、それ。"
"70011020-88-ミスズ" = "できればもう少し、和やかな雰囲気でお渡ししたかったのですが……ごめんなさい。#nそれと――"
"70011020-89-ミスズ" = "お誕生日、おめでとうございます。"
"70011020-96-問題児" = "あっ……えっ……？"
"70011020-97-ミスズ" = "ささやかですが、ニット帽を編んでみました。#n綺麗な金髪ですから、パステルカラーが似合いそうだなと思って、薄ピンクの糸で。#n気に入ってもらえたら嬉しいです。"
"70011020-98-問題児" = "ちょっ……誕生日だって知ってたの？しかも、プレゼントまで……。"
"70011020-99-ミスズ" = "二度と訪れることのない、学生時代の大切なお誕生日ですから。"
"70011020-100-ミスズ" = "そんな日を矯正局で迎えるのは、とてもおつらいことでしょう。#n少しでも慰めになればと思ったのですが……。"
"70011020-101-ミスズ" = "やっぱり、これだけでは不十分ですよね。"
"70011020-102-ミスズ" = "差し支えなければ……お友達の連絡先を教えていただけませんか？"
"70011020-103-問題児" = "……え？"
"70011020-104-ミスズ" = "ここにご招待して一緒にお祝いができるよう、手配してみます。"
"70011020-105-問題児" = "……そんなことしていいのか？"
"70011020-106-ミスズ" = "と言いますと……？"
"70011020-107-問題児" = "だって私は囚人だし……しかも脱獄しようとしたんだよ？"
"70011020-108-ミスズ" = "とはいえ、[ruby=ここ]矯正局[/ruby]は「刑務所」じゃありません。"
"70011020-109-ミスズ" = "だからあなたは「罪人」ではないのです。"
"70011020-111-矯正局の警備" = "いやぁ、お疲れ様でした！"
"70011020-112-矯正局の警備" = "さっすが局長！あいつ、部屋出る時号泣してましたよ？"
"70011020-113-ミスズ" = "せっかくの喜ばしい日に泣かせてしまうなんて……心が痛いです……。"
"70011020-114-矯正局の警備" = "いやいや、別にいじめたわけじゃないんですし。"
"70011020-115-矯正局の警備" = "局長を見て改心した生徒が山ほどいるって話、やっと理解できました。"
"70011020-116-ミスズ" = "といっても……それは全部、本人たちの努力の賜物です。#n私はただ、隣で話し相手になっているだけ。"
"70011020-117-ミスズ" = "相手に会話の意志がなければ……。"
"70011020-118-ミスズ" = "そもそも、[ruby=・]逸[/ruby][ruby=・]脱[/ruby]した思考の持ち主とは――"
"70011020-119-矯正局の警備" = "……？"
"70011020-120-ミスズ" = "あ……ごめんなさい。今のは聞かなかったことにしてください。"
"70011020-121-ミスズ" = "朝早くからありがとうございました。お疲れ様でした。"
"70011020-122-矯正局の警備" = "いえ、これが私の役目ですから！またいつでも呼んでください！"
"70011020-127-ミスズ" = "……そういう人たちが居たのです。#nどんな言葉も通じず、同じ世界を生きてきたとは思えない――"
"70011020-129-ミスズ" = "――[ruby=・]囚[/ruby][ruby=・]人[/ruby]たちが。"
"70011020-137-記憶の中の声" = "矯正局長に新しく就任された「監原ミスズ」さんから、ご挨拶をいただきます。#n皆さん大きな拍手で――"
"70011020-141-記憶の中の声" = "大変です！囚人が脱獄しました！！"
"70011020-142-記憶の中の声" = "数は7人！！"
"70011020-143-記憶の中の声" = "集団脱獄です！！！"
"70011020-145" = "（監原ミスズが矯正局長に就任したのは、まさにその日のことだった）"
"70011020-146" = "（そしてその年――矯正局の志願者数は前年比8割減となった）"
"70011020-147" = "監原ミスズの憂鬱"
