[translation]
"70013030-1" = "一人では咲かない雑草（3）"
"70013030-2-リガトーニ" = "この日をどれだけ待ちわびてきたことか。"
"70013030-3-リガトーニ" = "正に運命的な再会だ！お前らにはここで消えてもらう！"
"70013030-9-ムツキ" = "くふふ。あんな目に遭ったのに、ま～だ懲りないんだ？"
"70013030-10-ムツキ" = "それなら部下たちの前で、あの日の恥ずかし～こと、バラしちゃうよー？"
"70013030-11-リガトーニ" = "だ、黙れ！これまで見逃してやったのに、恩知らずな奴め……！"
"70013030-16-カヨコ" = "ウェブ上に広まるのが怖かったんじゃないんだ。"
"70013030-17-カヨコ" = "お望みなら今、やってあげるけど。"
"70013030-18-リガトーニ" = "く、くぅぅっ……！"
"70013030-19-リガトーニ" = "おい！徹底的にやっちまえ！"
"70013030-31-アル" = "ふふっ、良いわ。最高ね。"
"70013030-32-アル" = "過去の敵と再会し、かっこよくやっつける。これもまたハードボイルド……！"
"70013030-33-アル" = "みんな、本気で行くわよ！"
"70013030-34-ハルカ" = "はい、アル様！あの時の分まで……！！"
"70013030-35-ハルカ" = "うわあああ！死んでください！みんな死んでください……！！"
"70013030-42-ギャングメンバー" = "ぐっ！い、一旦下がれ！近づくのは危険だ！"
"70013030-44-ムツキ" = "くふふっ、ちゃ～んと集まれてえらいねー"
"70013030-45-ムツキ" = "さあ、弾ける準備はいいかな～？"
"70013030-46-ギャングメンバー" = "……！"
"70013030-56-ギャングメンバー" = "ぐあああっ……！"
"70013030-58-ムツキ" = "きゃははっ！ポップコーンみたい！"
"70013030-59-リガトーニ" = "な、なにを手こずってる！早く始末しろ！"
"70013030-65-カヨコ" = "……しつこい。"
"70013030-66-カヨコ" = "社長。修理代が増えちゃいそうだけど、大丈夫？"
"70013030-67-アル" = "構わないわ！私たちが勝てばいいのよ！"
"70013030-68-アル" = "歴史は勝者によって作られるものなんだから！"
"70013030-69-カヨコ" = "なんか違う気がするけど……。"
"70013030-70-カヨコ" = "社長の考えには賛成……何が何でも勝つ。"
"70013030-80-アル" = "ふふっ、そろそろ降参しなさい。これ以上続けても、そっちが損するだけよ。"
"70013030-81-ムツキ" = "くふふっ、今回もオモシロ写真を何枚か撮ったら終わってあげる！"
"70013030-84-リガトーニ" = "く、くそっ……！"
"70013030-85-リガトーニ" = "何か、何かないのか……！"
"70013030-86-リガトーニ" = "あれは……？そうだ！"
"70013030-94-レストランの客" = "ひ、ひいいいっ！た、助けてください……！"
"70013030-95-リガトーニ" = "いい加減にしろ！こいつがどうなっても知らないぞ！！"
"70013030-103-ギャングメンバー" = "あ、あいつらを無事に返してほしけりゃ……降参するんだ！"
"70013030-104-アル" = "卑怯だわ！人質だなんて……！"
"70013030-106-リガトーニ" = "さあ、銃を置け！これはお遊びじゃないぞ！！"
"70013030-113-アル" = "（ううっ……！）"
"70013030-114-アル" = "（でもここで銃を置いたら……うちの社員が危ない！）"
"70013030-115-アル" = "（だからといって、戦い続けたら人質が……！）"
"70013030-116-アル" = "（あああっ……！）"
"70013030-123-カヨコ" = "……。"
"70013030-124-カヨコ" = "ムツキ、あのキッチンに料理用の小型リフトがある。"
"70013030-125-カヨコ" = "ハルカとそっちに行って。"
"70013030-126-ムツキ" = "ええーっ？それじゃあ、アルちゃんとカヨコちゃんは？"
"70013030-127-カヨコ" = "ひとまず、降参するしかないかな。"
"70013030-128-カヨコ" = "社長の性格、知ってるでしょ？人質を放ってはおけない。"
"70013030-129-カヨコ" = "どういうことか、[ruby=・   ・   ・   ・   ・]分かるよね[/ruby]？"
"70013030-130-ムツキ" = "……一旦下がってから、やっちゃえばいいってこと？オッケー！"
"70013030-131-ムツキ" = "ハルカちゃん！行こう！"
"70013030-136-ハルカ" = "はい？ど、どこへですか！？"
"70013030-137-ムツキ" = "ついてきて！今は、こうするしかないのー！"
"70013030-138-ハルカ" = "あ、アル様……！"
"70013030-140-アル" = "そ、そうよ！ここは私たちに任せて！"
"70013030-141-アル" = "あなたの望みどおり、銃を置いたわ！だからうちの社員は行かせてちょうだい！"
"70013030-142-リガトーニ" = "こ、こいつら、ふざけた真似を……！"
"70013030-143-カヨコ" = "今！早く……！"
"70013030-154-ムツキ" = "はあっ、はあっ……。"
"70013030-155-ムツキ" = "ハルカちゃん、大丈夫～？"
"70013030-156-ハルカ" = "あ、アル様……すみません。本当にすみません。アル様を残して逃げるだなんて……。"
"70013030-157-ハルカ" = "や、やっぱり私に生きる資格なんてないんです！今すぐにでも死んだほうがいいんです……！！"
"70013030-158-ムツキ" = "何言ってんの！私たちが力を合わせて二人を助けないとじゃん！"
"70013030-159-ムツキ" = "あいつは前にも倒したんだから、今回だって大丈夫！"
"70013030-160-ハルカ" = "だ、だけどその時私は……。"
"70013030-163-アル" = "あ……！見つけたわ！"
"70013030-168-ハルカ" = "ひ、ひいいいっ……！"
"70013030-169-アル" = "どうして逃げるの？待って！"
"70013030-170-ハルカ" = "で、でも、わ、私なんかに関わったら……！"
"70013030-171-アル" = "大丈夫よ……！"
"70013030-172-ハルカ" = "は、はい……？"
"70013030-176-アル" = "心配ないわ！あなたを苦しめてた連中は私が懲らしめたから！"
"70013030-177-アル" = "マフィアたちも、おとなしくなるはずよ。"
"70013030-179-ハルカ" = "ど、どうやって……。"
"70013030-184-ムツキ" = "くふふっ、とっ捕まえて恥ずかし～写真を撮ってやったんだー！"
"70013030-185-カヨコ" = "誓約書まで書かせたから、安心して。"
"70013030-186-ムツキ" = "ほら！あんたも出てきて謝りなさーい！"
"70013030-192-いじめグループのリーダー" = "く、ううっ……！"
"70013030-193-いじめグループのリーダー" = "す、すみませんでした！二度とハルカ様の前に現れません！！"
"70013030-194-いじめグループのリーダー" = "こ、これからは深く反省しながら生きていきます……！！"
"70013030-196-ハルカ" = "あ……ああっ……。"
"70013030-197-アル" = "ふふふっ、どう？私たちの実力は。"
"70013030-198-ハルカ" = "こ、こんなことをタダでしていただけるはずは……。"
"70013030-199-ハルカ" = "わ、私は皆さんに何をしたらよろしいでしょうか！？"
"70013030-200-ハルカ" = "お、お金ですか？で、でも今は……！"
"70013030-201-アル" = "報酬なんていらないわ。そんなの、ハードボイルドじゃないでしょう？"
"70013030-202-ハルカ" = "ハード……ボイルド？"
"70013030-203-アル" = "そう。一日一悪！冷酷無比！ハードボイルドなアウトロー！これがうちのモットーよ。"
"70013030-204-アル" = "あなたを助けたのも、その一環ってこと。報酬のためではないの。"
"70013030-205-アル" = "だから……立ちなさい。"
"70013030-206-アル" = "あなたはもう、自由なのよ！"
"70013030-207-ハルカ" = "……！！"
"70013030-209-ハルカ" = "あの時はただ……助けてもらうだけでした。"
"70013030-210-ハルカ" = "だからアル様に私の全てを捧げようと決めたのに……。"
"70013030-211-ハルカ" = "アル様のためなら……何でもすると誓ったのに……。"
"70013030-216-ムツキ" = "そうそう！だから今でしょ～！"
"70013030-217-ムツキ" = "何としてでも！二人でアルちゃんとカヨコちゃんを助けようよ！"
"70013030-221-ハルカ" = "……。"
"70013030-222-ハルカ" = "……そうですね。"
"70013030-223-ハルカ" = "私がお助けいたします、アル様。"
"70013030-224-ハルカ" = "あの時、アル様が……私を助けてくださったように……！"
