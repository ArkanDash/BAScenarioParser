[translation]
"70013010-1" = "一人では咲かない雑草（1）"
"70013010-2" = "ホテルのファインダイニングレストランのラウンジ"
"70013010-6-アル" = "……。"
"70013010-7-アル" = "……ついに。"
"70013010-8-アル" = "来たわよ！"
"70013010-9-アル" = "最高級ホテルのレストラン……！"
"70013010-14-ハルカ" = "こ、こんな場所でアル様と食事ができるなんて……もう死んでも心残りはありません！"
"70013010-15-ムツキ" = "アルちゃん、本当に大丈夫～？#nここ、すっごく高そうだけど？"
"70013010-17-アル" = "安心してちょうだい、今日は私の奢りよ。#nそれに、最近は収入も安定してきているのよ。"
"70013010-18-カヨコ" = "……とはいえ、あまり無理しない方がいいんじゃないかな。"
"70013010-19-アル" = "こ、これくらいは大丈夫よ！"
"70013010-20-アル" = "最近はちゃんと貯金できるくらいの余裕があるのよ。"
"70013010-21-アル" = "私も社長として、このくらいはしないとね。"
"70013010-22-アル" = "だからみんな、今日は楽しんでちょうだい。"
"70013010-24-ムツキ" = "くふふ、そこまで言われたら楽しんであげなきゃね～"
"70013010-25-カヨコ" = "一応聞くけど、予約はちゃんとしてる？"
"70013010-27-アル" = "あ、当たり前でしょ！"
"70013010-28-アル" = "えーっと、あの、すみません。"
"70013010-29-ウェイター" = "いらっしゃいませ。"
"70013010-30-アル" = "[ruby=りくはちま]陸八魔[/ruby]ですが……。"
"70013010-34-ウェイター" = "お待ちしておりました。こちらへどうぞ。"
"70013010-46-ウェイター" = "窓側のお席へどうぞ。"
"70013010-56-ウェイター" = "では、本日のコースを簡単に説明いたします。"
"70013010-57-ウェイター" = "メインディッシュは、シェフ特製ワイルドハント風の牛フィレ煮込みです。"
"70013010-58-ウェイター" = "酸味が控え目のワインと肉汁を[ruby=Deglaze]デグレイズ[/ruby]したソースで煮詰めています。"
"70013010-59-ウェイター" = "また、芳醇で深い味わいが感じられるよう……。"
"70013010-66" = "その後もウェイターの説明は続いたが――"
"70013010-73" = "[ruby=Infusion]インフュージョン[/ruby]、[ruby=Al dente]アルデンテ[/ruby]、[ruby=Brunoise]ブリュノワーズ[/ruby]など……アルたちにとって、普段耳にしない言葉ばかりが並んだ。"
"70013010-74-アル" = "な、なるほど！どれも美味しそうね！"
"70013010-75-ウェイター" = "では、[ruby=amuse bouche]アミューズブーシュ[/ruby]からお持ちいたします。"
"70013010-81-ムツキ" = "アルちゃん、ほんとに意味分かってる～？"
"70013010-82-アル" = "よ、要するに最高級の料理ってことでしょう？"
"70013010-83-アル" = "細かいことを気にしていてはダメよ。#n高いんだから、どれも美味しいはず。"
"70013010-88-カヨコ" = "そういえば、水も……ちょっと違うね。"
"70013010-89-カヨコ" = "……ミネラルウォーターだって。"
"70013010-90-ハルカ" = "ど、どういう人が普段こんな所で食事をするんでしょうか……？"
"70013010-100-ムツキ" = "わぁ！みんな、見るからにお金持ちそ～"
"70013010-101-アル" = "私たちだって客として来ているのよ、周囲と比べる必要はないわ。"
"70013010-102-アル" = "それに、ドレスコードだって完璧――"
"70013010-103-ムツキ" = "ちょっと張り切りすぎじゃない？"
"70013010-104-アル" = "そ、そんなことないわよ……！"
"70013010-105-アル" = "優雅な食事にぴったりじゃない？"
"70013010-106-ムツキ" = "くふふっ。じゃあアルちゃんはマナーも完璧なんだね？"
"70013010-107-ムツキ" = "それじゃあしつもーん。#nナイフとフォークを使う順番は分かる？"
"70013010-108-ハルカ" = "わ、私も気になってました。どうしてこんなに種類があるんですか？"
"70013010-109-アル" = "えっ……そ、それは……。"
"70013010-111-カヨコ" = "料理ごとに使う食器が違うんだよ。"
"70013010-112-カヨコ" = "……どれから使うのかは知らないけど。"
"70013010-113-アル" = "て、テキトーでいいんじゃないかしら？#n要は、食べられればいいのよ。"
"70013010-120-ホテルのVIP顧客" = "やけに騒がしいな？"
"70013010-121-ホテルのVIP顧客" = "どうやら、場違いな奴がいるようだが……。"
"70013010-123-ムツキ" = "ふ～ん？それって、私たちのこと？"
"70013010-124-ハルカ" = "今……アル様を侮辱しましたか？"
"70013010-126-ホテルのVIP顧客" = "アル？"
"70013010-130-ホテルのVIP顧客" = "……。"
"70013010-131-ホテルのVIP顧客" = "おっ、お前たちは……！"
"70013010-132-ホテルのVIP顧客" = "便利屋68！！"
"70013010-137-アル" = "えっと……どちら様？"
"70013010-142-ホテルのVIP顧客" = "私を……！忘れたのか！？"
"70013010-143-ムツキ" = "悪党ってみんな似たような感じだし～？"
"70013010-144-ムツキ" = "いちいち覚えてないんだよね。"
"70013010-145-リガトーニ" = "リガトーニ・ファミリーの！#nブルーノ・リガトーニ！"
"70013010-146-リガトーニ" = "この名を忘れたとは言わせんぞ！"
"70013010-151-ハルカ" = "リガトーニ……ファミリー……？"
"70013010-152-カヨコ" = "……まさか。"
"70013010-153-アル" = "そういえば……。"
"70013010-155-リガトーニ" = "ふ、ふふ……。"
"70013010-156-リガトーニ" = "ふっはははは……！"
"70013010-157-リガトーニ" = "ようやく思い出したようだな！"
"70013010-158-リガトーニ" = "復讐の時だ！いくぞ、お前ら！！"
"70013010-167-カヨコ" = "こんなところで戦うなんて正気？"
"70013010-168-リガトーニ" = "私はこの店にかなり金を払っているからな！#n何をしようが多少は目を瞑ってもらえるんだよ！"
"70013010-169-リガトーニ" = "ここで会ったが百年目――"
"70013010-170-リガトーニ" = "あの時の恨みを晴らしてやる！"
"70013010-171-リガトーニ" = "[ruby=や]殺[/ruby]っちまえ！"
"70013010-183-ムツキ" = "きゃははっ。#nド派手な歓迎だねぇ。"
"70013010-184-カヨコ" = "社長、どうする？"
"70013010-185-カヨコ" = "店の物を壊して、弁償できる？"
"70013010-186-アル" = "う……で、でも――"
"70013010-187-アル" = "――ここで逃げたらハードボイルドじゃないわ！"
"70013010-188-アル" = "みんな、反撃開始よ！"
"70013010-189-ムツキ" = "さすがアルちゃん！そうこなくっちゃ！"
"70013010-190-ハルカ" = "お……お任せください、アル様。一人残らず始末します……！"
"70013010-203" = "突如始まったレストランでの銃撃戦。"
"70013010-204" = "便利屋68とリガトーニ・ファミリーの間に、一体何があったのだろう――"
