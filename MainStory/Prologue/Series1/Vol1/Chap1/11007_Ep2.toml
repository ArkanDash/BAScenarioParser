[translation]
"11007-2-ワカモ" = "私はここまで、後は任せます。"
"11007-5-ユウカ" = "逃げられてるじゃない！？追うわよ！"
"11007-6-ハスミ" = "いいえ、生半可な行動をしてはなりません。私たちの目標はあくまでも、シャーレの奪還。"
"11007-7-ハスミ" = "このままシャーレのビルまで前進するべきです。"
"11007-8-ユウカ" = "……うん、まあいいわ。あいつを追うのは私たちの役目じゃないってことね。"
"11007-9-チナツ" = "罠かもしれませんし。"
"11007-10-ハスミ" = "はい。建物の奪還を優先で。このまま引き続き、進むとしましょう。"
