[translation]
"1600915-1" = "忍者少女は覚えててほしい！"
"1600915-2" = "商店街入口"
"1600915-3-ミチル" = "ふっふっふ……やっぱり来たね、先生殿。"
"1600915-4-ミチル" = "忍者を志す者としては、無視できるものじゃないよね！"
"1600915-5" = "[s] \"私は、忍者を志してたのか……！？\""
"1600915-6-ミチル" = "何それ、今さら～？"
"1600915-7-ミチル" = "とにかく、私が持ってきた古代の記録媒体とは――"
"1600915-8-ミチル" = "これっ！"
"1600915-12" = "[ns] \"……ビデオテープ！？\""
"1600915-13-ミチル" = "やっぱり知ってたんだね、先生殿～"
"1600915-14-ミチル" = "そう、今となっては忘れられかけた存在……びでお、てーぷっ！"
"1600915-15" = "[s1] \"な、懐かしい……。\"\n[s2] \"何のビデオなの？\""
"1600915-18-ミチル" = "ふふっ、気になる？気になるよねー？"
"1600915-19-ミチル" = "このビデオには……。"
"1600915-20-ミチル" = "なんと……！"
"1600915-21" = "[s] \"ミチルが初めて歩いた日の記録、とか……！\""
"1600915-22-ミチル" = "うにゃっ！？"
"1600915-23-ミチル" = "違うよ！どうしたらそんな発想になるのさ！？"
"1600915-24" = "[s] \"違うんだ……。\""
"1600915-25-ミチル" = "何で残念そうなの！？"
"1600915-26-ミチル" = "と、とにかく、このビデオには……！"
"1600915-27-ミチル" = "忍者の道を歩む者なら、誰でも知っている……。"
"1600915-28-ミチル" = "あの「カラスにゃんにゃん」監督が、駆け出し時代に撮影した白黒映画！ "
"1600915-29-ミチル" = "『隠し教室の三忍者』が入ってるんだよ！"
"1600915-33" = "[ns] \"……なるほど？\""
"1600915-34-ミチル" = "反応薄い！？"
"1600915-35-ミチル" = "こういう時は、「やはりお前も知ってたか」みたいな熱い眼差しで頷き合う！#nそれが忍者の鉄則でしょぉ！？"
"1600915-36-ミチル" = "……えっ、初めて聞いた？"
"1600915-37-ミチル" = "ま、まぁ確かに？カラスにゃんにゃん監督の作品はちょーっと古いし……#nほとんどが白黒映画で、今では入手するのも難しいけど……。"
"1600915-38-ミチル" = "……でも教科書で習ったでしょ！？"
"1600915-39" = "[s] \"載ってなかったかなぁ！？少なくとも私の教科書には！\""
"1600915-40-ミチル" = "とにかぁく！#nまさか『隠し教室の三忍者』を観てないなんて……。"
"1600915-41-ミチル" = "先生殿の人生に、まだまだ楽しみが残されてたってことだね。"
"1600915-42-ミチル" = "これを今から初見で楽しめるなんて、羨ましい……！"
"1600915-43" = "[s] \"そこまで……！？\""
"1600915-44-ミチル" = "当然っ！"
"1600915-45-ミチル" = "だって私は……この映画を見て、忍者の世界に足を踏み入れたんだし。"
"1600915-46" = "[s3] \"そこまでの思い出の映画……。\" \n[s4] \"それは凄い！\""
"1600915-49-ミチル" = "でっしょー！？"
"1600915-50" = "[s] \"じゃあ今日は、このビデオの上映会をするの？\""
"1600915-51-ミチル" = "んー……#nできることなら、商店街の真ん中で上映したいところなんだけどー……。"
"1600915-52-ミチル" = "今日は別の目的があって。"
"1600915-53-ミチル" = "……このビデオテープを、バックアップしたいなって。"
"1600915-54" = "[s] \"バックアップ？\""
"1600915-55-ミチル" = "ちょっと前に、商店街の写真館であるサービスが始まったらしくって。"
"1600915-56-ミチル" = "ビデオテープの映像をデジタル化して、#nパソコンにバックアップできるようにしてくれるんだって。"
"1600915-57-ミチル" = "もし上手くいけば、作品の鑑賞が気軽にできるようになる！"
"1600915-58-ミチル" = "だから、このビデオテープを持ってきたってわけ！"
"1600915-59-ミチル" = "大事なものだから、ちゃんと保管しておきたいし……。"
"1600915-60-ミチル" = "アレだよアレ。忍者がスイーツとか食材の長期保存のために、#n丸薬状にするようなもの！"
"1600915-61-ミチル" = "正式には、兵糧丸って呼ぶんだけど―― "
"1600915-62" = "[s] \"それじゃあ出発！\""
"1600915-63-ミチル" = "ちょっとぉ！？#n良いところだったのにぃ！"
"1600915-69-写真館の店主" = "……これは難しそうだ。"
"1600915-70-ミチル" = "ど、どうして……！？"
"1600915-71-ミチル" = "お金が足りないとか！？"
"1600915-72-写真館の店主" = "いや、ビデオテープ側の問題だね。"
"1600915-73-写真館の店主" = "これじゃあ、映像を取り出せそうにない……。"
"1600915-74" = "[s] \"何か方法は無いんでしょうか？\""
"1600915-75-写真館の店主" = "うーん、かなり古いものだからなぁ……。"
"1600915-76-写真館の店主" = "ご覧、フィルムに傷がいくつも付いてる。"
"1600915-77-写真館の店主" = "ちょっとウチでは厳しいな。"
"1600915-81-ミチル" = "うぐぐ……そっかぁ。"
"1600915-82-ミチル" = "仕方ないね……。#n行こう、先生殿。"
"1600915-87-ミチル" = "んー、やっぱりかぁ……。"
"1600915-88" = "[s] \"もしかして、最初から分かってたの？\""
"1600915-89-ミチル" = "うん、ずっと前から壊れちゃってたし。"
"1600915-90" = "[s] \"そうだったんだ……。\""
"1600915-91-ミチル" = "何百回も再生してたんだけど……。"
"1600915-92-ミチル" = "ちゃんと回らなくなっちゃって。"
"1600915-93-ミチル" = "専門の業者なら……って思ったけど、やっぱりダメだったかぁ。"
"1600915-94" = "[s] \"……大丈夫？\""
"1600915-95-ミチル" = "……ううん、すっごい悲しい！"
"1600915-96-ミチル" = "思い出を、もう取り出せなくなったわけだし……。"
"1600915-97-ミチル" = "それにもう、このビデオは手に入らない。"
"1600915-98" = "[s] \"ミチル……。\""
"1600915-99-ミチル" = "……たまに、思うんだ。"
"1600915-100-ミチル" = "もっと早くから、多くの人とこの楽しみを分け合えていれば……。"
"1600915-101-ミチル" = "一人で楽しむんじゃなくて、他の人にも教えて、もっと多くの人の記憶に残せていれば――"
"1600915-102-ミチル" = "……そう、思ったんだけど。"
"1600915-103" = "[s] ミチルの頭を優しく撫でる。"
"1600915-104-ミチル" = "えへへっ……ありがとー、先生殿。"
"1600915-105-ミチル" = "……。"
"1600915-106-ミチル" = "そういえば2ブロック向こうに、忍具店があるはず！"
"1600915-107" = "[s] \"切り替え早くない！？\""
"1600915-108-ミチル" = "だってだって！「妖銃ムラマト」だけじゃなくて、#n呪われた悪の手榴弾「妖弾マサムネ」の本物も入荷したって噂なんだよ！？"
"1600915-110-ミチル" = "でもマサムネはただのオマージュだとか、それどころかムラマトをパクっただけーって批判もあってね。今ではそれなりに知名度があるけど――"
"1600915-112" = "（そうして二人で商店街を見て回っている間も……）"
"1600915-114" = "（ミチルは大事そうに、ビデオテープを抱きしめていた）"
