[translation]
"2003605-1" = "思い出は数え切れず"
"2003605-2" = "（セリカの掃除を手伝うために、アビドスへ向かった）"
"2003605-10-セリカ" = "来てくれたんだ。"
"2003605-11-セリカ" = "来なくて大丈夫って言ったのに……。"
"2003605-12-セリカ" = "これくらい、別に一人でも……。"
"2003605-13-セリカ" = "お菓子でも持ってくるから座ってて、先生。"
"2003605-14-セリカ" = "……大丈夫？"
"2003605-15-セリカ" = "本当に掃除を手伝うためだけに……？"
"2003605-16-セリカ" = "はあ……。"
"2003605-17-セリカ" = "それだと、先生に掃除を手伝ってもらいたくて連絡したみたいじゃない……。"
"2003605-18-セリカ" = "手伝わせたかったわけじゃないのに……。"
"2003605-19-セリカ" = "……うん？"
"2003605-20-セリカ" = "そんな風には思ってないって？"
"2003605-21-セリカ" = "ここまで言われて、先生の好意を受け取らないのも……。"
"2003605-22-セリカ" = "……けど、う～ん。"
"2003605-26-セリカ" = "……意地を張っても仕方ないし、お願いしようかな。"
"2003605-27-セリカ" = "その代わり、今度お礼にラーメンを奢るってことでどう？"
"2003605-28-セリカ" = "ふふっ、じゃあ決まりね！#nあと、やるって言ったからには覚悟してよね！#n手を抜いたら許さないんだから！"
"2003605-29-セリカ" = "それじゃ……"
"2003605-30-セリカ" = "始めるわよ！！"
"2003605-33" = "（セリカと一緒に掃除を始めた）"
"2003605-34" = "（荷物は片付いていたため、拭き掃除が中心だった）"
"2003605-36-セリカ" = "よし、きれいになったわね。"
"2003605-37-セリカ" = "お疲れ様、先生！"
"2003605-38" = "[s1] \"セリカこそお疲れ様。\"\n[s2] \"部屋がきれいになると、気分もスッキリするね。\""
"2003605-41-セリカ" = "そうね、ありがとう先生。#n二人でやったから、早く終わったわね。"
"2003605-42-セリカ" = "これも全部、先生のおかげ……"
"2003605-46-セリカ" = "……ん？"
"2003605-47" = "[s3] \"そんなダンボール、前は無かったよね？\"\n[s4] \"何が入ってるんだろう？\""
"2003605-50-セリカ" = "ああ、これね……。"
"2003605-51-セリカ" = "片付け忘れてたわ。"
"2003605-52-セリカ" = "最後にやろうと思って、ついそのまま……。"
"2003605-56-セリカ" = "……あれ？#nなんで先生は、このダンボールが前は無かったって気づいたのよ。"
"2003605-57-セリカ" = "まさか、私たちの教室を完全に記憶してるの……？"
"2003605-58" = "[s5] \"何となく思っただけだよ。\"\n[s6] \"そんなに目立つ物もないから。\""
"2003605-61-セリカ" = "悪かったわね！#n碌な物が無くって！"
"2003605-62-セリカ" = "……まあ、これもそんな大したものじゃないけど。"
"2003605-66" = "[ns7] \"水着……？\"\n[ns8] \"あ、リゾートに行った時の……。\""
"2003605-69-セリカ" = "せっかくならと思って可愛い水着を選んだけど、#nあれ以来着る機会も無くって……。"
"2003605-70-セリカ" = "タンスの肥やしになってるのよね。"
"2003605-71-セリカ" = "ただ置いておくのもどうかと思ったけど……。"
"2003605-72-セリカ" = "……さすがに、捨てるのはもったいないかなって。"
"2003605-76-セリカ" = "……え？"
"2003605-77-セリカ" = "なんて言ったの、先生？"
"2003605-78-セリカ" = "き、着てみてほしい……！？"
"2003605-79-セリカ" = "……今、ここで！？"
"2003605-80" = "[s9] \"たまに着てあげれば、肥やしにせず済むよ！\"\n[s10] \"海でしか着てはいけないルールなんて無いから！\""
"2003605-83-セリカ" = "なに言ってるの！？#n水着は海とかプールで着るものに決まってるでしょ！"
"2003605-84-セリカ" = "まったく、そうやってからかって……。"
"2003605-85-セリカ" = "……はぁ。"
"2003605-86-セリカ" = "大丈夫よ、心配しないで。#n捨てはしないから。"
"2003605-87-セリカ" = "その、なんと言うか……。"
"2003605-88-セリカ" = "みんなとリゾートに行った時の水着だし……。"
"2003605-89-セリカ" = "せ、先生も言ってたでしょ？"
"2003605-93-セリカ" = "お、お……。"
"2003605-94-セリカ" = "思い出、だって……。"
"2003605-95-セリカ" = "……。"
"2003605-96-セリカ" = "…………。"
"2003605-97-セリカ" = "な、何……！？"
"2003605-98-セリカ" = "何よ、その表情は！"
"2003605-99" = "[s11] \"ぐすっ……感動したよ、セリカちゃん。\"\n[s12] \"立派になったね、セリカちゃん……。\""
"2003605-102-セリカ" = "あああああああっ、もう！！"
"2003605-103-セリカ" = "子供扱いしないで！！"
"2003605-104-セリカ" = "やっぱり連絡しなきゃ良かった！#nラーメンも奢ってあげないんだから！"
"2003605-105-セリカ" = "い、いつまで笑ってるのよ！"
"2003605-107-セリカ" = "もう！笑わないでってば！！"
