[translation]
"2003802-1" = "話を聞く技術"
"2003802-3-トモエ" = "あ、先生。"
"2003802-4-トモエ" = "この姿でお会いするのは、何だか新鮮ですね。"
"2003802-5" = "[s] \"そうだね、よく似合ってるよ。\""
"2003802-6-トモエ" = "あら。#nお褒めくださり光栄です。"
"2003802-7-トモエ" = "相変わらず先生は、口[ruby=・]も[/ruby]お上手ですね。"
"2003802-8" = "[s] \"口[ruby=・]も[/ruby]……？\""
"2003802-9-トモエ" = "ええ。"
"2003802-10-トモエ" = "もしかして、何か気になることでもありましたか？"
"2003802-11-トモエ" = "ふふっ。"
"2003802-12-トモエ" = "相手に迷いを生じさせ、いつでも隙を突けるようにするのは、#nプロパガンダの基本ですから。"
"2003802-13" = "[s] \"勘弁してください……。\""
"2003802-14-トモエ" = "それにしても、素敵な場所ですね。"
"2003802-15-トモエ" = "見晴らしも良いですし、声が遠くまで届きそうです。"
"2003802-16-トモエ" = "……演説でもしたいのか、と？"
"2003802-17-トモエ" = "ふふふっ。"
"2003802-18" = "[s] \"ただ笑みを返されるのが一番怖いんだけど！？\""
"2003802-19-トモエ" = "たしかにレッドウィンターでは、よく演説をしていますが……。"
"2003802-20-トモエ" = "場所はしっかりと弁えております。"
"2003802-21-トモエ" = "一歩間違えれば、学園間のトラブルにつながるかもしれませんし。"
"2003802-22-トモエ" = "ですから、静かに残りの時間を過ごそうかなと。"
"2003802-23" = "[s] \"トモエはさすがだね。\""
"2003802-24-トモエ" = "またしてもお褒めいただき、ありがとうございます。"
"2003802-25-トモエ" = "では、今日のところは話を聞く側に回ってみましょうか。"
"2003802-26-トモエ" = "さあ、行きましょう先生。"
"2003802-29-梅花園の教官" = "皆さん、こちらは一日教官の[ruby=さしろ]佐城[/ruby]トモエ教官です。"
"2003802-30-梅花園の教官" = "拍手でお迎えしましょう～！"
"2003802-34" = "[ns1] \"話を聞く側に回るって……。\"\n[ns2] \"梅花園の教官になるって意味だったんだ。\""
"2003802-37-トモエ" = "はい、子どもたちはキヴォトスの未来ですから。"
"2003802-38-トモエ" = "つまり、プロパガンダに利用する対象として、#nこれほど適当な存在はいません。"
"2003802-39-トモエ" = "もちろん、線引きはしておりますのでご安心を。"
"2003802-40" = "[s3] \"ものすごく不安になってきたけど……。\"\n[s4] \"本当に変なことはしないよね？\""
"2003802-43-トモエ" = "ええ。#n私を信じてください、先生。"
"2003802-44-トモエ" = "梅花園の皆さ～ん、今日は何のお話をしましょうか？"
"2003802-45-梅花園の園児A" = "トモエ教官！#nこの靴、ピカピカ光るの！"
"2003802-46-トモエ" = "あら、素敵ですね。"
"2003802-47-梅花園の園児B" = "靴って、右と左が揃わないといけないんだよ！"
"2003802-48-梅花園の園児B" = "だから、片方隠したらお出かけできなくなっちゃうんだ！"
"2003802-49-トモエ" = "いけませんよ、友達の靴を隠したら。"
"2003802-50-梅花園の園児C" = "さっきね、そこに蝶々が飛んでたの！"
"2003802-51-梅花園の園児C" = "知ってるー？#n蝶々って、赤ちゃんの時は全然違う形なんだって！"
"2003802-52-トモエ" = "皆さんも大きくなったら、今とはまるで別人になっているかもしれませんね。"
"2003802-53-梅花園の園児D" = "幼稚園って、社会の枠組みに縛り付けるために、こんとろーる？#nするところなんですよ。"
"2003802-54-梅花園の園児D" = "小さい頃からロープにつながれた象さんが、#n大きくなっても逃げ出さないのと同じで……"
"2003802-55-梅花園の園児D" = "あっ、みんなには内緒ですよ。"
"2003802-56-トモエ" = "では、これで私たちは秘密の友達ですね？"
"2003802-59" = "（トモエは園児一人ひとりの話に耳を傾けていた）"
"2003802-60" = "（帰り際、梅花園の教官たちから感謝の言葉をもらった）"
"2003802-63-トモエ" = "お疲れ様でした、先生。"
"2003802-64" = "[s5] \"トモエこそ、お疲れ様。\"\n[s6] \"子どもたちのお世話、慣れてるんだね。\""
"2003802-67-トモエ" = "そうでしょうか？"
"2003802-68-トモエ" = "普段から話をする側の私が、聞くのも上手だなんて知らなかった、と？"
"2003802-69-トモエ" = "ふふっ。"
"2003802-70-トモエ" = "ありがとうございます、先生。"
"2003802-71-トモエ" = "一日に三回も褒められるだなんて、#n今日は記念すべき日ですね。"
"2003802-72-トモエ" = "ただ、話を聞く技術は説得する時に役立つんです。"
"2003802-73-トモエ" = "何事も、まずは相手の話を聞くところから始めなければなりませんから。"
"2003802-74-トモエ" = "それに……。"
"2003802-75" = "[s] \"それに？\""
"2003802-76-トモエ" = "子どもとお話する時間は、楽しいですから。"
"2003802-78" = "（トモエの表情は、いつもより柔らかかった）"
