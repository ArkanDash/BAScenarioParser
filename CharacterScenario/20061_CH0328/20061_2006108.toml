[translation]
"2006108-1" = "鬼怒川カスミ"
"2006108-3-カスミ" = "先生、こっちだ！"
"2006108-4-カスミ" = "私から誘ったとはいえ、まさか二人で海に来ることになるなんてな。"
"2006108-5-カスミ" = "はたから見ればデートと思われそうだ！"
"2006108-10-カスミ" = "少し、歩かないか？"
"2006108-13" = "（カスミと一緒に海辺を散策した）"
"2006108-19-カスミ" = "ここは私が持つ。好きに食べてくれ。"
"2006108-20-カスミ" = "食事がパワーに繋がり、パワーが温泉に繋がるのだ！ハーッハッハッハ！"
"2006108-21-カスミ" = "む？私か？"
"2006108-22-カスミ" = "んー……いや、遠慮しておこう。"
"2006108-23-カスミ" = "どうやら私は小食なようでね。部員からもよく言われるよ。"
"2006108-24-カスミ" = "比較対象が些か大食らいであることは留意してもらいたいが――"
"2006108-27-カスミ" = "くじ引きか。普通に買うよりもロマンがあるな。"
"2006108-28-カスミ" = "先生がやりたいのなら好きなだけチャレンジするといい。#n私の財布の紐がこんなに緩いこともそうそうないぞ！"
"2006108-32-カスミ" = "……なぜ私にやらせようとするんだ？"
"2006108-33-カスミ" = "むぅ……私の好みを言うなら、そうだな……。"
"2006108-34-カスミ" = "この手の場所じゃ、型にはめた「ロマン」をこれ見よがしに提供するからな。"
"2006108-35-カスミ" = "あまりにチープで、お断りだ。"
"2006108-39-カスミ" = "たしかこの場所は……。"
"2006108-40-カスミ" = "ああ、思い出した。取り壊して駐車場にしようとしていたのだったか。"
"2006108-41-カスミ" = "立地は良かったんだがな。近くに源泉がなくて白紙になった。"
"2006108-47-スケバンDJ" = "なんか寒気が……。"
"2006108-59-カスミ" = "……もう夜か。"
"2006108-60-カスミ" = "んぐ……。"
"2006108-61-カスミ" = "んぐぐ……。"
"2006108-66-カスミ" = "降参だ、降参！"
"2006108-67-カスミ" = "本当に何も聞いてこないのだな！！"
"2006108-68-カスミ" = "ここまで強情とは恐れ入る。想定以上だ。"
"2006108-69-カスミ" = "いつも言っていると思うが、私は借りを作るのが大嫌いだ。"
"2006108-70-カスミ" = "やむを得ず作ってしまったなら一刻も早く清算したい！"
"2006108-71-カスミ" = "先生にはもう少し協力的になってほしいものだ。"
"2006108-72-カスミ" = "……1つだけ。"
"2006108-73-カスミ" = "今なら何でも答えよう。これでチャラにしてくれ。"
"2006108-74" = "[s] \"本当！？\""
"2006108-75-カスミ" = "待ってましたと言わんばかりだな。"
"2006108-76-カスミ" = "……本当だ。私は1度言ったことは守る。"
"2006108-77" = "[s1] \"実はずっと気になってて……。\"\n[s2] \"前にさ――\""
"2006108-83" = "[ns3] \"白衣脱いでたよね！？\"\n[ns4] \"白衣を着てないの初めて見た！\""
"2006108-88-カスミ" = "……は？"
"2006108-89-カスミ" = "それが質問か？いや、質問というか……。"
"2006108-90-カスミ" = "……。"
"2006108-91-カスミ" = "本当にいいんだな？"
"2006108-92-カスミ" = "私はよほどのことがない限り、自分の言ったことは守る。"
"2006108-93-カスミ" = "そして……先生。あの話について聞きたいのであれば、チャンスは今日限りだ。"
"2006108-94-カスミ" = "それでもいいのか？"
"2006108-95" = "[s] \"……。\""
"2006108-98" = "[ns] \"すっごい気になってる！！\""
"2006108-99-カスミ" = "だろうな。"
"2006108-100" = "[s5] \"でも、カスミの気持ちが優先だよ。\"\n[s6] \"あんまり話したくなさそうだし。\""
"2006108-103-カスミ" = "そうだな。"
"2006108-104" = "[s7] \"じゃあ大丈夫。\"\n[s8] \"聞かないでおく。\""
"2006108-109-カスミ" = "……む。"
"2006108-110-カスミ" = "むむむむ……。"
"2006108-111-カスミ" = "先生は本当に人を困らせる天才だな。"
"2006108-112-カスミ" = "借りを返したいと言っているのに、また借りを作らせるつもりか？"
"2006108-113-カスミ" = "……いや、お言葉に甘えさせてもらおう。"
"2006108-117-カスミ" = "その代わり、と言ってはなんだが。"
"2006108-118-カスミ" = "さっきの質問について……少しだけ。"
"2006108-119-カスミ" = "私はいつも白衣を着ている。"
"2006108-120-カスミ" = "理由は――"
"2006108-124-カスミ" = "カッコいいからだ。"
"2006108-128-カスミ" = "変なのは百も承知だ。とはいえ……部員たちの感想なのだよ。"
"2006108-129-カスミ" = "映画に出てくるような……頭の良い博士みたいだ、と。"
"2006108-130-カスミ" = "……この私を見て、そう言ってくれるんだ。"
"2006108-131-カスミ" = "だから、それに対する少しばかりの誠意とでも言おうか。"
"2006108-132-カスミ" = "本物のドクターになんてなれやしない。だが、真似はできる。#nそれならば、と。まずは見た目から入ったのさ。"
"2006108-133-カスミ" = "……故に、[ruby=・]あ[/ruby][ruby=・]の[/ruby][ruby=・]時[/ruby][ruby=・]は[/ruby]脱いだ。どうにも気分が悪くてね。"
"2006108-134-カスミ" = "……。"
"2006108-136-カスミ" = "はい、終わり！"
"2006108-139-カスミ" = "似合わない話はここまでだ。"
"2006108-140-カスミ" = "分かっていると思うがこの話は――"
"2006108-141" = "[s9] \"誰にも言わないよ。\"\n[s10] \"二人だけの秘密！\""
"2006108-144-カスミ" = "ははっ。"
"2006108-145-カスミ" = "……先生は、青春に落とし込むのが上手だな。"
"2006108-146-カスミ" = "なに、言葉通りだ。"
"2006108-148-カスミ" = "褒め言葉さ、うむ。"
