[translation]
"2006108-1" = "鬼怒川カスミ"
"2006108-2-カスミ" = "先生、こっちだ！"
"2006108-3-カスミ" = "私から誘ったとはいえ、まさか二人で海に来ることになるなんてな。"
"2006108-4-カスミ" = "はたから見ればデートと思われそうだ！"
"2006108-5-カスミ" = "少し、歩かないか？"
"2006108-6" = "（カスミと一緒に海辺を散策した）"
"2006108-7-カスミ" = "ここは私が持つ。好きに食べてくれ。"
"2006108-8-カスミ" = "食事がパワーに繋がり、パワーが温泉に繋がるのだ！ハーッハッハッハ！"
"2006108-9-カスミ" = "む？私か？"
"2006108-10-カスミ" = "んー……いや、遠慮しておこう。"
"2006108-11-カスミ" = "どうやら私は小食なようでね。部員からもよく言われるよ。"
"2006108-12-カスミ" = "比較対象が些か大食らいであることは留意してもらいたいが――"
"2006108-13-カスミ" = "くじ引きか。普通に買うよりもロマンがあるな。"
"2006108-14-カスミ" = "先生がやりたいのなら好きなだけチャレンジするといい。#n私の財布の紐がこんなに緩いこともそうそうないぞ！"
"2006108-15-カスミ" = "……なぜ私にやらせようとするんだ？"
"2006108-16-カスミ" = "むぅ……私の好みを言うなら、そうだな……。"
"2006108-17-カスミ" = "この手の場所じゃ、型にはめた「ロマン」をこれ見よがしに提供するからな。"
"2006108-18-カスミ" = "あまりにチープで、お断りだ。"
"2006108-19-カスミ" = "たしかこの場所は……。"
"2006108-20-カスミ" = "ああ、思い出した。取り壊して駐車場にしようとしていたのだったか。"
"2006108-21-カスミ" = "立地は良かったんだがな。近くに源泉がなくて白紙になった。"
"2006108-22-スケバンDJ" = "なんか寒気が……。"
"2006108-23-カスミ" = "……もう夜か。"
"2006108-24-カスミ" = "んぐ……。"
"2006108-25-カスミ" = "んぐぐ……。"
"2006108-26-カスミ" = "降参だ、降参！"
"2006108-27-カスミ" = "本当に何も聞いてこないのだな！！"
"2006108-28-カスミ" = "ここまで強情とは恐れ入る。想定以上だ。"
"2006108-29-カスミ" = "いつも言っていると思うが、私は借りを作るのが大嫌いだ。"
"2006108-30-カスミ" = "やむを得ず作ってしまったなら一刻も早く清算したい！"
"2006108-31-カスミ" = "先生にはもう少し協力的になってほしいものだ。"
"2006108-32-カスミ" = "……1つだけ。"
"2006108-33-カスミ" = "今なら何でも答えよう。これでチャラにしてくれ。"
"2006108-34" = "[s] \"本当！？\""
"2006108-35-カスミ" = "待ってましたと言わんばかりだな。"
"2006108-36-カスミ" = "……本当だ。私は1度言ったことは守る。"
"2006108-37" = "[s1] \"実はずっと気になってて……。\"\n[s2] \"前にさ――\""
"2006108-38" = "[ns3] \"白衣脱いでたよね！？\"\n[ns4] \"白衣を着てないの初めて見た！\""
"2006108-39-カスミ" = "……は？"
"2006108-40-カスミ" = "それが質問か？いや、質問というか……。"
"2006108-41-カスミ" = "……。"
"2006108-42-カスミ" = "本当にいいんだな？"
"2006108-43-カスミ" = "私はよほどのことがない限り、自分の言ったことは守る。"
"2006108-44-カスミ" = "そして……先生。あの話について聞きたいのであれば、チャンスは今日限りだ。"
"2006108-45-カスミ" = "それでもいいのか？"
"2006108-46" = "[s] \"……。\""
"2006108-47" = "[ns] \"すっごい気になってる！！\""
"2006108-48-カスミ" = "だろうな。"
"2006108-49" = "[s5] \"でも、カスミの気持ちが優先だよ。\"\n[s6] \"あんまり話したくなさそうだし。\""
"2006108-50-カスミ" = "そうだな。"
"2006108-51" = "[s7] \"じゃあ大丈夫。\"\n[s8] \"聞かないでおく。\""
"2006108-52-カスミ" = "……む。"
"2006108-53-カスミ" = "むむむむ……。"
"2006108-54-カスミ" = "先生は本当に人を困らせる天才だな。"
"2006108-55-カスミ" = "借りを返したいと言っているのに、また借りを作らせるつもりか？"
"2006108-56-カスミ" = "……いや、お言葉に甘えさせてもらおう。"
"2006108-57-カスミ" = "その代わり、と言ってはなんだが。"
"2006108-58-カスミ" = "さっきの質問について……少しだけ。"
"2006108-59-カスミ" = "私はいつも白衣を着ている。"
"2006108-60-カスミ" = "理由は――"
"2006108-61-カスミ" = "カッコいいからだ。"
"2006108-62-カスミ" = "変なのは百も承知だ。とはいえ……部員たちの感想なのだよ。"
"2006108-63-カスミ" = "映画に出てくるような……頭の良い博士みたいだ、と。"
"2006108-64-カスミ" = "……この私を見て、そう言ってくれるんだ。"
"2006108-65-カスミ" = "だから、それに対する少しばかりの誠意とでも言おうか。"
"2006108-66-カスミ" = "本物のドクターになんてなれやしない。だが、真似はできる。#nそれならば、と。まずは見た目から入ったのさ。"
"2006108-67-カスミ" = "……故に、[ruby=・]あ[/ruby][ruby=・]の[/ruby][ruby=・]時[/ruby][ruby=・]は[/ruby]脱いだ。どうにも気分が悪くてね。"
"2006108-68-カスミ" = "……。"
"2006108-69-カスミ" = "はい、終わり！"
"2006108-70-カスミ" = "似合わない話はここまでだ。"
"2006108-71-カスミ" = "分かっていると思うがこの話は――"
"2006108-72" = "[s9] \"誰にも言わないよ。\"\n[s10] \"二人だけの秘密！\""
"2006108-73-カスミ" = "ははっ。"
"2006108-74-カスミ" = "……先生は、青春に落とし込むのが上手だな。"
"2006108-75-カスミ" = "なに、言葉通りだ。"
"2006108-76-カスミ" = "褒め言葉さ、うむ。"
