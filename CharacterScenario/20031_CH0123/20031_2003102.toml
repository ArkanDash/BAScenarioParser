[translation]
"2003102-1" = "豪華に"
"2003102-2" = "（レッドウィンター連邦学園の近くで用事があったので、お菓子を買って旧校舎に立ち寄った）"
"2003102-15-シグレ" = "……あ、先生。"
"2003102-16-シグレ" = "ごめん、ドライフルーツを整理してて気付かなかった。"
"2003102-17-シグレ" = "畳を取りに来たんだよね？この前モモトークで話したやつ。"
"2003102-18-シグレ" = "ちょっと待ってて。あと少しで整理が終わるから……。"
"2003102-19" = "[s] \"急いでないし、ゆっくりでいいよ。\""
"2003102-23" = "[ns1] \"はい、先に渡しておくね。\"\n[ns2] \"前に言ってたお菓子だよ。\""
"2003102-26-シグレ" = "ええっ、本当に買ってきてくれたの？"
"2003102-27-シグレ" = "ちょっと言ってみただけだったのに……#n覚えてくれたなんて、嬉しいな。"
"2003102-32-シグレ" = "ありがとう、先生。みんなと分けて食べるね。"
"2003102-33" = "[s] \"どういたしまして。ところで、まだ浴衣なんだね。\""
"2003102-34-シグレ" = "うん。もう温泉郷を運営することはないと思うけど……。"
"2003102-35-シグレ" = "素材がいいから、ルームウェアに丁度よくてさ。#n旧校舎ではよく着てるんだ。"
"2003102-39-シグレ" = "……温泉郷はなくなっちゃったけど、いろんなものが残ったからね。"
"2003102-40-シグレ" = "畳や浴衣みたいな備品はたくさんあるし……"
"2003102-41-シグレ" = "小さいけど、温泉だって残ってる。#n1人か2人しか入れないから、お客さんを呼べるほどじゃないけど。"
"2003102-42-シグレ" = "だからしばらくは、寒い冬でも温かいお湯で身体を洗えそうだよ。"
"2003102-46" = "[ns3] \"待って、お湯で洗えそうって……。\"\n[ns4] \"じゃあ、今までは……？\""
"2003102-49-シグレ" = "ふふっ。先生、もしかして生徒のお風呂事情が気になるの？"
"2003102-50-シグレ" = "もう、本当にいやらしいんだからぁ。"
"2003102-54-シグレ" = "……まあ、冗談はさておき。#n先生だから、それくらいは教えてもいいか。"
"2003102-55-シグレ" = "今までは、近くの川で洗ってたんだ。#n旧校舎にはまともな入浴施設がないからね。"
"2003102-56-シグレ" = "冬は氷が張ってたけど、割って入れば大丈夫だったし……。"
"2003102-57" = "[s5] \"大問題だよ！？風邪ひいちゃうから！\"\n[s6] \"シャーレのシャワー室、使っていいよ！？\""
"2003102-60-シグレ" = "ふふっ、先生は優しいね。"
"2003102-61-シグレ" = "提案は嬉しいけど、遠慮するよ。#nシャーレはレッドウィンターから離れてるし、#nシャワーを浴びるためだけに行くのは少し手間というか……。"
"2003102-62-シグレ" = "それに、今はもう大丈夫だよ。#nさっきも言った通り、小さな温泉は残ってるし。#nもう凍った川の水で身体を洗うことはないと思う。"
"2003102-63-シグレ" = "そういえば、その温泉なんだけど……#nちょうど今日、アレンジしたところなんだ。"
"2003102-64" = "[s] \"温泉を、アレンジ……？\""
"2003102-65-シグレ" = "うん。温泉郷を運営してたときにお客さんから聞いたんだけど、#n入浴施設によっては果物や香料を入れたお風呂があるんだって。"
"2003102-66-シグレ" = "そうすれば香りがよくなったり、#n身体にいい成分を加えたりできるみたいだよ。"
"2003102-67-シグレ" = "その話を思い出して、せっかくだから試してみたの。#n果物や香料だったら、旧校舎の敷地内でいくらでも手に入るし。"
"2003102-68-シグレ" = "旧校舎はおやつも行き渡らないし、#n楽しめるような娯楽もほとんどないから……。"
"2003102-73-シグレ" = "せめてお風呂くらいは豪華な気分で入れたら、#nみんなも気分転換になるんじゃないかと思って。"
"2003102-74" = "[s7] \"いい考えだね。\"\n[s8] \"きっとみんなも喜ぶよ。\""
"2003102-77-シグレ" = "ふふっ、そうだったらいいな。"
"2003102-78-シグレ" = "あ。せっかくだし、先生も入ってみる？"
"2003102-79-シグレ" = "ここの整理が終わるまで、もう少し時間がかかりそうでさ。"
"2003102-80-シグレ" = "その間に入ってみて、感想を聞かせてほしいな。"
"2003102-81" = "[s] \"そんなに特別な温泉へ、先に入っていいの？\""
"2003102-82-シグレ" = "もちろん。先生には普段から色々とお世話になってるからね。"
"2003102-83-シグレ" = "ふふっ、楽しんでくれるといいな。"
"2003102-85" = "（シグレがアレンジしたという「特別」なお風呂に入った）"
"2003102-89" = "（香料のせいか、お湯はルビーのように赤みを帯びていた……）"
"2003102-94" = "[ns9] \"ほのかに広がる香りは悪くないんだけど……。\"\n[ns10] \"なんだか、顔が熱いような……。\""
"2003102-99-シグレ" = "あ、先生。湯加減はどう？"
"2003102-100" = "[s11] \"うん。ちょうどいいんだけど……。\"\n[s12] \"お湯に一体何を混ぜたの？\""
"2003102-103-シグレ" = "ん？ぶどうジュースだよ。"
"2003102-104-シグレ" = "……旧校舎で眠ってたやつだけど。"
"2003102-108" = "[ns] \"ぶどうジュースって……まさかアレじゃないよね？\""
"2003102-109-シグレ" = "ふふっ、本当にただのぶどうジュースだってば。先生は心配性だなぁ。"
"2003102-110-シグレ" = "ほら、ちゃんとラベルにもそう書いてあるでしょ？#n匂いだって――あっ。"
"2003102-111" = "[s] \"シ、シグレさん……？\""
"2003102-112-シグレ" = "えっと、ぶどうジュースではあったんだけど……#nもしかしたら、ちょっと発酵してたかも？"
"2003102-113-シグレ" = "でもまあ、そんなに大きな問題じゃないでしょ？"
"2003102-114-シグレ" = "「液体」が入ったお風呂に浸かるってだけで、#n直接口から飲むわけじゃないし……。"
"2003102-115-シグレ" = "それに「液体」に含まれてた身体にいい成分を#n肌から吸収できるわけだし――"
"2003102-116" = "[s] \"いやいやいやいや！\""
"2003102-117-シグレ" = "だから細かいことは気にしないで。隣、失礼するね。"
"2003102-118-シグレ" = "やらなきゃいけないことも終わったし、私も温泉に――"
"2003102-119" = "[ns13] \"絶対ダメ！\"\n[ns14] \"この温泉は元通りにして！\""
"2003102-123-シグレ" = "……どうしても、ダメなの？"
"2003102-124-シグレ" = "この温泉を作るために、結構時間がかかったのに……。"
"2003102-125-シグレ" = "……最後にちょっとだけ浸かってみるのもダメ？"
"2003102-126" = "[s] \"ダメです。\""
"2003102-130-シグレ" = "…………はぁ、わかった。"
"2003102-132" = "（その後、赤く染まった温泉水を捨てて、湯船をきれいに掃除した）"
"2003102-133" = "（……ただ入っていた「液体」のせいか、しばらく頭が痛かった）"
