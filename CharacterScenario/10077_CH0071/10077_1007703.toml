[translation]
"1007703-1" = "大したことじゃない"
"1007703-2" = "（仕事終わりに休憩でショッピングモールに寄ったところ……）"
"1007703-6" = "（楽器屋の前でイチカの姿を見かけた）"
"1007703-7-イチカ" = "……ん？"
"1007703-8-イチカ" = "あれ、先生。こんなところでどうしたんすか？"
"1007703-9-イチカ" = "って、それは私の方っすよね。"
"1007703-10-イチカ" = "ま、それは置いといて、会えて嬉しいっす。"
"1007703-11-イチカ" = "……へ？"
"1007703-12-イチカ" = "何を見てたか……？#nああ、そりゃ気になりますよね。"
"1007703-13-イチカ" = "大した理由があるわけじゃないんすけど、ちょっとギターを……"
"1007703-14-イチカ" = "……ギターに興味があるのかって？#nんー、今までまったく興味なかったんすけどね。"
"1007703-15-イチカ" = "そもそも触ったことすらないんで。"
"1007703-19-イチカ" = "はは、いい反応っすね。"
"1007703-20-イチカ" = "まあ、その……今日の朝、路上で弾き語りしてる人を見かけたんすよ。"
"1007703-21-イチカ" = "その姿がなんか……"
"1007703-22-イチカ" = "自分の好きなものに熱中するのって、なんかカッコいいなって。"
"1007703-23-イチカ" = "それで、自分も新しいことに挑戦しようかなって気持ちになったんす。"
"1007703-24-イチカ" = "でも、いざこうして目の前にしてみると……"
"1007703-25-イチカ" = "……はは。"
"1007703-26-イチカ" = "やっぱ、よく分かんないっす……ギターを弾いてる自分を想像しても、なんとなく夢中になれる気はしなくて。"
"1007703-27-イチカ" = "ま、でも！やってみたら、急に興味がワッと溢れたりして！"
"1007703-28-イチカ" = "…………。"
"1007703-29-イチカ" = "なんて、冗談っすけど。……これまでもそういう事なかったんで。"
"1007703-30-イチカ" = "……もしかしたら。"
"1007703-31-イチカ" = "何かに熱中できるのも、才能なのかもしれないっすね。"
"1007703-35-イチカ" = "……ん？"
"1007703-36-イチカ" = "一度やってみたらどうかって……？"
"1007703-37-イチカ" = "聞いてみたいんすか……？"
"1007703-38-イチカ" = "……私の演奏を？"
"1007703-39-イチカ" = "私が……"
"1007703-40-イチカ" = "ギターを……？"
"1007703-41-イチカ" = "……えーっと。"
"1007703-45-イチカ" = "いやいやいや！なに言ってるんすか、いきなりそんな！？"
"1007703-46-イチカ" = "触ったことすらないってさっき言ったじゃないすか！"
"1007703-47" = "[s1] \"まずは簡単なところから始めてみたらどうかな？\"\n[s2] \"練習なら付き合うよ。\""
"1007703-50-イチカ" = "や、でも……"
"1007703-51-イチカ" = "いきなりそんなこと言われても……困るっす……"
"1007703-52-イチカ" = "やってみたい気持ちはあるっすけど……"
"1007703-53-イチカ" = "やっぱその……"
"1007703-54-イチカ" = "ううーん……"
"1007703-55-イチカ" = "……う～ん。"
"1007703-56-イチカ" = "まあ……なんとかなるっすよね！#nそれに、先生が聞きたいって言ったんすから！"
"1007703-57-イチカ" = "下手でも笑わないでくださいよ、絶対！"
"1007703-58" = "[s3] \"もちろん、そんなことしないよ。\"\n[s4] \"気楽にいこう！\""
"1007703-61-イチカ" = "じゃ、じゃあまずは……初心者用で一番安いやつを……！"
"1007703-67" = "（イチカは店に入ると、ショーウィンドウに飾られていたギターを買ってきた）"
"1007703-68" = "（そして、ギターを背負い近くの川沿いへと向かった）"
"1007703-70-イチカ" = "いやー……本物のギターっすね。"
"1007703-71-イチカ" = "なんとなーく、いいなと思ってただけなのに、まさか本当に買っちゃうなんて……楽譜も買っちゃったっす。"
"1007703-72-イチカ" = "こんな川沿いで弾いてたら、うまいと勘違いされそうで恥ずかしいっすね。はは。"
"1007703-73-イチカ" = "まぁ、でも……とりあえず初心者用の教本を見て……"
"1007703-74-イチカ" = "書いてある通りにやれば、なんとかなりますかね……？#nたぶん。"
"1007703-75" = "[s5] \"すぐにはうまく弾けないかもしれないけど……\"\n[s6] \"まずは軽く鳴らしてみよっか。\""
"1007703-78-イチカ" = "ええっと……ここを、握ればいいんすかね……？"
"1007703-79-イチカ" = "んー……コードは……ここを押さえて……"
"1007703-80-イチカ" = "……で、こう？"
"1007703-84-イチカ" = "……こんな感じっすかね？"
"1007703-88" = "[ns7] \"本当に初めて触ったの……？\"\n[ns8] \"そんなにサラッと弾いちゃうなんて……\""
"1007703-91-イチカ" = "へ？"
"1007703-92-イチカ" = "まあ、初心者向けのギターっすから！#nそんな難しくないんじゃないっすかね。"
"1007703-93-イチカ" = "教本を見れば、みんなすぐできるようになると思うっすよ？#n料理もレシピ通り作れば、誰でもできるように。"
"1007703-94-イチカ" = "だから楽器も似たようなものかなって……調理器具と一緒で、同じ人間が作ったものですし。"
"1007703-95-イチカ" = "やり方さえ分かれば、誰でもできるっすよ。"
"1007703-96-イチカ" = "どれも基本を理解すれば、後は応用するだけなんで。"
"1007703-97-イチカ" = "そんなに大したことではないっす。"
"1007703-98-イチカ" = "……ん？"
"1007703-99-イチカ" = "それでもすごいって……？"
"1007703-100-イチカ" = "周りから何でもできるね、って言われたこと……？"
"1007703-101-イチカ" = "ま、ゼロではないっすけど……"
"1007703-102-イチカ" = "……そんなに褒めたって何も出ないっすよ！"
"1007703-103-イチカ" = "それより、もうちょっと練習したいっす。"
"1007703-107-イチカ" = "この楽譜から先生の好きな曲を選んでもらってもいいっすか？#nちょっと弾いてみるんで。"
"1007703-110" = "（その後、イチカのギターを聴きながら川辺で過ごした）"
"1007703-111" = "（イチカは「初めて」と言っていたが、どの演奏も初心者の腕前には思えなかった）"
