[translation]
"1010205-1" = "予想外の思い出"
"1010205-2" = "（ヒヨリから連絡をもらい、夕方頃に海辺を訪れた）"
"1010205-7-ヒヨリ" = "えへへ、また見つけました……。"
"1010205-8-ヒヨリ" = "どれどれ……これも小さいけど、使えそうですね。"
"1010205-12" = "[ns] （何かを拾い集めているようだけど……）"
"1010205-13-ヒヨリ" = "この辺りは、これで全部ですかね……あ、まだありました。"
"1010205-17-ヒヨリ" = "……きっと、先生も喜んでくれるはず！"
"1010205-18-ヒヨリ" = "あ、こっちにも……！"
"1010205-20" = "（しばらくヒヨリの様子を見守ることにした）"
"1010205-22" = "[ns] \"ヒヨリ、来たよ。\""
"1010205-23-ヒヨリ" = "あっ、先生。"
"1010205-24-ヒヨリ" = "もう約束の時間ですか……？#nい、いつの間に……。"
"1010205-25-ヒヨリ" = "来てくれてありがとうございます、先生。"
"1010205-26-ヒヨリ" = "今日お呼びしたのは、先生にお礼をするためです……えへへ。"
"1010205-27-ヒヨリ" = "先生には、いつもお世話になっているので……。"
"1010205-28" = "[s1] \"気にする必要はないよ。\"\n[s2] \"私が好きでやってることだから。\""
"1010205-31-ヒヨリ" = "そ、そうなんですか？#nでもこのままじゃ、すっきりしなくて……。"
"1010205-32-ヒヨリ" = "つまらないものですが、どうか受け取ってほしいんです……えへへ。"
"1010205-33-ヒヨリ" = "……って。#nまだ完全に暗くなっていないので、もう少し待たないと。"
"1010205-34-ヒヨリ" = "どうして待つ必要があるのか、って？"
"1010205-35-ヒヨリ" = "そ、それは秘密です。#nえへへ……。"
"1010205-36-ヒヨリ" = "……少し、待ちましょうか。"
"1010205-40-ヒヨリ" = "そろそろ良さそうです……！"
"1010205-41-ヒヨリ" = "……では、始めます。"
"1010205-47-ヒヨリ" = "バケツに集めたコレに、火を……"
"1010205-48-ヒヨリ" = "あ、つきました！#n先生、近くで見てみてください……！"
"1010205-49" = "[s] \"……？\""
"1010205-52-ヒヨリ" = "えへへ……花火です。"
"1010205-53-ヒヨリ" = "実は、さっき砂浜で捨てられた花火を集めていたんです。"
"1010205-54-ヒヨリ" = "夏のビーチで花火は必須だと、雑誌で見たので……。"
"1010205-55-ヒヨリ" = "ちゃんと花火セットを買いたかったんですが、#nそんなお金はどこにもなくて……。"
"1010205-56-ヒヨリ" = "ど、どうですか……？#nこれなら、先生に楽しんでもらえると思ったんですけど……。"
"1010205-57" = "[s3] \"うん、きれいな花火だね。\"\n[s4] \"とても良い思い出になったよ、ヒヨリ。\""
"1010205-60-ヒヨリ" = "よ、良かったです……。"
"1010205-61-ヒヨリ" = "実は、先生をがっかりさせないか、ずっと心配でした。"
"1010205-62-ヒヨリ" = "いつか、本物の花火をやってみたいですね……えへへ。"
"1010205-63-ヒヨリ" = "その時は、ぜひ先生も一緒に……。"
"1010205-67-ヒヨリ" = "あれ……バケツの中で変な音が。"
"1010205-71-ヒヨリ" = "ひえっ！"
"1010205-72" = "[s] \"うわっ！！\""
"1010205-74-ヒヨリ" = "げほ、げほっ……。"
"1010205-75-ヒヨリ" = "中に変なものが混ざっていたようです。#n衝撃でバケツが横に倒れちゃいましたし……。"
"1010205-79-ヒヨリ" = "花火が一つ残らず消えて……。#nうぅ、もう終わりです。"
"1010205-80-ヒヨリ" = "どうしていつもこうなるんですか！？#n私の人生には花火なんて不要だって言いたいんですか！？"
"1010205-81-ヒヨリ" = "うわぁぁぁぁぁああん！"
"1010205-83" = "（ヒヨリを落ち着かせてから、花火セットを買って一緒に遊んだ）"
"1010205-84" = "（……幸い、ヒヨリは元気を取り戻してくれた）"
