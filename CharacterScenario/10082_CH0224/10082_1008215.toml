[translation]
"1008215-1" = "青春の白いリボン"
"1008215-2" = "（待ち合わせの時間ピッタリに到着した）"
"1008215-8-レンゲ" = "お、アタシも今ついたとこだよ！"
"1008215-9-レンゲ" = "さすが師匠だ！"
"1008215-10-レンゲ" = "それじゃあ今日は、ここをゆっくり見て回ろっか。"
"1008215-14-レンゲ" = "おっ、あれいいなあ。"
"1008215-19-レンゲ" = "ほら、あのひょっとこのお面……。"
"1008215-20-レンゲ" = "……師匠がつけたら面白そう。"
"1008215-26-レンゲ" = "あははっ！変な顔！"
"1008215-27-レンゲ" = "ついでにこの風呂敷を頭に巻いたら――"
"1008215-31-レンゲ" = "あはははっ！最高……！"
"1008215-32-レンゲ" = "すみません、これくださいー！"
"1008215-33-商店の主人" = "まいど！カップル割はないんだけど、巾着袋おまけしとくよ！"
"1008215-34-レンゲ" = "か、カップル！？いやアタシたちは……。"
"1008215-35" = "[s1] \"師匠と弟子の――\"\n[s2] \"禁断のカップル……か。なるほどね。\""
"1008215-38-レンゲ" = "いや先生もつっこんでよ！？"
"1008215-39-レンゲ" = "というか、そのお面被っていうセリフじゃなくない！？"
"1008215-40" = "[s3] \"ふふふ。レンゲは欲しいものある？\"\n[s4] \"せっかくだし、私もプレゼントしたいんだ……。\""
"1008215-43-レンゲ" = "わ、わかったから、その変な笑い方はやめてくれ！"
"1008215-44-商店の主人" = "なんだか微笑ましいですね……。"
"1008215-45-商店の主人" = "ああ、これが青春……！"
"1008215-49" = "[ns] \"そういえば……。\""
"1008215-51" = "[ns5] \"レンゲって白いリボンがお気に入りみたいだけど。\"\n[ns6] \"他の色も着けたりするの？\""
"1008215-54-レンゲ" = "リボン……？"
"1008215-55-レンゲ" = "あぁ、これか。"
"1008215-56" = "[s] \"なにか青春のこだわりがあるのかなって。\""
"1008215-57-レンゲ" = "うーん、こだわりというほどじゃないんだけど……。"
"1008215-58-レンゲ" = "……師弟関係だからな。この際秘密はなしだ！"
"1008215-59-レンゲ" = "アタシが好きな青春小説の主人公が――"
"1008215-60-レンゲ" = "こういう白いリボンをしてたんだ。"
"1008215-61-レンゲ" = "一見ただのリボンなんだけど、主人公にとっては特別で……。"
"1008215-62-レンゲ" = "彼女の青春に深く結びついているんだ。"
"1008215-63-レンゲ" = "それが、読んでていいな……って思ったから、アタシも真似をしてみたんだ。"
"1008215-64" = "[s] \"じゃあ、同じデザインのリボンをプレゼントするよ！\""
"1008215-65-商店の主人" = "そういうことでしたら……。"
"1008215-66-商店の主人" = "こちらなどいかがでしょうか！"
"1008215-67-レンゲ" = "聞いてたのかよ！"
"1008215-72" = "[ns] \"よし、決めた！\""
"1008215-75-レンゲ" = "でも、本当にいいのかな……。"
"1008215-76-レンゲ" = "これを師匠から受け取ったらその……。"
"1008215-77" = "[s] \"別のデザインがよかった？\""
"1008215-78-レンゲ" = "ち、違う！もらうのはめちゃくちゃ嬉しいんだけど……！"
"1008215-79-レンゲ" = "そ、その……。"
"1008215-80-商店の主人" = "でしたら、ぜひ受け取ってあげてください……！"
"1008215-81-レンゲ" = "あーーーもうっ！"
"1008215-82-レンゲ" = "わかった。あ、ありがとう先生……大事にする……。"
"1008215-83" = "[s] \"小説の主人公くらい？\""
"1008215-84-レンゲ" = "……！この話はもう終わり！"
"1008215-90-レンゲ" = "さ、さあて……買い物も楽しんだし、きょ、今日の青春活動はここまでにしよっか！"
"1008215-94-レンゲ" = "り、リボンありがとう！じゃ、また！"
"1008215-98" = "[ns] \"……行ってしまった。\""
"1008215-99-商店の主人" = "あの子が話していた青春小説の内容……。"
"1008215-103-商店の主人" = "ご存じなさそうですね。"
"1008215-104-商店の主人" = "店頭に立ってると、よくこんな場面に出くわしますよ。ははは。"
"1008215-105-商店の主人" = "実はですね、あの白いリボン……。"
"1008215-107" = "（商店の主人から、リボンの意味について教えてもらった）"
"1008215-109-レンゲ" = "どうしよう……。"
"1008215-110-レンゲ" = "もらっちゃった……。"
"1008215-114-レンゲ" = "主人公が――"
"1008215-118-レンゲ" = "恋人から初めてもらったリボン……！"
"1008215-119-レンゲ" = "まさか、こんなことになるなんて……。"
"1008215-120-レンゲ" = "師匠、あの小説読んでたりするのかな……？"
"1008215-121-レンゲ" = "それともただのいたずら？"
"1008215-122-レンゲ" = "でも、もし……。"
"1008215-127-レンゲ" = "あーもうっ！何でこんなことに……！"
"1008215-131" = "[ns] \"レンゲ、入ってもいいかな？\""
"1008215-133-レンゲ" = "！？い、いいけど……。"
"1008215-137" = "[ns] \"ここにいると思った。\""
"1008215-138-レンゲ" = "な、何か気になることでもあったか……？"
"1008215-139" = "[s] \"あのリボン、小説の展開だとあの後……。\""
"1008215-140-レンゲ" = "師匠！？"
"1008215-141-レンゲ" = "やっぱり、知ってたのか？"
"1008215-142" = "[s7] \"おっと……何のことかな？\"\n[s8] \"私は何も聞いてないよ。ふふふ。\""
"1008215-145-レンゲ" = "絶対嘘だ！"
"1008215-146" = "[s] \"……でも、小説のシーンを再現するのも、青春活動かなって。\""
"1008215-147-レンゲ" = "……！！"
"1008215-148-レンゲ" = "た、確かに……！"
"1008215-149-レンゲ" = "う、ううっ！い、嫌じゃないけど……！"
"1008215-150-レンゲ" = "じゃ、じゃあ……リボン、つけてもらおうかな。"
"1008215-151-レンゲ" = "でも、これ以上からかうのは禁止だからね……！"
"1008215-158" = "（その後、レンゲにリボンをつけ、二人だけの青春を楽しんだ）"
