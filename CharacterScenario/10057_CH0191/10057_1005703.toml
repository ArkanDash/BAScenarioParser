[translation]
"1005703-1" = "結果は過程の中に"
"1005703-3-店主A" = "さあ、寄ってらっしゃい、見てらっしゃい！年末セールの大放出ですよ！"
"1005703-4-店主B" = "ほらそこの方もどうぞどうぞ！今ならおまけ付き！"
"1005703-5-店主C" = "何をお探しでしょう？ウチは味も良ければ鮮度も抜群です！"
"1005703-6" = "[s] \"ここは……。\""
"1005703-8-ハルナ" = "うふふ。"
"1005703-9-ハルナ" = "商店街の市場です。"
"1005703-10-ハルナ" = "年末ですから、いつも以上に活気がありますね。"
"1005703-11" = "[s] \"それは分かるけど、どうして市場に？\""
"1005703-12-ハルナ" = "それは……"
"1005703-13-ハルナ" = "市場こそ、味を巡る戦場！"
"1005703-14-ハルナ" = "……というわけです。"
"1005703-15-ハルナ" = "素晴らしい材料を、少しでも良い値段で売ろうとする商人たち。"
"1005703-16-ハルナ" = "一方で、それをなんとか安く買おうと交渉するシェフや店主……。"
"1005703-17-ハルナ" = "市場とは、その両者の間で真剣勝負が繰り広げられる場所なのです！"
"1005703-18-ハルナ" = "そこで今日は、直接その場を見ておこうかと。"
"1005703-19-ハルナ" = "美食の道を歩む者として……"
"1005703-20-ハルナ" = "やはり美食が提供されるまでの過程も知っておかねば。"
"1005703-21-ハルナ" = "――そう思いまして。"
"1005703-28-競売人" = "さあさあ、一つ目から注目だよ！まずはこの大きな鯛から！"
"1005703-29-競売人" = "どうだい？このきれいでツヤのある赤！"
"1005703-30-競売人" = "こんな大物、めったに出会えないよ！さ、準備はいいかい？"
"1005703-32-食堂オーナー" = "ふむ。確かに物は良いが……。"
"1005703-33-料理人" = "あとは金額次第だな……予算も無限というわけではない。"
"1005703-34-店員" = "社長からは、とにかく良い鯛を買ってこいと言われてるけど……。"
"1005703-36-競売人" = "それでは、まず6500円から！"
"1005703-37-食堂オーナー" = "7000！"
"1005703-38-料理人" = "それなら……7200！"
"1005703-39-店員" = "な、7300！"
"1005703-40-食堂オーナー" = "最初から飛ばすな、7500！"
"1005703-41-料理人" = "少し厳しいけど……7700！"
"1005703-42-店員" = "うぅ、大丈夫かな……7750！"
"1005703-44-ハルナ" = "ご覧ください先生、熱くなってまいりましたね。"
"1005703-45-ハルナ" = "ふふふ、これが美食につながる競争。"
"1005703-46-ハルナ" = "その過程でも生まれる熱い戦い。"
"1005703-47-ハルナ" = "見ているこちらまで、気持ちが高ぶってきますわ。"
"1005703-48" = "[s] \"楽しそうだね、ハルナ。\""
"1005703-49-ハルナ" = "はい、とても。日常というものは、別の誰かにとっては珍しく映るものですから。"
"1005703-50-ハルナ" = "それにこうして競りを見ていると、なんだか……。"
"1005703-51" = "[s] \"なんだか？\""
"1005703-52-ハルナ" = "9000！"
"1005703-53" = "[s] \"ハルナ！？\""
"1005703-55-食堂オーナー" = "ほお。そこのお嬢さん、いきなり強気じゃないか？"
"1005703-56-料理人" = "ここはシェフの名誉にかけて、簡単には退けないな。"
"1005703-57-店員" = "あぁ……どうしよう。社長に一度連絡したほうがいいかな……。"
"1005703-58-食堂オーナー" = "9500で！"
"1005703-59-料理人" = "こっちは9800！"
"1005703-60-店員" = "それなら10000！"
"1005703-65" = "（その後も競売はヒートアップしていった）"
"1005703-66" = "（見事に鯛を競り落とした勝者は……なんとハルナだった）"
"1005703-67" = "（値段には触れないことにしよう）"
"1005703-72-ハルナ" = "ふふ、ふふふっ……。"
"1005703-73" = "[s] \"だ、大丈夫……？\""
"1005703-74-ハルナ" = "何を仰いますか、先生。"
"1005703-75-ハルナ" = "これも究極の美食のためと思えば、むしろ安いもの。"
"1005703-76-ハルナ" = "しかし次は、こちらの鯛をどのように味わうのかという問題が出てきましたわね。"
"1005703-77-ハルナ" = "これについては、知人の料理人にお願いするとしましょう。"
"1005703-78-ハルナ" = "一緒に来てくださいますよね？"
"1005703-86-従業員" = "お待たせいたしました。まずは鯛のお粥です。"
"1005703-87-ハルナ" = "あら、これはまた……。"
"1005703-92-従業員" = "続いて、握りと刺し身です。"
"1005703-93-従業員" = "皮は軽く炙りました、すぐお召し上がりいただけると良いかと。"
"1005703-94-ハルナ" = "なるほど。"
"1005703-96-従業員" = "こちらは天ぷらと太巻きです。"
"1005703-97-ハルナ" = "ふむふむ……。"
"1005703-99-従業員" = "骨とほほ肉の旨味を余すことなく使った、すまし汁のうどんです。"
"1005703-100-ハルナ" = "なるほど、頂きますわ。"
"1005703-102-従業員" = "デザートには、ドライフルーツをすりおろして作ったジェラートです。"
"1005703-106-ハルナ" = "はい、ありがとうございます。"
"1005703-109-ハルナ" = "どうでしたか、先生？"
"1005703-110" = "[s1] \"何かこう、複雑な味というか……。\"\n[s2] \"美味しかったと思うけど……？\""
"1005703-113-ハルナ" = "なるほど。"
"1005703-114-ハルナ" = "私としては、せっかく競りで落としたは良かったものの……。"
"1005703-115-ハルナ" = "何と言いますか……特別な美味しさは無かったように思いました。"
"1005703-116" = "[s3] \"今度は市場を爆発させるとか……？\"\n[s4] \"まさか、料理屋さんを襲うとか……？\""
"1005703-119-ハルナ" = "いえ、一般的には美味しいと言えるお料理でしたから。"
"1005703-120-ハルナ" = "それに、競売の楽しさも知れました。"
"1005703-121-ハルナ" = "何より、先生をおもてなしできましたので。先生に喜んでいただけたのなら何よりですわ。"
"1005703-122" = "[s] \"それなら良かった。\""
"1005703-123-ハルナ" = "はい。ですが……"
"1005703-125-ハルナ" = "やはり究極の美食を探究する道のりは、一筋縄ではいきませんわね。"
