[translation]
"1014705-1" = "サツキの痛み対策"
"1014705-2" = "（水に入ることにも慣れてきたサツキと、水遊びに出かけた）"
"1014705-7-サツキ" = "ふふ、なかなか上手いじゃない。"
"1014705-8-サツキ" = "でも、私だって――"
"1014705-12" = "[ns] \"隙あり！\""
"1014705-13-サツキ" = "きゃっ！？"
"1014705-19" = "[ns] \"ふふふ、戦いの最中におしゃべりとは余裕だね！\""
"1014705-21-サツキ" = "うう……ちょっと！#n海水が口に入ったじゃない……。"
"1014705-25-サツキ" = "もう、せんせ――"
"1014705-29-サツキ" = "きゃあああっ！！"
"1014705-34" = "[ns] \"お、落ち着いて！サツキ！ただのワカメだから！\""
"1014705-37-サツキ" = "はぁ、はぁ……。未知の怪物の触手かと思ったわ……。"
"1014705-38-サツキ" = "黒いし、ぬめぬめしてるし……いやぁ……！"
"1014705-39-サツキ" = "ワカメだろうが昆布だろうが、海藻はあまり好きじゃないわ……。"
"1014705-40" = "[s] \"ごめん……悪ふざけが過ぎたね……。\""
"1014705-41-サツキ" = "なによ、そんなしおらしい顔して。"
"1014705-42-サツキ" = "まあ……わざとじゃないのは分かってるから、今回は許してあげる。"
"1014705-43-サツキ" = "でもやっぱり、海って怖い場所ね。油断大敵だわ。"
"1014705-44-サツキ" = "海藻もそうだけど……あそこに浮かんでいる――"
"1014705-45-観光客A" = "おい！クラゲがいるぞ！！"
"1014705-46-観光客B" = "うわあああ！逃げろ！"
"1014705-47-サツキ" = "……そう、ああいうの。"
"1014705-48-サツキ" = "先生は、クラゲについて詳しい？"
"1014705-49" = "[s1] こくこく。\n[s2] ふるふる。"
"1014705-52-サツキ" = "クラゲは、海で最も危険な存在の1つなの。"
"1014705-53-サツキ" = "カツオノエボシなんかはものすごく毒性が強いから、絶対に触っちゃダメ。"
"1014705-54-サツキ" = "青かったり紫のクラゲを見つけたら、すぐに距離を取るのよ。"
"1014705-55-サツキ" = "もちろん、ハコクラゲみたいに透明なクラゲもいるから気をつけてね。"
"1014705-56-サツキ" = "刺されたら、と～っても痛いんだから。#nうう……想像するだけで寒気がしてくるわ……。"
"1014705-57" = "[s] \"サツキ、すごく詳しいんだね！\""
"1014705-58-サツキ" = "当然でしょう？"
"1014705-59-サツキ" = "万魔殿情報部の総力を挙げて、海の危険な要素を調べ上げたんだから。"
"1014705-60-サツキ" = "……。"
"1014705-61-サツキ" = "は、話してたら怖くなってきたわ。もう少し向こうへ行きましょう……。"
"1014705-63" = "（サツキと一緒に移動していると……）"
"1014705-70-サツキ" = "海の中を歩くのって、思ったよりも難しいのね。#n手を放しちゃダメよ、先生。"
"1014705-74-サツキ" = "……？"
"1014705-75-サツキ" = "い、今！足に何か――"
"1014705-79-サツキ" = "く、クラゲ……！あ、足……！"
"1014705-84" = "（状況を確認する間もなく、サツキが抱きついてきた）"
"1014705-88-サツキ" = "せ、先生！太ももに！クラゲが！"
"1014705-89-サツキ" = "だ、ダメ……もう終わりよ……！"
"1014705-90-サツキ" = "来てしまうわ……！耐え難い苦痛が……！"
"1014705-94" = "[ns3] \"これは……。\"\n[ns4] \"ビニール袋だね。\""
"1014705-98-サツキ" = "……え？……あら。"
"1014705-99-サツキ" = "もう！誰よこんなものを海に捨てたのは！"
"1014705-100-サツキ" = "はぁ……はぁ……はぁ……。"
"1014705-101" = "[s] \"サツキ、これだと動けないんだけど……。\""
"1014705-102-サツキ" = "ちょっと待って頂戴……。#n腰が抜けてしまって……。"
"1014705-106-サツキ" = "先生の身体、すごく暖かいのね。"
"1014705-111-サツキ" = "海では体温維持も大切なのよ。#nだから、もう少しこのまま……。"
"1014705-113" = "（サツキはそのまましばらく離れなかった）"
"1014705-114" = "（その後、サツキと浜辺のゴミを拾った）"
