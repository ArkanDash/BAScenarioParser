[translation]
"1014706-1" = "サツキの視線対策"
"1014706-5-サツキ" = "こっちのビーチは人が多いわ……。"
"1014706-6-サツキ" = "同じ海でも、場所によって結構違うのね。"
"1014706-7" = "[s1] \"にぎやかというか――\"\n[s2] \"『ザ・海！』って感じだね。\""
"1014706-10-サツキ" = "そうね。ちょっと騒がしいくらいだわ。"
"1014706-11-サツキ" = "実は私、人が多い場所ってあまり好きじゃないの。"
"1014706-12-サツキ" = "人が多いと、気にすることが増えるじゃない？"
"1014706-13-サツキ" = "それでもここに来たのは――"
"1014706-14-サツキ" = "いつもと違う環境で、私の心がどう動くか観察したかったから。"
"1014706-15-サツキ" = "最近、先生と一緒にいると不思議な気分になるの。"
"1014706-16-サツキ" = "あ、別にイヤとかじゃないのよ？むしろその逆。"
"1014706-17-サツキ" = "帰ったら、今日のデータをもとにその理由を分析してみるつもり。"
"1014706-21-子供A" = "あははっ！捕まえたらジュースもらうね！"
"1014706-26-子供B" = "待ってよ……あっ！"
"1014706-30" = "[ns] \"あちゃ～、派手に転んじゃったね……！\""
"1014706-31-子供B" = "うわあああん！痛いよ～！！"
"1014706-36" = "[ns] \"大丈夫？怪我はない？\""
"1014706-38-子供B" = "ぐすっ……うん……。"
"1014706-39" = "[s] \"砂の上は転びやすいから、ゆっくり歩こうね。\""
"1014706-40-子供B" = "うん！ゆっくり歩く！"
"1014706-45-子供A" = "ゆっくり歩く～！"
"1014706-53-サツキ" = "へぇ……すぐ泣き止んでえらいわね。痛かったでしょうに。"
"1014706-54-サツキ" = "それにしても……先生は子どもの扱いにも慣れてるのね。"
"1014706-55" = "[s] \"一応先生だからね。\""
"1014706-56-サツキ" = "うふふ。さすが私の協力者といったところかしら。"
"1014706-57-サツキ" = "それで、さっきの話だけど――"
"1014706-58-観光客A" = "た、助けてください！！"
"1014706-59-サツキ" = "えっ……。"
"1014706-60" = "[s] \"誰か溺れてる！？\""
"1014706-64" = "（溺れかけている人を、水から引き上げた）"
"1014706-67-観光客" = "はぁ、はぁ……あ、ありがとうございます……。"
"1014706-68-観光客" = "突然足がつっちゃって……頭が真っ白になっちゃいまして……。"
"1014706-69" = "[s] \"準備運動を入念にすると良いかもしれませんね。\""
"1014706-70-観光客" = "いやぁ～海を見ていると飛び込みたくなっちゃった！すみません！"
"1014706-71-観光客" = "おかげで命拾いしました。助けていただきありがとうございます。"
"1014706-76-サツキ" = "ふぅん……あんなに即座に動けるなんて。"
"1014706-77-サツキ" = "困っている人を見ると放っておけないのかしら。"
"1014706-78-サツキ" = "でも気をつけて頂戴。#n水難事故の救助は、救助者も巻き込まれる可能性があるのよ。"
"1014706-79" = "[s3] \"うん、ありがとう。\"\n[s4] \"気をつけるね。\""
"1014706-82-サツキ" = "人が多いと、こういう問題も出てくるわね。"
"1014706-83-サツキ" = "じゃあ――"
"1014706-87-ヴァルキューレの海警" = "あれ？もしかしてシャーレの先生ですか？"
"1014706-88" = "[s] \"うん、そうだよ。\""
"1014706-89-ヴァルキューレの海警" = "ちょうどよかった！ もしよろしければ、少し手伝っていただけませんか？"
"1014706-90-ヴァルキューレの海警" = "海の家でちょっとしたケンカが起きているんですが、二人とも強情で……。"
"1014706-91-ヴァルキューレの海警" = "私たちだけでは手に負えなくて……。#n先生の話なら、二人とも聞くと思うのですが……。"
"1014706-92" = "[s] \"どこに行けばいい？\""
"1014706-96-ヴァルキューレの海警" = "ありがとうございます！こちらです！"
"1014706-104" = "（その後もトラブルは続き、忙しく動き回った……）"
"1014706-107" = "[ns] \"ふう……。\""
"1014706-110-サツキ" = "……。"
"1014706-111" = "[s] \"ごめんね、サツキ……ずっとバタバタしてて。\""
"1014706-112-サツキ" = "ふぅん……。"
"1014706-113-サツキ" = "まあ、仕方ないわ。"
"1014706-114-サツキ" = "先生は事件を見過ごせない性分だものね。"
"1014706-115-サツキ" = "でも……視野が広すぎるのも考え物よ。"
"1014706-116-サツキ" = "今日起きた事件のほとんどは、先生がいなくても解決したんじゃない？"
"1014706-117" = "[s] \"それは……そうかも。\""
"1014706-118-サツキ" = "だから……今からはよそ見禁止。"
"1014706-119-サツキ" = "先生は私のことだけ見ていればいいの。"
"1014706-120-サツキ" = "それが一番安全なんだから。"
"1014706-121" = "[s] \"周りを見ないほうが、むしろ危ないと思うんだけど……。\""
"1014706-122-サツキ" = "先生の代わりに、私が見ていてあげる。これで安心でしょ？"
"1014706-123-サツキ" = "だから……先生は私だけ見ていて頂戴。"
"1014706-128-サツキ" = "ほら、ここに座って。"
"1014706-130" = "（しばらくして……）"
"1014706-132-サツキ" = "……。"
"1014706-133" = "[s] \"ねえ、サツキ。\""
"1014706-134-サツキ" = "なぁに、先生？"
"1014706-135" = "[s5] \"サツキもずっと私のこと見てるけど……。\"\n[s6] \"これだと、他を見られてないんじゃない？\""
"1014706-141-サツキ" = "え？そ、そうかしら？"
"1014706-142-サツキ" = "私……そんなに先生のことばかり見ているの……？"
"1014706-143" = "[s] \"うん。さっきからずっと……。\""
"1014706-144-サツキ" = "……。"
"1014706-145-サツキ" = "よ、よく気づいたわね！"
"1014706-146-サツキ" = "先生がちゃんと私の話を聞いているかテストしていたのよ。"
"1014706-150-サツキ" = "さ、気を取り直して続けましょ。"
"1014706-157" = "（それからも、サツキが視線をそらすことはなかった）"
"1014706-158" = "（帰るまで、ずっと私だけをどこか嬉しそうに見ていた）"
