[translation]
"1013403-1" = "始まりの町"
"1013403-3-アリス" = "あの、先生……これは？"
"1013403-4" = "[ns] \"特訓だよ！！\""
"1013403-5-アリス" = "えっと、でもこれは……。"
"1013403-6-アリス" = "普通のゲーム……ですよね？"
"1013403-7" = "[ns] \"特訓だよ！！\""
"1013403-8-アリス" = "た、大変です！"
"1013403-9-アリス" = "先生が壊れてしまいました！"
"1013403-10" = "[s1] \"考えてみたんだけどさ。\"\n[s2] \"アリスはまだ勇者のアーマーに慣れてないんだと思うんだ。\""
"1013403-15" = "[ns3] \"だから、まずは体に馴染ませるところからかなって。\"\n[ns4] \"緊張せずにアーマーを着られるようになろう！\""
"1013403-18-アリス" = "体に馴染ませる……？"
"1013403-19-アリス" = "勇者のアーマーを着用して、ゲームをするだけでいいのですか？"
"1013403-23-アリス" = "うぅん……。"
"1013403-24-アリス" = "それがどうして修行になるのか、アリスにはよく分かりません。"
"1013403-28-アリス" = "先生？なぜ電気を消すのですか？"
"1013403-29-アリス" = "え……？電気を消した方が、没入感があって面白い……？"
"1013403-30-アリス" = "それは、アリスもそう思いますが……。"
"1013403-31-アリス" = "電気を消してゲームをすると目が悪くなる！と、先生はいつも言っていました！"
"1013403-32" = "[s5] \"そう、普段はダメだよ。\"\n[s6] \"でも、今日は特訓だから。\""
"1013403-35-アリス" = "……！"
"1013403-36-アリス" = "アリス、なんだかドキドキしてきました！"
"1013403-37-アリス" = "夜遅くまでゲームをしていて、こっそりコンビニに行った時と似た感じです！"
"1013403-41-アリス" = "……はっ！これは内緒なんでした。"
"1013403-42-アリス" = "そ、それよりもゲームです！何をプレイしたらいいですか？"
"1013403-43-アリス" = "えっ、好きなものでいい……？"
"1013403-44-アリス" = "アリス、好きなゲームはたくさんあります！"
"1013403-50-アリス" = "……どれも名作ばかりで選べません！"
"1013403-54-アリス" = "たとえばこれ！"
"1013403-55-アリス" = "これは、大きな武器でドラゴンを狩るゲームです！"
"1013403-56-アリス" = "ドラゴンを狩って入手した素材で、もっと強い武器を作って、もっともっと強いドラゴンを狩ります！"
"1013403-57-アリス" = "もちろん良い装備だからといって、すぐに強くなるわけじゃありません！#nプレイヤー本人が強くならなければ意味がないのです！"
"1013403-61-アリス" = "まさに、今のアリスにぴったりなゲームかもしれません！"
"1013403-62" = "[s] \"じゃあそれにする？\""
"1013403-63-アリス" = "……たしかに、アリスはこのゲームが好きです。"
"1013403-64-アリス" = "でも、今はその時ではない気がします。すごくプレイ時間が長いので……。"
"1013403-65-アリス" = "やっぱりもう少しだけ見てみます。"
"1013403-66-アリス" = "……あっ、これは！"
"1013403-70-アリス" = "すごく難しいことで有名なゲームです！"
"1013403-71-アリス" = "プレイヤーを即死させる罠がフィールドのあちこちにあって……。"
"1013403-72-アリス" = "なんとかボスにたどり着いても、予備知識がなければ一瞬で負けてしまうんです！#n何度も何度も挑戦して、プレイヤーが成長しないとクリアできないゲームです！"
"1013403-73-アリス" = "だからこそ、クリアした時の達成感は他とは比べ物になりません！"
"1013403-74-アリス" = "……これも、今のアリスみたいですね。"
"1013403-75" = "[s] \"じゃあそのゲームにする？\""
"1013403-76-アリス" = "……いいえ。#nたしかに好きなゲームではありますが……。"
"1013403-77-アリス" = "このゲームをプレイしたら、勇者のアーマーにトラウマができてしまいそうです……。"
"1013403-78-アリス" = "他に……プレイ時間がちょうどよくて、気持ちが落ち着くようなゲームは……。"
"1013403-83-アリス" = "……あ。"
"1013403-87-アリス" = "決めました。アリス、これがいいです。"
"1013403-88" = "[s7] \"それは……。\"\n[s8] \"『テイルズ・サガ・クロニクル』？\""
"1013403-91-アリス" = "はい！無印の『テイルズ・サガ・クロニクル』です！"
"1013403-92-アリス" = "アリスが入る前のゲーム開発部が作った作品です。"
"1013403-93-アリス" = "だからアリスは、このゲームの製作に関わっていません。#nですがゲームを進めていくと、みんなの思いがすごく伝わってきます。"
"1013403-94-アリス" = "そして何よりこのゲームは――"
"1013403-95-アリス" = "クソゲーです！"
"1013403-96" = "[s9] \"アリス！？\"\n[s10] \"だいぶ変わってるゲームだとは聞いてたけど……！\""
"1013403-99-アリス" = "それが事実なのです！"
"1013403-100-アリス" = "最初はアリスも分かりませんでしたが、たくさんゲームをプレイしてきた今なら断言できます。"
"1013403-101-アリス" = "『テイルズ・サガ・クロニクル』はクソゲーです！"
"1013403-105-アリス" = "……でも、いいんです。"
"1013403-106-アリス" = "これは……アリスが初めてプレイしたゲームなんです。"
"1013403-107-アリス" = "このゲームは、アリスのことを初めて「勇者」と呼んでくれました。"
"1013403-108-アリス" = "……やっぱり、アリスはこのゲームが好きです。"
"1013403-109-アリス" = "それに、プレイ時間もちょうどいいです！"
"1013403-110-アリス" = "攻略法さえ分かれば、3時間でトゥルーエンドを見られるのですから！"
"1013403-111-アリス" = "先生！アリスと一緒にやりましょう！"
"1013403-113" = "（勢いに押されて 『テイルズ・サガ・クロニクル』をプレイすることになった）"
"1013403-115" = "[56cd7b]コスモス世紀2354年、人類は劫火の炎に包まれた――[-]"
"1013403-116-アリス" = "正統派ファンタジーRPGなのに、こんなオープニングです！"
"1013403-117-アリス" = "それに「コスモス世紀」という固有名詞は、ここでしか出てきません！"
"1013403-118" = "[56cd7b]チュートリアルを開始します。[-]"
"1013403-120" = "[56cd7b]まずはBボタンを押して、目の前の武器を装着してみてください。[-]"
"1013403-121-アリス" = "あ、これは罠です。ここでBボタンを押したらゲームオーバーです。"
"1013403-122-アリス" = "Aボタンを押すと進められます。"
"1013403-124" = "[ns11] \"想像以上に難しいゲームだね……。\"\n[ns12] \"3時間でクリアできるかな？\""
"1013403-127-アリス" = "攻略法を知らなければ一生クリアできないかもしれません。"
"1013403-128-アリス" = "しかしアリスのようなベテランプレイヤーなら余裕です！"
"1013403-130-アリス" = "あっ。 "
"1013403-131-アリス" = "敵とエンカウントせずに最初の町に着きました。"
"1013403-132-アリス" = "序盤は回復手段が限られるので、これはラッキーです！"
"1013403-138-アリス" = "……この、「始まりの町」のBGM。"
"1013403-139-アリス" = "アリスはすごく好きです。#n聞いていると、初めてこのゲームと出会った時を思い出します。"
"1013403-140-アリス" = "……ふふっ。"
"1013403-141-アリス" = "とても不思議です。あの時のアリスは、まだ何も知りませんでした。"
"1013403-142-アリス" = "あれから光の剣を手に入れ、仲間と出会い、数々の冒険を経て――"
"1013403-143-アリス" = "今はこのように、はるか遠くの氷海にまで来ています。"
"1013403-144-アリス" = "本当に、勇者の冒険みたいです。"
"1013403-145-アリス" = "……この「始まりの町」は、アリスにとっても始まりの場所なんです。"
"1013403-149-アリス" = "……あっ！モンスターとエンカウントしました！"
"1013403-150-アリス" = "ダブルショットガンを使うプニプニです！#n近接では難しいのでここは――"
"1013403-152" = "（アリスと『テイルズ・サガ・クロニクル』を進めた）"
"1013403-153" = "（しばらくして……）"
"1013403-156-アリス" = "……ラスボスを倒しました！クリアです！"
"1013403-157-アリス" = "……先生？どうかしましたか？"
"1013403-158-アリス" = "悲しそうな子犬みたいな顔をしています！"
"1013403-159" = "[s] \"アリス……聞いてもいい？\""
"1013403-163" = "[ns13] \"どうして母親がヒロインで、それでいて実は前世の妻で……。\"\n[ns14] \"どうして腹違いの友人がタイムリープしてきてるんだろう？\""
"1013403-167-アリス" = "アリスにも分かりません！"
"1013403-168-アリス" = "……でも。"
"1013403-169-アリス" = "面白いと思いませんか？"
"1013403-170" = "[s15] \"……そうだね。\"\n[s16] \"すごく面白かった。\""
"1013403-173-アリス" = "先生がアリスと一緒で嬉しいです！アリスもすごく楽しかったです！"
"1013403-174-アリス" = "では次は――"
"1013403-176" = "（自然とゲームを続けることになり）"
"1013403-177" = "（アリスといろんなゲームをしながら過ごした）"
