[translation]
"1601706-1" = "I hate this world (without you) "
"1601706-2" = "（アオバから連絡を受けて車両基地に到着した）"
"1601706-11-アオバ" = "あっ、ああっ……せ、先生……！"
"1601706-12-アオバ" = "ま、また来てくれた……。"
"1601706-13" = "[s1] \"アオバに頼まれたら、来ないわけにはいかないよ。\"\n[s2] \"お役に立てるよう、頑張るね。\""
"1601706-16-アオバ" = "そ、そんな……滅相もないですけど……！"
"1601706-17-アオバ" = "いらっしゃるだけで……す、救われるというか……！"
"1601706-21-アオバ" = "あ、ありがとうございます……！"
"1601706-22-アオバ" = "せ、先生がいると、心強いです……！"
"1601706-23-アオバ" = "それでは……恐縮ですけど……！"
"1601706-24-アオバ" = "今日は作業が山積みなので……よ、よろしくお願いします！"
"1601706-25" = "[s] \"もちろん！\""
"1601706-28" = "（用意した作業着に着替え、すぐにアオバの作業を手伝い始めた）"
"1601706-47" = "（何が何だか分からないまま、とりあえず言われたことを必死にこなした……）"
"1601706-49" = "（時間が経過し……）"
"1601706-52-アオバ" = "あとは……このネジを締めて……っ！"
"1601706-57-アオバ" = "お、終わりましたけど……。"
"1601706-58" = "[s] \"すごい……！やったね、アオバ！\""
"1601706-59-アオバ" = "こ、こんなに早く……！"
"1601706-60-アオバ" = "せ、先生のおかげです……！"
"1601706-61" = "[s] \"私たち、いいコンビかもね。\""
"1601706-62-アオバ" = "は、はいっ！整備に慣れてないはずなのに……大人はすごいです……！"
"1601706-63-アオバ" = "そ、そうだ……もうこんな時間……！"
"1601706-64-アオバ" = "は、早く着替えて帰りましょう……！"
"1601706-73-アオバ" = "……。"
"1601706-74-アオバ" = "（……油の匂い？）"
"1601706-75-アオバ" = "……。"
"1601706-76-アオバ" = "……あ、あれ？"
"1601706-77-アオバ" = "（ま、まさか……？）"
"1601706-85-アオバ" = "ひ、ひゃゃああぁっ……！！"
"1601706-86" = "[ns] \"あ、アオバ！？\""
"1601706-92" = "[wa:680]― [log=아오바]こ、[wa:350]来ないでほしいんです……[wa:1380]けど……！[/log]"
"1601706-95" = "[ns] \"あっ、ご、ごめん！\""
"1601706-96" = "[wa:3450]― [log=아오바]ふ、[wa:870]服に……っ！[/log]"
"1601706-99" = "― [log=아오바]油の匂いが[wa:1300]ついちゃうんで……[/log]"
"1601706-101" = "― [log=아오바]よ、[wa:610]よくないんで……！[/log]"
"1601706-104" = "― [log=아오바]す、[wa:900]すぐ脱ぐので……[/log]"
"1601706-106" = "― [log=아오바]そ、[wa:860]そこで待ってて……[wa:1650]くださいっ！[/log]"
"1601706-109" = "[ns3] \"いやいやいやっ！\"\n[ns4] \"そ、それは困るよ！いろんな意味で！\""
"1601706-110" = "[wa:1210]― [log=아오바]え？[wa:1780]一体……[wa:1310]どういう……？[/log]"
"1601706-111" = "[wa:1210]― [log=아오바]え？[wa:1780]一体……[wa:1310]どういう……？[/log]"
"1601706-114" = "[wa:2220]― [log=아오바]あっ……[wa:1800]えっと……[/log]"
"1601706-117" = "― [log=아오바]あああっ！？[wa:1270]そ、[wa:270]そのっ！[/log]"
"1601706-119" = "― [log=아오바]う、[wa:820]うわぁああああっ！[/log]"
"1601706-122" = "（慌てて宿直室を飛び出し、アオバを外で待つことにした……）"
"1601706-126-アオバ" = "……。"
"1601706-127-アオバ" = "お、お待たせしました……！"
"1601706-128-アオバ" = "油の匂い、大丈夫ですよね！？こ、これで帰れます……！"
"1601706-129" = "[s] \"うん、それじゃ行こうか。\""
"1601706-130-アオバ" = "は、はい……！"
"1601706-137-アオバ" = "退勤後の外の風は気持ちいいです……。"
"1601706-138-アオバ" = "先生……きょ、今日はありがとうございました……。"
"1601706-139" = "[s] \"いつもこんなに仕事が多いの？\""
"1601706-140-アオバ" = "はい……。"
"1601706-141-アオバ" = "このあたりで整備を引き受けているのは、うちくらいで……。"
"1601706-142-アオバ" = "しゃ、車両事故も多いし……依頼がどんどん増えています……。"
"1601706-143" = "[s] \"本当にお疲れ様、アオバ。\""
"1601706-144-アオバ" = "で、でも……不思議と最近は大変じゃなくて……。"
"1601706-145-アオバ" = "なんででしょう……。"
"1601706-146-アオバ" = "……。"
"1601706-150-アオバ" = "あ……。"
"1601706-156-アオバ" = "あ、あぁ……。"
"1601706-157-アオバ" = "へ、へへっ……。"
"1601706-158" = "[s] \"ん？何かいいことでもあったの？\""
"1601706-162-アオバ" = "あ、はひっ……！？な、なんでも……ないです……！"
"1601706-163-アオバ" = "……いいこと、といえばそうかもしれません。"
"1601706-164" = "[s] \"それならよかったよ、アオバ！\""
"1601706-165-アオバ" = "へへ……いいこと……。"
"1601706-166-アオバ" = "うん、あれは……いいこと。"
"1601706-170-アオバ" = "む、昔は……こんなこと、思いもしなかったのに……。"
"1601706-172-アオバ" = "毎晩、布団の中で一日を振り返っていたんですけど……。"
"1601706-173-アオバ" = "そのときも、明日が来なければいいのに……って思ってました。"
"1601706-174-アオバ" = "ど、どうせ……がっかりすることしか起きないから……。"
"1601706-177" = "[ns] \"……。\""
"1601706-178-アオバ" = "でも……！今は違います。"
"1601706-179-アオバ" = "ね、寝る前に……明日を期待しちゃうんです。"
"1601706-180-アオバ" = "もしかしたら、いい日になるのかも……？って。"
"1601706-181-アオバ" = "同じ日常のはずなのに……不思議ですよね……？"
"1601706-182-アオバ" = "仕事の量も減っていないんですけど……。"
"1601706-183-アオバ" = "幹部たちの無茶振りに頭を抱えているのも、同じです。でも――"
"1601706-184-アオバ" = "その……。"
"1601706-185-アオバ" = "それでも、期待で胸がいっぱいになって……明日が待ち遠しく思えるんです……。"
"1601706-186-アオバ" = "誰かがいるだけで……こ、こんなにも景色が変わるだなんて……。"
"1601706-187" = "[s5] \"本当に良かったね！\"\n[s6] \"アオバがそんな日常を送れてるなら、私も嬉しい！\""
"1601706-192-アオバ" = "えへへ……そ、そう、ですね。"
"1601706-193-アオバ" = "こ、これからもずっと……こ、こんな日が……。"
"1601706-195-アオバ" = "続くといいんですけど……。"
