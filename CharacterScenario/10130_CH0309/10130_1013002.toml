[translation]
"1013002-1" = "みんなの先輩"
"1013002-3-スバル" = "本当にいらっしゃったんですね、先生……。"
"1013002-4" = "[s] \"大分復興が進んだね。\""
"1013002-5-スバル" = "ええ。少しずつ、ではありますが。"
"1013002-6" = "[s] \"こういうことを言っていいのか分からないけど……。\""
"1013002-7-スバル" = "大丈夫ですよ。何ですか？"
"1013002-8" = "[s] \"いい感じ、だね。\""
"1013002-9-スバル" = "……そうですね。"
"1013002-10-スバル" = "私もそう思っています。でも、まだどこか慣れないというか。"
"1013002-11-スバル" = "いまは、変化の時なんですよね。"
"1013002-12-スバル" = "……ん？見回りですか？"
"1013002-13-スバル" = "……。"
"1013002-14-スバル" = "うーん、本当に色々あったとしか……。"
"1013002-15-スバル" = "他校で言うところの、風紀委員長のような役回りをすることになったんです。"
"1013002-16-スバル" = "アリウスの秩序を守るという意味では、今までやっていたこととほとんど変わりません。"
"1013002-17-スバル" = "外部からの攻撃を気にしなくてよくなったので、少し気は楽ですが。"
"1013002-18-スバル" = "……なぜって？"
"1013002-19-スバル" = "ふふ、シンプルな話です。"
"1013002-20-スバル" = "わざわざ外からアリウスに来て騒ぎを起こそうとする者は、そういませんから。"
"1013002-21-スバル" = "いろいろな意味で。"
"1013002-27" = "[ns] \"なんか爆発音したけど！？\""
"1013002-28-スバル" = "行ってみましょう。"
"1013002-32-スバル" = "なんの騒ぎですか？"
"1013002-37-アリウスの生徒A" = "あ、先輩。そんな大したことじゃないですよ。"
"1013002-38-アリウスの生徒B" = "そうです、私たちは――"
"1013002-39-アリウスの生徒A" = "アリウス流の「話し合い」をしていただけなので。"
"1013002-41-スバル" = "ああ……なるほど。"
"1013002-45" = "[ns1] \"アリウス流の……。\"\n[ns2] \"話し合い……？\""
"1013002-49-アリウスの生徒A" = "知らないんですか？先生。"
"1013002-50-アリウスの生徒B" = "たしかに外部の方ですもんね。"
"1013002-51-アリウスの生徒A" = "アリウスでは「説得」の時、言葉と行動を重視するんです！"
"1013002-55" = "[ns] \"言葉は分かるけど、行動も……？\""
"1013002-56-アリウスの生徒B" = "ええ！だから私たちは……。"
"1013002-57-アリウスの生徒A" = "意見がぶつかった時は！"
"1013002-58-アリウスの生徒B" = "どちらの「行動」に、より「説得力」があるかを話し合うんです！"
"1013002-59-アリウスの生徒A" = "で、時代は5.56mm弾だって認めた？"
"1013002-60-アリウスの生徒B" = "そんなわけないでしょ！やっぱりガツンとした7.62mm弾だよ。"
"1013002-61-アリウスの生徒A" = "はぁ？スクワッドも5.56mm使ってるけど？"
"1013002-62-アリウスの生徒B" = "あの子たちは特別に支給されてるからでしょ？#nうちらは7.62mmでいいでしょ！"
"1013002-63-アリウスの生徒A" = "たしかに7.62mmは強いけど、反動のせいで狙いが定まらないじゃん！"
"1013002-64-アリウスの生徒A" = "もたもた狙う時間がもったいないよ。速射したほうがよくない？"
"1013002-65-アリウスの生徒B" = "それはあんたみたいな奴らが言ってるだけ！"
"1013002-66-アリウスの生徒B" = "7.62mmの反動がデカいってのはウソだよ！#n設計と消炎器がちゃんとしてれば――"
"1013002-67-アリウスの生徒A" = "あと、シンプルに嵩張るよね？7.62mmを300発持ち歩ける？ "
"1013002-68-アリウスの生徒A" = "照準射撃ができるかどうかも結局状況次第なんだから、持続射撃しちゃった方がいいって！"
"1013002-69-アリウスの生徒B" = "そんな弾代、私たちにあると思う！？"
"1013002-76-スバル" = "はい、お二人ともそこまで。"
"1013002-78-アリウスの生徒A" = "先輩、でもっ！"
"1013002-79-アリウスの生徒B" = "先輩っ！！"
"1013002-81-スバル" = "二人の話はよく分かりました。#nどちらの言い分も正しい。難しい問題ですね。"
"1013002-82-スバル" = "どうしてそんな話になったのか、経緯を聞いても？"
"1013002-84-アリウスの生徒A" = "そ、それは……。"
"1013002-85-アリウスの生徒B" = "私たちのアリウスを守るには、どの弾が向いてるかな、って……。"
"1013002-87-スバル" = "そうですね、みなさんも私も学園を守りたい気持ちは同じ。#n……大切なのはその事実です。"
"1013002-88-スバル" = "みんな同じ志を持っているはずなのに、考え方が違うからといって……。"
"1013002-89-スバル" = "過激な「アリウス流の話し合い」をするのは、そろそろ終わりにしませんか？"
"1013002-90-スバル" = "仲間割れは、身を滅ぼすだけです。"
"1013002-92-アリウスの生徒A" = "……たしかに。"
"1013002-93-アリウスの生徒B" = "うん……もう、昔のアリウスじゃないもんね……。"
"1013002-95-スバル" = "口論になりそうなときは、そのことを思い出してくれると嬉しいです。"
"1013002-96-スバル" = "それこそ、「話し合い」には弾代もかかりますから。"
"1013002-98-アリウスの生徒A＆B" = "ごめんなさい、先輩……。"
"1013002-100-スバル" = "ふふっ。でも、学園を大事に思う二人の気持ちは嬉しいです。"
"1013002-101-スバル" = "私たちはこれからも試行錯誤を繰り返していくでしょう。#nときに昔のやり方で通したくなることもあるかもしれません。"
"1013002-102-スバル" = "ですが、できるだけ新しいやり方で、一緒に向き合っていきましょう。#n私も努力しますから。"
"1013002-103-スバル" = "困った時にはいつでも呼んでください。"
"1013002-105-アリウスの生徒A" = "……！#nはいっ、先輩……！"
"1013002-106-アリウスの生徒B" = "分かりました、ありがとうございます先輩！"
"1013002-111-スバル" = "ふぅ……。"
"1013002-112" = "[s] \"いいこと言うね。\""
"1013002-113-スバル" = "そ、そうですか？"
"1013002-114-スバル" = "実は、こんな話ができるようになったのも最近で……。"
"1013002-115-スバル" = "昔は全部見て見ぬふりでしたから。"
"1013002-116-スバル" = "……でも、たしかに重要な話です。#n両方の弾に互換性はなく、外では5.56mmが主流。"
"1013002-117-スバル" = "とはいえ、今まで使ってきた7.62mmを廃止するわけにも……。"
"1013002-118-スバル" = "私の銃も、補給の兼ね合いから7.62mmにカスタムした仕様ですし。"
"1013002-119-スバル" = "……。"
"1013002-120-スバル" = "でも、少しほっとしています。"
"1013002-121-スバル" = "正直、この役回りをすることで、みんなに嫌われると思っていました。"
"1013002-122-スバル" = "なのに、みんな私についてきてくれて……本当に嬉しいです。"
"1013002-123" = "[s3] \"スバルがそれだけ頼れる先輩だってことだよ。\"\n[s4] \"みんなを引っ張ってきたのはスバルだから。\""
"1013002-126-スバル" = "ふふ。そんなに褒めても何もでませんよ？"
"1013002-127-スバル" = "……でも、罪悪感や後ろめたさを感じることがあるんです。"
"1013002-128-スバル" = "話を聞いてあげたり、寄り添ってあげることはいくらでもできるんですが……。"
"1013002-129-スバル" = "……。"
"1013002-130-スバル" = "結局、根本的な解決にはなっていない気がして。"
"1013002-131-スバル" = "ただの気休めにしかなってないと思っているんです。"
"1013002-132" = "[s5] \"分かった。\"\n[s6] \"スバルにも、相談する相手が必要なんじゃないかな。\""
"1013002-135-スバル" = "え？急に一体なにを……。"
"1013002-136-スバル" = "たしかに、見張りを見張る「誰か」も必要かもしれません。"
"1013002-137-スバル" = "理解はできますが……でも……。"
"1013002-138-スバル" = "私の話を聞いてもらうなんて……。"
"1013002-139" = "[s7] \"先生はこういう時のためにいるんだからね。\"\n[s8] \"他にも仕事はあるけど……。\""
"1013002-142-スバル" = "なるほど。これが噂に聞くアレですね。"
"1013002-143-スバル" = "生徒たちを甘い言葉[ruby=いざな]で誘い[/ruby]、もう昔のようには戻れなくする――という。"
"1013002-144-スバル" = "ええとたしか……クロノスチャンネルの特集？でそう言っていたような……。"
"1013002-145" = "[s] \"い、いや……それ、ほんと誤解だから……。\""
"1013002-146-スバル" = "そ、そこまで落ち込まれるとは……。"
"1013002-147-スバル" = "……。"
"1013002-148-スバル" = "分かりました。では今度、機会があったらお願いしますね。"
"1013002-149-スバル" = "先生といると、つい色々話してしまうんですよね。"
"1013002-150-スバル" = "ふふっ……これも、手口の一つなんでしょうか？"
"1013002-151" = "[s] \"い、いや……それ、ほんと誤解だから……。\""
"1013002-152-スバル" = "……あれ？さっきも同じことを聞いたような。"
"1013002-154" = "（なんだか負けた気分になりつつ、シャーレに戻った……）"
