[translation]
"1013008-1" = "The Giving Girl"
"1013008-3-アリウスの生徒A" = "こんにちは、スバル先輩！あっ、先生もこんにちは！"
"1013008-4-スバル" = "こんにちは。今日も元気そうでなによりです。"
"1013008-8-アリウスの生徒A" = "あれ？先輩、それってもしかして……！"
"1013008-10-アリウスの生徒A" = "伝説の、うんめえ棒バーベキューチーズ味ですか！？"
"1013008-11-スバル" = "えっ、え？"
"1013008-12-スバル" = "そ、そうですが……。"
"1013008-16-スバル" = "……。"
"1013008-17-スバル" = "食べたいですか？"
"1013008-22-アリウスの生徒A" = "い、いいんですか……！？"
"1013008-23-スバル" = "ふふっ、どうぞ。"
"1013008-24-アリウスの生徒A" = "……ありがとうございます！"
"1013008-28-スバル" = "……。"
"1013008-29-スバル" = "（あとで食べようと思ってたけど……）"
"1013008-30" = "[s] \"大丈夫？スバル。\""
"1013008-31-スバル" = "あっ、はい！もちろんです！"
"1013008-32-スバル" = "き、気にしてるように見えましたか？"
"1013008-33-スバル" = "……考え過ぎですよ！"
"1013008-36-アリウスの生徒B" = "えっ？カスタードプリン味ジュース！？"
"1013008-37-アリウスの生徒B" = "あの幻の存在と言われるカスタードプリンの……ジュース版……！？"
"1013008-38-スバル" = "……そ、そうですね。"
"1013008-39-アリウスの生徒B" = "……。"
"1013008-40-アリウスの生徒B" = "あのぉ……先輩。"
"1013008-41-アリウスの生徒B" = "ひ、一口だけ……その、ダメですか？"
"1013008-42-スバル" = "……。"
"1013008-43-スバル" = "いいですよ。全部あげます。"
"1013008-44-アリウスの生徒B" = "いいんですかっ！？"
"1013008-45-スバル" = "もちろん。#nでも、もしよかったら他の子たちにも分けてくれると嬉しいかな、なんて。"
"1013008-46-アリウスの生徒B" = "ありがとうございます！先輩！"
"1013008-51-スバル" = "（手に入れるの、結構大変だったやつだけど……）"
"1013008-52" = "[s] \"……大丈夫？\""
"1013008-53-スバル" = "へっ！？"
"1013008-54-スバル" = "……。"
"1013008-55-スバル" = "も、もちろん！"
"1013008-58-アリウスの生徒C" = "わあ、ありがとうございます！"
"1013008-59-スバル" = "よかった。"
"1013008-61-アリウスの生徒D" = "ありがとうございます、大事にしますね先輩！#n最高です！"
"1013008-62-スバル" = "は、はい……。"
"1013008-64" = "（その後も同じような流れが続き……）"
"1013008-65" = "（見回りを終えたスバルの手には、ほとんど何も残っていなかった）"
"1013008-67-スバル" = "……。"
"1013008-68" = "[s] \"……。\""
"1013008-69-スバル" = "……。"
"1013008-70" = "[s] \"……。\""
"1013008-71-スバル" = "ど、どうしてじっと見ているんです……？"
"1013008-72" = "[s] \"私の前では隠さなくていいんだよ……。\""
"1013008-73-スバル" = "ほ、本当にそういうんじゃないですから！"
"1013008-77-スバル" = "……でもやっぱり。"
"1013008-78-スバル" = "さっきのはたしかに、ちょっと残念というか……。"
"1013008-79" = "[s1] \"これはいけませんね、スバルさん。\" \n[s2] \"ちょっとこちらへ……。\""
"1013008-82-スバル" = "……えっ？  "
"1013008-84-スバル" = "せ、先生？なぜここに……。"
"1013008-85-スバル" = "まずは食べて……？って。"
"1013008-86-スバル" = "……。"
"1013008-87-スバル" = "イヤです。私、先生が何を考えているのか、だいたい分かってますから！#n絶対わたし――"
"1013008-89-ウェイター" = "お待たせしました。ごゆっくりどうぞ。"
"1013008-94" = "[ns] \"……本当にいいの？\""
"1013008-95-スバル" = "だ、大丈夫です！私は平気なので！"
"1013008-96-スバル" = "き、聞いてみただけですから！"
"1013008-97-スバル" = "でも、なんだか私の好きなものばかり……ですね？"
"1013008-98" = "[s3] \"まあね！\"\n[s4] \"この間の初当番記念パーティで、見てたから！\""
"1013008-101-スバル" = "！！！"
"1013008-102-スバル" = "あ、あの時はお世話になりました……が！今回はお気持ちだけいただきます！"
"1013008-104" = "（意地っ張りだなぁと思いつつ、周りを見渡していると）"
"1013008-108" = "（料理の一部が……なくなっていた！）"
"1013008-110" = "（その後も何度か、あちこちよそ見をしていると……）"
"1013008-114" = "（その都度、料理は着実になくなっていった！）"
"1013008-116" = "[ns] \"おかしいなぁ～\""
"1013008-117-スバル" = "なっ、何ですか。どうかしましたか？"
"1013008-118" = "[s] \"なんだか料理が減ってる気がして。\""
"1013008-119-スバル" = "せ、先生が食べたんじゃないんですか……？"
"1013008-120-スバル" = "な、なんですかそのお顔は……？"
"1013008-121-スバル" = "……も、もう！わ、分かりましたよ！"
"1013008-122-スバル" = "……。"
"1013008-123-スバル" = "そうです、私が食べました！ "
"1013008-124-スバル" = "……先生、こんな大食いの生徒は嫌ですよね？"
"1013008-125" = "[s] \"……！\""
"1013008-129" = "[ns5] \"そんなわけない！たくさん食べて、たくさん大きくならないと！\"\n[ns6] \"食べる姿を見てるだけで幸せ！\""
"1013008-132-スバル" = "そ、そうなんですか……？"
"1013008-133-スバル" = "……。"
"1013008-134-スバル" = "ありがとう、ございます……。"
"1013008-135-スバル" = "えっ……？スバルにはまだ不器用なところがある……？"
"1013008-136-スバル" = "素直じゃない……？"
"1013008-137-スバル" = "……先生。そういうこと、他の子にも言ってませんよね？"
"1013008-141-スバル" = "あのー、なんで目をそらすんですか？ちゃんとこっちを見てください。"
"1013008-143" = "（なんとかスバルの追求をかわしつつ、あちこちに連れ出した！）"
"1013008-151" = "[ns] \"どうだった？\""
"1013008-152-スバル" = "どうと言われましても……うーん。"
"1013008-153-スバル" = "よく分からない、というよりも……。"
"1013008-154-スバル" = "経験がなく、慣れていないといった感じでしょうか。"
"1013008-155-スバル" = "前にも、「学外での活動」はありましたけど……。"
"1013008-159-スバル" = "こんな「陽の当たる場所」で……。"
"1013008-160-スバル" = "穏やかな時間を過ごしたことはないので……。"
"1013008-161-スバル" = "……！？"
"1013008-162-スバル" = "この音はなんですか先生！？"
"1013008-163-？？？" = "人間の死こそがエコロジィイイイイ――――！！"
"1013008-165" = "（目を輝かせるスバルを連れてCD屋に入った）"
"1013008-167-スバル" = "へびー、めたる……？これがヘビーメタルというものなんですね！"
"1013008-168-スバル" = "えっと、なんといいますか……。"
"1013008-169-スバル" = "強烈ですね！"
"1013008-170" = "[ns] \"だ、だよね！\""
"1013008-171-スバル" = "このスピード感と勢い……まるで成型炸薬弾です！"
"1013008-172-スバル" = "なにより、「こんな世界ぶっ壊しちまえ」という歌詞が気に入りました！！"
"1013008-173" = "[ns] \"実行するのはやめてね！\""
"1013008-175-スバル" = "ふぅ……すごかったです、先生。 "
"1013008-176-スバル" = "今もまだ、耳と胸が、ドンドン鳴ってるみたいで……。"
"1013008-177-スバル" = "えっ？メタラーになる素質がありそう……？"
"1013008-178-スバル" = "うーん、よく分かりません……ただ、自然と強く惹かれたというか。"
"1013008-179-スバル" = "……特に歌詞に。"
"1013008-180" = "[s] \"……やっぱり、世界が終わってほしい？\""
"1013008-181-スバル" = "……。"
"1013008-182-スバル" = "どうでしょう。私にもよく分かりません。 "
"1013008-183-スバル" = "そんな気持ちがするような、しないような。"
"1013008-184-スバル" = "でも先生も言っていましたよね。感情は単純なものじゃないって……なら。"
"1013008-185-スバル" = "……。"
"1013008-186-スバル" = "先生が私に「この世界はいいものだよ」って、#n確信を持たせてくれればいいんじゃないですか？"
"1013008-187" = "[ns] \"くっ……そう来たか……。\""
"1013008-188-スバル" = "だって先生「大人」じゃないですか。"
"1013008-189" = "[s] \"それはね、無敵の言葉じゃないんだよ……？\""
"1013008-190-スバル" = "ええ？でも、今までご自身で言ってたじゃないですか？"
"1013008-191" = "[s] \"確かに否定はできない……。\""
"1013008-193" = "（そうしてスバルと話しながら、帰路に就いた）"
