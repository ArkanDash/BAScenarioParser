[translation]
"1300806-1" = "遅い悟り"
"1300806-2" = "（セリカと一緒に夜遅くまで道を掃除した）"
"1300806-4-セリカ" = "はあ……今日も疲れた……。"
"1300806-5" = "[s1] \"お疲れ様。\"\n[s2] \"今日はなかなかハードだったね。\""
"1300806-6-セリカ" = "そうね。ゴミ箱がひっくり返った時は本当に天を仰いだわ……。"
"1300806-7-セリカ" = "そうね。ゴミ箱がひっくり返った時は本当に天を仰いだわ……。"
"1300806-8-セリカ" = "うーん……。"
"1300806-12-セリカ" = "（毎日毎日こうやって先生と一緒にアルバイト……）"
"1300806-13-セリカ" = "（……これで良いのかな？）"
"1300806-14-セリカ" = "（いや……まあ私は一緒にこうしてるだけで楽しい、けど……）"
"1300806-15-セリカ" = "（今日みたいにゴミを拾ったり落葉を掃いたり、そうやってる内に一日が終わっちゃうのはちょっと……）"
"1300806-17-セリカ" = "（たまにはもうちょっと、違うことをやったほうがいい……のかな？えっと、例えば……）"
"1300806-18-セリカ" = "（で、デート……とか）"
"1300806-20-セリカ" = "……。"
"1300806-21-セリカ" = "ばっ、バカ！！バカ！！"
"1300806-22" = "[s3] \"……ん？\"\n[s4] \"……理由は分からないけどごめん。\""
"1300806-23-セリカ" = "ば、バカ！先生！もう行くから！"
"1300806-24-セリカ" = "ば、バカ！先生！もう行くから！"
"1300806-26" = "（なぜか怒られてしまった）"
