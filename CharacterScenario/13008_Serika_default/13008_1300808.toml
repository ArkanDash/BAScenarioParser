[translation]
"1300808-1" = "思いがけない幸運"
"1300808-2" = "（夜中まで予定されていた夜の市場のバイトが、思ってたより早く終わった）"
"1300808-4-セリカ" = "いやー、ラッキーだったわ。ね？先生？"
"1300808-5-セリカ" = "徹夜の覚悟してたのに、思ってたより好況で、材料切れで営業終了。"
"1300808-6-セリカ" = "バイト代は約束の通り全部もらった上に、こんなに早く終わるなんて！"
"1300808-7-セリカ" = "たまにはこんな日もあるのね、先生？"
"1300808-8" = "[s] \"うん、良かったね。\""
"1300808-9-セリカ" = "へえ、こっちの街は結構賑やかね。アビドスにはない物も色々あるみたいだし……。"
"1300808-10-セリカ" = "あれ見て、たこ焼き！イカ焼きもある！"
"1300808-11-セリカ" = "あそこには面白い仮面も売ってるみたいよ？"
"1300808-12" = "[s] \"ちょっと回ってみる？\""
"1300808-13-セリカ" = "う、うん？"
"1300808-14-セリカ" = "ま、回る？二人で？"
"1300808-15-セリカ" = "……。"
"1300808-16" = "[s] \"あ、それとも疲れてるし、真っすぐ帰る？\""
"1300808-17-セリカ" = "だ、誰も行かないとは言ってないでしょ！？"
"1300808-18-セリカ" = "せ、せっかく早く終わったし！このまま帰るのももったいないし……。"
"1300808-19-セリカ" = "た、たまには休憩も大事だしね？"
"1300808-20-セリカ" = "じゃあ、まずは……。"
"1300808-23" = "（セリカが腕を組んできた）"
"1300808-24-セリカ" = "……。"
"1300808-25-セリカ" = "……な、なに？……嫌なの？"
"1300808-26" = "[s1] \"えっと……。\"\n[s2] \"その……。\""
"1300808-27-セリカ" = "ああもう、いいから何も言わないで！"
"1300808-28-セリカ" = "ああもう、いいから何も言わないで！"
"1300808-29-セリカ" = "……へへ。"
"1300808-30-セリカ" = "さ～て♪あっちから見て回ろっか！"
"1300808-32" = "（セリカと一緒にイカ焼きと醬油味のトウモロコシ、じゃがバター、たこ焼きを食べて、屋台のあっちこっちを見回って）"
"1300808-33" = "（夜中になる頃にようやく家に帰った）"
