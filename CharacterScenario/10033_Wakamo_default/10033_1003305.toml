[translation]
"1003305-1" = "歪なデート"
"1003305-2" = "（念のため、ワカモと約束していた時間よりも早めに到着した）"
"1003305-3" = "[s] \"えっと、具体的な場所は……。\""
"1003305-4-？？？" = "ふふっ……約束のお時間よりも、少々お早いですね。"
"1003305-5" = "[s] \"……あれ？\""
"1003305-11-？？？" = "あら、何やら不思議そうな表情……。"
"1003305-13-？？？" = "新たなお顔を見るたびに、この胸の奥からこみあげてくる切ない気持ち……思わずため息がこぼれてしまいます。"
"1003305-15-？？？" = "我慢できないほど、身体も熱くなって……。"
"1003305-17-？？？" = "最初からこうなっては、困ってしまいます……。"
"1003305-21" = "[ns] \"もしかしなくても、ワカモだよね……？\""
"1003305-22-ワカモ" = "ふふっ、はい。もちろん、あなた様のワカモですよ♡"
"1003305-23" = "[s] \"いつもと雰囲気が違うね……？\""
"1003305-24-ワカモ" = "ああ、"
"1003305-25-ワカモ" = "この格好ですか？"
"1003305-26-ワカモ" = "ふふっ、確かにそうかもしれません。こうして着飾るのも、全てはあなた様との大切な時間のため。"
"1003305-27-ワカモ" = "普段の格好ですと、やはり様々な理由で注目を浴びてしまいますので……。"
"1003305-28-ワカモ" = "先生の後を追う時だけでしたら問題無いのですが、こうやって向き合うからには、はい。"
"1003305-29-ワカモ" = "せっかくあなた様のお傍でご一緒するのですし、やはりこういったところも気にしなくては、と。"
"1003305-30" = "[s] \"あ、ありがとう……。\""
"1003305-31-ワカモ" = "他の誰でもないあなた様のためですから、これくらいは当然のことです♡"
"1003305-32-ワカモ" = "ああ、こうしている場合ではありませんね。完璧に練ってきた私のデートプランを、早く実行せねば！"
"1003305-38-ワカモ" = "それでは今日一日よろしくお願いしますね、先生。"
"1003305-39" = "[s] \"うん、よろしく。\""
"1003305-42" = "（手を引いてワカモに導いてもらいながら、すでに予約をしてくれていたというレストランに着いた）"
"1003305-45-ワカモ" = "ふふっ、まず今日予約していたお店はこちらです。"
"1003305-46" = "[s] \"高級レストランだ……。\""
"1003305-47-ワカモ" = "あら、意外でしょうか？"
"1003305-48-ワカモ" = "もう少し古風な雰囲気とか、ですか？"
"1003305-49-ワカモ" = "はい、そうですね。もちろんそのような趣のお店も好きなのですが……。"
"1003305-50-ワカモ" = "しかしデートに関する指南書で、こういう場所が愛する方との時間にはふさわしいと……"
"1003305-51" = "[s] \"……指南書？\""
"1003305-52-ワカモ" = "さあ、こうしている場合ではありません。先生、中へ入りましょう。"
"1003305-57-支配人" = "あっ、お客様……！誠に申し訳ございません！"
"1003305-58-ワカモ" = "……？"
"1003305-59-支配人" = "大変恐縮なのですが、本日は臨時休業となってしまい……。"
"1003305-60-ワカモ" = "あら、予約はできていたはずなのですが……？"
"1003305-61-支配人" = "申し訳ありません……本日急に、とあるお客様がお越しになられることになりまして……。"
"1003305-62" = "[s] \"とあるお客様？\""
"1003305-63-支配人" = "はい。キヴォトスでもトップクラスの美食評論家のひとりである「コロッケラバー」様が突如お見えになるとのことで……。"
"1003305-64-支配人" = "上層部からの命令もあり、この機会に完璧なコースを提供すれば当店も一気に話題になるチャンスでして……！"
"1003305-65-支配人" = "このご時世、タイミングを逃すわけにはいかないのです！"
"1003305-66-支配人" = "大変申し訳ないのですが、ここはどうか……！"
"1003305-72" = "[ns] \"わ、ワカモ……？\""
"1003305-73-支配人" = "もっ、もちろんそのままお帰りいただこうというわけではございません！"
"1003305-74-支配人" = "こちらのお食事チケットをお渡しします！"
"1003305-75-支配人" = "次回いらっしゃった場合にはそちらを頂ければ、無料で最高級のコースをご提供いたしますので……！"
"1003305-79" = "[ns] \"わ、ワカモ！ここは次回の楽しみにして、次の場所に行こう！\""
"1003305-82" = "（そうして、ちょっとしたアクシデントから一日が始まったのだが……）"
"1003305-85" = "（その後に訪れたカフェでは）"
"1003305-86-ワカモ" = "ふふっ、"
"1003305-87-ワカモ" = "不本意ながら計画が少々狂ってしまいましたが……"
"1003305-88-ワカモ" = "先生、どうかご心配なく。"
"1003305-89-ワカモ" = "このワカモ、今日という日のために一生懸命調査を致しまして……レストランのみならず、あなた様と一緒に味わうための最高なスイーツを見つけたのです。"
"1003305-90-ワカモ" = "こちらのカフェにふたりで訪れると「カップル限定メニュー」を頂けると、先日ガイドブックで読みました。"
"1003305-91-ワカモ" = "ふふっ、きっと先生にもお気に召していただけるかと……"
"1003305-92-店員" = "カップル限定メニュー……？"
"1003305-93-店員" = "あ、実はそちら、去年で販売を停止しておりまして……え、ガイドブック？"
"1003305-98-店員" = "あぁ、社長が1年前に趣味で出したあの……？"
"1003305-99-店員" = "く、ふふっ……。"
"1003305-100-店員" = "も、申し訳ありません……くくっ……！"
"1003305-101-店員" = "いえ、まさか今時、ガイドブックでデートコースを吟味する方がいらっしゃるとは……。"
"1003305-102-店員" = "と、とにかく申し訳ございませんが、現在メニューは提供しておらず……他のメニューをご覧いただけますと。"
"1003305-107" = "[ns] \"わ、ワカモ！次のところに行こう！\""
"1003305-111" = "（その次には……）"
"1003305-112-ワカモ" = "だ、"
"1003305-113-ワカモ" = "大丈夫です先生。"
"1003305-114-ワカモ" = "今度こそ……！"
"1003305-115-ワカモ" = "2分後の電車に乗れれば、あの遊園地で開かれる公演に何とか間に合――"
"1003305-121-ワカモ" = "……？"
"1003305-126-チンピラ３" = "あぁん！？何だこら、急にぶつかってきやがって！"
"1003305-127-チンピラ２" = "何だ、世間知らずのお嬢さんがお散歩か？世の中舐めてんじゃねぇぞ！"
"1003305-128-チンピラ１" = "お散歩に付き合ってやろうかぁ！？"
"1003305-134" = "[ns] \"ストップ！！落ち着いて、ね！？\""
"1003305-137-チンピラ３" = "はぁ、落ち着いてられるか！？さっきのでこちとら肩が外れるかと思ったんだぞ！"
"1003305-138-チンピラ２" = "そうだぞ！"
"1003305-139-チンピラ１" = "ぞ！"
"1003305-144" = "[ns] \"それはごめんなさい！ワカモは落ち着こう！\""
"1003305-147-チンピラたち" = "……？"
"1003305-152-ワカモ" = "……失礼いたしました。"
"1003305-158-ワカモ" = "これでよろしくって……？"
"1003305-163-チンピラ１" = "ひ、ひいいっ！？"
"1003305-164-チンピラ２" = "つ、次から気を付けろよ！？"
"1003305-165-チンピラ３" = "に、逃げろ！！"
"1003305-170-ワカモ" = "ふぅ……"
"1003305-171-ワカモ" = "あ、電車の時間が……。"
"1003305-174" = "（結局電車には間に合わず、遊園地には行けなかった）"
"1003305-177-ワカモ" = "で、では映画を見ましょう！"
"1003305-178-ワカモ" = "ちょうど最近上映が始まった、れ、れれれ恋愛の映画があるそうで……！？"
"1003305-182-ワカモ" = "ち、チケットがすべて売り切れ……！？"
"1003305-183-ワカモ" = "……このままでは諦めません。"
"1003305-185-ワカモ" = "次……！"
"1003305-187-ワカモ" = "次こそは……！"
"1003305-190" = "（ワカモの計画は次々にアクシデントが発生してしまい、いつの間にか日は暮れて……）"
"1003305-194" = "[ns] \"はい、ワカモ。飲み物どっちが良い？\""
"1003305-195-ワカモ" = "あ……ありがとうございます、先生。"
"1003305-196-ワカモ" = "こんな私のために、わざわざ飲み物まで買ってくださるなんて……。"
"1003305-197" = "[s] \"気にしないで。えっと……まあ、こういう日もあるよね。\""
"1003305-199-ワカモ" = "そう、ですね……しかし、せっかくあなた様と共に過ごせる日だったのに……。"
"1003305-200-ワカモ" = "最高の日になるはずだった一日が、私のミスでこんなにも台無しで……。"
"1003305-201-ワカモ" = "先生のお時間を頂いておきながら、私、これでは先生に向ける顔が……申し訳ありません……。"
"1003305-202" = "[s1] \"台無しなんてことは無かったよ。\"\n[s2] \"むしろワカモが色々と頑張ってくれて、嬉しかった。\""
"1003305-203-ワカモ" = "……？"
"1003305-204-ワカモ" = "……？"
"1003305-205-ワカモ" = "……あぁ、今日は何かに巻き込まれても、騒ぎにしなかったからということですか？"
"1003305-206-ワカモ" = "ふふっ、それについては当然です。"
"1003305-207" = "[s] \"……？\""
"1003305-208-ワカモ" = "もちろん以前の約束もございますし……何より本日はせっかくあなた様が、特別に私のために作ってくださったお時間なのですから。"
"1003305-209-ワカモ" = "そんな貴重なお時間を、騒がしくなどさせたくありません。"
"1003305-210-ワカモ" = "私の正体が周囲に知られては、あなた様を困らせてしまうことは理解しております。"
"1003305-211-ワカモ" = "ですので、そうさせまいと努力するのは当然のことです。"
"1003305-212-ワカモ" = "それに、私が勝手にこう言ってしまうのは大変恐縮ではありますが……。"
"1003305-213-ワカモ" = "今日のようなお時間は、きっとこれだけではありませんから。"
"1003305-214-ワカモ" = "この先何回も、何十回も、何百回もあるはず……そう考えると、やはり我慢せねばと。"
"1003305-215-ワカモ" = "むしろ私の顔を見つめてハラハラされている……そんなあなた様の顔を見ていると、私はなんだかドキドキしてしまいました。その表情を、独り占めできたわけですし。"
"1003305-216" = "[s] \"そ、そっか……なら良かった。\""
"1003305-217-ワカモ" = "本日は残念ながら、こうしていつの間に日が暮れてしまいましたが……。"
"1003305-223-ワカモ" = "せめて帰り道まで、私の甘えを聞いていただけませんか？"
"1003305-224" = "[s] \"もちろん。\""
"1003305-225-ワカモ" = "ふふっ、よろしくお願いいたします。"
"1003305-227" = "（次の日の朝……仕事を始めようとした正にその時）"
"1003305-234-ワカモ" = "さあ、お出かけしましょう先生！"
"1003305-235" = "[s] \"ワカモ！？\""
"1003305-236-ワカモ" = "どうかしましたか？え、急……？"
"1003305-237-ワカモ" = "いえ、そのようなことはございません。このワカモ、一日千秋の思いでした。"
"1003305-238-ワカモ" = "ふふっ、昨日お話した通りです。一日があのように終わってしまったとて、この先はまだまだ続きます……。"
"1003305-239-ワカモ" = "ですので、先生。今日は昨日に負けないよう、また素敵な一日を過ごしましょう？"
"1003305-240-ワカモ" = "もちろん、また計画はしっかり練ってきましたので。何も心配なさらなくて結構ですよ♡"
"1003305-244" = "[ns] \"……そっかぁ。\""
"1003305-246" = "（そうして突然のデートが、再び始まることになった）"
