[translation]
"1001815-1" = "輝かしい思い出"
"1001815-2" = "（ユズと二人で、古いゲーム雑誌について話していたはずが……）"
"1001815-3" = "（気づけば本棚の整理に手を着け、最終的には部室全体の掃除をしていた)"
"1001815-5" = "ゲーム開発部・部室"
"1001815-6-ユズ" = "雑誌の内容を、確かめたかっただけなのに……。"
"1001815-7-ユズ" = "いつの間にかここまで……#nすみません、付き合わせてしまって……。"
"1001815-8" = "[s] \"大丈夫だよ、ちょうど時間あったし。\""
"1001815-12" = "[ns] \"それにしても、すごい量のソフトだね。\""
"1001815-13-ユズ" = "は、はい……。"
"1001815-14-ユズ" = "ゲーム開発の資料として集めていたら、いつの間にか……。"
"1001815-15-ユズ" = "ほとんどが、古いゲーム機のソフトですけど……。"
"1001815-20" = "[ns] \"……ん？\""
"1001815-21-ユズ" = "ど、どうかしましたか？"
"1001815-22" = "[ns1] \"これ、何だろう……？\"\n[ns2] \"ゲームのディスク？\""
"1001815-25-ユズ" = "……？"
"1001815-26-ユズ" = "ケースには、何か書かれてますか？"
"1001815-27" = "[s] \"……「ユズ」って書いてあるね。\""
"1001815-28-ユズ" = "え、えっ？#nわ、わたしの名前……！？"
"1001815-29-ユズ" = "な、なんだろう……。"
"1001815-30-ユズ" = "……あっ。"
"1001815-31" = "[s3] \"覚えてないとすると……。\"\n[s4] \"じゃあ、パソコンで確認を――\""
"1001815-34-ユズ" = "ちょ、ちょっと待ってください！"
"1001815-35-ユズ" = "わたしが、先に確認しますっ……！"
"1001815-36" = "[s] \"ど、どうかしたの？\""
"1001815-37-ユズ" = "それは、ええと……。"
"1001815-38-ユズ" = "な、何が入ってるか、わかりませんし……。"
"1001815-39-ユズ" = "うぅ、ちゃんと覚えていれば……。"
"1001815-43-ユズ" = "す、すみません、その……#n確認している間、部室の外で待っていただくことは……？"
"1001815-44" = "[s] \"ちゃんと後ろ向いてるよ？\""
"1001815-45-ユズ" = "だ、ダメですっ……！"
"1001815-48" = "（追い出されるように部室を出た）"
"1001815-50" = "（10分後……）"
"1001815-51-ユズ" = "お、お待たせしました……。"
"1001815-52-ユズ" = "……もう、大丈夫です。"
"1001815-54-ユズ" = "さ、さっきはその、ごめんなさい……。"
"1001815-55" = "[s5] \"ううん、プライベートな物かもだし。\"\n[s6] \"ところで中身は……？\""
"1001815-58-ユズ" = "あ、慌てるほどのものではなかったです。"
"1001815-59-ユズ" = "大事なものでは、ありましたが……。"
"1001815-60" = "[s] \"大事なもの？\""
"1001815-61-ユズ" = "あれは初めて作ったゲーム……#n『テイルズ・サガ・クロニクル・プロトタイプ』のゴールデンマスターディスクでした。"
"1001815-62-ユズ" = "……ゴールデンマスターについて、ですか？"
"1001815-63-ユズ" = "あっ、すみません……。"
"1001815-64-ユズ" = "ええっと……完成版が入った[ruby=マスターディスク]原盤[/ruby]を、ゴールデンマスターと言うんです。"
"1001815-65-ユズ" = "昔はレコードディスクを製造する時、#n耐久度を高めるために、円盤の上に金箔を貼っていたので――"
"1001815-66-ユズ" = "そこから、ゲームの最終バージョンが入ったマスター版を#n「ゴールデンマスター」と呼ぶようになりました。"
"1001815-67-ユズ" = "もちろん今ですと、金箔はつけませんが……。"
"1001815-68-ユズ" = "『テイルズ・サガ・クロニクル・プロトタイプ』をネットにアップする前……#n最後にデータをコピーしたのが、このディスクなんです。"
"1001815-69-ユズ" = "あの時は、これが目に入るだけで恐ろしくて……箱の奥に仕舞おうと必死だったのに……。"
"1001815-70-ユズ" = "今となっては……存在すら、忘れちゃってました。"
"1001815-71" = "[s] \"……もう大丈夫？\""
"1001815-72-ユズ" = "……はい。"
"1001815-73-ユズ" = "悪評や批判の声が……平気になったわけでは、ありません。"
"1001815-74-ユズ" = "ですが、それ以上に……良い思い出が、いっぱいできましたから。"
"1001815-75-ユズ" = "今のメンバーが集まったのも、プロトタイプを公開したおかげです。"
"1001815-76-ユズ" = "もしゲームを作っていなければ、#nこんなきらきらと輝いた毎日は、過ごせてなかったと思いますし……。"
"1001815-77-ユズ" = "なので今は、このディスクに……まっすぐ向き合える、と思っています。"
"1001815-78" = "[s7] \"……そっか。\"\n[s8] \"大切な思い出になったんだね。\""
"1001815-81-ユズ" = "……はい、たったひとつの[ruby=輝かしい思い出]ゴールデンマスター[/ruby]です。"
"1001815-82-ユズ" = "先生は『テイルズ・サガ・クロニクル』のプロトタイプを触ったこと、ありませんよね？"
"1001815-83-ユズ" = "良かったら……プレイ、してみませんか？"
"1001815-84" = "[s] \"良いの！？\""
"1001815-85-ユズ" = "じゃあ、早速……。"
"1001815-90-ユズ" = "あ、あはは……#n最適化できてないので、遅いですね……。"
"1001815-94-ユズ" = "エラー！？#nど、どうして……。"
"1001815-95-ミレニアムのセキュリティシステム" = "<警告：CPUに異常な負荷が発生しています>"
"1001815-96-ミレニアムのセキュリティシステム" = "<スキャン中……詳細不明のデータを確認しました>"
"1001815-97-ミレニアムのセキュリティシステム" = "<該当部分をデリートします>"
"1001815-98-ユズ" = "わ、わたしの思い出、消さないで――！"
"1001815-100" = "（ユズの素早い対処でデータは消えずに済んだが……)"
"1001815-101" = "（『テイルズ・サガ・クロニクル・プロトタイプ』のプレイは、またの機会になった……）"
