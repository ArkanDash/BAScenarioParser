[translation]
"2003902-1" = "宮中のかくれんぼ"
"2003902-2" = "玄龍門・私室"
"2003902-4-キサキ" = "――今[ruby=わらわ]の妾は[/ruby]幽閉されたも同然じゃ。"
"2003902-5" = "[s1] \"いきなりどうしたの！？\"\n[s2] \"一体何があったの！？\""
"2003902-8-キサキ" = "玄龍門内部の事情ゆえ、説明するのが手間……もとい、口にするのが難しい政治的な問題でな。"
"2003902-9-キサキ" = "ひいては――玄武商会との関係、キヴォトスにおける山海経の立ち位置……"
"2003902-10-キサキ" = "その他、護衛の暴走、各部長による部費増額申請、夕餉の献立などなど……"
"2003902-11-キサキ" = "解決の糸口が見つからぬ様々な状況が招いてしまった結果……とも言えるのじゃろう。"
"2003902-12" = "[s] \"えっと……よく分からないんだけど……。\""
"2003902-13-キサキ" = "うむ、無理もない。"
"2003902-14" = "[s] \"もしかして、からかわれてる……？\""
"2003902-15-キサキ" = "考えるより行動せよ――という言葉もあるのじゃぞ、先生。"
"2003902-16-キサキ" = "目は口ほどに物を言い――足は口ほどに物を言う。"
"2003902-17-キサキ" = "――即ち、先生は妾と共に、この状況を打破すべきなのじゃ！"
"2003902-18" = "[s] \"えっと……ここから連れ出してほしいってこと……？\""
"2003902-19-キサキ" = "話が早いのは其方の美徳じゃの。"
"2003902-20-キサキ" = "じゃが、ここ[ruby=りくわかく]六和閣[/ruby]から抜け出すのは、そう容易なことではない。"
"2003902-21-キサキ" = "妾なりに、準備しておってな。"
"2003902-25" = "[ns] \"ま、まさか……！\""
"2003902-26-キサキ" = "ああ、これのことじゃ。"
"2003902-34-キサキ" = "さあ、早く参ろう。"
"2003902-37-キサキ" = "なんとか、ここまで辿り着いたが……"
"2003902-38-キサキ" = "……？ここの方が危険なのではないか？"
"2003902-39-キサキ" = "うむ……先生の言う通りではある。#nここは六和閣の最深部――"
"2003902-40-キサキ" = "厳重な警備のもと、見張りも交代制になっておっての……"
"2003902-45-玄龍門の構成員A" = "あれ……？#nこの時間帯の当番は私だけど……"
"2003902-46-玄龍門の構成員A" = "もしかしてあの子、スケジュールを勘違いしてるとか？"
"2003902-47-玄龍門の構成員A" = "いや……ここに配属されるような者が、そんな基本的なミスをするはずがない！"
"2003902-48-玄龍門の構成員A" = "何奴だ！スパイか！？"
"2003902-49-キサキ" = "っ……！"
"2003902-50" = "[ns] （キサキが危ない……！）"
"2003902-52" = "[ns3] \"あ、えっと！私の護衛……かな？\"\n[ns4] \"そ、そう！そんな感じ！\""
"2003902-55-玄龍門の構成員A" = "先生？いらっしゃってたんですね。"
"2003902-56-玄龍門の構成員A" = "これは失礼いたしました。#n先生の護衛だったのですね……！"
"2003902-57-玄龍門の構成員A" = "……あれ？おかしいな。#nそもそもシャーレの先生が[ruby=ここ]六和閣[/ruby]で警護を受ける必要が……？"
"2003902-58" = "[s] \"あ、えっと……それが……！\""
"2003902-59-キサキ" = "これは、一種のおもてなしです。"
"2003902-60-玄龍門の構成員A" = "おもてなし……？あ！"
"2003902-61-玄龍門の構成員A" = "もしかして、これは門主様の勅令で……？"
"2003902-62-キサキ" = "ええ、そうなります。"
"2003902-63-玄龍門の構成員A" = "っ！……た、大変失礼いたしました！先生！"
"2003902-64-玄龍門の構成員A" = "あ、あはは……どうか玄龍門でごゆっくりとお過ごしください……！"
"2003902-68-キサキ" = "なんとか上手く切り抜けられたようじゃのう。"
"2003902-69-キサキ" = "ご苦労じゃった、先生。このまま抜け出せば――"
"2003902-70-キサキ" = "我々の勝利と言えよう。"
"2003902-72" = "（そうやって、キサキの脱走（？）の計画は続き……）"
"2003902-75" = "[ns] \"あっちから警備の人が来るよ！\""
"2003902-76-キサキ" = "玄龍門の者が先生の護衛をしているという噂は、すでに六和閣中に広まっている……"
"2003902-77-キサキ" = "言い換えれば、先生のそばにいる者は、此処から出られぬ事を意味する。"
"2003902-78-キサキ" = "ふむ……であれば、他の者に変装する必要があるのう。"
"2003902-88-玄龍門の構成員B" = "なっ！玄武商会！？どうしてここに！？"
"2003902-89-玄龍門の構成員B" = "さっさと出ていけ！"
"2003902-90-キサキ" = "ふふ、予想通りじゃ。#n早く逃げるとしよう。"
"2003902-96-キサキ" = "なんとか、六和閣からは出られたものの……"
"2003902-97-キサキ" = "玄武商会の者が、この近隣をうろついておれば目立つじゃろう。"
"2003902-98-キサキ" = "先生のそばに居てもおかしくない者に変装せねばなるまい。"
"2003902-99" = "[s] \"いい案があるの……？\""
"2003902-100-キサキ" = "ふふ、もちろんじゃ。#n即ち――"
"2003902-108-キキ" = "こんにちは先生！キキです！#n今日は一緒に梅花園の外をお散歩する日ですよね？"
"2003902-109" = "[s5] \"…………。\"\n[s6] \"た、たしかに、これならいけるかも……。\""
"2003902-112-キキ" = "わ～い！#nキキ、先生のこと大好き～！"
"2003902-119-玄龍門の構成員C" = "あれ、先生？ここには何の用で……あぁ、なるほど。#n園児の世話をしているところなんですね。"
"2003902-120-玄龍門の構成員C" = "いつもご苦労様です。#nほら、そこの君も。先生の言うことはちゃんと聞くんだぞ？"
"2003902-121-キキ" = "大丈夫です！シュン教官からも同じこと言われました！"
"2003902-122" = "[s7] \"……………………。\"\n[s8] \"あ、あまり……心配、しないでね……。\""
"2003902-125-玄龍門の構成員C" = "はい。それではお願いします。"
"2003902-126-玄龍門の構成員C" = "（……あれ？）"
"2003902-127-玄龍門の構成員C" = "（なんか今、すっごく冷たい視線を浴びたような……）"
"2003902-130" = "[ns] \"そろそろ……いいんじゃないかな。\""
"2003902-131-キサキ" = "うむ。"
"2003902-137-キサキ" = "ふふ、ご苦労じゃったの、先生。"
"2003902-138-キサキ" = "おかげで楽しく脱走ごっこ……もとい、無事脱出することができた。"
"2003902-139-キサキ" = "ん？本当に幽閉されておったのか、じゃと？"
"2003902-140-キサキ" = "……。"
"2003902-141-キサキ" = "どうして、それを聞くのじゃ？"
"2003902-142-キサキ" = "六和閣でも、付近の路地でも、玄龍門の構成員が妾を探していないようじゃった……？"
"2003902-146-キサキ" = "――やはり先生の目は誤魔化せぬのう。"
"2003902-147-キサキ" = "そうじゃ。すべては、妾の芝居よ。"
"2003902-148-キサキ" = "ふふ、おかげで楽しい時間を過ごさせてもらったぞ。"
"2003902-149" = "[s9] \"え、えっと……つまりこれは、\"\n[s10] \"最初からキサキに騙されてたってこと！？\""
"2003902-152-キサキ" = "ふふ、どうじゃろうな？"
"2003902-153-キサキ" = "じゃがな、先生。玄龍門の門主……いや、各学園の生徒会長は……"
"2003902-154-キサキ" = "己が属する学園に幽閉されている、と言っても過言ではないのじゃよ。"
"2003902-155-キサキ" = "妾は――そんな不自由な生徒会長のためにも、息抜きは必要じゃと思っておる。#n無論、教育的指導という意味においてもな。"
"2003902-156" = "[s] \"ここで「教育的」と言っていいのかどうか……。\""
"2003902-157-キサキ" = "ふふ。何はともあれ、此度は妾の興味本位に先生を付き合わせてしまったのも事実。"
"2003902-158-キサキ" = "謝罪をここに。#n必要であれば埋め合わせもしよう――"
"2003902-159" = "[s] \"うーん……でも、私も楽しかったから大丈夫。\""
"2003902-160-キサキ" = "そ、そうか……？"
"2003902-161-キサキ" = "まこと、先生は予想外のことを申してくれる。"
"2003902-162-キサキ" = "……先生。"
"2003902-163-キサキ" = "今日はこのまま……妾に付き合ってはくれぬか？"
"2003902-165-玄龍門の構成員" = "門主様！門主様――！#nどこにいらっしゃいますか――！"
"2003902-169-キサキ" = "おや。門主の不在が玄龍門にバレてしまったようじゃのう。"
"2003902-170-キサキ" = "……致し方あるまい。"
"2003902-175-キサキ" = "先生、参るぞ。"
"2003902-176" = "[s] \"ん？どこに？\""
"2003902-177-キサキ" = "もちろん、玄龍門じゃ。"
"2003902-178-キサキ" = "ふふ。まさか――付き合わぬとは申すまい？"
"2003902-179-キサキ" = "無論……[ruby=そなた]其方[/ruby]が拒むのであれば、妾も止めはしないが……。"
"2003902-180" = "[s] \"うぅ……その言い方はズルいよ！\""
"2003902-181-キサキ" = "ふふ、知っておる。#n門主たるもの、すべてを適材適所に使うものじゃからな。"
"2003902-182-キサキ" = "さて。"
"2003902-183-キサキ" = "残りの時間も……よろしく頼むぞ、先生。"
"2003902-185" = "（そうやってキサキと一緒に、玄龍門に幽閉（？）されてしまったのだった……）"
