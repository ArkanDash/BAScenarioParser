[translation]
"1601905-1" = "アップグレード"
"1601905-2-トキ" = "ご存知のとおり、私は新しい武器をいただきました。"
"1601905-3-トキ" = "いわば「アップグレード」された状態です。"
"1601905-4" = "[s] \"そうだね。\""
"1601905-5-トキ" = "その新しい武器というのが、この2丁のエネルギーピストルです。"
"1601905-6-トキ" = "名前の通り、エネルギー武器です。"
"1601905-7-トキ" = "即ちエネルギーさえ供給できれば、耐久性の許す限り、いつまでも使用可能ということです。"
"1601905-8-トキ" = "いわば無限弾薬です。"
"1601905-9-トキ" = "さらに、二丁拳銃でもあります。"
"1601905-10-トキ" = "先生、ここで何か感じられることはありませんか？"
"1601905-11" = "[s1] \"無限弾薬と……二丁拳銃……？\"\n[s2] \"なんのことだろう……？\""
"1601905-14-トキ" = "これは最高の組合せの1つだと、とある配信者が言っていました。"
"1601905-15-トキ" = "ということは、パーフェクトな[ruby=あすま]飛鳥馬[/ruby]トキに相応しいアップグレードではないかと思うのです。いえーい。"
"1601905-16" = "[s] \"それで……話というのは……？\""
"1601905-17-トキ" = "大したことではありません。"
"1601905-18-トキ" = "ただ、ふと思いついたのです。"
"1601905-19-トキ" = "先生もご存知のとおり、私にはこれまで使用してきた色々な武装があります。"
"1601905-20-トキ" = "そして今の私は、エネルギー武器のシステムを使えるようになりました。"
"1601905-21-トキ" = "つまり可能な限り多くのもの……例えば、かつて潜入作戦で使用したアームギアなどをアップグレードできれば。"
"1601905-22-トキ" = "カッコよくて――"
"1601905-23-トキ" = "面白そう――"
"1601905-28-トキ" = "……いえ。戦力の強化に役立つと思いました。"
"1601905-29" = "[s] \"本音が2つも漏れた！？\""
"1601905-30-トキ" = "聞き間違いです。"
"1601905-31" = "[s] \"そうかなぁ？\""
"1601905-32-トキ" = "はい。"
"1601905-33-トキ" = "……そのため息はどういう意味でしょうか？#nため息をつくと幸せが逃げると言いますよ。"
"1601905-34-トキ" = "ですが、幸運のウサギメイドでありエージェント偵察隊である私がいますので、#n心配は要りません。"
"1601905-35" = "[s] \"……話を戻すけど、どんな風にアップグレードしたいの？\""
"1601905-36-トキ" = "これは失礼。つい話が逸れてしまいました。"
"1601905-37-トキ" = "……つまり、こう思ったのです。"
"1601905-38-トキ" = "アームギアにエネルギー武器のシステムを適用すれば――"
"1601905-39-トキ" = "ロケットのように、アームギアを発射できるのではないでしょうか？"
"1601905-40" = "[s] \"カッコいいね！\""
"1601905-41-トキ" = "やはり先生も分かってくださるのですね。"
"1601905-42-トキ" = "どうでしょう、最高のアイデアだと思いませんか？"
"1601905-43-トキ" = "さあ早く褒めてください。ナデナデもしてください。"
"1601905-44-トキ" = "私がアームギアを発射する姿、見たいですよね？"
"1601905-45-トキ" = "先生がそう思わなくても、私は見てみたいです。ですので早く。"
"1601905-46" = "[s] \"その前に1つ聞いてもいい？\""
"1601905-47-トキ" = "なんでしょうか。"
"1601905-48" = "[s] \"なんで、わざわざ私の許可を？\""
"1601905-52-トキ" = "……。"
"1601905-53-トキ" = "…………。"
"1601905-54-トキ" = "………………。"
"1601905-55" = "[s] \"トキ、私の目を見て。\""
"1601905-56-トキ" = "はい。"
"1601905-57" = "[s] \"素直に答えてね。\""
"1601905-58-トキ" = "……。"
"1601905-59" = "[s] \"目を逸らしてもダメ。\""
"1601905-63-トキ" = "……分かりました。お答えしましょう。"
"1601905-64-トキ" = "リオ様とヒマリ部長から、安全上の理由で許可が下りなかったのです。"
"1601905-65-トキ" = "発射する時に、熱のせいで火傷をする可能性が高いとのことで。"
"1601905-66" = "[s] \"それはたしかにダメだね。\""
"1601905-67-トキ" = "先生。"
"1601905-68-トキ" = "より大きな目的のためには、些細なことは無視しても良いと思いませんか？"
"1601905-69-トキ" = "些細なことじゃない、と？"
"1601905-70-トキ" = "……。"
"1601905-71-トキ" = "先生はそう思っても、私には些細なことです。#nですので、どうか許可を。"
"1601905-72" = "[s] \"ダメです。\""
"1601905-73-トキ" = "先生……。"
"1601905-74" = "[s] \"そんな目で見ても、ダメなものはダメです。\""
"1601905-75-トキ" = "でしたらせめて、高出力ビームを発射できるようなアームギアを……。"
"1601905-76-トキ" = "3点バーストもできて、補助パーツをつければチャージの容量を増やせるような――"
"1601905-77" = "[s] \"却下です。\""
"1601905-78-トキ" = "先生……。"
"1601905-80" = "（その後、少し拗ねてしまったトキを宥めることになった）"
"1601905-81" = "（しばらく頭を撫でてあげてようやく、トキは意地を張るのをやめてくれた……）"
