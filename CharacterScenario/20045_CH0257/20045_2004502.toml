[translation]
"2004502-1" = "静かなる・フィーナ"
"2004502-2" = "（百鬼夜行へやってきた）"
"2004502-7" = "[ns] \"久しぶりだから、道に迷っちゃったな……。\""
"2004502-9-観光客A" = "道に迷うとこでした！ありがとう！"
"2004502-10-観光客B" = "あのー……呉服屋さんってどこですか？"
"2004502-12" = "[ns1] （あ、ガイドさんがいるんだ）\n[ns2] \"すみません、ちょっと道を教えてもらえますか？\""
"2004502-15-？？？" = "もちろんデース！どちらへご案内シマ――"
"2004502-20-フィーナ" = "あっ！センセイ！"
"2004502-21-フィーナ" = "こんにちは！こちらが生まれ変わったフィーナになりマス！"
"2004502-22" = "[s3] \"フィーナ！？\"\n[s4] \"生まれ変わったってどういうこと！？\""
"2004502-25-フィーナ" = "いい質問デス！"
"2004502-26-フィーナ" = "ワタシは今、百鬼夜行の商店街からのお願いで、ガイドを務めていマス！"
"2004502-30-フィーナ" = "ちょうどお仕事中なのデスが、先生もご一緒にどうデスカ？"
"2004502-31" = "[s] \"フィーナがいいなら、喜んで。\""
"2004502-32-フィーナ" = "イエス！それではフィーナについてきてクダサイ！"
"2004502-34-フィーナ" = "ここが、百鬼夜行を一望できる展望台デース！"
"2004502-35-フィーナ" = "あちらに見えるのが、ワタシたちのシンボルである神木！毎年、あれを祀るお祭りが行なわれてマス！"
"2004502-36-観光客A" = "おお……カッコいい！"
"2004502-37-観光客B" = "神木をバックに撮りたいんだけど、ガイドさん、いいかな？"
"2004502-38-フィーナ" = "もちろんデス！"
"2004502-45-フィーナ" = "ここは、百鬼夜行の名産品が盛り沢山の、「食べ歩き横丁」デス！"
"2004502-46-フィーナ" = "気になるお店があれば、何でも聞いてクダサイネ！"
"2004502-47-フィーナ" = "不肖フィーナ、ご案内しマス！"
"2004502-48-観光客A" = "うわぁ！いい匂い！"
"2004502-49-観光客B" = "全部美味しそう……。"
"2004502-50-フィーナ" = "迷ったときは、こちらの焼き鳥屋さんがオススメデース！"
"2004502-52-フィーナ" = "お次に紹介するのは渦巻映画村！ここには……アレ？"
"2004502-53-フィーナ" = "……？"
"2004502-57-観光客A" = "？"
"2004502-61-フィーナ" = "……ナナナナゼ！？"
"2004502-62" = "[s] \"フィーナ、どうしたの？\""
"2004502-63-フィーナ" = "い、いつもここにいたハズ……。"
"2004502-64-フィーナ" = "ピンチデス！！"
"2004502-65" = "[s] \"映画のセットなら、もう撮影が終わっちゃったのかも……。\""
"2004502-66-フィーナ" = "ち、違うんデス……。"
"2004502-67-フィーナ" = "毎日ココにいる、ミニ柴蔵が見当たらないんデース！"
"2004502-68" = "[s] \"ミニ……？\""
"2004502-69-フィーナ" = "名作「るろうの柴蔵」の柴蔵の服を着たワンちゃんが、ここでお昼寝していマシテ……。"
"2004502-70-フィーナ" = "映画村の名物といえばミニ柴蔵！なんデス！"
"2004502-71" = "[s6] \"ワンちゃんにもその日の気分があるから……。\"\n[s7] \"別の場所でお昼寝してるのかも？\""
"2004502-74-フィーナ" = "た、たしかに元の柴蔵も、映画の中でさすらってマシタ……！"
"2004502-75-フィーナ" = "毎日ここで寝てたから、つい……！痛恨の極みデス！"
"2004502-76-観光客B" = "ガイドさん、ここにも何かあるの～？"
"2004502-77-観光客A" = "さっきからずっと待ってるんだけど……。"
"2004502-82-フィーナ" = "（イ、イケマセン……テンパっちゃってマス……！）"
"2004502-83-フィーナ" = "（オーノー！フィーナ、頭が真っ白デス……）"
"2004502-84" = "[ns] \"ガイドさん、この等身大パネルすごいですね！\""
"2004502-85-フィーナ" = "（……お頭！！）"
"2004502-86-フィーナ" = "ハ、ハイ！それは、映画村で撮影をおこなった、人気俳優たちデス！ここでは無声映画の時代から盛んに――"
"2004502-91-フィーナ" = "（恩に着マス……お頭……！）"
"2004502-93" = "（落ち着きを取り戻したフィーナの見事な案内で、ガイドツアーは無事大成功を収めた）"
