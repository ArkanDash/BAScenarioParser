[translation]
"1012002-1" = "1時間目「特別講義：手段」"
"1012002-2" = "（ナツに教えてもらっていたカフェに到着した）"
"1012002-7-ナツ" = "お、先生、早いね。"
"1012002-8-ナツ" = "にひ、今日はこれを食べるよ。"
"1012002-9-ナツ" = "チョコバナナタルト。"
"1012002-10-ナツ" = "ここのは絶品なんだ。"
"1012002-11-ナツ" = "柔らかいバナナと、硬いチョコチップのハーモニーが絶妙で――"
"1012002-12-ナツ" = "それぞれ異なる甘さが生み出すシナジー。"
"1012002-13-ナツ" = "まさに、今日みたいな「チョコバナナ気分」にぴったりなスイーツだと言えよう。"
"1012002-14" = "[s] \"チョコバナナ気分……？\""
"1012002-15-ナツ" = "ふふ、先生にはまだ早かったかな？"
"1012002-16-ナツ" = "……スイーツは、言葉じゃ表現しきれないんだよ。"
"1012002-17-ナツ" = "言葉の枠に押し込むには、情報が多すぎるからね。"
"1012002-18-ナツ" = "だから、もっと感覚的な話。"
"1012002-19-ナツ" = "ストレスが溜まると――"
"1012002-20-ナツ" = "――無性にスイーツが食べたくなる。"
"1012002-21-ナツ" = "うん？最近ストレスが溜まってるのかって？"
"1012002-22-ナツ" = "うーん……。"
"1012002-23-ナツ" = "どうだろ……？"
"1012002-24" = "[s1] \"バンドのスケジュールをナツが管理してるんだっけ。\"\n[s2] \"それがストレスになってるんじゃないかな？\""
"1012002-27-ナツ" = "んーそれは違うかなぁ。"
"1012002-28-ナツ" = "みんな、私の計画について来てくれてるし。"
"1012002-29-ナツ" = "この程度じゃストレスにはならないよ。"
"1012002-30-ナツ" = "それこそ――"
"1012002-31-ナツ" = "「天然のメープルシロップでできたつらら」を食べたらお腹を壊して、限定パフェを食べ損ねる……。"
"1012002-32-ナツ" = "これくらいじゃないと。"
"1012002-33-ナツ" = "……ああ。でも、そっか。"
"1012002-34-ナツ" = "先生が私とスイーツを食べる理由にはなるのかな。"
"1012002-35-ナツ" = "それなら、無くても、あったほうがいいのかも？"
"1012002-36-ナツ" = "手段と目的が逆転することなんてたくさんあるんだし。"
"1012002-38" = "（しばらくして、チョコバナナタルトが運ばれてきた）"
"1012002-39" = "（「チョコバナナ気分」にぴったりな味だった）"
