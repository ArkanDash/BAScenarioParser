[translation]
"1005506-1" = "素直に"
"1005506-2" = "（シャーレの調理場で待っていると、約束の時間ちょうどにシグレが来た）"
"1005506-8-シグレ" = "へぇ、ここが……思ったより色々揃ってるね。"
"1005506-13-シグレ" = "何度かシャーレには来てたけど、ここに入ったのは初めてかも。"
"1005506-14" = "[s1] \"あ、いらっしゃい。\"\n[s2] \"その背中の包みは……？\""
"1005506-19-シグレ" = "……ああ、これ？"
"1005506-20-シグレ" = "まあ気になるよね。"
"1005506-21-シグレ" = "この前言った通り、料理をふるまおうと思って。"
"1005506-22-シグレ" = "それで、料理に必要な食材を持ってきた。"
"1005506-23-シグレ" = "心配しなくても、変な食材じゃないよ。"
"1005506-24-シグレ" = "先生はそこで座って待ってて。私が全部やるから。"
"1005506-25-シグレ" = "さて、じゃあ227号特別クラスの特製ジビエ料理を――"
"1005506-32" = "[ns3] \"！？\"\n[ns4] \"生肉だ！？\""
"1005506-35-シグレ" = "新鮮で良い感じでしょ？"
"1005506-36-シグレ" = "こういう生肉、あんまり見たことない感じだった？"
"1005506-37-シグレ" = "あ、まずジビエの話からした方が良いかな？"
"1005506-38-シグレ" = "熊とか鹿とか、兎とか……狩りで捕まえた野生の鳥獣を使わせてもらう料理のこと。"
"1005506-39-シグレ" = "ジビエは鮮度が命だから、普段は捕まえてすぐに下ごしらえをするんだけどね。"
"1005506-43-シグレ" = "今日はそのまま持ってきて、シャーレで直接手入れを……"
"1005506-44-シグレ" = "……ん、どうしたの？"
"1005506-45-シグレ" = "うん。227号だと、しょっちゅう食べてるよ？"
"1005506-46-シグレ" = "……って言いたいところだけど、まあ半分以上は冗談。事務局からパンとかお米は配給されるから、ジビエはそれなりに特別かな。"
"1005506-47-シグレ" = "でも、この前は先生がすごい料理をごちそうしてくれたし、私としても227号の特別な料理をってね。"
"1005506-48-シグレ" = "……まあ実はこの肉、今日は使わないんだけどね。捕まえたばっかりだと、固すぎて食べるのに向かなくてさ。"
"1005506-49-シグレ" = "でも先生のビックリした顔が見れたから、頑張ってこの肉の塊を持ってきた甲斐があったなー。"
"1005506-50" = "[s5] \"つまり、一発からかうためにそこまで……\"\n[s6] \"シグレは色々とすごいね……。\""
"1005506-53-シグレ" = "まあ、日々楽しく生きないとね。イタズラ心を忘れたら、人生の楽しみが半減しちゃうから。"
"1005506-54-シグレ" = "さ、そろそろ本格的に料理を始めよっか。"
"1005506-57-シグレ" = "肉は塩と香辛料で下味をつけて……"
"1005506-63-シグレ" = "よく熱したフライパンの上にバターを溶かして、表面がカリッとなるまで焼いたら……"
"1005506-67-シグレ" = "最後にウォッカを――"
"1005506-72" = "[ns7] \"お酒！？\"\n[ns8] \"ちょっ……！？\""
"1005506-75-シグレ" = "……もしかして先生、料理にお酒を使うのを見るのは初めて？"
"1005506-76-シグレ" = "料理にお酒を使うと肉の臭みが取れて、独特の風味が生まれるらしいよ。"
"1005506-77-シグレ" = "前行ったレストランでも、最後にお酒を注いで火をつけてたでしょ。あの「フランベ」ってやつ。"
"1005506-78" = "[s9] \"あれお酒を入れて加熱してるから今回とは違うよ。\"\n[s10] \"普通のお酒をそのまま入れたら、お酒の味にならない……？\""
"1005506-81-シグレ" = "うーん、それもそうかも。"
"1005506-82-シグレ" = "となると、どうしたものかな……"
"1005506-83-シグレ" = "とりあえずこれは私が食べるとして——"
"1005506-87" = "[ns] \"ちょっと借りて良い？\""
"1005506-91-シグレ" = "……？"
"1005506-92-シグレ" = "良いけど、先生に今日やってもらうのは……"
"1005506-93" = "[s] \"大丈夫、任せて。\""
"1005506-103" = "（シグレが持ってきてくれた食材を調理した――）"
"1005506-109-シグレ" = "……何だか結局、先生に作ってもらったみたいになっちゃったね。"
"1005506-110-シグレ" = "ごめんね、せっかく時間を貰ったのに。"
"1005506-111" = "[s11] \"ううん、大したことはしてないし。\"\n[s12] \"何ならシグレが来てくれて、こうして食事できるだけで嬉しいから。\""
"1005506-116-シグレ" = "……。"
"1005506-117-シグレ" = "まあ、そう言ってくれるとありがたいけど……"
"1005506-118-シグレ" = "そういう言い方は、いくら私でもちょっとなぁ……。"
"1005506-119-シグレ" = "これが大人の余裕かー……。"
"1005506-120-シグレ" = "でも、気を付けた方が良いと思うよ？"
"1005506-121-シグレ" = "そういう風にされたら、私も調子に乗っちゃうかもしれないよ？"
"1005506-122-シグレ" = "先生だって、私がシャーレに通い始めたりしたら疲れるでしょ？"
"1005506-123-シグレ" = "え、問題無い……？"
"1005506-124-シグレ" = "私のイタズラぐらい、いくらでも受け止める……？"
"1005506-125-シグレ" = "ふふっ、そういう事いうんだ？"
"1005506-126-シグレ" = "じゃあ、これからも来させてもらおうかな。"
"1005506-127-シグレ" = "先生も、227号特別クラスにもっと遊びに来てね。"
"1005506-128-シグレ" = "もちろん来る前の連絡は忘れないように！"
