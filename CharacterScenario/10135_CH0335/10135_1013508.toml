[translation]
"1013508-1" = "生活環境について"
"1013508-3-ケイ" = "あ、いらしたんですね。"
"1013508-4-ケイ" = "本当にここ……人の住む場所なんでしょうか。"
"1013508-5" = "[s] \"手伝うよ。\""
"1013508-6-ケイ" = "え？"
"1013508-7-ケイ" = "あ……はい、ありがとうございます。まあ2人の方が早いですからね。"
"1013508-12-ケイ" = "はぁ……モモイは散らかしてばかりで、片づけるはずもなく。"
"1013508-13-ケイ" = "その点ミドリは片づけは上手で、ある程度生活力もありますが――"
"1013508-14-ケイ" = "そもそも掃除の頻度が少ない……。"
"1013508-15-ケイ" = "ユズは……隠れる癖は減りつつあっても、ゲームかコーディングばかり……。"
"1013508-19-ケイ" = "アリスは……アリスが、心配です。"
"1013508-20-ケイ" = "4人の中では2番目に生活力はありますが、結局人間は周りと似ていくもの……#nそして周りにいる人たちといえば……。"
"1013508-21-ケイ" = "いえ、別に悪いと言いたいわけじゃないんです。#nどちらかといえば良い人たちだとは思います。ただ私は普段から――"
"1013508-30-ケイ" = "ふぅ……ようやくマシになりました。"
"1013508-31-ケイ" = "……3日持てば御の字ですが。賭けてもいいです。"
"1013508-32" = "[s] \"これで3日か……なるほど……。\""
"1013508-33-ケイ" = "はい。"
"1013508-34-ケイ" = "……。"
"1013508-35-ケイ" = "……？"
"1013508-36-ケイ" = "待ってください、先生。"
"1013508-37" = "[s] \"なっ、なにかな？\""
"1013508-38-ケイ" = "なんか今……目をそらしましたよね？"
"1013508-39" = "[s] \"ご、誤解ですよケイ様。\""
"1013508-40-ケイ" = "ケイ様……？"
"1013508-41-ケイ" = "……。"
"1013508-42-ケイ" = "先生。"
"1013508-43-ケイ" = "私の目を見てください。"
"1013508-44" = "[s] \"い、嫌だ！私は屈しない！！\""
"1013508-45-ケイ" = "ちゃんと見てくださいってば！"
"1013508-46" = "[s] \"くうっ……！\""
"1013508-47-ケイ" = "よろしい。では胸に手を当てて答えてください。"
"1013508-48-ケイ" = "普段、ちゃんと掃除してますか？"
"1013508-49" = "[s] \"……！\""
"1013508-54-ケイ" = "なっ！？待ちなさい！今ので全部分かりましたから！こらっ！逃げるなーっ！！"
"1013508-58-ケイ" = "……。"
"1013508-59" = "[s] \"……。\""
"1013508-60-ケイ" = "先生。"
"1013508-61" = "[s] \"うっ、うん？\""
"1013508-62-ケイ" = "ここは……住居ですか？ゴミ屋敷ですか？"
"1013508-63-ケイ" = "前者と答えたらモラル無し、後者と答えたら人間失格です。"
"1013508-64-ケイ" = "10秒差し上げます。言い訳開始。"
"1013508-65" = "[s1] \"き、聞いてケイちゃん！全部説明するから！\"\n[s2] \"本来、掃除や家事はキリがないものでね！？\""
"1013508-68-ケイ" = "それで？"
"1013508-69" = "[s] \"今日の分を終えたら、明日にはまた明日の分が発生する！\""
"1013508-70-ケイ" = "はい、続けて。"
"1013508-71" = "[s3] \"だからその気になった時にまとめて済ませた方が！\"\n[s4] \"気持ちもいいし合理的じゃないかなって！？\""
"1013508-77-ケイ" = "黒ずくめの合理主義者みたいな言い訳をしますね！？"
"1013508-78-ケイ" = "はぁ……言い訳は終わりましたか？#nそれじゃあ――"
"1013508-84-ケイ" = "本当に……どうして私が……。"
"1013508-90-ケイ" = "リオの部屋よりはマシですが……いえ、あれは比べるべくもないですね……。"
"1013508-94-ケイ" = "この埃の量……こんなところで生活していたら体を悪くしますよ……？"
"1013508-101-ケイ" = "ふぅ……。"
"1013508-102-ケイ" = "では先生？"
"1013508-103" = "[s] \"はい……。\""
"1013508-104-ケイ" = "何か言うことは？"
"1013508-105" = "[s5] \"申し訳ありませんでした。誠にありがとうございます。\"\n[s6] \"申し訳ございません。感謝申し上げます。\""
"1013508-108-ケイ" = "……分かればいいです。"
"1013508-109-ケイ" = "もしもまた散らかっていた時には……。"
"1013508-113-ケイ" = "……。"
"1013508-114-ケイ" = "結局、また散らかすんですよね？"
"1013508-115-ケイ" = "はあ……1人で頑張らないで私を呼んでください。"
"1013508-116" = "[s7] \"……！？\"\n[s8] \"助けてくれるの……？\""
"1013508-119-ケイ" = "どうせ先生は1人だとやらないじゃないですか。"
"1013508-120-ケイ" = "それに、2人の方が早いでしょう？"
"1013508-124" = "[ns] \"やっぱり……やっぱり……！！\""
"1013508-125-ケイ" = "なんですか、勿体ぶって……。"
"1013508-126-ケイ" = "あ、待ってください、そのニヤニヤ顔……。"
"1013508-127-ケイ" = "また変なこと言ったら本当に――！"
"1013508-128" = "[ns9] \"ケイちゃんって可愛い！\"\n[ns10] \"ケイちゃんって可愛い！！\"\n[ns11] \"ケイちゃんって可愛い！！！\""
"1013508-132-ケイ" = "あ\"あ\"～～～～っ！！！！！！！"
