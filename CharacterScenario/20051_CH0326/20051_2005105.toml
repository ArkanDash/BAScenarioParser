[translation]
"2005105-1" = "可愛いね、レイサ"
"2005105-2" = "（モモトークの内容が気になり、レイサを探しに行った）"
"2005105-5" = "[ns] \"よかった……何事もなくて……。\""
"2005105-6-レイサ" = "もうこの格好をしてても驚かないんですね、先生。"
"2005105-7-レイサ" = "実はコートのポケットに入れっぱなしにしてた焼夷手榴弾が爆発して……。"
"2005105-8-レイサ" = "慌てて消したんですが……。#nクローゼットと中の服がびしょ濡れになってしまって……あははっ……。"
"2005105-9-レイサ" = "クリーニングから戻ってきた、このコスチュームがなかったら――"
"2005105-10-レイサ" = "家の外に出られず、大ピンチになるところでしたよ。"
"2005105-11-レイサ" = "なので、今から新しい服を買いに行きます！"
"2005105-12" = "[s] \"一緒に行く？\""
"2005105-13-レイサ" = "！！"
"2005105-14-レイサ" = "先生が選んでくださるんですか！？心強いです！"
"2005105-15-レイサ" = "行きましょう！今すぐ！"
"2005105-18-レイサ" = "むむ……。"
"2005105-19-レイサ" = "全然分かりません！"
"2005105-20-レイサ" = "マネキンさんが着てる服を、全部買ってしまったほうがよさそうです！"
"2005105-21" = "[s] \"レイサって、あまりファッションに興味ないの？\""
"2005105-22-レイサ" = "私、小物をいっぱい着けるのは好きなんですが！"
"2005105-23-レイサ" = "流行には疎くて！"
"2005105-24-レイサ" = "並んでるものをまるまる買ったほうが、失敗しないかなと……。"
"2005105-25-レイサ" = "とりあえずこれとこれにします。では会計に――"
"2005105-26-スケバンA" = "どういうことだコラァ！"
"2005105-27-スケバンA" = "完全に押し売りじゃねぇか！"
"2005105-32-店員" = "お、お客様、返品交換はできかねます。#n申し訳ございません……。"
"2005105-33-店員" = "水洗い不可、と明記されていたかと思いますが……。"
"2005105-34-スケバンB" = "てめぇ、ふざけてんのかァ？"
"2005105-35-スケバンB" = "セーターが縮んでピチピチのへそ出しになってんだぞ！#nどう着ろってんだ！ああん！？"
"2005105-36-店員" = "ひいいっ……返品交換にはレシートが必要でして……！"
"2005105-37-スケバンA" = "話が通じねぇヤツだなぁ！全部ぶち壊してやろうか！"
"2005105-38-レイサ" = "せ、先生！これは止めに入らなきゃです……！"
"2005105-39-レイサ" = "でも着替えてたら、間に合わない……。"
"2005105-40" = "[s1] \"魔法少女は、みんなを守るヒーロー。\"\n[s2] \"ドレスコードも、バッチリだからね。\""
"2005105-43-レイサ" = "先生……！"
"2005105-44-レイサ" = "はい！行ってきます……！"
"2005105-45-レイサ" = "スーッ……。"
"2005105-49-レイサ" = "キュルルル～……ピキーン！シャキキーン！バァーン！"
"2005105-54-レイサ" = "自警団のスーパースター、必殺のハートエース……。"
"2005105-55-レイサ" = "[ruby=うざわ]宇沢[/ruby]レイサ、登場！！！"
"2005105-57-スケバンA" = "な、なんだこいつ？"
"2005105-58-スケバンB" = "お前も返品に来たのか？"
"2005105-59-スケバンB" = "あんな服も売ってんのかよ。ちょっとこの店見直したわ……。"
"2005105-61-レイサ" = "善良な市民を脅かす不届き者……この宇沢レイサが許しません！"
"2005105-62-レイサ" = "あと、へそ出しでも似合っていますよ！"
"2005105-63-スケバンA" = "何言ってんだぁ！？"
"2005105-64-スケバンA" = "やっつけろ！"
"2005105-73-スケバンA" = "ぐああっ……。"
"2005105-74-スケバンB" = "つ、つえーな……。"
"2005105-79-レイサ" = "正義に代わって、おしおきです！"
"2005105-80-店員" = "あ、ありがとうございます！助かりました！"
"2005105-85-お客さんA" = "あっという間に倒しちゃった……すごい！"
"2005105-86-お客さんB" = "カッコいい！まさにヒーローだ！"
"2005105-87-レイサ" = "へ、へへ……そんな……照れちゃいます。"
"2005105-88-レイサ" = "では皆さん、ごゆっくりお買い物をお楽しみください！"
"2005105-94-店員" = "あっ、魔法少女のお客様。#n……まだお支払いが済んでないようです。"
"2005105-95-店員" = "お会計はこちらになります。"
"2005105-99-レイサ" = "あ……。"
"2005105-101-レイサ" = "は、はいぃ……！"
"2005105-103" = "（顔を赤らめたレイサと一緒に服を買い、お店を後にした）"
"2005105-104" = "（新しい洋服を着たレイサはとても可愛かった）"
