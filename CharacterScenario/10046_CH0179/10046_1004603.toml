[translation]
"1004603-1" = "イズナと一緒に砂遊び！"
"1004603-2-イズナ" = "ふんふん～♪"
"1004603-3-イズナ" = "イズナこんこん、こんここ～ん♪"
"1004603-4" = "（イズナと再び、海辺へと訪れた）"
"1004603-13-イズナ" = "あっ！主殿、主殿！今の見ましたか！？"
"1004603-14-イズナ" = "波が打ち寄せた後、戻っていく様子を見ていると……何だかこう、不思議な気分になります！"
"1004603-15" = "[s] \"確かに、何となく分かるかも。\""
"1004603-16-イズナ" = "一緒でしたか！えへへっ！"
"1004603-17-イズナ" = "夏の海って、こんなにも目が回ることでいっぱいなんですね！"
"1004603-18-イズナ" = "さて、では今日は何をしましょうか！？"
"1004603-19" = "[s] \"うーん、じゃあ前できなかった水泳でも――\""
"1004603-20-イズナ" = "っ！！"
"1004603-21-イズナ" = "あの、えっとですね、主殿……。"
"1004603-22-イズナ" = "その……。"
"1004603-28-イズナ" = "はっ！！"
"1004603-29-イズナ" = "あ、主殿！"
"1004603-30-イズナ" = "イズナ、やりたいことを思い出しました！"
"1004603-31" = "[s] \"一体どんな修行？\""
"1004603-32-イズナ" = "夏、海、そしてせっかくの砂浜……。"
"1004603-33-イズナ" = "となれば忍びとしては、やはりあの修行！"
"1004603-34-イズナ" = "すなわち、「砂のお城」作りです！"
"1004603-35" = "[s1] \"……なるほど？\"\n[s2]（忍びと関係あるのかな……？）"
"1004603-38-イズナ" = "これはイズナが偶然聞いたお話なのですが。"
"1004603-39-イズナ" = "昔どこかの海辺で、巨大な砂のお城を築き上げ……#n悪党たちと、[ruby=しれつ]熾烈[/ruby]な戦いを繰り広げた方々がいたらしいです！"
"1004603-40" = "[s] （微妙に覚えがある、気がする……）"
"1004603-41-イズナ" = "何と、まる3日間も攻防を繰り広げたのだとか！"
"1004603-42-イズナ" = "その過程で負傷者も出てしまったとのことですが、それでも全員諦めずに戦い続けたとのことです！"
"1004603-43-イズナ" = "ちなみにどうやら、機転になったのは海から出てきた河童だそうで……！"
"1004603-44" = "[s3] \"……聞いたことない話に飛躍した！\"\n[s4]（河童が、海に……？）"
"1004603-47-イズナ" = "そうと聞けばイズナも、忍びとして負けるわけにはいきません！"
"1004603-48-イズナ" = "何人たりとも侵入を許さない……"
"1004603-49-イズナ" = "そんなすごいお城を作って、主殿を守りきってみせます！"
"1004603-50-イズナ" = "というわけで主殿、"
"1004603-56-イズナ" = "砂のお城作り……手伝っていただけますか？"
"1004603-57" = "[s] \"よし、やろう！\""
"1004603-58-イズナ" = "はい！"
"1004603-60" = "（そうしてやる気満々のイズナと共に、砂のお城を作り始めた）"
"1004603-62-イズナ" = "完璧なお城を作るためには、基盤が大事だとイズナは思います！"
"1004603-63-イズナ" = "ですのでまず、この辺りの砂をならして……。"
"1004603-69-イズナ" = "えへへっ！これくらいで良いでしょうか？"
"1004603-75-イズナ" = "ああっ！せっかく作ったのに！？"
"1004603-76-イズナ" = "うぅ……波にさらわれるようにして、全部崩れてしまいました……。"
"1004603-77" = "[s] \"うーん、もうちょっと海から遠い場所に作った方が良さそうだね。”"
"1004603-78-イズナ" = "くっ、これしきのことでイズナは負けません！"
"1004603-79-イズナ" = "たとえ初めは、上手く行かないとしても……！"
"1004603-80-イズナ" = "イズナは、失敗から学べる忍びですので！"
"1004603-81" = "[s] \"うん、その意気！\""
"1004603-82-イズナ" = "はい、イズナ頑張ります！"
"1004603-86-イズナ" = "では次は、もっと外側からこう……！"
"1004603-91-イズナ" = "主殿、そちらの方をよろしくお願いします！"
"1004603-95-イズナ" = "きゃんっ！？ま、また崩れてしまいました……！？"
"1004603-96" = "[s] \"今度は重さに耐えきれなかったのかな……？\""
"1004603-97-イズナ" = "う、うぅ……！イズナは諦めません！"
"1004603-98-イズナ" = "主殿！もう一度です！"
"1004603-100-イズナ" = "うわーーん！？また上の方が崩れてしまいました！？"
"1004603-101-イズナ" = "バランスが難しすぎます！"
"1004603-103-イズナ" = "くあっ！？今度は城壁を崩すかのように、ワタリガニの襲撃が！？"
"1004603-104-イズナ" = "ああ、いけません！そこに登られては……！"
"1004603-105-イズナ" = "うわあぁん！？"
"1004603-107" = "（何度も試したものの、いま一つ上手く行かず……）"
"1004603-109" = "[ns] \"うーん、やっぱり難しいね……。\""
"1004603-110-イズナ" = "そう、ですね……。"
"1004603-111-イズナ" = "うぅ……イズナが、最初から欲張ったのがいけなかったのでしょうか……。"
"1004603-112-イズナ" = "主殿を守るため、"
"1004603-113-イズナ" = "壮大なお城を作りたかったのですが……。"
"1004603-114-イズナ" = "……ですがよく考えると、最終的にお城が完成しなければ意味はありません。"
"1004603-115-イズナ" = "主殿のお言葉のおかげでイズナ、理解しました！"
"1004603-116" = "[s] （ほとんど何も言ってないような……？）"
"1004603-117-イズナ" = "まずは、小さく作ることから始めることにしましょう。"
"1004603-118-イズナ" = "小さくても、頑丈なお城を目指して！"
"1004603-119" = "[s] \"うん、良いかも。よし、頑張ろっか！\""
"1004603-120-イズナ" = "はい！イズナ、あらためて参ります！"
"1004603-128" = "（そうして何度も、）"
"1004603-140" = "（イズナとお城を作っては崩れを繰り返し……）"
"1004603-153-イズナ" = "主殿……これまで、幾つもの逆境がありましたね。"
"1004603-154" = "[s] \"そうだね……。\""
"1004603-155-イズナ" = "突然の波にさらわれて、お城が崩れたり……。"
"1004603-156-イズナ" = "いきなり飛んできたビーチボールによって、派手に城壁が壊れたり……。"
"1004603-157" = "[s] \"あの子、ものすごい勢いで謝ってたね。\""
"1004603-158-イズナ" = "ですが、それでも諦めることなく……"
"1004603-159-イズナ" = "計画を修正し、時には主殿のアドバイスに基づいて方針を変え……"
"1004603-160-イズナ" = "そうしてようやく、ようやくです……！"
"1004603-161" = "[s] \"うん、ようやくだね。\""
"1004603-162-イズナ" = "これが、"
"1004603-163-イズナ" = "主殿とイズナで作った……イズナたちだけの、お城です！"
"1004603-168-イズナ" = "どう思いますか！？主殿！"
"1004603-169" = "[s5] \"すごくカッコいいと思う！\"\n[s6] \"まあ、当初の予定とはちょっと違うかもだけど……！\""
"1004603-172-イズナ" = "数々の困難がありましたが……！"
"1004603-173-イズナ" = "それでもこうして完成させる事ができて、イズナは嬉しいです！"
"1004603-174-イズナ" = "こういうのは一人でやるより、誰かと一緒の方がずっと楽しいのだということ……"
"1004603-175-イズナ" = "イズナ、初めて知りました！主殿からは、色んなことを学んでばかりです！"
"1004603-176" = "[s] \"……それは良かった。\""
"1004603-181-イズナ" = "おや、もうこんな時間ですね……。"
"1004603-182-イズナ" = "夢中になっていたら、あっという間でした。えへへっ。"
"1004603-183-イズナ" = "そろそろ、戻らないといけなさそうです。"
"1004603-187-イズナ" = "残念ですが"
"1004603-188-イズナ" = "今日はこれまでにして……"
"1004603-189" = "[s] \"……イズナ、まだ終わりじゃないよ！\""
"1004603-190-イズナ" = "……はい？"
"1004603-191" = "[s7] \"このお城みたいに一つ一つが小さいとしても、物量で勝負はできる！\"\n[s8] \"それは忍びにも関係が深い、伝統的な戦術の一つ！\""
"1004603-194" = "[ns] \"と、思うんだけど……手伝ってくれる？\""
"1004603-195-イズナ" = "……もう少し主殿と一緒に、"
"1004603-196-イズナ" = "遊んでいても良いということですか？"
"1004603-200-イズナ" = "それが、主殿の命令なら……"
"1004603-201-イズナ" = "……はい、もちろんです！"
"1004603-202-イズナ" = "えへへっ！"
"1004603-204" = "（そうして日が暮れて……夕日が水平線の向こうに隠れるまで、）"
"1004603-205" = "（イズナと一緒に砂遊びをしたのだった）"
