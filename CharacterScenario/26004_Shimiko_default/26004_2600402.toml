[translation]
"2600402-1" = "本好きの少女"
"2600402-2-シミコ" = "おはようございます、先生！本当に来てくださったんですね。"
"2600402-3-シミコ" = "私から呼んでおいてなんですが、お忙しいのは知っていましたので……ありがとうございます、嬉しいです。"
"2600402-4-シミコ" = "招待したのに、おもてなしができるような場所でなくてごめんなさい。"
"2600402-5-シミコ" = "あっ……すみません、ちょっとだけ声のトーンを下げましょうか？みなさん本を読んでいるので……。"
"2600402-6-シミコ" = "この図書館はすごく広いので、小声のお話でしたら大丈夫です。構造的にも、それほど響きませんので。"
"2600402-7-シミコ" = "あくまでも念のため、ですが。ありがとうございます、ふふっ。"
"2600402-8-シミコ" = "それではせっかく来ていただきましたし、何か本でも借りていかれますか？"
"2600402-9-シミコ" = "私が全力でお勧めの本を選びますので！"
"2600402-10-シミコ" = "先生はどんなジャンルのものが好きですか？小説とか自伝とか、それとも非文学の方でしょうか？科学雑誌とかもありますし……。"
"2600402-11" = "[s1] \"のんびり小説でも読みたい気分かな。\"\n[s2] \"料理本とか、旅行ガイドみたいなのが読みたいな。\""
"2600402-12-シミコ" = "なるほど……解釈一致です！では、私にお任せください！"
"2600402-13-シミコ" = "なるほど……解釈一致です！では、私にお任せください！"
"2600402-14-シミコ" = "えっと……それでしたらこちらの方に……。"
"2600402-15-シミコ" = "……？何の騒ぎでしょう？"
"2600402-19-不良の客" = "あひゃひゃひゃひゃ！これめっちゃウケる！あははははっ！！あはっ、はっ、ひー、お腹いてぇ！！あっひゃひゃひゃ！！"
"2600402-21-不良の客" = "……あぁん？なに見てんだこの野郎。なんか用でもあんのか、あん？こちとら客だぞ？"
"2600402-22-不良の客" = "あーお菓子うま……モグモグ、パリパリ……あ、こぼれた。まあいいか、掃除の人いんだろ。"
"2600402-26-シミコ" = "……。"
"2600402-27-シミコ" = "ちょっと待っていてくださいね、先生。これは司書として黙って見過ごせません。"
"2600402-29-シミコ" = "ちょっと、そこの方。"
"2600402-30-不良の客" = "あん？なに、私？"
"2600402-31-シミコ" = "はい。あなたです。ここは公共の場ですので、マナーは守っていただけますか？"
"2600402-32-シミコ" = "一切喋らないでくださいとは言いません、ですがあなたの言動は目に余ります。"
"2600402-33-シミコ" = "そもそも食べ物の持ち込みは禁止です、飲み物もちゃんと密閉容器に入っていてストローなどで飲めるものしか許されていません。"
"2600402-34-シミコ" = "他の方々に迷惑をかけないでください！"
"2600402-35-不良の客" = "ったく……頭の固そうなやつが……せっかくこうやってしゅしょーに本を読みに来てやったのにさぁ！"
"2600402-36-不良の客" = "おら来いよ、相手してやっから。あんたみてえのは一回痛い目見ないとわかんねえだろ。"
"2600402-38" = "グシャ"
"2600402-39-シミコ" = "……！"
"2600402-40-シミコ" = "……今。"
"2600402-41-シミコ" = "……今、何をしましたか？"
"2600402-42-シミコ" = "まさかとは思いますが……本の頁を折りましたか？"
"2600402-43-不良の客" = "はぁ？そりゃそうだろ、どこまで読んでたか分かんなくなるだろうが。"
"2600402-45-シミコ" = "……本への礼儀が、"
"2600402-48-シミコ" = "なってませんっっっ！！！！"
"2600402-50" = "ガッ！！！！！！！"
"2600402-51-不良の客" = "……！？！？"
"2600402-52-不良の客" = "ぐ、ぁ……今……？え……？視界、世界が……灰色に……。"
"2600402-53-不良の客" = "う、小学校の入学式……お誕生日会……思い出……。"
"2600402-54-不良の客" = "あれ？……川？誰？向こう側から……おじいちゃん……？"
"2600402-55-不良の客" = "……はっ！？な、何が……本の角が、頭に当たって……？"
"2600402-58-シミコ" = "色々と問題行動だらけでしたが、本を傷つけることだけは絶対に許しません！"
"2600402-59-シミコ" = "本の価値も知らないなんて！あなたには教育が必要みたいですね……。"
"2600402-60-シミコ" = "折った本の弁償代も含めて、タダでは済ましません……覚悟しなさい！"
"2600402-61-不良の客" = "う、頭いった……ようやく視界が……。"
"2600402-62-不良の客" = "ってか一歩間違えれば死ぬとこだっただろうが！走馬灯見えたぞ！？"
"2600402-63-シミコ" = "そんな簡単に人は死にません。この本もこれくらいではびくともしない素材ですし、ちゃんと力も調整しました。"
"2600402-64-不良の客" = "そういう問題じゃねえよ！何だこいつ！？本当に司書なのか！？"
"2600402-65-不良の客" = "こんの……！くそっ、今度はこっちの番だ、くらえっ！！"
"2600402-69" = "ブォンッ！！"
"2600402-70" = "[ns] \"シミコっ！\""
"2600402-74" = "パシッ"
"2600402-75-不良の客" = "……は？"
"2600402-76-不良の客" = "え？嘘だろ……？"
"2600402-77-不良の客" = "拳を、片手で受け止めた……？"
"2600402-78-シミコ" = "……あなたは表紙だけで、本の中身が完璧に分かりますか？"
"2600402-79-シミコ" = "本を読む人なら、誰でも知っていることです。図書館の司書だからといって、舐めてもらっては困ります。"
"2600402-80-シミコ" = "司書が一日に何冊の本を運んでいるのか、一度に何冊持っているのかご存知ですか？"
"2600402-82-シミコ" = "ただの腕力だけでも、あなたみたいな人に負けたりしません。"
"2600402-83-不良の客" = "な、は……！？う、浮いてる！？"
"2600402-84-不良の客" = "う、うわっ！？お、降ろして！降ろしてってば！"
"2600402-85-シミコ" = "……ふう。"
"2600402-86-シミコ" = "このまま投げ飛ばしてしまいたいところですが、音が響きそうなので止めておきます。"
"2600402-87-シミコ" = "見逃すのは今回だけですよ、分かりましたね？"
"2600402-88-不良の客" = "わ、分かった、分かったから！これからはちゃんと……。"
"2600402-90-不良の客" = "ちゃんと注意して……"
"2600402-91-不良の客" = "……なーんて言うとでも思ったか！じゃあね！！！！"
"2600402-93-シミコ" = "……。"
"2600402-95-不良の客" = "……？"
"2600402-96-不良の客" = "……え、は？いつの間に……！？"
"2600402-97-シミコ" = "ふう……。"
"2600402-98-シミコ" = "どうしてこう何度も同じようなことを言わないといけないのでしょうか……。"
"2600402-99-シミコ" = "あなたは、図書館の司書の仕事内容を知ってますか？"
"2600402-100-シミコ" = "図書館の司書が貸し借りされたすべての本を戻すために、一日にどれぐらいの距離を移動してると思いますか？"
"2600402-101-シミコ" = "音を出さずに素早く移動するなんて、司書でしたら誰でも持っているスキルです。"
"2600402-102-シミコ" = "笑顔で対応するのも司書としては当然のことなのですが、反省の色も見えませんし……。"
"2600402-103-シミコ" = "これ以上、笑顔でいることは難しそうです。"
"2600402-104-不良の客" = "ひっ！？わ、笑ってるじゃん！怖いからそんな笑顔のままこっち来ないで！"
"2600402-106-不良の客" = "ち、近づくな……！来るなっ！"
"2600402-109-不良の客" = "う、うわああムグッ！！"
"2600402-110" = "（結局、その不良生徒は悲鳴すら出せない状態のまま、シミコに「教育」された）"
"2600402-112" = "（しばらくして……）"
"2600402-113-シミコ" = "……ふう。ああいう方、時々いるんですよね……。"
"2600402-114-シミコ" = "すみません、先生。私から誘ったのに、変なところを見せてしまいました。"
"2600402-115-シミコ" = "本当はこう、もっと落ち着いたというか、知的な側面をお見せしたかったのですが……。"
"2600402-116" = "[s3] \"ううん、知識の守護者って感じだった。\"\n[s4] \"知的（？）でかっこよかったよ、シミコ。\""
"2600402-117-シミコ" = "……！"
"2600402-118-シミコ" = "……！"
"2600402-119-シミコ" = "そ、そんなお世辞を……。"
"2600402-120-シミコ" = "……ふふっ。"
"2600402-121-シミコ" = "いえ、でも先生にそう言っていただけると嬉しいです。"
"2600402-122-シミコ" = "ありがとうございます、先生。時間がかかってしまいましたがあらためて、ゆっくりしてくださいね！"
"2600402-124" = "（その後、シミコが薦めてくれた本を読みながらのんびり過ごした）"
"2600402-125" = "（……今日持ってきてたコーヒー、ちゃんと封がされたストロー式のもので良かった）"
