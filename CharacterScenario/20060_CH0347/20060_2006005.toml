[translation]
"2006005-1" = "イブキとごはん！"
"2006005-2" = "浜辺の屋台街"
"2006005-3" = "（イブキの言う通り、見たことない屋台が並んでいる）"
"2006005-4" = "[ns] \"いつの間に……？\""
"2006005-6-イブキ" = "夏になると開くお店なんだって。"
"2006005-7-イブキ" = "海に人がたくさん来る時だけやってるみたい！"
"2006005-8" = "[s] \"なるほど。期間限定の屋台なんだね。\""
"2006005-12-イブキ" = "あっ！先生先生！"
"2006005-13-イブキ" = "あそこ！マダイの焼きそばー！"
"2006005-14-イブキ" = "あっちは焼きとうもろこし！#nしょっぱいかき氷に……アサリのラーメン……！"
"2006005-15-イブキ" = "うーん……どれにしよう……？"
"2006005-16-イブキ" = "イブキのお小遣いは……えっと……。"
"2006005-17" = "[s] \"イブキ。\""
"2006005-18-イブキ" = "うん？"
"2006005-19" = "[s] 大人の財布を取り出す。"
"2006005-23" = "[ns] \"ご馳走の前で悩むなんて、もったいないよ。\""
"2006005-24-イブキ" = "……！"
"2006005-25-イブキ" = "いいの！？"
"2006005-26-イブキ" = "でも、イブキお小遣いあるよ……？"
"2006005-27" = "[s] \"焼きとうもろこしから行こう！！\""
"2006005-28-イブキ" = "うんっ！"
"2006005-30" = "（そうして、イブキと食べ物を買いに行った）"
"2006005-32" = "焼きとうもろこしの店"
"2006005-33-イブキ" = "こんにちは！"
"2006005-34-屋台の店主" = "らっしゃい！どれにするんだい？"
"2006005-35-イブキ" = "うーん……。"
"2006005-36-イブキ" = "イブキは「旨味爆発クワトロチーズ焼きとうもろこし」にする！"
"2006005-37-屋台の店主" = "お！お嬢ちゃんお目が高いね！#nそいつはうちの看板メニューさ！"
"2006005-38-屋台の店主" = "こいつのおかげで海にも屋台を出せるようになってな……今では常連さんもできたんだ！"
"2006005-39-屋台の店主" = "メニューを思いついた日を今でも覚えてるぞ、それは5年前の秋で……うん？お客さん、注文はまだかい？"
"2006005-40" = "[s] \"わ、私も同じものにします……。\""
"2006005-41-屋台の店主" = "はは！ちょっと待ってくれよな！"
"2006005-46-屋台の店主" = "あいよ！焼き立てお待ちどう！"
"2006005-48-イブキ" = "わあ！ ありがとうございます！"
"2006005-52" = "（トッピングがたっぷり乗った、美味しそうなとうもろこしを受け取った）"
"2006005-53" = "（……しかし、イブキのほうが大きいような？）"
"2006005-55-屋台の店主" = "うん？どうかしたのかい？"
"2006005-56-屋台の店主" = "……とうもろこしのサイズは個体差があるかもしれないな？"
"2006005-57" = "[s] \"そ、そんなぁ……。\""
"2006005-59" = "（その後、他の屋台でも……）"
"2006005-61-焼きそば屋" = "マダイの焼きそば2つ、お待ちどうさま！"
"2006005-62-イブキ" = "やった！ありがとうございます！"
"2006005-63-焼きそば屋" = "お嬢さん、元気いっぱいで可愛いわね～たくさんお食べ～"
"2006005-65-飴屋" = "ご注文のレインボーアイシングキャンディアップル、2つです！"
"2006005-66-イブキ" = "えへへ！楽しみ～！"
"2006005-68" = "（……なんだか）"
"2006005-69" = "（みんな、イブキのほうにおまけをつけてくれた）"
"2006005-71-イブキ" = "ありがとう先生！いっただきま～す！"
"2006005-72" = "[s] \"足りなかったらまた買ってくるね！\""
"2006005-73-イブキ" = "ううん！こんなにたくさんあるもん！"
"2006005-74-イブキ" = "イブキ、浮かれて買いすぎちゃったし……。"
"2006005-79-イブキ" = "え？"
"2006005-86-イブキ" = "か、カモメさんが……。"
"2006005-87-イブキ" = "先生のご飯を……！"
"2006005-88" = "[s] \"ど、泥棒……！\""
"2006005-89-イブキ" = "ど、どうしよう……。"
"2006005-93-イブキ" = "大丈夫だよ、先生！"
"2006005-94-イブキ" = "イブキの分、いっぱいあるからわけっこして食べよ！"
"2006005-95" = "[s] \"イブキ……！\""
"2006005-97" = "（その後、イブキとわけっこして食べた)"
"2006005-98" = "（多めにおまけをつけてもらっていたから、二人でお腹いっぱい食べることができた）"
