[translation]
"2006006-1" = "イブキと、一緒に。"
"2006006-2" = "浜辺"
"2006006-3" = "（浜辺へ向かうと……）"
"2006006-4" = "（イブキが何かをしている……）"
"2006006-8-イブキ" = "よいしょ……。"
"2006006-9-イブキ" = "あっ！あそこにもある！"
"2006006-14-イブキ" = "えへへ、これで5個！"
"2006006-16" = "（イブキは、何かを熱心に拾っていた）"
"2006006-18" = "[ns] \"イブキ？\""
"2006006-19-イブキ" = "あ、先生！"
"2006006-20" = "[s] \"何をしてるの？\""
"2006006-21-イブキ" = "絵に使うものを探してたの！"
"2006006-26-イブキ" = "これ！"
"2006006-28" = "（イブキが差し出した手のひらには……）"
"2006006-29" = "（長い年月をかけて波に削られ、丸くきれいになった――）"
"2006006-30" = "（色とりどりの貝殻とガラス片があった）"
"2006006-31-イブキ" = "どう？きれいでしょー？"
"2006006-32" = "[s1] \"宝石みたいだね！\"\n[s2] \"でも、どうやって絵を描くの？\""
"2006006-35-イブキ" = "えっとね～"
"2006006-36-イブキ" = "これをいっぱい紙に貼るの！"
"2006006-37-イブキ" = "絵はクレヨンや絵の具で描くだけじゃないんだよ！"
"2006006-38-イブキ" = "でも……なかなか探してる色が見つからなくて……。"
"2006006-39-イブキ" = "だから、早起きして探してたの！"
"2006006-44" = "[ns3] \"なるほどね……それじゃあ私もお手伝いしますよ！\"\n[ns4] \"「巨匠」イブキ先生！\""
"2006006-47-イブキ" = "きょしょー……！"
"2006006-48-イブキ" = "えへへ、よろしくお願いします、先生！"
"2006006-49" = "[s] \"じゃあ、ちょっとここで待ってて。\""
"2006006-50-イブキ" = "え？待つの？なんで？"
"2006006-51-イブキ" = "先生、いい方法を知ってるの……？"
"2006006-52-イブキ" = "分かった！待ってるね！"
"2006006-54" = "（私は近くの店で「あるもの」を買ってきた）"
"2006006-56-イブキ" = "おかえりなさい！"
"2006006-57-イブキ" = "あれ、先生なに持ってるの？"
"2006006-58-イブキ" = "それは……フォーク？"
"2006006-59" = "[s] \"熊手だよ。\""
"2006006-60-イブキ" = "くまで……？"
"2006006-61-イブキ" = "あっ！"
"2006006-62-イブキ" = "イブキ、分かった気がする！"
"2006006-63-イブキ" = "砂を熊手でかいたら――"
"2006006-64-イブキ" = "貝殻とカケラだけが取れるってことだね！"
"2006006-65" = "[s] \"その通り！イブキは賢いね！\""
"2006006-66-イブキ" = "えへへ、褒められちゃった。#nありがとう先生！"
"2006006-68" = "（イブキに熊手を渡した）"
"2006006-70-イブキ" = "これなら、いっぱい見つかりそう！"
"2006006-75-イブキ" = "じゃあ、こっちから……。"
"2006006-80-イブキ" = "……あれ？"
"2006006-81" = "[s] \"ああっ……！\""
"2006006-83" = "（熊手には、貝殻とガラス片ではなく……）"
"2006006-84" = "（大量のゴミが引っかかっていた）"
"2006006-86" = "[ns] \"えっと……イブキ……。\""
"2006006-87-イブキ" = "すごい！これなら、海のお掃除も一緒にできちゃうね！"
"2006006-88" = "[s] \"うん……？\""
"2006006-89-イブキ" = "貝殻やガラスの欠片もとれるし、海もきれいにできる！#nこういうのを、いっせきにちょーって言うんだよね？"
"2006006-90-イブキ" = "よーし！イブキ、頑張る！"
"2006006-91" = "[s5] \"ぐぅっ……！\"\n[s6] \"まぶしい……！\""
"2006006-94-イブキ" = "先生？泣いてるの？"
"2006006-95-イブキ" = "い、イブキ、何か変なこと言った……？"
"2006006-96-イブキ" = "違う……？"
"2006006-97-イブキ" = "ただ感動しただけ……？どうして？"
"2006006-99" = "（その後、ポリ袋を持ってきて、イブキと一緒にゴミを集めた）"
"2006006-100" = "（帰る時には5袋分のゴミがまとまっていて……）"
"2006006-101" = "（宝石のように輝く、一粒の欠片を見つけることができた）"
