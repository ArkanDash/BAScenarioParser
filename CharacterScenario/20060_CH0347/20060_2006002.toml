[translation]
"2006002-1" = "イブキとお休み！"
"2006002-2" = "砂浜のパラソルの下"
"2006002-5" = "（イブキと夏休みの約束をしたものの……）"
"2006002-6" = "（……予定を合わせるために無理をした結果、海に着く頃にはすっかりヘトヘトだった）"
"2006002-10-イブキ" = "ふわぁ……。"
"2006002-11-イブキ" = "イブキ、ねむーい……。"
"2006002-12" = "（私の疲れが移ったのか、イブキもなんだかぐったりしている）"
"2006002-13-イブキ" = "ぜんぜん力はいんないよぉ……。"
"2006002-14" = "[s] \"先生も……。\""
"2006002-15-イブキ" = "えへへ……イブキとおんなじー。"
"2006002-16-イブキ" = "でも、先生と遊ぶって……。"
"2006002-17-イブキ" = "約束……したから……。"
"2006002-18-イブキ" = "……。"
"2006002-20-イブキ" = "……ぐぅ。"
"2006002-21" = "[s] \"イブキは休んでて大丈夫だよ。\""
"2006002-22" = "（イブキがぐっすり眠ったのを確認して……）"
"2006002-23" = "[ns] \"ちょっと、目を閉じるだけ……。\""
"2006002-24" = "（……そのまま眠ってしまった）"
"2006002-25" = "（……不意に目が覚める）"
"2006002-29" = "[ns] \"……んん、暑い？\""
"2006002-32" = "（時間が経過したからか……パラソルの影が移動し、日差しが肌を焼いている）"
"2006002-33" = "[ns] \"イブキが暑くないように……。\""
"2006002-34" = "（パラソルの影を調整する）"
"2006002-35" = "[ns1] \"これなら、大丈夫かな。\"\n[ns2] \"……少し、目を閉じるだけ。\""
"2006002-39" = "（しばらくして……）"
"2006002-41" = "[ns] \"……はっ！また日差しが！\""
"2006002-43" = "（もう一度パラソルの位置を変える。イブキはぐっすり眠っている)"
"2006002-48" = "（しばらくして……）"
"2006002-52" = "[ns] \"あれ……？イブキから着信……？\""
"2006002-55" = "（目が覚めて隣を見ると）"
"2006002-56" = "（眠っているはずのイブキの姿がなかった）"
"2006002-60" = "[ns] \"イブキ……！？\""
"2006002-62" = "（心配になりながら、とりあえず電話に出た）"
"2006002-66-イブキ" = "先生先生！"
"2006002-67" = "[s] \"よかった……！なんともない？\""
"2006002-68-イブキ" = "なんの話～？#nあのね、イブキね、すっごい場所見つけたの！"
"2006002-69-イブキ" = "海を見たら、右にま～っすぐ向かって！"
"2006002-70-イブキ" = "まってるね～！"
"2006002-74" = "[ns] \"……とりあえず行ってみよう。\""
"2006002-76" = "（イブキの無事に胸をなでおろし、言われた場所へ向かった）"
"2006002-83" = "[ns] \"言われたとおりに来たけど……。\""
"2006002-84-イブキ" = "先生！"
"2006002-85" = "（突然、頭上からイブキの声が聞こえた）"
"2006002-86" = "[ns] 上を見る。"
"2006002-89" = "[wa:500]― [log=이부키 수영복]先生！[wa:950]こっちこっち～！[/log]"
"2006002-90" = "[wa:2860]― [log=이부키 수영복]ここ、[wa:560]すっ[wa:610]ごく涼しいの！[/log]"
"2006002-93" = "[wa:670]― [log=이부키 수영복]どんなにお日様の光が強くても――[/log]"
"2006002-94" = "[wa:3180]― [log=이부키 수영복]ここなら……[wa:1080]ほら、[wa:950]全然暑くないんだよ～！[/log]"
"2006002-97" = "[wa:500]― [log=이부키 수영복]だからね！[wa:930]ここなら――[/log]"
"2006002-98" = "[wa:1880]― [log=이부키 수영복]もう、[wa:630]パラソル移動しなくてもいいんだよ、[wa:2100]先生。[/log]"
"2006002-101" = "[ns] \"……気づいてたの？\""
"2006002-103" = "[wa:2000]― [log=이부키 수영복]……[wa:1010]うん。[wa:1090]ほんとはね、[wa:830]イブキ、[wa:710]見てたの。[/log]"
"2006002-104" = "[wa:2150]― [log=이부키 수영복]先生がよいしょ、[wa:1490]よいしょって、[wa:890]パラソル運んでるとこ……。[/log]"
"2006002-107" = "[wa:670]― [log=이부키 수영복]でも[wa:860]ここなら大丈夫だよ！[/log]"
"2006002-108" = "[wa:2910]― [log=이부키 수영복]イブキと一緒に、[wa:1330]ゆっ[wa:470]くり休もうね！[/log]"
"2006002-111-イブキ" = "イブキね！ここを見つけたから先生に早く来てほしくて！"
"2006002-112-イブキ" = "高いところから見てたら、先生が迷ったときも教えてあげられるでしょ！えへへ！"
"2006002-113-イブキ" = "ねぇねぇ、先生。"
"2006002-114-イブキ" = "えっと……。"
"2006002-115-イブキ" = "……降りられなくなっちゃった。"
"2006002-116" = "[s] \"こっちにおいで。\""
"2006002-118" = "（イブキを木の下に降ろし、木陰で一緒に休むことにした）"
"2006002-119" = "（その後、ここはヤシの実が降ってくるから危ないという話を聞いて移動することになったが……）"
"2006002-120" = "（イブキと共に過ごした時間は、心安らぐものだった）"
