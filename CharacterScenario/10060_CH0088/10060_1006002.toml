[translation]
"1006002-1" = "ゴリゴリ君の残骸"
"1006002-2" = "（焦っていたメグの様子が心配になって、急いで言われた場所へ向かうと……）"
"1006002-6" = "（閑散とした路地で、困ったようにしゃがみ込んでいるメグの姿があった）"
"1006002-10-メグ" = "……あ。"
"1006002-11-メグ" = "せんせ～～！！"
"1006002-12" = "[s1] \"待たせてごめんね、メグ。\"\n[s2] \"すごく焦ってたけど、大丈夫？\""
"1006002-13-メグ" = "うぅ……実は今、すっごく困ったことになっちゃって……。"
"1006002-14-メグ" = "うぅ……実は今、すっごく困ったことになっちゃって……。"
"1006002-15-メグ" = "このままじゃ破産しちゃうよ～！#nただでさえ寂しい私のフトコロが……。"
"1006002-16-メグ" = "……ん、"
"1006002-17-メグ" = "どういうことかって？"
"1006002-24-メグ" = "それがね……。"
"1006002-28" = "[ns3] \"アイスクリーム……？\"\n[ns4] \"「ゴリゴリ君」？\""
"1006002-29-メグ" = "うん。#nそれでね、こっちが……。"
"1006002-30-メグ" = "うん。#nそれでね、こっちが……。"
"1006002-34" = "[ns5] \"……これは？\"\n[ns6] \"……もしかして、これもゴリゴリ君？\""
"1006002-37-メグ" = "そう！"
"1006002-38-メグ" = "正確には……ゴリゴリ君「だった」ものだよ！"
"1006002-39-メグ" = "さっきから失敗しちゃってばっかなんだ。#nゴリゴリ君を食べるのがこんなに大変だなんて、今まで知らなかったよ……。"
"1006002-40-メグ" = "ほんとに手強いんだよ？ゴリゴリ君って見た目以上に繊細でさ！"
"1006002-41-メグ" = "カン！ってやったら、すぐにジュワ～！って溶けちゃうの！"
"1006002-42-メグ" = "……うん？#nカンとかジュワ～じゃ伝わらない？"
"1006002-43-メグ" = "うーん、"
"1006002-48-メグ" = "どう説明したらいいんだろ……。"
"1006002-49-メグ" = "え？ひとつひとつ起きたことを順番に……？"
"1006002-53-メグ" = "分かった！"
"1006002-56-メグ" = "んっとね～！#nそれじゃあ最初にゴリゴリ君を買ったところから！"
"1006002-57-メグ" = "そこのコンビニで買ったんだけど、"
"1006002-58-メグ" = "カチンコチンで全然食べられなくって……"
"1006002-59-メグ" = "すっごく硬くてさ～！これじゃ食べられないって思って！"
"1006002-60-メグ" = "どうすればいいんだろうって考えたの。"
"1006002-61-メグ" = "それでね、気づいたんだ！溶かしちゃえばいいんじゃんって！#n私ってバカだけど、氷が熱で溶けることくらいは知ってるからね！"
"1006002-62-メグ" = "それでね……。"
"1006002-66" = "[ns7] \"……ちょっと待って。つまり……。\"\n[ns8] \"あそこで溶けてるのって全部……。\""
"1006002-69-メグ" = "そ！やっぱ先生は頭いいね～。"
"1006002-70-メグ" = "説明しなくても分かっちゃうんだ！"
"1006002-74-メグ" = "この「メグマパワー！」を使ったの！"
"1006002-75" = "[s9] \"いやいやいやいや！！\"\n[s10] \"待って待って！！\""
"1006002-78-メグ" = "……うん？先生？#nそんな慌てて、どうしたの？"
"1006002-79-メグ" = "え？やめといたほうがいいの？#nなんで？"
"1006002-80-メグ" = "また同じ結果になっちゃう……？"
"1006002-85-メグ" = "……なるほど！言われてみたらそうだね！#nだから何回やっても失敗しちゃってたんだ！"
"1006002-86-メグ" = "さっすが先生！"
"1006002-87-メグ" = "頼りになるねえ～！"
"1006002-88-メグ" = "うーん……でも、ゴリゴリ君は硬いまんまじゃ食べられないよ。#n振り出しに戻っちゃったね……。"
"1006002-89-メグ" = "なんかいい方法ないかなぁ……。"
"1006002-93-メグ" = "あ、そうだ！色々知ってる先生なら、なにかいいアイデア出せない？#n教えて教えてっ！"
"1006002-94-メグ" = "お願い～！このままじゃ、ゴリゴリ君が食べられないよう！"
"1006002-95-メグ" = "……えっ？"
"1006002-96-メグ" = "このゴリゴリ君はいつ買ったのかって？"
"1006002-97-メグ" = "んーと、先生に連絡した頃だったはず……。"
"1006002-98" = "[s] \"それならもう大丈夫だと思うよ。\""
"1006002-99-メグ" = "……どういうこと？"
"1006002-100-メグ" = "いいから食べてみなって？"
"1006002-101-メグ" = "でも……硬くて歯が痛くなっちゃうよ？"
"1006002-105-メグ" = "……ん、分かった！"
"1006002-106-メグ" = "私より賢い先生がそこまでいうなら、"
"1006002-107-メグ" = "信じるよ！"
"1006002-111-メグ" = "それじゃ……。"
"1006002-112-メグ" = "いっくよ～～～！"
"1006002-119-メグ" = "……あれっ！？"
"1006002-125-メグ" = "わっ、普通に食べられちゃったよ！？"
"1006002-126-メグ" = "ん～、おいしっ！#nでもちべた～い！"
"1006002-127-メグ" = "どういうこと……？"
"1006002-128-メグ" = "先生にはゴリゴリ君を食べられるようにする力があるの！？"
"1006002-129" = "[s11] \"時間が溶かしてくれたんだよ。\"\n[s12] \"忍耐力が試されてたんだよ。\""
"1006002-132-メグ" = "おぉ……！"
"1006002-136-メグ" = "……よく分かんないや！"
"1006002-137-メグ" = "けど、なんかすっごく頭が良さそうなことを言ってるのは分かったよ！"
"1006002-138-メグ" = "やっぱ先生って賢いんだね！"
"1006002-139-メグ" = "うーん、おいし～！#n先生のおかげで、ゴリゴリ君が食べられたよ～！"
"1006002-140-メグ" = "だからぁ……はいっ！"
"1006002-144-メグ" = "……ささ！先生も一口どう？"
"1006002-148" = "[ns13] \"あれ、私にくれるの？\"\n[ns14] \"もらってもいいの……？\""
"1006002-151-メグ" = "当ったり前じゃん！"
"1006002-152-メグ" = "先生がいなかったら、このゴリゴリ君もあそこで溶けちゃったゴリゴリ君「だったもの」になってたと思うし！"
"1006002-153-メグ" = "とにかく、先生が来てくれたおかげでこうして食べられてるんだからさ。"
"1006002-157-メグ" = "それにここまで走ってきてくれたんだし、疲れてるでしょ？#n遠慮しないで食べちゃってよ！ほらほら、あ～ん♪"
"1006002-163-メグ" = "あははっ！どう～？"
"1006002-164-メグ" = "おいしいよね、ゴリゴリ君！"
"1006002-168-メグ" = "……そうだ。#nせっかくだし、もう一個買って半分こしよっか？"
"1006002-170" = "（その後、ゴリゴリ君を買うために2人でコンビニに入った）"
"1006002-171" = "（しかし、メグが買いすぎたせいで、売り切れてしまっていたのだった……）"
"1006002-172-メグ" = "うわ～ん！ゴリゴリくうううん～！！！"
