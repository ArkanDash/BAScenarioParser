[translation]
"1006006-1" = "温泉とラーメンのつながり"
"1006006-2" = "（約束の時間に合わせて、待ち合わせ場所に着いた)"
"1006006-3" = "（そこは繁華街から距離のある静かなところだった)"
"1006006-7-メグ" = "やっほ～！先生～！！ここだよ、ここ！"
"1006006-8" = "[s1] \"メグ～！\"\n[s2] \"こんなところで何してるの？\""
"1006006-11-メグ" = "え？何してたのかって？"
"1006006-12-メグ" = "えっとね～ラーメン作る準備！"
"1006006-13-メグ" = "わざわざここで作る理由……？"
"1006006-14-メグ" = "うーん、"
"1006006-15-メグ" = "なんでだろう……。"
"1006006-16-メグ" = "ラーメン作る時は、こうやって静かなところに来るんだよね。"
"1006006-17-メグ" = "邪魔する人もいないし～ガヤガヤ騒がしい人もいないし！"
"1006006-18-メグ" = "あ、でも……"
"1006006-19-メグ" = "強いて言うなら……。"
"1006006-21-メグ" = "ラーメンがぐつぐつしてる所をじっくり見られるから……かなぁ？"
"1006006-22-メグ" = "……ぐつぐつしてるとこ見てて楽しいのかって？"
"1006006-26-メグ" = "う～ん……。"
"1006006-27-メグ" = "……なんて説明したらいいんだろう……？"
"1006006-28" = "[s3] \"麺が茹で上がっていく様子が好きなの？\"\n[s4] \"料理に集中したいってこと？\""
"1006006-31-メグ" = "う～ん、そういうわけではないかも。"
"1006006-32-メグ" = "別に料理上手でもないからね……。だから袋麺なわけだし。"
"1006006-33-メグ" = "なんて言うか……ぼーっと見てるとね……。"
"1006006-34-メグ" = "そのうち、温泉みたいに見えてきて……。"
"1006006-35-メグ" = "そんな感じなんだけど……先生もそう思わない？"
"1006006-39" = "[ns5] \"モクモクとした湯気とか？\"\n[ns6] \"お湯が沸いてるところが？\""
"1006006-42-メグ" = "ん～、よく分かんない！#nけど、大体そんな感じ、かな？"
"1006006-43-メグ" = "考えてみてよ、先生。"
"1006006-44-メグ" = "あっ、私が先生に考えてって言うのはなんか変かな……。"
"1006006-45-メグ" = "……ま、それは置いといてさ！"
"1006006-46-メグ" = "ラーメンが茹で上がっていく様子を思い返してみて！"
"1006006-47-メグ" = "ぐつぐつ湧いてるお湯に材料を入れると、段々ふにゃふにゃ～ってなるでしょ？"
"1006006-48-メグ" = "それで、ゆらゆらと水蒸気が上ってくとこを見てると……。"
"1006006-49-メグ" = "ラーメンにとっての温泉みたいだな～って！"
"1006006-50-メグ" = "そういうの見てると、嬉しくなってくるんだ～。#n温泉にゆったり浸かってると、身体がほぐれてくのと一緒でしょ？"
"1006006-51-メグ" = "温泉に浸かってる時って、一番幸せな時間だと思うんだよね！"
"1006006-52-メグ" = "……うん？"
"1006006-53-メグ" = "それじゃあラーメン以外の汁物はどうなのって？"
"1006006-54-メグ" = "もちろん好きだよ！#nでも、自分で作れるのはラーメンだけだから！"
"1006006-55-メグ" = "あとは、ラーメンだとその光景を見たいな～って思ったらすぐ作れちゃうし！"
"1006006-56-メグ" = "……だからラーメンが好きなのかな。#nううん、だからラーメンが好きなんだ！"
"1006006-57" = "[s7] \"面白い考え方だね。\"\n[s8] \"食べるのも楽しくなるよね。\""
"1006006-60-メグ" = "あはは。先生なら分かってくれると思った～！"
"1006006-61-メグ" = "そんな先生のためにも、早くラーメン作らないとね。"
"1006006-62-メグ" = "ね、先生！#n一緒にラーメン茹でてるとこ見よ！！"
"1006006-67-メグ" = "こっち座って！私が作ってあげる！"
"1006006-73" = "（その後、メグが作ってくれたラーメンを2人で食べた）"
"1006006-78" = "（よくある市販の袋麺だったけど、空の下で一緒に食べるラーメンは特別おいしかった）"
"1006006-81-メグ" = "ぷは～！ごちそうさま！！"
"1006006-82-メグ" = "先生は？まだ食べられそうなら、もう一つ茹でよっか？"
"1006006-83-メグ" = "あ、もう大丈夫？"
"1006006-84-メグ" = "あははっ。"
"1006006-85-メグ" = "私もお腹いっぱいだよ！"
"1006006-89-メグ" = "ふあぁ……風が気持ちいいね……。"
"1006006-93-メグ" = "……あ。"
"1006006-96-メグ" = "ハムが残って浮かんでる。#nふわふわだね～ふわふわ！！"
"1006006-97" = "[ns9] \"温泉に浸かってるみたいだね。\"\n[ns10] \"のんびり浮かんでるね。\""
"1006006-101-メグ" = "あははははっ！先生まで私みたいなこと言ってる～！"
"1006006-102-メグ" = "でも、たしかに……こうやって見てると温泉に浸かりたくなってくるね。"
"1006006-103-メグ" = "もし先生が、このハムだとしたら……。"
"1006006-104-メグ" = "おいしく頂いちゃおっかな！！"
"1006006-108-メグ" = "ぱくっ、てね！あはは！！"
"1006006-109-メグ" = "ふぅ……ひひっ。"
"1006006-110-メグ" = "笑い過ぎて、またお腹が空いちゃいそうだよ。"
"1006006-111-メグ" = "それじゃあ、お腹いっぱいのうちに……。"
"1006006-116-メグ" = "よいしょ！"
"1006006-117-メグ" = "……温泉を作りに行かないとね！"
"1006006-118" = "[ns11] \"え？こんな時間に……！？\"\n[ns12] \"今から始めるの！？\""
"1006006-121-メグ" = "あははっ。もちろん！"
"1006006-122-メグ" = "夜ご飯にラーメンが食べたくなったから抜けてきたけど、実は作業の途中だったんだ。#nあともうちょっとなんだけどね。"
"1006006-123-メグ" = "ご飯を食べたら温泉を掘って！みんなにお湯に浸かってもらって！#nのんびりしてもらうんだ～！"
"1006006-124-メグ" = "それが温泉開発部だからね！！"
"1006006-125-メグ" = "じゃあ先生、今日は来てくれてありがとう～！#nまた一緒に食べようね！！"
"1006006-126-メグ" = "ばいば～い♪"
"1006006-135" = "[ns13] \"スープまでおいしかったなぁ。\"\n[ns14] \"ごちそうさまでした。\""
"1006006-141" = "（その後、後片付けをしてからシャーレに戻って横になると、お腹いっぱいですぐに気持ちよく眠りに落ちた)"
