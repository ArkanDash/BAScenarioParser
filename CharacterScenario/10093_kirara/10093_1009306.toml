[translation]
"1009306-1" = "キララ on the street"
"1009306-2" = "（キララから嬉しい報告を受け、約束の場所に向かった）"
"1009306-9-キララ" = "あっ、先生！こっちこっちー！"
"1009306-10-キララ" = "超早いね！ビックリした！"
"1009306-11" = "[s1] \"お待たせ、待った？\"\n[s2] \"キララも早いね！\""
"1009306-14-キララ" = "あはっ！楽しみすぎてちょーっと早く着いちゃった♪"
"1009306-15-キララ" = "追試も終わったし、今日はめいっぱい遊んじゃお♪"
"1009306-16-キララ" = "先生は、行きつけのお店とかってある？"
"1009306-17-キララ" = "あ、そっか。この辺りは詳しくないか。"
"1009306-18-キララ" = "んじゃ決めた♪"
"1009306-19-キララ" = "あたしがよく行くお店に連れてったげる！"
"1009306-20-キララ" = "こっちこっち！"
"1009306-23-キララ" = "特大クレープ、イチゴスペシャルとバナナスペシャル1つずつお願いしまーす！"
"1009306-24-クレープ屋さんの店員" = "はい、少々お待ち下さい！"
"1009306-29-キララ" = "ここ、めっちゃ美味しいの！オススメなんだ♪"
"1009306-30-キララ" = "ここのスペシャルさ、ブルーベリーと生クリームがたっぷり入ってんの♪#n多幸感MAXみたいな？"
"1009306-31-クレープ屋さんの店員" = "お待たせいたしました！"
"1009306-37-キララ" = "はい！こっちは先生の！"
"1009306-38" = "[ns] \"ありがとう、いただきます。\""
"1009306-41-キララ" = "どうどう？"
"1009306-42" = "[s] \"うん、すごく美味しいよ。\""
"1009306-43-キララ" = "へへ、気に入ってくれると思った♪"
"1009306-44-キララ" = "あたしのも一口どう？イチゴのヤツ！"
"1009306-45-キララ" = "両方食べたら、2倍楽しめるでしょ？"
"1009306-46-キララ" = "はい、あ～ん。"
"1009306-47-キララ" = "どしたの？イチゴ嫌いだった？"
"1009306-48" = "[ns] キララが差し出したクレープを一口味わう。"
"1009306-52-キララ" = "どうどう？美味しいよね？"
"1009306-56-キララ" = "あははっ！先生、口元に生クリームついてんじゃん！#nそんなに美味しかった？"
"1009306-57-キララ" = "ほら、こっち向いて！"
"1009306-58" = "[s] \"あ、自分で拭け――\""
"1009306-59-キララ" = "ダメダメ！自分だとうまく拭けないでしょ。"
"1009306-60-キララ" = "あっ、ハンカチがないや。"
"1009306-61-キララ" = "ま、手で良いか♪"
"1009306-65" = "（ぺろっ）"
"1009306-66" = "[ns] \"！？！？\""
"1009306-68-キララ" = "んじゃ、次いくよ♪"
"1009306-73-キララ" = "見てみて！この服、めっちゃ可愛くない？"
"1009306-74-キララ" = "Tシャツ2枚買ったら、おまけでもう1枚ついてくるんだって。"
"1009306-76-キララ" = "ねえねえ先生、2枚買ってお揃いにしない？"
"1009306-105-キララ" = "ふぅ！楽しかったー♪"
"1009306-106-キララ" = "先生、大丈夫？疲れてない？"
"1009306-107" = "[s] \"実はちょっと前から、体力の限界が……。\""
"1009306-108-キララ" = "ごめん、休憩入れればよかったね！"
"1009306-109-キララ" = "楽しくてついはしゃぎすぎちゃった……。"
"1009306-110-キララ" = "ん？でも楽しかった？"
"1009306-111-キララ" = "あはは、なら良かった！"
"1009306-112-キララ" = "どしよっかなぁ……このまま帰るのもなんだか……。"
"1009306-113-キララ" = "よし！じゃあ最後に公園に寄ってこ！"
"1009306-116-キララ" = "足がくたくたー！"
"1009306-117-キララ" = "こんなに歩き回ったの、久々かも。"
"1009306-118" = "[s] \"キララって、結構あちこち行くイメージだったけど……？\""
"1009306-119-キララ" = "うん、よく遊びに行くよ～！#n賑やかな方が好きだし。"
"1009306-120-キララ" = "でも、なんだか今日は、いつもよりめっちゃ歩いた気がする……。"
"1009306-121-キララ" = "楽しくて、はしゃいじゃったからかなぁ？"
"1009306-122" = "[s] \"追試に合格して、心が軽くなったからとか？\""
"1009306-123-キララ" = "それもあると思うけど……。"
"1009306-127-キララ" = "視界の違い、というか……初めての感覚っていうか……？"
"1009306-128-キララ" = "あ、あはは！気のせいかも！#nんじゃ、行こっか！"
"1009306-130" = "（その後キララと少し話してから、シャーレに戻った）"
