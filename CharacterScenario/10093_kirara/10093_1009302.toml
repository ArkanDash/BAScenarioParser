[translation]
"1009302-1" = "キララの部活"
"1009302-2" = "（ゲヘナでの用事を終えた後、帰路で楽しそうに話している生徒が目に入った）"
"1009302-10" = "[ns] （楽しそうだな……）"
"1009302-12-ゲヘナの生徒A" = "あ、私らはこっちだから！#nまたね、キララ！"
"1009302-13-キララ" = "まったね～！"
"1009302-19-キララ" = "あれ？"
"1009302-21-キララ" = "[USERNAME]先生じゃん、はろはろ～！"
"1009302-22-キララ" = "お仕事の帰り？あたしもちょうど帰り道！"
"1009302-23" = "[s] \"一緒にいた子はお友達？\""
"1009302-24-キララ" = "そだよ～！さっき会ったばっかだけど！"
"1009302-25" = "[s1] \"さっき会ったばっか……？\"\n[s2] \"すごく仲良さそうだったけど！？\""
"1009302-28-キララ" = "いつ出会ったかなんて、あんま重要じゃなくない？"
"1009302-29-キララ" = "楽しければそれで良いの♪"
"1009302-30-キララ" = "先生とも、もうマブダチだと思ってるんだけど？"
"1009302-31" = "[s] \"これが、陽キャ……！\""
"1009302-32-キララ" = "あははっ、何それウケる！"
"1009302-33-キララ" = "っていうかそれ……もしかして、嫉妬？"
"1009302-34-キララ" = "あはっ！ごめんごめん♪一緒に帰るから拗ねないでよ～。"
"1009302-48-キララ" = "その時にさ、コンビニで急に――"
"1009302-49-キララ" = "あっ、あたしこっちだった！んじゃね！"
"1009302-50-キララ" = "今日も楽しかったよ～！ありがとね、先生♪"
"1009302-51" = "[s] \"ふと気になったんだけど……。\""
"1009302-52-キララ" = "え？なになに～？"
"1009302-53" = "[s3] \"キララは部活とか入らないの？\"\n[s4] \"この時間に帰るってことは、どこにも入ってないのかなって。\""
"1009302-56-キララ" = "あははっ、真面目な顔するから何かと思った！"
"1009302-57-キララ" = "んー……一応あたし、部活入ってるよ？"
"1009302-58-キララ" = "まあでも、確かにふつーの「帰宅部」に見えるかもね？"
"1009302-59-キララ" = "ふふん、先生には教えてあげちゃおっかな♪"
"1009302-60-キララ" = "実はちょっと前までは、ほんとに帰宅部だったんだけど……。"
"1009302-65-キララ" = "あたしの所属してる部活、その名は――"
"1009302-66-キララ" = "「キラキラ部」！"
"1009302-67" = "[s] \"キラキラ……部？\""
"1009302-68-キララ" = "すんごいワクワクして～#nめーっちゃキラキラしてる部活！"
"1009302-69" = "[s] \"な、なるほど……？\""
"1009302-70-キララ" = "普通の部活動も良いんだけど、あたしにはちょーっと合わないかなって。"
"1009302-71-キララ" = "毎日同じ活動してると、同じ人と会うことになるでしょ？"
"1009302-72-キララ" = "それはそれで楽しそうだけどー……#nあたしは、もーっと色んな人と会いたいの！"
"1009302-73-キララ" = "だから、そういう部活作ったんだ♪"
"1009302-74-キララ" = "昨日までは知りもしなかったような、新しい人とお友達になったり……。"
"1009302-75-キララ" = "そのままフードコートに寄っておしゃべりしたり……服買いに行ったり……。"
"1009302-76-キララ" = "歌いたいな～！って思ったら、そのまますぐにカラオケに行ったり……。"
"1009302-77-キララ" = "そうやって、色んなことして遊ぶの♪"
"1009302-78-キララ" = "もちろん、絶対に初対面である必要もないし、#n買い物やカラオケじゃなくても良いんだけど～。#n「とりあえず、楽しく！」が第一かな♪"
"1009302-79-キララ" = "それがあたし達「キラキラ部」のモットー！"
"1009302-80-キララ" = "めっちゃキラキラワクワクしてない？"
"1009302-81" = "[s] \"うん、キララらしくて良いね。\""
"1009302-82-キララ" = "あははっ、そうかな？"
"1009302-83-キララ" = "ま、好き勝手やってるだけだよ。#n先生も、好き勝手にやりたいことしてみない？"
"1009302-84-キララ" = "あーでも、先生は先生だからダメか！あははっ！"
"1009302-85-キララ" = "今日も楽しかったなー♪"
"1009302-86-キララ" = "んー？何でって……。"
"1009302-93-キララ" = "だってほら、先生とおしゃべりできたじゃん♪マジラッキー！"
"1009302-94-キララ" = "先生はどーだった？"
"1009302-95" = "[s] \"私もキララのことをもっと知れて、楽しかったよ。\""
"1009302-96-キララ" = "あははっ、良いね良いね！"
