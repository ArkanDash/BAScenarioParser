[translation]
"1013303-1" = "独り言"
"1013303-2" = "（部屋での作業に区切りがついたので、気分転換に外に出てみた）"
"1013303-7" = "[ns1] \"静かだ……。\"\n[ns2] \"リオは何をしてるんだろう？\""
"1013303-10-リオ" = "あ……そこはダメ。"
"1013303-11" = "[ns] \"……？\""
"1013303-12-リオ" = "先生に聞こえたら、作業の邪魔をしてしまうわ。"
"1013303-13-リオ" = "できるだけ静かに……。"
"1013303-14" = "[ns] \"……？？\""
"1013303-15" = "（気になったので、声がする方へ行ってみる）"
"1013303-22" = "[ns] \"リオ？\""
"1013303-23-リオ" = "ん……。"
"1013303-24" = "[s] \"リオ……？\""
"1013303-25-リオ" = "……。"
"1013303-26" = "（集中しているようで、こちらには気づいていない様子だ）"
"1013303-27" = "（しばらく様子を見ることにした）"
"1013303-28-リオ" = "ええ、そこよ。"
"1013303-29-リオ" = "いえ……強すぎるわ、もっと慎重に……。"
"1013303-30-リオ" = "……良い具合よ。そのまま続けて。"
"1013303-31-リオ" = "あ、待ってちょうだい。そこは繊細なところだから、優しく……。"
"1013303-32-リオ" = "そう……その調子よ。"
"1013303-33-リオ" = "ん……。"
"1013303-34-リオ" = "……ふう、良い感じだわ。"
"1013303-35-リオ" = "では今の感覚を思い出して、もう1回やってちょうだい。"
"1013303-36" = "[ns] \"……？\""
"1013303-37" = "（その後もリオの独り言は止まらなかった）"
"1013303-38" = "（他の誰かが帰ってくる前に声をかけておこう）"
"1013303-39" = "[ns] \"えっと……リオ？\""
"1013303-40-リオ" = "次はこちらをやってみましょうか。"
"1013303-41-リオ" = "もう慣れたはずだし、もっと上手くできるわね？"
"1013303-42" = "[s] \"リ、リオ……？\""
"1013303-43-リオ" = "……？"
"1013303-47-リオ" = "……！！"
"1013303-48-リオ" = "せ、先生！？一体、いつから……？"
"1013303-49" = "[s] \"何かを真剣に指示してたあたりから……？\""
"1013303-50-リオ" = "そんな……。"
"1013303-51-リオ" = "見られていたのね。"
"1013303-52-リオ" = "……それならそうと早く言ってちょうだい。"
"1013303-53" = "[s] \"声はかけてたんだけど……何をやってたの？\""
"1013303-54-リオ" = "それは、その……。"
"1013303-55" = "[s] \"言いにくいなら、無理には聞かないよ？\""
"1013303-56-リオ" = "……いえ、隠す理由はないわ。"
"1013303-57-リオ" = "輸送船のアップグレードをしていたの。"
"1013303-58-リオ" = "このAMASを使って。"
"1013303-63" = "[ns] \"なるほど……！\""
"1013303-64-リオ" = "最近の作戦で、かなり良いパーツが手に入ったのよ。"
"1013303-65-リオ" = "だからできるだけ人がいない時に、集中して作業をしてしまおうと思っていたの。"
"1013303-66-リオ" = "あとは、その……。"
"1013303-67-リオ" = "こっそりアップグレードしておいて、#nみんなを驚かせようと思っていたのだけれど……。"
"1013303-68" = "[s3] \"そうだったんだ！\"\n[s4] \"やっぱリオはすごいね！\""
"1013303-71-リオ" = "ありがとう……。"
"1013303-72-リオ" = "それはそうと……先生、どうしてそんなに顔が赤いのかしら？"
"1013303-73-リオ" = "……変な独り言を言っているように聞こえた？"
"1013303-74-リオ" = "そうかしら？私は命令を出していただけよ。#nたしか――"
"1013303-79-リオ" = "慎重に。"
"1013303-80-リオ" = "ゆっくり。"
"1013303-81-リオ" = "良い感じ。"
"1013303-82-リオ" = "優しく。"
"1013303-83-リオ" = "……この辺りは言った記憶があるわね。"
"1013303-87-リオ" = "……問題があるようには思えないわ。"
"1013303-92" = "[ns] \"そ、そうだよね！！\""
"1013303-93-リオ" = "まだ何か気にかかっているのね？"
"1013303-94-リオ" = "気になることがあるのなら言ってちょうだい。"
"1013303-95-リオ" = "この分野についてなら、私のほうが答えられることは多いはずだから。"
"1013303-96-リオ" = "あるいは……勝手に船のアップグレードをしたことが気にかかっているのかしら。"
"1013303-97-リオ" = "これでも最低限の分別はわきまえているつもりよ。"
"1013303-98-リオ" = "さすがの私も度を過ぎたことはしないわ。"
"1013303-99" = "[s] \"それは分かってるよ！\""
"1013303-100-リオ" = "どうやら私の見当違いだったようね。"
"1013303-101-リオ" = "ただ、その他の可能性となると……思い当たる節が無いわ。"
"1013303-102-リオ" = "先生、何か必要な要素を隠しているのではなくて？"
"1013303-103-リオ" = "要素が欠けていたら、合理的な判断ができないじゃない。"
"1013303-104" = "[s] \"あー、えっと……息抜きにコーヒーでも淹れよっか。\""
"1013303-105-リオ" = "そこまで露骨だと、私だって「誤魔化された」と気がつくわよ？"
"1013303-106-リオ" = "……まあ、先生のコーヒーで手を打たないこともないけれど。"
"1013303-107-リオ" = "でも、要求を1つ追加させてもらうわ。"
"1013303-108-リオ" = "このまま隣で、作業のサポートをしてほしいの。"
"1013303-109-リオ" = "[ruby=ヘッド・マウント・ディスプレイ]HMDを付け[/ruby]て作業をしていると、周りが見えなくて不便なのよ。"
"1013303-110-リオ" = "もちろん、他の用事があればそちらを優先してもらって構わないわ。"
"1013303-111" = "[s] \"大丈夫、手伝わせてもらうよ。\""
"1013303-112-リオ" = "では……よろしくお願いするわね。"
"1013303-113-リオ" = "先生なら安心してサポートを任せられるから。"
"1013303-115" = "（コーヒーを淹れてから、リオの隣で作業を手伝った）"
"1013303-116" = "（なんとか誤魔化されてくれてよかった……）"
