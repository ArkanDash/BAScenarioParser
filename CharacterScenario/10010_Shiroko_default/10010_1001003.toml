[translation]
"1001003-1" = "僅かな距離"
"1001003-2" = "アビドス高等学校・近郊"
"1001003-3" = "（シロコのことを待っていた先生）"
"1001003-4" = "[s] \"そろそろシロコが来るはず……。\""
"1001003-6-シロコ" = "……あれ、先生？ここで何してるの？"
"1001003-7-シロコ" = "私がここでランニングをするって聞いて、エナジードリンクを渡しに……?"
"1001003-8-シロコ" = "う、うーん……あ、ありがたいんだけど、その……。"
"1001003-9" = "[s] \"はい、どうぞ。\""
"1001003-14-シロコ" = "……。"
"1001003-15" = "[s] \"……？\""
"1001003-20" = "[s] \"……シロコ？\""
"1001003-21-シロコ" = "……うーん。"
"1001003-22-シロコ" = "……ごめん、えっと……。"
"1001003-23-シロコ" = "今、ランニングを終えた直後だから……べ、別に、そんな気にしてるわけではないけど……！"
"1001003-24-シロコ" = "ご、ごめん、先生……やっぱり、今は遠慮しておく。"
"1001003-25-シロコ" = "また、学校で。"
"1001003-28" = "対策委員会・教室"
"1001003-33" = "（シロコがさっきより気持ちよさそうな表情で現れた）"
"1001003-34-シロコ" = "やあ、先生。"
"1001003-35-シロコ" = "さっきのエナジードリンク？うん、ありがたくもらうね。"
"1001003-41-シロコ" = "……うん？"
"1001003-42-シロコ" = "さっきとは態度が違うって？えっと、それは……。"
"1001003-43-シロコ" = "う、うーーん……。"
"1001003-44-シロコ" = "それは……。"
"1001003-45-シロコ" = "な、なんでもない。"
"1001003-49" = "[s] \"……！？\""
"1001003-50" = "（そういえばシロコからふんわり石鹸の香りがしていた）"
"1001003-51" = "（ミスをしたみたいだから、今度謝ることにしよう）"
