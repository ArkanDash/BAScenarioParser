[translation]
"1008406-1" = "反響"
"1008406-7-コタマ" = "はぁ、はぁ……"
"1008406-8-コタマ" = "どうして、急に……山頂に登ろうだなんて……"
"1008406-9-コタマ" = "そこまで登らずとも、良い音は録れますし……"
"1008406-10-コタマ" = "むしろ山頂は風が強くて、雑音が入りやすいのに……"
"1008406-11" = "[s] \"でも、いつもは聴けない音にこそ価値があるんだよね？\""
"1008406-12-コタマ" = "うぅ……"
"1008406-13-コタマ" = "まさか、その言葉が自分に返ってくるとは……"
"1008406-14" = "[s1] \"もう少しだから頑張ろう。\"\n[s2] \"山頂はすぐそこだよ！\""
"1008406-17-コタマ" = "くっ……"
"1008406-18-コタマ" = "先生も毒されてしまったようですね……"
"1008406-27-コタマ" = "到着、しました……"
"1008406-28-コタマ" = "足が、震えて……これ以上は、もう……"
"1008406-32-コタマ" = "先生……？#n山の向こうに何か見えるのですか？"
"1008406-37" = "[ns] \"ヤッホー！\""
"1008406-41" = "……ヤッホォォ。"
"1008406-43" = "[ns3] \"コタマ、聴こえた？\"\n[ns4] \"声が返ってきたよ。\""
"1008406-46-コタマ" = "……なるほど、山びこですね。"
"1008406-47-コタマ" = "今の季節は草木が枯れている分、いつもより大きく跳ね返ってきているのかもしれませんね。"
"1008406-48" = "[s5] \"……なんだか元気が無いね。\"\n[s6] \"ごめん、無理させちゃったよね。\""
"1008406-51-コタマ" = "いえ、そこまで疲れているわけでは……"
"1008406-52-コタマ" = "ただ、私は反響音というものが、あまり好きではないのです。"
"1008406-53" = "[s] \"どうして？\""
"1008406-54-コタマ" = "……録音の邪魔になるからです。"
"1008406-58-コタマ" = "反響音とは、音が壁に当たって反射し発生するもの。"
"1008406-59-コタマ" = "録音するときは、いつもノイズが乗らないよう試行錯誤していますが……"
"1008406-60-コタマ" = "それでもゼロに抑えるのは難しく、本来の音を完璧に残すのは容易ではありません。"
"1008406-61-コタマ" = "先ほどもそうです。もっと正確に、先生の声を残したかったのに……"
"1008406-62" = "[s] \"それで元気が無かったんだね。\""
"1008406-64" = "[ns] \"でも、環境音も含めての記録なんじゃない？\""
"1008406-65-コタマ" = "いえ。正確な音源さえ録れていれば、後からいくらでもエコーをかけられます。"
"1008406-66-コタマ" = "結局、反響音はオリジナルの劣化にすぎませんから。"
"1008406-67-コタマ" = "それに、山びこは[ruby=こだま]木霊[/ruby]とも言うでしょう？"
"1008406-68-コタマ" = "小さい頃、それでイジられたこともあって……"
"1008406-69-コタマ" = "……あまり良い思い出がないのです。"
"1008406-70" = "[s] \"でも、単純な劣化ではないんじゃない？\""
"1008406-71-コタマ" = "どうしてですか？"
"1008406-72-コタマ" = "オリジナルの波形を真似た雑音に、一体どんな価値があるのでしょうか？"
"1008406-73" = "[s7] \"山と洞窟では別の跳ね返り方をするし……\"\n[s8] \"反響音によって、環境の違いを楽しめると思ったんだ。\""
"1008406-76" = "[ns] \"そう考えたら、オリジナルって何だろうなって。\""
"1008406-80-コタマ" = "……詭弁ですね。"
"1008406-81-コタマ" = "先生にそう言われたところで、木霊を好きにはなれません。"
"1008406-82-コタマ" = "ですが……"
"1008406-89-コタマ" = "ヤッホー！"
"1008406-93" = "ヤッホォォ……"
"1008406-97-コタマ" = "……それが先生の声なら、別かもしれませんね。"
"1008406-98-コタマ" = "多少のノイズが入ったところで、価値があるのもそうですが……"
"1008406-99-コタマ" = "先生の[ruby=・   ・   ・]コダマ[/ruby]、と考えたら――"
"1008406-105-コタマ" = "……先生、良ければ一緒に木霊を作りませんか？"
"1008406-106-コタマ" = "ここでしか聞けない……先生と私の声が混ざり合った[ruby=コダマ]和音[/ruby]を……"
"1008406-107-コタマ" = "じっくり、聴きたいです。"
"1008406-109" = "（その後、山頂でしか聞けない音をコタマと楽しんでから山を下った）"
