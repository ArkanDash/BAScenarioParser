[translation]
"1601503-1" = "シュガーラッシュ"
"1601503-2" = "（アイリのキーボード練習を手伝ったものの、問題は意外とすぐに解消された）"
"1601503-3" = "（……真の問題は、練習が終わってからの帰り道で起きた）"
"1601503-5-アイリ" = "まさか急に、雨だなんて……。"
"1601503-6-アイリ" = "どうしましょう、ここから結構遠いですし……。"
"1601503-7-アイリ" = "コンビニも近くには……。"
"1601503-8-アイリ" = "すみません、私がお呼びしたせいで……。"
"1601503-9" = "[s1] \"気にしないで、アイリのせいじゃないし。\"\n[s2] \"こういうのも良いよね。\""
"1601503-12-アイリ" = "あ、ありがとうございます……。"
"1601503-13-アイリ" = "でも、本当にタイミングが悪いですね……部室まではすぐなのに……。"
"1601503-17-アイリ" = "……。"
"1601503-18-アイリ" = "もしかしたら……。"
"1601503-19" = "[s3] \"……も、もしかして。\"\n[s4] \"この土砂降りの中、走るつもり！？\""
"1601503-22-アイリ" = "もちろん、最低限カバーはします！"
"1601503-23-アイリ" = "ほら、これとか……。"
"1601503-27-アイリ" = "……雨除けにちょうど良いんじゃないでしょうか！"
"1601503-28" = "[s5] \"これって……。\"\n[s6] \"アイリが着ていたジャケットだよね！？\""
"1601503-31-アイリ" = "はい！元々オーバーサイズのものなので、結構大きいんです。"
"1601503-32-アイリ" = "私と先生くらいならすっぽり入ると思います！"
"1601503-33-アイリ" = "……？"
"1601503-34-アイリ" = "雨脚が弱まるのを待つ……？"
"1601503-35-アイリ" = "ど、どうしてですか？ジャケットが濡れても、私は構いませんが……？"
"1601503-36-アイリ" = "うーん……。"
"1601503-37-アイリ" = "……ちょっと残念です。"
"1601503-38-アイリ" = "なんというか、楽しそうだったので……。"
"1601503-42" = "[ns7] \"……やっぱり走ってみよっか！！\"\n[ns8] \"風邪ひくから、今回だけだよ？\""
"1601503-45-アイリ" = "……！！"
"1601503-49-アイリ" = "……はいっ！！"
"1601503-52" = "[wa:330]― [log=아이리 밴드]えへへ……[wa:3300]どうぞ、[wa:900]先生！[/log]"
"1601503-53" = "[wa:1500]― [log=아이리 밴드]こちらへ！[wa:1100]遠慮せず！[/log]"
"1601503-56" = "[wa:200]― [log=아이리 밴드]……？[wa:1900]先生……？[/log]"
"1601503-57" = "[wa:2100]― [log=아이리 밴드]どうかしました？[/log]"
"1601503-60" = "[wa:2050]― [log=아이리 밴드]もしかして……[/log]"
"1601503-61" = "[wa:2620]― [log=아이리 밴드]困らせて[wa:620]しまいました……？[/log]"
"1601503-64" = "[wa:1900]― [log=아이리 밴드]む～！[wa:2675]せっかく勇気を出したのに……[/log]"
"1601503-67" = "― [log=아이리 밴드]無茶を言った私も悪いですが……[/log]"
"1601503-68" = "[wa:3450]― [log=아이리 밴드]でも、[wa:1930]少しは[wa:1300]乗ってほしいです。[/log]"
"1601503-71" = "[ns9] \"……よし。\"\n[ns10] \"……覚悟はできた！\""
"1601503-72" = "[wa:1130]― [log=아이리 밴드]……ふ[wa:300]ふふ。[/log]"
"1601503-73" = "[wa:1130]― [log=아이리 밴드]……ふ[wa:300]ふふ。[/log]"
"1601503-74" = "[wa:1450]― [log=아이리 밴드]はい！[wa:660]どうぞ。[/log]"
"1601503-77" = "― [log=아이리 밴드]（……[wa:1550]この雨に[wa:1500]感謝したいくらいかも）[/log]"
"1601503-80" = "[wa:200]― [log=아이리 밴드]私が合図したら、[wa:1900]一緒に走りますよ！[/log]"
"1601503-81" = "[wa:2100]― [log=아이리 밴드]準備はいいですね？[/log]"
"1601503-84" = "― [log=아이리 밴드]それでは[wa:1800]いきますよ～！[/log]"
"1601503-87-アイリ" = "では……。"
"1601503-88-アイリ" = "よーい……！"
"1601503-89-アイリ" = "……。"
"1601503-90-アイリ" = "……ドン！！"
"1601503-97" = "（……その後、仲良く2人で転んでしまった）"
