[translation]
"1600402-1" = "任侠道の生徒"
"1600402-2-フィーナ" = "……！！センセ……いえ、お頭！！"
"1600402-3-フィーナ" = "エット、どんな姿勢でしたっけ……少々お待ちクダサイ！"
"1600402-4-フィーナ" = "こうして……よっ。"
"1600402-6-フィーナ" = "手は膝の上、腰を曲げて……OK！この姿勢デス！"
"1600402-7-フィーナ" = "ふぅ……。"
"1600402-9-フィーナ" = "お待ちしておりマシタ、お頭ァ！フィーナ、ここにあらためてご挨拶申し上げマス！！"
"1600402-10" = "[s1] \"何か色々間違ってる気がする……。\"\n[s2] \"そういうのどこで覚えたの……？\""
"1600402-11-フィーナ" = "……？え、へ、変デスか？"
"1600402-12-フィーナ" = "……？え、へ、変デスか？"
"1600402-13-フィーナ" = "そんなはずは……「任侠ニャンニャン伝」で見た通りのはず……。"
"1600402-14-フィーナ" = "ハイ？これデスか？ふふ～ん、よくぞ聞いてくれマシた！"
"1600402-15-フィーナ" = "ジャーン！！"
"1600402-16" = "[s] \"……任侠映画？\""
"1600402-17-フィーナ" = "ワオ、もしかして見たことありマスか！？これ本当にすごいデス！"
"1600402-18-フィーナ" = "この主人公の台詞をワタシ、色々と……！"
"1600402-19-フィーナ" = "……ハイ？見たことないデスか？でも色々と違う気がする……？"
"1600402-20-フィーナ" = "そうデスか……。"
"1600402-21-フィーナ" = "エエィッ！細かいことは気にしない！どうせ他にもいっぱいありマスから！"
"1600402-22-フィーナ" = "とにかく、そういうことデス！「お祭り運営委員会」組へ、よくお戻りになりマシタ、お頭！"
"1600402-23-フィーナ" = "……？「お頭」、駄目デスか？「センセイ」の方が？"
"1600402-24-フィーナ" = "名前も普通に「お祭り運営委員会」が良いと思う……？"
"1600402-25-フィーナ" = "デスが、お頭……。"
"1600402-26-フィーナ" = "いえ、私がお頭の言葉に口答えするわけにはいきマセン。"
"1600402-27-フィーナ" = "仰せの通りに！この世界では、センセイが白と言えば黒も白デス！"
"1600402-28-フィーナ" = "……おお……今のは中々だったかもデス、良い感じデシタ、フフッ。"
"1600402-29-フィーナ" = "……？"
"1600402-30-フィーナ" = "芝居がかってる……？"
"1600402-31-フィーナ" = "……。"
"1600402-32-フィーナ" = "イエ、そ、そんなことはアリマセン！本当デス！！わ、ワタシは本当の任侠に……！"
"1600402-33-フィーナ" = "エット、そのために……うーん……。"
"1600402-34-フィーナ" = "その……。"
"1600402-35-フィーナ" = "……エヘ。すみません、図星、デス。"
"1600402-36-フィーナ" = "そうデス。映画の真似デス……まだ見様見真似でいっぱいいっぱいで、中途半端デス。"
"1600402-37-フィーナ" = "どうして……？フフッ、そんなの決まっていマス！"
"1600402-38-フィーナ" = "かっこいい任侠になるためデス！なぜなら任侠は最高にかっこいいので！！"
"1600402-39" = "[s] \"任侠に「なる」……？\""
"1600402-40-フィーナ" = "毎日毎日！朝も夜も！ずっと映画を見ながら眠れない夜を過ごしてきマシタ！"
"1600402-41-フィーナ" = "百鬼夜行に来れば、こんな世界で暮らせる！ソウ信じて！！"
"1600402-42-フィーナ" = "義理人情、切っても切れない絆……！悲劇的な結末と、大切な人たちのためのやむを得ない犠牲……！！"
"1600402-43-フィーナ" = "最高デス！これこそ「浪漫」デス！！そのためにここに来たんデス、ワタシ！！"
"1600402-44-フィーナ" = "分かりマスよね！？センセイなら、分かってくれるはずデス！"
"1600402-45-フィーナ" = "……？"
"1600402-46-フィーナ" = "任侠について、多分何か勘違いしてる……？"
"1600402-47-フィーナ" = "そ、そうデスか？えっと、まだ見てない映画があるのデショウか？勧めてもらったのは、多分全部……。"
"1600402-48-フィーナ" = "エッ……任侠とはどんな意味なのか？ンーーーー難しい質問デス……！"
"1600402-49-フィーナ" = "みんなには避けられてしまうけれど、やらなきゃいけないことをやる人たち、デス……？"
"1600402-50-フィーナ" = "「仁義」を重んじて行動スル……えっと、違いマスか……?"
"1600402-51" = "[s3] \"意味はだいたい合ってると思うけど……\"\n[s4] \"何か全体的に勘違いしてるというか……\""
"1600402-52-フィーナ" = "おかしいデスね……たしか映画はそう言われていたのデスが……。"
"1600402-53-フィーナ" = "おかしいデスね……たしか映画はそう言われていたのデスが……。"
"1600402-54-フィーナ" = "仁義に基づいて、人を見守り、助ける……ああっ！？"
"1600402-55-フィーナ" = "あそこ、一人で重い荷物を持ったおばあちゃんが！"
"1600402-56-フィーナ" = "ヘイおばあちゃん！フィーナが手伝いマス！イエ、気にしないでクダサイ！よっ……！"
"1600402-57-フィーナ" = "……。"
"1600402-59-フィーナ" = "あはは、只今デス。急デシタが、手伝えてよかっ……"
"1600402-60-フィーナ" = "ああっ！今度はあそこで泣いてる子供が！！慰めてきマス！"
"1600402-61-フィーナ" = "ふう～……今度こそ只今デ……"
"1600402-63-フィーナ" = "ああっ！あそこに道に迷ったみたいな学生が……！"
"1600402-65-フィーナ" = "あっちにはお腹を空かせてそうなワンちゃんが……！！"
"1600402-66" = "[s] \"……。\""
"1600402-69-フィーナ" = "……"
"1600402-70-フィーナ" = "……ふう～！OKデス！"
"1600402-71-フィーナ" = "す、スミマセン、センセイ。ああいうのを見ると、放っておけないと言いマスか……。"
"1600402-72-フィーナ" = "えっと、何の話デシタっけ？"
"1600402-73-フィーナ" = "あ、任侠デス！任侠とはどんな意味かという……"
"1600402-74-フィーナ" = "……もう大丈夫、デスか？どういうことデス？"
"1600402-75-フィーナ" = "フィーナの任侠はもう見ることができた……デスか？"
"1600402-76-フィーナ" = "それはどういう意味なのか……ンーーー……フィーナのことなのに、フィーナが分かりマセン……。"
"1600402-77-フィーナ" = "……デスが、センセイがそう言うならそうデスね！！エヘへッ！"
"1600402-78-フィーナ" = "何だか認めてもらったようで、良い気分デス！"
"1600402-79-フィーナ" = "センセイ！これからもフィーナの任侠、見守っていてクダサイ！"
"1600402-81" = "（フィーナはそのまま、楽しそうにまた話し始めた）"
"1600402-82" = "（その途中でもまた、困った人を見かけるたびに、彼女なりの「仁義」に基づいて色んな人を助けていた）"
