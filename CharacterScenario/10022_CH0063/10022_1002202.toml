[translation]
"1002202-1" = "委員長と海のお散歩"
"1002202-5-ヒナ" = "……先生。"
"1002202-6" = "[s1] \"ヒナちゃん可愛い！！！！\"\n[s2] \"水着のヒナちゃんだ！\""
"1002202-7-ヒナ" = "こ、声が大きい……！分かったから、もう少し静かにして……。"
"1002202-8-ヒナ" = "こ、声が大きい……！分かったから、もう少し静かにして……。"
"1002202-9-ヒナ" = "そうやって騒いで、誰かに気が付かれたら……わざわざこうやって密かに会ってる意味が無い。"
"1002202-10" = "[s] \"たしかに、ごめんね。\""
"1002202-11-ヒナ" = "ううん。そうは言っても、この辺りだとそれほど私の顔は知られてないだろうし……だからこそ、先生をここに呼んだのだけど。"
"1002202-12-ヒナ" = "この辺りは閑静でゲヘナの生徒たちもほとんどいないし、トリニティの生徒たちも来ないはず。"
"1002202-13" = "[s] \"とすると、この風紀が乱れてない場所で、何をすれば……？\""
"1002202-14-ヒナ" = "……。"
"1002202-15-ヒナ" = "それは……。"
"1002202-16-ヒナ" = "……えっと。"
"1002202-17" = "[s] \"……なるほど、合宿の予行演習ってことだね！付き合うよ！\""
"1002202-18-ヒナ" = "……。"
"1002202-19-ヒナ" = "まったく、先生は……。"
"1002202-20-ヒナ" = "私で遊ぶのは、ほどほどにしてほしい……。"
"1002202-21" = "[s] \"ヒナ「で」遊んだわけじゃないよ、ヒナ「と」遊びたいから！\""
"1002202-22-ヒナ" = "ど、どっちにしろ違う！まずそもそも遊びに来たわけじゃ……！"
"1002202-23-ヒナ" = "夏の海がどういうものなのか、あらためてきちんと理解しておかないと、夏の合宿トレーニングで何か起きた時に上手く対応できないし……。"
"1002202-25-ヒナ" = "知らないことは、まず知ろうとすることから始めないと。そういう意味では確かに、先生の言う通り「予行演習」みたいなものかもしれない。"
"1002202-26" = "[s] \"うん、了解。\""
"1002202-27-ヒナ" = "ふぅ……。"
"1002202-28-ヒナ" = "何にせよ、ここに私たちがいることはバレないようにしないと……。"
"1002202-29-ヒナ" = "あと数時間くらいで帰らないといけないけれど、まあこの辺りの海を試しにざっと把握するには十分なはず。"
"1002202-30-ヒナ" = "じゃあえっと、何から――"
"1002202-37-ヒナ" = "……？"
"1002202-38-ヒナ" = "あっ、学園から連絡……。"
"1002202-39-ヒナ" = "ごめん、先生。ちょっと待ってて。"
"1002202-40" = "[s] \"うん、いってらっしゃい。\""
"1002202-41-ヒナ" = "すぐ戻るから……。"
"1002202-44" = "（ヒナが通話を始めたので、少し離れた）"
"1002202-46" = "（それなりに時間が経ったものの、ヒナが帰ってこない）"
"1002202-47" = "（何か問題でも起きたのかと心配になり、連絡をしようとしたその時――）"
"1002202-49" = "（ヒナからのモモトークが届いた）"
"1002202-50-ヒナ" = "先生、助けて"
"1002202-51" = "[s] \"……っ！？\""
"1002202-55-ヒナ" = "はあ……ごめん、先生。来てくれてありがとう。"
"1002202-56-ヒナ" = "何と言うか、変に親切な人たちに捕まっちゃって……。"
"1002202-57" = "[s] \"迷子センターに連れてこられちゃったんだね……。\""
"1002202-58-ヒナ" = "……。"
"1002202-59-ヒナ" = "はぁ……小学生じゃないって何度も言ったのに……。"
"1002202-60-ヒナ" = "善意で動いてくれてたのは分かるけど……。"
"1002202-61-ヒナ" = "迷子じゃないって何度言っても、優しいまなざしで「大丈夫、お姉さんたちに任せて」ってそればっかりで……。"
"1002202-62-ヒナ" = "全然話を聞いてくれないし、一体どうして……。"
"1002202-63" = "[s] \"どうしてって、それは……。\""
"1002202-64-ヒナ" = "……それは？"
"1002202-65" = "[s] \"……何でもありません。\""
"1002202-66-ヒナ" = "はぁ、もう……めんどくさかった……。"
"1002202-67" = "[s] \"でも意外だね、素直に連れてこられるなんて。\""
"1002202-68-ヒナ" = "……下手に身分を明かすと、その方がめんどくさくなるかなって。いざとなれば無理やりどうにかできたけど、別に悪い人ではなかったから。"
"1002202-69-ヒナ" = "もし近くに私を狙ってる誰かがいて、急に押し寄せて来たりしたら、その方が困る。"
"1002202-70-ヒナ" = "それに、シャーレの先生とゲヘナの風紀委員長がふたりっきりで海岸にいた、なんて知れ渡ったら……。"
"1002202-71-ヒナ" = "どこかの報道機関とかに大々的に取り上げられて、報道用の飛行船で24時間流されかねない……。"
"1002202-72" = "[s] \"流石にそんなことないと思いたいけど……。\""
"1002202-73-ヒナ" = "……ふぅ。"
"1002202-74-ヒナ" = "まあとにかく、これからどうすれば良いのかは分かった。"
"1002202-75-ヒナ" = "私がひとりだったからこんなことになる。だから、私のそばから離れないで。いい、先生？"
"1002202-76" = "[s] \"分かった、ずっとそばにいるよ。\""
"1002202-77-ヒナ" = "……うん。先生のことは私が守るから。"
"1002202-78-ヒナ" = "じゃあ、まだ30分くらいは時間があるし、あらためて付き合ってくれる？"
"1002202-80" = "（残った時間を、ヒナと一緒に海岸を散歩しながら楽しく過ごした）"
