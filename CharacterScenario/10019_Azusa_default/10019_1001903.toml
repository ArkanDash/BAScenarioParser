[translation]
"1001903-1" = "防護"
"1001903-3" = "（アズサのモモトークが届いてから、ぴったり15分後にチャイムが鳴った）"
"1001903-4" = "（到着したアズサの表情は、何だか曇っていた）"
"1001903-5-アズサ" = "……はぁ。"
"1001903-6-アズサ" = "寸分違わず予想通り……。"
"1001903-7" = "[s] \"アズサ？どうしたの？\""
"1001903-8-アズサ" = "この建物の前に到着してから、私がこうして先生の前に現れるまで6分19秒。"
"1001903-9-アズサ" = "途中で私を遮ったのはシャーレの正面玄関だけ。それも、先生がすぐに開けてくれた。"
"1001903-10-アズサ" = "エレベーターのセキュリティも作動させず、執務室のドアも普通に開けてくれた。"
"1001903-11-アズサ" = "もし今ここに来たのが私じゃなくて、私を装った誰かだったら……一体どうなってたと思う？"
"1001903-12-アズサ" = "不用心すぎるよ、先生。緊急時に対する意識も、そのシステム構築もなってない。"
"1001903-13-アズサ" = "……でも心配しないで。"
"1001903-14-アズサ" = "私は、そのために来たんだから。"
"1001903-15" = "[s1] \"防犯システムを強化してくれるってこと……？\"\n[s2] \"よく分からないけど、お願いしようかな。\""
"1001903-16-アズサ" = "これでも私は専門家、先生の安全のために全力を尽くすよ。"
"1001903-17-アズサ" = "これでも私は専門家、先生の安全のために全力を尽くすよ。"
"1001903-18-アズサ" = "アリ一匹通れないようにしてあげる、罠と地雷も十分な数用意してきた。"
"1001903-19-アズサ" = "……？"
"1001903-20-アズサ" = "シャーレに来る生徒たちを遮るわけにはいかない？シャーレの執務室はオープンな空間にしてある……？"
"1001903-21-アズサ" = "先生、私の話聞いてた？それだと先生の安全を保証できな――"
"1001903-22-アズサ" = "……逆に、緊急時に避難できる空間をどこかに作っておいた方が嬉しい？"
"1001903-23-アズサ" = "うーん……。"
"1001903-24-アズサ" = "……分かった。あまり気は乗らないけど、郷に入っては郷に従え。ここに来たからには、ここのルールに従う。"
"1001903-25-アズサ" = "じゃあ、どこにする？"
"1001903-27-アズサ" = "ここは……？"
"1001903-28-アズサ" = "なるほど、休憩室？"
"1001903-29-アズサ" = "うん、生活必需品も十分だし、温度・湿度もちゃんと保たれてる。"
"1001903-30-アズサ" = "ここを緊急時の施設として強化するのは良さそう。"
"1001903-31-アズサ" = "……うん、まだ待っててほしい？"
"1001903-32-アズサ" = "仕事が終わったら一緒に？いや、一人で充分。それとも、私の技術を疑ってる？"
"1001903-33-アズサ" = "一人でやらせるのは申し訳ないし、単に一緒にやりたい……？"
"1001903-34-アズサ" = "……はぁ。全く、先生は……。"
"1001903-35-アズサ" = "分かった。そこまで言うなら従う。"
"1001903-36-アズサ" = "なら私はここで待機してるから、先生が帰ってきたらすぐに着手しよう。"
"1001903-41" = "（ソファに座ったアズサを置いて、執務室に戻った）"
"1001903-43" = "（そうして書類作業を全て終えた頃には、すでに日が暮れていた）"
"1001903-44" = "（休憩室に戻ろう）"
"1001903-46" = "（アズサがマッサージチェアですやすやと眠っていた）"
"1001903-50-アズサ" = "ん……ふにゃ……。"
"1001903-51" = "（……？）"
"1001903-52-アズサ" = "んぅ……ふふっ……。"
"1001903-53-アズサ" = "（……？）"
"1001903-54-アズサ" = "……はっ！？"
"1001903-56-アズサ" = "せ、先生……？"
"1001903-57" = "[s3] \"アズサ、よく眠れた？\"\n[s4] \"マッサージチェアって良いよね。\""
"1001903-58-アズサ" = "……。"
"1001903-59-アズサ" = "……。"
"1001903-60-アズサ" = "……その、これは……。"
"1001903-61-アズサ" = "……ん、どうだったって？"
"1001903-62-アズサ" = "どうって、特に何も起きなかったし、良い空間だと思うけど……。"
"1001903-63-アズサ" = "……っ！"
"1001903-64-アズサ" = "……先生。"
"1001903-65-アズサ" = "もしかして最初からこのつもりで、私をここに？"
"1001903-66-アズサ" = "こういう場所なんだって、伝えるために……？"
"1001903-67" = "[s5] \"こういう雰囲気の場所にしておきたくって。\"\n[s6] \"アズサも、もう少しリラックスしてみても良いと思うよ？\""
"1001903-68-アズサ" = "……先生は、甘すぎる。"
"1001903-69-アズサ" = "……先生は、甘すぎる。"
"1001903-70-アズサ" = "……はぁ。"
"1001903-71-アズサ" = "でも、分かった。私も、ここにいる時はここのルールに従う。"
"1001903-72-アズサ" = "全く気にならないわけじゃないけど、ここではきっと、先生の言葉の方が正しいから。少しずつ慣れていこうと思う。"
"1001903-73-アズサ" = "……いつでも来て良い？"
"1001903-74-アズサ" = "好きな時に来て、ゆっくりしてほしい？"
"1001903-76-アズサ" = "……ふふっ。"
"1001903-77-アズサ" = "まあでも、確かに今の私には、そういう時間が必要なのかもしれない。"
"1001903-78-アズサ" = "それじゃ、お言葉に甘えて。"
"1001903-80" = "（その後遅い時間まで、アズサと順番こにマッサージチェアでくつろいだ）"
