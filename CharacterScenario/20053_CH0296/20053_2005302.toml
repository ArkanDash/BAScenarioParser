[translation]
"2005302-1" = "忍者少女は治療を求む！"
"2005302-2" = "百鬼夜行・第38旧校舎のとある教室"
"2005302-3" = "（心配になって、ミチルの元へ向かった）"
"2005302-6-ミチル" = "せ、先生殿……！？"
"2005302-7-ミチル" = "本当に来たの！？"
"2005302-8" = "[s] \"ミチル、大丈夫！？\""
"2005302-9-ミチル" = "あっ、い、いや～……。"
"2005302-10-ミチル" = "怪我って言っちゃったんだけどー……。"
"2005302-11-ミチル" = "……その、私じゃなくってぇ。"
"2005302-12" = "[s] \"……？\""
"2005302-13-ミチル" = "えっと……私の服が、「怪我」しちゃったっていうか。"
"2005302-14-ミチル" = "……正確には、私のドレスが。"
"2005302-15-ミチル" = "こんな感じで、結構派手に……。"
"2005302-16" = "[s] \"うわぁ……何があったの？\""
"2005302-17-ミチル" = "えっとぉ……。"
"2005302-18-ミチル" = "忍法「クヌギよじよじの術」を練習してたら、木から落っこちて……。"
"2005302-19" = "[s1] \"つまり……。\"\n[s2] \"木登りしてたら、服をダメにしちゃったと。\""
"2005302-22-ミチル" = "まとめ方ぁ！？"
"2005302-23-ミチル" = "それじゃ私がはしゃぎすぎて、服を破っちゃったみたいじゃん！？"
"2005302-24-ミチル" = "……ま、間違ってはいないけどさぁ。"
"2005302-25-ミチル" = "……あ、遊んでたわけじゃないからね！？#nあくまで訓練！"
"2005302-26-ミチル" = "むぅぅ……。"
"2005302-27-ミチル" = "……先生殿はやっぱり、まだちょーっと忍者への理解が浅いかも！"
"2005302-28-ミチル" = "というわけで！"
"2005302-29-ミチル" = "お直し屋さんに向かいながら、忍者講義をして進ぜよう！"
"2005302-31" = "（こうしてミチルと、お直し屋さんへ向かうことになった）"
"2005302-33" = "百鬼夜行商店街"
"2005302-35-ミチル" = "……つまり忍者は、黒以外の服も着るってこと！"
"2005302-36-ミチル" = "顔まで覆う黒い装束は、あくまで夜に使うやつでー。"
"2005302-37-ミチル" = "昼は逆に目立つから、普通の服を着ることが多いってわけ。"
"2005302-38-ミチル" = "忍者の基本は、「目立たないこと」……。"
"2005302-39-ミチル" = "その場その場に、ふさわしい格好をすべし！"
"2005302-40-ミチル" = "例えばー、パーティ会場での任務だったら、こんな風にドレスを着たり……。"
"2005302-41-ミチル" = "もちろん、それが夜だったら黒でも良いんだけどねー。"
"2005302-42-ミチル" = "ある忍者はカモフラージュのために、服を着ず、墨を身体に塗ったこともあったとか……。"
"2005302-43-ミチル" = "あと最近は、光学迷彩忍者服なーんてものまで――"
"2005302-53" = "[ns] \"あれ、ここじゃない？\""
"2005302-54-ミチル" = "……おっと！"
"2005302-55-お直し屋" = "いらっしゃいませ～"
"2005302-56-ミチル" = "えぇっと、破れたドレスのお直しをお願いしたくってぇ……。"
"2005302-57-お直し屋" = "はい、分かりました。#nお預かりしてもよろしいですか？"
"2005302-58-ミチル" = "はーい……。"
"2005302-62-ミチル" = "……あっ。"
"2005302-64-ミチル" = "今、まさに着ちゃってるじゃん！？"
"2005302-66-お直し屋" = "えっと、お着替えはお持ちですか？"
"2005302-67-ミチル" = "……持ってない、です。"
"2005302-68-ミチル" = "あの、服を着たまま直す方法とかはー……。"
"2005302-69-お直し屋" = "ミシンなので、シンプルに危ないですね……。"
"2005302-70-ミチル" = "ですよねぇ……。"
"2005302-71-ミチル" = "もうっ、せっかくここまで来たのにぃ……！"
"2005302-72-ミチル" = "うう、一応、方法がないわけでは……。"
"2005302-73-ミチル" = "忍者服に着替えれば……！"
"2005302-74" = "[s] \"着替えはないって言ってなかった？\" "
"2005302-75-ミチル" = "大丈夫大丈夫！"
"2005302-76-ミチル" = "伝承の中のある忍者みたいに、墨を塗ればいいんだよ！"
"2005302-77" = "[s] \"……それ、大丈夫なの？\" "
"2005302-78-ミチル" = "ふふ、忍者だからその程度……。"
"2005302-79-ミチル" = "……。"
"2005302-83-ミチル" = "だ、ダメだよそんなの！ "
"2005302-84-ミチル" = "絶対にダメ！ "
"2005302-85-ミチル" = "せ……。"
"2005302-86-ミチル" = "先生殿の変態！！"
"2005302-87" = "[s3] \"えっ私！？\" \n[s4] \"濡れ衣だ……！\""
"2005302-91" = "（その後ミチルは近くで買った運動着に着替え、ドレスを預けたのだった）"
"2005302-92" = "（……代金は私が支払った）"
