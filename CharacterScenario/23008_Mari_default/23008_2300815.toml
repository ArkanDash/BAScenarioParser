[translation]
"2300815-1" = "本当の気持ち"
"2300815-2" = "（約束の時間にショッピングモールへと足を運んだ）"
"2300815-4-マリー" = "ふぅ……やっぱり結構量がありますね。"
"2300815-5-マリー" = "礼拝の時に使うもの、チャリティーに出すもの、ボランティアで配るお菓子……。"
"2300815-6" = "[s] \"すごい量だね。\""
"2300815-7-マリー" = "はい。先生に来ていただけて、本当に助かりました。"
"2300815-8-マリー" = "いつもありがとうございます。"
"2300815-9" = "[s] \"いつもこの量をマリーひとりで準備してるの？\""
"2300815-10-マリー" = "あっ、いえ！#n普段は当番制で持ち回りなんですけど……"
"2300815-11-マリー" = "皆さんお忙しいので、私が引き受けることが多いんです。"
"2300815-12-マリー" = "今日は、他にどなたも行けなかったので私一人ですが……。"
"2300815-13" = "[s] \"大変だね……。\""
"2300815-14-マリー" = "いえ。微力ながら、皆さんにお力添えできるのなら、なによりです。"
"2300815-15-マリー" = "それに、ショッピングモールは見ているだけで楽しいですし。"
"2300815-16-マリー" = "あっ、先生、見てください。#n可愛いぬいぐるみ……"
"2300815-17-マリー" = "あっちには素敵なお洋服が……"
"2300815-18-マリー" = "このアクセサリーも可愛いですね……。"
"2300815-19" = "[ns] （こんなに浮かれてるマリー、初めて見るかも……）"
"2300815-20-店主" = "そこのお二人さん！よかったら見ていきな！"
"2300815-21-マリー" = "えっ、私たちのこと……でしょうか？"
"2300815-22-店主" = "お嬢ちゃんのことだよ！さっきからキラキラした目で見てたじゃないか。"
"2300815-23-店主" = "そんな遠くからじゃなくて、もっと近くで見ていきな！"
"2300815-24-マリー" = "お、お言葉に甘えて……"
"2300815-25-店主" = "これは最近流行りのアクセサリーでね！お値打ち品だ！"
"2300815-26" = "[ns] \"良かったら、これプレゼントさせてくれないかな？\""
"2300815-28-マリー" = "えっ！？わ、私にですか？"
"2300815-29" = "[s1] \"いつも頑張っているマリーに、ね。\"\n[s2] \"他にも気に入ったものがあったら教えて。\""
"2300815-32-マリー" = "あっ、えっと……。"
"2300815-38-マリー" = "い、いえ……大丈夫、です……。"
"2300815-42-マリー" = "せ、先生のお気持ちは、とても嬉しいのですが……。"
"2300815-43-マリー" = "シスターとして、不必要な贅沢は……避けなければならないので……。"
"2300815-44-マリー" = "も、もちろん……このアクセサリーは……とても可愛いのですが……うぅぅ……。"
"2300815-45" = "[s] \"これくらい、いいんじゃないかな。いつもコサージュつけてるでしょ？\""
"2300815-46-マリー" = "あ……これ、ですか……。"
"2300815-50-マリー" = "このコサージュは……。"
"2300815-51-マリー" = "シスターフッドの誓約を忘れないようにと買ったものなんです。"
"2300815-52-マリー" = "この枯れない白い花のように、私も初心を忘れぬよう……。"
"2300815-53" = "[s] \"そうだったんだね。\""
"2300815-58-マリー" = "先生……その、本当のことを、お話しても、よろしいでしょうか。"
"2300815-59" = "[s] \"本当のこと？\""
"2300815-63-マリー" = "ここは懺悔室ではありませんが……#n実は私……ウソをつきました……。"
"2300815-64-マリー" = "このコサージュは……"
"2300815-65-マリー" = "か、可愛いから……買ったんです……。"
"2300815-66" = "[s] \"うん？\""
"2300815-67-マリー" = "も、もちろん……初心を忘れないように、という意味もあるのですが……！！"
"2300815-68-マリー" = "でも……可愛かったから……買っただけなんです……。"
"2300815-72-マリー" = "シスターは、質素倹約を心がけなければならないのに……。"
"2300815-73-マリー" = "でも、アクセサリーを見ていると、私もオシャレをしてみたいと思ってしまって……。"
"2300815-74-マリー" = "な、なので……コサージュをつけてみたんです……。"
"2300815-75-マリー" = "うぅ……見栄を張って先生にウソまでついて……。"
"2300815-76-マリー" = "シスター失格です……。"
"2300815-77-マリー" = "……。"
"2300815-78-マリー" = "でも、少しだけスッキリしました。"
"2300815-79" = "[s] \"マリーなりのオシャレなんだね。\""
"2300815-80-マリー" = "はい……この程度なら大丈夫かな、と……。"
"2300815-81-マリー" = "でも、シスター失格です……よね？"
"2300815-82" = "[s] \"ううん、そんなことないよ。\""
"2300815-83-マリー" = "え、えぇ！？"
"2300815-84" = "[s3] \"その程度なら大丈夫だと思う。\"\n[s4] \"シスターである前に、一人の生徒だからね。\""
"2300815-87-マリー" = "そ、そう、ですかね……。"
"2300815-88" = "[s5] \"生徒だもの。可愛いものが好きだったり、\"\n[s6] \"オシャレをしたくなるのは、普通の気持ちだと思うよ。\""
"2300815-91-マリー" = "先生……。"
"2300815-92-マリー" = "……そう仰っていただいて、少しだけ心が落ち着きました。"
"2300815-93-マリー" = "どこまでが普通で、どこまでが普通ではないのか……"
"2300815-94-マリー" = "私にはまだ、判別が難しいですが……。"
"2300815-95-マリー" = "ふふ、先生のお気持ち、ありがたくいただきますね。"
"2300815-96-マリー" = "私には、このコサージュだけで充分です。"
"2300815-97" = "[s] \"じゃあ、代わりに今から一緒に食事でもどうかな？\""
"2300815-98-マリー" = "もう……先生にはいつも世話になっているのに、これ以上していただくわけには……。"
"2300815-99-マリー" = "……"
"2300815-106-マリー" = "……でも今回は、お言葉に甘えさせていただきますね。"
"2300815-108" = "（そうやって、マリーと一緒に食事をとってシャーレに戻った）"
