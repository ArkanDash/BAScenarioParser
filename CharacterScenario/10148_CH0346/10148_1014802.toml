[translation]
"1014802-1" = "アウスフルークレリンと優雅な夏休み"
"1014802-5-イロハ" = "失礼します。"
"1014802-6-イロハ" = "……コーヒー、空じゃないですか。#n仕方ないですね。ポット、借りますよ。"
"1014802-12-イロハ" = "湯を沸かしてる間に、お菓子の準備を……あれ？ない。"
"1014802-13-イロハ" = "ああ、棚に入れたんでしたっけ。"
"1014802-18-イロハ" = "あとはソファを整えたら……。"
"1014802-22-イロハ" = "ふぅ……これで完璧です。"
"1014802-23-イロハ" = "……なんです？"
"1014802-24" = "[s1] \"いえ、何でもありません。\"\n[s2] \"言ったら負けかな……。\""
"1014802-27-イロハ" = "こちらのことはお構いなく。"
"1014802-28-イロハ" = "今日は邪魔するつもりはありませんから。#n[ruby=パンデモニウム・ソサエティー]万魔殿の仕事で[/ruby]来たわけでもないですし。"
"1014802-29-イロハ" = "おとなしく読書してるので、仕事に集中してもらえれば。"
"1014802-32" = "（2時間後）"
"1014802-34-イロハ" = "…………。"
"1014802-38-투명" = "（言葉通り、イロハはずっと本を読んでいた）"
"1014802-42" = "[ns3] \"えっと……。\"\n[ns4] \"私が言うのもあれだけどさ。\""
"1014802-45-イロハ" = "はい？どうかしましたか？"
"1014802-46" = "[s5] \"せっかくの夏休みなんだし。\"\n[s6] \"もう少し夏らしく過ごすとかは……。\""
"1014802-49-イロハ" = "……。"
"1014802-50-イロハ" = "…………。"
"1014802-54-イロハ" = "なるほど。"
"1014802-55-イロハ" = "では、出てってもらえますか？"
"1014802-56" = "[s] \"え？\""
"1014802-57-イロハ" = "私としてはどちらでも構いませんけど。"
"1014802-58-イロハ" = "残ると言うなら――"
"1014802-62-イロハ" = "責任、取っていただきますよ？"
"1014802-66" = "（不安になり、急いで外に出た）"
"1014802-67" = "（扉の前でしばらく待っていると……）"
"1014802-68-イロハ" = "どうぞ。もういいですよ。"
"1014802-71" = "[ns] \"聞きたいことは山ほどあるけど……。\""
"1014802-73" = "[ns] \"その格好は？\""
"1014802-74-イロハ" = "とぼけないでください。"
"1014802-75-イロハ" = "水着姿を見たいと言ったのは先生じゃないですか。"
"1014802-76" = "[s] \"言ったかなぁ！？\""
"1014802-77-イロハ" = "私はソファをお借りしている身。#n言われたら従うほかありません。"
"1014802-78-イロハ" = "ですから、渋々、この格好で過ごしてあげます。"
"1014802-79-イロハ" = "……。"
"1014802-80-イロハ" = "では、読書に戻ります。"
"1014802-84" = "[ns] \"……結局読書なんだね。\""
"1014802-85-イロハ" = "もちろんです。"
"1014802-89-イロハ" = "もしかして……この格好らしい「何か」をお望みですか？"
"1014802-90" = "[s7] \"いえ、とんでもない。\"\n[s8] \"読書っていいよね。\""
"1014802-97" = "（イロハは最後まで水着姿で……そのまま帰った）"
"1014802-98" = "（シャーレは生徒を水着姿で働かせている、という噂が広まった）"
