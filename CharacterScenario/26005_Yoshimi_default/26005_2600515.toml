[translation]
"2600515-1" = "スイーツ・ハンター"
"2600515-2" = "（ヨシミとの約束の場所へ向かった）"
"2600515-7" = "[ns1] \"……ヨシミ？\"\n[ns2] \"あれ、どうしてお店の外に。\""
"2600515-10-ヨシミ" = "……もう食べ終わったの。"
"2600515-11-ヨシミ" = "それでいつまでも居座ってたら、迷惑でしょ？"
"2600515-12-ヨシミ" = "それに、「まだ食べてたんだ」とか言われそうだし……。"
"2600515-13-ヨシミ" = "……はぁ？"
"2600515-14-ヨシミ" = "ちょっとは自分の言動を顧みなさいよ！"
"2600515-15-ヨシミ" = "……？"
"2600515-16-ヨシミ" = "……まぁ、美味しかったわよ。この辺でも有名なお店だし。"
"2600515-17-ヨシミ" = "結構並んだし……うん、大満足。"
"2600515-18-ヨシミ" = "まぁ全メニューとは行かなかったけど、ほとんどは食べられたし――"
"2600515-22-ヨシミ" = "べ、別にこの程度じゃ太らないから！！！"
"2600515-23" = "[s3] \"そ、そうだね……？\"\n[s4] \"何も言ってないけど……！？\""
"2600515-26-ヨシミ" = "とにかく、はいこれ！"
"2600515-27-ヨシミ" = "あげる。"
"2600515-28" = "[s5] \"これって……ここの新作？\"\n[s6] \"テイクアウトしてくれたの？\""
"2600515-31-ヨシミ" = "……まあ、何だかんだいつもお世話になってるし。"
"2600515-32-ヨシミ" = "だから、たまには感謝の気持ちを伝えようかな、なんて。"
"2600515-36-ヨシミ" = "……な、何よ。"
"2600515-37-ヨシミ" = "うわっ、その表情気持ち悪っ！"
"2600515-38-ヨシミ" = "ちょっ、やめてったら！"
"2600515-39-ヨシミ" = "わ、笑わないで！！余計気持ち悪いから！！"
"2600515-40" = "[s7] \"美味しそうだね、これ。\"\n[s8] ヨシミが見てる前でスイーツを開封する。"
"2600515-43-ヨシミ" = "……！？"
"2600515-44-ヨシミ" = "な、何で開けるの！？#n今ここでそのまま食べるつもり！？"
"2600515-45-ヨシミ" = "後で食べてよ！！#nここじゃダメ！"
"2600515-46-ヨシミ" = "いや、何でもなにも無いでしょ！"
"2600515-47-ヨシミ" = "こんなとこ、人に見られたら……。"
"2600515-51-ヨシミ" = "……ああ、もう！！#n何で人の話を聞かないわけ！？"
"2600515-52-ヨシミ" = "取り出したら先に私が食べるわよ！？"
"2600515-53-ヨシミ" = "……なに？"
"2600515-54-ヨシミ" = "フォークが1つだから大丈夫？"
"2600515-55-ヨシミ" = "はっ！"
"2600515-56-ヨシミ" = "油断したわね、先生！"
"2600515-57-ヨシミ" = "この私を誰だと思ってるの？"
"2600515-58-ヨシミ" = "これでも放課後スイーツ部の一員なのよ！"
"2600515-64" = "[ns9] \"なん、だと……？\"\n[ns10] \"それは……！？\""
"2600515-67-ヨシミ" = "先生が開けちゃったんだから……"
"2600515-68-ヨシミ" = "もう仕方ないわ。"
"2600515-69-ヨシミ" = "「放課後スイーツ部」の部員であり、#nトリニティスイーツチャレンジのランカーにして、限定版の女帝！！"
"2600515-70-ヨシミ" = "「[ruby=いばらぎ]伊原木[/ruby]ヨシミ」の秘技！！#n「スイーツ・ハンター」を喰らいなさい！！"
"2600515-74-ヨシミ" = "……捕らえた！"
"2600515-75-ヨシミ" = "駆け抜けろ！「スイーツ・ハンター」！！！"
"2600515-76" = "[s] \"なっ……！！\""
"2600515-80-ヨシミ" = "ちょっ、待ちなさいよ！！"
"2600515-81-ヨシミ" = "どこ行くの！もう待ってってば！！！"
"2600515-88" = "（追いかけてくるヨシミを避けようとしたら、そのまま一緒に転んでしまった）"
"2600515-89" = "（幸いスイーツは無事だったが、結局半分以上ヨシミに奪われてしまった……）"
