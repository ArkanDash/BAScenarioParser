"1300105-31-チセ" = "うん、でもエマージェンシー。"
"1300105-32-チセ" = "頭の中が真っ白で何も浮かばない。"
"1300105-33-チセ" = "だから。"
"1300105-34-チセ" = "良い俳句が浮かぶように、今日一日、手伝ってほしい。"
"1300105-35-チセ" = "手伝ってくれる……？"
"1300105-36" = "[s] \"もちろん、手伝うよ。\""
