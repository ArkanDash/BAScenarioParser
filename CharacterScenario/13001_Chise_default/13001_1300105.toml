"1300105-19-チセ" = "うん。こうやって色々やってみて、"
"1300105-20-チセ" = "心に届くような俳句を作りたいなって。"
"1300105-21-チセ" = "締め切りまで、あと少し。"
"1300105-23" = "（しばらくチセ語を分析しながら話を聞いてみた結果、何となく分かってきた）"
"1300105-26" = "[ns3] \"つまり今度陰陽部の広報イベントの一環で、\"\n[ns4] \"公民館に展示する用の俳句が必要、ってことでOK？\""
"1300105-27-チセ" = "（こくり）"
"1300105-28-チセ" = "（こくり）"
