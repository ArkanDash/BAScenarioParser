[translation]
"1015003-1" = "迷子のシャチ"
"1015003-2" = "（コトネから連絡を受け、彼女が待っているという書店に向かった）"
"1015003-3" = "（着いてみると、コトネは目をぎゅっと細めたまま――）"
"1015003-7" = "（――ご老人に小言を言われていた）"
"1015003-8-老人" = "最近の若者はどうなっとる！人をつつくわ、ため口をきくわ！"
"1015003-9-老人" = "しかも、何だその反抗的な目は！"
"1015003-10-コトネ" = "あ……知らない人だったんだ。ごめん、友達かと思って。"
"1015003-11-コトネ" = "反抗的な目をしてるんじゃなくて、前がよく見えないんだ……。"
"1015003-12-老人" = "誰が友達だ！口答えして、反省しとらんようだな――"
"1015003-14" = "[ns1] \"失礼します。\"\n[ns2] \"うちの生徒が何か失礼でも……。\""
"1015003-18-老人" = "あんたが保護者か？"
"1015003-19-老人" = "まったく、どういう教育をしとるんだ！"
"1015003-20-老人" = "この子ときたら……いきなりわしの肩をつかんで、因縁をつけてきたんだぞ！"
"1015003-21" = "[ns] \"恐らく、何か誤解があったのだと……。\""
"1015003-23" = "（怒ったご老人をどうにか宥めた後、コトネに事情を聞いた）"
"1015003-26" = "[ns3] \"つまり、うっかりメガネを割っちゃって……。\"\n[ns4] \"見えづらくて目を細めてたら、ケンカを売っているように見えたってこと？\""
"1015003-29-コトネ" = "うん。顔を確かめるためには、目を細めるしかなくて。"
"1015003-30-コトネ" = "それで、感じ悪く見えたのかも。"
"1015003-31" = "[s] \"それは災難だったね……。\""
"1015003-35" = "[ns] \"メガネはどうして割れたの？\""
"1015003-36-コトネ" = "好きな作家の新刊が出たから本屋に寄ったんだけど……。"
"1015003-37-コトネ" = "本ばかり見てたら、#n扉が閉まっているのに気づかないままぶつかっちゃって。"
"1015003-38-コトネ" = "ケガはしなかったけど、メガネは割れちゃった……。"
"1015003-39" = "[s] \"予備のメガネはないの？\""
"1015003-40-コトネ" = "うん。よりによって、あれが最後の一本……。"
"1015003-41-コトネ" = "まあ、そろそろメガネを新調しなきゃって思ってたし。"
"1015003-45-コトネ" = "ねえ、先生。よかったら、新しいメガネを作るのに付き合ってくれる？"
"1015003-46-コトネ" = "メガネがないと、どこへも行けないし……#nまたトラブルを起こしちゃうかもしれないから。"
"1015003-47" = "[s5] \"もちろん、付き合うよ。\"\n[s6] \"一番近いメガネ屋さんはどこ？\""
"1015003-50-コトネ" = "一番近いメガネ屋さんなら、#nここから地下鉄で三駅くらい先のラミニタウンにあるよ。"
"1015003-51-コトネ" = "いつもネットでメガネを購入してる店があるから、そこに行こう。"
"1015003-52" = "[s] \"了解。じゃあ、私が案内するよ。\""
"1015003-56" = "[ns7] \"その前に、コトネ……。\"\n[ns8] \"もしかして、その格好で行くつもりなの？\""
"1015003-59-コトネ" = "うん。変かな？"
"1015003-64-市民A" = "ねえ見て、シャーレの先生が水着の生徒と一緒にいる。"
"1015003-65-市民B" = "うわ……噂には聞いてたけど、本当に水着のまま連れ歩いてるんだ。"
"1015003-66-市民A" = "あれも、シャーレの活動の一環なのかな。"
"1015003-67-市民A" = "先生の趣味だとしたら、相当悪趣味だよね。"
"1015003-68-市民B" = "噂だと、水着はまだマシな方らしいよ。#nバニーガールとかアニメのコスプレしてる子と一緒にいることもあるんだって。"
"1015003-69-市民A" = "こわー……。"
"1015003-70" = "[ns] \"あの……コトネさん。\""
"1015003-72-コトネ" = "ん？どうしたの？"
"1015003-73" = "[s] \"他の服には着替えられなかったの？\""
"1015003-74-コトネ" = "他の服って、潜水服とか？"
"1015003-75-コトネ" = "何着かあるけど、陸の上を歩くには不便だから着ないよ。"
"1015003-76" = "[s] \"潜水服じゃなくて、私服はないの？\""
"1015003-77-コトネ" = "私服？これが私服だよ？"
"1015003-78-コトネ" = "オデュッセイアでもこの格好で歩いてるけど、#n変な目で見られることなんてほとんどなかったけど。"
"1015003-79-コトネ" = "ボレロを脱げばすぐに泳げるし、合理的でしょ？"
"1015003-80" = "[s9] \"でも、ここは地下鉄だから……。\"\n[s10] \"周りの人の服と比べたら、ちょっと……。\""
"1015003-83-コトネ" = "周りの人の服？"
"1015003-84-コトネ" = "うーん、よく見えないな……。"
"1015003-85" = "[s11] \"……やっぱり、気にしないで。\"\n[s12] \"早くメガネ屋さんに行こう。\""
"1015003-90" = "（その後、人々の刺すような視線を浴びながらメガネ屋に到着した）"
"1015003-94" = "[ns] \"すみません！至急、メガネを一つ作りたいのですが！\""
"1015003-95-店員" = "えっと……。"
"1015003-96-店員" = "すみません、コスプレ用のメガネは扱っていなくて……。"
"1015003-97" = "[ns] \"普通のメガネで大丈夫です！\""
"1015003-99" = "（幸い、すぐに新しいメガネを作ることができた）"
"1015003-102-コトネ" = "よかった。"
"1015003-103-コトネ" = "やっとちゃんと見える。"
"1015003-104" = "[s13] \"これで安心だね……。\"\n[s14] \"一人でも帰れそう？\""
"1015003-111-コトネ" = "うーん……。"
"1015003-116" = "[ns15] \"どうして急にくっついてくるの！？\"\n[ns16] \"メガネが合わなかった？\""
"1015003-119-コトネ" = "……ううん。"
"1015003-120-コトネ" = "実は……見えるようになったら、急に恥ずかしくなってきちゃって。"
"1015003-121-コトネ" = "さっきは分からなかったけど……この水着、たしかに少し目立つね。"
"1015003-122-コトネ" = "このまま一人では帰れないから、先生にくっついて帰ることにする。"
"1015003-123" = "[s17] \"ならせめて、もう少し離れられない？\"\n[s18] \"その格好でくっつかれると、余計に誤解されそう……。\""
"1015003-129-コトネ" = "だめ。"
"1015003-130-コトネ" = "オデュッセイアに戻るまで……絶対に離れないから。"
"1015003-132" = "（その後……さっきよりさらに冷たい視線を浴びながら、#nオデュッセイアへ戻った）"
