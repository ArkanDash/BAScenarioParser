[translation]
"1011903-1" = "気持ちの伝え方"
"1011903-2" = "（路地裏商店街のお祭りに参加した）"
"1011903-6-商人A" = "らっしゃいらっしゃ～い！#n特製ソースの焼きそば！お好み焼きもおいしいですよ～！"
"1011903-7-商人B" = "溢れんばかりのメロンクリーム！メロンパンならここだよ！"
"1011903-8-商人C" = "チセ様を惚れさせた特製綿あめ！食べないと後悔しますよ～！"
"1011903-12-百鬼夜行サークル部員A" = "まもなく、広場でフィットネス落語部の公演が始まります。#nぜひ、お越しくださいませ。"
"1011903-13-百鬼夜行サークル部員A" = "一公演あたり、なんと50[ruby=キロカロリー]0kcalを[/ruby]消費できる絶好のチャンス！#nダイエットに効果的ですよ！"
"1011903-17" = "（屋台や公演を楽しんでいたら、いつの間にか夕方になっていた）"
"1011903-18" = "（祭りも終わりの頃、路地裏で後片付けをしているナグサに出会った）"
"1011903-23-ナグサ" = "あ、[USERNAME]先生。来てくれてたんだ。"
"1011903-24-ナグサ" = "お祭りは楽しめた？"
"1011903-25" = "[s] \"うん、おかげさまで。\""
"1011903-29" = "[ns] \"最後にナグサに会えてよかった。\""
"1011903-30-ナグサ" = "ずっと屋台の中だったから、仕方ないよ。"
"1011903-31-ナグサ" = "焼くたびに売れていって……みんな美味しそうに食べてくれてた……。"
"1011903-32-ナグサ" = "裏方のみんなが、すごく頑張ってたんだ。"
"1011903-33" = "[s] \"ナグサにもお祭りを楽しんでほしかったな。\""
"1011903-37-商人B" = "あっ、いたいた！委員長！いやぁ今日は助かったよ！"
"1011903-38-ナグサ" = "私は、その……。"
"1011903-39-商人B" = "あれ？副委員長だっけ？はは！とにかく！#nナグサちゃんが居なかったらどうなってたことか……！"
"1011903-40-商人B" = "焼き鳥担当が熱出してぶっ倒れたって聞いた時は焦ったけど……。"
"1011903-41-商人B" = "ナグサちゃんが来てくれてほんっとうに助かった！"
"1011903-42-商人B" = "それに、初めてだって言うわりに焼くのが上手で驚いたもんさ。"
"1011903-44-ナグサ" = "売り物にはなったみたいで、よかった。"
"1011903-45-ナグサ" = "でも、お店のいつもの味には遠かったよ。"
"1011903-46-商人B" = "はは！そう謙遜するなって！"
"1011903-50-商人B" = "おっと！忘れるとこだった。"
"1011903-51-商人B" = "この後、店で打ち上げをするんだ。よかったら参加しないか？"
"1011903-52-商人B" = "お祭りの成功を祝うってんで、みんな大盛り上がりなんだ。"
"1011903-53-商人B" = "ナグサちゃんが来てくれたら、きっとみんな喜ぶぞ。"
"1011903-54-ナグサ" = "でも……私……。"
"1011903-58-ナグサ" = "……ごめんなさい。先約があるの。"
"1011903-59-商人B" = "なんだ、それなら仕方ないわな。"
"1011903-60-商人B" = "……代わりと言っちゃなんだけど、今度また店に顔出してよ。#n店の焼き鳥、好きなだけタダで食べさせてあげるから！"
"1011903-61-ナグサ" = "うん、楽しみにしておく。"
"1011903-66" = "[ns] \"約束の時間は大丈夫？\""
"1011903-67-ナグサ" = "いや……約束なんて、ないの。"
"1011903-68-ナグサ" = "……ただの言い訳。"
"1011903-69" = "[s] \"打ち上げは苦手？\""
"1011903-70-ナグサ" = "いや、賑やかな雰囲気は嫌いじゃない。"
"1011903-71-ナグサ" = "でも……私がいたら、せっかくの雰囲気を壊してしまう。"
"1011903-72-ナグサ" = "口下手だし、無表情だし、面白くもないから――"
"1011903-73-ナグサ" = "きっと場違いになる。"
"1011903-74-ナグサ" = "みんなの楽しい時間に、こんなのが混ざったら迷惑でしょう？"
"1011903-75" = "[s1] \"迷惑じゃないよ。\"\n[s2] \"私はナグサといると楽しいよ。\""
"1011903-77-ナグサ" = "！？"
"1011903-78-ナグサ" = "で、でも……。"
"1011903-79" = "[s] \"気持ちを伝えるのに才能なんていらないよ。\""
"1011903-83" = "[ns3] \"もし口下手で、無表情だったとしても。\"\n[ns4] \"楽しいって気持ちは、きっとみんな一緒だから。\""
"1011903-88-ナグサ" = "……分かった。"
"1011903-89-ナグサ" = "先生、ちょっと行ってきていい？"
"1011903-90-ナグサ" = "今からでも参加できるか、聞いてみる。"
"1011903-91" = "[s] \"楽しんでおいで。\""
"1011903-94" = "（ナグサの足取りはいつもより少しだけ軽やかに見えた）"
