[translation]
"2002803-1" = "道なき道を"
"2002803-2" = "（ヒナタを探すために、拠点近くを歩いていると……）"
"2002803-6" = "（ものすごい量の荷物を抱えて、森を歩いているヒナタの姿を見つけた）"
"2002803-10-ヒナタ" = "よいしょ……これは、あっちに……。"
"2002803-15-ヒナタ" = "思ったよりも、ずっと軽いですね……"
"2002803-16-ヒナタ" = "それに、聖堂と比べて、量が少ないような……？"
"2002803-20-ヒナタ" = "……ん？"
"2002803-24-ヒナタ" = "……わっ！？せ、先生……！？"
"2002803-25-ヒナタ" = "い、いつの間に、いらっしゃったのですか！？"
"2002803-26-ヒナタ" = "き、来たばかり……"
"2002803-27-ヒナタ" = "なるほど、そうでしたか……。"
"2002803-28-ヒナタ" = "え？私の手伝いに……？"
"2002803-29-ヒナタ" = "そんな！大丈夫ですと、先ほどお伝えしたのに！"
"2002803-30-ヒナタ" = "他の方々にもお声がけいただいて、断るのが大変だったのに、先生まで……"
"2002803-31-ヒナタ" = "これでは……私のせいで、みなさんの仕事を増やしてしまっているような……"
"2002803-32-ヒナタ" = "私が不甲斐ないばかりに……"
"2002803-33" = "[s1] \"好きでやってるから、気にしないで。\"\n[s2] \"ヒナタに任せっきりじゃ悪いし。\""
"2002803-36-ヒナタ" = "うぅ……そのように言っていただいてるのに……"
"2002803-37-ヒナタ" = "……これで断るのも、逆に失礼ですよね。"
"2002803-42-ヒナタ" = "それでは……"
"2002803-43-ヒナタ" = "お願いしても良いでしょうか？"
"2002803-48-ヒナタ" = "か、軽いものだけ、ですからね。重い荷物は、私にお任せください。"
"2002803-49-ヒナタ" = "よろしいですか？"
"2002803-50" = "[s3] \"分かった、ヒナタも怪我しないようにね！\"\n[s4] \"これでヒナタと一緒だ！\""
"2002803-53-ヒナタ" = "…………ふふっ。"
"2002803-54-ヒナタ" = "ふふ、ふふふっ……。"
"2002803-58-ヒナタ" = "ごめんなさい。ふふ、思わず、笑ってしまいました……。"
"2002803-59-ヒナタ" = "よく分からないのですが、なんだか楽しくなってしまって、つい……。"
"2002803-60-ヒナタ" = "これも、先生の優しさですよね。お気遣い、ありがとうございます。"
"2002803-64-ヒナタ" = "では、そろそろ行きましょうか。せっかく先生が手伝ってくださるのに、かえって時間がかかるようでは本末転倒ですから。"
"2002803-65-ヒナタ" = "私が先に歩きますね。"
"2002803-66-ヒナタ" = "……よいしょ！"
"2002803-75-ヒナタ" = "……あら？"
"2002803-76" = "[s5] \"大きな岩が……。\"\n[s6] \"これじゃあ、通れそうにないね。\""
"2002803-79-ヒナタ" = "拠点まで戻るには、この道を通るのが一番近いはずなのですが……"
"2002803-80-ヒナタ" = "……え？回り道をするのですか？"
"2002803-81-ヒナタ" = "いえ、"
"2002803-82-ヒナタ" = "その必要はないかと。"
"2002803-83-ヒナタ" = "道を塞ぐ目的で置かれた岩ではないようですし、これくらいなら退けられると思います。"
"2002803-84" = "[s] \"ああ、そう……\""
"2002803-88" = "[ns7] \"……今、なんて言ったの？\"\n[ns8] \"何をどうするって？\""
"2002803-91-ヒナタ" = "少々お待ちください。一度、荷物は置いて……と。"
"2002803-96-ヒナタ" = "この程度でしたら、こうして……んんっ……！"
"2002803-100-ヒナタ" = "ふっ……！よい……しょっと！"
"2002803-109-ヒナタ" = "……ふぅ、これで問題ありませんね。"
"2002803-114-ヒナタ" = "お待たせしました、行きましょうか。"
"2002803-118" = "[ns] \"……。\""
"2002803-123-ヒナタ" = "あら、今度は倒木が道を塞いで……"
"2002803-127-ヒナタ" = "寿命を全うしたのでしょう。"
"2002803-128-ヒナタ" = "これを動かすのは、難しそうですね……"
"2002803-129-ヒナタ" = "……はい？今度こそ回り道ですか？"
"2002803-130-ヒナタ" = "ふふっ……たしかに良い案ですが、先生をそんなに歩かせるのは申し訳ないです。"
"2002803-131-ヒナタ" = "んー……どうしましょう？"
"2002803-135-ヒナタ" = "あっ、岩なら難しかったかもしれませんが、木だったら……？"
"2002803-139-ヒナタ" = "……ふんっ！！"
"2002803-148" = "[ns9] \"あんな太い木が、こうもあっさり真っ二つに……。\"\n[ns10] \"………え、ええっと。\""
"2002803-151-ヒナタ" = "……ふぅ！思いのほか、硬くありませんでした。運が良かったですね！"
"2002803-152-ヒナタ" = "さあ、先生！行きましょう。拠点まで、あともう少しです！"
"2002803-156-ヒナタ" = "……ん？"
"2002803-157-ヒナタ" = "……先生？そんな顔をされて、どうかしましたか？"
"2002803-158" = "[s] \"……ヒナタ。\""
"2002803-159-ヒナタ" = "は、はい……？"
"2002803-165" = "[ns11] \"ヒナタには、いつも心から感謝してるよ。\"\n[ns12] \"な、何かあったら、いつでも先生に言ってね。\""
"2002803-170-ヒナタ" = "え、えっと……？"
"2002803-171-ヒナタ" = "は、はい……ありがとう……ございます……？"
"2002803-175-ヒナタ" = "……？？？"
"2002803-177" = "（その後、頭の上にクエスチョンマークを浮かべたヒナタと一緒に、拠点へ戻った）"
"2002803-178" = "（当然のように素手で岩を退かし、倒木を真っ二つにしたことには、触れない方が良い気がした……）"
