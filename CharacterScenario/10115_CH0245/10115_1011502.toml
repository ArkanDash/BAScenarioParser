[translation]
"1011502-1" = "タイミングの特訓"
"1011502-2" = "（ミレニアム野球部の練習場に向かった）"
"1011502-9-レイ" = "あっ！来てくれたんですね。ありがとうございます。"
"1011502-10" = "[s1] \"タッチ！\"\n[s2] \"いえ～い！\""
"1011502-11-レイ" = "いっ、いえ～い！#n……ハイタッチって、ちょっとテンション上がりますよね！"
"1011502-12-レイ" = "いえ～い！"
"1011502-13-レイ" = "……よっし。それじゃ、見ててくださいね。"
"1011502-15-レイ" = "今日の練習、気合い入れていきますから！"
"1011502-20" = "（そう言ってレイは意気揚々とバッターボックスに向かったが……）"
"1011502-27-ロボット練習サポーター" = "<スリーストライク……アウト！>"
"1011502-28-レイ" = "流石はミレニアム製……手強いですね……"
"1011502-29-レイ" = "でも、次こそは……！"
"1011502-35-レイ" = "……捉えたっ！"
"1011502-39-ロボット練習サポーター" = "<センターフライ……アウト>"
"1011502-40-ロボット練習サポーター" = "<いい当たりですが、打球の角度が高すぎます>"
"1011502-41-レイ" = "はぁ……。"
"1011502-45-ロボット練習サポーター" = "<ゴロです>"
"1011502-46-レイ" = "うっ……！"
"1011502-49-ロボット練習サポーター" = "<内野フライ>"
"1011502-50-レイ" = "まっ、まだまだ……！"
"1011502-54-ロボット練習サポーター" = "<ストライク……スリーストライク、アウト！>"
"1011502-55-レイ" = "ううっ……！"
"1011502-64-レイ" = "お疲れ様でした……。"
"1011502-65-レイ" = "はあ、今日も全然ダメでしたね……。"
"1011502-66-レイ" = "当たったと思ってもフライかゴロばっかり……。"
"1011502-67-レイ" = "でも、一応ノーヒットじゃなかったから、良しとすべきなんでしょうか……。"
"1011502-68" = "[ns] \"原因は何だろうね？\""
"1011502-69-レイ" = "……。"
"1011502-70-レイ" = "その答えなら、分かってるんです。"
"1011502-71" = "[s] \"えっ、本当に？\""
"1011502-72-レイ" = "結局はタイミングですね。"
"1011502-73-レイ" = "バッティングはタイミングが命、ピッチャーはそのタイミングを崩すのが仕事……って言いますし。"
"1011502-77-レイ" = "……あれ？逆だったかも？"
"1011502-78-レイ" = "とにかく、どんな球だとしても、芯を捉えるタイミングはあります。"
"1011502-79-レイ" = "そこを見極めてバットを振る必要があって……。"
"1011502-80-レイ" = "でもそれが難しいんですよ！ストレートか変化球か、どの球種かも見極めなきゃいけないし。"
"1011502-81-レイ" = "目では追えても、体がついてこないこともあるんです……。"
"1011502-82" = "[ns3] \"タイミングか……。\"\n[ns4] \"それなら力になれるかも。\""
"1011502-85-レイ" = "本当ですか！？ぜひお願いします！"
"1011502-86-レイ" = "今までは、誰も良い特訓方法を知らなかったので……。"
"1011502-87-レイ" = "え？発想の転換が大事？信じてついて来い、と？"
"1011502-88-レイ" = "はい、それはもちろん……って、そ、そんなに押さないでください！"
"1011502-89-レイ" = "せめてどこに行くのか教えて下さい……！"
"1011502-95-レイ" = "ここって……ゲームセンターですよね！？"
"1011502-96-レイ" = "どう考えても、ここで野球の特訓ができるとは思えないんですが……。"
"1011502-97" = "[s] \"「タイミング」の特訓ならリズムゲームだよ！\""
"1011502-98-レイ" = "リズムゲーム……すみません、ゲームはほとんど遊ばないので……。"
"1011502-99-レイ" = "やれば分かる、ですか……？"
"1011502-100-レイ" = "物は試しですよね……やってみます！"
"1011502-102" = "（物珍しそうにしているレイを連れて、リズムゲームコーナーへと向かった）"
"1011502-103" = "（しかし、この時の私はまだ知る由も無かった……新たな伝説に出会うことを……）"
"1011502-104-レイ" = "なるほど、これがリズムゲーム……。"
"1011502-105-レイ" = "落ちてくるバーに合わせて、タイミングよくボタンを押す……。"
"1011502-106-レイ" = "たしかに、良い特訓になりそうですね。"
"1011502-107-レイ" = "えっ？太鼓を叩いたり、ギターを弾いたり、ドラムを叩くゲームもあるんですか？"
"1011502-108-レイ" = "一口にリズムゲームと言っても幅広いんですね……。"
"1011502-112-レイ" = "これだけ多いと迷っちゃいますし……#n素直に、先生おすすめのゲームからやってみます！"
"1011502-114" = "（レイが筐体に向き合うと、チュートリアルが流れ始めた）"
"1011502-115" = "（そして、束の間の後……）"
"1011502-123-レイ" = "長押し……ここは抜けやすい……スクラッチ、忘れない……。"
"1011502-134-見物しているゲーマーA" = "おいっ、見ろよ、あの子！"
"1011502-135-見物しているゲーマーB" = "あれ、レベル12の新曲だろ？精度エグイな……。"
"1011502-145-見物しているゲーマーA" = "まだ運指も研究中のはず……まさか反射神経だけで反応してんのか……！？"
"1011502-146-レイ" = "ここでリズムが崩れるけど……大丈夫！連打パターンも読めました！"
"1011502-169-レイ" = "……やった！先生！フルコンボです！……あれ？"
"1011502-173-レイ" = "こ、この状況は……？"
"1011502-174" = "[s5] \"えっと……レイ、おめでとう！\"\n[s6] \"歴代ランキング1位だよ！\""
"1011502-177-レイ" = "1位……？"
"1011502-178-レイ" = "ただタイミングに合わせて押してただけですよ……？"
"1011502-179-感心するゲーマー" = "タイミングに合わせて押した、だけ……！？"
"1011502-180-驚くゲーマー" = "リズムゲームにはセンスが必要と言うが……そんなレベルに収まる才覚ではないな……。"
"1011502-181-感心するゲーマー" = "これなら伝説の「UZQueen」とも良い勝負になるんじゃないか！？"
"1011502-182-驚くゲーマー" = "さっき「レイ」って呼んでたよな？名付けるなら……「レイ・クイーン」の誕生、だな。"
"1011502-186-レイ" = "え、ええっ……？"
"1011502-187-気弱なゲーマー" = "あ、あの……もし良かったら、一緒に写真撮らせてもらえませんか……？"
"1011502-188-レイ" = "えっ！？わ、私、そんなすごくないですし、そもそもゲームじゃなくて野球が本職で……！"
"1011502-189-レイ" = "えっと、その、ゲーマーの皆さんにすごく申し訳ないというか……。"
"1011502-193-レイ" = "私はこれで失礼します……っ！！"
"1011502-200-レイ" = "はぁ、はぁ、はぁ……。"
"1011502-207" = "[ns7] \"はぁ、はぁ、はぁ……。\"\n[ns8] \"さすが野球部、足が速い……！\""
"1011502-210-レイ" = "あっ、先生！？すみません！私、一人で逃げちゃって……！"
"1011502-211-レイ" = "それに、選手の中ではそんなに速い方でもないんですけど……。"
"1011502-212-レイ" = "でも、あんなに注目されるなんて……びっくりしました。"
"1011502-213-レイ" = "振り返ったら急に人が増えてて……完全に不意打ちでしたよ。"
"1011502-214" = "[s] \"ごめん、レイ。私のせいだね。\""
"1011502-215-レイ" = "いえいえ！先生が謝ることでは。"
"1011502-216-レイ" = "先生は私のためにリズムゲームを教えてくれたんですから。"
"1011502-217-レイ" = "飛び出してしまったのも、私が慌てすぎただけですし。"
"1011502-218-レイ" = "それに……。"
"1011502-219-レイ" = "……あの場を離れたのは、ただ混乱していただけじゃなくて、「戦場」が違うからなんです。"
"1011502-220-レイ" = "大げさ、でしょうか……でも……"
"1011502-221-レイ" = "野球は私にとって戦いなんです！"
"1011502-222-レイ" = "全力で挑む人にとって、その場所こそが「戦場」です。"
"1011502-223-レイ" = "だから、リズムゲームという「戦場」で戦う人たちに、私が混ざるのはちょっと失礼だったのかなって思って……。"
"1011502-224-レイ" = "うぅ、私、変なこと言ってますね……。"
"1011502-225" = "[s9] \"いや、大丈夫だよ。\"\n[s10] \"レイの「戦場」は野球なんだね。\""
"1011502-228-レイ" = "そう言ってもらえたら……嬉しいです！"
"1011502-229-レイ" = "今日は本当にありがとうございました。先生のおかげで、リズム感を掴めた気がします！"
"1011502-230-レイ" = "これなら「タイミング」もきっと……ピタッとハマった感じで。"
"1011502-231-レイ" = "次の練習試合では、絶対成功させます！見ててくださいね、先生！"
"1011502-233" = "（レイは張り切ってバッターボックスに立った。結果は見事……）"
"1011502-234" = "（壮絶な敗北を喫した）"
"1011502-235-レイ" = "そんなぁあ――！？！？！？！？"
