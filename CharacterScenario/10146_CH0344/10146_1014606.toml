[translation]
"1014606-1" = "完璧なる議長の夏"
"1014606-6-写真家" = "今の表情、良いですね！"
"1014606-7-写真家" = "もう少しあごを引いてもらえますか？#n胸はそのまま、あまり張らないように！"
"1014606-11-写真家" = "そうそう！完璧です！"
"1014606-18" = "（現場に到着すると、すでに撮影が始まっていた）"
"1014606-22-オーナー" = "おや、シャーレの先生でしょうか？"
"1014606-23-オーナー" = "来客があると伺っておりましたが、まさか先生だったとは。"
"1014606-24-オーナー" = "お会いできて光栄です。"
"1014606-25-オーナー" = "……みてください！素晴らしいでしょう？"
"1014606-26-オーナー" = "マコトさん――いえ、マコト議長のことです。"
"1014606-32-オーナー" = "現役モデルでもポージングには苦戦するというのに……#nあんなにも自然に立ち振る舞えるとは。"
"1014606-33-オーナー" = "長身で顔良しスタイル良し……まさに完璧な逸材です！"
"1014606-37-オーナー" = "惚れ惚れするほど美しい、堂々たる立ち居振る舞い……！"
"1014606-38-オーナー" = "これだけの機材を前にして、怖気づくことなく撮られるなんて……才能ですよ。"
"1014606-43-オーナー" = "これほど素晴らしい原石なのに、プロ志望じゃないとはもったいない……！"
"1014606-44-オーナー" = "よろしければ、先生が説得してくださいませんか？"
"1014606-45" = "[s1] \"聞いてはみますが。\"\n[s2] \"本人の意思が一番大事ですから。\""
"1014606-48-オーナー" = "ええ！もちろんですとも。#n聞いていただけるだけでも、ありがたいです！"
"1014606-54-万魔殿のメンバー" = "専門家らしい分析ですね。"
"1014606-55-万魔殿のメンバー" = "マコト議長がモデルとしてデビューしたら、芸能界を手中に収めるのも夢じゃありません！"
"1014606-56-風紀委員" = "そうかな……？"
"1014606-57-風紀委員" = "私はファッションのこと、よく分からないけど。"
"1014606-58" = "[s3] \"あれ、君は！？\"\n[s4] \"この前、マコトを怒鳴りつけに来た……！？\""
"1014606-61-風紀委員" = "あはは……覚えててくださったんですね。"
"1014606-62-万魔殿のメンバー" = "忘れろって言う方が難しくない？"
"1014606-63-万魔殿のメンバー" = "風紀委員が一人[ruby=パンデモニウム・ソサエティー]で万魔殿に[/ruby]乗り込むなんて、ゲヘナの歴史に残る大事件だよ？"
"1014606-64-風紀委員" = "そう？うちの委員長ならもっと派手にやってたと思うけど。"
"1014606-65-万魔殿のメンバー" = "いや、そっちの委員長はちょっと次元が……。"
"1014606-67" = "[ns5] \"……？二人とも……。\"\n[ns6] \"仲良くなったんだね。\""
"1014606-70-風紀委員" = "あはは……まぁ。成り行きで。"
"1014606-71-風紀委員" = "実は、あの翌日……。"
"1014606-80-風紀委員" = "突然、教室に来たときは驚きましたが……。"
"1014606-81-風紀委員" = "話してみたら、意外と悪い人じゃなかったので。"
"1014606-82-風紀委員" = "私がこの間のことを気にしていたら……。"
"1014606-83-風紀委員" = "「言いたいことを言って何が悪い！！」"
"1014606-84-風紀委員" = "……って、励ましてくれたんです。"
"1014606-85" = "[s7] \"ああ、すごく分かる……。\"\n[s8] \"マコトらしいね。\""
"1014606-88-風紀委員" = "ですよね？みんな、そう言ってました。"
"1014606-89-風紀委員" = "……それで、いつの間にか万魔殿に友達ができたんです。"
"1014606-90-風紀委員" = "非番の時はこうして手伝ったりして……お互い忙しいですからね。"
"1014606-91-風紀委員" = "あ、これは委員長と行政官には絶対に内緒ですよ……。"
"1014606-93" = "（その後もマコトの撮影はスムーズに進んでいた）"
"1014606-94" = "（そして撮影が終わり……）"
"1014606-99-写真家" = "お疲れさまでした～！"
"1014606-102-マコト" = "ああ、先生。来ていたのか？"
"1014606-103-マコト" = "それならそうと、声をかけてくれ。"
"1014606-104" = "[s9] \"撮影の邪魔になるから……。\"\n[s10] \"マコトも集中してたし。\""
"1014606-107-マコト" = "キシシッ！気にする必要はない。"
"1014606-108-マコト" = "このマコト様にとって、最も優先すべき対象は先生だからな。"
"1014606-109-マコト" = "だから、来訪はちゃんと知らせてもらいたい。#n先生との時間を逃すわけにいかないからな！"
"1014606-110-マコト" = "……きょ、今日の撮影、どうだっただろうか？"
"1014606-111" = "[s11] \"ずいぶん慣れてるように見えた。\"\n[s12] \"私の助けは必要なかったんじゃないかな。\""
"1014606-114-マコト" = "ん？ああ、何か勘違いしているようだな。"
"1014606-115-マコト" = "このマコト様は、先生に助けを求めて呼んだのではない。"
"1014606-116-マコト" = "先生の[ruby=・   ・]理解[/ruby]を助けるために呼んだのだ。"
"1014606-117-マコト" = "先生に提案を断られてから――"
"1014606-118-マコト" = "何が問題だったのか、ずっと考えていた。"
"1014606-119-マコト" = "このマコト様を拒むなんて、そもそもあり得ないことだ。"
"1014606-120-マコト" = "あるとするのならば、それはこのマコト様がどれほど偉大で完璧なのか、理解していないからだろう、と。"
"1014606-121-マコト" = "つまるところ、先生はまだ私について理解していないのだ、という結論に至った。"
"1014606-122-マコト" = "……このように完璧で美しい姿を保つのは、然程難しいことではない。"
"1014606-123-マコト" = "しかし、先生がこのマコト様の魅力を見逃していては、美しい姿を見せても意味がないだろう？"
"1014606-124-マコト" = "だから、私のそばにいてもらいたい。"
"1014606-125-マコト" = "そうすれば、先生は自然とこのマコト様のモノになるだろう？"
"1014606-126" = "[s13] \"善処します……。\"\n[s14] \"いつも隣にいるのは難しいけど……。\""
"1014606-129-マコト" = "キキッ。今は、それで満足するとしよう。"
"1014606-133-マコト" = "……。"
"1014606-134-マコト" = "あ、改めて聞かせてもらいたいのだが……。"
"1014606-135-マコト" = "……きょ、今日の撮影、どうだっただろうか？"
"1014606-137" = "（その後マコトと一緒に万魔殿に戻って写真を見た）"
"1014606-138" = "（どの写真もとても綺麗だった）"
