[translation]
"1601405-1" = "イブキと職業体験！"
"1601405-4-イブキ" = "こんにちは、先生！"
"1601405-5-イブキ" = "イブキ、来たよ！"
"1601405-6" = "[s1] \"こんにちは、イブキ。\"\n[s2] \"今日は私の仕事を見に来たの？\""
"1601405-9-イブキ" = "うん！学校で将来の夢を聞かれたんだ。"
"1601405-10-イブキ" = "これ！"
"1601405-14" = "[ns] \"「進路希望調査書」？\""
"1601405-15-イブキ" = "しんろ、きぼう……たぶんそう！"
"1601405-16-イブキ" = "大きくなったらどんなお仕事がしたいか書くようにって。"
"1601405-17-イブキ" = "それで、先生が頭に浮かんだの！"
"1601405-18" = "[s] \"イブキは、どんな仕事に挑戦してみたい？\""
"1601405-19-イブキ" = "うーん……"
"1601405-20-イブキ" = "イブキには何ができるのか、何が好きなのか考えてみたけど……"
"1601405-21-イブキ" = "まだ、よく分からなくて。"
"1601405-22" = "[s] \"時間はあるから、焦る必要は無いよ。\""
"1601405-23-イブキ" = "うぅ……そうなの……？"
"1601405-24-イブキ" = "でも……"
"1601405-25" = "[s3] \"それじゃあ、今から探しに行く？\"\n[s4] \"私も手伝うから。\""
"1601405-28-イブキ" = "わあ！本当？"
"1601405-29-イブキ" = "うん！イブキ、先生と一緒に色々やってみたい！"
"1601405-32-イブキ" = "こんにちは！イブキだよ！"
"1601405-33-ヴァルキューレの生徒" = "イブキさん、お待ちしてました。"
"1601405-34" = "[s] \"今日はありがとう、よろしくね。\""
"1601405-35-ヴァルキューレの生徒" = "いえ、先生。ではまず、警察の仕事を説明しますね。"
"1601405-36-イブキ" = "はいっ！お願いします！"
"1601405-37-ヴァルキューレの生徒" = "私たちは市民の安全を守るべく、日頃から街を巡回して取り締まりを行なっています。"
"1601405-38-ヴァルキューレの生徒" = "警察業務とは、まさに正義感と責任感が求められる仕事と言えるでしょう！"
"1601405-39-ヴァルキューレの生徒" = "それと……せっかくなので、今日はイブキさんのために制帽を持ってきました。"
"1601405-43-イブキ" = "わあ！本物のお巡りさんになった気分！"
"1601405-44-イブキ" = "えへへっ、逮捕しちゃうよ！"
"1601405-47-料理人の生徒" = "私たちの仕事は、みんなに美味しい料理を提供することさ。"
"1601405-48-料理人の生徒" = "お客様の笑顔が一番のやりがいでね！"
"1601405-49-イブキ" = "イブキもコックさんになれるかな？"
"1601405-50-料理人の生徒" = "もちろんだとも！#n諦めない気持ちさえあれば、誰でも素晴らしいシェフになれる！"
"1601405-51-料理人の生徒" = "さっそく子ども用の包丁を貸すね。ここにある野菜を切ってみてくれるかな？"
"1601405-52-イブキ" = "先生、待ってて！イブキ、すぐに美味しいご飯を作ってあげるから！"
"1601405-55-戦車長" = "イブキ様もご存じの通り、戦車の操縦は複数人で呼吸を合わせる、とても繊細な作業になります。"
"1601405-56-イブキ" = "イブキ、知ってる！イロハ先輩がやってるの見た！一緒に乗ったこともあるの！"
"1601405-57-戦車長" = "それでしたら、話は早いですね。では早速、戦車長を体験していただきます。"
"1601405-58-イブキ" = "イブキ、好きに動かしてもいいの……？#nうん、やってみる！"
"1601405-61" = "（色々な職業体験をしていたら、あっという間に日が暮れていた）"
"1601405-63" = "[ns5] \"どうだった、イブキ？\"\n[ns6] \"どれが一番気に入った？\""
"1601405-66-イブキ" = "うーん……"
"1601405-67-イブキ" = "まだよく分からなかった！"
"1601405-68" = "[s] \"たしかに、一日じゃ決められないよね。\""
"1601405-69-イブキ" = "でも……"
"1601405-70-イブキ" = "ちょっとだけ、何か分かった気がする！"
"1601405-71" = "[s] \"よく分からないけど、分かる……？\""
"1601405-72-イブキ" = "えへへ。じゃあ先生、イブキ、今日は帰るね！"
"1601405-73-イブキ" = "今日はありがとう！ばいば～い！"
