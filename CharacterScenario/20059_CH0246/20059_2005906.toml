[translation]
"2005906-1" = "小悪魔とのデート"
"2005906-3" = "ムツキと待ち合わせのオペラハウス"
"2005906-6-ムツキ" = "あ、先生！こっちこっち！"
"2005906-7" = "[s1] \"急にオペラハウスって……。\"\n[s2] \"何か依頼でもあった？\""
"2005906-10-ムツキ" = "ううん。普通にオペラが見たくなっただけ。"
"2005906-11-ムツキ" = "前は仕事で何も見られなかったでしょ？"
"2005906-12-ムツキ" = "だから今日はゆっくり観賞したかったんだ～"
"2005906-13-ムツキ" = "まあ、私には少し退屈かもしれないけど……。"
"2005906-14-ムツキ" = "先生と一緒なら絶対楽しいでしょ！"
"2005906-15" = "[s] \"楽しみだね！\""
"2005906-16-ムツキ" = "くふふっ。じゃあ行こっか。"
"2005906-18-ムツキ" = "わあ、すごい静か～。"
"2005906-19-ムツキ" = "こういう場所でイタズラしたら、超面白そう！"
"2005906-20-ムツキ" = "爆弾とかレインボー煙幕弾なんて投げたら、どうなっちゃうんだろ？"
"2005906-21" = "[s] \"ほ、本当にするの？\""
"2005906-22-ムツキ" = "くふふっ、冗談だよ～"
"2005906-23-ムツキ" = "先生を困らせるのは面白くないからね。"
"2005906-24-ムツキ" = "それに、今日はオペラを見に来たんだから。"
"2005906-28-ムツキ" = "あ、始まるみたい。"
"2005906-29-ムツキ" = "それじゃ、初めてのオペラ鑑賞スタート♪"
"2005906-31" = "（壮大な音楽とともに舞台の幕が上がった）"
"2005906-32" = "（音楽を愛する少女が手厳しい師匠のもとで、苦難を乗り越え夢を成就する、という内容の現代オペラだった）"
"2005906-34" = "（もしかしたら退屈しているのでは、という心配をよそに）"
"2005906-35" = "（ムツキは終始楽しそうにオペラに集中していた）"
"2005906-43" = "（オペラの幕が下り……）"
"2005906-45" = "[ns] \"すっかり夜だね。\""
"2005906-46-ムツキ" = "うん！あっという間だったね～！"
"2005906-47-ムツキ" = "あー楽しかった！"
"2005906-48-ムツキ" = "芸術ってすごいんだね！　音楽だけでもすっごくワクワクした！"
"2005906-49" = "[s] \"シンプルな内容だから余計良かったかも。\""
"2005906-50-ムツキ" = "くふふっ。それなりに厳選したからね、これ。"
"2005906-51-ムツキ" = "というかあのオペラって、弟子と師匠の話だったでしょ？"
"2005906-52-ムツキ" = "見ててずっと気になってたんだけど……。"
"2005906-56-ムツキ" = "先生は、私のことどう思う？"
"2005906-57" = "[s3] \"う、うん！？\"\n[s4] \"きゅ、急に！？\""
"2005906-60-ムツキ" = "ん？どしたの慌てて？なんか困る質問だった？"
"2005906-61-ムツキ" = "先生にとって私は……。"
"2005906-62-ムツキ" = "いい生徒？"
"2005906-63" = "[s] \"あ……ああ！そっち！！\""
"2005906-64-ムツキ" = "あれぇ～？もしかして違うこと考えてた～？"
"2005906-65-ムツキ" = "なに？なに考えてたの？分かりやすく説明してほしいな～。"
"2005906-66" = "[s] \"む、ムツキはいい生徒だな、って……！\""
"2005906-67-ムツキ" = "あははっ！いいよ、この辺にしてあげるね。"
"2005906-68-ムツキ" = "私は先生にとっていい生徒、ね……。"
"2005906-69-ムツキ" = "くふふっ……。"
"2005906-74-ムツキ" = "はい！オペラも楽しんだし、ご飯食べに行こー！"
"2005906-75-ムツキ" = "近くの商店街に、いいお店を見つけたんだ！"
"2005906-77" = "（ムツキに誘われたのはリーズナブルな焼き鳥屋で）"
"2005906-78" = "（気兼ねなく夜ご飯を楽しんだ）"
"2005906-83" = "（それからお洒落な今風のカフェに訪れ……）"
"2005906-84" = "（最近あったことや流行りなど、他愛もない話に花を咲かせた）"
"2005906-89" = "（気がつけば夜になり）"
"2005906-90" = "（私たちは示し合わせていたかのように、近くの公園でふと立ち止まった）"
"2005906-93-ムツキ" = "あーあ、もうバイバイの時間だね。"
"2005906-94-ムツキ" = "今日はやけに時間が過ぎるの早いなぁ～。"
"2005906-95-ムツキ" = "ありがとう、先生！今日は楽しかったよ！"
"2005906-96" = "[s] \"うん、私も。\""
"2005906-97-ムツキ" = "くふふ……また次も、デートしたいな。"
"2005906-98" = "[s] \"そうだね、また次……。\""
"2005906-103" = "[ns5] \"でっ、デート！？\"\n[ns6] \"い、言われてみれば、今日したことって……。\""
"2005906-106-ムツキ" = "そっ！デート！"
"2005906-107-ムツキ" = "やっと気が付いた？くふふ。先生って思ったより鈍感なんだね。"
"2005906-108-ムツキ" = "私たち、デートらしいデートって今日が初めてだよね？"
"2005906-109-ムツキ" = "デートだ、って思うと、いつもとなんか違う感じだった。"
"2005906-110-ムツキ" = "うまく言えないけど、胸の奥がなんかこう、くすぐったい？みたいな。"
"2005906-111-ムツキ" = "とにかく、ありがとね！私の初デートに付き合ってくれて♪"
"2005906-112" = "[s] \"こ、こちらこそ光栄です！\""
"2005906-113-ムツキ" = "あははっ！これで「自然な流れでデート」はクリアかな。"
"2005906-114-ムツキ" = "最初は、先生をからかいたかったんだけど……今はもうどっちでもいいや。"
"2005906-115-ムツキ" = "先生が私を「いい生徒」って言ってくれたように……。"
"2005906-116-ムツキ" = "私も先生のこと、いい先生だと思ってる。"
"2005906-121-ムツキ" = "だからこれからも、ずっとよろしくね！"
"2005906-122-ムツキ" = "先生の言うことを聞くかは……私が決めるけどね♪くふふ。"
"2005906-124" = "（その後も楽しくおしゃべりをして別れた）"
"2005906-125" = "（……また会う日を約束して）"
