[translation]
"1014905-1" = "ダイバーと味噌汁"
"1014905-2" = "（翌朝。朝から荒天だったため、心配になってココロのダイビングポイントへ向かった）"
"1014905-3" = "（海岸についた頃には、波は落ち着いていた。いつもより疲れた様子のココロが水面に浮上した）"
"1014905-8-ココロ" = "うぅ、やっぱりこんな日のダイビングは最悪……。"
"1014905-9-ココロ" = "あれ、先生？"
"1014905-10-ココロ" = "今日はどうしました？"
"1014905-11-ココロ" = "もしかして、何か緊急事態ですか？"
"1014905-12" = "[s1] \"ううん、ココロが心配で来ちゃった。\"\n[s2] \"朝から海が荒れていたから。\""
"1014905-15-ココロ" = "あ……気にかけてくださったんですね。"
"1014905-16-ココロ" = "わざわざありがとうございます……でも大丈夫です。"
"1014905-17-ココロ" = "今は波も落ち着きましたし……万が一に備えて、しっかり準備してきました。"
"1014905-18-ココロ" = "方向感覚を失わないよう潜降ラインも設置しましたし、#nゴーグルに曇り止めも塗りました。それに――"
"1014905-19-ココロ" = "緊急時に備えてマーカーブイも用意しました！"
"1014905-20" = "[s] \"さすが、徹底してるね。\""
"1014905-24" = "[ns3] \"でも、こんな日は体を冷やしちゃうから……。\"\n[ns4] \"早くストーブで温まって。\""
"1014905-27-ココロ" = "そんな……ありがとうございます。"
"1014905-28-ココロ" = "先生が来られると分かっていたら、もうちょっと……。"
"1014905-33-ココロ" = "そうだ……先生！"
"1014905-34-ココロ" = "あの……昼食はもうお済みですか？"
"1014905-35-ココロ" = "実は……上がったら飲もうとお味噌汁を作っておいたんです。#nただ……私一人だと量が多くて。"
"1014905-36-ココロ" = "よろしければ……一緒に食べませんか？"
"1014905-37" = "[s5] \"いいの？\"\n[s6] \"ちょうどお腹が空いてたんだ！\""
"1014905-40-ココロ" = "ちょっと待っててください。すぐに温めてきます。"
"1014905-41" = "[s7] \"あれ？だけど前に言ってなかったっけ……？\"\n[s8] \"味噌汁が苦手って……。\""
"1014905-44-ココロ" = "え？私がですか……？"
"1014905-45-ココロ" = "そんな、お味噌汁が苦手なんて――"
"1014905-49-ココロ" = "……ああっ！"
"1014905-50-ココロ" = "すみません。説明不足でした。"
"1014905-51-ココロ" = "あのとき言った「味噌汁」は、ダイバーの隠語で……。"
"1014905-52-ココロ" = "潮の流れや大雨で海が濁って、#n視界が悪くなった状態を「味噌汁」って呼ぶんです。"
"1014905-53-ココロ" = "浮遊物が舞って茶色く濁る海の様子が、まるで味噌汁みたいなので……。"
"1014905-54" = "[s9] \"なるほど！\"\n[s10] \"言われてみれば、味噌汁に似てるね！\""
"1014905-57-ココロ" = "紛らわしい言葉を使うのは、控えるべきでした……。"
"1014905-58-ココロ" = "誤解させてすみません……。"
"1014905-59" = "[s] \"大丈夫。気にしないで。\""
"1014905-63" = "[ns] \"つまり、ココロも「飲む」味噌汁は好きなんだね？\""
"1014905-64-ココロ" = "はい！"
"1014905-65-ココロ" = "天気が悪い日に、冷たい海から上がって飲むお味噌汁が――大好きで。"
"1014905-66-ココロ" = "じんわり広がる温かさと、疲れた体に染み渡る豊かなコク……。#nやみつきになっちゃいます……。"
"1014905-67-ココロ" = "ダイビング自体より、その後のお味噌汁のほうが待ち遠しい日もあるくらいです。"
"1014905-68" = "[s] \"そう聞くと、ますます楽しみになってきたよ。\""
"1014905-72-ココロ" = "あ、そろそろよさそうです。"
"1014905-73-ココロ" = "お椀に注いじゃいますね。"
"1014905-77" = "[wa:3540]― [log=코코로]はぁ……[wa:1820]あったまる……。[/log]"
"1014905-79" = "― [log=코코로]水上に上がってからの一杯は……[wa:2310]格別です。[/log]"
"1014905-82" = "[wa:500]― [log=코코로]あ……[wa:1480]先生のお口にあいましたか？[/log]"
"1014905-84" = "― [log=코코로]味が濃すぎたり、[wa:1720]薄すぎたり、していませんか……？[/log]"
"1014905-87" = "[wa:2380]― [log=코코로]よかった……。[/log]"
"1014905-89" = "― [log=코코로]……隠し味、[wa:1440]ですか？[/log]"
"1014905-92" = "― [log=코코로]特別なことは何も……[/log]"
"1014905-94" = "― [log=코코로]ネットで見たレシピ通りに作っています。[/log]"
"1014905-97" = "― [log=코코로]あさりの砂抜きをして……[/log]"
"1014905-99" = "― [log=코코로]アクをとって……。[/log]"
"1014905-102" = "[wa:520]― [log=코코로]あ、[wa:1040]でも……[wa:1640]そうですね。[/log]"
"1014905-105" = "― [log=코코로]飲んでくれる人のことを想って、[/log]"
"1014905-107" = "― [log=코코로]いつもより丁寧に作ったところは――[/log]"
"1014905-110" = "[wa:1230]― [log=코코로]あっ……[wa:630]な、[wa:720]なんちゃって。[/log]"
"1014905-113" = "[wa:800]― [log=코코로]え？[wa:1710]私の作ったお味噌汁を、[wa:2930]毎朝飲みたい……？[/log]"
"1014905-116" = "― [log=코코로]せ、[wa:430]先生……[wa:1440]それって……。[/log]"
"1014905-119" = "[wa:460]― [log=코코로]あ、[wa:346]いえ……[/log]"
"1014905-121" = "― [log=코코로]こ、[wa:661]困ってるとかでは……。[/log]"
"1014905-124" = "― [log=코코로]……はい。[wa:1522]先生が、お望みでしたら……[/log]"
"1014905-126" = "― [log=코코로]私は、[wa:2330]構いませんよ。[/log]"
"1014905-129" = "（ココロと温かい味噌汁を飲みながら、楽しい時間を過ごした）"
