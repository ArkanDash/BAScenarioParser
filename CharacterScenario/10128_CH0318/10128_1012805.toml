[translation]
"1012805-1" = "スカウトの試み"
"1012805-2-フユ" = "おはようございます、先生。"
"1012805-3-フユ" = "お元気そうでなによりです！"
"1012805-4" = "[s] \"おはよう、フユ。\""
"1012805-8" = "[ns] \"……ところで、今日の当番って別の子だよね？\""
"1012805-9-フユ" = "書類上は、私が当番です。"
"1012805-10-フユ" = "学院の当番外出者リストにも、ちゃんと私の名前がありましたよ？"
"1012805-11" = "[s] \"あれ、私には何も共有されてないんだけど……。\""
"1012805-12-フユ" = "そうでしょうね。"
"1012805-13-フユ" = "私が修正したのは、校内の名簿だけですから。"
"1012805-14" = "[s] \"……え？\""
"1012805-15-フユ" = "「取引」の対価は、お金だけとは限りません。"
"1012805-16-フユ" = "ときには、特別な権限をいただくことも……。"
"1012805-20" = "[ns] \"名簿の改ざんを引き換えに、品物を渡したの？\""
"1012805-21-フユ" = "ご名答！"
"1012805-22-フユ" = "ですが先生、聞いてください。"
"1012805-23-フユ" = "私にもやむを得ない事情がありまして……。"
"1012805-24" = "[s] \"……聞かせてもらおうか。\""
"1012805-25-フユ" = "今日は大事な商談があるんです。"
"1012805-26-フユ" = "なんとしても成功させなければならない商談……それは――"
"1012805-27-フユ" = "先生に、私ども特殊交易部の外部顧問になっていただくこと！"
"1012805-28" = "[s] \"私！？\""
"1012805-29-フユ" = "では、まずこちらの企画書をご覧ください。"
"1012805-30-フユ" = "先生が特殊交易部の顧問になっていただければ、#nより多角的な事業が可能となります。"
"1012805-31-フユ" = "依頼品の中には、外部の方でないと搬入できないものもありまして――"
"1012805-36" = "（フユのプレゼンはしばらく続いた……）"
"1012805-38-フユ" = "……以上です。"
"1012805-39-フユ" = "いかがでしょう、先生？"
"1012805-40" = "[s1] \"とても良いプレゼンテーションでした。\"\n[s2] \"ですが、当案件はお断りさせていただきます。\""
"1012805-43-フユ" = "えっ……！#nなぜですか……！"
"1012805-44-フユ" = "もしかして、報酬の説明が足りなかったのでしょうか？"
"1012805-45-フユ" = "もしも、先生が私たちの顧問になってくださるのであれば――"
"1012805-46-フユ" = "ほとんどの家電製品、電子機器を無償で修理しましょう！"
"1012805-47" = "[s3] \"フユを見ていると、たまに思うんだ。\"\n[s4] \"ミレニアムは、惜しい人材を逃したのかなって……。\""
"1012805-50-フユ" = "……ふふ。"
"1012805-51" = "[s] \"でも、ダメなものはダメです。\""
"1012805-52-フユ" = "いい条件だと……思うのですが……。"
"1012805-53-フユ" = "うーん……あ、そうだ。"
"1012805-54-フユ" = "私、修理だけでなく、料理も得意でして。"
"1012805-55-フユ" = "お弁当はもちろん、だし巻き卵やお味噌汁も……。"
"1012805-56" = "[s] \"それでもダメです。\""
"1012805-57-フユ" = "うーん、他には……。"
"1012805-58-フユ" = "え、えっと、顧問になっていただけたら……。"
"1012805-59-フユ" = "わ、私と毎日、会えます……よ？"
"1012805-60-フユ" = "って、これは報酬なのかな……？#nうぅ……。"
"1012805-64" = "[ns] \"それは、ちょっと興味あるかも。\""
"1012805-65-フユ" = "えっ。"
"1012805-66-フユ" = "ほ、本当ですか……！？"
"1012805-67" = "[s5] \"でも、今はシャーレの仕事で忙しくてね……。\"\n[s6] \"しばらくの間、顧問を引き受けるのは難しいんだ。\""
"1012805-73-フユ" = "そ、それなら仕方ありませんね！"
"1012805-74-フユ" = "ふ、ふふ……。#n次は、もっと作戦を練っておきましょう。"
"1012805-75-フユ" = "それでは、今日はこの辺りで失礼します。"
"1012805-83-フユ" = "ちょっと興味ある、か……。"
"1012805-87-フユ" = "……ふふっ。"
