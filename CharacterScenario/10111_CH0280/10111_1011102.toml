[translation]
"1011102-1" = "驚くほど普通に"
"1011102-2" = "ミレニアム自治区・公園"
"1011102-5" = "[ns] \"おはよう、ネル。\""
"1011102-6-ネル" = "あ、先生。"
"1011102-7-ネル" = "わりぃ、ちっと眠くて。"
"1011102-8" = "[s] \"今日は制服なんだね。\""
"1011102-9-ネル" = "あぁ、この格好で会うのは初めてだっけ？"
"1011102-10-ネル" = "色々と事情があってな。"
"1011102-11-ネル" = "セミナーの会計から、しばらく制服を着るよう頼まれちまって。"
"1011102-12-ネル" = "普段だったら無視するところだが……。"
"1011102-13-ネル" = "断るにも断りきれなくてな。"
"1011102-14-ネル" = "実は先生を呼んだ理由も、この服のせいなんだ。"
"1011102-15-ネル" = "スカジャンを着てないと、どうも落ち着かなくて……。"
"1011102-16-ネル" = "だから、先生にアドバイスを……。"
"1011102-17-ネル" = "……。"
"1011102-21-ネル" = "ぐあああああっ！"
"1011102-22" = "[s] \"だ、大丈夫！？\""
"1011102-23-ネル" = "大丈夫なわけあるか！#nちっとも落ち着かねぇ！"
"1011102-24-ネル" = "裸で出歩いてる気分だ！"
"1011102-25-ネル" = "やっぱ、先生から見ても変だろ？"
"1011102-26" = "[s] \"制服姿も可愛いよ。\""
"1011102-27-ネル" = "何っ！？"
"1011102-28-ネル" = "か、からかうなよっ！#nあたしは真剣に悩んでるんだぞ！"
"1011102-29" = "[s] \"よく似合ってるよ。\""
"1011102-30-ネル" = "そ、そうか……？"
"1011102-31-ネル" = "と、とにかく！"
"1011102-32-ネル" = "連絡したのは、こういう理由だ。"
"1011102-33-ネル" = "まぁ、先生から見ても変じゃねぇなら安心した。"
"1011102-34-ネル" = "……もちろん、可愛いだとか似合ってるだとか思わねぇけどよ。"
"1011102-35" = "[s] \"大丈夫だよ。\""
"1011102-37" = "[ns] \"どんな格好でも、ネルはネルだからね。\""
"1011102-38-ネル" = "あぁ？#nんなの当ったりめぇだろ！"
"1011102-39-ネル" = "スカジャンを着てなくても、そこら辺のスケバンくらい余裕で倒せるからな！"
"1011102-40-ネル" = "いつものネルに戻って安心した、って？"
"1011102-41-ネル" = "……ははっ！"
"1011102-42-ネル" = "やっぱ先生に聞いてもらって正解だったぜ。"
"1011102-43-ネル" = "せっかくだし、もう少し話していかねぇか？"
"1011102-48-ネル" = "隣、空いてるぜ。"
"1011102-50-ネル" = "つーか、今日はやけに静かだな？"
"1011102-51-ネル" = "行事のせいか、それとも気のせいか……。"
"1011102-52" = "[s] \"いつもと同じような……。\""
"1011102-53-ネル" = "いやいや、絶対違うって。"
"1011102-54-ネル" = "……あたしの知らないところで、何かが起きてるかもしれねぇ。"
"1011102-55-ネル" = "ほら、あいつらをよく見てくれ。"
"1011102-65" = "[ns] \"……？\""
"1011102-66-ネル" = "あたしがここに座ってるのに、スルーしたぞ。"
"1011102-67-ネル" = "いつもなら「C&Cのリーダー！？」とか「ひっ……！」とか言いながら、#nどっかに消えてくのによ。"
"1011102-68-ネル" = "ったく、大げさだぜ。"
"1011102-69" = "[ns] （たしかC&Cのメイド服には、偽装の役割が……）"
"1011102-70-ネル" = "けどよ、今日はそんな風な反応が一切なかった。"
"1011102-71-ネル" = "ありがたくはあるんだが、逆に気になるっつーか……。"
"1011102-72-ネル" = "いったい何が起きてんだ？"
"1011102-73-ネル" = "くそっ！#nこれも全部スカジャンを着てないせいか？"
"1011102-74" = "[s3] \"お、落ち着いて。\"\n[s4] \"まずは深呼吸しようか。\""
"1011102-77-ネル" = "ふぅ……。"
"1011102-78-ネル" = "先生は何か心当たりねぇのか？#nどう考えてもおかしいだろ。"
"1011102-79" = "[s] \"さ、さあ……。\""
"1011102-86-チンピラB" = "おい、お前。"
"1011102-90-チンピラA" = "キキッ、ここの公園はウチらの縄張りだぞ。#nベンチに座りたかったら許可を取るんだな！"
"1011102-91-チンピラC" = "とりあえず、勝手に利用したんだから金を払ってもらおうか。#nクレープ代くらいで勘弁してやるぞ！"
"1011102-92-ネル" = "……？"
"1011102-93-ネル" = "それ、あたしに言ってんのか？"
"1011102-94-チンピラB" = "ほかに誰がい――"
"1011102-99-チンピラB" = "って、お前は……。"
"1011102-100-チンピラB" = "……[ruby=みかも]美甘[/ruby]ネル！？"
"1011102-104-ネル" = "見覚えのある顔だな。#n前にボコられてから反省してねーのか？"
"1011102-105-チンピラB" = "ど、どうして制服を！？"
"1011102-106-チンピラA" = "騙したのか！？"
"1011102-107-チンピラC" = "スカジャン着とけよ！"
"1011102-108-ネル" = "今日は事情があってな。"
"1011102-109-ネル" = "それは置いといて……あたし、言ったよな？"
"1011102-110-スケバン一同" = "ひ、ひぃっ！？"
"1011102-111-ネル" = "……今度こそ潰すってよ？"
"1011102-123-スケバン一同" = "くっ……。"
"1011102-124-スケバン一同" = "お、覚えてろよー！"
"1011102-131" = "[ns] \"逃げちゃった……。\""
"1011102-132-ネル" = "はっ、さっきのでけぇ態度に免じて許してやる！"
"1011102-133-ネル" = "スケバンにたかられるなんて、新鮮じゃねぇか。"
"1011102-134" = "[s] \"相手はネルだって気づいてなかったんだね。\""
"1011102-135-ネル" = "言われてみればそうだな？"
"1011102-136-ネル" = "つーか、あたしだって気づかなかったのは……。"
"1011102-137" = "[s] \"制服だったから？\""
"1011102-138-ネル" = "まあ、スカジャンは派手だし、遠くからでもすぐ分かるしな。"
"1011102-139-ネル" = "待てよ。#nじゃあ、今日はいつもと違う風に感じたのは……。"
"1011102-140-ネル" = "……みんな、あたしに気づいてなかったせいか！？"
"1011102-141" = "[s] \"そうだと思うよ……。\""
"1011102-142-ネル" = "誰も気づかない、なんて……。"
"1011102-146-ネル" = "……悪くねぇな？"
"1011102-147-ネル" = "不思議な感じっつーか、なんつーか。"
"1011102-148-ネル" = "さっきみたいな珍しい体験もできたわけだしよ。"
"1011102-149" = "[s] \"なら、良いのかな……？\""
"1011102-150-ネル" = "ま、スカジャンを着てたほうが落ち着くけどよ。"
"1011102-151-ネル" = "なんか楽しくなってきたぜ。"
"1011102-152-ネル" = "そうだ、先生！"
"1011102-153-ネル" = "せっかくだし、この格好で教室に入ってみるのはどうだ？"
"1011102-158-ネル" = "試してみるしかねぇ！"
"1011102-160" = "（その後、いつもよりテンションの高いネルと一緒に、ミレニアムのあちこちを歩き回った）"
