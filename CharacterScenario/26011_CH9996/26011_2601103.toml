[translation]
"2601103-1" = "意外な共通点"
"2601103-2" = "（佐天から連絡をもらい、市場にやって来た）"
"2601103-8" = "[ns1] \"あっちかな……？\"\n[ns2] 声がした方へ向かう。"
"2601103-14-佐天涙子" = "……んん。"
"2601103-15-佐天涙子" = "んむむむむむ……。"
"2601103-16" = "[s3] \"待たせてごめんね。\"\n[s4] \"何があったの？\""
"2601103-19-佐天涙子" = "あ、先生。来てくれてありがとうございます！"
"2601103-20-佐天涙子" = "それがですね、あれを見てほしいんですが……"
"2601103-25-商人A" = "1人呼ぶだけなのに、どんだけ時間かかってるんだい！"
"2601103-26-商人B" = "いやいや、「麻雀が打てる人」となると、そう簡単には見つからないもんじゃないか？"
"2601103-27-商人C" = "はあ、まったく。これも本屋のおやじが抜けちまったから……。"
"2601103-28-商人B" = "麻雀は4人メンツを集める方が、[ruby=やくまん]役満[/ruby]より難しいくらいだしなぁ。"
"2601103-29-商人A" = "じゃあ、このままお開きにするか？本当は、もうちょっと遊んできたかったんだが……。"
"2601103-31" = "[ns5] \"……麻雀？\"\n[ns6] \"あれを見てたの？\""
"2601103-34-佐天涙子" = "はい。あたしたちの世界にも同じゲームがあって……"
"2601103-35-佐天涙子" = "しかも、ルールも一緒。"
"2601103-36-佐天涙子" = "よく考えてみたら、あたしたちって普通に会話できてますし、生活スタイルも都市の構造も意外と似てるんですよね。"
"2601103-37-佐天涙子" = "違うようでいて、似ている。……それが不思議だなあって。"
"2601103-38-佐天涙子" = "……えっ？"
"2601103-39-佐天涙子" = "ああ、麻雀のルールですか。#n聞いていたら分かりますよ。"
"2601103-40-佐天涙子" = "あたしも麻雀、打てますからね。よくネト麻で打ってましたし。"
"2601103-41-？？？" = "……なんだってっ！？"
"2601103-45-佐天涙子" = "……ん？"
"2601103-46-商人A" = "そこのお嬢さん！今、なんと！？"
"2601103-47-商人B" = "麻雀を打てるって……それは本当かい！？"
"2601103-48-商人C" = "時間は大丈夫かい？#n半荘一戦で構わんから、私たちと打ってくれんか？"
"2601103-49-佐天涙子" = "は、はいっ？いやぁ、そんな急に言われても……"
"2601103-50-商人A" = "頼む！この通りだ！#n最後にもう半荘打ちたかったんだが、人が見つからなくてな……！"
"2601103-51-商人B" = "そうなんだ。ここで解散したら、モヤモヤして麻雀で頭がいっぱいになりそうで。#nモヤモヤして夜しか眠れそうもない！"
"2601103-52-佐天涙子" = "うーん……"
"2601103-53-佐天涙子" = "どうしよう……"
"2601103-54" = "[s] 止めに入る。"
"2601103-55-佐天涙子" = "……あっ。"
"2601103-56-佐天涙子" = "あたしは大丈夫です。嫌とかではなくて、むしろ……"
"2601103-60-佐天涙子" = "せっかくですし、打たせてもらっていいですか？"
"2601103-61-商人A" = "おお！本当か！！助かったよ、お嬢さん！！"
"2601103-67-商人B" = "よし、早く牌を混ぜるぞ！待たせるわけにはいかないだろう！"
"2601103-68-商人C" = "あい、分かった分かった。#nお嬢さん、あまり緊張せんでもいいぞ？"
"2601103-72-佐天涙子" = "……ふーん？"
"2601103-73-佐天涙子" = "舐められたもんですね。"
"2601103-74-佐天涙子" = "ふっふっふ……その言葉、後悔させてあげますよ！"
"2601103-75-商人B" = "……！よし、そうこなくっちゃな！！"
"2601103-76-商人A" = "おし、始めようじゃないか！"
"2601103-78" = "（市場の一角で、佐天と商人の対局が始まる）"
"2601103-79" = "（……意外にも白熱し、気づけば半荘4戦目に突入していた）"
"2601103-90-佐天涙子" = "……ツモ！！"
"2601103-91-佐天涙子" = "リーヅモピンフ、ジュンチャンサンショクダブドラ……ドラドラ！"
"2601103-92-佐天涙子" = "親の[ruby=サンバイマン]三倍満[/ruby]で12000ALL！"
"2601103-93-佐天涙子" = "よっし！あたしのトップで終局ですね！"
"2601103-94-佐天涙子" = "さ、早く混ぜて次に行きましょ！"
"2601103-95-商人A" = "お、お嬢さん……そろそろ私たちは……"
"2601103-96-商人C" = "あ、あぁ。もともと、最後に軽く半荘を流そうと思ってただけでな……"
"2601103-97-商人B" = "こ、これ以上は体力が……年には勝てんくて……"
"2601103-98-佐天涙子" = "そんな……！楽しくなってきたところだったのに、やめちゃうんですか！？"
"2601103-99-佐天涙子" = "まだまだ勝負はこれからですよ！"
"2601103-100-商人B" = "うう……"
"2601103-101-商人A" = "だ、誰か……"
"2601103-105" = "[ns] \"……。\""
"2601103-107" = "[ns] 佐天を連れ出す。"
"2601103-109" = "（時間を理由に、佐天を連れて行く）"
"2601103-110" = "（……帰り際に振り返ると、商人たちが感謝の眼差しを送ってきた）"
