[translation]
"1012209-1" = "もう、大丈夫"
"1012209-4-ミカ" = "……あ、先生。"
"1012209-5" = "[s] \"おはよう。\""
"1012209-9-ミカ" = "なんだか恥ずかしくなってきちゃったな……。"
"1012209-10-ミカ" = "あ、あそこ座ろ！？"
"1012209-15" = "（浜辺に座ると、ミカはごそごそと弁当を取り出した）"
"1012209-19-ミカ" = "サンドイッチを作ってみたんだけど……。"
"1012209-20-ミカ" = "味も……いや……うん、大丈夫だと思うよ！"
"1012209-21-ミカ" = "あ、開けるね……？"
"1012209-22" = "[s] \"さて、ミカのサンドイッチは……！\""
"1012209-23-ミカ" = "えいっ！！"
"1012209-28-ミカ" = "大切なのは味って言うでしょ？……言うよね？"
"1012209-29-ミカ" = "きっと美味しいから――"
"1012209-30-ミカ" = "……。"
"1012209-31-ミカ" = "れ、レシピ通りにやってみたんだよ……？"
"1012209-32" = "[ns] \"ミカの頑張りが伝わってくるよ。\""
"1012209-33-ミカ" = "えへへ……食べてみて！"
"1012209-37" = "（サンドイッチを一つ取った）"
"1012209-40" = "[ns] \"いただきます！\""
"1012209-42-ミカ" = "じゃ、私も……。"
"1012209-46" = "[ns] \"ちょっと、個性的な味かも……。\""
"1012209-47-ミカ" = "……。"
"1012209-48-ミカ" = "あれっ？"
"1012209-49-ミカ" = "な、なんで……？ちゃんとレシピ通りにやったんだよ……？"
"1012209-50-ミカ" = "マヨネーズがないから、オイスターソースを入れたり――"
"1012209-51-ミカ" = "ピクルスは苦手だから、ちょっとだけにして――"
"1012209-52-ミカ" = "夏は塩分が不足しがちって聞いたから、お塩をたくさん入れて、あとお砂糖も多めに……。"
"1012209-53" = "[s] \"これは……ミカのオリジナルレシピだね！\""
"1012209-54-ミカ" = "だ、だって～！絶対美味しくなるって思ったんだも～ん！"
"1012209-59-ミカ" = "せ、先生！？美味しくないなら無理に食べなくても……！"
"1012209-60-ミカ" = "え？"
"1012209-61-ミカ" = "真心が感じられて、美味しい……？"
"1012209-62-ミカ" = "うぅぅ……。"
"1012209-63-ミカ" = "ごめんね……美味しいサンドイッチになるはずだったんだけど……。"
"1012209-64" = "[s] \"その気持ちが嬉しいんだよ。ありがとう、ミカ。\""
"1012209-65-ミカ" = "……えへへ。"
"1012209-66-ミカ" = "ありがと、先生。"
"1012209-70-ミカ" = "あれ、私……。"
"1012209-71-ミカ" = "ちょっとだけ……変わったかも？"
"1012209-72-ミカ" = "前は失敗しちゃったら、悔しくてずっと落ち込んでたのに――"
"1012209-73-ミカ" = "今は……そんなじゃないかも……？"
"1012209-74-ミカ" = "次は美味しく作ろう！って……思ってる。"
"1012209-75" = "[s] \"ちょっとだけ前向きになったね。\""
"1012209-76-ミカ" = "そ、そうかな？"
"1012209-77-ミカ" = "いつも先生が一緒にいてくれるから、かもね。"
"1012209-78-ミカ" = "サンドイッチも美味しく食べてくれたし、えへへ。"
"1012209-79-ミカ" = "……。"
"1012209-80-ミカ" = "ちょっと思ったんだ。すっごく素敵で完璧な、良い子じゃなくてもいいのかなって……。"
"1012209-81-ミカ" = "いつも不器用で、失敗して、今回も手が傷だらけになっちゃったけど……。"
"1012209-82-ミカ" = "それでもいい……んだよね？"
"1012209-85" = "[ns1] \"もちろん。\"\n[ns2] \"大丈夫に決まってるよ。\""
"1012209-91-ミカ" = "……うんっ！！"
"1012209-92-ミカ" = "これからもずっと、ずっと――"
"1012209-93-ミカ" = "よろしくね、先生。"
