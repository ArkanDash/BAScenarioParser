[translation]
"1012202-1" = "私も知らない私"
"1012202-3-ミカ" = "先生、こんにちは！"
"1012202-4-ミカ" = "ここで何してたの？"
"1012202-5-ミカ" = "そっか、お散歩してたんだ。見て回ってどうだった？"
"1012202-6" = "[s] \"素敵なところだね。\""
"1012202-7-ミカ" = "えへへ、そう思ってもらえてるならよかった。"
"1012202-8-ミカ" = "え？ティーパーティー所有の他の土地？"
"1012202-9-ミカ" = "ん～私は詳しくないけど……。"
"1012202-10-ミカ" = "結構あるんじゃないかな？#n他の人なら詳しいと思うよ。"
"1012202-11-ミカ" = "えへへ、私たちの意外な一面……だったりした？"
"1012202-12-ミカ" = "ねえねえ、びっくりした？"
"1012202-13" = "[s] \"そうだね、驚かされたよ。\""
"1012202-14-ミカ" = "先生は、お仕事してるティーパーティーを見ることが多いもんね。"
"1012202-16" = "（ミカとティーパーティーメンバーのいろいろな一面について話し合った）"
"1012202-18-ミカ" = "……そういうのが、その子の[ruby=す]素[/ruby]ってやつじゃない？"
"1012202-19-ミカ" = "仲良くなるほど、お外向けじゃない顔が見えてくる……みたいな？"
"1012202-20" = "[s] \"ミカは、みんなの素顔も知ってるんだよね？\""
"1012202-21-ミカ" = "もっちろん☆付き合いも長いからね。"
"1012202-22-ミカ" = "だから、いつもと様子が違うな～ってときは、すぐわかるんだよ？"
"1012202-23-ミカ" = "最近、ちょっと元気なさそう……とかね。"
"1012202-24-ミカ" = "だから、みんなにもバカンスで息抜きしてほしいなって思って！"
"1012202-25-ミカ" = "……上手くできてるかは、分からないけど。"
"1012202-26" = "[s] \"いい気分転換になってるんじゃないかな。\""
"1012202-27-ミカ" = "そうだったらいいな♪"
"1012202-28-ミカ" = "まあ、私はみんなと違って、素も何もないんだけど……。"
"1012202-29-ミカ" = "だって、私は私でしょ？"
"1012202-30-ミカ" = "怒られるようなことばっかりする問題児……。"
"1012202-31-ミカ" = "今回もトラブルを起こしちゃうし……。"
"1012202-32-ミカ" = "あはは、なんか悲しくなっちゃった。"
"1012202-33-ミカ" = "ま、まぁ……裏表がないって意味ではいいんだろうけど。"
"1012202-34" = "[s] \"私は他のミカも知ってるよ。\""
"1012202-35-ミカ" = "……えっ！？"
"1012202-36" = "[s] \"友達のことをよく見てるでしょ？\""
"1012202-37-ミカ" = "そ、そうかな……？"
"1012202-38-ミカ" = "よくわかんないけど……。"
"1012202-39-ミカ" = "今回、特にそう感じた……？"
"1012202-43-ミカ" = "ふふ、おだてても何も出ないよ？"
"1012202-44-ミカ" = "私、いい子じゃないし……。"
"1012202-45" = "[ns1] \"まだ、ミカが知らないだけで……。\"\n[ns2] \"良いところがたくさんあるんだよ？\""
"1012202-49-ミカ" = "こ、困っちゃうなあ……そんな真剣に言われると……。"
"1012202-50-ミカ" = "……。"
"1012202-53-ミカ" = " 私も知らない私を、見つけてくれてるみたいで……なんだか……。"
"1012202-54-ミカ" = "……で、でも、先生の言う通りかも。"
"1012202-55-ミカ" = "自分で気づいていないだけで、良いところがたくさんあるのかもしれないし！"
"1012202-56-ミカ" = "魅力爆発して人気者になったらどうしよう！#n……なんちゃって☆"
"1012202-58" = "（やけにテンションが高いミカと、いろんな話をした）"
