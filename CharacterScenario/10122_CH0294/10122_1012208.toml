[translation]
"1012208-1" = "いつかの私へ"
"1012208-2" = "[ns] \"この辺りかな……。\""
"1012208-4-ミカ" = "先生～こっちこっち！"
"1012208-5-ミカ" = "あはは、急だったのにありがとう！"
"1012208-6-ミカ" = "どうしても、見てほしかったんだ……。"
"1012208-7" = "[s] \"すごく気になってきたよ。\""
"1012208-8-ミカ" = "ちょっと歩くけど、平気かな。"
"1012208-9-ミカ" = "ここから少し離れてるんだよね。"
"1012208-10-ミカ" = "夜の散歩、好き？"
"1012208-11-ミカ" = "へへ、よかった。"
"1012208-12-ミカ" = "じゃ……。"
"1012208-17-ミカ" = "行こっか。"
"1012208-19" = "（そうして、ミカと一緒に夜の浜辺を散歩した）"
"1012208-22-ミカ" = "あ、そういえば……。"
"1012208-23-ミカ" = "……。"
"1012208-24-ミカ" = "この前は迷惑かけちゃってごめんね。"
"1012208-25" = "[s] \"うん？\""
"1012208-26-ミカ" = "私、寝ちゃったでしょ？#nそれでその……部屋までおんぶ……してもらっちゃって……。"
"1012208-27" = "[s1] \"気にしないで。ちょっと大変だったけど。\"\n[s2] \"羽みたいに軽かったよ。大丈夫。\""
"1012208-28-ミカ" = "えっ、嘘！"
"1012208-29-ミカ" = "重かっ……たかな……？"
"1012208-30-ミカ" = "え、冗談？"
"1012208-31-ミカ" = "も～バカバカ！信じちゃったじゃん！"
"1012208-32-ミカ" = "……まあ、寝た私が悪いんだけど。"
"1012208-33-ミカ" = "えっ、ほ、ほんとに？"
"1012208-34-ミカ" = "そ、そっか。軽かったなら、いいけど……。"
"1012208-35-ミカ" = "あ、いや……そうじゃなくて……。"
"1012208-36-ミカ" = "はぁ……ごめんね。"
"1012208-37-ミカ" = "また先生に、迷惑かけちゃった。"
"1012208-38-ミカ" = "許してくれるの……？#nえ……もう大人の真似をしないなら？"
"1012208-39-ミカ" = "はい……もうしません。"
"1012208-40-ミカ" = "無理にあんなことしなくても――"
"1012208-41-ミカ" = "素直に話せばいいって、教えてもらったからね。"
"1012208-42" = "[ns] \"もうすっきりした？\""
"1012208-44-ミカ" = "うーん、どうなんだろ……？"
"1012208-45-ミカ" = "あの後もずっと考えてるけど……。"
"1012208-49-ミカ" = "あ、もう着くよ。"
"1012208-50-ミカ" = "すぐそこだから。"
"1012208-51-ミカ" = "こっちこっち……！"
"1012208-57" = "[ns] \"すごい……！！\""
"1012208-58-ミカ" = "でしょ～？"
"1012208-59-ミカ" = "一人で散歩してたら、たまたま見つけちゃったの！"
"1012208-60-ミカ" = "すっごい景色だよね☆"
"1012208-61-ミカ" = "ふふっ、先生にも見てもらえてよかった。"
"1012208-62-ミカ" = "早く！ここ座って座って！"
"1012208-70-ミカ" = "はぁ……。"
"1012208-71-ミカ" = "こうしてると、悩み事もどこか飛んでいっちゃうね。"
"1012208-72-ミカ" = "あ……。"
"1012208-73-ミカ" = "せ、先生！あっち……！"
"1012208-74" = "[ns] \"あれは……！？\""
"1012208-79-ミカ" = "うわあ……流れ星があんなに……。"
"1012208-80-ミカ" = "本当に、綺麗……。"
"1012208-81" = "[ns] \"ありがとね、ミカ。\""
"1012208-82-ミカ" = "えっ？？"
"1012208-83" = "[ns3] \"ミカのおかげで――\"\n[ns4] \"こんなに素敵な景色が見られたから。\""
"1012208-86-ミカ" = "……。"
"1012208-89" = "[wa:860]― [log=미카 수영복]ねぇ、[wa:570]先生。[/log]"
"1012208-91" = "― [log=미카 수영복]私……[wa:2620]この景色を[wa:1030]先生と[wa:680]見られて[wa:1980]よかった。[/log]"
"1012208-94" = "[wa:2060]― [log=미카 수영복]心配事も――[/log]"
"1012208-96" = "― [log=미카 수영복]将来の悩みも――[wa:80] [/log]"
"1012208-99" = "― [log=미카 수영복]不安も――[wa:2250]まだ、[wa:1630]残ってる。[/log]"
"1012208-102" = "[wa:550]― [log=미카 수영복]でも……。[/log]"
"1012208-104" = "― [log=미카 수영복]こんな星空を[wa:1090]見ちゃったらさ。[/log]"
"1012208-107" = "― [log=미카 수영복]……全部、[wa:1630]ちっぽけな[wa:720]ことなんじゃないかな[wa:1610]って。[/log]"
"1012208-109" = "― [log=미카 수영복]そんな気がするんだ。[/log]"
"1012208-112" = "[wa:920]― [log=미카 수영복]先生、[wa:1400]言ってくれたよね。[/log]"
"1012208-115" = "― [log=미카 수영복]今、[wa:1850]この瞬間が、[wa:3560]これからも[wa:1000]ずっ[wa:1030]と……。[/log]"
"1012208-117" = "― [log=미카 수영복]私を支えてくれる、[wa:2230]って。[/log]"
"1012208-120" = "[wa:530]― [log=미카 수영복]だから……。[/log]"
"1012208-122" = "― [log=미카 수영복]私も、[wa:2930]幸せになるよ。[/log]"
"1012208-126-ミカ" = "……。"
"1012208-127-ミカ" = "い、言っちゃったよお～……。"
"1012208-128" = "[ns] \"ミカは、幸せになれるよ。\""
"1012208-132" = "[ns] \"そう信じてる。\""
"1012208-133-ミカ" = "そ、そんな……。"
"1012208-134-ミカ" = "先生……すぐ恥ずかしいこと言うんだから……。"
"1012208-139-ミカ" = "ありがとね。"
"1012208-140-ミカ" = "私、幸せになるよ。"
"1012208-141-ミカ" = "だから、手伝ってくれると……嬉しいな？"
"1012208-142" = "[s5] \"うん、もちろん。\"\n[s6] \"ずっと、いつだって見守ってるよ。\""
"1012208-145-ミカ" = "あはは、また真顔でそんなこと言って☆"
"1012208-146-ミカ" = "……。"
"1012208-150-ミカ" = "先生は、ちょっと変なとこもあるけど……優しいよね。"
"1012208-154-ミカ" = "ああ～、先生と来れてよかった。"
"1012208-159-ミカ" = "ずっとここにいたら、悪い子になっちゃうし……。"
"1012208-160-ミカ" = "そろそろ行こっか☆"
"1012208-164" = "[ns] \"ん？今なんて……。\""
"1012208-165-ミカ" = "あははっ、早く帰ろ☆"
"1012208-167" = "（ミカと一緒に浜辺を歩いて帰った）"
"1012208-173" = "（帰り道も、ミカはずっと笑顔ではしゃいでいて――）"
"1012208-174" = "（少しだけ、幸せそうに見えた）"
